<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GPT 5.6 Codex</title>
<style>
:root{--ink:#17211d;--paper:#ece9df;--acid:#dfff00;--line:#9d9b91;--red:#d64b32}*{box-sizing:border-box}body{margin:0;background:#d7d4ca;color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:14px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:9px}.brand{font-size:16px;font-weight:900;letter-spacing:.14em}.brand i{display:inline-block;width:10px;height:10px;background:var(--acid);border:1px solid var(--ink);margin-right:9px}.runid{font:11px monospace;color:#555}.stage{position:relative;min-height:0;background:var(--paper);border:1px solid var(--ink);box-shadow:4px 4px 0 #888;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:16px;top:16px;display:flex;gap:1px;pointer-events:none}.meter{background:rgba(23,33,29,.91);color:#fff;padding:8px 11px;min-width:104px}.meter span{display:block;font:9px monospace;letter-spacing:.12em;color:#b9beb9;margin-bottom:3px}.meter strong{font:700 17px monospace}.status{position:absolute;right:16px;top:16px;background:var(--acid);border:1px solid var(--ink);font:700 10px monospace;letter-spacing:.1em;padding:7px 9px}.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:18px}.controls{display:flex;gap:8px}button{height:44px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0 20px;font:800 12px Arial;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:2px 2px 0 #777}button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 #777}button:active{transform:translate(1px,1px);box-shadow:none}#test{background:var(--acid);min-width:130px}.settings{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}.field label{display:flex;justify-content:space-between;font:700 9px monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.field output{color:#555}.field input{width:100%;accent-color:var(--ink)}.note{text-align:right;font:10px/1.4 monospace;color:#555;min-width:130px}@media(max-width:850px){.shell{padding:8px}.bottom{grid-template-columns:1fr auto}.settings{grid-column:1/-1;grid-row:1;grid-template-columns:repeat(5,1fr)}.field label{display:block}.field output{display:block}.note{display:none}.hud{left:8px;top:8px}.meter{min-width:82px;padding:6px}.meter strong{font-size:14px}}@media(max-width:600px){.settings{grid-template-columns:repeat(3,1fr)}.hud .meter:nth-child(3){display:none}.top .runid{display:none}}
</style>
</head>
<body>
<main class="shell"><header class="top"><div class="brand"><i></i>GPT 5.6 CODEX</div><div class="runid">RIGID BODY IMPACT LAB / EXP-01</div></header>
<section class="stage"><canvas id="c"></canvas><div class="hud"><div class="meter"><span>VELOCITY</span><strong id="vel">0.0 m/s</strong></div><div class="meter"><span>ELAPSED</span><strong id="time">0.00 s</strong></div><div class="meter"><span>MOVING BRICKS</span><strong id="moving">0</strong></div></div><div class="status" id="status">READY</div></section>
<footer class="bottom"><div class="controls"><button id="test">Test →</button><button id="reset">Reset</button></div><div class="settings">
<div class="field"><label>Car speed <output id="speedO">22 m/s</output></label><input id="speed" type="range" min="5" max="45" step="1" value="22"></div>
<div class="field"><label>Columns <output id="colsO">12</output></label><input id="cols" type="range" min="4" max="24" step="1" value="12"></div>
<div class="field"><label>Rows <output id="rowsO">8</output></label><input id="rows" type="range" min="3" max="16" step="1" value="8"></div>
<div class="field"><label>Depth <output id="depthO">2 layers</output></label><input id="depth" type="range" min="1" max="5" step="1" value="2"></div>
<div class="field"><label>Brick mass <output id="massO">2.5 kg</output></label><input id="mass" type="range" min="0.5" max="12" step="0.5" value="2.5"></div>
</div><div class="note">80 PX / M<br>g 9.81 M/S²</div></footer></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2),PPM=80,G=9.81;
const ui={vel:vel,time:time,moving:moving,status:status};let W,H,ground,camX=0,shake=0,running=false,elapsed=0,last=0,acc=0,bricks=[],particles=[],skids=[],car;
const params=()=>({speed:+speed.value,cols:+cols.value,rows:+rows.value,depth:+depth.value,mass:+mass.value});
for(const id of ['speed','cols','rows','depth','mass'])document.getElementById(id).addEventListener('input',()=>{speedO.value=speed.value+' m/s';colsO.value=cols.value;rowsO.value=rows.value;depthO.value=depth.value+' layer'+(depth.value==='1'?'':'s');massO.value=mass.value+' kg';if(!running)resetScene()});
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ground=H*.79;resetScene()}
class Body{constructor(x,y,w,h,m,layer=0){Object.assign(this,{x,y,w,h,m,layer,vx:0,vy:0,a:0,av:0,rest:.18,fric:.72,sleep:false,still:0});this.inv=1/m;this.I=m*(w*w+h*h)/12;this.invI=1/this.I} verts(){let c=Math.cos(this.a),s=Math.sin(this.a),hw=this.w/2,hh=this.h/2;return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>({x:this.x+x*c-y*s,y:this.y+x*s+y*c}))}}
function resetScene(){running=false;elapsed=acc=0;particles=[];skids=[];const p=params(),trackM=Math.max(15,p.cols*.5+9);camX=0;let wallX=Math.max(9.5,trackM-4-p.cols*.25);car={x:1.6,y:0,w:4.2,h:1.45,m:1250,vx:0,vy:0,a:0,av:0,impact:false};bricks=[];for(let l=0;l<p.depth;l++)for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++){let stagger=(r%2)*.25-.125;let b=new Body(wallX+c*.5+stagger+l*.035,ground/PPM-(r+.5)*.24,.49,.232,p.mass,l);b.a=(l-(p.depth-1)/2)*.001;bricks.push(b)}ui.status.textContent='READY';updateHUD()}
function launch(){resetScene();car.vx=params().speed;running=true;last=performance.now();ui.status.textContent='RUNNING'}
function axes(v){let out=[];for(let i=0;i<2;i++){let e={x:v[i+1].x-v[i].x,y:v[i+1].y-v[i].y},L=Math.hypot(e.x,e.y);out.push({x:-e.y/L,y:e.x/L})}return out}
function project(v,a){let mn=1e9,mx=-1e9;for(const p of v){let d=p.x*a.x+p.y*a.y;mn=Math.min(mn,d);mx=Math.max(mx,d)}return [mn,mx]}
function sat(A,B){let av=A.verts(),bv=B.verts(),best=1e9,n;for(const ax of [...axes(av),...axes(bv)]){let pa=project(av,ax),pb=project(bv,ax),o=Math.min(pa[1],pb[1])-Math.max(pa[0],pb[0]);if(o<=0)return null;if(o<best){best=o;n=ax}}if((B.x-A.x)*n.x+(B.y-A.y)*n.y<0)n={x:-n.x,y:-n.y};let cp={x:(A.x+B.x)/2,y:(A.y+B.y)/2};return {n,depth:best,cp}}
function impulse(A,B,c){let nx=c.n.x,ny=c.n.y,ra={x:c.cp.x-A.x,y:c.cp.y-A.y},rb={x:c.cp.x-B.x,y:c.cp.y-B.y};let rvx=B.vx-B.av*rb.y-(A.vx-A.av*ra.y),rvy=B.vy+B.av*rb.x-(A.vy+A.av*ra.x),vn=rvx*nx+rvy*ny;if(vn>0)return;let rac=ra.x*ny-ra.y*nx,rbc=rb.x*ny-rb.y*nx,den=A.inv+B.inv+rac*rac*A.invI+rbc*rbc*B.invI,j=-(1+Math.min(A.rest,B.rest))*vn/den,ix=j*nx,iy=j*ny;A.vx-=ix*A.inv;A.vy-=iy*A.inv;A.av-=rac*j*A.invI;B.vx+=ix*B.inv;B.vy+=iy*B.inv;B.av+=rbc*j*B.invI;rvx=B.vx-B.av*rb.y-(A.vx-A.av*ra.y);rvy=B.vy+B.av*rb.x-(A.vy+A.av*ra.x);let tx=rvx-(rvx*nx+rvy*ny)*nx,ty=rvy-(rvx*nx+rvy*ny)*ny,L=Math.hypot(tx,ty);if(L){tx/=L;ty/=L;let jt=-(rvx*tx+rvy*ty)/den,mu=Math.sqrt(A.fric*B.fric),lim=j*mu;jt=Math.max(-lim,Math.min(lim,jt));A.vx-=jt*tx*A.inv;A.vy-=jt*ty*A.inv;B.vx+=jt*tx*B.inv;B.vy+=jt*ty*B.inv}let corr=Math.max(c.depth-.002,0)/den*.55;A.x-=corr*nx*A.inv;A.y-=corr*ny*A.inv;B.x+=corr*nx*B.inv;B.y+=corr*ny*B.inv}
function carBody(){let b=new Body(car.x,car.y,car.w*.88,car.h*.62,car.m);b.vx=car.vx;b.vy=car.vy;b.a=car.a;b.av=car.av;b.rest=.08;b.fric=.8;return b}
function step(dt){elapsed+=dt;let p=params();car.y=ground/PPM-car.h*.31;if(car.vx!==0){let drag=.85*G*dt;car.vx=Math.sign(car.vx)*Math.max(0,Math.abs(car.vx)-drag);if(running)skids.push({x:car.x-1.45,t:1})}for(const b of bricks){if(!b.sleep){b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.av*dt;b.vx*=.999;b.av*=.998}}
let cb=carBody();for(const b of bricks){let c=sat(cb,b);if(c){let before=car.vx;impulse(cb,b,c);car.vx=cb.vx;car.av=cb.av;car.a=Math.max(-.12,Math.min(.12,car.a+cb.av*dt));if(!car.impact&&before-car.vx>.3){car.impact=true;shake=10;ui.status.textContent='IMPACT';for(let i=0;i<45;i++)particles.push({x:b.x,y:b.y,vx:-2+(i*37%61)/10,vy:-1-(i*19%43)/12,t:.5+(i%9)/20})}}}
let hash=new Map(),cell=.65;for(let i=0;i<bricks.length;i++){let b=bricks[i],key=Math.floor(b.x/cell)+','+Math.floor(b.y/cell);if(!hash.has(key))hash.set(key,[]);hash.get(key).push(i)}for(let iter=0;iter<3;iter++)for(let i=0;i<bricks.length;i++){let A=bricks[i],cx=Math.floor(A.x/cell),cy=Math.floor(A.y/cell);for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++)for(const j of hash.get((cx+ox)+','+(cy+oy))||[])if(j>i){let B=bricks[j];if(A.layer!==B.layer&&Math.abs(A.layer-B.layer)>1)continue;let c=sat(A,B);if(c)impulse(A,B,c)}}
let floorY=ground/PPM;for(const b of bricks){let vs=b.verts(),max=Math.max(...vs.map(v=>v.y));if(max>floorY){b.y-=max-floorY;b.vy=Math.min(0,-b.vy*b.rest);b.vx*=Math.max(0,1-b.fric*G*dt*2);b.av*=.82;if(Math.hypot(b.vx,b.vy)+Math.abs(b.av)<.07)b.still+=dt;else b.still=0;b.sleep=b.still>1.5}if(b.y>floorY+3)b.sleep=true}for(const q of particles){q.vy+=G*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);skids.forEach(s=>s.t-=dt);skids=skids.filter(s=>s.t>0);shake*=.88;updateHUD()}
function updateHUD(){ui.vel.textContent=Math.abs(car?.vx||0).toFixed(1)+' m/s';ui.time.textContent=elapsed.toFixed(2)+' s';ui.moving.textContent=bricks.filter(b=>Math.hypot(b.vx,b.vy)>.12||Math.abs(b.av)>.15).length;if(running&&elapsed>2&&Math.abs(car.vx)<.05&&+ui.moving.textContent===0){running=false;ui.status.textContent='SETTLED'}}
function sx(x){return x*PPM+camX}function sy(y){return y*PPM}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);let shx=shake?Math.sin(elapsed*131)*shake:0,shy=shake?Math.cos(elapsed*97)*shake*.35:0;ctx.translate(shx,shy);let grad=ctx.createLinearGradient(0,0,0,ground);grad.addColorStop(0,'#dfe5df');grad.addColorStop(1,'#f0ede3');ctx.fillStyle=grad;ctx.fillRect(-15,-15,W+30,ground+15);ctx.strokeStyle='#c4c5bc';ctx.lineWidth=1;for(let x=-((camX)%PPM);x<W;x+=PPM)ctx.beginPath(),ctx.moveTo(x,ground-7),ctx.lineTo(x,ground),ctx.stroke();ctx.fillStyle='#393f39';ctx.fillRect(-15,ground,W+30,H-ground+15);ctx.fillStyle='#bbc0b7';ctx.fillRect(-15,ground,W+30,3);for(const s of skids){ctx.globalAlpha=Math.max(0,s.t)*.22;ctx.fillStyle='#111';ctx.fillRect(sx(s.x),ground-3,80,2)}ctx.globalAlpha=1;
for(const b of [...bricks].sort((a,b)=>b.layer-a.layer)){ctx.save();ctx.translate(sx(b.x),sy(b.y));ctx.rotate(b.a);let shade=146-b.layer*10;ctx.fillStyle=`rgb(${shade+52},${shade-30},${shade-50})`;ctx.fillRect(-b.w*PPM/2,-b.h*PPM/2,b.w*PPM,b.h*PPM);ctx.strokeStyle='#522e24';ctx.lineWidth=1;ctx.strokeRect(-b.w*PPM/2,-b.h*PPM/2,b.w*PPM,b.h*PPM);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(-b.w*PPM/2+2,-b.h*PPM/2+2,b.w*PPM-4,2);ctx.restore()}
drawCar();for(const q of particles){ctx.globalAlpha=Math.max(0,q.t);ctx.fillStyle='#a79c82';ctx.beginPath();ctx.arc(sx(q.x),sy(q.y),2+(q.t*3),0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(loop)}
function drawCar(){let x=sx(car.x),y=ground-car.h*PPM*.31;ctx.save();ctx.translate(x,y);ctx.rotate(car.a);let L=car.w*PPM,Hc=car.h*PPM;ctx.fillStyle='#b8ed00';ctx.beginPath();ctx.moveTo(-L*.48,0);ctx.lineTo(-L*.43,-Hc*.42);ctx.lineTo(-L*.18,-Hc*.48);ctx.lineTo(-L*.04,-Hc*.83);ctx.lineTo(L*.22,-Hc*.79);ctx.lineTo(L*.39,-Hc*.49);ctx.lineTo(L*.47,-Hc*.39);ctx.lineTo(L*.49,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#17211d';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#25322f';ctx.beginPath();ctx.moveTo(-L*.01,-Hc*.76);ctx.lineTo(L*.19,-Hc*.72);ctx.lineTo(L*.31,-Hc*.47);ctx.lineTo(-L*.11,-Hc*.47);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L*.46,-Hc*.34);ctx.lineTo(L*.48,-Hc*.18);ctx.stroke();for(const wx of [-L*.29,L*.29]){ctx.fillStyle='#141817';ctx.beginPath();ctx.arc(wx,0,Hc*.17,0,7);ctx.fill();ctx.strokeStyle='#888';ctx.lineWidth=4;ctx.beginPath();ctx.arc(wx,0,Hc*.08,0,7);ctx.stroke()}ctx.restore()}
function loop(t){if(running){let d=Math.min((t-last)/1000,.035);last=t;acc+=d;while(acc>=1/180){step(1/180);acc-=1/180}}draw()}
test.onclick=launch;reset.onclick=resetScene;addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
