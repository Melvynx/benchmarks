<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT-5.5</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050817;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="GPT-5.5 tropical rocket launch animation"></canvas>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d", { alpha: false });
      const TAU = Math.PI * 2;
      const CYCLE = 15.5;
      const stars = [];
      const clouds = [];
      const smoke = [];
      const sparks = [];
      const smokePool = [];
      const sparkPool = [];
      const MAX_SMOKE = 620;
      const MAX_SPARKS = 240;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let lastTime = performance.now();
      let previousCycle = -1;
      let previousPhaseTime = 0;
      let smokeCarry = 0;
      let sparkCarry = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smoothstep(t) {
        t = clamp(t, 0, 1);
        return t * t * (3 - 2 * t);
      }

      function easeInCubic(t) {
        t = clamp(t, 0, 1);
        return t * t * t;
      }

      function easeInQuad(t) {
        t = clamp(t, 0, 1);
        return t * t;
      }

      function easeOutCubic(t) {
        t = clamp(t, 0, 1);
        return 1 - Math.pow(1 - t, 3);
      }

      function seededRandom(seed) {
        const s = Math.sin(seed * 127.1) * 43758.5453123;
        return s - Math.floor(s);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(320, window.innerWidth);
        height = Math.max(360, window.innerHeight);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seedScene();
      }

      function seedScene() {
        stars.length = 0;
        clouds.length = 0;

        const starCount = Math.floor(clamp(width * height / 8500, 55, 160));
        for (let i = 0; i < starCount; i++) {
          const r1 = seededRandom(i + 11);
          const r2 = seededRandom(i + 31);
          stars.push({
            x: r1 * width,
            y: r2 * height * 0.48,
            r: 0.55 + seededRandom(i + 71) * 1.3,
            phase: seededRandom(i + 97) * TAU,
            speed: 0.7 + seededRandom(i + 151) * 1.6
          });
        }

        const cloudCount = Math.max(4, Math.floor(width / 260));
        for (let i = 0; i < cloudCount; i++) {
          clouds.push({
            x: seededRandom(i + 301) * width,
            y: height * (0.19 + seededRandom(i + 401) * 0.25),
            scale: 0.65 + seededRandom(i + 501) * 0.9,
            speed: 4 + seededRandom(i + 601) * 9,
            alpha: 0.16 + seededRandom(i + 701) * 0.13
          });
        }
      }

      function currentRocket(t) {
        const islandTop = height * 0.75;
        const rocketHeight = clamp(height * 0.36, 210, 360);
        const baseY = islandTop - 20;
        const offscreenBase = -rocketHeight * 0.3;
        let y = baseY;
        let scale = 1;
        let visible = true;
        let launching = false;

        if (t < 1.5) {
          y = baseY;
          scale = 1;
        } else if (t < 4) {
          const p = easeInCubic((t - 1.5) / 2.5);
          y = baseY - p * height * 0.34;
          scale = 1 - p * 0.07;
          launching = true;
        } else if (t < 7) {
          const p = easeInQuad((t - 4) / 3);
          y = baseY - height * 0.34 - p * height * 1.12;
          scale = 0.93 - p * 0.27;
          launching = true;
        } else if (t < 12) {
          y = offscreenBase;
          scale = 0.64;
          visible = false;
        } else if (t < 14.45) {
          const p = smoothstep((t - 12) / 2.45);
          y = lerp(offscreenBase, baseY, p);
          scale = lerp(0.66, 1, p);
        } else {
          y = baseY;
          scale = 1;
        }

        return {
          x: width * 0.5,
          y,
          baseY,
          rocketHeight,
          rocketWidth: rocketHeight * 0.155,
          scale,
          visible,
          launching
        };
      }

      function spawnSmoke(x, y, options) {
        if (smoke.length >= MAX_SMOKE) {
          smoke.shift();
        }

        const p = smokePool.pop() || {};
        const angle = options.angle ?? Math.random() * TAU;
        const speed = lerp(options.minSpeed ?? 8, options.maxSpeed ?? 40, Math.random());
        p.x = x;
        p.y = y;
        p.vx = Math.cos(angle) * speed + (options.wind ?? 0);
        p.vy = Math.sin(angle) * speed + (options.lift ?? -8);
        p.age = 0;
        p.life = lerp(options.minLife ?? 2.4, options.maxLife ?? 5.2, Math.random());
        p.radius = lerp(options.minRadius ?? 12, options.maxRadius ?? 34, Math.random());
        p.grow = lerp(options.minGrow ?? 18, options.maxGrow ?? 58, Math.random());
        p.alpha = lerp(options.minAlpha ?? 0.22, options.maxAlpha ?? 0.58, Math.random());
        p.hue = lerp(options.minHue ?? 220, options.maxHue ?? 244, Math.random());
        p.light = lerp(options.minLight ?? 56, options.maxLight ?? 83, Math.random());
        p.rotate = Math.random() * TAU;
        p.spin = lerp(-0.8, 0.8, Math.random());
        p.noise = Math.random() * 1000;
        p.layer = options.layer || "base";
        smoke.push(p);
      }

      function spawnSpark(x, y, intensity) {
        if (sparks.length >= MAX_SPARKS) {
          sparks.shift();
        }

        const p = sparkPool.pop() || {};
        const spread = Math.PI * 0.84;
        const angle = Math.PI * 0.5 + lerp(-spread, spread, Math.random());
        const speed = lerp(45, 190, Math.random()) * intensity;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed + lerp(25, 70, Math.random());
        p.age = 0;
        p.life = lerp(0.38, 1.15, Math.random());
        p.radius = lerp(0.8, 2.2, Math.random());
        p.alpha = lerp(0.55, 0.95, Math.random());
        p.color = Math.random() > 0.45 ? "#ffd36e" : "#ff7b2b";
        sparks.push(p);
      }

      function emitParticles(t, dt, rocket) {
        let baseRate = 0;
        let trailRate = 0;
        let sparkRate = 0;

        if (t < 1.5) {
          baseRate = lerp(18, 92, t / 1.5);
          sparkRate = lerp(6, 28, t / 1.5);
        } else if (t < 4) {
          baseRate = 150;
          trailRate = 100;
          sparkRate = 72;
        } else if (t < 7) {
          const p = (t - 4) / 3;
          baseRate = lerp(70, 8, p);
          trailRate = lerp(130, 40, p);
          sparkRate = lerp(56, 10, p);
        }

        if (baseRate > 0) {
          smokeCarry += baseRate * dt;
          while (smokeCarry >= 1) {
            smokeCarry--;
            const spread = lerp(18, 105, clamp(t / 4, 0, 1));
            const side = Math.random() > 0.5 ? 1 : -1;
            spawnSmoke(rocket.x + side * Math.random() * spread, rocket.baseY + lerp(8, 34, Math.random()), {
              angle: Math.PI + side * lerp(-0.34, 0.34, Math.random()),
              minSpeed: 28,
              maxSpeed: 96,
              lift: lerp(-18, 16, Math.random()),
              wind: width * 0.018,
              minRadius: 18,
              maxRadius: 47,
              minGrow: 32,
              maxGrow: 92,
              minAlpha: 0.24,
              maxAlpha: 0.7,
              minLight: 48,
              maxLight: 82,
              layer: "base"
            });
          }
        }

        if (rocket.visible && trailRate > 0) {
          smokeCarry += trailRate * dt;
          while (smokeCarry >= 1) {
            smokeCarry--;
            const flameLength = rocket.rocketHeight * rocket.scale * 0.2;
            spawnSmoke(rocket.x + lerp(-12, 12, Math.random()) * rocket.scale, rocket.y + flameLength * 0.66, {
              angle: Math.PI * 0.5 + lerp(-0.45, 0.45, Math.random()),
              minSpeed: 22,
              maxSpeed: 74,
              lift: 30,
              wind: width * 0.012,
              minRadius: 8,
              maxRadius: 25,
              minGrow: 22,
              maxGrow: 62,
              minAlpha: 0.18,
              maxAlpha: 0.5,
              minLight: 54,
              maxLight: 88,
              layer: "trail"
            });
          }
        }

        if (rocket.visible && sparkRate > 0) {
          sparkCarry += sparkRate * dt;
          while (sparkCarry >= 1) {
            sparkCarry--;
            spawnSpark(rocket.x + lerp(-12, 12, Math.random()) * rocket.scale, rocket.y + 8, t < 1.5 ? 0.5 : 1);
          }
        }
      }

      function updateParticles(dt) {
        for (let i = smoke.length - 1; i >= 0; i--) {
          const p = smoke[i];
          p.age += dt;
          if (p.age >= p.life) {
            smokePool.push(p);
            smoke.splice(i, 1);
            continue;
          }
          const drift = Math.sin(p.age * 1.8 + p.noise) * 8;
          p.x += (p.vx + drift) * dt;
          p.y += p.vy * dt;
          p.vx *= 0.992;
          p.vy *= 0.988;
          p.vy -= 3 * dt;
          p.rotate += p.spin * dt;
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i];
          p.age += dt;
          if (p.age >= p.life) {
            sparkPool.push(p);
            sparks.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 90 * dt;
          p.vx *= 0.988;
        }
      }

      function drawSky(t) {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#050816");
        gradient.addColorStop(0.24, "#10264b");
        gradient.addColorStop(0.58, "#315a86");
        gradient.addColorStop(0.82, "#f08b64");
        gradient.addColorStop(1, "#ffd39a");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const star of stars) {
          const twinkle = 0.55 + Math.sin(t * star.speed + star.phase) * 0.35;
          ctx.globalAlpha = clamp(twinkle, 0.18, 0.95);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r * (0.85 + twinkle * 0.25), 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        drawClouds(t);
        drawModelTitle();
      }

      function drawModelTitle() {
        ctx.save();
        ctx.globalAlpha = 0.58;
        ctx.fillStyle = "#f8fbff";
        ctx.font = `600 ${clamp(width * 0.018, 16, 28)}px system-ui, sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("GPT-5.5", 22, 18);
        ctx.restore();
      }

      function drawCloud(x, y, scale, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, 110);
        grad.addColorStop(0, "rgba(255,255,255,0.95)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = grad;
        const lobes = [
          [-58, 12, 34],
          [-22, -8, 44],
          [24, -4, 38],
          [58, 14, 28],
          [0, 19, 56]
        ];
        for (const lobe of lobes) {
          ctx.beginPath();
          ctx.arc(lobe[0], lobe[1], lobe[2], 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawClouds(t) {
        for (const cloud of clouds) {
          const x = ((cloud.x + t * cloud.speed) % (width + 260)) - 130;
          drawCloud(x, cloud.y, cloud.scale, cloud.alpha);
        }
      }

      function drawOcean(t, launchEnergy) {
        const seaTop = height * 0.74;
        const gradient = ctx.createLinearGradient(0, seaTop, 0, height);
        gradient.addColorStop(0, "#143a67");
        gradient.addColorStop(0.5, "#0b274b");
        gradient.addColorStop(1, "#07172e");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, seaTop, width, height - seaTop);

        ctx.save();
        ctx.lineWidth = 1.2;
        for (let layer = 0; layer < 5; layer++) {
          const y = seaTop + 18 + layer * 24;
          const amp = 2 + layer * 0.8 + launchEnergy * (layer < 2 ? 3.5 : 1.2);
          ctx.beginPath();
          for (let x = -20; x <= width + 20; x += 10) {
            const wave = Math.sin(x * 0.025 + t * (1.2 + layer * 0.22)) * amp +
              Math.sin(x * 0.011 - t * 0.9) * amp * 0.55;
            if (x === -20) ctx.moveTo(x, y + wave);
            else ctx.lineTo(x, y + wave);
          }
          ctx.strokeStyle = layer % 2
            ? "rgba(92, 178, 213, 0.18)"
            : "rgba(255, 215, 172, 0.16)";
          ctx.stroke();
        }

        if (launchEnergy > 0.02) {
          ctx.globalAlpha = launchEnergy * 0.32;
          ctx.strokeStyle = "#ffd191";
          ctx.lineWidth = 1.8;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.ellipse(width * 0.5, seaTop + 34 + i * 13, 90 + i * 45 + Math.sin(t * 4 + i) * 8, 8 + i * 4, 0, 0, TAU);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawSmokeLayer(layer) {
        ctx.save();
        for (const p of smoke) {
          if (p.layer !== layer) continue;
          const life = p.age / p.life;
          const alpha = p.alpha * Math.sin((1 - life) * Math.PI * 0.5) * (1 - life * 0.22);
          const radius = p.radius + p.grow * easeOutCubic(life);
          const grad = ctx.createRadialGradient(p.x - radius * 0.25, p.y - radius * 0.3, radius * 0.12, p.x, p.y, radius);
          grad.addColorStop(0, `hsla(${p.hue}, 16%, ${Math.min(92, p.light + 12)}%, ${alpha})`);
          grad.addColorStop(0.48, `hsla(${p.hue}, 12%, ${p.light}%, ${alpha * 0.7})`);
          grad.addColorStop(1, `hsla(${p.hue}, 10%, ${Math.max(34, p.light - 20)}%, 0)`);
          ctx.fillStyle = grad;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotate);
          ctx.scale(1 + Math.sin(p.noise) * 0.16, 0.76 + Math.cos(p.noise) * 0.16);
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawSparks() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const p of sparks) {
          const life = p.age / p.life;
          ctx.globalAlpha = p.alpha * (1 - life);
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.radius;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawIsland(t) {
        const cx = width * 0.5;
        const seaTop = height * 0.74;
        const islandW = clamp(width * 0.5, 360, 720);
        const islandH = clamp(height * 0.14, 62, 118);
        const beachY = seaTop + islandH * 0.34;

        ctx.save();
        ctx.fillStyle = "rgba(3, 8, 16, 0.22)";
        ctx.beginPath();
        ctx.ellipse(cx, beachY + islandH * 0.55, islandW * 0.48, islandH * 0.34, 0, 0, TAU);
        ctx.fill();

        const sand = ctx.createLinearGradient(0, seaTop, 0, beachY + islandH);
        sand.addColorStop(0, "#e7be6e");
        sand.addColorStop(0.68, "#c98743");
        sand.addColorStop(1, "#8b552c");
        ctx.fillStyle = sand;
        ctx.beginPath();
        ctx.ellipse(cx, beachY, islandW * 0.46, islandH * 0.48, 0, Math.PI, 0);
        ctx.lineTo(cx + islandW * 0.42, beachY + islandH * 0.28);
        ctx.quadraticCurveTo(cx, beachY + islandH * 0.58, cx - islandW * 0.42, beachY + islandH * 0.28);
        ctx.closePath();
        ctx.fill();

        const green = ctx.createLinearGradient(0, seaTop - islandH, 0, beachY);
        green.addColorStop(0, "#4f9b3a");
        green.addColorStop(0.55, "#1f6f38");
        green.addColorStop(1, "#0f442d");
        ctx.fillStyle = green;
        ctx.beginPath();
        ctx.moveTo(cx - islandW * 0.34, seaTop + 10);
        ctx.bezierCurveTo(cx - islandW * 0.22, seaTop - islandH * 0.38, cx - islandW * 0.07, seaTop - islandH * 0.2, cx + islandW * 0.05, seaTop - islandH * 0.34);
        ctx.bezierCurveTo(cx + islandW * 0.2, seaTop - islandH * 0.5, cx + islandW * 0.32, seaTop - islandH * 0.1, cx + islandW * 0.37, seaTop + 8);
        ctx.quadraticCurveTo(cx, seaTop + islandH * 0.08, cx - islandW * 0.34, seaTop + 10);
        ctx.fill();

        for (let i = 0; i < 16; i++) {
          const x = cx - islandW * 0.28 + seededRandom(i + 901) * islandW * 0.56;
          const y = seaTop - 10 + seededRandom(i + 921) * 22;
          ctx.fillStyle = i % 3 ? "#2c8a43" : "#8ec456";
          ctx.beginPath();
          ctx.ellipse(x, y, 16 + seededRandom(i + 941) * 26, 7 + seededRandom(i + 961) * 10, seededRandom(i + 981) * Math.PI, 0, TAU);
          ctx.fill();
        }

        drawPalm(cx - islandW * 0.33, seaTop + 4, -0.32, 0.8, t);
        drawPalm(cx + islandW * 0.3, seaTop + 2, 0.24, 0.9, t + 1.7);
        drawPalm(cx - islandW * 0.2, seaTop - 4, -0.12, 0.64, t + 3.1);
        drawLaunchPad(cx, seaTop - 5);
        ctx.restore();
      }

      function drawPalm(x, y, lean, scale, t) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.rotate(lean);
        ctx.strokeStyle = "#653b21";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 36);
        ctx.bezierCurveTo(-7, 5, 5, -38, -3, -78);
        ctx.stroke();

        ctx.strokeStyle = "rgba(45, 24, 14, 0.35)";
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.moveTo(-2 + (i % 2) * 4, 26 - i * 16);
          ctx.lineTo(4 - (i % 2) * 7, 17 - i * 16);
          ctx.stroke();
        }

        ctx.translate(-3, -78);
        const sway = Math.sin(t * 1.8) * 0.1;
        for (let i = 0; i < 8; i++) {
          const angle = i / 8 * TAU + sway;
          const len = i % 2 ? 54 : 68;
          ctx.save();
          ctx.rotate(angle);
          const leaf = ctx.createLinearGradient(0, 0, len, 0);
          leaf.addColorStop(0, "#64b847");
          leaf.addColorStop(1, "#1a6e3c");
          ctx.fillStyle = leaf;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(len * 0.5, -14, len, -4);
          ctx.quadraticCurveTo(len * 0.5, 11, 0, 0);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = "#7d4b24";
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(Math.cos(i * 2) * 7, Math.sin(i * 2) * 5 + 4, 5, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawLaunchPad(cx, y) {
        const towerH = clamp(height * 0.22, 140, 230);
        const towerX = cx + clamp(width * 0.055, 34, 60);
        const platformW = clamp(width * 0.16, 110, 190);

        ctx.save();
        ctx.strokeStyle = "#687684";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.fillStyle = "#252b33";
        ctx.fillRect(cx - platformW / 2, y + 10, platformW, 12);
        ctx.fillStyle = "#101820";
        ctx.fillRect(cx - platformW * 0.38, y + 22, platformW * 0.76, 13);

        ctx.strokeStyle = "#93a0aa";
        ctx.beginPath();
        ctx.moveTo(towerX, y + 13);
        ctx.lineTo(towerX, y - towerH);
        ctx.moveTo(towerX + 30, y + 13);
        ctx.lineTo(towerX + 30, y - towerH + 15);
        ctx.stroke();

        ctx.strokeStyle = "#61707a";
        ctx.lineWidth = 2;
        const steps = 8;
        for (let i = 0; i <= steps; i++) {
          const yy = y + 10 - i * (towerH - 14) / steps;
          ctx.beginPath();
          ctx.moveTo(towerX - 2, yy);
          ctx.lineTo(towerX + 34, yy + 2);
          ctx.stroke();
          if (i < steps) {
            ctx.beginPath();
            ctx.moveTo(towerX, yy);
            ctx.lineTo(towerX + 30, yy - (towerH - 14) / steps + 2);
            ctx.moveTo(towerX + 30, yy + 2);
            ctx.lineTo(towerX, yy - (towerH - 14) / steps);
            ctx.stroke();
          }
        }

        ctx.strokeStyle = "#aab6bf";
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
          const armY = y - towerH + 34 + i * 44;
          ctx.beginPath();
          ctx.moveTo(towerX, armY);
          ctx.lineTo(cx + 20, armY + 12);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFlame(rocket, t, phaseTime) {
        if (phaseTime >= 7 || phaseTime >= 12) return;
        const ignition = phaseTime < 1.5 ? smoothstep(phaseTime / 1.5) : 1;
        if (ignition <= 0.01) return;

        const s = rocket.scale;
        const flameLength = rocket.rocketHeight * s * lerp(0.15, 0.34, clamp((phaseTime - 1.5) / 4, 0, 1));
        const flameWidth = rocket.rocketWidth * s * lerp(0.55, 0.82, ignition);
        const flicker = 0.82 + Math.sin(t * 38) * 0.08 + Math.sin(t * 71) * 0.06 + Math.random() * 0.08;
        const x = rocket.x;
        const y = rocket.y + 3 * s;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        const glow = ctx.createRadialGradient(x, y + flameLength * 0.3, 0, x, y + flameLength * 0.35, flameLength * 0.75);
        glow.addColorStop(0, `rgba(255, 233, 133, ${0.58 * ignition})`);
        glow.addColorStop(0.45, `rgba(255, 121, 35, ${0.28 * ignition})`);
        glow.addColorStop(1, "rgba(255, 50, 22, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.ellipse(x, y + flameLength * 0.34, flameWidth * 1.45, flameLength * 0.58, 0, 0, TAU);
        ctx.fill();

        function flameShape(w, len, color) {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x - w, y);
          ctx.bezierCurveTo(x - w * 1.05, y + len * 0.34, x - w * 0.48, y + len * 0.78, x, y + len * flicker);
          ctx.bezierCurveTo(x + w * 0.48, y + len * 0.78, x + w * 1.05, y + len * 0.34, x + w, y);
          ctx.closePath();
          ctx.fill();
        }

        flameShape(flameWidth * 0.95, flameLength, `rgba(255, 78, 18, ${0.65 * ignition})`);
        flameShape(flameWidth * 0.62, flameLength * 0.82, `rgba(255, 180, 44, ${0.92 * ignition})`);
        flameShape(flameWidth * 0.32, flameLength * 0.58, `rgba(255, 255, 220, ${0.98 * ignition})`);

        ctx.restore();
      }

      function drawHeatHaze(rocket, phaseTime) {
        if (phaseTime > 6.6) return;
        const intensity = phaseTime < 1.5 ? smoothstep(phaseTime / 1.5) : 1;
        if (intensity <= 0.02 || !rocket.visible) return;
        const s = rocket.scale;
        ctx.save();
        ctx.globalAlpha = 0.08 * intensity;
        ctx.strokeStyle = "#fff1bf";
        ctx.lineWidth = 1;
        for (let i = 0; i < 9; i++) {
          const yy = rocket.y + 8 * s + i * 12 * s;
          ctx.beginPath();
          for (let x = rocket.x - 26 * s; x <= rocket.x + 26 * s; x += 5) {
            const wave = Math.sin(x * 0.18 + yy * 0.05 + performance.now() * 0.008) * 5 * s;
            if (x === rocket.x - 26 * s) ctx.moveTo(x + wave, yy);
            else ctx.lineTo(x + wave, yy);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawRocket(rocket) {
        if (!rocket.visible) return;
        const s = rocket.scale;
        const h = rocket.rocketHeight * s;
        const w = rocket.rocketWidth * s;
        const x = rocket.x;
        const base = rocket.y;
        const top = base - h;
        const noseH = h * 0.17;
        const fairingH = h * 0.2;
        const secondH = h * 0.2;
        const firstH = h * 0.43;
        const bodyX = x - w / 2;

        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.32)";
        ctx.shadowBlur = 16 * s;
        ctx.shadowOffsetX = 6 * s;
        ctx.shadowOffsetY = 7 * s;

        const bodyGrad = ctx.createLinearGradient(bodyX, 0, bodyX + w, 0);
        bodyGrad.addColorStop(0, "#d9e1e8");
        bodyGrad.addColorStop(0.22, "#ffffff");
        bodyGrad.addColorStop(0.55, "#f7fbff");
        bodyGrad.addColorStop(1, "#aab7c2");

        ctx.fillStyle = "#c8d3dc";
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.bezierCurveTo(x - w * 0.5, top + noseH * 0.34, x - w * 0.58, top + noseH * 0.76, bodyX, top + noseH);
        ctx.lineTo(bodyX + w, top + noseH);
        ctx.bezierCurveTo(x + w * 0.58, top + noseH * 0.76, x + w * 0.5, top + noseH * 0.34, x, top);
        ctx.fill();

        const noseShade = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
        noseShade.addColorStop(0, "#252b31");
        noseShade.addColorStop(0.55, "#52606c");
        noseShade.addColorStop(1, "#161b20");
        ctx.fillStyle = noseShade;
        ctx.globalAlpha = 0.92;
        ctx.beginPath();
        ctx.moveTo(x, top + 2 * s);
        ctx.bezierCurveTo(x - w * 0.43, top + noseH * 0.38, x - w * 0.48, top + noseH * 0.74, bodyX + w * 0.05, top + noseH);
        ctx.lineTo(bodyX + w * 0.95, top + noseH);
        ctx.bezierCurveTo(x + w * 0.48, top + noseH * 0.74, x + w * 0.43, top + noseH * 0.38, x, top + 2 * s);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = bodyGrad;
        roundRect(bodyX, top + noseH, w, fairingH + secondH + firstH, w * 0.18);
        ctx.fill();

        ctx.shadowColor = "transparent";

        const yFair = top + noseH;
        const ySecond = yFair + fairingH;
        const yInter = ySecond + secondH;
        const yFirst = yInter + firstH;

        ctx.fillStyle = "#1d242b";
        ctx.fillRect(bodyX, ySecond - h * 0.02, w, h * 0.025);
        ctx.fillRect(bodyX, yInter - h * 0.012, w, h * 0.018);
        ctx.fillRect(bodyX, yFirst - h * 0.025, w, h * 0.026);

        ctx.fillStyle = "#d83535";
        ctx.fillRect(bodyX, ySecond + h * 0.035, w, h * 0.026);
        ctx.fillStyle = "#2a3745";
        ctx.fillRect(bodyX, yFair + h * 0.025, w, h * 0.018);
        ctx.fillRect(bodyX, yInter + h * 0.05, w, h * 0.019);

        ctx.strokeStyle = "rgba(56, 70, 83, 0.38)";
        ctx.lineWidth = Math.max(1, 1.2 * s);
        for (let i = 1; i < 11; i++) {
          const yy = yFair + i * (h * 0.78 / 11);
          ctx.beginPath();
          ctx.moveTo(bodyX + w * 0.08, yy);
          ctx.lineTo(bodyX + w * 0.92, yy);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(36, 48, 60, 0.35)";
        for (let i = -1; i <= 1; i += 2) {
          ctx.beginPath();
          ctx.moveTo(x + i * w * 0.25, yFair + h * 0.02);
          ctx.lineTo(x + i * w * 0.25, yFirst - h * 0.02);
          ctx.stroke();
        }

        ctx.fillStyle = "#f8fbff";
        ctx.strokeStyle = "#65727f";
        ctx.lineWidth = Math.max(1, 1.4 * s);
        roundRect(bodyX + w * 0.58, yInter + h * 0.11, w * 0.28, h * 0.07, 4 * s);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#32465b";
        ctx.beginPath();
        ctx.arc(bodyX + w * 0.67, yInter + h * 0.145, 1.9 * s, 0, TAU);
        ctx.fill();

        drawFlag(bodyX + w * 0.18, ySecond + h * 0.08, w * 0.28, h * 0.035, s);
        ctx.fillStyle = "#27313a";
        ctx.font = `${Math.max(6, 9 * s)}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.save();
        ctx.translate(bodyX + w * 0.5, yInter + h * 0.22);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText("ORBITAL", 0, 0);
        ctx.restore();

        ctx.fillStyle = "#aeb9c4";
        for (let i = 0; i < 5; i++) {
          const yy = yFair + h * (0.1 + i * 0.13);
          for (let side = 0; side < 2; side++) {
            ctx.beginPath();
            ctx.arc(bodyX + w * (side ? 0.86 : 0.14), yy, 1.15 * s, 0, TAU);
            ctx.fill();
          }
        }

        drawFins(x, base, w, h, s);
        drawEngines(x, base, w, s);
        ctx.restore();
      }

      function drawFlag(x, y, w, h, s) {
        ctx.save();
        ctx.fillStyle = "#123a6f";
        ctx.fillRect(x, y, w * 0.42, h);
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.arc(x + w * (0.08 + (i % 3) * 0.1), y + h * (0.25 + Math.floor(i / 3) * 0.34), 0.9 * s, 0, TAU);
          ctx.fill();
        }
        for (let i = 0; i < 4; i++) {
          ctx.fillStyle = i % 2 ? "#ffffff" : "#c42d2d";
          ctx.fillRect(x + w * 0.42, y + i * h / 4, w * 0.58, h / 4);
        }
        ctx.restore();
      }

      function drawFins(x, base, w, h, s) {
        const finH = h * 0.115;
        const finW = w * 0.45;
        const finY = base - h * 0.11;
        const finGrad = ctx.createLinearGradient(x - w, 0, x + w, 0);
        finGrad.addColorStop(0, "#7e8a95");
        finGrad.addColorStop(0.55, "#d8e0e6");
        finGrad.addColorStop(1, "#56616c");
        ctx.fillStyle = finGrad;
        ctx.strokeStyle = "#29313a";
        ctx.lineWidth = Math.max(1, 1.2 * s);

        ctx.beginPath();
        ctx.moveTo(x - w * 0.48, finY);
        ctx.lineTo(x - w * 0.48 - finW, base - 2 * s);
        ctx.lineTo(x - w * 0.2, base - 2 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + w * 0.48, finY);
        ctx.lineTo(x + w * 0.48 + finW, base - 2 * s);
        ctx.lineTo(x + w * 0.2, base - 2 * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#cdd7de";
        ctx.beginPath();
        ctx.moveTo(x - w * 0.18, base - h * 0.095);
        ctx.lineTo(x, base - h * 0.025);
        ctx.lineTo(x + w * 0.18, base - h * 0.095);
        ctx.closePath();
        ctx.fill();
      }

      function drawEngines(x, base, w, s) {
        ctx.save();
        const engineY = base - 2 * s;
        const positions = [-0.28, 0, 0.28];
        for (const pos of positions) {
          const ex = x + pos * w;
          const bellGrad = ctx.createLinearGradient(ex - w * 0.12, engineY - 12 * s, ex + w * 0.12, engineY);
          bellGrad.addColorStop(0, "#29313a");
          bellGrad.addColorStop(0.45, "#818d98");
          bellGrad.addColorStop(1, "#11161c");
          ctx.fillStyle = bellGrad;
          ctx.beginPath();
          ctx.moveTo(ex - w * 0.12, engineY - 10 * s);
          ctx.lineTo(ex + w * 0.12, engineY - 10 * s);
          ctx.lineTo(ex + w * 0.18, engineY + 2 * s);
          ctx.lineTo(ex - w * 0.18, engineY + 2 * s);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#06090d";
          ctx.stroke();
          ctx.fillStyle = "#05070a";
          ctx.beginPath();
          ctx.ellipse(ex, engineY + 1.5 * s, w * 0.14, 3.7 * s, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function launchEnergy(phaseTime) {
        if (phaseTime < 1.5) return smoothstep(phaseTime / 1.5) * 0.55;
        if (phaseTime < 4) return 1;
        if (phaseTime < 7) return 1 - smoothstep((phaseTime - 4) / 3) * 0.45;
        return 0;
      }

      function drawFrame(now) {
        const totalTime = now * 0.001;
        const cycleIndex = Math.floor(totalTime / CYCLE);
        const phaseTime = totalTime - cycleIndex * CYCLE;
        let dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
        lastTime = now;

        if (cycleIndex !== previousCycle || phaseTime < previousPhaseTime) {
          smoke.length = 0;
          sparks.length = 0;
          smokeCarry = 0;
          sparkCarry = 0;
          previousCycle = cycleIndex;
        }
        previousPhaseTime = phaseTime;

        const rocket = currentRocket(phaseTime);
        const energy = launchEnergy(phaseTime);
        const shake = energy > 0.05 && phaseTime < 4.4
          ? (1 - clamp((phaseTime - 3.7) / 0.8, 0, 1)) * 3.2 * energy
          : 0;
        const sx = (Math.random() - 0.5) * shake;
        const sy = (Math.random() - 0.5) * shake;

        emitParticles(phaseTime, dt, rocket);
        updateParticles(dt);

        ctx.save();
        ctx.translate(sx, sy);
        drawSky(totalTime);
        drawOcean(totalTime, energy);
        drawSmokeLayer("trail");
        drawHeatHaze(rocket, phaseTime);
        drawFlame(rocket, totalTime, phaseTime);
        drawRocket(rocket);
        drawIsland(totalTime);
        drawSmokeLayer("base");
        drawSparks();
        ctx.restore();

        requestAnimationFrame(drawFrame);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
</html>
