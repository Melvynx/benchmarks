<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT 5.5</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: rgba(21, 24, 30, 0.88);
      --panel-strong: rgba(28, 32, 39, 0.96);
      --line: rgba(255, 255, 255, 0.13);
      --text: #eef2f7;
      --muted: #a8b1bf;
      --accent: #f2c14e;
      --accent-2: #3fa7d6;
      --danger: #e45b45;
      --ok: #77c26f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 780;
      letter-spacing: 0;
      color: #f7f8fb;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.35);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      padding: 0 14px;
      color: var(--text);
      background: var(--panel-strong);
      font: inherit;
      font-weight: 720;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    button:hover {
      border-color: rgba(255, 255, 255, 0.24);
      filter: brightness(1.06);
    }

    #testBtn {
      min-width: 92px;
      color: #1e1706;
      background: linear-gradient(180deg, #ffd96c, #e8ad2f);
      border-color: rgba(255, 222, 126, 0.6);
    }

    #resetBtn {
      min-width: 78px;
    }

    main {
      position: relative;
      min-height: 100vh;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #12151a;
    }

    .panel {
      position: fixed;
      z-index: 3;
      right: 16px;
      top: 68px;
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 88px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1;
      color: #dbe2eb;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 11px 12px;
      align-items: center;
    }

    label {
      display: grid;
      gap: 5px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    label span {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"] {
      width: 96px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 6px;
      padding: 0 9px;
      color: var(--text);
      background: rgba(9, 11, 14, 0.68);
      font: inherit;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .metric {
      min-height: 58px;
      padding: 9px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.045);
    }

    .metric b {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .metric strong {
      display: block;
      color: #fff;
      font-size: 17px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .status {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .status output {
      color: #dce4ed;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        padding: 10px;
      }

      h1 {
        font-size: 16px;
      }

      .panel {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 10px;
        width: auto;
        max-height: 42vh;
      }

      .telemetry {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      button {
        height: 36px;
        padding: 0 11px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>GPT 5.5</h1>
    <div class="toolbar" aria-label="Experiment controls">
      <button id="testBtn" type="button">Test</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
  </header>

  <main>
    <canvas id="scene" aria-label="2D car crash experiment canvas"></canvas>
    <section class="panel" aria-label="Experiment settings">
      <h2>Settings</h2>
      <div class="grid" id="settingsGrid"></div>
      <div class="telemetry" aria-label="Experiment telemetry">
        <div class="metric"><b>Car speed</b><strong id="speedReadout">0.0</strong></div>
        <div class="metric"><b>Elapsed</b><strong id="timeReadout">0.00</strong></div>
        <div class="metric"><b>Moving bricks</b><strong id="movingReadout">0</strong></div>
      </div>
      <div class="status">
        <span id="statusText">Ready at baseline defaults</span>
        <output id="brickCount">192 bricks</output>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const MODEL_NAME = "GPT 5.5";
      const PX_PER_METER = 80;
      const BRICK_W = 0.50;
      const BRICK_H = 0.24;
      const CAR_MASS = 1250;
      const CAR_W = 4.2;
      const CAR_H = 1.45;
      const GRAVITY = 9.81;
      const BRICK_FRICTION = 0.72;
      const BRICK_RESTITUTION = 0.18;
      const GROUND_FRICTION = 0.85;
      const SETTLE_SPEED = 0.045;
      const WORLD_FLOOR = 0;

      const defaults = Object.freeze({
        carSpeed: 22,
        wallColumns: 12,
        wallRows: 8,
        wallLayers: 2,
        brickMass: 2.5
      });

      const controls = [
        { key: "carSpeed", label: "Car speed", unit: "m/s", min: 5, max: 45, step: 0.5 },
        { key: "wallColumns", label: "Wall columns", unit: "", min: 4, max: 24, step: 1 },
        { key: "wallRows", label: "Wall rows", unit: "", min: 3, max: 16, step: 1 },
        { key: "wallLayers", label: "Wall depth layers", unit: "", min: 1, max: 5, step: 1 },
        { key: "brickMass", label: "Brick mass", unit: "kg", min: 0.5, max: 12, step: 0.1 }
      ];

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const settingsGrid = document.getElementById("settingsGrid");
      const speedReadout = document.getElementById("speedReadout");
      const timeReadout = document.getElementById("timeReadout");
      const movingReadout = document.getElementById("movingReadout");
      const brickCount = document.getElementById("brickCount");
      const statusText = document.getElementById("statusText");
      const testBtn = document.getElementById("testBtn");
      const resetBtn = document.getElementById("resetBtn");

      document.title = MODEL_NAME;

      const settings = { ...defaults };
      const uiInputs = new Map();
      const bodies = [];
      const bricks = [];
      const particles = [];
      const skidMarks = [];

      let car = null;
      let running = false;
      let elapsed = 0;
      let lastTimestamp = 0;
      let accumulator = 0;
      let simBounds = { minX: -0.5, maxX: 21, maxY: 6 };
      let wallStartX = 13.8;
      let shake = 0;
      let impactEnergy = 0;
      let seed = 1;
      let dpr = 1;
      let view = { width: 1, height: 1, scale: PX_PER_METER, originX: 0, originY: 0 };

      function rand() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function crossSV(s, v) {
        return { x: -s * v.y, y: s * v.x };
      }

      function cross(a, b) {
        return a.x * b.y - a.y * b.x;
      }

      function dot(a, b) {
        return a.x * b.x + a.y * b.y;
      }

      function len(v) {
        return Math.hypot(v.x, v.y);
      }

      function normalize(v) {
        const l = Math.hypot(v.x, v.y) || 1;
        return { x: v.x / l, y: v.y / l };
      }

      function rotatePoint(x, y, a) {
        const c = Math.cos(a);
        const s = Math.sin(a);
        return { x: x * c - y * s, y: x * s + y * c };
      }

      class Body {
        constructor(options) {
          this.id = Body.nextId++;
          this.kind = options.kind || "brick";
          this.x = options.x;
          this.y = options.y;
          this.w = options.w;
          this.h = options.h;
          this.angle = options.angle || 0;
          this.vx = options.vx || 0;
          this.vy = options.vy || 0;
          this.av = options.av || 0;
          this.mass = options.mass;
          this.invMass = this.mass > 0 ? 1 / this.mass : 0;
          this.inertia = this.mass > 0 ? this.mass * (this.w * this.w + this.h * this.h) / 12 : Infinity;
          this.invI = this.inertia > 0 && isFinite(this.inertia) ? 1 / this.inertia : 0;
          this.friction = options.friction ?? 0.6;
          this.restitution = options.restitution ?? 0.1;
          this.color = options.color || "#b85a3c";
          this.sleeping = false;
          this.stillTime = 0;
          this.layerVisual = options.layerVisual || 1;
          this.row = options.row || 0;
          this.col = options.col || 0;
          this.aabb = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
          this.updateAABB();
        }

        corners() {
          const hw = this.w / 2;
          const hh = this.h / 2;
          const pts = [
            rotatePoint(-hw, -hh, this.angle),
            rotatePoint(hw, -hh, this.angle),
            rotatePoint(hw, hh, this.angle),
            rotatePoint(-hw, hh, this.angle)
          ];
          for (const p of pts) {
            p.x += this.x;
            p.y += this.y;
          }
          return pts;
        }

        axes() {
          const c = Math.cos(this.angle);
          const s = Math.sin(this.angle);
          return [
            { x: c, y: s },
            { x: -s, y: c }
          ];
        }

        updateAABB() {
          const pts = this.corners();
          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;
          for (const p of pts) {
            if (p.x < minX) minX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.x > maxX) maxX = p.x;
            if (p.y > maxY) maxY = p.y;
          }
          this.aabb.minX = minX;
          this.aabb.minY = minY;
          this.aabb.maxX = maxX;
          this.aabb.maxY = maxY;
        }
      }

      Body.nextId = 1;

      function createSettingsUI() {
        settingsGrid.innerHTML = "";
        for (const c of controls) {
          const wrap = document.createElement("label");
          const caption = document.createElement("span");
          const labelText = document.createElement("span");
          const liveValue = document.createElement("output");
          labelText.textContent = c.label;
          caption.append(labelText, liveValue);

          const range = document.createElement("input");
          range.type = "range";
          range.min = c.min;
          range.max = c.max;
          range.step = c.step;
          range.value = settings[c.key];

          const number = document.createElement("input");
          number.type = "number";
          number.min = c.min;
          number.max = c.max;
          number.step = c.step;
          number.value = settings[c.key];
          number.inputMode = "decimal";

          function format(v) {
            const decimals = c.step < 1 ? 1 : 0;
            return Number(v).toFixed(decimals) + (c.unit ? " " + c.unit : "");
          }

          function sync(next, source) {
            let value = Number(next);
            if (!Number.isFinite(value)) value = defaults[c.key];
            value = clamp(value, c.min, c.max);
            if (c.step >= 1) value = Math.round(value);
            else value = Math.round(value / c.step) * c.step;
            settings[c.key] = Number(value.toFixed(3));
            range.value = settings[c.key];
            number.value = settings[c.key];
            liveValue.textContent = format(settings[c.key]);
            if (source) resetScene(false);
          }

          range.addEventListener("input", () => sync(range.value, true));
          number.addEventListener("change", () => sync(number.value, true));
          sync(settings[c.key], false);

          wrap.append(caption, range);
          settingsGrid.append(wrap, number);
          uiInputs.set(c.key, { range, number, liveValue });
        }
      }

      function resetScene(fromButton) {
        bodies.length = 0;
        bricks.length = 0;
        particles.length = 0;
        skidMarks.length = 0;
        Body.nextId = 1;
        seed = 0x5a5a5a5a;
        elapsed = 0;
        running = false;
        accumulator = 0;
        shake = 0;
        impactEnergy = 0;

        const wallWidth = settings.wallColumns * BRICK_W + 0.5 * BRICK_W;
        wallStartX = Math.max(12.8, 16.2 - settings.wallColumns * 0.07);
        const wallMaxY = settings.wallRows * BRICK_H;
        simBounds = {
          minX: -0.6,
          maxX: Math.max(22, wallStartX + wallWidth + 4.3),
          maxY: Math.max(4.8, wallMaxY + 2.2)
        };

        car = new Body({
          kind: "car",
          x: 2.25,
          y: CAR_H / 2,
          w: CAR_W,
          h: CAR_H,
          mass: CAR_MASS,
          friction: 0.82,
          restitution: 0.06,
          color: "#df3347"
        });
        bodies.push(car);

        const layerMass = Math.max(1, settings.wallLayers) * settings.brickMass;
        for (let row = 0; row < settings.wallRows; row++) {
          for (let col = 0; col < settings.wallColumns; col++) {
            const stagger = row % 2 ? BRICK_W * 0.5 : 0;
            const x = wallStartX + stagger + col * BRICK_W + BRICK_W / 2;
            const y = WORLD_FLOOR + row * BRICK_H + BRICK_H / 2;
            const warmth = 0.88 + 0.12 * ((row * 17 + col * 7) % 5) / 4;
            const brick = new Body({
              kind: "brick",
              x,
              y,
              w: BRICK_W,
              h: BRICK_H,
              mass: layerMass,
              friction: BRICK_FRICTION,
              restitution: BRICK_RESTITUTION,
              color: `rgb(${Math.round(154 * warmth)}, ${Math.round(67 * warmth)}, ${Math.round(45 * warmth)})`,
              layerVisual: settings.wallLayers,
              row,
              col
            });
            bodies.push(brick);
            bricks.push(brick);
          }
        }

        updateTelemetry();
        statusText.textContent = fromButton ? "Reset to current settings" : "Ready with current settings";
      }

      function runTest() {
        resetScene(false);
        running = true;
        statusText.textContent = "Running deterministic crash test";
      }

      function resizeCanvas() {
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const width = Math.max(320, window.innerWidth);
        const height = Math.max(320, window.innerHeight);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        view.width = width;
        view.height = height;
        updateView();
      }

      function updateView() {
        const panelReserve = view.width > 880 ? 365 : 20;
        const availableW = Math.max(320, view.width - panelReserve - 34);
        const availableH = Math.max(260, view.height - 96);
        const requiredW = simBounds.maxX - simBounds.minX;
        const requiredH = simBounds.maxY + 0.8;
        view.scale = Math.min(PX_PER_METER, availableW / requiredW, availableH / requiredH);
        view.scale = Math.max(34, view.scale);
        view.originX = 18 - simBounds.minX * view.scale;
        view.originY = view.height - Math.max(56, Math.min(104, view.height * 0.16));
      }

      function integrateBody(b, dt) {
        if (b.sleeping) return;
        if (b.kind === "brick") {
          b.vy -= GRAVITY * dt;
        } else if (b.kind === "car") {
          if (running) {
            const target = settings.carSpeed;
            const runway = Math.max(4, wallStartX - 5.8 - b.x);
            const launchAccel = clamp((target * target) / (2 * runway), 6, 135);
            if (b.vx < target && b.x < wallStartX - 2.2) {
              b.vx = Math.min(target, b.vx + launchAccel * dt);
              spawnExhaust(b);
            }
          }
          const normal = b.mass * GRAVITY;
          const drag = GROUND_FRICTION * normal / b.mass;
          if (Math.abs(b.vx) > 0.005) {
            const dv = drag * dt * Math.sign(b.vx);
            b.vx = Math.abs(dv) > Math.abs(b.vx) ? 0 : b.vx - dv;
          }
          b.vy -= GRAVITY * dt;
        }

        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.angle += b.av * dt;
        b.vx *= Math.pow(0.9992, dt * 60);
        b.vy *= Math.pow(0.9992, dt * 60);
        b.av *= Math.pow(0.996, dt * 60);
        b.updateAABB();
      }

      function project(points, axis) {
        let min = dot(points[0], axis);
        let max = min;
        for (let i = 1; i < points.length; i++) {
          const v = dot(points[i], axis);
          if (v < min) min = v;
          if (v > max) max = v;
        }
        return { min, max };
      }

      function satCollision(a, b) {
        if (a.aabb.maxX < b.aabb.minX || a.aabb.minX > b.aabb.maxX || a.aabb.maxY < b.aabb.minY || a.aabb.minY > b.aabb.maxY) {
          return null;
        }

        const ac = a.corners();
        const bc = b.corners();
        const axes = a.axes().concat(b.axes());
        let smallest = Infinity;
        let bestAxis = null;

        for (const axis of axes) {
          const pa = project(ac, axis);
          const pb = project(bc, axis);
          const overlap = Math.min(pa.max, pb.max) - Math.max(pa.min, pb.min);
          if (overlap <= 0) return null;
          if (overlap < smallest) {
            smallest = overlap;
            bestAxis = axis;
          }
        }

        const centerDelta = { x: b.x - a.x, y: b.y - a.y };
        let normal = { x: bestAxis.x, y: bestAxis.y };
        if (dot(centerDelta, normal) < 0) {
          normal.x *= -1;
          normal.y *= -1;
        }

        const points = [];
        for (const p of ac) if (pointInBody(p, b)) points.push(p);
        for (const p of bc) if (pointInBody(p, a)) points.push(p);

        let contact;
        if (points.length) {
          contact = points.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
          contact.x /= points.length;
          contact.y /= points.length;
        } else {
          contact = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        }
        return { a, b, normal, depth: smallest, contact };
      }

      function pointInBody(p, b) {
        const dx = p.x - b.x;
        const dy = p.y - b.y;
        const c = Math.cos(-b.angle);
        const s = Math.sin(-b.angle);
        const lx = dx * c - dy * s;
        const ly = dx * s + dy * c;
        return Math.abs(lx) <= b.w / 2 + 1e-5 && Math.abs(ly) <= b.h / 2 + 1e-5;
      }

      function velocityAt(b, r) {
        const spin = crossSV(b.av, r);
        return { x: b.vx + spin.x, y: b.vy + spin.y };
      }

      function applyImpulse(b, impulse, r) {
        if (b.invMass === 0 || b.sleeping) return;
        b.vx += impulse.x * b.invMass;
        b.vy += impulse.y * b.invMass;
        b.av += cross(r, impulse) * b.invI;
      }

      function resolveCollision(c) {
        const a = c.a;
        const b = c.b;
        if (a.sleeping && b.sleeping) return 0;

        a.sleeping = false;
        b.sleeping = false;

        const invMassSum = a.invMass + b.invMass;
        if (invMassSum > 0) {
          const correction = Math.max(c.depth - 0.002, 0) / invMassSum * 0.58;
          if (a.invMass > 0) {
            a.x -= c.normal.x * correction * a.invMass;
            a.y -= c.normal.y * correction * a.invMass;
          }
          if (b.invMass > 0) {
            b.x += c.normal.x * correction * b.invMass;
            b.y += c.normal.y * correction * b.invMass;
          }
          a.updateAABB();
          b.updateAABB();
        }

        const ra = { x: c.contact.x - a.x, y: c.contact.y - a.y };
        const rb = { x: c.contact.x - b.x, y: c.contact.y - b.y };
        const va = velocityAt(a, ra);
        const vb = velocityAt(b, rb);
        const rv = { x: vb.x - va.x, y: vb.y - va.y };
        const velAlongNormal = dot(rv, c.normal);
        if (velAlongNormal > 0.04) return 0;

        const raCrossN = cross(ra, c.normal);
        const rbCrossN = cross(rb, c.normal);
        const denom = a.invMass + b.invMass + raCrossN * raCrossN * a.invI + rbCrossN * rbCrossN * b.invI;
        if (denom <= 0) return 0;

        const e = Math.min(a.restitution, b.restitution);
        let j = -(1 + e) * velAlongNormal / denom;
        j = Math.max(0, j);
        const impulse = { x: c.normal.x * j, y: c.normal.y * j };
        applyImpulse(a, { x: -impulse.x, y: -impulse.y }, ra);
        applyImpulse(b, impulse, rb);

        const afterVa = velocityAt(a, ra);
        const afterVb = velocityAt(b, rb);
        const afterRv = { x: afterVb.x - afterVa.x, y: afterVb.y - afterVa.y };
        let tangent = { x: afterRv.x - c.normal.x * dot(afterRv, c.normal), y: afterRv.y - c.normal.y * dot(afterRv, c.normal) };
        const tLen = len(tangent);
        if (tLen > 1e-5) {
          tangent.x /= tLen;
          tangent.y /= tLen;
          const raCrossT = cross(ra, tangent);
          const rbCrossT = cross(rb, tangent);
          const fDenom = a.invMass + b.invMass + raCrossT * raCrossT * a.invI + rbCrossT * rbCrossT * b.invI;
          let jt = -dot(afterRv, tangent) / fDenom;
          const mu = Math.sqrt(a.friction * b.friction);
          jt = clamp(jt, -j * mu, j * mu);
          const frictionImpulse = { x: tangent.x * jt, y: tangent.y * jt };
          applyImpulse(a, { x: -frictionImpulse.x, y: -frictionImpulse.y }, ra);
          applyImpulse(b, frictionImpulse, rb);
        }

        if ((a.kind === "car" && b.kind === "brick") || (a.kind === "brick" && b.kind === "car")) {
          const energy = j * Math.max(0, -velAlongNormal);
          if (energy > 20) {
            impactEnergy += energy;
            shake = Math.min(1.8, shake + energy * 0.00075);
            spawnImpactDust(c.contact, c.normal, energy);
          }
        }
        return j;
      }

      function resolveGround(b) {
        const pts = b.corners();
        let lowest = Infinity;
        const contacts = [];
        for (const p of pts) {
          if (p.y < lowest) lowest = p.y;
          if (p.y <= WORLD_FLOOR + 0.012) contacts.push(p);
        }
        if (lowest >= WORLD_FLOOR) return;

        b.sleeping = false;
        const depth = WORLD_FLOOR - lowest;
        b.y += depth + 0.001;
        b.updateAABB();

        const contact = contacts.length
          ? contacts.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 })
          : { x: b.x, y: WORLD_FLOOR };
        contact.x /= Math.max(1, contacts.length);
        contact.y = WORLD_FLOOR;

        const n = { x: 0, y: 1 };
        const r = { x: contact.x - b.x, y: contact.y - b.y };
        const v = velocityAt(b, r);
        const velN = dot(v, n);
        if (velN < 0) {
          const rCrossN = cross(r, n);
          const denom = b.invMass + rCrossN * rCrossN * b.invI;
          const e = b.kind === "car" ? 0.03 : b.restitution * 0.45;
          const j = -(1 + e) * velN / denom;
          applyImpulse(b, { x: n.x * j, y: n.y * j }, r);

          const tangent = { x: 1, y: 0 };
          const v2 = velocityAt(b, r);
          const rCrossT = cross(r, tangent);
          const fDenom = b.invMass + rCrossT * rCrossT * b.invI;
          let jt = -dot(v2, tangent) / fDenom;
          const mu = Math.sqrt(b.friction * GROUND_FRICTION);
          jt = clamp(jt, -j * mu, j * mu);
          applyImpulse(b, { x: tangent.x * jt, y: tangent.y * jt }, r);
        }
      }

      function broadphasePairs() {
        const cellSize = 0.72;
        const grid = new Map();
        const pairs = [];
        const seen = new Set();

        for (const b of bodies) {
          if (b.sleeping && b.kind === "brick") continue;
          b.updateAABB();
          const minX = Math.floor(b.aabb.minX / cellSize);
          const maxX = Math.floor(b.aabb.maxX / cellSize);
          const minY = Math.floor(b.aabb.minY / cellSize);
          const maxY = Math.floor(b.aabb.maxY / cellSize);
          for (let gx = minX; gx <= maxX; gx++) {
            for (let gy = minY; gy <= maxY; gy++) {
              const key = gx + "," + gy;
              if (!grid.has(key)) grid.set(key, []);
              const bucket = grid.get(key);
              for (const other of bucket) {
                if (b.sleeping && other.sleeping) continue;
                const low = Math.min(b.id, other.id);
                const high = Math.max(b.id, other.id);
                const pairKey = low + ":" + high;
                if (!seen.has(pairKey)) {
                  seen.add(pairKey);
                  pairs.push([b, other]);
                }
              }
              bucket.push(b);
            }
          }
        }
        return pairs;
      }

      function stepPhysics(dt) {
        const maxSpeed = bodies.reduce((m, b) => Math.max(m, Math.abs(b.vx), Math.abs(b.vy)), settings.carSpeed);
        const substeps = clamp(Math.ceil(maxSpeed * dt / (BRICK_H * 0.31)), 3, 10);
        const h = dt / substeps;

        for (let s = 0; s < substeps; s++) {
          for (const b of bodies) integrateBody(b, h);

          for (let iter = 0; iter < 5; iter++) {
            for (const b of bodies) resolveGround(b);
            const pairs = broadphasePairs();
            pairs.sort((p1, p2) => {
              const a = (p1[0].kind === "car" || p1[1].kind === "car") ? 0 : 1;
              const b = (p2[0].kind === "car" || p2[1].kind === "car") ? 0 : 1;
              return a - b;
            });
            for (const pair of pairs) {
              const c = satCollision(pair[0], pair[1]);
              if (c) resolveCollision(c);
            }
          }
        }

        for (const b of bricks) {
          const speed = Math.hypot(b.vx, b.vy);
          if (speed < SETTLE_SPEED && Math.abs(b.av) < 0.08 && b.y < b.h / 2 + 0.06) {
            b.stillTime += dt;
            if (b.stillTime > 1.6) {
              b.vx = 0;
              b.vy = 0;
              b.av = 0;
              b.sleeping = true;
            }
          } else {
            b.stillTime = 0;
            b.sleeping = false;
          }
        }

        elapsed += dt;
        shake *= Math.pow(0.08, dt);
        updateParticles(dt);
        updateSkidMarks(dt);

        const moving = countMovingBricks();
        if (running && elapsed > 2.2 && moving === 0 && Math.abs(car.vx) < 0.08) {
          running = false;
          statusText.textContent = "Settled";
        } else if (running && elapsed > 18) {
          running = false;
          statusText.textContent = "Stopped at simulation time limit";
        }
      }

      function spawnImpactDust(p, normal, energy) {
        const count = Math.min(18, Math.floor(energy / 70) + 2);
        for (let i = 0; i < count; i++) {
          const a = Math.atan2(normal.y, normal.x) + Math.PI + (rand() - 0.5) * 1.5;
          const speed = 0.8 + rand() * 3.8 + Math.min(3, energy * 0.002);
          particles.push({
            x: p.x + (rand() - 0.5) * 0.28,
            y: p.y + (rand() - 0.5) * 0.22,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed + rand() * 1.4,
            r: 0.018 + rand() * 0.045,
            life: 0.45 + rand() * 0.55,
            maxLife: 0.45 + rand() * 0.55,
            color: rand() > 0.25 ? "rgba(176, 133, 93," : "rgba(208, 196, 175,"
          });
        }
      }

      function spawnExhaust(b) {
        if (!running || rand() > 0.22) return;
        particles.push({
          x: b.x - b.w * 0.52,
          y: 0.22 + rand() * 0.18,
          vx: -0.6 - rand() * 0.8,
          vy: rand() * 0.35,
          r: 0.015 + rand() * 0.025,
          life: 0.28 + rand() * 0.25,
          maxLife: 0.55,
          color: "rgba(104, 112, 124,"
        });
        if (Math.abs(b.vx) > 3 && rand() > 0.74) {
          skidMarks.push({
            x: b.x - 1.28 + rand() * 0.24,
            y: 0.012,
            w: 0.35 + rand() * 0.22,
            life: 2.4,
            alpha: 0.26
          });
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.vy -= GRAVITY * 0.38 * dt;
          p.vx *= Math.pow(0.94, dt * 60);
          p.vy *= Math.pow(0.97, dt * 60);
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y < 0) {
            p.y = 0;
            p.vy *= -0.18;
            p.vx *= 0.68;
          }
        }
      }

      function updateSkidMarks(dt) {
        for (let i = skidMarks.length - 1; i >= 0; i--) {
          skidMarks[i].life -= dt;
          if (skidMarks[i].life <= 0) skidMarks.splice(i, 1);
        }
      }

      function countMovingBricks() {
        let moving = 0;
        for (const b of bricks) {
          if (Math.hypot(b.vx, b.vy) > 0.08 || Math.abs(b.av) > 0.16 || b.y > b.h / 2 + 0.08) moving++;
        }
        return moving;
      }

      function updateTelemetry() {
        const speed = car ? Math.max(0, car.vx) : 0;
        speedReadout.textContent = speed.toFixed(1);
        timeReadout.textContent = elapsed.toFixed(2);
        movingReadout.textContent = String(countMovingBricks());
        brickCount.textContent = `${settings.wallColumns * settings.wallRows * settings.wallLayers} bricks`;
      }

      function worldToScreen(x, y) {
        return {
          x: view.originX + x * view.scale,
          y: view.originY - y * view.scale
        };
      }

      function beginWorld() {
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const sx = Math.sin(elapsed * 91.7) * shake * 3;
        const sy = Math.cos(elapsed * 73.1) * shake * 2;
        ctx.translate(sx, sy);
        ctx.translate(view.originX, view.originY);
        ctx.scale(view.scale, -view.scale);
      }

      function setLineWidth(px) {
        ctx.lineWidth = px / view.scale;
      }

      function drawBackground() {
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, view.height);
        g.addColorStop(0, "#151a22");
        g.addColorStop(0.56, "#222631");
        g.addColorStop(0.561, "#17191c");
        g.addColorStop(1, "#111214");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, view.width, view.height);

        ctx.fillStyle = "rgba(255,255,255,0.035)";
        for (let i = 0; i < 18; i++) {
          const x = (i * 137 + 43) % Math.max(1, view.width);
          const y = 110 + ((i * 71) % Math.max(1, view.height * 0.42));
          ctx.fillRect(x, y, 1.2, 1.2);
        }
        ctx.restore();
      }

      function drawTrack() {
        ctx.save();
        ctx.fillStyle = "#232222";
        ctx.fillRect(simBounds.minX - 5, -0.22, simBounds.maxX + 10, 0.22);
        ctx.fillStyle = "#343235";
        ctx.fillRect(simBounds.minX - 5, -0.02, simBounds.maxX + 10, 0.04);
        ctx.fillStyle = "rgba(242, 193, 78, 0.55)";
        for (let x = 0; x < simBounds.maxX + 3; x += 1.6) {
          ctx.fillRect(x, 0.018, 0.7, 0.018);
        }

        setLineWidth(1);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath();
        for (let x = 0; x <= simBounds.maxX; x += 1) {
          ctx.moveTo(x, -0.19);
          ctx.lineTo(x, -0.13);
        }
        ctx.stroke();

        ctx.scale(1, -1);
        ctx.fillStyle = "rgba(255,255,255,0.42)";
        ctx.font = `${11 / view.scale}px ui-sans-serif, system-ui`;
        ctx.textAlign = "center";
        for (let x = 0; x <= simBounds.maxX; x += 2) {
          const p = worldToScreenText(x, -0.36);
          ctx.fillText(`${x}m`, p.x, p.y);
        }
        ctx.restore();

        for (const mark of skidMarks) {
          ctx.save();
          ctx.globalAlpha = Math.min(mark.alpha, mark.life / 2.4 * mark.alpha);
          ctx.fillStyle = "#050505";
          ctx.fillRect(mark.x, mark.y, mark.w, 0.018);
          ctx.restore();
        }
      }

      function worldToScreenText(x, y) {
        return { x: x, y: -y };
      }

      function drawBodyShape(b, fill, stroke) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        setLineWidth(1.25);
        ctx.beginPath();
        ctx.rect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawBrick(b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);

        for (let layer = b.layerVisual - 1; layer >= 0; layer--) {
          const offset = layer * 0.014;
          ctx.fillStyle = layer === 0 ? b.color : `rgba(86, 51, 42, ${0.18 + layer * 0.075})`;
          ctx.fillRect(-b.w / 2 + offset, -b.h / 2 + offset, b.w, b.h);
        }

        const chip = ((b.row * 11 + b.col * 5) % 7) / 7;
        ctx.fillStyle = "rgba(255, 210, 160, 0.14)";
        ctx.fillRect(-b.w / 2 + 0.04, b.h * 0.05, b.w * (0.42 + chip * 0.2), b.h * 0.17);
        ctx.fillStyle = "rgba(54, 25, 21, 0.18)";
        ctx.fillRect(-b.w / 2 + b.w * 0.1, -b.h * 0.28, b.w * 0.34, b.h * 0.12);

        setLineWidth(1.15);
        ctx.strokeStyle = "rgba(30, 18, 16, 0.72)";
        ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
        setLineWidth(0.75);
        ctx.strokeStyle = "rgba(255, 230, 190, 0.2)";
        ctx.strokeRect(-b.w / 2 + 0.012, -b.h / 2 + 0.012, b.w - 0.024, b.h - 0.024);
        ctx.restore();
      }

      function drawCar() {
        const b = car;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);

        ctx.fillStyle = "rgba(0, 0, 0, 0.24)";
        ctx.beginPath();
        ctx.ellipse(0.15, -b.h / 2 - 0.06, b.w * 0.48, 0.12, 0, 0, Math.PI * 2);
        ctx.fill();

        const body = new Path2D();
        body.moveTo(-2.06, -0.52);
        body.lineTo(1.78, -0.52);
        body.quadraticCurveTo(2.08, -0.48, 2.09, -0.18);
        body.lineTo(1.92, 0.23);
        body.quadraticCurveTo(1.44, 0.56, 0.82, 0.58);
        body.lineTo(-0.18, 0.61);
        body.quadraticCurveTo(-0.92, 0.58, -1.32, 0.34);
        body.lineTo(-2.04, -0.05);
        body.quadraticCurveTo(-2.16, -0.2, -2.06, -0.52);
        ctx.fillStyle = "#d93344";
        ctx.fill(body);
        setLineWidth(1.4);
        ctx.strokeStyle = "rgba(60, 9, 14, 0.86)";
        ctx.stroke(body);

        const cabin = new Path2D();
        cabin.moveTo(-0.88, 0.31);
        cabin.lineTo(-0.32, 0.86);
        cabin.lineTo(0.72, 0.84);
        cabin.lineTo(1.18, 0.28);
        cabin.closePath();
        ctx.fillStyle = "#cbd7e3";
        ctx.fill(cabin);
        ctx.strokeStyle = "rgba(20, 30, 40, 0.7)";
        ctx.stroke(cabin);

        ctx.fillStyle = "#7aa2b8";
        ctx.fillRect(-0.26, 0.37, 0.38, 0.35);
        ctx.fillRect(0.2, 0.37, 0.52, 0.34);
        ctx.fillStyle = "rgba(255,255,255,0.48)";
        ctx.fillRect(-0.18, 0.58, 0.72, 0.055);

        ctx.fillStyle = "#f4d35e";
        ctx.fillRect(1.78, -0.05, 0.16, 0.12);
        ctx.fillStyle = "#442025";
        ctx.fillRect(-2.04, -0.22, 0.12, 0.14);

        drawWheel(-1.22, -0.55, running ? car.x * 1.7 : 0);
        drawWheel(1.2, -0.55, running ? car.x * 1.7 : 0);

        if (impactEnergy > 1) {
          ctx.fillStyle = `rgba(255,255,255,${Math.min(0.22, impactEnergy * 0.000015)})`;
          ctx.fillRect(1.84, -0.3, 0.22, 0.55);
        }
        ctx.restore();
      }

      function drawWheel(x, y, spin) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-spin);
        ctx.fillStyle = "#111217";
        ctx.beginPath();
        ctx.arc(0, 0, 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#56606c";
        ctx.beginPath();
        ctx.arc(0, 0, 0.17, 0, Math.PI * 2);
        ctx.fill();
        setLineWidth(1);
        ctx.strokeStyle = "rgba(255,255,255,0.38)";
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = i * Math.PI / 3;
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * 0.26, Math.sin(a) * 0.26);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = `${p.color}${0.55 * alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1.2 - alpha * 0.2), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawForceOverlay() {
        if (!running && elapsed === 0) return;
        ctx.save();
        const y = Math.max(2.35, settings.wallRows * BRICK_H + 0.55);
        setLineWidth(2);
        ctx.strokeStyle = "rgba(63, 167, 214, 0.64)";
        ctx.fillStyle = "rgba(63, 167, 214, 0.75)";
        const start = { x: car.x + car.w * 0.5, y };
        const lengthM = clamp(Math.abs(car.vx) / settings.carSpeed, 0, 1) * 1.45;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(start.x + lengthM, start.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(start.x + lengthM, start.y);
        ctx.lineTo(start.x + lengthM - 0.16, start.y + 0.08);
        ctx.lineTo(start.x + lengthM - 0.16, start.y - 0.08);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawWorldLabels() {
        ctx.save();
        ctx.scale(1, -1);
        ctx.fillStyle = "rgba(235,240,248,0.72)";
        ctx.font = `${12 / view.scale}px ui-sans-serif, system-ui`;
        ctx.textAlign = "left";
        ctx.fillText("start", 0.22, -0.62);
        ctx.fillText("freestanding brick wall", wallStartX, -(settings.wallRows * BRICK_H + 0.42));
        ctx.restore();
      }

      function render() {
        drawBackground();
        beginWorld();
        drawTrack();
        drawWorldLabels();

        for (const b of bricks) drawBrick(b);
        drawCar();
        drawParticles();
        drawForceOverlay();

        ctx.restore();
        drawHudScale();
      }

      function drawHudScale() {
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const x = 18;
        const y = view.height - 28;
        const w = view.scale;
        ctx.fillStyle = "rgba(238,242,247,0.68)";
        ctx.fillRect(x, y, w, 2);
        ctx.fillRect(x, y - 5, 2, 12);
        ctx.fillRect(x + w, y - 5, 2, 12);
        ctx.font = "11px ui-sans-serif, system-ui";
        ctx.fillText("1 m", x + w + 8, y + 4);
        ctx.restore();
      }

      function frame(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const rawDt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;
        accumulator += rawDt;
        const fixed = 1 / 60;

        if (running || particles.length || elapsed > 0) {
          while (accumulator >= fixed) {
            stepPhysics(fixed);
            accumulator -= fixed;
          }
        } else {
          accumulator = 0;
          for (const b of bodies) {
            b.updateAABB();
            resolveGround(b);
          }
        }

        impactEnergy *= 0.94;
        updateTelemetry();
        render();
        requestAnimationFrame(frame);
      }

      testBtn.addEventListener("click", runTest);
      resetBtn.addEventListener("click", () => resetScene(true));
      window.addEventListener("resize", () => {
        resizeCanvas();
        updateView();
      });

      createSettingsUI();
      resizeCanvas();
      resetScene(false);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
