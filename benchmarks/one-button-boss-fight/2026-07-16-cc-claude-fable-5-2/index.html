<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fable 5</title>
<style>
  :root{
    --paper:#ede3cc; --ink:#191521; --ember:#ff9a3c; --ember2:#ffc86b;
    --hud-ink:#241d2e; --hud-dim:rgba(36,29,46,.55); --bar-bg:rgba(25,21,33,.14);
    --focus:#e0862e;
  }
  body[data-phase="3"]{ --hud-ink:#efe9fa; --hud-dim:rgba(239,233,250,.55); --bar-bg:rgba(239,233,250,.16); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:#141020; overflow:hidden; -webkit-user-select:none; user-select:none;
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif; color:var(--hud-ink);
    -webkit-tap-highlight-color:transparent;
  }
  #stage{ position:fixed; inset:0; touch-action:none; outline:none; cursor:pointer; }
  #stage:focus-visible{ outline:3px solid var(--focus); outline-offset:-4px; }
  #cv{ display:block; width:100%; height:100%; }

  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0; pointer-events:none; gap:10px;
    transition:color .8s;
  }
  .hud-col{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .hud-col.right{ align-items:flex-end; }
  .hud-col.mid{ align-items:center; flex:0 1 auto; }
  .hud-label{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--hud-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; transition:color .8s;
  }
  #brand{ font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--hud-dim); transition:color .8s; }
  #flames{ display:flex; gap:6px; }
  #flames svg{ width:20px; height:24px; fill:var(--ember); filter:drop-shadow(0 0 5px rgba(255,154,60,.55)); transition:opacity .45s, filter .45s; }
  #flames .out svg{ opacity:.14; fill:var(--hud-ink); filter:none; }
  .bar{
    position:relative; width:min(36vw,270px); height:11px; border:1.5px solid var(--hud-ink);
    border-radius:2px; background:var(--bar-bg); overflow:hidden; transition:border-color .8s, background .8s;
  }
  .bar i{ position:absolute; inset:0; transform-origin:left; display:block; }
  #bghost{ background:rgba(255,252,240,.75); transition:transform .7s cubic-bezier(.2,.7,.2,1) .25s; }
  #bfill{ background:linear-gradient(90deg,#241d2e,#4a2f4e); transition:transform .12s linear, background .8s; }
  body[data-phase="2"] #bfill{ background:linear-gradient(90deg,#38141c,#7c2733); }
  body[data-phase="3"] #bfill{ background:linear-gradient(90deg,#5e46a8,#9d7bff); }
  #pips{ display:flex; gap:8px; font-size:11px; letter-spacing:.18em; color:var(--hud-dim); }
  #pips b{ font-weight:normal; opacity:.32; transition:opacity .5s, color .5s, text-shadow .5s; }
  #pips b.on{ opacity:1; color:var(--ember); text-shadow:0 0 8px rgba(255,154,60,.6); }
  #combo{ font-size:14px; letter-spacing:.14em; color:var(--ember); min-height:20px; font-style:italic;
          text-shadow:0 0 10px rgba(255,154,60,.35); }

  /* ---------- captions ---------- */
  #caption{
    position:fixed; left:0; right:0; top:24%; text-align:center; pointer-events:none;
    font-style:italic; font-size:clamp(14px,2.4vw,21px); letter-spacing:.12em; color:var(--hud-ink);
    opacity:0; transition:opacity .5s; text-shadow:0 1px 0 rgba(255,252,240,.25); padding:0 20px;
  }
  #caption.show{ opacity:.92; }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; display:grid; place-items:center; pointer-events:none;
    opacity:0; transition:opacity .35s; padding:20px; text-align:center;
  }
  .overlay.show{ opacity:1; }
  .overlay .panel{ max-width:640px; }
  #ovTitle h1{
    margin:0 0 6px; font-weight:normal; font-size:clamp(46px,10vw,96px); letter-spacing:.06em; color:var(--hud-ink);
    text-shadow:0 2px 0 rgba(255,252,240,.35), 0 0 34px rgba(224,134,46,.22); line-height:1.02;
  }
  #ovTitle .who{ font-size:clamp(12px,1.9vw,15px); letter-spacing:.3em; text-transform:uppercase; color:var(--hud-dim); margin-bottom:26px; }
  .instruction{ font-size:clamp(14px,2.3vw,19px); font-style:italic; letter-spacing:.05em; color:var(--hud-ink); margin:0 0 22px; }
  .instruction kbd{
    font-family:inherit; font-style:normal; border:1.5px solid var(--hud-ink); border-radius:4px;
    padding:1px 8px; font-size:.85em; letter-spacing:.1em;
  }
  .begin{ font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--ember);
          animation:breathe 2.2s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.55} 50%{opacity:1} }
  #ovPause h2, #ovEnd h2{
    margin:0 0 10px; font-weight:normal; font-size:clamp(34px,7vw,64px); letter-spacing:.14em; color:var(--hud-ink);
  }
  .sub{ font-size:14px; letter-spacing:.2em; text-transform:uppercase; color:var(--hud-dim); }
  #stats{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px 26px; margin:20px 0 24px; }
  #stats div{ font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--hud-dim); }
  #stats div b{ display:block; font-size:24px; letter-spacing:.02em; color:var(--hud-ink); font-weight:normal; margin-top:2px; }
  #rank{ font-size:15px; letter-spacing:.3em; color:var(--ember); margin-bottom:18px; text-transform:uppercase; }

  #demoBadge{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(74px + env(safe-area-inset-bottom));
    font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--hud-dim);
    border:1px solid var(--hud-dim); border-radius:3px; padding:6px 14px; pointer-events:none; white-space:nowrap;
    opacity:0; transition:opacity .4s; background:rgba(255,252,240,.06); backdrop-filter:blur(2px);
  }
  #demoBadge.show{ opacity:1; animation:breathe 2.6s ease-in-out infinite; }

  /* ---------- controls ---------- */
  #controls{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:8px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  #controls button{
    pointer-events:auto; font-family:inherit; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--hud-ink); background:transparent; border:1.5px solid var(--hud-dim); border-radius:3px;
    padding:10px 16px; min-height:42px; cursor:pointer; transition:color .8s, border-color .3s, background .2s;
  }
  #controls button:hover{ border-color:var(--hud-ink); background:rgba(128,110,90,.1); }
  #controls button:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-color:var(--focus); }
  #controls button[aria-pressed="true"]{ border-color:var(--ember); color:var(--ember); }
  @media (max-width:640px){
    #controls{ gap:5px; }
    #controls button{ padding:9px 10px; font-size:11px; letter-spacing:.1em; }
    .bar{ width:32vw; }
    #brand{ letter-spacing:.2em; }
  }
  @media (prefers-reduced-motion: reduce){
    .begin, #demoBadge.show{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body data-phase="1">
  <div id="stage" tabindex="0" role="application"
       aria-label="Fable 5. One-button boss fight against Sumi the Ink Heron. Press Space, click, or touch to parry.">
    <canvas id="cv"></canvas>
  </div>

  <div id="hud">
    <div class="hud-col">
      <div class="hud-label">Lantern</div>
      <div id="flames"></div>
    </div>
    <div class="hud-col mid">
      <div id="brand">Fable 5</div>
      <div id="pips"><b>I</b><b>II</b><b>III</b></div>
      <div id="combo"></div>
    </div>
    <div class="hud-col right">
      <div class="hud-label">Sumi &middot; the Ink Heron</div>
      <div class="bar" role="img" aria-label="Boss ink remaining"><i id="bghost"></i><i id="bfill"></i></div>
    </div>
  </div>

  <div id="caption"></div>

  <div id="ovTitle" class="overlay show">
    <div class="panel">
      <h1>Fable 5</h1>
      <div class="who">the ink heron awaits</div>
      <p class="instruction">One button — <kbd>Space</kbd>, click, or touch: strike when the ring flashes ember.</p>
      <div class="begin">press to begin</div>
    </div>
  </div>
  <div id="ovPause" class="overlay">
    <div class="panel"><h2>Paused</h2><div class="sub">the ink holds its breath &middot; press pause to resume</div></div>
  </div>
  <div id="ovEnd" class="overlay">
    <div class="panel">
      <h2 id="endTitle">The Ink Settles</h2>
      <div class="sub" id="endSub"></div>
      <div id="stats"></div>
      <div id="rank"></div>
      <div class="begin">press to fight again</div>
    </div>
  </div>
  <div id="demoBadge">Demo &middot; press to play</div>

  <div id="controls">
    <button id="btnStart" type="button">Start</button>
    <button id="btnPause" type="button" aria-pressed="false">Pause</button>
    <button id="btnRestart" type="button">Restart</button>
    <button id="btnDemo" type="button" aria-pressed="false">Demo</button>
    <button id="btnSound" type="button" aria-pressed="false">Sound</button>
  </div>

  <div id="announcer" class="sr" role="status" aria-live="polite"></div>
  <noscript><p style="color:#ede3cc;padding:20px;font-family:serif">Fable 5 needs JavaScript to run.</p></noscript>

<script>
'use strict';
(function(){

/* =====================================================================
   Deterministic core — fixed 125 Hz timestep, seeded PRNG, pure Sim.
   ===================================================================== */
const TICK = 8;                       // ms per simulation tick
const CFG = {
  bossMax: 100, flames: 3,
  parryWindow: 160, parryRecover: 280, bufferMs: 100, invuln: 900, perfectMs: 70,
  introMs: 1700, transitionMs: 2400,
  p2at: 70, p3at: 38,
};
const BOSS_NAME = 'Sumi, the Ink Heron';
const DEFAULT_SEED = 7;

function mulberry32(a){
  a >>>= 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp = (a,b,t)=>a+(b-a)*t;
const eo = t=>1-Math.pow(1-t,3);            // ease out
const ei = t=>t*t*t;                        // ease in
const eio = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const r3 = v=>Math.round(v*1000)/1000;

function mkHit(kind, impactIn, dmg, extra){
  return Object.assign({
    kind, impactIn, dmg,
    parried:false, resolved:false, ghost:false, perfect:false,
    animT:0, cued:false, launched:false, launchedAt:0, seq:0,
  }, extra || {});
}

/* Attack patterns per phase. impactIn values are ms from pattern spawn. */
const PATTERNS = {
  1: [
    { id:'stab',     make:()=>[mkHit('stab', 980, 6)] },
    { id:'stabSlow', make:()=>[mkHit('stabSlow', 1380, 6)] },
  ],
  2: [
    { id:'stab',   make:()=>[mkHit('stab', 760, 5)] },
    { id:'double', make:()=>[mkHit('stab', 840, 4), mkHit('stab', 1310, 4)] },
    { id:'fan',    make:()=>[mkHit('feather', 1680, 4, {flight:880, wing:800}),
                             mkHit('feather', 2130, 4, {flight:880, wing:800, second:true})] },
  ],
  3: [
    { id:'crescendo', make:()=>[mkHit('stab', 800, 3), mkHit('stab', 1340, 3),
                                mkHit('sweep', 2240, 3), mkHit('slam', 3520, 12, {heavy:true})] },
    { id:'stormfall', make:()=>[mkHit('feather', 1620, 3, {flight:860, wing:760}),
                                mkHit('feather', 2100, 3, {flight:860, wing:760, second:true}),
                                mkHit('slam', 3480, 12, {heavy:true})] },
  ],
};
const COOLDOWN = { 1:[1500,500], 2:[1300,400], 3:[2100,400] };

class Sim {
  constructor(seed){ this.demo = false; this.reset(seed); }

  reset(seed){
    this.seed = (seed === undefined ? (this.seed ?? DEFAULT_SEED) : seed) >>> 0;
    this.rng = mulberry32((this.seed * 2654435761 >>> 0) ^ 0x9E3779B9);
    this.t = 0; this.tickN = 0; this.acc = 0;
    this.state = 'intro'; this.stateT = 0;
    this.phase = 1; this.pendingPhase = 0;
    this.paused = false;
    this.outcome = null;
    this.hitstop = 0;
    this.player = {
      flames: CFG.flames, parry: 0, parryUsed: false, recover: 0, invuln: 0,
      buffer: -1, anim: { swing:0, hurt:0, lunge:0 },
    };
    this.stats = { parries:0, perfects:0, whiffs:0, hits:0, combo:0, bestCombo:0 };
    this.boss = {
      hp: CFG.bossMax, cooldown: 1200, patternId: null, lastPattern: null,
      anim: { deflect:0, hurt:0 }, hitSeq: 0,
    };
    this.attacks = [];
    this.returns = [];
    this.events = [];
    this.pressLog = [];
    this.pressReq = false;
    this.demoMissDone = false;
  }

  setDemo(on){ this.demo = !!on; }
  press(){ this.pressReq = true; }

  step(ms){
    if (this.paused) return;
    ms = clamp(+ms || 0, 0, 120000);
    this.acc += ms;
    while (this.acc >= TICK){ this.acc -= TICK; this.tick(); }
  }

  emit(type, data){
    const e = data ? Object.assign({type}, data) : {type};
    this.events.push(e);
    if (this.events.length > 160) this.events.splice(0, this.events.length - 160);
  }

  nextImpactIn(){
    let m = Infinity;
    for (const a of this.attacks) if (!a.resolved && a.impactIn < m) m = a.impactIn;
    return m;
  }

  tick(){
    const dt = TICK;
    this.tickN++; this.t += dt;
    const P = this.player;

    if (this.pressReq){
      this.pressReq = false;
      P.buffer = 0;
      this.pressLog.push(this.t);
      if (this.pressLog.length > 600) this.pressLog.shift();
    }

    if (this.hitstop > 0){ this.hitstop = Math.max(0, this.hitstop - dt); return; }

    if (this.demo) this.demoThink();

    this.stateT += dt;
    if (this.state === 'intro' && this.stateT >= CFG.introMs){
      this.state = 'fight'; this.stateT = 0; this.emit('fightstart');
    } else if (this.state === 'transition' && this.stateT >= CFG.transitionMs){
      this.phase = this.pendingPhase; this.state = 'fight'; this.stateT = 0;
      this.boss.cooldown = 900;
      this.emit('phasebegin', { phase: this.phase });
    } else if ((this.state === 'victory' || this.state === 'defeat') && this.demo && this.stateT > 2800){
      const s = this.seed, d = this.demo;
      this.reset(s); this.demo = d;
      return;
    }

    // player timers
    if (P.parry > 0){
      P.parry = Math.max(0, P.parry - dt);
      if (P.parry === 0 && !P.parryUsed){
        P.recover = CFG.parryRecover;
        this.stats.whiffs++; this.stats.combo = 0;
        this.emit('whiff');
      }
    }
    if (P.recover > 0) P.recover = Math.max(0, P.recover - dt);
    if (P.invuln > 0) P.invuln = Math.max(0, P.invuln - dt);

    // buffered press activation (fight only)
    if (this.state === 'fight' && P.buffer >= 0 && P.parry <= 0 && P.recover <= 0){
      P.buffer = -1;
      P.parry = CFG.parryWindow; P.parryUsed = false;
      P.anim.swing = 220;
      this.emit('swing');
    } else if (P.buffer >= 0){
      P.buffer += dt;
      if (P.buffer > CFG.bufferMs) P.buffer = -1;
    }

    if (this.state === 'fight'){
      this.updateAttacks(dt);
      if (this.state === 'fight') this.updateReturns(dt);
      if (this.state === 'fight') this.updateBoss(dt);
    }

    // anim decay (frozen during hitstop by early return above)
    P.anim.swing = Math.max(0, P.anim.swing - dt);
    P.anim.hurt = Math.max(0, P.anim.hurt - dt);
    P.anim.lunge = Math.max(0, P.anim.lunge - dt);
    this.boss.anim.deflect = Math.max(0, this.boss.anim.deflect - dt);
    this.boss.anim.hurt = Math.max(0, this.boss.anim.hurt - dt);
    for (const a of this.attacks) if (a.resolved) a.animT += dt;
    this.attacks = this.attacks.filter(a => !a.resolved || a.animT < 900);
  }

  updateAttacks(dt){
    const P = this.player;
    for (const a of this.attacks){
      if (this.state !== 'fight') break;
      if (a.resolved) continue;
      a.impactIn -= dt;

      if (a.kind === 'feather' && !a.launched && a.impactIn <= a.flight){
        a.launched = true; a.launchedAt = this.t;
        this.emit('featherLaunch', { second: !!a.second });
      }
      if (!a.cued && a.impactIn <= 780){
        a.cued = true;
        this.emit('cue', { kind: a.kind, heavy: !!a.heavy });
      }

      if (a.impactIn <= 0){
        a.resolved = true; a.animT = 0;
        if (P.parry > 0){
          a.parried = true; P.parryUsed = true;
          const early = CFG.parryWindow - P.parry;      // ms between press and impact
          a.perfect = early <= CFG.perfectMs;
          P.parry = 0;
          const dmg = a.dmg + (a.perfect ? 1 : 0);
          this.stats.parries++; if (a.perfect) this.stats.perfects++;
          this.stats.combo++;
          if (this.stats.combo > this.stats.bestCombo) this.stats.bestCombo = this.stats.combo;
          if (a.kind === 'feather'){
            this.returns.push({ t:0, dur:640, dmg, done:false });
            this.hitstop = Math.max(this.hitstop, 50);
            this.emit('deflect', { perfect: a.perfect });
          } else if (a.kind === 'slam'){
            this.hitstop = 150;
            P.anim.lunge = 520;
            this.boss.anim.hurt = 650;
            this.emit('riposte', { perfect: a.perfect });
            this.damageBoss(dmg, 'riposte');
          } else {
            this.hitstop = a.perfect ? 95 : 70;
            this.boss.anim.deflect = 420;
            this.emit('parry', { perfect: a.perfect, kind: a.kind });
            this.damageBoss(dmg, 'parry');
          }
        } else if (P.invuln > 0){
          a.ghost = true;
          this.emit('whoosh', { kind: a.kind });
        } else {
          P.invuln = CFG.invuln;
          P.anim.hurt = 500;
          this.stats.hits++; this.stats.combo = 0;
          P.flames--;
          this.hitstop = Math.max(this.hitstop, a.kind === 'slam' ? 110 : 60);
          this.emit('hurt', { kind: a.kind, flames: P.flames });
          if (P.flames <= 0){ this.endFight('defeat'); return; }
        }
      }
    }
  }

  updateReturns(dt){
    for (const r of this.returns){
      if (this.state !== 'fight') break;
      if (r.done) { r.t += dt; continue; }
      r.t += dt;
      if (r.t >= r.dur){
        r.done = true;
        this.hitstop = Math.max(this.hitstop, 45);
        this.boss.anim.hurt = Math.max(this.boss.anim.hurt, 320);
        this.emit('featherHit');
        this.damageBoss(r.dmg, 'deflect');
      }
    }
    this.returns = this.returns.filter(r => !r.done || r.t < r.dur + 420);
  }

  updateBoss(dt){
    if (this.attacks.some(a => !a.resolved)) return;
    this.boss.cooldown -= dt;
    if (this.boss.cooldown <= 0) this.spawnPattern();
  }

  spawnPattern(){
    const list = PATTERNS[this.phase];
    let pick = list[Math.floor(this.rng() * list.length) % list.length];
    if (pick.id === this.boss.lastPattern && list.length > 1){
      pick = list[Math.floor(this.rng() * list.length) % list.length];
    }
    this.boss.lastPattern = pick.id;
    this.boss.patternId = pick.id;
    const hits = pick.make();
    for (const h of hits){ h.seq = ++this.boss.hitSeq; this.attacks.push(h); }
    const cd = COOLDOWN[this.phase];
    this.boss.cooldown = cd[0] + this.rng() * cd[1];
    this.emit('pattern', { id: pick.id, phase: this.phase });
  }

  damageBoss(dmg, cause){
    if (this.state !== 'fight') return;
    this.boss.hp = Math.max(0, this.boss.hp - dmg);
    this.emit('bossHurt', { dmg, cause });
    if (this.boss.hp <= 0){ this.endFight('victory'); return; }
    if (this.phase === 1 && this.boss.hp <= CFG.p2at) this.startTransition(2);
    else if (this.phase === 2 && this.boss.hp <= CFG.p3at) this.startTransition(3);
  }

  startTransition(p){
    this.state = 'transition'; this.stateT = 0; this.pendingPhase = p;
    this.attacks = []; this.returns = [];
    this.player.buffer = -1;
    this.emit('phase', { to: p });
  }

  endFight(result){
    this.state = result; this.stateT = 0; this.outcome = result;
    this.attacks = []; this.returns = [];
    this.player.buffer = -1;
    this.emit(result);
  }

  /* Deterministic autopilot: presses ~50 ms before the soonest real impact,
     through the exact same press() path a human uses. */
  demoThink(){
    if (this.state !== 'fight') return;
    const P = this.player;
    if (P.parry > 0 || P.recover > 0 || P.buffer >= 0) return;
    let soonest = Infinity, target = null;
    for (const a of this.attacks){
      if (!a.resolved && !a.demoSkip && a.impactIn < soonest){ soonest = a.impactIn; target = a; }
    }
    if (!target || soonest > 56) return;
    if (!this.demoMissDone && this.phase === 1 && target.seq === 2){
      this.demoMissDone = true; target.demoSkip = true; return;   // authored mistake: show a hit
    }
    this.press();
  }

  snapshot(){
    const s = this.stats;
    const denom = s.parries + s.whiffs + s.hits;
    const soonest = this.nextImpactIn();
    return {
      api: 'boss-fight/1',
      seed: this.seed,
      time: r3(this.t),
      tick: this.tickN,
      state: this.state,
      phase: this.phase,
      paused: this.paused,
      demo: this.demo,
      outcome: this.outcome,
      hitstopMs: r3(this.hitstop),
      player: {
        flames: this.player.flames, maxFlames: CFG.flames,
        parryMsLeft: r3(this.player.parry),
        recoverMsLeft: r3(this.player.recover),
        invulnMsLeft: r3(this.player.invuln),
        bufferedPress: this.player.buffer >= 0,
      },
      boss: {
        name: BOSS_NAME, hp: r3(this.boss.hp), maxHp: CFG.bossMax,
        pattern: this.boss.patternId, cooldownMs: r3(Math.max(0, this.boss.cooldown)),
      },
      attacks: this.attacks.filter(a => !a.resolved)
        .map(a => ({ kind: a.kind, impactInMs: r3(a.impactIn), dmg: a.dmg })),
      returningFeathers: this.returns.filter(r => !r.done).length,
      nextImpactMs: Number.isFinite(soonest) ? r3(soonest) : null,
      score: {
        parries: s.parries, perfects: s.perfects, whiffs: s.whiffs,
        hitsTaken: s.hits, combo: s.combo, bestCombo: s.bestCombo,
        accuracy: denom ? r3(s.parries / denom) : 1,
      },
    };
  }
}

/* =====================================================================
   Self-test — isolated Sim instances exercising the real systems.
   ===================================================================== */
function runSelfTest(){
  const tests = [];
  const T = (name, fn) => {
    try { tests.push({ name, passed: true, detail: fn() || 'ok' }); }
    catch (e) { tests.push({ name, passed: false, detail: String(e && e.message || e) }); }
  };
  const snapJSON = s => JSON.stringify(s.snapshot());
  const drain = s => { s.events.length = 0; };

  const runDemo = (seed, maxMs) => {
    const s = new Sim(seed); s.setDemo(true);
    const phases = new Set([1]);
    for (let t = 0; t < maxMs && !s.outcome; t += TICK){
      s.step(TICK); phases.add(s.phase); drain(s);
    }
    return { sim: s, phases };
  };

  const demo = runDemo(4242, 100000);

  T('deterministic reset', () => {
    const a = new Sim(1234); a.setDemo(true); a.step(30000); drain(a);
    const b = new Sim(999); b.step(5000); b.reset(1234); b.setDemo(true); b.step(30000); drain(b);
    if (snapJSON(a) !== snapJSON(b)) throw new Error('same seed + same inputs diverged');
    return 'identical snapshots after 30 s';
  });

  T('pause stops simulation time', () => {
    const s = new Sim(7); s.step(3000);
    const t0 = s.t;
    s.paused = true; s.step(2000);
    if (s.t !== t0) throw new Error('time advanced while paused');
    s.paused = false; s.step(160);
    if (s.t <= t0) throw new Error('time did not resume');
    return 'frozen while paused, resumes after';
  });

  T('phase progression', () => {
    if (!demo.phases.has(2) || !demo.phases.has(3)) throw new Error('phases seen: ' + [...demo.phases].join(','));
    return 'phases 1 → 2 → 3 reached';
  });

  T('success state reachable', () => {
    if (demo.sim.outcome !== 'victory') throw new Error('demo outcome: ' + demo.sim.outcome);
    if (demo.sim.t > 90000) throw new Error('run too long: ' + demo.sim.t);
    return 'victory at ' + (demo.sim.t / 1000).toFixed(1) + ' s';
  });

  T('failure state reachable', () => {
    const s = new Sim(4242);
    for (let t = 0; t < 60000 && !s.outcome; t += TICK){ s.step(TICK); drain(s); }
    if (s.outcome !== 'defeat') throw new Error('no-input outcome: ' + s.outcome);
    return 'defeat at ' + (s.t / 1000).toFixed(1) + ' s without input';
  });

  T('finite numeric state', () => {
    const bad = [];
    const walk = (o, p) => {
      if (typeof o === 'number'){ if (!Number.isFinite(o)) bad.push(p); }
      else if (Array.isArray(o)) o.forEach((v, i) => walk(v, p + '[' + i + ']'));
      else if (o && typeof o === 'object') for (const k in o) walk(o[k], p + '.' + k);
    };
    walk(demo.sim.snapshot(), 'win');
    const mid = new Sim(11); mid.setDemo(true); mid.step(20000); drain(mid);
    walk(mid.snapshot(), 'mid');
    if (bad.length) throw new Error('non-finite at ' + bad.join(', '));
    return 'all snapshot numbers finite';
  });

  T('instant restart restores initial state', () => {
    const fresh = new Sim(9);
    const s = new Sim(9); s.setDemo(true); s.step(25000); drain(s);
    s.reset(9); s.demo = false;
    if (snapJSON(s) !== snapJSON(fresh)) throw new Error('reset state differs from fresh state');
    s.step(4000); fresh.step(4000); drain(s); drain(fresh);
    if (snapJSON(s) !== snapJSON(fresh)) throw new Error('post-reset evolution differs');
    return 'reset ≡ fresh encounter';
  });

  T('demo uses the real gameplay systems', () => {
    const d = demo.sim;
    if (d.stats.parries < 8) throw new Error('demo barely interacted: ' + d.stats.parries + ' parries');
    const log = d.pressLog.slice();
    const r = new Sim(4242);           // no demo: replay the demo's press timings manually
    let i = 0;
    while (!r.outcome && r.t < d.t + 1000){
      if (i < log.length && log[i] === r.t + TICK){ r.press(); i++; }
      r.step(TICK); drain(r);
    }
    const a = d.snapshot(), b = r.snapshot();
    a.demo = b.demo = false;
    if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error('manual replay of demo inputs diverged');
    return 'demo inputs replayed manually → identical result (' + d.stats.parries + ' parries)';
  });

  return { passed: tests.every(t => t.passed), tests };
}

/* =====================================================================
   Renderer — sumi-e ink on parchment. Visual randomness uses its own
   seeded stream so gameplay determinism is never touched.
   ===================================================================== */
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
let RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
try {
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => { RM = e.matches; });
} catch (e) { /* older engines */ }

const PAL = {
  1: { paper:'#ede3cc', paper2:'#e0d1b2', ink:'#191521', ink2:'#2a2137', disc:'#e3a93f',
       accent:'#d8752b', eye:'#ffb545', mist:'rgba(25,21,33,0.05)' },
  2: { paper:'#e6d2ba', paper2:'#d3b898', ink:'#1b1420', ink2:'#331a2a', disc:'#c8444e',
       accent:'#c43b49', eye:'#ff5a63', mist:'rgba(50,20,32,0.06)' },
  3: { paper:'#332d47', paper2:'#241f36', ink:'#0d0a14', ink2:'#1c1430', disc:'#120c1e',
       accent:'#9d7bff', eye:'#c79bff', mist:'rgba(157,123,255,0.05)' },
};
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixHex(a, b, t){
  const A = hexRGB(a), B = hexRGB(b);
  return 'rgb(' + Math.round(lerp(A[0],B[0],t)) + ',' + Math.round(lerp(A[1],B[1],t)) + ',' + Math.round(lerp(A[2],B[2],t)) + ')';
}
function palAt(mix){ // mix: 1..3 float
  const lo = clamp(Math.floor(mix), 1, 3), hi = clamp(lo + 1, 1, 3), t = clamp(mix - lo, 0, 1);
  const a = PAL[lo], b = PAL[hi], out = {};
  for (const k in a) out[k] = k === 'mist' ? (t < .5 ? a[k] : b[k]) : mixHex(a[k], b[k], t);
  return out;
}

const EMBER = '#ff9a3c', EMBER2 = '#ffc86b', PAPERLIGHT = 'rgba(255,250,235,0.9)';

/* ---------- drawing helpers ---------- */
function bez(p0, c1, c2, p1, n){
  const out = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    out.push({
      x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x,
      y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y,
    });
  }
  return out;
}
function tapered(ctx, pts, w0, w1){
  if (pts.length < 2) return;
  const L = [], R = [], n = pts.length - 1;
  for (let i = 0; i <= n; i++){
    const p = pts[i], q = pts[Math.min(i+1, n)], o = pts[Math.max(i-1, 0)];
    let dx = q.x - o.x, dy = q.y - o.y;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = (w0 + (w1 - w0) * (i / n)) / 2;
    L.push({ x: p.x - dy*w, y: p.y + dx*w });
    R.push({ x: p.x + dy*w, y: p.y - dx*w });
  }
  ctx.beginPath();
  ctx.moveTo(L[0].x, L[0].y);
  for (const p of L) ctx.lineTo(p.x, p.y);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i].x, R[i].y);
  ctx.closePath(); ctx.fill();
}
function stroke2(ctx, x0,y0, cx,cy, x1,y1, w0, w1){
  tapered(ctx, bez({x:x0,y:y0},{x:cx,y:cy},{x:cx,y:cy},{x:x1,y:y1}, 12), w0, w1);
}
function blob(ctx, cx, cy, rx, ry, t, seed, amp){
  amp = amp === undefined ? 0.055 : amp;
  ctx.beginPath();
  const N = 16;
  for (let i = 0; i <= N; i++){
    const a = i / N * Math.PI * 2;
    const w = 1 + amp * Math.sin(a*3 + seed*7 + t*0.0013) + amp*0.6 * Math.sin(a*5 - seed*3 + t*0.0009);
    const x = cx + Math.cos(a) * rx * w, y = cy + Math.sin(a) * ry * w;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
function crescent(ctx, cx, cy, r, a0, a1, w){
  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a1);
  ctx.arc(cx, cy, r - w, a1, a0, true);
  ctx.closePath(); ctx.fill();
}

/* ---------- paper grain tile (seeded, generated once) ---------- */
const grain = document.createElement('canvas');
(function(){
  grain.width = grain.height = 224;
  const gg = grain.getContext('2d');
  const vr = mulberry32(0xC0FFEE);

  for (let i = 0; i < 26; i++){
    gg.beginPath();
    const y = vr()*224; gg.moveTo(0, y);
    gg.bezierCurveTo(70, y + vr()*8-4, 150, y + vr()*8-4, 224, y);
    gg.stroke();
  }
})();
let grainPattern = null;

/* ---------- renderer state ---------- */
const vrng = mulberry32(0xA11CE);
const R = {
  L: null,                      // layout
  cam: { x:0, y:0, vx:0, vy:0, zoom:1, zoomV:0 },
  particles: [],
  fx: [],                       // rings, slashes, floaters
  lantern: { a:0, v:0 },        // pendulum
  phaseMix: 1,
  flash: [0,0,0,0],             // r,g,b,alpha as [colorKey handled separately]
  flashColor: '255,180,90',
  dissolve: 0,
};

function layout(){
  const w = cv.clientWidth || 1, h = cv.clientHeight || 1;
  const narrow = w / h < 0.9;
  const worldW = narrow ? 830 : 1020, worldH = 640;
  const s = Math.min(w / worldW, h / worldH);
  const bossX = narrow ? 252 : 300, playerX = narrow ? 648 : 780;
  R.L = {
    w, h, s, narrow,
    groundY: 500, bossX, playerX,
    cx: (bossX + playerX) / 2, cy: 330,
    viewL: (bossX + playerX)/2 - (w/s)/2, viewR: (bossX + playerX)/2 + (w/s)/2,
    viewT: 330 - (h/s)/2, viewB: 330 + (h/s)/2,
  };
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
}

function shake(power){
  if (RM) return;
  R.cam.vx += (vrng() - 0.5) * power * 2;
  R.cam.vy += (vrng() - 0.5) * power * 2;
}
function zoomPunch(z){ if (!RM) R.cam.zoomV += z; }
function flash(color, a){ R.flashColor = color; R.flash[3] = Math.max(R.flash[3], RM ? Math.min(a, 0.08) : a); }

function spawn(n, fn){
  const count = Math.round(n * (RM ? 0.35 : 1));
  for (let i = 0; i < count; i++){
    if (R.particles.length > 420) R.particles.shift();
    R.particles.push(fn(i));
  }
}
function sparks(x, y, n, spread, col){
  spawn(n, () => {
    const a = vrng() * Math.PI * 2, sp = (0.18 + vrng() * 0.5) * spread;
    return { type:'spark', x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.12,
             life: 260 + vrng()*300, age:0, w: 1.4 + vrng()*1.8, col: col || EMBER };
  });
}
function inkBurst(x, y, n, spread, col){
  spawn(n, () => {
    const a = vrng() * Math.PI * 2, sp = (0.06 + vrng() * 0.3) * spread;
    return { type:'ink', x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.18,
             life: 500 + vrng()*500, age:0, r: 2 + vrng()*5, col };
  });
}
function dust(x, y, n){
  spawn(n, () => ({ type:'dust', x: x + (vrng()-0.5)*120, y, vx: (vrng()-0.5)*0.25, vy: -0.03 - vrng()*0.06,
                    life: 600 + vrng()*500, age:0, r: 6 + vrng()*14 }));
}
function ring(x, y, r0, r1, dur, col, w){
  R.fx.push({ type:'ring', x, y, r0, r1, dur, age:0, col, w: w || 3 });
  if (R.fx.length > 60) R.fx.shift();
}
function slashFx(x, y, r, a0, a1, dur, col){
  R.fx.push({ type:'slash', x, y, r, a0, a1, dur, age:0, col });
  if (R.fx.length > 60) R.fx.shift();
}
function floatText(x, y, text, col){
  R.fx.push({ type:'text', x, y, text, col, dur: 700, age: 0 });
}

/* ---------- event reactions (view + feel) ---------- */
function onEvent(ev, S){
  const L = R.L; if (!L) return;
  const px = L.playerX, gy = L.groundY;
  const clashX = px - 66, clashY = gy - 64;
  switch (ev.type){
    case 'swing':
      slashFx(px - 14, gy - 58, 46, -2.2, -0.4, 170, 'rgba(255,200,120,0.85)');
      break;
    case 'parry': {
      const p = ev.perfect;
      sparks(clashX, clashY, p ? 30 : 16, p ? 1.5 : 1.1, p ? EMBER2 : EMBER);
      inkBurst(clashX - 16, clashY - 8, 8, 0.9, null);
      ring(clashX, clashY, 6, p ? 84 : 58, 300, p ? EMBER2 : EMBER, p ? 4 : 3);
      shake(p ? 7 : 4);
      if (p){ flash('255,190,100', 0.14); zoomPunch(0.03); floatText(clashX, clashY - 46, 'perfect', EMBER2); }
      break;
    }
    case 'deflect':
      sparks(px - 34, gy - 58, 14, 1.0, EMBER);
      ring(px - 34, gy - 58, 5, 46, 260, EMBER, 3);
      shake(3.5);
      if (ev.perfect) floatText(px - 40, gy - 104, 'perfect', EMBER2);
      break;
    case 'featherHit':
      inkBurst(R.L.bossX + 90, gy - 250, 14, 1.2, null);
      sparks(R.L.bossX + 90, gy - 250, 8, 0.8, EMBER);
      shake(3);
      break;
    case 'riposte':
      sparks(L.bossX + 150, gy - 160, 44, 1.9, EMBER2);
      inkBurst(L.bossX + 120, gy - 180, 26, 1.7, null);
      slashFx(L.bossX + 140, gy - 170, 150, -2.6, 0.5, 260, 'rgba(255,210,140,0.95)');
      ring(L.bossX + 140, gy - 170, 10, 150, 420, EMBER2, 5);
      shake(13); zoomPunch(0.05); flash('255,190,100', 0.18);
      floatText(L.bossX + 150, gy - 250, 'riposte', EMBER2);
      break;
    case 'hurt':
      inkBurst(px, gy - 60, 20, 1.4, null);
      sparks(px, gy - 60, 8, 0.9, '#ff6a4a');
      shake(ev.kind === 'slam' ? 14 : 9);
      flash('180,40,30', 0.13);
      R.lantern.v += 0.35;
      if (ev.kind === 'slam'){ ring(px - 40, gy, 20, 200, 500, 'rgba(40,30,50,0.5)', 6); dust(px - 60, gy, 16); }
      break;
    case 'whoosh':
      slashFx(px - 60, gy - 70, 60, 2.6, 3.6, 200, 'rgba(90,80,110,0.4)');
      break;
    case 'whiff':
      spawn(4, () => ({ type:'dust', x: px - 20 + (vrng()-0.5)*30, y: gy - 60, vx:(vrng()-0.5)*0.1,
                        vy:-0.05, life:400, age:0, r:5 + vrng()*6 }));
      break;
    case 'bossHurt':
      if (ev.cause !== 'riposte') inkBurst(L.bossX + 110, gy - 240, 10, 1.1, null);
      break;
    case 'featherLaunch':
      spawn(3, () => ({ type:'dust', x: L.bossX + 40, y: gy - 300, vx:(vrng()-0.5)*0.15, vy:-0.06,
                        life:350, age:0, r:5 + vrng()*5 }));
      break;
    case 'phase':
      ring(L.bossX, gy - 180, 30, 420, 900, 'rgba(255,252,240,0.7)', 7);
      flash('255,250,235', 0.16);
      shake(8);
      R.dissolve = 0;
      break;
    case 'slamRise':
      dust(L.bossX, gy, 10);
      break;
    case 'victory':
      flash('255,220,150', 0.22);
      ring(L.bossX, gy - 180, 20, 500, 1400, EMBER2, 6);
      inkBurst(L.bossX, gy - 200, 60, 2.2, null);
      sparks(L.bossX, gy - 200, 40, 2, EMBER2);
      shake(10);
      break;
    case 'defeat':
      flash('20,10,20', 0.3);
      shake(6);
      break;
    case 'hurtBoss': break;
    default: break;
  }
}

/* ---------- boss pose ---------- */
function bossPose(S, t, L){
  const gy = L.groundY, bx = L.bossX;
  const P = {
    ox: 0, oy: 0, lift: 0,
    head: { x: bx + 112 + Math.sin(t*0.0011)*7, y: gy - 268 + Math.sin(t*0.0017)*5 },
    gape: 0.12 + 0.04*Math.sin(t*0.0021),
    wing: 0, wingBack: 0, crest: 0.2, eye: 0.55, shiver: 0,
  };
  const hurtA = S.boss.anim.hurt, deflA = S.boss.anim.deflect;

  if (S.state === 'transition'){
    const q = clamp(S.stateT / CFG.transitionMs, 0, 1);
    const rise = Math.sin(Math.min(1, q * 1.6) * Math.PI);
    P.head.x = bx + 60 - rise * 30;
    P.head.y = gy - 300 - rise * 40;
    P.gape = 0.2 + rise * 0.75;
    P.crest = rise; P.eye = 1; P.wing = rise * 0.9;
    P.shiver = rise * 0.7;
  } else if (S.state === 'victory'){
    const q = clamp(S.stateT / 2400, 0, 1);
    P.head.y += q * 150; P.head.x -= q * 40;
    P.gape = 0.5; P.eye = 1 - q; P.lift = -q * 10;
  } else if (S.state === 'defeat'){
    P.head.x = bx + 130; P.head.y = gy - 300 + Math.sin(t*0.0012)*6;
    P.crest = 0.6; P.eye = 1;
  }

  // wind-up from soonest unresolved hit
  let up = null;
  for (const a of S.attacks) if (!a.resolved && (!up || a.impactIn < up.impactIn)) up = a;
  if (up && S.state === 'fight'){
    if (up.kind === 'feather'){
      const rem = up.impactIn - up.flight;
      if (rem > 0) P.wing = Math.max(P.wing, clamp(1 - rem / up.wing, 0, 1));
      else P.wing = Math.max(P.wing, clamp(1 - (S.t - up.launchedAt) / 400, 0, 1) * 0.7);
    } else if (up.kind === 'slam'){
      const c = clamp(1 - up.impactIn / 1050, 0, 1);
      P.lift = eo(c) * 175;
      P.wing = Math.max(P.wing, eo(c));
      P.gape = 0.14 + c * 0.5; P.eye = 1; P.crest = c;
      P.head.x = bx + 90 - c * 40; P.head.y = gy - 300 - eo(c) * 120;
      if (up.impactIn <= 240){
        const d = ei(1 - up.impactIn / 240);
        P.ox = d * (L.playerX - 150 - bx);
        P.lift = 175 * (1 - d);
        P.head.x = bx + 90 + d * 40; P.head.y = gy - 300 + d * 170;
        P.gape = 0.7;
      }
    } else if (up.kind === 'sweep'){
      const c = clamp(1 - up.impactIn / 720, 0, 1);
      P.wing = Math.max(P.wing, c); P.wingBack = c;
      P.head.x -= c * 30; P.eye = 0.55 + c * 0.45;
    } else { // stab / stabSlow: coil back
      const c = eo(clamp(1 - up.impactIn / 580, 0, 1));
      P.head.x -= c * 76; P.head.y -= c * 60;
      P.crest = Math.max(P.crest, c); P.gape = 0.12 + c * 0.36;
      P.eye = 0.55 + c * 0.45;
    }
  }

  // most recent resolved hit (strike / deflect / slam anims)
  let rec = null;
  for (const a of S.attacks) if (a.resolved && (!rec || a.animT < rec.animT)) rec = a;
  if (rec && rec.animT < 560 && S.state !== 'transition'){
    const k = rec.animT;
    if (rec.kind === 'slam'){
      const D = L.playerX - 150 - L.bossX;
      if (rec.parried){
        const q = clamp(k / 520, 0, 1);
        P.ox = D * (1 - eo(q));
        P.oy = -Math.sin(q * Math.PI) * 66;
        P.shiver = 1 - q;
        P.head.x = L.bossX + 60; P.head.y = gy - 240 + Math.sin(q * 22) * 8 * (1 - q);
        P.gape = 0.8;
      } else {
        const q = clamp(k / 560, 0, 1);
        const back = q < 0.35 ? 0 : eo((q - 0.35) / 0.65);
        P.ox = D * (1 - back);
        P.head.x = bx + 130; P.head.y = gy - 140 - back * 150;
        P.gape = 0.4;
      }
    } else if (rec.parried){
      const q = clamp(k / 420, 0, 1);
      P.head.x -= Math.sin(q * Math.PI) * 90 * (1 - q * 0.4);
      P.head.y -= Math.sin(q * Math.PI) * 70;
      P.head.x += Math.sin(q * 26) * 5 * (1 - q);
      P.gape = 0.55; P.eye = 1;
    } else if (rec.kind !== 'feather'){
      const th = k < 110 ? eo(k / 110) : clamp(1 - (k - 110) / 340, 0, 1);
      const tx = rec.ghost ? L.playerX - 130 : L.playerX - 62;
      P.head.x = lerp(P.head.x, tx, th);
      P.head.y = lerp(P.head.y, gy - 66, th);
      P.gape = 0.04;
    }
  }

  if (hurtA > 0){
    const s = hurtA / 650;
    P.shiver = Math.max(P.shiver, s);
    P.head.x -= s * 20; P.head.y -= s * 8;
  }
  if (deflA > 0) P.eye = 1;
  if (P.shiver > 0){
    P.ox += Math.sin(t * 0.11) * 3.4 * P.shiver;
    P.oy += Math.cos(t * 0.09) * 2.2 * P.shiver;
  }
  return P;
}

function drawBoss(S, t, pal, L){
  const gy = L.groundY, bx = L.bossX;
  const P = bossPose(S, t, L);
  let alpha = 1;
  if (S.state === 'victory'){
    alpha = clamp(1 - S.stateT / 2200, 0, 1);
    if (!RM && S.stateT < 2200 && (S.tickN & 3) === 0){
      inkBurst(bx + (vrng()-0.5)*160, gy - 120 - vrng()*220, 1, 1, null);
    }
  }
  if (alpha <= 0) return;

  g.save();
  g.globalAlpha = alpha;
  g.translate(P.ox, P.oy - P.lift);
  g.fillStyle = pal.ink;

  const bodyX = bx, bodyY = gy - 158 + Math.sin(t * 0.0016) * 3;

  // tail plumes
  for (let i = 0; i < 4; i++){
    const sw = Math.sin(t * 0.0012 + i * 1.7) * 10;
    stroke2(g, bodyX - 40, bodyY - 10 + i * 14,
            bodyX - 130 - i * 16, bodyY - 46 + i * 22 + sw,
            bodyX - 190 - i * 22, bodyY - 20 + i * 26 + sw * 1.4,
            16 - i * 2, 1.5);
  }

  // legs
  const legLift = clamp(P.lift / 175, 0, 1);
  g.save();
  g.globalAlpha = alpha * 0.95;
  stroke2(g, bodyX - 16, bodyY + 46, bodyX - 22, bodyY + 96 + legLift*22, bodyX - 26, gy - 4 + legLift * 40, 7, 3);
  stroke2(g, bodyX + 22, bodyY + 46, bodyX + 30, bodyY + 92 + legLift*26, bodyX + 34, gy - 2 + legLift * 46, 7, 3);
  g.restore();

  // body
  blob(g, bodyX, bodyY, 98, 74, t, 3, 0.05);
  // folded wing hint
  g.fillStyle = pal.ink2;
  stroke2(g, bodyX - 60, bodyY - 30, bodyX + 10, bodyY - 52, bodyX + 68, bodyY - 18, 26, 4);
  g.fillStyle = pal.ink;

  // raised wing fan
  if (P.wing > 0.02){
    const pivX = bodyX + 30, pivY = bodyY - 40;
    const back = P.wingBack * 0.8;
    for (let i = 0; i < 6; i++){
      const f = i / 5;
      const ang = -0.25 - (P.wing * (0.5 + f * 1.25)) + back * 0.9;
      const len = (130 + f * 95) * (0.35 + P.wing * 0.65);
      const ex = pivX + Math.cos(ang) * len, ey = pivY + Math.sin(ang) * len;
      stroke2(g, pivX, pivY, (pivX+ex)/2 + 14, (pivY+ey)/2 - 26, ex, ey, 17 - i * 1.6, 1.5);
    }
  }

  // neck
  const nb = { x: bodyX + 36, y: bodyY - 52 };
  const H = P.head;
  const midX = lerp(nb.x, H.x, 0.4), midY = Math.min(nb.y, H.y) - 60;
  const pts = bez(nb, { x: midX - 30, y: midY }, { x: lerp(nb.x, H.x, 0.8), y: H.y - 26 }, H, 16);
  tapered(g, pts, 36, 15);

  // head
  blob(g, H.x, H.y, 25, 21, t, 8, 0.05);
  // crest plumes
  for (let i = 0; i < 3; i++){
    const c = P.crest;
    stroke2(g, H.x - 8, H.y - 12,
            H.x - 40 - i * 12 - c * 16, H.y - 30 - i * 8 - c * 22,
            H.x - 66 - i * 18 - c * 26, H.y - 22 - i * 12 - c * 30,
            7 - i, 1);
  }
  // beak
  const bl = 62, gape = P.gape;
  g.beginPath();
  g.moveTo(H.x + 12, H.y - 8);
  g.lineTo(H.x + bl, H.y - gape * 16);
  g.lineTo(H.x + 14, H.y - 1);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(H.x + 12, H.y + 7);
  g.lineTo(H.x + bl - 6, H.y + 4 + gape * 16);
  g.lineTo(H.x + 14, H.y + 1);
  g.closePath(); g.fill();

  // eye
  const er = 5.5 + P.eye * 3;
  const eg = g.createRadialGradient(H.x + 6, H.y - 5, 0, H.x + 6, H.y - 5, er * 2.6);
  eg.addColorStop(0, pal.eye);
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = eg;
  g.beginPath(); g.arc(H.x + 6, H.y - 5, er * 2.6, 0, 7); g.fill();
  g.fillStyle = pal.eye;
  g.beginPath(); g.arc(H.x + 6, H.y - 5, er, 0, 7); g.fill();
  g.fillStyle = pal.ink;
  g.beginPath(); g.ellipse(H.x + 6, H.y - 5, 1.6, er * 0.8, 0, 0, 7); g.fill();

  g.restore();

  // ink pool + drips under boss
  g.save();
  g.globalAlpha = 0.8 * alpha;
  g.fillStyle = pal.ink2;
  g.beginPath(); g.ellipse(bx + P.ox * 0.9, gy + 8, 150 + P.lift * 0.2, 17, 0, 0, 7); g.fill();
  g.restore();
}

/* ---------- feathers ---------- */
function drawFeather(x, y, rot, col, edge){
  g.save();
  g.translate(x, y); g.rotate(rot);
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(-20, 0);
  g.quadraticCurveTo(0, -7, 20, 0);
  g.quadraticCurveTo(0, 7, -20, 0);
  g.closePath(); g.fill();
  g.strokeStyle = edge; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(-17, 0); g.lineTo(17, 0); g.stroke();
  g.restore();
}
function drawProjectiles(S, t, pal, L){
  const gy = L.groundY;
  const from = { x: L.bossX + 60, y: gy - 320 };
  const to = { x: L.playerX - 28, y: gy - 58 };
  for (const a of S.attacks){
    if (a.kind !== 'feather' || !a.launched || a.resolved) continue;
    const p = clamp(1 - a.impactIn / a.flight, 0, 1);
    const x = lerp(from.x, to.x, p), y = lerp(from.y, to.y, p) - Math.sin(p * Math.PI) * 46;
    const ang = Math.atan2(to.y - from.y, to.x - from.x) + Math.sin(t * 0.02 + a.seq) * 0.2;
    drawFeather(x, y, ang, pal.ink, pal.accent);
    if (!RM && (S.tickN & 7) === 0) inkBurst(x - 10, y, 1, 0.3, null);
  }
  const bH = { x: L.bossX + 100, y: gy - 260 };
  for (const r of S.returns){
    if (r.done) continue;
    const p = clamp(r.t / r.dur, 0, 1);
    const x = lerp(to.x - 10, bH.x, p), y = lerp(to.y, bH.y, p) - Math.sin(p * Math.PI) * 60;
    drawFeather(x, y, t * 0.03, EMBER, EMBER2);
    if (!RM && (S.tickN & 3) === 0) sparks(x, y, 1, 0.3, EMBER);
  }
}

/* ---------- player ---------- */
function drawPlayer(S, t, pal, L){
  const gy = L.groundY, px = L.playerX;
  const A = S.player.anim;
  let dx = 0, dy = 0, rot = 0;

  if (A.lunge > 0){
    const k = 520 - A.lunge;
    if (k < 120) dx = -eo(k / 120) * 150;
    else if (k < 260) dx = -150;
    else dx = -150 * (1 - eio((k - 260) / 260));
  }
  if (A.hurt > 0){
    const q = A.hurt / 500;
    rot = 0.3 * q; dx += 16 * q;
  }
  const swing = A.swing > 0 ? (220 - A.swing) / 220 : -1;   // 0..1 during swing
  if (swing >= 0 && swing < 0.4) rot -= 0.14 * (swing / 0.4);

  const bob = Math.sin(t * 0.0023) * 2;
  const kneel = S.state === 'defeat' ? clamp(S.stateT / 900, 0, 1) : 0;

  g.save();
  if (S.player.invuln > 0 && S.state === 'fight'){
    g.globalAlpha = (Math.floor(S.t / 70) % 2) ? 0.55 : 0.95;
  }
  g.translate(px + dx, gy + kneel * 12);
  g.rotate(rot + kneel * 0.25);

  // shadow
  g.fillStyle = 'rgba(20,15,25,0.25)';
  g.beginPath(); g.ellipse(0, 2, 34, 6, 0, 0, 7); g.fill();

  // cloak
  g.fillStyle = pal.ink;
  const hem = Math.sin(t * 0.004) * 4, hem2 = Math.sin(t * 0.0031 + 2) * 5;
  g.beginPath();
  g.moveTo(-4, -78 + bob);
  g.bezierCurveTo(-26, -60 + bob, -30 + hem, -24, -26 + hem2, 0);
  g.lineTo(20 - hem, 0);
  g.bezierCurveTo(22, -30, 16, -60 + bob, 6, -78 + bob);
  g.closePath(); g.fill();

  // head + hat
  blob(g, 0, -86 + bob, 9, 9, t, 5, 0.04);
  g.save();
  g.translate(0, -93 + bob);
  g.rotate(-0.06 + rot * 0.6);
  g.beginPath(); g.ellipse(0, 0, 26, 6.5, 0, Math.PI, 0); g.fill();
  g.beginPath(); g.ellipse(0, -3, 12, 6, 0, Math.PI, 0); g.fill();
  g.restore();

  // blade
  const bx0 = -8, by0 = -46 + bob;
  if (swing >= 0){
    const sa = lerp(2.4, 0.35, eo(Math.min(1, swing * 1.4)));
    const ex = bx0 - Math.cos(sa) * 54, ey = by0 - Math.sin(sa) * 54;
    g.strokeStyle = PAPERLIGHT; g.lineWidth = 3.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(bx0, by0); g.lineTo(ex, ey); g.stroke();
    g.strokeStyle = 'rgba(255,170,80,0.6)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(bx0, by0); g.lineTo(ex, ey); g.stroke();
  } else if (S.player.parry > 0){
    g.strokeStyle = PAPERLIGHT; g.lineWidth = 3;
    g.beginPath(); g.moveTo(bx0, by0); g.lineTo(bx0 - 44, by0 - 34); g.stroke();
  } else if (!kneel){
    g.strokeStyle = 'rgba(240,235,220,0.55)'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(-2, -40 + bob); g.lineTo(-30, -18 + bob); g.stroke();
  }
  g.restore();

  // lantern on a staff, planted beside the player
  const lx = px + 56;
  R.lantern.v -= R.lantern.a * 0.004;
  R.lantern.v *= 0.97;
  R.lantern.a += R.lantern.v;
  const la = R.lantern.a + Math.sin(t * 0.0019) * 0.05;
  g.strokeStyle = pal.ink; g.lineWidth = 3.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(lx, gy); g.lineTo(lx, gy - 92); g.quadraticCurveTo(lx, gy - 106, lx - 14, gy - 105); g.stroke();
  const hx = lx - 14 + Math.sin(la) * 9, hy = gy - 100 + Math.abs(Math.cos(la)) * 2;
  const flames = S.player.flames;
  const glow = flames <= 0 ? 0 : (0.35 + flames / CFG.flames * 0.65);
  const flick = flames === 1 ? (0.7 + 0.3 * Math.sin(t * 0.02)) : 1;
  g.strokeStyle = pal.ink; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(lx - 14, gy - 105); g.lineTo(hx, hy); g.stroke();
  g.fillStyle = pal.ink;
  g.fillRect(hx - 7, hy, 14, 18);
  if (glow > 0){
    const gl = g.createRadialGradient(hx, hy + 9, 1, hx, hy + 9, 46 * glow * flick);
    gl.addColorStop(0, 'rgba(255,190,100,' + (0.5 * glow * flick) + ')');
    gl.addColorStop(1, 'rgba(255,150,60,0)');
    g.fillStyle = gl;
    g.beginPath(); g.arc(hx, hy + 9, 46 * glow * flick, 0, 7); g.fill();
    g.fillStyle = EMBER2;
    g.beginPath(); g.ellipse(hx, hy + 9, 3.4 * flick, 5 * flick, 0, 0, 7); g.fill();
  }
  if (!RM && flames > 0 && (S.tickN % 40) === 0){
    spawn(1, () => ({ type:'mote', x: hx, y: hy + 4, vx:(vrng()-0.5)*0.04, vy:-0.05 - vrng()*0.04,
                      life: 1400, age:0, r: 1.2 + vrng()*1.4 }));
  }
}

/* ---------- timing ring ---------- */
function drawRing(S, t, L){
  if (S.state !== 'fight') return;
  const cx = L.playerX - 8, cy = L.groundY - 60, r = 54;
  const P = S.player;
  if (P.recover > 0){
    g.strokeStyle = 'rgba(120,110,130,0.55)'; g.lineWidth = 2.5;
    g.setLineDash([6, 8]);
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    g.setLineDash([]);
    return;
  }
  const imp = S.nextImpactIn();
  if (!Number.isFinite(imp) || imp > 950){
    if (P.parry > 0){
      g.strokeStyle = 'rgba(255,180,90,0.8)'; g.lineWidth = 3;
      g.beginPath(); g.arc(cx, cy, r - 4, 0, 7); g.stroke();
    }
    return;
  }
  const frac = clamp(imp / 950, 0, 1);
  const hot = frac < 0.18;
  g.strokeStyle = hot ? EMBER2 : 'rgba(60,50,70,0.55)';
  g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
  g.strokeStyle = hot ? EMBER2 : EMBER;
  g.lineWidth = hot ? 5 : 3.5;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + (1 - frac) * Math.PI * 2);
  g.stroke();
  if (hot){
    g.save();
    g.globalAlpha = 0.5 + 0.5 * Math.sin(t * 0.04);
    g.strokeStyle = EMBER2; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, r + 8, 0, 7); g.stroke();
    g.restore();
  }
}

/* ---------- background / arena ---------- */
function drawBackground(S, t, pal, L){
  const gy = L.groundY;
  // paper wash
  const sky = g.createLinearGradient(0, L.viewT, 0, gy + 40);
  sky.addColorStop(0, pal.paper);
  sky.addColorStop(1, pal.paper2);
  g.fillStyle = sky;
  g.fillRect(L.viewL - 4, L.viewT - 4, (L.viewR - L.viewL) + 8, (L.viewB - L.viewT) + 8);

  // great disc (sun / blood moon / eclipse)
  const dx = L.bossX + 40, dy = gy - 330;
  const mix = R.phaseMix;
  const dg = g.createRadialGradient(dx, dy, 10, dx, dy, 170);
  dg.addColorStop(0, pal.disc);
  dg.addColorStop(0.82, pal.disc);
  dg.addColorStop(1, 'rgba(0,0,0,0)');
  g.save();
  g.globalAlpha = 0.85;
  g.fillStyle = dg;
  g.beginPath(); g.arc(dx, dy, 170, 0, 7); g.fill();
  if (mix > 2.15){ // eclipse corona
    const c = clamp((mix - 2.15) / 0.85, 0, 1);
    g.globalAlpha = c * (0.55 + 0.12 * Math.sin(t * 0.002));
    g.strokeStyle = pal.accent; g.lineWidth = 3;
    g.beginPath(); g.arc(dx, dy, 128, 0, 7); g.stroke();
    g.globalAlpha = c * 0.25;
    g.lineWidth = 10;
    g.beginPath(); g.arc(dx, dy, 136, 0, 7); g.stroke();
  }
  g.restore();

  // distant broken gate
  g.save();
  g.globalAlpha = 0.13;
  g.fillStyle = pal.ink;
  const gx = L.bossX - 165;
  g.fillRect(gx - 60, gy - 285, 16, 285);
  g.fillRect(gx + 60, gy - 245, 16, 245);
  g.save();
  g.translate(gx, gy - 285); g.rotate(-0.045);
  g.fillRect(-105, -6, 210, 15);
  g.fillRect(-84, 26, 168, 9);
  g.restore();
  g.restore();

  // mist bands
  g.save();
  g.fillStyle = pal.mist;
  for (let i = 0; i < 3; i++){
    const y = gy - 60 - i * 90 + Math.sin(t * 0.0002 + i * 2) * 8;
    const off = Math.sin(t * 0.00013 + i) * 60;
    g.beginPath();
    g.ellipse(L.cx + off, y, (L.viewR - L.viewL) * 0.42, 17 + i * 6, 0, 0, 7);
    g.fill();
  }
  g.restore();

  // ground
  const gr = g.createLinearGradient(0, gy - 6, 0, L.viewB);
  gr.addColorStop(0, 'rgba(25,18,28,0.16)');
  gr.addColorStop(1, 'rgba(25,18,28,0.34)');
  g.fillStyle = gr;
  g.fillRect(L.viewL - 4, gy, (L.viewR - L.viewL) + 8, (L.viewB - gy) + 8);
  g.strokeStyle = pal.ink; g.lineWidth = 2.6;
  g.globalAlpha = 0.6;
  g.beginPath(); g.moveTo(L.viewL, gy); g.lineTo(L.viewR, gy); g.stroke();
  g.globalAlpha = 1;

  // brush grass tufts
  g.fillStyle = pal.ink;
  for (let i = 0; i < 9; i++){
    const x = L.viewL + 40 + i * (L.viewR - L.viewL - 80) / 8;
    const sw = Math.sin(t * 0.0016 + i * 2.4) * 5;
    g.globalAlpha = 0.4;
    stroke2(g, x, gy + 2, x + 4 + sw * 0.4, gy - 14, x + 8 + sw, gy - 24 - (i % 3) * 5, 3.5, 0.5);
  }
  g.globalAlpha = 1;

  // stone lantern near player
  g.save();
  g.globalAlpha = 0.28;
  g.fillStyle = pal.ink;
  const sx = L.playerX + 128;
  g.fillRect(sx - 6, gy - 44, 12, 44);
  g.fillRect(sx - 15, gy - 56, 30, 12);
  g.fillRect(sx - 10, gy - 70, 20, 14);
  g.beginPath(); g.moveTo(sx - 18, gy - 70); g.lineTo(sx, gy - 84); g.lineTo(sx + 18, gy - 70); g.closePath(); g.fill();
  g.restore();
}

/* ---------- particles & fx ---------- */
function updateParticles(dtp){
  const arr = R.particles;
  for (let i = arr.length - 1; i >= 0; i--){
    const p = arr[i];
    p.age += dtp;
    if (p.age >= p.life){ arr.splice(i, 1); continue; }
    p.x += p.vx * dtp; p.y += p.vy * dtp;
    if (p.type === 'ink') p.vy += 0.0012 * dtp;
    if (p.type === 'spark'){ p.vx *= Math.pow(0.996, dtp); p.vy *= Math.pow(0.996, dtp); }
  }
}
function drawParticles(pal){
  for (const p of R.particles){
    const q = 1 - p.age / p.life;
    if (p.type === 'spark'){
      g.strokeStyle = p.col; g.globalAlpha = q;
      g.lineWidth = p.w * q + 0.4; g.lineCap = 'round';
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 26, p.y - p.vy * 26); g.stroke();
    } else if (p.type === 'ink'){
      g.fillStyle = pal.ink; g.globalAlpha = q * 0.85;
      g.beginPath(); g.arc(p.x, p.y, p.r * (0.5 + q * 0.5), 0, 7); g.fill();
    } else if (p.type === 'dust'){
      g.fillStyle = 'rgba(120,100,90,0.35)'; g.globalAlpha = q * 0.5;
      g.beginPath(); g.arc(p.x, p.y, p.r * (1.4 - q * 0.4), 0, 7); g.fill();
    } else if (p.type === 'mote'){
      g.fillStyle = EMBER2; g.globalAlpha = q * 0.8;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
    }
  }
  g.globalAlpha = 1;
}
function drawFx(dtp){
  const arr = R.fx;
  for (let i = arr.length - 1; i >= 0; i--){
    const f = arr[i];
    f.age += dtp;
    if (f.age >= f.dur){ arr.splice(i, 1); continue; }
    const q = f.age / f.dur;
    if (f.type === 'ring'){
      g.strokeStyle = f.col; g.globalAlpha = (1 - q);
      g.lineWidth = f.w * (1 - q) + 0.6;
      g.beginPath(); g.arc(f.x, f.y, lerp(f.r0, f.r1, eo(q)), 0, 7); g.stroke();
    } else if (f.type === 'slash'){
      g.fillStyle = f.col; g.globalAlpha = 1 - q;
      const sweepEnd = lerp(f.a0, f.a1, eo(Math.min(1, q * 2)));
      crescent(g, f.x, f.y, f.r, f.a0, sweepEnd, 10 * (1 - q * 0.6) + 2);
    } else if (f.type === 'text'){
      g.globalAlpha = 1 - q;
      g.fillStyle = f.col;
      g.font = 'italic 19px Georgia, serif';
      g.textAlign = 'center';
      g.fillText(f.text, f.x, f.y - q * 24);
    }
  }
  g.globalAlpha = 1;
}

/* ---------- master draw ---------- */
function draw(S, now, dtR){
  if (!R.L) layout();
  const L = R.L;
  const dtp = dtR * (S.hitstop > 0 ? 0.15 : 1);

  // phase mix eases toward current phase (or pending during transition)
  const target = S.state === 'transition'
    ? lerp(S.phase, S.pendingPhase, eio(clamp(S.stateT / CFG.transitionMs, 0, 1)))
    : S.phase;
  R.phaseMix += (target - R.phaseMix) * Math.min(1, dtR * 0.004);
  const pal = palAt(R.phaseMix);

  // camera springs
  const c = R.cam;
  c.vx += -c.x * 0.16 * (dtR / 16); c.vy += -c.y * 0.16 * (dtR / 16);
  c.vx *= Math.pow(0.86, dtR / 16); c.vy *= Math.pow(0.86, dtR / 16);
  c.x += c.vx * (dtR / 16); c.y += c.vy * (dtR / 16);
  c.zoomV *= Math.pow(0.86, dtR / 16);
  c.zoom = 1 + c.zoomV;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, L.w, L.h);

  // world transform
  const sc = L.s * c.zoom;
  g.translate(L.w / 2 + c.x, L.h / 2 + c.y);
  g.scale(sc, sc);
  g.translate(-L.cx, -L.cy);
  // widen view bounds for background painting
  L.viewL = L.cx - (L.w / sc) / 2; L.viewR = L.cx + (L.w / sc) / 2;
  L.viewT = L.cy - (L.h / sc) / 2; L.viewB = L.cy + (L.h / sc) / 2;

  drawBackground(S, S.t, pal, L);
  drawBoss(S, S.t, pal, L);
  drawProjectiles(S, S.t, pal, L);
  drawPlayer(S, S.t, pal, L);
  drawRing(S, S.t, L);
  updateParticles(dtp);
  drawParticles(pal);
  drawFx(dtp);

  // screen-space: grain, vignette, flash
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!grainPattern) grainPattern = g.createPattern(grain, 'repeat');
  g.globalAlpha = 0.5;
  g.fillStyle = grainPattern;
  g.fillRect(0, 0, L.w, L.h);
  g.globalAlpha = 1;

  const vg = g.createRadialGradient(L.w/2, L.h/2, Math.min(L.w, L.h) * 0.42, L.w/2, L.h/2, Math.max(L.w, L.h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(12,8,16,' + (R.phaseMix > 2.4 ? 0.42 : 0.26) + ')');
  g.fillStyle = vg;
  g.fillRect(0, 0, L.w, L.h);

  if (R.flash[3] > 0.003){
    g.fillStyle = 'rgba(' + R.flashColor + ',' + R.flash[3].toFixed(3) + ')';
    g.fillRect(0, 0, L.w, L.h);
    R.flash[3] *= Math.pow(0.86, dtR / 16);
  } else R.flash[3] = 0;

  // defeat: ink closes in
  if (S.state === 'defeat'){
    const q = clamp(S.stateT / 1600, 0, 1);
    const dg2 = g.createRadialGradient(L.w/2, L.h/2, Math.max(60, (1 - q) * Math.max(L.w, L.h) * 0.7),
                                       L.w/2, L.h/2, Math.max(L.w, L.h));
    dg2.addColorStop(0, 'rgba(10,7,14,0)');
    dg2.addColorStop(1, 'rgba(10,7,14,' + (0.75 * q) + ')');
    g.fillStyle = dg2;
    g.fillRect(0, 0, L.w, L.h);
  }
}

/* =====================================================================
   Procedural audio — Web Audio only, created on first user gesture.
   ===================================================================== */
const audio = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  ensure(){
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      const wind = this.ctx.createBufferSource();
      wind.buffer = this.noiseBuf; wind.loop = true;
      const wf = this.ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 320;
      const wg = this.ctx.createGain(); wg.gain.value = 0.035;
      wind.connect(wf); wf.connect(wg); wg.connect(this.master);
      wind.start();
    } catch (e){ this.ctx = null; return false; }
    return true;
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  out(){ return this.master; },
  tone(o){
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), gn = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + o.dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(o.g, t0 + (o.a || 0.004));
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(gn); gn.connect(this.out());
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  noise(o){
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = c.createBiquadFilter();
    f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(10, o.f2), t0 + o.dur);
    const gn = c.createGain();
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(o.g, t0 + (o.a || 0.005));
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(gn); gn.connect(this.out());
    src.start(t0, Math.random() * 1.2); src.stop(t0 + o.dur + 0.05);
  },
  play(name, ev){
    if (!this.ctx || this.muted) return;
    switch (name){
      case 'swing':  this.noise({ f:900, f2:340, dur:0.12, g:0.05, q:1.6 }); break;
      case 'parry':
        this.tone({ type:'square', f: ev && ev.perfect ? 1560 : 1320, dur:0.16, g:0.055 });
        this.tone({ type:'sine', f:2093, dur:0.22, g:0.04 });
        this.noise({ f:5200, dur:0.05, g:0.07, ftype:'highpass' });
        if (ev && ev.perfect) this.tone({ type:'sine', f:2637, dur:0.4, g:0.035, delay:0.02 });
        break;
      case 'deflect':
        this.tone({ type:'square', f:1180, dur:0.12, g:0.045 });
        this.noise({ f:3600, dur:0.07, g:0.05, ftype:'highpass' });
        break;
      case 'featherHit':
        this.noise({ f:700, f2:220, dur:0.14, g:0.06 });
        this.tone({ type:'sine', f:330, f2:180, dur:0.12, g:0.05 });
        break;
      case 'riposte':
        this.noise({ f:400, f2:2400, dur:0.2, g:0.09, q:2 });
        this.tone({ type:'square', f:1560, dur:0.18, g:0.05, delay:0.03 });
        this.tone({ type:'sine', f:82, f2:44, dur:0.5, g:0.12, delay:0.03 });
        break;
      case 'whiff':  this.noise({ f:800, f2:280, dur:0.13, g:0.035 }); break;
      case 'hurt':
        this.tone({ type:'sine', f:220, f2:70, dur:0.24, g:0.11 });
        this.noise({ f:240, dur:0.16, g:0.09, ftype:'lowpass' });
        break;
      case 'whoosh': this.noise({ f:1400, f2:500, dur:0.16, g:0.03 }); break;
      case 'cue':
        this.tone({ type:'triangle', f: ev && ev.heavy ? 240 : 480, f2: ev && ev.heavy ? 130 : 760, dur:0.14, g:0.035 });
        break;
      case 'featherLaunch': this.noise({ f:1900, f2:900, dur:0.18, g:0.03, q:3 }); break;
      case 'phase':
        this.tone({ type:'sine', f:196, dur:1.1, g:0.09 });
        this.tone({ type:'sine', f:294, dur:1.0, g:0.05, delay:0.04 });
        this.noise({ f:2600, f2:400, dur:0.9, g:0.03, delay:0.05 });
        break;
      case 'victory':
        [440, 554, 659, 880].forEach((f, i) =>
          this.tone({ type:'triangle', f, dur:0.5, g:0.06, delay: i * 0.13 }));
        break;
      case 'defeat':
        [220, 164, 110].forEach((f, i) =>
          this.tone({ type:'sine', f, dur:0.8, g:0.08, delay: i * 0.3 }));
        break;
    }
  },
};
const SOUND_MAP = {
  swing:'swing', parry:'parry', deflect:'deflect', featherHit:'featherHit',
  riposte:'riposte', whiff:'whiff', hurt:'hurt', whoosh:'whoosh', cue:'cue',
  featherLaunch:'featherLaunch', phase:'phase', victory:'victory', defeat:'defeat',
};

/* =====================================================================
   Game shell — wall clock, input, HUD, overlays, deterministic API.
   ===================================================================== */
const game = {
  sim: new Sim(DEFAULT_SEED),
  clock: false, paused: false, autoPaused: false,
  attractTimer: 0, interacted: false,
};
function setPaused(v){
  game.paused = v;
  game.sim.paused = v;
}
function cancelAttract(){
  if (game.attractTimer){ clearTimeout(game.attractTimer); game.attractTimer = 0; }
}
function startFresh(){
  const seed = game.sim.seed;
  game.sim.reset(seed); game.sim.demo = false;
  game.clock = true; setPaused(false);
}
function restart(){
  const seed = game.sim.seed, d = game.sim.demo;
  game.sim.reset(seed); game.sim.demo = d;
  game.clock = true; setPaused(false);
}
function enterDemo(){
  game.sim.setDemo(true);
  game.clock = true; setPaused(false);
}
function userPress(){
  cancelAttract(); game.interacted = true;
  audio.ensure(); audio.resume();
  const s = game.sim;
  if (game.paused) return;
  if (s.outcome){ if (s.stateT > 450) startFresh(); return; }
  if (s.demo){ startFresh(); return; }
  if (!game.clock){ startFresh(); return; }
  s.press();
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const el = {
  stage: $('stage'), flames: $('flames'), bfill: $('bfill'), bghost: $('bghost'),
  pips: $('pips').children, combo: $('combo'), caption: $('caption'),
  ovTitle: $('ovTitle'), ovPause: $('ovPause'), ovEnd: $('ovEnd'),
  endTitle: $('endTitle'), endSub: $('endSub'), stats: $('stats'), rank: $('rank'),
  demoBadge: $('demoBadge'), announcer: $('announcer'),
  btnStart: $('btnStart'), btnPause: $('btnPause'), btnRestart: $('btnRestart'),
  btnDemo: $('btnDemo'), btnSound: $('btnSound'),
};
const FLAME_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c2.2 4 6 6.2 6 11a6 6 0 1 1-12 0c0-2.8 1.4-4.8 2.9-6.8.5 1.5 1.4 2.5 2.5 3.1C11 6.4 11 4 12 2z"/></svg>';
for (let i = 0; i < CFG.flames; i++){
  const s = document.createElement('span');
  s.innerHTML = FLAME_SVG;
  el.flames.appendChild(s);
}

let captionTimer = 0;
function caption(text, ms){
  el.caption.textContent = text;
  el.caption.classList.add('show');
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => el.caption.classList.remove('show'), ms || 2600);
}
function announce(text){ el.announcer.textContent = text; }

const hudCache = {};
function hudSet(key, val, fn){
  if (hudCache[key] === val) return;
  hudCache[key] = val; fn(val);
}
function updateHud(S){
  hudSet('flames', S.player.flames, v => {
    [...el.flames.children].forEach((f, i) => f.classList.toggle('out', i >= v));
  });
  hudSet('hp', Math.round(S.boss.hp * 10), () => {
    const f = S.boss.hp / CFG.bossMax;
    el.bfill.style.transform = 'scaleX(' + f + ')';
    el.bghost.style.transform = 'scaleX(' + f + ')';
  });
  hudSet('phase', S.phase, v => {
    [...el.pips].forEach((p, i) => p.classList.toggle('on', i < v));
    document.body.dataset.phase = String(v);
  });
  hudSet('combo', S.stats.combo, v => {
    el.combo.textContent = v >= 2 ? 'combo ×' + v : '';
    if (v >= 2 && el.combo.animate && !RM){
      el.combo.animate([{ transform:'scale(1.35)' }, { transform:'scale(1)' }], { duration:160 });
    }
  });

  // overlays
  let ui = 'play';
  if (game.paused && (S.t > 0 || game.clock)) ui = 'paused';
  else if (S.outcome && S.stateT > 700) ui = 'end';
  else if (!game.clock && S.t === 0) ui = 'title';
  else if (S.demo) ui = 'demo';
  hudSet('ui', ui + ':' + (S.outcome || ''), () => {
    el.ovTitle.classList.toggle('show', ui === 'title');
    el.ovPause.classList.toggle('show', ui === 'paused');
    el.ovEnd.classList.toggle('show', ui === 'end');
    el.demoBadge.classList.toggle('show', ui === 'demo');
    if (ui === 'end') fillEnd(S);
  });
  hudSet('pausedBtn', game.paused, v => {
    el.btnPause.textContent = v ? 'Resume' : 'Pause';
    el.btnPause.setAttribute('aria-pressed', String(v));
  });
  hudSet('demoBtn', S.demo, v => el.btnDemo.setAttribute('aria-pressed', String(v)));
  hudSet('startBtn', ui, () => {
    el.btnStart.textContent = ui === 'end' ? 'Again' : (ui === 'play' && !S.demo ? 'Playing' : 'Start');
  });
}
function fillEnd(S){
  const win = S.outcome === 'victory';
  el.endTitle.textContent = win ? 'The Ink Settles' : 'The Lantern Goes Out';
  el.endSub.textContent = win ? 'Sumi dissolves into the paper' : 'Sumi looms, unbroken';
  const s = S.stats;
  const denom = s.parries + s.whiffs + s.hits;
  const acc = denom ? Math.round(s.parries / denom * 100) : 100;
  el.stats.innerHTML = '';
  [['time', (S.t / 1000).toFixed(1) + 's'], ['parries', s.parries], ['perfect', s.perfects],
   ['hits taken', s.hits], ['best combo', s.bestCombo], ['accuracy', acc + '%']]
    .forEach(([k, v]) => {
      const d = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = String(v);
      d.append(k, b);
      el.stats.appendChild(d);
    });
  let rank = 'C';
  if (win){ rank = s.hits === 0 && s.whiffs <= 2 ? 'S' : s.hits <= 1 ? 'A' : 'B'; }
  el.rank.textContent = win ? 'rank ' + rank : '';
  announce(win ? 'Victory. The ink settles.' : 'Defeat. The lantern goes out.');
}

/* ---------- event drain ---------- */
function drainEvents(){
  const evs = game.sim.events;
  if (!evs.length) return;
  for (const ev of evs){
    onEvent(ev, game.sim);
    const snd = SOUND_MAP[ev.type];
    if (snd) audio.play(snd, ev);
    if (ev.type === 'fightstart') caption('Strike when the ring flashes.', 2600);
    else if (ev.type === 'phasebegin'){
      if (ev.phase === 2){ caption('II — The Feather Storm · struck feathers fly back', 3400); announce('Phase two: the feather storm.'); }
      if (ev.phase === 3){ caption('III — The Eclipse · answer every beat of the dive', 3400); announce('Phase three: the eclipse.'); }
    }
  }
  evs.length = 0;
}

/* ---------- input ---------- */
el.stage.addEventListener('pointerdown', e => { e.preventDefault(); userPress(); });
el.stage.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (e.code === 'Space'){
    if (onButton) return;               // let Space activate a focused control
    e.preventDefault();
    if (!e.repeat) userPress();
    return;
  }
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyR'){ cancelAttract(); game.interacted = true; restart(); }
  else if (e.code === 'KeyD') toggleDemo();
  else if (e.code === 'KeyM') toggleSound();
});

function togglePause(){
  if (!game.clock && game.sim.t === 0) return;
  game.autoPaused = false;
  setPaused(!game.paused);
  if (!game.paused){ audio.ensure(); audio.resume(); }
}
function toggleDemo(){
  cancelAttract(); game.interacted = true;
  if (!game.sim.demo) enterDemo();
  else game.sim.setDemo(false);
}
function toggleSound(){
  audio.ensure(); audio.resume();
  audio.muted = !audio.muted;
  el.btnSound.setAttribute('aria-pressed', String(!audio.muted));
  el.btnSound.textContent = audio.muted ? 'Sound: Off' : 'Sound: On';
}
function bindButton(btn, fn){
  btn.addEventListener('click', e => {
    fn();
    if (e.detail > 0) el.stage.focus();   // mouse click: hand focus back to the arena
  });
}
bindButton(el.btnStart, () => {
  cancelAttract(); game.interacted = true;
  audio.ensure(); audio.resume();
  const s = game.sim;
  if (game.paused){ setPaused(false); return; }
  if (s.outcome || s.demo || !game.clock) startFresh();
});
bindButton(el.btnPause, togglePause);
bindButton(el.btnRestart, () => { cancelAttract(); game.interacted = true; audio.ensure(); audio.resume(); restart(); });
bindButton(el.btnDemo, toggleDemo);
bindButton(el.btnSound, toggleSound);
el.btnSound.textContent = 'Sound: On';
el.btnSound.setAttribute('aria-pressed', 'true');

/* ---------- lifecycle ---------- */
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (game.clock && !game.paused){ setPaused(true); game.autoPaused = true; }
  } else if (game.autoPaused){
    game.autoPaused = false;
    if (game.sim.demo) setPaused(false);   // attract resumes; real play stays safely paused
  }
});

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(100, Math.max(0, now - last));
  last = now;
  if (game.clock && !game.paused && !document.hidden) game.sim.step(dt);
  drainEvents();
  draw(game.sim, now, dt || 16);
  updateHud(game.sim);
  requestAnimationFrame(frame);
}

/* ---------- deterministic public interface ---------- */
window.__BOSS_FIGHT__ = {
  reset(seed){
    cancelAttract();
    game.sim.reset(seed === undefined ? game.sim.seed : seed);
    game.sim.demo = false;
    game.clock = false; setPaused(false);
    return game.sim.snapshot();
  },
  start(){
    cancelAttract();
    if (game.sim.outcome) game.sim.reset(game.sim.seed);
    game.sim.demo = false;
    game.clock = true; setPaused(false);
    return true;
  },
  setDemo(enabled){
    cancelAttract();
    game.sim.setDemo(!!enabled);
    if (enabled){ game.clock = true; setPaused(false); }
    return game.sim.demo;
  },
  press(){ cancelAttract(); game.sim.press(); return true; },
  step(ms){ cancelAttract(); game.sim.step(+ms || 0); return r3(game.sim.t); },
  snapshot(){ return game.sim.snapshot(); },
  runSelfTest(){ return runSelfTest(); },
};

/* ---------- boot ---------- */
resize();
game.attractTimer = setTimeout(() => {
  game.attractTimer = 0;
  if (!game.interacted && !game.clock && game.sim.t === 0) enterDemo();
}, 7000);
requestAnimationFrame(frame);

})();
</script>
