<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GPT-5.6 Sol</title>
  <style>
    :root {
      --bg: oklch(0.075 0 0);
      --surface: oklch(0.13 0.016 150);
      --surface-2: oklch(0.18 0.026 150);
      --ink: oklch(0.96 0.015 150);
      --muted: oklch(0.73 0.035 150);
      --moss: oklch(0.65 0.17 150);
      --moss-deep: oklch(0.43 0.13 150);
      --gold: oklch(0.86 0.15 91);
      --coral: oklch(0.68 0.20 28);
      --danger: oklch(0.62 0.22 22);
      --line: oklch(0.32 0.045 150);
      --focus: oklch(0.88 0.15 91);
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 24%, oklch(0.18 0.055 150 / 0.38), transparent 38rem),
        var(--bg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button { font: inherit; }

    .app {
      width: min(1180px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) clamp(12px, 2.6vw, 32px) max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 1.8vh, 18px);
    }

    .masthead,
    .hud,
    .controls {
      display: flex;
      align-items: center;
    }

    .masthead {
      justify-content: space-between;
      gap: 20px;
      min-height: 42px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.1rem, 2.8vw, 1.65rem);
      font-weight: 760;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    .encounter-name {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(0.68rem, 1.4vw, 0.78rem);
      letter-spacing: 0.08em;
      text-align: right;
    }

    .hud {
      gap: clamp(12px, 2vw, 24px);
      min-height: 46px;
    }

    .meter {
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-columns: auto minmax(70px, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .meter.boss { flex: 1.55; }

    .meter-label,
    .meter-value,
    .phase-chip {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.075em;
    }

    .meter-label { color: var(--muted); }
    .meter-value { color: var(--ink); min-width: 3.2ch; text-align: right; }

    .track {
      height: 8px;
      overflow: hidden;
      background: oklch(0.19 0.025 150);
      border-radius: 2px;
    }

    .fill {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      background: var(--moss);
      transition: transform 180ms cubic-bezier(.22,1,.36,1);
    }

    .boss .fill {
      background: var(--coral);
      transform-origin: right center;
    }

    .phase-chip {
      flex: 0 0 auto;
      color: var(--gold);
      white-space: nowrap;
    }

    .arena {
      position: relative;
      width: 100%;
      aspect-ratio: 1000 / 620;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      background: oklch(0.095 0.012 150);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 0 oklch(0.035 0 0 / 0.75);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 18px;
      pointer-events: none;
      transition: opacity 180ms ease-out;
    }

    .overlay[hidden] { display: none; }

    .message {
      max-width: min(520px, 92%);
      padding: 13px 18px;
      color: var(--ink);
      background: oklch(0.095 0.012 150 / 0.93);
      border: 1px solid oklch(0.56 0.11 150 / 0.72);
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 6px 0 oklch(0.03 0 0 / 0.65);
    }

    .message strong {
      display: block;
      color: var(--gold);
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .message span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: clamp(0.76rem, 1.7vw, 0.9rem);
      text-wrap: pretty;
    }

    .instruction {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.74rem, 1.6vw, 0.86rem);
      text-align: center;
    }

    kbd {
      margin: 0 0.32rem;
      padding: 0.15rem 0.42rem;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.72rem;
    }

    .controls {
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .control,
    .action {
      min-height: 42px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      transition: transform 120ms ease-out, background 120ms ease-out, border-color 120ms ease-out;
    }

    .control {
      padding: 0.62rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 680;
    }

    .control:hover {
      background: var(--surface-2);
      border-color: var(--moss-deep);
    }

    .control:active,
    .action:active { transform: translateY(2px); }

    .control:disabled,
    .action:disabled {
      opacity: 0.46;
      cursor: not-allowed;
      transform: none;
    }

    .control.primary {
      color: oklch(0.98 0.01 150);
      background: var(--moss-deep);
      border-color: var(--moss);
    }

    .control[aria-pressed="true"] {
      color: oklch(0.12 0.025 91);
      background: var(--gold);
      border-color: var(--gold);
    }

    .action {
      min-width: 148px;
      padding: 0.62rem 1.1rem;
      color: oklch(0.12 0.025 91);
      background: var(--gold);
      border-color: oklch(0.93 0.10 91);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.075em;
    }

    button:focus-visible,
    canvas:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .app { justify-content: flex-start; }
      .masthead { min-height: 34px; }
      .hud { gap: 8px; flex-wrap: wrap; }
      .meter { grid-template-columns: auto minmax(64px, 1fr); gap: 6px; }
      .meter-value { display: none; }
      .meter.boss { flex-basis: 58%; }
      .phase-chip { order: -1; width: 100%; text-align: center; }
      .arena { aspect-ratio: 4 / 3; }
      .instruction { min-height: 32px; }
      .control { min-height: 40px; padding-inline: 0.72rem; }
      .action { order: -1; flex-basis: 100%; }
    }

    @media (max-width: 390px) {
      .encounter-name { font-size: 0.62rem; }
      .meter-label { font-size: 0.62rem; }
      .controls { gap: 6px; }
      .control { font-size: 0.72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1>GPT-5.6 Sol</h1>
      <p class="encounter-name">VESPER · THE VERDANT BELL</p>
    </header>

    <section class="hud" aria-label="Fight status">
      <div class="meter player">
        <span class="meter-label">WICK</span>
        <div class="track" aria-hidden="true"><div class="fill" id="playerFill"></div></div>
        <span class="meter-value" id="playerValue">5/5</span>
      </div>
      <div class="phase-chip" id="phaseChip">MOVEMENT I</div>
      <div class="meter boss">
        <span class="meter-label">VESPER</span>
        <div class="track" aria-hidden="true"><div class="fill" id="bossFill"></div></div>
        <span class="meter-value" id="bossValue">18</span>
      </div>
    </section>

    <section class="arena" id="arena">
      <canvas id="game" tabindex="0" role="application" aria-label="One-button boss fight. Press Space or activate the canvas to resonate."></canvas>
      <div class="overlay" id="overlay">
        <div class="message">
          <strong id="overlayTitle">Wake the bell</strong>
          <span id="overlayBody">Press Start, then resonate when the ring closes around Wick.</span>
        </div>
      </div>
    </section>

    <p class="instruction">Tap, click, or press <kbd>Space</kbd> when the closing ring touches you.</p>

    <nav class="controls" aria-label="Game controls">
      <button class="control primary" id="startButton" type="button">Start</button>
      <button class="control" id="pauseButton" type="button">Pause</button>
      <button class="action" id="actionButton" type="button">RESONATE</button>
      <button class="control" id="restartButton" type="button">Restart</button>
      <button class="control" id="demoButton" type="button" aria-pressed="false">Demo: off</button>
      <button class="control" id="soundButton" type="button" aria-pressed="false">Sound: off</button>
    </nav>
    <div class="sr-only" id="announcer" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      'use strict';

      const MODEL = 'GPT-5.6 Sol';
      const FIXED_STEP = 1000 / 60;
      const DEFAULT_SEED = 5602026;
      const DEMO_SEED = 150719;
      const TAU = Math.PI * 2;
      const reducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');
      let reducedMotion = reducedMotionQuery.matches;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
      const easeInOut = t => t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

      class SeededRandom {
        constructor(seed) { this.state = (seed | 0) || 1; }
        next() {
          let x = this.state | 0;
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          this.state = x | 0;
          return (x >>> 0) / 4294967296;
        }
        range(min, max) { return min + (max - min) * this.next(); }
        int(max) { return Math.floor(this.next() * max); }
      }

      class FightEngine {
        constructor(options = {}) {
          this.silent = Boolean(options.silent);
          this.onEvent = options.onEvent || (() => {});
          this.initializing = true;
          this.reset(DEFAULT_SEED);
          this.initializing = false;
        }

        reset(seed = DEFAULT_SEED) {
          const normalized = Number.isFinite(Number(seed)) ? (Number(seed) | 0) : DEFAULT_SEED;
          this.seed = normalized || 1;
          this.rng = new SeededRandom(this.seed);
          this.fxRng = new SeededRandom(this.seed ^ 0x5f3759df);
          this.time = 0;
          this.phase = 1;
          this.phaseStartedAt = 0;
          this.transitionUntil = 0;
          this.phaseBanner = '';
          this.running = false;
          this.paused = false;
          this.demo = false;
          this.outcome = null;
          this.bossMax = 18;
          this.bossHp = 18;
          this.playerMax = 5;
          this.playerHp = 5;
          this.playerX = 500;
          this.playerY = 516;
          this.attacks = [];
          this.nextAttackAt = 1050;
          this.attackSerial = 0;
          this.combo = 0;
          this.maxCombo = 0;
          this.score = 0;
          this.perfects = 0;
          this.pressCount = 0;
          this.demoPresses = 0;
          this.cooldownUntil = 0;
          this.pulseUntil = 0;
          this.lastPressGrade = '';
          this.lastGradeUntil = 0;
          this.shake = 0;
          this.arenaPulse = 0;
          this.bossRecoil = 0;
          this.playerRecoil = 0;
          this.flash = 0;
          this.damageFlash = 0;
          this.fx = [];
          this.history = [];
          this.lastAttackKind = '';
          this.background = this.makeBackground();
          if (!this.initializing) this.onEvent('reset', this.snapshot());
          return this.snapshot();
        }

        makeBackground() {
          const decorRng = new SeededRandom(this.seed ^ 0x2c1b3c6d);
          return Array.from({ length: 72 }, () => ({
            x: decorRng.range(18, 982),
            y: decorRng.range(24, 448),
            size: decorRng.range(0.5, 2.3),
            phase: decorRng.range(0, TAU),
            depth: decorRng.range(0.25, 1)
          }));
        }

        start() {
          if (this.outcome) this.reset(this.seed);
          this.running = true;
          this.paused = false;
          this.outcome = null;
          this.onEvent('start', this.snapshot());
          return this.snapshot();
        }

        setDemo(enabled) {
          const turnOn = Boolean(enabled);
          if (turnOn) {
            this.reset(DEMO_SEED);
            this.demo = true;
            this.start();
          } else {
            this.demo = false;
            this.running = false;
            this.paused = false;
          }
          this.onEvent('demo', { enabled: this.demo });
          return this.snapshot();
        }

        setPaused(paused) {
          if (!this.running || this.outcome) return this.paused;
          this.paused = Boolean(paused);
          this.onEvent('pause', { paused: this.paused });
          return this.paused;
        }

        getPhaseName() {
          return ['THE FIRST TOLL', 'THE ANSWERING ECHO', 'THE THREEFOLD FUGUE'][this.phase - 1];
        }

        getPlayerPosition() {
          const sway = Math.sin(this.time * 0.00034);
          const counter = Math.sin(this.time * 0.00068 + 0.9);
          return {
            x: 500 + sway * 225,
            y: 513 + counter * 11
          };
        }

        attackDefinition() {
          const pools = [
            [
              { kind: 'TOLL', leads: [1120], damage: [1], recovery: 1120 },
              { kind: 'RIPPLE', leads: [1260], damage: [1], recovery: 1010 }
            ],
            [
              { kind: 'DUET', leads: [980, 1570], damage: [0.5, 0.5], recovery: 980 },
              { kind: 'PRISM', leads: [1090, 1680], damage: [0.5, 0.5], recovery: 910 }
            ],
            [
              { kind: 'FUGUE', leads: [920, 1370, 1820], damage: [1 / 3, 1 / 3, 1 / 3], recovery: 820 },
              { kind: 'ECLIPSE', leads: [1050, 1500, 1950], damage: [1 / 3, 1 / 3, 1 / 3], recovery: 760 }
            ]
          ];
          const pool = pools[this.phase - 1];
          let choice = pool[this.rng.int(pool.length)];
          if (choice.kind === this.lastAttackKind) choice = pool.find(item => item.kind !== choice.kind) || choice;
          this.lastAttackKind = choice.kind;
          return choice;
        }

        spawnAttack() {
          const def = this.attackDefinition();
          const baseWindow = [165, 148, 132][this.phase - 1];
          const pos = this.getPlayerPosition();
          const attack = {
            id: ++this.attackSerial,
            kind: def.kind,
            phase: this.phase,
            born: this.time,
            targetX: pos.x,
            side: this.rng.next() < 0.5 ? -1 : 1,
            spin: this.rng.next() < 0.5 ? -1 : 1,
            resolved: false,
            beats: def.leads.map((lead, index) => ({
              index,
              impact: this.time + lead,
              lead,
              window: baseWindow,
              bossDamage: def.damage[index],
              resolved: false,
              missed: false,
              grade: ''
            }))
          };
          this.attacks.push(attack);
          this.nextAttackAt = this.time + def.leads[def.leads.length - 1] + def.recovery;
          this.history.push({ type: 'attack', time: this.time, kind: attack.kind, phase: this.phase });
          this.onEvent('attack', attack);
        }

        press(source = 'player') {
          if (!this.running || this.paused || this.outcome || this.transitionUntil > this.time) return false;
          if (this.time < this.cooldownUntil) return false;
          this.pressCount += 1;
          if (source === 'demo') this.demoPresses += 1;
          this.cooldownUntil = this.time + 205;
          this.pulseUntil = this.time + 360;
          this.arenaPulse = Math.max(this.arenaPulse, 0.48);
          this.addPulseFx(false);

          const candidates = [];
          for (const attack of this.attacks) {
            for (const beat of attack.beats) {
              if (!beat.resolved && !beat.missed) {
                const distance = Math.abs(this.time - beat.impact);
                if (distance <= beat.window) candidates.push({ attack, beat, distance });
              }
            }
          }
          candidates.sort((a, b) => a.distance - b.distance || a.beat.impact - b.beat.impact);
          if (!candidates.length) {
            this.lastPressGrade = 'EMPTY';
            this.lastGradeUntil = this.time + 360;
            this.onEvent('press', { hit: false, source });
            return false;
          }

          const { attack, beat, distance } = candidates[0];
          beat.resolved = true;
          beat.grade = distance <= 58 ? 'PERFECT' : 'PARRY';
          const perfect = beat.grade === 'PERFECT';
          this.bossHp = Math.max(0, this.bossHp - beat.bossDamage);
          this.combo += 1;
          this.maxCombo = Math.max(this.maxCombo, this.combo);
          this.score += (perfect ? 160 : 100) * Math.max(1, Math.min(5, this.combo));
          if (perfect) this.perfects += 1;
          this.lastPressGrade = beat.grade;
          this.lastGradeUntil = this.time + 560;
          this.shake = Math.max(this.shake, perfect ? 9 : 5);
          this.bossRecoil = Math.max(this.bossRecoil, perfect ? 1 : 0.62);
          this.flash = Math.max(this.flash, perfect ? 0.55 : 0.3);
          this.arenaPulse = 1;
          this.addParryFx(perfect, attack.side);
          this.history.push({ type: 'parry', time: this.time, grade: beat.grade, attack: attack.kind });
          this.onEvent('parry', { perfect, beat, attack, source });

          attack.resolved = attack.beats.every(item => item.resolved || item.missed);
          this.checkBossProgress();
          return true;
        }

        addPulseFx(strong) {
          const pos = this.getPlayerPosition();
          this.fx.push({ type: 'ring', x: pos.x, y: pos.y - 8, age: 0, life: strong ? 520 : 380, strong });
        }

        addParryFx(perfect, side) {
          const pos = this.getPlayerPosition();
          const count = reducedMotion ? 5 : (perfect ? 22 : 14);
          for (let i = 0; i < count; i += 1) {
            const angle = this.fxRng.range(-Math.PI * 0.95, -Math.PI * 0.05);
            const speed = this.fxRng.range(perfect ? 0.15 : 0.1, perfect ? 0.34 : 0.24);
            this.fx.push({
              type: 'shard', x: pos.x, y: pos.y - 14, age: 0, life: this.fxRng.range(420, 780),
              vx: Math.cos(angle) * speed + side * 0.025,
              vy: Math.sin(angle) * speed,
              spin: this.fxRng.range(-0.02, 0.02),
              size: this.fxRng.range(2, perfect ? 7 : 5),
              perfect
            });
          }
          this.fx.push({ type: 'slash', x: pos.x, y: pos.y - 22, age: 0, life: 260, side, perfect });
        }

        addDamageFx() {
          const pos = this.getPlayerPosition();
          const count = reducedMotion ? 4 : 13;
          for (let i = 0; i < count; i += 1) {
            const angle = this.fxRng.range(0, TAU);
            this.fx.push({
              type: 'ember', x: pos.x, y: pos.y - 12, age: 0, life: this.fxRng.range(360, 680),
              vx: Math.cos(angle) * this.fxRng.range(0.04, 0.16),
              vy: Math.sin(angle) * this.fxRng.range(0.04, 0.16),
              size: this.fxRng.range(2, 5)
            });
          }
        }

        checkBossProgress() {
          if (this.bossHp <= 0.0001) {
            this.bossHp = 0;
            this.outcome = 'victory';
            this.running = false;
            this.phaseBanner = 'THE BELL REMEMBERS SILENCE';
            this.flash = 1;
            this.shake = 13;
            this.score += Math.max(0, this.playerHp) * 1000 + Math.max(0, 75000 - this.time);
            this.onEvent('victory', this.snapshot());
            return;
          }

          const nextPhase = this.bossHp <= 6.0001 ? 3 : this.bossHp <= 12.0001 ? 2 : 1;
          if (nextPhase > this.phase) {
            this.phase = nextPhase;
            this.phaseStartedAt = this.time;
            this.transitionUntil = this.time + 2380;
            this.nextAttackAt = this.transitionUntil + 620;
            this.attacks = [];
            this.playerHp = Math.min(this.playerMax, this.playerHp + 1);
            this.phaseBanner = nextPhase === 2 ? 'ANSWER THE ECHO' : 'KEEP THE THREE-BEAT FUGUE';
            this.flash = 0.65;
            this.shake = 8;
            this.arenaPulse = 1;
            this.onEvent('phase', { phase: this.phase, name: this.getPhaseName() });
          }
        }

        missBeat(attack, beat) {
          beat.missed = true;
          beat.grade = 'MISS';
          attack.resolved = attack.beats.every(item => item.resolved || item.missed);
          this.playerHp = Math.max(0, this.playerHp - 1);
          this.combo = 0;
          this.lastPressGrade = 'BROKEN';
          this.lastGradeUntil = this.time + 650;
          this.damageFlash = 0.7;
          this.playerRecoil = 1;
          this.shake = Math.max(this.shake, 8);
          this.addDamageFx();
          this.history.push({ type: 'damage', time: this.time, attack: attack.kind });
          this.onEvent('damage', { playerHp: this.playerHp, attack, beat });
          if (this.playerHp <= 0) {
            this.outcome = 'failure';
            this.running = false;
            this.phaseBanner = 'WICK EXTINGUISHED';
            this.onEvent('failure', this.snapshot());
          }
        }

        updateFx(dt) {
          for (const fx of this.fx) {
            fx.age += dt;
            if ('x' in fx && 'vx' in fx) fx.x += fx.vx * dt;
            if ('y' in fx && 'vy' in fx) fx.y += fx.vy * dt;
            if (fx.type === 'shard') fx.vy += 0.00032 * dt;
          }
          this.fx = this.fx.filter(item => item.age < item.life);
          const decay = dt / 180;
          this.shake = Math.max(0, this.shake - dt * 0.035);
          this.arenaPulse = Math.max(0, this.arenaPulse - dt * 0.0016);
          this.bossRecoil = Math.max(0, this.bossRecoil - decay);
          this.playerRecoil = Math.max(0, this.playerRecoil - decay * 1.3);
          this.flash = Math.max(0, this.flash - dt * 0.0018);
          this.damageFlash = Math.max(0, this.damageFlash - dt * 0.0022);
        }

        update(dt) {
          if (!this.running || this.paused || this.outcome) return;
          this.time += dt;
          const pos = this.getPlayerPosition();
          this.playerX = pos.x;
          this.playerY = pos.y;
          this.updateFx(dt);

          if (this.transitionUntil > this.time) return;
          if (this.transitionUntil && this.time >= this.transitionUntil) {
            this.transitionUntil = 0;
            this.phaseBanner = '';
          }

          if (this.time >= this.nextAttackAt && this.attacks.filter(a => !a.resolved).length < 2) {
            this.spawnAttack();
          }

          if (this.demo) {
            let due = null;
            for (const attack of this.attacks) {
              for (const beat of attack.beats) {
                if (!beat.resolved && !beat.missed && this.time >= beat.impact - 8) {
                  if (!due || beat.impact < due.impact) due = beat;
                }
              }
            }
            if (due) this.press('demo');
          }

          for (const attack of this.attacks) {
            for (const beat of attack.beats) {
              if (!beat.resolved && !beat.missed && this.time > beat.impact + beat.window) {
                this.missBeat(attack, beat);
                if (this.outcome) return;
              }
            }
          }

          this.attacks = this.attacks.filter(attack => {
            const lastImpact = attack.beats[attack.beats.length - 1].impact;
            return !attack.resolved || this.time < lastImpact + 720;
          });
        }

        snapshot() {
          return {
            simulationTime: Math.round(this.time * 1000) / 1000,
            seed: this.seed,
            phase: this.phase,
            phaseName: this.getPhaseName(),
            running: this.running,
            paused: this.paused,
            demo: this.demo,
            player: {
              health: this.playerHp,
              maxHealth: this.playerMax,
              x: Math.round(this.playerX * 100) / 100,
              y: Math.round(this.playerY * 100) / 100,
              cooldownUntil: Math.round(this.cooldownUntil * 1000) / 1000
            },
            boss: {
              health: Math.round(this.bossHp * 1000) / 1000,
              maxHealth: this.bossMax,
              name: 'Vesper, the Verdant Bell'
            },
            activeAttacks: this.attacks.map(attack => ({
              id: attack.id,
              kind: attack.kind,
              phase: attack.phase,
              beats: attack.beats.map(beat => ({
                impact: Math.round(beat.impact * 1000) / 1000,
                resolved: beat.resolved,
                missed: beat.missed,
                grade: beat.grade
              }))
            })),
            score: Math.round(this.score),
            combo: this.combo,
            maxCombo: this.maxCombo,
            perfects: this.perfects,
            outcome: this.outcome
          };
        }
      }

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d', { alpha: false });
      const arena = document.getElementById('arena');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayBody = document.getElementById('overlayBody');
      const playerFill = document.getElementById('playerFill');
      const bossFill = document.getElementById('bossFill');
      const playerValue = document.getElementById('playerValue');
      const bossValue = document.getElementById('bossValue');
      const phaseChip = document.getElementById('phaseChip');
      const announcer = document.getElementById('announcer');
      const startButton = document.getElementById('startButton');
      const pauseButton = document.getElementById('pauseButton');
      const restartButton = document.getElementById('restartButton');
      const demoButton = document.getElementById('demoButton');
      const soundButton = document.getElementById('soundButton');
      const actionButton = document.getElementById('actionButton');

      let audioContext = null;
      let soundEnabled = false;
      let width = 1000;
      let height = 620;
      let accumulator = 0;
      let lastFrame = performance.now();
      let autoPaused = false;
      let previousHudKey = '';

      const audio = {
        ensure() {
          if (!soundEnabled) return null;
          if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
          return audioContext;
        },
        tone(frequency, duration, gain, type = 'sine', delay = 0) {
          const ac = this.ensure();
          if (!ac) return;
          const now = ac.currentTime + delay;
          const osc = ac.createOscillator();
          const amp = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(frequency, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, frequency * 0.72), now + duration);
          amp.gain.setValueAtTime(0.0001, now);
          amp.gain.exponentialRampToValueAtTime(gain, now + 0.012);
          amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(amp).connect(ac.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        },
        parry(perfect) {
          this.tone(perfect ? 660 : 520, 0.18, 0.075, 'triangle');
          this.tone(perfect ? 990 : 780, 0.26, 0.045, 'sine', 0.018);
        },
        damage() {
          this.tone(105, 0.32, 0.09, 'sawtooth');
          this.tone(62, 0.42, 0.07, 'square', 0.03);
        },
        phase(phase) {
          [0, 0.12, 0.25].slice(0, phase).forEach((delay, i) => this.tone(196 * Math.pow(1.5, i), 0.45, 0.045, 'triangle', delay));
        },
        victory() {
          [0, 0.14, 0.28, 0.5].forEach((delay, i) => this.tone([220, 330, 440, 660][i], 0.55, 0.055, 'sine', delay));
        }
      };

      const game = new FightEngine({
        onEvent(type, payload) {
          if (type === 'parry') audio.parry(payload.perfect);
          if (type === 'damage') audio.damage();
          if (type === 'phase') {
            audio.phase(payload.phase);
            announcer.textContent = `Movement ${payload.phase}: ${payload.name}`;
          }
          if (type === 'victory') {
            audio.victory();
            announcer.textContent = 'Victory. Vesper is silenced.';
          }
          if (type === 'failure') announcer.textContent = 'Wick was extinguished. Restart to try again.';
          updateHud(true);
        }
      });

      function resizeCanvas() {
        const rect = arena.getBoundingClientRect();
        const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
        width = Math.max(320, rect.width);
        height = Math.max(240, rect.height);
        const pixelWidth = Math.round(width * dpr);
        const pixelHeight = Math.round(height * dpr);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function advance(engine, milliseconds) {
        if (!Number.isFinite(milliseconds) || milliseconds <= 0) return;
        accumulator += Math.min(milliseconds, 120000);
        let guard = 0;
        while (accumulator + 1e-7 >= FIXED_STEP && guard < 10000) {
          engine.update(FIXED_STEP);
          accumulator -= FIXED_STEP;
          guard += 1;
          if (engine.outcome) {
            accumulator = 0;
            break;
          }
        }
      }

      function logicalTransform() {
        ctx.setTransform(canvas.width / 1000, 0, 0, canvas.height / 620, 0, 0);
      }

      function roundedRectPath(context, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      function line(x1, y1, x2, y2, stroke, lineWidth = 1, dash = []) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.setLineDash(dash);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawBackdrop(t) {
        const gradient = ctx.createRadialGradient(500, 160, 20, 500, 285, 610);
        gradient.addColorStop(0, 'oklch(0.24 0.08 150)');
        gradient.addColorStop(0.42, 'oklch(0.125 0.032 150)');
        gradient.addColorStop(1, 'oklch(0.065 0 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1000, 620);

        ctx.save();
        ctx.globalAlpha = 0.2 + game.arenaPulse * 0.18;
        ctx.fillStyle = 'oklch(0.72 0.17 150)';
        for (const mote of game.background) {
          const flicker = 0.45 + Math.sin(t * 0.0012 * mote.depth + mote.phase) * 0.3;
          ctx.globalAlpha = (0.08 + 0.25 * mote.depth) * flicker;
          ctx.fillRect(mote.x, mote.y, mote.size, mote.size);
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.55;
        for (let i = 0; i < 7; i += 1) {
          const x = 80 + i * 140;
          line(x, 0, x + (i % 2 ? 24 : -24), 250, 'oklch(0.31 0.07 150 / 0.22)', 5);
          ctx.fillStyle = 'oklch(0.22 0.055 150)';
          ctx.beginPath();
          ctx.moveTo(x - 10, 120 + (i % 3) * 24);
          ctx.lineTo(x + 14, 120 + (i % 3) * 24);
          ctx.lineTo(x + 7, 158 + (i % 3) * 24);
          ctx.lineTo(x - 5, 158 + (i % 3) * 24);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        const horizon = ctx.createLinearGradient(0, 370, 0, 620);
        horizon.addColorStop(0, 'oklch(0.12 0.025 150 / 0)');
        horizon.addColorStop(1, 'oklch(0.045 0 0)');
        ctx.fillStyle = horizon;
        ctx.fillRect(0, 350, 1000, 270);
      }

      function drawArena(t) {
        ctx.save();
        ctx.translate(500, 510);
        const pulse = game.arenaPulse;
        ctx.globalAlpha = 0.42 + pulse * 0.25;
        ctx.strokeStyle = 'oklch(0.58 0.14 150)';
        ctx.lineWidth = 2 + pulse * 2;
        for (let i = 0; i < 5; i += 1) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 210 + i * 80 + pulse * 15, 30 + i * 13 + pulse * 3, 0, Math.PI, TAU);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = 'oklch(0.105 0.024 150)';
        ctx.beginPath();
        ctx.ellipse(0, 5, 438, 82, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'oklch(0.4 0.09 150)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = 'oklch(0.73 0.16 150)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i += 1) {
          const a = i / 12 * TAU + t * 0.00005;
          ctx.beginPath();
          ctx.ellipse(0, 5, 330 + Math.sin(a * 3) * 18, 57, 0, a, a + 0.23);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBoss(t) {
        const phase = game.phase;
        const float = Math.sin(t * 0.0014) * (reducedMotion ? 1.5 : 5);
        const recoil = game.bossRecoil * 18;
        ctx.save();
        ctx.translate(500, 184 + float - recoil);

        if (phase >= 3) {
          ctx.save();
          ctx.globalAlpha = 0.42;
          ctx.fillStyle = 'oklch(0.04 0 0)';
          ctx.beginPath();
          ctx.arc(0, 6, 126 + Math.sin(t * 0.002) * 5, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = 'oklch(0.74 0.16 28)';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.globalAlpha = phase === 1 ? 0.32 : 0.7;
        ctx.fillStyle = phase >= 3 ? 'oklch(0.50 0.17 28)' : 'oklch(0.38 0.12 150)';
        const petals = phase === 1 ? 3 : phase === 2 ? 5 : 7;
        for (let i = 0; i < petals; i += 1) {
          const a = -Math.PI * 0.82 + i * (Math.PI * 1.64 / Math.max(1, petals - 1));
          ctx.save();
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.quadraticCurveTo(48, -32, 92 + phase * 9, 0);
          ctx.quadraticCurveTo(48, 29, 0, 12);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();

        const armSweep = Math.sin(t * 0.0011) * 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        [[-1, -1], [1, 1]].forEach(([side, direction]) => {
          ctx.strokeStyle = 'oklch(0.27 0.075 150)';
          ctx.lineWidth = 18;
          ctx.beginPath();
          ctx.moveTo(side * 48, 22);
          ctx.lineTo(side * 104, 64 + armSweep * direction);
          ctx.lineTo(side * 158, 114 - armSweep * direction);
          ctx.stroke();
          ctx.strokeStyle = 'oklch(0.58 0.15 150)';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = phase >= 2 ? 'oklch(0.73 0.17 91)' : 'oklch(0.47 0.13 150)';
          ctx.beginPath();
          ctx.moveTo(side * 143, 106 - armSweep * direction);
          ctx.lineTo(side * 180, 126 - armSweep * direction);
          ctx.lineTo(side * 161, 151 - armSweep * direction);
          ctx.lineTo(side * 133, 129 - armSweep * direction);
          ctx.closePath();
          ctx.fill();
        });

        if (phase >= 2) {
          ctx.strokeStyle = 'oklch(0.32 0.09 150)';
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.moveTo(0, 72);
          ctx.lineTo(Math.sin(t * 0.001) * 28, 148);
          ctx.stroke();
          ctx.fillStyle = 'oklch(0.62 0.17 28)';
          ctx.beginPath();
          ctx.moveTo(-24, 145);
          ctx.lineTo(0, 182);
          ctx.lineTo(24, 145);
          ctx.closePath();
          ctx.fill();
        }

        ctx.fillStyle = 'oklch(0.18 0.045 150)';
        ctx.strokeStyle = 'oklch(0.66 0.17 150)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-82, -28);
        ctx.quadraticCurveTo(-55, -92, 0, -98);
        ctx.quadraticCurveTo(55, -92, 82, -28);
        ctx.lineTo(62, 58);
        ctx.quadraticCurveTo(0, 86, -62, 58);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'oklch(0.25 0.075 150)';
        ctx.beginPath();
        ctx.moveTo(-92, -34);
        ctx.lineTo(-142, -76);
        ctx.lineTo(-118, -8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(92, -34);
        ctx.lineTo(142, -76);
        ctx.lineTo(118, -8);
        ctx.closePath();
        ctx.fill();

        const coreGlow = ctx.createRadialGradient(0, 10, 0, 0, 10, 58);
        coreGlow.addColorStop(0, phase >= 3 ? 'oklch(0.92 0.15 91)' : 'oklch(0.78 0.18 150)');
        coreGlow.addColorStop(0.34, phase >= 3 ? 'oklch(0.67 0.20 28)' : 'oklch(0.51 0.16 150)');
        coreGlow.addColorStop(1, 'oklch(0.16 0.03 150 / 0)');
        ctx.fillStyle = coreGlow;
        ctx.beginPath();
        ctx.arc(0, 10, 58, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'oklch(0.94 0.12 91)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -39);
        ctx.lineTo(0, 48);
        ctx.stroke();
        ctx.fillStyle = 'oklch(0.04 0 0)';
        ctx.beginPath();
        ctx.ellipse(0, 7, 7, 24, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function beatProgress(attack, beat) {
        const started = beat.impact - beat.lead;
        return clamp((game.time - started) / beat.lead, 0, 1);
      }

      function drawTargetRing(x, y, progress, color, index, total) {
        const radius = lerp(116, 22, easeInOut(progress));
        const alpha = 0.35 + progress * 0.65;
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = progress > 0.82 ? 4 : 2;
        ctx.beginPath();
        ctx.arc(0, 0, radius, -Math.PI / 2, -Math.PI / 2 + TAU * (0.18 + progress * 0.82));
        ctx.stroke();
        for (let i = 0; i < total; i += 1) {
          const a = -Math.PI / 2 + (i - (total - 1) / 2) * 0.23;
          ctx.fillStyle = i === index ? color : 'oklch(0.35 0.05 150)';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * (radius + 12), Math.sin(a) * (radius + 12), i === index ? 4 : 2.4, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawAttacks(t) {
        const player = game.getPlayerPosition();
        for (const attack of game.attacks) {
          attack.beats.forEach((beat, index) => {
            if (beat.resolved || beat.missed || game.time < attack.born) return;
            const p = beatProgress(attack, beat);
            const color = attack.phase === 1 ? 'oklch(0.86 0.15 91)' : attack.phase === 2 ? (index ? 'oklch(0.70 0.20 28)' : 'oklch(0.69 0.18 150)') : ['oklch(0.76 0.18 150)', 'oklch(0.86 0.15 91)', 'oklch(0.69 0.21 28)'][index];
            drawTargetRing(player.x, player.y - 19, p, color, index, attack.beats.length);

            ctx.save();
            ctx.globalAlpha = 0.18 + p * 0.82;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2 + p * 3;

            if (attack.kind === 'TOLL') {
              const y = lerp(252, player.y - 62, easeInOut(p));
              line(player.x, 96, player.x, player.y - 34, color, 2, [8, 12]);
              ctx.beginPath();
              ctx.moveTo(player.x - 28, y - 42);
              ctx.lineTo(player.x + 28, y - 42);
              ctx.lineTo(player.x + 13, y + 16);
              ctx.lineTo(player.x - 13, y + 16);
              ctx.closePath();
              ctx.fill();
            } else if (attack.kind === 'RIPPLE') {
              const r = lerp(70, 430, easeOut(p));
              ctx.beginPath();
              ctx.arc(500, 180, r, 0.18 * Math.PI, 0.82 * Math.PI);
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(500, 180, r - 18, 0.2 * Math.PI, 0.8 * Math.PI);
              ctx.stroke();
            } else if (attack.kind === 'DUET') {
              const fromX = index === 0 ? 62 : 938;
              const x = lerp(fromX, player.x, easeInOut(p));
              const y = lerp(342 + index * 22, player.y - 20, easeInOut(p));
              ctx.beginPath();
              ctx.arc(x, y, 28, -Math.PI / 2, Math.PI / 2, index === 0);
              ctx.lineTo(x, y - 28);
              ctx.fill();
              line(fromX, y, x, y, color, 1.5, [4, 12]);
            } else if (attack.kind === 'PRISM') {
              const angle = (index === 0 ? -0.8 : 0.8) + attack.side * 0.12;
              const startX = 500 + Math.sin(angle) * 340;
              const startY = 160 + Math.cos(angle) * 90;
              const x = lerp(startX, player.x, easeInOut(p));
              const y = lerp(startY, player.y - 20, easeInOut(p));
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(t * 0.002 * attack.spin + index);
              ctx.beginPath();
              ctx.moveTo(0, -34);
              ctx.lineTo(15, 0);
              ctx.lineTo(0, 34);
              ctx.lineTo(-15, 0);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
              line(startX, startY, player.x, player.y - 20, color, 1.5, [3, 11]);
            } else if (attack.kind === 'FUGUE') {
              const angle = -2.55 + index * 0.52;
              const radius = lerp(330, 24, easeInOut(p));
              const x = player.x + Math.cos(angle) * radius;
              const y = player.y - 19 + Math.sin(angle) * radius * 0.52;
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(angle + Math.PI / 2);
              ctx.beginPath();
              ctx.moveTo(0, -34);
              ctx.quadraticCurveTo(24, 0, 0, 38);
              ctx.quadraticCurveTo(-24, 0, 0, -34);
              ctx.fill();
              ctx.restore();
            } else if (attack.kind === 'ECLIPSE') {
              const a = index / 3 * TAU + attack.spin * 0.55;
              const r = lerp(310, 28, easeInOut(p));
              const x = player.x + Math.cos(a) * r;
              const y = player.y - 19 + Math.sin(a) * r * 0.55;
              ctx.beginPath();
              ctx.arc(x, y, lerp(36, 17, p), 0, TAU);
              ctx.fill();
              ctx.strokeStyle = 'oklch(0.92 0.13 91)';
              ctx.beginPath();
              ctx.arc(x, y, lerp(25, 9, p), 0, TAU);
              ctx.stroke();
            }
            ctx.restore();
          });
        }
      }

      function drawPlayer(t) {
        const pos = game.getPlayerPosition();
        const recoil = game.playerRecoil * 14;
        const pulse = game.pulseUntil > game.time ? 1 - (game.pulseUntil - game.time) / 360 : 0;
        ctx.save();
        ctx.translate(pos.x - recoil, pos.y);

        ctx.globalAlpha = 0.25;
        ctx.fillStyle = 'oklch(0.74 0.17 150)';
        ctx.beginPath();
        ctx.ellipse(0, 18, 36 + pulse * 14, 8, 0, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (!reducedMotion) {
          ctx.strokeStyle = 'oklch(0.63 0.18 28)';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(-10, -20);
          ctx.quadraticCurveTo(-38 - Math.sin(t * 0.004) * 10, -12, -56, 2);
          ctx.stroke();
        }

        ctx.fillStyle = 'oklch(0.18 0.045 150)';
        ctx.strokeStyle = 'oklch(0.70 0.17 150)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -54);
        ctx.quadraticCurveTo(27, -32, 31, 14);
        ctx.lineTo(-31, 14);
        ctx.quadraticCurveTo(-27, -32, 0, -54);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'oklch(0.90 0.14 91)';
        ctx.beginPath();
        ctx.arc(0, -28, 8 + pulse * 3, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'oklch(0.12 0.02 150)';
        ctx.beginPath();
        ctx.arc(0, -28, 3, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = pulse > 0 ? 'oklch(0.94 0.13 91)' : 'oklch(0.66 0.16 150)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, -17, 18 + pulse * 5, -Math.PI * 0.76, Math.PI * 0.76);
        ctx.stroke();
        ctx.restore();
      }

      function drawFx() {
        for (const fx of game.fx) {
          const p = clamp(fx.age / fx.life, 0, 1);
          ctx.save();
          ctx.globalAlpha = 1 - p;
          if (fx.type === 'ring') {
            ctx.strokeStyle = fx.strong ? 'oklch(0.94 0.14 91)' : 'oklch(0.77 0.18 150)';
            ctx.lineWidth = fx.strong ? 5 : 3;
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, 22 + easeOut(p) * (fx.strong ? 132 : 88), 0, TAU);
            ctx.stroke();
          } else if (fx.type === 'shard') {
            ctx.translate(fx.x, fx.y);
            ctx.rotate(fx.spin * fx.age);
            ctx.fillStyle = fx.perfect ? 'oklch(0.92 0.14 91)' : 'oklch(0.72 0.18 150)';
            ctx.fillRect(-fx.size / 2, -fx.size * 1.8, fx.size, fx.size * 3.6);
          } else if (fx.type === 'ember') {
            ctx.fillStyle = 'oklch(0.65 0.22 22)';
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.size * (1 - p * 0.5), 0, TAU);
            ctx.fill();
          } else if (fx.type === 'slash') {
            ctx.translate(fx.x, fx.y);
            ctx.rotate(fx.side * -0.65);
            ctx.strokeStyle = fx.perfect ? 'oklch(0.95 0.12 91)' : 'oklch(0.74 0.18 150)';
            ctx.lineWidth = lerp(10, 1, p);
            ctx.beginPath();
            ctx.arc(0, 0, 36 + p * 80, -1.3, 1.2);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawReadout() {
        ctx.save();
        ctx.font = '700 14px ui-monospace, monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'oklch(0.78 0.055 150)';
        ctx.fillText(`COMBO  ${String(game.combo).padStart(2, '0')}`, 28, 36);
        ctx.textAlign = 'right';
        ctx.fillText(`SCORE  ${String(Math.round(game.score)).padStart(6, '0')}`, 972, 36);

        if (game.lastGradeUntil > game.time) {
          const life = clamp((game.lastGradeUntil - game.time) / 560, 0, 1);
          ctx.globalAlpha = easeOut(life);
          ctx.textAlign = 'center';
          ctx.font = '800 22px ui-sans-serif, sans-serif';
          ctx.fillStyle = game.lastPressGrade === 'PERFECT' ? 'oklch(0.91 0.14 91)' : game.lastPressGrade === 'BROKEN' ? 'oklch(0.68 0.22 22)' : 'oklch(0.76 0.18 150)';
          ctx.fillText(game.lastPressGrade, game.playerX, game.playerY - 86 - (1 - life) * 16);
        }

        if (game.demo) {
          roundedRectPath(ctx, 430, 24, 140, 27, 4);
          ctx.fillStyle = 'oklch(0.84 0.15 91)';
          ctx.fill();
          ctx.fillStyle = 'oklch(0.12 0.02 91)';
          ctx.font = '800 11px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('DEMO PILOT', 500, 42);
        }
        ctx.restore();
      }

      function drawPhaseBanner() {
        if (!game.phaseBanner || game.outcome) return;
        const elapsed = game.time - game.phaseStartedAt;
        const alpha = clamp(Math.min(elapsed / 250, (game.transitionUntil - game.time) / 400), 0, 1);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'oklch(0.055 0 0 / 0.78)';
        ctx.fillRect(0, 248, 1000, 98);
        ctx.textAlign = 'center';
        ctx.fillStyle = 'oklch(0.90 0.13 91)';
        ctx.font = '800 26px ui-sans-serif, sans-serif';
        ctx.fillText(`MOVEMENT ${['I', 'II', 'III'][game.phase - 1]}`, 500, 285);
        ctx.fillStyle = 'oklch(0.78 0.07 150)';
        ctx.font = '650 14px ui-monospace, monospace';
        ctx.fillText(game.phaseBanner, 500, 318);
        ctx.restore();
      }

      function render() {
        logicalTransform();
        const idleTime = game.running || game.outcome ? game.time : performance.now() * 0.4;
        ctx.save();
        if (game.shake > 0 && !reducedMotion) {
          const magnitude = game.shake;
          ctx.translate(Math.sin(game.time * 0.11) * magnitude, Math.cos(game.time * 0.083) * magnitude * 0.62);
        }
        drawBackdrop(idleTime);
        drawArena(idleTime);
        drawBoss(idleTime);
        drawAttacks(idleTime);
        drawPlayer(idleTime);
        drawFx();
        ctx.restore();

        if (game.damageFlash > 0) {
          ctx.fillStyle = `oklch(0.52 0.23 22 / ${game.damageFlash * 0.34})`;
          ctx.fillRect(0, 0, 1000, 620);
        }
        if (game.flash > 0) {
          ctx.fillStyle = `oklch(0.96 0.08 91 / ${game.flash * 0.24})`;
          ctx.fillRect(0, 0, 1000, 620);
        }
        drawReadout();
        drawPhaseBanner();
      }

      function updateHud(force = false) {
        const transitioning = game.transitionUntil > game.time;
        const key = [game.playerHp, game.bossHp.toFixed(3), game.phase, game.running, game.paused, game.demo, game.outcome, transitioning].join('|');
        if (!force && key === previousHudKey) return;
        previousHudKey = key;
        playerFill.style.transform = `scaleX(${clamp(game.playerHp / game.playerMax, 0, 1)})`;
        bossFill.style.transform = `scaleX(${clamp(game.bossHp / game.bossMax, 0, 1)})`;
        playerValue.textContent = `${game.playerHp}/${game.playerMax}`;
        bossValue.textContent = game.bossHp <= 0 ? '0' : String(Math.ceil(game.bossHp));
        phaseChip.textContent = `MOVEMENT ${['I', 'II', 'III'][game.phase - 1]}`;
        pauseButton.textContent = game.paused ? 'Resume' : 'Pause';
        pauseButton.disabled = !game.running || Boolean(game.outcome);
        pauseButton.setAttribute('aria-pressed', String(game.paused));
        startButton.disabled = game.running && !game.outcome;
        actionButton.disabled = !game.running || game.paused || Boolean(game.outcome) || transitioning;
        demoButton.textContent = game.demo ? 'Demo: on' : 'Demo: off';
        demoButton.setAttribute('aria-pressed', String(game.demo));

        if (game.outcome === 'victory') {
          overlay.hidden = false;
          overlayTitle.textContent = 'Vesper falls silent';
          overlayBody.textContent = `Score ${Math.round(game.score).toLocaleString()} · ${game.maxCombo} beat chain · Restart is instant.`;
          startButton.textContent = 'Start';
        } else if (game.outcome === 'failure') {
          overlay.hidden = false;
          overlayTitle.textContent = 'Wick extinguished';
          overlayBody.textContent = 'Listen for the closing ring, then restart and answer it.';
          startButton.textContent = 'Start';
        } else if (!game.running) {
          overlay.hidden = false;
          overlayTitle.textContent = game.demo ? 'Demo stopped' : 'Wake the bell';
          overlayBody.textContent = 'Press Start, then resonate when the ring closes around Wick.';
          startButton.textContent = 'Start';
        } else if (game.paused) {
          overlay.hidden = false;
          overlayTitle.textContent = 'Time held';
          overlayBody.textContent = 'Resume when you are ready. The fight has not advanced.';
        } else {
          overlay.hidden = true;
          startButton.textContent = 'Started';
        }
      }

      function frame(now) {
        const delta = Math.min(100, Math.max(0, now - lastFrame));
        lastFrame = now;
        advance(game, delta);
        updateHud();
        render();
        requestAnimationFrame(frame);
      }

      function userPress() {
        audio.ensure();
        game.press('player');
        updateHud(true);
      }

      function restart(normalPlay = true) {
        accumulator = 0;
        game.reset(game.demo && !normalPlay ? DEMO_SEED : game.seed);
        if (normalPlay) {
          game.demo = false;
          game.start();
        }
        updateHud(true);
        canvas.focus({ preventScroll: true });
      }

      startButton.addEventListener('click', () => {
        audio.ensure();
        if (game.demo) game.setDemo(false);
        if (game.outcome) game.reset(game.seed);
        game.demo = false;
        game.start();
        accumulator = 0;
        updateHud(true);
        canvas.focus({ preventScroll: true });
      });

      pauseButton.addEventListener('click', () => {
        if (!game.running) return;
        game.setPaused(!game.paused);
        updateHud(true);
      });

      restartButton.addEventListener('click', () => restart(true));
      actionButton.addEventListener('click', userPress);

      demoButton.addEventListener('click', () => {
        audio.ensure();
        accumulator = 0;
        game.setDemo(!game.demo);
        updateHud(true);
      });

      soundButton.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundButton.textContent = soundEnabled ? 'Sound: on' : 'Sound: off';
        soundButton.setAttribute('aria-pressed', String(soundEnabled));
        if (soundEnabled) {
          audio.ensure();
          audio.tone(440, 0.18, 0.04, 'triangle');
        }
      });

      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        canvas.setPointerCapture?.(event.pointerId);
        userPress();
      });

      canvas.addEventListener('keydown', event => {
        if ((event.code === 'Enter' || event.code === 'Space') && !event.repeat) {
          event.preventDefault();
          userPress();
        }
      });

      window.addEventListener('keydown', event => {
        if (event.code === 'Space' && !event.repeat && event.target !== canvas && !event.target.closest('button')) {
          event.preventDefault();
          userPress();
        }
      });

      window.addEventListener('resize', resizeCanvas, { passive: true });
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resizeCanvas).observe(arena);
      reducedMotionQuery.addEventListener?.('change', event => { reducedMotion = event.matches; });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && game.running && !game.paused) {
          autoPaused = true;
          game.setPaused(true);
          updateHud(true);
        } else if (!document.hidden && autoPaused) {
          autoPaused = false;
          lastFrame = performance.now();
        }
      });

      function simulate(engine, milliseconds, onStep) {
        const steps = Math.ceil(milliseconds / FIXED_STEP);
        for (let i = 0; i < steps && !engine.outcome; i += 1) {
          if (onStep) onStep(engine);
          engine.update(FIXED_STEP);
        }
      }

      function runSelfTest() {
        const tests = [];
        const test = (name, fn) => {
          try {
            const detail = fn();
            tests.push({ name, passed: true, detail: detail === undefined ? 'ok' : detail });
          } catch (error) {
            tests.push({ name, passed: false, detail: error instanceof Error ? error.message : String(error) });
          }
        };
        const assert = (condition, message) => { if (!condition) throw new Error(message); };

        test('deterministic reset', () => {
          const a = new FightEngine({ silent: true });
          const b = new FightEngine({ silent: true });
          a.reset(7331); b.reset(7331); a.start(); b.start();
          simulate(a, 6200); simulate(b, 6200);
          assert(JSON.stringify(a.snapshot()) === JSON.stringify(b.snapshot()), 'same seed diverged');
          return `seed ${a.seed}, ${a.attacks.length} active attack`;
        });

        test('pause behavior', () => {
          const e = new FightEngine({ silent: true });
          e.reset(12); e.start(); simulate(e, 800); e.setPaused(true);
          const before = e.snapshot(); simulate(e, 1800);
          const after = e.snapshot();
          assert(before.simulationTime === after.simulationTime, 'simulation advanced while paused');
          assert(JSON.stringify(before.activeAttacks) === JSON.stringify(after.activeAttacks), 'attacks advanced while paused');
          return `${after.simulationTime}ms held`;
        });

        test('phase progression', () => {
          const e = new FightEngine({ silent: true });
          e.setDemo(true);
          simulate(e, 36000);
          assert(e.phase >= 2, `stuck in phase ${e.phase}`);
          return `reached phase ${e.phase}`;
        });

        test('finite numeric state', () => {
          const e = new FightEngine({ silent: true });
          e.setDemo(true); simulate(e, 14000);
          const values = [e.time, e.bossHp, e.playerHp, e.playerX, e.playerY, e.score, e.combo];
          assert(values.every(Number.isFinite), 'non-finite number found');
          return `${values.length} numeric fields checked`;
        });

        test('reachable success', () => {
          const e = new FightEngine({ silent: true });
          e.setDemo(true); simulate(e, 75000);
          assert(e.outcome === 'victory', `outcome was ${e.outcome}`);
          assert(e.time >= 45000 && e.time <= 75000, `victory time ${e.time}ms outside target`);
          return `victory at ${(e.time / 1000).toFixed(1)}s`;
        });

        test('reachable failure', () => {
          const e = new FightEngine({ silent: true });
          e.reset(49); e.start(); simulate(e, 40000);
          assert(e.outcome === 'failure', `outcome was ${e.outcome}`);
          return `failure at ${(e.time / 1000).toFixed(1)}s`;
        });

        test('restart', () => {
          const e = new FightEngine({ silent: true });
          e.reset(91); e.start(); simulate(e, 6000); e.reset(91);
          const snap = e.snapshot();
          assert(snap.simulationTime === 0 && snap.boss.health === 18 && snap.player.health === 5, 'reset did not restore encounter');
          assert(snap.outcome === null && snap.activeAttacks.length === 0, 'reset retained encounter state');
          return 'encounter restored';
        });

        test('Demo uses normal gameplay state', () => {
          const e = new FightEngine({ silent: true });
          e.setDemo(true); simulate(e, 9000);
          assert(e.demoPresses > 0, 'Demo made no normal press calls');
          assert(e.history.some(item => item.type === 'attack'), 'Demo spawned no real attack');
          assert(e.history.some(item => item.type === 'parry'), 'Demo resolved no real parry');
          assert(e.bossHp < e.bossMax && e.score > 0, 'Demo did not change gameplay state');
          return `${e.demoPresses} normal press calls`;
        });

        return { passed: tests.every(item => item.passed), tests };
      }

      window.__BOSS_FIGHT__ = Object.freeze({
        reset(seed) {
          accumulator = 0;
          const result = game.reset(seed);
          updateHud(true);
          render();
          return result;
        },
        start() {
          const result = game.start();
          updateHud(true);
          return result;
        },
        setDemo(enabled) {
          accumulator = 0;
          const result = game.setDemo(enabled);
          updateHud(true);
          return result;
        },
        press() {
          const result = game.press('api');
          updateHud(true);
          render();
          return result;
        },
        step(milliseconds) {
          const amount = Number(milliseconds);
          if (!Number.isFinite(amount) || amount < 0) throw new TypeError('milliseconds must be a finite non-negative number');
          advance(game, amount);
          updateHud(true);
          render();
          return game.snapshot();
        },
        snapshot() { return game.snapshot(); },
        runSelfTest
      });

      document.title = MODEL;
      resizeCanvas();
      updateHud(true);
      render();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
