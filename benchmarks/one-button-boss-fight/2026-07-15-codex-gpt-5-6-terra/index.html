<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b17" />
  <title>GPT-5.6 Terra</title>
  <style>
    :root { color-scheme: dark; --ink:#080a14; --panel:rgba(15,17,37,.83); --line:rgba(217,229,255,.20); --gold:#ffe19a; --mint:#84ffe1; --rose:#ff789f; --text:#eef2ff; --muted:#aeb6d0; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; background:var(--ink); }
    body { font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif; color:var(--text); overflow-x:hidden; }
    button { font:inherit; }

    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }

    .phase strong { color:var(--gold); }
    .prompt { position:absolute; left:50%; top:57%; transform:translate(-50%,-50%); width:min(82%,480px); text-align:center; pointer-events:none; transition:opacity .35s; }
    .prompt .instruction { color:#fff7da; font-size:clamp(.78rem,1.9vw,1rem); font-weight:800; letter-spacing:.08em; text-transform:uppercase; text-shadow:0 2px 18px #000; }
    .prompt .hint { margin-top:6px; font-size:.7rem; color:#c3cbe6; letter-spacing:.06em; }

    button { color:#eaf0ff; padding:9px 14px; border-radius:10px; border:1px solid #ffffff26; background:#171d3a; box-shadow:inset 0 1px #ffffff13, 0 5px 15px #0005; cursor:pointer; font-size:.77rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; transition:transform .12s, background .12s, border-color .12s; }

    button.primary { background:linear-gradient(135deg,#d6f8e7,#6ee7d6); color:#06121a; border-color:#c8fff4; }

  </style>
</head>
<body>

      <div class="hud" aria-hidden="true">
        <div class="meter-row">
          <div class="meter"><div class="meter-label"><span>THE NINTH BELL</span><span id="boss-value">54 / 54</span></div><div class="meter-track"><div class="meter-fill" id="boss-fill"></div></div></div>
          <div class="phase" id="phase-label">I · Listen for the chime</div>
        </div>
        <div class="meter player"><div class="meter-label"><span>STARLING</span><span id="player-value">5 / 5</span></div><div class="meter-track"><div class="meter-fill" id="player-fill"></div></div></div>
      </div>
      <div class="prompt" id="prompt"><div class="instruction">Pulse when the crimson thread reaches you</div><div class="hint">Space · Click · Tap</div></div>
      <div class="outcome" id="outcome" role="status" aria-live="polite"><div class="outcome-card"><div class="outcome-kicker" id="outcome-kicker">Resonance complete</div><h2 id="outcome-title">THE BELL FALLS SILENT</h2><p id="outcome-copy">The arena remembers your rhythm.</p><button class="primary" id="again">Restart encounter</button></div></div>
    </section>
    <footer><div class="controls" aria-label="Game controls"><button class="primary" id="start">Start</button><button id="pause">Pause</button><button id="restart">Restart</button><button class="demo" id="demo" aria-pressed="false">Demo</button></div><div class="assist" id="assist">A pulse can only answer danger close to the Starling.</div></footer>
  </main>

      function polyLocal(ps,fill,stroke){ctx.beginPath();ps.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
    }
    function drawParticles() { ctx.save();for(const p of game.particles){const a=1-p.age/p.life;const [x,y]=point(p.x,p.y);ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,Math.max(1,p.size*2.2),0,TAU);ctx.fill();}ctx.restore(); }
    function render(now) { visualTime=now/1000;drawArena(visualTime); for(const a of game.attacks) if(!a.resolved || game.time-a.impact<.35)drawAttack(a);drawBoss(visualTime);drawParticles();drawPlayer(visualTime); }
    function syncUI() { const s=game.snapshot(); bossFill.style.width=(100*s.boss.hp/s.boss.maxHp)+'%'; playerFill.style.width=(100*s.player.hp/s.player.maxHp)+'%';bossValue.textContent=Math.ceil(s.boss.hp)+' / '+s.boss.maxHp;playerValue.textContent=s.player.hp+' / '+s.player.maxHp;phaseLabel.innerHTML='<strong>'+['I','II','III'][s.phase-1]+'</strong> · '+['Listen for the chime','Split the echo','Answer the eclipse'][s.phase-1];prompt.classList.toggle('hidden',s.running||!!s.outcome);assist.textContent=s.paused?'Time is held.':s.demo?'Deterministic attract mode is playing through the real encounter.':s.event==='thread struck'?'Too early or too late — wait for the arrival ring.':'Pulse only as a crimson thread reaches the Starling.';
      if(s.outcome){outcome.classList.add('show');if(s.outcome==='win'){outcomeKicker.textContent='Resonance complete';outcomeTitle.textContent='THE BELL FALLS SILENT';outcomeCopy.textContent='A clean answer, carried through all three movements.';}else{outcomeKicker.textContent='The echo breaks';outcomeTitle.textContent='THE STARLING FALLS';outcomeCopy.textContent='The next chime is already waiting.';}}else outcome.classList.remove('show');
      document.getElementById('pause').textContent=s.paused?'Resume':'Pause'; document.getElementById('demo').classList.toggle('active',s.demo); document.getElementById('demo').setAttribute('aria-pressed',String(s.demo)); }
    function frame(now) { const dt=Math.min(80,Math.max(0,now-last));last=now;if(!document.hidden)game.step(dt);render(now);syncUI();requestAnimationFrame(frame); }
    requestAnimationFrame(frame);
    function userPress(e){if(e&&e.target.closest&&e.target.closest('button'))return;game.press();canvas.focus({preventScroll:true});}
    canvas.addEventListener('pointerdown',userPress);window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();game.press();}});document.addEventListener('visibilitychange',()=>{last=performance.now();});
    document.getElementById('start').onclick=()=>game.start(false);document.getElementById('pause').onclick=()=>game.togglePause();document.getElementById('restart').onclick=()=>{game.reset(game.seed);game.start(false);};document.getElementById('again').onclick=()=>{game.reset(game.seed);game.start(false);};document.getElementById('demo').onclick=()=>{if(game.demo){game.reset(game.seed);}else{game.reset(game.seed);game.start(true);}};
    function runSelfTest() {
      const tests=[]; const test=(name,fn)=>{try{tests.push({name,passed:!!fn()});}catch(e){tests.push({name,passed:false,error:String(e.message||e)});}};
      const playDemo=(e,limit=70000)=>{e.start(true);for(let i=0;i<limit/10&&!e.outcome;i++)e.step(10);return e;};
      test('deterministic reset',()=>{const a=new Engine(19),b=new Engine(19);a.start();b.start();for(let i=0;i<165;i++){a.step(10);b.step(10);if(i===145){a.press();b.press();}}return JSON.stringify(a.snapshot())===JSON.stringify(b.snapshot());});
      test('pause freezes simulation',()=>{const e=new Engine(2);e.start();e.step(500);const before=e.snapshot().time;e.togglePause();e.step(1000);return e.snapshot().time===before;});
      test('phase progression',()=>{const e=playDemo(new Engine(3),26000);return e.snapshot().phase>=2;});
      test('finite numeric state',()=>{const e=playDemo(new Engine(4),25000);const s=JSON.stringify(e.snapshot());return !/NaN|Infinity/.test(s);});
      test('success is reachable',()=>playDemo(new Engine(5),72000).snapshot().outcome==='win');
      test('failure is reachable',()=>{const e=new Engine(6);e.start();for(let i=0;i<13000&&!e.outcome;i++)e.step(10);return e.snapshot().outcome==='lose';});
      test('restart restores encounter',()=>{const e=new Engine(8);e.start();e.step(2000);e.reset(8);const s=e.snapshot();return s.time===0&&s.player.hp===5&&s.boss.hp===54&&!s.outcome;});
      test('demo uses normal gameplay systems',()=>{const e=new Engine(9);e.start(true);e.step(5000);const s=e.snapshot();return s.demo&&s.actions>0&&s.boss.hp<54;});
      return {passed:tests.every(t=>t.passed),tests};
    }
    window.__BOSS_FIGHT__={reset:(seed)=>game.reset(seed),start:()=>game.start(false),setDemo:(enabled)=>{if(enabled){game.reset(game.seed);game.start(true);}else game.demo=false;return game.snapshot();},press:()=>game.press(),step:(ms)=>game.step(ms),snapshot:()=>game.snapshot(),runSelfTest};
    syncUI();
  })();
  </script>
</body>
