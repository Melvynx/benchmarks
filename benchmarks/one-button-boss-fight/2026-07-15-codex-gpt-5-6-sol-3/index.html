<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GPT-5.6 Sol</title>
  <style>
    :root {
      --ink: #090612;
      --ink-2: #110b22;
      --ivory: #f4e9ce;
      --gold: #f4bd5b;
      --gold-2: #ffe7a0;
      --coral: #ff536d;
      --violet: #8f78ff;
      --cyan: #76f4e3;
      --muted: #a79dbb;
      --line: rgba(244, 233, 206, .16);
      --glass: rgba(15, 9, 30, .78);
      --ease-out: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      color: var(--ivory);
      font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overscroll-behavior: none;
    }

    button {
      appearance: none;
      border: 0;
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    canvas:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      height: 100dvh;
      min-height: 0;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 58%, rgba(71, 41, 115, .22), transparent 44%),
        linear-gradient(135deg, #07040e, #0d0719 48%, #07040f);
    }

    .topbar {
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
    }

    h1 {
      margin: 0;
      color: var(--ivory);
      font-size: clamp(.78rem, 1.7vw, 1.02rem);
      font-weight: 800;
      letter-spacing: .13em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .control {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(20, 12, 38, .68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      cursor: pointer;
      color: #d8ccdf;
      font-size: .67rem;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform 120ms var(--ease-out), border-color 180ms ease, background 180ms ease, color 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .control:hover:not(:disabled) {
      border-color: rgba(244, 189, 91, .48);
      background: rgba(38, 23, 60, .88);
      color: #fff6de;
      transform: translateY(-1px);
    }

    .control:active:not(:disabled) { transform: scale(.96); }
    .control:disabled { cursor: not-allowed; opacity: .38; }

    .control .icon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .control[aria-pressed="true"] {
      border-color: rgba(118, 244, 227, .58);
      background: rgba(18, 67, 67, .54);
      color: var(--cyan);
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(244, 233, 206, .14);
      border-radius: clamp(18px, 2.5vw, 30px);
      background: #090512;
      box-shadow:
        0 22px 70px rgba(0, 0, 0, .52),
        inset 0 0 0 1px rgba(255,255,255,.025),
        inset 0 0 70px rgba(82, 51, 136, .16);
      isolation: isolate;
      contain: layout paint;
    }

    .stage::before {
      content: "";
      position: absolute;
      z-index: 5;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 80px rgba(0,0,0,.55);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hud {
      position: absolute;
      z-index: 10;
      inset: 0;
      pointer-events: none;
    }

    .boss-hud {
      position: absolute;
      top: clamp(14px, 2.4vw, 24px);
      left: 50%;
      width: min(610px, calc(100% - 36px));
      transform: translateX(-50%);
    }

    .hud-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 7px;
      text-shadow: 0 2px 10px #000;
    }

    .boss-name {
      color: #fff3da;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(.78rem, 1.6vw, 1rem);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .phase-name {
      color: var(--gold-2);
      font-size: clamp(.57rem, 1.2vw, .7rem);
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .boss-track {
      position: relative;
      height: 9px;
      overflow: hidden;
      border: 1px solid rgba(244, 233, 206, .28);
      border-radius: 99px;
      background: rgba(7, 4, 15, .82);
      box-shadow: 0 3px 18px rgba(0,0,0,.38);
    }

    .boss-fill {
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--coral), #ff8f75 48%, var(--gold-2));
      box-shadow: 0 0 16px rgba(255, 83, 109, .5);
      transform: scaleX(1);
      transform-origin: left center;
      transition: transform 460ms var(--ease-out);
    }

    .boss-cuts {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 33.05%, rgba(9,6,18,.94) 33.05%, rgba(9,6,18,.94) 33.7%, transparent 33.7%,
        transparent 66.25%, rgba(9,6,18,.94) 66.25%, rgba(9,6,18,.94) 66.9%, transparent 66.9%);
    }

    .corner-hud {
      position: absolute;
      bottom: clamp(14px, 2.4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-shadow: 0 2px 10px #000;
    }

    .player-hud { left: clamp(14px, 2.4vw, 24px); }
    .score-hud { right: clamp(14px, 2.4vw, 24px); align-items: flex-end; }

    .micro-label {
      color: var(--muted);
      font-size: .57rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .spools { display: flex; gap: 7px; }

    .spool {
      position: relative;
      width: 19px;
      height: 12px;
      border: 1px solid rgba(255, 231, 160, .68);
      border-radius: 3px;
      background: linear-gradient(90deg, #c88b39, #ffe7a0 48%, #bf8133);
      box-shadow: 0 0 12px rgba(244, 189, 91, .25);
      transition: opacity 180ms ease, transform 240ms var(--ease-out), filter 180ms ease;
    }

    .spool::before,
    .spool::after {
      content: "";
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 3px;
      border-radius: 2px;
      background: var(--gold-2);
    }

    .spool::before { left: -2px; }
    .spool::after { right: -2px; }
    .spool.empty { opacity: .18; filter: grayscale(1); transform: translateY(2px) scale(.88); }

    .score-value {
      color: #fff7e5;
      font-size: clamp(.82rem, 2vw, 1.15rem);
      font-weight: 900;
      letter-spacing: .06em;
    }

    .combo {
      min-height: 1em;
      color: var(--cyan);
      font-size: .63rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .prompt-chip {
      position: absolute;
      z-index: 11;
      left: 50%;
      bottom: clamp(16px, 3vw, 28px);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid rgba(244, 233, 206, .18);
      border-radius: 999px;
      background: rgba(8, 5, 17, .64);
      backdrop-filter: blur(8px);
      color: rgba(244, 233, 206, .7);
      font-size: clamp(.55rem, 1.3vw, .68rem);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      transform: translateX(-50%);
      pointer-events: none;
      white-space: nowrap;
    }

    .prompt-chip kbd {
      padding: 2px 6px;
      border: 1px solid rgba(244, 233, 206, .32);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: rgba(255,255,255,.06);
      color: var(--ivory);
      font: inherit;
    }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 50%, rgba(12,7,25,.58), rgba(6,3,12,.9));
      opacity: 1;
      visibility: visible;
      transition: opacity 340ms ease, visibility 340ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: min(500px, calc(100% - 12px));
      padding: clamp(22px, 4.5vw, 42px);
      border: 1px solid rgba(244, 233, 206, .2);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(25,14,43,.92), rgba(9,5,18,.92));
      box-shadow: 0 24px 90px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.07);
      text-align: center;
    }

    .sigil {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin: 0 auto 18px;
      border: 1px solid rgba(244, 189, 91, .56);
      border-radius: 50%;
      color: var(--gold-2);
      font-family: Georgia, serif;
      font-size: 1.8rem;
      box-shadow: inset 0 0 24px rgba(244,189,91,.09), 0 0 30px rgba(244,189,91,.08);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--coral);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0;
      color: #fff2d5;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 5.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: .02em;
      line-height: .96;
    }

    .subtitle {
      margin: 8px 0 23px;
      color: var(--gold);
      font-size: clamp(.63rem, 1.8vw, .78rem);
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .instruction {
      margin: 0 auto 24px;
      color: #cdc0d8;
      font-size: clamp(.75rem, 2vw, .88rem);
      line-height: 1.5;
    }

    .primary {
      min-width: 176px;
      min-height: 48px;
      padding: 0 26px;
      border: 1px solid #ffe4a0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe39a, #e7a643);
      box-shadow: 0 8px 28px rgba(244, 189, 91, .2), inset 0 1px 0 rgba(255,255,255,.72);
      color: #211323;
      cursor: pointer;
      font-size: .72rem;
      font-weight: 950;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: transform 120ms var(--ease-out), filter 180ms ease;
    }

    .primary:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .primary:active { transform: scale(.96); }

    .result-stat {
      margin: 18px 0 24px;
      color: #cfc2da;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .app { gap: 8px; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
      .topbar { align-items: flex-start; }
      h1 { padding-top: 13px; }
      .controls { flex-wrap: wrap; gap: 4px; }
      .control { min-height: 44px; padding: 0 9px; font-size: .57rem; }
      .control .icon { display: none; }
      .stage { border-radius: 18px; }
      .boss-hud { top: 14px; }
      .boss-name { max-width: 60%; line-height: 1.1; }
      .prompt-chip { bottom: 61px; }
      .corner-hud { bottom: 14px; }
      .card { padding: 25px 20px; }
    }

    @media (max-width: 430px) {
      .topbar { display: grid; grid-template-columns: 1fr; gap: 5px; }
      h1 { padding: 4px 2px 2px; }
      .controls { justify-content: space-between; flex-wrap: nowrap; }
      .control { flex: 1; padding-inline: 5px; }
      .control:last-child { flex: 0 0 44px; font-size: 0; }
      .control:last-child::after { content: "♪"; font-size: .72rem; }
      .prompt-chip { bottom: 58px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="One-button boss fight">
    <header class="topbar">
      <h1>GPT-5.6 Sol</h1>
      <nav class="controls" aria-label="Game controls">
        <button class="control" id="startControl" type="button"><span class="icon"></span><span>Start</span></button>
        <button class="control" id="pauseControl" type="button" disabled><span class="icon"></span><span>Pause</span></button>
        <button class="control" id="restartControl" type="button"><span class="icon"></span><span>Restart</span></button>
        <button class="control" id="demoControl" type="button" aria-pressed="false"><span class="icon"></span><span>Demo</span></button>
        <button class="control" id="muteControl" type="button" aria-pressed="false" aria-label="Mute sound"><span>Sound</span></button>
      </nav>
    </header>

    <section class="stage" id="stage" aria-label="Threadneedle arena">
      <canvas id="game" tabindex="0" aria-label="Game arena. Press Space or activate the arena to stitch-dash."></canvas>

      <div class="hud">
        <div class="boss-hud">
          <div class="hud-row">
            <span class="boss-name">Threadneedle</span>
            <span class="phase-name" id="phaseName">I · Mark the Hem</span>
          </div>
          <div class="boss-track" id="bossTrack" role="progressbar" aria-label="Threadneedle stability" aria-valuemin="0" aria-valuemax="90" aria-valuenow="90">
            <div class="boss-fill" id="bossFill"></div>
            <div class="boss-cuts"></div>
          </div>
        </div>

        <div class="corner-hud player-hud">
          <span class="micro-label">Golden spools</span>
          <div class="spools" id="spools" role="progressbar" aria-label="Player stability" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4">
            <span class="spool" aria-hidden="true"></span><span class="spool" aria-hidden="true"></span><span class="spool" aria-hidden="true"></span><span class="spool" aria-hidden="true"></span>
          </div>
        </div>

        <div class="corner-hud score-hud">
          <span class="micro-label">Stitches</span>
          <span class="score-value" id="scoreValue">0000</span>
          <span class="combo" id="comboValue"></span>
        </div>
      </div>

      <div class="prompt-chip"><kbd>Space</kbd><span>or tap · Stitch dash</span></div>

      <div class="overlay" id="introOverlay">
        <div class="card">
          <div class="sigil" aria-hidden="true">✦</div>
          <p class="eyebrow">A one-button duel</p>
          <h2>Threadneedle</h2>
          <p class="subtitle">The Crowned Loom</p>
          <p class="instruction">Space, click, or tap to stitch-dash through danger.</p>
          <button class="primary" id="introStart" type="button">Start</button>
        </div>
      </div>

      <div class="overlay hidden" id="resultOverlay">
        <div class="card">
          <div class="sigil" id="resultSigil" aria-hidden="true">✦</div>
          <p class="eyebrow" id="resultEyebrow">The crown unmade</p>
          <h2 id="resultTitle">Victory</h2>
          <p class="result-stat" id="resultStat">0 stitches · 0:00</p>
          <button class="primary" id="resultRestart" type="button">Restart</button>
        </div>
      </div>

      <div class="sr-only" id="liveRegion" aria-live="polite"></div>
    </section>
  </main>

  <script>
  (() => {
    "use strict";

    // CORE_BEGIN
    const TICK_US = 20000;
    const TICK_MS = TICK_US / 1000;
    const TAU = Math.PI * 2;
    const PHASE_NAMES = ["", "I · Mark the Hem", "II · Bind the Hands", "III · Unmake the Crown"];

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const round = (value, places = 3) => {
      const p = 10 ** places;
      return Math.round(value * p) / p;
    };
    const normAngle = angle => ((angle % TAU) + TAU) % TAU;
    const angleDistance = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
    const seed32 = value => {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? (Math.trunc(numeric) >>> 0) : 1337;
    };

    function nextRandom(stream) {
      let x = stream.value >>> 0;
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      stream.value = x >>> 0;
      return stream.value / 4294967296;
    }

    function initialState(seed) {
      const normalized = seed32(seed);
      return {
        seed: normalized,
        tick: 0,
        status: "ready",
        started: false,
        paused: true,
        demo: false,
        outcome: null,
        rng: { value: (normalized ^ 0x9e3779b9) >>> 0 || 0x6d2b79f5 },
        fxRng: { value: (normalized ^ 0xa341316c) >>> 0 || 0x1b56c4e9 },
        phase: 1,
        phaseTransitionUntil: 0,
        nextAttackTick: 65,
        attackId: 0,
        inputId: 0,
        inputQueue: [],
        particles: [],
        flash: 0,
        shake: 0,
        banner: { text: "", subtext: "", untilTick: 0 },
        boss: {
          hp: 90,
          maxHp: 90,
          recoilUntil: 0,
          hurtUntil: 0,
          armBound: 0
        },
        player: {
          hp: 4,
          maxHp: 4,
          angle: -Math.PI / 2,
          angularVelocity: 0.0049,
          dashFrom: -Math.PI / 2,
          dashTo: Math.PI / 2,
          dashStartTick: -100,
          dashEndTick: -100,
          invulnerableUntil: -1,
          cooldownUntil: 0,
          lastActionTick: -100,
          actions: 0
        },
        attacks: [],
        score: 0,
        combo: 0,
        bestCombo: 0,
        successfulCounters: 0,
        demoActions: 0
      };
    }

    function createEngine(options = {}) {
      let state = initialState(options.seed ?? 1337);
      let accumulatorUs = 0;
      const onEvent = typeof options.onEvent === "function" ? options.onEvent : () => {};

      function emit(type, detail = {}) {
        onEvent({ type, tick: state.tick, ...detail });
      }

      function reset(seed = state.seed) {
        const keepSeed = seed32(seed);
        state = initialState(keepSeed);
        accumulatorUs = 0;
        emit("reset", { seed: keepSeed });
        return snapshot();
      }

      function resume() {
        if (state.outcome) return false;
        state.started = true;
        state.paused = false;
        state.status = state.phaseTransitionUntil > state.tick ? "phaseTransition" : "running";
        emit("start");
        return true;
      }

      function start() {
        state.demo = false;
        state.inputQueue = state.inputQueue.filter(input => input.source !== "demo");
        return resume();
      }

      function pause() {
        if (!state.started || state.outcome) return false;
        state.paused = true;
        state.status = "paused";
        emit("pause");
        return true;
      }

      function setDemo(enabled) {
        const shouldEnable = Boolean(enabled);
        if (shouldEnable) {
          const currentSeed = state.seed;
          reset(currentSeed);
          state.demo = true;
          resume();
          emit("demo", { enabled: true });
        } else {
          state.demo = false;
          state.inputQueue = state.inputQueue.filter(input => input.source !== "demo");
          emit("demo", { enabled: false });
        }
        return state.demo;
      }

      function queuePress(source = "api") {
        if (!state.started || state.paused || state.outcome || state.phaseTransitionUntil > state.tick) return false;
        if (state.tick + 1 < state.player.cooldownUntil) return false;
        state.inputQueue.push({ id: ++state.inputId, targetTick: state.tick + 1, source });
        return true;
      }

      function randomRange(min, max, stream = state.fxRng) {
        return min + (max - min) * nextRandom(stream);
      }

      function playerPoint(angle = state.player.angle, radius = 276) {
        return { x: 600 + Math.cos(angle) * radius, y: 382 + Math.sin(angle) * radius };
      }

      function addParticles(kind, angle, count) {
        const origin = playerPoint(angle);
        const colors = kind === "hurt" ? ["#ff536d", "#ff9c82", "#f4e9ce"] : ["#f4bd5b", "#ffe7a0", "#76f4e3"];
        for (let i = 0; i < count; i += 1) {
          const direction = angle + randomRange(-1.7, 1.7);
          const speed = randomRange(1.1, 4.2);
          state.particles.push({
            x: origin.x,
            y: origin.y,
            vx: Math.cos(direction) * speed,
            vy: Math.sin(direction) * speed,
            life: Math.round(randomRange(22, 50)),
            maxLife: 50,
            size: randomRange(1.4, 4.2),
            color: colors[Math.floor(nextRandom(state.fxRng) * colors.length)]
          });
        }
        if (state.particles.length > 150) state.particles.splice(0, state.particles.length - 150);
      }

      function activeAttack() {
        return state.attacks.find(attack => !attack.resolved) || null;
      }

      function executeAction(input) {
        const player = state.player;
        if (state.tick < player.cooldownUntil) return;

        const from = player.angle;
        const to = normAngle(from + Math.PI);
        player.dashFrom = from;
        player.dashTo = to;
        player.dashStartTick = state.tick;
        player.dashEndTick = state.tick + 22;
        player.invulnerableUntil = state.tick + 24;
        player.cooldownUntil = state.tick + 18;
        player.lastActionTick = state.tick;
        player.angle = to;
        player.actions += 1;
        if (input.source === "demo") state.demoActions += 1;

        const attack = activeAttack();
        if (attack && attack.type === "buttonhole" && !attack.stitched) {
          const gateDistance = Math.min(angleDistance(from, attack.gateAngle), angleDistance(from, normAngle(attack.gateAngle + Math.PI)));
          if (gateDistance <= attack.gateWidth) {
            attack.stitched = true;
            attack.stitchTick = state.tick;
            attack.stitchAccuracy = gateDistance;
            state.flash = Math.max(state.flash, .18);
            emit("stitch", { attackId: attack.id });
          }
        }

        addParticles("dash", from, 13);
        emit("action", { source: input.source, from: round(from), to: round(to) });
      }

      function demoThink() {
        if (!state.demo || state.paused || state.outcome || state.phaseTransitionUntil > state.tick) return;
        const attack = activeAttack();
        if (!attack || attack.demoQueued) return;
        const nextTick = state.tick + 1;

        if (attack.type === "needle" && attack.locked && nextTick >= attack.lockTick + 28) {
          if (queuePress("demo")) attack.demoQueued = true;
        } else if (attack.type === "buttonhole" && nextTick >= attack.spawnTick + 38) {
          const playerAngleNext = normAngle(state.player.angle + state.player.angularVelocity);
          const distance = Math.min(angleDistance(playerAngleNext, attack.gateAngle), angleDistance(playerAngleNext, normAngle(attack.gateAngle + Math.PI)));
          if (distance <= .075 && queuePress("demo")) attack.demoQueued = true;
        } else if (attack.type === "crown" && nextTick >= attack.impactTick - 7) {
          if (queuePress("demo")) attack.demoQueued = true;
        }
      }

      function spawnAttack() {
        const id = ++state.attackId;
        const phasePatterns = {
          1: ["thorn-needle", "hook-needle", "silver-needle"],
          2: ["satin-seam", "cross-seam", "chain-seam"],
          3: ["five-thread-crown", "seven-thread-crown", "split-thread-crown"]
        };
        const choices = phasePatterns[state.phase];
        const pattern = choices[Math.floor(nextRandom(state.rng) * choices.length)];
        const jitter = Math.floor(nextRandom(state.rng) * 9) - 4;
        let attack;

        if (state.phase === 1) {
          attack = {
            id,
            type: "needle",
            pattern,
            label: "NEEDLE MARK",
            spawnTick: state.tick,
            lockTick: state.tick + 65,
            impactTick: state.tick + 158 + jitter,
            endTick: state.tick + 180 + jitter,
            targetAngle: state.player.angle,
            locked: false,
            resolved: false,
            demoQueued: false
          };
          state.banner = { text: "WAIT FOR THE LOCK", subtext: "then leave the mark", untilTick: state.tick + 72 };
        } else if (state.phase === 2) {
          const leadTicks = (pattern === "cross-seam" ? 101 : pattern === "chain-seam" ? 115 : 108) + jitter;
          attack = {
            id,
            type: "buttonhole",
            pattern,
            label: "BINDING SEAM",
            spawnTick: state.tick,
            impactTick: state.tick + 238 + jitter,
            endTick: state.tick + 260 + jitter,
            gateAngle: normAngle(state.player.angle + state.player.angularVelocity * leadTicks),
            gateWidth: pattern === "chain-seam" ? .31 : pattern === "cross-seam" ? .37 : .34,
            stitched: false,
            stitchTick: -1,
            stitchAccuracy: 9,
            resolved: false,
            demoQueued: false
          };
          state.banner = { text: "STITCH THE GOLD SEAM", subtext: "dash through the buttonholes", untilTick: state.tick + 92 };
        } else {
          attack = {
            id,
            type: "crown",
            pattern,
            label: "CROWN SNAP",
            spawnTick: state.tick,
            impactTick: state.tick + 176 + jitter,
            endTick: state.tick + 198 + jitter,
            threadAngle: nextRandom(state.rng) * Math.PI,
            threadCount: pattern === "seven-thread-crown" ? 7 : pattern === "split-thread-crown" ? 6 : 5,
            resolved: false,
            demoQueued: false
          };
          state.banner = { text: "SHIFT ON IMPACT", subtext: "pass through the closing crown", untilTick: state.tick + 76 };
        }

        state.attacks.push(attack);
        emit("attack", { attackType: attack.type, pattern: attack.pattern, id });
      }

      function beginPhase(phase) {
        state.phase = phase;
        state.phaseTransitionUntil = state.tick + 112;
        state.status = "phaseTransition";
        state.attacks.length = 0;
        state.inputQueue.length = 0;
        state.nextAttackTick = state.phaseTransitionUntil + 48;
        state.flash = .45;
        state.shake = .35;
        state.banner = {
          text: phase === 2 ? "THE HANDS UNFURL" : "THE CROWN COMES APART",
          subtext: PHASE_NAMES[phase],
          untilTick: state.phaseTransitionUntil
        };
        emit("phase", { phase });
      }

      function finish(outcome) {
        state.outcome = outcome;
        state.status = outcome === "victory" ? "victory" : "defeat";
        state.paused = false;
        state.inputQueue.length = 0;
        state.flash = outcome === "victory" ? .75 : .46;
        state.shake = outcome === "victory" ? .62 : .4;
        emit(outcome, { score: state.score });
      }

      function counterAttack(attack) {
        const timing = attack.type === "crown"
          ? Math.abs(attack.impactTick - state.player.lastActionTick)
          : attack.type === "buttonhole"
            ? attack.stitchAccuracy * 20
            : Math.abs(state.player.lastActionTick - attack.lockTick);
        const perfect = timing <= 5;
        const damage = 10;

        state.boss.hp = clamp(state.boss.hp - damage, 0, state.boss.maxHp);
        state.boss.recoilUntil = state.tick + 20;
        state.boss.hurtUntil = state.tick + 12;
        state.combo += 1;
        state.bestCombo = Math.max(state.bestCombo, state.combo);
        state.successfulCounters += 1;
        state.score += (perfect ? 160 : 100) + Math.max(0, state.combo - 1) * 25;
        state.flash = Math.max(state.flash, perfect ? .44 : .28);
        state.shake = Math.max(state.shake, perfect ? .38 : .24);
        addParticles("counter", normAngle(state.player.angle + Math.PI), perfect ? 26 : 18);
        emit("counter", { perfect, attackType: attack.type, bossHp: state.boss.hp });

        if (state.boss.hp <= 0) {
          finish("victory");
        } else if (state.phase === 1 && state.boss.hp <= 60) {
          beginPhase(2);
        } else if (state.phase === 2 && state.boss.hp <= 30) {
          state.boss.armBound = 3;
          beginPhase(3);
        }
      }

      function hurtPlayer(attack) {
        state.player.hp = clamp(state.player.hp - 1, 0, state.player.maxHp);
        state.combo = 0;
        state.flash = Math.max(state.flash, .42);
        state.shake = Math.max(state.shake, .5);
        addParticles("hurt", state.player.angle, 22);
        emit("hurt", { attackType: attack.type, hp: state.player.hp });
        if (state.player.hp <= 0) finish("defeat");
      }

      function resolveAttack(attack) {
        if (attack.resolved || state.outcome) return;
        attack.resolved = true;
        let defended = false;

        if (attack.type === "needle") {
          defended = angleDistance(state.player.angle, attack.targetAngle) > 1.1;
        } else if (attack.type === "buttonhole") {
          defended = attack.stitched;
        } else if (attack.type === "crown") {
          defended = state.player.invulnerableUntil >= state.tick && state.player.dashStartTick <= state.tick;
        }

        if (defended) counterAttack(attack);
        else hurtPlayer(attack);
      }

      function updateParticles() {
        for (const particle of state.particles) {
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vx *= .968;
          particle.vy = particle.vy * .968 + .018;
          particle.life -= 1;
        }
        state.particles = state.particles.filter(particle => particle.life > 0);
      }

      function fixedTick() {
        if (!state.started || state.paused || state.outcome) return;

        demoThink();
        state.tick += 1;

        const dueInputs = state.inputQueue.filter(input => input.targetTick <= state.tick);
        state.inputQueue = state.inputQueue.filter(input => input.targetTick > state.tick);
        for (const input of dueInputs) executeAction(input);

        state.player.angle = normAngle(state.player.angle + state.player.angularVelocity);
        state.flash *= .86;
        state.shake *= .84;
        updateParticles();

        if (state.phaseTransitionUntil > 0 && state.tick >= state.phaseTransitionUntil) {
          state.phaseTransitionUntil = 0;
          state.status = "running";
        }

        if (state.phaseTransitionUntil > state.tick) return;

        for (const attack of state.attacks) {
          if (attack.type === "needle" && !attack.locked) {
            if (state.tick >= attack.lockTick) attack.locked = true;
            else attack.targetAngle = state.player.angle;
          }
          if (!attack.resolved && state.tick >= attack.impactTick) resolveAttack(attack);
        }

        state.attacks = state.attacks.filter(attack => state.tick <= attack.endTick);
        if (!state.outcome && state.attacks.length === 0 && state.tick >= state.nextAttackTick) {
          spawnAttack();
        }

        const latest = state.attacks[state.attacks.length - 1];
        if (latest && latest.resolved) {
          const gap = state.phase === 1 ? 45 : state.phase === 2 ? 42 : 50;
          state.nextAttackTick = Math.max(state.nextAttackTick, latest.endTick + gap);
        }
      }

      function step(milliseconds) {
        const value = Number(milliseconds);
        if (!Number.isFinite(value) || value < 0) throw new TypeError("step(milliseconds) requires a finite non-negative number");
        accumulatorUs += Math.round(value * 1000);
        let guard = 0;
        while (accumulatorUs >= TICK_US) {
          fixedTick();
          accumulatorUs -= TICK_US;
          guard += 1;
          if (guard > 1000000) throw new Error("step limit exceeded");
        }
        return snapshot();
      }

      function snapshot() {
        const attacks = state.attacks.map(attack => ({
          id: attack.id,
          type: attack.type,
          pattern: attack.pattern,
          label: attack.label,
          state: attack.resolved ? "resolved" : attack.locked ? "locked" : "telegraph",
          impactIn: Math.max(0, (attack.impactTick - state.tick) * TICK_MS),
          targetAngle: round(attack.targetAngle ?? attack.gateAngle ?? attack.threadAngle ?? 0),
          stitched: Boolean(attack.stitched),
          resolved: Boolean(attack.resolved)
        }));

        return {
          seed: state.seed,
          simulationTime: state.tick * TICK_MS,
          status: state.status,
          phase: state.phase,
          phaseName: PHASE_NAMES[state.phase],
          player: {
            stability: state.player.hp,
            maxStability: state.player.maxHp,
            angle: round(state.player.angle),
            dashing: state.tick <= state.player.dashEndTick,
            invulnerable: state.tick <= state.player.invulnerableUntil,
            actionReady: state.tick >= state.player.cooldownUntil,
            actions: state.player.actions
          },
          boss: {
            name: "Threadneedle",
            title: "The Crowned Loom",
            stability: state.boss.hp,
            maxStability: state.boss.maxHp,
            boundArms: state.boss.armBound
          },
          activeAttacks: attacks,
          score: {
            points: state.score,
            combo: state.combo,
            bestCombo: state.bestCombo,
            counters: state.successfulCounters
          },
          demo: {
            enabled: state.demo,
            actions: state.demoActions
          },
          outcome: state.outcome
        };
      }

      return {
        reset,
        start,
        resume,
        pause,
        setDemo,
        press: queuePress,
        step,
        snapshot,
        getState: () => state,
        isPaused: () => state.paused
      };
    }

    function canonicalSnapshot(snapshot) {
      const clone = JSON.parse(JSON.stringify(snapshot));
      delete clone.demo;
      return clone;
    }

    function finiteNumbers(value) {
      if (typeof value === "number") return Number.isFinite(value);
      if (Array.isArray(value)) return value.every(finiteNumbers);
      if (value && typeof value === "object") return Object.values(value).every(finiteNumbers);
      return true;
    }

    function runCoreSelfTest() {
      const tests = [];
      const test = (name, fn) => {
        try {
          const detail = fn();
          tests.push({ name, passed: true, ...(detail ? { detail } : {}) });
        } catch (error) {
          tests.push({ name, passed: false, detail: error instanceof Error ? error.message : String(error) });
        }
      };
      const assert = (condition, message) => { if (!condition) throw new Error(message); };

      test("deterministic reset", () => {
        const a = createEngine({ seed: 77 });
        a.start();
        a.step(2400);
        const reset = a.reset(77);
        const fresh = createEngine({ seed: 77 }).snapshot();
        assert(JSON.stringify(reset) === JSON.stringify(fresh), "same seed did not restore identical state");
        return "seed 77 restored byte-identical snapshots";
      });

      test("pause stops simulation", () => {
        const engine = createEngine({ seed: 5 });
        engine.start();
        engine.step(1000);
        engine.pause();
        const before = engine.snapshot();
        engine.step(5000);
        const after = engine.snapshot();
        assert(before.simulationTime === after.simulationTime, "simulation advanced while paused");
        engine.start();
        engine.step(40);
        assert(engine.snapshot().simulationTime > after.simulationTime, "simulation did not resume");
        return "5 seconds of paused stepping changed no simulation time";
      });

      test("fixed-step chunking is deterministic", () => {
        const a = createEngine({ seed: 90210 });
        const b = createEngine({ seed: 90210 });
        a.setDemo(true);
        b.setDemo(true);
        a.step(65000);
        const chunks = [17, 83, 140, 260, 500];
        for (let elapsed = 0, index = 0; elapsed < 65000; index += 1) {
          const amount = Math.min(chunks[index % chunks.length], 65000 - elapsed);
          b.step(amount);
          elapsed += amount;
        }
        assert(JSON.stringify(a.snapshot()) === JSON.stringify(b.snapshot()), "different step chunking changed outcome");
        return "65 seconds matched across large and irregular steps";
      });

      let winningSnapshot = null;
      let observedPhases = [];
      test("phase progression and reachable success", () => {
        const engine = createEngine({ seed: 1337 });
        engine.setDemo(true);
        observedPhases = [engine.snapshot().phase];
        while (!engine.snapshot().outcome && engine.snapshot().simulationTime < 75000) {
          engine.step(200);
          const phase = engine.snapshot().phase;
          if (observedPhases[observedPhases.length - 1] !== phase) observedPhases.push(phase);
        }
        winningSnapshot = engine.snapshot();
        assert(observedPhases.join(",") === "1,2,3", `observed phases ${observedPhases.join(",")}`);
        assert(winningSnapshot.outcome === "victory", "demo did not reach victory");
        assert(winningSnapshot.simulationTime >= 45000 && winningSnapshot.simulationTime <= 75000,
          `victory time ${winningSnapshot.simulationTime}ms is outside 45-75s`);
        return `phases ${observedPhases.join("→")}; victory at ${(winningSnapshot.simulationTime / 1000).toFixed(1)}s`;
      });

      test("finite numeric state", () => {
        assert(winningSnapshot && finiteNumbers(winningSnapshot), "representative snapshot contains a non-finite number");
        return "all public numeric state is finite";
      });

      test("reachable failure", () => {
        const engine = createEngine({ seed: 1337 });
        engine.start();
        engine.step(40000);
        const result = engine.snapshot();
        assert(result.outcome === "defeat", `expected defeat, received ${result.outcome}`);
        assert(result.player.stability === 0, "defeat did not deplete player stability");
        return `ordinary missed attacks defeated player at ${(result.simulationTime / 1000).toFixed(1)}s`;
      });

      test("restart restores play", () => {
        const engine = createEngine({ seed: 44 });
        engine.start();
        engine.step(9000);
        const restarted = engine.reset(44);
        const fresh = createEngine({ seed: 44 }).snapshot();
        assert(JSON.stringify(restarted) === JSON.stringify(fresh), "restart state differs from fresh state");
        engine.start();
        engine.step(100);
        assert(engine.snapshot().simulationTime === 100, "restarted engine did not advance");
        return "partial run reset to a fresh playable encounter";
      });

      test("demo uses normal action system", () => {
        const actionTicks = [];
        const demo = createEngine({ seed: 2468, onEvent: event => {
          if (event.type === "action") actionTicks.push(event.tick);
        }});
        demo.setDemo(true);
        while (!demo.snapshot().outcome && demo.snapshot().simulationTime < 75000) demo.step(TICK_MS);

        const manual = createEngine({ seed: 2468 });
        manual.start();
        let actionIndex = 0;
        while (!manual.snapshot().outcome && manual.snapshot().simulationTime < 75000) {
          const nextTick = manual.getState().tick + 1;
          if (actionTicks[actionIndex] === nextTick) {
            manual.press("replay");
            actionIndex += 1;
          }
          manual.step(TICK_MS);
        }
        assert(actionTicks.length > 0, "demo produced no actions");
        assert(JSON.stringify(canonicalSnapshot(demo.snapshot())) === JSON.stringify(canonicalSnapshot(manual.snapshot())),
          "replayed demo actions diverged from normal gameplay");
        return `${actionTicks.length} demo presses replayed through press()`;
      });

      return { passed: tests.every(item => item.passed), tests };
    }
    // CORE_END

    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d", { alpha: false });
    const stage = document.getElementById("stage");
    const introOverlay = document.getElementById("introOverlay");
    const resultOverlay = document.getElementById("resultOverlay");
    const startControl = document.getElementById("startControl");
    const pauseControl = document.getElementById("pauseControl");
    const restartControl = document.getElementById("restartControl");
    const demoControl = document.getElementById("demoControl");
    const muteControl = document.getElementById("muteControl");
    const introStart = document.getElementById("introStart");
    const resultRestart = document.getElementById("resultRestart");
    const phaseName = document.getElementById("phaseName");
    const bossTrack = document.getElementById("bossTrack");
    const bossFill = document.getElementById("bossFill");
    const scoreValue = document.getElementById("scoreValue");
    const comboValue = document.getElementById("comboValue");
    const spoolsTrack = document.getElementById("spools");
    const spools = [...document.querySelectorAll(".spool")];
    const liveRegion = document.getElementById("liveRegion");
    const resultSigil = document.getElementById("resultSigil");
    const resultEyebrow = document.getElementById("resultEyebrow");
    const resultTitle = document.getElementById("resultTitle");
    const resultStat = document.getElementById("resultStat");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let muted = false;
    let audioContext = null;
    let lastFrame = performance.now();
    let viewWidth = 1;
    let viewHeight = 1;
    let deviceScale = 1;
    let lastAnnounced = "";
    let lastOutcome = null;

    function ensureAudio() {
      if (muted) return null;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
        return audioContext;
      } catch (_) {
        return null;
      }
    }

    function tone(frequency, duration, gainValue, type = "sine", bend = 0) {
      const audio = ensureAudio();
      if (!audio) return;
      const now = audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(28, frequency + bend), now + duration);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(gainValue, now + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + .02);
    }

    function playEvent(event) {
      if (event.type === "action") {
        tone(180, .17, .05, "triangle", 310);
        setTimeout(() => tone(520, .11, .028, "sine", 120), 45);
      } else if (event.type === "attack") {
        tone(event.attackType === "crown" ? 75 : 105, .34, .028, "sawtooth", -34);
      } else if (event.type === "stitch") {
        tone(410, .12, .035, "square", 190);
      } else if (event.type === "counter") {
        tone(event.perfect ? 260 : 220, .28, .065, "triangle", 520);
        setTimeout(() => tone(700, .2, .032, "sine", 240), 55);
        announce(`Counter stitch. Threadneedle has ${event.bossHp} stability.`);
      } else if (event.type === "hurt") {
        tone(92, .3, .06, "sawtooth", -55);
        announce(`${event.hp} golden spools remain.`);
      } else if (event.type === "phase") {
        tone(110, .6, .04, "triangle", 220);
      } else if (event.type === "victory") {
        [0, 110, 230].forEach((delay, index) => setTimeout(() => tone([330, 495, 660][index], .5, .045, "triangle", 120), delay));
      } else if (event.type === "defeat") {
        tone(145, .75, .05, "sawtooth", -105);
      }
    }

    const engine = createEngine({ seed: 1337, onEvent: playEvent });

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      viewWidth = Math.max(1, rect.width);
      viewHeight = Math.max(1, rect.height);
      deviceScale = Math.min(2.25, Math.max(1, window.devicePixelRatio || 1));
      const width = Math.round(viewWidth * deviceScale);
      const height = Math.round(viewHeight * deviceScale);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function worldTransform(ctx) {
      const portrait = viewWidth / viewHeight < .88;
      const visibleWorldWidth = portrait ? 650 : 1200;
      const scale = Math.min(viewWidth / visibleWorldWidth, viewHeight / 720);
      const x = viewWidth / 2 - 600 * scale;
      const y = viewHeight / 2 - 360 * scale;
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      return scale;
    }

    function pathRoundedPolygon(ctx, points, radius = 0) {
      if (!points.length) return;
      if (!radius) {
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
        return;
      }
      for (let i = 0; i < points.length; i += 1) {
        const current = points[i];
        const next = points[(i + 1) % points.length];
        const previous = points[(i - 1 + points.length) % points.length];
        const toPrevious = Math.atan2(previous[1] - current[1], previous[0] - current[0]);
        const toNext = Math.atan2(next[1] - current[1], next[0] - current[0]);
        const start = [current[0] + Math.cos(toPrevious) * radius, current[1] + Math.sin(toPrevious) * radius];
        const end = [current[0] + Math.cos(toNext) * radius, current[1] + Math.sin(toNext) * radius];
        if (i === 0) ctx.moveTo(start[0], start[1]);
        else ctx.lineTo(start[0], start[1]);
        ctx.quadraticCurveTo(current[0], current[1], end[0], end[1]);
      }
      ctx.closePath();
    }

    function drawBackground(ctx, state, time) {
      const gradient = ctx.createRadialGradient(600, 370, 40, 600, 370, 700);
      gradient.addColorStop(0, state.phase === 3 ? "#251025" : "#1c1033");
      gradient.addColorStop(.48, "#0e081c");
      gradient.addColorStop(1, "#05030a");
      ctx.fillStyle = gradient;
      ctx.fillRect(-200, -100, 1600, 920);

      ctx.save();
      ctx.globalAlpha = .18;
      ctx.strokeStyle = "#8c78ae";
      ctx.lineWidth = 1;
      const drift = reducedMotion.matches ? 0 : Math.sin(time * .00008) * 8;
      for (let y = -20; y < 780; y += 22) {
        ctx.beginPath();
        for (let x = -100; x <= 1300; x += 28) {
          const wave = Math.sin(x * .018 + y * .009) * 4 + drift;
          if (x === -100) ctx.moveTo(x, y + wave);
          else ctx.lineTo(x, y + wave);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = .1;
      for (let x = -80; x < 1300; x += 24) {
        ctx.beginPath();
        ctx.moveTo(x, -20);
        ctx.lineTo(x + 100, 780);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(600, 382);
      ctx.rotate(-.08);
      ctx.globalAlpha = .2;
      ctx.strokeStyle = "#f4bd5b";
      ctx.lineWidth = 1;
      for (let i = 0; i < 14; i += 1) {
        const a = i * TAU / 14;
        const r = 330 + (i % 3) * 18;
        ctx.beginPath();
        ctx.arc(0, 0, r, a, a + .22);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawArena(ctx, state, time) {
      const centerX = 600;
      const centerY = 382;
      const pulse = reducedMotion.matches ? 0 : Math.sin(time * .0013) * 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      const shadow = ctx.createRadialGradient(0, 0, 160, 0, 0, 342);
      shadow.addColorStop(0, "rgba(50,28,76,.16)");
      shadow.addColorStop(.75, "rgba(20,10,38,.62)");
      shadow.addColorStop(1, "rgba(0,0,0,.82)");
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.arc(0, 0, 330 + pulse, 0, TAU);
      ctx.fill();

      ctx.setLineDash([3, 11]);
      ctx.lineDashOffset = reducedMotion.matches ? 0 : -time * .012;
      ctx.strokeStyle = "rgba(255,231,160,.54)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 305, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = "rgba(143,120,255,.22)";
      ctx.lineWidth = 1;
      for (const radius of [88, 154, 218, 275]) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.stroke();
      }

      ctx.globalAlpha = .28;
      for (let i = 0; i < 12; i += 1) {
        const a = i * TAU / 12 + .08;
        ctx.rotate(TAU / 12);
        ctx.fillStyle = i % 3 === 0 ? "#f4bd5b" : "#8f78ff";
        ctx.beginPath();
        ctx.moveTo(0, -252);
        ctx.lineTo(5, -243);
        ctx.lineTo(0, -233);
        ctx.lineTo(-5, -243);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawNeedleTelegraph(ctx, attack, state) {
      const progress = clamp((state.tick - attack.spawnTick) / (attack.impactTick - attack.spawnTick), 0, 1);
      const barbed = attack.pattern === "thorn-needle";
      const hooked = attack.pattern === "hook-needle";
      const x = 600 + Math.cos(attack.targetAngle) * 276;
      const y = 382 + Math.sin(attack.targetAngle) * 276;
      const locked = attack.locked;

      ctx.save();
      ctx.strokeStyle = locked ? "rgba(255,83,109,.9)" : "rgba(255,121,137,.46)";
      ctx.fillStyle = "rgba(255,83,109,.1)";
      ctx.lineWidth = locked ? (barbed ? 4 : 3) : 2;
      ctx.setLineDash(locked ? (hooked ? [18, 5, 3, 5] : [11, 7]) : [3, 10]);
      ctx.lineDashOffset = -state.tick * 1.2;
      ctx.beginPath();
      ctx.moveTo(600, 330);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.translate(x, y);
      ctx.rotate(attack.targetAngle + Math.PI / 2);
      const size = 23 + progress * (barbed ? 16 : 12);
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = locked ? "#fff0dc" : "#ff7186";
      ctx.lineWidth = locked ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(-size, -size);
      ctx.lineTo(size, size);
      ctx.moveTo(size, -size);
      ctx.lineTo(-size, size);
      ctx.stroke();
      ctx.restore();

      const remaining = clamp((attack.impactTick - state.tick) / (attack.impactTick - attack.spawnTick), 0, 1);
      ctx.save();
      ctx.strokeStyle = locked ? "rgba(255,240,220,.9)" : "rgba(255,83,109,.55)";
      ctx.lineWidth = locked ? 7 : 4;
      ctx.beginPath();
      ctx.arc(600, 330, 185 + remaining * 150, attack.targetAngle - .08, attack.targetAngle + .08);
      ctx.stroke();
      ctx.restore();
    }

    function drawButtonhole(ctx, x, y, angle, ready, stitched) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.shadowColor = stitched ? "#76f4e3" : "#f4bd5b";
      ctx.shadowBlur = ready ? 24 : 12;
      ctx.strokeStyle = stitched ? "#76f4e3" : ready ? "#fff0b8" : "#f4bd5b";
      ctx.fillStyle = "rgba(244,189,91,.1)";
      ctx.lineWidth = ready ? 5 : 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 28, 12, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-8, 0, 2.5, 0, TAU);
      ctx.arc(8, 0, 2.5, 0, TAU);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
      ctx.restore();
    }

    function drawButtonholeTelegraph(ctx, attack, state) {
      const a = attack.gateAngle;
      const a2 = normAngle(a + Math.PI);
      const x1 = 600 + Math.cos(a) * 276;
      const y1 = 382 + Math.sin(a) * 276;
      const x2 = 600 + Math.cos(a2) * 276;
      const y2 = 382 + Math.sin(a2) * 276;
      const distance = Math.min(angleDistance(state.player.angle, a), angleDistance(state.player.angle, a2));
      const ready = distance <= attack.gateWidth;
      const progress = clamp((state.tick - attack.spawnTick) / (attack.impactTick - attack.spawnTick), 0, 1);

      ctx.save();
      ctx.setLineDash(attack.stitched ? [] : [4, 10]);
      ctx.lineDashOffset = -state.tick;
      const seamColor = attack.pattern === "cross-seam" ? "rgba(255,231,160,.64)"
        : attack.pattern === "chain-seam" ? "rgba(203,151,255,.62)" : "rgba(244,189,91,.5)";
      ctx.strokeStyle = attack.stitched ? "rgba(118,244,227,.9)" : seamColor;
      ctx.lineWidth = attack.stitched ? 5 : ready ? 3.5 : 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();

      drawButtonhole(ctx, x1, y1, a + Math.PI / 2, ready, attack.stitched);
      drawButtonhole(ctx, x2, y2, a2 + Math.PI / 2, ready, attack.stitched);

      ctx.save();
      ctx.translate(600, 382);
      ctx.strokeStyle = `rgba(255,83,109,${.18 + progress * .52})`;
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.arc(0, 0, 320 - progress * 30, -.64 - progress * .72, .64 + progress * .72);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 320 - progress * 30, Math.PI - .64 - progress * .72, Math.PI + .64 + progress * .72);
      ctx.stroke();
      ctx.restore();
    }

    function drawCrownTelegraph(ctx, attack, state) {
      const progress = clamp((state.tick - attack.spawnTick) / (attack.impactTick - attack.spawnTick), 0, 1);
      const ringRadius = 315 - progress * 255;
      ctx.save();
      ctx.translate(600, 382);
      ctx.strokeStyle = progress > .8 ? "rgba(255,244,222,.94)" : "rgba(255,83,109,.76)";
      ctx.lineWidth = progress > .8 ? 6 : 3;
      ctx.setLineDash(progress > .8 ? [] : [8, 10]);
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(48, ringRadius), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      const threadCount = attack.threadCount || 5;
      for (let i = 0; i < threadCount; i += 1) {
        const a = attack.threadAngle + i * Math.PI / threadCount;
        const offset = Math.sin(i * 4.1) * 58;
        ctx.strokeStyle = `rgba(255,83,109,${.22 + progress * .35})`;
        ctx.lineWidth = 2 + progress * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 310 + Math.cos(a + Math.PI / 2) * offset, Math.sin(a) * 310 + Math.sin(a + Math.PI / 2) * offset);
        ctx.lineTo(Math.cos(a + Math.PI) * 310 + Math.cos(a + Math.PI / 2) * offset, Math.sin(a + Math.PI) * 310 + Math.sin(a + Math.PI / 2) * offset);
        ctx.stroke();
      }

      const jaw = 1 - progress;
      ctx.strokeStyle = "rgba(255,83,109,.78)";
      ctx.lineWidth = 11;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, 350, -.95 - jaw * .35, -.08 - jaw * .65);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 350, .08 + jaw * .65, .95 + jaw * .35);
      ctx.stroke();
      ctx.restore();
    }

    function drawAttacks(ctx, state) {
      for (const attack of state.attacks) {
        if (attack.type === "needle") drawNeedleTelegraph(ctx, attack, state);
        else if (attack.type === "buttonhole") drawButtonholeTelegraph(ctx, attack, state);
        else drawCrownTelegraph(ctx, attack, state);
      }
    }

    function drawBoss(ctx, state, time) {
      const attack = state.attacks.find(item => !item.resolved);
      const recoil = state.tick <= state.boss.recoilUntil ? (state.boss.recoilUntil - state.tick) / 20 : 0;
      const hurt = state.tick <= state.boss.hurtUntil;
      const breathe = reducedMotion.matches ? 0 : Math.sin(time * .0021) * 2.4;
      const phaseScale = state.phaseTransitionUntil > state.tick ? 1 + Math.sin((state.phaseTransitionUntil - state.tick) * .25) * .025 : 1;

      ctx.save();
      ctx.translate(600, 342 + recoil * 9 + breathe);
      ctx.scale(phaseScale, phaseScale);

      ctx.save();
      ctx.globalAlpha = .72;
      ctx.strokeStyle = state.phase === 3 ? "#ff536d" : "#52406f";
      ctx.fillStyle = "#0b0712";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      const armOpen = attack?.type === "buttonhole" ? clamp((state.tick - attack.spawnTick) / (attack.impactTick - attack.spawnTick), 0, 1) : .2;
      for (let i = 0; i < 6; i += 1) {
        const side = i < 3 ? -1 : 1;
        const row = i % 3;
        const baseAngle = side < 0 ? Math.PI + .3 + row * .36 : -.3 - row * .36;
        const angle = baseAngle + side * armOpen * .16;
        const length = 128 + row * 22;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(42, 0);
        ctx.quadraticCurveTo(length * .55, side * (12 + row * 5), length, 0);
        ctx.stroke();
        ctx.translate(length, 0);
        ctx.rotate(side * .18);
        ctx.fillStyle = state.boss.armBound >= row + 1 ? "#6a512f" : "#d7c8ad";
        ctx.beginPath();
        ctx.moveTo(-4, -5);
        ctx.lineTo(32, 0);
        ctx.lineTo(-4, 5);
        ctx.closePath();
        ctx.fill();
        if (state.boss.armBound >= row + 1) {
          ctx.strokeStyle = "#f4bd5b";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(5, 0, 12, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();

      ctx.save();
      ctx.shadowColor = hurt ? "#fff3d8" : state.phase === 3 ? "#ff536d" : "#8f78ff";
      ctx.shadowBlur = hurt ? 42 : 20;
      ctx.fillStyle = hurt ? "#fff8e9" : "#f0e3c6";
      ctx.strokeStyle = "#2a1933";
      ctx.lineWidth = 7;
      ctx.beginPath();
      pathRoundedPolygon(ctx, [
        [-72, -72], [-30, -102], [0, -83], [30, -102], [72, -72],
        [86, -22], [66, 46], [25, 88], [0, 104], [-25, 88], [-66, 46], [-86, -22]
      ], 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#140b20";
      ctx.beginPath();
      ctx.moveTo(-55, -27);
      ctx.quadraticCurveTo(-25, -46, -9, -16);
      ctx.quadraticCurveTo(-34, 3, -61, -8);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(55, -27);
      ctx.quadraticCurveTo(25, -46, 9, -16);
      ctx.quadraticCurveTo(34, 3, 61, -8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = state.phase === 3 ? "#ff536d" : "#f4bd5b";
      ctx.beginPath();
      ctx.arc(-31, -19, 5, 0, TAU);
      ctx.arc(31, -19, 5, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = "#2b1730";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-35, 44);
      ctx.quadraticCurveTo(0, 58, 35, 44);
      ctx.stroke();
      for (let x = -24; x <= 24; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, 48);
        ctx.lineTo(x + 3, 64);
        ctx.stroke();
      }

      const lost = 1 - state.boss.hp / state.boss.maxHp;
      ctx.strokeStyle = state.phase === 3 ? "#ff536d" : "#6d5078";
      ctx.lineWidth = 3;
      ctx.globalAlpha = .55 + lost * .45;
      if (lost > .22) {
        ctx.beginPath(); ctx.moveTo(-18, -78); ctx.lineTo(-7, -43); ctx.lineTo(-24, -12); ctx.stroke();
      }
      if (lost > .5) {
        ctx.beginPath(); ctx.moveTo(50, -55); ctx.lineTo(29, -29); ctx.lineTo(44, 10); ctx.lineTo(28, 32); ctx.stroke();
      }
      if (lost > .72) {
        ctx.beginPath(); ctx.moveTo(-59, 21); ctx.lineTo(-34, 29); ctx.lineTo(-47, 58); ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = state.phase === 3 ? "#ff6c7f" : "#f4bd5b";
      ctx.fillStyle = "#10091a";
      ctx.lineWidth = 5;
      for (let i = -3; i <= 3; i += 1) {
        const spread = state.phase === 3 ? 1.18 : 1;
        const x = i * 28 * spread;
        const height = 78 + (3 - Math.abs(i)) * 17;
        ctx.beginPath();
        ctx.moveTo(x - 8, -78);
        ctx.lineTo(x, -78 - height);
        ctx.lineTo(x + 8, -78);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore();
    }

    function playerRenderAngle(state) {
      const player = state.player;
      if (state.tick > player.dashEndTick || player.dashEndTick <= player.dashStartTick) return player.angle;
      const t = clamp((state.tick - player.dashStartTick) / (player.dashEndTick - player.dashStartTick), 0, 1);
      return { from: player.dashFrom, to: player.angle, t: 1 - (1 - t) ** 3 };
    }

    function drawPlayer(ctx, state) {
      const player = state.player;
      const render = playerRenderAngle(state);
      let x;
      let y;
      let angle;

      if (typeof render === "object") {
        const x1 = 600 + Math.cos(render.from) * 276;
        const y1 = 382 + Math.sin(render.from) * 276;
        const x2 = 600 + Math.cos(render.to) * 276;
        const y2 = 382 + Math.sin(render.to) * 276;
        x = x1 + (x2 - x1) * render.t;
        y = y1 + (y2 - y1) * render.t;
        angle = Math.atan2(y2 - y1, x2 - x1);

        ctx.save();
        const trail = ctx.createLinearGradient(x1, y1, x, y);
        trail.addColorStop(0, "rgba(244,189,91,0)");
        trail.addColorStop(1, "rgba(255,231,160,.95)");
        ctx.strokeStyle = trail;
        ctx.lineWidth = reducedMotion.matches ? 2 : 7;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.restore();
      } else {
        angle = render + Math.PI / 2;
        x = 600 + Math.cos(render) * 276;
        y = 382 + Math.sin(render) * 276;
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const invulnerable = state.tick <= player.invulnerableUntil;
      ctx.shadowColor = invulnerable ? "#76f4e3" : "#f4bd5b";
      ctx.shadowBlur = invulnerable ? 30 : 16;
      ctx.fillStyle = invulnerable ? "#edfffb" : "#ffe39a";
      ctx.strokeStyle = "#3a2134";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(22, 0);
      ctx.lineTo(4, 10);
      ctx.lineTo(-14, 7);
      ctx.lineTo(-22, 0);
      ctx.lineTo(-14, -7);
      ctx.lineTo(4, -10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#4a2a42";
      ctx.fillRect(-9, -3, 16, 6);
      ctx.strokeStyle = invulnerable ? "#76f4e3" : "rgba(255,231,160,.75)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(-1, 0, 30, 15, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();

      if (invulnerable) {
        ctx.save();
        ctx.strokeStyle = "rgba(118,244,227,.55)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 31, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawParticles(ctx, state) {
      const max = reducedMotion.matches ? 40 : state.particles.length;
      for (let index = Math.max(0, state.particles.length - max); index < state.particles.length; index += 1) {
        const particle = state.particles[index];
        const alpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawBanner(ctx, state) {
      if (!state.banner.text || state.tick > state.banner.untilTick || state.outcome) return;
      const remaining = state.banner.untilTick - state.tick;
      const alpha = clamp(Math.min((state.banner.untilTick - state.tick) / 16, (state.tick + 36 - state.banner.untilTick + 72) / 16), 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff1d5";
      ctx.font = "800 18px ui-monospace, monospace";
      ctx.letterSpacing = "3px";
      ctx.fillText(state.banner.text, 600, 676);
      ctx.fillStyle = state.phase === 3 ? "#ff8797" : "#f4bd5b";
      ctx.font = "700 10px ui-monospace, monospace";
      ctx.fillText(state.banner.subtext.toUpperCase(), 600, 697);
      ctx.restore();
      void remaining;
    }

    function drawImpact(ctx, state) {
      if (state.flash <= .015) return;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = clamp(state.flash, 0, .78);
      ctx.fillStyle = state.outcome === "defeat" ? "#ff536d" : state.phase === 3 ? "#ff8e9e" : "#fff0c8";
      ctx.fillRect(-300, -200, 1800, 1100);
      ctx.restore();
    }

    function render() {
      resizeCanvas();
      const state = engine.getState();
      const now = state.tick * TICK_MS;
      context.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      context.fillStyle = "#07040e";
      context.fillRect(0, 0, viewWidth, viewHeight);
      context.save();
      worldTransform(context);

      if (!reducedMotion.matches && state.shake > .01) {
        const magnitude = state.shake * 10;
        const shakeX = Math.sin(state.tick * 12.9898 + state.seed) * magnitude;
        const shakeY = Math.cos(state.tick * 7.233 + state.seed) * magnitude * .62;
        context.translate(shakeX, shakeY);
      }

      drawBackground(context, state, now);
      drawArena(context, state, now);
      drawAttacks(context, state);
      drawBoss(context, state, now);
      drawParticles(context, state);
      drawPlayer(context, state);
      drawBanner(context, state);
      drawImpact(context, state);
      context.restore();
      syncUi();
    }

    function formatTime(milliseconds) {
      const total = Math.floor(milliseconds / 1000);
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
    }

    function announce(text) {
      if (!text || text === lastAnnounced) return;
      lastAnnounced = text;
      liveRegion.textContent = text;
    }

    function syncUi() {
      const snap = engine.snapshot();
      phaseName.textContent = snap.phaseName;
      bossFill.style.transform = `scaleX(${snap.boss.stability / snap.boss.maxStability})`;
      bossTrack.setAttribute("aria-valuenow", String(snap.boss.stability));
      scoreValue.textContent = String(snap.score.points).padStart(4, "0");
      comboValue.textContent = snap.score.combo > 1 ? `${snap.score.combo}× clean seam` : "";
      spools.forEach((spool, index) => spool.classList.toggle("empty", index >= snap.player.stability));
      spoolsTrack.setAttribute("aria-valuenow", String(snap.player.stability));
      demoControl.setAttribute("aria-pressed", String(snap.demo.enabled));
      pauseControl.disabled = !engine.getState().started || Boolean(snap.outcome);
      pauseControl.querySelector("span:last-child").textContent = snap.status === "paused" ? "Resume" : "Pause";
      startControl.querySelector("span:last-child").textContent = snap.status === "paused" ? "Resume" : "Start";

      const attack = snap.activeAttacks.find(item => !item.resolved);
      if (attack) {
        const message = attack.type === "needle" ? "Needle mark. Wait for the lock, then shift."
          : attack.type === "buttonhole" ? "Binding seam. Align with gold and shift."
          : "Crown snap. Shift on impact.";
        announce(message);
      }

      if (snap.outcome && snap.outcome !== lastOutcome) {
        lastOutcome = snap.outcome;
        resultOverlay.classList.remove("hidden");
        resultTitle.textContent = snap.outcome === "victory" ? "Victory" : "Unspooled";
        resultEyebrow.textContent = snap.outcome === "victory" ? "The crown unmade" : "The loom endures";
        resultSigil.textContent = snap.outcome === "victory" ? "✦" : "×";
        resultStat.textContent = `${snap.score.counters} stitches · ${formatTime(snap.simulationTime)}`;
        announce(snap.outcome === "victory" ? "Victory. Threadneedle is unmade." : "Defeat. Restart is ready.");
      }
    }

    function begin() {
      ensureAudio();
      if (engine.snapshot().outcome) engine.reset(engine.snapshot().seed);
      engine.start();
      introOverlay.classList.add("hidden");
      resultOverlay.classList.add("hidden");
      lastOutcome = null;
      canvas.focus({ preventScroll: true });
      render();
    }

    function restart() {
      ensureAudio();
      const wasDemo = engine.snapshot().demo.enabled;
      const currentSeed = engine.snapshot().seed;
      engine.reset(currentSeed);
      if (wasDemo) engine.setDemo(true);
      else engine.start();
      introOverlay.classList.add("hidden");
      resultOverlay.classList.add("hidden");
      lastOutcome = null;
      lastAnnounced = "";
      announce(wasDemo ? "Demo restarted." : "Fight restarted.");
      canvas.focus({ preventScroll: true });
      render();
    }

    function togglePause() {
      if (engine.snapshot().status === "paused") engine.resume();
      else engine.pause();
      render();
    }

    startControl.addEventListener("click", begin);
    introStart.addEventListener("click", begin);
    pauseControl.addEventListener("click", togglePause);
    restartControl.addEventListener("click", restart);
    resultRestart.addEventListener("click", restart);

    demoControl.addEventListener("click", () => {
      ensureAudio();
      const enable = !engine.snapshot().demo.enabled;
      engine.setDemo(enable);
      if (enable) {
        introOverlay.classList.add("hidden");
        resultOverlay.classList.add("hidden");
        lastOutcome = null;
        announce("Deterministic demo started.");
      } else {
        announce("Demo disabled. Manual control active.");
      }
      canvas.focus({ preventScroll: true });
      render();
    });

    muteControl.addEventListener("click", () => {
      muted = !muted;
      muteControl.setAttribute("aria-pressed", String(muted));
      muteControl.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
      muteControl.querySelector("span").textContent = muted ? "Muted" : "Sound";
      if (muted && audioContext) audioContext.suspend().catch(() => {});
      else ensureAudio();
    });

    canvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      ensureAudio();
      if (engine.press("pointer")) {
        canvas.setPointerCapture?.(event.pointerId);
        render();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.code !== "Space" || event.repeat) return;
      if (event.target instanceof HTMLButtonElement) return;
      event.preventDefault();
      ensureAudio();
      if (engine.press("keyboard")) render();
    });

    document.addEventListener("visibilitychange", () => {
      lastFrame = performance.now();
      if (!document.hidden) render();
    });
    window.addEventListener("resize", render, { passive: true });
    reducedMotion.addEventListener?.("change", render);

    function frame(now) {
      const delta = clamp(now - lastFrame, 0, 100);
      lastFrame = now;
      if (!document.hidden) engine.step(delta);
      render();
      requestAnimationFrame(frame);
    }

    window.__BOSS_FIGHT__ = Object.freeze({
      reset(seed) {
        const snap = engine.reset(seed);
        introOverlay.classList.remove("hidden");
        resultOverlay.classList.add("hidden");
        lastOutcome = null;
        lastAnnounced = "";
        render();
        return snap;
      },
      start() {
        const result = engine.start();
        introOverlay.classList.add("hidden");
        resultOverlay.classList.add("hidden");
        lastOutcome = null;
        render();
        return result;
      },
      setDemo(enabled) {
        const result = engine.setDemo(enabled);
        if (result) {
          introOverlay.classList.add("hidden");
          resultOverlay.classList.add("hidden");
          lastOutcome = null;
        }
        render();
        return result;
      },
      press() {
        const accepted = engine.press("api");
        render();
        return accepted;
      },
      step(milliseconds) {
        const snap = engine.step(milliseconds);
        render();
        return snap;
      },
      snapshot: () => engine.snapshot(),
      runSelfTest: () => runCoreSelfTest()
    });

    render();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
