<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Claude Sonnet 5</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<style>
  :root{
    --bg-deep:#07091a;
    --bg-mid:#121734;
    --bg-panel: rgba(9,11,26,0.92);
    --gold:#e8b84b;
    --gold-bright:#ffd479;
    --amber:#ff9a4d;
    --violet:#a879ff;
    --ember:#ff5d3d;
    --ink:#f2e8cf;
    --muted:#9aa3c9;
    --danger:#ff6b7a;
    --success:#8be9a0;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #262d55 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, #1a0f22 0%, transparent 60%),
      var(--bg-deep);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1.1rem 1rem 1.6rem;
    gap:.7rem;
  }
  header{ text-align:center; }
  h1{
    margin:0;
    font-size:.92rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--gold);
    text-shadow:0 0 18px rgba(232,184,75,.35);
  }
  .subtitle{
    margin:.3rem 0 0;
    font-size:.72rem;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  #stageWrap{
    position:relative;
    width:min(480px,92vw);
    aspect-ratio: 3 / 4;
    border-radius:20px;
    overflow:hidden;
    background:var(--bg-mid);
    box-shadow:0 0 0 1px rgba(232,184,75,.18), 0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 80px rgba(0,0,0,.5);
  }
  canvas#scene{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
    cursor:pointer;
  }
  #hud{ position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:.7rem .8rem; }
  .hud-top{ display:flex; flex-direction:column; gap:.35rem; }
  .boss-line{ display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
  .boss-name{ font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-bright); }
  .phase-pips{ display:flex; gap:.3rem; }
  .pip{
    width:1.05rem; height:1.05rem; border-radius:50%;
    border:1px solid rgba(232,184,75,.4);
    display:flex; align-items:center; justify-content:center;
    font-size:.5rem; color:var(--muted);
    background:rgba(0,0,0,.25);
  }
  .pip.active{ background:var(--gold); color:#181120; border-color:var(--gold); box-shadow:0 0 10px rgba(232,184,75,.6); }
  .bar{ height:.5rem; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid rgba(255,255,255,.08); }
  .bar-fill{ height:100%; border-radius:999px; transition:width .25s ease; }
  .boss-bar .bar-fill{ background:linear-gradient(90deg,var(--ember),var(--gold-bright)); width:100%; }
  .hud-bottom{ display:flex; justify-content:space-between; align-items:flex-end; }
  .resolve-pips{ display:flex; gap:.25rem; }
  .resolve-pip{ width:.8rem; height:.8rem; border-radius:2px; transform:rotate(45deg); background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); }
  .resolve-pip.lit{ background:var(--gold-bright); box-shadow:0 0 8px rgba(255,212,121,.8); border-color:var(--gold-bright); }
  .combo-label{ font-size:.6rem; color:var(--muted); margin-top:.25rem; letter-spacing:.04em; }
  .score-col{ text-align:right; }
  .score-label{ font-size:.75rem; color:var(--ink); font-variant-numeric:tabular-nums; }
  .timer-label{ font-size:.58rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:.2rem; }
  #overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:1.2rem; background:rgba(4,5,14,0); transition:background .3s ease; pointer-events:none; }
  #overlay.is-visible{ pointer-events:auto; background:rgba(4,5,14,.72); }
  .panel{ max-width:340px; text-align:center; background:var(--bg-panel); border:1px solid rgba(232,184,75,.25); border-radius:16px; padding:1.4rem 1.3rem; display:none; }
  .panel.is-active{ display:block; }
  .panel h2{ margin:0 0 .5rem; font-size:1rem; letter-spacing:.08em; color:var(--gold-bright); text-transform:uppercase; }
  .panel p{ margin:0 0 1rem; font-size:.82rem; line-height:1.45; color:var(--ink); }
  .panel .stats{ font-size:.72rem; color:var(--muted); margin-bottom:1rem; }
  button{ font: inherit; cursor:pointer; }
  .cta{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#1c1408;
    border:none;
    padding:.6rem 1.4rem;
    border-radius:999px;
    font-weight:700;
    font-size:.8rem;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .cta:active{ transform:translateY(1px); }
  #controls{ display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  #controls button{
    background:rgba(255,255,255,.06);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.14);
    padding:.5rem 1rem;
    border-radius:999px;
    font-size:.74rem;
    letter-spacing:.04em;
    min-height:2.4rem;
  }
  #controls button:hover{ background:rgba(255,255,255,.12); }
  #controls button:disabled{ opacity:.35; cursor:not-allowed; }
  #controls button[aria-pressed="true"]{ background:var(--gold); color:#1c1408; border-color:var(--gold); }
  button:focus-visible, a:focus-visible{
    outline:3px solid var(--gold-bright);
    outline-offset:2px;
  }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  @media (max-width:480px){
    h1{ font-size:.8rem; }
    #stageWrap{ width:96vw; border-radius:14px; }
    #controls button{ font-size:.7rem; padding:.5rem .8rem; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Claude Sonnet 5</h1>
    <p class="subtitle">One-Button Boss Encounter</p>
  </header>

  <div id="stageWrap">
    <canvas id="scene" role="img" aria-label="Boss fight arena"></canvas>
    <div id="hud" aria-hidden="true">
      <div class="hud-top">
        <div class="boss-line">
          <span class="boss-name" id="bossName">The Ember Warden</span>
          <div class="phase-pips" id="phasePips">
            <span class="pip" data-phase="1">I</span>
            <span class="pip" data-phase="2">II</span>
            <span class="pip" data-phase="3">III</span>
          </div>
        </div>
        <div class="bar boss-bar"><div class="bar-fill" id="bossBarFill"></div></div>
      </div>
      <div class="hud-bottom">
        <div>
          <div class="resolve-pips" id="resolvePips"></div>
          <div class="combo-label" id="comboLabel">Combo ×0</div>
        </div>
        <div class="score-col">
          <div class="score-label" id="scoreLabel">0</div>
          <div class="timer-label" id="timerLabel">0.0s</div>
        </div>
      </div>
    </div>
    <div id="overlay">
      <div class="panel" id="panelReady">
        <h2>The Warden Stirs</h2>
        <p>Press <strong>Space</strong>, click, or tap the arena to Pulse — time it to parry the Warden's light the instant before it strikes.</p>
        <button class="cta" id="btnBegin" type="button">Begin</button>
      </div>
      <div class="panel" id="panelPaused">
        <h2>Paused</h2>
        <p>The Hallowed Ring holds still.</p>
        <button class="cta" id="btnResume" type="button">Resume</button>
      </div>
      <div class="panel" id="panelResult">
        <h2 id="resultTitle">Victory</h2>
        <p class="stats" id="resultStats"></p>
        <button class="cta" id="btnAgain" type="button">Run Again</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="btnStart" type="button">Start</button>
    <button id="btnPause" type="button" disabled>Pause</button>
    <button id="btnRestart" type="button">Restart</button>
    <button id="btnDemo" type="button" aria-pressed="false">Demo</button>
    <button id="btnMute" type="button" aria-pressed="false">Mute</button>
  </div>
  <p class="visually-hidden" id="liveRegion" aria-live="polite"></p>
</div>
<script>
'use strict';
(function(){

/* ---------- constants ---------- */
const FIXED_DT = 1000/60;
const PULSE_COOLDOWN = 460;
const PLAYER_MAX_RESOLVE = 6;
const INTRO_LEAD = 1600;
const PHASE_TRANSITION_PAUSE = 1800;
const END_GRACE = 900;
const DEMO_RESTART_DELAY = 3200;

const BEAM_TELEGRAPH = 1100, BEAM_WINDOW = 300, BEAM_PLAYER_DMG = 1, BEAM_BOSS_DMG = 10;
const SHARD_GAP = 560, SHARD_TELEGRAPH = 900, SHARD_WINDOW = 220, SHARD_PLAYER_DMG = 1, SHARD_BOSS_DMG = 6;
const ECLIPSE_TELEGRAPH = 2000, ECLIPSE_WINDOW = 180, ECLIPSE_PLAYER_DMG = 2, ECLIPSE_BOSS_DMG = 20;
const FEINT_TELEGRAPH = 900;

const BOSS_NAME = 'The Ember Warden';

const EFFECT_LIFE = { parry:650, miss:550, fizzle:500, pulse:400, deny:250, phaseShift:1600, victory:3000, defeat:3000 };

/* ---------- prng ---------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* ---------- schedule generation ---------- */
function randAngle(rng){ return -55 + rng()*110; }

function addBeam(schedule, t, phase, rng){
  const impactTime = t + BEAM_TELEGRAPH;
  schedule.push({
    id: schedule.length, phase, type:'beam', angle: randAngle(rng),
    telegraphStart: t, impactTime,
    windowStart: impactTime - BEAM_WINDOW/2, windowEnd: impactTime + BEAM_WINDOW/2,
    fizzleTime: null,
    playerDamage: BEAM_PLAYER_DMG, bossDamage: BEAM_BOSS_DMG,
    groupId: null, resolved:false, resolvedAt:null, resolvedKind:null,
  });
}

function addShardGroup(schedule, t, phase, rng){
  const groupId = 'g'+schedule.length;
  const baseAngle = randAngle(rng);
  for(let i=0;i<2;i++){
    const telegraphStart = t + i*SHARD_GAP;
    const impactTime = telegraphStart + SHARD_TELEGRAPH;
    schedule.push({
      id: schedule.length, phase, type:'shard', angle: baseAngle + (i===0 ? -16 : 16),
      telegraphStart, impactTime,
      windowStart: impactTime - SHARD_WINDOW/2, windowEnd: impactTime + SHARD_WINDOW/2,
      fizzleTime: null,
      playerDamage: SHARD_PLAYER_DMG, bossDamage: SHARD_BOSS_DMG,
      groupId, resolved:false, resolvedAt:null, resolvedKind:null,
    });
  }
}

function addEclipse(schedule, t, phase, rng){
  const impactTime = t + ECLIPSE_TELEGRAPH;
  schedule.push({
    id: schedule.length, phase, type:'eclipse', angle:0,
    telegraphStart: t, impactTime,
    windowStart: impactTime - ECLIPSE_WINDOW/2, windowEnd: impactTime + ECLIPSE_WINDOW/2,
    fizzleTime: null,
    playerDamage: ECLIPSE_PLAYER_DMG, bossDamage: ECLIPSE_BOSS_DMG,
    groupId: null, resolved:false, resolvedAt:null, resolvedKind:null,
  });
}

function addFeint(schedule, t, phase, rng){
  const fizzleTime = t + FEINT_TELEGRAPH;
  schedule.push({
    id: schedule.length, phase, type:'feint', angle: randAngle(rng),
    telegraphStart: t, impactTime: null,
    windowStart: null, windowEnd: null,
    fizzleTime,
    playerDamage: 0, bossDamage: 0,
    groupId: null, resolved:false, resolvedAt:null, resolvedKind:null,
  });
}

function endRef(entry){ return entry.type === 'feint' ? entry.fizzleTime : entry.windowEnd; }

function buildSchedule(rng){
  const schedule = [];
  const jitter = (base, range) => base + Math.round((rng()-0.5)*2*range);
  let t = INTRO_LEAD;

  for(let i=0;i<5;i++){
    addBeam(schedule, t, 1, rng);
    t = endRef(schedule[schedule.length-1]) + jitter(1100,120);
  }
  t += PHASE_TRANSITION_PAUSE;
  const phase2Start = t;

  for(let i=0;i<5;i++){
    addShardGroup(schedule, t, 2, rng);
    t = endRef(schedule[schedule.length-1]) + jitter(950,100);
    if(i===1 || i===3){
      addBeam(schedule, t, 2, rng);
      t = endRef(schedule[schedule.length-1]) + jitter(950,100);
    }
  }
  t += PHASE_TRANSITION_PAUSE;
  const phase3Start = t;

  const seq = ['feint','eclipse','feint','eclipse','feint','eclipse','feint','beam'];
  for(const kind of seq){
    if(kind==='feint') addFeint(schedule, t, 3, rng);
    else if(kind==='eclipse') addEclipse(schedule, t, 3, rng);
    else addBeam(schedule, t, 3, rng);
    t = endRef(schedule[schedule.length-1]) + jitter(800,90);
  }

  const last = schedule[schedule.length-1];
  const encounterEnd = endRef(last) + END_GRACE;
  const totalBossDamage = schedule.reduce((s,a)=>s+(a.bossDamage||0),0);

  return { schedule, phase2Start, phase3Start, encounterEnd, totalBossDamage };
}

/* ---------- core simulation ---------- */
class BossFightCore {
  constructor(){
    this.reset(1);
  }

  reset(seed){
    const num = Number(seed);
    const s = (Number.isFinite(num) ? Math.floor(num) : 1) >>> 0;
    this.seed = s;
    this._rng = mulberry32(s || 1);
    this.time = 0;
    this._accumulator = 0;
    this.started = false;
    this.paused = false;
    this.demo = false;
    this.outcome = null;
    this.outcomeAt = null;
    this.combo = 0;
    this.bestCombo = 0;
    this.score = 0;
    this.lastPressTime = -Infinity;
    this.player = { resolve: PLAYER_MAX_RESOLVE };

    const built = buildSchedule(this._rng);
    this.attacks = built.schedule;
    this.phase2Start = built.phase2Start;
    this.phase3Start = built.phase3Start;
    this.encounterEnd = built.encounterEnd;
    this._maxStability = built.totalBossDamage;
    this.boss = { stability: built.totalBossDamage };

    this.phase = 1;
    this._lastPhaseSeen = 1;
    this.effects = [];
    this._effectSeq = 0;
    this.demoCursor = 0;
  }

  start(){
    if(this.started) return;
    this.started = true;
    this.paused = false;
  }

  pause(){
    if(!this.started || this.outcome) return;
    this.paused = true;
  }

  resume(){
    if(!this.started || this.outcome) return;
    this.paused = false;
  }

  setDemo(enabled){
    this.demo = !!enabled;
  }

  press(){
    if(!this.started || this.paused || this.outcome) return false;
    const now = this.time;
    if(now - this.lastPressTime < PULSE_COOLDOWN){
      this._spawnEffect('deny', now, null);
      return false;
    }
    this.lastPressTime = now;
    let hitAny = false;
    for(const a of this.attacks){
      if(a.resolved || a.type === 'feint') continue;
      if(now >= a.telegraphStart && now >= a.windowStart && now <= a.windowEnd){
        a.resolved = true; a.resolvedAt = now; a.resolvedKind = 'parry';
        this.boss.stability = Math.max(0, this.boss.stability - a.bossDamage);
        this.combo += 1;
        this.bestCombo = Math.max(this.bestCombo, this.combo);
        this.score += 100 + this.combo*10;
        this._spawnEffect('parry', now, a);
        hitAny = true;
      }
    }
    if(!hitAny) this._spawnEffect('pulse', now, null);
    return hitAny;
  }

  step(ms){
    if(typeof ms !== 'number' || !isFinite(ms) || ms <= 0) return;
    if(!this.started || this.paused) return;
    this._accumulator += ms;
    let guard = 0;
    while(this._accumulator >= FIXED_DT && guard < 200000){
      this._tick(FIXED_DT);
      this._accumulator -= FIXED_DT;
      guard++;
    }
  }

  _tick(dt){
    if(!this.started || this.paused) return;
    this.time += dt;

    if(this.outcome){
      if(this.demo && (this.time - this.outcomeAt) >= DEMO_RESTART_DELAY){
        const nextSeed = (this.seed + 1) >>> 0;
        this.reset(nextSeed);
        this.demo = true;
        this.start();
      }
      return;
    }

    this.phase = this.time < this.phase2Start ? 1 : (this.time < this.phase3Start ? 2 : 3);
    if(this.phase !== this._lastPhaseSeen){
      this._spawnEffect('phaseShift', this.time, { phase: this.phase });
      this._lastPhaseSeen = this.phase;
    }

    for(const a of this.attacks){
      if(a.resolved) continue;
      if(this.time < a.telegraphStart) continue;
      if(a.type === 'feint'){
        if(this.time > a.fizzleTime){
          a.resolved = true; a.resolvedAt = this.time; a.resolvedKind = 'fizzle';
          this._spawnEffect('fizzle', this.time, a);
        }
      } else if(this.time > a.windowEnd){
        a.resolved = true; a.resolvedAt = this.time; a.resolvedKind = 'miss';
        this.player.resolve = Math.max(0, this.player.resolve - a.playerDamage);
        this.combo = 0;
        this._spawnEffect('miss', this.time, a);
      }
    }

    if(this.effects.length){
      this.effects = this.effects.filter(e => this.time < e.until);
    }

    if(this.demo) this._updateDemo();

    this._checkEncounterEnd();
  }

  _updateDemo(){
    if(this.outcome) return;
    while(this.demoCursor < this.attacks.length){
      const a = this.attacks[this.demoCursor];
      if(a.resolved){ this.demoCursor++; continue; }
      if(a.type === 'feint'){
        if(this.time > a.fizzleTime) this.demoCursor++;
        break;
      }
      const pressAt = (a.windowStart + a.windowEnd) / 2;
      if(this.time >= pressAt && (this.time - this.lastPressTime) >= PULSE_COOLDOWN){
        this.press();
      }
      if(this.time > a.windowEnd) this.demoCursor++;
      break;
    }
  }

  _checkEncounterEnd(){
    if(this.outcome) return;
    if(this.player.resolve <= 0){ this._endEncounter('failure'); return; }
    if(this.boss.stability <= 0){ this._endEncounter('success'); return; }
    if(this.time >= this.encounterEnd && this.attacks.every(a => a.resolved)){
      this._endEncounter(this.boss.stability <= 0 ? 'success' : 'failure');
    }
  }

  _endEncounter(result){
    this.outcome = result;
    this.outcomeAt = this.time;
    this._spawnEffect(result === 'success' ? 'victory' : 'defeat', this.time, null);
  }

  _spawnEffect(kind, at, attack){
    const life = EFFECT_LIFE[kind] || 600;
    this._effectSeq++;
    this.effects.push({
      seq: this._effectSeq, kind, at, until: at+life,
      type: attack ? (attack.type || null) : null,
      angle: attack && attack.angle != null ? attack.angle : 0,
      attackId: attack && attack.id != null ? attack.id : null,
      phase: attack && attack.phase != null ? attack.phase : this.phase,
    });
  }

  snapshot(){
    return {
      time: this.time,
      seed: this.seed,
      phase: this.phase,
      phase2Start: this.phase2Start,
      phase3Start: this.phase3Start,
      encounterEnd: this.encounterEnd,
      started: this.started,
      paused: this.paused,
      demo: this.demo,
      outcome: this.outcome,
      score: this.score,
      combo: this.combo,
      bestCombo: this.bestCombo,
      player: {
        resolve: this.player.resolve,
        maxResolve: PLAYER_MAX_RESOLVE,
        cooldownRemaining: Math.max(0, PULSE_COOLDOWN - (this.time - this.lastPressTime)),
      },
      boss: {
        name: BOSS_NAME,
        stability: this.boss.stability,
        maxStability: this._maxStability,
      },
      attacks: this.attacks
        .filter(a => !a.resolved && this.time >= a.telegraphStart)
        .map(a => ({
          id: a.id, type: a.type, phase: a.phase, angle: a.angle,
          telegraphStart: a.telegraphStart, impactTime: a.impactTime,
          windowStart: a.windowStart, windowEnd: a.windowEnd,
          fizzleTime: a.fizzleTime,
        })),
      scheduleTotal: this.attacks.length,
      scheduleResolved: this.attacks.filter(a => a.resolved).length,
    };
  }

  runSelfTest(){
    const tests = [];
    const record = (name, fn) => {
      try{
        const ok = fn();
        tests.push({ name, passed: ok === true });
      }catch(err){
        tests.push({ name, passed:false, detail:String(err && err.message || err) });
      }
    };

    record('deterministic reset produces identical snapshots for the same seed', () => {
      const a = createGame(); a.reset(4242); a.start(); a.step(3333);
      const b = createGame(); b.reset(4242); b.start(); b.step(3333);
      return JSON.stringify(a.snapshot()) === JSON.stringify(b.snapshot());
    });

    record('pause halts simulation time', () => {
      const g = createGame(); g.reset(5); g.start(); g.step(1000);
      const t1 = g.snapshot().time;
      g.pause(); g.step(2000);
      const t2 = g.snapshot().time;
      g.resume(); g.step(500);
      const t3 = g.snapshot().time;
      return t1 === t2 && t3 > t2;
    });

    record('phase advances from I to III over the encounter', () => {
      const g = createGame(); g.reset(9); g.setDemo(true); g.start();
      const p1 = g.snapshot().phase;
      g.step(g.phase2Start + 200);
      const p2 = g.snapshot().phase;
      g.step((g.phase3Start - g.phase2Start) + 200);
      const p3 = g.snapshot().phase;
      return p1 === 1 && p2 === 2 && p3 === 3;
    });

    record('snapshot numeric fields stay finite', () => {
      const g = createGame(); g.reset(11); g.setDemo(true); g.start();
      for(let i=0;i<400;i++) g.step(50);
      const s = g.snapshot();
      const nums = [s.time, s.score, s.combo, s.bestCombo, s.player.resolve, s.player.cooldownRemaining, s.boss.stability, s.boss.maxStability];
      return nums.every(n => typeof n === 'number' && Number.isFinite(n));
    });

    record('demo autopilot reaches a success outcome', () => {
      const g = createGame(); g.reset(21); g.setDemo(true); g.start();
      let guard = 0;
      while(!g.snapshot().outcome && guard < 4000){ g.step(50); guard++; }
      return g.snapshot().outcome === 'success';
    });

    record('withholding input reaches a failure outcome', () => {
      const g = createGame(); g.reset(22); g.start();
      let guard = 0;
      while(!g.snapshot().outcome && guard < 4000){ g.step(50); guard++; }
      return g.snapshot().outcome === 'failure';
    });

    record('reset after an outcome restores a fresh run (instant restart)', () => {
      const g = createGame(); g.reset(23); g.start();
      let guard = 0;
      while(!g.snapshot().outcome && guard < 4000){ g.step(50); guard++; }
      g.reset(23);
      const s = g.snapshot();
      return s.time === 0 && s.outcome === null && s.phase === 1 && !s.started &&
        s.boss.stability === s.boss.maxStability && s.player.resolve === s.player.maxResolve;
    });

    record('demo mode drives the real gameplay state, not a canned animation', () => {
      const g = createGame(); g.reset(24); g.setDemo(true); g.start();
      const before = g.snapshot();
      for(let i=0;i<80;i++) g.step(50);
      const after = g.snapshot();
      const sameShape = Object.keys(before).every(k => k in after) &&
        Object.keys(before.boss).every(k => k in after.boss) &&
        Object.keys(before.player).every(k => k in after.player);
      return sameShape && after.time > before.time &&
        after.boss.stability < before.boss.stability && after.score > before.score;
    });

    const passed = tests.every(t => t.passed);
    return { passed, tests };
  }
}

function resizeCanvas(){

  if(rect.width <= 0 || rect.height <= 0) return;

/* ---------- seeded visuals (cracks / stars) ---------- */
let lastVisualSeed = null;
let crackLines = [];
let stars = [];
function regenerateVisuals(seed){
  const vrng = mulberry32((seed ^ 0x9e3779b9) >>> 0);
  crackLines = [];
  for(let i=0;i<5;i++){
    const startAngle = -70 + vrng()*140;
    let x = EYE_POS.x + Math.cos(startAngle*Math.PI/180)*30;
    let y = EYE_POS.y + Math.sin(startAngle*Math.PI/180)*30 + 12;
    const pts = [{x,y}];
    for(let s=0;s<5;s++){
      x += (vrng()-0.5)*46;
      y += 14 + vrng()*18;
      pts.push({x,y});
    }
    crackLines.push(pts);
  }
  stars = [];
  for(let i=0;i<60;i++){
    stars.push({ x: vrng()*LOGICAL_W, y: vrng()*LOGICAL_H*0.55, r: 0.4+vrng()*1.1, phase: vrng()*Math.PI*2 });
  }
  lastVisualSeed = seed;
}

/* ---------- audio ---------- */
let audioCtx = null, masterGain = null, muted = false;
function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return;
  }
  try{
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    audioCtx = new Ctor();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.7;
    masterGain.connect(audioCtx.destination);
  }catch(err){ audioCtx = null; }
}
function toggleMute(){
  muted = !muted;
  btnMute.setAttribute('aria-pressed', String(muted));
  btnMute.textContent = muted ? 'Unmute' : 'Mute';
  if(masterGain) masterGain.gain.value = muted ? 0 : 0.7;
}
function tone(freq, dur, type, peak, delay){
  if(!audioCtx || muted) return;
  try{
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.001, peak || 0.3), t0+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(err){ /* ignore audio scheduling errors */ }
}
function noiseBurst(dur, peak, filterFreq){
  if(!audioCtx || muted) return;
  try{
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate*dur));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufferSize);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq || 1200;
    const gain = audioCtx.createGain();
    gain.gain.value = peak || 0.3;
    src.connect(filter); filter.connect(gain); gain.connect(masterGain);
    src.start();
  }catch(err){ /* ignore audio scheduling errors */ }
}
function playPulseFeedback(hit){
  if(hit){ tone(880,0.18,'triangle',0.32); tone(1320,0.16,'sine',0.2,0.02); noiseBurst(0.08,0.16,2200); }
  else { tone(420,0.12,'sine',0.12); }
}
let lastAudioSeqSeen = 0;
function processAudioEffects(){
  for(const e of game.effects){
    if(e.seq <= lastAudioSeqSeen) continue;
    if(e.kind === 'miss'){ noiseBurst(0.12,0.25,400); tone(180,0.2,'sawtooth',0.18); }
    else if(e.kind === 'phaseShift'){ tone(140,0.6,'sine',0.28); tone(210,0.6,'sine',0.2,0.05); }
    else if(e.kind === 'victory'){ [523,659,784,1046].forEach((f,i)=>tone(f,0.5,'triangle',0.28,i*0.12)); }
    else if(e.kind === 'defeat'){ tone(160,0.9,'sawtooth',0.22); tone(90,1.0,'sine',0.18,0.1); }
  }
  if(game.effects.length) lastAudioSeqSeen = game.effects[game.effects.length-1].seq;
}

/* ---------- particles (cosmetic layer, not gameplay state) ---------- */
let particles = [];
let lastParticleSeqSeen = 0;
let lastParticleTs = null;
function spawnParticlesForEffects(){
  for(const e of game.effects){
    if(e.seq <= lastParticleSeqSeen) continue;
    if(e.kind === 'parry'){
      const count = reducedMotion ? 4 : 14;
      for(let i=0;i<count;i++){
        const a = Math.random()*Math.PI*2;
        const speed = 60+Math.random()*140;
        particles.push({ x:PLAYER_POS.x, y:PLAYER_POS.y-10, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, life:0, maxLife:500+Math.random()*300, color:'255,246,216', size:2+Math.random()*2 });
      }
    } else if(e.kind === 'miss'){
      const count = reducedMotion ? 3 : 8;
      for(let i=0;i<count;i++){
        const a = Math.random()*Math.PI*2;
        particles.push({ x:PLAYER_POS.x, y:PLAYER_POS.y, vx:Math.cos(a)*80, vy:Math.sin(a)*80-40, life:0, maxLife:400, color:'255,93,108', size:2+Math.random()*2 });
      }
    }
  }
  if(game.effects.length) lastParticleSeqSeen = game.effects[game.effects.length-1].seq;
}
function updateParticles(){
  const now = performance.now();
  const dt = lastParticleTs == null ? 16 : Math.min(48, now-lastParticleTs);
  lastParticleTs = now;
  spawnParticlesForEffects();
  if(game.paused) return;
  for(const pt of particles){
    pt.life += dt;
    pt.x += pt.vx*dt/1000;
    pt.y += pt.vy*dt/1000;
    pt.vy += 90*dt/1000;
  }
  particles = particles.filter(pt => pt.life < pt.maxLife);
}
function drawParticles(){
  for(const pt of particles){
    const a = 1-pt.life/pt.maxLife;
    ctx.fillStyle = `rgba(${pt.color},${a})`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
    ctx.fill();
  }
}

/* ---------- rendering ---------- */
function phaseColor(phase, alpha){
  const c = phase===1 ? '232,184,75' : phase===2 ? '255,138,77' : '168,121,255';
  return `rgba(${c},${alpha})`;
}

function drawBackground(t){
  ctx.save();
  const grad = ctx.createRadialGradient(240,200,40,240,320,420);
  grad.addColorStop(0, phaseColor(game.phase,0.16));
  grad.addColorStop(1, 'rgba(5,6,16,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
  for(const s of stars){
    const tw = reducedMotion ? 0.5 : 0.5+0.5*Math.sin(t*0.0015+s.phase);
    ctx.globalAlpha = 0.25+tw*0.35;
    ctx.fillStyle = '#cfd6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawArenaFloor(t){
  ctx.save();

  for(let i=3;i>=1;i--){

    ctx.beginPath();
    ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
    ctx.strokeStyle = `rgba(232,184,75,${0.08+0.04*i})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.save();
  const rot = reducedMotion ? 0 : t*0.00004;
  ctx.rotate(rot);

    const a = (i/24)*Math.PI*2;
    ctx.moveTo(Math.cos(a)*ARENA_RX*0.3, Math.sin(a)*ARENA_RY*0.3);
    ctx.lineTo(Math.cos(a)*ARENA_RX, Math.sin(a)*ARENA_RY);
  }
  ctx.strokeStyle = 'rgba(232,184,75,0.06)';

  ctx.restore();
  ctx.restore();
}

function drawBoss(t){

  ctx.lineWidth = 2;
  ctx.setLineDash([2,14]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(-170,170);
  ctx.quadraticCurveTo(-190,40,-90,-30);
  ctx.quadraticCurveTo(-40,-70,0,-72);
  ctx.quadraticCurveTo(40,-70,90,-30);
  ctx.quadraticCurveTo(190,40,170,170);
  ctx.quadraticCurveTo(0,130,-170,170);

  }

  const eyeOpen = game.phase===1 ? 0.55 : game.phase===2 ? 0.85 : 1;

  ctx.fillStyle = '#100b18';
  ctx.fillRect(-60,-20,120,80);
  const eyeGrad = ctx.createRadialGradient(0,18,4,0,18,46);
  eyeGrad.addColorStop(0, phaseColor(game.phase,1));
  eyeGrad.addColorStop(0.55, phaseColor(game.phase,0.5));

  ctx.fillStyle = '#0a0710';
  ctx.beginPath();
  ctx.ellipse(0,18,6,14,0,0,Math.PI*2);

  ctx.restore();
  ctx.beginPath();
  ctx.ellipse(0,18,46,30*eyeOpen,0,0,Math.PI*2);
  ctx.strokeStyle = phaseColor(game.phase,0.7);
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

function curvePoint(x0,y0,cx,cy,x1,y1,tt){
  const u = 1-tt;
  return { x: u*u*x0+2*u*tt*cx+tt*tt*x1, y: u*u*y0+2*u*tt*cy+tt*tt*y1 };
}
function drawCurve(x0,y0,cx,cy,x1,y1,upTo){
  ctx.beginPath();
  ctx.moveTo(x0,y0);
  const steps = 18;
  for(let i=1;i<=steps;i++){
    const tt = (i/steps)*upTo;
    const p = curvePoint(x0,y0,cx,cy,x1,y1,tt);
    ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
}
function attackProgress(a,t){
  if(a.type==='feint') return clamp((t-a.telegraphStart)/(a.fizzleTime-a.telegraphStart),0,1);
  return clamp((t-a.telegraphStart)/(a.impactTime-a.telegraphStart),0,1);
}

function drawAttacks(t){
  for(const a of game.attacks){
    if(t < a.telegraphStart) continue;
    const justResolved = a.resolved && (t-a.resolvedAt) < 260;
    if(a.resolved && !justResolved) continue;
    const p = attackProgress(a,t);
    const rad = a.angle*Math.PI/180;
    const originX = EYE_POS.x + Math.sin(rad)*40;
    const originY = EYE_POS.y - 10;
    const targetX = PLAYER_POS.x + Math.sin(rad)*14;
    const targetY = PLAYER_POS.y - 20;
    const cx = originX + (targetX-originX)*0.5 + Math.sin(rad)*30;
    const cy = originY + (targetY-originY)*0.35;

    if(a.type === 'feint'){
      const fp = p<0.7 ? p/0.7 : 1-(p-0.7)/0.3;
      ctx.save();
      ctx.globalAlpha = 0.2+0.22*Math.abs(Math.sin(t*0.02))*fp;
      ctx.strokeStyle = '#8fd7ff';
      ctx.lineWidth = 2;
      drawCurve(originX,originY,cx,cy,targetX,targetY, Math.max(0.02,fp));
      ctx.restore();
      continue;
    }

    if(a.type === 'eclipse' && !a.resolved){
      ctx.save();
      ctx.globalAlpha = 0.1+0.16*p;
      const grad = ctx.createRadialGradient(PLAYER_POS.x,PLAYER_POS.y-40,10,PLAYER_POS.x,PLAYER_POS.y-40,220);
      grad.addColorStop(0,'rgba(168,121,255,0.5)');
      grad.addColorStop(1,'rgba(168,121,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(PLAYER_POS.x,PLAYER_POS.y-40,220*p,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    const color = a.type==='eclipse' ? '168,121,255' : a.type==='shard' ? '255,154,77' : '232,184,75';
    ctx.save();
    if(a.resolvedKind === 'parry'){
      const fade = clamp(1-(t-a.resolvedAt)/260,0,1);
      ctx.globalAlpha = fade;
      ctx.strokeStyle = `rgba(255,255,255,${fade})`;
      ctx.lineWidth = 4;
      drawCurve(originX,originY,cx,cy,targetX,targetY,1);
    } else if(a.resolvedKind === 'miss'){
      const fade = clamp(1-(t-a.resolvedAt)/260,0,1);
      ctx.globalAlpha = fade;
      ctx.strokeStyle = `rgba(255,90,100,${fade})`;
      ctx.lineWidth = 5;
      drawCurve(originX,originY,cx,cy,targetX,targetY,1);
    } else {
      ctx.globalAlpha = 0.45+0.5*p;
      ctx.strokeStyle = `rgba(${color},${0.4+0.5*p})`;
      ctx.lineWidth = a.type==='eclipse' ? 6+10*p : a.type==='shard' ? 3 : 4;
      drawCurve(originX,originY,cx,cy,targetX,targetY,Math.max(0.02,p));
      const head = curvePoint(originX,originY,cx,cy,targetX,targetY,p);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${color},0.9)`;
      ctx.arc(head.x, head.y, a.type==='eclipse' ? 10 : 5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayer(t){
  const sincePress = t - game.lastPressTime;
  const pressPulse = sincePress>=0 && sincePress<260 ? 1-(sincePress/260) : 0;
  const recentMiss = game.effects.some(e => e.kind==='miss' && (t-e.at)<300);
  const shakeX = recentMiss && !reducedMotion ? (Math.random()-0.5)*4 : 0;

  ctx.save();
  ctx.translate(PLAYER_POS.x+shakeX, PLAYER_POS.y);
  const scaleY = 1+pressPulse*0.35-(recentMiss?0.12:0);
  const scaleX = 1-pressPulse*0.2+(recentMiss?0.1:0);
  ctx.scale(scaleX, scaleY);

  const glowR = 40+pressPulse*30;
  const grad = ctx.createRadialGradient(0,0,2,0,0,glowR);
  grad.addColorStop(0, recentMiss ? 'rgba(255,107,122,0.55)' : `rgba(255,212,121,${0.35+pressPulse*0.3})`);
  grad.addColorStop(1,'rgba(255,212,121,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0,0,glowR,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(232,184,75,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-14,10); ctx.lineTo(0,-6); ctx.lineTo(14,10); ctx.lineTo(0,20); ctx.closePath();
  ctx.stroke();

  ctx.fillStyle = recentMiss ? '#ff8b93' : '#ffdf9e';
  ctx.beginPath();
  ctx.moveTo(0,-2);
  ctx.quadraticCurveTo(9,4,0,16);
  ctx.quadraticCurveTo(-9,4,0,-2);
  ctx.fill();

  ctx.restore();
}

function drawEffects(t){
  for(const e of game.effects){
    const age = t-e.at;
    const life = e.until-e.at;
    const p = clamp(age/life,0,1);
    if(e.kind === 'parry'){
      ctx.save();
      ctx.globalAlpha = 1-p;
      ctx.strokeStyle = '#fff6d8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(PLAYER_POS.x, PLAYER_POS.y-10, 20+p*70, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    } else if(e.kind === 'miss'){
      ctx.save();
      ctx.globalAlpha = (1-p)*0.45;
      ctx.fillStyle = '#ff5d6c';
      ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      ctx.restore();
    } else if(e.kind === 'phaseShift'){
      ctx.save();
      ctx.globalAlpha = (1-p)*0.45;
      ctx.fillStyle = phaseColor(e.phase,1);
      ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      ctx.restore();
    } else if(e.kind === 'victory'){
      ctx.save();
      ctx.globalAlpha = Math.min(1,p*1.2)*0.32;
      ctx.fillStyle = '#ffe9b0';
      ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      ctx.restore();
    } else if(e.kind === 'defeat'){
      ctx.save();
      ctx.globalAlpha = Math.min(1,p*1.2)*0.5;
      ctx.fillStyle = '#0a0710';
      ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
      ctx.restore();
    }
  }
}

function drawVignette(){
  const g = ctx.createRadialGradient(240,320,180,240,320,420);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
}

function currentShake(t){
  if(reducedMotion) return {x:0,y:0};
  let mag = 0;
  for(const e of game.effects){
    if(e.kind==='miss' || e.kind==='phaseShift' || e.kind==='defeat'){
      const age = t-e.at;
      const dur = e.kind==='miss' ? 300 : e.kind==='phaseShift' ? 500 : 600;
      if(age<dur) mag = Math.max(mag, (1-age/dur)*(e.kind==='miss'?6:e.kind==='phaseShift'?10:8));
    }
  }
  if(mag<=0) return {x:0,y:0};
  return { x: Math.sin(t*0.09)*mag, y: Math.cos(t*0.13)*mag };
}

function render(){
  const t = game.time;
  if(game.seed !== lastVisualSeed) regenerateVisuals(game.seed);

  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  drawBackground(t);

  const shake = currentShake(t);
  ctx.save();
  ctx.translate(shake.x, shake.y);
  drawArenaFloor(t);
  drawBoss(t);
  drawAttacks(t);
  drawPlayer(t);
  drawEffects(t);
  ctx.restore();

  drawVignette();

  updateParticles();
  drawParticles();
}

/* ---------- ui sync ---------- */
function announce(msg){ liveRegion.textContent = msg; }

let lastPhaseAnnounced = 0;
let resolvePipCache = -1;
function syncHud(){
  const s = game;
  const frac = clamp(s.boss.stability / s._maxStability, 0, 1);
  bossBarFill.style.width = (frac*100).toFixed(1)+'%';

  for(const pip of phasePips.children){
    pip.classList.toggle('active', Number(pip.dataset.phase) <= s.phase);
  }

  if(resolvePipCache !== s.player.resolve){
    resolvePipCache = s.player.resolve;
    resolvePips.innerHTML = '';
    for(let i=0;i<PLAYER_MAX_RESOLVE;i++){
      const el = document.createElement('span');
      el.className = 'resolve-pip' + (i < s.player.resolve ? ' lit' : '');
      resolvePips.appendChild(el);
    }
  }

  comboLabel.textContent = `Combo ×${s.combo}`;
  scoreLabel.textContent = String(s.score);
  timerLabel.textContent = (s.time/1000).toFixed(1)+'s';

  if(s.started && s.phase !== lastPhaseAnnounced){
    lastPhaseAnnounced = s.phase;
    announce(`Phase ${s.phase}`);
  }
}

let uiState = null;
function computeUiState(){
  if(!game.started) return 'ready';
  if(game.outcome) return 'result';
  if(game.paused) return 'paused';
  return 'playing';
}
function updateResultPanel(){
  const won = game.outcome === 'success';
  resultTitle.textContent = won ? 'Victory' : 'Defeat';
  resultStats.textContent = `Time ${(game.time/1000).toFixed(1)}s · Score ${game.score} · Best combo ×${game.bestCombo}`;
}
function syncOverlay(){
  const state = computeUiState();
  if(state === uiState){
    if(state === 'result') updateResultPanel();
    return;
  }
  uiState = state;
  overlay.classList.toggle('is-visible', state !== 'playing');
  panelReady.classList.toggle('is-active', state === 'ready');
  panelPaused.classList.toggle('is-active', state === 'paused');
  panelResult.classList.toggle('is-active', state === 'result');
  if(state === 'result'){
    updateResultPanel();
    announce(game.outcome === 'success' ? 'Victory' : 'Defeat');
  } else if(state === 'paused'){
    announce('Paused');
  }
}

function syncControls(){
  const started = game.started, outcome = game.outcome, paused = game.paused;
  btnStart.disabled = started && !outcome;
  btnPause.disabled = !started || !!outcome;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
  btnDemo.setAttribute('aria-pressed', String(game.demo));
  btnDemo.textContent = game.demo ? 'Demo: On' : 'Demo';
}

function syncUi(){
  syncHud();
  syncOverlay();
  syncControls();
}

/* ---------- input ---------- */
let seedCounter = 2;
function nextSeed(){ return seedCounter++; }

function beginRun(){
  ensureAudio();
  game.reset(nextSeed());
  game.setDemo(false);
  game.start();
  lastPhaseAnnounced = 0;
}
function restartRun(){
  ensureAudio();
  game.reset(nextSeed());
  game.setDemo(false);
  game.start();
  lastPhaseAnnounced = 0;
}
function togglePause(){
  if(!game.started || game.outcome) return;
  if(game.paused) game.resume(); else game.pause();
}
function toggleDemo(){
  ensureAudio();
  if(game.demo){
    game.setDemo(false);
    game.reset(game.seed);
    lastPhaseAnnounced = 0;
  } else {
    game.reset(nextSeed());
    game.setDemo(true);
    game.start();
    lastPhaseAnnounced = 0;
  }
}
function doPress(){
  ensureAudio();
  if(game.demo) game.setDemo(false);
  const hit = game.press();
  playPulseFeedback(hit);
}

btnStart.addEventListener('click', beginRun);
btnBegin.addEventListener('click', beginRun);
btnRestart.addEventListener('click', restartRun);
btnAgain.addEventListener('click', restartRun);
btnPause.addEventListener('click', togglePause);
btnResume.addEventListener('click', togglePause);
btnDemo.addEventListener('click', toggleDemo);
btnMute.addEventListener('click', toggleMute);

window.addEventListener('keydown', (e) => {
  if(e.code !== 'Space') return;
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag === 'BUTTON') return;
  if(e.repeat) return;
  e.preventDefault();
  doPress();
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  doPress();
});

/* ---------- main loop ---------- */
let lastFrameTs = null;
function frame(ts){
  if(document.hidden){
    lastFrameTs = null;
    requestAnimationFrame(frame);
    return;
  }
  if(lastFrameTs == null) lastFrameTs = ts;
  let delta = ts - lastFrameTs;
  lastFrameTs = ts;
  delta = Math.min(delta, 250);

  game.step(delta);
  processAudioEffects();
  render();
  syncUi();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();


</script>
</body>
