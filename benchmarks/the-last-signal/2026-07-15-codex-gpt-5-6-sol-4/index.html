<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GPT-5.6 Sol</title>
  <style>
    :root {
      --soot: oklch(0.15 0.012 240);
      --storm: oklch(0.23 0.028 235);
      --silver: oklch(0.75 0.022 215);
      --paper: oklch(0.92 0.018 83);
      --copper: oklch(0.67 0.13 48);
      --amber: oklch(0.79 0.14 71);
      --sky: oklch(0.82 0.08 205);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --safe-top: max(20px, env(safe-area-inset-top));
      --safe-right: max(22px, env(safe-area-inset-right));
      --safe-bottom: max(20px, env(safe-area-inset-bottom));
      --safe-left: max(22px, env(safe-area-inset-left));
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--soot);
      color: var(--paper);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button { font: inherit; }

    #experience {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      outline: none;
      background: var(--soot);
    }

    #world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #07090b;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 52% 46%, transparent 32%, rgb(0 0 0 / .18) 72%, rgb(0 0 0 / .58) 118%),
        linear-gradient(180deg, rgb(0 0 0 / .18), transparent 18%, transparent 80%, rgb(0 0 0 / .32));
      mix-blend-mode: multiply;
    }

    .frame {
      position: absolute;
      inset: calc(var(--safe-top) - 8px) calc(var(--safe-right) - 10px) calc(var(--safe-bottom) - 8px) calc(var(--safe-left) - 10px);
      z-index: 3;
      border: 1px solid rgb(233 231 218 / .16);
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: rgb(197 111 61 / .78);
    }

    .frame::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .frame::after {
      right: -1px;
      bottom: -1px;
      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    .chrome {
      position: absolute;
      z-index: 8;
      top: var(--safe-top);
      right: var(--safe-right);
      left: var(--safe-left);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-size: clamp(.86rem, 1.25vw, 1.05rem);
      font-weight: 650;
      letter-spacing: .025em;
      line-height: 1;
      text-shadow: 0 1px 4px rgb(0 0 0 / .6);
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.2vw, 30px);
      color: rgb(233 231 218 / .72);
      font-size: clamp(.62rem, .75vw, .72rem);
      letter-spacing: .12em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgb(0 0 0 / .8);
    }

    #clock {
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .story-mark {
      position: absolute;
      z-index: 7;
      left: var(--safe-left);
      bottom: calc(var(--safe-bottom) + 16px);
      color: rgb(233 231 218 / .62);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(.72rem, .95vw, .88rem);
      font-style: italic;
      letter-spacing: .04em;
      pointer-events: none;
      text-shadow: 0 1px 4px rgb(0 0 0 / .7);
    }

    .replay-top {
      position: absolute;
      z-index: 12;
      right: var(--safe-right);
      bottom: calc(var(--safe-bottom) + 8px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 0 6px 10px;
      border: 0;
      color: rgb(233 231 218 / .66);
      background: transparent;
      cursor: pointer;
      letter-spacing: .12em;
      font-size: .64rem;
      text-transform: uppercase;
      transition: color 220ms var(--ease-out);
    }

    .replay-top svg {
      width: 16px;
      height: 16px;
      overflow: visible;
    }

    .replay-top:hover { color: var(--paper); }

    .pause-top {
      position: absolute;
      z-index: 12;
      right: calc(var(--safe-right) + 60px);
      bottom: calc(var(--safe-bottom) + 8px);
      min-width: 52px;
      min-height: 44px;
      padding: 6px;
      border: 0;
      color: rgb(233 231 218 / .66);
      background: transparent;
      cursor: pointer;
      letter-spacing: .12em;
      font-size: .61rem;
      text-transform: uppercase;
      transition: color 220ms var(--ease-out);
    }

    .pause-top:hover { color: var(--paper); }

    .replay-top:focus-visible,
    .pause-top:focus-visible,
    .end-actions button:focus-visible {
      outline: 1px solid var(--amber);
      outline-offset: 5px;
    }

    .progress-shell {
      position: absolute;
      z-index: 9;
      right: clamp(152px, 18vw, 240px);
      bottom: calc(var(--safe-bottom) + 24px);
      left: clamp(152px, 19vw, 280px);
      height: 1px;
      background: rgb(233 231 218 / .16);
      pointer-events: none;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--copper);
      box-shadow: 0 0 7px rgb(197 111 61 / .52);
    }

    .progress-knot {
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      border: 1px solid rgb(233 231 218 / .34);
      border-radius: 50%;
      background: #090c0e;
      transform: translate(-50%, -50%);
    }

    .progress-knot:nth-child(2) { left: 31%; }
    .progress-knot:nth-child(3) { left: 69%; }

    .narrative {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

    .line {
      position: absolute;
      left: 50%;
      bottom: clamp(98px, 14vh, 154px);
      width: min(720px, calc(100% - 56px));
      margin: 0;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2vw, 1.62rem);
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 8px rgb(0 0 0 / .95);
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 900ms var(--ease-out), transform 900ms var(--ease-out);
    }

    .line.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .tune-copy {
      position: absolute;
      top: clamp(84px, 12vh, 120px);
      left: 50%;
      margin: 0;
      color: rgb(233 231 218 / .75);
      font-size: clamp(.64rem, .85vw, .76rem);
      letter-spacing: .17em;
      line-height: 1.5;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      transform: translate(-50%, -5px);
      transition: opacity 500ms ease, transform 700ms var(--ease-out);
    }

    .tune-copy.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .tune-copy span {
      display: block;
      margin-top: 5px;
      color: rgb(240 179 95 / .72);
      font-size: .58rem;
      letter-spacing: .09em;
      text-transform: none;
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(1100px, calc(100% - 48px));
      margin: 0;
      color: var(--paper);
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(2.05rem, 6.1vw, 5.6rem);
      font-weight: 800;
      letter-spacing: .055em;
      line-height: .96;
      text-align: center;
      text-wrap: balance;
      opacity: 0;
      filter: blur(8px);
      transform: translate(-50%, -47%) scale(.985);
      transition: opacity 1500ms var(--ease-out), filter 1800ms var(--ease-out), transform 1800ms var(--ease-out);
      text-shadow: 0 0 8px rgb(240 179 95 / .22), 0 3px 18px rgb(0 0 0 / .92);
    }

    .message.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translate(-50%, -50%) scale(1);
    }

    .fragment-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .fragment-control {
      position: absolute;
      left: 9%;
      width: 82%;
      min-height: 54px;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      cursor: ew-resize;
      pointer-events: auto;
      touch-action: none;
      opacity: 0;
    }

    .fragment-control:focus-visible {
      opacity: 1;
      background:
        linear-gradient(90deg, var(--amber) 0 16px, transparent 16px calc(100% - 16px), var(--amber) calc(100% - 16px)) top / 100% 1px no-repeat,
        linear-gradient(90deg, var(--amber) 0 16px, transparent 16px calc(100% - 16px), var(--amber) calc(100% - 16px)) bottom / 100% 1px no-repeat;
    }

    .choice {
      position: absolute;
      top: 72%;
      left: 50%;
      display: flex;
      width: min(780px, calc(100% - 56px));
      justify-content: space-between;
      gap: 48px;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 850ms var(--ease-out), transform 850ms var(--ease-out);
      pointer-events: none;
    }

    .choice.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .choice button {
      position: relative;
      min-width: 210px;
      min-height: 58px;
      padding: 15px 18px;
      border: 0;
      border-radius: 0;
      color: var(--paper);
      background: transparent;
      cursor: pointer;
      letter-spacing: .18em;
      font-size: clamp(.75rem, 1.15vw, .92rem);
      text-transform: uppercase;
      transition: color 220ms ease;
    }

    .choice button::before,
    .choice button::after {
      content: "";
      position: absolute;
      top: 50%;
      height: 1px;
      background: rgb(233 231 218 / .32);
      transition: background 220ms ease, transform 500ms var(--ease-out);
    }

    .choice button::before { right: calc(50% + 58px); left: 0; }
    .choice button::after { right: 0; left: calc(50% + 58px); }

    .choice button:hover,
    .choice button:focus-visible { color: var(--amber); }

    .choice button:hover::before,
    .choice button:hover::after,
    .choice button:focus-visible::before,
    .choice button:focus-visible::after {
      background: var(--copper);
      transform: scaleX(1.08);
    }

    .choice button:focus-visible {
      outline: 1px solid var(--amber);
      outline-offset: 4px;
    }

    .ending-copy {
      position: absolute;
      top: 72%;
      left: 50%;
      width: min(720px, calc(100% - 52px));
      margin: 0;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.25vw, 1.7rem);
      line-height: 1.4;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 10px rgb(0 0 0 / .94);
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 1100ms var(--ease-out), transform 1100ms var(--ease-out);
    }

    .ending-copy.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .end-actions {
      position: absolute;
      z-index: 13;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 58px);
      display: flex;
      gap: 34px;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 650ms var(--ease-out), transform 650ms var(--ease-out);
      pointer-events: none;
    }

    .end-actions.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .end-actions button {
      min-height: 44px;
      padding: 8px 2px;
      border: 0;
      border-bottom: 1px solid rgb(233 231 218 / .32);
      border-radius: 0;
      color: rgb(233 231 218 / .76);
      background: transparent;
      cursor: pointer;
      letter-spacing: .13em;
      font-size: .65rem;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 220ms ease, border-color 220ms ease;
    }

    .end-actions button:hover {
      color: var(--amber);
      border-color: var(--copper);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 560px) {
      .telemetry span:first-child { display: none; }
      .progress-shell { right: 146px; left: 126px; }
      .story-mark { bottom: calc(var(--safe-bottom) + 15px); }
      .replay-top span { display: none; }
      .replay-top { padding-left: 14px; }
      .pause-top { right: calc(var(--safe-right) + 52px); min-width: 48px; padding: 4px; }
      .choice {
        top: 68%;
        width: min(330px, calc(100% - 40px));
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .choice button { min-width: 0; min-height: 52px; }
      .message {
        width: calc(100% - 36px);
        font-size: clamp(2rem, 12vw, 3.45rem);
        line-height: .94;
      }
      .line { bottom: 118px; }
      .ending-copy { top: 68%; }
      .end-actions {
        width: calc(100% - 54px);
        justify-content: center;
        gap: 22px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .tune-copy { top: 52px; }
      .line { bottom: 62px; font-size: .96rem; }
      .choice { top: 58%; }
      .ending-copy { top: 52%; font-size: 1rem; }
      .end-actions { bottom: calc(var(--safe-bottom) + 30px); }
      .story-mark { bottom: calc(var(--safe-bottom) + 8px); }
      .progress-shell { bottom: calc(var(--safe-bottom) + 18px); }
      .replay-top,
      .pause-top { bottom: calc(var(--safe-bottom) + 2px); }
    }

    @media (max-width: 560px) and (max-height: 360px) and (orientation: landscape) {
      .tune-copy { top: 38px; line-height: 1; }
      .tune-copy span { display: none; }
      .choice {
        top: 55%;
        width: calc(100% - 64px);
        flex-direction: row;
        gap: 12px;
      }
      .choice button { min-height: 44px; padding: 8px 6px; font-size: .66rem; }
      .ending-copy { top: 48%; font-size: .9rem; }
      .end-actions { bottom: calc(var(--safe-bottom) + 2px); }
      .progress-shell,
      .story-mark { display: none; }
      body[data-completed="true"] .replay-top,
      body[data-completed="true"] .pause-top { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line,
      .tune-copy,
      .message,
      .choice,
      .ending-copy,
      .end-actions {
        transition-duration: 120ms;
      }
      .message { filter: none; }
    }
  </style>
</head>
<body>
  <div id="experience" tabindex="-1" role="region" aria-label="The Last Signal, an interactive visual story" aria-describedby="sceneDescription">
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>

    <header class="chrome">
      <h1 id="modelTitle">GPT-5.6 Sol</h1>
      <div class="telemetry" aria-hidden="true">
        <span id="actLabel">I · Receiver</span>
        <span id="clock">02:16</span>
      </div>
    </header>

    <div class="story-mark" aria-hidden="true">The Last Signal</div>

    <div id="progress" class="progress-shell" role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="progress-fill"></div>
      <i class="progress-knot" aria-hidden="true"></i>
      <i class="progress-knot" aria-hidden="true"></i>
    </div>

    <main class="narrative">
      <p id="line" class="line" aria-live="polite"></p>
      <p id="tuneCopy" class="tune-copy" aria-hidden="true">Bring the three fragments into one voice<span id="tuneInstructions">drag sideways · arrows to tune · enter to center</span></p>
      <p id="message" class="message" aria-hidden="true" aria-live="polite">WE REMEMBER YOUR SKY.</p>

      <div id="fragmentLayer" class="fragment-layer" aria-label="Signal tuning controls" aria-hidden="true" inert>
        <button class="fragment-control" type="button" role="slider" data-fragment="0" aria-label="Signal fragment one" aria-describedby="tuneInstructions" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="-1"></button>
        <button class="fragment-control" type="button" role="slider" data-fragment="1" aria-label="Signal fragment two" aria-describedby="tuneInstructions" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="-1"></button>
        <button class="fragment-control" type="button" role="slider" data-fragment="2" aria-label="Signal fragment three" aria-describedby="tuneInstructions" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="-1"></button>
      </div>

      <div id="choice" class="choice" role="group" aria-label="Choose the operator's response" aria-hidden="true">
        <button type="button" data-ending="answer">Answer</button>
        <button type="button" data-ending="silent">Stay silent</button>
      </div>

      <p id="endingCopy" class="ending-copy" aria-live="polite"></p>

      <div id="endActions" class="end-actions" aria-hidden="true">
        <button id="replayEnd" type="button">Replay signal</button>
        <button id="alternateEnd" type="button">Follow silence</button>
      </div>

      <p id="sceneDescription" class="sr-only">A listening station stands on a black headland in a violent night storm.</p>
      <p id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </main>

    <button id="pauseTop" class="pause-top" type="button" aria-label="Pause story" aria-pressed="false">Pause</button>

    <button id="replayTop" class="replay-top" type="button" aria-label="Replay from the beginning" title="Replay from the beginning">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M5.2 5.1A6.5 6.5 0 1 1 3.6 10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        <path d="M2.2 5.6h4.1v4.1" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Replay</span>
    </button>
  </div>

  <script>
  (() => {
    "use strict";

    const DEFAULT_SEED = 217;
    const ACT = Object.freeze({ RECEIVER: "receiver", MESSAGE: "message", CHOICE: "choice", ENDING: "ending" });
    const TIMING = Object.freeze({
      receiver: 24000,
      alignHold: 900,
      revealToChoice: 6500,
      choiceToAuto: 4200,
      ending: 24000,
      fixedStep: 20,
      maxFrameDelta: 100,
      autoWindows: Object.freeze([[5000, 10000], [9000, 15000], [14500, 20500]])
    });
    const EPSILON = 0.035;
    const PALETTE = Object.freeze({
      soot: "#07090b",
      black: "#030405",
      storm: "#101b26",
      storm2: "#1b2932",
      slate: "#34444d",
      silver: "#9aa9ad",
      paper: "#e9e7da",
      copper: "#c56f3d",
      amber: "#f0b35f",
      sky: "#9fd7df",
      earth: "#151511"
    });

    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const lineEl = document.getElementById("line");
    const tuneCopy = document.getElementById("tuneCopy");
    const messageEl = document.getElementById("message");
    const fragmentLayer = document.getElementById("fragmentLayer");
    const choiceEl = document.getElementById("choice");
    const endingCopy = document.getElementById("endingCopy");
    const endActions = document.getElementById("endActions");
    const alternateEnd = document.getElementById("alternateEnd");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progressFill");
    const actLabel = document.getElementById("actLabel");
    const clock = document.getElementById("clock");
    const sceneDescription = document.getElementById("sceneDescription");
    const announcer = document.getElementById("announcer");
    const pauseTop = document.getElementById("pauseTop");
    const fragmentControls = [...document.querySelectorAll(".fragment-control")];
    const reducedQuery = matchMedia("(prefers-reduced-motion: reduce)");

    let reducedMotion = reducedQuery.matches;
    let width = 1;
    let height = 1;
    let dpr = 1;
    let lastNow = null;
    let accumulator = 0;
    let rafId = 0;
    let testing = false;
    let focusedFragment = -1;
    let activePointer = null;
    let lastDomKey = "";
    let lastAnnouncementKey = "";
    let startupObserved = null;
    const bandRects = [{ top: 0, height: 60 }, { top: 0, height: 60 }, { top: 0, height: 60 }];

    const state = {
      seed: DEFAULT_SEED,
      act: ACT.RECEIVER,
      actTime: 0,
      fragments: [],
      fragmentInitials: [],
      alignmentHold: 0,
      resolved: false,
      resolvedAt: null,
      choiceAvailable: false,
      choiceAvailableAt: null,
      messageTimeAtChoice: 0,
      selectedEnding: null,
      completed: false,
      paused: false,
      autoplayEnabled: true,
      autoplayEnding: "answer",
      environment: null,
      transitions: [],
      actionLog: [],
      autoplayTouches: [false, false, false]
    };

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const lerp = (a, b, t) => a + (b - a) * t;
    const invLerp = (a, b, v) => clamp((v - a) / (b - a || 1), 0, 1);
    const smooth = t => {
      t = clamp(t, 0, 1);
      return t * t * (3 - 2 * t);
    };
    const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
    const pulse = (time, at, widthMs) => Math.exp(-Math.pow((time - at) / widthMs, 2));
    const finite = value => Number.isFinite(value);

    function mulberry32(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value + 0x6D2B79F5) | 0;
        let t = Math.imul(value ^ value >>> 15, 1 | value);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function normalizeSeed(seed) {
      const n = Number(seed);
      if (!finite(n)) return DEFAULT_SEED;
      return clamp(Math.trunc(n), -2147483648, 2147483647);
    }

    function createEnvironment(seed) {
      const random = mulberry32((seed >>> 0) ^ 0xA2175EED);
      const rain = Array.from({ length: 180 }, (_, index) => ({
        x: random(),
        y: random(),
        depth: .28 + random() * .72,
        speed: .7 + random() * 1.35,
        length: .45 + random() * 1.1,
        sway: random() * Math.PI * 2,
        index
      }));
      const clouds = Array.from({ length: 28 }, () => ({
        x: -.08 + random() * 1.16,
        y: .04 + random() * .5,
        radius: .08 + random() * .17,
        stretch: 1.1 + random() * 2.4,
        depth: .35 + random() * .65
      }));
      const grain = Array.from({ length: 260 }, () => ({
        x: random(),
        y: random(),
        size: .4 + random() * 1.4,
        alpha: .025 + random() * .07
      }));
      const lightning = [2600, 8150, 12700, 17750, 22200].map((time, index) => ({
        time: time + (random() - .5) * 850,
        x: .14 + random() * .72,
        fork: random(),
        index
      }));
      const fragmentInitials = Array.from({ length: 3 }, () => {
        const left = random() < .5;
        return left ? .035 + random() * .255 : .71 + random() * .255;
      });
      return { rain, clouds, grain, lightning, fragmentInitials, signature: `${seed}:${rain[0].x.toFixed(6)}:${lightning[0].time.toFixed(2)}` };
    }

    function coherence() {
      if (!state.fragments.length) return 0;
      const error = state.fragments.reduce((sum, fragment) => sum + Math.abs(fragment.value - fragment.target), 0) / 3;
      return clamp(1 - error / .5, 0, 1);
    }

    function recordAction(type, detail) {
      state.actionLog.push({ type, ...detail, at: Math.round(state.actTime) });
      if (state.actionLog.length > 480) state.actionLog.splice(0, state.actionLog.length - 480);
    }

    function resetInternal(seed) {
      state.seed = normalizeSeed(seed);
      state.environment = createEnvironment(state.seed);
      state.fragmentInitials = state.environment.fragmentInitials.slice();
      state.fragments = state.fragmentInitials.map((value, index) => ({
        index,
        value,
        target: .5,
        aligned: Math.abs(value - .5) <= EPSILON
      }));
      state.act = ACT.RECEIVER;
      state.actTime = 0;
      state.alignmentHold = 0;
      state.resolved = false;
      state.resolvedAt = null;
      state.choiceAvailable = false;
      state.choiceAvailableAt = null;
      state.messageTimeAtChoice = 0;
      state.selectedEnding = null;
      state.completed = false;
      state.paused = false;
      state.transitions = [{ act: ACT.RECEIVER, at: 0 }];
      state.actionLog = [];
      state.autoplayTouches = [false, false, false];
      accumulator = 0;
      lastNow = null;
      focusedFragment = -1;
      activePointer = null;
      lastDomKey = "";
      lastAnnouncementKey = "";
      updateDom(true);
      render();
      return snapshot();
    }

    function setAutoplayInternal(enabled, ending) {
      if (ending === "answer" || ending === "silent") state.autoplayEnding = ending;
      state.autoplayEnabled = Boolean(enabled);
      return snapshot();
    }

    function cancelAutoplay() {
      state.autoplayEnabled = false;
    }

    function enterMessage(overflow = 0) {
      state.act = ACT.MESSAGE;
      state.actTime = Math.max(0, overflow);
      state.transitions.push({ act: ACT.MESSAGE, at: 0 });
      recordAction("act", { value: ACT.MESSAGE, source: "system" });
    }

    function enterChoice(overflow = 0) {
      state.messageTimeAtChoice = state.actTime - Math.max(0, overflow);
      state.act = ACT.CHOICE;
      state.actTime = Math.max(0, overflow);
      state.choiceAvailable = true;
      state.choiceAvailableAt = 0;
      state.transitions.push({ act: ACT.CHOICE, at: 0 });
      recordAction("act", { value: ACT.CHOICE, source: "system" });
    }

    function alignInternal(index, value, source = "manual") {
      const i = Number(index);
      const v = Number(value);
      if (state.act !== ACT.MESSAGE || state.resolved || !Number.isInteger(i) || i < 0 || i > 2 || !finite(v)) return false;
      const fragment = state.fragments[i];
      const next = clamp(v, 0, 1);
      const changed = Math.abs(fragment.value - next) > .00001;
      fragment.value = next;
      fragment.aligned = Math.abs(fragment.value - fragment.target) <= EPSILON;
      if (source === "autoplay" && changed) state.autoplayTouches[i] = true;
      if (changed) recordAction("align", { index: i, value: Number(next.toFixed(5)), source });
      return true;
    }

    function chooseInternal(ending, source = "manual") {
      if ((ending !== "answer" && ending !== "silent") || state.act !== ACT.CHOICE || !state.choiceAvailable || state.selectedEnding) return false;
      state.selectedEnding = ending;
      state.choiceAvailable = false;
      state.act = ACT.ENDING;
      state.actTime = 0;
      state.completed = false;
      state.transitions.push({ act: `${ACT.ENDING}:${ending}`, at: 0 });
      recordAction("choose", { ending, source });
      updateDom(true);
      return true;
    }

    function applyAutoplay() {
      if (!state.autoplayEnabled || state.act !== ACT.MESSAGE || state.resolved) return;
      for (let index = 0; index < 3; index += 1) {
        const [start, end] = TIMING.autoWindows[index];
        if (state.actTime < start) continue;
        const p = smooth(invLerp(start, end, state.actTime));
        const authoredDrift = Math.sin((state.actTime - start) * .004 + index * 1.7) * (1 - p) * .012;
        alignInternal(index, lerp(state.fragmentInitials[index], .5, p) + authoredDrift, "autoplay");
      }
    }

    function simulateStep(dt) {
      if (state.completed || !finite(dt) || dt <= 0) return;
      state.actTime += dt;

      if (state.act === ACT.RECEIVER) {
        if (state.actTime >= TIMING.receiver) {
          const overflow = state.actTime - TIMING.receiver;
          enterMessage(overflow);
        }
        return;
      }

      if (state.act === ACT.MESSAGE) {
        applyAutoplay();

        if (!state.resolved) {
          const allAligned = state.fragments.every(fragment => fragment.aligned);
          state.alignmentHold = allAligned ? state.alignmentHold + dt : 0;
          if (state.alignmentHold >= TIMING.alignHold) {
            state.fragments.forEach(fragment => {
              fragment.value = fragment.target;
              fragment.aligned = true;
            });
            state.resolved = true;
            state.resolvedAt = state.actTime;
            recordAction("resolved", { source: state.autoplayEnabled ? "autoplay" : "manual" });
          }
        } else if (state.actTime - state.resolvedAt >= TIMING.revealToChoice) {
          const overflow = state.actTime - state.resolvedAt - TIMING.revealToChoice;
          enterChoice(overflow);
        }
        return;
      }

      if (state.act === ACT.CHOICE) {
        if (state.autoplayEnabled && state.actTime >= TIMING.choiceToAuto) chooseInternal(state.autoplayEnding, "autoplay");
        return;
      }

      if (state.act === ACT.ENDING && state.actTime >= TIMING.ending) {
        state.actTime = TIMING.ending;
        state.completed = true;
        state.transitions.push({ act: `complete:${state.selectedEnding}`, at: TIMING.ending });
        recordAction("complete", { ending: state.selectedEnding, source: "system" });
      }
    }

    function advanceVirtual(milliseconds) {
      let remaining = Math.max(0, Number(milliseconds) || 0);
      let guard = 0;
      while (remaining > 0 && guard < 20000) {
        const step = Math.min(TIMING.fixedStep, remaining);
        simulateStep(step);
        remaining -= step;
        guard += 1;
      }
    }

    function seekInternal(milliseconds, manual = false) {
      const value = Number(milliseconds);
      if (!finite(value)) return snapshot();
      if (manual) cancelAutoplay();

      if (state.act === ACT.RECEIVER) {
        const target = clamp(value, 0, TIMING.receiver);
        state.actTime = target;
        if (target >= TIMING.receiver) enterMessage(0);
      } else if (state.act === ACT.MESSAGE) {
        const target = clamp(value, 0, 120000);
        const previousTime = state.actTime;
        if (state.resolvedAt !== null && target < state.resolvedAt) {
          state.fragments = state.fragmentInitials.map((fragmentValue, index) => ({
            index,
            value: fragmentValue,
            target: .5,
            aligned: Math.abs(fragmentValue - .5) <= EPSILON
          }));
          state.alignmentHold = 0;
          state.resolved = false;
          state.resolvedAt = null;
          state.choiceAvailable = false;
          state.choiceAvailableAt = null;
        }
        state.actTime = target;
        if (!state.resolved) {
          if (target < previousTime) {
            state.alignmentHold = 0;
          } else if (state.fragments.every(fragment => fragment.aligned)) {
            const priorHold = state.alignmentHold;
            state.alignmentHold += target - previousTime;
            if (state.alignmentHold >= TIMING.alignHold) {
              state.resolved = true;
              state.resolvedAt = previousTime + Math.max(0, TIMING.alignHold - priorHold);
              state.fragments.forEach(fragment => {
                fragment.value = fragment.target;
                fragment.aligned = true;
              });
              recordAction("resolved", { source: "seek" });
            }
          } else {
            state.alignmentHold = 0;
          }
        }
        if (state.resolved && state.resolvedAt !== null) {
          state.fragments.forEach(fragment => {
            fragment.value = fragment.target;
            fragment.aligned = true;
          });
          const choiceBoundary = state.resolvedAt + TIMING.revealToChoice;
          if (target >= choiceBoundary) enterChoice(target - choiceBoundary);
        }
      } else if (state.act === ACT.CHOICE) {
        state.actTime = clamp(value, 0, 120000);
        state.choiceAvailable = true;
      } else {
        state.actTime = clamp(value, 0, TIMING.ending);
        state.completed = state.actTime >= TIMING.ending;
      }
      accumulator = 0;
      return snapshot();
    }

    function snapshot() {
      return {
        seed: state.seed,
        act: state.act,
        actTime: Number(state.actTime.toFixed(3)),
        phase: state.act === ACT.MESSAGE ? (state.resolved ? "resolved" : "tuning") : state.act === ACT.CHOICE ? "choice" : state.act === ACT.ENDING ? state.selectedEnding : "opening",
        fragments: state.fragments.map(fragment => ({
          value: Number(fragment.value.toFixed(6)),
          target: fragment.target,
          error: Number(Math.abs(fragment.value - fragment.target).toFixed(6)),
          aligned: fragment.aligned
        })),
        choiceAvailable: state.choiceAvailable,
        selectedEnding: state.selectedEnding,
        completed: state.completed,
        completionState: state.completed ? "complete" : "playing",
        autoplay: { enabled: state.autoplayEnabled, ending: state.autoplayEnding },
        resolved: state.resolved,
        paused: state.paused
      };
    }

    function currentProgress() {
      if (state.act === ACT.RECEIVER) return .31 * clamp(state.actTime / TIMING.receiver, 0, 1);
      if (state.act === ACT.MESSAGE) {
        const expected = state.resolvedAt === null ? 27500 : state.resolvedAt + TIMING.revealToChoice;
        return .31 + .31 * clamp(state.actTime / expected, 0, .99);
      }
      if (state.act === ACT.CHOICE) return .62 + .07 * clamp(state.actTime / TIMING.choiceToAuto, 0, 1);
      return .69 + .31 * clamp(state.actTime / TIMING.ending, 0, 1);
    }

    function setText(element, text, visible) {
      if (element.textContent !== text) element.textContent = text;
      element.classList.toggle("is-visible", Boolean(visible));
    }

    function updateDom(force = false) {
      const phaseKey = `${state.act}|${Math.floor(state.actTime / 250)}|${state.resolved}|${state.choiceAvailable}|${state.selectedEnding}|${state.completed}|${state.autoplayEnabled}|${state.paused}`;
      if (!force && phaseKey === lastDomKey) return;
      lastDomKey = phaseKey;

      let narrative = "";
      let narrativeVisible = false;
      if (state.act === ACT.RECEIVER) {
        if (state.actTime >= 5900 && state.actTime < 16600) {
          narrative = "At 02:17, the dead receiver began to glow.";
          narrativeVisible = true;
        } else if (state.actTime >= 17100 && state.actTime < 22900) {
          narrative = "For thirty years, nothing had answered.";
          narrativeVisible = true;
        }
      }
      setText(lineEl, narrative, narrativeVisible);

      const tuning = state.act === ACT.MESSAGE && !state.resolved && state.actTime >= 1700;
      tuneCopy.classList.toggle("is-visible", tuning);
      tuneCopy.setAttribute("aria-hidden", String(!tuning));
      fragmentLayer.setAttribute("aria-hidden", String(!tuning));
      fragmentLayer.inert = !tuning;
      const messageVisible = (state.act === ACT.MESSAGE && state.resolved) || state.act === ACT.CHOICE;
      messageEl.classList.toggle("is-visible", messageVisible);
      messageEl.setAttribute("aria-hidden", String(!messageVisible));
      const choiceVisible = state.act === ACT.CHOICE && state.choiceAvailable;
      choiceEl.classList.toggle("is-visible", choiceVisible);
      choiceEl.setAttribute("aria-hidden", String(!choiceVisible));
      choiceEl.querySelectorAll("button").forEach(button => {
        button.disabled = !choiceVisible;
        button.tabIndex = choiceVisible ? 0 : -1;
      });

      fragmentControls.forEach((control, index) => {
        const enabled = tuning;
        control.tabIndex = enabled ? 0 : -1;
        control.disabled = !enabled;
        const value = Math.round(state.fragments[index].value * 100);
        control.setAttribute("aria-valuenow", String(value));
        const side = value < 50 ? "left of center" : "right of center";
        control.setAttribute("aria-valuetext", state.fragments[index].aligned ? "aligned at center" : `${side}, not aligned`);
      });

      let endText = "";
      let endVisible = false;
      if (state.act === ACT.ENDING) {
        if (state.selectedEnding === "answer") {
          if (state.actTime >= 3600 && state.actTime < 12200) endText = "For seven seconds, the rain fell upward.";
          else if (state.actTime >= 14200) endText = "At 02:18, something made room for morning.";
        } else {
          if (state.actTime >= 3600 && state.actTime < 12200) endText = "The signal passed into the rock.";
          else if (state.actTime >= 14200) endText = "By dawn, three warm stones waited under the station.";
        }
        endVisible = Boolean(endText);
      }
      setText(endingCopy, endText, endVisible);
      endActions.classList.toggle("is-visible", state.completed);
      endActions.setAttribute("aria-hidden", String(!state.completed));
      endActions.querySelectorAll("button").forEach(button => {
        button.disabled = !state.completed;
        button.tabIndex = state.completed ? 0 : -1;
      });
      alternateEnd.textContent = state.selectedEnding === "silent" ? "Follow answer" : "Follow silence";

      actLabel.textContent = state.act === ACT.RECEIVER ? "I · Receiver" : state.act === ACT.MESSAGE ? "II · Message" : state.act === ACT.CHOICE ? "III · Choice" : state.selectedEnding === "silent" ? "III · Silence" : "III · Answer";
      clock.textContent = state.act === ACT.RECEIVER && state.actTime < 5900 ? "02:16" : state.act === ACT.ENDING && state.actTime > 14200 ? "02:18" : "02:17";
      pauseTop.textContent = state.paused ? "Resume" : "Pause";
      pauseTop.setAttribute("aria-label", state.paused ? "Resume story" : "Pause story");
      pauseTop.setAttribute("aria-pressed", String(state.paused));

      const sceneText = state.act === ACT.RECEIVER
        ? (state.actTime < 8300 ? "A listening station stands on a black headland in a violent night storm." : "Inside the station, a lone operator faces a circular storm window and an old receiver beginning to glow.")
        : state.act === ACT.MESSAGE
          ? (state.resolved ? "The three copper signal bands converge over the glowing receiver." : "Three torn signal bands cross the receiver while the storm changes with their alignment.")
          : state.act === ACT.CHOICE
            ? "The resolved message fills the storm window while two physical signal paths wait for the operator's choice."
            : state.selectedEnding === "silent"
              ? "The station darkens while three copper threads descend through the rock and light three buried stones."
              : "Three copper threads braid through the antenna as rain rises toward a pale opening in the night sky.";
      if (sceneDescription.textContent !== sceneText) sceneDescription.textContent = sceneText;

      let announcementKey = "";
      let announcementText = "";
      if (narrativeVisible) {
        announcementKey = `narrative:${narrative}`;
        announcementText = narrative;
      } else if (tuning) {
        announcementKey = "tuning";
        announcementText = "Three signal fragments are ready to tune.";
      } else if (state.act === ACT.MESSAGE && state.resolved) {
        announcementKey = "resolved-message";
        announcementText = "WE REMEMBER YOUR SKY.";
      } else if (choiceVisible) {
        announcementKey = "choice";
        announcementText = "Choose: Answer, or Stay silent.";
      } else if (endVisible) {
        announcementKey = `ending:${endText}`;
        announcementText = endText;
      }
      if (announcementText && announcementKey !== lastAnnouncementKey) {
        lastAnnouncementKey = announcementKey;
        announcer.textContent = announcementText;
      }

      const p = currentProgress();
      progressFill.style.width = `${(p * 100).toFixed(3)}%`;
      progress.setAttribute("aria-valuenow", String(Math.round(p * 100)));
      document.body.dataset.act = state.act;
      document.body.dataset.ending = state.selectedEnding || "";
      document.body.dataset.completed = String(state.completed);
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutFragmentControls();
      render();
    }

    function getBandLayout() {
      const portrait = height > width * 1.12;
      const center = portrait ? height * .47 : height * .51;
      const bandHeight = clamp(height * .085, 54, 82);
      const baseGap = portrait ? clamp(height * .085, 74, 116) : clamp(height * .12, 76, 112);
      const gap = Math.max(baseGap, bandHeight + 24);
      return [0, 1, 2].map(index => ({
        top: center + (index - 1) * gap - bandHeight / 2,
        height: bandHeight,
        center: center + (index - 1) * gap
      }));
    }

    function layoutFragmentControls() {
      const layout = getBandLayout();
      layout.forEach((band, index) => {
        bandRects[index] = band;
        fragmentControls[index].style.top = `${band.top - 9}px`;
        fragmentControls[index].style.height = `${band.height + 18}px`;
      });
    }

    function pathHeadland(horizon) {
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, horizon + height * .05);
      ctx.lineTo(width * .12, horizon - height * .015);
      ctx.lineTo(width * .29, horizon + height * .02);
      ctx.lineTo(width * .48, horizon - height * .025);
      ctx.lineTo(width * .66, horizon + height * .012);
      ctx.lineTo(width * .82, horizon - height * .008);
      ctx.lineTo(width, horizon + height * .04);
      ctx.lineTo(width, height);
      ctx.closePath();
    }

    function drawClouds(time, brightness = 0, calm = 0) {
      ctx.save();
      const drift = reducedMotion ? 0 : time * .0000035;
      state.environment.clouds.forEach((cloud, index) => {
        const x = ((cloud.x + drift * cloud.depth + 1.2) % 1.2 - .1) * width;
        const y = cloud.y * height;
        const radius = cloud.radius * Math.min(width, height);
        const shade = 19 + Math.round(cloud.depth * 17 + brightness * 28 + calm * 4);
        ctx.fillStyle = `rgb(${shade - 5} ${shade + 2} ${shade + 10} / ${.5 + cloud.depth * .33})`;
        ctx.beginPath();
        ctx.ellipse(x, y, radius * cloud.stretch, radius, index * .03, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function lightningIntensity(time) {
      return state.environment.lightning.reduce((max, strike) => Math.max(max, pulse(time, strike.time, 82) + pulse(time, strike.time + 175, 125) * .3), 0);
    }

    function drawLightning(time, intensity) {
      if (intensity < .035 || reducedMotion && intensity < .38) return;
      const strike = state.environment.lightning.reduce((best, current) => Math.abs(current.time - time) < Math.abs(best.time - time) ? current : best, state.environment.lightning[0]);
      const x = strike.x * width;
      ctx.save();
      ctx.globalAlpha = clamp(intensity, 0, 1) * .75;
      ctx.strokeStyle = PALETTE.silver;
      ctx.lineWidth = Math.max(1, Math.min(width, height) * .0012);
      ctx.shadowColor = PALETTE.silver;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(x, -10);
      ctx.lineTo(x + width * (.012 + strike.fork * .015), height * .17);
      ctx.lineTo(x - width * .008, height * .29);
      ctx.lineTo(x + width * .018, height * .44);
      ctx.lineTo(x + width * .006, height * .58);
      ctx.stroke();
      ctx.restore();
    }

    function drawRain(time, options = {}) {
      const count = reducedMotion ? 42 : state.environment.rain.length;
      const calm = clamp(options.calm || 0, 0, 1);
      const reverse = clamp(options.reverse || 0, 0, 1);
      const signal = clamp(options.signal || 0, 0, 1);
      const margin = width * .16;
      ctx.save();
      ctx.lineCap = "round";
      for (let i = 0; i < count; i += 1) {
        const drop = state.environment.rain[i];
        const speed = reducedMotion ? 0 : time * .00012 * drop.speed * (1 - calm * .65);
        const direction = 1 - reverse * 2;
        const rawY = drop.y + speed * direction;
        const yNorm = ((rawY % 1) + 1) % 1;
        const y = yNorm * (height + 120) - 60;
        const baseX = drop.x * (width + margin * 2) - margin;
        const sway = reducedMotion ? 0 : Math.sin(time * .0005 + drop.sway) * 5 * (1 - calm);
        const slant = lerp(42, 10, signal) * drop.depth * direction;
        const length = (12 + 30 * drop.length) * drop.depth * (1 - calm * .3);
        const x = baseX + sway + (yNorm * 90 * drop.depth);
        ctx.globalAlpha = (.07 + drop.depth * .25) * (1 - calm * .45);
        ctx.strokeStyle = signal > .8 && i % 17 === 0 ? PALETTE.copper : PALETTE.silver;
        ctx.lineWidth = .45 + drop.depth * .75;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - slant, y + length * direction);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawGrain(multiplier = 1) {
      ctx.save();
      state.environment.grain.forEach(dot => {
        ctx.globalAlpha = dot.alpha * multiplier;
        ctx.fillStyle = dot.x > .55 ? PALETTE.paper : PALETTE.silver;
        ctx.fillRect(dot.x * width, dot.y * height, dot.size, dot.size);
      });
      ctx.restore();
    }

    function drawAntenna(x, baseY, scale = 1, filamentAlpha = .35) {
      const mastTop = baseY - 230 * scale;
      ctx.save();
      ctx.strokeStyle = PALETTE.black;
      ctx.lineWidth = Math.max(2, 8 * scale);
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x, mastTop);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, 2 * scale);
      ctx.strokeStyle = PALETTE.silver;
      ctx.globalAlpha = .42;
      ctx.beginPath();
      ctx.moveTo(x, mastTop + 28 * scale);
      ctx.lineTo(x - 58 * scale, mastTop + 86 * scale);
      ctx.moveTo(x, mastTop + 28 * scale);
      ctx.lineTo(x + 58 * scale, mastTop + 86 * scale);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x - 24 * scale, mastTop + 58 * scale, 46 * scale, 18 * scale, -.62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = PALETTE.copper;
      ctx.globalAlpha = filamentAlpha;
      for (let i = -1; i <= 1; i += 1) {
        ctx.beginPath();
        ctx.moveTo(x + i * 3 * scale, mastTop + 4 * scale);
        ctx.lineTo(x + i * 58 * scale, baseY + 15 * scale);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawExterior(time, alpha = 1, endingMode = null) {
      const horizon = height * (height > width * 1.12 ? .68 : .72);
      const flash = reducedMotion ? 0 : lightningIntensity(time);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = flash > .08 ? `rgb(${16 + flash * 25} ${27 + flash * 31} ${38 + flash * 36})` : PALETTE.storm;
      ctx.fillRect(0, 0, width, height);
      drawClouds(time, flash, endingMode === "silent" ? .65 : 0);
      if (!endingMode) drawLightning(time, flash);
      drawRain(time, { calm: endingMode === "silent" ? .65 : 0 });

      ctx.fillStyle = PALETTE.black;
      pathHeadland(horizon);
      ctx.fill();

      const portrait = height > width * 1.12;
      const stationW = portrait ? width * .48 : width * .25;
      const stationH = portrait ? height * .12 : height * .16;
      const stationX = portrait ? width * .36 : width * .53;
      const stationY = horizon - stationH;
      ctx.fillStyle = "#090d10";
      ctx.fillRect(stationX, stationY, stationW, stationH);
      ctx.fillStyle = "#141c20";
      ctx.beginPath();
      ctx.moveTo(stationX - stationW * .05, stationY);
      ctx.lineTo(stationX + stationW * .45, stationY - stationH * .2);
      ctx.lineTo(stationX + stationW * 1.04, stationY);
      ctx.closePath();
      ctx.fill();

      const windowX = stationX + stationW * .34;
      const windowY = stationY + stationH * .47;
      const windowR = Math.min(stationW, stationH) * .22;
      const glow = .04 + smooth(invLerp(5900, 15600, time)) * .96;
      ctx.fillStyle = `rgb(240 179 95 / ${.12 + glow * .5})`;
      ctx.beginPath();
      ctx.arc(windowX, windowY, windowR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgb(197 111 61 / ${.32 + glow * .45})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = PALETTE.black;
      ctx.beginPath();
      ctx.arc(windowX - windowR * .15, windowY - windowR * .18, windowR * .22, 0, Math.PI * 2);
      ctx.ellipse(windowX - windowR * .1, windowY + windowR * .42, windowR * .32, windowR * .64, -.1, 0, Math.PI * 2);
      ctx.fill();
      drawAntenna(stationX + stationW * .72, stationY, portrait ? .63 : .76, .2 + glow * .5);
      ctx.restore();
    }

    function drawRoundWindow(time, alpha) {
      const portrait = height > width * 1.12;
      const r = Math.min(width, height) * (portrait ? .29 : .31);
      const x = portrait ? width * .5 : width * .38;
      const y = portrait ? height * .34 : height * .43;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#080b0d";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = PALETTE.storm;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r - 6, 0, Math.PI * 2);
      ctx.clip();
      drawClouds(time, reducedMotion ? 0 : lightningIntensity(time));
      drawRain(time, {});
      ctx.restore();
      ctx.lineWidth = Math.max(7, r * .065);
      ctx.strokeStyle = "#020304";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgb(154 169 173 / .35)";
      ctx.beginPath();
      ctx.arc(x, y, r - 4, 0, Math.PI * 2);
      ctx.stroke();

      const operatorX = portrait ? width * .27 : width * .55;
      const operatorY = portrait ? height * .63 : height * .68;
      const head = Math.min(width, height) * .035;
      ctx.fillStyle = PALETTE.black;
      ctx.beginPath();
      ctx.arc(operatorX, operatorY - head * 3.8, head, 0, Math.PI * 2);
      ctx.ellipse(operatorX + head * .15, operatorY - head * .8, head * 1.65, head * 3.15, -.12, 0, Math.PI * 2);
      ctx.fill();

      const receiverX = portrait ? width * .63 : width * .69;
      const receiverY = portrait ? height * .68 : height * .67;
      const receiverR = Math.min(width, height) * .11;
      drawReceiver(receiverX, receiverY, receiverR, smooth(invLerp(5900, 18000, time)), time);
      ctx.restore();
    }

    function drawReceiver(x, y, radius, glow, time) {
      ctx.save();
      const light = ctx.createRadialGradient(x, y, radius * .06, x, y, radius * 1.8);
      light.addColorStop(0, `rgb(240 179 95 / ${.22 + glow * .58})`);
      light.addColorStop(.38, `rgb(197 111 61 / ${.1 + glow * .24})`);
      light.addColorStop(1, "rgb(197 111 61 / 0)");
      ctx.fillStyle = light;
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0a0c0c";
      ctx.strokeStyle = "#4a4740";
      ctx.lineWidth = Math.max(3, radius * .09);
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = `rgb(33 ${24 + glow * 18} 17)`;
      ctx.beginPath();
      ctx.arc(x, y, radius * .79, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgb(240 179 95 / ${.2 + glow * .68})`;
      ctx.lineWidth = Math.max(1, radius * .018);
      for (let ring = 1; ring <= 3; ring += 1) {
        const wobble = reducedMotion ? 0 : Math.sin(time * .003 + ring) * radius * .008 * (1 - glow);
        ctx.beginPath();
        ctx.arc(x, y, radius * (.22 + ring * .14) + wobble, Math.PI * 1.07, Math.PI * 1.93);
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(x, y);
      const needleJitter = reducedMotion ? 0 : Math.sin(time * .004) * .015 * (1 - glow);
      ctx.rotate(-.75 + glow * 1.12 + needleJitter);
      ctx.strokeStyle = PALETTE.paper;
      ctx.globalAlpha = .5 + glow * .45;
      ctx.lineWidth = Math.max(1, radius * .018);
      ctx.beginPath();
      ctx.moveTo(0, radius * .06);
      ctx.lineTo(0, -radius * .61);
      ctx.stroke();
      ctx.restore();
      ctx.restore();
    }

    function drawActReceiver() {
      const t = state.actTime;
      const interior = smooth(invLerp(8300, 15000, t));
      drawExterior(t, 1 - interior * .78);
      if (interior > .01) drawRoundWindow(t, interior);
      const close = smooth(invLerp(17600, reducedMotion ? 17840 : 23600, t));
      if (close > .01) {
        ctx.save();
        ctx.globalAlpha = close;
        ctx.fillStyle = "rgb(4 5 6 / .86)";
        ctx.fillRect(0, 0, width, height);
        const r = Math.min(width, height) * lerp(.16, .34, close);
        drawReceiver(width * .5, height * .51, r, easeOut(close), t);
        ctx.strokeStyle = `rgb(197 111 61 / ${close * .55})`;
        ctx.lineWidth = 1;
        for (let ring = 0; ring < 3; ring += 1) {
          ctx.beginPath();
          const ringMotion = reducedMotion ? 0 : Math.sin(t * .002 + ring) * .012;
          ctx.arc(width * .5, height * .51, r * (1.25 + ring * .28) * (1 + ringMotion), 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      drawGrain(.8);
    }

    function tornBandPath(top, bandHeight, index, time) {
      const segments = 18;
      ctx.beginPath();
      ctx.moveTo(width * .07, top + 3);
      for (let i = 0; i <= segments; i += 1) {
        const x = lerp(width * .07, width * .93, i / segments);
        const motion = reducedMotion ? 0 : Math.sin(time * .002 + i) * (state.fragments[index].aligned ? .3 : 1.4);
        const jitter = Math.sin(i * 2.17 + index * 3.1 + state.seed * .01) * 3 + motion;
        ctx.lineTo(x, top + jitter);
      }
      for (let i = segments; i >= 0; i -= 1) {
        const x = lerp(width * .07, width * .93, i / segments);
        const motion = reducedMotion ? 0 : Math.cos(time * .0017 + i) * (state.fragments[index].aligned ? .3 : 1.4);
        const jitter = Math.cos(i * 1.71 + index * 2.2 + state.seed * .013) * 3 + motion;
        ctx.lineTo(x, top + bandHeight + jitter);
      }
      ctx.closePath();
    }

    function drawSignalBands(time, alpha = 1) {
      if (alpha <= .01) return;
      const layout = getBandLayout();
      const signalCoherence = coherence();
      const portrait = height > width * 1.12;
      const fontSize = Math.min(portrait ? width * .075 : width * .038, portrait ? 42 : 54);
      const signalGlyphs = ["I ··· III · I ··", "·· II · I ··· II", "III ·· I · II ·"];

      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      const apertureR = Math.min(width, height) * (portrait ? .34 : .39);
      const aperture = ctx.createRadialGradient(width * .5, height * .5, apertureR * .05, width * .5, height * .5, apertureR);
      aperture.addColorStop(0, `rgb(197 111 61 / ${.03 + signalCoherence * .1})`);
      aperture.addColorStop(.72, "rgb(16 27 38 / .12)");
      aperture.addColorStop(1, "rgb(0 0 0 / 0)");
      ctx.fillStyle = aperture;
      ctx.beginPath();
      ctx.arc(width * .5, height * .5, apertureR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgb(197 111 61 / ${.14 + signalCoherence * .34})`;
      ctx.lineWidth = 1;
      for (let ring = 0; ring < 3; ring += 1) {
        ctx.beginPath();
        ctx.arc(width * .5, height * .5, apertureR * (.38 + ring * .22), 0, Math.PI * 2);
        ctx.stroke();
      }

      layout.forEach((band, index) => {
        const fragment = state.fragments[index];
        const delta = fragment.value - fragment.target;
        const offset = delta * Math.min(width * .82, 780);
        const alignedGlow = fragment.aligned ? .9 : .18;
        ctx.save();
        tornBandPath(band.top, band.height, index, time);
        ctx.clip();
        ctx.fillStyle = `rgb(20 30 34 / ${.74 + signalCoherence * .12})`;
        ctx.fillRect(width * .04, band.top - 8, width * .92, band.height + 16);

        ctx.globalAlpha = (.21 + signalCoherence * .25) * alpha;
        ctx.strokeStyle = PALETTE.copper;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = -20; x <= width + 20; x += 8) {
          const amplitude = band.height * (.12 + Math.abs(delta) * .34);
          const phase = reducedMotion ? index * 2.4 : time * .003 + index * 2.4;
          const y = band.center + Math.sin(x * .025 + phase) * amplitude;
          if (x === -20) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.globalAlpha = (.42 + signalCoherence * .58) * alpha;
        ctx.fillStyle = PALETTE.paper;
        ctx.font = `800 ${fontSize}px "Arial Narrow", Impact, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.letterSpacing = `${Math.max(1, fontSize * .055)}px`;
        ctx.fillText(signalGlyphs[index], width * .5 + offset, band.center);

        ctx.globalAlpha = (.28 + alignedGlow * .36) * alpha;
        ctx.fillStyle = PALETTE.amber;
        ctx.fillRect(width * .5 - 1, band.top, 2, band.height);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = (.35 + alignedGlow * .45) * alpha;
        ctx.strokeStyle = fragment.aligned ? PALETTE.amber : PALETTE.copper;
        ctx.lineWidth = 1;
        tornBandPath(band.top, band.height, index, time);
        ctx.stroke();
        const markerX = lerp(width * .09, width * .91, fragment.value);
        ctx.fillStyle = fragment.aligned ? PALETTE.amber : PALETTE.silver;
        ctx.beginPath();
        ctx.moveTo(markerX, band.top - 8);
        ctx.lineTo(markerX - 4, band.top - 14);
        ctx.lineTo(markerX + 4, band.top - 14);
        ctx.closePath();
        ctx.fill();
        if (focusedFragment === index) {
          ctx.strokeStyle = PALETTE.amber;
          ctx.globalAlpha = .9 * alpha;
          ctx.strokeRect(width * .07, band.top - 9, width * .86, band.height + 18);
        }
        ctx.restore();
      });
      ctx.restore();
    }

    function drawActMessage() {
      const t = state.act === ACT.CHOICE ? state.messageTimeAtChoice + state.actTime : state.actTime;
      const signalCoherence = coherence();
      const flash = reducedMotion ? 0 : lightningIntensity((t + 5400) % 24000) * (1 - signalCoherence * .75);
      ctx.fillStyle = flash > .1 ? "#172832" : PALETTE.storm;
      ctx.fillRect(0, 0, width, height);
      drawClouds(t + 5400, flash, signalCoherence * .2);
      drawRain(t + 5400, { signal: signalCoherence, calm: signalCoherence * .34 });

      const portrait = height > width * 1.12;
      const receiverR = Math.min(width, height) * (portrait ? .22 : .25);
      drawReceiver(width * .5, height * .51, receiverR, .35 + signalCoherence * .65, t);

      ctx.save();
      ctx.fillStyle = "rgb(2 3 4 / .78)";
      const opX = portrait ? width * .12 : width * .16;
      const opY = portrait ? height * .81 : height * .78;
      const head = Math.min(width, height) * .035;
      ctx.beginPath();
      ctx.arc(opX, opY - head * 4.1, head, 0, Math.PI * 2);
      ctx.ellipse(opX + head * .2, opY - head, head * 1.8, head * 3.6, -.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (!state.resolved) drawSignalBands(t);
      else {
        const reveal = easeOut(invLerp(state.resolvedAt, state.resolvedAt + 2100, t));
        drawSignalBands(t, 1 - reveal);
        ctx.save();
        ctx.strokeStyle = PALETTE.copper;
        ctx.globalAlpha = .22 + reveal * .46;
        ctx.lineWidth = 1;
        for (let ring = 0; ring < 3; ring += 1) {
          const radius = Math.min(width, height) * (.16 + ring * .13 + reveal * .035);
          ctx.beginPath();
          ctx.arc(width * .5, height * .5, radius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      drawGrain(.65);
    }

    function drawOperator(x, ground, scale, facing = 1) {
      ctx.save();
      ctx.translate(x, ground);
      ctx.scale(facing, 1);
      ctx.fillStyle = PALETTE.black;
      ctx.beginPath();
      ctx.arc(0, -92 * scale, 14 * scale, 0, Math.PI * 2);
      ctx.moveTo(-18 * scale, -76 * scale);
      ctx.quadraticCurveTo(-26 * scale, -31 * scale, -20 * scale, 0);
      ctx.lineTo(25 * scale, 0);
      ctx.quadraticCurveTo(29 * scale, -44 * scale, 16 * scale, -76 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawAnswerEnding(time) {
      const p = easeOut(time / TIMING.ending);
      const horizon = height * .72;
      ctx.fillStyle = PALETTE.storm;
      ctx.fillRect(0, 0, width, height);
      drawClouds(time + 9000, .05, p * .15);

      const portrait = height > width * 1.12;
      const apertureX = portrait ? width * .57 : width * .64;
      const apertureY = portrait ? height * .24 : height * .29;
      const maxR = Math.min(width, height) * (portrait ? .24 : .28);
      const apertureP = smooth(invLerp(4500, reducedMotion ? 4800 : 18800, time));
      if (apertureP > 0) {
        const glow = ctx.createRadialGradient(apertureX, apertureY, 0, apertureX, apertureY, maxR * 1.45);
        glow.addColorStop(0, `rgb(159 215 223 / ${.35 + apertureP * .65})`);
        glow.addColorStop(.55, `rgb(159 215 223 / ${apertureP * .34})`);
        glow.addColorStop(1, "rgb(159 215 223 / 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(apertureX, apertureY, maxR * 1.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = PALETTE.sky;
        ctx.globalAlpha = .15 + apertureP * .82;
        ctx.beginPath();
        ctx.arc(apertureX, apertureY, maxR * (.18 + apertureP * .82), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      const rainReverse = smooth(invLerp(1800, reducedMotion ? 2100 : 8300, time));
      drawRain(time + 9000, { signal: .95, reverse: rainReverse });
      ctx.fillStyle = PALETTE.black;
      pathHeadland(horizon);
      ctx.fill();
      const stationX = portrait ? width * .26 : width * .43;
      const stationW = portrait ? width * .5 : width * .27;
      const stationH = portrait ? height * .105 : height * .15;
      const stationY = horizon - stationH;
      ctx.fillRect(stationX, stationY, stationW, stationH);
      drawAntenna(stationX + stationW * .67, stationY, portrait ? .65 : .8, 1);
      drawOperator(stationX + stationW * .33, stationY + stationH, portrait ? .52 : .64, -1);

      const originX = stationX + stationW * .67;
      const originY = stationY - (portrait ? 150 : 185);
      const beam = smooth(invLerp(1300, reducedMotion ? 1600 : 7200, time));
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.lineWidth = 1.2;
      for (let strand = -1; strand <= 1; strand += 1) {
        ctx.strokeStyle = strand === 0 ? PALETTE.amber : PALETTE.copper;
        ctx.globalAlpha = beam * .87;
        ctx.beginPath();
        const points = 44;
        const visiblePoints = Math.max(1, Math.floor(points * beam));
        for (let i = 0; i <= visiblePoints; i += 1) {
          const f = i / points;
          const braidTime = reducedMotion ? 0 : time * .003;
          const x = lerp(originX, apertureX, f) + Math.sin(f * 12 + braidTime + strand * 2) * 9 * (1 - f) + strand * 4;
          const y = lerp(originY, apertureY, f);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();

      const returnPulse = smooth(invLerp(12600, reducedMotion ? 12900 : 20600, time));
      if (returnPulse > 0) {
        ctx.save();
        ctx.strokeStyle = PALETTE.sky;
        ctx.globalAlpha = (1 - returnPulse) * .75 + .12;
        ctx.lineWidth = 1;
        for (let ring = 0; ring < 3; ring += 1) {
          ctx.beginPath();
          ctx.arc(apertureX, apertureY, maxR * (.3 + returnPulse * (1.2 + ring * .34)), 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      drawGrain(.55);
    }

    function drawSilentEnding(time) {
      const p = easeOut(time / TIMING.ending);
      const portrait = height > width * 1.12;
      const horizon = height * (portrait ? .42 : .48);
      ctx.fillStyle = "#0d171d";
      ctx.fillRect(0, 0, width, horizon);
      drawClouds(time + 11000, 0, .86 * p);
      drawRain(time + 11000, { calm: .78 * p, signal: .2 });
      ctx.fillStyle = PALETTE.earth;
      ctx.fillRect(0, horizon, width, height - horizon);

      ctx.strokeStyle = "rgb(154 169 173 / .08)";
      ctx.lineWidth = 1;
      for (let layer = 0; layer < 7; layer += 1) {
        const y = horizon + (layer + 1) * (height - horizon) / 8;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= width; x += 44) ctx.lineTo(x, y + Math.sin(x * .014 + layer + state.seed) * 5);
        ctx.stroke();
      }

      const stationW = portrait ? width * .56 : width * .28;
      const stationH = portrait ? height * .09 : height * .14;
      const stationX = portrait ? width * .22 : width * .38;
      const stationY = horizon - stationH;
      ctx.fillStyle = PALETTE.black;
      ctx.fillRect(stationX, stationY, stationW, stationH);
      drawAntenna(stationX + stationW * .7, stationY, portrait ? .55 : .72, .12 * (1 - p));
      drawOperator(stationX + stationW * .34, stationY + stationH, portrait ? .46 : .58, -1);

      const receiverX = stationX + stationW * .56;
      const receiverY = stationY + stationH * .58;
      drawReceiver(receiverX, receiverY, Math.min(width, height) * .035, Math.max(0, 1 - p * 1.4), time);

      const bury = smooth(invLerp(1600, reducedMotion ? 1900 : 9200, time));
      ctx.save();
      ctx.lineWidth = 1.25;
      for (let strand = -1; strand <= 1; strand += 1) {
        ctx.strokeStyle = strand === 0 ? PALETTE.amber : PALETTE.copper;
        ctx.globalAlpha = .18 + bury * .64;
        ctx.beginPath();
        const startX = stationX + stationW * .55 + strand * 4;
        const startY = horizon;
        ctx.moveTo(startX, startY);
        for (let i = 1; i <= 34; i += 1) {
          const f = i / 34;
          const x = startX + Math.sin(f * 11 + strand * 2.3) * (18 + f * 24) + strand * f * 54;
          const y = startY + f * (height - startY) * .72 * bury;
          ctx.lineTo(x, y);
          if (i > 15 && i % 8 === 0) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + (strand + .2) * 22, y + 22);
            ctx.moveTo(x, y);
          }
        }
        ctx.stroke();
      }
      ctx.restore();

      const stoneY = horizon + (height - horizon) * .7;
      const stoneGap = Math.min(width, height) * .12;
      for (let index = -1; index <= 1; index += 1) {
        const stoneX = width * .5 + index * stoneGap;
        const glowStart = 9300 + (index + 1) * 800;
        const glowP = smooth(invLerp(glowStart, reducedMotion ? glowStart + 300 : 16000 + (index + 1) * 800, time));
        const glow = ctx.createRadialGradient(stoneX, stoneY, 0, stoneX, stoneY, 42);
        glow.addColorStop(0, `rgb(240 179 95 / ${glowP * .75})`);
        glow.addColorStop(1, "rgb(197 111 61 / 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(stoneX, stoneY, 42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgb(197 111 61 / ${.12 + glowP * .65})`;
        ctx.beginPath();
        ctx.ellipse(stoneX, stoneY, 7 + glowP * 3, 5 + glowP * 2, index * .2, 0, Math.PI * 2);
        ctx.fill();
      }
      drawGrain(.7);
    }

    function render() {
      if (!ctx || !state.environment || width <= 0 || height <= 0) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = PALETTE.soot;
      ctx.fillRect(0, 0, width, height);
      if (state.act === ACT.RECEIVER) drawActReceiver();
      else if (state.act === ACT.MESSAGE || state.act === ACT.CHOICE) drawActMessage();
      else if (state.selectedEnding === "silent") drawSilentEnding(state.actTime);
      else drawAnswerEnding(state.actTime);
    }

    function frame(now) {
      if (!document.hidden && !testing) {
        if (lastNow === null) lastNow = now;
        const delta = clamp(now - lastNow, 0, TIMING.maxFrameDelta);
        lastNow = now;
        if (!state.paused) {
          accumulator += delta;
          let loops = 0;
          while (accumulator >= TIMING.fixedStep && loops < 8) {
            simulateStep(TIMING.fixedStep);
            accumulator -= TIMING.fixedStep;
            loops += 1;
          }
        } else {
          accumulator = 0;
        }
        updateDom();
        render();
      }
      rafId = requestAnimationFrame(frame);
    }

    function pointerValue(event) {
      const rect = canvas.getBoundingClientRect();
      const left = rect.left + rect.width * .09;
      const span = rect.width * .82;
      return clamp((event.clientX - left) / Math.max(1, span), 0, 1);
    }

    fragmentControls.forEach((control, index) => {
      control.addEventListener("focus", event => { if (event.isTrusted) cancelAutoplay(); focusedFragment = index; render(); });
      control.addEventListener("blur", () => { if (activePointer === null) focusedFragment = -1; render(); });
      control.addEventListener("pointerdown", event => {
        if (state.act !== ACT.MESSAGE || state.resolved) return;
        event.preventDefault();
        cancelAutoplay();
        activePointer = { id: event.pointerId, index };
        focusedFragment = index;
        control.setPointerCapture(event.pointerId);
        alignInternal(index, pointerValue(event), "manual");
        updateDom(true);
        render();
      });
      control.addEventListener("pointermove", event => {
        if (!activePointer || activePointer.id !== event.pointerId || activePointer.index !== index) return;
        event.preventDefault();
        alignInternal(index, pointerValue(event), "manual");
        updateDom(true);
        render();
      });
      const finishPointer = event => {
        if (activePointer && activePointer.id === event.pointerId) activePointer = null;
      };
      control.addEventListener("pointerup", finishPointer);
      control.addEventListener("pointercancel", finishPointer);
      control.addEventListener("keydown", event => {
        if (state.act !== ACT.MESSAGE || state.resolved) return;
        const step = event.shiftKey ? .08 : .02;
        let next = null;
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = state.fragments[index].value - step;
        else if (event.key === "ArrowRight" || event.key === "ArrowUp") next = state.fragments[index].value + step;
        else if (event.key === "Home") next = 0;
        else if (event.key === "End") next = 1;
        else if (event.key === "Enter" || event.key === " ") next = state.fragments[index].target;
        if (next === null) return;
        event.preventDefault();
        cancelAutoplay();
        alignInternal(index, next, "manual");
        updateDom(true);
        render();
      });
    });

    choiceEl.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight" && event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      event.preventDefault();
      cancelAutoplay();
      const buttons = [...choiceEl.querySelectorAll("button")];
      const current = buttons.indexOf(document.activeElement);
      buttons[(current + 1 + buttons.length) % buttons.length].focus();
    });
    choiceEl.addEventListener("pointerdown", event => { if (event.isTrusted) cancelAutoplay(); });

    choiceEl.querySelectorAll("button").forEach(button => {
      button.addEventListener("focus", event => { if (event.isTrusted) cancelAutoplay(); });
      button.addEventListener("click", () => {
        if (!state.choiceAvailable) return;
        cancelAutoplay();
        chooseInternal(button.dataset.ending, "manual");
      });
    });

    function manualReplay() {
      cancelAutoplay();
      resetInternal(state.seed);
    }

    document.getElementById("replayTop").addEventListener("click", manualReplay);
    document.getElementById("replayEnd").addEventListener("click", manualReplay);
    pauseTop.addEventListener("click", () => {
      state.paused = !state.paused;
      lastNow = null;
      accumulator = 0;
      updateDom(true);
    });
    alternateEnd.addEventListener("click", () => {
      const next = state.selectedEnding === "silent" ? "answer" : "silent";
      setAutoplayInternal(true, next);
      resetInternal(state.seed);
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target instanceof HTMLButtonElement) return;
      if (state.act === ACT.MESSAGE && !state.resolved && (event.key === " " || event.key === "Enter")) {
        event.preventDefault();
        cancelAutoplay();
        const index = focusedFragment >= 0 ? focusedFragment : state.fragments.findIndex(fragment => !fragment.aligned);
        const safeIndex = index < 0 ? 0 : index;
        alignInternal(safeIndex, state.fragments[safeIndex].target, "manual");
        focusedFragment = (safeIndex + 1) % 3;
        fragmentControls[focusedFragment].focus({ preventScroll: true });
        updateDom(true);
        render();
      } else if (state.act === ACT.CHOICE && state.choiceAvailable && (event.key === " " || event.key === "Enter")) {
        event.preventDefault();
        cancelAutoplay();
        choiceEl.querySelector("button").focus({ preventScroll: true });
      }
    });

    function numbersAreFinite(value) {
      if (typeof value === "number") return finite(value);
      if (Array.isArray(value)) return value.every(numbersAreFinite);
      if (value && typeof value === "object") return Object.values(value).every(numbersAreFinite);
      return true;
    }

    function runSelfTest() {
      const tests = [];
      const add = (name, passed, detail = "") => tests.push({ name, passed: Boolean(passed), ...(detail ? { detail } : {}) });
      testing = true;
      try {
        add("automatic startup configuration", Boolean(startupObserved) && startupObserved.seed === 217 && startupObserved.autoplay.enabled === true && startupObserved.autoplay.ending === "answer" && startupObserved.act === ACT.RECEIVER && startupObserved.actTime === 0, "default seed 217, autoplay answer");

        setAutoplayInternal(false, "answer");
        resetInternal(991);
        const first = snapshot();
        const firstSignature = state.environment.signature;
        advanceVirtual(4380);
        resetInternal(991);
        const second = snapshot();
        add("deterministic reset", JSON.stringify(first) === JSON.stringify(second) && firstSignature === state.environment.signature);

        setAutoplayInternal(false, "answer");
        resetInternal(217);
        seekInternal(TIMING.receiver, false);
        const boundarySeek = state.act === ACT.MESSAGE && state.actTime === 0;

        const earlyChoice = chooseInternal("answer", "self-test");
        alignInternal(0, .5, "self-test");
        alignInternal(1, .5, "self-test");
        advanceVirtual(TIMING.alignHold + 300);
        const twoBlocked = !state.resolved && !state.choiceAvailable;
        alignInternal(2, .5, "self-test");
        advanceVirtual(TIMING.alignHold + 40);
        const resolvedWithThree = state.resolved && !state.choiceAvailable;
        seekInternal(0, false);
        const coherentRewind = state.act === ACT.MESSAGE && state.actTime === 0 && !state.resolved && !state.choiceAvailable && state.fragments.every((fragment, index) => fragment.value === state.fragmentInitials[index]);
        [0, 1, 2].forEach(index => alignInternal(index, .5, "self-test"));
        seekInternal(1000, false);
        const forwardSeekResolves = state.resolved && state.resolvedAt === TIMING.alignHold;
        seekInternal(0, false);
        [0, 1, 2].forEach(index => alignInternal(index, .5, "self-test"));
        advanceVirtual(400);
        seekInternal(100, false);
        const partialHoldReset = state.alignmentHold === 0 && !state.resolved;
        advanceVirtual(500);
        const rewindDoesNotResolveEarly = !state.resolved;
        advanceVirtual(400);
        advanceVirtual(TIMING.revealToChoice + 40);
        add("fragment gating and coherent seek", boundarySeek && earlyChoice === false && twoBlocked && resolvedWithThree && coherentRewind && forwardSeekResolves && partialHoldReset && rewindDoesNotResolveEarly && state.act === ACT.CHOICE && state.choiceAvailable);

        const reachEnding = ending => {
          setAutoplayInternal(false, ending);
          resetInternal(217);
          advanceVirtual(TIMING.receiver + 40);
          [0, 1, 2].forEach(index => alignInternal(index, .5, "self-test"));
          advanceVirtual(TIMING.alignHold + TIMING.revealToChoice + 80);
          const chosen = chooseInternal(ending, "self-test");
          advanceVirtual(TIMING.ending + 40);
          return chosen && state.completed && state.selectedEnding === ending;
        };
        const answerReachable = reachEnding("answer");
        const silentReachable = reachEnding("silent");
        add("both endings reachable", answerReachable && silentReachable);

        resetInternal(217);
        add("replay reset", state.act === ACT.RECEIVER && state.actTime === 0 && state.selectedEnding === null && !state.completed && !state.choiceAvailable);

        setAutoplayInternal(true, "answer");
        resetInternal(217);
        advanceVirtual(95000);
        const autoAligned = state.autoplayTouches.every(Boolean);
        const autoChose = state.actionLog.some(action => action.type === "choose" && action.ending === "answer" && action.source === "autoplay");
        const orderedTrace = state.transitions.map(item => item.act).join(",");
        add("ordered act progression", orderedTrace === "receiver,message,choice,ending:answer,complete:answer");
        add("autoplay traverses real systems", state.completed && state.selectedEnding === "answer" && autoAligned && autoChose);

        const safeSnapshot = snapshot();
        let serializable = true;
        try { JSON.stringify(safeSnapshot); } catch (error) { serializable = false; }
        add("finite numeric state", serializable && numbersAreFinite({ snapshot: safeSnapshot, environment: state.environment }));
      } catch (error) {
        add("self-test exception", false, String(error && error.message ? error.message : error));
      } finally {
        setAutoplayInternal(true, "answer");
        resetInternal(DEFAULT_SEED);
        lastNow = performance.now();
        testing = false;
        updateDom(true);
        render();
      }
      return { passed: tests.every(test => test.passed), tests };
    }

    window.__LAST_SIGNAL__ = Object.freeze({
      reset(seed) { return resetInternal(seed); },
      setAutoplay(enabled, ending) { return setAutoplayInternal(enabled, ending); },
      seek(milliseconds) {
        const result = seekInternal(milliseconds, true);
        updateDom(true);
        render();
        return result;
      },
      alignFragment(index, value) {
        const accepted = alignInternal(index, value, "api");
        if (accepted) cancelAutoplay();
        updateDom(true);
        render();
        return accepted;
      },
      choose(ending) {
        const accepted = chooseInternal(ending, "api");
        if (accepted) {
          cancelAutoplay();
          updateDom(true);
          render();
        }
        return accepted;
      },
      snapshot,
      runSelfTest
    });

    document.addEventListener("visibilitychange", () => {
      lastNow = document.hidden ? null : performance.now();
      accumulator = 0;
    });
    window.addEventListener("resize", resize, { passive: true });
    reducedQuery.addEventListener?.("change", event => { reducedMotion = event.matches; render(); });

    resize();
    setAutoplayInternal(true, "answer");
    resetInternal(DEFAULT_SEED);
    startupObserved = snapshot();
    rafId = requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
