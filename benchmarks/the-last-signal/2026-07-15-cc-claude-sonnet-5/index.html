<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonnet 5</title>
<style>
  :root{
    --ink:#05060a;
    --amber:#ffb454;
    --amber-soft:#ffd9a0;
    --warm-white:#fff4e2;
    --cool:#9fb4dd;
    --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; width:100%; background:var(--ink); color:var(--warm-white);
    overflow:hidden; font-family:var(--font-serif);
    -webkit-tap-highlight-color: transparent;
  }
  #scene{position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none;}
  #overlay{position:fixed; inset:0; pointer-events:none;}

  .title-card{
    position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
    font-family:var(--font-mono); letter-spacing:0.4em; font-size:clamp(13px,3vw,20px);
    color:var(--warm-white); opacity:0; text-transform:uppercase; text-align:center;
    text-shadow:0 0 20px rgba(255,180,84,0.55);
    transition:opacity 1.2s ease;
  }
  .title-card.visible{opacity:0.9;}

  .hud{
    position:absolute; top:14px; left:16px; font-family:var(--font-mono);
    font-size:10px; letter-spacing:0.14em; color:rgba(230,230,240,0.32); pointer-events:none;
    line-height:1.6;
  }
  .hud .auto-tag{color:rgba(255,180,84,0.6);}

  .progress{
    position:absolute; top:16px; right:16px; display:flex; gap:6px; pointer-events:none;
  }
  .progress i{
    display:block; width:20px; height:3px; background:rgba(255,255,255,0.14); border-radius:2px;
    transition:background 0.6s ease, box-shadow 0.6s ease; font-style:normal;
  }
  .progress i.filled{ background:var(--amber); box-shadow:0 0 8px rgba(255,180,84,0.65); }

  .clock{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.2em; color:rgba(255,224,180,0.5);
  }

  .captions{
    position:absolute; left:50%; bottom:17%; transform:translate(-50%,4px);
    max-width:min(88vw,640px); text-align:center;
    font-family:var(--font-serif); font-style:italic; font-size:clamp(16px,2.6vw,26px);
    color:var(--warm-white); opacity:0; letter-spacing:0.01em;
    text-shadow:0 2px 22px rgba(0,0,0,0.7);
    transition:opacity 1s ease, transform 1s ease;
    pointer-events:none;
  }
  .captions.visible{opacity:1; transform:translate(-50%,-4px);}

  .message-line{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:var(--font-mono); font-size:clamp(16px,3.2vw,32px); letter-spacing:0.16em;
    color:var(--amber-soft); text-shadow:0 0 28px rgba(255,180,84,0.6);
    opacity:0; transition:opacity 0.7s ease; pointer-events:none; text-align:center;
    max-width:92vw;
  }
  .message-line.visible{opacity:1;}

  .fragment-controls{
    position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    display:flex; gap:20px; pointer-events:auto; opacity:0; transition:opacity 0.8s ease;
  }
  .fragment-controls.visible{opacity:1;}
  .fragment-controls[hidden]{display:none;}
  .fragment-controls label{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  .fragment-controls span{ font-family:var(--font-mono); font-size:9px; letter-spacing:0.2em; color:rgba(255,224,180,0.5);}
  .frag-slider{
    -webkit-appearance:none; appearance:none; width:110px; height:26px; background:transparent; cursor:pointer;
  }
  .frag-slider::-webkit-slider-runnable-track{height:2px; background:rgba(255,255,255,0.22); border-radius:2px;}
  .frag-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; margin-top:-5.5px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px rgba(255,180,84,0.85); border:none;
  }
  .frag-slider::-moz-range-track{height:2px; background:rgba(255,255,255,0.22); border-radius:2px;}
  .frag-slider::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--amber); border:none; box-shadow:0 0 10px rgba(255,180,84,0.85);}
  .frag-slider:disabled::-webkit-slider-thumb{background:rgba(255,224,180,0.35); box-shadow:none;}
  .frag-slider:disabled::-moz-range-thumb{background:rgba(255,224,180,0.35); box-shadow:none;}
  .frag-slider:focus-visible{outline:none;}
  .frag-slider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--warm-white); outline-offset:2px;}

  .choice-controls{
    position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
    display:flex; gap:26px; pointer-events:auto; opacity:0; transition:opacity 0.9s ease;
  }
  .choice-controls.visible{opacity:1;}
  .choice-controls[hidden]{display:none;}
  .choice-btn{
    font-family:var(--font-mono); font-size:13px; letter-spacing:0.24em; text-transform:uppercase;
    color:var(--warm-white); background:rgba(10,14,22,0.4); border:1px solid rgba(255,224,180,0.4);
    padding:14px 26px; border-radius:2px; cursor:pointer;
    transition:background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
  }
  .choice-btn:hover{border-color:var(--amber); background:rgba(255,180,84,0.12);}
  .choice-btn:active{transform:scale(0.96);}
  .choice-btn:focus-visible{outline:2px solid var(--amber); outline-offset:3px;}
  #btnSilent{border-color:rgba(159,180,221,0.4);}
  #btnSilent:hover{border-color:var(--cool); background:rgba(159,180,221,0.1);}

  .end-controls{
    position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
    display:flex; gap:20px; pointer-events:auto; opacity:0; transition:opacity 1.2s ease;
  }
  .end-controls.visible{opacity:1;}
  .end-controls[hidden]{display:none;}
  .ghost-btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:rgba(255,244,226,0.72); background:transparent; border:1px solid rgba(255,244,226,0.3);
    padding:11px 18px; border-radius:2px; cursor:pointer; transition:all 0.3s ease;
  }
  .ghost-btn:hover{ color:var(--warm-white); border-color:var(--warm-white); }
  .ghost-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  @media (max-width:640px){
    .fragment-controls{ gap:8px; bottom:6%; }
    .frag-slider{ width:74px; }
    .choice-controls{ gap:14px; flex-direction:column; align-items:center; bottom:11%; }
    .choice-btn{ padding:12px 22px; font-size:12px; }
    .end-controls{ flex-direction:column; align-items:center; bottom:6%; gap:10px;}
    .captions{ bottom:24%; font-size:clamp(14px,4.4vw,20px); }
    .hud{ font-size:9px; }
  }

  @media (prefers-reduced-motion: reduce){
    .captions, .title-card, .choice-controls, .end-controls, .message-line, .fragment-controls{ transition-duration:0.35s; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="overlay">
  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="clock" id="clock" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="title-card" id="titleCard">Sonnet 5</div>
  <div class="captions" id="captions" aria-live="polite" aria-atomic="true"></div>
  <div class="message-line" id="messageLine" aria-live="polite" aria-atomic="true"></div>

  <div class="fragment-controls" id="fragmentControls" hidden>
    <label><input class="frag-slider" type="range" id="frag0" min="0" max="1000" value="0" aria-label="Signal fragment I alignment"><span>FRAGMENT&nbsp;I</span></label>
    <label><input class="frag-slider" type="range" id="frag1" min="0" max="1000" value="0" aria-label="Signal fragment II alignment"><span>FRAGMENT&nbsp;II</span></label>
    <label><input class="frag-slider" type="range" id="frag2" min="0" max="1000" value="0" aria-label="Signal fragment III alignment"><span>FRAGMENT&nbsp;III</span></label>
  </div>

  <div class="choice-controls" id="choiceControls" hidden>
    <button class="choice-btn" id="btnAnswer" type="button">Answer</button>
    <button class="choice-btn" id="btnSilent" type="button">Stay Silent</button>
  </div>

  <div class="end-controls" id="endControls" hidden>
    <button class="ghost-btn" id="btnReplay" type="button">Replay from the beginning</button>
    <button class="ghost-btn" id="btnOther" type="button">Explore the other ending</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- *
   *  Deterministic RNG
   * ---------------------------------------------------------------- */
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function lerp(a,b,t){ return a + (b-a) * t; }
  function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function clamp(x,lo,hi){ return x < lo ? lo : (x > hi ? hi : x); }
  function easeInOut(t){ t = clamp01(t); return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
  function easeOutCubic(t){ t = clamp01(t); return 1 - Math.pow(1-t,3); }
  function circDist(a,b){ let d = Math.abs(a-b) % 1; return d > 0.5 ? 1-d : d; }
  function wrap01(v){ v = v % 1; if(v < 0) v += 1; return v; }
  function isFiniteDeep(v){
    if(v === null) return true;
    if(typeof v === 'number') return Number.isFinite(v);
    if(typeof v === 'boolean' || typeof v === 'string') return true;
    if(Array.isArray(v)) return v.every(isFiniteDeep);
    if(typeof v === 'object') return Object.values(v).every(isFiniteDeep);
    return true;
  }

  /* ---------------------------------------------------------------- *
   *  Constants / timeline
   * ---------------------------------------------------------------- */
  const REQUIRED_LINE = "At 02:17, the dead receiver began to glow.";
  const REQUIRED_MESSAGE = "WE REMEMBER YOUR SKY.";
  const DEFAULT_SEED = 217;
  const TOLERANCE = 0.035;

  const ACT1_DURATION = 21000;
  const TITLE_FADE_OUT_AT = 3200;
  const CLOCK_START_AT = 9000;
  const LINE_SHOW_AT = 13500;
  const LINE_HOLD = 3600;

  const ACT2_START_DELAY = 800;
  const ACT2_SEG_DUR = 2400;
  const ACT2_SEG_GAP = 800;
  const MESSAGE_REVEAL_DURATION = 1900;
  const MESSAGE_HOLD = 3200;
  const ACT2_POST_ALIGN_TOTAL = MESSAGE_REVEAL_DURATION + MESSAGE_HOLD;

  const ACT3_AUTOPLAY_WAIT = 2400;
  const ENDING_DURATION = 24000;

  const ACT_ORDER = ['act1','act2','act3','endingAnswer','endingSilent'];
  function actIndex(act){
    if(act === 'act1') return 0;
    if(act === 'act2') return 1;
    if(act === 'act3') return 2;
    return 3; // endings share the 4th tick
  }

  /* ---------------------------------------------------------------- *
   *  State
   * ---------------------------------------------------------------- */
  const STATE = {
    seed: DEFAULT_SEED,
    rng: mulberry32(DEFAULT_SEED),
    totalTime: 0,
    act: 'act1',
    actTime: 0,
    fragments: [0,0,0],
    fragmentTargets: [0,0,0],
    fragmentAutoplayStart: [0,0,0],
    aligned: false,
    fragmentsLocked: false,
    messageRevealStart: null,
    ending: null,
    completed: false,
    autoplay: { enabled:false, ending:'answer' },
    clouds: [], rainStreaks: [], lightningTimes: [], lightningSeeds: [],
    stars: [], embers: [], silhouetteSeed: 0.5, stationSway: 0.5,
    lastCaptionText: null,
    lastMessageText: null
  };

  const MOTION = { reduced: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches };
  if(MOTION.reduced) document.body.classList.add('reduced-motion');

  /* ---------------------------------------------------------------- *
   *  Canvas setup
   * ---------------------------------------------------------------- */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let VW = window.innerWidth, VH = window.innerHeight;

  function resize(){
    VW = window.innerWidth; VH = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(VW * dpr);
    canvas.height = Math.round(VH * dpr);
    canvas.style.width = VW + 'px';
    canvas.style.height = VH + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------------------------------------------------------------- *
   *  DOM refs
   * ---------------------------------------------------------------- */
  const el = {
    hud: document.getElementById('hud'),
    clock: document.getElementById('clock'),
    progress: document.getElementById('progress'),
    titleCard: document.getElementById('titleCard'),
    captions: document.getElementById('captions'),
    messageLine: document.getElementById('messageLine'),
    fragmentControls: document.getElementById('fragmentControls'),
    choiceControls: document.getElementById('choiceControls'),
    endControls: document.getElementById('endControls'),
    btnAnswer: document.getElementById('btnAnswer'),
    btnSilent: document.getElementById('btnSilent'),
    btnReplay: document.getElementById('btnReplay'),
    btnOther: document.getElementById('btnOther'),
    fragInputs: [document.getElementById('frag0'), document.getElementById('frag1'), document.getElementById('frag2')]
  };
  const progressTicks = el.progress.querySelectorAll('i');

  /* ---------------------------------------------------------------- *
   *  Derived seeded tables
   * ---------------------------------------------------------------- */
  function generateDerivedTables(rng){
    STATE.clouds = Array.from({length:6}, function(){
      return { x: rng(), y: 0.04+rng()*0.24, r: 0.12+rng()*0.20, speed: 0.006+rng()*0.010, drift: rng()<0.5?-1:1, alpha: 0.10+rng()*0.13 };
    });
    STATE.rainStreaks = Array.from({length:110}, function(){
      return { x: rng(), len: 0.028+rng()*0.05, speed: 0.55+rng()*0.55, phase: rng(), slant: 0.06+rng()*0.05, alpha: 0.10+rng()*0.22 };
    });
    STATE.lightningTimes = [2400+rng()*900, 7200+rng()*1000, 15800+rng()*700].map(function(v){ return Math.round(v); });
    STATE.lightningSeeds = STATE.lightningTimes.map(function(){ return rng(); });

    const targets = [];
    let guard = 0;
    while(targets.length < 3 && guard < 500){
      guard++;
      const cand = rng();
      if(targets.every(function(t){ return circDist(t,cand) > 0.14; })) targets.push(cand);
    }
    while(targets.length < 3) targets.push(rng());
    STATE.fragmentTargets = targets;

    STATE.fragments = targets.map(function(t){
      let v, g = 0;
      do { v = rng(); g++; } while(circDist(v,t) < 0.28 && g < 100);
      return v;
    });
    STATE.fragmentAutoplayStart = STATE.fragments.slice();

    STATE.stars = Array.from({length:70}, function(){
      return { x: rng(), y: rng()*0.62, r: 0.5+rng()*1.3, tw: rng() };
    });
    STATE.embers = Array.from({length:22}, function(){
      return { x: rng(), y: rng(), speed: 0.02+rng()*0.03, seed: rng() };
    });
    STATE.silhouetteSeed = rng();
    STATE.stationSway = rng();
  }

  /* ---------------------------------------------------------------- *
   *  Reset / act transitions
   * ---------------------------------------------------------------- */
  function performReset(seed){
    STATE.seed = (seed >>> 0);
    const rng = mulberry32(STATE.seed);
    STATE.rng = rng;
    STATE.totalTime = 0;
    STATE.act = 'act1';
    STATE.actTime = 0;
    STATE.aligned = false;
    STATE.fragmentsLocked = false;
    STATE.ending = null;
    STATE.completed = false;
    STATE.messageRevealStart = null;
    STATE.lastCaptionText = null;
    STATE.lastMessageText = null;
    generateDerivedTables(rng);
    syncFragmentInputsFromState();
    updateOverlayVisibilityForAct();
    updateProgressUI();
    setCaption('');
    setMessage('');
  }

  function syncFragmentInputsFromState(){
    for(let i=0;i<3;i++){
      if(el.fragInputs[i]) el.fragInputs[i].value = String(Math.round(STATE.fragments[i]*1000));
    }
  }

  function goToAct(name){
    STATE.act = name;
    STATE.actTime = 0;
    if(name === 'act2'){
      STATE.fragmentAutoplayStart = STATE.fragments.slice();
    } else {
      setMessage('');
    }
    setCaption('', true);
    updateOverlayVisibilityForAct();
    updateProgressUI();
  }

  function updateOverlayVisibilityForAct(){
    const showFrag = STATE.act === 'act2';
    el.fragmentControls.hidden = !showFrag;
    el.fragmentControls.classList.toggle('visible', showFrag);
    for(let i=0;i<3;i++){ el.fragInputs[i].disabled = STATE.fragmentsLocked; }

    const showChoice = STATE.act === 'act3' && !STATE.ending;
    el.choiceControls.hidden = !showChoice;
    el.choiceControls.classList.toggle('visible', showChoice);
    if(showChoice){
      try{ el.btnAnswer.focus({preventScroll:true}); }catch(e){}
    }

    const showEnd = STATE.completed;
    el.endControls.hidden = !showEnd;
    el.endControls.classList.toggle('visible', showEnd);
  }

  function updateProgressUI(){
    const idx = actIndex(STATE.act);
    progressTicks.forEach(function(tick, i){ tick.classList.toggle('filled', i <= idx); });
  }

  function setCaption(text, forceClear){
    if(text){
      if(STATE.lastCaptionText !== text){
        el.captions.textContent = text;
        STATE.lastCaptionText = text;
      }
      el.captions.classList.add('visible');
    } else {
      el.captions.classList.remove('visible');
      if(forceClear){ STATE.lastCaptionText = null; }
    }
  }

  function setMessage(text){
    if(text){
      if(STATE.lastMessageText !== text){
        el.messageLine.textContent = text;
        STATE.lastMessageText = text;
      }
      el.messageLine.classList.add('visible');
    } else {
      el.messageLine.classList.remove('visible');
      STATE.lastMessageText = null;
    }
  }

  /* ---------------------------------------------------------------- *
   *  Fragment / choice mechanics
   * ---------------------------------------------------------------- */
  function applyFragmentValue(i, v){
    v = wrap01(v);
    STATE.fragments[i] = v;
    if(el.fragInputs[i]) el.fragInputs[i].value = String(Math.round(v*1000));
  }

  function allFragmentsAligned(){
    return STATE.fragments.every(function(v,i){ return circDist(v, STATE.fragmentTargets[i]) <= TOLERANCE; });
  }

  function _internalAlign(i, v){
    if(STATE.act !== 'act2' || STATE.fragmentsLocked) return;
    if(typeof i !== 'number' || i < 0 || i > 2 || !Number.isFinite(v)) return;
    applyFragmentValue(i, v);
  }

  function _internalChoose(ending){
    if(STATE.act !== 'act3' || STATE.ending) return;
    STATE.ending = ending;
    goToAct(ending === 'answer' ? 'endingAnswer' : 'endingSilent');
  }

  function jumpToOtherEnding(){
    STATE.ending = null;
    STATE.completed = false;
    goToAct('act3');
  }

  /* ---------------------------------------------------------------- *
   *  Autoplay engine
   * ---------------------------------------------------------------- */
  function runAutoplayStep(){
    if(STATE.act === 'act2'){
      const t = STATE.actTime;
      for(let i=0;i<3;i++){
        const segStart = ACT2_START_DELAY + i*(ACT2_SEG_DUR+ACT2_SEG_GAP);
        if(t >= segStart){
          const p = clamp01((t - segStart) / ACT2_SEG_DUR);
          const eased = easeInOut(p);
          const start = STATE.fragmentAutoplayStart[i];
          const target = STATE.fragmentTargets[i];
          let delta = target - start;
          delta = delta - Math.round(delta);
          const val = wrap01(start + delta * eased);
          _internalAlign(i, val);
        }
      }
    } else if(STATE.act === 'act3'){
      if(STATE.actTime >= ACT3_AUTOPLAY_WAIT && !STATE.ending){
        _internalChoose(STATE.autoplay.ending);
      }
    }
  }

  /* ---------------------------------------------------------------- *
   *  Core state update (drives both real-time rAF loop and self-test fast-forward)
   * ---------------------------------------------------------------- */
  function updateState(dt){
    STATE.totalTime += dt;
    STATE.actTime += dt;

    if(STATE.autoplay.enabled) runAutoplayStep();

    if(STATE.act === 'act1'){
      if(STATE.actTime >= ACT1_DURATION) goToAct('act2');
    } else if(STATE.act === 'act2'){
      if(!STATE.fragmentsLocked && allFragmentsAligned()){
        STATE.fragmentsLocked = true;
        STATE.aligned = true;
        STATE.messageRevealStart = STATE.actTime;
        for(let i=0;i<3;i++) el.fragInputs[i].disabled = true;
      }
      if(STATE.aligned && STATE.messageRevealStart !== null){
        if(STATE.actTime - STATE.messageRevealStart >= ACT2_POST_ALIGN_TOTAL){
          goToAct('act3');
        }
      }
    } else if(STATE.act === 'act3'){
      // waits for choose()
    } else if(STATE.act === 'endingAnswer' || STATE.act === 'endingSilent'){
      if(!STATE.completed && STATE.actTime >= ENDING_DURATION){
        STATE.completed = true;
        updateOverlayVisibilityForAct();
      }
    }
  }

  function fastForward(ms, step){
    step = step || 16;
    let remaining = ms;
    while(remaining > 0){
      const d = Math.min(step, remaining);
      updateState(d);
      remaining -= d;
    }
  }

  /* ---------------------------------------------------------------- *
   *  Narrative text driven purely by actTime (safe for seek())
   * ---------------------------------------------------------------- */
  function clockDisplay(actTime){
    const startSec = 107; // 01:47
    const endSec = 137;   // 02:17
    let sec;
    if(actTime < CLOCK_START_AT) sec = startSec;
    else if(actTime >= LINE_SHOW_AT) sec = endSec;
    else sec = Math.round(lerp(startSec, endSec, (actTime-CLOCK_START_AT)/(LINE_SHOW_AT-CLOCK_START_AT)));
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function updateAct1Captions(actTime){
    if(actTime < LINE_SHOW_AT || actTime > LINE_SHOW_AT + LINE_HOLD + 1200){
      setCaption('');
    } else {
      setCaption(REQUIRED_LINE);
    }
  }

  function updateAct2Message(actTime){
    if(!STATE.aligned || STATE.messageRevealStart === null){
      setMessage('');
      return;
    }
    const rt = actTime - STATE.messageRevealStart;
    if(rt < 0){ setMessage(''); return; }
    const n = Math.floor(clamp01(rt / MESSAGE_REVEAL_DURATION) * REQUIRED_MESSAGE.length);
    if(rt < MESSAGE_REVEAL_DURATION){
      setMessage(REQUIRED_MESSAGE.slice(0, Math.max(1,n)));
    } else {
      setMessage(REQUIRED_MESSAGE);
    }
  }

  function updateAct3Captions(actTime){
    if(actTime < 200 || actTime > 5200) setCaption('');
    else setCaption('Choose.');
  }

  function updateEndingCaptions(actTime, isAnswer){
    const text = isAnswer ? 'The storm carries an answer.' : 'The storm keeps the silence.';
    if(actTime < 15000 || actTime > 21500) setCaption('');
    else setCaption(text);
  }

  /* ---------------------------------------------------------------- *
   *  Rendering helpers
   * ---------------------------------------------------------------- */
  function skyGradientFor(){
    let top = '#050710', bottom = '#141c2e';
    if(STATE.act === 'endingAnswer'){
      const p = clamp01(STATE.actTime / ENDING_DURATION);
      top = lerpColor('#050710', '#2c3a55', clamp01((p-0.3)/0.5));
      bottom = lerpColor('#141c2e', '#f2a65a', clamp01((p-0.35)/0.55));
    } else if(STATE.act === 'endingSilent'){
      const p = clamp01(STATE.actTime / ENDING_DURATION);
      top = lerpColor('#050710', '#020207', clamp01(p));
      bottom = lerpColor('#141c2e', '#0a0c12', clamp01(p));
    }
    return {top, bottom};
  }

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  function lerpColor(a,b,t){
    t = clamp01(t);
    const ca = hexToRgb(a), cb = hexToRgb(b);
    const r = Math.round(lerp(ca[0],cb[0],t)), g = Math.round(lerp(ca[1],cb[1],t)), bl = Math.round(lerp(ca[2],cb[2],t));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function drawSky(){
    const {top,bottom} = skyGradientFor();
    const g = ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,VW,VH);
  }

  function drawClouds(alphaScale){
    alphaScale = alphaScale === undefined ? 1 : alphaScale;
    STATE.clouds.forEach(function(c){
      const drift = (STATE.totalTime * c.speed * c.drift * 0.001) % 1.4;
      const x = wrap01(c.x + drift) * VW * 1.3 - VW*0.15;
      const y = c.y * VH;
      const r = c.r * Math.max(VW,VH);
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, 'rgba(180,190,210,' + (c.alpha*alphaScale) + ')');
      g.addColorStop(1, 'rgba(180,190,210,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
  }

  function rainIntensity(){
    if(STATE.act === 'act1') return MOTION.reduced ? 0.28 : 0.5;
    if(STATE.act === 'act2' || STATE.act === 'act3') return MOTION.reduced ? 0.18 : 0.32;
    if(STATE.act === 'endingAnswer'){
      const p = clamp01(STATE.actTime/ENDING_DURATION);
      return lerp(0.32, 0, clamp01((p-0.25)/0.55));
    }
    if(STATE.act === 'endingSilent'){
      const p = clamp01(STATE.actTime/ENDING_DURATION);
      return lerp(0.32, 0.5, p) * (MOTION.reduced?0.6:1);
    }
    return 0.3;
  }

  function drawRain(){
    const intensity = rainIntensity();
    if(intensity <= 0.001) return;
    ctx.strokeStyle = 'rgba(190,205,230,1)';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    const speedScale = MOTION.reduced ? 0.35 : 1;
    STATE.rainStreaks.forEach(function(s){
      const travel = (STATE.totalTime * s.speed * speedScale * 0.06);
      const y = ((s.phase*VH) + travel) % (VH+60) - 30;
      const x = s.x * VW;
      const len = s.len * VH;
      ctx.globalAlpha = s.alpha * intensity;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + s.slant*30, y + len);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  function lightningEnvelope(times, seeds, actTime){
    let alpha = 0, boltSeed = 0;
    times.forEach(function(tm, i){
      const d = Math.abs(actTime - tm);
      if(d < 260){
        const env = 1 - d/260;
        const flick = (Math.sin(d*0.9)*0.5+0.5);
        const a = Math.pow(env,1.4) * (0.55 + flick*0.25);
        if(a > alpha){ alpha = a; boltSeed = seeds[i]; }
      }
    });
    return {alpha: clamp01(alpha), boltSeed};
  }

  function drawLightning(alpha, boltSeed){
    if(alpha <= 0.001) return;
    ctx.fillStyle = 'rgba(220,228,245,' + (alpha*0.35) + ')';
    ctx.fillRect(0,0,VW,VH);
    ctx.save();
    ctx.strokeStyle = 'rgba(235,240,255,' + Math.min(1,alpha*1.3) + ')';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(200,215,255,0.9)';
    ctx.shadowBlur = 18;
    const startX = VW * (0.15 + boltSeed*0.7);
    ctx.beginPath();
    ctx.moveTo(startX, 0);
    let x = startX, y = 0;
    const segs = 7;
    for(let i=1;i<=segs;i++){
      y = VH * 0.62 * (i/segs);
      x += (Math.sin((boltSeed*40)+i*2.3) * VW * 0.05);
      ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function silhouetteBob(seed){
    return Math.sin(STATE.totalTime*0.0006 + seed*10) * (MOTION.reduced?0.3:1);
  }

  function drawOperator(cx, baseY, scale, pose){
    const bob = silhouetteBob(STATE.silhouetteSeed) * 3 * scale;
    ctx.save();
    ctx.translate(cx, baseY + bob);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(4,5,9,0.92)';
    ctx.beginPath();
    if(pose === 'slumped'){
      ctx.ellipse(0,-18,15,20,0.25,0,Math.PI*2);
      ctx.ellipse(4,-42,10,11,0.2,0,Math.PI*2);
    } else if(pose === 'standing'){
      ctx.ellipse(0,-46,13,34,0,0,Math.PI*2);
      ctx.ellipse(0,-84,11,12,0,0,Math.PI*2);
    } else if(pose === 'reaching'){
      ctx.ellipse(0,-30,14,26,0,0,Math.PI*2);
      ctx.ellipse(2,-58,11,11,0.1,0,Math.PI*2);
      ctx.moveTo(10,-40);
      ctx.quadraticCurveTo(34,-46,42,-30);
      ctx.quadraticCurveTo(34,-40,10,-30);
    } else {
      ctx.ellipse(0,-24,16,28,0,0,Math.PI*2);
      ctx.ellipse(2,-54,11,12,0.05,0,Math.PI*2);
    }
    ctx.fill();
    ctx.restore();
  }

  function drawStation(cx, groundY, scale){
    ctx.save();
    ctx.translate(cx, groundY);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(4,5,9,0.94)';
    ctx.beginPath();
    ctx.moveTo(-30,0); ctx.lineTo(-24,-46); ctx.lineTo(24,-46); ctx.lineTo(30,0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(4,5,9,0.94)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,-46); ctx.lineTo(0,-96); ctx.stroke();
    ctx.restore();
  }

  // The recurring ring motif — shared by receiver (act1), fragments (act2/3), and endings.
  function drawRing(cx, cy, r, value, arcSpan, strokeWidth, colorRgb, glowAlpha, targetValue, showTarget){
    const startAngle = value * Math.PI * 2 - arcSpan/2;
    const endAngle = startAngle + arcSpan;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(140,150,175,0.16)';
    ctx.lineWidth = strokeWidth * 0.5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

    if(showTarget && targetValue !== undefined){
      const ta = targetValue * Math.PI * 2;
      ctx.strokeStyle = 'rgba(255,200,140,0.4)';
      ctx.lineWidth = strokeWidth*0.35;
      ctx.beginPath();
      ctx.arc(cx,cy,r, ta-0.05, ta+0.05);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(' + colorRgb + ',1)';
    ctx.lineWidth = strokeWidth;
    if(glowAlpha > 0){
      ctx.shadowColor = 'rgba(' + colorRgb + ',' + glowAlpha + ')';
      ctx.shadowBlur = strokeWidth * 3;
    }
    ctx.beginPath();
    ctx.arc(cx,cy,r,startAngle,endAngle);
    ctx.stroke();
    ctx.restore();
  }

  function fragmentColor(i, closeness){
    const cold = [130,150,190];
    const warm = [255,180,84];
    const r = Math.round(lerp(cold[0],warm[0],closeness));
    const g = Math.round(lerp(cold[1],warm[1],closeness));
    const b = Math.round(lerp(cold[2],warm[2],closeness));
    return r+','+g+','+b;
  }

  function ringCenter(){
    return { cx: VW*0.5, cy: VH*0.44 };
  }

  /* ---------------------------------------------------------------- *
   *  Act renderers
   * ---------------------------------------------------------------- */
  function drawAct1(){
    const t = STATE.actTime;
    drawSky();
    drawClouds(1);
    const {cx,cy} = ringCenter();
    const stationScale = Math.min(VW,VH) * 0.55;
    drawStation(cx, VH*0.72, stationScale/220);
    drawOperator(cx - stationScale*0.32, VH*0.72, stationScale/260, 'seated');

    const glowStart = LINE_SHOW_AT;
    const glowP = clamp01((t - glowStart) / 3000);
    const ringVal = wrap01(t*0.00006);
    const closeness = glowP;
    const color = fragmentColor(0, closeness);
    const radius = Math.min(VW,VH) * (0.045 + glowP*0.02);
    drawRing(cx, VH*0.58, radius, ringVal, Math.PI*1.7, 4 + glowP*3, color, 0.3+glowP*0.7);

    const {alpha, boltSeed} = lightningEnvelope(STATE.lightningTimes, STATE.lightningSeeds, t);
    drawRain();
    drawLightning(alpha, boltSeed);
    drawVignette();

    // title card
    if(t < TITLE_FADE_OUT_AT) el.titleCard.classList.add('visible');
    else el.titleCard.classList.remove('visible');

    el.clock.textContent = t >= CLOCK_START_AT - 400 ? clockDisplay(t) : '';
    updateAct1Captions(t);
  }

  function drawAct2(){
    const t = STATE.actTime;
    drawSky();
    drawClouds(0.7);
    const {cx,cy} = ringCenter();
    const stationScale = Math.min(VW,VH) * 0.55;
    drawStation(cx, VH*0.86, stationScale/300);

    const baseR = Math.min(VW,VH) * 0.15;
    const spacing = Math.min(VW,VH) * 0.055;
    for(let i=0;i<3;i++){
      const r = baseR + i*spacing;
      const dist = circDist(STATE.fragments[i], STATE.fragmentTargets[i]);
      const closeness = clamp01(1 - dist/0.3);
      const color = fragmentColor(i, STATE.fragmentsLocked ? 1 : closeness);
      const arcSpan = STATE.fragmentsLocked ? Math.PI*2 : Math.PI*0.62;
      const glow = STATE.fragmentsLocked ? 0.9 : (0.15 + closeness*0.5);
      drawRing(cx, cy, r, STATE.fragments[i], arcSpan, 5, color, glow, STATE.fragmentTargets[i], !STATE.fragmentsLocked);
    }

    if(STATE.fragmentsLocked){
      const rt = STATE.messageRevealStart !== null ? (t - STATE.messageRevealStart) : 0;
      const burst = clamp01(rt/900);
      ctx.save();
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,baseR+spacing*2.6);
      g.addColorStop(0, 'rgba(255,217,160,' + (0.35*burst) + ')');
      g.addColorStop(1, 'rgba(255,217,160,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx,cy,baseR+spacing*2.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    drawRain();
    drawVignette();
    el.clock.textContent = '';
    updateAct2Message(t);
  }

  function drawAct3(){
    const t = STATE.actTime;
    drawSky();
    drawClouds(0.6);
    const {cx} = ringCenter();
    const cy = VH*0.34;
    const baseR = Math.min(VW,VH) * 0.1;
    drawRing(cx, cy, baseR, wrap01(t*0.00004), Math.PI*2, 5, '255,205,150', 0.6);

    const stationScale = Math.min(VW,VH) * 0.55;
    drawStation(cx, VH*0.82, stationScale/300);
    drawOperator(cx - stationScale*0.3, VH*0.82, stationScale/260, 'reaching');

    drawRain();
    drawVignette();
    el.clock.textContent = '';
    updateAct3Captions(t);
  }

  function drawEndingAnswer(){
    const t = STATE.actTime;
    const p = clamp01(t/ENDING_DURATION);
    drawSky();
    drawClouds(Math.max(0, 0.6*(1-p)));

    // dawn stars fading in as clouds part
    ctx.save();
    STATE.stars.forEach(function(s){
      const tw = 0.5 + 0.5*Math.sin(STATE.totalTime*0.001 + s.tw*10);
      ctx.globalAlpha = clamp01((p-0.3)/0.5) * tw * 0.7;
      ctx.fillStyle = '#fff4e2';
      ctx.beginPath(); ctx.arc(s.x*VW, s.y*VH, s.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    const cx = VW*0.5, cy = VH*0.42;
    // transmission beam
    const beamP = clamp01((p-0.12)/0.6);
    if(beamP > 0){
      const g = ctx.createLinearGradient(cx,0,cx,cy);
      g.addColorStop(0, 'rgba(255,217,160,0)');
      g.addColorStop(1, 'rgba(255,217,160,' + (0.5*beamP) + ')');
      ctx.fillStyle = g;
      const w = lerp(4, Math.min(VW,VH)*0.16, beamP);
      ctx.fillRect(cx-w/2, 0, w, cy);
    }

    // expanding ripple rings (the motif, transmitting outward)
    const rippleCount = 4;
    for(let i=0;i<rippleCount;i++){
      const phase = ((t*0.00035) + i/rippleCount) % 1;
      const r = phase * Math.min(VW,VH) * 0.5;
      const a = (1-phase) * 0.4 * clamp01(p/0.2);
      drawRing(cx, cy, Math.max(4,r), 0, Math.PI*2, 3, '255,205,150', a*1.4);
      ctx.globalAlpha = 1;
    }

    const stationScale = Math.min(VW,VH) * 0.55;
    drawStation(cx, VH*0.86, stationScale/300);
    drawOperator(cx - stationScale*0.28, VH*0.86, stationScale/260, p > 0.35 ? 'standing' : 'reaching');

    drawRain();
    drawVignette();
    el.clock.textContent = '';
    updateEndingCaptions(t, true);
  }

  function drawEndingSilent(){
    const t = STATE.actTime;
    const p = clamp01(t/ENDING_DURATION);
    drawSky();
    drawClouds(1);

    const cx = VW*0.5, cy = VH*0.5;
    const fade = clamp01(1 - p/0.7);
    const r = Math.min(VW,VH) * 0.12 * lerp(1, 0.15, clamp01(p/0.6));
    const color = lerpColor2('255,180,84', '90,40,40', clamp01(p/0.6));
    drawRing(cx, cy, Math.max(2,r), wrap01(t*0.00003), lerp(Math.PI*2,Math.PI*0.4,clamp01(p/0.6)), lerp(5,1.5,clamp01(p/0.6)), color, fade*0.6);

    // embers drifting and dying
    ctx.save();
    STATE.embers.forEach(function(em){
      const rise = ((STATE.totalTime*0.00002*(em.speed*20)) + em.seed) % 1;
      const ex = (em.x + Math.sin(rise*8+em.seed*10)*0.02) * VW;
      const ey = (1-rise) * VH;
      ctx.globalAlpha = (1-rise) * 0.5 * fade;
      ctx.fillStyle = '#c94a2f';
      ctx.beginPath(); ctx.arc(ex,ey,1.6,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();

    const stationScale = Math.min(VW,VH) * 0.55;
    drawStation(cx, VH*0.86, stationScale/300);
    drawOperator(cx - stationScale*0.28, VH*0.86, stationScale/260, 'slumped');

    const {alpha, boltSeed} = (p < 0.5) ? lightningEnvelope(STATE.lightningTimes.map(function(v){return v*0.4;}), STATE.lightningSeeds, t) : {alpha:0,boltSeed:0};
    drawRain();
    drawLightning(alpha*0.4, boltSeed);
    drawVignette();
    el.clock.textContent = '';
    updateEndingCaptions(t, false);
  }

  function lerpColor2(a,b,t){
    const pa = a.split(',').map(Number), pb = b.split(',').map(Number);
    return Math.round(lerp(pa[0],pb[0],t))+','+Math.round(lerp(pa[1],pb[1],t))+','+Math.round(lerp(pa[2],pb[2],t));
  }

  function drawVignette(){
    const g = ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.3,VW/2,VH/2,Math.max(VW,VH)*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,VW,VH);
  }

  /* ---------------------------------------------------------------- *
   *  Main render dispatch
   * ---------------------------------------------------------------- */
  function render(){
    ctx.clearRect(0,0,VW,VH);
    switch(STATE.act){
      case 'act1': drawAct1(); break;
      case 'act2': drawAct2(); break;
      case 'act3': drawAct3(); break;
      case 'endingAnswer': drawEndingAnswer(); break;
      case 'endingSilent': drawEndingSilent(); break;
    }
    const romanAct = ['I','II','III', STATE.act==='endingAnswer'?'IV · ANSWER':'IV · SILENT'][actIndex(STATE.act)];
    el.hud.innerHTML = 'SEED ' + STATE.seed + ' &middot; ACT ' + romanAct + (STATE.autoplay.enabled ? ' <span class="auto-tag">&middot; AUTOPLAY</span>' : '');
  }

  /* ---------------------------------------------------------------- *
   *  Main loop with capped delta + visibility-safe pause
   * ---------------------------------------------------------------- */
  let lastTime = null;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden){ lastTime = null; return; }
    if(lastTime === null){ lastTime = now; render(); return; }
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    updateState(dt);
    render();
  }

  /* ---------------------------------------------------------------- *
   *  Public deterministic API
   * ---------------------------------------------------------------- */
  const API = {
    reset: function(seed){
      const s = Number.isFinite(seed) ? Math.floor(seed) : DEFAULT_SEED;
      performReset(s);
      return API.snapshot();
    },
    setAutoplay: function(enabled, ending){
      if(ending === 'answer' || ending === 'silent') STATE.autoplay.ending = ending;
      STATE.autoplay.enabled = !!enabled;
      return API.snapshot();
    },
    seek: function(ms){
      STATE.autoplay.enabled = false;
      let t = Math.max(0, Number(ms) || 0);
      if(STATE.act === 'act1') t = Math.min(t, ACT1_DURATION);
      if(STATE.act === 'endingAnswer' || STATE.act === 'endingSilent') t = Math.min(t, ENDING_DURATION + 1);
      STATE.actTime = t;
      render();
      return API.snapshot();
    },
    alignFragment: function(index, value){
      STATE.autoplay.enabled = false;
      _internalAlign(index, Number(value));
      return API.snapshot();
    },
    choose: function(ending){
      if(ending !== 'answer' && ending !== 'silent') return API.snapshot();
      STATE.autoplay.enabled = false;
      _internalChoose(ending);
      return API.snapshot();
    },
    snapshot: function(){
      return {
        seed: STATE.seed,
        act: STATE.act,
        actTimeMs: Math.round(STATE.actTime),
        totalTimeMs: Math.round(STATE.totalTime),
        fragments: STATE.fragments.slice(),
        fragmentTargets: STATE.fragmentTargets.slice(),
        aligned: STATE.aligned,
        choiceAvailable: STATE.act === 'act3' && !STATE.ending,
        ending: STATE.ending,
        completed: STATE.completed,
        autoplay: { enabled: STATE.autoplay.enabled, ending: STATE.autoplay.ending },
        reducedMotion: !!MOTION.reduced
      };
    },
    runSelfTest: function(){
      const tests = [];
      function check(name, cond){ tests.push({ name: name, passed: !!cond }); }

      // 1. Deterministic reset
      API.reset(4242);
      const snapA = JSON.stringify({ t: STATE.fragmentTargets, c: STATE.clouds.map(function(c){return c.x;}) });
      API.reset(4242);
      const snapB = JSON.stringify({ t: STATE.fragmentTargets, c: STATE.clouds.map(function(c){return c.x;}) });
      check('deterministic reset produces identical derived state', snapA === snapB);

      // 2. Ordered act progression
      API.reset(217);
      API.setAutoplay(false);
      check('starts in act1', STATE.act === 'act1');
      fastForward(ACT1_DURATION + 500);
      check('advances to act2 after act1 duration', STATE.act === 'act2');

      // 3. Fragment gating
      const beforeEnding = STATE.ending;
      API.choose('answer');
      check('choose() ignored outside act3', STATE.ending === beforeEnding && STATE.act === 'act2');
      STATE.fragmentTargets.forEach(function(t,i){ API.alignFragment(i, t); });
      fastForward(16);
      check('aligning all fragments to targets sets aligned', STATE.aligned === true);
      fastForward(ACT2_POST_ALIGN_TOTAL + 500);
      check('advances to act3 after alignment hold', STATE.act === 'act3');
      check('choice available in act3', STATE.act === 'act3' && !STATE.ending);

      // 4. Silent ending reachable
      API.choose('silent');
      fastForward(ENDING_DURATION + 500);
      check('silent ending reachable and completes', STATE.ending === 'silent' && STATE.completed === true);

      // 5. Replay + explore alternate ending
      API.reset(217);
      API.setAutoplay(false);
      fastForward(ACT1_DURATION + 500);
      STATE.fragmentTargets.forEach(function(t,i){ API.alignFragment(i, t); });
      fastForward(ACT2_POST_ALIGN_TOTAL + 500);
      API.choose('answer');
      fastForward(ENDING_DURATION + 500);
      check('answer ending reachable and completes', STATE.ending === 'answer' && STATE.completed === true);
      jumpToOtherEnding();
      check('other ending explorable: returns to act3 choice', STATE.act === 'act3' && !STATE.ending);
      API.choose('silent');
      fastForward(ENDING_DURATION + 500);
      check('alternate ending reachable after exploring', STATE.ending === 'silent' && STATE.completed === true);

      // 6. Autoplay + automatic startup configuration
      API.reset(217);
      API.setAutoplay(true, 'answer');
      check('autoplay enabled with answer ending after setAutoplay', STATE.autoplay.enabled === true && STATE.autoplay.ending === 'answer');
      fastForward(ACT1_DURATION + 13000 + ACT3_AUTOPLAY_WAIT + ENDING_DURATION + 2000);
      check('autoplay traverses full story to completion', STATE.completed === true && STATE.ending === 'answer');

      // 7. Finite numeric state
      const snap = API.snapshot();
      check('snapshot contains only finite numeric/serializable state', isFiniteDeep(snap));

      const passed = tests.every(function(t){ return t.passed; });

      // restore automatic-start state
      API.reset(DEFAULT_SEED);
      API.setAutoplay(true, 'answer');

      return { passed: passed, tests: tests };
    }
  };
  window.__LAST_SIGNAL__ = API;

  /* ---------------------------------------------------------------- *
   *  Input wiring
   * ---------------------------------------------------------------- */
  el.fragInputs.forEach(function(input, i){
    input.addEventListener('input', function(e){
      window.__LAST_SIGNAL__.alignFragment(i, (+e.target.value) / 1000);
    });
  });

  el.btnAnswer.addEventListener('click', function(){ window.__LAST_SIGNAL__.choose('answer'); });
  el.btnSilent.addEventListener('click', function(){ window.__LAST_SIGNAL__.choose('silent'); });

  el.btnReplay.addEventListener('click', function(){
    window.__LAST_SIGNAL__.setAutoplay(false);
    window.__LAST_SIGNAL__.reset(STATE.seed);
  });
  el.btnOther.addEventListener('click', function(){
    window.__LAST_SIGNAL__.setAutoplay(false);
    jumpToOtherEnding();
  });

  // Skip the passive act1 cinematic via space/enter/click/tap
  function skipAct1(){
    if(STATE.act !== 'act1') return;
    STATE.autoplay.enabled = false;
    STATE.actTime = ACT1_DURATION;
  }
  window.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
    if(e.code === 'Space' || e.code === 'Enter'){
      if(STATE.act === 'act1'){ e.preventDefault(); skipAct1(); }
    }
  });
  canvas.addEventListener('click', function(){ skipAct1(); });

  // Direct-manipulation drag on the fragment rings themselves (pointer + touch)
  let activeDrag = null;
  function updateFragmentFromPointer(i, x, y){
    const {cx,cy} = ringCenter();
    const angle = Math.atan2(y-cy, x-cx);
    const v = wrap01(angle / (Math.PI*2));
    window.__LAST_SIGNAL__.alignFragment(i, v);
  }
  function pickNearestRing(x,y){
    if(STATE.act !== 'act2' || STATE.fragmentsLocked) return null;
    const {cx,cy} = ringCenter();
    const dist = Math.hypot(x-cx,y-cy);
    const baseR = Math.min(VW,VH) * 0.15;
    const spacing = Math.min(VW,VH) * 0.055;
    let best = null, bestD = 999999;
    for(let i=0;i<3;i++){
      const r = baseR + i*spacing;
      const d = Math.abs(dist-r);
      if(d < 26 && d < bestD){ best = i; bestD = d; }
    }
    return best;
  }
  canvas.addEventListener('pointerdown', function(e){
    const idx = pickNearestRing(e.clientX, e.clientY);
    if(idx !== null){
      activeDrag = idx;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      updateFragmentFromPointer(idx, e.clientX, e.clientY);
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if(activeDrag === null) return;
    updateFragmentFromPointer(activeDrag, e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', function(){ activeDrag = null; });
  window.addEventListener('pointercancel', function(){ activeDrag = null; });

  /* ---------------------------------------------------------------- *
   *  Boot
   * ---------------------------------------------------------------- */
  function bootDefault(){
    performReset(DEFAULT_SEED);
    STATE.autoplay.enabled = true;
    STATE.autoplay.ending = 'answer';
  }
  bootDefault();
  requestAnimationFrame(frame);
})();
</script>
