<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonnet 5</title>
<style>
  :root{
    --ink:#eaf2ff;
    --ink-dim:rgba(234,242,255,.62);
    --cyan:#57e6c9;
    --coral:#ff5d73;
    --amber:#f6b93b;
    --gold:#ffd27a;
    --panel:#3d4a63;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#04060b; color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #stage{position:fixed; inset:0; overflow:hidden;}
  canvas#scene{position:absolute; inset:0; display:block;}

  #scanlines{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:.5;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px);
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 35%, rgba(2,3,7,.55) 78%, rgba(2,3,7,.92) 100%);
  }
  #grain-fade{
    position:absolute; inset:0; pointer-events:none; background:#000; opacity:0; transition:opacity 1.4s ease;
  }

  .letterbox{position:absolute; left:0; right:0; background:#000; pointer-events:none; z-index:5; transition:height 1.6s cubic-bezier(.22,.7,.2,1);}
  #lb-top{top:0; height:6vh;}
  #lb-bot{bottom:0; height:6vh;}

  #titlecard{
    position:absolute; left:50%; top:9%; transform:translate(-50%,0);
    font-size:clamp(13px,2vw,17px); letter-spacing:.42em; text-transform:uppercase;
    color:var(--ink-dim); opacity:0; z-index:6; pointer-events:none;
    text-shadow:0 0 18px rgba(234,242,255,.35);
    transition:opacity 1.8s ease;
  }

  #narrative{
    position:absolute; left:50%; bottom:16%; transform:translateX(-50%);
    width:min(90vw,720px); text-align:center; z-index:6; pointer-events:none;
    opacity:0; transition:opacity 1.1s ease;
  }
  #narrative.show{opacity:1;}
  #narrative .line{
    font-size:clamp(15px,2.6vw,22px); letter-spacing:.06em; line-height:1.6;
    color:var(--ink); text-shadow:0 0 22px rgba(255,210,122,.28);
  }
  #narrative .sub{
    margin-top:10px; font-size:clamp(11px,1.6vw,13px); letter-spacing:.32em; text-transform:uppercase;
    color:var(--ink-dim);
  }
  #message-text{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    width:min(92vw,760px); text-align:center; z-index:6; pointer-events:none;
    font-size:clamp(20px,4.4vw,40px); letter-spacing:.14em; font-weight:600;
    color:#fff8ea; text-shadow:0 0 28px rgba(255,210,122,.55), 0 0 60px rgba(255,180,90,.25);
    opacity:0;
  }
  #clock-readout{
    position:absolute; left:50%; bottom:26.5%; transform:translateX(-50%);
    z-index:6; pointer-events:none; opacity:0; letter-spacing:.3em;
    font-size:clamp(12px,1.8vw,15px); color:var(--amber); text-shadow:0 0 14px rgba(246,185,59,.6);
  }

  #epilogue{
    position:absolute; left:50%; bottom:20%; transform:translateX(-50%);
    width:min(88vw,640px); text-align:center; z-index:6; pointer-events:none;
  }
  #epilogue .eline{
    font-size:clamp(13px,2vw,17px); letter-spacing:.05em; line-height:1.9;
    color:var(--ink-dim); opacity:0; transition:opacity 1.6s ease;
  }

  #progress-rail{
    position:absolute; left:18px; top:50%; transform:translateY(-50%);
    width:2px; height:34vh; background:rgba(234,242,255,.12); z-index:7; pointer-events:none;
    border-radius:2px;
  }
  #progress-dot{
    position:absolute; left:50%; top:0; width:8px; height:8px; border-radius:50%;
    transform:translate(-50%,0); background:var(--gold); box-shadow:0 0 10px rgba(255,210,122,.8);
    transition:top .4s ease;
  }

  #controls-act2{
    position:absolute; left:50%; bottom:6.5%; transform:translateX(-50%);
    display:flex; gap:clamp(20px,6vw,56px); z-index:8;
    opacity:0; pointer-events:none; transition:opacity .9s ease;
  }
  #controls-act2.show{opacity:1; pointer-events:auto;}
  .dial{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .dial .dot{width:6px; height:6px; border-radius:50%; opacity:.85;}
  .dial-a .dot{background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .dial-b .dot{background:var(--coral); box-shadow:0 0 8px var(--coral);}
  .dial-c .dot{background:var(--amber); box-shadow:0 0 8px var(--amber);}
  .dial-wrap{width:132px; height:30px; display:flex; align-items:center; justify-content:center;}
  .dial-wrap input[type=range]{
    width:120px; height:28px; transform:rotate(-90deg); transform-origin:center;
    -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer;
  }
  .dial-wrap input[type=range]::-webkit-slider-runnable-track{
    height:2px; background:rgba(234,242,255,.28); border-radius:2px;
  }
  .dial-wrap input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px #fff, 0 0 0 3px rgba(4,6,11,.9);
    margin-top:-7px; cursor:grab;
  }
  .dial-wrap input[type=range]::-moz-range-track{ height:2px; background:rgba(234,242,255,.28); border-radius:2px;}
  .dial-wrap input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 0 10px #fff, 0 0 0 3px rgba(4,6,11,.9);
  }
  .dial-a input[type=range]::-webkit-slider-thumb{ background:var(--cyan); box-shadow:0 0 10px var(--cyan), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-b input[type=range]::-webkit-slider-thumb{ background:var(--coral); box-shadow:0 0 10px var(--coral), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-c input[type=range]::-webkit-slider-thumb{ background:var(--amber); box-shadow:0 0 10px var(--amber), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-a input[type=range]::-moz-range-thumb{ background:var(--cyan); box-shadow:0 0 10px var(--cyan), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-b input[type=range]::-moz-range-thumb{ background:var(--coral); box-shadow:0 0 10px var(--coral), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-c input[type=range]::-moz-range-thumb{ background:var(--amber); box-shadow:0 0 10px var(--amber), 0 0 0 3px rgba(4,6,11,.9); }
  .dial-wrap input[type=range]:focus-visible{outline:none;}
  .dial-wrap input[type=range]:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 2px #fff, 0 0 10px var(--tc,#fff);}

  #controls-act3{
    position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
    display:flex; gap:22px; z-index:8; flex-wrap:wrap; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .9s ease;
  }
  #controls-act3.show{opacity:1; pointer-events:auto;}
  .choice-btn{
    font-family:inherit; letter-spacing:.28em; font-size:clamp(12px,1.8vw,14px);
    color:var(--ink); background:rgba(10,14,22,.55); border:1px solid rgba(234,242,255,.3);
    padding:16px 26px; border-radius:3px; cursor:pointer; text-transform:uppercase;
    transition:border-color .3s ease, box-shadow .3s ease, transform .2s ease, background .3s ease;
  }
  .choice-btn:hover{ border-color:rgba(255,210,122,.8); box-shadow:0 0 22px rgba(255,210,122,.18);}
  .choice-btn:active{ transform:scale(.97); }
  .choice-btn:focus-visible{ outline:none; border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.5), 0 0 22px rgba(255,210,122,.3);}
  #btn-answer{ border-color:rgba(255,210,122,.45); }
  #btn-silent{ border-color:rgba(87,230,201,.35); }

  #replay-ctl{
    position:absolute; right:18px; top:18px; z-index:9;
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(234,242,255,.25);
    background:rgba(10,14,22,.4); color:var(--ink-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    opacity:.45; transition:opacity .3s ease, border-color .3s ease;
  }
  #replay-ctl:hover, #replay-ctl:focus-visible{ opacity:1; border-color:rgba(255,210,122,.6); outline:none;}

  #replay-hint{
    position:absolute; left:50%; bottom:3.4%; transform:translateX(-50%);
    z-index:8; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-dim); opacity:0; transition:opacity 1.4s ease; text-align:center; pointer-events:none;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (max-width:560px){
    #controls-act2{ gap:14px; bottom:9%; }
    .dial-wrap{ width:104px; }
    .dial-wrap input[type=range]{ width:92px; }
    #controls-act3{ bottom:12%; gap:14px; }
    .choice-btn{ padding:14px 20px; }
    #progress-rail{ height:26vh; left:12px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="grain-fade"></div>

  <div class="letterbox" id="lb-top"></div>
  <div class="letterbox" id="lb-bot"></div>

  <div id="titlecard">Sonnet 5</div>

  <div id="clock-readout">02:17</div>
  <div id="narrative" aria-hidden="true">
    <div class="line" id="narrative-line"></div>
    <div class="sub" id="narrative-sub"></div>
  </div>
  <div id="message-text" aria-hidden="true"></div>
  <div id="epilogue" aria-hidden="true">
    <div class="eline" id="epi-1"></div>
    <div class="eline" id="epi-2"></div>
  </div>

  <div id="progress-rail"><div id="progress-dot"></div></div>

  <div id="controls-act2">
    <label class="dial dial-a"><span class="dot"></span>
      <span class="dial-wrap"><input type="range" id="frag-0" min="0" max="1000" value="500" aria-label="Fragment one alignment"></span>
    </label>
    <label class="dial dial-b"><span class="dot"></span>
      <span class="dial-wrap"><input type="range" id="frag-1" min="0" max="1000" value="500" aria-label="Fragment two alignment"></span>
    </label>
    <label class="dial dial-c"><span class="dot"></span>
      <span class="dial-wrap"><input type="range" id="frag-2" min="0" max="1000" value="500" aria-label="Fragment three alignment"></span>
    </label>
  </div>

  <div id="controls-act3">
    <button id="btn-answer" class="choice-btn" type="button">Answer</button>
    <button id="btn-silent" class="choice-btn" type="button">Stay Silent</button>
  </div>

  <button id="replay-ctl" type="button" aria-label="Replay from the beginning" title="Replay">&#8635;</button>
  <div id="replay-hint">Press R to replay &mdash; explore the other ending</div>

  <div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   Constants
--------------------------------------------------------------------- */
var DEFAULT_SEED = 217;

var D1 = 19000;
var GLOW_START = 11000;
var GLOW_RAMP = 2200;
var CLOCK_FADE_START = 11200;
var CLOCK_FADE_MS = 900;
var LINE_FADE_START = 12600;
var LINE_FADE_MS = 1000;
var LINE_HOLD_UNTIL = 16800;
var ACT1_FADEOUT_START = 17400;

var FRAGMENT_TARGET = 0.5;
var FRAGMENT_TOLERANCE = 0.035;
var HOLD_TIME = 500;
var SNAP_MS = 900;
var TYPE_MS = 1800;
var REVEAL_HOLD_MS = 2600;
var REVEAL_MS = TYPE_MS + REVEAL_HOLD_MS;

var FRAG_WINDOWS = [ [1500,8000], [5700,12200], [9900,16400] ];

var ACT3_AUTOPLAY_WAIT = 2600;

var D4 = 17500;
var EPILOGUE_LINE1_AT = 4200;
var EPILOGUE_LINE2_AT = 9200;
var REPLAY_HINT_AT = 13000;

var REQUIRED_LINE = "At 02:17, the dead receiver began to glow.";
var REQUIRED_MESSAGE = "WE REMEMBER YOUR SKY.";

var EPILOGUE = {
  answer: [
    "The reply left the tower and did not return.",
    "Somewhere, the sky remembers being heard."
  ],
  silent: [
    "The reply stayed in the tower, unsent.",
    "Somewhere, the sky keeps listening anyway."
  ]
};

var reduceMotion = false;
try { reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

/* ---------------------------------------------------------------------
   Seeded PRNG (mulberry32) + deterministic per-stream hashing
--------------------------------------------------------------------- */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function streamFor(seed, salt){
  var h = (Math.imul(seed|0, 2654435761) ^ Math.imul(salt|0, 2246822519)) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  return mulberry32(h || 1);
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(t){ t=clamp(t,0,1); return t*t*(3-2*t); }

/* ---------------------------------------------------------------------
   Seeded scene data generation
--------------------------------------------------------------------- */
function genRain(rng,count){
  var arr=[];
  for(var i=0;i<count;i++){
    arr.push({
      x: rng(),
      y: rng(),
      len: 0.028+rng()*0.05,
      speed: 0.00032+rng()*0.00050,
      slant: 0.05+rng()*0.05,
      op: 0.10+rng()*0.26
    });
  }
  return arr;
}
function genLightning(rng, total, count){
  var out=[];
  for(var i=0;i<count;i++){
    out.push({
      t: 1200+rng()*Math.max(200,total-2400),
      dur: 90+rng()*170,
      peak: 0.28+rng()*0.42
    });
  }
  out.sort(function(a,b){ return a.t-b.t; });
  return out;
}
function genFragMeta(rng){
  var out=[];
  for(var i=0;i<3;i++){
    out.push({
      dir: rng()*Math.PI*2,
      maxDist: 60+rng()*95,
      wobSpeed: 0.5+rng()*0.9,
      wobPhase: rng()*Math.PI*2
    });
  }
  return out;
}
function genFragInitial(rng){
  var out=[];
  for(var i=0;i<3;i++){
    var sign = rng()<0.5?-1:1;
    var mag = 0.30+rng()*0.19;
    out.push(clamp(FRAGMENT_TARGET+sign*mag,0.02,0.98));
  }
  return out;
}
function genConsoleLights(rng,count){
  var out=[];
  for(var i=0;i<count;i++){
    out.push({ freq:0.4+rng()*1.1, phase:rng()*Math.PI*2, order:i });
  }
  // seeded shuffle for sequential dim/flare order
  var order = out.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  }
  for(var i=0;i<out.length;i++) out[i].order = order.indexOf(i);
  return out;
}

function computeSeedData(seed){
  var rngRain = streamFor(seed,1);
  var rngL1 = streamFor(seed,2);
  var rngFragMeta = streamFor(seed,3);
  var rngFragInit = streamFor(seed,4);
  var rngL4a = streamFor(seed,5);
  var rngL4s = streamFor(seed,6);
  var rngL3 = streamFor(seed,7);
  var rngConsole = streamFor(seed,8);
  var rngParticles = streamFor(seed,9);

  var particles=[];
  for(var i=0;i<26;i++){
    particles.push({ ang: rngParticles()*Math.PI*2, speed:0.4+rngParticles()*0.8, phase:rngParticles()*Math.PI*2 });
  }

  return {
    rain: genRain(rngRain, 110),
    lightning1: genLightning(rngL1, D1, 7),
    lightning3: genLightning(rngL3, 30000, 3),
    lightning4a: genLightning(rngL4a, D4, 5),
    lightning4s: genLightning(rngL4s, D4, 2),
    fragMeta: genFragMeta(rngFragMeta),
    fragInitial: genFragInitial(rngFragInit),
    consoleLights: genConsoleLights(rngConsole, 6),
    silentParticles: particles
  };
}

/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
var state = {
  seed: DEFAULT_SEED,
  act: 1,
  actTime: 0,
  globalTime: 0,
  act2Phase: "align",
  act2PhaseTime: 0,
  alignedHold: 0,
  fragments: [0.5,0.5,0.5],
  fragMeta: [],
  rain: [],
  lightning1: [], lightning3: [], lightning4a: [], lightning4s: [],
  consoleLights: [],
  silentParticles: [],
  selectedEnding: null,
  completed: false,
  autoplay: { enabled: true, ending: "answer" },
  manualOverride: false,
  paused: false,
  focusIndex: 0
};

var INITIAL_BOOT_SNAPSHOT = null;

/* ---------------------------------------------------------------------
   DOM refs
--------------------------------------------------------------------- */
var canvas = document.getElementById("scene");
var ctx = canvas.getContext("2d");
var elTitlecard = document.getElementById("titlecard");
var elNarrative = document.getElementById("narrative");
var elNarrativeLine = document.getElementById("narrative-line");
var elNarrativeSub = document.getElementById("narrative-sub");
var elMessage = document.getElementById("message-text");
var elClock = document.getElementById("clock-readout");
var elEpi1 = document.getElementById("epi-1");
var elEpi2 = document.getElementById("epi-2");
var elProgressDot = document.getElementById("progress-dot");
var elProgressRail = document.getElementById("progress-rail");
var elControls2 = document.getElementById("controls-act2");
var elControls3 = document.getElementById("controls-act3");
var elBtnAnswer = document.getElementById("btn-answer");
var elBtnSilent = document.getElementById("btn-silent");
var elReplayCtl = document.getElementById("replay-ctl");
var elReplayHint = document.getElementById("replay-hint");
var elLbTop = document.getElementById("lb-top");
var elLbBot = document.getElementById("lb-bot");
var elSrLive = document.getElementById("sr-live");
var sliders = [document.getElementById("frag-0"), document.getElementById("frag-1"), document.getElementById("frag-2")];

/* ---------------------------------------------------------------------
   Layout metrics
--------------------------------------------------------------------- */
var W=0,H=0,DPR=1,CX=0,CY=0,RING_R=0,SCALE=1;
function layout(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.max(1,Math.round(W*DPR));
  canvas.height = Math.max(1,Math.round(H*DPR));
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W*0.5; CY = H*0.40;
  var minDim = Math.min(W,H);
  RING_R = minDim*0.17;
  SCALE = clamp(minDim/900, 0.55, 1.35);
}
window.addEventListener("resize", layout);
layout();

/* ---------------------------------------------------------------------
   Core mutation helpers
--------------------------------------------------------------------- */
function resetAct2Phase(){
  state.act2Phase = "align";
  state.act2PhaseTime = 0;
  state.alignedHold = 0;
}

function announce(msg){
  elSrLive.textContent = msg;
}

function updateSliderDOM(i,v){
  var el = sliders[i];
  if(!el) return;
  var val = Math.round(clamp(v,0,1)*1000);
  if(String(val) !== el.value) el.value = String(val);
}
function updateAllSliderDOM(){
  for(var i=0;i<3;i++) updateSliderDOM(i, state.fragments[i]);
}

function fragmentsAligned(){
  for(var i=0;i<3;i++){
    if(Math.abs(state.fragments[i]-FRAGMENT_TARGET) > FRAGMENT_TOLERANCE) return false;
  }
  return true;
}

function applyFragmentValue(index, value, manual){
  if(index !== 0 && index !== 1 && index !== 2) return;
  value = clamp(Number(value), 0, 1);
  if(!Number.isFinite(value)) return;
  state.fragments[index] = value;
  if(manual) state.manualOverride = true;
  updateSliderDOM(index, value);
}

function updateAlignedHold(dt){
  if(state.act2Phase !== "align") return;
  if(fragmentsAligned()) state.alignedHold += dt;
  else state.alignedHold = 0;
}

function checkAct2PhaseTimeThresholds(){
  if(state.act !== 2) return;
  if(state.act2Phase === "align"){
    var aligned = fragmentsAligned();
    if(!aligned) state.alignedHold = 0;
    if(aligned && state.alignedHold >= HOLD_TIME){
      state.act2Phase = "snap";
      state.act2PhaseTime = 0;
    }
  } else if(state.act2Phase === "snap"){
    if(state.act2PhaseTime >= SNAP_MS){
      state.act2Phase = "reveal";
      state.act2PhaseTime = 0;
      announce("The fragments resolve. We remember your sky.");
    }
  } else if(state.act2Phase === "reveal"){
    if(state.act2PhaseTime >= REVEAL_MS){
      state.act = 3;
      state.actTime = 0;
      announce("Act three. The choice.");
    }
  }
}

function performChoice(ending, manual){
  if(state.act !== 3) return false;
  if(ending !== "answer" && ending !== "silent") return false;
  state.selectedEnding = ending;
  if(manual) state.manualOverride = true;
  state.act = 4;
  state.actTime = 0;
  state.completed = false;
  announce(ending === "answer" ? "The reply is sent into the storm." : "The signal is allowed to fade.");
  return true;
}

/* ---------------------------------------------------------------------
   Public API
--------------------------------------------------------------------- */
function reset(seed){
  seed = Number.isFinite(seed) ? Math.floor(seed) : DEFAULT_SEED;
  state.seed = seed;
  var d = computeSeedData(seed);
  state.rain = d.rain;
  state.lightning1 = d.lightning1;
  state.lightning3 = d.lightning3;
  state.lightning4a = d.lightning4a;
  state.lightning4s = d.lightning4s;
  state.consoleLights = d.consoleLights;
  state.silentParticles = d.silentParticles;
  state.fragMeta = d.fragMeta;
  state.fragments = d.fragInitial.slice();
  initialFragCache = d.fragInitial.slice();

  state.act = 1;
  state.actTime = 0;
  state.globalTime = 0;
  resetAct2Phase();
  state.selectedEnding = null;
  state.completed = false;
  state.manualOverride = false;
  state.focusIndex = 0;

  updateAllSliderDOM();
  elControls2.classList.remove("show");
  elControls3.classList.remove("show");
  elMessage.style.opacity = 0;
  elMessage.textContent = "";
  elNarrative.classList.remove("show");
  elClock.style.opacity = 0;
  elEpi1.style.opacity = 0; elEpi1.textContent = "";
  elEpi2.style.opacity = 0; elEpi2.textContent = "";
  elReplayHint.style.opacity = 0;
  document.getElementById("grain-fade").style.opacity = 0;
  elLbTop.style.height = "6vh";
  elLbBot.style.height = "6vh";

  announce("The story begins again.");
}

function setAutoplay(enabled, ending){
  state.autoplay.enabled = !!enabled;
  if(ending === "answer" || ending === "silent") state.autoplay.ending = ending;
  if(state.autoplay.enabled) state.manualOverride = false;
}

function seek(ms){
  ms = Number(ms);
  if(!Number.isFinite(ms) || ms < 0) return;
  if(state.act === 1){
    state.actTime = ms;
    if(state.actTime >= D1){
      state.act = 2; state.actTime = 0; resetAct2Phase();
    }
  } else if(state.act === 2){
    state.act2PhaseTime = ms;
    state.actTime = ms;
    checkAct2PhaseTimeThresholds();
  } else if(state.act === 3){
    state.actTime = ms;
  } else if(state.act === 4){
    state.actTime = ms;
    if(state.actTime >= D4) state.completed = true;
  }
}

function alignFragment(index, value){
  applyFragmentValue(index, value, true);
  checkAct2PhaseTimeThresholds();
}

function choose(ending){
  return performChoice(ending, true);
}

function snapshot(){
  return {
    seed: state.seed,
    act: state.act,
    actTimeMs: Math.round(state.actTime),
    fragments: state.fragments.slice(),
    aligned: state.fragments.map(function(v){ return Math.abs(v-FRAGMENT_TARGET) <= FRAGMENT_TOLERANCE; }),
    choiceAvailable: state.act === 3,
    selectedEnding: state.selectedEnding,
    completed: state.completed,
    autoplay: { enabled: state.autoplay.enabled, ending: state.autoplay.ending }
  };
}

/* ---------------------------------------------------------------------
   Simulation tick (the real forward-time driver; also used by self-test)
--------------------------------------------------------------------- */
function driveAutoplayAct2(){
  if(!state.autoplay.enabled || state.manualOverride) return;
  if(state.act2Phase !== "align") return;
  var t = state.act2PhaseTime;
  for(var i=0;i<3;i++){
    var w = FRAG_WINDOWS[i];
    var frac = smoothstep((t - w[0]) / (w[1]-w[0]));
    if(t <= w[0]) frac = 0;
    if(t >= w[1]) frac = 1;
    var v = lerp(initialFragCache[i], FRAGMENT_TARGET, frac);
    applyFragmentValue(i, v, false);
  }
}
var initialFragCache = [0.5,0.5,0.5];

function driveAutoplayAct3(){
  if(!state.autoplay.enabled || state.manualOverride) return;
  if(state.actTime >= ACT3_AUTOPLAY_WAIT){
    performChoice(state.autoplay.ending, false);
  }
}

function tick(dt){
  state.globalTime += dt;
  state.actTime += dt;

  if(state.act === 1){
    if(state.actTime >= D1){
      state.act = 2; state.actTime = 0; resetAct2Phase();
      announce("Act two. The message arrives.");
    }
  } else if(state.act === 2){
    driveAutoplayAct2();
    state.act2PhaseTime += dt;
    updateAlignedHold(dt);
    checkAct2PhaseTimeThresholds();
  } else if(state.act === 3){
    driveAutoplayAct3();
  } else if(state.act === 4){
    if(state.actTime >= D4) state.completed = true;
  }
}

/* ---------------------------------------------------------------------
   Input wiring
--------------------------------------------------------------------- */
sliders.forEach(function(el, i){
  el.addEventListener("input", function(){
    applyFragmentValue(i, Number(el.value)/1000, true);
    checkAct2PhaseTimeThresholds();
  });
});

elBtnAnswer.addEventListener("click", function(){ choose("answer"); });
elBtnSilent.addEventListener("click", function(){ choose("silent"); });

elReplayCtl.addEventListener("click", function(){ reset(DEFAULT_SEED); });

window.addEventListener("keydown", function(e){
  var k = e.key;
  if(k === "r" || k === "R"){ reset(DEFAULT_SEED); return; }
  if(state.act === 1 && (k === " " || k === "Enter")){
    state.manualOverride = true;
    state.act = 2; state.actTime = 0; resetAct2Phase();
    e.preventDefault();
    return;
  }
  if(state.act === 3 && (k === "1")){ choose("answer"); }
  if(state.act === 3 && (k === "2")){ choose("silent"); }
  if(state.act === 3 && (k === "ArrowLeft" || k === "ArrowRight")){
    var focusEl = document.activeElement;
    if(focusEl === elBtnAnswer) elBtnSilent.focus(); else elBtnAnswer.focus();
  }
});

["pointerdown","touchstart"].forEach(function(evt){
  elControls2.addEventListener(evt, function(){ state.manualOverride = true; }, {passive:true});
  elControls3.addEventListener(evt, function(){ state.manualOverride = true; }, {passive:true});
});

/* ---------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------- */
function bgGradient(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#050912");
  g.addColorStop(0.55,"#080d1a");
  g.addColorStop(1,"#03040a");
  return g;
}

function shardAngles(i){
  var seg = (Math.PI*2)/3;
  var gap = 0.05;
  var start = -Math.PI/2 + i*seg + gap/2;
  var end = start + seg - gap;
  return [start,end];
}

function fragDisplacement(i){
  var f = state.fragMeta[i];
  if(!f) return {dx:0,dy:0,distFrac:0};
  var v = state.fragments[i];
  var distFrac = clamp(Math.abs(v-FRAGMENT_TARGET)/FRAGMENT_TARGET, 0, 1);
  var wob = reduceMotion ? 0 : Math.sin(state.globalTime*0.0022*f.wobSpeed + f.wobPhase) * 0.05 * distFrac;
  var mag = clamp(distFrac+wob,0,1) * f.maxDist * SCALE;
  return { dx: Math.cos(f.dir)*mag, dy: Math.sin(f.dir)*mag, distFrac: distFrac };
}

function lightningEnvelope(list, t){
  var total = 0;
  for(var i=0;i<list.length;i++){
    var ev = list[i];
    if(t >= ev.t && t <= ev.t+ev.dur){
      var lt = (t-ev.t)/ev.dur;
      var env = lt < 0.25 ? (lt/0.25) : (1-(lt-0.25)/0.75);
      total = Math.max(total, env*ev.peak);
    }
  }
  return total;
}

function drawRain(alphaMul){
  ctx.save();
  ctx.strokeStyle = "rgba(170,195,230,1)";
  ctx.lineWidth = 1;
  for(var i=0;i<state.rain.length;i++){
    var r = state.rain[i];
    var y = ((r.y + state.globalTime*r.speed) % 1.15) - 0.08;
    var x = r.x*W;
    var y0 = y*H;
    var y1 = y0 + r.len*H;
    ctx.globalAlpha = r.op*alphaMul;
    ctx.beginPath();
    ctx.moveTo(x + r.slant*r.len*H, y0);
    ctx.lineTo(x, y1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWindowFrame(){
  ctx.save();
  ctx.strokeStyle = "rgba(61,74,99,.55)";
  ctx.lineWidth = 3;
  var m = Math.min(W,H)*0.05;
  ctx.strokeRect(m,m,W-m*2,H-m*2);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = "rgba(61,74,99,.3)";
  ctx.beginPath();
  ctx.moveTo(W*0.5,m); ctx.lineTo(W*0.5,H-m);
  ctx.moveTo(m,H*0.42); ctx.lineTo(W-m,H*0.42);
  ctx.stroke();
  ctx.restore();
}

function drawConsoleAndOperator(brightness, dimSeq){
  ctx.save();
  var by = H*0.90;
  var bw = Math.min(W*0.5, 460);
  var bx = CX - bw/2;
  ctx.fillStyle = "rgba(4,6,10,.92)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(bx, by, bw, H*0.07, 4) : ctx.rect(bx,by,bw,H*0.07);
  ctx.fill();

  var n = state.consoleLights.length || 6;
  for(var i=0;i<n;i++){
    var lt = state.consoleLights[i];
    var seqFactor = 1;
    if(dimSeq != null){
      seqFactor = lt.order <= dimSeq ? 0.08 : 1;
    }
    var flicker = 0.65 + 0.35*Math.sin(state.globalTime*0.001*lt.freq*6 + lt.phase);
    var b = clamp(brightness * flicker * seqFactor, 0, 1);
    var lx = bx + bw*(i+0.5)/n;
    var ly = by + H*0.035;
    var hue = i%2===0 ? "246,185,59" : "255,210,122";
    ctx.fillStyle = "rgba("+hue+","+(0.15+0.85*b)+")";
    ctx.beginPath();
    ctx.arc(lx,ly,3.2,0,Math.PI*2);
    ctx.fill();
  }

  // operator silhouette
  var opx = CX + Math.min(W,H)*0.03;
  var opy = by;
  ctx.fillStyle = "rgba(2,3,6,.96)";
  ctx.beginPath();
  ctx.ellipse(opx, opy - Math.min(W,H)*0.10, Math.min(W,H)*0.028, Math.min(W,H)*0.034, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(opx - Math.min(W,H)*0.055, opy);
  ctx.quadraticCurveTo(opx, opy - Math.min(W,H)*0.09, opx + Math.min(W,H)*0.055, opy);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawReceiverWhole(opacity, colorRGB, flareBoost, pulses){
  if(opacity <= 0.001) return;
  ctx.save();
  ctx.lineWidth = RING_R*0.065;
  ctx.lineCap = "round";
  ctx.shadowColor = "rgba("+colorRGB+","+Math.min(1,opacity+flareBoost)+")";
  ctx.shadowBlur = 26*SCALE*(0.4+flareBoost*1.6+opacity*0.6);
  ctx.strokeStyle = "rgba("+colorRGB+","+opacity+")";
  ctx.beginPath();
  ctx.arc(CX,CY,RING_R,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();

  if(pulses && pulses.length){
    ctx.save();
    ctx.lineCap = "round";
    for(var i=0;i<pulses.length;i++){
      var p = pulses[i];
      if(p.alpha <= 0.001) continue;
      ctx.lineWidth = 2.2*SCALE;
      ctx.strokeStyle = "rgba(255,214,140,"+p.alpha+")";
      ctx.beginPath();
      ctx.arc(CX,CY,p.r,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawReceiverFragments(){
  var colors = ["87,230,201","255,93,115","246,185,59"];
  for(var i=0;i<3;i++){
    var d = fragDisplacement(i);
    var ang = shardAngles(i);
    var cx = CX + d.dx, cy = CY + d.dy;
    var closeness = 1 - d.distFrac;
    ctx.save();
    ctx.lineWidth = RING_R*0.065;
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba("+colors[i]+",0.9)";
    ctx.shadowBlur = (10+18*closeness)*SCALE;
    ctx.strokeStyle = "rgba("+colors[i]+","+(0.55+0.4*closeness)+")";
    ctx.beginPath();
    ctx.arc(cx,cy,RING_R,ang[0],ang[1]);
    ctx.stroke();
    ctx.restore();
  }
}

function drawSilentParticles(progress){
  if(progress <= 0) return;
  ctx.save();
  for(var i=0;i<state.silentParticles.length;i++){
    var p = state.silentParticles[i];
    var life = ((state.globalTime*0.00018*p.speed) + p.phase/(Math.PI*2)) % 1;
    var r = RING_R*(1 + life*1.4);
    var x = CX + Math.cos(p.ang)*r;
    var y = CY + Math.sin(p.ang)*r + life*70*SCALE;
    var a = (1-life)*0.35*progress;
    if(a <= 0.001) continue;
    ctx.fillStyle = "rgba(150,165,190,"+a+")";
    ctx.beginPath();
    ctx.arc(x,y,1.6*SCALE,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = bgGradient();
  ctx.fillRect(0,0,W,H);

  var flashAlpha = 0;
  var sceneShakeX = 0, sceneShakeY = 0;

  if(state.act === 1){
    var fadeIn = clamp(state.actTime/1600,0,1);
    var glowT = clamp((state.actTime-GLOW_START)/GLOW_RAMP,0,1);
    var dormantOpacity = lerp(0.05, 0.85, glowT);
    var fadeOut = state.actTime >= ACT1_FADEOUT_START ? clamp((state.actTime-ACT1_FADEOUT_START)/(D1-ACT1_FADEOUT_START),0,1) : 0;

    flashAlpha = lightningEnvelope(state.lightning1, state.actTime);
    ctx.save();
    ctx.globalAlpha = fadeIn*(1-fadeOut);
    drawWindowFrame();
    drawReceiverWhole(dormantOpacity, "246,185,59", 0, null);
    drawRain(1);
    drawConsoleAndOperator(0.2+0.5*glowT, null);
    ctx.restore();
  }
  else if(state.act === 2){
    flashAlpha = lightningEnvelope(state.lightning3, state.globalTime) * 0.4;
    ctx.save();
    drawWindowFrame();
    if(state.act2Phase === "align"){
      drawReceiverFragments();
    } else {
      var snapT = state.act2Phase === "snap" ? smoothstep(state.act2PhaseTime/SNAP_MS) : 1;
      drawReceiverWhole(0.55+0.4*snapT, "255,238,205", 0.15*snapT, null);
    }
    drawRain(0.8);
    drawConsoleAndOperator(0.75, null);
    ctx.restore();
  }
  else if(state.act === 3){
    flashAlpha = lightningEnvelope(state.lightning3, state.globalTime) * 0.35;
    var breathe = 0.75 + 0.12*Math.sin(state.globalTime*0.0014);
    ctx.save();
    drawWindowFrame();
    drawReceiverWhole(breathe, "255,238,205", 0.05, null);
    drawRain(0.7);
    drawConsoleAndOperator(0.8, null);
    ctx.restore();
  }
  else if(state.act === 4){
    var isAnswer = state.selectedEnding === "answer";
    if(isAnswer){
      flashAlpha = lightningEnvelope(state.lightning4a, state.actTime) * 0.7;
      var bloom = clamp(state.actTime/4000,0,1);
      var pulses = [];
      var pulseCount = 4;
      for(var i=0;i<pulseCount;i++){
        var pt = state.actTime - i*1300 - 800;
        if(pt > 0){
          var life = (pt % 5200)/5200;
          pulses.push({ r: RING_R*(1+life*3.2), alpha: (1-life)*0.5*bloom });
        }
      }
      var pullback = 1 - 0.06*clamp((state.actTime-4000)/5000,0,1);
      ctx.save();
      drawWindowFrame();
      drawReceiverWhole(0.55+0.4*bloom, "255,214,140", 0.25+0.3*bloom, pulses);
      drawRain(0.75);
      drawConsoleAndOperator(0.9, null);
      ctx.restore();
    } else {
      var fadeT = clamp(state.actTime/6000,0,1);
      var dimVal = lerp(0.62,0.06,fadeT);
      var seqIdx = Math.floor(clamp((state.actTime-1200)/900,0,5));
      ctx.save();
      drawWindowFrame();
      drawReceiverWhole(dimVal, "180,190,205", 0, null);
      drawSilentParticles(fadeT);
      drawRain(0.85);
      drawConsoleAndOperator(lerp(0.75,0.15,fadeT), state.actTime>1200?seqIdx:-1);
      ctx.restore();
    }
  }

  if(flashAlpha > 0.01 && !reduceMotion){
    ctx.save();
    ctx.fillStyle = "rgba(225,235,255,"+Math.min(0.55,flashAlpha)+")";
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   DOM overlay sync (text, opacity, control visibility) — pure fn of state
--------------------------------------------------------------------- */
function syncDOM(){
  var frag2Interactive = (state.act === 2 && state.act2Phase === "align");
  if(elControls2.inert !== !frag2Interactive) elControls2.inert = !frag2Interactive;
  var act3Interactive = (state.act === 3);
  if(elControls3.inert !== !act3Interactive) elControls3.inert = !act3Interactive;

  // titlecard
  var tcOp = clamp(1 - Math.abs(state.act===1 ? (state.actTime-2600)/2600 : 2), 0, 1);
  if(state.act === 1 && state.actTime < 5200){
    elTitlecard.style.opacity = String(clamp(state.actTime<1300 ? state.actTime/1300 : (5200-state.actTime)/1600,0,1));
  } else {
    elTitlecard.style.opacity = "0";
  }

  if(state.act === 1){
    var clockOp = clamp((state.actTime-CLOCK_FADE_START)/CLOCK_FADE_MS,0,1) - (state.actTime>ACT1_FADEOUT_START?clamp((state.actTime-ACT1_FADEOUT_START)/1200,0,1):0);
    elClock.style.opacity = String(clamp(clockOp,0,1));

    var lineOp = clamp((state.actTime-LINE_FADE_START)/LINE_FADE_MS,0,1);
    if(state.actTime > LINE_HOLD_UNTIL) lineOp -= clamp((state.actTime-LINE_HOLD_UNTIL)/900,0,1);
    lineOp = clamp(lineOp,0,1);
    if(lineOp > 0.01){
      elNarrative.classList.add("show");
      elNarrativeLine.textContent = REQUIRED_LINE;
      elNarrativeSub.textContent = "";
      elNarrative.style.opacity = String(lineOp);
    } else {
      elNarrative.classList.remove("show");
      elNarrative.style.opacity = "0";
    }
    elMessage.style.opacity = "0";
    elControls2.classList.remove("show");
    elControls3.classList.remove("show");
    elEpi1.style.opacity="0"; elEpi2.style.opacity="0";
    elLbTop.style.height = "6vh"; elLbBot.style.height = "6vh";
  }
  else if(state.act === 2){
    elClock.style.opacity = "0";
    elNarrative.classList.remove("show");
    elControls3.classList.remove("show");
    elEpi1.style.opacity="0"; elEpi2.style.opacity="0";
    elLbTop.style.height = "9vh"; elLbBot.style.height = "9vh";

    if(state.act2Phase === "align"){
      elControls2.classList.add("show");
      elMessage.style.opacity = "0";
      if(state.act2PhaseTime < 3400){
        elNarrative.classList.add("show");
        elNarrativeLine.textContent = "";
        elNarrativeSub.textContent = "Align the signal";
        elNarrative.style.opacity = String(clamp(state.act2PhaseTime<800?state.act2PhaseTime/800:(3400-state.act2PhaseTime)/1200,0,1));
      }
    } else {
      elControls2.classList.remove("show");
      elNarrative.classList.remove("show");
      elNarrative.style.opacity = "0";
      if(state.act2Phase === "reveal"){
        var typeChars = Math.floor(REQUIRED_MESSAGE.length * clamp(state.act2PhaseTime/TYPE_MS,0,1));
        elMessage.textContent = REQUIRED_MESSAGE.slice(0, typeChars);
        elMessage.style.opacity = String(clamp(state.act2PhaseTime/250,0,1));
      } else {
        elMessage.style.opacity = "0";
      }
    }
  }
  else if(state.act === 3){
    elClock.style.opacity = "0";
    elNarrative.classList.remove("show");
    elNarrative.style.opacity = "0";
    elMessage.style.opacity = String(clamp(1-(state.actTime/1200),0,1));
    if(state.actTime > 300){
      elControls3.classList.add("show");
      if(document.activeElement !== elBtnAnswer && document.activeElement !== elBtnSilent && state.actTime < 1600){
        try{ elBtnAnswer.focus({preventScroll:true}); } catch(e){ elBtnAnswer.focus(); }
      }
    }
    elLbTop.style.height = "11vh"; elLbBot.style.height = "11vh";
    elEpi1.style.opacity="0"; elEpi2.style.opacity="0";
    elReplayHint.style.opacity = "0";
  }
  else if(state.act === 4){
    elClock.style.opacity = "0";
    elNarrative.classList.remove("show");
    elNarrative.style.opacity = "0";
    elControls3.classList.remove("show");
    elMessage.style.opacity = "0";
    elControls2.classList.remove("show");
    var isAnswer = state.selectedEnding === "answer";
    elLbTop.style.height = isAnswer ? "5vh" : "9vh";
    elLbBot.style.height = isAnswer ? "5vh" : "9vh";

    var epi = EPILOGUE[state.selectedEnding] || EPILOGUE.answer;
    var e1 = clamp((state.actTime-EPILOGUE_LINE1_AT)/1400,0,1);
    var e2 = clamp((state.actTime-EPILOGUE_LINE2_AT)/1400,0,1);
    elEpi1.textContent = epi[0]; elEpi1.style.opacity = String(e1);
    elEpi2.textContent = epi[1]; elEpi2.style.opacity = String(e2);

    elReplayHint.style.opacity = String(clamp((state.actTime-REPLAY_HINT_AT)/1600,0,1)*0.85);
  }

  // progress rail (act-based, subtle)
  var frac;
  if(state.act===1) frac = clamp(state.actTime/D1,0,1)*0.25;
  else if(state.act===2){
    var denom = state.act2Phase==="align" ? 16400 : (state.act2Phase==="snap"?SNAP_MS:REVEAL_MS);
    var local = state.act2Phase==="align" ? clamp(state.act2PhaseTime/16400,0,1) : clamp(state.act2PhaseTime/denom,0,1);
    var phaseBase = state.act2Phase==="align"?0:(state.act2Phase==="snap"?0.7:0.85);
    frac = 0.25 + (phaseBase + local*0.15)*0.25;
  }
  else if(state.act===3) frac = 0.62 + clamp(state.actTime/6000,0,0.13);
  else frac = 0.80 + clamp(state.actTime/D4,0,1)*0.20;
  elProgressDot.style.top = (clamp(frac,0,1)*100)+"%";
}

/* ---------------------------------------------------------------------
   Main loop + visibility handling
--------------------------------------------------------------------- */
var rafId = null;
var lastTs = null;

function frame(ts){
  rafId = requestAnimationFrame(frame);
  if(document.hidden) { lastTs = null; return; }
  if(lastTs === null) lastTs = ts;
  var dt = ts - lastTs;
  lastTs = ts;
  dt = Math.min(dt, 50);
  if(dt > 0) tick(dt);
  render();
  syncDOM();
}
rafId = requestAnimationFrame(frame);

document.addEventListener("visibilitychange", function(){
  if(!document.hidden) lastTs = null;
});

/* ---------------------------------------------------------------------
   Self test
--------------------------------------------------------------------- */
function runSelfTest(){
  var tests = [];
  function check(name, pass, detail){
    tests.push({ name: name, passed: !!pass, detail: detail || "" });
  }

  function forceResolveAct2(){
    applyFragmentValue(0, FRAGMENT_TARGET, true);
    applyFragmentValue(1, FRAGMENT_TARGET, true);
    applyFragmentValue(2, FRAGMENT_TARGET, true);
    checkAct2PhaseTimeThresholds();
    tick(HOLD_TIME + 60);
    tick(SNAP_MS + 60);
    tick(REVEAL_MS + 60);
  }

  // 1. deterministic reset
  reset(217);
  var fragsA = state.fragments.slice();
  var rainSampleA = state.rain.slice(0,3);
  reset(217);
  var fragsB = state.fragments.slice();
  var rainSampleB = state.rain.slice(0,3);
  var detReset = JSON.stringify(fragsA) === JSON.stringify(fragsB) &&
                 JSON.stringify(rainSampleA) === JSON.stringify(rainSampleB);
  check("deterministic-reset", detReset);

  // 2. ordered act progression + fragment gating
  reset(217);
  var okOrder = state.act === 1;
  seek(D1 + 5);
  okOrder = okOrder && state.act === 2;
  var gatedBefore = snapshot().choiceAvailable === false;
  var choiceNoEffect = choose("answer") === false && state.selectedEnding === null;
  forceResolveAct2();
  okOrder = okOrder && state.act === 3;
  check("act-order-progression", okOrder);
  check("fragment-gating", gatedBefore && choiceNoEffect);

  // 3. both endings reachable
  var choseAnswer = choose("answer");
  var reachedAnswer = choseAnswer && state.act === 4 && state.selectedEnding === "answer";
  tick(D4 + 20);
  var answerCompleted = state.completed === true;
  check("answer-ending-reachable", reachedAnswer && answerCompleted);

  reset(217);
  seek(D1 + 5);
  forceResolveAct2();
  var choseSilent = choose("silent");
  var reachedSilent = choseSilent && state.act === 4 && state.selectedEnding === "silent";
  tick(D4 + 20);
  var silentCompleted = state.completed === true;
  check("silent-ending-reachable", reachedSilent && silentCompleted);

  // 4. replay
  reset(217);
  check("replay-resets-state", state.act === 1 && state.actTime === 0 && state.completed === false && state.selectedEnding === null);

  // 5. autoplay toggle
  setAutoplay(true, "silent");
  var ap1 = state.autoplay.enabled === true && state.autoplay.ending === "silent";
  setAutoplay(false);
  var ap2 = state.autoplay.enabled === false;
  setAutoplay(true, "answer");
  check("autoplay-toggle", ap1 && ap2 && state.autoplay.enabled === true && state.autoplay.ending === "answer");

  // 6. automatic startup configuration
  var bootOk = !!INITIAL_BOOT_SNAPSHOT &&
    INITIAL_BOOT_SNAPSHOT.seed === 217 &&
    INITIAL_BOOT_SNAPSHOT.act === 1 &&
    INITIAL_BOOT_SNAPSHOT.actTimeMs === 0 &&
    INITIAL_BOOT_SNAPSHOT.autoplay.enabled === true &&
    INITIAL_BOOT_SNAPSHOT.autoplay.ending === "answer";
  check("automatic-startup-configuration", bootOk);

  // 7. finite numeric state
  var snap = snapshot();
  var finiteOk = Number.isFinite(snap.actTimeMs) && Number.isFinite(snap.seed) &&
    snap.fragments.every(function(v){ return Number.isFinite(v); });
  check("finite-numeric-state", finiteOk);

  var passed = tests.every(function(t){ return t.passed; });

  // restore normal automatic-start state
  reset(DEFAULT_SEED);
  setAutoplay(true, "answer");

  return { passed: passed, tests: tests };
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
reset(DEFAULT_SEED);
setAutoplay(true, "answer");
INITIAL_BOOT_SNAPSHOT = snapshot();

window.__LAST_SIGNAL__ = {
  reset: reset,
  setAutoplay: setAutoplay,
  seek: seek,
  alignFragment: alignFragment,
  choose: choose,
  snapshot: snapshot,
  runSelfTest: runSelfTest
};

})();
</script>
