<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Codex</title>
  <style>
    :root {
      --ink: #07090a;
      --night: #0b1113;
      --paper: #e9e0ca;
      --ash: #9a9a8e;
      --oxide: #dd6848;
      --signal: #92ded1;
      --line: rgba(233, 224, 202, .22);
      --safe-bottom: max(22px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Roboto Mono", monospace;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      border: 0;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 5px;
    }

    #experience {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      background: var(--ink);
    }

    #world {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .grain, .vignette, .letterbox {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      z-index: 2;
      opacity: .08;
      background-image:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .38) 0 .45px, transparent .7px),
        radial-gradient(circle at 70% 80%, rgba(255, 255, 255, .28) 0 .4px, transparent .65px);
      background-size: 4px 5px, 7px 6px;
      mix-blend-mode: soft-light;
    }

    .vignette {
      z-index: 3;
      box-shadow: inset 0 0 14vw 5vw rgba(0, 0, 0, .78);
    }

    .letterbox {
      z-index: 4;
      border-top: clamp(8px, 2.5vh, 26px) solid #030404;
      border-bottom: clamp(8px, 2.5vh, 26px) solid #030404;
    }

    .model-mark {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 28px;
      padding: 32px;
      text-align: center;
      background: rgba(4, 7, 8, .16);
      transition: opacity 1.4s ease, visibility 1.4s;
    }

    .model-mark.is-gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .model-mark h1 {
      margin: 0;
      color: var(--paper);
      font: 300 clamp(48px, 10vw, 130px)/.82 Georgia, "Times New Roman", serif;
      letter-spacing: -.07em;
      text-shadow: 0 0 40px rgba(221, 104, 72, .13);
    }

    .start-button, .continue-button {
      position: relative;
      min-height: 44px;
      padding: 11px 2px;
      background: transparent;
      color: rgba(233, 224, 202, .78);
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .start-button::after, .continue-button::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 4px;
      left: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(.35);
      transition: transform .45s ease;
    }

    .start-button:hover::after, .continue-button:hover::after,
    .start-button:focus-visible::after, .continue-button:focus-visible::after { transform: scaleX(1); }

    .chapter {
      position: absolute;
      z-index: 7;
      top: max(32px, calc(env(safe-area-inset-top) + 26px));
      left: clamp(22px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(233, 224, 202, .52);
      font-size: 9px;
      letter-spacing: .25em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .chapter.is-visible { opacity: 1; transform: translateY(0); }

    .chapter::before {
      content: "";
      width: 30px;
      height: 1px;
      background: currentColor;
    }

    .caption-wrap {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: clamp(84px, 13vh, 140px);
      width: min(720px, calc(100% - 44px));
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .caption {
      min-height: 2.4em;
      margin: 0;
      color: var(--paper);
      font: 400 clamp(17px, 2vw, 26px)/1.45 Georgia, "Times New Roman", serif;
      letter-spacing: .015em;
      text-wrap: balance;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .8s ease, transform .8s ease;
      text-shadow: 0 2px 16px #000;
    }

    .caption.is-visible { opacity: 1; transform: translateY(0); }

    .continue-button {
      z-index: 9;
      display: block;
      margin: 16px auto 0;
      opacity: 0;
      transform: translateY(7px);
      visibility: hidden;
      transition: opacity .7s ease, transform .7s ease, visibility .7s;
      pointer-events: auto;
    }

    .continue-button.is-visible {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .fragments {
      position: absolute;
      z-index: 10;
      right: 50%;
      bottom: var(--safe-bottom);
      width: min(690px, calc(100% - 40px));
      transform: translate(50%, 18px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .8s ease, transform .8s ease, visibility .8s;
    }

    .fragments.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(50%, 0);
    }

    .fragment-instruction {
      margin: 0 0 9px;
      color: rgba(233, 224, 202, .42);
      font-size: 8px;
      letter-spacing: .22em;
      text-align: right;
      text-transform: uppercase;
    }

    .fragment-row {
      display: grid;
      grid-template-columns: 86px 1fr 64px;
      align-items: center;
      gap: 12px;
      min-height: 34px;
      border-top: 1px solid rgba(233, 224, 202, .13);
    }

    .fragment-row:last-child { border-bottom: 1px solid rgba(233, 224, 202, .13); }

    .fragment-name, .fragment-status {
      color: rgba(233, 224, 202, .58);
      font-size: 8px;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .fragment-status { text-align: right; }
    .fragment-row.is-locked .fragment-name, .fragment-row.is-locked .fragment-status { color: var(--signal); }

    .range-wrap {
      position: relative;
      display: flex;
      align-items: center;
      height: 34px;
    }

    .range-wrap::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: var(--target);
      width: 1px;
      background: rgba(146, 222, 209, .5);
      box-shadow: 0 0 7px rgba(146, 222, 209, .38);
      pointer-events: none;
    }

    .fragment-range {
      width: 100%;
      height: 24px;
      margin: 0;
      appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: pan-y;
    }

    .fragment-range::-webkit-slider-runnable-track {
      height: 1px;
      background: rgba(233, 224, 202, .25);
    }

    .fragment-range::-moz-range-track {
      height: 1px;
      background: rgba(233, 224, 202, .25);
    }

    .fragment-range::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      margin-top: -7px;
      appearance: none;
      border: 1px solid var(--paper);
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 3px rgba(7, 9, 10, .65);
    }

    .fragment-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 1px solid var(--paper);
      border-radius: 50%;
      background: var(--ink);
    }

    .fragment-row.is-locked .fragment-range::-webkit-slider-thumb {
      border-color: var(--signal);
      background: var(--signal);
      box-shadow: 0 0 12px rgba(146, 222, 209, .75);
    }

    .message-reveal {
      position: absolute;
      z-index: 11;
      top: 37%;
      left: 50%;
      width: min(820px, calc(100% - 42px));
      margin: 0;
      color: #c7fff5;
      font-size: clamp(15px, 2.3vw, 29px);
      font-weight: 500;
      letter-spacing: clamp(.12em, 1vw, .34em);
      line-height: 1.5;
      text-align: center;
      text-shadow: 0 0 11px rgba(146, 222, 209, .88), 0 0 32px rgba(146, 222, 209, .42);
      transform: translate(-50%, 10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease, transform 1.1s ease, visibility 1.1s;
      pointer-events: none;
    }

    .message-reveal.is-visible { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    .choice-panel {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: min(8vw, 100px);
      width: min(720px, calc(100% - 44px));
      transform: translate(-50%, -26%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s;
    }

    .choice-panel.is-visible { opacity: 1; visibility: visible; }

    .choice-button {
      min-height: 82px;
      padding: 18px 10px;
      border-top: 1px solid rgba(233, 224, 202, .38);
      border-bottom: 1px solid rgba(233, 224, 202, .14);
      background: rgba(3, 5, 6, .5);
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      transition: color .35s ease, border-color .35s ease, background-color .35s ease, transform .35s ease;
    }

    .choice-button:hover, .choice-button:focus-visible {
      color: var(--signal);
      border-color: var(--signal);
      background: rgba(14, 31, 31, .72);
      transform: translateY(-3px);
    }

    .choice-button[data-ending="silent"]:hover,
    .choice-button[data-ending="silent"]:focus-visible { color: #d2bba6; border-color: #9c7767; background: rgba(28, 18, 15, .72); }

    .ending-nav {
      position: absolute;
      z-index: 11;
      right: clamp(22px, 5vw, 72px);
      bottom: max(36px, calc(env(safe-area-inset-bottom) + 28px));
      display: flex;
      gap: 24px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease, visibility 1s;
    }

    .ending-nav.is-visible { opacity: 1; visibility: visible; transform: translateY(0); }

    .ending-nav button {
      padding: 10px 0;
      background: transparent;
      color: rgba(233, 224, 202, .64);
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .ending-nav button:hover, .ending-nav button:focus-visible { color: var(--paper); }

    .progress {
      position: absolute;
      z-index: 9;
      bottom: max(38px, calc(env(safe-area-inset-bottom) + 28px));
      left: clamp(22px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 8px;
      height: 12px;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .progress.is-visible { opacity: .72; }

    .progress span {
      display: block;
      width: 5px;
      height: 5px;
      border: 1px solid rgba(233, 224, 202, .35);
      border-radius: 50%;
      transition: width .6s ease, border-color .6s ease, background-color .6s ease;
    }

    .progress span.is-past { background: rgba(233, 224, 202, .38); }
    .progress span.is-current { width: 15px; border-color: var(--signal); border-radius: 8px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .caption-wrap { bottom: 128px; }
      .caption { font-size: clamp(16px, 4.6vw, 21px); }
      .fragments { width: calc(100% - 28px); bottom: calc(var(--safe-bottom) + 4px); }
      .fragment-row { grid-template-columns: 66px 1fr 50px; gap: 8px; }
      .fragment-name, .fragment-status { font-size: 7px; letter-spacing: .12em; }
      .fragment-instruction { text-align: left; }
      .message-reveal { top: 33%; font-size: 14px; line-height: 1.8; }
      .choice-panel { gap: 14px; transform: translate(-50%, -15%); }
      .choice-button { min-height: 92px; padding: 14px 6px; font-size: 9px; letter-spacing: .18em; }
      .ending-nav { right: 20px; left: 20px; justify-content: flex-end; gap: 18px; }
      .progress { bottom: auto; top: max(36px, calc(env(safe-area-inset-top) + 28px)); left: auto; right: 20px; }
      .chapter { max-width: 55vw; line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
      .grain { opacity: .045; }
    }
  </style>
</head>
<body>
  <main id="experience" aria-label="The Last Signal interactive visual story">
    <canvas id="world" aria-label="A storm-battered listening station, its lone operator, and a receiver waking after thirty years"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="letterbox" aria-hidden="true"></div>

    <section class="model-mark" id="modelMark" aria-labelledby="modelTitle">
      <h1 id="modelTitle">Codex</h1>
      <button class="start-button" id="startButton" type="button">Enter the station</button>
    </section>

    <div class="chapter" id="chapter" aria-hidden="true"></div>

    <div class="caption-wrap">
      <p class="caption" id="caption" aria-live="polite"></p>
      <button class="continue-button" id="continueButton" type="button">Approach the receiver</button>
    </div>

    <section class="fragments" id="fragments" aria-label="Align the three signal fragments">
      <p class="fragment-instruction">Drag the carriers into their etched marks · Arrow keys fine-tune</p>
      <div class="fragment-row" data-fragment="0">
        <label class="fragment-name" for="fragment0">Fragment I</label>
        <span class="range-wrap"><input class="fragment-range" id="fragment0" type="range" min="0" max="1000" step="1" value="0"></span>
        <output class="fragment-status" for="fragment0">Drifting</output>
      </div>
      <div class="fragment-row" data-fragment="1">
        <label class="fragment-name" for="fragment1">Fragment II</label>
        <span class="range-wrap"><input class="fragment-range" id="fragment1" type="range" min="0" max="1000" step="1" value="0"></span>
        <output class="fragment-status" for="fragment1">Drifting</output>
      </div>
      <div class="fragment-row" data-fragment="2">
        <label class="fragment-name" for="fragment2">Fragment III</label>
        <span class="range-wrap"><input class="fragment-range" id="fragment2" type="range" min="0" max="1000" step="1" value="0"></span>
        <output class="fragment-status" for="fragment2">Drifting</output>
      </div>
    </section>

    <p class="message-reveal" id="messageReveal" aria-live="assertive">WE REMEMBER YOUR SKY.</p>

    <section class="choice-panel" id="choicePanel" aria-label="Choose the operator's response">
      <button class="choice-button" type="button" data-ending="answer">Answer</button>
      <button class="choice-button" type="button" data-ending="silent">Stay silent</button>
    </section>

    <nav class="ending-nav" id="endingNav" aria-label="Ending controls">
      <button id="replayButton" type="button">Replay</button>
      <button id="alternateButton" type="button">See the other ending</button>
    </nav>

    <div class="progress" id="progress" aria-label="Story progress: act 1 of 3">
      <span></span><span></span><span></span>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("world");
      const ctx = canvas.getContext("2d", { alpha: false });
      const modelMark = document.getElementById("modelMark");
      const startButton = document.getElementById("startButton");
      const chapter = document.getElementById("chapter");
      const caption = document.getElementById("caption");
      const continueButton = document.getElementById("continueButton");
      const fragmentsPanel = document.getElementById("fragments");
      const fragmentRows = [...document.querySelectorAll(".fragment-row")];
      const fragmentInputs = [...document.querySelectorAll(".fragment-range")];
      const messageReveal = document.getElementById("messageReveal");
      const choicePanel = document.getElementById("choicePanel");
      const choiceButtons = [...document.querySelectorAll(".choice-button")];
      const endingNav = document.getElementById("endingNav");
      const replayButton = document.getElementById("replayButton");
      const alternateButton = document.getElementById("alternateButton");
      const progress = document.getElementById("progress");
      const progressMarks = [...progress.children];
      const status = document.getElementById("status");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      const FIXED_STEP = 20;
      const ACT_NAMES = ["prologue", "receiver", "message", "choice", "ending"];
      const CHAPTERS = ["", "Act I · The receiver", "Act II · The message", "Act III · The choice", "Aftermath"];
      const DEFAULT_SEED = 21730;
      const config = { autoplay: false, ending: "answer" };

      let width = 0;
      let height = 0;
      let dpr = 1;
      let lastFrame = performance.now();
      let accumulator = 0;
      let weather = null;
      let state = null;
      let shownCaption = "";

      function clamp(value, min = 0, max = 1) { return Math.max(min, Math.min(max, value)); }
      function mix(a, b, t) { return a + (b - a) * t; }
      function smooth(t) { t = clamp(t); return t * t * (3 - 2 * t); }
      function easeOut(t) { return 1 - Math.pow(1 - clamp(t), 3); }
      function hash(seed, index) {
        let x = (seed ^ Math.imul(index + 1, 0x9e3779b1)) >>> 0;
        x ^= x >>> 16;
        x = Math.imul(x, 0x21f0aaad);
        x ^= x >>> 15;
        x = Math.imul(x, 0x735a2d97);
        x ^= x >>> 15;
        return (x >>> 0) / 4294967296;
      }

      function makeWeather(seed) {
        const drops = [];
        for (let i = 0; i < 170; i++) {
          drops.push({
            x: hash(seed, i * 7 + 1),
            y: hash(seed, i * 7 + 2),
            speed: 0.09 + hash(seed, i * 7 + 3) * 0.17,
            length: 8 + hash(seed, i * 7 + 4) * 24,
            drift: 0.12 + hash(seed, i * 7 + 5) * 0.18,
            alpha: 0.12 + hash(seed, i * 7 + 6) * 0.28
          });
        }
        const flashes = [];
        for (let i = 0; i < 7; i++) flashes.push(700 + i * 2100 + hash(seed, 1400 + i) * 900);
        return { drops, flashes, cloudOffset: hash(seed, 2001) * 1000, sway: .7 + hash(seed, 2002) * .65 };
      }

      function deriveTargets(seed) {
        return [
          .18 + hash(seed, 301) * .20,
          .43 + hash(seed, 302) * .16,
          .68 + hash(seed, 303) * .18
        ];
      }

      function deriveFragments(seed, targets) {
        return targets.map((target, i) => {
          const direction = hash(seed, 410 + i) > .5 ? 1 : -1;
          let value = target + direction * (.22 + hash(seed, 420 + i) * .24);
          if (value < .03 || value > .97) value = target - direction * (.24 + hash(seed, 430 + i) * .18);
          return clamp(value, .02, .98);
        });
      }

      function createState(seed) {
        const integerSeed = Number.isFinite(Number(seed)) ? (Math.trunc(Number(seed)) | 0) : DEFAULT_SEED;
        const targets = deriveTargets(integerSeed);
        return {
          seed: integerSeed,
          act: 0,
          actTime: 0,
          totalTime: 0,
          fragments: deriveFragments(integerSeed, targets),
          targets,
          aligned: [false, false, false],
          resolved: false,
          resolveTime: null,
          choiceAvailable: false,
          ending: null,
          complete: false
        };
      }

      function reset(seed = DEFAULT_SEED) {
        state = createState(seed);
        weather = makeWeather(state.seed);
        shownCaption = "";
        accumulator = 0;
        lastFrame = performance.now();
        syncUI(true);
        draw();
        return snapshot();
      }

      function setAct(act) {
        state.act = act;
        state.actTime = 0;
        state.choiceAvailable = false;
        if (act < 4) {
          state.ending = null;
          state.complete = false;
        }
        shownCaption = "";
        syncUI(true);
      }

      function startStory() {
        if (state.act !== 0) return false;
        setAct(1);
        status.textContent = "Act one. The receiver.";
        return true;
      }

      function advance() {
        if (state.act === 0) return startStory();
        if (state.act === 1 && state.actTime >= 12000) {
          setAct(2);
          status.textContent = "Act two. Align the three signal fragments.";
          return true;
        }
        if (state.act === 2 && state.resolved && state.actTime - state.resolveTime >= 3200) {
          setAct(3);
          status.textContent = "Act three. Choose whether to answer.";
          return true;
        }
        return false;
      }

      function alignFragment(index, value) {
        index = Math.trunc(Number(index));
        value = Number(value);
        if (state.act !== 2 || state.resolved || index < 0 || index > 2 || !Number.isFinite(value)) return false;
        state.fragments[index] = clamp(value);
        state.aligned[index] = Math.abs(state.fragments[index] - state.targets[index]) <= .035;
        if (state.aligned.every(Boolean)) {
          state.fragments = state.targets.slice();
          state.aligned = [true, true, true];
          state.resolved = true;
          state.resolveTime = state.actTime;
          status.textContent = "Signal resolved. We remember your sky.";
        }
        syncFragmentUI();
        syncUI();
        return true;
      }

      function choose(ending) {
        if (ending !== "answer" && ending !== "silent") return false;
        if (state.act !== 3 || !state.choiceAvailable) return false;
        state.ending = ending;
        state.act = 4;
        state.actTime = 0;
        state.choiceAvailable = false;
        state.complete = false;
        shownCaption = "";
        status.textContent = ending === "answer" ? "The operator answers." : "The operator stays silent.";
        syncUI(true);
        return true;
      }

      function setAutoplay(enabled, ending = config.ending) {
        if (ending !== "answer" && ending !== "silent") return false;
        config.autoplay = Boolean(enabled);
        config.ending = ending;
        return true;
      }

      function seek(milliseconds) {
        const value = Number(milliseconds);
        if (!Number.isFinite(value)) return snapshot();
        const limits = [6000, 24000, 45000, 60000, 22000];
        state.actTime = clamp(value, 0, limits[state.act]);
        if (state.act === 3) state.choiceAvailable = state.actTime >= 2200;
        if (state.act === 4) state.complete = state.actTime >= 16000;
        syncUI(true);
        draw();
        return snapshot();
      }

      function snapshot() {
        return {
          seed: state.seed,
          act: ACT_NAMES[state.act],
          actTime: state.actTime,
          fragmentState: {
            values: state.fragments.slice(),
            targets: state.targets.slice(),
            aligned: state.aligned.slice(),
            resolved: state.resolved
          },
          choiceAvailable: state.choiceAvailable,
          selectedEnding: state.ending,
          completionState: state.complete
        };
      }

      function handleAutoplay() {
        if (!config.autoplay) return;
        if (state.act === 0 && state.actTime >= 3000) startStory();
        else if (state.act === 1 && state.actTime >= 22000) advance();
        else if (state.act === 2 && !state.resolved) {
          if (state.actTime >= 5000 && !state.aligned[0]) alignFragment(0, state.targets[0]);
          if (state.actTime >= 8500 && !state.aligned[1]) alignFragment(1, state.targets[1]);
          if (state.actTime >= 12000 && !state.aligned[2]) alignFragment(2, state.targets[2]);
        } else if (state.act === 3 && state.choiceAvailable && state.actTime >= 6500) choose(config.ending);
      }

      function update(dt) {
        state.actTime += dt;
        state.totalTime += dt;
        if (state.act === 2 && state.resolved && state.actTime - state.resolveTime >= 6500) advance();
        if (state.act === 3 && state.actTime >= 2200) state.choiceAvailable = true;
        if (state.act === 4 && state.actTime >= 16000) state.complete = true;
        handleAutoplay();
      }

      function frame(now) {
        const elapsed = Math.min(100, Math.max(0, now - lastFrame));
        lastFrame = now;
        accumulator += elapsed;
        while (accumulator >= FIXED_STEP) {
          update(FIXED_STEP);
          accumulator -= FIXED_STEP;
        }
        syncUI();
        draw();
        requestAnimationFrame(frame);
      }

      function captionForState() {
        const t = state.actTime;
        if (state.act === 1) {
          if (t < 3200) return "One operator kept watch where the maps ended.";
          if (t < 7600) return "Thirty years of weather. Thirty years of silence.";
          if (t < 14500) return "At 02:17, the dead receiver began to glow.";
          return "It was not a voice. Not yet.";
        }
        if (state.act === 2) {
          if (state.resolved) return t - state.resolveTime < 2300 ? "The storm held its breath." : "The message had crossed thirty years intact.";
          if (t < 2700) return "The signal arrived broken across three carriers.";
          return "Bring the fragments into phase.";
        }
        if (state.act === 3) {
          if (t < 2200) return "The channel stayed open.";
          return "No protocol remained. Only the choice.";
        }
        if (state.act === 4 && state.ending === "answer") {
          if (t < 4000) return "The operator keyed the transmitter.";
          if (t < 10500) return "A small human answer climbed into the storm.";
          return "Somewhere beyond the weather, something answered with light.";
        }
        if (state.act === 4 && state.ending === "silent") {
          if (t < 4200) return "The operator lowered one hand.";
          if (t < 10800) return "The signal thinned, one pale ring at a time.";
          return "By dawn the receiver was dark. The message was not gone.";
        }
        return "";
      }

      function syncFragmentUI() {
        fragmentRows.forEach((row, i) => {
          const locked = state.aligned[i];
          row.classList.toggle("is-locked", locked);
          row.querySelector(".range-wrap").style.setProperty("--target", `${state.targets[i] * 100}%`);
          row.querySelector(".fragment-status").textContent = locked ? "In phase" : "Drifting";
          fragmentInputs[i].value = String(Math.round(state.fragments[i] * 1000));
          fragmentInputs[i].disabled = state.resolved;
        });
      }

      function syncUI(force = false) {
        const currentCaption = captionForState();
        if (force || currentCaption !== shownCaption) {
          shownCaption = currentCaption;
          caption.classList.remove("is-visible");
          caption.textContent = currentCaption;
          if (currentCaption) requestAnimationFrame(() => caption.classList.add("is-visible"));
        }

        modelMark.classList.toggle("is-gone", state.act !== 0);
        chapter.textContent = CHAPTERS[state.act];
        chapter.classList.toggle("is-visible", state.act > 0);
        continueButton.classList.toggle("is-visible", state.act === 1 && state.actTime >= 13500);
        continueButton.textContent = "Approach the receiver";
        fragmentsPanel.classList.toggle("is-visible", state.act === 2 && state.actTime >= 2300 && !state.resolved);
        messageReveal.classList.toggle("is-visible", state.act === 2 && state.resolved);
        choicePanel.classList.toggle("is-visible", state.act === 3 && state.choiceAvailable);
        endingNav.classList.toggle("is-visible", state.act === 4 && state.complete);
        progress.classList.toggle("is-visible", state.act > 0 && !(state.act === 4 && state.complete));

        const progressAct = state.act === 4 ? 3 : state.act;
        progressMarks.forEach((mark, i) => {
          mark.classList.toggle("is-past", i + 1 < progressAct);
          mark.classList.toggle("is-current", i + 1 === progressAct);
        });
        progress.setAttribute("aria-label", `Story progress: act ${Math.min(3, Math.max(1, progressAct))} of 3`);
        syncFragmentUI();
      }

      function resize() {
        width = innerWidth;
        height = innerHeight;
        dpr = Math.min(devicePixelRatio || 1, 1.6);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        draw();
      }

      function sceneTransform() {
        const scale = Math.max(width / 1000, height / 600);
        return { scale, x: (width - 1000 * scale) / 2, y: (height - 600 * scale) / 2 };
      }

      function beginScene() {
        const tr = sceneTransform();
        ctx.setTransform(dpr * tr.scale, 0, 0, dpr * tr.scale, dpr * tr.x, dpr * tr.y);
      }

      function lightningIntensity(time) {
        const loop = time % 16800;
        let amount = 0;
        for (const flash of weather.flashes) {
          const distance = Math.abs(loop - flash);
          if (distance < 130) amount = Math.max(amount, 1 - distance / 130);
          const echo = Math.abs(loop - (flash + 190));
          if (echo < 70) amount = Math.max(amount, .55 * (1 - echo / 70));
        }
        return reducedMotion ? amount * .16 : amount;
      }

      function drawSky(time, answerLift = 0) {
        const flash = lightningIntensity(time);
        const sky = ctx.createLinearGradient(0, 0, 0, 600);
        sky.addColorStop(0, `rgb(${Math.round(8 + answerLift * 8 + flash * 45)}, ${Math.round(16 + answerLift * 18 + flash * 48)}, ${Math.round(19 + answerLift * 23 + flash * 49)})`);
        sky.addColorStop(.68, `rgb(${Math.round(17 + answerLift * 13 + flash * 36)}, ${Math.round(24 + answerLift * 21 + flash * 37)}, ${Math.round(25 + answerLift * 27 + flash * 37)})`);
        sky.addColorStop(1, "#090c0d");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, 1000, 600);

        ctx.save();
        ctx.globalAlpha = .22 + flash * .25;
        ctx.fillStyle = "#6f8585";
        for (let i = 0; i < 8; i++) {
          const drift = ((time * (.002 + i * .00012) + weather.cloudOffset + i * 153) % 1400) - 260;
          ctx.beginPath();
          ctx.ellipse(drift, 70 + i * 24, 240 + i * 18, 48 + i * 4, -.08, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        if (flash > .12) {
          ctx.save();
          ctx.strokeStyle = `rgba(220,235,229,${flash * .42})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(790, 0);
          ctx.lineTo(745, 90);
          ctx.lineTo(772, 93);
          ctx.lineTo(715, 196);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawRain(time, inside = false) {
        const count = reducedMotion ? 38 : weather.drops.length;
        ctx.save();
        ctx.lineCap = "round";
        for (let i = 0; i < count; i++) {
          const drop = weather.drops[i];
          const y = ((drop.y * 760 + time * drop.speed) % 760) - 80;
          const x = (drop.x * 1160 + time * drop.speed * drop.drift) % 1160 - 80;
          ctx.strokeStyle = `rgba(173,197,196,${drop.alpha * (inside ? .34 : 1)})`;
          ctx.lineWidth = inside ? .55 : .8;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - drop.length * .32, y + drop.length);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawRings(x, y, time, strength, color, outward = false) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        for (let i = 0; i < 7; i++) {
          const phase = ((time * (outward ? .000055 : .000035) + i / 7) % 1);
          const radius = 10 + phase * (outward ? 290 : 100);
          ctx.globalAlpha = strength * Math.sin(phase * Math.PI) * (.9 - i * .06);
          ctx.beginPath();
          ctx.ellipse(x, y, radius, radius * (.42 + i * .012), -.08, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawExterior(time, alpha = 1, answerLift = 0) {
        ctx.save();
        ctx.globalAlpha = alpha;
        drawSky(time, answerLift);

        ctx.fillStyle = "#050708";
        ctx.beginPath();
        ctx.moveTo(0, 485);
        ctx.lineTo(160, 450);
        ctx.lineTo(330, 470);
        ctx.lineTo(510, 438);
        ctx.lineTo(690, 463);
        ctx.lineTo(820, 432);
        ctx.lineTo(1000, 468);
        ctx.lineTo(1000, 600);
        ctx.lineTo(0, 600);
        ctx.fill();

        ctx.fillStyle = "#111617";
        ctx.fillRect(145, 302, 520, 220);
        ctx.fillStyle = "#1a2020";
        ctx.beginPath();
        ctx.moveTo(125, 302);
        ctx.lineTo(205, 260);
        ctx.lineTo(625, 260);
        ctx.lineTo(686, 302);
        ctx.fill();
        ctx.strokeStyle = "rgba(221,215,196,.16)";
        ctx.strokeRect(145.5, 302.5, 519, 219);

        const glow = state.act === 0 ? .05 : clamp((state.act === 1 ? state.actTime - 6500 : 8000) / 2500);
        const windowGlow = ctx.createRadialGradient(467, 380, 8, 467, 380, 115);
        windowGlow.addColorStop(0, `rgba(221,104,72,${.54 * glow})`);
        windowGlow.addColorStop(1, "rgba(18,24,23,0)");
        ctx.fillStyle = windowGlow;
        ctx.fillRect(335, 315, 265, 150);
        ctx.fillStyle = `rgba(${Math.round(24 + glow * 60)},${Math.round(31 + glow * 16)},${Math.round(29 + glow * 5)},.9)`;
        ctx.fillRect(378, 342, 176, 92);
        ctx.strokeStyle = "rgba(233,224,202,.16)";
        ctx.strokeRect(378.5, 342.5, 175, 91);

        drawOperator(448, 432, .48, glow, false);

        const sway = reducedMotion ? 0 : Math.sin(time * .0014) * weather.sway;
        ctx.strokeStyle = "#252c2b";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(424, 265);
        ctx.lineTo(420 + sway, 104);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(370, 180);
        ctx.lineTo(472, 176 + sway);
        ctx.moveTo(389, 139);
        ctx.lineTo(452, 137 + sway);
        ctx.stroke();
        ctx.fillStyle = "#63716e";
        ctx.beginPath();
        ctx.arc(420 + sway, 101, 3.4, 0, Math.PI * 2);
        ctx.fill();
        drawRings(420 + sway, 112, time, .16 + answerLift * .66, answerLift > .1 ? "#a9f8ec" : "#78908d", true);

        drawRain(time, false);
        ctx.restore();
      }

      function drawOperator(x, y, scale, glow, reaching) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = "#030506";
        ctx.beginPath();
        ctx.arc(0, -106, 27, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-28, -82);
        ctx.quadraticCurveTo(-50, -34, -42, 34);
        ctx.lineTo(-29, 108);
        ctx.lineTo(28, 108);
        ctx.lineTo(41, 35);
        ctx.quadraticCurveTo(48, -37, 24, -82);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#050708";
        ctx.lineWidth = 18;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(reaching ? 24 : 20, -42);
        ctx.lineTo(reaching ? 96 : 47, reaching ? -74 : 18);
        ctx.stroke();

        if (glow > 0) {
          ctx.strokeStyle = `rgba(221,104,72,${glow * .48})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, -106, 28, -.8, 1.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(25, -78);
          ctx.quadraticCurveTo(40, -36, 34, 37);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawReceiver(time, glow, resolved, transmit = 0) {
        ctx.save();
        ctx.translate(535, 350);

        const halo = ctx.createRadialGradient(0, -20, 10, 0, -20, 245);
        halo.addColorStop(0, `rgba(${resolved ? "109,214,198" : "218,92,59"},${.18 + glow * .25})`);
        halo.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = halo;
        ctx.fillRect(-270, -260, 540, 500);

        ctx.fillStyle = "#131717";
        ctx.beginPath();
        ctx.moveTo(-190, -154);
        ctx.lineTo(171, -154);
        ctx.lineTo(200, 136);
        ctx.lineTo(-214, 136);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(233,224,202,.19)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#060a0a";
        ctx.fillRect(-158, -119, 296, 153);
        ctx.strokeStyle = resolved ? "rgba(146,222,209,.75)" : `rgba(221,104,72,${.28 + glow * .5})`;
        ctx.strokeRect(-157.5, -118.5, 295, 152);

        ctx.save();
        ctx.beginPath();
        ctx.rect(-155, -116, 290, 147);
        ctx.clip();
        ctx.fillStyle = resolved ? "rgba(22,56,52,.46)" : `rgba(52,20,13,${.25 + glow * .2})`;
        ctx.fillRect(-155, -116, 290, 147);

        for (let i = 0; i < 14; i++) {
          ctx.strokeStyle = "rgba(185,202,194,.045)";
          ctx.beginPath();
          ctx.moveTo(-155, -106 + i * 11);
          ctx.lineTo(135, -106 + i * 11);
          ctx.stroke();
        }

        const carriers = resolved ? state.targets : state.fragments;
        const colors = ["#df6b48", "#cfaa78", "#92ded1"];
        for (let band = 0; band < 3; band++) {
          const error = carriers[band] - state.targets[band];
          const baseY = -73 + band * 46;
          ctx.strokeStyle = colors[band];
          ctx.globalAlpha = resolved ? .7 : .55 + state.aligned[band] * .4;
          ctx.lineWidth = state.aligned[band] ? 1.8 : 1.15;
          ctx.beginPath();
          for (let x = -150; x <= 133; x += 3) {
            const jitter = (hash(state.seed + band * 93, Math.floor((x + 160) / 3) + Math.floor(time / 80)) - .5) * (state.aligned[band] ? 1.5 : 8);
            const wave = Math.sin(x * (.052 + band * .008) + time * .003 + error * 34) * (6 + band * 2);
            const y = baseY + error * 145 + wave + jitter;
            if (x === -150) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = "#070909";
        ctx.fillRect(-170, 51, 323, 52);
        ctx.strokeStyle = "rgba(233,224,202,.13)";
        ctx.strokeRect(-169.5, 51.5, 322, 51);
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i < 3 && state.aligned[i] ? "#92ded1" : i === 4 ? "#a74d35" : "#343b39";
          ctx.beginPath();
          ctx.arc(-134 + i * 31, 77, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = "rgba(233,224,202,.38)";
        ctx.lineWidth = 1.4;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(42 + i * 42, 77, 12, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          const angle = state.fragments[i] * Math.PI * 1.5 + .7;
          ctx.moveTo(42 + i * 42, 77);
          ctx.lineTo(42 + i * 42 + Math.cos(angle) * 9, 77 + Math.sin(angle) * 9);
          ctx.stroke();
        }
        drawRings(0, -42, time, .16 + glow * .17 + transmit * .62, resolved ? "#92ded1" : "#dd6848", transmit > .1);
        ctx.restore();
      }

      function drawInterior(time, alpha = 1, transmit = 0, silentFade = 0) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#080c0d";
        ctx.fillRect(0, 0, 1000, 600);

        ctx.fillStyle = "#111617";
        ctx.fillRect(0, 0, 1000, 455);
        ctx.fillStyle = "#090c0d";
        ctx.beginPath();
        ctx.moveTo(0, 455);
        ctx.lineTo(1000, 410);
        ctx.lineTo(1000, 600);
        ctx.lineTo(0, 600);
        ctx.fill();

        ctx.fillStyle = "#0b1214";
        ctx.fillRect(725, 72, 208, 250);
        ctx.strokeStyle = "rgba(233,224,202,.15)";
        ctx.strokeRect(724.5, 71.5, 209, 251);
        ctx.beginPath();
        ctx.moveTo(828, 72);
        ctx.lineTo(828, 322);
        ctx.moveTo(725, 198);
        ctx.lineTo(933, 198);
        ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.rect(727, 74, 204, 246);
        ctx.clip();
        ctx.translate(707, 30);
        ctx.scale(.34, .46);
        drawSky(time, transmit);
        drawRain(time, false);
        ctx.restore();

        ctx.fillStyle = "rgba(233,224,202,.035)";
        for (let i = 0; i < 7; i++) ctx.fillRect(70 + i * 90, 72 + (i % 2) * 19, 54, 3);

        const receiverGlow = state.act === 1
          ? clamp((state.actTime - 6200) / 2800) * (1 - silentFade)
          : (state.act === 4 && state.ending === "silent" ? 1 - silentFade : 1);
        drawReceiver(time, receiverGlow, state.resolved, transmit);

        const reaching = state.act === 1 && state.actTime > 14000;
        const endingReach = state.act === 4 && state.ending === "answer" && state.actTime < 6200;
        drawOperator(278, 492, .92, receiverGlow, reaching || endingReach);

        ctx.strokeStyle = "rgba(233,224,202,.11)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 94);
        ctx.lineTo(330, 94);
        ctx.lineTo(371, 147);
        ctx.stroke();

        drawRain(time, true);
        ctx.restore();
      }

      function drawEnding(time) {
        const t = state.actTime;
        if (state.ending === "answer") {
          const exterior = smooth((t - 5200) / 4700);
          const transmit = smooth((t - 2200) / 6500);
          drawInterior(time, 1 - exterior, transmit, 0);
          if (exterior > 0) drawExterior(time, exterior, transmit);

          if (t > 8800) {
            const starAlpha = smooth((t - 8800) / 4200);
            ctx.save();
            ctx.globalAlpha = starAlpha;
            ctx.fillStyle = "#cafff5";
            const points = [[694,103],[728,138],[766,95],[804,152],[840,105],[878,136],[910,89],[753,182],[858,194]];
            points.forEach((p, i) => {
              ctx.beginPath();
              ctx.arc(p[0], p[1], 1.2 + hash(state.seed, 700 + i) * 1.7, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.strokeStyle = "rgba(146,222,209,.28)";
            ctx.beginPath();
            points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
            ctx.stroke();
            ctx.restore();
          }
        } else {
          const fade = smooth((t - 2400) / 9800);
          drawInterior(time, 1, 0, fade);
          ctx.save();
          ctx.globalAlpha = smooth((t - 10000) / 5000);
          const dawn = ctx.createLinearGradient(0, 0, 0, 600);
          dawn.addColorStop(0, "rgba(52,53,49,.32)");
          dawn.addColorStop(1, "rgba(147,95,69,.12)");
          ctx.fillStyle = dawn;
          ctx.fillRect(0, 0, 1000, 600);
          ctx.fillStyle = "rgba(239,224,194,.78)";
          ctx.beginPath();
          ctx.arc(864, 119, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          if (t < 12500) drawRings(535, 308, time, .18 * (1 - fade), "#b98c74", false);
        }
      }

      function draw() {
        if (!ctx || !state || !width || !height) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#050708";
        ctx.fillRect(0, 0, width, height);
        beginScene();

        const time = state.totalTime;
        if (state.act === 0) {
          drawExterior(time, 1, 0);
        } else if (state.act === 1) {
          const interior = smooth((state.actTime - 5000) / 6500);
          drawExterior(time, 1 - interior, 0);
          if (interior > 0) drawInterior(time, interior, 0, 0);
        } else if (state.act === 2 || state.act === 3) {
          drawInterior(time, 1, 0, 0);
        } else {
          drawEnding(time);
        }

        const flash = lightningIntensity(time);
        if (flash > .02) {
          ctx.fillStyle = `rgba(223,235,229,${flash * .11})`;
          ctx.fillRect(0, 0, 1000, 600);
        }
      }

      function runFor(milliseconds) {
        const steps = Math.ceil(milliseconds / FIXED_STEP);
        for (let i = 0; i < steps; i++) update(FIXED_STEP);
      }

      function allFinite(value) {
        if (typeof value === "number") return Number.isFinite(value);
        if (Array.isArray(value)) return value.every(allFinite);
        if (value && typeof value === "object") return Object.values(value).every(allFinite);
        return true;
      }

      function runSelfTest() {
        const savedState = JSON.parse(JSON.stringify(state));
        const savedConfig = { ...config };
        const tests = [];
        const test = (name, passed, detail = "") => tests.push({ name, passed: Boolean(passed), detail });
        try {
          config.autoplay = false;
          reset(4417);
          const first = snapshot();
          reset(4417);
          const second = snapshot();
          test("deterministic reset", JSON.stringify(first) === JSON.stringify(second));

          const gatedValue = state.fragments[0];
          alignFragment(0, state.targets[0]);
          test("fragment gating", state.fragments[0] === gatedValue && !state.resolved, "alignment is rejected before act two");

          const order = [state.act];
          startStory();
          order.push(state.act);
          seek(16000);
          advance();
          order.push(state.act);
          state.targets.forEach((target, i) => alignFragment(i, target));
          runFor(9000);
          order.push(state.act);
          test("ordered act progression", JSON.stringify(order) === JSON.stringify([0, 1, 2, 3]), order.join(" → "));
          test("fragment gate opens choice", state.resolved && state.choiceAvailable);

          choose("answer");
          test("answer ending reachable", state.act === 4 && state.ending === "answer");

          reset(4417);
          startStory();
          seek(16000);
          advance();
          state.targets.forEach((target, i) => alignFragment(i, target));
          runFor(9000);
          choose("silent");
          test("silent ending reachable", state.act === 4 && state.ending === "silent");

          reset(4417);
          test("replay returns to beginning", state.act === 0 && !state.complete && state.ending === null);

          reset(90217);
          setAutoplay(true, "silent");
          runFor(90000);
          test("autoplay uses real path", state.act === 4 && state.ending === "silent" && state.complete);
          test("finite numeric state", allFinite(snapshot()));
        } catch (error) {
          tests.push({ name: "self-test execution", passed: false, detail: String(error && error.message ? error.message : error) });
        }

        state = savedState;
        config.autoplay = savedConfig.autoplay;
        config.ending = savedConfig.ending;
        weather = makeWeather(state.seed);
        shownCaption = "";
        syncUI(true);
        draw();
        return { passed: tests.every(item => item.passed), tests };
      }

      startButton.addEventListener("click", startStory);
      continueButton.addEventListener("click", advance);
      fragmentInputs.forEach((input, index) => {
        input.addEventListener("input", () => alignFragment(index, Number(input.value) / 1000));
      });
      choiceButtons.forEach(button => button.addEventListener("click", () => choose(button.dataset.ending)));
      replayButton.addEventListener("click", () => {
        config.autoplay = false;
        reset(state.seed);
        startButton.focus();
      });
      alternateButton.addEventListener("click", () => {
        const alternate = state.ending === "answer" ? "silent" : "answer";
        state.act = 3;
        state.actTime = 2300;
        state.choiceAvailable = true;
        state.complete = false;
        state.ending = null;
        syncUI(true);
        choose(alternate);
      });

      document.addEventListener("keydown", event => {
        if (event.key !== " " && event.key !== "Enter") return;
        const target = event.target;
        if (target instanceof HTMLButtonElement || target instanceof HTMLInputElement) return;
        if (state.act === 0 || (state.act === 1 && state.actTime >= 12000) || (state.act === 2 && state.resolved)) {
          event.preventDefault();
          advance();
        }
      });

      document.addEventListener("visibilitychange", () => {
        lastFrame = performance.now();
        accumulator = 0;
      });
      addEventListener("resize", resize, { passive: true });

      window.__LAST_SIGNAL__ = Object.freeze({
        reset,
        setAutoplay,
        seek,
        alignFragment,
        choose,
        snapshot,
        runSelfTest
      });

      reset(DEFAULT_SEED);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
