<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Claude Fable 5</title>
<style>
  :root{
    --gold:#f0d9a0;
    --gold-dim:rgba(240,217,160,.62);
    --ink:#d9d2be;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#04060b;overflow:hidden;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
  .ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
  .ui>*{opacity:0}
  .mono{
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    letter-spacing:.24em;font-size:clamp(10px,1.5vmin,13px);
    color:var(--gold-dim);text-transform:uppercase;font-weight:400;
  }
  .serif{font-family:ui-serif,"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif}
  #titleCard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;text-align:center;padding:0 6vw}
  #titleCard .kicker{margin:0;opacity:.75}
  #titleCard h1{
    margin:0;font-family:ui-serif,"Iowan Old Style",Palatino,Georgia,serif;font-weight:300;
    font-size:clamp(28px,6.4vmin,64px);letter-spacing:.06em;color:#ece4cd;
    text-shadow:0 2px 40px rgba(240,200,130,.18);
  }
  #slate{position:absolute;left:5vw;top:6vh;margin:0}
  #clock{position:absolute;right:5vw;top:6vh;margin:0;font-size:clamp(12px,2vmin,16px);letter-spacing:.3em}
  #clock.lit{color:#ffd9a0;text-shadow:0 0 18px rgba(255,190,110,.55)}
  #sublabel{position:absolute;left:50%;top:11vh;transform:translateX(-50%);margin:0;text-align:center;width:90vw}
  #narration{
    position:absolute;left:50%;bottom:18vh;transform:translateX(-50%);margin:0;
    width:min(84vw,580px);text-align:center;font-style:italic;
    font-size:clamp(16px,2.6vmin,21px);line-height:1.55;color:var(--ink);
    text-shadow:0 1px 22px rgba(0,0,0,.85);
  }
  #narration.glowline{color:#f4dfae;text-shadow:0 0 26px rgba(255,205,130,.35),0 1px 22px rgba(0,0,0,.85)}
  #message{
    position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);margin:0;
    text-align:center;font-family:ui-serif,"Iowan Old Style",Palatino,Georgia,serif;
    letter-spacing:.3em;text-indent:.3em;font-size:min(3.4vw,4vmin,38px);
    color:#f6ecd2;text-shadow:0 0 30px rgba(255,210,140,.4);white-space:nowrap;
  }
  #message span{display:inline-block;opacity:0}
  #hint{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);margin:0;text-align:center;letter-spacing:.14em;width:92vw}
  #choices{position:absolute;left:50%;top:56%;transform:translateX(-50%);display:flex;gap:clamp(16px,6vw,64px);flex-wrap:wrap;justify-content:center}
  .key{
    pointer-events:auto;background:rgba(8,12,20,.38);border:1px solid rgba(240,217,160,.42);
    color:#efe3c2;font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.3em;text-indent:.3em;font-size:clamp(11px,1.8vmin,14px);

  }
  .key:hover,.key:focus-visible{
    border-color:#f0d9a0;background:rgba(22,26,36,.55);

  }
  #endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5em;text-align:center;padding:0 6vw}
  #endcard p{margin:0}
  #endLine{font-style:italic;color:#cfc7b2;font-size:clamp(15px,2.4vmin,19px)}
  #endcard .row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .tiny{font-size:10px;letter-spacing:.2em;color:rgba(220,206,170,.4)}
  @media (prefers-reduced-motion: reduce){
    .key{transition:none}
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="ui">
  <div id="titleCard">
    <p class="kicker mono">The Last Signal</p>
    <h1>Claude Fable 5</h1>
  </div>
  <p id="slate" class="mono"></p>
  <p id="clock" class="mono">02:14</p>
  <p id="sublabel" class="mono"></p>
  <p id="narration" class="serif" aria-live="polite"></p>
  <p id="message" aria-live="polite"></p>
  <p id="hint" class="mono"></p>
  <div id="choices">
    <button id="btnAnswer" class="key" type="button">Answer</button>
    <button id="btnSilent" class="key" type="button">Stay Silent</button>
  </div>
  <div id="endcard">
    <p id="endLabel" class="mono"></p>
    <p id="endLine" class="serif"></p>
    <div class="row">
      <button id="btnReplay" class="key" type="button">Replay</button>
      <button id="btnOther" class="key" type="button">The Other Choice</button>
    </div>
    <p class="mono tiny">R — replay &nbsp;·&nbsp; space — skip a beat &nbsp;·&nbsp; the fragments answer to touch</p>
  </div>
</div>
<noscript><p style="color:#cfc7b2;font-family:Georgia,serif;padding:2rem">The Last Signal needs JavaScript to listen.</p></noscript>
<script>
"use strict";
/* ============================================================
   THE LAST SIGNAL — a miniature film for one browser window.
   Fixed-timestep, seed-driven, fully deterministic.
   ============================================================ */

/* ---------- constants ---------- */
const STEP = 1000/60;             // fixed simulation step (ms)
const TOL  = 0.03;                // fragment alignment tolerance
const A1   = 24000;               // act I duration
const REVEAL = 12000;             // act II: alignment -> act III
const A3_SHOW = 2400;             // act III: choice becomes available
const A3_AUTO = 6000;             // act III: autoplay chooses here
const AE   = 24000;               // ending duration
const AUTO_WIN = [[3000,8000],[8600,13600],[14200,19200]];
const MSG  = "WE REMEMBER YOUR SKY.";
const BOOT = { seed:217, autoplay:true, ending:"answer", applied:false };

/* ---------- deterministic randomness ---------- */
function mulberry32(a){
  a |= 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function h1(i, s){
  let x = Math.imul((i|0) ^ Math.imul(s|0, 0x9E3779B1), 0x85EBCA6B);
  x ^= x>>>13; x = Math.imul(x, 0xC2B2AE35); x ^= x>>>16;
  return (x>>>0) / 4294967296;
}

/* ---------- small math helpers ---------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,k)=> a+(b-a)*k;
const rmp   = (t,a,b)=> clamp((t-a)/(b-a),0,1);
const sstep = x => x*x*(3-2*x);
const ez    = (t,a,b)=> sstep(rmp(t,a,b));
const fio   = (t,a,b,c,d)=> sstep(rmp(t,a,b)) * (1-sstep(rmp(t,c,d)));
const mixC  = (A,B,k)=> [lerp(A[0],B[0],k), lerp(A[1],B[1],k), lerp(A[2],B[2],k)];
const css   = (c,a)=> "rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a.toFixed(3)+")";
const r3    = v => Math.round(v*1000)/1000;

/* ---------- world derivation from seed ---------- */
let W = null, S = null;

function deriveWorld(seed){
  const rng = mulberry32(seed);
  const w = { seed, targets:[], inits:[], wave:[] };
  for(let i=0;i<3;i++){
    const target = 0.18 + 0.64*rng();
    const off = 0.30 + 0.28*rng();
    let init = target < 0.5 ? target + off : target - off;
    init = clamp(init, 0.03, 0.97);
    w.targets.push(target); w.inits.push(init);
    w.wave.push({ k: 5 + 2.6*rng(), ph: rng()*Math.PI*2, sp: 0.0009 + 0.0007*rng() });
  }
  w.noise = []; for(let i=0;i<257;i++) w.noise.push(rng());
  w.flashes = [];
  let ft = 2500 + rng()*3000;
  while(ft < 1200000){
    w.flashes.push({ t: ft, x: 0.08+0.84*rng(), s: 0.5+0.5*rng(), j: (rng()*1e9)|0 });
    ft += 3800 + 9500*rng();
  }
  w.stars = []; for(let i=0;i<120;i++) w.stars.push({ x:rng(), y:rng()*0.55, r:0.5+rng()*1.1, tw:rng()*Math.PI*2 });
  w.salt = (rng()*1e9)|0;
  w.grainSeed = (rng()*1e9)|0;
  return w;
}
function noise1(p){
  const f = Math.floor(p), fr = p-f;
  const a = W.noise[((f%256)+256)%256], b = W.noise[(((f+1)%256)+256)%256];
  return a + (b-a)*sstep(fr);
}

/* ---------- state ---------- */
function freshState(seed){
  return {
    seed, act:"act1", t:0, worldT:0, actStartWorld:0,
    frag: W.inits.slice(), locked:false, alignedAt:-1,
    lockT:[-1,-1,-1], sel:0,
    choice:null, completed:false,
    autoplay:false, autoEnding:"answer",
    history:["act1"],
  };
}
function toAct(name){
  S.act = name; S.t = 0; S.actStartWorld = S.worldT;
  if(S.history.length < 32) S.history.push(name);
  if(name === "end") S.completed = true;
}
function closeness(i){
  if(S.locked) return 1;
  return 1 - clamp(Math.abs(S.frag[i]-W.targets[i])/0.35, 0, 1);
}
function fragAligned(i){ return Math.abs(S.frag[i]-W.targets[i]) < TOL; }

function setFrag(i, v){
  i |= 0;
  if(i<0 || i>2 || S.act!=="act2" || S.locked) return false;
  v = Number(v);
  if(!Number.isFinite(v)) return false;
  S.frag[i] = clamp(v, 0, 1);
  return S.frag[i];
}

/* ---------- simulation (fixed step, no DOM) ---------- */
function stepSim(dt){
  S.t += dt; S.worldT += dt;
  if(S.act === "act1"){
    if(S.t >= A1) toAct("act2");
  }
  else if(S.act === "act2"){
    if(!S.locked){
      if(S.autoplay){
        for(let i=0;i<3;i++){
          const win = AUTO_WIN[i];
          if(S.t >= win[1]) { if(!fragAligned(i)) setFrag(i, W.targets[i]); }
          else if(S.t >= win[0]){
            const v = S.frag[i];
            setFrag(i, v + (W.targets[i]-v) * (1 - Math.exp(-dt/700)));
          }
        }
      }
      for(let i=0;i<3;i++){
        if(fragAligned(i)){ if(S.lockT[i] < 0) S.lockT[i] = S.worldT; }
        else S.lockT[i] = -1;
      }
      if(fragAligned(0) && fragAligned(1) && fragAligned(2)){
        S.locked = true; S.alignedAt = S.t;
      }
    } else if(S.t >= S.alignedAt + REVEAL){
      toAct("act3");
    }
  }
  else if(S.act === "act3"){
    if(S.autoplay && !S.choice && S.t >= A3_AUTO) doChoose(S.autoEnding);
  }
  else if(S.act === "ending"){
    if(S.t >= AE) toAct("end");
  }
}
function doChoose(e){
  if(S.act !== "act3" || S.choice || S.t < A3_SHOW) return false;
  if(e !== "answer" && e !== "silent") return false;
  S.choice = e;
  toAct("ending");
  return true;
}
function syncWorldT(){ S.worldT = S.actStartWorld + S.t; }

/* ---------- public deterministic interface ---------- */
function apiReset(seed){
  let n = Math.trunc(Number(seed));
  if(!Number.isFinite(n)) n = BOOT.seed;
  const ap = S ? S.autoplay : false;
  const ae = S ? S.autoEnding : "answer";
  W = deriveWorld(n);
  S = freshState(n);
  S.autoplay = ap; S.autoEnding = ae;
  buildGrain();
  ridgeCache.key = "";
  return apiSnapshot();
}
function apiSetAutoplay(enabled, ending){
  S.autoplay = !!enabled;
  if(ending === "answer" || ending === "silent") S.autoEnding = ending;
  return { enabled: S.autoplay, ending: S.autoEnding };
}
function apiSeek(ms){
  ms = Number(ms);
  if(!Number.isFinite(ms) || ms < 0) ms = 0;
  if(S.act === "act1") S.t = Math.min(ms, A1-1);
  else if(S.act === "act2"){
    S.t = S.locked ? clamp(ms, S.alignedAt, S.alignedAt + REVEAL - 1) : Math.min(ms, 6e6);
  }
  else if(S.act === "act3") S.t = Math.min(ms, 6e6);
  else if(S.act === "ending") S.t = Math.min(ms, AE-1);
  else S.t = Math.min(ms, 6e6);
  syncWorldT();
  return r3(S.t);
}
function apiAlign(index, value){ return setFrag(index, value); }
function apiChoose(e){ return doChoose(e); }
function apiSnapshot(){
  return {
    seed: S.seed,
    act: S.act,
    actTime: r3(S.t),
    worldTime: r3(S.worldT),
    fragments: {
      values: S.frag.map(r3),
      targets: W.targets.map(r3),
      aligned: [0,1,2].map(fragAligned),
      locked: S.locked,
      alignedAt: r3(S.alignedAt),
    },
    messageRevealed: S.act==="act3" || S.act==="ending" || S.act==="end" ||
                     (S.locked && S.t >= S.alignedAt + 1400),
    choiceAvailable: S.act === "act3" && S.t >= A3_SHOW && !S.choice,
    ending: S.choice,
    completed: S.completed,
    autoplay: { enabled: S.autoplay, ending: S.autoEnding },
  };
}
function apiSelfTest(){
  const saved = structuredClone(S);
  const tests = [];
  const T = (name, pass, detail)=> tests.push(detail ? {name, passed:!!pass, detail} : {name, passed:!!pass});
  const adv = ms => { let n = Math.round(ms/STEP); while(n-- > 0) stepSim(STEP); };
  const snapJ = ()=> JSON.stringify(apiSnapshot());
  try{
    // deterministic reset
    apiReset(917); apiSetAutoplay(false);
    adv(5000); const s1 = snapJ();
    apiReset(917); adv(5000); const s2 = snapJ();
    T("deterministic-reset", s1 === s2);
    // seek matches stepping
    apiReset(917); adv(6000); const s3 = snapJ();
    apiReset(917); apiSeek(6000); const s4 = snapJ();
    T("seek-deterministic", s3 === s4);
    // ordered act progression + answer ending via autoplay
    apiReset(917); apiSetAutoplay(true, "answer");
    let g = 0; while(!S.completed && g++ < 20000) stepSim(STEP);
    const hist = S.history.join(">");
    T("act-order", hist === "act1>act2>act3>ending>end", hist);
    T("autoplay-and-answer-ending", S.completed && S.choice === "answer");
    // automatic startup configuration
    T("startup-config", BOOT.seed===217 && BOOT.autoplay===true && BOOT.ending==="answer" && BOOT.applied===true);
    // fragment gating
    apiReset(917); apiSetAutoplay(false);
    adv(A1 + 200);
    const inAct2 = S.act === "act2";
    const rejectedEarly = apiChoose("answer") === false;
    adv(25000);
    const heldWithoutAlign = S.act === "act2" && !S.locked;
    W.targets.forEach((tg,i)=> apiAlign(i, tg));
    adv(400);
    const lockedNow = S.locked;
    adv(REVEAL + 400);
    T("fragment-gating", inAct2 && rejectedEarly && heldWithoutAlign && lockedNow && S.act === "act3");
    // choice gating + silent ending
    const earlyChoiceRejected = S.t < A3_SHOW ? apiChoose("silent") === false : true;
    adv(A3_SHOW + 300);
    const accepted = apiChoose("silent") === true;
    g = 0; while(!S.completed && g++ < 4000) stepSim(STEP);
    T("silent-ending", earlyChoiceRejected && accepted && S.completed && S.choice === "silent");
    // replay
    apiReset(917);
    T("replay", S.act === "act1" && S.t === 0 && !S.completed && S.choice === null);
    // autoplay can select the silent ending
    apiSetAutoplay(true, "silent");
    g = 0; while(!S.completed && g++ < 20000) stepSim(STEP);
    T("autoplay-silent-ending", S.completed && S.choice === "silent");
    // finite numeric state
    const nums = [];
    (function walk(v){
      if(typeof v === "number") nums.push(v);
      else if(Array.isArray(v)) v.forEach(walk);
      else if(v && typeof v === "object") Object.keys(v).forEach(k=>walk(v[k]));
    })(apiSnapshot());
    T("finite-numeric-state", nums.length > 8 && nums.every(Number.isFinite));
  }catch(err){
    T("no-exception", false, String(err));
  }
  // restore the state the visible story was in (incl. automatic-start defaults)
  W = deriveWorld(saved.seed);
  S = saved;
  buildGrain();
  ridgeCache.key = "";
  return { passed: tests.every(t=>t.passed), tests };
}

window.__LAST_SIGNAL__ = Object.freeze({
  reset: apiReset,
  setAutoplay: apiSetAutoplay,
  seek: apiSeek,
  alignFragment: apiAlign,
  choose: apiChoose,
  snapshot: apiSnapshot,
  runSelfTest: apiSelfTest,
});

/* ---------- canvas & layout ---------- */
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const RMQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches:false };
let vw = 1, vh = 1, U = 1;

function onResize(){
  vw = Math.max(1, window.innerWidth);
  vh = Math.max(1, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw*dpr);
  canvas.height = Math.round(vh*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  U = clamp(Math.min(vw,vh)/720, 0.45, 1.6);
  ridgeCache.key = "";
}
window.addEventListener("resize", onResize);

const ridgeCache = { key:"", pts:null, station:null };
function layout(){
  const key = vw+"x"+vh+"s"+S.seed;
  if(ridgeCache.key === key) return ridgeCache;
  const pts = [];
  for(let j=0;j<=72;j++){
    const x01 = j/72;
    pts.push([x01*vw, vh*(0.735 + (noise1(x01*2.6+7.31)-0.5)*0.11 - x01*0.018)]);
  }
  const sx01 = 0.68;
  const ry = vh*(0.735 + (noise1(sx01*2.6+7.31)-0.5)*0.11 - sx01*0.018);
  const sx = sx01*vw;
  const tx = sx + 36*U;
  const dish = { x: tx, y: ry - 100*U };
  const ax = Math.sin(-0.3), ay = -Math.cos(-0.3);
  const focal = { x: dish.x + ax*42*U, y: dish.y + ay*42*U };
  ridgeCache.key = key;
  ridgeCache.pts = pts;
  ridgeCache.station = { sx, ry, tx, dish, focal };
  return ridgeCache;
}

/* film grain tile, seeded */
let grainCv = null;
function buildGrain(){
  grainCv = document.createElement("canvas");
  grainCv.width = grainCv.height = 96;
  const g = grainCv.getContext("2d");
  const img = g.createImageData(96,96);
  const rng = mulberry32(W.grainSeed);
  for(let i=0;i<img.data.length;i+=4){
    const v = 118 + (rng()*80|0);
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
}

/* ---------- scene parameters per act ---------- */
function endingParams(kind, t, o){
  if(kind === "answer"){
    o.storm  = lerp(0.40, 0.10, ez(t, 3000, 12000));
    o.glow   = (0.9 + 0.5*fio(t,0,700,1200,2400)) * (1 - 0.7*ez(t, 18500, 21500));
    o.flick  = 0.12;
    o.beam   = ez(t, 1000, 5200);
    o.beamA  = 1 - ez(t, 18500, 21500);
    o.part   = ez(t, 3000, 10000);
    o.ringT  = t > 5200 ? (t-5200) : -1;
    o.ringA  = 1 - ez(t, 20500, 23200);
    o.starA  = ez(t, 8000, 15000);
    o.aurora = 0.35 + 0.4*ez(t, 5000, 12000);
    o.lift   = ez(t, 6800, 9600);
    o.veil   = Math.max(o.veil, (1 - rmp(t,0,600)) * 0.5);
    o.endFade= ez(t, 21500, 23800);
  } else {
    const A = Math.max(0, 1 - t/12000);
    const period = 3000 + t*0.28;
    const pulse = 0.5 + 0.5*Math.cos(Math.PI*2*t/period);
    o.storm  = 0.40 * (1 - ez(t, 4000, 16000));
    o.glow   = (0.9*(0.25 + 0.75*A*pulse)) * (1 - ez(t, 13000, 16500));
    o.flick  = 0.3;
    o.dawn   = ez(t, 10000, 22000) * 0.9;
    o.coldStar = ez(t, 13000, 19000);
    o.bow    = 0.12 + 0.5*ez(t, 6000, 9000);
    o.traceLife = 1 - ez(t, 3500, 10000);
    o.aurora = 0.35 * (1 - ez(t, 2000, 8000));
    o.darkVeil = Math.max(o.darkVeil, (1 - rmp(t,0,600)) * 0.45);
    o.endFade= ez(t, 21500, 23800);
  }
}
function sceneParams(){
  const t = S.t, act = S.act;
  const c = [closeness(0), closeness(1), closeness(2)];
  const cSum = c[0]+c[1]+c[2];
  const o = {
    t, act, c, cSum,
    storm:1, glow:0, flick:1, aurora:0, dawn:0,
    beam:0, beamA:1, part:0, ringT:-1, ringA:1, starA:0, coldStar:0,
    zoom:1, zx:0.5, zy:0.5, fg:1, bow:0.32, lift:0,
    traceLife:0, veil:0, darkVeil:0, endFade:0, endDim:0,
  };
  if(act === "act1"){
    o.glow = ez(t, 11800, 14500) * 0.85;
    o.flick = 1;
    o.traceLife = ez(t, 11800, 13400) * 0.85;
    o.fg = ez(t, 1400, 3600);
    o.bow = 0.32 - 0.18*ez(t, 11800, 13800);
    const st = layout().station;
    o.zx = st.focal.x/vw; o.zy = st.focal.y/vh;
    o.zoom = 1 + 0.05*sstep(t/A1);
    if(t > 22600){
      const p = rmp(t, 22600, A1);
      o.zoom += p*p*1.5;
      o.veil = Math.max(o.veil, sstep(p));
    }
  }
  else if(act === "act2"){
    o.storm = 0.9 * (1 - 0.14*cSum);
    o.glow = 0.75 + 0.2*c[1];
    o.veil = Math.max(o.veil, 1 - rmp(t, 0, 1300));
  }
  else if(act === "act3"){
    o.storm = 0.75 * (1 - 0.14*cSum);
    o.glow = 0.9; o.flick = 0.15;
    o.aurora = 0.35;
    o.traceLife = 1;
    o.bow = 0.12;
    o.fg = ez(t, 300, 1400);
    o.zoom = 1 + 0.3*(1 - sstep(rmp(t, 0, 1700)));
    o.zx = 0.5; o.zy = 0.45;
    o.darkVeil = Math.max(o.darkVeil, (1 - rmp(t,0,700)) * 0.6);
  }
  else if(act === "ending"){
    o.storm = 0.40; o.glow = 0.9; o.traceLife = 1; o.bow = 0.12;
    endingParams(S.choice, t, o);
  }
  else { // end card
    o.storm = 0.40; o.glow = 0.9; o.traceLife = 1; o.bow = 0.12;
    endingParams(S.choice || "answer", AE, o);
    o.endFade = 0;
    o.endDim = 1 - 0.22*rmp(t, 0, 2000);
  }
  return o;
}

/* ---------- drawing helpers ---------- */
function drawSky(o){
  const NT=[5,8,15], NM=[10,15,28], NL=[17,24,42];
  const DT=[26,34,50], DM=[56,66,90], DL=[124,116,116];
  const AT=[3,5,12];
  let top = mixC(NT, DT, o.dawn), mid = mixC(NM, DM, o.dawn), low = mixC(NL, DL, o.dawn);
  if(o.part > 0){ top = mixC(top, AT, o.part*0.7); mid = mixC(mid, AT, o.part*0.4); }
  const g = ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0, css(top,1)); g.addColorStop(0.55, css(mid,1)); g.addColorStop(1, css(low,1));
  ctx.fillStyle = g; ctx.fillRect(0,0,vw,vh);
  if(o.aurora > 0.01){
    const ag = ctx.createLinearGradient(0, vh*0.06, 0, vh*0.30);
    ag.addColorStop(0, "rgba(206,220,190,0)");
    ag.addColorStop(0.5, css([206,220,190], 0.10*o.aurora));
    ag.addColorStop(1, "rgba(206,220,190,0)");
    ctx.fillStyle = ag; ctx.fillRect(0, vh*0.06, vw, vh*0.24);
  }
  if(o.dawn > 0.01){
    const dg = ctx.createLinearGradient(0, vh*0.5, 0, vh*0.78);
    dg.addColorStop(0, "rgba(168,148,130,0)");
    dg.addColorStop(1, css([168,148,130], 0.16*o.dawn));
    ctx.fillStyle = dg; ctx.fillRect(0, vh*0.5, vw, vh*0.28);
  }
}
function drawStars(o, beamX){
  if(o.starA < 0.01 && o.coldStar < 0.01) return;
  const rm = RMQ.matches;
  ctx.save();
  for(const st of W.stars){
    const sx = st.x*vw, sy = st.y*vh;
    const tw = rm ? 0.8 : 0.65 + 0.35*Math.sin(S.worldT*0.0011 + st.tw);
    let a = 0;
    if(o.starA > 0.01){
      const gap = Math.exp(-Math.pow((sx-beamX)/(vw*0.26), 2));
      a = o.starA * gap * 0.85;
      ctx.fillStyle = css([235,228,205], a*tw);
    }
    if(o.coldStar > 0.01){
      a = o.coldStar * 0.55 * (1 - o.dawn*0.85);
      ctx.fillStyle = css([196,210,235], a*tw);
    }
    if(a > 0.01) ctx.fillRect(sx, sy, st.r*U+0.4, st.r*U+0.4);
  }
  ctx.restore();
}
function drawClouds(o, beamX){
  const CN=[13,18,32], CD=[74,80,96];
  const col = mixC(CN, CD, o.dawn);
  for(let L=0; L<3; L++){
    const drift = S.worldT * (0.010 + L*0.008) * (RMQ.matches ? 0.35 : 1);
    const yBase = vh*(0.05 + L*0.13);
    const aBase = (0.55 - L*0.13) * (0.30 + 0.70*o.storm) * (1 - 0.55*o.dawn);
    for(let k=0;k<6;k++){
      const cw = (0.24 + h1(k*7+L, W.salt+11)*0.24) * vw;
      const span = vw + 2*cw;
      const cx = ((h1(k*9+L, W.salt+12)*span + drift) % span) - cw;
      const cy = yBase + h1(k*3+L, W.salt+13)*vh*0.10;
      let a = aBase * (0.6 + 0.4*h1(k+L*17, W.salt+14));
      if(o.part > 0) a *= 1 - o.part * Math.exp(-Math.pow((cx-beamX)/(vw*0.22),2));
      if(a < 0.01) continue;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1, 0.38);
      const g = ctx.createRadialGradient(0,0,cw*0.1, 0,0,cw*0.55);
      g.addColorStop(0, css(col, a)); g.addColorStop(1, css(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,0,cw*0.55,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}
function lightningAmb(o){
  if(o.storm < 0.12 || S.act === "act2") return 0;
  const rm = RMQ.matches;
  let amb = 0, active = null;
  for(const f of W.flashes){
    const dt = S.worldT - f.t;
    if(dt >= 0 && dt < 1100){
      const k = Math.exp(-dt/(rm?520:180)) * f.s * (rm?0.30:1);
      if(k > amb){ amb = k; active = (dt < 220 && !rm && f.s > 0.72) ? f : active; }
    }
  }
  amb *= o.storm;
  if(amb > 0.01){
    ctx.fillStyle = css([188,204,236], amb*0.15);
    ctx.fillRect(0,0,vw,vh*0.9);
  }
  if(active){
    const dt = S.worldT - active.t;
    const a = Math.exp(-dt/90) * 0.8 * o.storm;
    const x0 = active.x*vw;
    ctx.save();
    ctx.strokeStyle = css([222,232,255], a);
    ctx.lineWidth = 1.6*U;
    ctx.beginPath();
    let x = x0, y = vh*0.10;
    ctx.moveTo(x,y);
    for(let s=1;s<=7;s++){
      x += (h1(active.j+s, W.salt+31)-0.5) * vw*0.05;
      y = vh*0.10 + (vh*0.58)*(s/7);
      ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }
  return amb;
}
function drawRidgeStation(o, amb){
  const L = layout();
  const st = L.station;
  ctx.fillStyle = "#04060a";
  ctx.beginPath();
  ctx.moveTo(-4, vh+4);
  ctx.lineTo(-4, L.pts[0][1]);
  for(const p of L.pts) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(vw+4, vh+4);
  ctx.closePath(); ctx.fill();
  // hut
  const hw=92*U, hh=54*U;
  ctx.fillRect(st.sx-hw*0.5, st.ry-hh+2, hw, hh);
  // mast + dish (silhouette)
  ctx.strokeStyle = "#04060a"; ctx.lineWidth = 3.4*U;
  ctx.beginPath(); ctx.moveTo(st.tx, st.ry); ctx.lineTo(st.tx, st.dish.y+6*U); ctx.stroke();
  ctx.save();
  ctx.translate(st.dish.x, st.dish.y); ctx.rotate(-0.3);
  ctx.fillStyle = "#04060a";
  ctx.beginPath(); ctx.ellipse(0,0, 46*U, 18*U, 0, 0, Math.PI, false); ctx.fill();
  ctx.strokeStyle = css([120,140,180], 0.22 + amb*0.5);
  ctx.lineWidth = 1.1*U;
  ctx.beginPath(); ctx.ellipse(0,0, 46*U, 18*U, 0, Math.PI, Math.PI*2, true); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-42*U); ctx.stroke();
  ctx.restore();
  // lamp window — the warmth that stays
  const wf = RMQ.matches ? 0.9 : 0.82 + 0.14*h1(Math.floor(S.worldT/160), W.salt+41);
  ctx.fillStyle = css([255,182,110], 0.9*wf);
  ctx.fillRect(st.sx-18*U, st.ry-40*U, 13*U, 15*U);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  let g = ctx.createRadialGradient(st.sx-12*U, st.ry-32*U, 2, st.sx-12*U, st.ry-32*U, 60*U);
  g.addColorStop(0, css([255,190,120], 0.20*wf)); g.addColorStop(1, "rgba(255,190,120,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(st.sx-12*U, st.ry-32*U, 60*U, 0, Math.PI*2); ctx.fill();
  // receiver focal glow
  if(o.glow > 0.01){
    const fl = 1 - o.flick*0.5*h1(Math.floor(S.worldT/70), W.salt+42);
    const R = (18 + 90*o.glow)*U;
    g = ctx.createRadialGradient(st.focal.x, st.focal.y, 1, st.focal.x, st.focal.y, R);
    g.addColorStop(0, css([255,224,170], 0.75*o.glow*fl));
    g.addColorStop(0.35, css([255,196,120], 0.40*o.glow*fl));
    g.addColorStop(1, "rgba(255,196,120,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(st.focal.x, st.focal.y, R, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawBeamRings(o){
  if(o.beam <= 0 && o.ringT < 0) return;
  const st = layout().station;
  const ax = Math.sin(-0.22), ay = -Math.cos(-0.22);
  const full = (st.focal.y + vh*0.18) / -ay;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  if(o.beam > 0 && o.beamA > 0.01){
    const len = o.beam * full;
    const ex = st.focal.x + ax*len, ey = st.focal.y + ay*len;
    const g = ctx.createLinearGradient(st.focal.x, st.focal.y, ex, ey);
    g.addColorStop(0, css([255,224,168], 0.85*o.beamA));
    g.addColorStop(1, css([255,224,168], 0.10*o.beamA));
    ctx.strokeStyle = g; ctx.lineWidth = 2.4*U;
    ctx.beginPath(); ctx.moveTo(st.focal.x, st.focal.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = css([255,200,130], 0.14*o.beamA); ctx.lineWidth = 22*U;
    ctx.beginPath(); ctx.moveTo(st.focal.x, st.focal.y); ctx.lineTo(ex, ey); ctx.stroke();
    if(!RMQ.matches){
      for(let j=0;j<3;j++){
        const p = ((S.worldT*0.00035) + j/3) % 1;
        if(p*full < len){
          const px = st.focal.x + ax*p*full, py = st.focal.y + ay*p*full;
          ctx.fillStyle = css([255,240,200], 0.7*o.beamA*(1-p));
          ctx.beginPath(); ctx.arc(px, py, 2.6*U, 0, Math.PI*2); ctx.fill();
        }
      }
    }
  }
  if(o.ringT >= 0 && o.ringA > 0.01){
    const rc = { x: st.focal.x + ax*(full*0.86), y: st.focal.y + ay*(full*0.86) };
    for(let j=0;j<4;j++){
      const ph = o.ringT/2600 - j*0.8;
      if(ph <= 0) continue;
      const rr = ph * vh*0.30;
      const a = 0.30 * Math.exp(-ph*1.05) * o.ringA;
      if(a < 0.01) continue;
      ctx.strokeStyle = css([255,228,182], a);
      ctx.lineWidth = Math.max(0.8, 2.6 - ph)*U;
      ctx.beginPath(); ctx.arc(rc.x, rc.y, rr, 0, Math.PI*2); ctx.stroke();
    }
    // the arc that stays
    ctx.strokeStyle = css([255,228,182], 0.10*o.ringA);
    ctx.lineWidth = 5*U;
    ctx.beginPath(); ctx.arc(rc.x, rc.y, vh*0.10, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}
function drawRain(o, alphaScale){
  if(o.storm < 0.02) return;
  const rm = RMQ.matches;
  const base = Math.round(190 * (vw*vh)/(1440*800));
  const n = clamp(Math.round(base * o.storm * (rm?0.15:1)), 0, 420);
  const spdF = rm ? 0.35 : 1;
  const wind = 0.30 + 0.16*Math.sin(S.worldT*0.00011);
  const cycle = vh + 90;
  ctx.save();
  ctx.lineWidth = 1;
  for(let i=0;i<n;i++){
    const sp = (0.55 + h1(i, W.salt+5)*0.8) * spdF;
    const len = (9 + h1(i, W.salt+9)*15) * U * sp;
    const yy = ((h1(i, W.salt+2)*cycle + S.worldT*0.60*sp) % cycle) - 45;
    const xx = ((h1(i, W.salt+3)*(vw+160) + yy*wind) % (vw+160)) - 80;
    ctx.strokeStyle = css([164,192,228], (0.09 + 0.15*h1(i, W.salt+7)) * alphaScale * o.storm);
    ctx.beginPath();
    ctx.moveTo(xx - wind*len, yy - len);
    ctx.lineTo(xx, yy);
    ctx.stroke();
  }
  ctx.restore();
}
function drawTraceStrip(o){
  const life = o.traceLife;
  const y0 = vh*0.868;
  const col = mixC([150,165,190], [240,205,140], clamp(life,0,1));
  let alpha = 0.12 + 0.30*life;
  if(o.beam > 0) alpha *= (1 - 0.85*o.beam);
  if(alpha < 0.02) return;
  const N = 110;
  const pk = (S.worldT*0.00013) % 1;
  ctx.save();
  ctx.strokeStyle = css(col, alpha);
  ctx.lineWidth = 1.3*U;
  ctx.beginPath();
  for(let j=0;j<=N;j++){
    const x01 = j/N, x = x01*vw;
    let y = y0;
    y += (h1(j*17, W.salt + Math.floor(S.worldT/(RMQ.matches?240:80)))-0.5) * 1.6*U;
    if(life > 0.01){
      y += Math.sin(x01*Math.PI*15 + S.worldT*0.0016) * 3.4*U * life;
      y += Math.sin(x01*Math.PI*46) * Math.exp(-Math.pow((x01-pk)/0.05,2)) * 9*U * life;
    }
    if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawOperator(o, amb){
  if(o.fg <= 0.01) return;
  const hr = Math.min(vh*0.062, vw*0.11);
  const hx = Math.max(vw*0.17, hr*1.6);
  let hy = vh*0.80 + o.bow*vh*0.020 - o.lift*vh*0.024;
  if(!RMQ.matches) hy += Math.sin(S.worldT*0.0005)*vh*0.0016;
  ctx.save();
  ctx.globalAlpha = o.fg;
  ctx.fillStyle = "#020409";
  ctx.beginPath();
  ctx.moveTo(-vw*0.03, vh*1.04);
  ctx.quadraticCurveTo(hx - hr*2.4, vh*0.98, hx - hr*1.45, hy + hr*0.75);
  ctx.quadraticCurveTo(hx - hr*1.15, hy + hr*0.15, hx - hr*0.9, hy - hr*0.35);
  ctx.arc(hx, hy, hr, Math.PI*1.12, Math.PI*2.02, false);
  ctx.quadraticCurveTo(hx + hr*1.7, hy + hr*1.1, hx + hr*2.6, vh*1.04);
  ctx.closePath(); ctx.fill();
  // headphone band
  ctx.strokeStyle = "#020409"; ctx.lineWidth = hr*0.22;
  ctx.beginPath(); ctx.arc(hx, hy, hr*1.12, Math.PI*1.15, Math.PI*1.85, false); ctx.stroke();
  // warm rim from the receiver, cool rim from lightning
  if(o.glow > 0.02){
    ctx.strokeStyle = css([255,196,124], 0.5*o.glow);
    ctx.lineWidth = 1.8*U;
    ctx.beginPath(); ctx.arc(hx, hy, hr+0.8, -0.55 + o.lift*-0.4, 0.75, false); ctx.stroke();
  }
  if(amb > 0.03){
    ctx.strokeStyle = css([180,202,240], 0.5*amb);
    ctx.lineWidth = 1.4*U;
    ctx.beginPath(); ctx.arc(hx, hy, hr+0.8, Math.PI*0.75, Math.PI*1.35, false); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- wide-world composition (acts I, III, endings) ---------- */
function renderWorld(o){
  const st = layout().station;
  ctx.save();
  const zx = o.zx*vw, zy = o.zy*vh;
  ctx.translate(zx, zy); ctx.scale(o.zoom, o.zoom); ctx.translate(-zx, -zy);
  drawSky(o);
  drawStars(o, st.focal.x);
  drawClouds(o, st.focal.x);
  const amb = lightningAmb(o);
  drawBeamRings(o);
  drawRidgeStation(o, amb);
  drawRain(o, 1);
  drawTraceStrip(o);
  drawOperator(o, amb);
  ctx.restore();
}

/* ---------- act II composition: inside the signal ---------- */
function renderSignal(o){
  const t = S.t;
  ctx.fillStyle = "#020409"; ctx.fillRect(0,0,vw,vh);
  drawRain(o, 0.5);
  const c = o.c;
  // sky-lift band — fragment three reaching upward
  const aur = c[2] * (S.locked ? 1 : 0.75);
  if(aur > 0.02){
    const ag = ctx.createLinearGradient(0, 0, 0, vh*0.22);
    ag.addColorStop(0, css([206,220,190], 0.14*aur));
    ag.addColorStop(1, "rgba(206,220,190,0)");
    ctx.fillStyle = ag; ctx.fillRect(0, 0, vw, vh*0.22);
  }
  // the receiver's field — fragment two steadies it
  const bucket = Math.floor(S.worldT/(RMQ.matches?240:70));
  const wob = (h1(bucket, W.salt+99)-0.5) * 2 * (1 - 0.8*c[1]);
  const R = Math.min(vw,vh) * (0.52 + 0.05*wob);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  let g = ctx.createRadialGradient(vw*0.5, vh*0.47, R*0.05, vw*0.5, vh*0.47, R);
  g.addColorStop(0, css([255,188,112], 0.20*o.glow));
  g.addColorStop(1, "rgba(255,188,112,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(vw*0.5, vh*0.47, R, 0, Math.PI*2); ctx.fill();
  g = ctx.createRadialGradient(vw*0.5, vh*0.47, 1, vw*0.5, vh*0.47, R*0.28);
  g.addColorStop(0, css([255,216,152], 0.16*o.glow));
  g.addColorStop(1, "rgba(255,216,152,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(vw*0.5, vh*0.47, R*0.28, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // three fragments
  const spread = S.locked ? 1 - sstep(rmp(t - S.alignedAt, 0, 1300)) : 1;
  let ampMod = 1;
  if(S.locked){
    const rt = t - S.alignedAt;
    ampMod = lerp(1, 0.4 + 0.25*Math.cos(Math.PI*2*rt/2600), sstep(rmp(rt, 0, 1300)));
    ampMod *= 1 - sstep(rmp(rt, REVEAL-1700, REVEAL-400));
  }
  const xA = vw*0.13, xB = vw*0.87;
  const N = 120;
  for(let i=0;i<3;i++){
    const d = S.frag[i] - W.targets[i];
    const ad = Math.abs(d);
    const homeY = vh*(0.5 + (i-1)*0.115*spread);
    const by = homeY + d*vh*0.16*(0.1 + 0.9*spread);
    if(!S.locked){
      ctx.setLineDash([2*U, 7*U]);
      ctx.strokeStyle = css([210,200,170], 0.10);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xA, homeY); ctx.lineTo(xB, homeY); ctx.stroke();
      ctx.setLineDash([]);
    }
    const amp = U*(13 + 9*c[i]) * ampMod;
    const k = W.wave[i].k + d*8;
    const ph = W.wave[i].ph + S.worldT*W.wave[i].sp;
    const jit = ad*13*U;
    const col = mixC([238,196,128], [252,238,205], c[i]);
    for(let pass=0; pass<2; pass++){
      ctx.strokeStyle = css(col, pass===0 ? 0.08+0.06*c[i] : 0.34+0.42*c[i]);
      ctx.lineWidth = (pass===0 ? 6 : 1.5)*U;
      ctx.beginPath();
      for(let j=0;j<=N;j++){
        const x01 = j/N;
        const x = xA + (xB-xA)*x01;
        const env = Math.pow(Math.sin(Math.PI*x01), 0.8);
        let y = by + Math.sin(x01*Math.PI*2*k + ph)*amp*env;
        y += (h1(j*131+i*7, W.salt+bucket)-0.5)*2*jit*env;
        if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // labels + selection
    if(!S.locked && vw > 430){
      ctx.font = Math.round(10+2*U)+"px ui-monospace, Menlo, monospace";
      ctx.fillStyle = css([230,214,170], 0.40);
      ctx.textAlign = "right";
      ctx.fillText("0"+(i+1), xA - 14*U, homeY + 3);
      if(S.sel === i && !S.autoplay){
        ctx.fillStyle = css([255,220,160], 0.7);
        ctx.beginPath();
        ctx.moveTo(xA - 8*U, by); ctx.lineTo(xA - 2*U, by - 3.4*U); ctx.lineTo(xA - 2*U, by + 3.4*U);
        ctx.closePath(); ctx.fill();
      }
    }
    // lock pulse
    if(S.lockT[i] > 0){
      const age = S.worldT - S.lockT[i];
      if(age < 1000 && !RMQ.matches){
        const pr = age/1000;
        ctx.strokeStyle = css([255,228,180], (1-pr)*0.25);
        ctx.lineWidth = 1.2*U;
        ctx.beginPath(); ctx.arc(vw*0.5, by, (20+180*pr)*U, 0, Math.PI*2); ctx.stroke();
      }
    }
  }
}

/* ---------- post: veils, grain, vignette, progress ---------- */
function renderPost(o){
  const st = layout().station;
  if(o.veil > 0.01){
    const cx = S.act==="act2" ? vw*0.5 : st.focal.x;
    const cy = S.act==="act2" ? vh*0.47 : st.focal.y;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const R = Math.max(vw,vh)*1.1;
    const g = ctx.createRadialGradient(cx,cy,1, cx,cy,R);
    g.addColorStop(0, css([255,220,160], 0.95*o.veil));
    g.addColorStop(0.5, css([255,200,130], 0.55*o.veil));
    g.addColorStop(1, css([255,200,130], 0.20*o.veil));
    ctx.fillStyle = g; ctx.fillRect(0,0,vw,vh);
    ctx.restore();
  }
  if(o.darkVeil > 0.01){ ctx.fillStyle = css([2,3,6], o.darkVeil); ctx.fillRect(0,0,vw,vh); }
  if(o.endFade > 0.01){ ctx.fillStyle = css([2,3,7], o.endFade); ctx.fillRect(0,0,vw,vh); }
  if(o.endDim > 0.01){ ctx.fillStyle = css([2,3,7], o.endDim*0.82); ctx.fillRect(0,0,vw,vh); }
  // grain
  if(grainCv){
    const b = RMQ.matches ? 0 : Math.floor(S.worldT/40);
    const ox = Math.floor(h1(b, W.salt+61)*96), oy = Math.floor(h1(b, W.salt+62)*96);
    ctx.save();
    ctx.globalAlpha = 0.045;
    for(let y=-oy; y<vh; y+=96) for(let x=-ox; x<vw; x+=96) ctx.drawImage(grainCv, x, y);
    ctx.restore();
  }
  // vignette
  const vg = ctx.createRadialGradient(vw*0.5, vh*0.46, Math.min(vw,vh)*0.42, vw*0.5, vh*0.5, Math.max(vw,vh)*0.78);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.52)");
  ctx.fillStyle = vg; ctx.fillRect(0,0,vw,vh);
  // progress filament
  const CUM = [0, 0.20, 0.62, 0.72, 0.96, 1];
  let idx = 0, ap = 0;
  if(S.act==="act1"){ idx=0; ap=S.t/A1; }
  else if(S.act==="act2"){
    idx=1;
    ap = S.locked ? 0.55 + 0.45*rmp(S.t - S.alignedAt, 0, REVEAL)
                  : 0.55 * (o.cSum/3);
  }
  else if(S.act==="act3"){ idx=2; ap=Math.min(S.t/8000,1); }
  else if(S.act==="ending"){ idx=3; ap=S.t/AE; }
  else { idx=4; ap=1; }
  const p = CUM[idx] + (CUM[idx+1]-CUM[idx])*clamp(ap,0,1);
  const py = vh - 2;
  ctx.fillStyle = "rgba(220,206,170,0.13)"; ctx.fillRect(0, py, vw, 1);
  ctx.fillStyle = "rgba(240,214,158,0.42)"; ctx.fillRect(0, py, vw*p, 1);
  for(let i=1;i<5;i++){ ctx.fillStyle="rgba(220,206,170,0.22)"; ctx.fillRect(vw*CUM[i]-1, py-2, 1, 5); }
}
function render(){
  const o = sceneParams();
  ctx.clearRect(0,0,vw,vh);
  if(S.act === "act2") renderSignal(o); else renderWorld(o);
  renderPost(o);
  return o;
}

/* ---------- DOM overlay ---------- */
const $ = id => document.getElementById(id);
const el = {
  title: $("titleCard"), slate: $("slate"), clock: $("clock"), sub: $("sublabel"),
  narr: $("narration"), msg: $("message"), hint: $("hint"),
  choices: $("choices"), endcard: $("endcard"), endLabel: $("endLabel"), endLine: $("endLine"),
  btnAnswer: $("btnAnswer"), btnSilent: $("btnSilent"), btnReplay: $("btnReplay"), btnOther: $("btnOther"),
};
const msgSpans = [];
for(const ch of MSG){
  const sp = document.createElement("span");
  sp.textContent = ch === " " ? " " : ch;
  el.msg.appendChild(sp); msgSpans.push(sp);
}
function setO(node, a){
  a = clamp(a, 0, 1);
  const v = a.toFixed(3);
  if(node.__o !== v){ node.__o = v; node.style.opacity = v; }
}
function setT(node, s){ if(node.__t !== s){ node.__t = s; node.textContent = s; } }

const NARR = {
  act1: [
    [5200,6400,10600,11800,"Thirty years of static. The storm talks only to itself.",""],
    [13200,14600,20400,21800,"At 02:17, the dead receiver began to glow.","glowline"],
  ],
  act3: [[700,1700,5200,6200,"The transmitter hums. It still works.",""]],
  answer: [
    [6500,7600,11800,12800,"The reply left before doubt could catch it.",""],
    [14500,15600,20200,21400,"Somewhere beyond the storm, a sky remembered back.",""],
  ],
  silent: [
    [6500,7600,11800,12800,"Some answers are kept close, not sent.",""],
    [14500,15600,20200,21400,"By dawn, the sky was only weather again.",""],
  ],
};
function pickNarration(){
  const t = S.t;
  let list = null, rel = t;
  if(S.act === "act1") list = NARR.act1;
  else if(S.act === "act3") list = NARR.act3;
  else if(S.act === "ending") list = NARR[S.choice];
  else if(S.act === "act2" && S.locked){
    const rt = t - S.alignedAt;
    const a = fio(rt, 6800, 7800, 10600, 11600);
    if(a > 0) return ["Thirty years late, or right on time.", a, ""];
    return null;
  }
  if(!list) return null;
  for(const L of list){
    const a = fio(rel, L[0], L[1], L[2], L[3]);
    if(a > 0) return [L[4], a, L[5]];
  }
  return null;
}
function updateOverlay(){
  const t = S.t, act = S.act;
  setO(el.title, act==="act1" ? fio(t, 600, 1900, 4300, 5800) : 0);
  // slate + clock
  setO(el.slate, act==="act1" ? fio(t, 2200, 3000, 8800, 9800) : 0);
  setT(el.slate, "Listening station K-"+S.seed+" · night watch");
  const ck = act==="act1" ? fio(t, 2600, 3400, 16500, 18000) : 0;
  setO(el.clock, ck);
  if(ck > 0){
    setT(el.clock, t<4000 ? "02:14" : t<8000 ? "02:15" : t<11800 ? "02:16" : "02:17");
    el.clock.classList.toggle("lit", t>=11800);
  }
  // act II label + hint
  setO(el.sub, act==="act2" && !S.locked ? fio(t, 900, 1800, 999999, 1000000)*0.9 : 0);
  setT(el.sub, "Signal · three fragments · unstable");
  let hintA = 0;
  if(act==="act2" && !S.locked){
    hintA = ez(t, 1800, 3000) * 0.85;
    setT(el.hint, S.autoplay
      ? "the station tunes itself — touch a line to take over"
      : "guide each line to its quiet center · 1 2 3 choose · ↑ ↓ steady");
  }
  setO(el.hint, hintA);
  // narration
  const n = pickNarration();
  if(n){
    setT(el.narr, n[0]);
    el.narr.className = "serif" + (n[2] ? " " + n[2] : "");
    setO(el.narr, n[1]);
  } else setO(el.narr, 0);
  // the message
  if(act === "act2" && S.locked){
    const rt = t - S.alignedAt;
    const out = 1 - sstep(rmp(rt, REVEAL-1700, REVEAL-500));
    setO(el.msg, out);
    for(let i=0;i<msgSpans.length;i++){
      const a = ez(rt, 1500 + i*110, 1950 + i*110);
      const sp = msgSpans[i];
      const v = (a*out).toFixed(3);
      if(sp.__o !== v){
        sp.__o = v; sp.style.opacity = v;
        sp.style.transform = RMQ.matches ? "none" : "translateY("+((1-a)*8).toFixed(2)+"px)";
      }
    }
  } else setO(el.msg, 0);
  // choice
  let cA = 0;
  if(act === "act3" && !S.choice) cA = ez(t, A3_SHOW, A3_SHOW+900);
  setO(el.choices, cA);
  el.choices.style.pointerEvents = (cA > 0.5 && !S.choice) ? "auto" : "none";
  // end card
  const eA = act === "end" ? ez(t, 700, 1900) : 0;
  setO(el.endcard, eA);
  el.endcard.style.pointerEvents = eA > 0.5 ? "auto" : "none";
  if(act === "end"){
    setT(el.endLabel, S.choice === "answer" ? "Transmission sent · 02:19" : "Signal kept · 02:19");
    setT(el.endLine, S.choice === "answer"
      ? "Two skies, remembering each other."
      : "The sky keeps its distance. The lamp keeps its post.");
  }
}

/* ---------- interaction ---------- */
function userTakeover(){ S.autoplay = false; }
function skipBeat(){
  if(S.act === "act1"){
    const beats = [5200, 11800, 13200, 21800, A1-1];
    const nx = beats.find(b => b > S.t + 50);
    if(nx !== undefined){ S.t = nx; syncWorldT(); }
  } else if(S.act === "act2" && S.locked){
    const rt = S.t - S.alignedAt;
    S.t = S.alignedAt + (rt < 5600 ? 5600 : REVEAL - 600);
    syncWorldT();
  } else if(S.act === "ending"){
    S.t = S.t < 6500 ? 6500 : S.t < 14500 ? 14500 : AE - 900;
    syncWorldT();
  }
}
function bandYPositions(){
  const spread = S.locked ? 0 : 1;
  return [0,1,2].map(i =>
    vh*(0.5 + (i-1)*0.115*spread) + (S.frag[i]-W.targets[i])*vh*0.16*(0.1+0.9*spread));
}
let drag = null;
canvas.addEventListener("pointerdown", e => {
  userTakeover();
  if(S.act === "act2" && !S.locked){
    const ys = bandYPositions();
    let best = 0, bd = Infinity;
    for(let i=0;i<3;i++){ const d = Math.abs(e.clientY - ys[i]); if(d < bd){ bd = d; best = i; } }
    S.sel = best;
    drag = { id: e.pointerId, lastY: e.clientY, moved: 0 };
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  } else {
    drag = { id: e.pointerId, lastY: e.clientY, moved: 0, skip: true };
  }
  e.preventDefault();
});
canvas.addEventListener("pointermove", e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.lastY;
  drag.lastY = e.clientY;
  drag.moved += Math.abs(dy);
  if(!drag.skip && S.act === "act2" && !S.locked){
    setFrag(S.sel, S.frag[S.sel] + dy/(vh*0.42));
  }
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  if(drag.skip && drag.moved < 8) skipBeat();
  drag = null;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", e => { drag = null; });

window.addEventListener("keydown", e => {
  const k = e.key;
  if(k === " " || k === "Enter"){
    if(document.activeElement && document.activeElement.tagName === "BUTTON") return;
    e.preventDefault(); userTakeover(); skipBeat(); return;
  }
  if(k === "r" || k === "R"){ userTakeover(); apiReset(S.seed); return; }
  if(S.act !== "act2" || S.locked) return;
  if(k === "1" || k === "2" || k === "3"){ userTakeover(); S.sel = +k - 1; }
  else if(k === "ArrowLeft"){ e.preventDefault(); userTakeover(); S.sel = (S.sel+2)%3; }
  else if(k === "ArrowRight"){ e.preventDefault(); userTakeover(); S.sel = (S.sel+1)%3; }
  else if(k === "ArrowUp"){ e.preventDefault(); userTakeover(); setFrag(S.sel, S.frag[S.sel] - (e.shiftKey?0.032:0.008)); }
  else if(k === "ArrowDown"){ e.preventDefault(); userTakeover(); setFrag(S.sel, S.frag[S.sel] + (e.shiftKey?0.032:0.008)); }
});
el.btnAnswer.addEventListener("click", ()=>{ userTakeover(); doChoose("answer"); });
el.btnSilent.addEventListener("click", ()=>{ userTakeover(); doChoose("silent"); });
el.btnReplay.addEventListener("click", ()=>{ userTakeover(); apiReset(S.seed); });
el.btnOther.addEventListener("click", ()=>{
  userTakeover();
  S.frag = W.targets.slice();
  S.locked = true; S.alignedAt = 0;
  S.choice = null; S.completed = false;
  S.act = "act3"; S.t = 0; S.actStartWorld = S.worldT;
  if(S.history.length < 32) S.history.push("act3");
});

/* ---------- main loop ---------- */
let lastNow = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = now - lastNow;
  lastNow = now;
  if(document.hidden) return;
  dt = Math.min(dt, 100);
  acc += dt;
  let steps = 0;
  while(acc >= STEP && steps < 8){ stepSim(STEP); acc -= STEP; steps++; }
  if(steps === 8) acc = 0;
  render();
  updateOverlay();
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){ lastNow = performance.now(); acc = 0; }
});

/* ---------- boot: deterministic autoplay, seed 217, answer ending ---------- */
onResize();
apiReset(BOOT.seed);
apiSetAutoplay(BOOT.autoplay, BOOT.ending);
BOOT.applied = S.seed === BOOT.seed && S.autoplay === true && S.autoEnding === "answer";
requestAnimationFrame(frame);
</script>
</body>
