<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Codex GPT-5.6 Terra</title>
  <style>
    :root { --paper:#d7e6dc; --fog:#9aafa7; --ink:#06110f; --signal:#c8ff7b; --ember:#ffc76e; --line:rgba(218,255,229,.32); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#040908; color:var(--paper); font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    body { touch-action:manipulation; }
    #world { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
    #interface { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; text-shadow:0 1px 12px #000; }

    h1 { margin:0; font-size:clamp(10px, 1.2vw, 14px); line-height:1; letter-spacing:.18em; font-weight:500; text-transform:uppercase; color:#f1ffea; }
    .story-mark, .clock { font-size:10px; letter-spacing:.24em; color:rgba(223,241,229,.62); text-transform:uppercase; }
    .clock { text-align:right; line-height:1.6; }
    .clock b { display:block; color:var(--signal); font-weight:500; letter-spacing:.15em; }
    .center-copy { position:absolute; top:29%; left:50%; width:min(720px, calc(100vw - 48px)); transform:translateX(-50%); text-align:center; transition:opacity .4s linear; text-shadow:0 3px 26px #000; }
    #narrative { margin:0 auto; max-width:620px; font-size:clamp(15px, 2.05vw, 25px); line-height:1.34; font-family:Georgia, "Times New Roman", serif; font-weight:400; letter-spacing:.025em; }
    #narrative .timestamp { display:block; margin-bottom:9px; color:var(--signal); font-family:ui-monospace,monospace; font-size:.48em; letter-spacing:.26em; text-transform:uppercase; }
    #narrative .quote { color:#f4ffe9; }

    .bottom { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }
    .readout { font-size:9px; line-height:1.65; letter-spacing:.13em; color:rgba(224,245,232,.64); text-transform:uppercase; min-width:120px; }
    .readout strong { color:var(--signal); font-weight:500; }
    #progress { display:flex; align-items:center; justify-content:center; gap:4px; padding-bottom:1px; }
    #progress i { display:block; height:2px; width:clamp(22px, 4.8vw, 52px); background:rgba(216,243,227,.22); position:relative; overflow:hidden; }
    #progress i:after { content:""; position:absolute; inset:0; transform:translateX(-102%); background:var(--signal); box-shadow:0 0 8px var(--signal); transition:transform .35s ease; }
    #progress i.live:after { transform:translateX(0); }
    #progress i.current:after { transform:translateX(calc(-100% + var(--fill, 0%))); }
    .hint { min-width:120px; text-align:right; font-size:9px; line-height:1.55; letter-spacing:.12em; color:rgba(224,245,232,.6); text-transform:uppercase; }
    #action-layer { position:absolute; inset:0; pointer-events:none; }
    .choice-wrap { pointer-events:auto; position:absolute; left:50%; bottom:clamp(76px, 14vh, 140px); transform:translateX(-50%); display:flex; align-items:stretch; gap:10px; opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s; }
    .choice-wrap.show { opacity:1; visibility:visible; }
    button { font:inherit; color:var(--paper); border:1px solid rgba(226,255,232,.46); background:rgba(3,14,11,.63); padding:13px 17px 12px; letter-spacing:.17em; font-size:10px; cursor:pointer; min-width:148px; backdrop-filter:blur(5px); transition:background .18s, border-color .18s, color .18s, transform .18s; }
    button:hover,button:focus-visible { outline:none; background:rgba(200,255,123,.14); border-color:var(--signal); color:var(--signal); transform:translateY(-2px); }
    button.answer { border-color:rgba(200,255,123,.7); }
    #replay { pointer-events:auto; position:absolute; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%); min-width:0; padding:9px 13px; opacity:0; visibility:hidden; transition:opacity .6s, visibility .6s; }
    #replay.show { opacity:1; visibility:visible; }
    #a11y-status { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:620px) {
      #interface { padding:15px 14px max(16px, env(safe-area-inset-bottom)); }
      .story-mark,.clock,.readout,.hint { font-size:8px; }
      .center-copy { top:22%; width:calc(100vw - 34px); }
      #narrative { font-size:18px; }
      .choice-wrap { width:calc(100vw - 28px); bottom:max(86px, 17vh); gap:7px; }
      button { min-width:0; flex:1; padding:12px 7px; font-size:9px; }
      .bottom { gap:7px; }
      .readout,.hint { min-width:88px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <canvas id="world" aria-label="An illustrated storm listening station. Use the tuning controls to align three signal fragments."></canvas>
  <main id="interface">
    <div class="top">
      <div class="identity"><h1>Codex GPT-5.6 Terra</h1><div class="story-mark">The Last Signal</div></div>
      <div class="clock"><b id="act-label">receiver / 01</b><span id="clock-text">02:16:43</span></div>
    </div>
    <section class="center-copy" id="center-copy" aria-live="polite"><p id="narrative"></p></section>
    <div class="bottom">
      <div class="readout" id="readout">STATION K-17<br><strong>ATMOSPHERIC LISTENING</strong></div>
      <div id="progress" aria-label="Story progress"><i></i><i></i><i></i><i></i></div>
      <div class="hint" id="hint">SPACE / ENTER<br>advance</div>
    </div>
    <div id="action-layer">
      <div class="choice-wrap" id="choices" role="group" aria-label="Transmission choice">
        <button class="answer" id="answer" type="button">ANSWER</button>
        <button id="silent" type="button">STAY SILENT</button>
      </div>
      <button id="replay" type="button">REPLAY FROM 02:17</button>
    </div>
    <div id="a11y-status" aria-live="assertive"></div>
  </main>

  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });
    const narrative = document.getElementById('narrative');
    const centerCopy = document.getElementById('center-copy');
    const actLabel = document.getElementById('act-label');
    const clockText = document.getElementById('clock-text');
    const readout = document.getElementById('readout');
    const hint = document.getElementById('hint');
    const choiceWrap = document.getElementById('choices');
    const replayButton = document.getElementById('replay');
    const status = document.getElementById('a11y-status');
    const progressSegments = [...document.querySelectorAll('#progress i')];
    const answerButton = document.getElementById('answer');
    const silentButton = document.getElementById('silent');
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;
    const FIXED_STEP = 1000 / 60;
    const TARGETS = [0.69, 0.36, 0.81];
    const ACT_DURATIONS = { receiver: 18, message: 32, choice: 10, aftermath: 28 };
    let W = 0, H = 0, DPR = 1, lastFrame = null, accumulator = 0, pointerTuner = -1;

    function clamp(v, lo = 0, hi = 1) { return Math.max(lo, Math.min(hi, v)); }

    function ease(t) { t=clamp(t); return t*t*(3-2*t); }

    function hash32(v) { v = (v ^ 61) ^ (v >>> 16); v = v + (v << 3); v = v ^ (v >>> 4); v = Math.imul(v, 0x27d4eb2d); return (v ^ (v >>> 15)) >>> 0; }

    function finite(v) { return Number.isFinite(v); }
    function fmtClock(seconds) { const base = 2*3600 + 16*60 + 43 + Math.floor(seconds); const h = String(Math.floor(base/3600)%24).padStart(2,'0'); const m = String(Math.floor(base/60)%60).padStart(2,'0'); const s = String(base%60).padStart(2,'0'); return `${h}:${m}:${s}`; }
    function textAlpha(t, start, end, edge=.7) { return clamp(Math.min((t-start)/edge, (end-t)/edge)); }
    function noise(x,y,t) { return Math.sin(x*.016+y*.021+t*.6)+.55*Math.sin(x*.061-y*.039-t*.31)+.22*Math.sin(x*.13+y*.1+t); }

    const state = {
      seed:217, act:'receiver', actTime:0, totalTime:0, autoplay:true, autoplayEnding:'answer',
      chosen:null, complete:false, choiceAvailable:false, resolvedAt:null,
      fragments:[.12,.9,.22], initialFragments:[.12,.9,.22], activeTuner:0,
      particles:[], stars:[], dust:[], lightning:[], lastNarrative:'', manual:false
    };

    function makeWorld(seed) {
      const random = rng(seed);
      state.particles = Array.from({length: 185}, (_, i) => ({ x:random(), y:random(), len:10+random()*34, speed:.42+random()*1.8, alpha:.08+random()*.27, lane:random(), wobble:random()*TAU, i }));

    }
    function resize() {

    }
    function reset(seed=217) {

    }
    function transition(next) {

    }
    function allAligned() { return state.fragments.every((v,i) => Math.abs(v-TARGETS[i]) <= .035); }

    }
    function choose(ending) {

    }
    function takeControl() { if (state.autoplay) { state.autoplay=false; state.manual=true; status.textContent='Autoplay released. You are at the receiver.'; } }
    function advanceManual() {

    function seek(milliseconds) {

    function stepAuto(dt) {
      if (!state.autoplay) return;

      }
      if(state.act==='receiver' && state.actTime >= ACT_DURATIONS.receiver) transition('message');
      else if(state.act==='message' && allAligned() && state.actTime >= ACT_DURATIONS.message) transition('choice');
      else if(state.act==='choice' && state.actTime >= ACT_DURATIONS.choice) choose(state.autoplayEnding);
      else if(state.act==='aftermath' && state.actTime >= ACT_DURATIONS.aftermath) { state.complete=true; state.autoplay=false; updateInterface(true); }

    function step(dt) {
      state.actTime += dt; state.totalTime += dt;
      stepAuto(dt);
      if(state.act==='aftermath' && state.actTime>=ACT_DURATIONS.aftermath && !state.complete) { state.complete=true; updateInterface(true); }
      updateInterface();
    }
    function copyLine(t) {
      if(state.act==='receiver') {
        if(t<2.4) return '';
        if(t<7.8) return '<span class="timestamp">Station K-17 · Northern coast</span><span class="quote">Thirty years of weather.<br>Thirty years of silence.</span>';
        if(t<14.6) return '<span class="timestamp">02:17</span><span class="quote">“At 02:17, the dead receiver began to glow.”</span>';
        return '<span class="timestamp">channel / unknown</span><span class="quote">Something is trying to cross the storm.</span>';
      }
      if(state.act==='message') {
        if(t<4) return '<span class="timestamp">three fragments detected</span><span class="quote">Bring the weather into phase.</span>';
        if(!allAligned()) return '<span class="timestamp">tune the three signal threads</span><span class="quote">Move the dials. Listen with your eyes.</span>';
        if(t<(state.resolvedAt||t)+5) return '<span class="timestamp">signal resolved</span><span class="message">WE REMEMBER YOUR SKY.</span>';
        return '<span class="timestamp">the room holds its breath</span><span class="quote">A reply would be heard.</span>';
      }
      if(state.act==='choice') return '<span class="timestamp">outbound channel open</span><span class="quote">The storm is waiting.</span>';
      if(state.chosen==='answer') {
        if(t<7) return '<span class="timestamp">transmitting</span><span class="quote">A small human answer enters the rain.</span>';
        if(t<18) return '<span class="timestamp">far above the cloud</span><span class="quote">The sky answers in a language of light.</span>';
        return '<span class="timestamp">station K-17 / awake</span><span class="quote">Some silences are bridges.</span>';
      }
      if(t<7) return '<span class="timestamp">channel closed</span><span class="quote">The operator lets the last signal go.</span>';
      if(t<18) return '<span class="timestamp">the receiver remembers</span><span class="quote">Not every answer needs a voice.</span>';

    }
    function updateInterface(force=false) {

      replayButton.classList.toggle('show',state.complete);
      if(state.act==='receiver') { readout.innerHTML='STATION K-17<br><strong>ATMOSPHERIC LISTENING</strong>'; hint.innerHTML='SPACE / ENTER<br>advance'; }

      else if(state.act==='choice') { readout.innerHTML='OUTBOUND CARRIER<br><strong>ONE CHOICE</strong>'; hint.innerHTML='CHOOSE A FUTURE<br>SPACE = ANSWER'; }
      else { readout.innerHTML='STATION K-17<br><strong>'+(state.chosen==='answer'?'CHANNEL OPEN':'CHANNEL QUIET')+'</strong>'; hint.innerHTML=state.complete?'REPLAY WHEN READY':'THE STORM CONTINUES'; }

    function fade(x,a,b) { return clamp((x-a)/(b-a)); }
    function arc(ctx,x,y,r,start,end,color,width=1,alpha=1) { ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); ctx.arc(x,y,r,start,end); ctx.stroke(); ctx.restore(); }

    function drawBackground(t, intensity=1) {
      const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#071514'); sky.addColorStop(.42,'#0b2220'); sky.addColorStop(.72,'#101e1a'); sky.addColorStop(1,'#030807'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

      state.stars.forEach(s=> { const twinkle=(Math.sin(t*.8+s.p)+1)/2; ctx.fillStyle=`rgba(190,231,211,${s.a*(.4+twinkle*.6)*(1-intensity*.32)})`;ctx.fillRect(s.x*W,s.y*H,s.r,s.r); });
      ctx.save(); ctx.globalAlpha=.44; ctx.fillStyle='#06100e';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=W+60;x+=38){ const y=horizon+(Math.sin(x*.011+state.seed)*22)+(Math.sin(x*.031)*11);ctx.lineTo(x,y); }ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.restore();

    function lightningAt(t) {

    }
    function drawRain(t, amount=1) {

      state.particles.forEach(p=> { const y=((p.y*H+t*p.speed*155*motion)% (H+80))-40; const x=(p.x*W + Math.sin(t*.6+p.wobble)*32 + y*.055*wind) % (W+60)-30; const alpha=p.alpha*amount*(.7+.3*Math.sin(t*2+p.wobble)); line(ctx,x,y,x-p.len*.27*wind,y+p.len,'#b5d7c9',Math.max(.45,p.lane*1.1),alpha); });
      ctx.restore();
    }
    function drawStation(t, mode) {
      const baseY=H*.79, cx=W*.49; const scale=Math.min(W/1100, H/760);
      ctx.save();
      if(mode==='message') { ctx.translate(W*.04,H*.035); ctx.scale(1.12,1.12); }
      ctx.fillStyle='#050b09';ctx.fillRect(cx-190*scale,baseY-155*scale,385*scale,160*scale);
      ctx.fillStyle='#0a1512';ctx.fillRect(cx-178*scale,baseY-145*scale,360*scale,145*scale);
      ctx.fillStyle='#030706';ctx.beginPath();ctx.moveTo(cx-205*scale,baseY-157*scale);ctx.lineTo(cx-38*scale,baseY-236*scale);ctx.lineTo(cx+215*scale,baseY-157*scale);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(184,223,202,.23)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-202*scale,baseY-157*scale);ctx.lineTo(cx-38*scale,baseY-236*scale);ctx.lineTo(cx+215*scale,baseY-157*scale);ctx.stroke();
      const win=ctx.createRadialGradient(cx+36*scale,baseY-92*scale,2,cx+36*scale,baseY-92*scale,105*scale);win.addColorStop(0,'rgba(255,209,114,.74)');win.addColorStop(.24,'rgba(210,139,67,.22)');win.addColorStop(1,'rgba(210,139,67,0)');ctx.fillStyle=win;ctx.fillRect(cx-65*scale,baseY-156*scale,210*scale,150*scale);
      ctx.fillStyle='rgba(249,183,92,.44)';ctx.fillRect(cx-3*scale,baseY-128*scale,72*scale,71*scale);ctx.fillStyle='#132018';ctx.fillRect(cx+27*scale,baseY-128*scale,3*scale,71*scale);ctx.fillRect(cx-3*scale,baseY-94*scale,72*scale,3*scale);

    function drawReceiver(t, close=false) {

    function receiverGlow(t) {
