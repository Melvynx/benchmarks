<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GPT-5.6 Sol</title>
  <style>
    :root {
      --ink: #080b12;
      --deep: #0d1420;
      --paper: #e9e0c9;
      --mist: #aab7bb;
      --signal: #f2a65a;
      --signal-hot: #ffd49a;
      --storm: #7694a5;
      --danger: #dc735e;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      font-family: "Arial Narrow", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
      color: var(--paper);
      background: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      min-height: 100svh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
    }

    button:focus-visible,
    [role="slider"]:focus-visible {
      outline: 2px solid var(--signal-hot);
      outline-offset: 5px;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      overflow: hidden;
      background: var(--ink);
    }

    #world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .16;
      mix-blend-mode: soft-light;
      background-image:
        repeating-linear-gradient(93deg, transparent 0 4px, rgba(255,255,255,.035) 5px, transparent 6px),
        repeating-linear-gradient(2deg, rgba(0,0,0,.12) 0 1px, transparent 1px 7px);
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      box-shadow: inset 0 0 18vmin 5vmin rgba(0,0,0,.82);
    }

    .topline {
      position: absolute;
      z-index: 10;
      top: max(18px, env(safe-area-inset-top));
      left: max(22px, env(safe-area-inset-left));
      right: max(22px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: clamp(18px, 4vw, 56px);
      pointer-events: none;
    }

    .identity {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: max-content;
    }

    .identity h1 {
      margin: 0;
      font-size: 11px;
      line-height: 1;
      letter-spacing: .22em;
      font-weight: 650;
      text-transform: uppercase;
    }

    .story-mark {
      color: rgba(233,224,201,.48);
      font: 9px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .progress-wrap {
      position: relative;
      max-width: 460px;
      width: 100%;
      justify-self: center;
      padding-top: 4px;
    }

    .progress-track {
      height: 1px;
      width: 100%;
      background: rgba(233,224,201,.16);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--signal);
      box-shadow: 0 0 9px rgba(242,166,90,.8);
      transform-origin: left;
      transition: width 350ms var(--ease-out);
    }

    .act-caption {
      margin-top: 7px;
      color: rgba(233,224,201,.5);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .utility {
      display: flex;
      align-items: center;
      gap: 9px;
      pointer-events: auto;
      margin-top: -8px;
    }

    .mode-readout {
      color: rgba(233,224,201,.54);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .11em;
      white-space: nowrap;
    }

    .icon-button {
      border: 1px solid rgba(233,224,201,.2);
      background: rgba(8,11,18,.3);
      padding: 8px 10px;
      min-height: 30px;
      cursor: pointer;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: color 220ms var(--ease-out), border-color 220ms var(--ease-out), background 220ms var(--ease-out), transform 120ms var(--ease-out);
      backdrop-filter: blur(8px);
    }

    .icon-button:hover {
      color: var(--signal-hot);
      border-color: rgba(242,166,90,.65);
      background: rgba(242,166,90,.08);
    }

    .icon-button:active { transform: scale(.96); }

    .narration {
      position: absolute;
      z-index: 8;
      left: clamp(22px, 7vw, 112px);
      bottom: clamp(38px, 9vh, 100px);
      width: min(620px, calc(100% - 44px));
      pointer-events: none;
    }

    .narration .eyebrow {
      min-height: 14px;
      margin-bottom: 12px;
      color: var(--signal);
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 500ms var(--ease-out), transform 500ms var(--ease-out);
    }

    .narration .line {
      margin: 0;
      max-width: 18ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4.3vw, 66px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.035em;
      text-wrap: balance;
      text-shadow: 0 3px 22px rgba(0,0,0,.8);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
    }

    .narration.visible .eyebrow,
    .narration.visible .line {
      opacity: 1;
      transform: translateY(0);
    }

    .narration.message-reveal {
      left: 50%;
      bottom: clamp(58px, 10vh, 116px);
      width: min(920px, calc(100% - 44px));
      transform: translateX(-50%);
      text-align: center;
    }

    .narration.message-reveal .line {
      max-width: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(24px, 5.8vw, 82px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .11em;
      color: var(--signal-hot);
      text-shadow: 0 0 16px rgba(242,166,90,.45), 0 3px 22px rgba(0,0,0,.85);
    }

    .fragment-panel {
      position: absolute;
      z-index: 9;
      top: 50%;
      left: 50%;
      width: min(760px, calc(100% - 44px));
      transform: translate(-50%, -46%);
      display: grid;
      gap: clamp(14px, 2.2vh, 24px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 600ms var(--ease-out), visibility 0s linear 600ms;
    }

    .fragment-panel.visible {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }

    .fragment-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px;
    }

    .fragment-instruction {
      color: rgba(233,224,201,.72);
      font: 9px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .fragment-count {
      color: var(--signal);
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
    }

    .fragment-control {
      --value: .5;
      --target: .5;
      --aligned: 0;
      position: relative;
      height: clamp(58px, 9vh, 80px);
      border: 1px solid rgba(170,183,187,.22);
      background:
        linear-gradient(90deg, transparent calc(var(--target) * 100% - 1px), rgba(255,212,154,.65) calc(var(--target) * 100% - 1px), rgba(255,212,154,.65) calc(var(--target) * 100% + 1px), transparent calc(var(--target) * 100% + 1px)),
        repeating-linear-gradient(90deg, rgba(233,224,201,.03) 0 1px, transparent 1px 8%);
      cursor: ew-resize;
      touch-action: none;
      overflow: hidden;
      transition: border-color 300ms var(--ease-out), background-color 300ms var(--ease-out), box-shadow 300ms var(--ease-out);
    }

    .fragment-control::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(118,148,165,.09), transparent);
      transform: translateX(calc((var(--value) - .5) * 80%));
    }

    .fragment-control.aligned {
      border-color: rgba(242,166,90,.7);
      background-color: rgba(242,166,90,.07);
      box-shadow: inset 0 0 24px rgba(242,166,90,.06), 0 0 18px rgba(242,166,90,.08);
      cursor: default;
    }

    .fragment-index {
      position: absolute;
      left: 12px;
      top: 10px;
      color: rgba(233,224,201,.42);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
    }

    .fragment-knob {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--value) * 100%);
      width: 18px;
      transform: translateX(-50%);
      border-left: 1px solid var(--signal-hot);
      border-right: 1px solid rgba(242,166,90,.2);
      background: linear-gradient(90deg, rgba(242,166,90,.08), rgba(242,166,90,.2), rgba(242,166,90,.06));
      box-shadow: 0 0 18px rgba(242,166,90,.18);
      transition: width 180ms var(--ease-out), background 180ms var(--ease-out);
    }

    .fragment-control.aligned .fragment-knob {
      width: 4px;
      background: var(--signal-hot);
      box-shadow: 0 0 16px rgba(255,212,154,.72);
    }

    .fragment-status {
      position: absolute;
      right: 12px;
      bottom: 9px;
      color: rgba(233,224,201,.38);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .fragment-control.aligned .fragment-status { color: var(--signal-hot); }

    .choice-panel {
      position: absolute;
      z-index: 10;
      right: clamp(22px, 8vw, 120px);
      top: 50%;
      width: min(360px, calc(100% - 44px));
      transform: translateY(-42%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out), visibility 0s linear 600ms;
    }

    .choice-panel.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%);
      transition-delay: 0s;
    }

    .choice-prompt {
      margin: 0 0 24px;
      color: rgba(233,224,201,.68);
      font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .choice-buttons {
      display: grid;
      gap: 10px;
    }

    .choice-button {
      position: relative;
      min-height: 68px;
      padding: 18px 22px;
      border: 1px solid rgba(233,224,201,.28);
      background: rgba(8,11,18,.56);
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: border-color 260ms var(--ease-out), color 260ms var(--ease-out), transform 120ms var(--ease-out), background 260ms var(--ease-out);
    }

    .choice-button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(242,166,90,.16), transparent 70%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 320ms var(--ease-out);
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      border-color: var(--signal);
      color: var(--signal-hot);
      background: rgba(19,20,22,.72);
    }

    .choice-button:hover::after,
    .choice-button:focus-visible::after { transform: scaleX(1); }
    .choice-button:active { transform: scale(.98); }

    .choice-button strong {
      position: relative;
      z-index: 1;
      display: block;
      font-size: 15px;
      line-height: 1;
      letter-spacing: .22em;
    }

    .choice-button span {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 9px;
      color: rgba(233,224,201,.44);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
    }

    .ending-panel {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(34px, env(safe-area-inset-bottom));
      width: min(620px, calc(100% - 44px));
      text-align: center;
      transform: translate(-50%, 12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 800ms var(--ease-out), transform 800ms var(--ease-out), visibility 0s linear 800ms;
    }

    .ending-panel.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      transition-delay: 0s;
    }

    .ending-kicker {
      color: var(--signal);
      font: 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .ending-line {
      margin: 13px auto 22px;
      max-width: 25ch;
      font: 24px/1.15 Georgia, "Times New Roman", serif;
      text-wrap: balance;
    }

    .ending-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .ending-actions .icon-button {
      min-height: 38px;
      padding-inline: 15px;
      background: rgba(8,11,18,.64);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .topline {
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      .progress-wrap {
        grid-row: 2;
        grid-column: 1 / -1;
        max-width: none;
      }

      .story-mark { display: none; }
      .mode-readout { display: none; }

      .narration {
        left: 22px;
        bottom: max(34px, calc(env(safe-area-inset-bottom) + 24px));
      }

      .narration .line { font-size: clamp(30px, 10vw, 48px); }
      .narration.message-reveal { left: 50%; bottom: 9vh; }
      .narration.message-reveal .line { font-size: clamp(20px, 7vw, 36px); line-height: 1.12; }

      .fragment-panel {
        top: 53%;
        transform: translate(-50%, -50%);
        gap: 11px;
      }

      .fragment-control { height: 62px; }

      .choice-panel {
        right: auto;
        left: 50%;
        top: auto;
        bottom: max(36px, env(safe-area-inset-bottom));
        transform: translate(-50%, 12px);
      }

      .choice-panel.visible { transform: translate(-50%, 0); }
      .choice-button { min-height: 60px; }
      .ending-line { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .grain { opacity: .1; }
    }
  </style>
</head>
<body>
  <main class="experience" aria-label="The Last Signal interactive visual story">
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topline">
      <div class="identity">
        <h1>GPT-5.6 Sol</h1>
        <span class="story-mark">The Last Signal</span>
      </div>
      <div class="progress-wrap" role="progressbar" aria-label="Story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="act-caption">I · The receiver</div>
      </div>
      <div class="utility">
        <span class="mode-readout">AUTO · 217</span>
        <button class="icon-button" id="restart" type="button" aria-label="Replay from the beginning">Restart</button>
      </div>
    </header>

    <section class="narration" aria-live="polite" aria-atomic="true">
      <div class="eyebrow"></div>
      <p class="line"></p>
    </section>

    <section class="fragment-panel" aria-label="Align the three signal fragments">
      <div class="fragment-header">
        <div class="fragment-instruction">Drag the broken frequencies into phase<br>Arrow keys adjust the focused band</div>
        <div class="fragment-count">0 / 3</div>
      </div>
      <div class="fragment-control" role="slider" tabindex="0" aria-label="Signal fragment one" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-index="0">
        <span class="fragment-index">FRAGMENT 01</span>
        <span class="fragment-knob"></span>
        <span class="fragment-status">unstable</span>
      </div>
      <div class="fragment-control" role="slider" tabindex="0" aria-label="Signal fragment two" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-index="1">
        <span class="fragment-index">FRAGMENT 02</span>
        <span class="fragment-knob"></span>
        <span class="fragment-status">unstable</span>
      </div>
      <div class="fragment-control" role="slider" tabindex="0" aria-label="Signal fragment three" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-index="2">
        <span class="fragment-index">FRAGMENT 03</span>
        <span class="fragment-knob"></span>
        <span class="fragment-status">unstable</span>
      </div>
    </section>

    <section class="choice-panel" aria-label="Choose the operator's response">
      <p class="choice-prompt">Thirty years of silence wait on the wire.</p>
      <div class="choice-buttons">
        <button class="choice-button" id="answer" type="button">
          <strong>Answer</strong>
          <span>Send one human pulse into the storm</span>
        </button>
        <button class="choice-button" id="silent" type="button">
          <strong>Stay Silent</strong>
          <span>Let the impossible transmission pass</span>
        </button>
      </div>
    </section>

    <section class="ending-panel" aria-live="polite">
      <div class="ending-kicker"></div>
      <p class="ending-line"></p>
      <div class="ending-actions">
        <button class="icon-button" id="replay" type="button">Replay manually</button>
        <button class="icon-button" id="alternate" type="button">Follow silence</button>
      </div>
    </section>

    <div class="sr-only" id="a11y-status" aria-live="assertive"></div>
  </main>

  <script>
  (() => {
    'use strict';

    const MODEL = 'GPT-5.6 Sol';
    const STEP = 1000 / 60;
    const ACTS = ['receiver', 'message', 'choice', 'aftermath'];
    const ACT_LENGTHS = [24000, 34000, 18000, 26000];
    const TARGETS = [0.217, 0.503, 0.783];
    const TOLERANCE = 0.026;
    const STARTUP = Object.freeze({ seed: 217, autoplay: true, ending: 'answer' });

    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });
    const narration = document.querySelector('.narration');
    const eyebrow = narration.querySelector('.eyebrow');
    const line = narration.querySelector('.line');
    const fragmentPanel = document.querySelector('.fragment-panel');
    const fragmentControls = [...document.querySelectorAll('.fragment-control')];
    const fragmentCount = document.querySelector('.fragment-count');
    const choicePanel = document.querySelector('.choice-panel');
    const endingPanel = document.querySelector('.ending-panel');
    const endingKicker = endingPanel.querySelector('.ending-kicker');
    const endingLine = endingPanel.querySelector('.ending-line');
    const alternateButton = document.getElementById('alternate');
    const progressWrap = document.querySelector('.progress-wrap');
    const progressFill = document.querySelector('.progress-fill');
    const actCaption = document.querySelector('.act-caption');
    const modeReadout = document.querySelector('.mode-readout');
    const a11yStatus = document.getElementById('a11y-status');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    let width = 1;
    let height = 1;
    let dpr = 1;
    let raf = 0;
    let lastFrame = performance.now();
    let accumulator = 0;
    let lastUiKey = '';
    let dragIndex = -1;
    let selfTesting = false;

    const state = {
      seed: STARTUP.seed,
      actIndex: 0,
      actTime: 0,
      totalTime: 0,
      fragments: [0, 0, 0],
      fragmentStarts: [0, 0, 0],
      aligned: [false, false, false],
      alignedSince: null,
      choiceAvailable: false,
      ending: null,
      completed: false,
      autoplay: STARTUP.autoplay,
      autoplayEnding: STARTUP.ending,
      manualOverride: false,
      rng: null,
      rain: [],
      flecks: [],
      stars: []
    };

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function random() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = t => {
      const v = clamp(t, 0, 1);
      return v * v * (3 - 2 * v);
    };
    const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
    const pulse = (t, at, span) => Math.max(0, 1 - Math.abs(t - at) / span);
    const finite = value => Number.isFinite(value) ? value : 0;

    function reset(seed = STARTUP.seed) {
      const parsed = Number(seed);
      state.seed = Number.isFinite(parsed) ? Math.trunc(parsed) : STARTUP.seed;
      state.actIndex = 0;
      state.actTime = 0;
      state.totalTime = 0;
      state.alignedSince = null;
      state.choiceAvailable = false;
      state.ending = null;
      state.completed = false;
      state.manualOverride = false;
      state.rng = mulberry32(state.seed);

      state.fragments = [0, 1, 2].map((_, index) => {
        let value = .08 + state.rng() * .84;
        if (Math.abs(value - TARGETS[index]) < .16) {
          value = (value + .34 + index * .11) % .9 + .04;
        }
        return clamp(value, .04, .96);
      });
      state.fragmentStarts = state.fragments.slice();
      state.aligned = [false, false, false];

      state.rain = Array.from({ length: 150 }, () => ({
        x: state.rng(),
        y: state.rng(),
        length: .018 + state.rng() * .065,
        speed: .045 + state.rng() * .11,
        depth: .25 + state.rng() * .75
      }));
      state.flecks = Array.from({ length: 90 }, () => ({
        x: state.rng(),
        y: state.rng(),
        size: .3 + state.rng() * 1.8,
        alpha: .025 + state.rng() * .12
      }));
      state.stars = Array.from({ length: 48 }, () => ({
        x: .08 + state.rng() * .84,
        y: .07 + state.rng() * .54,
        size: .5 + state.rng() * 1.6,
        delay: state.rng() * 2
      }));

      lastFrame = performance.now();
      accumulator = 0;
      lastUiKey = '';
      updateUI(true);
      draw();
      return snapshot();
    }

    function setAutoplay(enabled, ending = state.autoplayEnding) {
      state.autoplay = Boolean(enabled);
      if (ending === 'answer' || ending === 'silent') state.autoplayEnding = ending;
      if (state.autoplay) state.manualOverride = false;
      updateUI(true);
      return snapshot();
    }

    function seek(milliseconds) {
      const value = Number(milliseconds);
      if (!Number.isFinite(value)) return snapshot();
      const max = ACT_LENGTHS[state.actIndex];
      state.actTime = clamp(value, 0, max);
      if (state.actIndex === 2) {
        state.choiceAvailable = state.actTime >= 6000 && state.aligned.every(Boolean) && !state.ending;
      }
      if (state.actIndex === 3) state.completed = state.actTime >= ACT_LENGTHS[3];
      updateUI(true);
      draw();
      return snapshot();
    }

    function alignFragment(index, value, internal = false) {
      const i = Number(index);
      const v = Number(value);
      if (!Number.isInteger(i) || i < 0 || i > 2 || !Number.isFinite(v)) return false;
      if (state.actIndex !== 1) return false;
      if (!internal) takeControl();
      state.fragments[i] = clamp(v, 0, 1);
      const wasAligned = state.aligned[i];
      state.aligned[i] = Math.abs(state.fragments[i] - TARGETS[i]) <= TOLERANCE;
      if (state.aligned[i]) state.fragments[i] = TARGETS[i];

      if (!wasAligned && state.aligned[i] && !selfTesting) {
        a11yStatus.textContent = `Fragment ${i + 1} aligned.`;
      }

      if (state.aligned.every(Boolean)) {
        if (state.alignedSince === null) state.alignedSince = state.actTime;
      } else {
        state.alignedSince = null;
      }
      if (!internal) updateUI(true);
      return state.aligned[i];
    }

    function choose(ending, internal = false) {
      if (ending !== 'answer' && ending !== 'silent') return false;
      if (!state.choiceAvailable || state.actIndex !== 2) return false;
      if (!internal) takeControl();
      state.ending = ending;
      state.choiceAvailable = false;
      setAct(3);
      if (!selfTesting) a11yStatus.textContent = ending === 'answer' ? 'The operator answers.' : 'The operator stays silent.';
      return true;
    }

    function snapshot() {
      return {
        seed: state.seed,
        act: ACTS[state.actIndex],
        actTime: Math.round(finite(state.actTime) * 1000) / 1000,
        fragments: state.fragments.map((value, index) => ({
          value: Math.round(finite(value) * 100000) / 100000,
          target: TARGETS[index],
          aligned: Boolean(state.aligned[index])
        })),
        choiceAvailable: Boolean(state.choiceAvailable),
        selectedEnding: state.ending,
        completed: Boolean(state.completed),
        autoplay: Boolean(state.autoplay),
        autoplayEnding: state.autoplayEnding
      };
    }

    function setAct(index) {
      state.actIndex = clamp(Math.trunc(index), 0, ACTS.length - 1);
      state.actTime = 0;
      state.choiceAvailable = false;
      lastUiKey = '';
      updateUI(true);
    }

    function updateAutoplay() {
      if (!state.autoplay || state.manualOverride) return;

      if (state.actIndex === 1) {
        const t = smooth((state.actTime - 6000) / 13500);
        if (t > 0) {
          for (let i = 0; i < 3; i += 1) {
            const staggered = smooth((state.actTime - (6000 + i * 1200)) / 11100);
            const value = lerp(state.fragmentStarts[i], TARGETS[i], staggered);
            alignFragment(i, value, true);
          }
        }
      }

      if (state.actIndex === 2 && state.choiceAvailable && state.actTime >= 8500) {
        choose(state.autoplayEnding, true);
      }
    }

    function update(dt) {
      if (state.completed) return;
      state.actTime += dt;
      state.totalTime += dt;

      updateAutoplay();

      if (state.actIndex === 0 && state.actTime >= ACT_LENGTHS[0]) {
        setAct(1);
      } else if (state.actIndex === 1) {
        const alignedLongEnough = state.alignedSince !== null && state.actTime - state.alignedSince >= 7000;
        if (alignedLongEnough || (state.actTime >= ACT_LENGTHS[1] && state.aligned.every(Boolean))) {
          setAct(2);
        } else if (state.actTime > ACT_LENGTHS[1]) {
          state.actTime = ACT_LENGTHS[1];
        }
      } else if (state.actIndex === 2) {
        state.choiceAvailable = state.actTime >= 6000 && !state.ending;
        if (state.actTime > ACT_LENGTHS[2] && !state.ending) state.actTime = ACT_LENGTHS[2];
      } else if (state.actIndex === 3 && state.actTime >= ACT_LENGTHS[3]) {
        state.actTime = ACT_LENGTHS[3];
        state.completed = true;
      }

      updateUI();
    }

    function advance(milliseconds) {
      const target = Math.max(0, Number(milliseconds) || 0);
      let elapsed = 0;
      let guard = 0;
      while (elapsed < target && guard < 20000) {
        const step = Math.min(STEP, target - elapsed);
        update(step);
        elapsed += step;
        guard += 1;
      }
    }

    function takeControl() {
      if (state.autoplay) {
        state.autoplay = false;
        state.manualOverride = true;
        modeReadout.textContent = `MANUAL · ${state.seed}`;
      }
    }

    function updateUI(force = false) {
      const alignedCount = state.aligned.filter(Boolean).length;
      const reveal = state.actIndex === 1 && state.aligned.every(Boolean) && state.alignedSince !== null;
      const choicesVisible = state.actIndex === 2 && state.choiceAvailable;
      const endingVisible = state.actIndex === 3 && state.completed;
      const uiKey = [state.actIndex, Math.floor(state.actTime / 500), alignedCount, reveal, choicesVisible, state.ending, state.completed, state.autoplay].join('|');
      if (!force && uiKey === lastUiKey) return;
      lastUiKey = uiKey;

      const actProgress = clamp(state.actTime / ACT_LENGTHS[state.actIndex], 0, 1);
      const totalProgress = (state.actIndex + actProgress) / ACTS.length * 100;
      progressFill.style.width = `${totalProgress}%`;
      progressWrap.setAttribute('aria-valuenow', String(Math.round(totalProgress)));
      actCaption.textContent = [
        'I · The receiver',
        'II · The message',
        'III · The choice',
        state.ending === 'silent' ? 'Aftermath · Silence' : 'Aftermath · Answer'
      ][state.actIndex];
      modeReadout.textContent = `${state.autoplay ? 'AUTO' : 'MANUAL'} · ${state.seed}`;

      narration.classList.toggle('message-reveal', reveal);
      let visible = false;
      let eyebrowText = '';
      let lineText = '';

      if (state.actIndex === 0) {
        if (state.actTime >= 3000 && state.actTime < 8200) {
          visible = true;
          eyebrowText = 'North Atlantic Listening Post · abandoned frequency';
          lineText = 'For thirty years, Mara kept watch over an empty sky.';
        } else if (state.actTime >= 10400 && state.actTime < 20500) {
          visible = true;
          eyebrowText = '02:17:00';
          lineText = 'At 02:17, the dead receiver began to glow.';
        }
      } else if (state.actIndex === 1) {
        if (reveal) {
          visible = true;
          eyebrowText = 'Signal resolved';
          lineText = 'WE REMEMBER YOUR SKY.';
        } else if (state.actTime < 5800) {
          visible = true;
          eyebrowText = 'Three fragments · one carrier';
          lineText = 'The voice arrived broken across the storm.';
        }
      } else if (state.actIndex === 2 && state.actTime < 6000) {
        visible = true;
        eyebrowText = 'The room waits';
        lineText = 'A hand above the key. A whole world asleep.';
      } else if (state.actIndex === 3 && !state.completed) {
        if (state.ending === 'answer' && state.actTime > 2600 && state.actTime < 12500) {
          visible = true;
          eyebrowText = 'Transmission open';
          lineText = state.actTime < 6800 ? 'Mara sent no words.' : 'Only the sound of rain on our roof.';
        } else if (state.ending === 'silent' && state.actTime > 3500 && state.actTime < 13000) {
          visible = true;
          eyebrowText = 'Carrier fading';
          lineText = state.actTime < 7800 ? 'Her hand left the key untouched.' : 'The signal folded back into weather.';
        }
      }

      eyebrow.textContent = eyebrowText;
      line.textContent = lineText;
      narration.classList.toggle('visible', visible);

      const fragmentVisible = state.actIndex === 1 && state.actTime >= 5400 && !reveal;
      fragmentPanel.classList.toggle('visible', fragmentVisible);
      fragmentPanel.setAttribute('aria-hidden', String(!fragmentVisible));
      fragmentCount.textContent = `${alignedCount} / 3`;
      fragmentControls.forEach((control, index) => {
        const value = state.fragments[index];
        control.style.setProperty('--value', value.toFixed(5));
        control.style.setProperty('--target', TARGETS[index].toFixed(5));
        control.classList.toggle('aligned', state.aligned[index]);
        control.setAttribute('aria-valuenow', String(Math.round(value * 100)));
        control.setAttribute('aria-valuetext', state.aligned[index] ? 'Aligned' : `${Math.round(value * 100)} percent, unstable`);
        control.querySelector('.fragment-status').textContent = state.aligned[index] ? 'in phase' : 'unstable';
      });

      choicePanel.classList.toggle('visible', choicesVisible);
      choicePanel.setAttribute('aria-hidden', String(!choicesVisible));
      endingPanel.classList.toggle('visible', endingVisible);
      endingPanel.setAttribute('aria-hidden', String(!endingVisible));

      if (endingVisible) {
        if (state.ending === 'answer') {
          endingKicker.textContent = 'Answer · 02:18';
          endingLine.textContent = 'Far beyond the storm, something turns toward the sound of rain.';
          alternateButton.textContent = 'Follow silence';
        } else {
          endingKicker.textContent = 'Silence · 02:18';
          endingLine.textContent = 'By dawn, three new stars remain where the signal disappeared.';
          alternateButton.textContent = 'Follow the answer';
        }
      }
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, Math.round(rect.width));
      height = Math.max(1, Math.round(rect.height));
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function clear(color = '#080b12') {
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, width, height);
    }

    function linePath(points, color, lineWidth = 1, alpha = 1) {
      if (!points.length) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i][0], points[i][1]);
      ctx.stroke();
      ctx.restore();
    }

    function drawSky(time, calm = 0) {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, calm > .5 ? '#101b28' : '#111827');
      gradient.addColorStop(.62, calm > .5 ? '#172331' : '#18232e');
      gradient.addColorStop(1, '#080b12');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      const flash = reducedMotion.matches ? 0 : Math.max(
        pulse(time, 3600, 180),
        pulse(time, 11200, 130),
        pulse(time, 19400, 210)
      ) * (1 - calm);
      if (flash > 0) {
        ctx.fillStyle = `rgba(174,199,210,${flash * .34})`;
        ctx.fillRect(0, 0, width, height);
      }

      ctx.save();
      ctx.globalAlpha = .18 * (1 - calm * .8);
      ctx.strokeStyle = '#9cb4be';
      ctx.lineCap = 'square';
      const drift = reducedMotion.matches ? 0 : time * .000045;
      for (const drop of state.rain) {
        let y = (drop.y + drift * drop.speed * 12) % 1.15 - .05;
        let x = (drop.x - drift * .8 + y * .14) % 1.15;
        if (x < -.1) x += 1.15;
        const px = x * width;
        const py = y * height;
        ctx.globalAlpha = (.05 + drop.depth * .23) * (1 - calm * .78);
        ctx.lineWidth = .4 + drop.depth * 1.2;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - drop.length * width * .22, py + drop.length * height);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPaperFlecks(alpha = 1) {
      ctx.save();
      for (const fleck of state.flecks) {
        ctx.globalAlpha = fleck.alpha * alpha;
        ctx.fillStyle = '#e9e0c9';
        ctx.fillRect(fleck.x * width, fleck.y * height, fleck.size, fleck.size * .36);
      }
      ctx.restore();
    }

    function drawStation(scale = 1, offsetX = 0, offsetY = 0, interiorGlow = .12) {
      const baseY = height * .79 + offsetY;
      const stationW = Math.min(width * .45, height * .62) * scale;
      const stationH = stationW * .48;
      const x = width * .54 - stationW / 2 + offsetX;
      const y = baseY - stationH;

      ctx.save();
      ctx.fillStyle = '#06090e';
      ctx.beginPath();
      ctx.moveTo(x - stationW * .08, baseY);
      ctx.lineTo(x, y + stationH * .16);
      ctx.lineTo(x + stationW * .42, y);
      ctx.lineTo(x + stationW, y + stationH * .19);
      ctx.lineTo(x + stationW * 1.04, baseY);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(170,183,187,.17)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + stationW * .1, y + stationH * .34, stationW * .78, stationH * .58);
      ctx.beginPath();
      ctx.moveTo(x + stationW * .42, y + stationH * .09);
      ctx.lineTo(x + stationW * .42, baseY);
      ctx.moveTo(x + stationW * .72, y + stationH * .14);
      ctx.lineTo(x + stationW * .72, baseY);
      ctx.stroke();

      const windowX = x + stationW * .49;
      const windowY = y + stationH * .42;
      const windowW = stationW * .16;
      const windowH = stationH * .2;
      const glow = ctx.createRadialGradient(windowX + windowW / 2, windowY + windowH / 2, 0, windowX + windowW / 2, windowY + windowH / 2, stationW * .32);
      glow.addColorStop(0, `rgba(242,166,90,${interiorGlow})`);
      glow.addColorStop(1, 'rgba(242,166,90,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(windowX - stationW * .3, windowY - stationH * .5, stationW * .75, stationH * 1.15);
      ctx.fillStyle = `rgba(242,166,90,${.22 + interiorGlow * .7})`;
      ctx.fillRect(windowX, windowY, windowW, windowH);
      ctx.fillStyle = 'rgba(8,11,18,.72)';
      ctx.fillRect(windowX + windowW * .47, windowY, 2, windowH);

      const mastX = x + stationW * .76;
      const mastTop = y - stationH * 1.26;
      ctx.strokeStyle = '#080b12';
      ctx.lineWidth = Math.max(2, stationW * .012);
      ctx.beginPath();
      ctx.moveTo(mastX, y + stationH * .1);
      ctx.lineTo(mastX, mastTop);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(170,183,187,.4)';
      for (let i = 0; i < 6; i += 1) {
        const yy = lerp(mastTop, y, i / 5);
        ctx.beginPath();
        ctx.moveTo(mastX - stationW * .04, yy);
        ctx.lineTo(mastX + stationW * .04, yy);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(mastX, mastTop + stationH * .2);
      ctx.lineTo(mastX - stationW * .16, y);
      ctx.moveTo(mastX, mastTop + stationH * .2);
      ctx.lineTo(mastX + stationW * .17, y);
      ctx.stroke();

      ctx.fillStyle = '#05070b';
      ctx.beginPath();
      ctx.moveTo(0, baseY - height * .03);
      for (let i = 0; i <= 12; i += 1) {
        const px = i / 12 * width;
        const py = baseY + Math.sin(i * 1.7) * height * .018;
        ctx.lineTo(px, py);
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSignalRings(x, y, time, intensity = 1, inward = false) {
      ctx.save();
      ctx.strokeStyle = '#f2a65a';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i += 1) {
        const phase = inward ? 1 - ((time * .00018 + i / 3) % 1) : (time * .00018 + i / 3) % 1;
        const radius = lerp(8, Math.min(width, height) * .17, phase);
        ctx.globalAlpha = intensity * (1 - phase) * .5;
        ctx.beginPath();
        ctx.arc(x, y, radius, -Math.PI * .72, Math.PI * .72);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawReceiver(time, intensity = 1, close = false) {
      const x = close ? width * .5 : width * .66;
      const y = close ? height * .48 : height * .58;
      const radius = close ? Math.min(width, height) * .25 : Math.min(width, height) * .075;
      const wake = smooth((time - 9000) / 4500) * intensity;

      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(5,8,12,.92)';
      ctx.strokeStyle = 'rgba(233,224,201,.26)';
      ctx.lineWidth = close ? 3 : 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      const glow = ctx.createRadialGradient(0, 0, radius * .05, 0, 0, radius * 1.25);
      glow.addColorStop(0, `rgba(255,212,154,${.3 * wake})`);
      glow.addColorStop(.45, `rgba(242,166,90,${.18 * wake})`);
      glow.addColorStop(1, 'rgba(242,166,90,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = wake > .05 ? `rgba(255,212,154,${.38 + wake * .58})` : 'rgba(170,183,187,.24)';
      ctx.lineWidth = close ? 2 : 1;
      for (let ring = 1; ring <= 3; ring += 1) {
        ctx.globalAlpha = .32 + ring * .16;
        ctx.beginPath();
        ctx.arc(0, 0, radius * ring * .25, Math.PI * 1.08, Math.PI * 1.92);
        ctx.stroke();
      }

      const needlePhase = reducedMotion.matches ? 0 : Math.sin(time * .008) * wake;
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#f2a65a';
      ctx.lineWidth = close ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(0, radius * .06);
      ctx.lineTo(Math.sin(needlePhase) * radius * .6, -Math.cos(needlePhase) * radius * .6);
      ctx.stroke();
      ctx.fillStyle = '#ffd49a';
      ctx.beginPath();
      ctx.arc(0, 0, close ? 5 : 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (wake > .12) drawSignalRings(x, y, time, wake * .8);
    }

    function drawOperator(x, y, scale = 1, pose = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#06090e';
      ctx.beginPath();
      ctx.ellipse(0, -78, 23, 27, -.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-27, -58);
      ctx.quadraticCurveTo(-46, -10, -38, 48);
      ctx.lineTo(33, 48);
      ctx.quadraticCurveTo(39, -9, 25, -58);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#06090e';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(20, -38);
      ctx.quadraticCurveTo(50, -5, 80 + pose * 18, 7 - pose * 17);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(170,183,187,.17)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, -78, 24, -.85, 1.8);
      ctx.stroke();
      ctx.restore();
    }

    function drawInterior(time, choicePose = 0, warmth = 0) {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#080c13');
      gradient.addColorStop(.65, '#11161d');
      gradient.addColorStop(1, warmth > .1 ? '#271a13' : '#0b0e13');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(170,183,187,.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 7; i += 1) {
        const x = i / 7 * width;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - width * .1, height);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(4,6,9,.95)';
      ctx.beginPath();
      ctx.moveTo(width * .43, height * .69);
      ctx.lineTo(width * .92, height * .69);
      ctx.lineTo(width, height * .83);
      ctx.lineTo(width * .34, height * .83);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(233,224,201,.13)';
      ctx.stroke();

      const scale = clamp(Math.min(width / 1100, height / 720), .68, 1.25);
      drawOperator(width * .37, height * .72, scale, choicePose);
      drawReceiver(time, 1, false);

      ctx.fillStyle = `rgba(242,166,90,${.04 + warmth * .08})`;
      ctx.fillRect(width * .48, height * .69, width * .42, height * .14);
    }

    function drawWaveBand(index, y, value, aligned, time, alpha = 1) {
      const target = TARGETS[index];
      const phaseShift = (value - target) * Math.PI * 8;
      const amp = height * (.018 + index * .004);
      const points = [];
      const segments = 100;
      for (let i = 0; i <= segments; i += 1) {
        const x = width * .12 + i / segments * width * .76;
        const n = i / segments;
        const carrier = Math.sin(n * Math.PI * (12 + index * 3) + phaseShift + time * .00055 * (index + 1));
        const envelope = .25 + Math.pow(Math.sin(n * Math.PI), 2) * .75;
        const fracture = aligned ? 0 : Math.sin(n * 48 + phaseShift) * amp * .3;
        points.push([x, y + carrier * amp * envelope + fracture]);
      }
      linePath(points, aligned ? '#ffd49a' : '#8ca7b2', aligned ? 2 : 1, alpha * (aligned ? .92 : .48));

      ctx.save();
      ctx.globalAlpha = alpha * (aligned ? .26 : .1);
      ctx.fillStyle = aligned ? '#f2a65a' : '#7694a5';
      for (let i = 4; i < points.length; i += 9) {
        const p = points[i];
        ctx.fillRect(p[0] - 1, p[1] - 1, aligned ? 3 : 2, aligned ? 3 : 2);
      }
      ctx.restore();
    }

    function drawActReceiver() {
      const t = state.actTime;
      const interiorMix = smooth((t - 6500) / 4500);
      drawSky(t, 0);
      const push = reducedMotion.matches ? 0 : easeOut(t / ACT_LENGTHS[0]) * .07;
      drawStation(1 + push, -push * width * .3, push * height * .1, .08 + smooth((t - 9000) / 5000) * .28);

      if (interiorMix > 0) {
        ctx.save();
        ctx.globalAlpha = interiorMix;
        drawInterior(t, 0, smooth((t - 9500) / 6000));
        ctx.restore();
      }

      if (t > 12600) {
        const slash = smooth((t - 12600) / 1200);
        ctx.save();
        ctx.globalAlpha = slash * .25;
        ctx.strokeStyle = '#ffd49a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(width * .05, height * .22);
        ctx.lineTo(width * (.05 + slash * .9), height * .22);
        ctx.stroke();
        ctx.restore();
      }
      drawPaperFlecks(.45);
    }

    function drawActMessage() {
      const t = state.actTime;
      clear('#080c13');

      const glow = ctx.createRadialGradient(width * .5, height * .47, 0, width * .5, height * .47, Math.min(width, height) * .58);
      const alignedCount = state.aligned.filter(Boolean).length;
      glow.addColorStop(0, `rgba(242,166,90,${.025 + alignedCount * .025})`);
      glow.addColorStop(1, 'rgba(8,11,18,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width * .5, height * .46);
      ctx.strokeStyle = 'rgba(233,224,201,.08)';
      ctx.lineWidth = 1;
      const ringBase = Math.min(width, height) * .13;
      for (let i = 1; i <= 4; i += 1) {
        ctx.beginPath();
        ctx.arc(0, 0, ringBase * i, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      const ys = [height * .35, height * .47, height * .59];
      const reveal = state.alignedSince === null ? 0 : smooth((t - state.alignedSince) / 3000);
      for (let i = 0; i < 3; i += 1) {
        const convergeY = lerp(ys[i], height * .47, reveal);
        drawWaveBand(i, convergeY, state.fragments[i], state.aligned[i], t, 1 - reveal * .25);
      }

      if (reveal > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.strokeStyle = `rgba(255,212,154,${reveal * .7})`;
        ctx.lineWidth = 1 + reveal * 2;
        ctx.beginPath();
        ctx.moveTo(width * .09, height * .47);
        ctx.lineTo(width * .91, height * .47);
        ctx.stroke();
        ctx.restore();
        drawSignalRings(width * .5, height * .47, t, reveal * .8);
      }
      drawPaperFlecks(.35);
    }

    function drawActChoice() {
      const t = state.actTime;
      drawSky(t + 8000, .12);
      ctx.save();
      ctx.globalAlpha = .9;
      drawInterior(t + 14000, smooth((t - 3500) / 2500), .35);
      ctx.restore();

      const motifX = width < 720 ? width * .28 : width * .31;
      const motifY = height * .34;
      ctx.save();
      ctx.strokeStyle = '#f2a65a';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i += 1) {
        const radius = Math.min(width, height) * (.045 + i * .042);
        ctx.globalAlpha = .18 + i * .09;
        ctx.beginPath();
        ctx.arc(motifX, motifY, radius, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      }
      ctx.restore();
      drawPaperFlecks(.4);
    }

    function drawAnswerEnding() {
      const t = state.actTime;
      const open = smooth((t - 2800) / 6500);
      const calm = smooth((t - 13000) / 9000);
      drawSky(t + 16000, calm * .62);
      drawStation(1, 0, 0, .34 * (1 - calm * .7));

      const towerX = width * .54 + Math.min(width * .45, height * .62) * .26;
      const towerY = height * .79 - Math.min(width * .45, height * .62) * .48 * 1.26;
      ctx.save();
      ctx.strokeStyle = '#f2a65a';
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 8; i += 1) {
        const phase = clamp(open * 1.2 - i * .08, 0, 1);
        const radius = phase * Math.hypot(width, height) * (.12 + i * .055);
        ctx.globalAlpha = (1 - i / 10) * .35 * open * (1 - calm * .6);
        ctx.lineWidth = i === 0 ? 3 : 1;
        ctx.beginPath();
        ctx.arc(towerX, towerY, radius, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
      }
      ctx.restore();

      const turn = smooth((t - 10500) / 7200);
      if (turn > 0) {
        ctx.save();
        ctx.translate(width * .72, height * .27);
        ctx.rotate(-.18);
        ctx.strokeStyle = `rgba(255,212,154,${turn * .38})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i += 1) {
          ctx.beginPath();
          ctx.ellipse(0, 0, width * (.08 + i * .045), height * (.025 + i * .02), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      drawPaperFlecks(.42);
    }

    function drawSilentEnding() {
      const t = state.actTime;
      const fold = smooth((t - 2600) / 7200);
      const clearSky = smooth((t - 10500) / 9000);
      drawSky(t + 9000, clearSky);
      drawStation(1, 0, 0, .24 * (1 - fold));

      const x = width * .66;
      const y = height * .5;
      ctx.save();
      ctx.strokeStyle = '#f2a65a';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i += 1) {
        const radius = lerp(Math.min(width, height) * (.19 - i * .035), 4 + i * 6, fold);
        ctx.globalAlpha = .44 * (1 - fold * .58);
        ctx.beginPath();
        ctx.arc(x, y, radius, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      }
      ctx.restore();

      if (clearSky > 0) {
        ctx.save();
        for (const star of state.stars) {
          const reveal = clamp(clearSky * 1.5 - star.delay * .16, 0, 1);
          ctx.globalAlpha = reveal * .34;
          ctx.fillStyle = '#e9e0c9';
          ctx.fillRect(star.x * width, star.y * height, star.size, star.size);
        }
        const constellation = [
          [width * .44, height * .21],
          [width * .52, height * .16],
          [width * .59, height * .25]
        ];
        ctx.globalAlpha = clearSky;
        constellation.forEach((point, i) => {
          const halo = ctx.createRadialGradient(point[0], point[1], 0, point[0], point[1], 18 + i * 4);
          halo.addColorStop(0, 'rgba(255,212,154,.9)');
          halo.addColorStop(1, 'rgba(255,212,154,0)');
          ctx.fillStyle = halo;
          ctx.fillRect(point[0] - 24, point[1] - 24, 48, 48);
          ctx.fillStyle = '#ffd49a';
          ctx.fillRect(point[0] - 1, point[1] - 1, 3, 3);
        });
        ctx.strokeStyle = 'rgba(242,166,90,.2)';
        ctx.beginPath();
        ctx.moveTo(constellation[0][0], constellation[0][1]);
        ctx.lineTo(constellation[1][0], constellation[1][1]);
        ctx.lineTo(constellation[2][0], constellation[2][1]);
        ctx.stroke();
        ctx.restore();
      }
      drawPaperFlecks(.32);
    }

    function draw() {
      if (!ctx || !state.rng) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      if (state.actIndex === 0) drawActReceiver();
      else if (state.actIndex === 1) drawActMessage();
      else if (state.actIndex === 2) drawActChoice();
      else if (state.ending === 'silent') drawSilentEnding();
      else drawAnswerEnding();
    }

    function frame(now) {
      const rawDelta = now - lastFrame;
      lastFrame = now;
      if (!document.hidden && !selfTesting) {
        accumulator += clamp(rawDelta, 0, 100);
        let steps = 0;
        while (accumulator >= STEP && steps < 8) {
          update(STEP);
          accumulator -= STEP;
          steps += 1;
        }
        draw();
      }
      raf = requestAnimationFrame(frame);
    }

    function valueFromPointer(control, clientX) {
      const rect = control.getBoundingClientRect();
      return clamp((clientX - rect.left) / rect.width, 0, 1);
    }

    fragmentControls.forEach((control, index) => {
      control.addEventListener('pointerdown', event => {
        if (state.actIndex !== 1) return;
        dragIndex = index;
        control.setPointerCapture(event.pointerId);
        alignFragment(index, valueFromPointer(control, event.clientX));
      });
      control.addEventListener('pointermove', event => {
        if (dragIndex !== index) return;
        alignFragment(index, valueFromPointer(control, event.clientX));
      });
      control.addEventListener('pointerup', event => {
        if (dragIndex === index) {
          control.releasePointerCapture(event.pointerId);
          dragIndex = -1;
        }
      });
      control.addEventListener('pointercancel', () => { dragIndex = -1; });
      control.addEventListener('keydown', event => {
        const directions = { ArrowLeft: -.012, ArrowDown: -.012, ArrowRight: .012, ArrowUp: .012 };
        if (event.key in directions) {
          event.preventDefault();
          alignFragment(index, state.fragments[index] + directions[event.key]);
        } else if (event.key === 'Home') {
          event.preventDefault();
          alignFragment(index, 0);
        } else if (event.key === 'End') {
          event.preventDefault();
          alignFragment(index, 1);
        }
      });
    });

    document.getElementById('answer').addEventListener('click', () => choose('answer'));
    document.getElementById('silent').addEventListener('click', () => choose('silent'));
    document.getElementById('restart').addEventListener('click', () => {
      setAutoplay(false, state.autoplayEnding);
      reset(STARTUP.seed);
    });
    document.getElementById('replay').addEventListener('click', () => {
      setAutoplay(false, state.autoplayEnding);
      reset(STARTUP.seed);
    });
    alternateButton.addEventListener('click', () => {
      const next = state.ending === 'answer' ? 'silent' : 'answer';
      setAutoplay(true, next);
      reset(STARTUP.seed);
    });

    document.addEventListener('keydown', event => {
      if ((event.key === ' ' || event.key === 'Enter') && state.actIndex === 1 && document.activeElement === document.body) {
        event.preventDefault();
        const next = state.aligned.findIndex(value => !value);
        if (next >= 0) fragmentControls[next].focus();
      }
      if ((event.key === ' ' || event.key === 'Enter') && state.actIndex === 2 && state.choiceAvailable && document.activeElement === document.body) {
        event.preventDefault();
        document.getElementById('answer').focus();
      }
      if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        setAutoplay(false, state.autoplayEnding);
        reset(STARTUP.seed);
      }
    });

    document.addEventListener('visibilitychange', () => {
      lastFrame = performance.now();
      accumulator = 0;
    });
    window.addEventListener('resize', resize, { passive: true });
    reducedMotion.addEventListener?.('change', draw);

    function runSelfTest() {
      const tests = [];
      const record = (name, passed, detail = '') => tests.push({ name, passed: Boolean(passed), detail });
      const originalTesting = selfTesting;
      selfTesting = true;

      try {
        setAutoplay(false, 'answer');
        reset(901);
        const first = snapshot();
        const firstValues = first.fragments.map(fragment => fragment.value).join(',');
        reset(901);
        const secondValues = snapshot().fragments.map(fragment => fragment.value).join(',');
        record('deterministic reset', firstValues === secondValues, firstValues);

        advance(ACT_LENGTHS[0] + STEP * 2);
        record('ordered act progression', state.actIndex === 1 && state.ending === null, ACTS[state.actIndex]);

        seek(ACT_LENGTHS[1]);
        advance(1000);
        record('fragment gating', state.actIndex === 1 && !state.choiceAvailable, `${state.aligned.filter(Boolean).length}/3 aligned`);

        TARGETS.forEach((target, index) => alignFragment(index, target, true));
        advance(7100);
        advance(6100);
        record('alignment unlocks choice', state.actIndex === 2 && state.choiceAvailable, ACTS[state.actIndex]);
        const answerReached = choose('answer', true) && state.actIndex === 3 && state.ending === 'answer';
        advance(ACT_LENGTHS[3] + STEP);
        record('answer ending reachable', answerReached && state.completed, state.ending || 'none');

        setAutoplay(false, 'silent');
        reset(902);
        advance(ACT_LENGTHS[0] + STEP * 2);
        TARGETS.forEach((target, index) => alignFragment(index, target, true));
        advance(7100);
        advance(6100);
        const silentReached = choose('silent', true) && state.actIndex === 3 && state.ending === 'silent';
        advance(ACT_LENGTHS[3] + STEP);
        record('silent ending reachable', silentReached && state.completed, state.ending || 'none');

        reset(902);
        record('replay returns to beginning', state.actIndex === 0 && state.actTime === 0 && !state.completed && state.ending === null, ACTS[state.actIndex]);

        setAutoplay(true, 'answer');
        reset(STARTUP.seed);
        advance(92000);
        record('autoplay traverses real systems', state.completed && state.ending === 'answer' && state.aligned.every(Boolean), `${state.ending}/${state.aligned.filter(Boolean).length}`);

        const startupOkay = STARTUP.seed === 217 && STARTUP.autoplay === true && STARTUP.ending === 'answer';
        record('automatic startup configuration', startupOkay, `${STARTUP.seed}/${STARTUP.ending}`);

        const snap = snapshot();
        const numericValues = [snap.seed, snap.actTime, ...snap.fragments.flatMap(fragment => [fragment.value, fragment.target])];
        record('finite numeric state', numericValues.every(Number.isFinite), numericValues.join(','));
      } catch (error) {
        record('self-test execution', false, error instanceof Error ? error.message : String(error));
      } finally {
        setAutoplay(STARTUP.autoplay, STARTUP.ending);
        reset(STARTUP.seed);
        selfTesting = originalTesting;
        lastFrame = performance.now();
        accumulator = 0;
      }

      return { passed: tests.every(test => test.passed), tests };
    }

    window.__LAST_SIGNAL__ = Object.freeze({
      reset,
      setAutoplay,
      seek,
      alignFragment,
      choose,
      snapshot,
      runSelfTest
    });

    document.title = MODEL;
    state.autoplay = STARTUP.autoplay;
    state.autoplayEnding = STARTUP.ending;
    reset(STARTUP.seed);
    resize();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
