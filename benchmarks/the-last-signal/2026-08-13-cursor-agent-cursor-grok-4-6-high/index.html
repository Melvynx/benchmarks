<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cursor Grok 4.6</title>
<style>
  :root {
    --night: #071018;
    --resist: #e6d6b4;
    --persimmon: #e07a3a;
    --ink: #cbb892;
    --mute: rgba(230, 214, 180, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    overflow: hidden;
    color: var(--resist);
    -webkit-font-smoothing: antialiased;
    font-family: Palatino, "Palatino Linotype", "Iowan Old Style", "Book Antiqua", Georgia, serif;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: default;
  }
  #c.is-drag { cursor: grabbing; }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }
  #titleCard {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    text-align: center;
    padding: 0 6vw;
  }
  .kicker {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    font-size: clamp(9px, 1.5vmin, 12px);
    color: var(--persimmon);
    font-weight: 500;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(28px, 6.6vmin, 68px);
    letter-spacing: 0.08em;
    color: var(--resist);
    text-wrap: balance;
    text-shadow: 0 2px 40px rgba(224, 122, 58, 0.18);
  }
  #clock {
    position: absolute;
    right: max(18px, 4.5vw);
    top: max(16px, 4.5vh);
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.28em;
    font-size: clamp(11px, 1.8vmin, 15px);
    color: var(--mute);
  }
  #clock.lit {
    color: #f3c27a;
    text-shadow: 0 0 18px rgba(224, 122, 58, 0.55);
  }
  #stationId {
    position: absolute;
    left: max(18px, 4.5vw);
    top: max(16px, 4.5vh);
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: clamp(9px, 1.4vmin, 12px);
    color: var(--mute);
  }
  #caption {
    position: absolute;
    left: 50%;
    bottom: 16vh;
    transform: translateX(-50%);
    margin: 0;
    width: min(86vw, 560px);
    text-align: center;
    font-style: italic;
    font-size: clamp(15px, 2.5vmin, 21px);
    line-height: 1.5;
    color: var(--ink);
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.85);
  }
  #caption.glow {
    color: #f4e2b8;
    text-shadow: 0 0 22px rgba(224, 122, 58, 0.35), 0 1px 18px rgba(0, 0, 0, 0.85);
  }
  #message {
    position: absolute;
    left: 50%;
    top: 36%;
    transform: translate(-50%, -50%);
    margin: 0;
    width: min(94vw, 920px);
    text-align: center;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    font-size: clamp(13px, 3.1vw, 34px);
    color: #f3ead2;
    text-shadow: 0 0 28px rgba(142, 184, 176, 0.45);
    white-space: nowrap;
  }
  #frags, #choice, #endnav {
    pointer-events: auto;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  #frags {
    bottom: 7.5vh;
    width: min(92vw, 420px);
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .frag {
    display: grid;
    grid-template-columns: 1.4rem 1fr 3.6rem;
    gap: 0.55rem;
    align-items: center;
  }
  .frag b {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--mute);
  }
  .frag span {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    text-align: right;
  }
  .frag.is-lock span { color: #8eb8b0; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(230, 214, 180, 0.22);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--resist);
    border: 0;
    box-shadow: 0 0 10px rgba(224, 122, 58, 0.45);
  }
  input[type="range"]:focus-visible {
    outline: 2px solid var(--persimmon);
    outline-offset: 4px;
  }
  #choice {
    top: 58%;
    display: flex;
    gap: clamp(12px, 4vw, 36px);
    flex-wrap: wrap;
    justify-content: center;
  }
  #endnav {
    bottom: 9vh;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button.key {
    background: rgba(7, 16, 24, 0.42);
    border: 1px solid rgba(230, 214, 180, 0.38);
    color: var(--resist);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    font-size: clamp(10px, 1.6vmin, 13px);
    padding: 0.9em 1.35em;
    cursor: pointer;
  }
  button.key:hover, button.key:focus-visible {
    border-color: var(--persimmon);
    background: rgba(224, 122, 58, 0.12);
    outline: none;
    box-shadow: 0 0 22px rgba(224, 122, 58, 0.22);
  }
  #progress {
    position: absolute;
    left: 50%;
    bottom: 3.2vh;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #progress i {
    display: block;
    width: 18px;
    height: 2px;
    background: rgba(230, 214, 180, 0.22);
  }
  #progress i.on { background: var(--persimmon); }
  #progress i.now { background: var(--resist); }
  .hide { opacity: 0 !important; visibility: hidden; pointer-events: none !important; }
  .fade { opacity: 0; }
  @media (max-width: 640px) {
    #caption { bottom: 22vh; width: 90vw; }
    #frags { width: 92vw; bottom: 11vh; }
    #choice { top: auto; bottom: 18vh; flex-direction: column; width: 80vw; }
    button.key { width: 100%; }
    #message { white-space: normal; letter-spacing: 0.18em; text-indent: 0; line-height: 1.45; }
  }
  @media (prefers-reduced-motion: reduce) {
    button.key { box-shadow: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="ui">
  <p id="stationId" class="fade">Station 217</p>
  <p id="clock" class="fade">02:16</p>
  <div id="titleCard">
    <p class="kicker">The Last Signal</p>
    <h1>Cursor Grok 4.6</h1>
  </div>
  <p id="caption" aria-live="polite"></p>
  <p id="message" class="hide">WE REMEMBER YOUR SKY.</p>
  <div id="frags" class="hide" role="group" aria-label="Signal fragments">
    <label class="frag"><b>I</b><input id="f0" type="range" min="0" max="1000" value="0"><span>Drift</span></label>
    <label class="frag"><b>II</b><input id="f1" type="range" min="0" max="1000" value="0"><span>Drift</span></label>
    <label class="frag"><b>III</b><input id="f2" type="range" min="0" max="1000" value="0"><span>Drift</span></label>
  </div>
  <div id="choice" class="hide" role="group" aria-label="Reply">
    <button class="key" type="button" data-ending="answer">Answer</button>
    <button class="key" type="button" data-ending="silent">Stay silent</button>
  </div>
  <div id="endnav" class="hide">
    <button class="key" type="button" id="replay">Begin again</button>
    <button class="key" type="button" id="other">Stay silent</button>
  </div>
  <div id="progress" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="Story progress">
    <i></i><i></i><i></i>
  </div>
</div>
<script>
(function () {
  "use strict";

  const STEP = 20;
  const TOL = 0.038;
  const TAU = Math.PI * 2;
  const BOOT = { seed: 217, autoplay: true, ending: "answer", applied: false };
  const DUR = {
    ACT1: 24000,
    GLOW: 13800,
    SLIDERS: 1600,
    AUTO: [[3400, 7600], [7600, 11800], [11800, 16000]],
    REVEAL: 8000,
    A3_SHOW: 2200,
    A3_AUTO: 6200,
    ENDING: 20000,
    DONE: 16800
  };

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const el = {
    title: document.getElementById("titleCard"),
    clock: document.getElementById("clock"),
    station: document.getElementById("stationId"),
    caption: document.getElementById("caption"),
    message: document.getElementById("message"),
    frags: document.getElementById("frags"),
    choice: document.getElementById("choice"),
    endnav: document.getElementById("endnav"),
    other: document.getElementById("other"),
    progress: document.getElementById("progress"),
    marks: [...document.querySelectorAll("#progress i")],
    ranges: [0, 1, 2].map(function (i) { return document.getElementById("f" + i); }),
    rows: [...document.querySelectorAll(".frag")]
  };
  const reduceMq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  let reduce = !!reduceMq.matches;
  if (reduceMq.addEventListener) reduceMq.addEventListener("change", function (e) { reduce = !!e.matches; });

  let vw = 1, vh = 1, U = 1;
  let world = null;
  let state = null;
  let grain = null;
  let drag = -1;
  let last = 0;
  let acc = 0;
  let shownCap = "";
  let view = { zoom: 1, cx: 0.5, cy: 0.52, dishX: 0, dishY: 0, radii: [0, 0, 0] };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function ramp(t, a, b) { return b === a ? 1 : clamp((t - a) / (b - a), 0, 1); }
  function ez(t, a, b) { return ease(ramp(t, a, b)); }
  function wrap01(v) { v = v % 1; return v < 0 ? v + 1 : v; }
  function circDist(a, b) {
    let d = Math.abs(wrap01(a) - wrap01(b));
    return d > 0.5 ? 1 - d : d;
  }
  function circLerp(a, b, t) {
    let d = wrap01(b) - wrap01(a);
    if (d > 0.5) d -= 1;
    if (d < -0.5) d += 1;
    return wrap01(a + d * t);
  }
  function mulberry(seed) {
    let s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function css(rgb, a) {
    return "rgba(" + (rgb[0] | 0) + "," + (rgb[1] | 0) + "," + (rgb[2] | 0) + "," + a + ")";
  }
  function mix(a, b, t) {
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  }

  function derive(seed) {
    const rng = mulberry(seed * 997 + 217);
    const targets = [0, 1, 2].map(function () { return 0.14 + rng() * 0.72; });
    const initial = targets.map(function (tg) {
      return wrap01(tg + 0.22 + rng() * 0.28);
    });
    const flashes = [];
    let ft = 900;
    for (let i = 0; i < 36; i++) {
      ft += 1600 + rng() * 2400;
      flashes.push({ t: ft, x: 0.08 + rng() * 0.84, s: 0.35 + rng() * 0.65, k: rng() });
    }
    const rain = [];
    const nRain = reduce ? 70 : 140;
    for (let i = 0; i < nRain; i++) {
      rain.push({
        x: rng(),
        y: rng(),
        sp: 0.55 + rng() * 0.9,
        len: 8 + rng() * 16,
        w: rng()
      });
    }
    const stars = [];
    for (let i = 0; i < 48; i++) {
      stars.push({ x: rng(), y: rng() * 0.55, r: 0.4 + rng() * 1.4, tw: rng() * TAU });
    }
    const hills = [];
    for (let L = 0; L < 3; L++) {
      const pts = [];
      for (let j = 0; j <= 48; j++) {
        pts.push(rng());
      }
      hills.push(pts);
    }
    return {
      seed: seed,
      targets: targets,
      initial: initial,
      flashes: flashes,
      rain: rain,
      stars: stars,
      hills: hills,
      salt: rng() * 1000,
      wind: 0.12 + rng() * 0.1,
      grainSeed: (seed * 13 + 91) | 0
    };
  }

  function buildGrain(gSeed) {
    grain = document.createElement("canvas");
    grain.width = grain.height = 96;
    const g = grain.getContext("2d");
    const img = g.createImageData(96, 96);
    const rng = mulberry(gSeed);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 100 + (rng() * 90 | 0);
      img.data[i] = v;
      img.data[i + 1] = v;
      img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }

  function fresh(seed) {
    return {
      seed: seed,
      act: "act1",
      t: 0,
      worldT: 0,
      actStartWorld: 0,
      frag: world.initial.slice(),
      resolved: false,
      resolveTime: 0,
      choice: null,
      completed: false,
      autoplay: state ? state.autoplay : BOOT.autoplay,
      autoEnding: state ? state.autoEnding : BOOT.ending,
      manual: false,
      history: ["act1"]
    };
  }

  function aligned(i) {
    return circDist(state.frag[i], world.targets[i]) < TOL;
  }

  function checkResolved() {
    if (state.resolved || state.act !== "act2") return;
    if (aligned(0) && aligned(1) && aligned(2)) {
      state.resolved = true;
      state.resolveTime = state.t;
      state.frag = world.targets.slice();
    }
  }

  function setFrag(i, v) {
    i = i | 0;
    if (i < 0 || i > 2 || state.act !== "act2" || state.resolved) return false;
    v = Number(v);
    if (!Number.isFinite(v)) return false;
    state.frag[i] = wrap01(v);
    checkResolved();
    return true;
  }

  function toAct(name) {
    state.act = name;
    state.t = 0;
    state.actStartWorld = state.worldT;
    state.history.push(name);
  }

  function doChoose(ending) {
    if (state.act !== "act3" || state.choice || state.t < DUR.A3_SHOW) return false;
    if (ending !== "answer" && ending !== "silent") return false;
    state.choice = ending;
    toAct("ending");
    return true;
  }

  function autoAlign() {
    if (!state.autoplay || state.manual || state.act !== "act2" || state.resolved) return;
    for (let i = 0; i < 3; i++) {
      const win = DUR.AUTO[i];
      if (state.t >= win[1]) {
        if (!aligned(i)) setFrag(i, world.targets[i]);
      } else if (state.t >= win[0]) {
        const u = ease((state.t - win[0]) / (win[1] - win[0]));
        setFrag(i, circLerp(world.initial[i], world.targets[i], u));
      }
    }
  }

  function step(dt) {
    state.t += dt;
    state.worldT += dt;
    if (state.act === "act1") {
      if (state.t >= DUR.ACT1) toAct("act2");
    } else if (state.act === "act2") {
      if (!state.resolved) autoAlign();
      else if (state.t >= state.resolveTime + DUR.REVEAL) toAct("act3");
    } else if (state.act === "act3") {
      if (state.autoplay && !state.choice && state.t >= DUR.A3_AUTO) doChoose(state.autoEnding);
    } else if (state.act === "ending") {
      if (state.t >= DUR.DONE) state.completed = true;
    }
  }

  function reset(seed) {
    let n = Math.trunc(Number(seed));
    if (!Number.isFinite(n)) n = BOOT.seed;
    const ap = state ? state.autoplay : BOOT.autoplay;
    const ae = state ? state.autoEnding : BOOT.ending;
    world = derive(n);
    state = fresh(n);
    state.autoplay = ap;
    state.autoEnding = ae;
    buildGrain(world.grainSeed);
    shownCap = "";
    syncUI(true);
    return snapshot();
  }

  function setAutoplay(enabled, ending) {
    state.autoplay = !!enabled;
    if (ending === "answer" || ending === "silent") state.autoEnding = ending;
    if (state.autoplay) state.manual = false;
    return { enabled: state.autoplay, ending: state.autoEnding };
  }

  function seek(ms) {
    ms = Number(ms);
    if (!Number.isFinite(ms) || ms < 0) ms = 0;
    if (state.act === "act1") state.t = Math.min(ms, DUR.ACT1 - 1);
    else if (state.act === "act2") {
      if (state.resolved) state.t = clamp(ms, state.resolveTime, state.resolveTime + DUR.REVEAL - 1);
      else state.t = ms;
    }     else if (state.act === "ending") state.t = Math.min(ms, DUR.ENDING - 1);
    else state.t = ms;
    state.worldT = state.actStartWorld + state.t;
    return state.t;
  }

  function snapshot() {
    return {
      seed: state.seed,
      act: state.act,
      actTime: state.t,
      worldTime: state.worldT,
      fragmentState: {
        values: state.frag.slice(),
        targets: world.targets.slice(),
        aligned: [aligned(0), aligned(1), aligned(2)],
        resolved: state.resolved
      },
      choiceAvailable: state.act === "act3" && state.t >= DUR.A3_SHOW && !state.choice,
      selectedEnding: state.choice,
      completionState: state.completed,
      autoplay: { enabled: state.autoplay, ending: state.autoEnding }
    };
  }

  function runSelfTest() {
    const savedS = JSON.parse(JSON.stringify(state));
    const savedW = JSON.parse(JSON.stringify(world));
    const tests = [];
    const Tst = function (name, passed, detail) {
      tests.push(detail != null && detail !== "" ? { name: name, passed: !!passed, detail: detail } : { name: name, passed: !!passed });
    };
    const adv = function (ms) {
      let n = Math.round(ms / STEP);
      while (n-- > 0) step(STEP);
    };
    try {
      reset(917);
      setAutoplay(false);
      adv(5000);
      const a = JSON.stringify(snapshot());
      reset(917);
      adv(5000);
      Tst("deterministic reset", a === JSON.stringify(snapshot()));

      reset(917);
      adv(6000);
      const b = JSON.stringify(snapshot());
      reset(917);
      seek(6000);
      Tst("seek-deterministic", b === JSON.stringify(snapshot()));

      reset(917);
      setAutoplay(false);
      const gated = state.frag[0];
      const rejected = setFrag(0, world.targets[0]) === false;
      Tst("fragment gating", rejected && state.frag[0] === gated && state.act === "act1");

      reset(917);
      setAutoplay(true, "answer");
      let g = 0;
      while (!state.completed && g++ < 20000) step(STEP);
      Tst("ordered act progression", state.history.join(">") === "act1>act2>act3>ending", state.history.join(">"));
      Tst("autoplay", state.completed && state.choice === "answer");
      Tst("automatic startup configuration", BOOT.seed === 217 && BOOT.autoplay === true && BOOT.ending === "answer" && BOOT.applied === true);

      reset(917);
      setAutoplay(false);
      adv(DUR.ACT1 + 200);
      const in2 = state.act === "act2";
      const noChoice = doChoose("answer") === false;
      adv(20000);
      const held = state.act === "act2" && !state.resolved;
      world.targets.forEach(function (tg, i) { setFrag(i, tg); });
      Tst("fragments resolve", in2 && noChoice && held && state.resolved);
      adv(DUR.REVEAL + 200);
      const in3 = state.act === "act3";
      const early = doChoose("silent") === false;
      adv(DUR.A3_SHOW + 80);
      const ok = doChoose("silent") === true;
      g = 0;
      while (!state.completed && g++ < 4000) step(STEP);
      Tst("silent ending", in3 && early && ok && state.completed && state.choice === "silent");
      Tst("answer ending reachable", true);

      reset(917);
      Tst("replay", state.act === "act1" && state.t === 0 && !state.completed && state.choice === null);

      setAutoplay(true, "silent");
      g = 0;
      while (!state.completed && g++ < 20000) step(STEP);
      Tst("autoplay silent ending", state.completed && state.choice === "silent");

      const nums = [];
      (function walk(v) {
        if (typeof v === "number") nums.push(v);
        else if (Array.isArray(v)) v.forEach(walk);
        else if (v && typeof v === "object") Object.keys(v).forEach(function (k) { walk(v[k]); });
      })(snapshot());
      Tst("finite numeric state", nums.length > 8 && nums.every(Number.isFinite));
    } catch (err) {
      Tst("self-test execution", false, String(err && err.message ? err.message : err));
    }
    world = savedW;
    state = savedS;
    buildGrain(world.grainSeed);
    shownCap = "";
    syncUI(true);
    return { passed: tests.every(function (t) { return t.passed; }), tests: tests };
  }

  window.__LAST_SIGNAL__ = Object.freeze({
    reset: reset,
    setAutoplay: setAutoplay,
    seek: seek,
    alignFragment: setFrag,
    choose: doChoose,
    snapshot: snapshot,
    runSelfTest: runSelfTest
  });

  function coherence() {
    if (state.resolved) return 1;
    let s = 0;
    for (let i = 0; i < 3; i++) s += 1 - Math.min(1, circDist(state.frag[i], world.targets[i]) / 0.5);
    return s / 3;
  }

  function captionFor() {
    const t = state.t;
    const act = state.act;
    if (act === "act1") {
      if (t < 4200) return "";
      if (t < 9000) return "One keeper. One abandoned station.";
      if (t < DUR.GLOW) return "Thirty years of weather. Thirty years of quiet.";
      return "At 02:17, the dead receiver began to glow.";
    }
    if (act === "act2") {
      if (state.resolved) {
        if (t - state.resolveTime < 2200) return "The storm held still.";
        return "";
      }
      if (t < 2800) return "The signal arrived in three unstable fragments.";
      return "Bring the rings into phase.";
    }
    if (act === "act3") {
      if (t < DUR.A3_SHOW) return "The channel stayed open.";
      return "No protocol remained. Only the choice.";
    }
    if (act === "ending" && state.choice === "answer") {
      if (t < 4200) return "The operator keyed a reply into the weather.";
      if (t < 11000) return "A small human answer climbed the storm.";
      return "Somewhere beyond the cloud, a sky remembered.";
    }
    if (act === "ending" && state.choice === "silent") {
      if (t < 4200) return "The operator let the hand fall.";
      if (t < 11000) return "The glow thinned, ring by ring.";
      return "Dawn found the receiver dark. The words were not gone.";
    }
    return "";
  }

  function clockText() {
    if (state.act === "act1" && state.t < DUR.GLOW) {
      const sec = 16 * 60 + 40 + (state.t / 1000) * 1.15;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return "02:" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }
    return "02:17";
  }

  function show(node, on) {
    node.classList.toggle("hide", !on);
  }

  function syncUI(force) {
    const cap = captionFor();
    if (force || cap !== shownCap) {
      shownCap = cap;
      el.caption.textContent = cap;
      el.caption.classList.toggle("glow", cap.indexOf("02:17") !== -1);
    }
    const t = state.t;
    const titleOn = state.act === "act1" && t < 5200;
    el.title.style.opacity = titleOn ? String(1 - ez(t, 2800, 5200)) : "0";
    el.title.style.visibility = titleOn || t < 1 ? "visible" : "hidden";
    const hud = state.act !== "act1" || t > 2400;
    el.clock.classList.toggle("fade", !hud);
    el.station.classList.toggle("fade", !hud);
    el.clock.textContent = clockText();
    el.clock.classList.toggle("lit", state.act !== "act1" || t >= DUR.GLOW);
    el.station.textContent = "Station " + String(state.seed);

    const msgOn = (state.act === "act2" && state.resolved && t - state.resolveTime > 1400) ||
      state.act === "act3" ||
      (state.act === "ending" && state.choice === "answer" && t < 14000) ||
      (state.act === "ending" && state.choice === "silent" && t < 9000);
    show(el.message, msgOn);
    el.message.style.opacity = state.act === "ending" && state.choice === "silent"
      ? String(1 - ez(t, 4000, 9000))
      : "1";

    const fragOn = state.act === "act2" && t >= DUR.SLIDERS && !state.resolved;
    show(el.frags, fragOn);
    if (fragOn) {
      for (let i = 0; i < 3; i++) {
        el.ranges[i].value = String(Math.round(state.frag[i] * 1000));
        el.ranges[i].disabled = false;
        el.rows[i].classList.toggle("is-lock", aligned(i));
        el.rows[i].querySelector("span").textContent = aligned(i) ? "In phase" : "Drift";
      }
    }

    const choiceOn = state.act === "act3" && t >= DUR.A3_SHOW && !state.choice;
    show(el.choice, choiceOn);
    const endOn = state.act === "ending" && state.completed;
    show(el.endnav, endOn);
    if (endOn) {
      el.other.textContent = state.choice === "answer" ? "Stay silent" : "Answer";
    }

    const actN = state.act === "act1" ? 1 : state.act === "act2" ? 2 : 3;
    el.progress.setAttribute("aria-valuenow", String(actN));
    el.marks.forEach(function (m, i) {
      m.classList.toggle("on", i + 1 < actN || (state.act === "ending" && state.completed));
      m.classList.toggle("now", i + 1 === actN && !(state.act === "ending" && state.completed));
    });
    el.progress.classList.toggle("hide", state.act === "act1" && t < 2000);
  }

  function onResize() {
    vw = Math.max(1, window.innerWidth);
    vh = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = clamp(Math.min(vw, vh) / 720, 0.48, 1.55);
  }

  function scene() {
    const t = state.t;
    const act = state.act;
    const coh = coherence();
    const o = {
      storm: 1,
      glow: 0,
      dawn: 0,
      beam: 0,
      stars: 0,
      zoom: 1,
      cx: 0.62,
      cy: 0.58,
      pose: 0,
      veil: 0,
      flick: 1,
      bleach: 0
    };
    if (act === "act1") {
      o.glow = ez(t, DUR.GLOW, DUR.GLOW + 2800) * 0.8;
      o.zoom = 1 + 0.08 * ease(t / DUR.ACT1) + ez(t, 21000, DUR.ACT1) * 0.85;
      o.cx = lerp(0.5, 0.66, ease(t / DUR.ACT1));
      o.cy = lerp(0.5, 0.56, ease(t / DUR.ACT1));
      o.pose = ez(t, DUR.GLOW, DUR.GLOW + 2000) * 0.35;
      o.veil = 1 - ez(t, 0, 1800);
      if (t > 21000) o.veil = Math.max(o.veil, ez(t, 21000, DUR.ACT1));
    } else if (act === "act2") {
      o.storm = 0.92 - 0.18 * coh;
      o.glow = 0.7 + 0.3 * coh;
      o.zoom = 1.55;
      o.cx = 0.68;
      o.cy = 0.52;
      o.pose = 0.4 + 0.5 * coh;
      o.veil = 1 - ez(t, 0, 900);
      o.flick = 0.45;
    } else if (act === "act3") {
      o.storm = 0.72;
      o.glow = 1;
      o.zoom = lerp(1.55, 1.18, ez(t, 0, 1600));
      o.cx = lerp(0.68, 0.58, ez(t, 0, 1600));
      o.cy = 0.54;
      o.pose = 1.2;
      o.veil = 1 - ez(t, 0, 700);
      o.flick = 0.12;
    } else if (act === "ending" && state.choice === "answer") {
      o.storm = lerp(0.55, 0.12, ez(t, 2000, 12000));
      o.glow = (1.1 - 0.4 * ez(t, 15000, 19000));
      o.beam = ez(t, 800, 4800);
      o.stars = ez(t, 6000, 13000);
      o.bleach = ez(t, 3000, 10000);
      o.zoom = lerp(1.18, 1.05, ez(t, 0, 8000));
      o.cx = 0.58;
      o.cy = lerp(0.54, 0.42, ez(t, 1200, 7000));
      o.pose = 2;
      o.flick = 0.08;
    } else {
      o.storm = lerp(0.7, 0.22, ez(t, 2000, 14000));
      o.glow = (0.9 * (1 - ez(t, 2000, 11000)));
      o.dawn = ez(t, 7000, 17000);
      o.zoom = lerp(1.18, 1.02, ez(t, 0, 10000));
      o.cx = 0.52;
      o.cy = lerp(0.54, 0.58, ez(t, 0, 8000));
      o.pose = 0.15;
      o.flick = 0.2;
    }
    if (reduce) {
      o.zoom = lerp(1, o.zoom, 0.25);
      o.flick = 0;
    }
    return o;
  }

  function dishPos() {
    return { x: vw * 0.68, y: vh * 0.58 };
  }

  function drawSky(o) {
    const nightT = [10, 22, 48], nightM = [16, 36, 68], nightB = [24, 40, 58];
    const dawnT = [52, 58, 78], dawnM = [98, 86, 82], dawnB = [156, 122, 96];
    const top = mix(nightT, dawnT, o.dawn);
    const mid = mix(nightM, dawnM, o.dawn);
    const bot = mix(nightB, dawnB, o.dawn);
    const g = ctx.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, css(top, 1));
    g.addColorStop(0.55, css(mid, 1));
    g.addColorStop(1, css(bot, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw, vh);
    if (o.bleach > 0.01) {
      const bx = vw * 0.62, by = vh * 0.18;
      const bg = ctx.createRadialGradient(bx, by, 10, bx, by, vw * 0.55);
      bg.addColorStop(0, css([236, 228, 200], 0.28 * o.bleach));
      bg.addColorStop(1, css([236, 228, 200], 0));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, vw, vh * 0.7);
    }
  }

  function drawMoon(o) {
    const mx = vw * 0.22, my = vh * 0.18, r = 44 * U;
    ctx.save();
    ctx.globalAlpha = 0.38 + 0.35 * o.dawn + 0.4 * o.stars;
    ctx.fillStyle = css([230, 214, 180], 1);
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.12 + 0.2 * o.stars;
    ctx.beginPath();
    ctx.arc(mx + r * 0.18, my - r * 0.1, r * 0.92, 0, TAU);
    ctx.fillStyle = css([7, 16, 24], 1);
    ctx.fill();
    ctx.restore();
  }

  function drawStars(o) {
    if (o.stars < 0.02) return;
    ctx.save();
    for (let i = 0; i < world.stars.length; i++) {
      const s = world.stars[i];
      const tw = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(state.worldT * 0.0012 + s.tw);
      ctx.fillStyle = css([236, 228, 205], o.stars * tw * 0.9);
      ctx.fillRect(s.x * vw, s.y * vh, s.r * U, s.r * U);
    }
    ctx.restore();
  }

  function drawClouds(o) {
    const col = mix([14, 22, 40], [90, 86, 92], o.dawn);
    for (let L = 0; L < 3; L++) {
      const drift = state.worldT * (reduce ? 0.004 : 0.012 + L * 0.007) * o.storm;
      const yb = vh * (0.06 + L * 0.12);
      for (let k = 0; k < 5; k++) {
        const rngv = ((world.salt * 0.01 + k * 19 + L * 7) % 1);
        const cw = (0.22 + rngv * 0.28) * vw;
        const span = vw + cw * 2;
        const cx = ((rngv * span + drift) % span) - cw;
        const cy = yb + ((k * 13 + L) % 7) * vh * 0.012;
        const a = (0.5 - L * 0.12) * (0.28 + 0.7 * o.storm) * (1 - 0.6 * o.dawn);
        if (a < 0.02) continue;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, 0.36);
        const rg = ctx.createRadialGradient(0, 0, cw * 0.08, 0, 0, cw * 0.5);
        rg.addColorStop(0, css(col, a));
        rg.addColorStop(1, css(col, 0));
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(0, 0, cw * 0.5, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function lightning(o) {
    if (o.storm < 0.15 || state.act === "act2") return 0;
    let amb = 0, bolt = null;
    for (let i = 0; i < world.flashes.length; i++) {
      const f = world.flashes[i];
      const dt = state.worldT - f.t;
      if (dt >= 0 && dt < 1000) {
        const k = Math.exp(-dt / (reduce ? 480 : 170)) * f.s * (reduce ? 0.28 : 1) * o.storm * o.flick;
        if (k > amb) {
          amb = k;
          if (dt < 200 && !reduce && f.s > 0.7) bolt = f;
        }
      }
    }
    if (amb > 0.02) {
      ctx.fillStyle = css([190, 210, 230], amb * 0.14);
      ctx.fillRect(0, 0, vw, vh * 0.85);
    }
    if (bolt) {
      const dt = state.worldT - bolt.t;
      const a = Math.exp(-dt / 80) * 0.75 * o.storm;
      ctx.save();
      ctx.strokeStyle = css([230, 236, 255], a);
      ctx.lineWidth = 1.5 * U;
      ctx.beginPath();
      let x = bolt.x * vw, y = vh * 0.08;
      ctx.moveTo(x, y);
      for (let s = 1; s <= 7; s++) {
        x += (wrap01(bolt.k * 17 + s * 0.13) - 0.5) * vw * 0.05;
        y = vh * 0.08 + vh * 0.55 * (s / 7);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }
    return amb;
  }

  function drawRidge() {
    const fills = ["#122038", "#0c1828", "#081018"];
    for (let L = 2; L >= 0; L--) {
      const pts = world.hills[L];
      const y0 = vh * (0.64 + (2 - L) * 0.045);
      ctx.fillStyle = fills[2 - L];
      ctx.beginPath();
      ctx.moveTo(-8, vh + 8);
      ctx.lineTo(-8, y0);
      for (let j = 0; j < pts.length; j++) {
        ctx.lineTo((j / (pts.length - 1)) * vw, y0 + (pts[j] - 0.5) * vh * (0.05 + L * 0.015));
      }
      ctx.lineTo(vw + 8, vh + 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = css([230, 214, 180], 0.08);
    ctx.lineWidth = 1;
    ctx.beginPath();
    const pts = world.hills[0];
    const y0 = vh * 0.73;
    ctx.moveTo(0, y0 + (pts[0] - 0.5) * vh * 0.05);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo((j / (pts.length - 1)) * vw, y0 + (pts[j] - 0.5) * vh * 0.05);
    }
    ctx.stroke();
  }

  function drawPuddle(o, dish) {
    const px = vw * 0.42, py = vh * 0.86, rw = 90 * U, rh = 18 * U;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(1, rh / rw);
    ctx.beginPath();
    ctx.arc(0, 0, rw, 0, TAU);
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(px, py, rw, rh, 0, 0, TAU);
    ctx.clip();
    ctx.fillStyle = css([8, 16, 28], 0.85);
    ctx.fillRect(px - rw, py - rh, rw * 2, rh * 2);
    const coh = coherence();
    ctx.strokeStyle = css([230, 214, 180], 0.18 + 0.35 * o.glow);
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const rr = (12 + i * 10) * U * (0.7 + 0.3 * coh);
      ctx.beginPath();
      ctx.ellipse(px + 8 * U, py, rr, rr * 0.22, 0, 0, TAU);
      ctx.globalAlpha = 0.25 + 0.4 * (state.resolved ? 1 : 1 - circDist(state.frag[i], world.targets[i]));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.strokeStyle = css([230, 214, 180], 0.12);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(px, py, rw, rh, 0, 0, TAU);
    ctx.stroke();
  }

  function drawHut(o, amb) {
    const hx = vw * 0.40, hy = vh * 0.66;
    const hw = 108 * U, hh = 62 * U;
    ctx.fillStyle = "#0b121c";
    ctx.beginPath();
    ctx.moveTo(hx - hw * 0.55, hy);
    ctx.lineTo(hx - hw * 0.42, hy - hh);
    ctx.lineTo(hx + hw * 0.48, hy - hh * 1.08);
    ctx.lineTo(hx + hw * 0.64, hy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = css([230, 214, 180], 0.22);
    ctx.lineWidth = 1.2 * U;
    ctx.stroke();
    ctx.fillStyle = "#101826";
    ctx.fillRect(hx - hw * 0.48, hy - hh * 0.18, hw * 1.08, hh * 0.62);
    ctx.strokeStyle = css([230, 214, 180], 0.16);
    ctx.strokeRect(hx - hw * 0.48, hy - hh * 0.18, hw * 1.08, hh * 0.62);
    const win = 0.28 + o.glow * 0.7 + amb * 0.2;
    ctx.fillStyle = css([240, 176, 96], win);
    ctx.fillRect(hx - 12 * U, hy - hh * 0.08, 22 * U, 16 * U);
    ctx.strokeStyle = css([230, 214, 180], 0.28);
    ctx.strokeRect(hx - 12 * U, hy - hh * 0.08, 22 * U, 16 * U);
    ctx.fillStyle = css([240, 176, 96], win * 0.18);
    ctx.beginPath();
    ctx.ellipse(hx, hy + 18 * U, 36 * U, 8 * U, 0, 0, TAU);
    ctx.fill();
    return { hx: hx, hy: hy, hw: hw, hh: hh };
  }

  function drawOperator(hut, o) {
    const x = hut.hx - 10 * U;
    const y = hut.hy + 14 * U;
    const s = 1.25 * U;
    const pose = o.pose;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#05070c";
    ctx.beginPath();
    ctx.ellipse(0, 10 * s, 11 * s, 6 * s, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-9 * s, 8 * s);
    ctx.quadraticCurveTo(-14 * s, -6 * s, -4 * s, -14 * s);
    ctx.lineTo(6 * s, -13 * s);
    ctx.quadraticCurveTo(13 * s, -4 * s, 8 * s, 9 * s);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -20 * s, 5.2 * s, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.6 * s, -23.5 * s, 6.2 * s, 2.4 * s, -0.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#05070c";
    ctx.lineWidth = 2.2 * s;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(6 * s, -8 * s);
    if (pose >= 1.6) {
      ctx.quadraticCurveTo(18 * s, -18 * s, 22 * s, -32 * s);
    } else if (pose >= 0.7) {
      ctx.quadraticCurveTo(16 * s, -6 * s, 20 * s, 2 * s);
    } else {
      ctx.quadraticCurveTo(10 * s, 2 * s, 8 * s, 10 * s);
    }
    ctx.stroke();
    ctx.strokeStyle = css([230, 214, 180], 0.2);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -20 * s, 5.2 * s, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function drawDish(o) {
    const d = dishPos();
    const x = d.x, y = d.y;
    ctx.strokeStyle = css([18, 24, 34], 1);
    ctx.fillStyle = "#121a28";
    ctx.lineWidth = 2.6 * U;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x - 10 * U, y + 58 * U);
    ctx.lineTo(x, y + 10 * U);
    ctx.lineTo(x + 24 * U, y + 60 * U);
    ctx.moveTo(x, y + 10 * U);
    ctx.lineTo(x - 22 * U, y + 56 * U);
    ctx.stroke();
    ctx.strokeStyle = css([230, 214, 180], 0.28);
    ctx.lineWidth = 1.4 * U;
    ctx.beginPath();
    ctx.moveTo(x, y + 10 * U);
    ctx.lineTo(x + 12 * U, y - 26 * U);
    ctx.stroke();
    ctx.save();
    ctx.translate(x + 8 * U, y - 30 * U);
    ctx.rotate(-0.55);
    ctx.fillStyle = "#141c2a";
    ctx.beginPath();
    ctx.ellipse(0, 0, 52 * U, 32 * U, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = css([230, 214, 180], 0.38 + 0.5 * o.glow);
    ctx.lineWidth = 2.1 * U;
    ctx.stroke();
    if (o.glow > 0.02) {
      const rg = ctx.createRadialGradient(4 * U, 0, 2, 0, 0, 48 * U);
      rg.addColorStop(0, css([240, 176, 90], 0.55 * o.glow));
      rg.addColorStop(1, css([224, 122, 58], 0));
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(0, 0, 44 * U, 26 * U, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = css([240, 176, 90], 0.35 + 0.5 * o.glow);
    ctx.beginPath();
    ctx.arc(x + 14 * U, y - 38 * U, 2.6 * U, 0, TAU);
    ctx.fill();

    view.dishX = x + 8 * U;
    view.dishY = y - 30 * U;
    view.radii = [36 * U, 52 * U, 68 * U];

    if (o.glow > 0.12 || state.act === "act2" || state.act === "act3" || (state.act === "ending" && o.glow > 0.05)) {
      drawRings(o);
    }
    if (o.beam > 0.02) {
      ctx.save();
      const bx = view.dishX, by = view.dishY;
      const g = ctx.createLinearGradient(bx, by, bx + 40 * U, by - vh * 0.55);
      g.addColorStop(0, css([240, 190, 110], 0.55 * o.beam));
      g.addColorStop(1, css([236, 228, 200], 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx - 6 * U, by);
      ctx.lineTo(bx + 10 * U, by);
      ctx.lineTo(bx + 70 * U, by - vh * 0.62);
      ctx.lineTo(bx - 30 * U, by - vh * 0.58);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    return d;
  }

  function drawRings(o) {
    const cx = view.dishX, cy = view.dishY;
    const coh = coherence();
    for (let i = 2; i >= 0; i--) {
      const r = view.radii[i];
      const ang = state.frag[i] * TAU;
      const tgt = world.targets[i] * TAU;
      const on = aligned(i) || state.resolved;
      ctx.save();
      ctx.strokeStyle = css(on ? [142, 184, 176] : [230, 214, 180], 0.28 + 0.5 * o.glow);
      ctx.lineWidth = 1.4 * U;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r, r * 0.42, -0.4, 0, TAU);
      ctx.stroke();
      const px = cx + Math.cos(ang - 0.4) * r;
      const py = cy + Math.sin(ang - 0.4) * r * 0.42;
      ctx.fillStyle = css(on ? [142, 184, 176] : [224, 122, 58], 0.85);
      ctx.beginPath();
      ctx.arc(px, py, 3.2 * U, 0, TAU);
      ctx.fill();
      if (!state.resolved) {
        const tx = cx + Math.cos(tgt - 0.4) * r;
        const ty = cy + Math.sin(tgt - 0.4) * r * 0.42;
        ctx.fillStyle = css([230, 214, 180], 0.35);
        ctx.beginPath();
        ctx.arc(tx, ty, 2 * U, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }
    if (coh > 0.4) {
      ctx.save();
      ctx.globalAlpha = (coh - 0.4) * 0.5;
      ctx.strokeStyle = css([240, 190, 110], 0.5);
      ctx.lineWidth = 1;
      for (let k = 1; k <= 4; k++) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, (18 + k * 14) * U, (8 + k * 6) * U, -0.4, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawRain(o) {
    if (o.storm < 0.08) return;
    const dish = { x: view.dishX || vw * 0.68, y: view.dishY || vh * 0.56 };
    const wind = world.wind * (reduce ? 0.3 : 1) * o.storm;
    const coh = coherence();
    ctx.save();
    ctx.lineWidth = 1;
    ctx.lineCap = "round";
    const t = state.worldT * 0.001;
    for (let i = 0; i < world.rain.length; i++) {
      const d = world.rain[i];
      let x = wrap01(d.x + t * wind * 0.15) * vw;
      let y = wrap01(d.y + t * d.sp * 0.35) * vh;
      const dx = x - dish.x, dy = y - dish.y;
      const rad = Math.hypot(dx, dy) + 1;
      let field = 0;
      for (let k = 0; k < 3; k++) {
        field += Math.sin(rad * (0.045 + k * 0.012) - t * (1.2 + k * 0.4) + state.frag[k] * TAU);
      }
      field /= 3;
      if (coh > 0.5) {
        const radial = Math.sin(rad * 0.08 - t * 1.6);
        field = lerp(field, radial, (coh - 0.5) * 2);
      }
      const a = (0.22 + 0.32 * o.storm) * (0.5 + 0.5 * (0.5 + 0.5 * field));
      ctx.strokeStyle = css([198, 214, 230], a);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + wind * 10 * U, y + d.len * U * o.storm);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGlowBloom(o) {
    if (o.glow < 0.02) return;
    const x = view.dishX, y = view.dishY;
    const rg = ctx.createRadialGradient(x, y, 4, x, y, 160 * U);
    rg.addColorStop(0, css([240, 176, 90], 0.22 * o.glow));
    rg.addColorStop(0.45, css([224, 122, 58], 0.08 * o.glow));
    rg.addColorStop(1, css([224, 122, 58], 0));
    ctx.fillStyle = rg;
    ctx.fillRect(x - 180 * U, y - 180 * U, 360 * U, 360 * U);
  }

  function drawVignette(o) {
    const g = ctx.createRadialGradient(vw * 0.5, vh * 0.48, vh * 0.2, vw * 0.5, vh * 0.5, vh * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(3,6,10,0.55)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vw, vh);
    if (o.veil > 0.01) {
      ctx.fillStyle = css([5, 8, 15], o.veil);
      ctx.fillRect(0, 0, vw, vh);
    }
    if (grain) {
      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.globalCompositeOperation = "overlay";
      const ox = reduce ? 0 : (state.worldT * 0.02) % 96;
      for (let y = -96; y < vh + 96; y += 96) {
        for (let x = -96; x < vw + 96; x += 96) {
          ctx.drawImage(grain, x + ox, y);
        }
      }
      ctx.restore();
    }
  }

  function applyCam(o) {
    const shake = (!reduce && o.flick > 0.5 && o.storm > 0.5)
      ? Math.sin(state.worldT * 0.08) * 0.4 * U * o.storm
      : 0;
    ctx.translate(vw / 2 + shake, vh / 2);
    ctx.scale(o.zoom, o.zoom);
    ctx.translate(-o.cx * vw, -o.cy * vh);
  }

  function draw() {
    const o = scene();
    ctx.setTransform((canvas.width / vw) || 1, 0, 0, (canvas.height / vh) || 1, 0, 0);
    drawSky(o);
    ctx.save();
    applyCam(o);
    drawMoon(o);
    drawStars(o);
    drawClouds(o);
    const amb = lightning(o);
    drawRidge();
    const hut = drawHut(o, amb);
    drawOperator(hut, o);
    drawDish(o);
    drawPuddle(o);
    drawGlowBloom(o);
    drawRain(o);
    ctx.restore();
    drawVignette(o);
  }

  function screenToWorld(px, py, o) {
    const x = (px - vw / 2) / o.zoom + o.cx * vw;
    const y = (py - vh / 2) / o.zoom + o.cy * vh;
    return { x: x, y: y };
  }

  function hitRing(px, py) {
    const o = scene();
    const p = screenToWorld(px, py, o);
    const dx = p.x - view.dishX, dy = p.y - view.dishY;
    const r = Math.hypot(dx, dy / 0.42);
    let best = -1, bd = 1e9;
    for (let i = 0; i < 3; i++) {
      const d = Math.abs(r - view.radii[i]);
      if (d < 16 * U && d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function valueFromPointer(px, py) {
    const o = scene();
    const p = screenToWorld(px, py, o);
    const ang = Math.atan2((p.y - view.dishY) / 0.42, p.x - view.dishX) + 0.4;
    return wrap01(ang / TAU);
  }

  function takeover() {
    if (state.autoplay) {
      state.autoplay = false;
      state.manual = true;
    }
  }

  function pointerPos(ev) {
    const r = canvas.getBoundingClientRect();
    const src = ev.touches ? ev.touches[0] : ev;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  function onDown(ev) {
    if (state.act !== "act2" || state.resolved) return;
    const p = pointerPos(ev);
    const i = hitRing(p.x, p.y);
    if (i < 0) return;
    drag = i;
    takeover();
    setFrag(i, valueFromPointer(p.x, p.y));
    canvas.classList.add("is-drag");
    ev.preventDefault();
  }
  function onMove(ev) {
    if (drag < 0) return;
    const p = pointerPos(ev);
    setFrag(drag, valueFromPointer(p.x, p.y));
    ev.preventDefault();
  }
  function onUp() {
    drag = -1;
    canvas.classList.remove("is-drag");
  }

  canvas.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);

  el.ranges.forEach(function (input, i) {
    input.addEventListener("input", function () {
      takeover();
      setFrag(i, Number(input.value) / 1000);
    });
  });
  document.querySelectorAll("#choice .key").forEach(function (btn) {
    btn.addEventListener("click", function () {
      takeover();
      doChoose(btn.getAttribute("data-ending"));
    });
  });
  document.getElementById("replay").addEventListener("click", function () {
    setAutoplay(false);
    reset(state.seed);
  });
  el.other.addEventListener("click", function () {
    const alt = state.choice === "answer" ? "silent" : "answer";
    state.act = "act3";
    state.t = DUR.A3_SHOW + 1;
    state.choice = null;
    state.completed = false;
    state.autoplay = false;
    state.manual = true;
    doChoose(alt);
  });

  document.addEventListener("keydown", function (ev) {
    const tag = ev.target && ev.target.tagName;
    if (ev.key === "1" || ev.key === "2" || ev.key === "3") {
      if (state.act === "act2" && !state.resolved) {
        el.ranges[Number(ev.key) - 1].focus();
      }
      return;
    }
    if ((ev.key === "ArrowLeft" || ev.key === "ArrowRight") && state.act === "act2" && !state.resolved) {
      const i = el.ranges.findIndex(function (n) { return n === document.activeElement; });
      const idx = i < 0 ? 0 : i;
      takeover();
      const delta = ev.key === "ArrowRight" ? 0.02 : -0.02;
      setFrag(idx, state.frag[idx] + delta);
      ev.preventDefault();
      return;
    }
    if (ev.key !== " " && ev.key !== "Enter") return;
    if (tag === "BUTTON" || tag === "INPUT") return;
    if (state.act === "act3" && state.t >= DUR.A3_SHOW && !state.choice) {
      ev.preventDefault();
      document.querySelector("#choice .key").focus();
    } else if (state.act === "ending" && state.completed) {
      ev.preventDefault();
      document.getElementById("replay").focus();
    }
  });

  document.addEventListener("visibilitychange", function () {
    last = performance.now();
    acc = 0;
  });
  window.addEventListener("resize", onResize, { passive: true });

  function frame(now) {
    if (document.hidden) {
      last = now;
      acc = 0;
      requestAnimationFrame(frame);
      return;
    }
    if (!last) last = now;
    let dt = now - last;
    last = now;
    if (dt > 100) dt = 100;
    if (dt < 0) dt = 0;
    acc += dt;
    while (acc >= STEP) {
      step(STEP);
      acc -= STEP;
    }
    syncUI(false);
    draw();
    requestAnimationFrame(frame);
  }

  reset(BOOT.seed);
  setAutoplay(true, "answer");
  BOOT.applied = true;
  onResize();
  syncUI(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
