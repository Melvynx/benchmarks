<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
body { margin: 0; font-family: sans-serif; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px; }
figure { margin: 0; }
img { width: 100%; height: 140px; object-fit: cover; background: #eee; }
figcaption { font-size: 0.9rem; padding-top: 4px; }
</style>
</head>
<body>
<main class="grid">
<figure><img src="photos/beach.jpg" alt="beach.jpg"><figcaption>beach.jpg</figcaption></figure>
<figure><img src="photos/city.jpg" alt="city.jpg"><figcaption>city.jpg</figcaption></figure>
<figure><img src="photos/forest.png" alt="forest.png"><figcaption>forest.png</figcaption></figure>
<figure><img src="photos/mountain.png" alt="mountain.png"><figcaption>mountain.png</figcaption></figure>
<figure><img src="photos/sunset.jpg" alt="sunset.jpg"><figcaption>sunset.jpg</figcaption></figure>
</main>
</body>
</html>
