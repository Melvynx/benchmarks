<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus 5.5</title>
<style>
  :root { --fg: #e9ecef; --dim: #8b929c; --line: rgba(255,255,255,0.10); --panel: rgba(8,10,13,0.72); --red: #ff3b2f; --acc: #9fdcff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 12px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #brand { position: fixed; top: 14px; left: 16px; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; color: #f4f5f6; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
  #shotName { position: fixed; top: 38px; left: 16px; color: var(--dim); font-size: 11.5px; text-shadow: 0 1px 6px #000; }
  #cams { top: 64px; left: 14px; padding: 6px; display: flex; flex-direction: column; gap: 3px; width: 132px; }
  .grp { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; padding: 4px 6px 2px; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
  button:hover { background: rgba(255,255,255,0.11); }
  button.on { background: rgba(159,220,255,0.16); border-color: rgba(159,220,255,0.45); color: #fff; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  #tele { top: 14px; right: 14px; width: 248px; padding: 10px 12px; }
  #tele .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-variant-numeric: tabular-nums; }
  #tele .row:last-child { border-bottom: 0; }
  #tele .k { color: var(--dim); }
  #tele .v { font-weight: 600; text-align: right; max-width: 160px; }
  #t_phase { font-weight: 600; color: var(--acc); margin-bottom: 6px; font-size: 12.5px; }
  #t_phase.bad { color: var(--red); }
  #t_thr { font-weight: 500 !important; font-size: 11px; color: #c8ecff; }
  #bar { left: 50%; transform: translateX(-50%); bottom: 14px; width: min(940px, calc(100vw - 28px)); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
  #bar button { text-align: center; }
  #play { width: 38px; font-size: 12px; }
  #timeline { flex: 1; accent-color: #9fdcff; min-width: 120px; }
  #tlab { width: 112px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  #speeds { display: flex; gap: 2px; }
  #speeds button { padding: 5px 6px; min-width: 40px; }
  #live.on { color: #ff6b5f; border-color: rgba(255,80,60,0.4); background: rgba(255,60,40,0.1); }
  #settings { right: 14px; bottom: 74px; width: 280px; padding: 6px 8px 6px 12px; }
  #settings:not(.collapsed) { padding-bottom: 10px; }
  #settings.collapsed #settingsInner { display: none; }
  #settings header { display: flex; justify-content: space-between; align-items: center; }
  #settings header b { font-size: 12px; }
  .srow { display: grid; grid-template-columns: 1fr 88px; grid-template-rows: auto auto; gap: 0 8px; margin: 7px 0 2px; }
  .srow .sl { color: var(--dim); }
  .srow output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .srow input { grid-column: 1 / span 2; width: 100%; accent-color: #9fdcff; }
  #scen { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
  #scen button { text-align: center; }
  .acts { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  #pending { color: #ffcf6b; font-size: 11px; flex: 1; }
  #fps { position: fixed; left: 16px; bottom: 20px; color: #59606a; font-size: 10.5px; }
  @media (max-width: 760px) { #cams { width: 112px; } #settings { width: 240px; } #tele { width: 210px; } }
</style>

<body>
<canvas id="view"></canvas>
<div id="brand">Opus 5.5</div>
<div id="shotName"></div>
<nav id="cams" class="panel" aria-label="Cameras">
  <div class="grp">Camera</div>
  <button data-cam="director">Director</button>
  <button data-cam="rear">Rear at foot</button>
  <button data-cam="side">Wide side</button>
  <button data-cam="lip">Close on lip</button>
  <button data-cam="drone">Drone above lip</button>
  <button data-cam="aerial">High aerial</button>
  <button data-cam="chase">Chase</button>
  <button data-cam="orbit">Free orbit</button>
</nav>
<section id="tele" class="panel" aria-label="Telemetry">
  <div id="t_phase">—</div>
  <div class="row"><span class="k">Speed</span><span class="v" id="t_speed">—</span></div>
  <div class="row"><span class="k">Pitch</span><span class="v" id="t_pitch">—</span></div>
  <div class="row"><span class="k">Height</span><span class="v" id="t_height">—</span></div>
  <div class="row"><span class="k">Fan downforce</span><span class="v" id="t_df">—</span></div>
  <div class="row"><span class="k">Thrusters</span><span class="v" id="t_thr">—</span></div>
</section>
<section id="settings" class="panel collapsed" aria-label="Settings">
  <header><b>Run settings &amp; scenarios</b><button id="toggleSettings" title="Show / hide" aria-expanded="false">▸</button></header>
  <div id="settingsInner">
    <div id="settingsBody"></div>
    <div class="acts"><span id="pending">Changed · applies on replay</span><button id="defaults">Defaults</button><button id="apply">Apply &amp; replay</button></div>
    <div class="grp" style="padding-left:0;margin-top:8px">Scenarios</div>
    <div id="scen">
      <button data-sc="nominal" class="on">Nominal stunt</button>
      <button data-sc="lowdf">Low downforce</button>
      <button data-sc="nothrust">Thruster failure</button>
      <button data-sc="slow">Too slow</button>
    </div>
  </div>
</section>
<div id="bar" class="panel">
  <button id="play" title="Pause (Space)">❚❚</button>
  <button id="replay" title="Rebuild a fresh run from the current settings">↻ Replay</button>
  <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline">
  <span id="tlab">0.00 s</span>
  <button id="live">● LIVE</button>
  <div id="speeds">

  </div>
</div>

<script id="sim-core">
/* ===================== RampSim: deterministic rigid-body core ===================== */
var RampSim = (function () {
  'use strict';
  var DT = 1 / 240;

  // ---------- vector / quaternion helpers ----------
  function V(x, y, z) { return { x: x, y: y, z: z }; }
  function add(a, b) { return V(a.x + b.x, a.y + b.y, a.z + b.z); }
  function sub(a, b) { return V(a.x - b.x, a.y - b.y, a.z - b.z); }
  function scl(a, s) { return V(a.x * s, a.y * s, a.z * s); }
  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function cross(a, b) { return V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x); }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function norm(a) { var l = len(a) || 1; return V(a.x / l, a.y / l, a.z / l); }
  function addTo(a, b, s) { a.x += b.x * s; a.y += b.y * s; a.z += b.z * s; }
  function Q(w, x, y, z) { return { w: w, x: x, y: y, z: z }; }
  function qmul(a, b) {
    return Q(a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
      a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
      a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
      a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w);
  }
  function qconj(q) { return Q(q.w, -q.x, -q.y, -q.z); }
  function qnorm(q) { var l = Math.sqrt(q.w * q.w + q.x * q.x + q.y * q.y + q.z * q.z); return Q(q.w / l, q.x / l, q.y / l, q.z / l); }
  function qrot(q, v) {
    var tx = 2 * (q.y * v.z - q.z * v.y), ty = 2 * (q.z * v.x - q.x * v.z), tz = 2 * (q.x * v.y - q.y * v.x);
    return V(v.x + q.w * tx + q.y * tz - q.z * ty, v.y + q.w * ty + q.z * tx - q.x * tz, v.z + q.w * tz + q.x * ty - q.y * tx);
  }
  function qinv(q, v) { return qrot(qconj(q), v); }
  function qFromAxes(f, u, r) { // body x->f, y->u, z->r
    var m00 = f.x, m01 = u.x, m02 = r.x, m10 = f.y, m11 = u.y, m12 = r.y, m20 = f.z, m21 = u.z, m22 = r.z;
    var tr = m00 + m11 + m22, s;
    if (tr > 0) { s = 0.5 / Math.sqrt(tr + 1); return qnorm(Q(0.25 / s, (m21 - m12) * s, (m02 - m20) * s, (m10 - m01) * s)); }
    if (m00 > m11 && m00 > m22) { s = 2 * Math.sqrt(1 + m00 - m11 - m22); return qnorm(Q((m21 - m12) / s, 0.25 * s, (m01 + m10) / s, (m02 + m20) / s)); }
    if (m11 > m22) { s = 2 * Math.sqrt(1 + m11 - m00 - m22); return qnorm(Q((m02 - m20) / s, (m01 + m10) / s, 0.25 * s, (m12 + m21) / s)); }
    s = 2 * Math.sqrt(1 + m22 - m00 - m11); return qnorm(Q((m10 - m01) / s, (m02 + m20) / s, (m12 + m21) / s, 0.25 * s));
  }
  // symmetric 3x3 inverse
  function inv3(m) {
    var a = m[0], b = m[1], c = m[2], d = m[3], e = m[4], f = m[5], g = m[6], h = m[7], i = m[8];
    var A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
    var det = a * A + b * B + c * C;
    var r = 1 / det;
    return [A * r, -(b * i - c * h) * r, (b * f - c * e) * r, B * r, (a * i - c * g) * r, -(a * f - c * d) * r, C * r, -(a * h - b * g) * r, (a * e - b * d) * r];
  }
  function m3v(m, v) { return V(m[0] * v.x + m[1] * v.y + m[2] * v.z, m[3] * v.x + m[4] * v.y + m[5] * v.z, m[6] * v.x + m[7] * v.y + m[8] * v.z); }

  // seeded RNG (mulberry32)
  function rng(seed) {
    var a = seed >>> 0;
    return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ---------- RAMP: continuous-curvature hook profile ----------
  function smooth5(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * t * (t * (t * 6 - 15) + 10); }
  var RAMP_P = { k1: 1 / 14, r1: 5, L1: 16, f1: 5, km: 0.025, Lm: 16, k3: 1 / 11, r3: 4, L3: 4, f3: 5, kp: 0.016 };
  function makeRamp() {
    var E = 12;         // flat entry slab length (m)
    var W = 8.0, T = 0.55;
    var LIP = 165 * Math.PI / 180;
    // One continuous curve, curvature blended with C2 smoothsteps everywhere:
    // bottom bend -> long gently-curving lean-back -> tighter top bend -> near-horizontal
    // ceiling platform (pitch ~160-165 deg) where the car hangs upside down.
    var P = RAMP_P;
    function kappa(u) {
      if (u < 0) return 0;
      var e1 = P.r1 + P.L1, s3 = e1 + P.f1 + P.Lm, e3 = s3 + P.r3 + P.L3;
      var k = P.k1 * (smooth5(u / P.r1) - smooth5((u - e1) / P.f1));
      k += P.km * smooth5((u - e1) / P.f1);
      k += (P.k3 - P.km) * (smooth5((u - s3) / P.r3) - smooth5((u - e3) / P.f3));
      k += (P.kp - P.km) * smooth5((u - e3) / P.f3);
      return k;
    }
    var ds = 0.01, s = 0, x = -E, y = 0, th = 0;
    var step = 0.05, S = [], X = [], Y = [], TH = [], K = [];
    var next = 0;
    while (true) {
      if (s >= next - 1e-9) { S.push(s); X.push(x); Y.push(y); TH.push(th); K.push(kappa(s - E)); next += step; }
      if (th >= LIP) break;
      var km = kappa(s - E + ds * 0.5);
      var thm = th + km * ds * 0.5;
      x += Math.cos(thm) * ds; y += Math.sin(thm) * ds; th += kappa(s - E + ds * 0.5) * ds; s += ds;
      if (th >= LIP) { th = LIP; S.push(s); X.push(x); Y.push(y); TH.push(th); K.push(kappa(s - E)); break; }
    }
    var n = S.length, L = S[n - 1];
    var xv = -1e9; for (var j = 0; j < n; j++) if (X[j] > xv) xv = X[j];
    var ramp = { S: S, X: X, Y: Y, TH: TH, K: K, n: n, L: L, E: E, W: W, T: T, xMax: xv, lipX: X[n - 1], lipY: Y[n - 1], step: step };
    ramp.at = function (sq) { // interpolated point at arc length
      if (sq <= 0) return { x: X[0] + sq, y: 0, th: 0, k: 0 };
      if (sq >= L) { var c = Math.cos(LIP), sn = Math.sin(LIP); return { x: X[n - 1] + c * (sq - L), y: Y[n - 1] + sn * (sq - L), th: LIP, k: 0 }; }
      var f = sq / step, i = Math.floor(f); if (i >= n - 1) i = n - 2; var t = (sq - S[i]) / (S[i + 1] - S[i]);
      return { x: X[i] + (X[i + 1] - X[i]) * t, y: Y[i] + (Y[i + 1] - Y[i]) * t, th: TH[i] + (TH[i + 1] - TH[i]) * t, k: K[i] + (K[i + 1] - K[i]) * t };
    };
    ramp.nearest = function (px, py) { // closest point on profile -> {s, d (signed, + on running side), nx, ny}
      var best = -1, bd = 1e18, i, dx, dy, d2;
      for (i = 0; i < n; i += 8) { dx = X[i] - px; dy = Y[i] - py; d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = i; } }
      var lo = Math.max(0, best - 9), hi = Math.min(n - 1, best + 9);
      for (i = lo; i <= hi; i++) { dx = X[i] - px; dy = Y[i] - py; d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = i; } }
      // refine on the adjacent segments
      var sq = S[best], bb = 1e18;
      for (var k = -1; k <= 0; k++) {
        var a = best + k; if (a < 0 || a + 1 >= n) continue;
        var ex = X[a + 1] - X[a], ey = Y[a + 1] - Y[a], l2 = ex * ex + ey * ey;
        var t = ((px - X[a]) * ex + (py - Y[a]) * ey) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
        var qx = X[a] + ex * t - px, qy = Y[a] + ey * t - py, q2 = qx * qx + qy * qy;
        if (q2 < bb) { bb = q2; sq = S[a] + (S[a + 1] - S[a]) * t; }
      }
      var p = ramp.at(sq), nx = -Math.sin(p.th), ny = Math.cos(p.th);
      return { s: sq, d: (px - p.x) * nx + (py - p.y) * ny, nx: nx, ny: ny, x: p.x, y: p.y, th: p.th };
    };
    // support tower behind the vertical section (collision box)
    ramp.tower = { x0: xv + T + 0.9, x1: xv + T + 5.9, y0: 0, y1: ramp.lipY + T + 3.4, z0: -W / 2 - 0.2, z1: W / 2 + 0.2 };
    return ramp;
  }
  function setRampParams(p) { RAMP_P = p; }

  // ---------- CAR DEFINITION (design frame: x fwd, y up, z right, ground y=0) ----------
  var WHEEL_R = 0.36, WHEEL_W = 0.30, WB = 2.75, TRACK = 1.72;
  var PARTS = [
    // name, parent, box [x0,x1,y0,y1,z0,z1], base mass, break force (kN, window-averaged)
    { id: 'cabin', parent: null, box: [-0.9, 1.0, 0.14, 0.75, -0.86, 0.86], m: 700, brk: 1e9 },
    { id: 'front', parent: 'cabin', box: [1.0, 1.95, 0.18, 0.62, -0.95, 0.95], m: 230, brk: 260 },
    { id: 'rear', parent: 'cabin', box: [-2.0, -0.9, 0.18, 0.84, -1.0, 1.0], m: 420, brk: 330 },
    { id: 'hood', parent: 'front', box: [1.0, 1.95, 0.60, 0.72, -0.85, 0.85], m: 22, brk: 14 },
    { id: 'doorL', parent: 'cabin', box: [-0.6, 0.9, 0.24, 0.80, -1.0, -0.86], m: 32, brk: 22 },
    { id: 'doorR', parent: 'cabin', box: [-0.6, 0.9, 0.24, 0.80, 0.86, 1.0], m: 32, brk: 22 },
    { id: 'bumperF', parent: 'front', box: [1.95, 2.25, 0.16, 0.55, -0.92, 0.92], m: 18, brk: 16 },
    { id: 'bumperR', parent: 'rear', box: [-2.25, -2.0, 0.22, 0.80, -0.95, 0.95], m: 20, brk: 16 },
    { id: 'glass', parent: 'cabin', box: [-1.65, 0.95, 0.74, 1.15, -0.62, 0.62], m: 40, brk: 18 },
    { id: 'wheelFL', parent: 'front', wheel: [WB / 2, -TRACK / 2], m: 30, brk: 75 },
    { id: 'wheelFR', parent: 'front', wheel: [WB / 2, TRACK / 2], m: 30, brk: 75 },
    { id: 'wheelRL', parent: 'rear', wheel: [-WB / 2, -TRACK / 2], m: 30, brk: 75 },
    { id: 'wheelRR', parent: 'rear', wheel: [-WB / 2, TRACK / 2], m: 30, brk: 75 }
  ];
  var PID = {}; PARTS.forEach(function (p, i) { PID[p.id] = i; p.idx = i; });
  PARTS.forEach(function (p) {
    if (p.wheel) { p.box = [p.wheel[0] - WHEEL_R, p.wheel[0] + WHEEL_R, 0, 2 * WHEEL_R, p.wheel[1] - WHEEL_W / 2, p.wheel[1] + WHEEL_W / 2]; }
    p.c = V((p.box[0] + p.box[1]) / 2, (p.box[2] + p.box[3]) / 2, (p.box[4] + p.box[5]) / 2);
  });
  // hull contact points (design frame) per part; symmetric pairs are expanded
  var HULL = {
    bumperF: [[2.25, 0.38, 0.72], [2.2, 0.31, 0.55], [2.22, 0.5, 0.45], [2.25, 0.3, 0]],
    hood: [[1.9, 0.6, 0.7], [1.1, 0.73, 0.78], [1.5, 0.68, 0]],
    front: [[1.5, 0.22, 0.9], [1.85, 0.27, 0], [1.3, 0.55, 0.96]],
    cabin: [[0.8, 0.14, 0.8], [-0.8, 0.14, 0.8], [0, 0.14, 0]],
    doorL: [[0.85, 0.78, -1.0], [-0.55, 0.8, -1.0], [0.85, 0.3, -1.0], [-0.55, 0.3, -1.0], [0.15, 0.55, -1.0]],
    doorR: [[0.85, 0.78, 1.0], [-0.55, 0.8, 1.0], [0.85, 0.3, 1.0], [-0.55, 0.3, 1.0], [0.15, 0.55, 1.0]],
    glass: [[0.9, 0.86, 0.6], [0.25, 1.15, 0.45], [-0.6, 1.1, 0.45], [-1.55, 0.92, 0.3], [-0.2, 1.14, 0]],
    rear: [[-1.8, 0.84, 0.97], [-1.4, 0.22, 0.92], [-1.0, 0.86, 1.0], [-1.75, 0.27, 0]],
    bumperR: [[-2.25, 0.38, 0.86], [-2.25, 0.76, 0.82], [-2.12, 0.33, 0.5]]
  };
  PARTS.forEach(function (p) {
    var pts = [];
    if (p.wheel) {
      for (var k = 0; k < 12; k++) {
        var a = k / 12 * Math.PI * 2;
        for (var sd = -1; sd <= 1; sd += 2) pts.push(V(p.wheel[0] + Math.cos(a) * WHEEL_R, WHEEL_R + Math.sin(a) * WHEEL_R, p.wheel[1] + sd * WHEEL_W * 0.45));
      }
    } else {
      (HULL[p.id] || []).forEach(function (h) {
        pts.push(V(h[0], h[1], h[2]));
        if (h[2] !== 0 && p.id !== 'doorL' && p.id !== 'doorR') pts.push(V(h[0], h[1], -h[2]));
      });
    }
    p.hull = pts;
    var dbg = pts.slice();
    if (!p.wheel) for (var cx = 0; cx < 2; cx++) for (var cy = 0; cy < 2; cy++) for (var cz = 0; cz < 2; cz++) {
      var bx = p.box;
      dbg.push(V(p.c.x + (bx[cx] - p.c.x) * 0.94, p.c.y + (bx[2 + cy] - p.c.y) * 0.94, p.c.z + (bx[4 + cz] - p.c.z) * 0.94));
    }

  // breakable joints ------------------------------------------------------

      var wq = Q(0, s.w.x, s.w.y, s.w.z), dq = qmul(wq, s.q);
      s.q = qnorm(Q(s.q.w + 0.5 * dt * dq.w, s.q.x + 0.5 * dt * dq.x, s.q.y + 0.5 * dt * dq.y, s.q.z + 0.5 * dt * dq.z));

  // smoke (visual, seeded, recorded as spawn events) ------------------------
  function spawnSmoke(sim, p, v, size, life, dens, kind) {
    if (sim.smoke.length > 2600) return;
    var r = sim.rnd;
    sim.smoke.push({ t: sim.t, p: [p.x, p.y, p.z], v: [v.x, v.y, v.z], s: size, life: life, d: dens, rot: r() * 6.283, seed: r(), kind: kind || 'gas' });
  }
  function smokeStep(sim, dt) {
    var car = sim.car; if (sim.bodies.indexOf(car) < 0) return;
    var r = sim.rnd;
    sim.noz.forEach(function (n) {
      if (n.thr < 0.04 || n.max <= 0) return;
      var p0 = worldPt(car, n.def.pos), ex = scl(qrot(car.q, n.def.dir), -1);
      var thrN = n.thr * n.max;

      if (hit) {

          }
          cnt -= 1;
        }
      }
    });

      sim.ctl.touchdownBurst--;

        var a = r() * 6.283, sp = 7 + 8 * r();
        spawnSmoke(sim, V(car.pos.x + Math.cos(a) * 1.5, 0.25 + r() * 0.4, car.pos.z + Math.sin(a) * 1.2), V(Math.cos(a) * sp, 0.3 + r() * 1.2, Math.sin(a) * sp), 1.2 + r() * 1.2, 6 + r() * 4, 0.6, 'ground');

    }
  }

  // ---------- FLIGHT CONTROLLER ----------
  function makeController(sim) {
    return { phase: 'stage', tPhase: 0, touchdownBurst: 0, lastS: 0, back: 0, air: 0, driveStart: null, hoverT: 0, released: 0, msg: '' };
  }
  function setPhase(sim, p) { sim.ctl.phase = p; sim.ctl.tPhase = 0; sim.events.push({ t: sim.t, type: 'phase', phase: p }); }

  function carState(sim) {
    var car = sim.car, up = qrot(car.q, V(0, 1, 0)), fwd = qrot(car.q, V(1, 0, 0));
    var nr = sim.ramp.nearest(car.pos.x, car.pos.y);
    return { up: up, fwd: fwd, s: nr.s, d: nr.d, th: nr.th, vF: dot(car.v, fwd), h: car.pos.y };
  }

  // non-negative bounded least squares allocation (projected gradient, fixed iterations)
  function allocate(sim, Fb, Tb, wF, wT) {
    var car = sim.car, N = sim.noz.length, cols = [], i, j;
    for (i = 0; i < N; i++) {
      var n = sim.noz[i], mx = n.max;
      if (car.parts.indexOf(PID[n.def.part]) < 0) mx = 0;
      var r = sub(n.def.pos, car.comD), d = n.def.dir, t = cross(r, d);
      cols.push([d.x * mx * wF, d.y * mx * wF, d.z * mx * wF, t.x * mx * wT, t.y * mx * wT, t.z * mx * wT]);
    }
    var w = [Fb.x * wF, Fb.y * wF, Fb.z * wF, Tb.x * wT, Tb.y * wT, Tb.z * wT];
    var Lc = 0; for (i = 0; i < N; i++) for (j = 0; j < 6; j++) Lc += cols[i][j] * cols[i][j];
    if (Lc <= 0) return cols.map(function () { return 0; });
    var step = 1 / Lc, u = cols.map(function () { return 0; }), res = [0, 0, 0, 0, 0, 0];
    for (var it = 0; it < 70; it++) {

  }

  function controllerUpdate(sim, dt) {
    var C = sim.ctl, car = sim.car, cfg = sim.cfg, g = sim.g;
    C.tPhase += dt;
    var alive = sim.bodies.indexOf(car) >= 0;
    var crashed = Object.keys(sim.broken).length > 0;
    sim.wheels.forEach(function (w) { w.Td = 0; w.Tb = 0; });
    sim.noz.forEach(function (n) { n.cmd = 0; });
    if (crashed && C.phase !== 'crashed') { setPhase(sim, 'crashed'); C.msg = 'STRUCTURAL FAILURE'; }
    if (C.phase === 'crashed') { sim.fan.cmd = 0; sim.wheels.forEach(function (w) { w.Tb = 2500; }); return; }
    var st = carState(sim), m = car.M, R = sim.ramp;
    var contacts = sim.wheels.filter(function (w) { return w.contact; }).length;
    var sPark = R.L - 2.05;
    function drive(Fcmd) { // total longitudinal force request -> per-wheel torque within power and traction limits

      var Fmax = Math.min(P / Math.max(v, 2.5), 26000);
      Fcmd = Math.max(-Fmax * 1.5, Math.min(Fmax, Fcmd));
      sim.wheels.forEach(function (w) {
        if (Fcmd >= 0 || st.vF > 0.3 || st.vF < -0.3) w.Td = Fcmd * WHEEL_R / 4;
        else w.Tb = -Fcmd * WHEEL_R / 4;
      });

    }
    function brake(T) { sim.wheels.forEach(function (w) { w.Tb = T; }); }
    function flightControl(targetX) {
      var up = st.up, tilt = Math.acos(Math.max(-1, Math.min(1, up.y)));
      var hh = car.pos.y - car.comD.y; // height above resting ride height
      var lift = 0; sim.noz.forEach(function (n) { if (n.def.kind === 'lift') lift += n.max; });
      var aAvail = lift / m - g;
      var hHover = C.hoverHeight;
      // horizontal guidance toward the landing spot
      var aX = Math.max(-4, Math.min(4, 0.9 * (targetX - car.pos.x) - 1.5 * car.v.x));
      var aZ = Math.max(-4, Math.min(4, -0.9 * car.pos.z - 1.5 * car.v.z));

          else { setPhase(sim, 'abort'); C.msg = 'CLIMB FAILED — ROLLBACK'; }
        }
        if (contacts === 0 && st.s > R.E + 2) C.air += dt; else C.air = 0;

        if (contacts === 0 && C.tPhase > 0.12) { setPhase(sim, 'flight'); C.hoverHeight = 0.75; }
        if (C.tPhase > 1.5) setPhase(sim, 'flight');

      case 'flight':
        sim.fan.cmd = 0; brake(300);
        flightControl(-R.E + 4.6);
        if (C.hh !== undefined && C.hh < C.hoverHeight + 0.35 && Math.abs(car.v.y) < 1.5 && C.tilt < 0.3) setPhase(sim, 'hover');

        break;
      case 'hover':

  function telemetry(sim) {
    var car = sim.car, T = sim.telemetry;

function cr(tab, x) { // Catmull-Rom through [x,y] pairs sorted by x ascending
  if (x <= tab[0][0]) return tab[0][1];
  if (x >= tab[tab.length - 1][0]) return tab[tab.length - 1][1];
  let i = 0; while (tab[i + 1][0] < x) i++;
  const p0 = tab[Math.max(0, i - 1)], p1 = tab[i], p2 = tab[i + 1], p3 = tab[Math.min(tab.length - 1, i + 2)];
  const t = (x - p1[0]) / (p2[0] - p1[0]);
  const m1 = (p2[1] - p0[1]) / (p2[0] - p0[0]) * (p2[0] - p1[0]), m2 = (p3[1] - p1[1]) / (p3[0] - p1[0]) * (p2[0] - p1[0]);
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
}

  const up = Math.max(0, (y - 0.5) / 0.4);

  for (const wx of WHEELS_X) {

// buttons should not keep focus (Space must keep toggling play)
document.querySelectorAll('button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));

const PHASE_LABEL = { stage: 'Staged · fans spooling', climb: 'Climbing', hold: 'Holding on fan downforce', release: 'Release', flight: 'Free fall · attitude control', hover: 'Hover', touchdown: 'Touchdown', driveout: 'Driving out', done: 'Complete', crashed: 'Structural failure', abort: 'Climb failed · rolling back', lost: 'Lost contact' };
function updateHUD(A, B, a) {
  const T = A.tel;
  $('t_speed').textContent = (T.speed * 3.6).toFixed(0) + ' km/h';
  $('t_pitch').textContent = T.pitch.toFixed(0) + '°';
  $('t_height').textContent = T.height.toFixed(1) + ' m';
  $('t_df').textContent = Math.round(T.downforce).toLocaleString('en-US') + ' kgf';
  const groups = {};
  (T.firing || []).forEach((id) => { const k = id[0] === 'L' ? 'Lift' : id[0] === 'S' ? 'Side' : 'Rear'; (groups[k] = groups[k] || []).push(id.slice(1)); });
  $('t_thr').textContent = Object.keys(groups).length ? Object.entries(groups).map(([k, v]) => k + ' ' + v.join(' ')).join(' · ') : '—';
  $('t_phase').textContent = PHASE_LABEL[A.phase] || A.phase;
  $('t_phase').className = A.phase === 'crashed' || A.phase === 'lost' || A.phase === 'abort' ? 'bad' : '';
  const end = records[records.length - 1].t;
  tl.max = end.toFixed(3); if (!scrubbing) tl.value = renderT.toFixed(3);
  $('tlab').textContent = renderT.toFixed(2) + ' / ' + end.toFixed(2) + ' s';
  const live = renderT >= end - 1e-3;
  $('live').classList.toggle('on', live);
  $('live').textContent = live ? '● LIVE' : 'Go live';
}

// ------------------------------------------------------------------ main loop
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) renderT += dt * speed;
  let steps = 0;
  while (records[records.length - 1].t < renderT && steps < MAX_STEPS_PER_FRAME && sim.t < MAX_T) {
    SIM.step(sim); steps++;
    if (sim.step % REC_EVERY === 0) records.push(snapshot(sim));
  }
  const end = records[records.length - 1].t;
  if (renderT > end) renderT = end;
  const [ia, ib, a] = findRecord(renderT);
  const A = records[ia], B = records[ib];
  applyState(A, B, a);
  updateSmoke(renderT, sim);
  updateCamera(A, dt);
  updateHUD(A, B, a);
  composer.render();
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('fps').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
setSpeed(speed);
setCamMode('director');
newRun();
window.__ramp = { get sim() { return sim; }, get records() { return records; }, setCam: setCamMode, get renderT() { return renderT; }, set renderT(v) { renderT = v; }, setPlaying: (p) => { playing = p; setPlayIcon(); }, runScenario,
  setPose(p, l, fov) { setCamMode('orbit'); camera.position.set(...p); controls.target.set(...l); camera.fov = fov || 40; camera.updateProjectionMatrix(); controls.update(); },
  advanceTo(t) { while (records[records.length - 1].t < t && sim.t < MAX_T) { SIM.step(sim); if (sim.step % REC_EVERY === 0) records.push(snapshot(sim)); } renderT = Math.min(t, records[records.length - 1].t); } };
requestAnimationFrame(frame);

</script>
