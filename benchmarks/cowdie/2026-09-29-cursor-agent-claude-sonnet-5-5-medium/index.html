<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Claude Sonnet 5.5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%23fffaf0'/%3E%3Ccircle cx='10' cy='14' r='2' fill='%233d323f'/%3E%3Ccircle cx='22' cy='14' r='2' fill='%233d323f'/%3E%3Cellipse cx='16' cy='23' rx='7' ry='5' fill='%23ffb0bd'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header class="brand"><h1>Claude Sonnet 5.5</h1></header>

    <section class="card stats" aria-label="Pet status">
      <div class="who">
        <span class="name" id="petName" contenteditable="plaintext-only" spellcheck="false" title="Click to rename"></span>
        <span class="lvl" id="lvl">Lv 1</span>
      </div>
      <div class="xp"><i id="xpFill"></i></div>
      <div class="mood" id="mood"></div>
      <div class="bars" id="bars"></div>
      <div class="craving" id="craving"></div>
    </section>

    <button class="icon-btn" id="mute" aria-label="Toggle sound" title="Sound">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="muteIcon"></svg>
    </button>

    <div id="bubble" class="bubble"></div>
    <div class="hint" id="hint">Drag over Cowdie to pet. Tap for a poke.</div>

    <nav class="dock" aria-label="Actions">
      <div class="group" id="feedGroup"><span class="group-label">Feed</span><div class="row" id="feedRow"></div></div>
      <div class="group" id="careGroup"><span class="group-label">Care</span><div class="row" id="careRow"></div></div>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
