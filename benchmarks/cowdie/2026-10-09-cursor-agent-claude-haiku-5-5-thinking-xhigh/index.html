<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude Haiku 5.5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%AE%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="hud-top">
        <div class="brand">
          <h1 id="app-title">Claude Haiku 5.5</h1>
        </div>
        <div class="pet-card">
          <div class="pet-name-row">
            <span class="pet-name" id="pet-name">Cowdie</span>
            <span class="pet-stage" id="pet-stage">Baby</span>
            <span class="pet-level" id="pet-level">Lv 1</span>
          </div>
          <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
        </div>
        <div class="top-tools">
          <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" title="Sound on/off">🔊</button>
          <button class="icon-btn" id="btn-reset" type="button" title="Start over">↺</button>
        </div>
      </header>

      <main id="stage" class="stage">
        <canvas id="scene" aria-label="Cowdie the virtual pet"></canvas>
        <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
        <div id="zzz" class="zzz" aria-hidden="true">
          <span>Z</span><span>z</span><span>Z</span>
        </div>
        <div id="hint" class="hint">Tap Cowdie, drag food onto its mouth, or use the dock below.</div>
      </main>

      <section class="meters" aria-label="Cowdie stats">
        <div class="meter" data-stat="fullness">
          <span class="meter-icon" aria-hidden="true">🍽️</span>
          <span class="meter-label">Full</span>
          <div class="meter-track"><div class="meter-fill"></div></div>
          <span class="meter-value">0</span>
        </div>
        <div class="meter" data-stat="happiness">
          <span class="meter-icon" aria-hidden="true">💖</span>
          <span class="meter-label">Happy</span>
          <div class="meter-track"><div class="meter-fill"></div></div>
          <span class="meter-value">0</span>
        </div>
        <div class="meter" data-stat="energy">
          <span class="meter-icon" aria-hidden="true">⚡</span>
          <span class="meter-label">Energy</span>
          <div class="meter-track"><div class="meter-fill"></div></div>
          <span class="meter-value">0</span>
        </div>
        <div class="meter" data-stat="hygiene">
          <span class="meter-icon" aria-hidden="true">🫧</span>
          <span class="meter-label">Clean</span>
          <div class="meter-track"><div class="meter-fill"></div></div>
          <span class="meter-value">0</span>
        </div>
      </section>

      <nav class="dock" aria-label="Care actions">
        <div class="food-tray" id="food-tray" hidden></div>
        <div class="dock-row">
          <button class="dock-btn" id="btn-feed" type="button" data-action="feed" aria-expanded="false" aria-controls="food-tray">
            <span class="dock-emoji" aria-hidden="true">🍽️</span><span>Feed</span>
          </button>
          <button class="dock-btn" id="btn-play" type="button" data-action="play">
            <span class="dock-emoji" aria-hidden="true">🎾</span><span>Play</span>
          </button>
          <button class="dock-btn" id="btn-bathe" type="button" data-action="bathe">
            <span class="dock-emoji" aria-hidden="true">🫧</span><span>Bathe</span>
          </button>
          <button class="dock-btn" id="btn-sleep" type="button" data-action="sleep">
            <span class="dock-emoji" aria-hidden="true">🌙</span><span>Sleep</span>
          </button>
        </div>
      </nav>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
