<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#031f38">
  <title>GPT-5.6 Sol</title>
  <style>
    :root {
      color-scheme: dark;
      --foam: #d9fbff;
      --aqua: #51e7e0;
      --deep: #031f38;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #031f38;
      font-family: Inter, ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    }

    body {
      touch-action: none;
      user-select: none;
    }

    #app,
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #title-card {
      position: fixed;
      z-index: 11;
      top: max(22px, env(safe-area-inset-top));
      left: max(22px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 12px 13px;
      border: 1px solid rgba(202, 253, 255, 0.24);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(5, 52, 75, 0.78), rgba(5, 33, 58, 0.45));
      box-shadow:
        0 18px 70px rgba(0, 12, 30, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      pointer-events: none;
    }

    #title-card::before {
      content: "";
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 30%, #f4ffff 0 6%, transparent 7%),
        radial-gradient(circle at 50% 55%, #6bf3e6 0 16%, #0eb4c7 17% 44%, #075a83 45% 69%, transparent 70%);
      box-shadow:
        0 0 22px rgba(74, 241, 225, 0.5),
        inset 0 0 0 1px rgba(215, 255, 255, 0.3);
    }

    h1 {
      margin: 0;
      color: var(--foam);
      font-size: 13px;
      font-weight: 760;
      line-height: 1;
      letter-spacing: 0.18em;
      text-shadow: 0 0 18px rgba(81, 231, 224, 0.3);
    }

    #hint {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 9px 14px;
      border: 1px solid rgba(205, 251, 255, 0.14);
      border-radius: 999px;
      color: rgba(224, 253, 255, 0.66);
      background: rgba(1, 27, 49, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 700ms ease, transform 700ms ease;
    }

    #hint.dismissed {
      opacity: 0;
      transform: translate(-50%, 8px);
    }

    #loader {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(20, 134, 153, 0.7), transparent 34%),
        linear-gradient(#043f62, #031f38);
      transition: opacity 900ms ease, visibility 900ms ease;
      pointer-events: none;
    }

    #loader.ready {
      opacity: 0;
      visibility: hidden;
    }

    .loader-orbit {
      position: relative;
      width: 74px;
      height: 74px;
      border: 1px solid rgba(195, 254, 255, 0.18);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(69, 231, 226, 0.13);
      animation: loader-spin 2.4s linear infinite;
    }

    .loader-orbit::before,
    .loader-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #cfffff;
      box-shadow: 0 0 16px #51e7e0;
    }

    .loader-orbit::before {
      width: 9px;
      height: 9px;
      top: 3px;
      left: 14px;
    }

    .loader-orbit::after {
      width: 5px;
      height: 5px;
      right: 5px;
      bottom: 15px;
      opacity: 0.7;
    }

    #vignette {
      position: fixed;
      z-index: 4;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(1, 25, 47, 0.18), transparent 22%, transparent 78%, rgba(0, 15, 29, 0.32)),
        radial-gradient(circle at center, transparent 55%, rgba(0, 15, 31, 0.2) 100%);
      pointer-events: none;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      #title-card {
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        padding: 10px 15px 10px 10px;
      }

      #title-card::before {
        width: 25px;
        height: 25px;
      }

      h1 {
        font-size: 11px;
      }

      #hint {
        bottom: max(14px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-orbit {
        animation-duration: 5s;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app" aria-label="Interactive three-dimensional underwater world"></main>

  <div id="title-card">
    <h1>GPT-5.6 Sol</h1>
  </div>
  <div id="hint">Drag to explore · Scroll to dive</div>
  <div id="loader" aria-hidden="true"><div class="loader-orbit"></div></div>
  <div id="vignette" aria-hidden="true"></div>

  <script id="ocean-vertex" type="x-shader/x-vertex">
    varying vec3 vPosition;
    void main() {
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  </script>

  <script id="ocean-fragment" type="x-shader/x-fragment">
    varying vec3 vPosition;
    uniform float uTime;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vec3 n = normalize(vPosition);
      float h = n.y * 0.5 + 0.5;
      vec3 abyss = vec3(0.004, 0.055, 0.105);
      vec3 mid = vec3(0.015, 0.23, 0.34);
      vec3 surface = vec3(0.11, 0.55, 0.58);
      vec3 color = mix(abyss, mid, smoothstep(0.04, 0.62, h));
      color = mix(color, surface, smoothstep(0.62, 0.98, h));

      float sun = pow(max(dot(n, normalize(vec3(-0.24, 0.93, 0.28))), 0.0), 48.0);
      color += vec3(0.32, 0.62, 0.54) * sun * 0.75;

      vec2 cell = floor((n.xz + uTime * 0.003) * 95.0);
      float grain = hash(cell) - 0.5;
      color += grain * 0.012;
      gl_FragColor = vec4(color, 1.0);
    }
  </script>

  <script id="surface-vertex" type="x-shader/x-vertex">
    uniform float uTime;
    varying vec2 vUv;
    varying float vWave;

    void main() {
      vUv = uv;
      vec3 p = position;
      float w1 = sin(p.x * 0.105 + uTime * 0.72);
      float w2 = cos(p.y * 0.13 - uTime * 0.54);
      float w3 = sin((p.x + p.y) * 0.072 + uTime * 0.31);
      vWave = (w1 + w2 + w3) / 3.0;
      p.z += vWave * 0.48;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  </script>

  <script id="surface-fragment" type="x-shader/x-fragment">
    uniform float uTime;
    varying vec2 vUv;
    varying float vWave;

    void main() {
      vec2 q = vUv * 42.0;
      float bands = sin(q.x + sin(q.y * 0.67 + uTime) * 2.0);
      bands *= cos(q.y * 0.78 - uTime * 0.72);
      float glint = pow(abs(bands), 9.0);
      vec3 color = mix(vec3(0.04, 0.38, 0.48), vec3(0.46, 1.0, 0.92), glint);
      float alpha = 0.16 + glint * 0.23 + vWave * 0.025;
      gl_FragColor = vec4(color, alpha);
    }
  </script>

  <script id="ray-vertex" type="x-shader/x-vertex">
    varying vec3 vLocal;
    #include <fog_pars_vertex>
    void main() {
      vLocal = position;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }
  </script>

  <script id="ray-fragment" type="x-shader/x-fragment">
    uniform float uTime;
    uniform float uPhase;
    varying vec3 vLocal;
    #include <fog_pars_fragment>

    void main() {
      float stripe = sin(vLocal.y * 0.72 + vLocal.x * 1.9 + uTime * 0.22 + uPhase);
      float noise = 0.72 + stripe * 0.14;
      float fade = smoothstep(-18.0, 15.0, vLocal.y);
      float edge = 1.0 - smoothstep(0.15, 4.4, length(vLocal.xz));
      float alpha = (0.018 + 0.048 * fade) * noise * edge;
      gl_FragColor = vec4(0.43, 0.96, 0.88, alpha);
      #ifdef USE_FOG
        #ifdef FOG_EXP2
          float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
        #else
          float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
        #endif
        gl_FragColor *= 1.0 - fogFactor;
      #endif
    }
  </script>

  <script id="particle-vertex" type="x-shader/x-vertex">
    uniform float uTime;
    attribute float aSize;
    attribute float aPhase;
    varying float vGlow;
    #include <fog_pars_vertex>

    void main() {
      vec3 p = position;
      p.x += sin(uTime * 0.17 + aPhase + p.y * 0.08) * 0.85;
      p.z += cos(uTime * 0.13 + aPhase * 1.7 + p.x * 0.06) * 0.65;
      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * (170.0 / max(5.0, -mvPosition.z));
      vGlow = 0.62 + 0.38 * sin(uTime * 0.65 + aPhase);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }
  </script>

  <script id="particle-fragment" type="x-shader/x-fragment">
    varying float vGlow;
    #include <fog_pars_fragment>
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      float alpha = (1.0 - smoothstep(0.02, 0.5, d)) * 0.34 * vGlow;
      gl_FragColor = vec4(0.66, 1.0, 0.92, alpha);
      #ifdef USE_FOG
        #ifdef FOG_EXP2
          float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
        #else
          float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
        #endif
        gl_FragColor *= 1.0 - fogFactor;
      #endif
    }
  </script>

  <script id="bubble-vertex" type="x-shader/x-vertex">
    attribute float aSize;
    varying float vDepth;
    #include <fog_pars_vertex>
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (230.0 / max(5.0, -mvPosition.z));
      vDepth = clamp((-mvPosition.z) / 100.0, 0.0, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }
  </script>

  <script id="bubble-fragment" type="x-shader/x-fragment">
    varying float vDepth;
    #include <fog_pars_fragment>
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      float ring = smoothstep(0.31, 0.39, d) * (1.0 - smoothstep(0.42, 0.50, d));
      float shine = 1.0 - smoothstep(0.0, 0.13, length(p - vec2(-0.16, 0.17)));
      float alpha = (ring * 0.58 + shine * 0.7) * (1.0 - vDepth * 0.5);
      if (alpha < 0.012) discard;
      gl_FragColor = vec4(0.74, 1.0, 1.0, alpha);
      #ifdef USE_FOG
        #ifdef FOG_EXP2
          float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
        #else
          float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
        #endif
        gl_FragColor *= 1.0 - fogFactor;
      #endif
    }
  </script>

  <script id="grade-vertex" type="x-shader/x-vertex">
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  </script>

  <script id="grade-fragment" type="x-shader/x-fragment">
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uResolution;
    varying vec2 vUv;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      vec2 centered = vUv - 0.5;
      float edge = smoothstep(0.12, 0.72, length(centered));
      vec2 aberration = centered * (0.0007 + edge * 0.0015);
      float r = texture2D(tDiffuse, vUv + aberration).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - aberration).b;
      vec3 color = vec3(r, g, b);

      color *= vec3(0.93, 1.025, 1.055);
      color = mix(color, color * vec3(0.78, 1.03, 1.06), 0.10);
      float vignette = 1.0 - smoothstep(0.26, 0.84, length(centered * vec2(0.9, 1.0)));
      color *= mix(0.76, 1.03, vignette);

      float grain = hash(vUv * uResolution + fract(uTime) * 97.0) - 0.5;
      color += grain * 0.010;
      gl_FragColor = vec4(color, 1.0);
    }
  </script>

  <script id="caustic-pars" type="x-shader/x-fragment">
    uniform float uCausticTime;
    varying vec3 vCausticPosition;

    float causticLayer(vec2 p, float t) {
      float a = sin(p.x * 1.21 + sin(p.y * 0.73 + t) * 2.1);
      float b = cos(p.y * 1.13 - sin(p.x * 0.67 - t * 0.8) * 2.0);
      return pow(clamp(1.0 - abs(a * b), 0.0, 1.0), 8.0);
    }
  </script>

  <script id="caustic-body" type="x-shader/x-fragment">
    vec2 cp = vCausticPosition.xz * 0.14;
    float c1 = causticLayer(cp, uCausticTime * 0.72);
    float c2 = causticLayer(cp * 1.47 + vec2(1.7, -2.3), -uCausticTime * 0.53);
    float causticGlow = smoothstep(0.24, 1.24, c1 + c2 * 0.62);
    totalEmissiveRadiance += vec3(0.08, 0.38, 0.43) * causticGlow * 0.56;
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const app = document.getElementById("app");
    const loader = document.getElementById("loader");
    const hint = document.getElementById("hint");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x052d4a);
    scene.fog = new THREE.FogExp2(0x073f5c, 0.0112);

    const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 320);
    camera.position.set(47, 28, 61);

    function getRenderPixelRatio(width, height) {
      const areaLimitedRatio = Math.sqrt(4200000 / Math.max(1, width * height));
      return Math.max(0.72, Math.min(devicePixelRatio, 1.5, areaLimitedRatio));
    }
    let renderPixelRatio = getRenderPixelRatio(innerWidth, innerHeight);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: false,
      powerPreference: "high-performance",
      stencil: false
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(renderPixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.domElement.setAttribute("aria-label", "Bikini Bottom 3D viewport");
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6.8, -6);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 23;
    controls.maxDistance = 105;
    controls.minPolarAngle = 0.29;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.autoRotate = !reducedMotion;
    controls.autoRotateSpeed = 0.22;
    controls.zoomSpeed = 0.68;
    controls.rotateSpeed = 0.48;

    function fitOpeningCamera(aspect) {
      const compactMix = 1 - THREE.MathUtils.smoothstep(aspect, 0.72, 1.15);
      camera.fov = THREE.MathUtils.lerp(46, 82, compactMix);
      camera.position.set(
        THREE.MathUtils.lerp(47, 0, compactMix),
        THREE.MathUtils.lerp(28, 34, compactMix),
        THREE.MathUtils.lerp(61, 108, compactMix)
      );
      controls.target.set(
        0,
        THREE.MathUtils.lerp(6.8, 7.2, compactMix),
        THREE.MathUtils.lerp(-6, -7, compactMix)
      );
      controls.maxDistance = THREE.MathUtils.lerp(105, 145, compactMix);
      camera.updateProjectionMatrix();
      controls.update();
    }
    fitOpeningCamera(camera.aspect);

    const renderTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
      type: THREE.HalfFloatType,
      samples: Math.min(2, renderer.capabilities.maxSamples || 0)
    });
    const composer = new EffectComposer(renderer, renderTarget);
    composer.setPixelRatio(renderPixelRatio);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.52,
      0.52,
      0.82
    );
    composer.addPass(bloomPass);

    const gradePass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(innerWidth * renderPixelRatio, innerHeight * renderPixelRatio) }
      },
      vertexShader: document.getElementById("grade-vertex").textContent,
      fragmentShader: document.getElementById("grade-fragment").textContent
    });
    composer.addPass(gradePass);
    composer.addPass(new OutputPass());

    let randomState = 0x5b0b0b;
    function random() {
      randomState |= 0;
      randomState = randomState + 0x6d2b79f5 | 0;
      let t = Math.imul(randomState ^ randomState >>> 15, 1 | randomState);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function terrainHeight(x, z) {
      const broad = Math.sin(x * 0.052) * 0.42 + Math.cos(z * 0.061) * 0.34;
      const ripple = Math.sin((x + z) * 0.033) * 0.31 + Math.cos((x - z) * 0.041) * 0.24;
      const basin = -Math.exp(-(x * x + (z + 4) * (z + 4)) / 1800) * 0.3;
      return broad + ripple + basin;
    }

    function makeCanvasTexture(width, height, painter) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      painter(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    const sandTexture = makeCanvasTexture(256, 256, function(ctx, w, h) {
      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, "#d8bd76");
      gradient.addColorStop(0.5, "#caae6e");
      gradient.addColorStop(1, "#e0c889");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 2100; i++) {
        const v = Math.floor(range(115, 220));
        const a = range(0.025, 0.12);
        ctx.fillStyle = "rgba(" + v + "," + Math.floor(v * 0.87) + "," + Math.floor(v * 0.51) + "," + a + ")";
        const r = range(0.35, 1.4);
        ctx.fillRect(range(0, w), range(0, h), r, r);
      }
    });
    sandTexture.repeat.set(23, 23);

    const pineappleTexture = makeCanvasTexture(512, 512, function(ctx, w, h) {
      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, "#f9a51b");
      gradient.addColorStop(0.5, "#e8780d");
      gradient.addColorStop(1, "#b84908");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      ctx.lineWidth = 11;
      ctx.strokeStyle = "rgba(104, 55, 6, 0.58)";
      const step = 72;
      for (let x = -w; x < w * 2; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + w, h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255, 204, 58, 0.72)";
      for (let y = step / 2; y < h; y += step) {
        for (let x = step / 2; x < w; x += step) {
          ctx.beginPath();
          ctx.arc(x + ((y / step) % 2) * 5, y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    });
    pineappleTexture.repeat.set(2.7, 2.7);

    const leafTexture = makeCanvasTexture(256, 512, function(ctx, w, h) {
      const gradient = ctx.createLinearGradient(0, 0, w, 0);
      gradient.addColorStop(0, "#244f25");
      gradient.addColorStop(0.5, "#7da53a");
      gradient.addColorStop(1, "#315d25");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(184, 219, 91, 0.48)";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w / 2, h);
      ctx.stroke();
      ctx.lineWidth = 3;
      for (let y = 30; y < h; y += 42) {
        ctx.beginPath();
        ctx.moveTo(w / 2, y);

        ctx.moveTo(w / 2, y);
        ctx.lineTo(w - 18, y + 52);

    });

    const woodTexture = makeCanvasTexture(512, 256, function(ctx, w, h) {
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, "#704124");
      gradient.addColorStop(0.5, "#4b291b");
      gradient.addColorStop(1, "#2f1d18");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      for (let y = 16; y < h; y += 28) {
        ctx.strokeStyle = "rgba(19, 9, 5, 0.5)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 24) {
          ctx.lineTo(x, y + Math.sin(x * 0.055 + y) * 3);
        }
        ctx.stroke();
      }
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = "rgba(218, 144, 63," + range(0.025, 0.1) + ")";

        ctx.fillStyle = "rgba(" + Math.floor(light * 0.65) + "," + Math.floor(light * 0.86) + "," + light + "," + range(0.03, 0.16) + ")";
        const r = range(0.5, 2.8);
        ctx.beginPath();
        ctx.arc(range(0, w), range(0, h), r, 0, Math.PI * 2);

        gradient.addColorStop(0, "#f4df9e");
        gradient.addColorStop(1, "#bc7a37");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(82, 36);
        ctx.quadraticCurveTo(w * 0.5, -10, w - 82, 36);
        ctx.quadraticCurveTo(w + 8, h * 0.5, w - 82, h - 36);
        ctx.quadraticCurveTo(w * 0.5, h + 10, 82, h - 36);
        ctx.quadraticCurveTo(-8, h * 0.5, 82, 36);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 22;
        ctx.strokeStyle = "#5c2b1a";
        ctx.stroke();
        const label = "THE KRUSTY KRAB";
        let fontSize = 110;
        ctx.font = "900 " + fontSize + "px Georgia, serif";
        const measuredWidth = ctx.measureText(label).width;
        if (measuredWidth > w - 150) {
          fontSize *= (w - 150) / measuredWidth;
          ctx.font = "900 " + fontSize + "px Georgia, serif";
        }
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 18;
        ctx.strokeStyle = "#f2cf73";
        ctx.strokeText(label, w / 2, h / 2 + 6);
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#4f1d17";

    function blobShadow(parent, radiusX, radiusZ, y) {
      const material = new THREE.MeshBasicMaterial({
        color: 0x03151e,
        transparent: true,
        opacity: 0.23,
        depthWrite: false,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2

      const positions = geometry.attributes.position;
      const lift = y === undefined ? 0.035 : y;
      for (let i = 0; i < positions.count; i++) {
        const localX = positions.getX(i) * radiusX;
        const localZ = positions.getY(i) * radiusZ;
        const localY = terrainHeight(
          parent.position.x + localX,
          parent.position.z + localZ
        ) - parent.position.y + lift;
        positions.setXYZ(i, localX, localY, localZ);
      }
      geometry.computeVertexNormals();
      const shadow = addMesh(
        parent,
        geometry,
        material,
        [0, 0, 0],
        null,
        null,
        false
      );
      shadow.renderOrder = 1;
      return shadow;

    function cylinderBetween(parent, start, end, radiusStart, radiusEnd, material, segments) {
      const direction = end.clone().sub(start);

      const geometry = new THREE.CylinderGeometry(
        radiusEnd === undefined ? radiusStart : radiusEnd,
        radiusStart,
        length,
        segments || 9,

      const object = new THREE.Mesh(geometry, material);
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      object.castShadow = true;

    function cylinderGeometryBetween(start, end, radiusStart, radiusEnd, segments) {

      const geometry = new THREE.CylinderGeometry(
        radiusEnd === undefined ? radiusStart : radiusEnd,
        radiusStart,
        length,
        segments || 9,

      const midpoint = start.clone().add(end).multiplyScalar(0.5);
      const quaternion = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      const matrix = new THREE.Matrix4().compose(

      geometry.applyMatrix4(matrix);
      return geometry;

      let closest = Infinity;

    function createStreet() {
      const samples = 90;

        const t = i / samples;
        const point = streetCurve.getPoint(t);
        const tangent = streetCurve.getTangent(t).normalize();
        const perpendicular = new THREE.Vector3(-tangent.z, 0, tangent.x);
        for (let side = -1; side <= 1; side += 2) {
          const p = point.clone().addScaledVector(perpendicular, halfWidth * side);
          p.y = terrainHeight(p.x, p.z) + 0.09;
          positions.push(p.x, p.y, p.z);
          uvs.push(t * 18, side < 0 ? 0 : 1);
        }
        if (i < samples) {
          const a = i * 2;
          indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);

      const dummy = new THREE.Object3D();

        addMesh(stalk, new THREE.SphereGeometry(0.37, 16, 12), physical(0xdaf4b8, 0.32), [0, 1.55, 0]);
        addMesh(stalk, new THREE.CircleGeometry(0.18, 16), side < 0 ? physical(0xe73d4b, 0.3) : physical(0xf08f42, 0.3), [0, 1.55, 0.36], null, null, false);
        addMesh(stalk, new THREE.CircleGeometry(0.09, 14), pupilMaterial, [0, 1.55, 0.375], null, null, false);
        stalks.push(stalk);
      }
      createSmile(
        group,
        new THREE.Vector3(1.23, 0.75, 0.6),
        new THREE.Vector3(1.58, 0.5, 0.72),
        new THREE.Vector3(1.9, 0.76, 0.55),
        0.045,
        pupilMaterial
      );
      group.userData.stalks = stalks;
      return group;
    }

    const spongebob = createSpongeBob();
    const patrick = createPatrick();
    const squidward = createSquidward();
    const gary = createGary();

    const jellyfish = [];
    function createJellyfish(x, y, z, scale, color, phase) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      group.userData.base = new THREE.Vector3(x, y, z);
      group.userData.phase = phase;
      roots.effects.add(group);

      const jellyMaterial = new THREE.MeshPhysicalMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 1.15,
        roughness: 0.12,
        transparent: true,
        opacity: 0.52,
        clearcoat: 1,
        clearcoatRoughness: 0.16,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const rimMaterial = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.72,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      addMesh(
        group,
        new THREE.SphereGeometry(2.1, 28, 14, 0, Math.PI * 2, 0, Math.PI * 0.5),
        jellyMaterial,
        [0, 0, 0],
        null,
        [1, 0.74, 1],
        false
      );
      addMesh(group, new THREE.TorusGeometry(2.03, 0.16, 10, 32), rimMaterial, [0, 0, 0], [Math.PI / 2, 0, 0], null, false);
      for (let i = 0; i < 6; i++) {
        const angle = i / 6 * Math.PI * 2;
        const sx = Math.cos(angle) * 1.35;
        const sz = Math.sin(angle) * 1.35;
        const tentacle = tubeFromPoints([
          new THREE.Vector3(sx, -0.1, sz),
          new THREE.Vector3(sx * 0.88 + 0.3, -1.3, sz * 0.88),
          new THREE.Vector3(sx * 0.78 - 0.18, -2.45, sz * 0.78 + 0.2),
          new THREE.Vector3(sx * 0.65 + 0.24, -3.55, sz * 0.65)
        ], 0.075, rimMaterial, group, 26);
        tentacle.userData.phase = angle;
      }
      jellyfish.push(group);
      return group;
    }

    createJellyfish(-22, 22, 4, 1.0, 0xff73bd, 0.2);
    createJellyfish(8, 27, -4, 1.22, 0xff8ccf, 2.1);
    createJellyfish(35, 20, 4, 0.82, 0xe875d5, 4.0);

    const kelp = [];
    function createKelpCluster(x, z, count, color) {
      const cluster = new THREE.Group();
      cluster.position.set(x, terrainHeight(x, z), z);
      roots.environment.add(cluster);
      const material = physical(color, 0.65, {
        emissive: new THREE.Color(color).multiplyScalar(0.09),
        emissiveIntensity: 0.25
      });
      for (let k = 0; k < count; k++) {
        const stalk = new THREE.Group();
        stalk.position.set(range(-1.6, 1.6), 0, range(-1.4, 1.4));
        stalk.rotation.y = range(0, Math.PI * 2);
        stalk.userData.phase = range(0, Math.PI * 2);
        stalk.userData.strength = range(0.035, 0.085);
        cluster.add(stalk);

        const height = range(4.3, 8.2);
        const points = [];
        for (let p = 0; p < 6; p++) {
          const y = p / 5 * height;
          points.push(new THREE.Vector3(Math.sin(p * 0.78) * 0.25, y, Math.cos(p * 0.64) * 0.16));
        }
        const kelpParts = [
          new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(points),
            30,
            range(0.11, 0.18),
            7,
            false
          )
        ];
        for (let l = 1; l < 5; l++) {
          const side = l % 2 ? -1 : 1;
          kelpParts.push(transformGeometry(
            new THREE.SphereGeometry(0.48, 12, 8),
            new THREE.Vector3(side * 0.38, l / 5 * height, 0),
            new THREE.Euler(0, 0, side * 0.55),
            new THREE.Vector3(0.42, 1.42, 0.15)
          ));
        }
        const mergedKelp = mergeGeometries(kelpParts, false);
        addMesh(stalk, mergedKelp, material, null, null, null, false);
        kelpParts.forEach(function(geometry) {
          geometry.dispose();
        });
        kelp.push(stalk);
      }
      cluster.traverse(function(object) {
        if (object.isMesh) {
          object.castShadow = false;
          object.receiveShadow = true;
        }
      });
    }

    const kelpLocations = [
      [-48, -4, 5, 0x3f8b4b],
      [-43, 26, 6, 0x477b3d],
      [-18, -38, 5, 0x5a9949],
      [16, -48, 6, 0x3c824a],
      [48, -6, 6, 0x4e8f43],
      [45, 35, 5, 0x387b51],
      [-32, 42, 5, 0x4b8646]
    ];
    kelpLocations.forEach(function(item) {
      createKelpCluster(item[0], item[1], item[2], item[3]);
    });

    function createCoral(x, z, color, size, branchCount) {
      const group = new THREE.Group();
      group.position.set(x, terrainHeight(x, z), z);
      roots.environment.add(group);
      const material = physical(color, 0.7, {
        clearcoat: 0.32,
        emissive: new THREE.Color(color).multiplyScalar(0.14),
        emissiveIntensity: 0.35
      });
      const trunkTop = new THREE.Vector3(0, size * 2.5, 0);
      const coralParts = [
        cylinderGeometryBetween(
          new THREE.Vector3(0, 0, 0),
          trunkTop,
          size * 0.32,
          size * 0.21,
          8
        )
      ];
      for (let i = 0; i < branchCount; i++) {
        const angle = i / branchCount * Math.PI * 2 + range(-0.35, 0.35);
        const startY = range(size * 0.55, size * 2.05);
        const start = new THREE.Vector3(0, startY, 0);
        const elbow = new THREE.Vector3(Math.cos(angle) * size * range(0.65, 1.05), startY + size * 0.4, Math.sin(angle) * size * range(0.65, 1.05));
        const end = elbow.clone().add(new THREE.Vector3(Math.cos(angle) * size * 0.25, size * range(0.55, 1.2), Math.sin(angle) * size * 0.25));
        coralParts.push(cylinderGeometryBetween(start, elbow, size * 0.19, size * 0.14, 7));
        coralParts.push(cylinderGeometryBetween(elbow, end, size * 0.15, size * 0.09, 7));
        coralParts.push(transformGeometry(
          new THREE.SphereGeometry(size * 0.15, 10, 7),
          end
        ));
      }
      const mergedCoral = mergeGeometries(coralParts, false);
      addMesh(group, mergedCoral, material, null, null, null, false);
      coralParts.forEach(function(geometry) {
        geometry.dispose();
      });
      blobShadow(group, size * 1.7, size * 1.7, 0.02);
    }

    const coralData = [
      [-52, 17, 0xf07373, 1.3, 6],
      [-40, -29, 0xf0a240, 1.55, 7],
      [-15, 37, 0xd75b8f, 1.05, 6],
      [9, 41, 0xf07b5a, 1.4, 7],
      [53, 19, 0xd85fc5, 1.25, 7],
      [48, -43, 0xf5a259, 1.5, 7],
      [9, -54, 0xd95a72, 1.65, 8],
      [-55, -48, 0xe4679e, 1.4, 7]
    ];
    coralData.forEach(function(item) {
      createCoral(item[0], item[1], item[2], item[3], item[4]);
    });

    const rockGeometry = new THREE.DodecahedronGeometry(1, 1);
    const rockMaterial = standard(0x59717a, 0.94);
    const rocks = new THREE.InstancedMesh(rockGeometry, rockMaterial, 30);
    const rockDummy = new THREE.Object3D();
    const landmarkClearings = [
      [-29, -10, 10],
      [-3, -15, 9],
      [23, -7, 9],
      [30, -31, 15]
    ];
    for (let i = 0; i < 30; i++) {
      let x;
      let z;
      let blocked;
      do {
        x = range(-75, 75);
        z = range(-70, 58);
        blocked = streetDistanceSquared(x, z) < 68;
        if (!blocked) {
          blocked = landmarkClearings.some(function(item) {
            const dx = x - item[0];
            const dz = z - item[1];
            return dx * dx + dz * dz < item[2] * item[2];
          });
        }
      } while (blocked);
      rockDummy.position.set(x, terrainHeight(x, z) + 0.5, z);
      rockDummy.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
      rockDummy.scale.set(range(0.55, 2.6), range(0.35, 1.4), range(0.55, 2.2));
      rockDummy.updateMatrix();
      rocks.setMatrixAt(i, rockDummy.matrix);
    }
    rocks.castShadow = true;
    rocks.receiveShadow = true;
    roots.environment.add(rocks);

    const distantRockMaterial = standard(0x143f50, 1.0, 0, {
      transparent: true,
      opacity: 0.82
    });
    for (let i = 0; i < 22; i++) {
      const angle = i / 22 * Math.PI * 2;
      const radius = range(76, 92);
      addMesh(
        roots.distant,
        new THREE.DodecahedronGeometry(range(3.0, 8.0), 0),
        distantRockMaterial,
        [Math.cos(angle) * radius, range(-1, 3.0), Math.sin(angle) * radius],
        [range(0, 2), range(0, 2), range(0, 2)],
        [1, range(1.2, 3.5), 1],
        false
      );
    }

    const seaFlowers = [];
    function createSeaFlower(x, y, z, scale, color) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      roots.distant.add(group);
      const material = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.075,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false
      });
      for (let i = 0; i < 5; i++) {
        const angle = i / 5 * Math.PI * 2;
        const petal = addMesh(
          group,
          new THREE.TorusGeometry(1.45, 0.17, 8, 24),
          material,
          [Math.cos(angle) * 1.8, Math.sin(angle) * 1.8, 0],
          [0, 0, angle],
          [0.68, 1.18, 0.68],
          false
        );
        petal.renderOrder = -2;
      }
      seaFlowers.push(group);
    }
    createSeaFlower(-59, 27, -73, 2.2, 0x65d8d8);
    createSeaFlower(54, 31, -68, 1.65, 0x8de7bd);
    createSeaFlower(-70, 19, 9, 1.35, 0x4fa8cb);

    const fishSchools = [];
    function createFishSchool(y, z, direction, color, count) {
      const group = new THREE.Group();
      group.position.set(direction > 0 ? -82 : 82, y, z);
      group.userData.direction = direction;
      group.userData.speed = range(0.7, 1.25);
      roots.distant.add(group);
      const material = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.42,
        fog: true
      });
      for (let i = 0; i < count; i++) {
        const fish = new THREE.Group();
        fish.position.set(range(-6, 6), range(-3, 3), range(-4, 4));
        fish.scale.setScalar(range(0.45, 1.05));
        if (direction < 0) fish.rotation.y = Math.PI;
        group.add(fish);
        addMesh(fish, new THREE.SphereGeometry(0.52, 10, 7), material, [0, 0, 0], null, [1.8, 0.65, 0.42], false);
        addMesh(fish, new THREE.ConeGeometry(0.5, 0.95, 3), material, [-1.14, 0, 0], [0, 0, Math.PI / 2], [1, 1, 0.55], false);
      }
      fishSchools.push(group);
    }
    createFishSchool(17, -55, 1, 0x4b8291, 9);
    createFishSchool(25, -42, -1, 0x5d97a5, 7);
    createFishSchool(12, -67, 1, 0x396f82, 11);

    const particleCount = 720;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    const particlePhases = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3] = range(-88, 88);
      particlePositions[i * 3 + 1] = range(0.6, 39);
      particlePositions[i * 3 + 2] = range(-88, 76);
      particleSizes[i] = range(1.2, 4.2);
      particlePhases[i] = range(0, Math.PI * 2);
    }
    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));
    particleGeometry.setAttribute("aSize", new THREE.BufferAttribute(particleSizes, 1));
    particleGeometry.setAttribute("aPhase", new THREE.BufferAttribute(particlePhases, 1));
    const particleMaterial = new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        { uTime: { value: 0 } }
      ]),
      vertexShader: document.getElementById("particle-vertex").textContent,
      fragmentShader: document.getElementById("particle-fragment").textContent,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: true
    });
    const plankton = new THREE.Points(particleGeometry, particleMaterial);
    plankton.frustumCulled = false;
    roots.effects.add(plankton);

    const bubbleCount = 150;
    const bubblePositions = new Float32Array(bubbleCount * 3);
    const bubbleSizes = new Float32Array(bubbleCount);
    const bubbleSpeeds = new Float32Array(bubbleCount);
    const bubbleOrigins = new Float32Array(bubbleCount * 2);
    for (let i = 0; i < bubbleCount; i++) {
      const originX = range(-70, 70);
      const originZ = range(-65, 55);
      bubblePositions[i * 3] = originX;
      bubblePositions[i * 3 + 1] = range(0, 40);
      bubblePositions[i * 3 + 2] = originZ;
      bubbleOrigins[i * 2] = originX;
      bubbleOrigins[i * 2 + 1] = originZ;
      bubbleSizes[i] = range(2.8, 8.5);
      bubbleSpeeds[i] = range(0.5, 1.65);
    }
    const bubbleGeometry = new THREE.BufferGeometry();
    bubbleGeometry.setAttribute("position", new THREE.BufferAttribute(bubblePositions, 3));
    bubbleGeometry.setAttribute("aSize", new THREE.BufferAttribute(bubbleSizes, 1));
    const bubbleMaterial = new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.clone(THREE.UniformsLib.fog),
      vertexShader: document.getElementById("bubble-vertex").textContent,
      fragmentShader: document.getElementById("bubble-fragment").textContent,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: true
    });
    const bubbles = new THREE.Points(bubbleGeometry, bubbleMaterial);
    bubbles.frustumCulled = false;
    roots.effects.add(bubbles);

    const timer = new THREE.Timer();
    timer.connect(document);
    let elapsed = 0;
    let idleTimer = 0;
    let firstFrame = true;
    let cameraWasManuallyMoved = false;

    function userInteracted() {
      idleTimer = 0;
      cameraWasManuallyMoved = true;
      controls.autoRotate = false;
      hint.classList.add("dismissed");
    }
    controls.addEventListener("start", userInteracted);
    renderer.domElement.addEventListener("wheel", userInteracted, { passive: true });
    renderer.domElement.addEventListener("pointerdown", userInteracted, { passive: true });

    function animate(timestamp) {
      timer.update(timestamp);
      const delta = Math.min(timer.getDelta(), 0.05);
      elapsed += delta;
      idleTimer += delta;
      if (!reducedMotion && idleTimer > 7.0) controls.autoRotate = true;
      controls.update();

      oceanMaterial.uniforms.uTime.value = elapsed;
      surfaceMaterial.uniforms.uTime.value = elapsed;
      particleMaterial.uniforms.uTime.value = elapsed;
      gradePass.uniforms.uTime.value = elapsed;
      if (sandShader) sandShader.uniforms.uCausticTime.value = elapsed;
      rayMaterials.forEach(function(material) {
        material.uniforms.uTime.value = elapsed;
      });

      spongebob.position.y = spongebob.userData.baseY + Math.sin(elapsed * 2.15) * 0.11;
      const spongeScale = 1 + Math.sin(elapsed * 2.15) * 0.012;
      spongebob.userData.bodyPivot.scale.set(1 / spongeScale, spongeScale, 1);

      patrick.position.y = patrick.userData.baseY + Math.sin(elapsed * 1.1 + 1.4) * 0.07;
      patrick.userData.pivot.rotation.z = Math.sin(elapsed * 0.72 + 0.4) * 0.055;
      patrick.userData.pivot.rotation.y = Math.sin(elapsed * 0.41) * 0.035;

      squidward.position.y = squidward.userData.baseY + Math.sin(elapsed * 0.9) * 0.035;
      const annoyed = Math.sin(elapsed * 0.63) * Math.sin(elapsed * 1.73);
      squidward.userData.head.rotation.y = annoyed * 0.095;
      squidward.userData.head.rotation.z = Math.sin(elapsed * 0.54) * 0.018;

      gary.position.x = gary.userData.baseX + Math.sin(elapsed * 0.18) * 0.78;
      gary.position.y = gary.userData.baseY + Math.abs(Math.sin(elapsed * 0.62)) * 0.035;
      gary.userData.stalks[0].rotation.z = Math.sin(elapsed * 0.8) * 0.08;
      gary.userData.stalks[1].rotation.z = Math.sin(elapsed * 0.8 + 1.3) * 0.08;

      jellyfish.forEach(function(jelly, index) {
        const phase = jelly.userData.phase;
        jelly.position.y = jelly.userData.base.y + Math.sin(elapsed * 0.62 + phase) * 1.25;
        jelly.position.x = jelly.userData.base.x + Math.sin(elapsed * 0.18 + phase) * 2.0;
        jelly.position.z = jelly.userData.base.z + Math.cos(elapsed * 0.15 + phase) * 1.1;
        jelly.rotation.y = elapsed * (0.07 + index * 0.015);
        jelly.scale.y = jelly.scale.x * (1 + Math.sin(elapsed * 1.23 + phase) * 0.08);
      });

      kelp.forEach(function(stalk) {
        const phase = stalk.userData.phase;
        stalk.rotation.z = Math.sin(elapsed * 0.62 + phase) * stalk.userData.strength;
        stalk.rotation.x = Math.cos(elapsed * 0.48 + phase * 1.2) * stalk.userData.strength * 0.65;
      });

      const bubbleAttribute = bubbleGeometry.attributes.position;
      for (let i = 0; i < bubbleCount; i++) {
        let y = bubbleAttribute.getY(i) + bubbleSpeeds[i] * delta;
        const originX = bubbleOrigins[i * 2];
        const originZ = bubbleOrigins[i * 2 + 1];
        if (y > 40.5) {
          y = terrainHeight(originX, originZ) + range(0, 2.5);
        }
        bubbleAttribute.setY(i, y);
        bubbleAttribute.setX(i, originX + Math.sin(elapsed * 0.5 + i * 1.7) * 0.4);
        bubbleAttribute.setZ(i, originZ + Math.cos(elapsed * 0.43 + i * 1.3) * 0.35);
      }
      bubbleAttribute.needsUpdate = true;

      fishSchools.forEach(function(school, index) {
        school.position.x += school.userData.direction * school.userData.speed * delta;
        school.position.y += Math.sin(elapsed * 0.55 + index) * delta * 0.06;
        if (school.userData.direction > 0 && school.position.x > 90) school.position.x = -90;
        if (school.userData.direction < 0 && school.position.x < -90) school.position.x = 90;
      });

      seaFlowers.forEach(function(flower) {
        flower.lookAt(camera.position);
      });

      pineappleHouse.children.forEach(function(child, index) {
        if (child.userData.baseRotation) {
          child.rotation.z = child.userData.baseRotation.z + Math.sin(elapsed * 0.42 + index) * 0.025;
          child.rotation.x = child.userData.baseRotation.x + Math.cos(elapsed * 0.38 + index) * 0.018;
        }
      });

      composer.render();
      if (firstFrame) {
        firstFrame = false;
        requestAnimationFrame(function() {
          loader.classList.add("ready");
        });
      }
    }

    function onResize() {
      const width = innerWidth;
      const height = innerHeight;
      renderPixelRatio = getRenderPixelRatio(width, height);
      camera.aspect = width / height;
      if (cameraWasManuallyMoved) {
        camera.updateProjectionMatrix();
      } else {
        fitOpeningCamera(camera.aspect);
      }
      renderer.setPixelRatio(renderPixelRatio);
      renderer.setSize(width, height);
      composer.setPixelRatio(renderPixelRatio);
      composer.setSize(width, height);
      gradePass.uniforms.uResolution.value.set(width * renderPixelRatio, height * renderPixelRatio);
    }
    addEventListener("resize", onResize, { passive: true });

    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
