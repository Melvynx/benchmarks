<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08344c">
  <link rel="icon" href="data:,">
  <title>Grok 4.7</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08344c;
      font-family: "Avenir Next", "Segoe UI", ui-rounded, system-ui, sans-serif;
    }
    canvas { display: block; outline: none; touch-action: none; }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 20%, #127a9a 0%, #08344c 58%, #041824 100%);
      transition: opacity 0.7s ease, visibility 0.7s;
    }
    #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .orb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid rgba(190, 245, 255, 0.28);
      border-top-color: #d8fbff;
      animation: spin 0.9s linear infinite;
    }
    #boot pre {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      color: #ffd5d5;
      font-size: 12px;
      white-space: pre-wrap;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    h1 {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      color: #f3fffd;
      font-size: clamp(18px, 2.5vw, 30px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 16px rgba(0, 18, 32, 0.85);
      white-space: nowrap;
    }
    #hint {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(226, 248, 255, 0.72);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 10, 20, 0.75);
    }
    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; border-color: #d8fbff; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="boot"><div class="orb" aria-hidden="true"></div></div>
  <div id="hud">
    <h1>Grok 4.7</h1>
    <p id="hint">Drag to orbit · Scroll to zoom</p>
  </div>
  <noscript>JavaScript is required.</noscript>
  <script>
    addEventListener('error', (event) => {
      const boot = document.getElementById('boot');
      if (!boot || boot.dataset.ready) return;
      const pre = document.createElement('pre');
      pre.textContent = event.message || 'Failed to start';
      boot.appendChild(pre);
    });
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const TAU = Math.PI * 2;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const motion = reduced ? 0.2 : 1;
    const FOG = 0x0b6284;
    const timeU = { value: 0 };

    let seed = 48271;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    const rand = (a, b) => a + rnd() * (b - a);

    const PINE = { x: -11.2, z: -1.7 };
    const MOAI = { x: -3.35, z: -2.7 };
    const ROCK = { x: 4.15, z: -1.15 };
    const KRAB = { x: 11.7, z: -2.55 };
    const SB = { x: -11.15, z: 3.55 };
    const SQ = { x: -3.35, z: 2.55 };
    const PAT = { x: 4.35, z: 3.35 };
    const GARY = { x: -8.55, z: 4.35 };

    const CAUSTIC_FN = /* glsl */`
      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 345.45));
        p += dot(p, p + 34.345);
        return fract(p.x * p.y);
      }
      float cellDist(vec2 uv, float t) {
        vec2 i = floor(uv);
        vec2 f = fract(uv);
        float m = 1.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 g = vec2(float(x), float(y));
            vec2 o = vec2(hash21(i + g), hash21(i + g + 17.3));
            o = 0.5 + 0.5 * sin(t + 6.28318 * o);
            m = min(m, length(g + o - f));
          }
        }
        return m;
      }
      float caustics(vec2 xz, float t) {
        vec2 p = xz * 0.9;
        float s1 = sin(p.x * 1.25 + t * 0.55) * sin(p.y * 1.05 - t * 0.42);
        float s2 = sin((p.x + p.y) * 0.82 + t * 0.75) * sin((p.x - p.y) * 0.7 - t * 0.5);
        float s3 = sin(p.x * 1.8 - p.y * 1.45 + t);
        float d = cellDist(p * 0.55, t * 0.7);
        float weave = pow(max(s1, 0.0), 1.4) * pow(max(s2, 0.0), 1.4);
        weave += pow(max(s3, 0.0), 4.0) * 0.28;
        weave *= 0.55 + 0.45 * smoothstep(0.02, 0.22, d);
        return clamp(weave * 1.35, 0.0, 1.0);
      }
    `;

    function makeCanvas(w, h, draw, repeat) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      draw(canvas.getContext('2d'), w, h);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      tex.wrapS = tex.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
      if (repeat) tex.repeat.set(repeat[0], repeat[1]);
      return tex;
    }

    function hash(ix, iy) {
      let n = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
    }

    const sandTex = makeCanvas(256, 256, (g) => {
      const img = g.createImageData(256, 256);
      const d = img.data;
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const n = hash(x, y);
          const b = hash(x >> 3, y >> 3);
          const i = (y * 256 + x) * 4;
          d[i] = 214 + n * 28 + b * 12;
          d[i + 1] = 186 + n * 24 + b * 8;
          d[i + 2] = 132 + n * 18;
          d[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      g.fillStyle = 'rgba(120, 86, 48, 0.18)';
      for (let i = 0; i < 80; i++) {
        g.beginPath();
        g.ellipse(rnd() * 256, rnd() * 256, rand(1.2, 3.4), rand(0.8, 2.2), rnd() * 3, 0, TAU);
        g.fill();
      }
    }, [7, 7]);

    const pathTex = sandTex.clone();
    pathTex.repeat.set(2, 8);
    pathTex.needsUpdate = true;

    const poreTex = makeCanvas(256, 256, (g) => {
      g.fillStyle = '#ffe14a';
      g.fillRect(0, 0, 256, 256);
      for (let y = 18; y < 256; y += 34) {
        for (let x = 18; x < 256; x += 34) {
          const ox = ((y / 34) | 0) % 2 ? 12 : 0;
          g.fillStyle = '#e0b41c';
          g.beginPath();
          g.ellipse(x + ox, y, 8, 10, 0, 0, TAU);
          g.fill();
          g.fillStyle = 'rgba(255, 240, 160, 0.8)';
          g.beginPath();
          g.ellipse(x + ox - 2, y - 3, 3, 3.2, 0, 0, TAU);
          g.fill();
        }
      }
      g.fillStyle = '#c6d64a';
      const spots = [[40, 70, 16, 12], [150, 40, 18, 13], [200, 150, 14, 10], [70, 180, 15, 11], [120, 210, 12, 9]];
      for (const [x, y, rx, ry] of spots) {
        g.beginPath();
        g.ellipse(x, y, rx, ry, 0.4, 0, TAU);
        g.fill();
      }
    });

    const pineappleTex = makeCanvas(512, 512, (g) => {
      g.fillStyle = '#e8891a';
      g.fillRect(0, 0, 512, 512);
      const s = 42;
      for (let y = -s; y < 540; y += s) {
        for (let x = -s; x < 540; x += s) {
          const ox = ((y / s) | 0) % 2 ? s / 2 : 0;
          g.beginPath();
          g.moveTo(x + ox, y + s / 2);
          g.lineTo(x + ox + s / 2, y);
          g.lineTo(x + ox + s, y + s / 2);
          g.lineTo(x + ox + s / 2, y + s);
          g.closePath();
          g.fillStyle = ((x + y) / s | 0) % 2 ? '#f4a33a' : '#d97814';
          g.globalAlpha = 0.55;
          g.fill();
          g.globalAlpha = 1;
          g.strokeStyle = '#a85b0e';
          g.lineWidth = 3;
          g.stroke();
        }
      }
    }, [2.2, 3.2]);

    const stoneTex = makeCanvas(256, 256, (g) => {
      const img = g.createImageData(256, 256);
      const d = img.data;
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const n = hash(x, y);
          const b = hash(x >> 4, y >> 4);
          const i = (y * 256 + x) * 4;
          d[i] = 92 + n * 30 + b * 18;
          d[i + 1] = 112 + n * 28 + b * 14;
          d[i + 2] = 124 + n * 26 + b * 10;
          d[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
    }, [2, 2]);

    const woodTex = makeCanvas(256, 256, (g) => {
      g.fillStyle = '#8d5a32';
      g.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 14) {
        g.fillStyle = y % 28 === 0 ? 'rgba(70, 38, 18, 0.35)' : 'rgba(255, 210, 150, 0.08)';
        g.fillRect(0, y, 256, 7);
      }
      g.strokeStyle = 'rgba(60, 32, 14, 0.25)';
      g.lineWidth = 2;
      for (let x = 20; x < 256; x += 48) {
        g.beginPath();
        g.moveTo(x, 0);
        g.bezierCurveTo(x + 6, 80, x - 8, 160, x + 2, 256);
        g.stroke();
      }
    }, [1, 1]);

    const signTex = makeCanvas(1024, 320, (g, w, h) => {
      g.fillStyle = '#c62828';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = '#ffe14a';
      g.lineWidth = 26;
      g.strokeRect(18, 18, w - 36, h - 36);
      g.fillStyle = '#ffe14a';
      g.font = '800 118px "Avenir Next", "Trebuchet MS", sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('KRUSTY KRAB', w / 2, h / 2 + 6);
    });

    const softTex = makeCanvas(64, 64, (g) => {
      const grd = g.createRadialGradient(32, 32, 1, 32, 32, 31);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.45, 'rgba(255,255,255,0.45)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 64, 64);
    });

    const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0, ...extra });

    const spongeMat = std(0xffffff, { map: poreTex, roughness: 0.78 });
    const spongePlain = std(0xffe14a, { roughness: 0.72 });
    const shirtMat = std(0xf7fbff, { roughness: 0.55 });
    const pantsMat = std(0x8a4e22, { roughness: 0.78 });
    const tieMat = std(0xe23a3a, { roughness: 0.42 });
    const shoeMat = std(0x1a1a1a, { roughness: 0.4 });
    const beltMat = std(0x161616, { roughness: 0.45 });
    const buckleMat = std(0xffd15c, { roughness: 0.28, metalness: 0.6 });
    const darkMat = std(0x24180f, { roughness: 0.5 });
    const whiteMat = std(0xfffaf6, { roughness: 0.28 });
    const pinkMat = std(0xff8fb8, { roughness: 0.55 });
    const pinkSpot = std(0xf06a9a, { roughness: 0.6 });
    const shortsMat = std(0x2f9a48, { roughness: 0.62 });
    const flowerMat = std(0x9a45ea, { roughness: 0.5 });
    const flowerCenter = std(0xffe14a, { roughness: 0.45 });
    const squidMat = std(0x5ec4c4, { roughness: 0.42 });
    const squidShirt = std(0x8d5a32, { roughness: 0.7 });
    const eyeYellow = std(0xf2e07a, { roughness: 0.22 });
    const pupilRed = std(0xd01212, { roughness: 0.3 });
    const garyBody = std(0x4aa6ff, { roughness: 0.4 });
    const garyBelly = std(0xe7f6ff, { roughness: 0.35 });
    const shellMat = std(0xff8ec4, { roughness: 0.38 });
    const shellLite = std(0xffd0e6, { roughness: 0.34 });
    const leafA = std(0x2f9a3c, { roughness: 0.62 });
    const leafB = std(0x1c7430, { roughness: 0.68 });
    const doorMat = std(0x6b3a1a, { roughness: 0.72 });
    const trimMat = std(0xf3e2b8, { roughness: 0.4 });
    const stoneMat = std(0xffffff, { map: stoneTex, roughness: 0.86 });
    const woodMat = std(0xffffff, { map: woodTex, roughness: 0.74 });
    const woodDark = std(0x5c3a22, { roughness: 0.7 });
    const metalMat = std(0x3a4148, { roughness: 0.32, metalness: 0.72 });
    const chimneyMat = std(0x9aa3a8, { roughness: 0.38, metalness: 0.55 });
    const rockMat = std(0x8d7460, { roughness: 0.92 });
    const rockDark = std(0x5e5146, { roughness: 0.95 });
    const kelpMat = std(0xffffff, { roughness: 0.7, vertexColors: true });
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0xffe1a8,
      emissive: 0xffb15a,
      emissiveIntensity: 3.4,
      roughness: 0.18,
      metalness: 0,
    });
    const glowMat = new THREE.MeshStandardMaterial({
      color: 0xffc27a,
      emissive: 0xff8a3a,
      emissiveIntensity: 2.6,
      roughness: 0.45,
    });
    const signMat = std(0xffffff, { map: signTex, roughness: 0.55 });
    const signBack = std(0x9a1e1e, { roughness: 0.5 });
    const bulbMat = new THREE.MeshStandardMaterial({
      color: 0xfff1c4,
      emissive: 0xffd27a,
      emissiveIntensity: 4.2,
      roughness: 0.2,
    });
    const flagMat = std(0xd62828, { roughness: 0.55, side: THREE.DoubleSide });
    const sandMat = std(0xffffff, { map: sandTex, roughness: 0.96, vertexColors: true });
    const pathMat = std(0xfff6e4, { map: pathTex, roughness: 0.9 });
    const edgeMat = std(0xc4a57a, { roughness: 0.95 });
    const blobMat = new THREE.MeshBasicMaterial({
      color: 0x04202c,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
    });
    const smokeMat = new THREE.MeshStandardMaterial({
      color: 0xd5e6ee,
      transparent: true,
      opacity: 0.28,
      roughness: 1,
      depthWrite: false,
    });

    function addCaustics(mat) {
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = timeU;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec2 vWorldXZ;')
          .replace('#include <project_vertex>', '#include <project_vertex>\nvWorldXZ = (modelMatrix * vec4(transformed, 1.0)).xz;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;\nvarying vec2 vWorldXZ;\n${CAUSTIC_FN}`)
          .replace('#include <opaque_fragment>', 'outgoingLight += vec3(0.14, 0.34, 0.38) * caustics(vWorldXZ, uTime);\n#include <opaque_fragment>');
      };
      return mat;
    }
    addCaustics(sandMat);
    addCaustics(pathMat);
    addCaustics(edgeMat);

    pathMat.polygonOffset = true;
    pathMat.polygonOffsetFactor = -2;
    pathMat.polygonOffsetUnits = -4;

    const pathPts = [
      [-16.5, 5.1], [-11.2, 3.85], [-7.2, 2.7], [-3.35, 2.85],
      [0.5, 3.55], [4.35, 3.7], [8.1, 2.85], [11.7, 3.25], [16.4, 4.9],
    ].map(([x, z]) => new THREE.Vector3(x, 0, z));
    const street = new THREE.CatmullRomCurve3(pathPts, false, 'catmullrom', 0.38);
    const pathSamples = street.getSpacedPoints(56);

    function smooth(a, b, x) {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    function distToPath(x, z) {
      let best = 1e9;
      for (let i = 0; i < pathSamples.length; i++) {
        const p = pathSamples[i];
        const d = (x - p.x) ** 2 + (z - p.z) ** 2;
        if (d < best) best = d;
      }
      return Math.sqrt(best);
    }
    function heightAt(x, z) {
      let h = Math.sin(x * 0.17) * Math.cos(z * 0.15) * 0.55
        + Math.sin(x * 0.055 + z * 0.047) * 0.85
        + Math.cos(x * 0.28 - z * 0.2) * 0.22;
      const town = Math.hypot(x / 16.5, (z + 0.3) / 8.2);
      const townMask = smooth(1.45, 0.72, town);
      const pathMask = smooth(3.1, 1.15, distToPath(x, z));
      return h * (1 - Math.max(townMask, pathMask));
    }

    function ribbonGeometry(curve, halfWidth, y, segments) {
      const frames = curve.computeFrenetFrames(segments, false);
      const positions = [];
      const uvs = [];
      const indices = [];
      for (let i = 0; i <= segments; i++) {
        const p = curve.getPointAt(i / segments);
        const side = new THREE.Vector3(frames.binormals[i].x, 0, frames.binormals[i].z);
        if (side.lengthSq() < 1e-5) side.set(1, 0, 0);
        side.normalize().multiplyScalar(halfWidth);
        positions.push(p.x + side.x, y, p.z + side.z, p.x - side.x, y, p.z - side.z);
        const v = i / segments;
        uvs.push(0, v, 1, v);
        if (i < segments) {
          const a = i * 2;
          indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      let ny = 0;
      const nrm = geo.attributes.normal;
      for (let i = 0; i < nrm.count; i++) ny += nrm.getY(i);
      if (ny < 0) {
        const idx = geo.index.array;
        for (let i = 0; i < idx.length; i += 3) {
          const tmp = idx[i];
          idx[i] = idx[i + 1];
          idx[i + 1] = tmp;
        }
        geo.computeVertexNormals();
      }
      return geo;
    }

    function starShape(outer, inner, points = 5) {
      const shape = new THREE.Shape();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = (i / (points * 2)) * TAU + Math.PI / 2;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      shape.closePath();
      return shape;
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(FOG, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.14;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FOG);
    scene.fog = new THREE.FogExp2(FOG, 0.028);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.12, 180);
    camera.position.set(-0.8, 4.85, 21.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.4, 1.62, 0.45);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.autoRotate = !reduced;
    controls.autoRotateSpeed = 0.38;
    controls.minDistance = 7;
    controls.maxDistance = 40;
    controls.minPolarAngle = 0.45;
    controls.maxPolarAngle = 1.38;
    controls.update();

    let idle = 0;
    controls.addEventListener('start', () => {
      controls.autoRotate = false;
      idle = 0;
    });
    controls.addEventListener('end', () => { idle = 0; });

    const sun = new THREE.DirectionalLight(0xfff0d0, 2.35);
    sun.position.set(12, 24, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.035;
    sun.shadow.camera.left = -26;
    sun.shadow.camera.right = 26;
    sun.shadow.camera.top = 22;
    sun.shadow.camera.bottom = -22;
    sun.shadow.camera.near = 4;
    sun.shadow.camera.far = 70;
    scene.add(sun);
    scene.add(sun.target);
    scene.add(new THREE.HemisphereLight(0x8fd4ea, 0xc4a06a, 0.7));
    scene.add(new THREE.AmbientLight(0x14607a, 0.22));
    const fill = new THREE.DirectionalLight(0x9fd8ef, 0.42);
    fill.position.set(-10, 6, 12);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0x7ec8ea, 0.48);
    rim.position.set(-4, 8, -14);
    scene.add(rim);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(78, 32, 24),

    const jellies = [];
    function buildJelly(x, y, z, scale, phase, color) {
      const g = new THREE.Group();
      const bellMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: { uColor: { value: new THREE.Color(color) } },
        vertexShader: /* glsl */`
          varying vec3 vN;
          varying vec3 vV;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vN = normalize(normalMatrix * normal);
            vV = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */`
          varying vec3 vN;
          varying vec3 vV;
          uniform vec3 uColor;
          void main() {
            float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.1);
            vec3 col = mix(uColor, vec3(1.0, 0.86, 0.95), fres) * (0.85 + fres * 1.5);
            float a = 0.16 + fres * 0.5;
            gl_FragColor = vec4(col, a);
          }
        `,
      });
      const bellGeo = new THREE.SphereGeometry(1, 28, 18, 0, TAU, 0, Math.PI * 0.58);
      const bell = new THREE.Mesh(bellGeo, bellMat);
      bell.scale.set(scale, scale * 0.78, scale);
      g.add(bell);
      const inner = new THREE.Mesh(bellGeo, new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.22,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
      }));
      inner.scale.set(scale * 0.72, scale * 0.45, scale * 0.72);
      g.add(inner);
      const spotMat = std(0xff5f9e, { transparent: true, opacity: 0.85, depthWrite: false });
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + 0.4;
        const spot = new THREE.Mesh(new THREE.SphereGeometry(0.16 * scale, 8, 6), spotMat);
        spot.position.set(Math.cos(a) * 0.42 * scale, 0.42 * scale, Math.sin(a) * 0.42 * scale);
        spot.scale.y = 0.45;
        g.add(spot);
      }
      const tentacleMat = new THREE.MeshStandardMaterial({
        color: 0xff9ec4,
        transparent: true,
        opacity: 0.55,
        roughness: 0.35,
        depthWrite: false,
      });
      const strands = [];
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        const root = new THREE.Group();
        root.position.set(Math.cos(a) * 0.42 * scale, -0.08 * scale, Math.sin(a) * 0.42 * scale);
        let parent = root;
        const joints = [];
        for (let k = 0; k < 5; k++) {
          const len = 0.26 * scale;
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.018 * scale, 0.01 * scale, len, 5), tentacleMat);
          seg.geometry.translate(0, -len / 2, 0);
          const pivot = new THREE.Group();
          pivot.add(seg);
          parent.add(pivot);
          if (k > 0) pivot.position.y = -0.26 * scale;
          joints.push(pivot);
          parent = pivot;
        }
        g.add(root);
        strands.push(joints);
      }
      g.position.set(x, y, z);
      scene.add(g);
      jellies.push({ group: g, bell, strands, phase, base: new THREE.Vector3(x, y, z), scale });
    }

    const kelps = [];
    function createKelp(x, z, height, phase) {
      const root = new THREE.Group();
      root.position.set(x, heightAt(x, z), z);
      const segs = [];
      let parent = root;
      const n = 5;
      for (let i = 0; i < n; i++) {
        const len = (height / n) * (1 - i * 0.05);
        const geo = new THREE.CylinderGeometry(Math.max(0.012, 0.03 * (1 - i / n)), Math.max(0.02, 0.065 * (1 - i / n * 0.45)), len, 5);
        geo.translate(0, len / 2, 0);
        const colors = [];
        const pos = geo.attributes.position;
        for (let v = 0; v < pos.count; v++) {
          const tip = (i + pos.getY(v) / len) / n;
          colors.push(0.05 + tip * 0.15, 0.32 + tip * 0.5, 0.12 + tip * 0.08);
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        const mesh = new THREE.Mesh(geo, kelpMat);
        mesh.receiveShadow = true;
        const pivot = new THREE.Group();
        pivot.add(mesh);
        if (i > 0) pivot.position.y = segs[i - 1].userData.len;
        pivot.userData.len = len;
        parent.add(pivot);
        segs.push(pivot);
        parent = pivot;
      }
      scene.add(root);
      kelps.push({ segs, phase });
    }

    function createCoral(x, z, color, kind) {
      const g = new THREE.Group();
      g.position.set(x, heightAt(x, z), z);
      const mat = std(color, { roughness: 0.58 });
      if (kind === 'brain') {
        const geo = new THREE.SphereGeometry(0.48, 16, 12);
        const p = geo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const px = p.getX(i);
          const py = p.getY(i);
          const pz = p.getZ(i);
          const w = 1 + 0.14 * Math.sin(px * 10) * Math.cos(pz * 9) * Math.sin(py * 8);
          p.setXYZ(i, px * w, py * w * 0.62, pz * w);
        }
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        m.position.y = 0.28;
        m.castShadow = true;
        m.receiveShadow = true;
        g.add(m);
      } else if (kind === 'tube') {
        for (let i = 0; i < 6; i++) {
          const h = rand(0.35, 0.9);
          const c = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.09, h, 6), mat);
          c.position.set(rand(-0.22, 0.22), h / 2, rand(-0.22, 0.22));
          c.castShadow = true;
          g.add(c);
        }
      } else {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.13, 0.7, 6), mat);
        trunk.position.y = 0.35;
        trunk.castShadow = true;
        g.add(trunk);
        for (let i = 0; i < 5; i++) {
          const b = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 0.48, 5), mat);
          b.position.set(rand(-0.18, 0.18), 0.78, rand(-0.18, 0.18));
          b.rotation.z = rand(-0.8, 0.8);
          b.rotation.x = rand(-0.6, 0.6);
          b.castShadow = true;
          const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), mat);
          tip.position.y = 0.26;
          b.add(tip);
          g.add(b);
        }
      }
      g.rotation.y = rnd() * TAU;
      scene.add(g);
    }

    function createRock(x, z, s) {
      const geo = new THREE.DodecahedronGeometry(1, 0);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const n = 0.72 + rnd() * 0.5;
        p.setXYZ(i, p.getX(i) * n, p.getY(i) * n * 0.78, p.getZ(i) * n);
      }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, rnd() > 0.5 ? rockMat : rockDark);
      m.position.set(x, heightAt(x, z) + s * 0.28, z);
      m.scale.setScalar(s);
      m.rotation.set(rnd(), rnd() * TAU, rnd());
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
    }

    const flowers = [];
    function createFlower(x, z, color) {
      const g = new THREE.Group();
      g.position.set(x, heightAt(x, z), z);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 0.7, 5), leafB);
      stem.position.y = 0.35;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), std(color, { roughness: 0.45 }));
      head.position.y = 0.78;
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 4), leafA);
      leaf.scale.set(1.7, 0.35, 0.7);
      leaf.position.set(0.1, 0.28, 0);
      g.add(stem, head, leaf);
      g.userData.phase = rnd() * TAU;
      scene.add(g);
      flowers.push(g);
    }

    const anemones = [];
    function createAnemone(x, z) {
      const g = new THREE.Group();
      g.position.set(x, heightAt(x, z), z);
      const base = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), std(0xff7a9a, { roughness: 0.5 }));
      base.scale.y = 0.45;
      base.position.y = 0.08;
      g.add(base);
      const fronds = [];
      const mat = std(0xffb0c8, { roughness: 0.4 });
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * TAU;
        const f = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.42, 5), mat);
        f.position.set(Math.cos(a) * 0.1, 0.28, Math.sin(a) * 0.1);
        f.userData.a = a;
        g.add(f);
        fronds.push(f);
      }
      scene.add(g);
      anemones.push({ fronds, phase: rnd() * TAU });
    }

    const blocks = [
      [PINE.x, PINE.z, 3.2], [MOAI.x, MOAI.z, 3.5], [ROCK.x, ROCK.z, 2.6], [KRAB.x, KRAB.z, 4.4],
      [SB.x, SB.z, 1.2], [SQ.x, SQ.z, 1.1], [PAT.x, PAT.z, 1.2], [GARY.x, GARY.z, 0.8],
    ];
    function occupied(x, z, extra = 0) {
      for (const [bx, bz, r] of blocks) if (Math.hypot(x - bx, z - bz) < r + extra) return true;
      if (distToPath(x, z) < 1.7 + extra) return true;
      return false;
    }

    const kelpSpots = [
      [-14.8, -1.4, 2.5], [-13.6, -3.1, 1.9], [-15.4, 0.6, 2.2],
      [-6.6, -5.2, 2.9], [-4.8, -6.1, 2.3], [-0.8, -6.4, 3.2],
      [8.4, -5.4, 2.5], [15.2, -0.8, 2.1], [16.6, -4.6, 2.8],
      [-16.2, 3.2, 1.7], [17.4, 2.2, 1.9], [0.2, -8.2, 3.3],
      [-8.8, 7.4, 1.35], [9.6, 7.8, 1.45], [2.2, 8.6, 1.2],
      [-18.4, -2.2, 2.4], [6.5, -7.2, 2.6], [13.2, 6.4, 1.6],
    ];
    kelpSpots.forEach(([x, z, h], i) => createKelp(x, z, h, i * 0.7));

    const coralSpots = [
      [-16.2, -3.4, 0xff6d8a, 'branch'], [-14.2, 2.4, 0xff8a4a, 'tube'],
      [-7.4, -6.6, 0xff5e7a, 'brain'], [-1.5, -7.6, 0xe85ad8, 'branch'],
      [6.8, -6.8, 0xffc14d, 'tube'], [15.8, -5.2, 0xff6d8a, 'brain'],
      [17.6, 0.4, 0xff8a4a, 'branch'], [-17.5, 1.2, 0xc46bff, 'tube'],
      [2.8, -8.4, 0xff7a9c, 'branch'], [10.4, -7.5, 0xffb03a, 'brain'],
      [-9.5, 6.8, 0xff6d8a, 'tube'], [14.2, 6.2, 0xff8ec4, 'branch'],
    ];
    coralSpots.forEach(([x, z, color, kind]) => createCoral(x, z, color, kind));

    [[-15.2, 8.6, 0.62], [16.2, 8.4, 0.7], [-17.2, 5.5, 0.9], [18.2, 4.4, 1.05],
      [-5.5, -7.5, 0.8], [19.5, -2, 1.3], [-19, -5, 1.15],
      [8.8, -8.2, 0.95], [-13.4, 6.8, 0.42]].forEach(([x, z, s]) => createRock(x, z, s));

    [[-13.4, 1.2, 0xff7ab0], [-8.6, -1.4, 0xffd15c], [-5.2, -1.8, 0xc47bff],
      [1.2, -1.6, 0xff8a9a], [7.2, -0.4, 0xffe14a], [8.8, 1.6, 0x7ad0ff],
      [14.6, 1.1, 0xff7ab0], [-15.6, -3.6, 0xffd36a]].forEach(([x, z, c]) => createFlower(x, z, c));

    [[-12.6, 0.2], [6.6, 0.8], [13.4, -5.2], [-6.2, 6.2], [16.4, 3.4]].forEach(([x, z]) => createAnemone(x, z));

    const starfish = new THREE.Mesh(
      new THREE.ExtrudeGeometry(starShape(0.32, 0.14), { depth: 0.05, bevelEnabled: false }),
      std(0xff7a3a, { roughness: 0.55 })
    );
    starfish.rotation.x = -Math.PI / 2;
    starfish.position.set(-7.4, 0.08, 1.15);
    scene.add(starfish);
    const starfish2 = starfish.clone();
    starfish2.position.set(8.6, 0.08, 1.35);
    starfish2.rotation.z = 0.6;
    scene.add(starfish2);

    const clam = new THREE.Group();
    const shellGeo = new THREE.SphereGeometry(0.32, 14, 10, 0, Math.PI);
    const top = new THREE.Mesh(shellGeo, std(0xe7d7b8, { roughness: 0.4 }));
    top.rotation.z = Math.PI;
    top.rotation.x = -0.7;
    top.position.y = 0.22;
    const bot = new THREE.Mesh(shellGeo, std(0xd9c6a4, { roughness: 0.45 }));
    bot.rotation.x = 0.15;
    bot.position.y = 0.1;
    const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), bulbMat);
    pearl.position.y = 0.16;
    clam.add(top, bot, pearl);
    clam.position.set(-8.4, heightAt(-8.4, 1.35), 1.35);
    scene.add(clam);

    buildPineapple();
    buildMoai();
    buildRock();
    buildKrab();
    buildSpongeBob();
    buildPatrick();
    buildSquidward();
    buildGary();
    buildJelly(-4.2, 8.4, 1.2, 0.85, 0.4, '#ff8cbc');
    buildJelly(5.6, 10.2, -1.4, 1.05, 1.7, '#ff6ea8');
    buildJelly(13.2, 7.6, 2.4, 0.7, 2.8, '#ffb0d0');

    const fish = [];
    function createFish(color, radius, speed, phase, y, center) {
      const g = new THREE.Group();
      const mat = std(color, { roughness: 0.4 });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 8), mat);
      body.scale.set(1.7, 0.62, 0.42);
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 8), mat);
      tail.rotation.z = Math.PI / 2;
      tail.position.x = -0.48;
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), whiteMat);
      eye.position.set(0.28, 0.06, 0.1);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6), shoeMat);
      pupil.position.set(0.32, 0.06, 0.12);
      g.add(body, tail, eye, pupil);
      scene.add(g);
      fish.push({ group: g, tail, radius, speed, phase, y, center });
    }
    createFish(0xffb03a, 4.2, 0.28, 0.2, 4.2, new THREE.Vector3(-1, 0, -6));
    createFish(0xff7a5a, 3.4, 0.34, 1.4, 3.6, new THREE.Vector3(-1, 0, -6));
    createFish(0x6ec8ff, 5.1, 0.22, 2.2, 4.8, new THREE.Vector3(2, 0, -7));
    createFish(0xffe14a, 2.8, 0.4, 3.1, 3.3, new THREE.Vector3(3, 0, -5.5));
    createFish(0xff8ec4, 4.6, 0.26, 4.2, 5.1, new THREE.Vector3(0, 0, -8));
    createFish(0x7dffc4, 3.2, 0.33, 5.1, 4.0, new THREE.Vector3(-4, 0, -6.5));

    const BUBBLES = 84;
    const bubbleGeo = new THREE.SphereGeometry(1, 10, 8);
    const bubbleMat = new THREE.MeshStandardMaterial({
      color: 0xe9fbff,
      transparent: true,
      opacity: 0.38,
      roughness: 0.08,
      metalness: 0.05,
      depthWrite: false,
    });
    const bubbleMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLES);
    bubbleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    bubbleMesh.renderOrder = 3;
    scene.add(bubbleMesh);
    const bubbles = [];
    const emitters = [[-8.4, 1.35], [5.4, -0.4], [11.2, 2.2]];
    for (let i = 0; i < BUBBLES; i++) {
      const emit = i < 24 ? emitters[i % emitters.length] : null;
      bubbles.push({
        x: emit ? emit[0] + rand(-0.3, 0.3) : rand(-20, 20),
        y: rand(0.2, 13),
        z: emit ? emit[1] + rand(-0.3, 0.3) : rand(-12, 10),
        s: rand(0.035, 0.12),
        v: rand(0.35, 0.95),
        w: rnd() * TAU,
        emit,
      });
    }
    const dummy = new THREE.Object3D();

    const PLANK = 260;
    const plankGeo = new THREE.BufferGeometry();
    const plankPos = new Float32Array(PLANK * 3);
    for (let i = 0; i < PLANK; i++) {
      plankPos[i * 3] = rand(-24, 24);
      plankPos[i * 3 + 1] = rand(0.4, 12);
      plankPos[i * 3 + 2] = rand(-16, 14);
    }
    plankGeo.setAttribute('position', new THREE.BufferAttribute(plankPos, 3));
    const plank = new THREE.Points(plankGeo, new THREE.PointsMaterial({
      color: 0xd8fff4,
      size: 0.055,
      map: softTex,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      opacity: 0.75,
    }));
    scene.add(plank);

    const composer = new EffectComposer(renderer);
    composer.renderTarget1.samples = 4;
    composer.renderTarget2.samples = 4;
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.46, 0.9);
    composer.addPass(bloomPass);
    const grade = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec2 vUv;
        void main() {
          vec2 q = vUv - 0.5;
          vec2 uv = vUv + vec2(sin(vUv.y * 26.0 + uTime * 0.65), cos(vUv.x * 22.0 + uTime * 0.5)) * 0.0011;
          vec2 off = q * 0.0032;
          float r = texture2D(tDiffuse, uv + off).r;
          float gch = texture2D(tDiffuse, uv).g;
          float b = texture2D(tDiffuse, uv - off).b;
          vec3 col = vec3(r, gch, b);
          float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
          col = mix(vec3(l), col, 1.14);
          col = mix(vec3(0.02, 0.07, 0.11), col, 0.94);
          col.b += 0.012;
          col.g += 0.006;
          float vig = smoothstep(0.86, 0.28, length(q));
          col *= mix(0.62, 1.0, vig);
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    composer.addPass(grade);
    composer.addPass(new OutputPass());

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    const boot = document.getElementById('boot');
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const t = now * 0.001;
      const dt = Math.min(0.05, (now - last) * 0.001);
      last = now;
      timeU.value = t;
      grade.uniforms.uTime.value = t;
      idle += dt;
      if (!reduced && idle > 5) controls.autoRotate = true;
      controls.update();

      sponges.update(t);
      patrick.update(t);
      squid.update(t);

      const ga = t * 0.32 * (reduced ? 0.2 : 1);
      gary.group.position.x = GARY.x + Math.cos(ga) * 0.8;
      gary.group.position.z = GARY.z + Math.sin(ga) * 0.5;
      gary.group.position.y = 0.06 + Math.abs(Math.sin(t * 3.1)) * 0.03 * motion;
      gary.group.rotation.y = -ga + Math.PI / 2;
      gary.stalks.forEach((s, i) => {
        s.rotation.z = Math.sin(t * 2.1 + i) * 0.18 * motion;
        s.rotation.x = Math.cos(t * 1.7 + i) * 0.12 * motion;
      });

      kelps.forEach((k) => {
        k.segs.forEach((s, i) => {
          const amp = (0.018 + i * 0.02) * motion;
          s.rotation.z = Math.sin(t * 0.9 + k.phase + i * 0.4) * amp;
          s.rotation.x = Math.cos(t * 0.72 + k.phase + i) * amp * 0.65;
        });
      });
      flowers.forEach((f) => {
        f.rotation.z = Math.sin(t * 0.8 + f.userData.phase) * 0.08 * motion;
      });
      anemones.forEach((a) => {
        a.fronds.forEach((f, i) => {
          const wob = Math.sin(t * 1.3 + a.phase + i) * 0.18 * motion;
          f.rotation.z = Math.cos(f.userData.a) * 0.35 + wob;
          f.rotation.x = -Math.sin(f.userData.a) * 0.35;
        });
      });
      leafPivots.forEach((p, i) => {
        p.rotation.x = p.userData.bx + Math.sin(t * 0.8 + i) * 0.035 * motion;
        p.rotation.z = p.userData.bz + Math.cos(t * 0.7 + i * 0.6) * 0.035 * motion;
      });
      smokes.forEach((s) => {
        s.userData.t = (s.userData.t + dt * 0.16) % 1;
        const u = s.userData.t;
        s.position.y = 5.65 + u * 1.55;
        s.position.x = 1.22 + Math.sin(u * 9 + t) * 0.12;
        s.scale.setScalar(0.45 + u * 1.5);
        s.material.opacity = (1 - u) * 0.32;
      });
      if (flagPivot.mesh) {
        flagPivot.mesh.rotation.y = Math.sin(t * 1.6) * 0.45 * motion;
        flagPivot.mesh.scale.x = 0.85 + Math.sin(t * 3.2) * 0.12 * motion;
      }

      jellies.forEach((j) => {
        j.group.position.x = j.base.x + Math.sin(t * 0.18 + j.phase) * 1.15 * motion;
        j.group.position.y = j.base.y + Math.sin(t * 0.85 + j.phase) * 0.42 * motion;
        j.group.position.z = j.base.z + Math.cos(t * 0.14 + j.phase) * 0.7 * motion;
        j.group.rotation.z = Math.sin(t * 0.6 + j.phase) * 0.08 * motion;
        j.bell.scale.y = j.scale * (0.78 + Math.sin(t * 1.5 + j.phase) * 0.06 * motion);
        j.strands.forEach((joints, s) => {
          joints.forEach((pivot, k) => {
            pivot.rotation.x = Math.sin(t * 1.45 + j.phase + s + k * 0.55) * (0.16 + k * 0.04) * motion;
            pivot.rotation.z = Math.cos(t * 1.15 + j.phase + k) * 0.1 * motion;
          });
        });
      });

      fish.forEach((f) => {
        const a = t * f.speed * (reduced ? 0.25 : 1) + f.phase;
        f.group.position.set(
          f.center.x + Math.cos(a) * f.radius,
          f.y + Math.sin(t * 0.8 + f.phase) * 0.25,
          f.center.z + Math.sin(a) * f.radius * 0.62
        );
        f.group.rotation.y = -a + Math.PI / 2;
        f.tail.rotation.y = Math.sin(t * 7 + f.phase) * 0.45 * motion;
      });

      for (let i = 0; i < BUBBLES; i++) {
        const b = bubbles[i];
        b.y += b.v * dt * (reduced ? 0.35 : 1);
        b.x += Math.sin(t * 0.8 + b.w) * 0.15 * dt;
        if (b.y > 14.2) {
          b.y = 0.15;
          if (b.emit) {
            b.x = b.emit[0] + rand(-0.35, 0.35);
            b.z = b.emit[1] + rand(-0.35, 0.35);
          } else {
            b.x = rand(-20, 20);
            b.z = rand(-12, 10);
          }
        }
        dummy.position.set(b.x, b.y, b.z);
        dummy.scale.setScalar(b.s * (1 + Math.sin(t * 2 + b.w) * 0.08));
        dummy.updateMatrix();
        bubbleMesh.setMatrixAt(i, dummy.matrix);
      }
      bubbleMesh.instanceMatrix.needsUpdate = true;

      const attr = plankGeo.attributes.position;
      for (let i = 0; i < PLANK; i++) {
        let x = attr.getX(i) + dt * 0.18;
        let y = attr.getY(i) + Math.sin(t + i) * 0.05 * dt;
        let z = attr.getZ(i) + dt * 0.05;
        if (x > 24) x = -24;
        if (z > 14) z = -16;
        attr.setXYZ(i, x, y, z);
      }
      attr.needsUpdate = true;

      composer.render();
      if (boot && !boot.dataset.ready) {
        boot.dataset.ready = '1';
        boot.classList.add('gone');
      }
    });
  </script>
</body>
</html>
