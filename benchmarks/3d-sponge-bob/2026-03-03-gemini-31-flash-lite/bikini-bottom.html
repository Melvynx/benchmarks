<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bikini Bottom</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #001e26; }
        #canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x001e26);
        scene.fog = new THREE.Fog(0x003344, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x004466, 2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5cc, 3);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // Floor (Sandy bottom with noise)
        const planeGeo = new THREE.PlaneGeometry(100, 100, 64, 64);
        const position = planeGeo.attributes.position;
        for (let i = 0; i < position.count; i++) {
            const x = position.getX(i);
            const y = position.getY(i);
            position.setZ(i, Math.sin(x * 0.2) * 0.5 + Math.cos(y * 0.2) * 0.5);
        }
        planeGeo.computeVertexNormals();
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd9b36d, flatShading: false });
        const floor = new THREE.Mesh(planeGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // SpongeBob House (Pineapple)
        function createPineapple() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2.5, 5, 16),
                new THREE.MeshStandardMaterial({ color: 0xffa500 })
            );
            group.add(body);

            // Leaves
            for(let i=0; i<8; i++){
                const leaf = new THREE.Mesh(
                    new THREE.ConeGeometry(0.5, 2, 4),
                    new THREE.MeshStandardMaterial({ color: 0x228b22 })
                );
                leaf.position.y = 3;
                leaf.rotation.z = (i/8) * Math.PI * 2;
                group.add(leaf);
            }
            return group;
        }

        const pineapple = createPineapple();
        pineapple.position.set(-8, 2.5, 0);
        scene.add(pineapple);

        // Character: SpongeBob
        const spongebob = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1.2, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xffff00 })
        );
        spongebob.add(body);
        const pants = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.4, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x654321 })
        );
        pants.position.y = -0.8;
        spongebob.add(pants);
        spongebob.position.set(0, 1.5, 0);
        scene.add(spongebob);

        // Bubbles Particles
        const particles = new THREE.Group();
        for(let i=0; i<50; i++){
            const bubble = new THREE.Mesh(
                new THREE.SphereGeometry(0.1 + Math.random() * 0.2),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
            );
            bubble.position.set(Math.random()*40-20, Math.random()*20, Math.random()*40-20);
            particles.add(bubble);
        }
        scene.add(particles);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // SpongeBob idle animation
            spongebob.position.y = 1.5 + Math.sin(Date.now() * 0.005) * 0.2;
            spongebob.rotation.y = Math.sin(Date.now() * 0.002) * 0.1;

            // Bubbles float
            particles.children.forEach(b => {
                b.position.y += 0.02;
                if(b.position.y > 20) b.position.y = 0;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
