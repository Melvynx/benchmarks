<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Fable 5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23EDE6D6' stroke-width='1'/%3E%3Ccircle cx='20' cy='12' r='9' fill='%230A0B13'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0B13; --bg-deep:#06070D; --bg-chrome:#08090F; --disc:#04050B;
  --ink:#EDE6D6; --ink-dim:rgba(237,230,214,.55); --ink-faint:rgba(237,230,214,.28);
  --hair:rgba(237,230,214,.13);
  --gold:#E8B34B; --cyan:#5EE8DC; --violet:#9B7BF2;
  --serif:"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); overflow:hidden; overscroll-behavior:none;
  display:flex; flex-direction:column; height:100dvh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(232,179,75,.35); color:var(--ink)}
:focus{outline:none}
:focus-visible{outline:1px solid var(--gold); outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--mono)}

/* ---------- chrome ---------- */
#chrome{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:12px 22px 11px; border-bottom:1px solid var(--hair);
  background:var(--bg-chrome); position:relative; z-index:20;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand svg{display:block; flex:none}
#chrome h1{
  margin:0; font-family:var(--mono); font-weight:500; font-size:12px;
  letter-spacing:.42em; text-transform:uppercase; color:var(--ink);
  white-space:nowrap;
}
.tabs{display:flex; gap:26px; margin-left:auto; margin-right:auto}
.tab{
  appearance:none; background:none; border:0; cursor:pointer; padding:6px 1px 7px;
  font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-dim); border-bottom:1px solid transparent;
  display:inline-flex; align-items:baseline; gap:9px;
  transition:color .25s ease, border-color .25s ease;
}
.tab .idx{font-size:10px; color:var(--ink-faint); letter-spacing:0}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--gold)}
.tab[aria-pressed="true"] .idx{color:var(--gold)}
.seedCtl{
  display:flex; align-items:center; gap:8px;
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--ink-dim);
}
.seedCtl .lbl{color:var(--ink-faint); text-transform:uppercase}
.seedCtl button{
  appearance:none; background:none; border:1px solid var(--hair); color:var(--ink-dim);
  width:24px; height:24px; border-radius:50%; cursor:pointer; font:inherit;
  display:inline-flex; align-items:center; justify-content:center; padding:0 0 2px;
  transition:color .2s ease, border-color .2s ease;
}
.seedCtl button:hover{color:var(--ink); border-color:var(--ink-dim)}
#seedVal{min-width:44px; text-align:center; color:var(--ink); font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#stage{position:relative; flex:1; overflow:hidden; background:var(--bg)}
.view{position:absolute; inset:0; display:none}
.view.active{display:block}

/* poster */
#view-poster{
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(237,230,214,.045), rgba(237,230,214,0) 55%),
    var(--bg-deep);
}
.posterWrap{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:26px}
#posterFrame{
  position:relative; box-shadow:0 30px 80px rgba(0,0,0,.65), 0 4px 18px rgba(0,0,0,.5);
  outline:1px solid rgba(237,230,214,.14);
  background:var(--bg);
}
#posterFrame svg{display:block; width:100%; height:100%}
#posterCaption{font-size:10px; letter-spacing:.3em; color:var(--ink-faint); text-transform:uppercase}

/* motion */
#view-motion{background:var(--bg)}
#motionCanvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.transport{
  position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
  width:min(660px, 92%); display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:rgba(8,9,15,.62); border:1px solid var(--hair);
  border-radius:3px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.tbtn{
  appearance:none; background:none; border:1px solid var(--hair); color:var(--ink);
  width:30px; height:30px; border-radius:50%; cursor:pointer; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  transition:border-color .2s ease, color .2s ease;
}
.tbtn:hover{border-color:var(--gold)}
.tbtn svg{display:block}
#btnPlay .icoPause{display:none}
#btnPlay.playing .icoPlay{display:none}
#btnPlay.playing .icoPause{display:block}
#scrub{flex:1; appearance:none; -webkit-appearance:none; background:transparent; height:24px; cursor:pointer; --p:0%}
#scrub::-webkit-slider-runnable-track{
  height:2px; border-radius:1px;
  background:linear-gradient(90deg, var(--gold) 0%, var(--gold) var(--p), rgba(237,230,214,.16) var(--p));
}
#scrub::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; margin-top:-5.5px;
  border-radius:50%; border:1px solid var(--ink); background:var(--bg);
  box-shadow:0 0 0 3px rgba(10,11,19,.8);
}
#scrub::-moz-range-track{height:2px; background:rgba(237,230,214,.16); border-radius:1px}
#scrub::-moz-range-progress{height:2px; background:var(--gold); border-radius:1px}
#scrub::-moz-range-thumb{width:12px; height:12px; border-radius:50%; border:1px solid var(--ink); background:var(--bg)}
#timeRead{font-size:11px; letter-spacing:.12em; color:var(--ink-dim); flex:none; font-variant-numeric:tabular-nums}

/* instrument */
#view-instrument{background:var(--bg)}
#instCanvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair}
.instCaption{
  position:absolute; font-family:var(--mono); font-size:10px; letter-spacing:.22em;
  color:var(--ink-dim); pointer-events:none; text-transform:none; z-index:3;
}
.instCaption.tl{top:18px; left:22px}
.instCaption.bl{bottom:16px; left:22px}
.instCaption.br{bottom:16px; right:22px; text-align:right}
#instHint{
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-faint); pointer-events:none; z-index:3;
  transition:opacity 1.2s ease; white-space:nowrap;
}
#instHint.gone{opacity:0}

/* veil (mode transition: an occulting disc sweeps the screen) */
#veil{
  position:fixed; z-index:60; left:50%; top:50%;
  width:280vmax; height:280vmax; margin:-140vmax 0 0 -140vmax;
  border-radius:50%; background:#04050C; pointer-events:none;
  box-shadow:0 0 0 1.5px rgba(94,232,220,.35), 0 0 90px 24px rgba(155,123,242,.14);
  transform:scale(0);
  transition:transform .48s cubic-bezier(.16,.65,.2,1);
}
#veil.cover{transform:scale(1); transition:transform .34s cubic-bezier(.6,.05,.85,.4)}

@media (max-width:720px){
  #chrome{gap:12px; padding:10px 14px 9px}
  #chrome h1{font-size:10px; letter-spacing:.32em}
  .tabs{order:3; width:100%; justify-content:center; gap:18px; margin:2px 0 0}
  .tab{font-size:10px; letter-spacing:.18em}
  .seedCtl{margin-left:auto}
  .posterWrap{padding:14px; gap:10px}
  .transport{bottom:12px; gap:10px; padding:8px 12px}
  #timeRead{display:none}
  .instCaption{font-size:8.5px; letter-spacing:.16em}
  .instCaption.tl{top:12px; left:12px}
  .instCaption.bl{bottom:10px; left:12px}
  .instCaption.br{bottom:10px; right:12px}
  #instHint{top:auto; bottom:44px; font-size:9px; width:92%; text-align:center; white-space:normal}
}
@media (prefers-reduced-motion:reduce){
  #veil, #veil.cover{transition:none}
  .tab, .seedCtl button, .tbtn{transition:none}
}
</style>
</head>
<body>

<header id="chrome">
  <div class="brand">
    <svg width="21" height="21" viewBox="0 0 21 21" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="8.6" fill="none" stroke="#EDE6D6" stroke-opacity=".8" stroke-width="1"/>
      <circle cx="13.4" cy="7.8" r="6.2" fill="#08090F"/>
      <path d="M 8.2 12.4 A 6.2 6.2 0 0 0 13 14" fill="none" stroke="#E8B34B" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    </svg>
    <h1>Claude Fable 5</h1>
  </div>
  <nav class="tabs" aria-label="Expressions">
    <button class="tab" data-mode="poster" aria-pressed="true"><span class="idx">Ⅰ</span>Poster</button>
    <button class="tab" data-mode="motion" aria-pressed="false"><span class="idx">Ⅱ</span>Motion</button>
    <button class="tab" data-mode="instrument" aria-pressed="false"><span class="idx">Ⅲ</span>Instrument</button>
  </nav>
  <div class="seedCtl">
    <span class="lbl">Set</span>
    <button id="seedPrev" aria-label="Previous seed variation">‹</button>
    <output id="seedVal" aria-label="Current seed">1810</output>
    <button id="seedNext" aria-label="Next seed variation">›</button>
  </div>
</header>

<main id="stage">
  <section id="view-poster" class="view active" role="group" aria-label="Poster expression">
    <div class="posterWrap">
      <div id="posterFrame"></div>
      <div id="posterCaption" class="mono">Set Nº1810 · Poster · 4:5</div>
    </div>
  </section>

  <section id="view-motion" class="view" role="group" aria-label="Motion expression">
    <canvas id="motionCanvas" aria-label="NOCTURNE kinetic title sequence, twelve seconds"></canvas>
    <div class="transport" role="group" aria-label="Motion controls">
      <button id="btnPlay" class="tbtn" aria-label="Play">
        <svg class="icoPlay" width="11" height="11" viewBox="0 0 12 12"><path d="M2.5 1.4 L10.6 6 L2.5 10.6 Z" fill="#EDE6D6"/></svg>
        <svg class="icoPause" width="11" height="11" viewBox="0 0 12 12"><rect x="2" y="1.5" width="2.6" height="9" fill="#EDE6D6"/><rect x="7.4" y="1.5" width="2.6" height="9" fill="#EDE6D6"/></svg>
      </button>
      <button id="btnReplay" class="tbtn" aria-label="Replay from start">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#EDE6D6" stroke-width="1.2">
          <path d="M7 1.8 A5.2 5.2 0 1 0 12.2 7"/>
          <path d="M7 1.8 L4.6 0.8 M7 1.8 L5.2 3.9" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="scrub" type="range" min="0" max="12000" step="10" value="0" aria-label="Timeline position in milliseconds">
      <div id="timeRead" class="mono">00.00 / 12.00</div>
    </div>
  </section>

  <section id="view-instrument" class="view" role="group" aria-label="Instrument expression">
    <canvas id="instCanvas" tabindex="0" aria-label="Interactive light-bending instrument. Move the pointer to carry the star. Hold to deepen the lens. Press space to pulse."></canvas>
    <div class="instCaption tl">NOCTURNE — Festival of Impossible Light</div>
    <div class="instCaption bl">Mira Vale · Glass Choir · Static Bloom</div>
    <div class="instCaption br">Atlas Observatory · 18 October · Doors 19:30</div>
    <div id="instHint">move — carry the star · hold — deepen the lens · space — pulse</div>
  </section>
</main>

<div id="veil" aria-hidden="true"></div>
<div id="live" class="vh" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ============================== utilities ============================== */

var TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function seg(t, a, b){ return clamp01((t - a) / (b - a)); }
function easeIO(p){ return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; }
function easeO(p){ return 1 - Math.pow(1 - p, 3); }
function easeI(p){ return p*p*p; }
function easeOB(p){ var c = 1.35; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
function r4(v){ return Math.round(v * 1e4) / 1e4; }
function pad3(n){ return String(n).padStart(3, '0'); }

function mulberry32(a){
  a |= 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function fnv(str){
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return ('0000000' + (h >>> 0).toString(16)).slice(-8);
}

/* spectral ramp: gold -> cyan -> violet ("impossible light") */
var SPEC = [[232,179,75],[94,232,220],[155,123,242]];
function spec(u, shift){
  u = clamp01(u + (shift || 0));
  var seg2 = u < .5 ? 0 : 1, t = (u - seg2 * .5) * 2;
  var a = SPEC[seg2], b = SPEC[seg2 + 1];
  return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
}
function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

var INK = [237,230,214];
var EVENT = {
  name: 'NOCTURNE',
  tagline: 'Festival of Impossible Light',
  date: '18 October',
  doors: '19:30',
  venue: 'Atlas Observatory',
  artists: ['Mira Vale', 'Glass Choir', 'Static Bloom'],
  tension: 'ceremonial · electric · intimate'
};
var DUR = 12000;

/* ============================== identity ============================== */

function makeIdentity(seed){
  seed = seed | 0;
  var R = mulberry32(Math.imul(seed, 2654435761) ^ 0x1F123BB5);
  var rr = function(a, b){ return a + (b - a) * R(); };

  var discAngle = r4(rr(-2.55, -0.62));       /* occluder offset direction (upper hemisphere) */
  var discDist  = r4(rr(0.30, 0.46));         /* offset distance, fraction of ring radius */
  var discRf    = r4(rr(0.50, 0.585));        /* occluder radius, fraction of ring radius */

  var ringN = 7 + Math.floor(R() * 5);
  var rings = [];
  for (var i = 0; i < ringN; i++){
    var f = r4(0.22 + 0.74 * Math.pow((i + 0.35 + R() * 0.5) / ringN, 0.92));
    rings.push({
      f: clamp(f, 0.2, 0.96),
      o: r4(rr(0.10, 0.30)),
      dash: R() < 0.35 ? r4(rr(1.5, 3)) + ' ' + r4(rr(5, 13)) : null
    });
  }
  rings.sort(function(a, b){ return a.f - b.f; });

  var tickEvery = [2, 2.5, 3][Math.floor(R() * 3)];
  var tickStart = r4(rr(0, TAU));

  var filN = 13 + Math.floor(R() * 7);
  var filaments = [];
  for (i = 0; i < filN; i++){
    filaments.push({
      t: r4(rr(-1, 1)),
      len: r4(rr(0.45, 1.5)),
      curl: r4(rr(-1.3, 1.3)),
      o: r4(rr(0.35, 0.9)),
      w: r4(rr(0.6, 1.4))
    });
  }

  var stars = [];
  for (i = 0; i < 120; i++){
    stars.push({
      x: r4(R()), y: r4(R()),
      r: r4(rr(0.4, 1.4)), a: r4(rr(0.25, 0.9)),
      tw: r4(rr(0.5, 2.2)), ph: r4(rr(0, TAU)),
      fl: R() < 0.07
    });
  }
  var occStars = [];
  for (i = 0; i < 3; i++){
    occStars.push({ x: r4(rr(0.08, 0.92)), y: r4(rr(0.06, 0.5)), r: r4(rr(3.2, 5.4)), bite: r4(rr(0, TAU)) });
  }

  var id = {
    seed: seed,
    discAngle: discAngle, discDist: discDist, discRf: discRf,
    rings: rings, tickEvery: tickEvery, tickStart: tickStart,
    filaments: filaments, stars: stars, occStars: occStars,
    meridian: r4(rr(-0.5, 0.5)),
    shift: r4(rr(-0.06, 0.06)),
    coronaN: 36 + Math.floor(R() * 20),
    instRays: 96 + Math.floor(R() * 40),
    srcAngle: r4(rr(0, TAU))
  };
  id.digest = fnv(JSON.stringify([
    id.seed, id.discAngle, id.discDist, id.discRf, id.tickEvery, id.tickStart,
    id.meridian, id.shift, id.coronaN, id.instRays, id.srcAngle,
    rings.map(function(r){ return [r.f, r.o, r.dash]; }),
    filaments.map(function(f){ return [f.t, f.len, f.curl, f.o, f.w]; }),
    stars.map(function(s){ return [s.x, s.y, s.r]; })
  ]));
  return id;
}

/* ============================== poster (SVG) ============================== */

var SVGNS = 'http://www.w3.org/2000/svg';
function E(name, attrs, parent){
  var e = document.createElementNS(SVGNS, name);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function pAt(cx, cy, r, a){ return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function arcPath(cx, cy, r, a0, a1){
  var p0 = pAt(cx, cy, r, a0), p1 = pAt(cx, cy, r, a1);
  var la = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
  var sw = a1 > a0 ? 1 : 0;
  return 'M ' + r4(p0.x) + ' ' + r4(p0.y) + ' A ' + r4(r) + ' ' + r4(r) + ' 0 ' + la + ' ' + sw + ' ' + r4(p1.x) + ' ' + r4(p1.y);
}
function stops(grad, list){
  list.forEach(function(s){
    E('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s.length > 2 ? s[2] : 1 }, grad);
  });
}
function svgText(parent, str, attrs){
  var t = E('text', attrs, parent);
  t.textContent = str;
  return t;
}

function buildPoster(id){
  var W = 800, H = 1000, CX = 400, CY = 415, R0 = 272;
  var D = { x: CX + Math.cos(id.discAngle) * id.discDist * R0, y: CY + Math.sin(id.discAngle) * id.discDist * R0 };
  var dR = id.discRf * R0;
  var limb = id.discAngle + Math.PI;

  var svg = E('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
    'aria-label': 'NOCTURNE — Festival of Impossible Light — poster, Set Nº' + id.seed });
  var defs = E('defs', null, svg);

  var bg = E('radialGradient', { id: 'bgGrad', gradientUnits: 'userSpaceOnUse', cx: CX, cy: 380, r: 660 }, defs);
  stops(bg, [[0, '#0E101C'], [0.55, '#090A12'], [1, '#05060C']]);
  var vig = E('radialGradient', { id: 'vig', gradientUnits: 'userSpaceOnUse', cx: CX, cy: 470, r: 680 }, defs);
  stops(vig, [[0, '#020307', 0], [0.62, '#020307', 0], [1, '#020307', 0.62]]);
  var dg = E('radialGradient', { id: 'discG', gradientUnits: 'userSpaceOnUse',
    cx: r4(D.x - dR * 0.25), cy: r4(D.y - dR * 0.3), r: r4(dR * 1.55) }, defs);
  stops(dg, [[0, '#030409'], [0.8, '#05060D'], [1, '#070811']]);

  var g0 = spec(0, id.shift), g1 = spec(0.5, id.shift), g2 = spec(1, id.shift);
  var c0 = rgba(g0, 1), c1 = rgba(g1, 1), c2 = rgba(g2, 1);
  var pA = pAt(D.x, D.y, dR, limb - 1.05), pB = pAt(D.x, D.y, dR, limb + 1.05);
  var arcG = E('linearGradient', { id: 'specArc', gradientUnits: 'userSpaceOnUse',
    x1: r4(pA.x), y1: r4(pA.y), x2: r4(pB.x), y2: r4(pB.y) }, defs);
  stops(arcG, [[0, c0], [0.5, c1], [1, c2]]);
  var wG = E('linearGradient', { id: 'specW', gradientUnits: 'userSpaceOnUse', x1: 52, y1: 452, x2: 748, y2: 452 }, defs);
  stops(wG, [[0, c0], [0.5, c1], [1, c2]]);
  var f0 = pAt(D.x, D.y, dR, limb), f1 = pAt(D.x, D.y, dR + R0 * 1.25, limb);
  var fG = E('linearGradient', { id: 'specFil', gradientUnits: 'userSpaceOnUse',
    x1: r4(f0.x), y1: r4(f0.y), x2: r4(f1.x), y2: r4(f1.y) }, defs);
  stops(fG, [[0, c0], [0.45, c1], [1, c2]]);

  var glow = E('filter', { id: 'glow', x: '-40%', y: '-40%', width: '180%', height: '180%' }, defs);
  E('feGaussianBlur', { 'in': 'SourceGraphic', stdDeviation: 3.6, result: 'b' }, glow);
  var mrg = E('feMerge', null, glow);
  E('feMergeNode', { 'in': 'b' }, mrg);
  E('feMergeNode', { 'in': 'SourceGraphic' }, mrg);

  var grain = E('filter', { id: 'grain', x: '0%', y: '0%', width: '100%', height: '100%' }, defs);
  E('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.82', numOctaves: '2',
    seed: String((Math.abs(id.seed) % 97) + 1), stitchTiles: 'stitch', result: 'n' }, grain);

/* ============================== canvas sizing ============================== */

function sizeCanvas(cv, ctx){
  var r = cv.parentElement.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(2, Math.round(r.width * dpr));
  var h = Math.max(2, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return false;
}
function cssSize(cv){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  return { w: cv.width / dpr, h: cv.height / dpr };
}

function layoutPoster(){
  var pad = stageW < 720 ? 30 : 70;
  var availW = Math.max(60, stageW - pad);
  var availH = Math.max(60, stageH - pad - 26);
  var h = Math.min(availH, availW * 1.25);
  var w = h * 0.8;
  posterFrame.style.width = Math.round(w) + 'px';
  posterFrame.style.height = Math.round(h) + 'px';
}

function handleResize(){
  var r = $('#stage').getBoundingClientRect();
  stageW = r.width; stageH = r.height;
  layoutPoster();
  if (mode === 'motion'){ sizeCanvas(motionCv, mctx); renderMotion(motion.t); }
  if (mode === 'instrument'){
    if (sizeCanvas(instCv, ictx)){
      var s = cssSize(instCv);
      ictx.fillStyle = '#0A0B13'; ictx.fillRect(0, 0, s.w, s.h);
      clampInstrument();
    }
  }
}
if (window.ResizeObserver) new ResizeObserver(handleResize).observe($('#stage'));
window.addEventListener('resize', handleResize);

/* ============================== motion (canvas, pure fn of t) ============================== */

function serifFont(px, weight, italic){
  return (italic ? 'italic ' : '') + (weight || 500) + ' ' + px + 'px Didot, "Bodoni 72", Georgia, serif';
}
function monoFont(px){
  return '500 ' + px + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
}
function stag(p, i, n, spread){
  spread = spread === undefined ? 0.6 : spread;
  return clamp01((p - (i / Math.max(1, n)) * spread) / (1 - spread));
}

function wordmarkLayout(ctx, w, h){
  var fs = Math.min(w * 0.118, h * 0.20, 190);
  var letters = EVENT.name.split('');
  var track, widths, total;
  for (var pass = 0; pass < 2; pass++){
    ctx.font = serifFont(fs, 500);
    track = fs * 0.17;
    widths = letters.map(function(ch){ return ctx.measureText(ch).width; });
    total = widths.reduce(function(a, b){ return a + b; }, 0) + track * (letters.length - 1);
    if (total > w * 0.92) fs *= (w * 0.92) / total; else break;
  }
  var xs = [], x = (w - total) / 2;
  for (var i = 0; i < letters.length; i++){ xs.push(x); x += widths[i] + track; }
  return { fs: fs, letters: letters, xs: xs, widths: widths, baseline: h * 0.46 + fs * 0.35, total: total };
}

function specGradient(ctx, x0, x1, y, alpha){
  var g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, rgba(spec(0, identity.shift), alpha));
  g.addColorStop(0.5, rgba(spec(0.5, identity.shift), alpha));
  g.addColorStop(1, rgba(spec(1, identity.shift), alpha));
  return g;
}

function drawWordmarkPass(ctx, L, alphaPerLetter, dyPerLetter, flashPerLetter){
  for (var i = 0; i < L.letters.length; i++){
    var a = alphaPerLetter(i);
    if (a <= 0) continue;
    var dy = dyPerLetter ? dyPerLetter(i) : 0;
    ctx.font = serifFont(L.fs, 500);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(INK, a);
    ctx.fillText(L.letters[i], L.xs[i], L.baseline + dy);
    var fl = flashPerLetter ? flashPerLetter(i) : 0;
    if (fl > 0){
      ctx.strokeStyle = specGradient(ctx, L.xs[0], L.xs[L.xs.length - 1] + L.widths[L.widths.length - 1], L.baseline, fl * 0.9);
      ctx.lineWidth = 1.2;
      ctx.strokeText(L.letters[i], L.xs[i], L.baseline + dy);
    }
  }
}

function renderMotion(t){
  var s = cssSize(motionCv);
  var w = s.w, h = s.h;
  if (w < 4 || h < 4) return;
  var ctx = mctx;
  var S = Math.min(w, h), cx = w / 2, cy = h * 0.46, R = S * 0.30;
  var id = identity;

  /* background */
  var bgr = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, Math.max(w, h) * 0.75);
  bgr.addColorStop(0, '#0C0E19');
  bgr.addColorStop(0.6, '#090A12');
  bgr.addColorStop(1, '#05060C');
  ctx.fillStyle = bgr;
  ctx.fillRect(0, 0, w, h);

  /* stars */
  var pStars = seg(t, 500, 2300);
  if (pStars > 0){
    for (var i = 0; i < id.stars.length; i++){
      var st = id.stars[i];
      var ap = stag(pStars, i % 24, 24, 0.7);
      if (ap <= 0) continue;
      var tw = 0.72 + 0.28 * Math.sin(t * 0.001 * st.tw + st.ph);
      ctx.fillStyle = rgba(INK, st.a * 0.6 * ap * tw);
      ctx.beginPath();
      ctx.arc(st.x * w, st.y * h, st.r * 0.85, 0, TAU);
      ctx.fill();
    }
  }

  /* top caption typewriter */
  var cap = 'ATLAS OBSERVATORY · 18 OCTOBER · DOORS 19:30';
  var pc = seg(t, 350, 1900);
  if (pc > 0){
    var nch = Math.floor(easeO(pc) * cap.length);
    ctx.font = monoFont(Math.max(9, S * 0.013));
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = rgba(INK, 0.5);
    var shown = cap.slice(0, nch);
    var sp = shown.split('').join(' ');
    ctx.fillText(sp, Math.max(18, w * 0.03), Math.max(16, h * 0.035));
  }

  /* horizon line -> ring morph */
  var pl = seg(t, 150, 1300), pb = seg(t, 1650, 3250);
  if (pl > 0){
    ctx.strokeStyle = rgba(INK, 0.55);
    ctx.lineWidth = 1;
    if (pb <= 0){
      var half = easeIO(pl) * w * 0.46;
      ctx.beginPath();
      ctx.moveTo(cx - half, cy);
      ctx.lineTo(cx + half, cy);
      ctx.stroke();
    } else {
      var pe = easeIO(pb);
      var Rc = lerp(R * 14, R, pe);
      var ccy = cy - Rc + lerp(0, R, pe);
      var dAng = lerp(Math.min(1.2, (w * 0.5) / Rc), Math.PI, pe);
      ctx.beginPath();
      ctx.arc(cx, ccy, Rc, Math.PI / 2 - dAng, Math.PI / 2 + dAng);
      ctx.stroke();
    }
  }

  /* inner rings + ticks */
  var pr = seg(t, 2450, 4900);
  var fadeRings = 1 - 0.55 * easeIO(seg(t, 9400, 10600));
  if (pr > 0){
    for (i = 0; i < id.rings.length; i++){
      var rg = id.rings[i];
      var rp = stag(pr, i, id.rings.length, 0.55);
      if (rp <= 0) continue;
      var a0 = id.tickStart + i * 1.7;
      ctx.strokeStyle = rgba(INK, rg.o * fadeRings);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, rg.f * R, a0, a0 + easeIO(rp) * TAU);
      ctx.stroke();
    }
  }
  var pt = seg(t, 3000, 5000);
  if (pt > 0){
    var totalTicks = Math.floor(360 / id.tickEvery);
    var count = Math.floor(easeO(pt) * totalTicks);
    ctx.strokeStyle = rgba(INK, 0.38 * fadeRings);
    ctx.lineWidth = 0.55;
    ctx.beginPath();
    for (i = 0; i < count; i++){
      var ta = id.tickStart + (i * id.tickEvery) * Math.PI / 180;
      var tl = ((i * id.tickEvery) % 30 === 0) ? R * 0.048 : R * 0.02;
      ctx.moveTo(cx + Math.cos(ta) * R, cy + Math.sin(ta) * R);
      ctx.lineTo(cx + Math.cos(ta) * (R - tl), cy + Math.sin(ta) * (R - tl));
    }
    ctx.stroke();
  }

  /* occluding disc travel */
  var pd = seg(t, 4500, 7300);
  var dR = id.discRf * R;
  var fx = cx + Math.cos(id.discAngle) * id.discDist * R;
  var fy = cy + Math.sin(id.discAngle) * id.discDist * R;
  var dirSide = Math.cos(id.discAngle) >= 0 ? -1 : 1;
  var sx0 = cx + dirSide * (w * 0.5 + dR + 40);
  var dx = lerp(sx0, fx, easeIO(pd));
  var dyc = lerp(cy, fy, easeI(clamp01(pd * 1.15)));
  var limb = id.discAngle + Math.PI;
  if (pd > 0){
    var dgr = ctx.createRadialGradient(dx - dR * 0.25, dyc - dR * 0.3, dR * 0.1, dx, dyc, dR * 1.4);
    dgr.addColorStop(0, '#030409');
    dgr.addColorStop(0.8, '#05060D');
    dgr.addColorStop(1, '#070811');
    ctx.fillStyle = dgr;
    ctx.beginPath();
    ctx.arc(dx, dyc, dR, 0, TAU);
    ctx.fill();
    /* trailing spectral rim while moving */
    if (pd < 1){
      var trail = (1 - pd);
      var backA = dirSide > 0 ? Math.PI : 0;
      ctx.strokeStyle = rgba(spec(0.5, id.shift), 0.5 * trail);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(dx, dyc, dR + 1, backA - 0.9, backA + 0.9);
      ctx.stroke();
    }
    /* crescent settles in as disc arrives */
    var pcr = seg(t, 6900, 8100);
    if (pcr > 0){
      var crA = easeIO(pcr) * (1 - 0.3 * easeIO(seg(t, 9400, 10800)));
      ctx.lineCap = 'round';
      ctx.strokeStyle = specGradient(ctx, dx - dR, dx + dR, dyc, 0.9 * crA);
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(dx, dyc, dR + 1.5, limb - 1.02 * crA, limb + 1.02 * crA);
      ctx.stroke();
      ctx.strokeStyle = specGradient(ctx, dx - dR, dx + dR, dyc, 0.4 * crA);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(dx, dyc, dR + 8, limb - 0.7 * crA, limb + 0.7 * crA);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
  }

  /* wordmark: staggered rise from baseline mask, then split lockup */
  var L = wordmarkLayout(ctx, w, h);
  var splitX = easeIO(seg(t, 9350, 9900));
  var birth = function(i){ return 5200 + i * 230; };
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, L.baseline + L.fs * 0.05);
  ctx.clip();
  drawWordmarkPass(ctx, L,
    function(i){ return easeO(seg(t, birth(i), birth(i) + 620)) * (1 - splitX * (t > 9350 ? 0 : 0)); },
    function(i){ return (1 - easeO(seg(t, birth(i), birth(i) + 620))) * L.fs * 0.92; },
    function(i){ var p = seg(t, birth(i), birth(i) + 480); return p > 0 && p < 1 ? Math.sin(p * Math.PI) : 0; });
  ctx.restore();
  /* birth ticks */
  for (i = 0; i < L.letters.length; i++){
    var bp = seg(t, birth(i), birth(i) + 380);
    if (bp > 0 && bp < 1){
      var tx = L.xs[i] + L.widths[i] / 2;
      ctx.strokeStyle = rgba(spec(i / 7, id.shift), (1 - bp) * 0.8);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(tx, L.baseline + L.fs * 0.12);
      ctx.lineTo(tx, L.baseline + L.fs * 0.12 + (1 - bp) * L.fs * 0.22);
      ctx.stroke();
    }
  }
  /* split treatment after totality: letters over the disc turn to spectral ghosts */
  if (splitX > 0 && pd > 0){
    /* outside-disc solid already drawn above; redraw inside-disc region as ghost */
    ctx.save();
    ctx.beginPath();
    ctx.arc(dx, dyc, dR, 0, TAU);
    ctx.clip();
    ctx.fillStyle = rgba([9, 10, 18], splitX);
    ctx.fillRect(dx - dR, Math.min(L.baseline - L.fs, dyc - dR), dR * 2, dR * 2 + L.fs);
    ctx.font = serifFont(L.fs, 500);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    var wg = specGradient(ctx, L.xs[0], L.xs[7] + L.widths[7], L.baseline, 0.9 * splitX);
    for (i = 0; i < L.letters.length; i++){
      ctx.fillStyle = rgba(INK, 0.05 * splitX);
      ctx.fillText(L.letters[i], L.xs[i], L.baseline);
      ctx.strokeStyle = wg;
      ctx.lineWidth = 1.1;
      ctx.strokeText(L.letters[i], L.xs[i], L.baseline);
    }
    ctx.restore();
  }

  /* artists arrive */
  var names = EVENT.artists;
  var afs = Math.max(12, S * 0.026);
  ctx.font = serifFont(afs, 500);
  ctx.textBaseline = 'alphabetic';
  var sepW = ctx.measureText(' · ').width;
  var nw = names.map(function(n){ return ctx.measureText(n).width; });
  var rowW = nw.reduce(function(a, b){ return a + b; }, 0) + sepW * 2;
  var ax = (w - rowW) / 2, ay = h * 0.80;
  for (i = 0; i < 3; i++){
    var ph = easeIO(seg(t, 6600 + i * 430, 6600 + i * 430 + 520));
    if (ph > 0){
      ctx.fillStyle = rgba(INK, 0.9 * ph);
      ctx.font = serifFont(afs, 500);
      ctx.textAlign = 'left';
      ctx.fillText(names[i], ax, ay + (1 - ph) * afs * 0.4);
      if (i < 2){
        ctx.fillStyle = rgba(spec(0.5, id.shift), 0.7 * ph);
        ctx.fillText(' · ', ax + nw[i], ay);
      }
    }
    ax += nw[i] + sepW;
  }

  /* totality: corona + shock + inversion */
  var pcor = seg(t, 8300, 9400);
  if (pcor > 0 && pd > 0){
    var bloom = easeOB(clamp01(pcor * 1.6));
    var fadeC = 1 - easeIO(seg(t, 9100, 10400));
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < id.coronaN; i++){
      var ca = id.tickStart + (i / id.coronaN) * TAU;
      var chash = (Math.sin(i * 12.9898) * 43758.5453) % 1;
      var clen = R * (0.35 + 0.85 * Math.abs(chash)) * bloom;
      var cc = spec(Math.abs(chash), id.shift);
      ctx.strokeStyle = rgba(cc, 0.5 * fadeC);
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(dx + Math.cos(ca) * (dR + 2), dyc + Math.sin(ca) * (dR + 2));
      ctx.lineTo(dx + Math.cos(ca) * (dR + 2 + clen), dyc + Math.sin(ca) * (dR + 2 + clen));
      ctx.stroke();
    }
    var shp = seg(t, 8300, 9200);
    if (shp > 0 && shp < 1){
      ctx.strokeStyle = rgba(spec(0.5, id.shift), (1 - shp) * 0.55);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(dx, dyc, dR + easeO(shp) * R * 2.1, 0, TAU);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  var pinv = seg(t, 8250, 9350);
  if (pinv > 0 && pinv < 1){
    var fl2 = Math.pow(Math.sin(pinv * Math.PI), 1.6);
    if (fl2 > 0.01){
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = rgba(INK, fl2 * 0.95);
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* subtitle + info line (resolution) */
  var ps = easeIO(seg(t, 9250, 10300));
  if (ps > 0){
    ctx.font = serifFont(Math.max(13, S * 0.030), 500, true);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(INK, 0.92 * ps);
    var sub = EVENT.tagline.split('').join(' ');
    ctx.fillText(sub, cx, L.baseline + L.fs * 0.62);
  }
  var pi2 = easeIO(seg(t, 9700, 10700));
  if (pi2 > 0){
    ctx.font = monoFont(Math.max(9.5, S * 0.0165));
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(INK, 0.7 * pi2);
    ctx.fillText(EVENT.date + '  ·  Doors ' + EVENT.doors + '  ·  ' + EVENT.venue, cx, h * 0.868);
  }

  /* resolution breathing filament */
  var pbr = seg(t, 9800, 12000);
  if (pbr > 0 && pd > 0){
    var br = 0.25 + 0.15 * Math.sin(t * 0.0012);
    ctx.strokeStyle = rgba(spec(0.35, id.shift), br * easeIO(clamp01(pbr * 2)));
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    var fa2 = limb + 0.3;
    ctx.moveTo(dx + Math.cos(fa2) * (dR + 2), dyc + Math.sin(fa2) * (dR + 2));
    ctx.bezierCurveTo(
      dx + Math.cos(fa2 + 0.1) * (dR + R * 0.4), dyc + Math.sin(fa2 + 0.1) * (dR + R * 0.4),
      dx + Math.cos(fa2 + 0.3) * (dR + R * 0.8), dyc + Math.sin(fa2 + 0.3) * (dR + R * 0.8),
      dx + Math.cos(fa2 + 0.5) * (dR + R * 1.15), dyc + Math.sin(fa2 + 0.5) * (dR + R * 1.15));
    ctx.stroke();
  }

  /* vignette */
  var vg = ctx.createRadialGradient(cx, h * 0.5, S * 0.35, cx, h * 0.5, Math.max(w, h) * 0.72);
  vg.addColorStop(0, 'rgba(2,3,7,0)');
  vg.addColorStop(1, 'rgba(2,3,7,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);
}

/* ============================== transport ============================== */

function fmtTime(ms){ return (ms / 1000).toFixed(2).padStart(5, '0'); }
function syncTransport(){
  var v = Math.round(motion.t);
  if (Math.abs(Number(scrub.value) - v) > 4) scrub.value = v;
  scrub.style.setProperty('--p', (motion.t / DUR * 100).toFixed(2) + '%');
  scrub.setAttribute('aria-valuetext', fmtTime(motion.t) + ' of 12 seconds');
  timeRead.textContent = fmtTime(motion.t) + ' / 12.00';
  btnPlay.classList.toggle('playing', motion.playing);
  btnPlay.setAttribute('aria-label', motion.playing ? 'Pause' : 'Play');
}
function setPlaying(p){
  motion.playing = !!p;
  syncTransport();
}
function doSeek(ms){
  motion.t = clamp(Number(ms) || 0, 0, DUR);
  if (mode === 'motion'){ sizeCanvas(motionCv, mctx); renderMotion(motion.t); }
  syncTransport();
  return motion.t;
}
btnPlay.addEventListener('click', function(){
  if (!motion.playing && motion.t >= DUR) motion.t = 0;
  setPlaying(!motion.playing);
});
$('#btnReplay').addEventListener('click', function(){
  motion.t = 0;
  setPlaying(true);
});
scrub.addEventListener('input', function(){ doSeek(Number(scrub.value)); });

/* ============================== instrument ============================== */

function initInstrument(){
  var s = cssSize(instCv);
  var cx2 = s.w / 2, cy2 = s.h / 2;
  var dR = Math.min(s.w, s.h) * 0.16;
  var px = cx2 + Math.cos(identity.srcAngle) * dR * 2.2;
  var py = cy2 + Math.sin(identity.srcAngle) * dR * 2.2;
  px = clamp(px, 30, Math.max(31, s.w - 30));
  py = clamp(py, 30, Math.max(31, s.h - 30));
  inst = {
    x: px, y: py, tx: px, ty: py,
    massBase: 1, mass: 1, holding: false,
    pulses: [], rays: identity.instRays,
    bendAvg: 0, interactions: 0,
    idle: identity.srcAngle, lastInput: -1e9, clock: 0,
    scaleRot: 0
  };
  if (instCv.width > 4){
    ictx.setTransform(Math.min(window.devicePixelRatio || 1, 2), 0, 0, Math.min(window.devicePixelRatio || 1, 2), 0, 0);
    ictx.fillStyle = '#0A0B13';
    ictx.fillRect(0, 0, s.w, s.h);
  }
}

function clampInstrument(){
  if (!inst) return;
  var s = cssSize(instCv);
  inst.x = clamp(inst.x, 18, Math.max(19, s.w - 18));
  inst.y = clamp(inst.y, 18, Math.max(19, s.h - 18));
  inst.tx = clamp(inst.tx, 18, Math.max(19, s.w - 18));
  inst.ty = clamp(inst.ty, 18, Math.max(19, s.h - 18));
}

function instInput(x, y){
  var s = cssSize(instCv);
  inst.tx = clamp(x, 18, Math.max(19, s.w - 18));
  inst.ty = clamp(y, 18, Math.max(19, s.h - 18));
  inst.lastInput = inst.clock;
  if (instHint && !instHint.classList.contains('gone')) instHint.classList.add('gone');
}

function instPulse(){
  if (inst.pulses.length < 6) inst.pulses.push({ r: 0, life: 1 });
  inst.lastInput = inst.clock;
  inst.interactions++;
}

function instStep(dt){
  if (!inst) return;
  dt = clamp(dt, 0, 50);
  inst.clock += dt;
  var s = cssSize(instCv);
  var cx2 = s.w / 2, cy2 = s.h / 2;
  var dR = Math.min(s.w, s.h) * 0.16;

  /* idle drift when untouched */
  if (!RM && inst.clock - inst.lastInput > 4500 && !inst.holding){
    inst.idle += dt * 0.00022;
    inst.tx = cx2 + Math.cos(inst.idle) * dR * 2.4;
    inst.ty = cy2 + Math.sin(inst.idle * 0.8) * dR * 1.7;
  }

  /* keep the star outside the dark disc */
  var ddx = inst.tx - cx2, ddy = inst.ty - cy2;
  var dd = Math.hypot(ddx, ddy);
  if (dd < dR + 16){
    var push = dd < 1 ? { x: 1, y: 0 } : { x: ddx / dd, y: ddy / dd };
    inst.tx = cx2 + push.x * (dR + 16);
    inst.ty = cy2 + push.y * (dR + 16);
  }

  var k = 1 - Math.exp(-dt * 0.009);
  inst.x += (inst.tx - inst.x) * k;
  inst.y += (inst.ty - inst.y) * k;

  var massT = clamp(inst.massBase + (inst.holding ? 1.15 : 0), 0.4, 3.4);
  inst.mass += (massT - inst.mass) * (1 - Math.exp(-dt * 0.006));

  for (var i = inst.pulses.length - 1; i >= 0; i--){
    var p = inst.pulses[i];
    p.r += dt * Math.min(s.w, s.h) * 0.0009;
    p.life -= dt / 1400;
    if (p.life <= 0) inst.pulses.splice(i, 1);
  }
  clampInstrument();
  if (!isFinite(inst.x) || !isFinite(inst.y)){ inst.x = cx2; inst.y = cy2 - dR * 2; inst.tx = inst.x; inst.ty = inst.y; }
  if (!isFinite(inst.mass)) inst.mass = 1;
  if (!RM) inst.scaleRot += dt * 0.00003;
}

function instRender(){
  if (!inst) return;
  var s = cssSize(instCv);
  var w = s.w, h = s.h;
  if (w < 4 || h < 4) return;
  var ctx = ictx;
  var S = Math.min(w, h);
  var cx2 = w / 2, cy2 = h / 2;
  var dR = S * 0.16;
  var id = identity;

  /* trail fade */
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = RM ? 'rgba(10,11,19,0.5)' : 'rgba(10,11,19,0.3)';
  ctx.fillRect(0, 0, w, h);

  /* faint stars */
  for (var i = 0; i < id.stars.length; i += 2){
    var st = id.stars[i];
    ctx.fillStyle = rgba(INK, st.a * 0.14);
    ctx.fillRect(st.x * w, st.y * h, 1, 1);
  }

  /* pulse boost */
  var boost = 0;
  for (i = 0; i < inst.pulses.length; i++) boost += inst.pulses[i].life * 0.8;
  var massEff = inst.mass * (1 + boost);

  /* light rays, bent around the dark disc */
  var N = inst.rays;
  var G = dR * dR * 0.012 * massEff;
  var ds = clamp(S / 80, 6, 13);
  var maxSteps = 130;
  var margin = 50;
  var bendSum = 0;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  for (i = 0; i < N; i++){
    var ang = (i / N) * TAU + inst.scaleRot * 2;
    var px = inst.x, py = inst.y;
    var dxv = Math.cos(ang), dyv = Math.sin(ang);
    var bend = 0, absorbed = false;
    var pts = [px, py];
    for (var sIdx = 0; sIdx < maxSteps; sIdx++){
      var rx = px - cx2, ry = py - cy2;
      var d2 = rx * rx + ry * ry;
      var d = Math.sqrt(d2);
      if (d < dR){ absorbed = true; break; }
      var f = G / (d2 * d) * ds;
      var ndx = dxv - rx * f, ndy = dyv - ry * f;
      var nl = Math.hypot(ndx, ndy) || 1;
      ndx /= nl; ndy /= nl;
      var cross = dxv * ndy - dyv * ndx;
      bend += Math.abs(Math.asin(clamp(cross, -1, 1)));
      dxv = ndx; dyv = ndy;
      px += dxv * ds; py += dyv * ds;
      pts.push(px, py);
      if (px < -margin || px > w + margin || py < -margin || py > h + margin) break;
    }
    bendSum += bend;
    var u = clamp01(bend / 2.2);
    var col = spec(u, id.shift);
    var alpha = (0.09 + 0.3 * u) * (absorbed ? 0.7 : 1);
    ctx.strokeStyle = rgba(col, alpha);
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var j = 2; j < pts.length; j += 2) ctx.lineTo(pts[j], pts[j + 1]);
    ctx.stroke();
  }
  inst.bendAvg = r4(bendSum / N);
  ctx.globalCompositeOperation = 'source-over';

  /* the dark disc */
  var dgr = ctx.createRadialGradient(cx2 - dR * 0.25, cy2 - dR * 0.3, dR * 0.1, cx2, cy2, dR * 1.35);
  dgr.addColorStop(0, '#030409');
  dgr.addColorStop(0.85, '#04050B');
  dgr.addColorStop(1, '#060710');
  ctx.fillStyle = dgr;
  ctx.beginPath();
  ctx.arc(cx2, cy2, dR, 0, TAU);
  ctx.fill();

  /* ring scale around disc */
  ctx.strokeStyle = rgba(INK, 0.16);
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.arc(cx2, cy2, dR * 1.45, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(INK, 0.1);
  ctx.beginPath(); ctx.arc(cx2, cy2, dR * 1.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(INK, 0.28);
  ctx.lineWidth = 0.55;
  ctx.beginPath();
  for (i = 0; i < 72; i++){
    var ta = inst.scaleRot + (i / 72) * TAU;
    var tl = i % 6 === 0 ? dR * 0.07 : dR * 0.03;
    ctx.moveTo(cx2 + Math.cos(ta) * dR * 1.45, cy2 + Math.sin(ta) * dR * 1.45);
    ctx.lineTo(cx2 + Math.cos(ta) * (dR * 1.45 - tl), cy2 + Math.sin(ta) * (dR * 1.45 - tl));
  }
  ctx.stroke();

  /* limb glow facing the star */
  var sa = Math.atan2(inst.y - cy2, inst.x - cx2);
  var glowI = clamp01(0.25 + massEff * 0.22);
  ctx.lineCap = 'round';
  for (i = 0; i < 3; i++){
    var gw = [2.2, 4.5, 8][i], go = [0.55, 0.2, 0.08][i];
    var gg = ctx.createLinearGradient(
      cx2 + Math.cos(sa - 1) * dR, cy2 + Math.sin(sa - 1) * dR,
      cx2 + Math.cos(sa + 1) * dR, cy2 + Math.sin(sa + 1) * dR);
    gg.addColorStop(0, rgba(spec(0, id.shift), go * glowI));
    gg.addColorStop(0.5, rgba(spec(0.5, id.shift), go * glowI));
    gg.addColorStop(1, rgba(spec(1, id.shift), go * glowI));
    ctx.strokeStyle = gg;
    ctx.lineWidth = gw;
    ctx.beginPath();
    ctx.arc(cx2, cy2, dR + 1, sa - 1.05, sa + 1.05);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';

  /* pulses */
  for (i = 0; i < inst.pulses.length; i++){
    var p = inst.pulses[i];
    ctx.strokeStyle = rgba(spec(1 - p.life, id.shift), p.life * 0.5);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cx2, cy2, dR + p.r, 0, TAU);
    ctx.stroke();
  }

  /* the carried star */
  ctx.strokeStyle = rgba(INK, 0.9);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(inst.x, inst.y, 4.5, 0, TAU); ctx.stroke();
  ctx.fillStyle = rgba(INK, 0.95);
  ctx.beginPath(); ctx.arc(inst.x, inst.y, 1.4, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(INK, 0.4);
  ctx.beginPath();
  ctx.moveTo(inst.x - 9, inst.y); ctx.lineTo(inst.x - 5.5, inst.y);
  ctx.moveTo(inst.x + 5.5, inst.y); ctx.lineTo(inst.x + 9, inst.y);
  ctx.moveTo(inst.x, inst.y - 9); ctx.lineTo(inst.x, inst.y - 5.5);
  ctx.moveTo(inst.x, inst.y + 5.5); ctx.lineTo(inst.x, inst.y + 9);
  ctx.stroke();
}

/* instrument input */
function canvasPos(e){
  var r = instCv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
instCv.addEventListener('pointerdown', function(e){
  var p = canvasPos(e);
  inst.holding = true;
  inst.interactions++;
  instInput(p.x, p.y);
  try{ instCv.setPointerCapture(e.pointerId); }catch(_){ /* synthetic pointers */ }
  e.preventDefault();
});
instCv.addEventListener('pointermove', function(e){
  var p = canvasPos(e);
  instInput(p.x, p.y);
});
instCv.addEventListener('pointerup', function(){ inst.holding = false; });
instCv.addEventListener('pointercancel', function(){ inst.holding = false; });
instCv.addEventListener('dblclick', function(e){ instPulse(); e.preventDefault(); });
instCv.addEventListener('wheel', function(e){
  inst.massBase = clamp(inst.massBase - e.deltaY * 0.0012, 0.4, 2.4);
  inst.lastInput = inst.clock;
  e.preventDefault();
}, { passive: false });
instCv.addEventListener('keydown', function(e){
  var s = cssSize(instCv);
  var stepPx = Math.min(s.w, s.h) * 0.045;
  var used = true;
  if (e.key === 'ArrowLeft') instInput(inst.tx - stepPx, inst.ty);
  else if (e.key === 'ArrowRight') instInput(inst.tx + stepPx, inst.ty);
  else if (e.key === 'ArrowUp') instInput(inst.tx, inst.ty - stepPx);
  else if (e.key === 'ArrowDown') instInput(inst.tx, inst.ty + stepPx);
  else if (e.key === ' ') instPulse();
  else if (e.key === '+' || e.key === '=') { inst.massBase = clamp(inst.massBase + 0.15, 0.4, 2.4); inst.lastInput = inst.clock; }
  else if (e.key === '-' || e.key === '_') { inst.massBase = clamp(inst.massBase - 0.15, 0.4, 2.4); inst.lastInput = inst.clock; }
  else used = false;
  if (used){ inst.interactions++; e.preventDefault(); }
});

/* ============================== modes & veil ============================== */

var veil = $('#veil');
var switching = false;
var pendingMode = null;

function applyMode(name){
  mode = name;
  Object.keys(views).forEach(function(k){
    views[k].classList.toggle('active', k === name);
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.mode === name));
  });
  if (name === 'motion'){
    sizeCanvas(motionCv, mctx);
    renderMotion(motion.t);
    syncTransport();
  } else if (name === 'instrument'){
    if (sizeCanvas(instCv, ictx) || true){
      var s = cssSize(instCv);
      ictx.fillStyle = '#0A0B13';
      ictx.fillRect(0, 0, s.w, s.h);
      clampInstrument();
    }
  }
  live.textContent = 'Expression: ' + name;
}

function enterMode(name){
  if (name === 'motion'){
    if (motion.t >= DUR) motion.t = 0;
    if (!RM) setPlaying(true);
    else if (motion.t === 0) doSeek(11400); /* reduced motion: show the resolved title card */
  } else if (name === 'instrument'){
    instHint.classList.remove('gone');
    try{ instCv.focus({ preventScroll: true }); }catch(_){ instCv.focus(); }
  }
}

function uiSetMode(name){
  if (!views[name]) return;
  if (name === mode) return;
  if (RM || switching){
    if (switching){ pendingMode = name; return; }
    applyMode(name);
    enterMode(name);
    return;
  }
  switching = true;
  veil.classList.add('cover');
  window.setTimeout(function(){
    applyMode(name);
    enterMode(name);
    requestAnimationFrame(function(){
      veil.classList.remove('cover');
      window.setTimeout(function(){
        switching = false;
        if (pendingMode && pendingMode !== mode){
          var p = pendingMode; pendingMode = null;
          uiSetMode(p);
        } else pendingMode = null;
      }, 500);
    });
  }, 360);
}

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){ uiSetMode(b.dataset.mode); });
});

/* ============================== seed ============================== */

var seedVal = $('#seedVal');
function applySeed(seed, keepMode){
  seed = seed | 0;
  identity = makeIdentity(seed);
  seedVal.textContent = String(seed);
  posterCaption.textContent = 'Set Nº' + seed + ' · Poster · 4:5';
  posterFrame.textContent = '';
  posterFrame.appendChild(buildPoster(identity));
  initInstrument();
  if (!keepMode){
    motion.t = 0;
    setPlaying(false);
  }
  if (mode === 'motion'){ sizeCanvas(motionCv, mctx); renderMotion(motion.t); syncTransport(); }
  if (mode === 'instrument'){
    var s = cssSize(instCv);
    if (instCv.width > 4){ ictx.fillStyle = '#0A0B13'; ictx.fillRect(0, 0, s.w, s.h); }
  }
}
$('#seedPrev').addEventListener('click', function(){ applySeed((identity.seed | 0) - 1, true); });
$('#seedNext').addEventListener('click', function(){ applySeed((identity.seed | 0) + 1, true); });

/* ============================== global keys ============================== */

window.addEventListener('keydown', function(e){
  if (e.target && (e.target.closest && e.target.closest('input, button, #instCanvas'))) return;
  if (e.key === '1') uiSetMode('poster');
  else if (e.key === '2') uiSetMode('motion');
  else if (e.key === '3') uiSetMode('instrument');
  else if (mode === 'motion'){
    if (e.key === ' '){
      if (!motion.playing && motion.t >= DUR) motion.t = 0;
      setPlaying(!motion.playing);
      e.preventDefault();
    }
    else if (e.key === 'ArrowLeft'){ doSeek(motion.t - 250); e.preventDefault(); }
    else if (e.key === 'ArrowRight'){ doSeek(motion.t + 250); e.preventDefault(); }
  }
});

/* ============================== main loop ============================== */

var lastFrame = performance.now();
function frame(now){
  var dt = Math.min(now - lastFrame, 100);
  lastFrame = now;
  if (mode === 'motion' && motion.playing){
    motion.t = Math.min(motion.t + dt, DUR);
    if (motion.t >= DUR) motion.playing = false;
    renderMotion(motion.t);
    syncTransport();
  } else if (mode === 'instrument'){
    instStep(dt);
    instRender();
  }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) lastFrame = performance.now();
});

/* ============================== deterministic API ============================== */

function firePointer(el, type, x, y){
  var r = el.getBoundingClientRect();
  var opts = { clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true,
    pointerId: 7, pointerType: 'mouse', buttons: type === 'pointerup' ? 0 : 1 };
  var ev;
  try{ ev = new PointerEvent(type, opts); }
  catch(_){ ev = new MouseEvent(type.replace('pointer', 'mouse'), opts); }
  el.dispatchEvent(ev);
}

function snapshot(){
  return {
    seed: identity.seed,
    mode: mode,
    identityDigest: identity.digest,
    reducedMotion: RM,
    motion: {
      time: Math.round(motion.t * 1000) / 1000,
      playing: motion.playing,
      duration: DUR
    },
    instrument: {
      x: Math.round(inst.x * 10) / 10,
      y: Math.round(inst.y * 10) / 10,
      targetX: Math.round(inst.tx * 10) / 10,
      targetY: Math.round(inst.ty * 10) / 10,
      mass: Math.round(inst.mass * 1000) / 1000,
      massBase: Math.round(inst.massBase * 1000) / 1000,
      holding: inst.holding,
      pulses: inst.pulses.length,
      rays: inst.rays,
      bend: inst.bendAvg,
      interactions: inst.interactions
    },
    poster: {
      edition: identity.seed,
      rings: identity.rings.length,
      filaments: identity.filaments.length,
      discAngle: identity.discAngle
    }
  };
}

var API = {
  reset: function(seed){
    applySeed(seed | 0, false);
    motion.t = 0;
    setPlaying(false);
    applyMode('poster');
    return snapshot();
  },
  setMode: function(name){
    if (name !== 'poster' && name !== 'motion' && name !== 'instrument') return false;
    applyMode(name);
    return true;
  },
  seek: function(ms){
    return doSeek(ms);
  },
  snapshot: snapshot,
  runSelfTest: function(){
    var saved = snapshot();
    var wasPlaying = motion.playing;
    setPlaying(false);
    var tests = [];
    function T(name, fn){
      var pass = false, detail = '';
      try{
        var res = fn();
        pass = res === true || !!(res && res.pass);
        detail = (res && res.detail) || '';
      }catch(err){
        pass = false;
        detail = String((err && err.message) || err);
      }
      tests.push({ name: name, pass: pass, detail: detail });
    }

    T('deterministic reset', function(){
      API.reset(4242);
      var d1 = snapshot().identityDigest;
      API.setMode('instrument');
      firePointer(instCv, 'pointermove', 40, 40);
      instStep(32); instStep(32);
      var s2 = API.reset(4242);
      return { pass: d1 === s2.identityDigest && s2.mode === 'poster' && s2.motion.time === 0 && s2.motion.playing === false,
        detail: 'digest ' + d1 };
    });
    T('seed changes identity', function(){
      API.reset(4242);
      var d1 = snapshot().identityDigest;
      API.reset(4243);
      var d2 = snapshot().identityDigest;
      return { pass: d1 !== d2, detail: d1 + ' vs ' + d2 };
    });
    ['poster', 'motion', 'instrument'].forEach(function(m){
      T('mode: ' + m, function(){
        var ok = API.setMode(m) === true;
        var vis = views[m].classList.contains('active');
        var others = Object.keys(views).filter(function(k){ return k !== m; })
          .every(function(k){ return !views[k].classList.contains('active'); });
        return { pass: ok && snapshot().mode === m && vis && others, detail: 'active section: ' + m };
      });
    });
    T('rejects invalid mode', function(){
      var before = snapshot().mode;
      var r = API.setMode('hologram');
      return { pass: r === false && snapshot().mode === before, detail: 'setMode("hologram") -> false' };
    });
    T('exact motion seek', function(){
      API.setMode('motion');
      var r = API.seek(4321);
      return { pass: r === 4321 && snapshot().motion.time === 4321, detail: 'seek(4321) -> ' + snapshot().motion.time };
    });
    T('timeline boundaries', function(){
      var lo = API.seek(-500), hi = API.seek(99999), edge = API.seek(12000), zero = API.seek(0);
      return { pass: lo === 0 && hi === 12000 && edge === 12000 && zero === 0,
        detail: '-500->' + lo + ' 99999->' + hi + ' 12000->' + edge };
    });
    T('deterministic frame render', function(){
      API.setMode('motion');
      if (motionCv.width < 8) return { pass: true, detail: 'skipped: zero-size surface' };
      function sample(){
        var out = [];
        var pts = [[0.2, 0.3], [0.5, 0.46], [0.8, 0.62], [0.35, 0.8], [0.65, 0.25]];
        for (var i = 0; i < pts.length; i++){
          var d = mctx.getImageData(Math.floor(motionCv.width * pts[i][0]), Math.floor(motionCv.height * pts[i][1]), 1, 1).data;
          out.push(d[0], d[1], d[2]);
        }
        return out.join(',');
      }
      API.seek(6100);
      var a = sample();
      API.seek(120);
      API.seek(6100);
      var b = sample();
      return { pass: a === b, detail: a === b ? 'pixel samples identical' : 'samples differ' };
    });
    T('instrument responds to input', function(){
      API.setMode('instrument');
      var s = cssSize(instCv);
      var x0 = inst.x, y0 = inst.y;
      firePointer(instCv, 'pointerdown', s.w * 0.22, s.h * 0.28);
      firePointer(instCv, 'pointermove', s.w * 0.7, s.h * 0.66);
      firePointer(instCv, 'pointerup', s.w * 0.7, s.h * 0.66);
      for (var i = 0; i < 24; i++) instStep(32);
      var moved = Math.hypot(inst.x - x0, inst.y - y0);
      return { pass: moved > 2, detail: 'star moved ' + moved.toFixed(1) + 'px' };
    });
    T('finite numeric state after interaction', function(){
      instPulse();
      for (var i = 0; i < 20; i++) instStep(32);
      if (instCv.width > 8) instRender();
      var snap = snapshot().instrument;
      var nums = [snap.x, snap.y, snap.targetX, snap.targetY, snap.mass, snap.massBase, snap.bend];
      inst.pulses.forEach(function(p){ nums.push(p.r, p.life); });
      var allFinite = nums.every(function(n){ return typeof n === 'number' && isFinite(n); });
      return { pass: allFinite, detail: 'checked ' + nums.length + ' values' };
    });
    T('snapshot is JSON-safe', function(){
      var str = JSON.stringify(snapshot());
      var back = JSON.parse(str);
      return { pass: typeof str === 'string' && back.seed === identity.seed, detail: str.length + ' chars' };
    });

    /* restore */
    API.reset(saved.seed);
    API.setMode(saved.mode);
    doSeek(saved.motion.time);
    setPlaying(wasPlaying && saved.mode === 'motion' && !RM);

    return { passed: tests.every(function(x){ return x.pass; }), tests: tests };
  }
};
window.__LIVING_IDENTITY__ = API;

/* ============================== validation hash hook ==============================
   #seed=N&mode=M&t=MS&sim=1&test=1 — used for headless QA screenshots; harmless in normal use. */
function runHashHooks(){
  var hsh = location.hash.slice(1);
  if (!hsh) return;
  var q = {};
  hsh.split('&').forEach(function(kv){
    var p = kv.split('=');
    q[decodeURIComponent(p[0])] = p.length > 1 ? decodeURIComponent(p[1]) : '1';
  });
  if (q.seed) API.reset(Number(q.seed));
  if (q.mode) API.setMode(q.mode);
  if (q.t !== undefined) API.seek(Number(q.t));
  if (q.sim && mode === 'instrument'){
    var s = cssSize(instCv);
    firePointer(instCv, 'pointerdown', s.w * 0.3, s.h * 0.35);
    for (var i = 0; i <= 30; i++){
      firePointer(instCv, 'pointermove', s.w * (0.3 + 0.012 * i), s.h * (0.35 + 0.008 * i));
      instStep(32);
      instRender();
    }
    firePointer(instCv, 'pointerup', s.w * 0.66, s.h * 0.59);
    instPulse();
    for (i = 0; i < 30; i++){ instStep(32); instRender(); }
  }
  if (q.test){
    window.setTimeout(function(){
      var r = API.runSelfTest();
      var pre = document.createElement('pre');
      pre.id = 'selftest-out';
      pre.hidden = true;
      pre.textContent = JSON.stringify(r, null, 1);
      document.body.appendChild(pre);
    }, 250);
  }
}

/* ============================== init ============================== */

applySeed(1810, false);
handleResize();
applyMode('poster');
syncTransport();
requestAnimationFrame(frame);
requestAnimationFrame(function(){ requestAnimationFrame(runHashHooks); });

})();
</script>
