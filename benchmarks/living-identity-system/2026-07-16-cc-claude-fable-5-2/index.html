<!doctype html>
<html lang="en" style="color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable 5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2307070f' stroke='%23eae3d2' stroke-width='1'/%3E%3Ccircle cx='23' cy='11' r='2' fill='%23ffbe66'/%3E%3C/svg%3E">
<style>
  :root{
    --night:#07070f; --page:#050509; --bone:#eae3d2;
    --dim:rgba(234,227,210,.58); --faint:rgba(234,227,210,.30);
    --hair:rgba(234,227,210,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--page); color:var(--bone); overflow:hidden;
    font-family:'Avenir Next','Avenir','Futura','Gill Sans','Trebuchet MS','Segoe UI',sans-serif;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  [hidden]{display:none !important}
  header{
    display:flex; align-items:center; flex-wrap:wrap; gap:4px 18px;
    padding:14px 22px 12px; border-bottom:1px solid var(--hair);
    user-select:none; -webkit-user-select:none;
  }
  .brand{font-size:12px; letter-spacing:.34em; text-transform:uppercase; white-space:nowrap}
  .brand::after{content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--bone); margin-left:12px; vertical-align:2px; box-shadow:0 0 9px rgba(234,227,210,.9)}
  nav.tabs{display:flex; gap:2px; margin:0 auto}
  button{
    font:inherit; color:var(--dim); background:none; border:none; cursor:pointer;
    touch-action:manipulation;
  }
  button:focus-visible, input:focus-visible, canvas:focus-visible{
    outline:1px solid var(--bone); outline-offset:3px;
  }
  .tab{
    font-size:11px; letter-spacing:.30em; text-transform:uppercase;
    padding:8px 13px; position:relative;
  }
  .tab:hover{color:var(--bone)}
  .tab[aria-pressed="true"]{color:var(--bone)}
  .tab[aria-pressed="true"]::after{
    content:""; position:absolute; left:50%; bottom:-1px; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--bone);
    box-shadow:0 0 8px rgba(234,227,210,.9);
  }
  .seedbox{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--dim); white-space:nowrap}
  .seedbox b{color:var(--bone); font-weight:600; min-width:44px; text-align:center; font-variant-numeric:tabular-nums}
  .seedbox button{font-size:14px; padding:4px 8px; color:var(--dim); line-height:1}
  .seedbox button:hover{color:var(--bone)}
  #stage{position:relative; flex:1; min-height:0}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;
    -webkit-user-select:none; user-select:none}
  #transport{
    position:absolute; left:50%; transform:translateX(-50%); bottom:18px;
    width:min(92%, 560px); display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:rgba(5,5,9,.78); border:1px solid var(--hair);
    user-select:none; -webkit-user-select:none;
  }
  #transport button{display:flex; align-items:center; padding:5px}
  #transport button svg{display:block}
  #transport button:hover svg *{stroke:var(--bone); fill:var(--bone)}
  .tlabel{font-size:10px; letter-spacing:.12em; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap}
  input[type=range]{
    -webkit-appearance:none; appearance:none; background:transparent; height:22px;
    flex:1; min-width:90px; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:rgba(234,227,210,.22)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%; background:var(--bone);
    margin-top:-4.5px; box-shadow:0 0 10px rgba(234,227,210,.85);
  }
  input[type=range]::-moz-range-track{height:2px; background:rgba(234,227,210,.22)}
  input[type=range]::-moz-range-thumb{width:11px; height:11px; border:none; border-radius:50%;
    background:var(--bone); box-shadow:0 0 10px rgba(234,227,210,.85)}
  #hint{
    position:absolute; left:50%; transform:translateX(-50%); bottom:16px;
    font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint);
    text-align:center; pointer-events:none; padding:0 12px; line-height:1.9;
  }
  #hint b{color:var(--dim); font-weight:600}
  @media (max-width:640px){
    header{padding:10px 14px 8px; justify-content:space-between}
    nav.tabs{order:3; width:100%; justify-content:center; margin:2px auto 0}
    .tab{padding:7px 9px; letter-spacing:.22em}
    #hint{letter-spacing:.14em}
  }
</style>

<body>
<header>
  <div class="brand" id="brandTitle">Fable 5</div>
  <nav class="tabs" aria-label="Expression">
    <button class="tab" data-mode="poster"     aria-pressed="true">Poster</button>
    <button class="tab" data-mode="motion"     aria-pressed="false">Motion</button>
    <button class="tab" data-mode="instrument" aria-pressed="false">Instrument</button>
  </nav>
  <div class="seedbox">
    <button id="seedDown" aria-label="Previous seed variation">‹</button>
    <span>Seed</span><b id="seedVal">1810</b>
    <button id="seedUp" aria-label="Next seed variation">›</button>
  </div>
</header>
<main id="stage">
  <canvas id="cv" tabindex="0" role="application"
    aria-label="NOCTURNE living identity. In instrument mode, drag to sow light; press 1, 2 or 3 to change voice; space to pulse."></canvas>
  <div id="transport" hidden>
    <button id="playBtn" aria-label="Play">
      <svg id="playIco" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M3 2 L12 7 L3 12 Z" fill="rgba(234,227,210,.75)"/>
      </svg>
      <svg id="pauseIco" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="display:none">
        <path d="M3.5 2 V12 M10.5 2 V12" stroke="rgba(234,227,210,.75)" stroke-width="2.4"/>
      </svg>
    </button>
    <button id="replayBtn" aria-label="Replay from the beginning">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M7 2 A5 5 0 1 1 2.4 5" fill="none" stroke="rgba(234,227,210,.75)" stroke-width="1.6"/>
        <path d="M2 1.4 L2.6 5.4 L6.4 4.2 Z" fill="rgba(234,227,210,.75)"/>
      </svg>
    </button>
    <span class="tlabel" id="tCur">0:00.00</span>
    <input type="range" id="scrub" min="0" max="12000" step="1" value="0" aria-label="Timeline position in milliseconds">
    <span class="tlabel">0:12.00</span>
  </div>
  <div id="hint" hidden>
    Voice <b id="voiceName">Mira Vale</b> · drag to sow light · space pulses ·
    1 2 3 voices · ← → tilt grating · ↑ ↓ occulter
  </div>
</main>
<script>
(function(){
'use strict';

/* ============================== utilities ============================== */
var TAU = Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function clamp01(v){ return v<0?0:(v>1?1:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function eo(p){ p=clamp01(p); return 1-Math.pow(1-p,3); }               // ease-out cubic
function eio(p){ p=clamp01(p); return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }
function eiq(p){ p=clamp01(p); return p<.5 ? 16*p*p*p*p*p : 1-Math.pow(-2*p+2,5)/2; }
function bump(t,a,b){ var p=seg(t,a,b); return Math.sin(p*Math.PI); }
function r3(v){ return Math.round(v*1000)/1000; }
function withA(hex,a){
  var n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+clamp(a,0,1).toFixed(3)+')';
}
function mulberry32(a){
  a=a>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    var t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function fmtTime(ms){
  var s=ms/1000;
  return '0:'+String(Math.floor(s)).padStart(2,'0')+'.'+String(Math.floor((s%1)*100)).padStart(2,'0');
}

/* ============================== palette ============================== */
var NIGHT='#07070f', PAGE='#050509', BONE='#eae3d2', FLASH='#f4ecd8';
var PAL={
  mira :['#ffbe66','#ff8f3d','#ffe6bd'],
  glass:['#8ff0e3','#eafffb','#57d4c5'],
  bloom:['#a78bff','#ff6fb2','#dcd2ff']
};
var SPECTRAL=[PAL.mira[0],PAL.glass[0],PAL.bloom[0],PAL.mira[1],PAL.glass[2],PAL.bloom[1],'#fff2d9'];
var VOICES=[
  {name:'Mira Vale',    colors:PAL.mira},
  {name:'Glass Choir',  colors:PAL.glass},
  {name:'Static Bloom', colors:PAL.bloom}
];
var SANS="'Avenir Next','Avenir','Futura','Gill Sans','Trebuchet MS','Segoe UI',sans-serif";
var SERIF="'Palatino','Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif";

/* ============================== identity ============================== */
var identity=null, grainTile=null;

function buildIdentity(seed){
  var R=mulberry32(seed);
  var id={ seed:seed };
  id.slitAngle = -0.42 + (R()-0.5)*0.42;          // tilt of the light beam
  id.coronaA   = R()*TAU;                          // corona arc anchor
  id.plumbU    = 0.5 + (R()-0.5)*0.24;             // vertical spectral plumb line
  id.ringRot   = R()*TAU;
  id.gapFracs=[]; id.dotColors=[];
  for(var i=0;i<8;i++){
    id.gapFracs.push(0.20+R()*0.60);
    id.dotColors.push(SPECTRAL[Math.floor(R()*SPECTRAL.length)]);
  }
  id.stars=[];
  for(i=0;i<170;i++){
    id.stars.push({x:R(),y:R(),r:0.4+R()*1.1,b:0.25+R()*0.75,ph:R()*TAU,sp:0.4+R()*1.2});
  }
  id.rings=[
    {rr:1.32+R()*0.10, n:72, rot:R()*TAU, dir: 1, a:0.16},
    {rr:1.64+R()*0.12, n:48, rot:R()*TAU, dir:-1, a:0.12},
    {rr:2.02+R()*0.16, n:96, rot:R()*TAU, dir: 1, a:0.08}
  ];
  id.stripLines=[];
  for(i=0;i<36;i++){
    id.stripLines.push({u:R(),h:4+R()*26,ci:Math.floor(R()*SPECTRAL.length),
                        w:0.7+R()*1.3,a:0.35+R()*0.6});
  }
  var WL=['397','410','434','486','527','588','656','707'];
  id.stripLabels=[];
  for(i=0;i<3;i++){
    id.stripLabels.push({idx:Math.floor(R()*id.stripLines.length),txt:WL[Math.floor(R()*WL.length)]});
  }
  id.motionLines=[];
  var order=[];
  for(i=0;i<26;i++) order.push(i);
  for(i=order.length-1;i>0;i--){ var j=Math.floor(R()*(i+1)); var tmp=order[i]; order[i]=order[j]; order[j]=tmp; }
  for(i=0;i<26;i++){
    id.motionLines.push({u:0.06+ (i/25)*0.88 + (R()-0.5)*0.02, h:30+R()*100,
                         ci:Math.floor(R()*SPECTRAL.length), w:0.8+R()*1.4,
                         a:R(), ord:order[i]});
  }
  id.miniSpectra={};
  ['mira','glass','bloom'].forEach(function(k){
    var arr=[]; for(var m=0;m<8;m++) arr.push({u:R(),h:0.30+R()*0.70,ci:Math.floor(R()*3),w:0.7+R()*1.1});
    id.miniSpectra[k]=arr;
  });
  id.signature=Math.floor(R()*1e9).toString(36)+'-'+Math.floor(R()*1e9).toString(36);
  return id;
}

function makeGrain(seed){
  var c=document.createElement('canvas'); c.width=c.height=160;
  var g=c.getContext('2d'); var img=g.createImageData(160,160);
  var R=mulberry32((seed^0x9e3779b9)>>>0);
  for(var i=0;i<img.data.length;i+=4){
    var v=Math.floor(R()*255);
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=14;
  }
  g.putImageData(img,0,0);
  return c;
}

/* ============================== glyph alphabet ============================== */
/* Monoline constructed capitals. Every letter carries one "occultation" gap
   through which a point of coloured light escapes. */
function samp(cx,cy,rx,ry,a0,a1,n){
  n=n||28; var o=[];
  for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; o.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return o;
}
function makeGlyph(w,strokesPts){
  var off=0;
  var strokes=strokesPts.map(function(pts){
    var cum=[0],L=0;
    for(var i=1;i<pts.length;i++){
      L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); cum.push(L);
    }
    var s={pts:pts,cum:cum,len:L,off:off}; off+=L; return s;
  });
  return {w:w,strokes:strokes,total:off};
}
var GLYPHS={
  N: makeGlyph(0.72,[ [[0,1],[0,0]], [[0,0],[0.72,1]], [[0.72,1],[0.72,0]] ]),
  O: makeGlyph(0.78,[ samp(0.39,0.5,0.39,0.5,-Math.PI/2,Math.PI*1.5) ]),
  C: makeGlyph(0.76,[ samp(0.38,0.5,0.38,0.48,0.6,TAU-0.6) ]),
  T: makeGlyph(0.68,[ [[0,0],[0.68,0]], [[0.34,0],[0.34,1]] ]),
  U: makeGlyph(0.72,[ [[0,0],[0,0.62]].concat(samp(0.36,0.62,0.36,0.38,Math.PI,0)).concat([[0.72,0]]) ]),
  R: makeGlyph(0.70,[
      [[0,0],[0,1]],
      [[0,0.04],[0.40,0.04]].concat(samp(0.40,0.27,0.24,0.23,-Math.PI/2,Math.PI/2)).concat([[0,0.50]]),
      [[0.26,0.50],[0.70,1]] ]),
  E: makeGlyph(0.60,[ [[0,0],[0,1]], [[0,0],[0.60,0]], [[0,0.5],[0.46,0.5]], [[0,1],[0.60,1]] ])
};
var WORD='NOCTURNE', LETTER_GAP=0.26;
var WORD_UNITS=(function(){
  var s=0; for(var i=0;i<WORD.length;i++) s+=GLYPHS[WORD[i]].w;
  return s+LETTER_GAP*(WORD.length-1);
})();

function slicePoly(st,s,e){
  var pts=st.pts,cum=st.cum;
  s=Math.max(0,s); e=Math.min(st.len,e);
  if(e-s<1e-5) return null;
  var i=0;
  while(i<cum.length-1 && cum[i+1]<=s) i++;
  function at(k,l){
    var l0=cum[k],l1=cum[k+1];
    var t=(l1-l0)<1e-9?0:(l-l0)/(l1-l0);
    return [pts[k][0]+(pts[k+1][0]-pts[k][0])*t, pts[k][1]+(pts[k+1][1]-pts[k][1])*t];
  }
  var out=[at(i,s)];
  while(i<cum.length-1 && cum[i+1]<e){ out.push(pts[i+1]); i++; }
  out.push(at(Math.min(i,cum.length-2),e));
  return out;
}
function pointAtLen(glyph,l){
  for(var i=0;i<glyph.strokes.length;i++){
    var st=glyph.strokes[i];
    if(l<=st.off+st.len || i===glyph.strokes.length-1){
      var local=clamp(l-st.off,0,st.len), k=0;
      while(k<st.cum.length-1 && st.cum[k+1]<local) k++;
      var l0=st.cum[k],l1=st.cum[k+1];
      var t=(l1-l0)<1e-9?0:(local-l0)/(l1-l0);
      return [st.pts[k][0]+(st.pts[k+1][0]-st.pts[k][0])*t,
              st.pts[k][1]+(st.pts[k+1][1]-st.pts[k][1])*t];
    }
  }
  return glyph.strokes[0].pts[0];
}
function intervalsMinusGap(end,gs,ge){
  var out=[];
  var a1=Math.min(end,gs);
  if(a1>1e-6) out.push([0,a1]);
  if(ge<end) out.push([Math.max(ge,0),end]);
  return out;
}
function drawGlyphStrokes(c,g,x,yTop,size,ivs,weight,color,ox,oy){
  c.strokeStyle=color; c.lineWidth=weight; c.lineCap='round'; c.lineJoin='round';
  for(var si=0;si<g.strokes.length;si++){
    var st=g.strokes[si];
    for(var vi=0;vi<ivs.length;vi++){
      var pts=slicePoly(st,ivs[vi][0]-st.off,ivs[vi][1]-st.off);
      if(!pts) continue;
      c.beginPath();
      for(var p=0;p<pts.length;p++){
        var px=x+pts[p][0]*size+ox, py=yTop+pts[p][1]*size+oy;
        if(p===0) c.moveTo(px,py); else c.lineTo(px,py);
      }
      c.stroke();
    }
  }
}
function glowDot(c,x,y,r,col,k){
  if(k<=0) return;
  k=Math.min(k,1.4);
  c.save(); c.globalCompositeOperation='lighter';
  var R6=Math.max(r*7,6);
  var g=c.createRadialGradient(x,y,0,x,y,R6);
  g.addColorStop(0,withA(col,0.55*Math.min(k,1)));
  g.addColorStop(1,withA(col,0));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,R6,0,7); c.fill();
  c.fillStyle=withA('#ffffff',0.9*Math.min(k,1));
  c.beginPath(); c.arc(x,y,Math.max(r*0.9,1),0,7); c.fill();
  c.fillStyle=withA(col,0.9*Math.min(k,1));
  c.beginPath(); c.arc(x,y,Math.max(r*0.55,0.7),0,7); c.fill();
  c.restore();
}
/* drawWord: the wordmark with per-letter draw-on, occultation gaps + light dots */
function drawWord(c,cx,baseY,size,o){
  var weight=size*(o.weightMul||0.082);
  var totalW=WORD_UNITS*size;
  var x=cx-totalW/2, yTop=baseY-size, n=WORD.length;
  for(var li=0;li<n;li++){
    var ch=WORD[li], g=GLYPHS[ch];
    var lp=1;
    if(o.progress!=null && o.progress<1){
      var start=(li/(n-1))*(1-0.45);
      lp=eo((o.progress-start)/0.45);
    }
    if(lp>0){
      var isO=(ch==='O');
      var gl=weight*(isO?5.2:2.6)/size;
      var gs=identity.gapFracs[li]*g.total-gl/2, ge=gs+gl;
      var end=lp*g.total;
      var ivs=intervalsMinusGap(end,gs,ge);
      if(!o.dotsOnly){
        if(o.prism>0){
          var po=1.5*size/110;
          drawGlyphStrokes(c,g,x,yTop,size,ivs,weight,withA(PAL.glass[0],0.16*o.prism), po,-po*0.5);
          drawGlyphStrokes(c,g,x,yTop,size,ivs,weight,withA(PAL.mira[0], 0.14*o.prism),-po, po*0.5);
        }
        drawGlyphStrokes(c,g,x,yTop,size,ivs,weight,o.color,0,0);
      }
      var dp=Array.isArray(o.dots)?o.dots[li]:(o.dots==null?1:o.dots);
      if(dp>0 && end>=ge-1e-6){
        var pt=pointAtLen(g,identity.gapFracs[li]*g.total);
        var dx=x+pt[0]*size, dy=yTop+pt[1]*size;
        glowDot(c,dx,dy,weight*0.42,identity.dotColors[li],dp);
        if(isO && !o.dotsOnly){
          c.save(); c.globalCompositeOperation='lighter';
          c.strokeStyle=withA(identity.dotColors[li],0.7*Math.min(dp,1));
          c.lineWidth=1; c.lineCap='round';
          var ca=identity.coronaA;
          c.beginPath(); c.arc(dx,dy,weight*1.7,ca,ca+2.0); c.stroke();
          c.restore();
        }
      }
    }
    x+=(g.w+LETTER_GAP)*size;
  }
}

/* ============================== shared drawing kit ============================== */
function tracked(c,str,x,y,track,align){
  var chars=str.split(''), ws=[], total=0;
  for(var i=0;i<chars.length;i++){ var w=c.measureText(chars[i]).width; ws.push(w); total+=w; }
  total+=track*(chars.length-1);
  var sx=(align==='center')?x-total/2:(align==='right'?x-total:x);
  var pa=c.textAlign; c.textAlign='left';
  for(i=0;i<chars.length;i++){ c.fillText(chars[i],sx,y); sx+=ws[i]+track; }
  c.textAlign=pa;
  return total;
}
function tickRing(c,x,y,r,n,rot,alpha,longEvery){
  c.save();
  c.strokeStyle=withA(BONE,alpha); c.lineWidth=1;
  c.beginPath(); c.arc(x,y,r,0,7); c.globalAlpha=0.5; c.stroke(); c.globalAlpha=1;
  c.beginPath();
  for(var i=0;i<n;i++){
    var a=rot+i/n*TAU;
    var l=(i%(longEvery||6)===0)?7:3;
    c.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    c.lineTo(x+Math.cos(a)*(r+l), y+Math.sin(a)*(r+l));
  }
  c.stroke(); c.restore();
}
function beam(c,cx,cy,ang,len,coreW,alpha){
  c.save(); c.translate(cx,cy); c.rotate(ang);
  c.globalCompositeOperation='lighter';
  var g=c.createLinearGradient(-len,0,len,0);
  g.addColorStop(0,   withA(PAL.mira[0],0));
  g.addColorStop(0.22,withA(PAL.mira[0],0.55*alpha));
  g.addColorStop(0.5, withA('#fff6e0',  0.95*alpha));
  g.addColorStop(0.78,withA(PAL.glass[0],0.55*alpha));
  g.addColorStop(1,   withA(PAL.glass[0],0));
  var layers=[[coreW,1],[coreW*4,0.32],[coreW*11,0.10]];
  for(var i=0;i<layers.length;i++){
    c.globalAlpha=layers[i][1]; c.fillStyle=g;
    c.fillRect(-len,-layers[i][0]/2,len*2,layers[i][0]);
  }
  c.restore();
}
function eclipse(c,x,y,r,o){
  o=o||{};
  c.save();
  var hg=c.createRadialGradient(x,y,r*0.6,x,y,r*2.1);
  hg.addColorStop(0,withA(BONE,0.055*(o.halo==null?1:o.halo)));
  hg.addColorStop(1,withA(BONE,0));
  c.fillStyle=hg; c.beginPath(); c.arc(x,y,r*2.1,0,7); c.fill();
  c.fillStyle=o.fill||'#0c0b17';
  c.beginPath(); c.arc(x,y,r,0,7); c.fill();
  if(o.innerArcs){
    c.strokeStyle=withA(BONE,0.045); c.lineWidth=1;
    for(var k=1;k<=3;k++){ c.beginPath(); c.arc(x,y,r*k/4,0,7); c.stroke(); }
  }
  c.strokeStyle=withA(BONE,o.rimA==null?0.3:o.rimA); c.lineWidth=1;
  c.beginPath(); c.arc(x,y,r,0,7); c.stroke();
  if(o.coronaK>0){
    var a0=o.coronaA0, span=o.coronaSpan||1.2, k2=o.coronaK;
    c.globalCompositeOperation='lighter'; c.lineCap='round';
    var Ls=[[1.4,0.9,'#fff6e0'],[4,0.30,o.coronaCol||PAL.mira[0]],[9,0.10,o.coronaCol||PAL.mira[0]]];
    for(var i=0;i<Ls.length;i++){
      c.strokeStyle=withA(Ls[i][2],Ls[i][1]*k2); c.lineWidth=Ls[i][0];
      c.beginPath(); c.arc(x,y,r,a0-span/2,a0+span/2); c.stroke();
    }
  }
  c.restore();
}
function specLine(c,x,y,h,w,col,alpha,tilt){
  c.strokeStyle=withA(col,alpha); c.lineWidth=w; c.lineCap='round';
  var dx=Math.sin(tilt||0), dy=-Math.cos(tilt||0);
  c.beginPath();
  c.moveTo(x-dx*h*0.28, y-dy*h*0.28);
  c.lineTo(x+dx*h*0.72, y+dy*h*0.72);
  c.stroke();
}

var cv=document.getElementById('cv'), stage=document.getElementById('stage');
var ctx=cv.getContext('2d');

try{ RM=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var DUR=12000;

function resetInstrument(){
  inst={
    voice:0,
    grating:identity.slitAngle*0.5,
    diskR:0.16,

  };

/* ============================== poster ============================== */
var PW=1000,PH=1250,PM=84;

function drawMiniSpectrum(c,cx,y,wide,pal,lines,alpha){
  c.save(); c.globalCompositeOperation='lighter';
  c.strokeStyle=withA(BONE,0.18*alpha); c.lineWidth=1;
  c.beginPath(); c.moveTo(cx-wide/2,y); c.lineTo(cx+wide/2,y); c.stroke();
  for(var i=0;i<lines.length;i++){
    var L=lines[i], x=cx-wide/2+L.u*wide;
    c.strokeStyle=withA(pal[L.ci],0.85*alpha); c.lineWidth=L.w;
    c.beginPath(); c.moveTo(x,y); c.lineTo(x,y-L.h*13); c.stroke();
  }
  c.restore();
}

function renderPoster(){
  ctx.fillStyle=PAGE; ctx.fillRect(0,0,W,H);
  var pad=Math.min(34,W*0.05,H*0.05);
  var s=Math.min((W-pad*2)/PW,(H-pad*2)/PH);
  var rw=PW*s, rh=PH*s, rx=(W-rw)/2, ry=(H-rh)/2;

  // frame + edition caption in the surround
  ctx.strokeStyle=withA(BONE,0.16); ctx.lineWidth=1;
  ctx.strokeRect(rx-8.5,ry-8.5,rw+17,rh+17);
  if(ry>26 || pad>=26){
    ctx.fillStyle=withA(BONE,0.34);
    ctx.font='500 10px '+SANS; ctx.textBaseline='alphabetic';
    tracked(ctx,'SEED '+identity.seed,rx+rw,ry+rh+22,3,'right');
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(rx,ry,rw,rh); ctx.clip();
  ctx.translate(rx,ry); ctx.scale(s,s);

  // ground
  var bg=ctx.createLinearGradient(0,0,0,PH);
  bg.addColorStop(0,'#0a0913'); bg.addColorStop(0.55,NIGHT); bg.addColorStop(1,'#060609');
  ctx.fillStyle=bg; ctx.fillRect(0,0,PW,PH);

  var dcx=500, dcy=468, dr=196;
  var tw = RM ? 0 : runTime*0.0012;

  // stars (fade near the text zones)
  for(var i=0;i<identity.stars.length;i++){
    var st=identity.stars[i], sx=st.x*PW, sy=st.y*PH;
    var fade=sy>860?Math.max(0,1-(sy-860)/140):1;
    if(fade<=0) continue;
    var b=st.b*(RM?0.9:(0.72+0.28*Math.sin(tw*st.sp+st.ph)));
    ctx.fillStyle=withA(BONE,0.65*b*fade);
    ctx.beginPath(); ctx.arc(sx,sy,st.r,0,7); ctx.fill();
  }

  // engraved declination rings
  for(i=0;i<identity.rings.length;i++){
    var rg=identity.rings[i];
    tickRing(ctx,dcx,dcy,dr*rg.rr,rg.n,rg.rot+(RM?0:runTime*0.000012*rg.dir),rg.a,6);
  }

  // spectral plumb line, top edge down through the disk
  var px=identity.plumbU*PW;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  var pg=ctx.createLinearGradient(px,0,px,dcy);
  pg.addColorStop(0,withA(PAL.glass[0],0));
  pg.addColorStop(0.35,withA(PAL.glass[0],0.34));
  pg.addColorStop(1,withA(PAL.bloom[0],0.42));
  ctx.strokeStyle=pg; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,dcy-dr-6); ctx.stroke();
  ctx.restore();
  glowDot(ctx,px,124,1.6,PAL.glass[0],0.8);

  // the beam behind the occulter
  beam(ctx,dcx,dcy,identity.slitAngle,760,3,0.75);

  // occulter
  var breathe=RM?1:(0.82+0.18*Math.sin(runTime*0.0011));
  eclipse(ctx,dcx,dcy,dr,{
    innerArcs:true, rimA:0.32,
    coronaA0:identity.slitAngle, coronaSpan:0.9, coronaK:0.9*breathe, coronaCol:PAL.glass[0]
  });
  eclipse(ctx,dcx,dcy,dr,{fill:'rgba(0,0,0,0)',halo:0,rimA:0,
    coronaA0:identity.slitAngle+Math.PI, coronaSpan:0.7, coronaK:0.55*breathe, coronaCol:PAL.mira[0]});
  glowDot(ctx,dcx+Math.cos(identity.slitAngle)*dr,dcy+Math.sin(identity.slitAngle)*dr,2.2,PAL.glass[0],0.9*breathe);
  glowDot(ctx,dcx-Math.cos(identity.slitAngle)*dr,dcy-Math.sin(identity.slitAngle)*dr,2.2,PAL.mira[0],0.8*breathe);

  // top band — date & doors (exact strings)
  ctx.fillStyle=withA(BONE,0.72); ctx.font='500 15px '+SANS; ctx.textBaseline='alphabetic';
  tracked(ctx,'18 October',PM,106,3.5,'left');
  tracked(ctx,'Doors 19:30',PW-PM,106,3.5,'right');
  ctx.strokeStyle=withA(BONE,0.22); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PM,124); ctx.lineTo(480,124); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(520,124); ctx.lineTo(PW-PM,124); ctx.stroke();
  ctx.fillStyle=NIGHT; ctx.beginPath(); ctx.arc(500,124,7,0,7); ctx.fill();
  ctx.strokeStyle=withA(BONE,0.5); ctx.beginPath(); ctx.arc(500,124,7,0,7); ctx.stroke();
  glowDot(ctx,504,120,1.2,PAL.mira[0],0.85);

  // wordmark
  var wsize=(PW-2*PM)/WORD_UNITS;
  var dots=[]; for(i=0;i<8;i++) dots.push(RM?0.9:(0.8+0.2*Math.sin(runTime*0.0016+i*1.3)));
  drawWord(ctx,500,838,wsize,{color:withA(BONE,0.96),dots:dots,prism:0.5});

  // subtitle (exact string)
  ctx.fillStyle=withA(BONE,0.85); ctx.font='italic 500 27px '+SERIF;
  tracked(ctx,'Festival of Impossible Light',500,896,3,'center');

  // spectrograph strip
  var sx0=200,sx1=800,sy2=980;
  ctx.strokeStyle=withA(BONE,0.24); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx0,sy2); ctx.lineTo(sx1,sy2); ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(i=0;i<identity.stripLines.length;i++){
    var L=identity.stripLines[i], lx=sx0+L.u*(sx1-sx0);
    ctx.strokeStyle=withA(SPECTRAL[L.ci],0.8*L.a); ctx.lineWidth=L.w;
    ctx.beginPath(); ctx.moveTo(lx,sy2); ctx.lineTo(lx,sy2-L.h); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle=withA(BONE,0.4); ctx.font='500 9px '+SANS;
  for(i=0;i<identity.stripLabels.length;i++){
    var lb=identity.stripLabels[i], ln=identity.stripLines[lb.idx];
    tracked(ctx,lb.txt,sx0+ln.u*(sx1-sx0),sy2-ln.h-8,1,'center');
  }

  // artists (exact strings) with their spectral signatures
  var names=[['Mira Vale','mira',250],['Glass Choir','glass',500],['Static Bloom','bloom',750]];
  ctx.font='600 15px '+SANS;
  for(i=0;i<names.length;i++){
    ctx.fillStyle=withA(BONE,0.9);
    tracked(ctx,names[i][0],names[i][2],1064,3,'center');
    drawMiniSpectrum(ctx,names[i][2],1096,64,PAL[names[i][1]],identity.miniSpectra[names[i][1]],0.9);
  }

  // venue (exact string)
  ctx.fillStyle=withA(BONE,0.92); ctx.font='500 23px '+SERIF;
  var vw=tracked(ctx,'Atlas Observatory',500,1170,5,'center');
  ctx.strokeStyle=withA(BONE,0.28);
  ctx.beginPath(); ctx.moveTo(500-vw/2-58,1163); ctx.lineTo(500-vw/2-18,1163); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(500+vw/2+18,1163); ctx.lineTo(500+vw/2+58,1163); ctx.stroke();

  // grain + vignette
  var pat=ctx.createPattern(grainTile,'repeat');
  if(pat){ ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.5;
    ctx.fillStyle=pat; ctx.fillRect(0,0,PW,PH); ctx.restore(); }
  var vg=ctx.createRadialGradient(500,560,300,500,625,900);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,PW,PH);

  ctx.restore();
}

/* ============================== motion ============================== */
function renderMotion(t){
  ctx.fillStyle=NIGHT; ctx.fillRect(0,0,W,H);
  var S=Math.min(W,H), cx=W/2, cy=H*0.45;
  var dip=0.7*seg(t,8950,9300)*(t<9430?1:Math.max(0,1-seg(t,9430,9700)));
  var flash=t<9420?0:Math.pow(1-seg(t,9420,10050),2.2);
  if(RM) flash*=0.4;

  // stars
  var starA=0.7*seg(t,3000,4600)*(1-0.75*dip);
  if(starA>0){
    for(var i=0;i<identity.stars.length;i++){
      var st=identity.stars[i];
      ctx.fillStyle=withA(BONE,0.6*st.b*starA);
      ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,7); ctx.fill();
    }
  }

  // rings
  var ringA=seg(t,2600,3800)*(1-0.6*dip);
  if(ringA>0){
    tickRing(ctx,cx,cy,S*0.36,72,identity.ringRot+t*0.00003,0.15*ringA,6);
    tickRing(ctx,cx,cy,S*0.245,48,identity.ringRot*1.7-t*0.00002,0.10*ringA,8);
  }

  // slit line
  var grow=eo(seg(t,200,1700));
  var rot=identity.slitAngle*eio(seg(t,1500,2500));
  var slitA=(0.4+0.6*eo(seg(t,600,1500)))*(1-seg(t,5200,6400));
  if(grow>0 && slitA>0.01){
    beam(ctx,cx,cy,rot,grow*W*0.46,2.4,0.85*slitA);
    var ex=Math.cos(rot)*grow*W*0.46, ey=Math.sin(rot)*grow*W*0.46;
    glowDot(ctx,cx+ex,cy+ey,1.8,PAL.glass[0],0.9*slitA);
    glowDot(ctx,cx-ex,cy-ey,1.8,PAL.mira[0],0.9*slitA);
  }
  // ticks along slit
  var tickA=seg(t,900,2100)*(1-seg(t,4800,5800));
  if(tickA>0.01){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    ctx.strokeStyle=withA(BONE,0.4*tickA); ctx.lineWidth=1;
    ctx.beginPath();
    for(i=0;i<25;i++){
      var u=(i/24-0.5)*W*0.84;
      var a2=seg(t,900+i*36,1350+i*36);
      if(a2<=0) continue;
      var l=(i%6===0?9:4)*a2;
      ctx.moveTo(u,6); ctx.lineTo(u,6+l);
    }
    ctx.stroke(); ctx.restore();
  }

  // spectral emission lines: bloom off the slit, migrate to a strip, flare at climax
  var mig=eio(seg(t,5700,7000));
  var decayF=t<9420?0:Math.pow(1-seg(t,9420,10250),2);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(i=0;i<identity.motionLines.length;i++){
    var ml=identity.motionLines[i];
    var birth=2050+ml.ord*95;
    var bl=eo(seg(t,birth,birth+800));
    if(bl<=0) continue;
    var off=(ml.u-0.5)*W*0.84;
    var sx=cx+Math.cos(rot)*off, sy=cy+Math.sin(rot)*off;
    var tx=cx+(ml.u-0.5)*W*0.52, ty=H*0.74;
    var bx=lerp(sx,tx,mig), by=lerp(sy,ty,mig);
    var hs=lerp(1,0.38,mig)*(1+2.4*decayF);
    var h=ml.h*(S/900+0.4)*bl*hs;
    var a3=(0.3+0.55*ml.a)*(1-0.55*dip);
    ctx.strokeStyle=withA(SPECTRAL[ml.ci],a3); ctx.lineWidth=ml.w;
    ctx.beginPath(); ctx.moveTo(bx,by+h*0.30); ctx.lineTo(bx,by-h*0.70); ctx.stroke();
    if(ml.ci===1||ml.ci===6) glowDot(ctx,bx,by-h*0.70,1.1,SPECTRAL[ml.ci],0.5*a3*bl);
  }
  ctx.restore();

  // wordmark
  var wp=seg(t,4700,7500);
  var wsize=Math.min(W*0.80/WORD_UNITS,H*0.16);
  var wBase=cy+wsize*0.5;
  var dots=[];
  for(i=0;i<8;i++){
    var ip=seg(t,7500+i*90,7500+i*90+300);
    dots.push(ip*(1.25-0.4*ip)+0.6*flash);
  }
  if(wp>0){
    var prism=0.5*seg(t,6900,7600)+1.4*decayF;
    ctx.save(); ctx.globalAlpha=1-0.8*dip;
    drawWord(ctx,cx,wBase,wsize,{color:withA(BONE,0.96),progress:wp,dots:dots,prism:prism});
    ctx.restore();
  }

  // subtitle
  var subA=seg(t,7700,8500);
  if(subA>0){
    ctx.fillStyle=withA(BONE,0.85*subA*(1-0.7*dip));
    ctx.font='italic 500 '+Math.round(Math.max(15,wsize*0.24))+'px '+SERIF;
    tracked(ctx,'Festival of Impossible Light',cx,wBase+wsize*0.52,lerp(14,3,eio(subA)),'center');
  }

  // climax occulter: sweeps across the name, then settles as the lockup mark
  if(t>8600){
    var sweep=eiq(seg(t,8600,9350));
    var settle=eio(seg(t,9700,10700));
    var dR=lerp(S*0.30,S*0.075,settle);
    var dx=settle>0?cx:lerp(-0.18*W,cx,sweep);
    var dy=lerp(cy,H*0.16,settle);
    eclipse(ctx,dx,dy,dR,{fill:'#0a0914',rimA:0.4,
      coronaA0:identity.slitAngle+Math.PI*settle, coronaSpan:1.3,
      coronaK:0.4+1.4*decayF+0.5*bump(t,9200,9700), coronaCol:PAL.glass[0]});
    // the eclipsed name's light still escapes through the occulter
    if(t>9000) drawWord(ctx,cx,wBase,wsize,{dotsOnly:true,dots:dots.map(function(d){return d*(0.7+flash);})});
  }

  // shockwave + flash
  if(t>9420){
    var sp=seg(t,9420,10600);
    ctx.strokeStyle=withA(BONE,(1-sp)*0.4); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,S*(0.08+0.85*eo(sp)),0,7); ctx.stroke();
  }
  if(flash>0.003){ ctx.fillStyle=withA(FLASH,0.82*flash); ctx.fillRect(0,0,W,H); }

  // resolution — the full lockup (exact strings)
  var fs=Math.max(11,Math.min(14,W/52));
  var a4=seg(t,10300,11100);
  if(a4>0){
    ctx.fillStyle=withA(BONE,0.85*a4); ctx.font='500 '+fs+'px '+SANS;
    tracked(ctx,'Mira Vale · Glass Choir · Static Bloom',cx,H*0.66+(1-eo(a4))*10,2.5,'center');
  }
  var a5=seg(t,10650,11450);
  if(a5>0){
    ctx.fillStyle=withA(BONE,0.7*a5); ctx.font='500 '+fs+'px '+SANS;
    if(W<560){
      tracked(ctx,'Atlas Observatory',cx,H*0.845+(1-eo(a5))*10,2.5,'center');
      tracked(ctx,'18 October · Doors 19:30',cx,H*0.845+fs*1.7+(1-eo(a5))*10,2.5,'center');
    }else{
      tracked(ctx,'Atlas Observatory · 18 October · Doors 19:30',cx,H*0.86+(1-eo(a5))*10,2.5,'center');
    }
  }

  // grain
  var pat=ctx.createPattern(grainTile,'repeat');
  if(pat){ ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.4;
    ctx.fillStyle=pat; ctx.fillRect(0,0,W,H); ctx.restore(); }
}

/* ============================== instrument ============================== */
function spawnRes(nx,ny){
  inst.resCounter++;
  if(inst.res.length>=64) inst.res.shift();
  inst.res.push({
    x:clamp01(nx), y:clamp01(ny), v:inst.voice, e:1,
    s:((identity.seed*2654435761)+(inst.resCounter*40503))>>>0
  });
}
function instPointerDown(nx,ny){
  inst.down=true; inst.hasPointer=true;
  inst.pointer.x=clamp01(nx); inst.pointer.y=clamp01(ny);
  inst.last={x:nx,y:ny};
  spawnRes(nx,ny);
}
function instPointerMove(nx,ny){
  if(inst.hasPointer){
    var dx=nx-inst.pointer.x, dy=ny-inst.pointer.y;
    inst.speed=Math.min(3,inst.speed+Math.hypot(dx,dy)*22);
  }
  inst.hasPointer=true;
  inst.pointer.x=clamp01(nx); inst.pointer.y=clamp01(ny);
  if(inst.down){
    if(!inst.last) inst.last={x:nx,y:ny};
    if(Math.hypot(nx-inst.last.x,ny-inst.last.y)>0.032){
      spawnRes(nx,ny); inst.last={x:nx,y:ny};
    }
  }
}
function instPointerUp(){ inst.down=false; inst.last=null; }
function instPulse(){
  inst.pulse=1; inst.shock=0;
  for(var i=0;i<inst.res.length;i++) inst.res[i].e=Math.min(1.25,inst.res[i].e+0.5);
}
function instSetVoice(v){
  inst.voice=clamp(Math.round(v),0,2);
  var el=document.getElementById('voiceName');
  if(el) el.textContent=VOICES[inst.voice].name;
}
function instUpdate(dt){
  inst.time+=dt;
  inst.pulse*=Math.exp(-dt/600);
  inst.speed*=Math.exp(-dt/140);
  if(inst.shock>=0){ inst.shock+=dt; if(inst.shock>1400) inst.shock=-1; }
  for(var i=inst.res.length-1;i>=0;i--){
    inst.res[i].e*=Math.exp(-dt/9000);
    if(inst.res[i].e<0.02) inst.res.splice(i,1);
  }
}
function renderInstrument(){
  ctx.fillStyle=NIGHT; ctx.fillRect(0,0,W,H);
  var S=Math.min(W,H);
  var C={x:W*0.5,y:H*0.44}, r=inst.diskR*S;
  var t=inst.time;

  // stars
  for(var i=0;i<identity.stars.length;i++){
    var st=identity.stars[i];
    var b=st.b*(RM?0.85:(0.7+0.3*Math.sin(t*0.0011*st.sp+st.ph)));
    ctx.fillStyle=withA(BONE,0.5*b);
    ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,7); ctx.fill();
  }

  // grating ring
  tickRing(ctx,C.x,C.y,r+26,72,inst.grating*2+identity.ringRot,0.16,6);

  // resonators — sown light
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(i=0;i<inst.res.length;i++){
    var rs=inst.res[i], R2=mulberry32(rs.s);
    var bx=rs.x*W, by=rs.y*H;
    var pal=VOICES[rs.v].colors;
    var k=6+Math.floor(R2()*5);
    for(var m=0;m<k;m++){
      var ox=(R2()-0.5)*0.055*S;
      var len=(0.03+R2()*0.09)*S*rs.e*(1+inst.pulse*1.6);
      var lw=0.8+R2()*1.4;
      var col=pal[Math.floor(R2()*3)];
      var shim=RM?1:(0.72+0.28*Math.sin(t*0.002*(0.5+R2())+R2()*6.28));
      specLine(ctx,bx+ox,by,len,lw,col,rs.e*0.8*shim,inst.grating);
    }
    glowDot(ctx,bx,by,1.6,pal[0],rs.e);
  }
  ctx.restore();

  // occulter
  eclipse(ctx,C.x,C.y,r,{fill:'#0b0a16',rimA:0.34,innerArcs:r>60,
    coronaA0:Math.atan2(inst.pointer.y*H-C.y,inst.pointer.x*W-C.x),
    coronaSpan:1.0, coronaK:0.35+inst.pulse*0.9+inst.speed*0.15,
    coronaCol:VOICES[inst.voice].colors[0]});

  // shock ring
  if(inst.shock>=0){
    var sp=inst.shock/1400;
    ctx.strokeStyle=withA(BONE,(1-sp)*0.35); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(C.x,C.y,r+eo(sp)*S*0.7,0,7); ctx.stroke();
  }

  // rays from the pointer, bending impossibly around the occulter
  var P={x:inst.pointer.x*W,y:inst.pointer.y*H};
  if(!inst.hasPointer && !RM){
    P.x=W*(0.5+0.22*Math.sin(t*0.00021));
    P.y=H*(0.35+0.10*Math.sin(t*0.00013+2));
  }
  var pal2=VOICES[inst.voice].colors;
  var baseA=(inst.hasPointer?0.09:0.05)+inst.speed*0.05+inst.pulse*0.10;
  var K=24, thc=Math.atan2(C.y-P.y,C.x-P.x), spread=1.6;
  var Lmax=Math.hypot(W,H)*1.2;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=1;
  for(i=0;i<K;i++){
    var th=thc+(i/(K-1)-0.5)*spread+(RM?0:Math.sin(t*0.0011+i*1.7)*0.008);
    var d={x:Math.cos(th),y:Math.sin(th)};
    var rel={x:C.x-P.x,y:C.y-P.y};
    var a=rel.x*d.x+rel.y*d.y;
    var b2=d.x*rel.y-d.y*rel.x;
    var col=pal2[i%3];
    ctx.strokeStyle=withA(col,baseA);
    if(a<=0||Math.abs(b2)>=r){
      ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(P.x+d.x*Lmax,P.y+d.y*Lmax); ctx.stroke();
    }else{
      var q=Math.sqrt(r*r-b2*b2);
      var t1=a-q,t2=a+q;
      var E={x:P.x+d.x*t1,y:P.y+d.y*t1};
      var X={x:P.x+d.x*t2,y:P.y+d.y*t2};
      var f1=Math.atan2(E.y-C.y,E.x-C.x), f2=Math.atan2(X.y-C.y,X.x-C.x);
      var dlt=f2-f1;
      while(dlt>Math.PI) dlt-=TAU;
      while(dlt<-Math.PI) dlt+=TAU;
      ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(E.x,E.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(C.x,C.y,r,f1,f1+dlt,dlt<0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X.x,X.y); ctx.lineTo(X.x+d.x*Lmax,X.y+d.y*Lmax); ctx.stroke();
      if(i%4===0) glowDot(ctx,E.x,E.y,1.1,col,baseA*4);
    }
  }
  ctx.restore();

  // the source
  glowDot(ctx,P.x,P.y,2.6,pal2[0],(inst.hasPointer?0.9:0.5)+inst.pulse*0.4);

  // caption
  ctx.fillStyle=withA(BONE,0.38); ctx.font='500 10px '+SANS; ctx.textBaseline='alphabetic';
  tracked(ctx,'NOCTURNE — Atlas Observatory',W-18,26,2.5,'right');

  // grain
  var pat=ctx.createPattern(grainTile,'repeat');
  if(pat){ ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.35;
    ctx.fillStyle=pat; ctx.fillRect(0,0,W,H); ctx.restore(); }
}

/* ============================== modes & transition ============================== */
var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
var transport=document.getElementById('transport');
var hint=document.getElementById('hint');
var playBtn=document.getElementById('playBtn'), replayBtn=document.getElementById('replayBtn');
var playIco=document.getElementById('playIco'), pauseIco=document.getElementById('pauseIco');
var scrub=document.getElementById('scrub'), tCur=document.getElementById('tCur');
var seedVal=document.getElementById('seedVal');

function applyMode(m){
  state.mode=m;
  tabs.forEach(function(b){
    var on=b.dataset.mode===m;
    b.setAttribute('aria-pressed',on?'true':'false');
    b.setAttribute('aria-label',(on?'Current expression: ':'Switch to ')+b.dataset.mode);
  });
  transport.hidden=(m!=='motion');
  hint.hidden=(m!=='instrument');
  updateTransportUI();
}
function updateTransportUI(){
  scrub.value=String(Math.round(motion.time));
  tCur.textContent=fmtTime(motion.time);
  playIco.style.display=motion.playing?'none':'block';
  pauseIco.style.display=motion.playing?'block':'none';
  playBtn.setAttribute('aria-label',motion.playing?'Pause':'Play');
}
function startTransition(to){
  if(RM){ applyMode(to); return; }
  trans={to:to,start:runTime,swapped:false};
}
function renderTransition(){
  if(!trans) return;
  var p=clamp01((runTime-trans.start)/560);
  if(p>=0.5 && !trans.swapped){ applyMode(trans.to); trans.swapped=true; }
  var rr=(p<0.5?eio(p*2):eio(2-p*2))*Math.hypot(W,H)*0.62;
  if(rr>0.5){
    ctx.fillStyle='#040409';
    ctx.beginPath(); ctx.arc(W/2,H/2,rr,0,7); ctx.fill();
    ctx.strokeStyle=withA(BONE,0.3); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(W/2,H/2,rr,0,7); ctx.stroke();
    glowDot(ctx,W/2+rr*0.7071,H/2-rr*0.7071,1.8,PAL.glass[0],0.8);
  }
  if(p>=1) trans=null;
}

/* ============================== UI wiring ============================== */
tabs.forEach(function(b){
  b.addEventListener('click',function(){
    var m=b.dataset.mode;
    if(m===state.mode) return;
    if(m==='motion'){
      if(motion.time>=DUR) motion.time=0;
      if(!RM) motion.playing=true;
    }
    startTransition(m);
  });
});
function updateSeedUI(){ seedVal.textContent=String(identity.seed); }
document.getElementById('seedDown').addEventListener('click',function(){ reseed(Math.max(1,identity.seed-1)); });
document.getElementById('seedUp').addEventListener('click',function(){ reseed(identity.seed+1); });
function reseed(s){
  var m=state.mode, mt=motion.time;
  API.reset(s);
  applyMode(m); motion.time=Math.min(mt,DUR); updateTransportUI();
}

playBtn.addEventListener('click',function(){
  if(motion.playing){ motion.playing=false; }
  else{ if(motion.time>=DUR) motion.time=0; motion.playing=true; }
  updateTransportUI();
});
replayBtn.addEventListener('click',function(){ motion.time=0; motion.playing=true; updateTransportUI(); });
var wasPlaying=false;
scrub.addEventListener('pointerdown',function(){ wasPlaying=motion.playing; motion.playing=false; });
scrub.addEventListener('pointerup',function(){ if(wasPlaying&&motion.time<DUR) motion.playing=true; wasPlaying=false; updateTransportUI(); });
scrub.addEventListener('input',function(){ motion.time=clamp(Number(scrub.value)||0,0,DUR); tCur.textContent=fmtTime(motion.time); });

function evPos(e){
  var rc=cv.getBoundingClientRect();
  return {x:(e.clientX-rc.left)/Math.max(1,rc.width), y:(e.clientY-rc.top)/Math.max(1,rc.height)};
}
cv.addEventListener('pointerdown',function(e){
  if(state.mode!=='instrument') return;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  var p=evPos(e); instPointerDown(p.x,p.y); e.preventDefault();
});
cv.addEventListener('pointermove',function(e){
  if(state.mode!=='instrument') return;
  var p=evPos(e); instPointerMove(p.x,p.y);
});
cv.addEventListener('pointerup',function(){ if(state.mode==='instrument') instPointerUp(); });
cv.addEventListener('pointercancel',function(){ if(state.mode==='instrument') instPointerUp(); });
cv.addEventListener('pointerleave',function(){ if(state.mode==='instrument'){ inst.hasPointer=false; instPointerUp(); } });

window.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='button'||tag==='select'||tag==='textarea') return;
  if(state.mode==='instrument'){
    if(e.key==='1'||e.key==='2'||e.key==='3'){ instSetVoice(Number(e.key)-1); e.preventDefault(); }
    else if(e.key===' '){ instPulse(); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ inst.grating=clamp(inst.grating-0.08,-0.9,0.9); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ inst.grating=clamp(inst.grating+0.08,-0.9,0.9); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ inst.diskR=clamp(inst.diskR+0.012,0.07,0.30); e.preventDefault(); }
    else if(e.key==='ArrowDown'){ inst.diskR=clamp(inst.diskR-0.012,0.07,0.30); e.preventDefault(); }
  }else if(state.mode==='motion'){
    if(e.key===' '){
      if(motion.playing) motion.playing=false;
      else{ if(motion.time>=DUR) motion.time=0; motion.playing=true; }
      updateTransportUI(); e.preventDefault();
    }
    else if(e.key==='ArrowLeft'){ API.seek(motion.time-500); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ API.seek(motion.time+500); e.preventDefault(); }
  }
});

/* ============================== public API ============================== */
var API={
  reset:function(seed){
    var s=Number(seed);
    s=Number.isFinite(s)?Math.abs(Math.trunc(s)):1810;
    if(s===0) s=1810;
    identity=buildIdentity(s);
    grainTile=makeGrain(s);
    motion.time=0; motion.playing=false;
    resetInstrument();
    instSetVoice(inst.voice);
    applyMode('poster');
    updateSeedUI(); updateTransportUI();
    return API.snapshot();
  },
  setMode:function(name){
    if(name!=='poster'&&name!=='motion'&&name!=='instrument') return false;
    trans=null;
    applyMode(name);
    return true;
  },
  seek:function(ms){
    var v=Number(ms);
    if(!Number.isFinite(v)) v=0;
    motion.time=clamp(v,0,DUR);
    if(motion.time>=DUR) motion.playing=false;
    updateTransportUI();
    return motion.time;
  },
  snapshot:function(){
    return {
      seed:identity.seed,
      mode:state.mode,
      reducedMotion:RM,
      identity:{ signature:identity.signature, slitAngle:r3(identity.slitAngle) },
      motion:{ time:motion.time, duration:DUR, playing:motion.playing },
      instrument:{
        voice:inst.voice,
        voiceName:VOICES[inst.voice].name,
        grating:r3(inst.grating),
        occulterRadius:r3(inst.diskR),
        pulse:r3(inst.pulse),
        pointer:{x:r3(inst.pointer.x),y:r3(inst.pointer.y)},
        resonatorCount:inst.res.length,
        resonators:inst.res.map(function(r){
          return {x:r3(r.x),y:r3(r.y),voice:r.v,energy:r3(r.e)};
        })
      }
    };
  },
  runSelfTest:function(){
    var tests=[];
    function T(name,pass,detail){ tests.push({name:name,pass:!!pass,detail:String(detail)}); }
    var keep={seed:identity.seed,mode:state.mode,time:motion.time,playing:motion.playing};
    try{
      // deterministic reset
      API.reset(777); var s1=JSON.stringify(API.snapshot());
      API.reset(777); var s2=JSON.stringify(API.snapshot());
      T('deterministic reset',s1===s2,'two resets with seed 777 produce identical snapshots');
      // seed changes identity
      API.reset(778); var s3=API.snapshot();
      T('seed changes identity',s3.identity.signature!==JSON.parse(s1).identity.signature,
        'signatures for seeds 777/778 differ');
      // modes
      ['poster','motion','instrument'].forEach(function(m){
        var ok=API.setMode(m);
        T('mode: '+m,ok&&API.snapshot().mode===m,'setMode returned '+ok+', snapshot.mode='+API.snapshot().mode);
      });
      T('invalid mode rejected',API.setMode('hologram')===false&&API.snapshot().mode==='instrument',
        'setMode("hologram") returns false and mode is unchanged');
      // exact seeking
      API.setMode('motion');
      API.seek(4321);
      T('exact seek',API.snapshot().motion.time===4321,'seek(4321) → time '+API.snapshot().motion.time);
      API.seek(11999);
      T('exact seek near end',API.snapshot().motion.time===11999,'seek(11999) → time '+API.snapshot().motion.time);
      // boundaries
      API.seek(99999);
      T('seek clamps high',API.snapshot().motion.time===12000,'seek(99999) → '+API.snapshot().motion.time);
      T('play halts at boundary',API.snapshot().motion.playing===false,'playing=false at 12000');
      API.seek(-250);
      T('seek clamps low',API.snapshot().motion.time===0,'seek(-250) → '+API.snapshot().motion.time);
      T('duration is 12000',API.snapshot().motion.duration===12000,'reported duration '+API.snapshot().motion.duration);
      // instrument interaction through the real state functions
      API.setMode('instrument');
      instPointerDown(0.30,0.40);
      for(var i=1;i<=12;i++){
        instPointerMove(0.30+i*0.045,0.40+Math.sin(i*0.8)*0.14);
        instUpdate(16);
      }
      instPointerUp();
      instSetVoice(2); instPulse();
      for(i=0;i<20;i++) instUpdate(16);
      var snap=API.snapshot();
      T('instrument responds',snap.instrument.resonatorCount>0&&snap.instrument.voice===2,
        snap.instrument.resonatorCount+' resonators sown, voice '+snap.instrument.voiceName);
      var numCount=0, allFinite=true;
      (function walk(v){
        if(typeof v==='number'){ numCount++; if(!Number.isFinite(v)) allFinite=false; }
        else if(Array.isArray(v)) v.forEach(walk);
        else if(v&&typeof v==='object') Object.keys(v).forEach(function(k){walk(v[k]);});
      })(snap);
      T('finite numeric state',allFinite&&numCount>20,numCount+' numbers checked, all finite='+allFinite);
      var jsonOk=true;
      try{ JSON.parse(JSON.stringify(snap)); }catch(e){ jsonOk=false; }
      T('snapshot JSON-safe',jsonOk,'snapshot round-trips through JSON');
    }catch(err){
      T('no exceptions',false,String(err&&err.message||err));
    }
    // restore prior state
    try{
      API.reset(keep.seed); API.setMode(keep.mode);
      API.seek(keep.time); motion.playing=keep.playing&&keep.time<DUR;
      updateTransportUI();
    }catch(err){}
    var passed=tests.every(function(t){return t.pass;});
    return {passed:passed,tests:tests};
  }
};
window.__LIVING_IDENTITY__=API;

/* ============================== main loop ============================== */
function size(){
  var r=stage.getBoundingClientRect();
  W=Math.max(1,r.width); H=Math.max(1,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
}
if(window.ResizeObserver){ new ResizeObserver(size).observe(stage); }
window.addEventListener('resize',size);

var lastT=performance.now();
function frame(now){
  var dt=clamp(now-lastT,0,50); // cap deltas; tab suspension cannot corrupt the timeline
  lastT=now; runTime+=dt;
  if(state.mode==='motion'&&motion.playing){
    motion.time+=dt;
    if(motion.time>=DUR){ motion.time=DUR; motion.playing=false; }
    updateTransportUI();
  }
  if(state.mode==='instrument') instUpdate(dt);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(state.mode==='poster') renderPoster();
  else if(state.mode==='motion') renderMotion(motion.time);
  else renderInstrument();
  renderTransition();
  requestAnimationFrame(frame);
}

/* init */
identity=buildIdentity(1810);
grainTile=makeGrain(1810);
resetInstrument();
instSetVoice(0);
size();
applyMode('poster');
updateSeedUI();
requestAnimationFrame(frame);
})();
</script>
</body>
