<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GPT-5.6 Luna</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #111923;
      --ink-soft: #26333c;
      --paper: #e8dfc9;
      --paper-dim: #bcae91;
      --red: #b83a35;
      --red-bright: #da5545;
      --ochre: #d39a45;
      --teal: #4e8580;
      --blue: #182735;
      --line: rgba(232, 223, 201, .24);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .film-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      background: var(--ink);
      isolation: isolate;
    }
    #filmCanvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--ink);
    }
    .signature {
      position: absolute;
      top: clamp(16px, 3vw, 34px);
      left: clamp(18px, 4vw, 60px);
      z-index: 3;
      margin: 0;
      color: rgba(232, 223, 201, .8);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 1.5vw, 23px);
      font-weight: 400;
      letter-spacing: .03em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .28);
      pointer-events: none;
    }
    .film-chrome {
      --chrome-opacity: .15;
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 4;
      padding: 12px clamp(12px, 4vw, 58px) max(16px, env(safe-area-inset-bottom));
      opacity: var(--chrome-opacity);
      transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
      transform: translateY(0);
      background: linear-gradient(180deg, rgba(17, 25, 35, 0), rgba(17, 25, 35, .75) 35%, rgba(17, 25, 35, .96));
    }
    .film-chrome:hover, .film-chrome:focus-within, .film-chrome.is-awake {
      --chrome-opacity: 1;
    }
    .timeline-wrap { position: relative; padding-top: 23px; }
    .timeline-line {
      position: relative;
      height: 3px;
      border-radius: 2px;
      background: rgba(232, 223, 201, .22);
    }
    .timeline-progress {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: 2px;
      background: var(--red-bright);
      box-shadow: 0 0 12px rgba(218, 85, 69, .35);
      pointer-events: none;
    }
    #scrubber {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      height: 18px;
      margin: 0;
      cursor: ew-resize;
      opacity: 0;
      accent-color: var(--red-bright);
    }
    #scrubber:focus-visible { opacity: .42; outline: 1px solid var(--paper); outline-offset: 3px; }
    .scene-markers { position: absolute; inset: 0 0 auto; height: 21px; }
    .scene-marker {
      position: absolute;
      top: 8px;
      width: 12px;
      height: 12px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(232, 223, 201, .45);
      cursor: pointer;
      transform: translateX(-50%);
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }
    .scene-marker:hover, .scene-marker:focus-visible { background: var(--paper); transform: translateX(-50%) scale(1.25); box-shadow: 0 0 0 4px rgba(232, 223, 201, .12); }
    .scene-marker.is-active { background: var(--red-bright); box-shadow: 0 0 0 3px rgba(218, 85, 69, .18); }
    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      margin-top: 7px;
    }
    .control-group { display: flex; align-items: center; gap: 4px; }
    .control-button, .speed-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(232, 223, 201, .26);
      border-radius: 6px;
      background: rgba(17, 25, 35, .38);
      color: rgba(232, 223, 201, .86);
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    .control-button:hover, .control-button:focus-visible, .speed-button:hover, .speed-button:focus-visible { border-color: rgba(232, 223, 201, .8); background: rgba(232, 223, 201, .1); color: var(--paper); }
    .control-button:active, .speed-button:active { transform: translateY(1px) scale(.98); }
    .control-button[aria-pressed="true"], .speed-button.is-active { border-color: var(--red-bright); color: var(--paper); background: rgba(184, 58, 53, .48); }
    .control-button .icon { font-size: 16px; line-height: 1; }
    .speed-button { min-width: 34px; padding: 0 8px; font-size: 12px; }
    .time-readout {
      margin-left: auto;
      color: rgba(232, 223, 201, .75);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .shot-readout {
      min-width: 100px;
      color: rgba(232, 223, 201, .67);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: .02em;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; }
    @media (max-width: 620px) {
      .film-chrome { padding-right: 12px; padding-left: 12px; }
      .control-row { gap: 5px; }
      .control-button, .speed-button { min-width: 32px; padding: 0 7px; }
      .shot-readout { display: none; }
      .time-readout { font-size: 10px; }
      .signature { top: 13px; left: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .film-chrome { transition: none; }
    }
  </style>
</head>
<body>
  <main class="film-shell" id="filmShell" aria-label="An illustrated browser film">
    <canvas id="filmCanvas" aria-label="Animated Little Red Riding Hood film. Use the film controls or keyboard to navigate."></canvas>
    <h1 class="signature">GPT-5.6 Luna</h1>

    <section class="film-chrome" id="filmChrome" aria-label="Film controls">
      <div class="timeline-wrap">
        <div class="scene-markers" id="sceneMarkers" aria-label="Sequence markers"></div>
        <div class="timeline-line"><div class="timeline-progress" id="timelineProgress"></div></div>
        <label class="sr-only" for="scrubber">Film timeline</label>
        <input id="scrubber" type="range" min="0" max="112000" step="1" value="0" aria-label="Film timeline">
      </div>
      <div class="control-row">
        <div class="control-group">
          <button class="control-button" id="playButton" type="button" aria-label="Play film" aria-pressed="false"><span class="icon" aria-hidden="true">▶</span></button>
          <button class="control-button" id="replayButton" type="button" aria-label="Replay from the beginning"><span class="icon" aria-hidden="true">↺</span></button>
        </div>
        <div class="control-group" aria-label="Playback speed">
          <button class="speed-button" type="button" data-speed="0.5">0.5×</button>
          <button class="speed-button is-active" type="button" data-speed="1">1×</button>
          <button class="speed-button" type="button" data-speed="2">2×</button>
        </div>
        <button class="control-button" id="captionsButton" type="button" aria-label="Toggle captions" aria-pressed="true">CC</button>
        <div class="shot-readout" id="shotReadout" aria-live="polite">The Basket</div>
        <div class="time-readout" id="timeReadout">0:00 / 1:52</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('filmCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const shell = document.getElementById('filmShell');
      const chrome = document.getElementById('filmChrome');
      const scrubber = document.getElementById('scrubber');
      const progressEl = document.getElementById('timelineProgress');
      const playButton = document.getElementById('playButton');
      const replayButton = document.getElementById('replayButton');
      const captionsButton = document.getElementById('captionsButton');
      const timeReadout = document.getElementById('timeReadout');
      const shotReadout = document.getElementById('shotReadout');
      const markerHost = document.getElementById('sceneMarkers');

      const W = 1600;
      const H = 900;
      const DURATION = 112000;
      const DEFAULT_SEED = 1812;
      const TAU = Math.PI * 2;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const shots = [
        { index: 0, name: 'The Basket', start: 0, end: 9000 },
        { index: 1, name: 'The Red Departure', start: 9000, end: 18000 },
        { index: 2, name: 'The Forest Threshold', start: 18000, end: 27000 },
        { index: 3, name: 'The Wolf Appears', start: 27000, end: 38000 },
        { index: 4, name: 'The Question', start: 38000, end: 47000 },
        { index: 5, name: 'The Race', start: 47000, end: 57000 },
        { index: 6, name: "At Grandmother's Door", start: 57000, end: 66000 },
        { index: 7, name: 'The Disguise', start: 66000, end: 75000 },
        { index: 8, name: 'Red Arrives', start: 75000, end: 84000 },
        { index: 9, name: 'What Big…', start: 84000, end: 95000 },
        { index: 10, name: 'The Rescue', start: 95000, end: 104000 },
        { index: 11, name: 'The Path Home', start: 104000, end: 112000 }
      ];

      let seed = DEFAULT_SEED;
      let filmTime = 0;
      let playing = false;
      let speed = 1;
      let captions = true;
      let lastWallTime = 0;
      let rafId = 0;
      let chromeTimer = 0;
      let viewW = 0;
      let viewH = 0;
      let dpr = 1;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const lerp = (a, b, t) => a + (b - a) * t;
      const inv = (t) => 1 - t;
      const easeIn = (t) => t * t;
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOut = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const smooth = (t) => t * t * (3 - 2 * t);
      const pulse = (t, freq = 1) => (Math.sin(t * TAU * freq) + 1) / 2;
      const safeNumber = (value, fallback = 0) => Number.isFinite(value) ? value : fallback;

      function hashInt(value) {
        let x = (value | 0) ^ (seed | 0);
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
        return (x ^ (x >>> 16)) >>> 0;
      }
      function noise(index) { return hashInt(index) / 4294967295; }
      function seeded(index, min = 0, max = 1) { return min + noise(index) * (max - min); }
      function sceneForTime(time) {
        const t = clamp(time, 0, DURATION);
        for (let i = 0; i < shots.length; i += 1) {
          const shot = shots[i];
          if (t < shot.end || i === shots.length - 1) return shot;
        }
        return shots[shots.length - 1];
      }
      function localProgress(shot, time) { return clamp((time - shot.start) / (shot.end - shot.start), 0, 1); }
      function rgba(hex, alpha) {
        const value = hex.replace('#', '');
        const r = parseInt(value.slice(0, 2), 16);
        const g = parseInt(value.slice(2, 4), 16);
        const b = parseInt(value.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }
      function roundRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }
      function fillPath(points, fill, stroke = null, lineWidth = 1) {
        ctx.beginPath();
        points.forEach((point, index) => index ? ctx.lineTo(point[0], point[1]) : ctx.moveTo(point[0], point[1]));
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
      }
      function line(points, stroke, lineWidth = 2, cap = 'round') {
        ctx.beginPath();
        points.forEach((point, index) => index ? ctx.lineTo(point[0], point[1]) : ctx.moveTo(point[0], point[1]));
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = cap;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
      function circle(x, y, radius, fill, stroke = null, lineWidth = 1) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
      }
      function ellipse(x, y, rx, ry, fill, stroke = null, lineWidth = 1, rotation = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
        ctx.restore();
      }
      function text(value, x, y, size, color, align = 'left', family = 'Georgia, serif', weight = '400') {
        ctx.font = `${weight} ${size}px ${family}`;
        ctx.textAlign = align;
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = color;
        ctx.fillText(value, x, y);
      }
      function paperGrain(indexOffset = 0, alpha = .05) {
        ctx.save();
        ctx.globalAlpha = alpha;
        for (let i = 0; i < 180; i += 1) {
          const x = seeded(indexOffset + i * 3, 0, W);
          const y = seeded(indexOffset + i * 3 + 1, 0, H);
          const radius = seeded(indexOffset + i * 3 + 2, .4, 2.5);
          circle(x, y, radius, i % 3 === 0 ? '#f0dfb9' : '#08121b');
        }
        ctx.restore();
      }
      function hatch(x, y, width, height, color, spacing = 16, alpha = .25, lean = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        for (let i = -height; i < width + height; i += spacing) {
          ctx.beginPath();
          ctx.moveTo(x + i, y + height);
          ctx.lineTo(x + i + height * lean, y);
          ctx.stroke();
        }
        ctx.restore();
      }
      function drawSun(x, y, radius, color, phase = 0) {
        circle(x, y, radius, color);
        for (let i = 0; i < 12; i += 1) {
          const a = i * TAU / 12 + phase;
          line([[x + Math.cos(a) * (radius + 18), y + Math.sin(a) * (radius + 18)], [x + Math.cos(a) * (radius + 32), y + Math.sin(a) * (radius + 32)]], rgba(color, .65), 4);
        }
      }
      function drawCloud(x, y, scale, color, drift = 0) {
        ctx.save();
        ctx.translate(x + drift, y);
        circle(0, 13 * scale, 24 * scale, color);
        circle(26 * scale, 4 * scale, 31 * scale, color);
        circle(58 * scale, 15 * scale, 22 * scale, color);
        ctx.fillStyle = color;
        ctx.fillRect(-4 * scale, 13 * scale, 70 * scale, 24 * scale);
        ctx.restore();
      }
      function drawTree(x, ground, scale, palette = {}) {
        const trunk = palette.trunk || '#23393b';
        const bark = palette.bark || '#17282e';
        const leaves = palette.leaves || '#315e59';
        const light = palette.light || '#4d8171';
        ctx.save();
        ctx.translate(x, ground);
        ctx.scale(scale, scale);
        fillPath([[-46, 0], [-30, -182], [-6, -260], [18, -180], [42, 0]], trunk, bark, 6);
        line([[-16, -120], [-92, -204]], bark, 9);
        line([[18, -150], [88, -222]], bark, 9);
        circle(-58, -274, 65, leaves, bark, 5);
        circle(8, -316, 76, light, bark, 5);
        circle(77, -268, 61, leaves, bark, 5);
        circle(30, -227, 79, leaves, bark, 5);
        circle(-75, -224, 42, light, bark, 5);
        ctx.restore();
      }
      function drawPine(x, ground, scale, color, shadow = '#16252b') {
        ctx.save();
        ctx.translate(x, ground);
        ctx.scale(scale, scale);
        fillPath([[-10, 0], [-9, -132], [10, -132], [12, 0]], shadow);
        fillPath([[-80, -48], [0, -250], [82, -48]], color, shadow, 5);
        fillPath([[-100, -4], [0, -186], [110, -4]], color, shadow, 5);
        line([[-56, -74], [32, -74]], rgba('#e7c979', .3), 4);
        ctx.restore();
      }
      function drawPathRibbon(points, fill, outline = null) {
        ctx.save();
        ctx.beginPath();
        points.forEach((point, index) => index ? ctx.lineTo(point[0], point[1]) : ctx.moveTo(point[0], point[1]));
        ctx.strokeStyle = outline || fill;
        ctx.lineWidth = 112;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.strokeStyle = fill;
        ctx.lineWidth = 94;
        ctx.stroke();
        ctx.restore();
      }
      function drawLeaves(x, y, count, scale, color, phase, id = 0) {
        for (let i = 0; i < count; i += 1) {
          const xx = x + seeded(id + i * 5, -140, 140) * scale + Math.sin(phase * 1.2 + i) * 4;
          const yy = y + seeded(id + i * 5 + 1, -80, 80) * scale + Math.cos(phase + i) * 3;
          const rot = seeded(id + i * 5 + 2, -1, 1);
          ctx.save();
          ctx.translate(xx, yy);
          ctx.rotate(rot);
          fillPath([[0, -9 * scale], [12 * scale, 0], [0, 9 * scale], [-12 * scale, 0]], color);
          ctx.restore();
        }
      }
      function drawBasket(x, y, scale = 1, lid = 0, accent = '#a96d3d') {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ellipse(0, 0, 70, 30, '#b77d49', '#4b3429', 7);
        ctx.save();
        ctx.beginPath(); ctx.ellipse(0, 0, 70, 30, 0, 0, TAU); ctx.clip();
        for (let i = -60; i <= 60; i += 14) line([[i, -34], [i + 18, 34]], rgba('#f2c882', .65), 5);
        for (let i = -25; i <= 25; i += 14) line([[-75, i], [75, i + 8]], rgba('#643f2d', .45), 4);
        ctx.restore();
        if (lid < .7) {
          ctx.save();
          ctx.rotate(-.16 * lid);
          ellipse(0, -26 - lid * 16, 72, 24, '#c99454', '#4b3429', 7);
          ctx.restore();
          circle(-20, -33 - lid * 12, 10, '#e7c979', '#4b3429', 3);
          ellipse(18, -34 - lid * 11, 14, 5, '#dca44e', '#4b3429', 3);
        }
        ctx.restore();
      }
      function drawRed(x, ground, scale = 1, phase = 0, options = {}) {
        const look = options.look || 0;
        const basket = options.basket !== false;
        const walking = options.walking !== false;
        const stride = walking ? Math.sin(phase * TAU) * 16 : 0;
        const sway = walking ? Math.sin(phase * TAU * 2) * 3 : Math.sin(phase * TAU) * 1.5;
        ctx.save();
        ctx.translate(x, ground);
        ctx.scale(scale, scale);
        ellipse(0, 4, 42, 9, rgba('#08121b', .32));
        line([[-17, -50], [-18 + stride, 0]], '#1a2a38', 12);
        line([[16, -50], [15 - stride, 0]], '#1a2a38', 12);
        ellipse(-21 + stride, 4, 18, 7, '#101c25', '#0b141a', 3);
        ellipse(19 - stride, 4, 18, 7, '#101c25', '#0b141a', 3);
        fillPath([[-42, -128], [35, -126], [49, -38], [0, -18], [-52, -42]], '#182b3a', '#111923', 7);
        fillPath([[-34, -116], [-81, -63], [-43, -43], [2, -84]], '#b83a35', '#6e2529', 7);
        ctx.save(); ctx.translate(0, sway); ctx.rotate(look * .06);
        circle(2, -151, 31, '#ddac7a', '#111923', 6);
        fillPath([[-43, -154], [2, -223], [46, -152], [26, -137], [-24, -137]], '#c84338', '#6e2529', 7);
        line([[-21, -177], [17, -167]], rgba('#f0a45d', .7), 4);
        circle(12 + look * 5, -151, 3.5, '#111923');
        line([[18, -134], [32, -129]], '#6e312a', 3);
        ctx.restore();
        if (basket) drawBasket(65, -54 + Math.sin(phase * TAU) * 2, .65, options.lid == null ? 1 : options.lid);
        ctx.restore();
      }
      function drawMother(x, ground, scale = 1, phase = 0, basketClose = 0) {
        ctx.save(); ctx.translate(x, ground); ctx.scale(scale, scale);
        ellipse(0, 4, 57, 10, rgba('#08121b', .28));
        fillPath([[-47, -152], [42, -155], [64, 0], [-58, 0]], '#f1e7cf', '#17242b', 7);
        fillPath([[-36, -146], [30, -146], [0, -80]], '#d6a461', '#8b5e40', 4);
        circle(0, -188, 31, '#dcae7e', '#17242b', 6);
        fillPath([[-38, -196], [-18, -245], [24, -237], [38, -194], [20, -179], [-31, -181]], '#6f4c44', '#17242b', 6);
        line([[-27, -165], [-40 + Math.sin(phase * TAU) * 4, -119]], '#dcae7e', 11);
        line([[26, -165], [50 - Math.sin(phase * TAU) * 5, -113]], '#dcae7e', 11);
        if (basketClose > 0) drawBasket(5, -104, .82, basketClose);
        ctx.restore();
      }
      function drawWolf(x, ground, scale = 1, phase = 0, options = {}) {
        const running = options.running === true;
        const alert = options.alert === true;
        const stride = running ? Math.sin(phase * TAU) * 26 : Math.sin(phase * TAU) * 3;
        const blink = pulse(phase * .5 + .13, 1) > .92;
        ctx.save();
        ctx.translate(x, ground);
        ctx.scale(scale, scale);
        ellipse(0, 6, 92, 15, rgba('#071018', .4));
        fillPath([[-108, -82], [-76, -144], [-6, -160], [80, -125], [110, -62], [63, -24], [-74, -29]], '#4b5960', '#101923', 8);

          marker.type = 'button';
          marker.style.left = `${(shot.start / DURATION) * 100}%`;
          marker.title = `${shot.index + 1}. ${shot.name}`;
          marker.setAttribute('aria-label', `Go to sequence ${shot.index + 1}, ${shot.name}`);
          marker.addEventListener('click', () => { wakeChrome(); seekScene(shot.index); });
          markerHost.appendChild(marker);
        });
      }

      playButton.addEventListener('click', () => { wakeChrome(); playing ? pause() : play(); });
      replayButton.addEventListener('click', () => { wakeChrome(); reset(DEFAULT_SEED); });
      captionsButton.addEventListener('click', () => { wakeChrome(); setCaptions(!captions); });
      document.querySelectorAll('[data-speed]').forEach((button) => button.addEventListener('click', () => { wakeChrome(); setSpeed(button.dataset.speed); }));
      scrubber.addEventListener('input', () => { wakeChrome(); seek(scrubber.value); });
      ['pointermove', 'pointerdown', 'focusin', 'keydown'].forEach((eventName) => shell.addEventListener(eventName, wakeChrome, { passive: true }));
      document.addEventListener('keydown', (event) => {
        if (event.target && ['INPUT', 'BUTTON'].includes(event.target.tagName) && event.key !== 'Home') return;
        if (event.key === ' ') { event.preventDefault(); playing ? pause() : play(); wakeChrome(); }
        if (event.key === 'ArrowLeft') { event.preventDefault(); seek(filmTime - 4000); wakeChrome(); }
        if (event.key === 'ArrowRight') { event.preventDefault(); seek(filmTime + 4000); wakeChrome(); }
        if (event.key === 'Home') { event.preventDefault(); reset(DEFAULT_SEED); wakeChrome(); }
      });
      document.addEventListener('visibilitychange', () => { lastWallTime = performance.now(); });
      window.addEventListener('resize', resizeCanvas, { passive: true });
      makeMarkers();
      resizeCanvas();

      window.__RED_HOOD_FILM__ = { reset, play, pause, seek, seekScene, setSpeed, setCaptions, getShotList: () => shots.map((shot) => ({ ...shot })), snapshot, runSelfTest };
      reset(DEFAULT_SEED);
    })();
  </script>
</body>
</html>
