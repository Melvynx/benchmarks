<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Fable 5</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#131009;overflow:hidden;font-family:Georgia,'Iowan Old Style',Palatino,serif;color:#e9ddc7}
  #stage{position:fixed;inset:0}
  #film{position:absolute;inset:0;width:100%;height:100%;display:block}
  #marquee{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:11px;font-weight:400;
    letter-spacing:.42em;text-transform:uppercase;color:rgba(233,221,199,.48);pointer-events:none;z-index:3}
  #ui{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(940px,94vw);z-index:4;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-radius:14px;
    background:rgba(19,15,10,.62);border:1px solid rgba(233,221,199,.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:opacity .6s ease}
  #ui.idle{opacity:0}
  #ui:focus-within{opacity:1}
  #ui button{appearance:none;border:0;background:transparent;color:#e9ddc7;cursor:pointer;border-radius:9px;
    min-width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:13px;padding:0 8px}
  #ui button:hover{background:rgba(233,221,199,.12)}
  #ui button:focus-visible{outline:2px solid #c8503c;outline-offset:2px}
  #ui button[aria-pressed="true"]{background:rgba(200,80,60,.28);color:#ffe9d2}
  #ui svg{width:15px;height:15px;fill:currentColor}
  #time{font-size:12.5px;letter-spacing:.06em;color:rgba(233,221,199,.85);min-width:86px;text-align:center;
    font-variant-numeric:tabular-nums}
  #scrub{position:relative;flex:1 1 220px;height:36px;display:flex;align-items:center;min-width:170px}
  #range{width:100%;accent-color:#c8503c;cursor:pointer;height:20px;background:transparent}
  #marks{position:absolute;left:8px;right:8px;top:1px;height:10px;pointer-events:none}
  #marks button{position:absolute;pointer-events:auto;width:9px;height:9px;min-width:9px;padding:0;
    transform:translateX(-50%) rotate(45deg);border-radius:2px;background:rgba(233,221,199,.42);border:0}
  #marks button:hover{background:#e9ddc7}
  #marks button:focus-visible{outline:2px solid #c8503c;outline-offset:1px}
  #speeds{display:flex;gap:2px;border:1px solid rgba(233,221,199,.16);border-radius:9px;padding:2px}
  #speeds button{min-width:34px;height:28px;font-size:12px}
  @media (max-width:640px){
    #ui{gap:4px;padding:7px 8px;bottom:10px}
    #time{min-width:74px;font-size:11.5px}
    #scrub{order:10;flex-basis:100%}
  }
  @media (prefers-reduced-motion: reduce){ #ui{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="film"></canvas>
  <h1 id="marquee">Claude Fable 5</h1>
  <div id="ui" aria-label="Film controls">
    <button id="bPlay" aria-label="Pause" title="Play/Pause (Space)">
      <svg id="icPlay" viewBox="0 0 16 16" style="display:none"><path d="M3 1.6v12.8L14 8z"/></svg>
      <svg id="icPause" viewBox="0 0 16 16"><path d="M3 2h3.6v12H3zM9.4 2H13v12H9.4z"/></svg>
    </button>
    <button id="bReplay" aria-label="Replay from beginning" title="Replay (Home)">
      <svg viewBox="0 0 16 16"><path d="M8 2.5V.2L4.4 3.4 8 6.6V4.1a4.4 4.4 0 1 1-4.4 4.4H2A6 6 0 1 0 8 2.5z"/></svg>
    </button>
    <div id="time" aria-hidden="true">0:00 / 1:52</div>
    <div id="scrub">
      <input id="range" type="range" min="0" max="112000" step="50" value="0" aria-label="Film timeline">
      <div id="marks"></div>
    </div>
    <div id="speeds" role="group" aria-label="Playback speed">
      <button data-sp="0.5" aria-pressed="false" title="Half speed">&frac12;&times;</button>
      <button data-sp="1" aria-pressed="true" title="Normal speed">1&times;</button>
      <button data-sp="2" aria-pressed="false" title="Double speed">2&times;</button>
    </div>
    <button id="bCC" aria-pressed="true" aria-label="Captions" title="Captions">CC</button>
  </div>
</div>
<script>
"use strict";
(function(){
/* ============================================================
   Claude Fable 5 — Little Red Riding Hood, an illustrated film
   One canvas, one deterministic clock, twelve sequences.
   ============================================================ */
const W=1600, H=900, DUR=112000, DEFAULT_SEED=1812, TAU=Math.PI*2;
const SCENES=[
  {name:'The Basket',start:0,end:9000},
  {name:'The Red Departure',start:9000,end:18000},
  {name:'The Forest Threshold',start:18000,end:27000},
  {name:'The Wolf Appears',start:27000,end:38000},
  {name:'The Question',start:38000,end:47000},
  {name:'The Race',start:47000,end:57000},
  {name:"At Grandmother's Door",start:57000,end:66000},
  {name:'The Disguise',start:66000,end:75000},
  {name:'Red Arrives',start:75000,end:84000},
  {name:'What Big…',start:84000,end:95000},
  {name:'The Rescue',start:95000,end:104000},
  {name:'The Path Home',start:104000,end:112000}
];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const CUTS=[
  [0,3500,6500,9000],
  [0,4500,7000,9000],
  [0,4000,6500,9000],
  [0,3000,5000,8000,9600,11000],
  [0,3000,5500,7300,9000],
  [0,2000,3800,5300,6500,7500,8300,8900,9400,9700,10000],
  [0,2500,5000,9000],
  [0,2200,3800,5600,7200,9000],
  [0,2500,5200,7000,9000],
  [0,1800,3600,5400,7200,9200,11000],
  [0,1400,2600,4600,6600,9000],
  [0,3200,8000]
];
const CAPS=[
  {a:3200,b:8600,who:'mother',text:'“Stay on the path, and do not linger.”'},
  {a:35200,b:37950,who:'wolf',text:'“Good morning, little traveler. Where does this path take you?”'},
  {a:38500,b:41600,who:'red',text:'“To Grandmother’s cottage — beneath the three old oaks.”'},
  {a:84300,b:86050,who:'red',text:'“Grandmother, what big eyes you have.”'},
  {a:86350,b:88050,who:'wolf',text:'“All the better to see you with.”'},
  {a:88350,b:89950,who:'red',text:'“Grandmother, what big ears you have.”'},
  {a:90150,b:91650,who:'wolf',text:'“All the better to hear you with.”'},
  {a:91850,b:93350,who:'red',text:'“Grandmother, what big teeth you have.”'},
  {a:93550,b:94950,who:'wolf',text:'“All the better to eat you with!”'},
  {a:107600,b:111400,who:'narr',text:'She stayed on the path, and did not linger.'}
];
const KNOCK=[0,230,460,1050]; // the little knock rhythm — the wolf imitates it, Red owns it

/* ---------- state ---------- */
const state={seed:DEFAULT_SEED,time:0,playing:true,speed:1,captions:true,ended:false};
let world=null, needsRender=true;
let MOTION=1; // 0 when prefers-reduced-motion
const mqRM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function readMotion(){ MOTION=(mqRM&&mqRM.matches)?0:1; needsRender=true; }
if(mqRM){ if(mqRM.addEventListener)mqRM.addEventListener('change',readMotion); readMotion(); }

/* ---------- math ---------- */
const sat=v=>v<0?0:v>1?1:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=sat(t);return t*t*(3-2*t);};
const rt=(t,a,b)=>sat((t-a)/(b-a));
const eio=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eo=t=>{t=sat(t);return 1-Math.pow(1-t,3);};
const ei=t=>{t=sat(t);return t*t*t;};
function shotOf(u,cuts){ let i=cuts.length-2; for(let k=0;k<cuts.length-1;k++){ if(u<cuts[k+1]){i=k;break;} } return [i,u-cuts[i],cuts[i+1]-cuts[i]]; }
function seqIndexAt(t){ if(t>=DUR)return 11; for(let i=11;i>=0;i--){ if(t>=SCENES[i].start)return i; } return 0; }

/* ---------- deterministic randomness ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return h>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rngFor(seed,label){ return mulberry32(xmur3(seed+':'+label)()); }
function h32i(i,salt){let h=Math.imul((i|0)^0x9e3779b9,0x85ebca6b)^Math.imul((salt|0)+0x165667b1,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>16;return(h>>>0)/4294967296;}
function vn(x,salt){const i=Math.floor(x),f=x-i;const a=h32i(i,salt),b=h32i(i+1,salt);return a+(b-a)*(f*f*(3-2*f));}
const vnc=(x,salt)=>vn(x,salt)*2-1;
function blinkAt(t,salt){const p=2600+h32i(salt,77)*2600;const ph=(t+h32i(salt,78)*p)%p;const d=140;return ph>p-d?1-Math.abs(((ph-(p-d))/d)*2-1):0;}

/* ---------- color ---------- */
const rgba=(r,g,b,a)=>'rgba('+r+','+g+','+b+','+(a==null?1:a)+')';
function cmix(a,b,t){t=sat(t);return rgba(Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t)));}
function cmixA(a,b,t,al){t=sat(t);return rgba(Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t)),al);}

/* ---------- world (rebuilt per seed) ---------- */
function buildWorld(seed){
  const w={seed:seed};
  {const r=rngFor(seed,'oaks');
   w.oaks=[0,1,2].map(function(){return{
     lean:(r()-.5)*.24,
     blobs:Array.from({length:6},function(){return{dx:(r()-.5)*180,dy:-150-r()*110,r:44+r()*40,sh:r()};}),
     limbs:Array.from({length:3},function(){return{a:-1.9+r()*1.4,l:80+r()*70};})};});}
  {const r=rngFor(seed,'forest');
   w.far=Array.from({length:16},function(){return{x:r()*2400-400,w:9+r()*8,lean:(r()-.5)*.06,s:r()};});
   w.mid=Array.from({length:11},function(){return{x:r()*2400-400,w:20+r()*16,lean:(r()-.5)*.09,s:r()};});
   w.near=Array.from({length:7},function(){return{x:r()*2400-400,w:46+r()*30,lean:(r()-.5)*.07,s:r()};});}
  {const r=rngFor(seed,'edge');
   w.edge=Array.from({length:20},function(){return{x:1130+r()*720,w:16+r()*30,lean:(r()-.5)*.1,s:r()};});}
  {const r=rngFor(seed,'meadow');
   w.meadowFlowers=Array.from({length:70},function(){return{x:r()*1700-50,y:660+r()*220,k:(r()*3)|0,ph:r()*TAU,h:10+r()*16};});}
  {const r=rngFor(seed,'clearing');
   w.clearFlowers=Array.from({length:150},function(){return{x:60+r()*1480,y:560+r()*310,k:(r()*4)|0,ph:r()*TAU,h:16+r()*30};});}
  {const r=rngFor(seed,'houses');
   w.houses=Array.from({length:7},function(i){return{x:70+i*62+r()*26,w:52+r()*40,h:40+r()*34,ro:r()};});}
  {const r=rngFor(seed,'dapple');
   w.dapples=Array.from({length:13},function(){return{x:r()*1600,y:520+r()*360,rx:60+r()*130,ry:20+r()*36,ph:r()*TAU};});}
  {const r=rngFor(seed,'birds');
   w.birds=Array.from({length:6},function(){return{y:120+r()*180,ph:r()*TAU,v:.028+r()*.02};});}
  {const r=rngFor(seed,'bramble');
   w.brambles=Array.from({length:24},function(){return{x:r()*1900-150,y:520+r()*380,r:60+r()*120,a:r()*TAU};});}
  // film grain tile
  const gc=document.createElement('canvas');gc.width=gc.height=192;
  const gg=gc.getContext('2d');const im=gg.createImageData(192,192);const gr=rngFor(seed,'grain');
  for(let i=0;i<im.data.length;i+=4){const v=(gr()*255)|0;im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=16;}
  gg.putImageData(im,0,0);
  w.grain=gc; w.grainPat=null;
  return w;
}

/* ---------- canvas ---------- */
const canvas=document.getElementById('film');
const ctx=canvas.getContext('2d');
let dpr=1,cw=0,ch=0,fs=1,fx=0,fy=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth;ch=window.innerHeight;
  canvas.width=Math.max(2,cw*dpr);canvas.height=Math.max(2,ch*dpr);
  fs=Math.min(cw/W,ch/H);fx=(cw-W*fs)/2;fy=(ch-H*fs)/2;
  needsRender=true;
}
window.addEventListener('resize',resize);

/* ---------- primitives ---------- */
function frameFill(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H);}
function skyV(stops){const g=ctx.createLinearGradient(0,0,0,H);for(let i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function band(y,amp,salt,color,step){step=step||46;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-520,H+20);ctx.lineTo(-520,y+vnc(-520*0.004,salt)*amp);for(let x=-520;x<=W+520;x+=step)ctx.lineTo(x,y+vnc(x*0.004,salt)*amp);ctx.lineTo(W+520,H+20);ctx.closePath();ctx.fill();}
function glowDisc(x,y,r,inner,outer){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,inner);g.addColorStop(1,outer);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function ribbonPath(pts,w0,w1,color){
  if(pts.length<2)return;
  ctx.fillStyle=color;ctx.beginPath();
  const L=[],R=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[Math.min(i+1,pts.length-1)],o=pts[Math.max(i-1,0)];
    let dx=q.x-o.x,dy=q.y-o.y;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    const w=lerp(w0,w1,i/(pts.length-1))/2;
    L.push({x:p.x-dy*w,y:p.y+dx*w});R.push({x:p.x+dy*w,y:p.y-dx*w});
  }
  ctx.moveTo(L[0].x,L[0].y);
  for(let i=1;i<L.length;i++)ctx.lineTo(L[i].x,L[i].y);
  for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);
  ctx.closePath();ctx.fill();
}
function pathPt(pts,p){
  p=sat(p);const n=pts.length-1;const f=p*n;const i=Math.min(n-1,Math.floor(f));const u=f-i;
  return{x:lerp(pts[i].x,pts[i+1].x,u),y:lerp(pts[i].y,pts[i+1].y,u)};
}
function shotCam(o,t){
  const m=MOTION,hd=(o.hand||0)*m;
  const dx=vnc(t*0.0016,3)*9*hd,dy=vnc(t*0.0016,7)*7*hd,dr=vnc(t*0.0012,9)*0.005*hd;
  ctx.translate(W/2,H/2);ctx.rotate((o.rot||0)+dr);
  const z=o.z==null?1:o.z;const zz=1+(z-1)*(MOTION?1:0.4);
  ctx.scale(zz,zz);ctx.translate(-(o.cx==null?W/2:o.cx)+dx,-(o.cy==null?H/2:o.cy)+dy);
}
function vignette(a){
  const g=ctx.createRadialGradient(W/2,H*0.46,H*0.42,W/2,H*0.5,H*0.86);
  g.addColorStop(0,'rgba(10,8,10,0)');g.addColorStop(1,'rgba(10,8,10,'+a+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function grain(t){
  if(!world.grainPat)world.grainPat=ctx.createPattern(world.grain,'repeat');
  const fr=MOTION?Math.floor(t/90):0;
  const gx=h32i(fr,21)*192,gy=h32i(fr,22)*192;
  ctx.save();ctx.globalAlpha=0.5;ctx.translate(-gx,-gy);ctx.fillStyle=world.grainPat;
  ctx.fillRect(gx-192,gy-192,W+384,H+384);ctx.restore();
}

/* ---------- characters ---------- */
function redFace(o){
  const x=o.x,y=o.y,r=o.r,m=o.mood||0;
  const lk=o.look||{x:0,y:0};const bl=o.blink||0;
  ctx.fillStyle='#f6cfa6';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle='#8a4b2c';ctx.lineWidth=r*0.14;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x-r*0.2,y-r*0.62,r*0.5,Math.PI*1.05,Math.PI*1.8);ctx.stroke();
  ctx.fillStyle='rgba(224,120,96,.45)';
  ctx.beginPath();ctx.ellipse(x-r*0.5,y+r*0.32,r*0.2,r*0.12,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+r*0.52,y+r*0.32,r*0.2,r*0.12,0,0,TAU);ctx.fill();
  const eh=Math.max(0.02,r*0.15*(1-bl)*(m<=-2?1.5:1));
  ctx.fillStyle='#3a2a22';
  for(let s=-1;s<=1;s+=2){
    const ex=x+s*r*0.34+lk.x*r*0.09,ey=y-r*0.04+lk.y*r*0.07;
    if(m<=-2){ctx.fillStyle='#fff6ea';ctx.beginPath();ctx.ellipse(ex,ey,r*0.15,r*0.17,0,0,TAU);ctx.fill();ctx.fillStyle='#3a2a22';}
    ctx.beginPath();ctx.ellipse(ex,ey,r*0.085,eh,0,0,TAU);ctx.fill();
  }
  ctx.strokeStyle='#6d4530';ctx.lineWidth=r*0.06;
  const ba=m<0?0.35:m>0?-0.08:0.08;
  for(let s=-1;s<=1;s+=2){
    ctx.beginPath();
    ctx.moveTo(x+s*r*0.19,y-r*0.3+(m<0?-s*0:0)+ba*r*(s<0?1:1)*0.2-((m<0)?0:0));
    ctx.lineTo(x+s*r*0.48,y-r*(m<0?0.24:0.34));
    ctx.stroke();
  }
  ctx.strokeStyle='#8a4030';ctx.lineWidth=r*0.07;
  if(m<=-2){ctx.fillStyle='#7c3527';ctx.beginPath();ctx.ellipse(x+r*0.04,y+r*0.5,r*0.11,r*0.16,0,0,TAU);ctx.fill();}
  else if(m>=1){ctx.beginPath();ctx.arc(x+r*0.03,y+r*0.4,r*0.22,0.25,Math.PI-0.25);ctx.stroke();}
  else if(m<0){ctx.beginPath();ctx.moveTo(x-r*0.12,y+r*0.55);ctx.quadraticCurveTo(x+r*0.05,y+r*0.46,x+r*0.2,y+r*0.53);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(x-r*0.1,y+r*0.5);ctx.lineTo(x+r*0.14,y+r*0.5);ctx.stroke();}
}
function hoodCU(x,y,r,o,t){
  o=o||{};
  ctx.save();
  ctx.fillStyle='#b23327';
  ctx.beginPath();
  ctx.moveTo(x-r*1.34,y+r*0.85);
  ctx.bezierCurveTo(x-r*1.85,y-r*0.85,x-r*1.0,y-r*2.05,x+r*0.32,y-r*1.42);
  ctx.bezierCurveTo(x+r*1.2,y-r*1.0,x+r*1.34,y+r*0.15,x+r*0.9,y+r*0.95);
  ctx.quadraticCurveTo(x,y+r*1.28,x-r*1.34,y+r*0.85);
  ctx.fill();
  ctx.fillStyle='rgba(94,22,16,.5)';
  ctx.beginPath();
  ctx.moveTo(x-r*1.34,y+r*0.85);
  ctx.bezierCurveTo(x-r*1.85,y-r*0.85,x-r*1.0,y-r*2.05,x+r*0.32,y-r*1.42);
  ctx.bezierCurveTo(x-r*0.5,y-r*1.28,x-r*1.05,y-r*0.5,x-r*0.98,y+r*0.62);
  ctx.closePath();ctx.fill();
  redFace({x:x+r*0.22,y:y+r*0.02,r:r*0.8,mood:o.mood,look:o.look,blink:o.blink==null?blinkAt(t||0,5):o.blink});
  ctx.strokeStyle='#7e211a';ctx.lineWidth=r*0.14;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x+r*0.22,y+r*0.02,r*0.95,-1.25,1.35);ctx.stroke();
  if(o.bow!==false){
    ctx.fillStyle='#c8402f';
    ctx.beginPath();ctx.ellipse(x+r*0.05,y+r*1.06,r*0.24,r*0.13,-0.4,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.45,y+r*1.06,r*0.24,r*0.13,0.4,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.25,y+r*1.05,r*0.08,0,TAU);ctx.fill();

function trunkV(x,yTop,yBot,w,lean,c){
  ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(x-w/2,yBot);
  ctx.bezierCurveTo(x-w*0.42+lean*30,lerp(yBot,yTop,0.4),x-w*0.3+lean*70,lerp(yBot,yTop,0.8),x-w*0.24+lean*100,yTop);

  ctx.closePath();ctx.fill();
}
function oakDraw(x,y,s,o,cols,t){

  ctx.fillStyle=cols.trunk;
  ctx.beginPath();
  ctx.moveTo(-26,0);ctx.bezierCurveTo(-20,-70,-14,-120,-6+o.lean*40,-190);
  ctx.lineTo(10+o.lean*40,-190);ctx.bezierCurveTo(16,-120,22,-70,28,0);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=cols.trunk;ctx.lineWidth=12;ctx.lineCap='round';
  for(let i=0;i<o.limbs.length;i++){
    const L=o.limbs[i];

    ctx.quadraticCurveTo(Math.cos(L.a)*L.l*0.5,-140-i*24+Math.sin(L.a)*L.l*0.5,Math.cos(L.a)*L.l,-150-i*24+Math.sin(L.a)*L.l*0.6);

function firSil(x,y,s,c){
  ctx.fillStyle=c;
  for(let i=0;i<3;i++){
    const w=42*s*(1-i*0.22),hh=52*s*(1-i*0.12),yy=y-i*38*s;
    ctx.beginPath();ctx.moveTo(x-w,yy);ctx.lineTo(x,yy-hh);ctx.lineTo(x+w,yy);ctx.closePath();ctx.fill();
  }
  ctx.fillRect(x-4*s,y-2,8*s,26*s);
}
function smoke(x,y,t,s,a){
  for(let i=0;i<4;i++){
    const p=((t*0.00006+i*0.25)%1);
    const sx=x+vnc(p*6+i,71)*22*s*(0.4+p);
    const sy=y-p*90*s;
    ctx.fillStyle='rgba(232,226,214,'+(a*(1-p)*0.5)+')';
    ctx.beginPath();ctx.arc(sx,sy,(5+p*16)*s,0,TAU);ctx.fill();

function motes(t,n,box,a){

  for(let i=0;i<n;i++){
    const mx=box.x+h32i(i,91)*box.w+vnc(t*0.0004+i,92)*18;
    const my=box.y+((h32i(i,93)*box.h+t*0.008*(0.3+h32i(i,94)))%box.h);
    const tw=0.4+0.6*vn(t*0.003+i,95);

function flowerHead(x,y,r,k,glow){
  const cols=['#d8483a','#e9c766','#e8e2d2','#c987c1'];
  if(glow){glowDisc(x,y,r*2.4,'rgba(255,236,180,.25)','rgba(255,236,180,0)');}
  ctx.fillStyle=cols[k%4];
  for(let i=0;i<5;i++){
    const a=i/5*TAU-0.3;
    ctx.beginPath();ctx.ellipse(x+Math.cos(a)*r*0.62,y+Math.sin(a)*r*0.62,r*0.46,r*0.3,a,0,TAU);ctx.fill();
  }
  ctx.fillStyle='#a8642a';ctx.beginPath();ctx.arc(x,y,r*0.3,0,TAU);ctx.fill();

function flowerField(arr,t,scale,swayA){
  for(let i=0;i<arr.length;i++){
    const F=arr[i];
    const sw=MOTION?Math.sin(t*0.0016+F.ph)*swayA:0;
    const hh=F.h*scale;
    ctx.strokeStyle='#54763c';ctx.lineWidth=1.6*scale;
    ctx.beginPath();ctx.moveTo(F.x,F.y);ctx.quadraticCurveTo(F.x+sw*0.5,F.y-hh*0.6,F.x+sw,F.y-hh);ctx.stroke();
    flowerHead(F.x+sw,F.y-hh,4.6*scale*(0.8+ (F.k%3)*0.2),F.k,false);
  }
}
function butterfly(t,x0,y0,c,ph){
  const bx=x0+vnc(t*0.0009+ph,101)*90,by=y0+vnc(t*0.0011+ph,102)*60;
  const fl2=Math.sin(t*0.03+ph)*0.9;

  ctx.beginPath();ctx.ellipse(-4,0,5,2.6+2.4*Math.abs(fl2),0.6*fl2,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(4,0,5,2.6+2.4*Math.abs(fl2),-0.6*fl2,0,TAU);ctx.fill();
  ctx.restore();

function dapples(t,alpha,drift){
  for(let i=0;i<world.dapples.length;i++){
    const d=world.dapples[i];
    const dx=MOTION?vnc(t*0.0005+d.ph,111)*40*drift:0;
    const g=ctx.createRadialGradient(d.x+dx,d.y,0,d.x+dx,d.y,d.rx);
    g.addColorStop(0,'rgba(255,238,190,'+alpha+')');g.addColorStop(1,'rgba(255,238,190,0)');

function lightShaft(x,yTop,wTop,wBot,yBot,a,warm){
  const g=ctx.createLinearGradient(x,yTop,x,yBot);
  const c=warm?'255,226,160':'214,228,244';
  g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x-wTop/2,yTop);ctx.lineTo(x+wTop/2,yTop);ctx.lineTo(x+wBot/2,yBot);ctx.lineTo(x-wBot/2,yBot);ctx.closePath();ctx.fill();
}
function quiltPat(x,y,w,h,cell){
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle='#e9e1cd';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#cbbfa4';ctx.lineWidth=1;
  for(let gx=x;gx<=x+w;gx+=cell){ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);ctx.stroke();}
  for(let gy=y;gy<=y+h;gy+=cell){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();}
  let row=0;
  for(let gy=y;gy<y+h;gy+=cell,row++){
    let col=0;
    for(let gx=x;gx<x+w;gx+=cell,col++){
      const cxp=gx+cell/2,cyp=gy+cell/2;
      if((row+col)%2===0){
        ctx.strokeStyle='#7d9169';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(cxp,cyp+cell*0.24);ctx.lineTo(cxp,cyp-cell*0.22);ctx.stroke();
        ctx.fillStyle='#7d9169';
        ctx.beginPath();ctx.ellipse(cxp-cell*0.12,cyp-cell*0.05,cell*0.1,cell*0.16,0.6,0,TAU);ctx.fill();
        ctx.beginPath();ctx.ellipse(cxp+cell*0.12,cyp-cell*0.05,cell*0.1,cell*0.16,-0.6,0,TAU);ctx.fill();
      }else{
        ctx.fillStyle='#b3573f';
        ctx.beginPath();ctx.arc(cxp,cyp,cell*0.09,0,TAU);ctx.fill();
        ctx.beginPath();ctx.arc(cxp-cell*0.14,cyp+cell*0.1,cell*0.07,0,TAU);ctx.fill();
        ctx.beginPath();ctx.arc(cxp+cell*0.14,cyp+cell*0.1,cell*0.07,0,TAU);ctx.fill();
      }
    }
  }
  // the red thread runs through the quilt border
  ctx.strokeStyle='rgba(178,51,39,.8)';ctx.lineWidth=1.6;ctx.setLineDash([6,5]);
  ctx.strokeRect(x+4,y+4,w-8,h-8);ctx.setLineDash([]);
  ctx.restore();
}

/* ---------- prop continuity (single source of truth) ---------- */
function propsAt(t){
  const P={};
  P.door = t<61600?0
    : t<63000?lerp(0,0.5,eio(rt(t,61600,63000)))
    : t<63600?lerp(0.5,0.35,rt(t,63000,63600))
    : t<76600?0.35
    : t<77600?lerp(0.35,0.75,eio(rt(t,76600,77600)))
    : t<97600?0.75
    : t<97900?lerp(0.75,1,eo(rt(t,97600,97900)))
    : 1;
  P.wardrobe = t<62150?0.12
    : t<62300?lerp(0.12,0,rt(t,62150,62300))
    : t<101800?0
    : t<102400?lerp(0,0.9,eio(rt(t,101800,102400)))
    : 0.9;
  P.cup = t<64000?'upright':'tipped';
  P.quilt = t<64600?'bed' : t<66300?'slip' : t<95400?'wolf' : t<104000?'floor' : 'gran';
  P.winCurtain = t<71600?0 : t<72200?lerp(0,0.7,rt(t,71600,72200)) : t<100900?0.7 : 0.2;
  P.bedCurtain = t<70000?0 : t<70600?lerp(0,0.55,rt(t,70000,70600)) : t<84200?0.55 : 0;
  P.specs = t<69600?'stand' : t<95600?'wolf' : t<102900?'floor' : 'gran';
  P.cap = t<66600?'none' : t<95300?'wolf' : 'floor';
  P.chair = t<95900?'up':'fallen';
  P.basket = t<79300?'red' : t<104000?'table' : 'red';
  P.winBroken = t>=101000;
  P.shawlFloor = t>=63900;
  P.bow = t>=4500;
  return P;
}
function lightLabel(t){
  return t<18000?'warm village morning':t<27000?'threshold gold':t<47000?'uncertain forest'
    :t<57000?'split light — clearing and shadow':t<84000?'cold cottage':t<95000?'closing shadow'
    :t<104000?'breaking open':'changed dawn';
}

const PATH_PTS=[{x:170,y:690},{x:420,y:660},{x:760,y:692},{x:1120,y:642},{x:1460,y:668}];
function scnVillage(t,o){

  if(dawn)skyV([[0,'#e8a9a2'],[0.35,'#f2c4a4'],[0.62,'#f9e2bb'],[1,'#e8cfa8']]);

  band(660,14,33,dawn?'#a8825f':'#a8a95d');
  band(700,18,34,dawn?'#8f7a52':'#7c9a52');
  // forest wall right
  ctx.fillStyle=dawn?'#6b5a52':'#3f5442';
  ctx.beginPath();ctx.moveTo(1180,720);
  for(let x=1180;x<=W+30;x+=52)ctx.lineTo(x,520+vnc(x*0.01,35)*40-((x-1180)*0.12));
  ctx.lineTo(W+30,720);ctx.closePath();ctx.fill();
  for(let i=0;i<5;i++)firSil(1260+i*80,640,1.1+ (i%2)*0.3,dawn?'#5c4c46':'#33452f');
  if(!dawn){
    ctx.fillStyle='rgba(38,48,40,.28)';
    ctx.beginPath();ctx.moveTo(1180,720);ctx.lineTo(980,700);ctx.lineTo(1140,660);ctx.lineTo(1300,690);ctx.closePath();ctx.fill();
  }
  band(760,10,36,dawn?'#7d6a4a':'#6f8d4a');
  // the path — and the red thread that lives along its edge
  const pp=[];for(let i=0;i<=24;i++)pp.push(pathPt(PATH_PTS,i/24));
  ribbonPath(pp,26,46,dawn?'#e8c9a0':'#e3cfa2');
  ctx.save();ctx.globalAlpha=dawn?0.85:0.4;
  ctx.strokeStyle='#b23327';ctx.lineWidth=dawn?3:2;ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<=24;i++){const q=pathPt(PATH_PTS,i/24);if(i===0)ctx.moveTo(q.x,q.y-14);else ctx.lineTo(q.x+vnc(i*0.6,37)*4,q.y-14+vnc(i,38)*3);}

function knockAnim(su,t0){
  let paw=0,shake=0;
  for(let i=0;i<KNOCK.length;i++){
    const d=su-(t0+KNOCK[i]);
    if(d>-140&&d<0)paw=Math.max(paw,1-(-d/140));

  return{paw:paw,shake:shake};
}

/* ---------- captions + chapter labels ---------- */
function drawCaptions(t){
  if(!state.captions)return;
  for(let i=0;i<CAPS.length;i++){
    const c=CAPS[i];
    if(t<c.a-250||t>c.b+250)continue;
    const a=Math.min(rt(t,c.a-250,c.a),1-rt(t,c.b,c.b+250));
    if(a<=0)continue;
    const col=c.who==='wolf'?'#e8c27a':c.who==='mother'?'#f2dfbe':c.who==='narr'?'#e9ddc7':'#f6d7c9';
    ctx.save();ctx.globalAlpha=a;
    ctx.font=(c.who==='narr'?'italic 400 30px ':'italic 600 31px ')+'Georgia, "Times New Roman", serif';
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    const wpx=Math.min(1500,ctx.measureText(c.text).width);
    ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=10;ctx.shadowOffsetY=2;
    ctx.fillStyle=col;
    ctx.fillText(c.text,800,H-62,1500);
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle='rgba(190,60,44,'+(0.85*a)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(800-wpx*0.3,H-44);ctx.quadraticCurveTo(800,H-40,800+wpx*0.3,H-44);ctx.stroke();
    ctx.restore();
  }
}
function drawChapter(t){
  const k=seqIndexAt(t),sq=SCENES[k],u=t-sq.start;
  if(u>2100)return;
  const a=Math.min(rt(u,120,480),1-rt(u,1650,2100));
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=a*0.92;
  try{ctx.letterSpacing='4px';}catch(e){}
  ctx.font='600 20px Georgia, serif';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=7;
  ctx.fillStyle='#efe3cb';
  ctx.fillText((ROMAN[k]+' · '+sq.name).toUpperCase(),64,96);
  ctx.shadowBlur=0;
  try{ctx.letterSpacing='0px';}catch(e){}
  ctx.restore();
}

/* ---------- the frame ---------- */
function renderFrame(){
  if(!world)return;
  const t=state.time;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#131009';ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.translate(fx,fy);ctx.scale(fs,fs);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  frameFill('#0d0b09');
  const k=seqIndexAt(t),sq=SCENES[k];
  const DIS_AT=104000,DIS_DUR=MOTION?700:160;
  if(k===11&&t>=DIS_AT&&t<DIS_AT+DIS_DUR){
    RENDER[10](8999,103999);
    ctx.save();ctx.globalAlpha=rt(t,DIS_AT,DIS_AT+DIS_DUR);
    RENDER[11](t-sq.start,t);
    ctx.restore();
  }else{
    RENDER[k](t-sq.start,t);
  }
  grain(t);
  vignette(0.1);
  drawCaptions(t);
  drawChapter(t);
  ctx.restore();
  // soft frame edge
  ctx.strokeStyle='rgba(233,221,199,.09)';ctx.lineWidth=1;
  ctx.strokeRect(fx+0.5,fy+0.5,W*fs-1,H*fs-1);
}

/* ---------- deterministic film interface ---------- */
function advance(ms){
  let nt=state.time+ms;
  if(nt>=DUR){nt=DUR;state.ended=true;state.playing=false;}
  state.time=nt;
}
function snapshot(){
  const si=seqIndexAt(state.time),sq=SCENES[si];
  return{
    seed:state.seed,playing:state.playing,speed:state.speed,time:state.time,duration:DUR,
    sequenceIndex:si,sequenceName:sq.name,progress:+(state.time/DUR).toFixed(6),
    captions:state.captions,completed:state.time>=DUR,
    scene:describe(si,state.time-sq.start,state.time)
  };
}
function reset(seed){
  const s=Number.isFinite(+seed)?Math.trunc(+seed):DEFAULT_SEED;
  state.seed=s;world=buildWorld(s);
  state.time=0;state.playing=true;state.speed=1;state.ended=false;
  needsRender=true;renderFrame();syncUI();
  return snapshot();
}
function play(){if(state.time<DUR){state.playing=true;state.ended=false;}syncUI();return snapshot();}
function pause(){state.playing=false;syncUI();return snapshot();}
function seek(ms){
  let v=+ms;if(!Number.isFinite(v))v=0;
  v=Math.max(0,Math.min(DUR,Math.round(v)));
  state.time=v;state.ended=v>=DUR;
  if(state.ended)state.playing=false;
  renderFrame();syncUI();
  return snapshot();
}
function seekScene(i){
  let v=Math.trunc(+i);if(!Number.isFinite(v))v=0;
  v=Math.max(0,Math.min(11,v));
  return seek(SCENES[v].start);
}
function setSpeed(m){if(m===0.5||m===1||m===2)state.speed=m;syncUI();return state.speed;}
function setCaptions(en){state.captions=!!en;renderFrame();syncUI();return state.captions;}
function getShotList(){return SCENES.map(function(s,i){return{index:i,name:s.name,start:s.start,end:s.end};});}
function _step(ms){
  const v=+ms;
  if(Number.isFinite(v)&&v>0&&state.playing&&!state.ended){advance(v*state.speed);renderFrame();syncUI();}
  return snapshot();
}

    }

    ok=true;
    for(let i=0;i<12;i++){

      seek(DUR);
    }catch(err){ok=false;info=String(err);}
    T('renders-at-all-boundaries-and-midpoints',ok,info);
    seek(43210);
    const nums=[];
    (function walk(v){
      if(v===null||v===undefined)return;
      if(typeof v==='number')nums.push(v);
      else if(Array.isArray(v)){for(let i=0;i<v.length;i++)walk(v[i]);}
      else if(typeof v==='object'){const ks=Object.keys(v);for(let i=0;i<ks.length;i++)walk(v[ks[i]]);}
    })(snapshot());
    T('all-numeric-state-finite',nums.length>8&&nums.every(Number.isFinite));
  }catch(err){
    tests.push({name:'unexpected-error',passed:false,info:String(err&&err.message?err.message:err)});
  }
  reset(1812);
  return{passed:tests.every(function(x){return x.passed;}),tests:tests};
}

/* ---------- controls ---------- */
const $=function(id){return document.getElementById(id);};
const ui=$('ui'),elTime=$('time'),range=$('range'),bPlay=$('bPlay'),bCC=$('bCC');
let scrubbing=false;
function fmt(ms){const s2=Math.floor(ms/1000);return Math.floor(s2/60)+':'+String(s2%60).padStart(2,'0');}
function tickUI(){
  if(!scrubbing)range.value=String(Math.round(state.time));
  const txt=fmt(state.time)+' / '+fmt(DUR);
  if(elTime.textContent!==txt)elTime.textContent=txt;
  range.setAttribute('aria-valuetext',fmt(state.time)+' of '+fmt(DUR));
}
function syncUI(){
  $('icPlay').style.display=state.playing?'none':'block';
  $('icPause').style.display=state.playing?'block':'none';
  bPlay.setAttribute('aria-label',state.playing?'Pause':'Play');
  bCC.setAttribute('aria-pressed',String(state.captions));
  const sp=document.querySelectorAll('#speeds button');
  for(let i=0;i<sp.length;i++)sp[i].setAttribute('aria-pressed',String(parseFloat(sp[i].dataset.sp)===state.speed));
  if(!state.playing)ui.classList.remove('idle');
  tickUI();
}
function togglePlay(){
  if(state.playing)pause();
  else if(state.time>=DUR)reset(DEFAULT_SEED);
  else play();
}
bPlay.addEventListener('click',togglePlay);
$('bReplay').addEventListener('click',function(){reset(DEFAULT_SEED);});
bCC.addEventListener('click',function(){setCaptions(!state.captions);});
(function(){
  const sp=document.querySelectorAll('#speeds button');
  for(let i=0;i<sp.length;i++){
    sp[i].addEventListener('click',function(e){setSpeed(parseFloat(e.currentTarget.dataset.sp));});
  }
})();
range.addEventListener('input',function(){seek(+range.value);});
range.addEventListener('pointerdown',function(){scrubbing=true;});
window.addEventListener('pointerup',function(){scrubbing=false;});
(function buildMarks(){
  const marks=$('marks');
  for(let i=0;i<12;i++){
    const b=document.createElement('button');
    b.style.left=(SCENES[i].start/DUR*100)+'%';
    b.title=(i+1)+'. '+SCENES[i].name;
    b.setAttribute('aria-label','Go to sequence '+(i+1)+': '+SCENES[i].name);
    (function(idx){b.addEventListener('click',function(){seekScene(idx);});})(i);
    marks.appendChild(b);
  }
})();
window.addEventListener('keydown',function(e){
  const tg=e.target;
  const inCtl=tg&&(tg.tagName==='BUTTON'||tg.tagName==='INPUT');
  if(e.code==='Space'){
    if(inCtl)return;
    e.preventDefault();togglePlay();
  }else if(e.code==='ArrowLeft'){
    if(tg===range)return;
    e.preventDefault();seek(state.time-5000);
  }else if(e.code==='ArrowRight'){
    if(tg===range)return;
    e.preventDefault();seek(state.time+5000);
  }else if(e.code==='Home'){
    e.preventDefault();reset(DEFAULT_SEED);
  }
});
let lastAct=performance.now();
function poke(){lastAct=performance.now();ui.classList.remove('idle');}
window.addEventListener('pointermove',poke,{passive:true});
window.addEventListener('pointerdown',poke,{passive:true});
window.addEventListener('keydown',poke);
window.addEventListener('touchstart',poke,{passive:true});
function idleCheck(now){
  if(state.playing&&now-lastAct>3200&&!ui.contains(document.activeElement))ui.classList.add('idle');
}

/* ---------- clock ---------- */
let lastNow=performance.now();
document.addEventListener('visibilitychange',function(){lastNow=performance.now();});
function loop(now){
  let dt=now-lastNow;lastNow=now;
  if(!(dt>=0))dt=0;if(dt>100)dt=100;
  if(state.playing&&!state.ended){
    advance(dt*state.speed);
    renderFrame();tickUI();
  }else if(needsRender){
    renderFrame();needsRender=false;tickUI();
  }
  idleCheck(now);
  requestAnimationFrame(loop);
}

/* ---------- boot: autoplay from 0, seed 1812, composed first frame ---------- */
world=buildWorld(state.seed);
resize();
syncUI();
renderFrame();
window.__RED_HOOD_FILM__={
  reset:reset,play:play,pause:pause,seek:seek,seekScene:seekScene,
  setSpeed:setSpeed,setCaptions:setCaptions,getShotList:getShotList,
  snapshot:snapshot,runSelfTest:runSelfTest,_step:_step
};
requestAnimationFrame(function(ts){lastNow=ts;requestAnimationFrame(loop);});
})();
</script>
