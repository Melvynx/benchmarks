<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>gpt-5.6-sol</title>
  <style>
    :root {
      --ink: #171714;
      --paper: #ead9b8;
      --red: #a61f28;
      --red-bright: #d13a39;
      --ochre: #bd793e;
      --panel: rgba(17, 16, 14, .82);
      --line: rgba(243, 226, 192, .38);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100f0e; }
    body { color: #f3e2c2; font-family: Georgia, 'Times New Roman', serif; user-select: none; }
    button, input { font: inherit; }
    #film {
      position: fixed; inset: 0; isolation: isolate; overflow: hidden;
      background: radial-gradient(ellipse at center, #29231d 0, #0b0b0a 78%);
      touch-action: manipulation;
    }
    #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #identity {
      position: absolute; z-index: 3; top: max(18px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left));
      margin: 0; color: rgba(255, 238, 203, .78); font: 600 11px/1.1 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase; letter-spacing: .22em; text-shadow: 0 1px 12px #000;
      transition: opacity .7s ease;
    }
    #sequence-tag {
      position: absolute; z-index: 3; top: max(40px, calc(env(safe-area-inset-top) + 22px));
      left: max(22px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 10px;
      color: rgba(255, 238, 203, .7); font: 500 10px/1 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase; letter-spacing: .16em; text-shadow: 0 1px 8px #000;
    }
    #sequence-tag::before { content: ''; width: 18px; height: 1px; background: var(--red-bright); }
    #caption {
      position: absolute; z-index: 4; left: 50%; bottom: clamp(86px, 13vh, 138px); transform: translateX(-50%);
      width: min(820px, calc(100vw - 36px)); min-height: 48px; display: flex; align-items: center; justify-content: center;
      padding: 11px 30px 13px; text-align: center; color: #fff3da; font-size: clamp(16px, 2.1vw, 25px);
      font-style: italic; line-height: 1.24; letter-spacing: .015em; text-wrap: balance;
      opacity: 0; transition: opacity .18s linear; filter: drop-shadow(0 3px 10px rgba(0,0,0,.8));
      pointer-events: none;
    }
    #caption::before, #caption::after {
      content: ''; position: absolute; inset: 0 8px; z-index: -1; background: rgba(20, 16, 13, .74);
      clip-path: polygon(1.5% 10%, 99% 2%, 97.8% 91%, 2.5% 100%);
      border-top: 1px solid rgba(232, 202, 155, .24);
    }
    #caption::after { inset: 5px 0 -3px; opacity: .24; background: #a61f28; transform: rotate(-.35deg); }
    #caption.visible { opacity: 1; }
    #controls {
      position: absolute; z-index: 8; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
      width: min(920px, calc(100vw - 24px)); transform: translateX(-50%);
      padding: 12px 14px 11px; color: #f8e8c7; border: 1px solid rgba(237, 213, 172, .16);
      border-radius: 7px; background: linear-gradient(180deg, rgba(25,22,18,.76), rgba(12,11,10,.91));
      box-shadow: 0 10px 35px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.04);
      backdrop-filter: blur(12px); transition: opacity .55s ease, transform .55s ease;
    }
    #film.idle #controls:not(:focus-within) { opacity: .08; transform: translate(-50%, 8px); }
    #film.idle #identity { opacity: .3; }
    .control-row { display: flex; align-items: center; gap: 8px; }
    .control-row + .control-row { margin-top: 10px; }
    .icon-button, .speed-button, #caption-toggle {
      appearance: none; border: 1px solid rgba(244, 222, 182, .2); color: inherit; background: rgba(255,255,255,.035);
      border-radius: 4px; min-width: 42px; height: 40px; padding: 0 10px; cursor: pointer;
      font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
    }
    .icon-button { font-size: 15px; }
    button:hover, button:focus-visible { background: rgba(186, 46, 48, .22); border-color: rgba(224, 151, 119, .7); outline: none; }
    button:focus-visible, input:focus-visible { box-shadow: 0 0 0 2px #f4d59e; }
    .speed-group { display: flex; gap: 2px; padding: 2px; border: 1px solid rgba(244,222,182,.12); border-radius: 5px; }
    .speed-button { min-width: 38px; height: 30px; border: 0; padding: 0 7px; color: rgba(255,239,207,.62); }
    .speed-button[aria-pressed="true"] { color: #fff4dc; background: #8e2630; }
    #caption-toggle { margin-left: auto; min-width: 42px; }
    #caption-toggle[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
    #timecode { width: 96px; text-align: right; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: rgba(249,231,195,.72); }
    .timeline { position: relative; flex: 1; height: 20px; display: flex; align-items: center; }
    #scrubber { appearance: none; width: 100%; height: 2px; margin: 0; cursor: pointer; background: var(--line); border: 0; border-radius: 0; }
    #scrubber::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; border: 2px solid #f3dfba; border-radius: 50%; background: #9d2530; box-shadow: 0 1px 5px #000; }
    #scrubber::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #f3dfba; border-radius: 50%; background: #9d2530; }
    #markers { position: absolute; inset: 0 6px; pointer-events: none; }
    .marker {
      position: absolute; top: 50%; width: 22px; height: 30px; padding: 0; transform: translate(-50%,-50%);
      border: 0; background: transparent; pointer-events: auto; cursor: pointer;
    }
    .marker::after { content: ''; position: absolute; left: 10px; top: 11px; width: 1px; height: 8px; background: rgba(246,224,184,.62); }
    .marker:hover::after, .marker:focus-visible::after { width: 3px; left: 9px; background: #d94343; }
    .marker:focus-visible { box-shadow: none; outline: 1px solid #f4d59e; }
    #progress-wash { position: absolute; left: 0; top: 9px; height: 2px; background: #a92a31; pointer-events: none; width: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      #controls { padding: 9px 10px; }
      #timecode { width: 75px; font-size: 9px; }
      .speed-button { min-width: 32px; padding: 0 4px; }
      #caption-toggle { font-size: 0; min-width: 36px; padding: 0; }
      #caption-toggle::after { content: 'CC'; font-size: 10px; }
      #caption { bottom: 112px; padding-inline: 18px; }
      .control-row:first-child { gap: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #controls, #identity, #caption { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="film" aria-label="Little Red Riding Hood illustrated browser film">
    <canvas id="screen" aria-label="Animated illustrated film canvas"></canvas>
    <h1 id="identity">gpt-5.6-sol</h1>
    <div id="sequence-tag" aria-live="polite"><span id="sequence-name">The Basket</span></div>
    <div id="caption" role="status" aria-live="polite"></div>
    <nav id="controls" aria-label="Film controls">
      <div class="control-row">
        <button class="icon-button" id="play" type="button" aria-label="Pause">Ⅱ</button>
        <button class="icon-button" id="replay" type="button" aria-label="Replay">↶</button>
        <div class="speed-group" aria-label="Playback speed">
          <button class="speed-button" type="button" data-speed="0.5" aria-pressed="false">½×</button>
          <button class="speed-button" type="button" data-speed="1" aria-pressed="true">1×</button>
          <button class="speed-button" type="button" data-speed="2" aria-pressed="false">2×</button>
        </div>
        <button id="caption-toggle" type="button" aria-label="Toggle captions" aria-pressed="true">CC</button>
        <output id="timecode" aria-live="off">00:00 / 01:52</output>
      </div>
      <div class="control-row">
        <div class="timeline">
          <div id="progress-wash"></div>
          <input id="scrubber" type="range" min="0" max="112000" value="0" step="1" aria-label="Film timeline">
          <div id="markers" aria-label="Sequence markers"></div>
        </div>
      </div>
    </nav>
    <p class="sr-only">Space plays or pauses. Left and right arrow keys seek. Home replays.</p>
  </main>
  <script>
  (() => {
    'use strict';

    const W = 1600, H = 900, DURATION = 112000, DEFAULT_SEED = 1812;
    const SHOTS = [
      ['The Basket', 0, 9000],
      ['The Red Departure', 9000, 18000],
      ['The Forest Threshold', 18000, 27000],
      ['The Wolf Appears', 27000, 38000],
      ['The Question', 38000, 47000],
      ['The Race', 47000, 57000],
      ["At Grandmother's Door", 57000, 66000],
      ['The Disguise', 66000, 75000],
      ['Red Arrives', 75000, 84000],
      ['What Big…', 84000, 95000],
      ['The Rescue', 95000, 104000],
      ['The Path Home', 104000, 112000]
    ].map((s, i) => ({ name:s[0], index:i, start:s[1], end:s[2] }));

    const canvas = document.querySelector('#screen');
    const ctx = canvas.getContext('2d', { alpha: false });
    const film = document.querySelector('#film');
    const playButton = document.querySelector('#play');
    const replayButton = document.querySelector('#replay');
    const captionToggle = document.querySelector('#caption-toggle');
    const scrubber = document.querySelector('#scrubber');
    const markers = document.querySelector('#markers');
    const timecode = document.querySelector('#timecode');
    const captionEl = document.querySelector('#caption');
    const sceneNameEl = document.querySelector('#sequence-name');
    const progressWash = document.querySelector('#progress-wash');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const state = {
      seed: DEFAULT_SEED, time: 0, playing: true, speed: 1, captions: true,
      lastPerf: performance.now(), dragging: false, idleTimer: 0, lastScene: -1
    };

    const TAU = Math.PI * 2;
    const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
    const mix = (a,b,t) => a + (b-a)*t;
    const ease = t => t < .5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const out = t => 1-Math.pow(1-clamp(t),3);
    const inOutSine = t => -(Math.cos(Math.PI*clamp(t))-1)/2;
    const fract = n => n-Math.floor(n);
    const rnd = n => fract(Math.sin((n + state.seed*17.17) * 78.233) * 43758.5453);
    const wave = (time, speed=1, phase=0) => Math.sin(time*.001*speed + phase);
    const path = (commands, fill, stroke, width=1) => {
      ctx.beginPath();
      for (const c of commands) {
        if (c[0] === 'M') ctx.moveTo(c[1],c[2]);
        else if (c[0] === 'L') ctx.lineTo(c[1],c[2]);
        else if (c[0] === 'C') ctx.bezierCurveTo(c[1],c[2],c[3],c[4],c[5],c[6]);
        else if (c[0] === 'Q') ctx.quadraticCurveTo(c[1],c[2],c[3],c[4]);
        else if (c[0] === 'Z') ctx.closePath();
      }
      if (fill) { ctx.fillStyle=fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=width; ctx.stroke(); }
    };
    const ellipse = (x,y,rx,ry,fill,rot=0,stroke=null,width=1) => {
      ctx.beginPath(); ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);
      if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
    };
    const line = (pts, color, width=2, dash=[]) => {
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);
    };
    const rr = (x,y,w,h,r,fill,stroke=null,width=1) => {
      ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
    };
    const label = (text,x,y,size,color,align='left',weight='400',family='Georgia') => {
      ctx.save();ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
      ctx.font=`${weight} ${size}px ${family}`;ctx.fillText(text,x,y);ctx.restore();
    };
    const withTransform = (x,y,s,fn,flip=1,rot=0) => {
      ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s*flip,s);fn();ctx.restore();
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
      canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
      canvas.style.width = w+'px'; canvas.style.height = h+'px';
      render();
    }

    function beginFrame(bg='#191714') {
      const cw=canvas.width, ch=canvas.height;
      ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0b0a';ctx.fillRect(0,0,cw,ch);
      const scale=Math.min(cw/W,ch/H), ox=(cw-W*scale)/2, oy=(ch-H*scale)/2;
      ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
    }
    function finishFrame(tone='rgba(18,12,9,.20)') {
      const g=ctx.createRadialGradient(W*.5,H*.47,H*.14,W*.5,H*.47,W*.9);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.72,'rgba(15,10,8,.08)');g.addColorStop(1,tone);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=.12;
      for(let i=0;i<420;i++){
        const x=rnd(i*2.11)*W,y=rnd(i*3.73+9)*H,a=.05+rnd(i*7.2)*.11;
        ctx.fillStyle=`rgba(238,220,180,${a})`;ctx.fillRect(x,y,1+rnd(i)*1.4,1+rnd(i+4)*1.4);
      }
      ctx.globalAlpha=1;ctx.restore();
      ctx.strokeStyle='rgba(228,203,158,.14)';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
    }

    function sky(top,bottom,horizon=720) {
      const g=ctx.createLinearGradient(0,0,0,horizon);g.addColorStop(0,top);g.addColorStop(1,bottom);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon);
    }
    function paperGlow(x,y,r,color='rgba(255,219,155,.2)') {
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(255,220,160,0)');
      ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
    }
    function ground(y,color,back=null) {
      if(back) path([['M',0,y],['Q',330,y-100,670,y-25],['Q',1130,y+65,1600,y-45],['L',1600,900],['L',0,900],['Z']],back);
      path([['M',0,y+35],['Q',420,y-20,830,y+30],['Q',1240,y+85,1600,y],['L',1600,900],['L',0,900],['Z']],color);
    }
    function redThread(points,alpha=.65,width=5) {
      ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#a6262d';ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();
      ctx.moveTo(points[0][0],points[0][1]);
      for(let i=1;i+2<points.length;i+=3)ctx.bezierCurveTo(points[i][0],points[i][1],points[i+1][0],points[i+1][1],points[i+2][0],points[i+2][1]);
      ctx.stroke();ctx.restore();
    }
    function leaf(x,y,s,color,rot=0) {
      ctx.save();ctx.translate(x,y);ctx.rotate(rot);path([['M',0,0],['Q',s*.55,-s*.35,s,0],['Q',s*.45,s*.42,0,0],['Z']],color);
      line([[s*.12,0],[s*.78,0]],'rgba(42,30,20,.27)',Math.max(1,s*.045));ctx.restore();
    }
    function tree(x,y,s,color='#302c25',crown='#344036',time=0,lean=0) {
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(lean);
      path([['M',-27,0],['C',-19,-105,-34,-190,-18,-284],['C',-8,-331,-20,-370,-9,-420],['L',18,-420],['C',31,-348,17,-320,34,-268],['C',53,-205,32,-116,45,0],['Z']],color,'rgba(12,13,11,.36)',3);
      path([['M',-8,-290],['C',-78,-330,-106,-358,-145,-405],['C',-94,-378,-54,-368,5,-343],['Z']],color);
      path([['M',18,-320],['C',77,-361,100,-398,133,-443],['C',101,-376,78,-331,25,-290],['Z']],color);
      ctx.globalAlpha=.94;
      for(let i=0;i<15;i++){
        const a=i*2.399+wave(time,.23,i)*.018,r=92+(i%4)*31;
        ellipse(Math.cos(a)*r, -390+Math.sin(a)*63, 68+(i%3)*15,43+(i%4)*7,crown,a*.15);
      }
      ctx.globalAlpha=1;ctx.restore();
    }
    function flower(x,y,s,color='#e7ce93',time=0) {
      line([[x,y],[x+wave(time,1,x)*s*.08,y+s*2.5]],'#536044',Math.max(1,s*.12));
      for(let i=0;i<5;i++){const a=i*TAU/5+wave(time,.8,x)*.03;ellipse(x+Math.cos(a)*s*.55,y+Math.sin(a)*s*.55,s*.5,s*.25,color,a);}
      ellipse(x,y,s*.3,s*.3,'#b37b3a');
    }
    function basket(x,y,s=1,light=false) {
      ctx.save();ctx.translate(x,y);ctx.scale(s,s);
      ctx.strokeStyle='#7e4c29';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,-5,42,42,Math.PI,TAU);ctx.stroke();
      path([['M',-52,-8],['Q',-45,70,0,78],['Q',46,71,54,-8],['Z']],light?'#a67c4f':'#9b6337','#5b341f',4);
      ctx.save();ctx.clip();for(let i=-44;i<56;i+=13)line([[i,-4],[i+9,70]],'rgba(247,206,136,.48)',5);for(let y=7;y<68;y+=13)line([[-50,y],[50,y+2]],'rgba(76,44,27,.55)',5);ctx.restore();
      line([[-50,-8],[51,-8]],'#d0a064',8);ctx.restore();
    }
    function drawRed(x,y,s=1,time=0,pose='walk',flip=1,flowers=false) {
      withTransform(x,y,s,()=>{
        const step=(pose==='walk'||pose==='home')?wave(time,8,1):pose==='run'?wave(time,13,1):0;
        const bob=(pose==='walk'||pose==='run'||pose==='home')?Math.abs(step)*-3:wave(time,1.4,2)*1.5;
        ctx.translate(0,bob);
        ctx.lineCap='round';
        line([[-18,93],[-26+step*12,135]],'#252d3b',12);
        line([[15,93],[24-step*12,135]],'#252d3b',12);
        line([[-27+step*12,134],[-8+step*12,134]],'#3a2a25',10);
        line([[23-step*12,134],[40-step*12,134]],'#3a2a25',10);
        path([['M',-32,-2],['Q',-44,50,-29,98],['Q',0,111,32,98],['Q',45,45,29,-3],['Z']],'#263448','#111923',3);
        path([['M',-38,-2],['Q',-58,41,-43,87],['Q',3,111,46,80],['Q',53,30,28,-5],['Z']],'#a6212b','#641a23',4);
        line([[27,14],[46+step*4,61]],'#e2b28c',10);
        line([[-25,15],[-40-step*3,57]],'#e2b28c',10);
        ellipse(0,-28,25,31,'#edc39b',-.07,'#5e342c',2);
        path([['M',-37,-23],['Q',-31,-78,2,-88],['Q',39,-70,39,-22],['Q',27,-45,18,-48],['Q',-5,-55,-20,-28],['Z']],'#ba2932','#671722',4);
        path([['M',-35,-22],['Q',-55,4,-42,31],['L',-14,2],['Z']],'#a51f2b');
        ellipse(9,-28,2.8,3.2,'#2a201b');
        path([['M',15,-10],['Q',7,-5,-1,-10]],null,'#9e5a50',2);
        if(flowers){for(let i=0;i<4;i++)flower(-50+i*7,48-i*4,5,['#d8c775','#c94b47','#e5d7b0','#7d92a0'][i],time);}
        basket(65+step*3,72,.68,pose==='home');
      },flip);
    }
    function drawMother(x,y,s=1,time=0) {
      withTransform(x,y,s,()=>{
        line([[-24,97],[-28,140]],'#41362f',13);line([[23,97],[28,140]],'#41362f',13);
        path([['M',-49,-4],['Q',-58,65,-40,106],['Q',0,125,44,106],['Q',56,57,43,-3],['Z']],'#6f7565','#30352e',4);
        path([['M',-29,8],['Q',-38,69,-22,102],['Q',1,112,25,101],['Q',39,56,29,8],['Z']],'#e9dfc8','#9a8c74',2);
        line([[-39,19],[-62,63]],'#ddaa85',12);line([[38,17],[59,57]],'#ddaa85',12);
        ellipse(0,-31,30,35,'#e4b28d',0,'#634033',2);ellipse(0,-58,34,21,'#5d4637');
        path([['M',-14,-70],['L',4,-62],['L',-10,-53],['Z']],'#aa2931');
        ellipse(-10,-31,3,3,'#30231d');ellipse(11,-31,3,3,'#30231d');
        path([['M',-10,-13],['Q',0,-7,11,-14]],null,'#99584e',2);
      });
    }
    function drawWolf(x,y,s=1,time=0,pose='stand',flip=-1,disguise=0) {
      withTransform(x,y,s,()=>{
        const run=pose==='run'?wave(time,14):0;
        const breathe=wave(time,2.1)*2;
        if(pose==='run'){
          line([[-17,65],[-62-run*18,104]],'#454b4b',16);line([[20,63],[66+run*17,94]],'#3b4142',16);

      state.lastPerf=now;
      state.time=Math.min(DURATION,state.time+wallDelta*state.speed);

    }

    function runSelfTest() {
      const tests=[];
      const test=(name,condition,details='')=>tests.push({name,passed:Boolean(condition),details});
      try {
        reset(77);pause();seek(43210);const a=JSON.stringify(snapshot().scene);
        reset(77);pause();seek(43210);const b=JSON.stringify(snapshot().scene);
        test('deterministic reset and seek',a===b,'same seed and millisecond produce identical scene state');
        test('exact duration',DURATION===112000,String(DURATION));
        test('twelve ordered boundaries',SHOTS.length===12&&SHOTS[0].start===0&&SHOTS[11].end===112000&&SHOTS.every((s,i)=>s.index===i&&s.start<s.end&&(i===0||s.start===SHOTS[i-1].end)),JSON.stringify(SHOTS.map(s=>[s.start,s.end])));
        pause();seek(47001.25);test('exact seeking',state.time===47001.25,String(state.time));
        seekScene(10);test('seekScene',state.time===95000&&sceneIndexAt(state.time)===10,String(state.time));
        pause();const before=state.time;advance(performance.now()+5000);test('pause freezes film time',state.playing===false&&state.time===before,String(state.time));
        reset(DEFAULT_SEED);test('default autoplay and seed',state.seed===1812&&state.time===0&&state.speed===1&&state.playing,'opening state');
        seek(DURATION);test('end state reachability',state.time===112000&&snapshot().completed&&!state.playing,snapshot().sequenceName);
        test('finite numeric state',finiteNumbers(snapshot()),'all numeric snapshot fields are finite');
      } catch(error) { test('self-test execution',false,error instanceof Error?error.message:String(error)); }
      finally { reset(DEFAULT_SEED);setSpeed(1);setCaptions(true);play(); }
      return {passed:tests.length>=8&&tests.every(t=>t.passed),tests};
    }

    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){advance(performance.now());state.lastPerf=NaN;}
      else state.lastPerf=performance.now();
    });
    window.addEventListener('resize',resize,{passive:true});
    reducedMotion.addEventListener?.('change',render);

    function wakeControls() {
      film.classList.remove('idle');clearTimeout(state.idleTimer);
      state.idleTimer=setTimeout(()=>film.classList.add('idle'),2800);
    }
    ['pointermove','pointerdown','touchstart','focusin'].forEach(type=>film.addEventListener(type,wakeControls,{passive:true}));
    SHOTS.forEach(shot=>{
      const button=document.createElement('button');button.type='button';button.className='marker';button.style.left=(shot.start/DURATION*100)+'%';
      button.setAttribute('aria-label',`Sequence ${shot.index+1}: ${shot.name}`);button.title=shot.name;button.addEventListener('click',()=>{pause();seekScene(shot.index);});markers.append(button);
    });

    Object.defineProperty(window,'__RED_HOOD_FILM__',{value:{reset,play,pause,seek,seekScene,setSpeed,setCaptions,getShotList,snapshot,runSelfTest},configurable:false,writable:false});
    updatePressed();resize();wakeControls();requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
