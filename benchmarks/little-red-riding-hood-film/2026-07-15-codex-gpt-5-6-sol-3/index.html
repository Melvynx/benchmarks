<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Codex GPT-5.6 Sol</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #211c1a;
      --paper: #f0dfb6;
      --red: #a61722;
      --ochre: #c68a35;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090c0d;
    }

    body {
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--paper);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, input { font: inherit; }

    .film-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, #18201f 0, #0c1010 54%, #050707 100%);
      isolation: isolate;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      height: min(100dvh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: #111;
      box-shadow: 0 24px 100px #000c, 0 0 0 1px #f2dca21c;
      container-type: inline-size;
      touch-action: manipulation;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #171c18;
    }

    .model-title {
      position: absolute;
      z-index: 4;
      top: 7.4%;
      left: 6.5%;
      max-width: 44%;
      margin: 0;
      color: #38251b;
      font: 600 clamp(22px, 4.6cqw, 72px)/.96 Georgia, "Times New Roman", serif;
      letter-spacing: -.045em;
      text-wrap: balance;
      text-shadow: 0 1px #f6e6b0, 0 3px 16px #4e31132e;
      pointer-events: none;
      transform-origin: left center;
      transition: opacity 420ms var(--ease), transform 650ms var(--ease);
    }

    .model-title.is-gone {
      opacity: 0;
      transform: translateY(-8px);
    }

    .scene-label {
      position: absolute;
      z-index: 5;
      top: clamp(12px, 2.2cqw, 30px);
      right: clamp(14px, 2.6cqw, 38px);
      display: flex;
      align-items: baseline;
      gap: .65em;
      color: #f3e7c7;
      text-shadow: 0 2px 8px #000b;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .scene-number {
      font: 700 clamp(9px, .8cqw, 12px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      opacity: .62;
    }

    .scene-name {
      font: 650 clamp(10px, 1cqw, 15px)/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .caption-wrap {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: clamp(76px, 10.3cqw, 154px);
      width: min(86%, 1120px);
      min-height: 2.5em;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .caption {
      position: relative;
      margin: 0;
      padding: .36em 1.35em .48em;
      color: #f7e8bc;
      font: 600 clamp(15px, 2.1cqw, 32px)/1.28 Georgia, "Times New Roman", serif;
      letter-spacing: .005em;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 2px #0b0907, 0 4px 15px #000;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 180ms ease-out, transform 280ms var(--ease);
    }

    .caption::before,
    .caption::after {
      content: "";
      position: absolute;
      top: 52%;
      width: clamp(18px, 5cqw, 74px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #b32630);
      box-shadow: 0 1px #200b0d;
      opacity: .9;
    }

    .caption::before { right: 100%; }
    .caption::after { left: 100%; transform: scaleX(-1); }
    .caption.is-visible { opacity: 1; transform: translateY(0); }

    .controls {
      position: absolute;
      z-index: 10;
      left: clamp(10px, 2.4cqw, 34px);
      right: clamp(10px, 2.4cqw, 34px);
      bottom: clamp(9px, 1.8cqw, 25px);
      display: grid;
      grid-template-columns: auto auto minmax(180px, 1fr) auto auto;
      grid-template-areas: "play replay timeline speeds captions";
      align-items: center;
      gap: clamp(6px, .85cqw, 13px);
      min-height: 48px;
      padding: clamp(6px, .72cqw, 11px);
      border: 1px solid #f2ddb329;
      border-radius: 4px;
      background:
        linear-gradient(180deg, #1c1b18d9, #0b0c0ce6),
        repeating-linear-gradient(90deg, #fff0 0 5px, #fff1 6px 7px);
      box-shadow: 0 8px 30px #0009, inset 0 1px #fff1;
      backdrop-filter: blur(8px) saturate(.75);
      transition: opacity 460ms var(--ease), transform 460ms var(--ease), background-color 240ms ease;
    }

    .controls.is-idle:not(:focus-within) {
      opacity: .11;
      transform: translateY(8px);
    }

    .stage:hover .controls.is-idle,
    .stage:focus-within .controls.is-idle { opacity: .94; transform: none; }

    .control-button {
      position: relative;
      min-width: 44px;
      min-height: 44px;
      padding: 0 11px;
      border: 1px solid #f5dfb321;
      border-radius: 3px;
      color: #eaddb9;
      background: #f1ddb409;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 120ms ease-out, color 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .control-button:hover { color: #fff5d7; background: #f3dca418; border-color: #f5dfb34c; }
    .control-button:active { transform: scale(.96); }
    .control-button[aria-pressed="true"] { color: #fff0c3; background: #a617224f; border-color: #d84d545f; }

    .control-button:focus-visible,
    .speed-button:focus-visible,
    .marker:focus-visible,
    .scrubber:focus-visible {
      outline: 2px solid #f4cf77;
      outline-offset: 3px;
    }

    .play-button { grid-area: play; width: 46px; padding: 0; }
    .replay-button { grid-area: replay; }
    .caption-button { grid-area: captions; }

    .play-glyph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .play-glyph::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid currentColor;
    }

    .play-button[data-playing="true"] .play-glyph::before {
      width: 11px;
      height: 14px;
      margin-left: 0;
      border: 0;
      background: linear-gradient(90deg, currentColor 0 35%, transparent 35% 65%, currentColor 65%);
    }

    .timeline {
      grid-area: timeline;
      position: relative;
      min-width: 0;
      height: 42px;
      display: grid;
      align-items: center;
      padding: 0 6px;
    }

    .scrubber {
      width: 100%;
      height: 22px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
      z-index: 2;
    }

    .scrubber::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, #b3222e var(--progress, 0%), #d8c89b42 var(--progress, 0%));
      box-shadow: 0 1px #000;
    }

    .scrubber::-moz-range-track { height: 3px; border: 0; background: #d8c89b42; }
    .scrubber::-moz-range-progress { height: 3px; background: #b3222e; }
    .scrubber::-webkit-slider-thumb {
      width: 13px;
      height: 13px;
      margin-top: -5px;
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid #231514;
      border-radius: 50%;
      background: #d83c46;
      box-shadow: 0 0 0 1px #efd9a8, 0 2px 8px #000;
    }

    .scrubber::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 2px solid #efd9a8;
      border-radius: 50%;
      background: #d83c46;
    }

    .markers {
      position: absolute;
      z-index: 3;
      inset: 0 6px;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      top: 50%;
      width: 24px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
    }

    .marker:first-child { transform: translate(0, -50%); }
    .marker:first-child::before { left: 0; }

    .marker::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 11px;
      width: 2px;
      height: 8px;
      border-radius: 1px;
      background: #ebdca961;
      transition: height 140ms ease, top 140ms ease, background 140ms ease;
    }

    .marker:hover::before,
    .marker[aria-current="true"]::before { top: 8px; height: 14px; background: #f2d98f; }

    .speeds {
      grid-area: speeds;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid #f5dfb321;
      border-radius: 3px;
    }

    .speed-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 7px;
      border: 0;
      border-right: 1px solid #f5dfb318;
      color: #cfc29f;
      background: #f1ddb406;
      font-size: 10px;
      font-weight: 750;
      cursor: pointer;
    }

    .speed-button:last-child { border-right: 0; }
    .speed-button:hover { color: #fff2ca; background: #f1ddb410; }
    .speed-button[aria-pressed="true"] { color: #fff4cf; background: #a617224f; }

    .timecode {
      position: absolute;
      right: 5px;
      bottom: -7px;
      color: #d9cba58a;
      font: 650 8px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      pointer-events: none;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 700px), (max-height: 470px) {
      .controls {
        grid-template-columns: auto auto minmax(110px, 1fr) auto;
        grid-template-areas: "play replay timeline captions";
      }
      .speeds {
        position: absolute;
        right: 0;
        bottom: calc(100% + 5px);
        opacity: .9;
      }
      .control-button { min-height: 44px; min-width: 44px; }
      .play-button { width: 46px; }
      .replay-button { padding-inline: 8px; font-size: 8px; }
      .speed-button { min-height: 44px; min-width: 44px; }
      .caption-wrap { bottom: 73px; }
      .caption { max-width: 86%; }
      .scene-name { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .controls, .caption, .model-title, .control-button, .speed-button, .marker::before {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="film-shell" aria-label="Little Red Riding Hood illustrated browser film">
    <section class="stage" id="stage" aria-label="Film stage">
      <canvas id="film" width="1600" height="900" role="img" aria-label="The Basket — morning in Red's village kitchen"></canvas>
      <h1 class="model-title" id="modelTitle">Codex GPT-5.6 Sol</h1>

      <div class="scene-label" aria-hidden="true">
        <span class="scene-number" id="sceneNumber">01 / 12</span>
        <span class="scene-name" id="sceneName">The Basket</span>
      </div>

      <div class="caption-wrap" aria-live="polite" aria-atomic="true">
        <p class="caption" id="caption"></p>
      </div>

      <nav class="controls" id="controls" aria-label="Film controls">
        <button class="control-button play-button" id="playButton" data-playing="true" type="button" aria-label="Pause film" aria-pressed="true" aria-keyshortcuts="Space">
          <span class="play-glyph" aria-hidden="true"></span>
        </button>
        <button class="control-button replay-button" id="replayButton" type="button" aria-label="Replay from the beginning" aria-keyshortcuts="Home">Replay</button>

        <div class="timeline">
          <label class="sr-only" for="scrubber">Film timeline</label>
          <input class="scrubber" id="scrubber" type="range" min="0" max="112000" step="1" value="0" aria-valuetext="0 seconds, The Basket" aria-keyshortcuts="ArrowLeft ArrowRight">
          <div class="markers" id="markers" aria-label="Sequence markers"></div>
          <output class="timecode" id="timecode" for="scrubber">00:00 / 01:52</output>
        </div>

        <div class="speeds" role="group" aria-label="Playback speed">
          <button class="speed-button" type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button class="speed-button" type="button" data-speed="1" aria-pressed="true">1×</button>
          <button class="speed-button" type="button" data-speed="2" aria-pressed="false">2×</button>
        </div>

        <button class="control-button caption-button" id="captionButton" type="button" aria-label="Hide captions" aria-pressed="true">CC</button>
      </nav>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    const MODEL_NAME = 'Codex GPT-5.6 Sol';
    const DEFAULT_SEED = 1812;
    const DURATION = 112000;
    const W = 1600;
    const H = 900;
    const TAU = Math.PI * 2;
    const SEQUENCES = Object.freeze([
      { index: 0, name: 'The Basket', startTime: 0, endTime: 9000 },
      { index: 1, name: 'The Red Departure', startTime: 9000, endTime: 18000 },
      { index: 2, name: 'The Forest Threshold', startTime: 18000, endTime: 27000 },
      { index: 3, name: 'The Wolf Appears', startTime: 27000, endTime: 38000 },
      { index: 4, name: 'The Question', startTime: 38000, endTime: 47000 },
      { index: 5, name: 'The Race', startTime: 47000, endTime: 57000 },
      { index: 6, name: "At Grandmother's Door", startTime: 57000, endTime: 66000 },
      { index: 7, name: 'The Disguise', startTime: 66000, endTime: 75000 },
      { index: 8, name: 'Red Arrives', startTime: 75000, endTime: 84000 },
      { index: 9, name: 'What Big…', startTime: 84000, endTime: 95000 },
      { index: 10, name: 'The Rescue', startTime: 95000, endTime: 104000 },
      { index: 11, name: 'The Path Home', startTime: 104000, endTime: 112000 }
    ]);

    const canvas = document.getElementById('film');
    const ctx = canvas.getContext('2d', { alpha: false });
    const stage = document.getElementById('stage');
    const modelTitle = document.getElementById('modelTitle');
    const sceneNumber = document.getElementById('sceneNumber');
    const sceneName = document.getElementById('sceneName');
    const captionEl = document.getElementById('caption');
    const controls = document.getElementById('controls');
    const playButton = document.getElementById('playButton');
    const replayButton = document.getElementById('replayButton');
    const captionButton = document.getElementById('captionButton');
    const scrubber = document.getElementById('scrubber');
    const markers = document.getElementById('markers');
    const timecode = document.getElementById('timecode');
    const speedButtons = [...document.querySelectorAll('.speed-button')];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const state = {
      seed: DEFAULT_SEED,
      time: 0,
      playing: true,
      speed: 1,
      captions: true,
      completed: false,
      lastWall: performance.now(),
      lastScene: -1,
      lastCaption: null
    };

    const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const mix = (a, b, t) => a * (1 - t) + b * t;
    const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
    const smoother = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
    const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
    const easeIn = t => Math.pow(clamp(t), 3);
    const fract = v => v - Math.floor(v);
    const hash = n => fract(Math.sin(n * 127.1 + state.seed * 0.017) * 43758.5453123);
    const wave = (time, rate = 1, phase = 0) => Math.sin(time * .001 * rate + phase);
    const segment = (value, start, end) => clamp((value - start) / (end - start));
    const motion = value => reducedMotion.matches ? value * .16 : value;

    function getSequenceIndex(time) {
      if (time >= DURATION) return SEQUENCES.length - 1;
      for (let i = SEQUENCES.length - 1; i >= 0; i--) {
        if (time >= SEQUENCES[i].startTime) return i;
      }
      return 0;
    }

    function localFrame(time) {
      const index = getSequenceIndex(time);
      const seq = SEQUENCES[index];
      const localTime = clamp(time, seq.startTime, seq.endTime) - seq.startTime;
      const duration = seq.endTime - seq.startTime;
      return { index, seq, localTime, duration, p: clamp(localTime / duration) };
    }

    function colorMix(a, b, t) {
      const parse = input => {
        const color = String(input).trim();
        const functional = color.match(/^rgba?\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)(?:\s*,\s*(-?[\d.]+))?\s*\)$/i);
        if (functional) {
          return [
            clamp(Number(functional[1]), 0, 255),
            clamp(Number(functional[2]), 0, 255),
            clamp(Number(functional[3]), 0, 255),
            functional[4] === undefined ? 1 : clamp(Number(functional[4]), 0, 1)
          ];
        }
        const raw = color.replace(/^#/, '');
        const expanded = raw.length === 3 || raw.length === 4 ? raw.split('').map(character => character + character).join('') : raw;
        if (!/^[\da-f]{6}(?:[\da-f]{2})?$/i.test(expanded)) throw new TypeError(`Unsupported color: ${color}`);
        return [
          parseInt(expanded.slice(0, 2), 16),
          parseInt(expanded.slice(2, 4), 16),
          parseInt(expanded.slice(4, 6), 16),
          expanded.length === 8 ? parseInt(expanded.slice(6, 8), 16) / 255 : 1
        ];
      };
      const aa = parse(a), bb = parse(b);
      const amount = clamp(t);
      const red = Math.round(lerp(aa[0], bb[0], amount));
      const green = Math.round(lerp(aa[1], bb[1], amount));
      const blue = Math.round(lerp(aa[2], bb[2], amount));
      const alpha = lerp(aa[3], bb[3], amount);
      return alpha < .999 ? `rgba(${red},${green},${blue},${alpha.toFixed(3)})` : `rgb(${red},${green},${blue})`;
    }

    function path(points, close = true) {
      if (!points.length) return;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      if (close) ctx.closePath();
    }

    function paintPath(points, fill, stroke = '#211c1a', width = 4, close = true) {
      path(points, close);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke && width > 0) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    function ellipse(x, y, rx, ry, fill, stroke = null, width = 0, rotation = 0) {
      ctx.beginPath();
      ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rotation, 0, TAU);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke && width) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
    }

    function line(points, color, width = 4, alpha = 1, dash = []) {
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.setLineDash(dash);
      ctx.stroke();
      ctx.restore();
    }

    function roundRect(x, y, width, height, radius, fill, stroke = null, lineWidth = 0) {
      const r = Math.min(radius, Math.abs(width) / 2, Math.abs(height) / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke && lineWidth) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function withCamera(zoom, panX, panY, draw) {
      const z = 1 + motion(zoom - 1);
      const px = motion(panX);
      const py = motion(panY);
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(z, z);
      ctx.translate(-W / 2 + px, -H / 2 + py);
      draw();
      ctx.restore();
    }

    function backdrop(top, bottom, horizon = .65) {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, top);
      gradient.addColorStop(horizon, bottom);
      gradient.addColorStop(1, colorMix(bottom, '#171311', .34));
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
    }

    function vignette(strength = .34, tint = '#090806') {
      const gradient = ctx.createRadialGradient(W / 2, H * .46, H * .12, W / 2, H * .48, W * .67);
      gradient.addColorStop(.55, '#00000000');
      gradient.addColorStop(1, tint);
      ctx.save();
      ctx.globalAlpha = strength;
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function paperGrain(scene, density = 125, alpha = .09) {
      ctx.save();
      for (let i = 0; i < density; i++) {
        const x = hash(scene * 901 + i * 7.17) * W;
        const y = hash(scene * 443 + i * 13.11) * H;
        const light = hash(scene * 191 + i * 2.31) > .5;
        ctx.globalAlpha = alpha * (.25 + hash(scene * 71 + i) * .75);
        ctx.fillStyle = light ? '#fff8dd' : '#1d1512';
        const size = .7 + hash(i * 1.91 + scene) * 2.2;
        ctx.fillRect(x, y, size * 2.5, size * .5);

      const drawn = points.slice(0, whole + 1);
      if (whole < total) {

        drawn.push([
          lerp(points[whole][0], points[whole + 1][0], f),
          lerp(points[whole][1], points[whole + 1][1], f)

      if (drawn.length > 1) {
        line(drawn, '#4a0e16', width + 3, alpha * .35);

        const redY = lerp(631, 741, smooth(ep));
        drawRed(redX, redY, lerp(.34, .5, smooth(ep)), -1, time, { walking: ep < .92 });
        // The light basket swings higher because it is now nearly empty.
        if (ep > .72) {
          const highSwing = motion(Math.sin(time * .009) * 12);
          line([[redX - 42, redY - 40], [redX - 76 + highSwing, redY - 112]], '#6b4528', 4, .45);
        }
        for (let i = 0; i < 28; i++) {
          const gx = hash(i + 722) * W;
          const gy = 755 + hash(i + 744) * 145;
          line([[gx, gy], [gx + motion(wave(time, .62, i) * 7), gy - 30 - hash(i) * 25]], i % 2 ? '#66704f' : '#8b7748', 3, .8);
        }
        drawBird(935, 215, .8, time * .005, '#46342c');
        drawBird(1000, 187, .62, time * .005 + 2, '#46342c');
      });
      vignette(.2, '#4b2d28');
      paperGrain(47, 155, .075);
    }

    const CAPTIONS = Object.freeze([
      { start: 3600, end: 7900, text: '“Stay on the path, and do not linger.”' },
      { start: 31900, end: 37400, text: '“Good morning, little traveler. Where does this path take you?”' },
      { start: 38600, end: 42200, text: '“Grandmother’s cottage, beneath three old oaks.”' },
      { start: 43200, end: 46300, text: '“A few flowers would cheer her.”' },
      { start: 84000, end: 85600, text: '“Grandmother, what big eyes you have.”' },
      { start: 85600, end: 87200, text: '“All the better to see you with.”' },
      { start: 87200, end: 88800, text: '“Grandmother, what big ears you have.”' },
      { start: 88800, end: 90400, text: '“All the better to hear you with.”' },
      { start: 90400, end: 92400, text: '“Grandmother, what big teeth you have.”' },
      { start: 92400, end: 95000, text: '“All the better to eat you with!”' }
    ]);

    function captionAt(time) {
      if (!state.captions) return '';
      const item = CAPTIONS.find(caption => time >= caption.start && time < caption.end);
      return item ? item.text : '';
    }

    function drawFilmEdge(index, p) {
      ctx.save();
      const edge = ctx.createLinearGradient(0, 0, 0, H);
      edge.addColorStop(0, '#f4e2b10f');
      edge.addColorStop(.1, '#00000000');
      edge.addColorStop(.9, '#00000000');
      edge.addColorStop(1, '#00000055');
      ctx.fillStyle = edge;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = index < 2 ? '#5c3b262e' : '#e6d5a420';
      ctx.lineWidth = 5;
      ctx.strokeRect(12.5, 12.5, W - 25, H - 25);
      ctx.strokeStyle = '#130f0d55';
      ctx.lineWidth = 2;
      ctx.strokeRect(21.5, 21.5, W - 43, H - 43);
      // A tiny moving registration mark gives the piece a handmade film-print cadence.
      const tick = Math.floor(p * 12);
      line([[31, 58 + tick * 5], [48, 58 + tick * 5]], '#ead7a2', 2, .24);
      ctx.restore();
    }

    function renderFrame(time = state.time) {
      const frame = localFrame(time);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      switch (frame.index) {
        case 0: drawKitchen(time, frame.p); break;
        case 1: drawVillage(time, frame.p); break;
        case 2: drawThreshold(time, frame.p); break;
        case 3: drawWolfAppears(time, frame.p); break;
        case 4: drawQuestion(time, frame.p); break;
        case 5: drawRace(time, frame.p, frame.localTime); break;
        case 6: drawGrandmothersDoor(time, frame.p); break;
        case 7: drawDisguise(time, frame.p, frame.localTime); break;
        case 8: drawRedArrives(time, frame.p); break;
        case 9: drawWhatBig(time, frame.p, frame.localTime); break;
        case 10: drawRescue(time, frame.p, frame.localTime); break;
        case 11: drawChangedDawn(time, frame.p); break;
      }
      drawFilmEdge(frame.index, frame.p);
      updateInterface(frame);
    }

    function formatTime(ms) {
      const wholeSeconds = Math.floor(clamp(ms, 0, DURATION) / 1000);
      const minutes = Math.floor(wholeSeconds / 60);
      const seconds = wholeSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function updateInterface(frame) {
      const wholeTime = Math.round(state.time);
      scrubber.value = String(wholeTime);
      scrubber.style.setProperty('--progress', `${(state.time / DURATION) * 100}%`);
      scrubber.setAttribute('aria-valuetext', `${(state.time / 1000).toFixed(1)} seconds, ${frame.seq.name}`);
      timecode.value = `${formatTime(state.time)} / 01:52`;
      timecode.textContent = `${formatTime(state.time)} / 01:52`;

      playButton.dataset.playing = String(state.playing);
      playButton.setAttribute('aria-pressed', String(state.playing));
      playButton.setAttribute('aria-label', state.playing ? 'Pause film' : 'Play film');
      captionButton.setAttribute('aria-pressed', String(state.captions));
      captionButton.setAttribute('aria-label', state.captions ? 'Hide captions' : 'Show captions');
      speedButtons.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.speed) === state.speed)));

      modelTitle.classList.toggle('is-gone', frame.index !== 0 || state.time >= 8200);
      if (frame.index !== state.lastScene) {
        sceneNumber.textContent = `${String(frame.index + 1).padStart(2, '0')} / 12`;
        sceneName.textContent = frame.seq.name;
        canvas.setAttribute('aria-label', `${frame.seq.name} — illustrated sequence ${frame.index + 1} of 12`);
        [...markers.children].forEach((marker, index) => marker.setAttribute('aria-current', String(index === frame.index)));
        state.lastScene = frame.index;
      }

      const caption = captionAt(state.time);
      if (caption !== state.lastCaption) {
        captionEl.textContent = caption;
        captionEl.classList.toggle('is-visible', Boolean(caption));
        state.lastCaption = caption;
      }
    }

    function characterStateAt(time) {
      const frame = localFrame(time);
      const p = frame.p;
      const scene = frame.index;
      let redX = 784, redY = 628, redAction = 'listening', redBasket = true;
      let wolfX = -1, wolfY = -1, wolfAction = 'absent';
      let grandmotherX = -1, grandmotherY = -1, grandmotherAction = 'absent';
      let woodsmanX = -1, woodsmanY = -1, woodsmanAction = 'absent';

      switch (scene) {
        case 0:
          redAction = p < .48 ? 'watching the basket' : 'hood fastened by Mother';
          redBasket = false;
          break;
        case 1:
          redX = lerp(693, 1195, smooth(p)); redY = lerp(739, 628, smooth(p)); redAction = 'walking toward forest';
          break;
        case 2:
          redX = 690 + motion(wave(time, .21) * 18); redY = 716; redAction = 'walking beneath tall trees';
          break;
        case 3:
          redX = p < .29 ? 455 : 520; redY = 738; redAction = 'meeting wolf';
          wolfX = p < .29 ? 1090 : 1088; wolfY = 750; wolfAction = p < .2 ? 'emerging from occlusion' : 'speaking politely';
          break;
        case 4:
          redX = p < .56 ? 560 : 684; redY = p < .56 ? 872 : 711; redAction = p < .56 ? 'describing three oaks' : 'looking toward flowers';
          wolfX = p < .56 ? 1000 : 800; wolfY = p < .56 ? 700 : 674; wolfAction = 'studying basket and shortcut';
          break;
        case 5: {
          const shot = raceCut(frame.localTime);
          redX = shot % 2 === 0 ? 760 : -1; redY = shot % 2 === 0 ? 758 : -1; redAction = 'gathering flowers';
          wolfX = shot % 2 ? 780 : -1; wolfY = shot % 2 ? 730 : -1; wolfAction = 'racing shortcut';
          break;
        }
        case 6:
          redX = -1; redY = -1; redAction = 'approaching offscreen';
          wolfX = p < .43 ? 690 : 680; wolfY = 735; wolfAction = p < .43 ? 'imitating Red at door' : 'trapping Grandmother in cupboard';
          grandmotherX = p < .43 ? -1 : lerp(1160, 116, smooth(segment(p, .43, .82))); grandmotherY = 712; grandmotherAction = p > .82 ? 'alive in cupboard' : 'retreating to cupboard';
          break;
        case 7:
          redX = 850; redY = 727; redAction = 'approaching cottage with flowers';
          wolfX = 595; wolfY = 755; wolfAction = 'assembling disguise in bed';
          grandmotherX = 110; grandmotherY = 697; grandmotherAction = 'alive in cupboard';
          break;
        case 8:
          redX = p < .18 ? lerp(400, 710, p / .18) : lerp(1285, 805, smooth(segment(p, .18, 1))); redY = 733; redAction = p < .55 ? 'entering quiet cottage' : 'approaching bed';
          redBasket = p < .47;
          wolfX = 493; wolfY = 710; wolfAction = 'waiting beneath quilt';
          grandmotherX = 110; grandmotherY = 697; grandmotherAction = 'alive in cupboard';
          break;
        case 9:
          redX = 680; redY = 875; redAction = 'questioning disguised wolf'; redBasket = false;
          wolfX = 650; wolfY = 470; wolfAction = frame.localTime < 8400 ? 'answering in disguise' : 'revealing teeth';
          grandmotherX = 110; grandmotherY = 697; grandmotherAction = 'alive in cupboard';
          break;
        case 10:
          redX = frame.localTime < 1250 ? lerp(830, 1115, frame.localTime / 1250) : 670; redY = 734; redAction = frame.localTime < 2450 ? 'escaping lunge' : frame.localTime < 6550 ? 'sheltered behind Woodsman' : 'freeing Grandmother'; redBasket = false;
          wolfX = frame.localTime < 6550 ? lerp(520, 1135, segment(frame.localTime, 4750, 6550)) : 1500; wolfY = frame.localTime < 6550 ? 730 : 390; wolfAction = frame.localTime < 4750 ? 'blocked by protective axe' : 'fleeing through window';
          grandmotherX = frame.localTime < 6550 ? 110 : lerp(112, 420, segment(frame.localTime, 6550, 9000)); grandmotherY = 714; grandmotherAction = frame.localTime < 6550 ? 'alive in cupboard' : 'freed and safe';
          woodsmanX = frame.localTime < 1250 ? -1 : lerp(585, 960, segment(frame.localTime, 1250, 9000)); woodsmanY = 742; woodsmanAction = 'shielding family with axe emblem';
          break;
        case 11:
          redX = p < .36 ? 875 : lerp(1168, 678, smooth(segment(p, .36, 1))); redY = p < .36 ? 735 : lerp(631, 741, smooth(segment(p, .36, 1))); redAction = p < .36 ? 'saying goodbye at dawn' : p >= .96 ? 'holding on homeward path' : 'walking home';
          grandmotherX = p < .36 ? 670 : -1; grandmotherY = p < .36 ? 720 : -1; grandmotherAction = p < .36 ? 'safe outside cottage' : 'watching from cottage';
          woodsmanX = p < .36 ? 410 : -1; woodsmanY = p < .36 ? 741 : -1; woodsmanAction = p < .36 ? 'safe outside cottage' : 'watching from cottage';
          wolfX = -1; wolfY = -1; wolfAction = 'fled into forest';
          break;
      }

      return {
        location: ['village kitchen', 'village road', 'forest threshold', 'forest meeting', 'forest fork', 'clearing and shortcut', 'three-oak cottage', 'cottage and approach', 'cottage interior', 'bedside', 'cottage rescue', 'changed dawn path'][scene],
        lighting: ['warm morning', 'gold morning', 'patterned forest', 'uncertain forest', 'forked forest light', 'bright clearing and dark shortcut', 'cold threshold', 'cold trap', 'cold window light', 'tight cold danger', 'cold breaking to warm', 'pearl and coral dawn'][scene],
        motif: {
          name: 'scarlet thread path',
          continuity: clamp(time / DURATION),
          tension: scene === 9 ? p : scene === 10 ? 1 - p : .25 + hash(scene + 70) * .2
        },
        seededDetail: {
          seed: state.seed,
          windPhase: hash(scene * 47 + 2.4),
          leafPattern: hash(scene * 83 + 9.1)
        },
        characters: {
          red: { present: redX >= 0, x: redX, y: redY, action: redAction, hood: 'red triangular hood and cape', basket: redBasket ? 'carried' : (scene === 0 ? 'on kitchen table' : scene >= 8 ? 'set down or light' : 'offscreen') },
          wolf: { present: wolfX >= 0, x: wolfX, y: wolfY, action: wolfAction, leftEarNotch: true, eyeColor: 'amber' },
          grandmother: { present: grandmotherX >= 0, x: grandmotherX, y: grandmotherY, action: grandmotherAction, spectacles: true, quiltMotif: 'botanical repeat' },
          woodsman: { present: woodsmanX >= 0, x: woodsmanX, y: woodsmanY, action: woodsmanAction, ochreOuterwear: true, axeUse: 'protective emblem' }
        }
      };
    }

    function snapshot() {
      const frame = localFrame(state.time);
      return {
        seed: state.seed,
        playing: state.playing,
        speed: state.speed,
        filmTime: state.time,
        duration: DURATION,
        sequenceIndex: frame.index,
        sequenceName: frame.seq.name,
        progress: clamp(state.time / DURATION),
        captionsEnabled: state.captions,
        completed: state.time >= DURATION,
        sceneState: characterStateAt(state.time)
      };
    }

    function reset(seed = DEFAULT_SEED) {
      if (!Number.isInteger(seed)) throw new TypeError('reset(seed) requires an integer seed');
      state.seed = seed;
      state.time = 0;
      state.playing = true;
      state.speed = 1;
      state.captions = true;
      state.completed = false;
      state.lastWall = performance.now();
      state.lastScene = -1;
      state.lastCaption = null;
      controls.classList.remove('is-idle');
      renderFrame(0);
      return snapshot();
    }

    function play() {
      if (state.time < DURATION) {
        state.playing = true;
        state.completed = false;
        state.lastWall = performance.now();
        renderFrame(state.time);
      }
      return snapshot();
    }

    function pause() {
      state.playing = false;
      state.lastWall = performance.now();
      renderFrame(state.time);
      return snapshot();
    }

    function seek(milliseconds) {
      const value = Number(milliseconds);
      if (!Number.isFinite(value)) throw new TypeError('seek(milliseconds) requires a finite number');
      state.time = clamp(value, 0, DURATION);
      state.completed = state.time >= DURATION;
      if (state.completed) state.playing = false;
      state.lastWall = performance.now();
      renderFrame(state.time);
      return snapshot();
    }

    function seekScene(index) {
      if (!Number.isInteger(index) || index < 0 || index >= SEQUENCES.length) throw new RangeError('seekScene(index) accepts indices 0 through 11');
      return seek(SEQUENCES[index].startTime);
    }

    function setSpeed(multiplier) {
      const value = Number(multiplier);
      if (![.5, 1, 2].includes(value)) throw new RangeError('setSpeed(multiplier) accepts 0.5, 1, or 2');
      state.speed = value;
      state.lastWall = performance.now();
      renderFrame(state.time);
      return snapshot();
    }

    function setCaptions(enabled) {
      state.captions = Boolean(enabled);
      state.lastCaption = null;
      renderFrame(state.time);
      return snapshot();
    }

    function getShotList() {
      return SEQUENCES.map(({ index, name, startTime, endTime }) => ({ index, name, startTime, endTime }));
    }

    function replay() {
      return reset(DEFAULT_SEED);
    }

    function finiteNumbers(value) {
      if (typeof value === 'number') return Number.isFinite(value);
      if (value === null || typeof value === 'string' || typeof value === 'boolean') return true;
      if (Array.isArray(value)) return value.every(finiteNumbers);
      if (typeof value === 'object') return Object.values(value).every(finiteNumbers);
      return false;
    }

    function advanceClock(now) {
      const delta = clamp(now - state.lastWall, 0, 100);
      state.lastWall = now;
      if (state.playing) {
        state.time = Math.min(DURATION, state.time + delta * state.speed);
        if (state.time >= DURATION) {
          state.time = DURATION;
          state.playing = false;
          state.completed = true;
        }
      }
      return state.time;
    }

    function runSelfTest() {
      const tests = [];
      const record = (name, passed, detail = '') => tests.push({ name, passed: Boolean(passed), detail: String(detail) });
      const expectedNames = [
        'The Basket', 'The Red Departure', 'The Forest Threshold', 'The Wolf Appears',
        'The Question', 'The Race', "At Grandmother's Door", 'The Disguise',
        'Red Arrives', 'What Big…', 'The Rescue', 'The Path Home'
      ];
      const expectedStarts = [0, 9000, 18000, 27000, 38000, 47000, 57000, 66000, 75000, 84000, 95000, 104000];
      const expectedEnds = [9000, 18000, 27000, 38000, 47000, 57000, 66000, 75000, 84000, 95000, 104000, 112000];

      try {
        const shots = getShotList();
        record('exact duration', DURATION === 112000, DURATION);
        record('twelve ordered named sequences', shots.length === 12 && shots.every((shot, i) => shot.index === i && shot.name === expectedNames[i]), shots.map(s => s.name).join(' | '));
        record('exact contiguous boundaries', shots.every((shot, i) => shot.startTime === expectedStarts[i] && shot.endTime === expectedEnds[i] && (i === 0 || shots[i - 1].endTime === shot.startTime)), JSON.stringify(shots.map(s => [s.startTime, s.endTime])));

        reset(DEFAULT_SEED);
        pause();
        seek(33333);
        const deterministicA = snapshot();
        reset(DEFAULT_SEED);
        pause();
        seek(33333);
        const deterministicB = snapshot();
        record('deterministic reset and exact-time state', deterministicA.filmTime === 33333 && JSON.stringify(deterministicA.sceneState) === JSON.stringify(deterministicB.sceneState), `seed ${deterministicB.seed} at ${deterministicB.filmTime}`);

        const boundarySnapshots = [];
        const boundaryIndices = expectedStarts.map((start, index) => {
          pause();
          seek(start);
          const boundarySnapshot = snapshot();
          boundarySnapshots.push(boundarySnapshot);
          return boundarySnapshot.sequenceIndex === index;
        });
        pause();
        seek(DURATION);
        boundarySnapshots.push(snapshot());
        boundaryIndices.push(snapshot().sequenceIndex === 11);
        record('exact seeking and half-open scene lookup', boundaryIndices.every(Boolean), boundaryIndices.join(','));

        const seekSceneResults = expectedStarts.map((start, index) => {
          pause();
          seekScene(index);
          const snap = snapshot();
          return snap.filmTime === start && snap.sequenceIndex === index;
        });
        record('seekScene maps all twelve starts', seekSceneResults.every(Boolean), seekSceneResults.join(','));

        pause();
        seek(45678);
        pause();
        const pausedAt = snapshot().filmTime;
        advanceClock(state.lastWall + 80);
        record('pause preserves exact time', !snapshot().playing && snapshot().filmTime === pausedAt, pausedAt);

        reset(73);
        setSpeed(2);
        seek(DURATION);
        replay();
        const replayState = snapshot();
        record('replay restores opening defaults', replayState.seed === DEFAULT_SEED && replayState.filmTime === 0 && replayState.playing && replayState.speed === 1 && replayState.captionsEnabled, JSON.stringify({ seed: replayState.seed, time: replayState.filmTime, playing: replayState.playing, speed: replayState.speed }));
        advanceClock(state.lastWall + 80);
        const autoplayState = snapshot();
        record('default autoplay with seed 1812', autoplayState.seed === 1812 && autoplayState.playing && autoplayState.filmTime > 0, `seed ${autoplayState.seed}, advanced to ${autoplayState.filmTime} ms`);

        pause();
        seek(DURATION);
        const ending = snapshot();
        record('end-state reachability and held final sequence', ending.filmTime === 112000 && ending.completed && !ending.playing && ending.sequenceIndex === 11 && ending.sequenceName === 'The Path Home', JSON.stringify({ time: ending.filmTime, sequence: ending.sequenceIndex, completed: ending.completed }));
        record('snapshots are JSON-safe with finite numeric state', boundarySnapshots.every(finiteNumbers) && finiteNumbers(ending) && Boolean(JSON.stringify(boundarySnapshots)), `${boundarySnapshots.length} sampled states, final progress ${ending.progress}`);
      } catch (error) {
        record('self-test execution', false, error instanceof Error ? error.message : String(error));
      } finally {
        reset(DEFAULT_SEED);
      }

      return { passed: tests.every(test => test.passed), tests };
    }

    const api = Object.freeze({
      reset,
      play,
      pause,
      seek,
      seekScene,
      setSpeed,
      setCaptions,
      getShotList,
      snapshot,
      runSelfTest
    });
    Object.defineProperty(window, '__RED_HOOD_FILM__', { value: api, enumerable: true, configurable: false, writable: false });

    // Controls and sequence markers.
    SEQUENCES.forEach(sequence => {
      const marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'marker';
      marker.style.left = `${(sequence.startTime / DURATION) * 100}%`;
      marker.setAttribute('aria-label', `Sequence ${sequence.index + 1}: ${sequence.name}, ${formatTime(sequence.startTime)}`);
      marker.setAttribute('aria-current', String(sequence.index === 0));
      marker.addEventListener('click', () => seekScene(sequence.index));
      markers.appendChild(marker);
    });

    playButton.addEventListener('click', () => state.playing ? pause() : play());
    replayButton.addEventListener('click', replay);
    captionButton.addEventListener('click', () => setCaptions(!state.captions));
    speedButtons.forEach(button => button.addEventListener('click', () => setSpeed(Number(button.dataset.speed))));

    scrubber.addEventListener('pointerdown', pause);
    scrubber.addEventListener('input', event => seek(Number(event.currentTarget.value)));

    document.addEventListener('keydown', event => {
      const target = event.target;
      const buttonFocused = target instanceof HTMLButtonElement;
      const textEditing = target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement || (target instanceof HTMLInputElement && target.type !== 'range') || target?.isContentEditable;
      if (event.code === 'Space' && !buttonFocused && !textEditing) {
        event.preventDefault();
        state.playing ? pause() : play();
      } else if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && !textEditing) {
        event.preventDefault();
        const offset = event.key === 'ArrowLeft' ? -3000 : 3000;
        seek(state.time + offset);
      } else if (event.key === 'Home' && !textEditing) {
        event.preventDefault();
        replay();
      }
    });

    let idleTimer = 0;
    function wakeControls() {
      controls.classList.remove('is-idle');
      window.clearTimeout(idleTimer);
      idleTimer = window.setTimeout(() => controls.classList.add('is-idle'), 3200);
    }
    ['pointermove', 'pointerdown', 'touchstart'].forEach(type => stage.addEventListener(type, wakeControls, { passive: true }));
    controls.addEventListener('focusin', wakeControls);
    controls.addEventListener('focusout', wakeControls);
    wakeControls();

    document.addEventListener('visibilitychange', () => { state.lastWall = performance.now(); });
    window.addEventListener('resize', () => renderFrame(state.time), { passive: true });
    const reducedMotionListener = () => renderFrame(state.time);
    if (typeof reducedMotion.addEventListener === 'function') reducedMotion.addEventListener('change', reducedMotionListener);
    else if (typeof reducedMotion.addListener === 'function') reducedMotion.addListener(reducedMotionListener);

    function animate(now) {
      advanceClock(now);
      renderFrame(state.time);
      requestAnimationFrame(animate);
    }

    // A complete frame exists before the first animation callback; autoplay then advances it.
    document.title = MODEL_NAME;
    renderFrame(0);
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
