<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok 4.7</title>
<style>
  html, body { margin: 0; height: 100%; background: #16130f; overflow: hidden; }
  body { font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  h1 {
    position: absolute; z-index: 3; top: 10px; left: 10px; margin: 0;
    padding: 4px 8px 5px; pointer-events: none;
    font: 600 14px/1 Palatino, "Palatino Linotype", Georgia, serif;
    letter-spacing: 0.16em; color: #2a160f;
    background: rgba(243, 232, 214, 0.9);
    border: 1px solid rgba(42, 22, 15, 0.5);
  }
  #controls {
    position: absolute; z-index: 4; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 26px 12px 10px;
    background: linear-gradient(to top, rgba(18, 14, 11, 0.78), rgba(18, 14, 11, 0));
    color: #f3eadc; opacity: 1; transition: opacity 0.7s ease;
  }
  #controls.idle { opacity: 0; }
  #controls.idle:focus-within { opacity: 1; }
  button, input { font: 600 14px/1 Palatino, "Palatino Linotype", Georgia, serif; }
  button {
    min-height: 44px; min-width: 44px; padding: 0 12px;
    background: #f3eadc; color: #241c16; border: 1px solid #2a2118;
    border-radius: 2px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: #2a2118; color: #f3eadc; }
  button:focus-visible, input:focus-visible { outline: 2px solid #e7c27a; outline-offset: 2px; }
  #speeds { display: flex; gap: 4px; }
  #track { position: relative; flex: 1 1 200px; min-width: 140px; height: 44px; }
  #scrub {
    position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 44px; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none;
  }
  #scrub::-webkit-slider-runnable-track { height: 2px; background: #e7d7c3; }
  #scrub::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px;
    background: #c23b2e; border: 1px solid #2a2118; border-radius: 0;
  }
  #scrub::-moz-range-track { height: 2px; background: #e7d7c3; border: 0; }
  #scrub::-moz-range-thumb {
    width: 14px; height: 14px; background: #c23b2e; border: 1px solid #2a2118; border-radius: 0;
  }
  .mark {
    position: absolute; top: 0; width: 44px; height: 44px; padding: 0;
    transform: translateX(-50%); background: transparent; border: 0; min-width: 0;
  }
  .mark::after {
    content: ""; position: absolute; left: 50%; top: 16px; width: 2px; height: 12px;
    background: #f3eadc; transform: translateX(-50%);
  }
  .mark[aria-current="true"]::after { background: #c23b2e; width: 3px; }
  #timeRead { min-width: 7.5em; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 720px) {
    h1 { font-size: 11px; letter-spacing: 0.12em; }
    #controls { gap: 6px; padding: 20px 8px 8px; }
    button { padding: 0 8px; font-size: 13px; }
    #timeRead { font-size: 12px; min-width: 6.5em; }
  }
  @media (prefers-reduced-motion: reduce) {
    #controls { transition: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" aria-label="Little Red Riding Hood"></canvas>
  <h1>Grok 4.7</h1>
  <div id="capLive" class="sr" aria-live="polite"></div>
  <div id="controls" role="group" aria-label="Film controls">
    <button type="button" id="bPlay" aria-label="Pause">Pause</button>
    <button type="button" id="bReplay">Replay</button>
    <div id="speeds" role="group" aria-label="Speed">
      <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
    </div>
    <button type="button" id="bCC" aria-pressed="true">Captions</button>
    <div id="track">
      <input id="scrub" type="range" min="0" max="112000" step="1" value="0" aria-label="Film time" aria-valuemin="0" aria-valuemax="112000">
      <div id="marks"></div>
    </div>
    <div id="timeRead" aria-hidden="true">0:00 / 1:52</div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var DUR = 112000;
  var DEFAULT_SEED = 1812;
  var SCENES = [
    { name: "The Basket", start: 0, end: 9000 },
    { name: "The Red Departure", start: 9000, end: 18000 },
    { name: "The Forest Threshold", start: 18000, end: 27000 },
    { name: "The Wolf Appears", start: 27000, end: 38000 },
    { name: "The Question", start: 38000, end: 47000 },
    { name: "The Race", start: 47000, end: 57000 },
    { name: "At Grandmother's Door", start: 57000, end: 66000 },
    { name: "The Disguise", start: 66000, end: 75000 },
    { name: "Red Arrives", start: 75000, end: 84000 },
    { name: "What Big\u2026", start: 84000, end: 95000 },
    { name: "The Rescue", start: 95000, end: 104000 },
    { name: "The Path Home", start: 104000, end: 112000 }
  ];
  var LINES = [
    { t0: 3400, t1: 8200, text: "Stay on the path, and do not linger.", who: "mother" },
    { t0: 30000, t1: 36200, text: "Good morning, little traveler. Where does this path take you?", who: "wolf" },
    { t0: 85600, t1: 87200, text: "Grandmother, what big eyes you have.", who: "red" },
    { t0: 87200, t1: 88800, text: "All the better to see you with.", who: "wolf" },
    { t0: 88800, t1: 90400, text: "Grandmother, what big ears you have.", who: "red" },
    { t0: 90400, t1: 92000, text: "All the better to hear you with.", who: "wolf" },
    { t0: 92000, t1: 93600, text: "Grandmother, what big teeth you have.", who: "red" },
    { t0: 93600, t1: 95000, text: "All the better to eat you with!", who: "wolf" }
  ];
  var RACE = [
    { at: 0, who: "red" },
    { at: 2000, who: "wolf" },
    { at: 3800, who: "red" },
    { at: 5200, who: "wolf" },
    { at: 6400, who: "red" },
    { at: 7400, who: "wolf" },
    { at: 8300, who: "red" },
    { at: 9000, who: "wolf" },
    { at: 9500, who: "both" }
  ];
  var DISGUISE = [
    { at: 0, who: "wolf" },
    { at: 1600, who: "red" },
    { at: 3200, who: "wolf" },
    { at: 4800, who: "red" },
    { at: 6400, who: "wolf" },
    { at: 8000, who: "red" }
  ];

  var canvas = document.getElementById("film");
  var ctx = canvas.getContext("2d", { alpha: false });
  var dpr = 1;
  var grainCanvas = null;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var state = { seed: DEFAULT_SEED, time: 0, playing: true, speed: 1, captions: true, world: null };
  var lastNow = 0;
  var dirty = true;
  var scrubbing = false;
  var lastCap = "\0";
  var ui = document.getElementById("controls");
  var bPlay = document.getElementById("bPlay");
  var bCC = document.getElementById("bCC");
  var range = document.getElementById("scrub");
  var timeRead = document.getElementById("timeRead");
  var capLive = document.getElementById("capLive");
  var lastAct = 0;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function clamp01(v) { return clamp(v, 0, 1); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp01(t); return t * t * (3 - 2 * t); }
  function seg(t, a, b) { return smooth((t - a) / (b - a)); }
  function mulberry32(seed) {
    var a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normSeed(seed) {
    var n = Math.trunc(Number(seed));
    return Number.isFinite(n) ? n : DEFAULT_SEED;
  }
  function seqIndex(t) {
    var x = clamp(t, 0, DUR);
    for (var i = SCENES.length - 1; i >= 0; i--) if (x >= SCENES[i].start) return i;
    return 0;
  }
  function lineAt(t) {
    for (var i = 0; i < LINES.length; i++) if (t >= LINES[i].t0 && t < LINES[i].t1) return LINES[i].text;
    return "";
  }
  function beat(local, rows) {
    var cur = rows[0];
    for (var i = 0; i < rows.length; i++) if (local >= rows[i].at) cur = rows[i];
    return cur;
  }
  function buildWorld(seed) {
    var rnd = mulberry32(seed);
    var flowers = [];
    for (var i = 0; i < 9; i++) flowers.push({ x: 0.12 + rnd() * 0.76, y: 0.42 + rnd() * 0.4, rot: rnd() * 6.28, s: 0.65 + rnd() * 0.7, hue: rnd() });
    return {
      seed: seed,
      cloud: rnd(),
      branch: rnd() * 0.5 - 0.25,
      bird: rnd(),
      flowers: flowers,
      knots: [rnd(), rnd(), rnd(), rnd(), rnd()],
      sway: [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28]
    };
  }
  function rebuildGrain() {
    var gw = 420, gh = 240;
    var c = document.createElement("canvas");
    c.width = gw; c.height = gh;
    var g = c.getContext("2d");
    var img = g.createImageData(gw, gh);
    var rnd = mulberry32((state.seed | 0) ^ 0x51ed);
    for (var i = 0; i < gw * gh; i++) {
      var n = rnd();
      var p = i * 4;
      var on = n > 0.84;
      img.data[p] = img.data[p + 1] = img.data[p + 2] = 28;
      img.data[p + 3] = on ? 46 : 0;
    }
    g.putImageData(img, 0, 0);
    grainCanvas = c;
  }

  function focusCam(fx, fy, z, rot) {
    return { z: z, x: -(fx - 0.5) * z, y: -(fy - 0.5) * z, rot: rot || 0 };
  }
  function story(t) {
    var i = seqIndex(t);
    var sc = SCENES[i];
    var local = t - sc.start;
    var span = sc.end - sc.start;
    var u = clamp01(local / span);
    var wld = state.world;
    var st = {
      index: i, u: u, local: local, line: lineAt(t),
      shot: "wide", board: "forest", light: "forest",
      cam: { z: 1, x: 0, y: 0, rot: 0 }, vignette: 0.22, scroll: u,
      red: { show: false, x: 0.4, y: 0.76, h: 0.26, face: 1, walk: false, pose: "still", flowers: 0, basket: true, look: 0, onPath: true, path: u },
      wolf: { show: false, x: 0.68, y: 0.76, h: 0.38, face: -1, walk: false, pose: "still", disguise: 0, fleeing: false, emerge: 0, progress: 0, look: 0 },
      mother: { show: false, x: 0.68, y: 0.78, h: 0.44, face: -1, pose: "basket" },
      grandmother: { show: false, x: 0.42, y: 0.76, h: 0.36, face: 1, pose: "stand", state: "cottage-unseen", alive: true },
      woodsman: { show: false, x: 0.24, y: 0.76, h: 0.5, face: 1, pose: "stand" },
      basket: { fullness: 1, contents: "bread,butter,jar", table: false },
      door: 0, curtain: 0.15, breath: Math.sin(t * 0.004),
      variation: { cloud: wld.cloud, flowerX: wld.flowers[0].x, branch: wld.branch }
    };
    if (i === 0) {
      st.board = "kitchen"; st.light = "morning"; st.shot = local < 5200 ? "medium" : "close-up";
      st.red.show = true; st.red.x = 0.36; st.red.y = 0.8; st.red.h = 0.36; st.red.face = 1; st.red.basket = local > 7600;
      st.mother.show = true; st.mother.x = 0.64; st.mother.y = 0.8; st.mother.h = 0.48;
      st.mother.pose = local < 3800 ? "basket" : local < 7000 ? "hood" : "shoulder";
      st.basket.table = local < 7600;
      var z0 = local < 5200 ? lerp(1.02, 1.12, u) : local < 8200 ? lerp(1.12, 1.4, seg(local, 5200, 8200)) : lerp(1.4, 2.35, seg(local, 8200, 9000));
      st.cam = focusCam(local < 5200 ? 0.5 : 0.38, local < 5200 ? 0.52 : 0.46, z0, 0);
      st.vignette = 0.12;
    } else if (i === 1) {
      st.board = "village"; st.light = "morning"; st.shot = local < 900 ? "close-up" : "extreme-wide";
      st.red.show = true; st.red.walk = local > 700; st.red.face = 1; st.red.basket = true; st.red.onPath = true;
      st.red.x = lerp(0.18, 0.62, smooth(clamp01((local - 400) / 8200)));
      st.red.y = 0.78; st.red.h = lerp(0.34, 0.11, smooth(clamp01(local / 1400)));
      st.red.path = st.red.x;
      var z1 = local < 1400 ? lerp(2.35, 1, smooth(local / 1400)) : 1;
      st.cam = focusCam(lerp(0.22, 0.5, smooth(clamp01(local / 1400))), lerp(0.5, 0.52, smooth(clamp01(local / 1400))), z1, 0);
      st.cam.x += (reduced ? 0 : (st.red.x - 0.4) * 0.15);
      st.vignette = 0.16;
    } else if (i === 2) {
      st.board = "threshold"; st.light = "forest"; st.shot = "wide";
      st.red.show = true; st.red.walk = true; st.red.x = 0.42; st.red.y = 0.78;
      st.red.h = lerp(0.22, 0.13, u); st.red.face = 1; st.scroll = u;
      st.cam = { z: lerp(1.02, 1.14, u), x: Math.sin(t * 0.0004) * 0.01, y: 0, rot: Math.sin(t * 0.0003) * 0.004 };
      st.vignette = lerp(0.18, 0.32, u);
    } else if (i === 3) {
      st.light = "forest";
      st.wolf.emerge = smooth(clamp01((local - 500) / 3600));
      st.wolf.show = local > 400;
      st.wolf.progress = st.wolf.emerge;
      if (local < 7000) {
        st.board = "meet"; st.shot = "wide";
        st.red.show = true; st.red.x = 0.28; st.red.y = 0.78; st.red.h = 0.25; st.red.walk = local < 2800; st.red.face = 1; st.red.look = 0.4;
        st.wolf.x = lerp(0.69, 0.5, st.wolf.emerge); st.wolf.y = 0.79; st.wolf.h = 0.34; st.wolf.face = -1; st.wolf.walk = st.wolf.emerge < 0.95;
        st.cam = { z: lerp(1.04, 1.16, u), x: lerp(0.02, -0.02, u), y: 0, rot: 0 };
      } else if (local < 9200) {
        st.board = "wolfcu"; st.shot = "close-up";
        st.wolf.x = 0.56; st.wolf.y = 0.58; st.wolf.h = 0.72; st.wolf.pose = "speak"; st.wolf.look = -0.3;
        st.cam = focusCam(0.56, 0.42, lerp(1.35, 1.7, seg(local, 7000, 9200)), 0);
      } else {
        st.board = "redcu"; st.shot = "close-up";
        st.red.show = true; st.red.x = 0.48; st.red.y = 0.62; st.red.h = 0.7; st.red.face = 1; st.red.look = 0.5; st.red.pose = "listen";
        st.wolf.show = false;
        st.cam = focusCam(0.5, 0.42, 1.45, 0);
      }
    } else if (i === 4) {
      st.light = "forest";
      st.red.show = true; st.wolf.show = true;
      st.red.onPath = u < 0.72;
      st.red.flowers = u > 0.72 ? 1 : 0;
      if (local < 4200) {
        st.board = "question"; st.shot = "medium";
        st.red.x = 0.32; st.red.y = 0.78; st.red.h = 0.28; st.red.face = 1; st.red.pose = "point";
        st.wolf.x = 0.66; st.wolf.y = 0.79; st.wolf.h = 0.4; st.wolf.face = -1; st.wolf.pose = "listen"; st.wolf.look = -0.2;
        st.cam = { z: 1.08, x: 0, y: 0, rot: 0 };
      } else if (local < 6800) {
        st.board = "basketcu"; st.shot = "close-up";
        st.red.x = 0.38; st.red.y = 0.86; st.red.h = 0.42; st.red.basket = true;
        st.wolf.x = 0.7; st.wolf.y = 0.7; st.wolf.h = 0.55; st.wolf.pose = "study"; st.wolf.look = -0.6;
        st.cam = focusCam(0.34, 0.62, lerp(1.2, 1.55, seg(local, 4200, 6800)), 0);
      } else {
        st.board = "flower"; st.shot = "extreme-close-up";
        st.red.pose = "reach"; st.red.x = 0.42; st.red.y = 0.92; st.red.h = 0.3;
        st.wolf.show = false;
        st.cam = focusCam(0.5, 0.48, lerp(1.3, 2.7, seg(local, 6800, 9000)), 0);
      }
    } else if (i === 5) {
      var rb = beat(local, RACE);
      st.light = rb.who === "wolf" ? "shortcut" : "clearing";
      st.shot = "wide";
      st.red.onPath = false;
      st.red.flowers = Math.min(6, 1 + Math.floor(u * 6));
      st.red.show = rb.who !== "wolf";
      st.wolf.show = rb.who !== "red";
      st.wolf.progress = u; st.wolf.walk = true; st.wolf.face = 1; st.wolf.pose = "run";
      st.red.walk = true; st.red.pose = "pick"; st.red.face = 1;
      st.red.x = 0.46; st.red.y = 0.76; st.red.h = 0.24;
      st.wolf.x = lerp(0.18, 0.72, u); st.wolf.y = 0.78; st.wolf.h = 0.36;
      st.board = rb.who === "both" ? "split" : rb.who === "wolf" ? "shortcut" : "clearing";
      var open = smooth(clamp01(local / (reduced ? 480 : 1100)));
      st.cam = { z: rb.who === "both" ? 1 : lerp(2.55, 1, open), x: 0, y: 0, rot: 0 };
      if (local < 1100) st.shot = "extreme-close-up";
      st.scroll = u;
    } else if (i === 6) {
      st.light = "cold";
      st.wolf.show = true; st.wolf.progress = u; st.wolf.face = -1;
      if (local < 3200) {
        st.board = "cottage"; st.shot = "wide";
        st.wolf.x = lerp(0.86, 0.58, smooth(local / 3200)); st.wolf.y = 0.78; st.wolf.h = 0.22; st.wolf.walk = true;
        st.door = 0; st.cam = { z: lerp(1.05, 1.16, u), x: 0.04, y: 0, rot: 0 };
      } else if (local < 5600) {
        st.board = "knock"; st.shot = "medium";
        st.wolf.x = 0.48; st.wolf.y = 0.8; st.wolf.h = 0.26; st.wolf.pose = "knock"; st.wolf.walk = false;
        st.door = seg(local, 4800, 5600) * 0.35;
        st.cam = focusCam(0.5, 0.48, 1.18, 0);
      } else {
        st.board = "snatch"; st.shot = "medium";
        st.grandmother.show = true;
        st.grandmother.state = local < 7600 ? "at-door" : "wardrobe";
        st.grandmother.x = local < 7600 ? lerp(0.62, 0.4, seg(local, 5600, 7600)) : 0.36;
        st.grandmother.y = 0.78; st.grandmother.pose = local < 7600 ? "retreat" : "hidden";
        st.wolf.x = lerp(0.22, 0.48, seg(local, 5600, 8000)); st.wolf.y = 0.78; st.wolf.h = 0.3; st.wolf.face = 1; st.wolf.walk = local < 8000;
        st.door = 0.8; st.cam = { z: 1.1, x: 0, y: 0, rot: 0 };
      }
    } else if (i === 7) {
      var db = beat(local, DISGUISE);
      st.light = "cold"; st.shot = "medium";
      st.grandmother.state = "wardrobe";
      st.wolf.disguise = clamp01(local / 7600);
      st.red.flowers = 6; st.red.onPath = true;
      if (db.who === "wolf") {
        st.board = "disguise"; st.wolf.show = true; st.wolf.pose = "dress";
        st.wolf.x = 0.62; st.wolf.y = 0.74; st.wolf.h = 0.4; st.wolf.face = 1;
        st.curtain = lerp(0.1, 0.55, st.wolf.disguise);
        st.cam = focusCam(0.6, 0.5, 1.12, 0);
      } else {
        st.board = "approach"; st.red.show = true; st.red.walk = true; st.red.face = 1;
        st.red.x = lerp(0.18, 0.48, u); st.red.y = 0.78; st.red.h = lerp(0.16, 0.26, u);
        st.cam = { z: 1.04, x: -0.02, y: 0, rot: 0 };
      }
    } else if (i === 8) {
      st.board = "arrive"; st.light = "cold"; st.shot = "medium";
      st.red.show = true; st.red.walk = u < 0.92; st.red.face = 1; st.red.flowers = 6;
      st.red.x = lerp(0.16, 0.46, smooth(u)); st.red.y = 0.8; st.red.h = 0.32;
      st.wolf.show = false; st.wolf.disguise = 1;
      st.grandmother.state = "wardrobe";
      st.door = lerp(0.55, 0.25, u); st.curtain = lerp(0.72, 0.4, u);
      st.cam = focusCam(lerp(0.35, 0.55, u), 0.5, lerp(1.05, 1.28, u), Math.sin(t * 0.001) * 0.003);
      st.vignette = 0.34;
    } else if (i === 9) {
      st.light = "cold"; st.grandmother.state = "wardrobe"; st.wolf.disguise = 1; st.red.flowers = 6;
      st.wolf.show = true; st.red.show = local < 1600 || (local >= 3200 && local < 4800) || (local >= 6400 && local < 8000) || (local >= 9600);
      if (local < 1600) {
        st.board = "bedside"; st.shot = "medium";
        st.red.x = lerp(0.28, 0.4, local / 1600); st.red.y = 0.8; st.red.h = 0.34; st.red.face = 1;
        st.wolf.x = 0.68; st.wolf.y = 0.7; st.wolf.h = 0.32; st.wolf.pose = "bed";
        st.curtain = lerp(0.35, 0.85, local / 1600);

    if (state.playing && state.time < DUR) { advanceBy(dt * state.speed); dirty = true; }
    if (dirty) { renderFrame(); syncUI(); dirty = false; }
    if (state.playing && now - lastAct > 2800 && !ui.contains(document.activeElement)) ui.classList.add("idle");
    requestAnimationFrame(loop);
  }

  window.__RED_HOOD_FILM__ = {
    reset: reset, play: play, pause: pause, seek: seek, seekScene: seekScene,
    setSpeed: setSpeed, setCaptions: setCaptions, getShotList: getShotList,
    snapshot: snapshot, runSelfTest: runSelfTest
  };
  state.world = buildWorld(DEFAULT_SEED);
  resize();
  syncUI();
  renderFrame();
  dirty = false;
  requestAnimationFrame(function (ts) { lastNow = ts; lastAct = ts; requestAnimationFrame(loop); });
})();
</script>
</body>
