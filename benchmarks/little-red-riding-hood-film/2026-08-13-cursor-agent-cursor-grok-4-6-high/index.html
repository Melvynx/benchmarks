<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Grok 4.6</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#14161a;overflow:hidden}
  body{font-family:Palatino,"Palatino Linotype","Iowan Old Style",Georgia,serif;color:#e4ddd2}
  #stage{position:fixed;inset:0}
  #film{position:absolute;inset:0;width:100%;height:100%;display:block}
  h1{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:3;
    margin:0;text-align:center;font-size:11px;font-weight:500;letter-spacing:.46em;
    text-transform:uppercase;color:rgba(228,221,210,.46);pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.55);transition:opacity .55s ease}
  #ui{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);width:min(960px,94vw);z-index:5;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;
    background:rgba(18,20,24,.72);border:1px solid rgba(228,221,210,.14);
    border-radius:12px;transition:opacity .55s ease}
  #ui.idle{opacity:.14}
  #ui:focus-within,#ui:hover{opacity:1}
  #ui button{appearance:none;border:0;background:transparent;color:#e4ddd2;cursor:pointer;
    border-radius:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;
    justify-content:center;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;padding:0 8px}
  #ui button:hover{background:rgba(196,54,42,.22)}
  #ui button:focus-visible{outline:2px solid #c4362a;outline-offset:2px}
  #ui button[aria-pressed="true"]{background:rgba(196,54,42,.34);color:#ffe8d6}
  #ui svg{width:15px;height:15px;fill:currentColor}
  #time{font:500 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;
    color:rgba(228,221,210,.82);min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
  #scrub{position:relative;flex:1 1 220px;height:40px;display:flex;align-items:center;min-width:160px}
  #range{width:100%;accent-color:#c4362a;cursor:pointer;height:22px;background:transparent}
  #marks{position:absolute;left:8px;right:8px;top:4px;height:12px;pointer-events:none}
  #marks button{position:absolute;pointer-events:auto;width:10px;height:10px;min-width:10px;min-height:10px;
    padding:0;transform:translateX(-50%) rotate(45deg);border-radius:1px;background:rgba(228,221,210,.45)}
  #marks button:hover,#marks button:focus-visible{background:#e8c9b4}
  #speeds{display:flex;gap:2px;border:1px solid rgba(228,221,210,.16);border-radius:8px;padding:2px}
  #speeds button{min-width:36px;min-height:32px;font-size:12px}
  @media (max-width:640px){
    #ui{gap:4px;padding:7px 8px;bottom:8px}
    #time{min-width:72px;font-size:11px}
    #scrub{order:10;flex-basis:100%}
    h1{font-size:9px;letter-spacing:.32em}
  }
  @media (prefers-reduced-motion:reduce){ #ui,h1{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" aria-label="Little Red Riding Hood illustrated film"></canvas>
  <h1>Cursor Grok 4.6</h1>
  <div id="ui" role="region" aria-label="Film controls">
    <button id="bPlay" aria-label="Pause" title="Play/Pause (Space)">
      <svg id="icPlay" viewBox="0 0 16 16" style="display:none"><path d="M3 1.6v12.8L14 8z"/></svg>
      <svg id="icPause" viewBox="0 0 16 16"><path d="M3 2h3.6v12H3zM9.4 2H13v12H9.4z"/></svg>
    </button>
    <button id="bReplay" aria-label="Replay from beginning" title="Replay (Home)">
      <svg viewBox="0 0 16 16"><path d="M8 2.5V.2L4.4 3.4 8 6.6V4.1a4.4 4.4 0 1 1-4.4 4.4H2A6 6 0 1 0 8 2.5z"/></svg>
    </button>
    <div id="time" aria-hidden="true">0:00 / 1:52</div>
    <div id="scrub">
      <input id="range" type="range" min="0" max="112000" step="50" value="0" aria-label="Film timeline">
      <div id="marks"></div>
    </div>
    <div id="speeds" role="group" aria-label="Playback speed">
      <button data-sp="0.5" aria-pressed="false" title="Half speed">0.5×</button>
      <button data-sp="1" aria-pressed="true" title="Normal speed">1×</button>
      <button data-sp="2" aria-pressed="false" title="Double speed">2×</button>
    </div>
    <button id="bCC" aria-pressed="true" aria-label="Captions" title="Captions">CC</button>
  </div>
</div>
<script>
"use strict";
(function(){
const W=1600,H=900,DUR=112000,DEFAULT_SEED=1812,TAU=Math.PI*2;
const SCENES=[
  {name:"The Basket",start:0,end:9000},
  {name:"The Red Departure",start:9000,end:18000},
  {name:"The Forest Threshold",start:18000,end:27000},
  {name:"The Wolf Appears",start:27000,end:38000},
  {name:"The Question",start:38000,end:47000},
  {name:"The Race",start:47000,end:57000},
  {name:"At Grandmother's Door",start:57000,end:66000},
  {name:"The Disguise",start:66000,end:75000},
  {name:"Red Arrives",start:75000,end:84000},
  {name:"What Big…",start:84000,end:95000},
  {name:"The Rescue",start:95000,end:104000},
  {name:"The Path Home",start:104000,end:112000}
];
const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const CUTS=[
  [0,2800,5600,9000],
  [0,3800,6800,9000],
  [0,3200,6200,9000],
  [0,2800,4800,7600,9800,11000],
  [0,2800,5000,7200,9000],
  [0,1600,3000,4300,5400,6400,7300,8100,8700,9200,9600,10000],
  [0,2800,5200,9000],
  [0,2000,3800,5600,7200,9000],
  [0,2400,5000,7200,9000],
  [0,1700,3400,5100,6800,8600,11000],
  [0,1600,3200,5200,7200,9000],
  [0,3600,8000]
];
const CAPS=[
  {a:3400,b:8500,who:"mother",text:"“Stay on the path, and do not linger.”"},
  {a:32800,b:37800,who:"wolf",text:"“Good morning, little traveler. Where does this path take you?”"},
  {a:38600,b:41800,who:"red",text:"“To Grandmother — beneath the three old oaks.”"},
  {a:84400,b:86000,who:"red",text:"“Grandmother, what big eyes you have.”"},
  {a:86200,b:87800,who:"wolf",text:"“All the better to see you with.”"},
  {a:88000,b:89600,who:"red",text:"“Grandmother, what big ears you have.”"},
  {a:89800,b:91400,who:"wolf",text:"“All the better to hear you with.”"},
  {a:91600,b:93200,who:"red",text:"“Grandmother, what big teeth you have.”"},
  {a:93400,b:94850,who:"wolf",text:"“All the better to eat you with!”"}
];
const SHOTMETA=[
  [{sc:"medium",loc:"village kitchen",ch:["red","mother"]},{sc:"close-up",loc:"kitchen table",ch:["mother-hands","basket"]},{sc:"medium",loc:"village kitchen",ch:["red","mother"]}],
  [{sc:"extreme-wide",loc:"village and fields",ch:["red"]},{sc:"medium tracking",loc:"meadow path",ch:["red"]},{sc:"wide",loc:"forest edge",ch:["red"]}],
  [{sc:"wide",loc:"forest threshold",ch:["red"]},{sc:"medium",loc:"narrowing path",ch:["red"]},{sc:"wide from behind",loc:"watchful trees",ch:["red"]}],
  [{sc:"wide",loc:"deep forest",ch:["red","wolf-occluded"]},{sc:"close-up",loc:"the path",ch:["red"]},{sc:"medium reveal",loc:"light patch",ch:["wolf"]},{sc:"over-shoulder",loc:"the path",ch:["red","wolf"]},{sc:"reverse",loc:"the path",ch:["red","wolf"]}],
  [{sc:"two-shot",loc:"path, oaks beyond",ch:["red","wolf"]},{sc:"insert",loc:"the basket",ch:["wolf","basket"]},{sc:"medium",loc:"flower bank",ch:["red","wolf"]},{sc:"extreme close-up",loc:"amber eye",ch:["wolf"]}],
  [{sc:"match-cut wide",loc:"bright clearing",ch:["red"]},{sc:"wide",loc:"dark shortcut",ch:["wolf"]},{sc:"wide",loc:"clearing",ch:["red"]},{sc:"wide leap",loc:"gully",ch:["wolf"]},{sc:"medium",loc:"clearing",ch:["red"]},{sc:"diagonal",loc:"root ridge",ch:["wolf"]},{sc:"close",loc:"stems",ch:["red"]},{sc:"whip",loc:"fern gully",ch:["wolf"]},{sc:"close-up",loc:"clearing",ch:["red"]},{sc:"crest wide",loc:"above cottage",ch:["wolf"]},{sc:"close",loc:"bouquet",ch:["red"]}],
  [{sc:"wide",loc:"cottage under three oaks",ch:["wolf"]},{sc:"medium",loc:"cottage door",ch:["wolf"]},{sc:"wide interior",loc:"cottage shadows",ch:["wolf","grandmother-hidden"]}],
  [{sc:"medium",loc:"cottage bedside",ch:["wolf"]},{sc:"tracking",loc:"birch approach",ch:["red"]},{sc:"close-up",loc:"cap and quilt",ch:["wolf"]},{sc:"framed wide",loc:"three oaks",ch:["red"]},{sc:"staged wide",loc:"the trap",ch:["wolf"]}],
  [{sc:"medium",loc:"half-open door",ch:["red"]},{sc:"wide interior",loc:"quiet room",ch:["red"]},{sc:"detail pan",loc:"table and curtain",ch:[]},{sc:"tracking push",loc:"toward the bed",ch:["red"]}],
  [{sc:"two-shot",loc:"bedside",ch:["red","wolf-disguised"]},{sc:"medium-close",loc:"the bed",ch:["wolf-disguised"]},{sc:"close-up",loc:"bedside",ch:["red"]},{sc:"close-up",loc:"notched ear",ch:["wolf"]},{sc:"closer",loc:"bedside",ch:["red"]},{sc:"extreme close-up",loc:"the grin",ch:["wolf"]}],
  [{sc:"wide",loc:"the lunge",ch:["red","wolf"]},{sc:"medium",loc:"forest edge",ch:["woodsman"]},{sc:"wide",loc:"doorway",ch:["red","wolf","woodsman"]},{sc:"wide",loc:"window escape",ch:["red","wolf","woodsman"]},{sc:"medium",loc:"wardrobe",ch:["red","grandmother","woodsman"]}],
  [{sc:"wide",loc:"cottage at dawn",ch:["red","grandmother","woodsman"]},{sc:"extreme-wide echo",loc:"the path home",ch:["red"]}]
];

const state={seed:DEFAULT_SEED,time:0,playing:true,speed:1,captions:true,ended:false};
let world=null,needsRender=true,MOTION=1;
const mqRM=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):null;
function readMotion(){MOTION=(mqRM&&mqRM.matches)?0:1;needsRender=true;}
if(mqRM){if(mqRM.addEventListener)mqRM.addEventListener("change",readMotion);else if(mqRM.addListener)mqRM.addListener(readMotion);readMotion();}

const sat=v=>v<0?0:v>1?1:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=sat(t);return t*t*(3-2*t);};
const rt=(t,a,b)=>b===a?1:sat((t-a)/(b-a));
const eio=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eo=t=>{t=sat(t);return 1-Math.pow(1-t,3);};
function shotOf(u,cuts){let i=cuts.length-2;for(let k=0;k<cuts.length-1;k++){if(u<cuts[k+1]){i=k;break;}}return[i,u-cuts[i],cuts[i+1]-cuts[i]];}
function seqIndexAt(t){if(t>=DUR)return 11;for(let i=11;i>=0;i--){if(t>=SCENES[i].start)return i;}return 0;}
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return h>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rngFor(seed,label){return mulberry32(xmur3(String(seed)+":"+label)());}
function h32i(i,salt){let h=Math.imul((i|0)^0x9e3779b9,0x85ebca6b)^Math.imul((salt|0)+0x165667b1,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>16;return(h>>>0)/4294967296;}
function vn(x,salt){const i=Math.floor(x),f=x-i;const a=h32i(i,salt),b=h32i(i+1,salt);return a+(b-a)*(f*f*(3-2*f));}
const vnc=(x,salt)=>vn(x,salt)*2-1;
function blinkAt(t,salt){const p=2400+h32i(salt,77)*2800;const ph=(t+h32i(salt,78)*p)%p;const d=130;return ph>p-d?1-Math.abs(((ph-(p-d))/d)*2-1):0;}

function buildWorld(seed){
  const w={seed:seed};
  {const r=rngFor(seed,"oaks");
    w.oaks=[0,1,2].map(function(){return{lean:(r()-.5)*.22,crown:0.86+r()*0.28,limb:r()};});}
  {const r=rngFor(seed,"forest");
    w.far=Array.from({length:18},function(){return{x:r()*2600-500,w:8+r()*10,lean:(r()-.5)*.07,h:0.7+r()*0.5};});
    w.mid=Array.from({length:12},function(){return{x:r()*2600-500,w:18+r()*18,lean:(r()-.5)*.1,h:0.85+r()*0.4};});
    w.near=Array.from({length:8},function(){return{x:r()*2400-400,w:40+r()*36,lean:(r()-.5)*.08,h:1+r()*0.3};});}
  {const r=rngFor(seed,"houses");
    w.houses=Array.from({length:8},function(i){return{x:40+i*58+r()*22,w:48+r()*36,h:36+r()*32,ro:r()};});}
  {const r=rngFor(seed,"meadow");
    w.meadow=Array.from({length:80},function(){return{x:r()*1700-40,y:640+r()*230,k:(r()*3)|0,ph:r()*TAU,h:9+r()*16};});}
  {const r=rngFor(seed,"clear");
    w.clear=Array.from({length:140},function(){return{x:40+r()*1520,y:540+r()*330,k:(r()*4)|0,ph:r()*TAU,h:14+r()*28};});}
  {const r=rngFor(seed,"dapple");
    w.dapples=Array.from({length:14},function(){return{x:r()*1600,y:500+r()*360,rx:50+r()*140,ry:16+r()*34,ph:r()*TAU};});}
  {const r=rngFor(seed,"birds");
    w.birds=Array.from({length:7},function(){return{y:90+r()*200,ph:r()*TAU,v:.022+r()*.02,amp:8+r()*18};});}
  {const r=rngFor(seed,"watch");
    w.watch=Array.from({length:6},function(){return{x:200+r()*1200,y:80+r()*280,s:0.7+r()*0.8,ph:r()*TAU};});}
  {const r=rngFor(seed,"thread");
    w.threadBend=Array.from({length:8},function(){return (r()-.5)*40;});}
  const gc=document.createElement("canvas");gc.width=gc.height=160;
  const gg=gc.getContext("2d");const im=gg.createImageData(160,160);const gr=rngFor(seed,"grain");
  for(let i=0;i<im.data.length;i+=4){const v=(gr()*255)|0;im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=18;}
  gg.putImageData(im,0,0);w.grain=gc;w.grainPat=null;
  return w;
}

const canvas=document.getElementById("film");
const ctx=canvas.getContext("2d",{alpha:false});
let dpr=1,cw=0,ch=0,fs=1,fx=0,fy=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth;ch=window.innerHeight;
  canvas.width=Math.max(2,Math.round(cw*dpr));canvas.height=Math.max(2,Math.round(ch*dpr));
  fs=Math.min(cw/W,ch/H);fx=(cw-W*fs)/2;fy=(ch-H*fs)/2;
  needsRender=true;
}
window.addEventListener("resize",resize);

function fill(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H);}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};
}
function sky(stops){const g=ctx.createLinearGradient(0,0,0,H);for(let i=0;i<stops.length;i++)g.addColorStop(stops[i][0],stops[i][1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function glow(x,y,r,inner,outer){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,inner);g.addColorStop(1,outer);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function band(y,amp,salt,color,step){step=step||48;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-400,H+30);ctx.lineTo(-400,y);for(let x=-400;x<=W+400;x+=step)ctx.lineTo(x,y+vnc(x*0.004,salt)*amp);ctx.lineTo(W+400,H+30);ctx.closePath();ctx.fill();}
function shotCam(o,t){
  const m=MOTION,hd=(o.hand||0)*m;
  const dx=vnc(t*0.0015,3)*8*hd,dy=vnc(t*0.0015,7)*6*hd,dr=vnc(t*0.0011,9)*0.004*hd;
  ctx.translate(W/2,H/2);ctx.rotate((o.rot||0)*m+dr);
  const z=o.z==null?1:o.z;const zz=1+(z-1)*(m?1:0.28);
  ctx.scale(zz,zz);ctx.translate(-(o.cx==null?W/2:o.cx)+dx,-(o.cy==null?H/2:o.cy)+dy);
}
function vignette(a){const g=ctx.createRadialGradient(W/2,H*0.46,H*0.38,W/2,H*0.5,H*0.88);g.addColorStop(0,"rgba(12,10,12,0)");g.addColorStop(1,"rgba(12,10,12,"+a+")");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function grain(t){
  if(!world.grainPat)world.grainPat=ctx.createPattern(world.grain,"repeat");
  const fr=MOTION?Math.floor(t/90):0;
  const gx=h32i(fr,21)*160,gy=h32i(fr,22)*160;
  ctx.save();ctx.globalAlpha=.48;ctx.translate(-gx,-gy);ctx.fillStyle=world.grainPat;
  ctx.fillRect(gx-160,gy-160,W+320,H+320);ctx.restore();
}
function hatch(x,y,w,h,gap,ang,col,a){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.translate(x+w/2,y+h/2);ctx.rotate(ang);ctx.strokeStyle=col;ctx.globalAlpha=a==null?.18:a;ctx.lineWidth=1;
  const span=Math.hypot(w,h)+20;
  for(let i=-span;i<span;i+=gap){ctx.beginPath();ctx.moveTo(i,-span);ctx.lineTo(i,span);ctx.stroke();}
  ctx.restore();
}

/* ---------- red thread motif ---------- */
function threadCurve(t,kind){
  const b=world.threadBend;
  const pts=[];
  if(kind==="path"){
    for(let i=0;i<8;i++){const u=i/7;pts.push({x:lerp(-40,1680,u),y:lerp(720,640,u)+Math.sin(u*3.2+t*0.0004)*18+b[i]});}
  }else if(kind==="gaze"){
    pts.push({x:520,y:430},{x:780+b[1],y:400},{x:1040,y:390});
  }else if(kind==="dawn"){
    for(let i=0;i<8;i++){const u=i/7;pts.push({x:lerp(1680,-40,u),y:lerp(700,640,u)+Math.sin(u*2.4)*12+b[i]*0.4});}
  }else{
    for(let i=0;i<8;i++){const u=i/7;pts.push({x:lerp(80,1520,u),y:200+Math.sin(u*4+t*0.0006)*30+b[i]});}
  }
  return pts;
}
function drawThread(pts,w0,col,a){
  if(pts.length<2)return;
  ctx.save();ctx.globalAlpha=a==null?1:a;ctx.strokeStyle=col;ctx.lineWidth=w0;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);}
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.stroke();ctx.restore();
}

/* ---------- props ---------- */
function drawBasket(x,y,s,o){
  o=o||{};
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle="#6a4520";ctx.lineWidth=1.7;
  ctx.beginPath();ctx.arc(0,-4,11,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  if(o.full!==false){
    ctx.fillStyle="#ead9b8";ctx.beginPath();ctx.ellipse(-3,-7,5.6,3.3,-.28,0,TAU);ctx.fill();
    ctx.fillStyle="#c48a42";ctx.beginPath();ctx.ellipse(3.2,-6.8,4.2,2.8,.22,0,TAU);ctx.fill();
    ctx.fillStyle="#8a3a28";ctx.beginPath();ctx.ellipse(0,-8.4,2.4,2.6,0,0,TAU);ctx.fill();
    ctx.fillStyle="#c4362a";ctx.beginPath();ctx.moveTo(-5.5,-7);ctx.quadraticCurveTo(0,-10,5,-6.8);ctx.quadraticCurveTo(0,-5.2,-5.5,-7);ctx.fill();
  }
  ctx.fillStyle="#a56b34";
  ctx.beginPath();ctx.moveTo(-12,-5);ctx.quadraticCurveTo(0,-8.6,12,-5);ctx.lineTo(9,7);ctx.quadraticCurveTo(0,9.4,-9,7);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#7a5228";ctx.lineWidth=1.05;
  for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-11+i*0.8,-1.4+i*2.6);ctx.quadraticCurveTo(0,0.6+i*2.6,11-i*0.8,-1.4+i*2.6);ctx.stroke();}
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(i*2.6,-6+Math.abs(i)*.25);ctx.lineTo(i*2.2,7.4-Math.abs(i)*.45);ctx.stroke();}
  ctx.restore();
}
function drawBouquet(x,y,s,n01,t){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const n=2+Math.round(sat(n01)*9);
  ctx.strokeStyle="#3f5a2e";ctx.lineWidth=1.15;

function advance(ms){
  let nt=state.time+ms;
  if(nt>=DUR){nt=DUR;state.ended=true;state.playing=false;}
  state.time=nt;
}
function snapshot(){
  const si=seqIndexAt(state.time),sq=SCENES[si];
  return{
    seed:state.seed,playing:state.playing,speed:state.speed,time:state.time,duration:DUR,
    sequenceIndex:si,sequenceName:sq.name,progress:+(state.time/DUR).toFixed(6),
    captions:state.captions,completed:state.time>=DUR,
    scene:describe(si,state.time-sq.start,state.time)

}
function reset(seed){
  const s=Number.isFinite(+seed)?Math.trunc(+seed):DEFAULT_SEED;
  state.seed=s;world=buildWorld(s);
  state.time=0;state.playing=true;state.speed=1;state.ended=false;
  needsRender=true;renderFrame();syncUI();
  return snapshot();
}
function play(){if(state.time<DUR){state.playing=true;state.ended=false;}syncUI();return snapshot();}
function pause(){state.playing=false;syncUI();return snapshot();}
function seek(ms){
  let v=+ms;if(!Number.isFinite(v))v=0;
  v=Math.max(0,Math.min(DUR,Math.round(v)));
  state.time=v;state.ended=v>=DUR;
  if(state.ended)state.playing=false;
  renderFrame();syncUI();
  return snapshot();
}
function seekScene(i){
  let v=Math.trunc(+i);if(!Number.isFinite(v))v=0;
  v=Math.max(0,Math.min(11,v));
  return seek(SCENES[v].start);
}
function setSpeed(m){if(m===0.5||m===1||m===2)state.speed=m;syncUI();return state.speed;}
function setCaptions(en){state.captions=!!en;renderFrame();syncUI();return state.captions;}
function getShotList(){return SCENES.map(function(s,i){return{index:i,name:s.name,start:s.start,end:s.end};});}
function _step(ms){
  const v=+ms;
  if(Number.isFinite(v)&&v>0&&state.playing&&!state.ended){advance(v*state.speed);renderFrame();syncUI();}
  return snapshot();
}
function runSelfTest(){
  const tests=[];
  const T=function(name,pass,info){tests.push({name:name,passed:!!pass,info:info===undefined?"":String(info)});};
  try{
    T("duration-is-112000",DUR===112000&&snapshot().duration===112000);
    const sl=getShotList();
    T("twelve-ordered-contiguous-sequences",
      sl.length===12&&sl[0].start===0&&sl[11].end===DUR&&
      sl.every(function(s,i){return s.index===i&&s.end>s.start&&(i===0||s.start===sl[i-1].end)&&typeof s.name==="string"&&s.name.length>0;}));
    reset(777);seek(51234);const a=JSON.stringify(snapshot());
    reset(777);seek(51234);const b=JSON.stringify(snapshot());
    T("deterministic-reset-and-seek",a===b);
    reset(1812);seek(51234);const c=JSON.stringify(snapshot());
    T("seed-changes-are-real",c!==a&&JSON.parse(c).time===51234);
    let ok=true,info="";
    const cases=[[0,0],[1,0],[8999,0],[9000,1],[17999,1],[18000,2],[26999,2],[27000,3],[37999,3],[38000,4],[46999,4],[47000,5],[56999,5],[57000,6],[65999,6],[66000,7],[74999,7],[75000,8],[83999,8],[84000,9],[94999,9],[95000,10],[103999,10],[104000,11],[111999,11],[112000,11]];
    for(let i=0;i<cases.length;i++){
      seek(cases[i][0]);const s=snapshot();
      if(s.time!==cases[i][0]||s.sequenceIndex!==cases[i][1]){ok=false;info=cases[i][0]+" -> t:"+s.time+" seq:"+s.sequenceIndex;break;}
    }
    T("exact-seek-and-boundaries",ok,info);
    ok=true;
    for(let i=0;i<12;i++){
      seekScene(i);const s=snapshot();
      if(s.time!==sl[i].start||s.sequenceIndex!==i){ok=false;info="scene "+i;break;}
    }
    T("seekScene-lands-on-starts",ok,info);
    reset(1812);pause();seek(1000);
    const t0=snapshot().time;_step(500);
    T("pause-holds-film-time",snapshot().time===t0);
    play();_step(500);
    T("play-advances-film-time",snapshot().time===t0+500);
    setSpeed(2);_step(250);
    T("speed-2x",snapshot().time===t0+1000&&snapshot().speed===2);
    setSpeed(0.5);_step(1000);
    T("speed-half",snapshot().time===t0+1500&&snapshot().speed===0.5);
    setSpeed(3);
    T("invalid-speed-rejected",snapshot().speed===0.5);
    setSpeed(1);
    setCaptions(false);const midT=snapshot();
    setCaptions(true);
    T("captions-toggle-does-not-touch-film-state",midT.captions===false&&midT.time===snapshot().time&&snapshot().captions===true);
    seek(111800);play();_step(1000);
    const es=snapshot();
    T("end-state-reachable-and-held",es.time===112000&&es.completed===true&&es.playing===false&&es.sequenceIndex===11);
    const rs=reset(1812);
    T("replay-restores-seed-1812-autoplay-1x",rs.seed===1812&&rs.time===0&&rs.playing===true&&rs.speed===1&&rs.completed===false);
    ok=true;
    try{
      for(let i=0;i<sl.length;i++){
        seek(sl[i].start);
        seek(sl[i].start+Math.floor((sl[i].end-sl[i].start)/2));
      }
      seek(DUR);
    }catch(err){ok=false;info=String(err);}
    T("renders-at-all-boundaries-and-midpoints",ok,info);
    seek(43210);
    const nums=[];
    (function walk(v){
      if(v===null||v===undefined)return;
      if(typeof v==="number")nums.push(v);
      else if(Array.isArray(v)){for(let i=0;i<v.length;i++)walk(v[i]);}
      else if(typeof v==="object"){const ks=Object.keys(v);for(let i=0;i<ks.length;i++)walk(v[ks[i]]);}
    })(snapshot());
    T("all-numeric-state-finite",nums.length>8&&nums.every(Number.isFinite));
  }catch(err){
    tests.push({name:"unexpected-error",passed:false,info:String(err&&err.message?err.message:err)});
  }
  reset(1812);
  return{passed:tests.every(function(x){return x.passed;}),tests:tests};
}

    e.preventDefault();seek(state.time-5000);
  }else if(e.code==="ArrowRight"){
    if(tg===range)return;
    e.preventDefault();seek(state.time+5000);
  }else if(e.code==="Home"){
    e.preventDefault();reset(DEFAULT_SEED);
  }
});
let lastAct=performance.now();
function poke(){lastAct=performance.now();ui.classList.remove("idle");}
window.addEventListener("pointermove",poke,{passive:true});
window.addEventListener("pointerdown",poke,{passive:true});
window.addEventListener("keydown",poke);
window.addEventListener("touchstart",poke,{passive:true});
function idleCheck(now){
  if(state.playing&&now-lastAct>3200&&!ui.contains(document.activeElement))ui.classList.add("idle");
}

let lastNow=performance.now();
document.addEventListener("visibilitychange",function(){lastNow=performance.now();});
function loop(now){
  let dt=now-lastNow;lastNow=now;
  if(!(dt>=0))dt=0;if(dt>100)dt=100;
  if(state.playing&&!state.ended){
    advance(dt*state.speed);
    renderFrame();tickUI();
  }else if(needsRender){
    renderFrame();needsRender=false;tickUI();
  }
  idleCheck(now);
  requestAnimationFrame(loop);
}

world=buildWorld(state.seed);
resize();
syncUI();
renderFrame();
window.__RED_HOOD_FILM__={
  reset:reset,play:play,pause:pause,seek:seek,seekScene:seekScene,
  setSpeed:setSpeed,setCaptions:setCaptions,getShotList:getShotList,
  snapshot:snapshot,runSelfTest:runSelfTest,_step:_step
};
requestAnimationFrame(function(ts){lastNow=ts;requestAnimationFrame(loop);});
})();
</script>
