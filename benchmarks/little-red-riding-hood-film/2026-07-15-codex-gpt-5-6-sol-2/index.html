<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GPT-5</title>
  <style>
    :root{--paper:#e8dcc2;--ink:#15181a;--red:#b51f2c;--cream:#f4ead1;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0c0d}
    body{display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;color:var(--cream);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    .film-frame{position:relative;width:100vw;height:100vh;min-height:240px;overflow:hidden;background:#0c0f10;isolation:isolate}
    #film{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#0c0f10}
    .film-frame::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px rgba(0,0,0,.48),inset 0 0 2px rgba(255,255,255,.3);mix-blend-mode:multiply;z-index:2}
    h1{position:absolute;z-index:4;top:max(14px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));margin:0;color:rgba(255,248,225,.86);font:600 clamp(11px,1.15vw,17px)/1.1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.65);pointer-events:none}
    .chapter-readout{position:absolute;z-index:4;top:max(14px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));color:rgba(255,248,225,.78);font:700 clamp(9px,.82vw,12px)/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.75);pointer-events:none;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .caption-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    .controls{position:absolute;z-index:5;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto minmax(120px,1fr) auto;align-items:center;gap:12px;padding:8px 10px;border:1px solid rgba(255,246,218,.16);background:linear-gradient(180deg,rgba(11,14,15,.62),rgba(11,14,15,.82));backdrop-filter:blur(10px) saturate(.8);box-shadow:0 10px 34px rgba(0,0,0,.3);opacity:.94;transform:translateY(0);transition:opacity 280ms var(--ease),transform 280ms var(--ease);font-family:ui-sans-serif,system-ui,sans-serif}
    .film-frame.controls-idle .controls{opacity:.14;transform:translateY(4px)}.film-frame.controls-idle .controls:hover,.film-frame.controls-idle .controls:focus-within{opacity:.96;transform:translateY(0)}
    .transport,.options{display:flex;align-items:center;gap:5px}button{appearance:none;min-width:38px;min-height:38px;border:1px solid rgba(255,246,218,.18);border-radius:0;background:rgba(255,255,255,.035);color:#fff7df;padding:0 10px;font:700 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;cursor:pointer;transition:transform 130ms var(--ease),background 180ms var(--ease),border-color 180ms var(--ease);touch-action:manipulation}
    button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,246,218,.42)}button:active{transform:scale(.96)}button:focus-visible,input:focus-visible{outline:2px solid #f3cf7a;outline-offset:2px}button[aria-pressed="true"]{background:rgba(181,31,44,.62);border-color:rgba(255,230,199,.5)}#playPause{min-width:62px}
    .timeline{min-width:0;display:grid;gap:3px}.scrub-wrap{position:relative;height:20px;display:flex;align-items:center}input[type="range"]{position:relative;z-index:2;width:100%;height:20px;margin:0;appearance:none;background:transparent;cursor:pointer;touch-action:pan-y}input[type="range"]::-webkit-slider-runnable-track{height:3px;background:rgba(255,244,214,.3)}input[type="range"]::-moz-range-track{height:3px;background:rgba(255,244,214,.3)}input[type="range"]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;margin-top:-4.5px;border:2px solid #fff0d2;border-radius:50%;background:#b51f2c;box-shadow:0 0 0 3px rgba(0,0,0,.25)}input[type="range"]::-moz-range-thumb{width:10px;height:10px;border:2px solid #fff0d2;border-radius:50%;background:#b51f2c}
    .markers{position:absolute;inset:0 6px;z-index:3;pointer-events:none}.marker{position:absolute;top:50%;width:10px;min-width:10px;height:20px;min-height:20px;padding:0;transform:translate(-50%,-50%);border:0;background:transparent;pointer-events:auto}.marker::after{content:"";display:block;width:1px;height:7px;margin:auto;background:rgba(255,246,218,.65)}.marker:hover,.marker:focus-visible{transform:translate(-50%,-50%) scale(1.25);background:transparent}
    .time-row{display:flex;justify-content:space-between;color:rgba(255,246,218,.7);font-size:9px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
    @media(max-width:700px){.controls{grid-template-columns:auto 1fr;gap:6px 9px;padding:6px}.timeline{grid-row:1;grid-column:1/-1}.transport{grid-row:2}.options{grid-row:2;justify-self:end}button{min-width:36px;min-height:36px;padding:0 8px}#playPause{min-width:56px}.chapter-readout{top:12px;right:12px}h1{top:12px;left:12px}}
    @media(max-height:430px){.controls{bottom:5px;padding-block:4px}button{min-height:32px}.time-row{display:none}}
    @media(prefers-reduced-motion:reduce){.controls,button{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="film-frame" id="frame" aria-label="Little Red Riding Hood illustrated film">
    <canvas id="film" width="1600" height="900" aria-label="Animated illustrated film canvas"></canvas>
    <h1>GPT-5</h1>
    <div class="chapter-readout" id="chapterReadout" aria-hidden="true"></div>
    <div class="caption-live" id="captionLive" aria-live="polite"></div>
    <nav class="controls" aria-label="Film controls">
      <div class="transport"><button id="replay" type="button" aria-label="Replay from the beginning">↺</button><button id="playPause" type="button" aria-label="Pause film">Pause</button></div>
      <div class="timeline"><div class="scrub-wrap"><input id="scrubber" type="range" min="0" max="112000" step="1" value="0" aria-label="Film timeline"><div class="markers" id="markers" aria-label="Sequence markers"></div></div><div class="time-row"><span id="timecode">00:00</span><span>01:52</span></div></div>
      <div class="options"><button id="speed" type="button" aria-label="Playback speed, 1 times">1×</button><button id="captions" type="button" aria-label="Turn captions off" aria-pressed="true">CC</button></div>
    </nav>
  </main>
  <script>
  (()=>{'use strict';
    const W=1600,H=900,DURATION=112000,DEFAULT_SEED=1812;
    const SHOTS=Object.freeze([
      {index:0,name:'The Basket',start:0,end:9000},{index:1,name:'The Red Departure',start:9000,end:18000},{index:2,name:'The Forest Threshold',start:18000,end:27000},{index:3,name:'The Wolf Appears',start:27000,end:38000},{index:4,name:'The Question',start:38000,end:47000},{index:5,name:'The Race',start:47000,end:57000},{index:6,name:"At Grandmother's Door",start:57000,end:66000},{index:7,name:'The Disguise',start:66000,end:75000},{index:8,name:'Red Arrives',start:75000,end:84000},{index:9,name:'What Big…',start:84000,end:95000},{index:10,name:'The Rescue',start:95000,end:104000},{index:11,name:'The Path Home',start:104000,end:112000}
    ]);
    const canvas=document.getElementById('film'),ctx=canvas.getContext('2d',{alpha:false}),frame=document.getElementById('frame'),playPause=document.getElementById('playPause'),replayButton=document.getElementById('replay'),speedButton=document.getElementById('speed'),captionsButton=document.getElementById('captions'),scrubber=document.getElementById('scrubber'),markers=document.getElementById('markers'),timecode=document.getElementById('timecode'),chapterReadout=document.getElementById('chapterReadout'),captionLive=document.getElementById('captionLive'),reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    let seed=DEFAULT_SEED,filmTime=0,playing=true,speed=1,captionsEnabled=true,completed=false,lastWall=performance.now(),lastCaption='',lastChapter=-1,idleTimer=0,texture=[];
    const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,inv=(v,a,b)=>clamp((v-a)/(b-a)),smooth=t=>{t=clamp(t);return t*t*(3-2*t)},pulse=(t,a,b,feather=.12)=>{const p=inv(t,a,b);return smooth(p/feather)*smooth((1-p)/feather)},hash=(n,s=seed)=>{const x=Math.sin(n*127.1+s*311.7)*43758.5453123;return x-Math.floor(x)},wave=(t,rate=1,phase=0)=>Math.sin(t*rate+phase),fmt=ms=>{const total=Math.floor(ms/1000);return`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`};
    function seededTexture(s){let x=(s|0)||1;const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296};texture=Array.from({length:460},()=>({x:rnd()*W,y:rnd()*H,r:.25+rnd()*1.7,a:.018+rnd()*.035}))}
    function shotIndexAt(ms){if(ms>=DURATION)return 11;for(let i=0;i<SHOTS.length;i++)if(ms>=SHOTS[i].start&&ms<SHOTS[i].end)return i;return 0}function localTime(i,ms=filmTime){return(ms-SHOTS[i].start)/1000}
    function paper(color,grain='#171918'){ctx.fillStyle=color;ctx.fillRect(0,0,W,H);ctx.save();for(const d of texture){ctx.globalAlpha=d.a;ctx.fillStyle=grain;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}ctx.restore()}
    function wash(x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    function vignette(strength=.45){const g=ctx.createRadialGradient(W*.5,H*.47,H*.18,W*.5,H*.47,W*.68);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(8,10,10,${strength})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

    function leaf(x,y,s,rot,color='#36463d',alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(11,-8,22,0);ctx.quadraticCurveTo(11,8,0,0);ctx.fill();ctx.strokeStyle='rgba(20,25,24,.38)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(1,0);ctx.lineTo(19,0);ctx.stroke();ctx.restore()}
    function tree(x,ground,s,sway=0,tone='#252d2b',foreground=false){ctx.save();ctx.translate(x,ground);ctx.scale(s,s);ctx.rotate(sway);ctx.fillStyle=tone;ctx.beginPath();ctx.moveTo(-25,0);ctx.bezierCurveTo(-16,-130,-27,-260,-8,-390);ctx.bezierCurveTo(2,-270,19,-135,31,0);ctx.closePath();ctx.fill();ctx.lineCap='round';ctx.strokeStyle=tone;ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(-4,-270);ctx.quadraticCurveTo(-65,-335,-100,-352);ctx.moveTo(1,-320);ctx.quadraticCurveTo(55,-380,93,-388);ctx.stroke();ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-82,-344);ctx.lineTo(-124,-376);ctx.moveTo(73,-376);ctx.lineTo(112,-420);ctx.stroke();if(!foreground)for(let i=0;i<15;i++)leaf((hash(i+x)*190)-95,-350+hash(i+33+x)*110,.7+hash(i+72+x)*.7,hash(i+91+x)*6.2,i%3===0?'#52604b':'#3f5146',.9);ctx.restore()}

    function drawRed(x,y,s,opt={}){const dir=opt.dir??1,walk=opt.walk??0,reach=opt.reach??0,basketOn=opt.basket!==false,bob=Math.abs(Math.sin(walk))*3;ctx.save();ctx.translate(x,y-bob*s);ctx.scale(s*dir,s);ctx.strokeStyle='#1b1b1b';ctx.lineCap='round';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-12,-17);ctx.lineTo(-17+Math.sin(walk)*12,25);ctx.moveTo(10,-17);ctx.lineTo(17-Math.sin(walk)*12,25);ctx.stroke();ctx.fillStyle='#262f3b';ctx.beginPath();ctx.moveTo(-28,-105);ctx.quadraticCurveTo(0,-128,27,-105);ctx.lineTo(34,-18);ctx.quadraticCurveTo(0,-5,-35,-18);ctx.closePath();ctx.fill();ctx.strokeStyle='#17191a';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#a71928';ctx.beginPath();ctx.moveTo(-32,-113);ctx.quadraticCurveTo(-63,-67,-45,-17);ctx.lineTo(7,-40);ctx.lineTo(34,-113);ctx.closePath();ctx.fill();ctx.strokeStyle='#46151a';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#d6aa81';ctx.beginPath();ctx.arc(0,-145,28,0,6.3);ctx.fill();ctx.strokeStyle='#2b211d';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#a71928';ctx.beginPath();ctx.moveTo(-34,-154);ctx.quadraticCurveTo(-27,-189,3,-189);ctx.quadraticCurveTo(39,-181,37,-145);ctx.lineTo(26,-113);ctx.lineTo(0,-128);ctx.lineTo(-27,-113);ctx.closePath();ctx.fill();ctx.strokeStyle='#46151a';ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.moveTo(-5,-189);ctx.lineTo(25,-207);ctx.lineTo(19,-181);ctx.fill();ctx.stroke();ctx.fillStyle='#30201c';ctx.beginPath();ctx.arc(dir===1?10:-10,-148,3.5,0,6.3);ctx.fill();ctx.strokeStyle='#d6aa81';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(21,-96);ctx.lineTo(48+reach*18,-65-reach*28);ctx.stroke();ctx.beginPath();ctx.moveTo(-21,-96);ctx.lineTo(-44,-58);ctx.stroke();if(basketOn)basket(-50,-34,.42,opt.basketOpen||0);ctx.restore()}
