function fixedStep(dt){time+=dt;powerLevel=THREE.MathUtils.damp(powerLevel,powered?1:0,1.4,dt);thermal=THREE.MathUtils.damp(thermal,powered?1:0,powered?.18:.12,dt);smoothAmount=THREE.MathUtils.damp(smoothAmount,amount,2,dt);
for(let i=0;i<N;i++){const b=parcels[i];b.age+=dt;let localHeat=powered?Math.max(0,1-(b.y-1.3)/1.65)*( .78+heat*.45):0;let cooling=.045+Math.max(0,b.y-3.2)*.35;b.temp+=((localHeat*(1-b.temp)*.64)-(cooling*b.temp))*dt;
const buoyancy=(b.temp-.43)*(.75+heat*.8);let targetVelocity=buoyancy*thermal*.8-(1-thermal)*.17; b.v=THREE.MathUtils.damp(b.v,targetVelocity,1.3,dt);b.y+=b.v*dt*(.4+heat*1.3);
const radius=b.r*(.65+smoothAmount*.64)*(1+b.temp*.11);const low=1.3+radius*.6,high=4.63-radius*1.2;
if(b.y<low){b.y=low;b.v=Math.max(0,b.v);if(powered&&b.temp>.68){b.x+=(random()-.5)*.008;b.z+=(random()-.5)*.008;}}
if(b.y>high){b.y=high;b.temp-=dt*.45;b.v=Math.min(b.v,0);}
b.x+=Math.sin(time*.27+b.phase+b.y)*dt*.022*thermal;b.z+=Math.cos(time*.21+b.phase*2)*dt*.021*thermal;const maxR=Math.max(.025,.61-(b.y-1.3)*.077-radius*1.13-.04);const radial=Math.hypot(b.x,b.z);if(radial>maxR){b.x*=maxR/radial;b.z*=maxR/radial;}
// Neighboring streams entrain each other, while unequal cooling opens necks.
for(let j=0;j<i;j++){const a=parcels[j],dx=b.x-a.x,dz=b.z-a.z,dy=b.y-a.y;const d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d<.4&&d>.01){const f=dt*.012/(d+.05);b.x-=dx*f;b.z-=dz*f;}}
const stretch=1+Math.min(.65,Math.abs(b.v)*2.4)*thermal+Math.sin(time*(.65+b.r)+b.phase)*.085*thermal;
blobUniform[i].set(b.x,b.y,b.z,radius);shapeUniform[i].set(radius/Math.sqrt(stretch),radius*stretch,radius/Math.sqrt(stretch),b.temp);
}
waxUniforms.uTime.value=time;waxUniforms.uPool.value=.055+smoothAmount*.135+(1-thermal)*.16;waxUniforms.uPower.value=powerLevel;
}
const powerButton=document.querySelector('#power');powerButton.addEventListener('click',()=>{powered=!powered;powerButton.setAttribute('aria-checked',String(powered));document.querySelector('#power-label').textContent=powered?'Lamp is on':'Cooling down';document.querySelector('#power-dot').style.opacity=powered?'1':'.25';if(powered&&thermal<.4)for(const b of parcels)b.temp=Math.min(b.temp,.18);switchLever.rotation.x=powered?-.2:.2;});
for(const button of document.querySelectorAll('.swatch'))button.addEventListener('click',()=>{preset=Number(button.dataset.preset);const p=presets[preset];targetWax.set(p.wax);targetLiquid.set(p.liquid);targetLight.set(p.light);document.querySelector('#palette-name').textContent=p.name;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
for(const id of ['heat','amount']){const input=document.getElementById(id);function update(){const v=Number(input.value);document.getElementById(id+'-value').textContent=v+'%';input.style.background=`linear-gradient(to right,#b9916a ${(v-20)/80*100}%,#ffffff1c ${(v-20)/80*100}%)`;if(id==='heat')heat=v/100;else amount=v/100;}input.addEventListener('input',update);update();}
document.querySelector('#orbit').addEventListener('click',e=>{orbit.autoRotate=!orbit.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(orbit.autoRotate));});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);if(innerWidth<700){orbit.target.set(-.15,2.6,0);camera.position.set(8,4.7,14.8);}else orbit.target.set(-.65,2.65,0);}addEventListener('resize',resize);if(innerWidth<700)resize();
let frameCount=0,frameSum=0,quality=renderer.getPixelRatio();
function animate(now){requestAnimationFrame(animate);const delta=Math.min((now-last)/1000,.1);last=now;accumulator+=delta;while(accumulator>=1/60){fixedStep(1/60);accumulator-=1/60;}orbit.update();camera.updateMatrixWorld();waxUniforms.uViewProjection.value.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
const blend=1-Math.exp(-delta*2);waxUniforms.uWax.value.lerp(targetWax,blend);waxUniforms.uLiquid.value.lerp(targetLiquid,blend);liquidMat.attenuationColor.lerp(targetLiquid,blend);liquidMat.color.lerp(targetLiquid,blend*.5);glassMat.attenuationColor.lerp(targetLiquid,blend);bulb.color.lerp(targetLight,blend);spill.color.copy(bulb.color);wallLight.color.copy(bulb.color);glow.material.color.copy(bulb.color);
const occlusion=parcels.reduce((v,b)=>v+Math.exp(-Math.pow((b.y-1.55)*2.5,2))*b.r,0);const flicker=1-.12*Math.min(1,occlusion)+Math.sin(time*.8)*.018;
bulb.intensity=34*powerLevel*flicker;spill.intensity=8*powerLevel*(.85+Math.sin(time*.7)*.07);wallLight.intensity=10*powerLevel*flicker;glow.material.opacity=.3*powerLevel;bulbMesh.material.color.copy(bulb.color).multiplyScalar(4*powerLevel+.03);
if(frameCount%60===0)document.querySelector('#state').textContent=!powered?(thermal>.18?'Cooling · settling':'At rest'):thermal<.6?'Warming the wax':'Slowly, beautifully moving';
composer.render();frameCount++;frameSum+=delta;if(frameCount%180===0){const mean=frameSum/180;if(mean>.029&&quality>.85){quality=Math.max(.85,quality-.15);renderer.setPixelRatio(quality);composer.setPixelRatio(quality);}frameSum=0;}if(frameCount===2){document.querySelector('#loading').style.opacity=0;window.__lampReady=true;}}
// Start in thermal equilibrium: the lamp is already running on arrival.
fixedStep(1/60);requestAnimationFrame(animate);
window.addEventListener('error',event=>{console.error('Lamp:',event.message);});
renderer.domElement.addEventListener('webglcontextlost',event=>{event.preventDefault();document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='The graphics context was interrupted. Reload to relight the lamp.';});
</script>
</body>
</html>
