<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>EMBER</title>
  <style>
    :root { color-scheme: dark; --ink: #eee9df; --muted: #9d9aa0; --line: rgba(231,220,207,.12); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090d; }
    body { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    .shade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 37%, rgba(4,5,9,.18) 68%, rgba(3,4,7,.72) 120%), linear-gradient(180deg, rgba(5,6,9,.22), transparent 34%, transparent 75%, rgba(4,5,8,.36)); }
    .brand { position: fixed; left: clamp(22px, 4vw, 58px); top: clamp(21px, 4vh, 43px); margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .34em; line-height: 1; color: rgba(245,233,217,.83); }
    .panel { position: fixed; left: clamp(18px, 3.6vw, 52px); top: 50%; transform: translateY(-50%); width: 228px; padding: 17px 17px 15px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(145deg, rgba(20,21,26,.79), rgba(10,11,15,.65)); box-shadow: 0 18px 65px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.035); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .section { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .label { color: #bcb8b3; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .power { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .power-state { display: flex; align-items: center; gap: 9px; color: #e9e1d8; font-size: 11px; letter-spacing: .08em; }
    .indicator { width: 6px; height: 6px; border-radius: 50%; background: #f4a158; box-shadow: 0 0 12px #ee8438; transition: .35s; }
    .is-off .indicator { background: #595b60; box-shadow: none; }
    .toggle { appearance: none; width: 34px; height: 19px; padding: 2px; margin: 0; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: #28292c; cursor: pointer; transition: background .3s, border-color .3s; }
    .toggle::before { content: ""; display: block; width: 13px; height: 13px; border-radius: 50%; background: #d8d4cf; box-shadow: 0 1px 3px #0008; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .toggle:checked { background: #c36e39; border-color: #da8a4f; }
    .toggle:checked::before { transform: translateX(15px); background: #fff4e8; }
    .toggle:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #f4b77f; outline-offset: 3px; }
    .color-block { padding: 14px 0 15px; }
    .swatches { display: flex; gap: 9px; padding-top: 10px; }
    .swatch { position: relative; width: 25px; height: 25px; padding: 0; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; cursor: pointer; box-shadow: inset 0 1px 4px #fff4, 0 2px 6px #0008; transition: transform .22s, box-shadow .22s; }
    .swatch:hover { transform: translateY(-2px); }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #121317, 0 0 0 3px #e6c7a7, inset 0 1px 4px #fff5; }
    .range-block { padding: 12px 0 4px; border-top: 1px solid var(--line); }
    .range-block + .range-block { padding-top: 12px; }
    .readout { color: #c8c0b7; font-variant-numeric: tabular-nums; font-size: 10px; }
    input[type="range"] { display: block; width: 100%; height: 16px; margin: 8px 0 0; appearance: none; background: transparent; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; border-radius: 4px; background: linear-gradient(90deg, #d28a55 var(--fill, 50%), rgba(255,255,255,.17) var(--fill, 50%)); }
    input[type="range"]::-moz-range-track { height: 2px; border-radius: 4px; background: rgba(255,255,255,.17); }
    input[type="range"]::-moz-range-progress { height: 2px; background: #d28a55; }
    input[type="range"]::-webkit-slider-thumb { width: 10px; height: 10px; margin-top: -4px; appearance: none; border: 1px solid #f2d2b2; border-radius: 50%; background: #c98755; box-shadow: 0 0 9px #c987554d; }
    input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; border: 1px solid #f2d2b2; border-radius: 50%; background: #c98755; }
    .hint { position: fixed; right: clamp(20px, 3.5vw, 48px); bottom: clamp(22px, 4vh, 40px); color: rgba(220,215,207,.45); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; }
    @media (max-width: 650px) {
      .brand { top: 19px; left: 22px; }
      .panel { top: auto; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(360px, calc(100vw - 34px)); padding: 13px 15px 12px; }
      .power { padding-bottom: 10px; }
      .color-block { padding: 10px 0; }
      .swatches { padding-top: 8px; }
      .range-block { padding-top: 10px; }
      .range-block + .range-block { padding-top: 9px; }
      .hint { right: 18px; bottom: calc(238px + env(safe-area-inset-bottom)); font-size: 8px; }
    }
    @media (max-height: 650px) and (min-width: 651px) { .panel { top: 54%; transform: translateY(-50%) scale(.9); transform-origin: left center; } }
  </style>
</head>
<body>
  <h1 class="brand">EMBER</h1>
  <canvas id="scene" aria-label="A glowing, animated lava lamp in a dim room"></canvas>
  <div class="shade"></div>
  <section class="panel" aria-label="Lamp controls">
    <div class="power">
      <div class="power-state"><span class="indicator"></span><span id="powerText">POWER ON</span></div>
      <input class="toggle" id="power" type="checkbox" checked aria-label="Power">
    </div>
    <div class="color-block">
      <div class="section"><span class="label">Color</span></div>
      <div class="swatches" role="group" aria-label="Color presets">
        <button class="swatch" type="button" aria-label="Classic" aria-pressed="true" data-preset="classic" style="background:radial-gradient(circle at 35% 28%,#ffbd6d,#d5401d 63%,#651e17)"></button>
        <button class="swatch" type="button" aria-label="Lagoon" aria-pressed="false" data-preset="lagoon" style="background:radial-gradient(circle at 35% 28%,#95fff1,#16a6b5 63%,#155560)"></button>
        <button class="swatch" type="button" aria-label="Amethyst" aria-pressed="false" data-preset="amethyst" style="background:radial-gradient(circle at 35% 28%,#ffc7f1,#aa45c0 63%,#502065)"></button>
        <button class="swatch" type="button" aria-label="Aurora" aria-pressed="false" data-preset="aurora" style="background:radial-gradient(circle at 35% 28%,#e6ff9b,#74b749 63%,#305d39)"></button>
      </div>
    </div>
    <div class="range-block">
      <div class="section"><label class="label" for="heat">Heat</label><span class="readout" id="heatReadout">68%</span></div>
      <input id="heat" type="range" min="35" max="100" value="68" aria-label="Heat">
    </div>
    <div class="range-block">
      <div class="section"><label class="label" for="amount">Wax amount</label><span class="readout" id="amountReadout">65%</span></div>
      <input id="amount" type="range" min="30" max="100" value="65" aria-label="Wax amount">
    </div>
  </section>
  <div class="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/OutputPass.js';

    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setClearColor(0x08090d, 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#090a0e');
    const camera = new THREE.PerspectiveCamera(36, 1, .1, 80);
    camera.position.set(4.1, 3.35, 8.1);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.75, 0);
    controls.enableDamping = true;
    controls.dampingFactor = .055;
    controls.minDistance = 4.7;
    controls.maxDistance = 13;
    controls.minPolarAngle = .22;
    controls.maxPolarAngle = Math.PI * .49;
    controls.rotateSpeed = .62;
    controls.zoomSpeed = .72;
    controls.update();

    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
    pmrem.dispose();

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .72, .52, .72);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const ambient = new THREE.HemisphereLight(0x9baac7, 0x2b1e1a, .42);
    scene.add(ambient);
    const coolFill = new THREE.PointLight(0x52658e, 13, 14, 2);
    coolFill.position.set(-4, 4.5, 2.2);
    scene.add(coolFill);

    const wall = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), new THREE.MeshStandardMaterial({ color: 0x19191d, roughness: .92, metalness: .04 }));
    wall.position.set(0, 3.6, -3.8);
    scene.add(wall);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x282321, roughness: .36, metalness: .16 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -.285;
    ground.receiveShadow = true;
    scene.add(ground);

    const woodGrain = document.createElement('canvas');
    woodGrain.width = 512; woodGrain.height = 512;
    const grainCtx = woodGrain.getContext('2d');
    grainCtx.fillStyle = '#58453a'; grainCtx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 1600; i++) {
      const y = Math.random() * 512, alpha = .025 + Math.random() * .045;
      grainCtx.strokeStyle = `rgba(${Math.random() > .5 ? '222,175,129' : '27,19,15'},${alpha})`;
      grainCtx.lineWidth = .4 + Math.random() * 2.4;
      grainCtx.beginPath(); grainCtx.moveTo(0, y); grainCtx.bezierCurveTo(150, y + Math.random() * 16 - 8, 350, y + Math.random() * 20 - 10, 512, y + Math.random() * 12 - 6); grainCtx.stroke();
    }
    const woodTexture = new THREE.CanvasTexture(woodGrain);
    woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
    woodTexture.repeat.set(4, 2);
    woodTexture.colorSpace = THREE.SRGBColorSpace;
    const table = new THREE.Mesh(new THREE.BoxGeometry(9, .22, 5.2), new THREE.MeshStandardMaterial({ map: woodTexture, color: 0xb6a395, roughness: .32, metalness: .08 }));
    table.position.set(0, -.15, 0);
    table.receiveShadow = true;
    scene.add(table);
    const tableEdge = new THREE.Mesh(new THREE.BoxGeometry(9.02, .035, 5.22), new THREE.MeshStandardMaterial({ color: 0x211a17, roughness: .42, metalness: .25 }));
    tableEdge.position.y = -.274; scene.add(tableEdge);

    const darkMat = new THREE.MeshStandardMaterial({ color: 0x121216, roughness: .36, metalness: .28 });
    const ceramic = new THREE.MeshStandardMaterial({ color: 0x252327, roughness: .27, metalness: .12 });
    const propGeo = new THREE.LatheGeometry([
      new THREE.Vector2(0, .03), new THREE.Vector2(.24, .03), new THREE.Vector2(.34, .09), new THREE.Vector2(.4, .4), new THREE.Vector2(.32, .88), new THREE.Vector2(.23, 1.2), new THREE.Vector2(.21, 1.27), new THREE.Vector2(.18, 1.27)
    ], 48);
    const vase = new THREE.Mesh(propGeo, ceramic);
    vase.position.set(-2.3, -.075, -1.4); vase.rotation.z = .08; vase.castShadow = true; vase.receiveShadow = true; scene.add(vase);
    const book1 = new THREE.Mesh(new THREE.BoxGeometry(.86, .13, 1.1), new THREE.MeshStandardMaterial({ color: 0x393133, roughness: .7 }));
    book1.position.set(2.15, .025, -1.35); book1.rotation.y = -.17; book1.castShadow = true; scene.add(book1);
    const book2 = new THREE.Mesh(new THREE.BoxGeometry(.78, .12, .96), new THREE.MeshStandardMaterial({ color: 0x777065, roughness: .66 }));
    book2.position.set(2.2, .155, -1.3); book2.rotation.y = -.11; book2.castShadow = true; scene.add(book2);

    const lamp = new THREE.Group();
    lamp.position.y = -.065;
    scene.add(lamp);
    const silver = new THREE.MeshStandardMaterial({ color: 0x9b9da1, metalness: .94, roughness: .22, envMapIntensity: 1.65 });
    const steelDark = new THREE.MeshStandardMaterial({ color: 0x42444a, metalness: .86, roughness: .29, envMapIntensity: 1.4 });
    const black = new THREE.MeshStandardMaterial({ color: 0x141519, metalness: .28, roughness: .34 });
    const metalBase = new THREE.Mesh(new THREE.LatheGeometry([
      new THREE.Vector2(0, .025), new THREE.Vector2(.39, .025), new THREE.Vector2(.47, .09), new THREE.Vector2(.46, .16), new THREE.Vector2(.4, .22), new THREE.Vector2(.35, .53), new THREE.Vector2(.34, .59), new THREE.Vector2(.3, .62), new THREE.Vector2(0, .62)
    ], 96), silver);
    metalBase.castShadow = true; metalBase.receiveShadow = true; lamp.add(metalBase);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(.456, .466, .075, 96), steelDark);
    foot.position.y = .085; foot.castShadow = true; lamp.add(foot);
    const baseTrim = new THREE.Mesh(new THREE.TorusGeometry(.383, .012, 12, 96), steelDark);
    baseTrim.rotation.x = Math.PI / 2; baseTrim.position.y = .225; lamp.add(baseTrim);
    const topTrim = new THREE.Mesh(new THREE.TorusGeometry(.342, .012, 12, 96), steelDark);
    topTrim.rotation.x = Math.PI / 2; topTrim.position.y = .575; lamp.add(topTrim);
    const cap = new THREE.Mesh(new THREE.LatheGeometry([
      new THREE.Vector2(0, 3.00), new THREE.Vector2(.287, 3.00), new THREE.Vector2(.302, 3.045), new THREE.Vector2(.296, 3.13), new THREE.Vector2(.27, 3.19), new THREE.Vector2(.12, 3.22), new THREE.Vector2(0, 3.22)
    ], 96), silver);
    cap.castShadow = true; lamp.add(cap);
    const capRim = new THREE.Mesh(new THREE.TorusGeometry(.298, .012, 12, 96), steelDark);
    capRim.rotation.x = Math.PI / 2; capRim.position.y = 3.048; lamp.add(capRim);

    const vesselOuter = [
      [0,.605],[.305,.605],[.365,.625],[.397,.675],[.411,.755],[.413,.85],[.401,1.0],[.386,1.35],[.365,1.72],[.344,2.08],[.319,2.43],[.296,2.70],[.282,2.87],[.279,2.96],[.287,3.015],[.303,3.065],[.305,3.105],
      [.292,3.13],[.272,3.115],[.263,3.08],[.258,3.035],[.256,2.97],[.26,2.88],[.276,2.69],[.299,2.42],[.324,2.07],[.345,1.71],[.366,1.34],[.382,.99],[.393,.83],[.39,.755],[.37,.704],[.337,.678],[.286,.668],[0,.668]
    ].map(([r,y]) => new THREE.Vector2(r,y));
    const glass = new THREE.Mesh(new THREE.LatheGeometry(vesselOuter, 128), new THREE.MeshPhysicalMaterial({ color: 0xf1e5d7, metalness: 0, roughness: .065, transmission: .96, thickness: .12, ior: 1.47, attenuationDistance: 2.2, attenuationColor: new THREE.Color('#f0cb77'), envMapIntensity: 1.4, side: THREE.DoubleSide }));
    glass.renderOrder = 5; glass.castShadow = false; lamp.add(glass);

    const liquidGeometry = new THREE.LatheGeometry([
      new THREE.Vector2(0,.69), new THREE.Vector2(.36,.69), new THREE.Vector2(.386,.735), new THREE.Vector2(.392,.82), new THREE.Vector2(.376,1.0), new THREE.Vector2(.352,1.38), new THREE.Vector2(.33,1.76), new THREE.Vector2(.307,2.12), new THREE.Vector2(.281,2.48), new THREE.Vector2(.264,2.73), new THREE.Vector2(.257,2.88), new THREE.Vector2(.248,2.89), new THREE.Vector2(0,2.89)
    ], 96);
    const liquidMat = new THREE.MeshPhysicalMaterial({ color: '#e2ad5b', metalness: 0, roughness: .12, transmission: .34, thickness: .36, ior: 1.34, transparent: true, opacity: .33, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: .65 });
    const liquid = new THREE.Mesh(liquidGeometry, liquidMat);
    liquid.renderOrder = 1; lamp.add(liquid);

    const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffcf8c, emissive: 0xff701b, emissiveIntensity: 4.4, roughness: .24, metalness: 0 });
    const bulb = new THREE.Mesh(new THREE.LatheGeometry([
      new THREE.Vector2(0,.49), new THREE.Vector2(.12,.49), new THREE.Vector2(.15,.54), new THREE.Vector2(.13,.61), new THREE.Vector2(.095,.70), new THREE.Vector2(.085,.78), new THREE.Vector2(.07,.81), new THREE.Vector2(0,.81)
    ], 48), bulbMat);
    lamp.add(bulb);
    const bulbSocket = new THREE.Mesh(new THREE.CylinderGeometry(.15,.18,.09,48), steelDark); bulbSocket.position.y=.53; lamp.add(bulbSocket);
    const bulbLight = new THREE.PointLight(0xff782c, 54, 5.2, 2);
    bulbLight.position.set(0,.88,0); bulbLight.castShadow = true; bulbLight.shadow.mapSize.set(512,512); bulbLight.shadow.bias = -.0003; bulbLight.shadow.radius = 5; lamp.add(bulbLight);
    const glowLight = new THREE.PointLight(0xff9a48, 17, 6.5, 2); glowLight.position.set(0,1.25,0); lamp.add(glowLight);
    const spillLight = new THREE.PointLight(0xff8a42, 6.5, 3.8, 2); spillLight.position.set(0,.43,.43); lamp.add(spillLight);

    const switchAssembly = new THREE.Group();
    switchAssembly.position.set(.20,.35,.39); switchAssembly.rotation.x = -.23; switchAssembly.rotation.z = -.08; lamp.add(switchAssembly);
    const switchPlate = new THREE.Mesh(new THREE.CylinderGeometry(.063,.063,.022,32), black); switchPlate.rotation.x=Math.PI/2; switchAssembly.add(switchPlate);
    const switchRing = new THREE.Mesh(new THREE.TorusGeometry(.052,.006,8,32), silver); switchRing.position.z=.014; switchRing.rotation.x=Math.PI/2; switchAssembly.add(switchRing);
    const switchLever = new THREE.Group(); switchLever.position.set(0,0,.025); switchAssembly.add(switchLever);
    switchLever.rotation.x=-.33;
    const lever = new THREE.Mesh(new THREE.CylinderGeometry(.014,.019,.085,16), steelDark); lever.position.z=.032; lever.rotation.x=.28; switchLever.add(lever);
    const leverTip = new THREE.Mesh(new THREE.SphereGeometry(.024,16,12), silver); leverTip.position.z=.07; switchLever.add(leverTip);

    const cordPoints = [new THREE.Vector3(-.04,.075,-.42), new THREE.Vector3(-.13,.055,-.57), new THREE.Vector3(-.34,.035,-.72), new THREE.Vector3(-.66,.023,-.82), new THREE.Vector3(-1.18,.02,-.87), new THREE.Vector3(-2.1,.02,-.88), new THREE.Vector3(-3.05,.02,-.9), new THREE.Vector3(-4.1,-.01,-.91), new THREE.Vector3(-4.7,-.16,-.91)];
    const cord = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cordPoints), 80, .027, 10, false), black); lamp.add(cord);

    const maxBlobs = 10;
    const blobUniforms = {
      uTime: { value: 0 }, uCameraLocal: { value: new THREE.Vector3() }, uCount: { value: 0 },
      uBlobs: { value: Array.from({ length: maxBlobs }, () => new THREE.Vector4()) },
      uBlobMeta: { value: Array.from({ length: maxBlobs }, () => new THREE.Vector4()) },
      uWaxColor: { value: new THREE.Color('#d83b20') }, uLampPos: { value: new THREE.Vector3(0,.84,0) }, uGlow: { value: 1 }, uAmount: { value: .65 }
    };
    const blobMaterial = new THREE.ShaderMaterial({
      uniforms: blobUniforms, transparent: true, depthWrite: false, depthTest: true, side: THREE.FrontSide,
      vertexShader: `varying vec3 vLocalPosition; void main(){ vLocalPosition = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        precision highp float;
        varying vec3 vLocalPosition;
        uniform vec3 uCameraLocal, uWaxColor, uLampPos;
        uniform float uTime, uGlow, uAmount;
        uniform int uCount;
        uniform vec4 uBlobs[10];
        uniform vec4 uBlobMeta[10];
        float sdEllipsoid(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/max(k1,0.0001); }
        float smin(float a,float b,float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*.25; }
        float vesselRadius(float y){ return clamp(.414-(y-.82)*.054,.271,.414); }
        float field(vec3 p){
          float d=sdEllipsoid(p-vec3(0.0,.735,0.0),vec3(.352*uAmount,.119*uAmount,.352*uAmount));
          for(int i=1;i<10;i++){ if(i<uCount){ vec4 b=uBlobs[i]; vec4 m=uBlobMeta[i]; float stretch=clamp(m.x,1.0,1.75); vec3 r=vec3(b.w*.91,b.w*stretch,b.w*.91); vec3 q=p-b.xyz; q.x+=sin(uTime*1.8+m.z)*.009; q.z+=cos(uTime*1.55+m.z*1.7)*.009; float bd=sdEllipsoid(q,r); bd+=.006*sin(q.y*34.0+uTime*2.2+m.z)*sin(q.x*29.0-uTime*1.4); d=smin(d,bd,.105); } }
          float wall=length(p.xz)-vesselRadius(p.y);
          float vertical=max(.685-p.y,p.y-2.89);
          return max(d,max(wall,vertical));
        }
        void main(){
          vec3 rd=normalize(vLocalPosition-uCameraLocal);
          vec3 p=vLocalPosition;
          float t=0.0; float d=1.0; bool hit=false;
          for(int i=0;i<46;i++){
            p=vLocalPosition+rd*t; d=field(p);
            if(d<.004){hit=true;break;}
            t+=clamp(d*.78,.012,.12);
            if(t>3.65) break;
          }
          if(!hit) discard;
          vec3 n=normalize(vec3(field(p+vec3(.004,0,0))-field(p-vec3(.004,0,0)),field(p+vec3(0,.004,0))-field(p-vec3(0,.004,0)),field(p+vec3(0,0,.004))-field(p-vec3(0,0,.004))));
          vec3 v=normalize(uCameraLocal-p);
          vec3 l=normalize(uLampPos-p);
          float ndl=max(dot(n,l),0.0);
          float wrap=max((dot(n,l)+.42)/1.42,0.0);
          float fres=pow(1.0-max(dot(n,v),0.0),4.0);
          float thickness=.43*max(.12,abs(dot(n,rd)));
          float thin=exp(-thickness*3.9);
          float bulb=exp(-length(p-uLampPos)*1.85)*uGlow;
          float subsurface=pow(max(dot(-n,l),0.0),1.6)*.65+bulb*.5;
          float light=.31+wrap*.7+ndl*.23+subsurface;
          vec3 deep=uWaxColor*(.66+.46*light);
          vec3 lit=uWaxColor*(1.05+.52*light)+vec3(1.0,.34,.095)*(bulb*.46+subsurface*.25);
          vec3 col=mix(deep,lit,clamp(thin*.76+bulb*.22,0.0,1.0));
          col=mix(col,vec3(1.0,.70,.39),fres*.46);
          float alpha=.89-fres*.19;
          gl_FragColor=vec4(col,alpha);
        }
      `
    });
    const proxyGeometry = new THREE.BoxGeometry(.94,2.34,.94);
    proxyGeometry.translate(0,1.80,0);
    const waxVolume = new THREE.Mesh(proxyGeometry, blobMaterial);
    waxVolume.renderOrder = 2; waxVolume.frustumCulled = false; lamp.add(waxVolume);

    const presets = {
      classic: { wax: '#d73a20', liquid: '#e4b958', attenuation: '#eecb76' },
      lagoon: { wax: '#27cfce', liquid: '#345b91', attenuation: '#78bfc6' },
      amethyst: { wax: '#c33ed1', liquid: '#573b76', attenuation: '#bc7acc' },
      aurora: { wax: '#8fe14c', liquid: '#425d60', attenuation: '#a9d783' }
    };
    const waxColor = new THREE.Color(presets.classic.wax);
    const liquidColor = new THREE.Color(presets.classic.liquid);
    function choosePreset(name){
      const p=presets[name]; if(!p) return;
      waxColor.set(p.wax); liquidColor.set(p.liquid);
      blobUniforms.uWaxColor.value.copy(waxColor);
      liquidMat.color.set(p.liquid);
      glass.material.attenuationColor.set(p.attenuation);
      document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===name)));
    }
    document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>choosePreset(b.dataset.preset)));

    const powerInput=document.querySelector('#power');
    const powerText=document.querySelector('#powerText');
    const panel=document.querySelector('.panel');
    let powered=true, powerLevel=1, desiredHeat=.68, amount=.65, warmup=18, deposit=0;
    powerInput.addEventListener('change',()=>{
      powered=powerInput.checked;
      powerText.textContent=powered?'POWER ON':'POWER OFF';
      panel.classList.toggle('is-off',!powered);
      switchLever.rotation.x=powered?-.33:.34;
      if(powered){ warmup=0; for(const b of blobs) if(b.stage===1) b.stage=2; }
      else { for(const b of blobs) if(b.stage===1) b.stage=2; }
    });
    const heatInput=document.querySelector('#heat');
    const heatReadout=document.querySelector('#heatReadout');
    const amountInput=document.querySelector('#amount');
    const amountReadout=document.querySelector('#amountReadout');
    function updateRange(input,readout){
      const v=Number(input.value), pct=(v-Number(input.min))/(Number(input.max)-Number(input.min))*100;
      input.style.setProperty('--fill',`${pct}%`); readout.textContent=`${v}%`;
    }
    updateRange(heatInput,heatReadout); updateRange(amountInput,amountReadout);
    heatInput.addEventListener('input',()=>{desiredHeat=Number(heatInput.value)/100; updateRange(heatInput,heatReadout);});
    amountInput.addEventListener('input',()=>{amount=Number(amountInput.value)/100; blobUniforms.uAmount.value=amount; liquidMat.opacity=.22+amount*.17; updateRange(amountInput,amountReadout);});

    let seed=385102;
    function random(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
    function newBlob(y,stage){
      const size=.087+random()*.065;
      return {x:(random()-.5)*.16,z:(random()-.5)*.16,y,size,stage,vy:stage===1?.12+random()*.12:0,heat:.53+random()*.32,phase:random()*Math.PI*2,drift:(random()-.5)*.045,age:0,life:8+random()*12};
    }
    const blobs=[newBlob(.97,1),newBlob(1.57,1),newBlob(2.12,2),newBlob(1.18,1),newBlob(2.46,2),newBlob(.82,1),newBlob(0,0),newBlob(0,0),newBlob(0,0),newBlob(0,0)];
    blobs[0].vy=.22; blobs[1].vy=.16; blobs[3].vy=.12; blobs[5].vy=.08;
    let spawnTimer=3.8, splitTimer=7.5;
    const scratch=new THREE.Vector3();
    const fixed=1/60;
    let accumulator=0,last=performance.now()/1000, simTime=0;
    function step(dt){
      simTime+=dt;
      powerLevel=THREE.MathUtils.damp(powerLevel,powered?1:0,1.25,dt);
      const heatFactor=.45+desiredHeat*.55;
      bulbLight.intensity=54*powerLevel*heatFactor;
      glowLight.intensity=17*powerLevel*heatFactor;
      spillLight.intensity=6.5*powerLevel*heatFactor;
      bulbMat.emissiveIntensity=.12+4.4*powerLevel*heatFactor;
      blobUniforms.uGlow.value=powerLevel;
      ambient.intensity=.12+powerLevel*.30;
      coolFill.intensity=8+powerLevel*5;
      warmup+=dt*powerLevel;
      spawnTimer-=dt;
      splitTimer-=dt*powerLevel;
      let active=0;
      for(let i=0;i<blobs.length;i++){
        const b=blobs[i];
        if(b.stage===0) continue;
        active++;
        b.age+=dt;
        const localHeat=Math.exp(-Math.max(0,b.y-.72)*1.08)*powerLevel*desiredHeat;
        const targetHeat=powered ? .13+localHeat*.95 : .08;
        b.heat=THREE.MathUtils.damp(b.heat,targetHeat,powered?1.0:.28,dt);
        if(!powered){
          b.vy=THREE.MathUtils.damp(b.vy,-.25,.34,dt);
          b.y+=b.vy*dt;
          b.size=THREE.MathUtils.damp(b.size,.025,.7,dt);
          if(b.y<.79){ b.stage=0; b.y=0; deposit=Math.min(.08,deposit+.008); active--; }
        }else if(b.stage===1){
          const lift=(b.heat-.35)*(.63+desiredHeat*.5);
          b.vy=THREE.MathUtils.clamp(b.vy+lift*dt,-.12,.31);
          b.vy*=Math.exp(-.24*dt);
          b.y+=b.vy*dt;
          if(b.y>2.54 || (b.heat<.34&&b.y>1.35)) b.stage=2;
        }else if(b.stage===2){
          const buoyancy=(b.heat-.34)*.22;
          b.vy=THREE.MathUtils.clamp(b.vy+(-.22+buoyancy)*dt,-.32,.06);
          b.vy*=Math.exp(-.21*dt);
          b.y+=b.vy*dt;
          if(b.y<.83){ b.stage=0; b.y=0; b.size=0; deposit=Math.min(.09,deposit+.012); active--; }
        }
        const maxR=THREE.MathUtils.clamp(.414-(b.y-.82)*.054,.271,.414)-b.size*.92;
        const swirl=Math.sin(simTime*.43+b.phase)*.12;
        b.x=THREE.MathUtils.clamp(b.x+b.drift*dt+swirl*dt,-maxR,maxR);
        b.z=THREE.MathUtils.clamp(b.z+Math.cos(simTime*.37+b.phase)*.018*dt,-maxR,maxR);
      }
      if(powered && warmup>3.2 && spawnTimer<=0){
        const target=Math.ceil(2+amount*6.5);
        if(active<target){
          const slot=blobs.find(b=>b.stage===0);
          if(slot){ Object.assign(slot,newBlob(.79+random()*.09,1)); slot.size*=.78+amount*.38; slot.heat=.58; active++; }
        }
        spawnTimer=2.5+random()*3.9;
      }
      if(powered && warmup>6 && splitTimer<=0){
        const donor=blobs.find(b=>b.stage===1&&b.size>.125&&b.age>2.2);
        const slot=blobs.find(b=>b.stage===0);
        if(donor&&slot){
          const child=newBlob(donor.y-.045,1);
          child.x=donor.x+.045; child.z=donor.z-.018; child.size=donor.size*.48; child.vy=Math.max(.08,donor.vy*.68); child.heat=donor.heat; child.age=0;
          donor.size*=.92; donor.vy*=.82;
          Object.assign(slot,child);
        }
        splitTimer=9+random()*15;
      }
      const uniforms=blobUniforms.uBlobs.value, meta=blobUniforms.uBlobMeta.value;
      uniforms[0].set(0,.735,0,.35+deposit);
      meta[0].set(1,0,0,0);
      let count=1;
      for(let i=0;i<blobs.length;i++){
        const b=blobs[i];
        if(b.stage===0||b.size<.019) continue;
        const rise=b.stage===1?1:Math.max(.72,1+Math.abs(b.vy)*.42);
        uniforms[count].set(b.x,b.y,b.z,b.size*(.84+b.heat*.22));
        meta[count].set(rise,b.heat,b.phase,0);
        count++;
        if(count>=maxBlobs) break;
      }
      blobUniforms.uCount.value=count;
    }

    const composerSize=new THREE.Vector2();
    let mobileFrame=null;
    function resize(){
      const w=window.innerWidth,h=window.innerHeight;
      const useMobileFrame=w<=650;
      if(useMobileFrame!==mobileFrame){
        camera.position.set(4.1,useMobileFrame?2.9:3.35,8.1);
        controls.target.set(0,useMobileFrame?1.30:1.75,0);
        controls.update(); mobileFrame=useMobileFrame;
      }
      camera.aspect=w/h; camera.updateProjectionMatrix();
      const pixelScale=Math.min(window.devicePixelRatio||1,1.35,Math.sqrt(1250000/(w*h)));
      renderer.setPixelRatio(pixelScale); renderer.setSize(w,h,false);
      composer.setPixelRatio(pixelScale); composer.setSize(w,h);
      composerSize.set(w*pixelScale,h*pixelScale); bloom.setSize(composerSize.x,composerSize.y);
    }
    window.addEventListener('resize',resize,{passive:true}); resize();
    document.addEventListener('visibilitychange',()=>{last=performance.now()/1000; accumulator=0;});
    function frame(nowMs){
      requestAnimationFrame(frame);
      const now=nowMs/1000;
      const elapsed=Math.min(.1,Math.max(0,now-last)); last=now;
      accumulator=Math.min(accumulator+elapsed,.12);
      let ticks=0;
      while(accumulator>=fixed&&ticks<5){step(fixed);accumulator-=fixed;ticks++;}
      controls.update();
      blobUniforms.uTime.value=simTime;
      scratch.copy(camera.position); lamp.worldToLocal(scratch); blobUniforms.uCameraLocal.value.copy(scratch);
      // The glow breathes gently with the moving wax, while remaining tied to the bulb.
      const occlusion=blobs.reduce((sum,b)=>sum+(b.stage?Math.exp(-((b.y-.82)**2)/.18)*.06:0),0);
      bulbLight.intensity=54*powerLevel*(.45+desiredHeat*.55)*(1-Math.min(.22,occlusion));
      composer.render();
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
