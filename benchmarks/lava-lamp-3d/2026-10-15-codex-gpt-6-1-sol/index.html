    upperGlow.position.lerp(glowTarget.set(warmX/warmMass,clamp(warmY/warmMass,1.35,3.3),warmZ/warmMass),glowFollow);
    ambient.intensity=.14+state.room*.65;rimLight.intensity=.65+state.room*2.1;fill.intensity=.12+state.room*.65;
    scene.environmentIntensity=.24+state.room*.42;
    bulbMaterial.color.copy(uniforms.uThin.value).multiplyScalar(state.bulb*3.4+.025);
    // Capture only the room, then render the bounded fluid volume and thick glass.
    volume.visible=false;glass.visible=false;bottomSeam.visible=false;
    renderer.setRenderTarget(roomTarget);renderer.render(scene,camera);renderer.setRenderTarget(null);
    volume.visible=true;glass.visible=true;bottomSeam.visible=true;composer.render();
    if(!state.ready){state.ready=true;$('loading').classList.add('ready');setTimeout(()=>$('loading').style.display='none',900);}
    if(now-uiAt>1000){uiAt=now;$('power-status').textContent=state.power?(state.warmth<.64?'Warming up…':'Warm & flowing'):(state.warmth>.08?'Cooling down…':'Resting');if(!state.power&&state.warmth<.08)$('live-label').textContent='AT REST';}
    // Bounded work and conservative resolution adaptation keep close-up views smooth.
    if(!document.hidden){frameTotal+=realDt;frames++;}
    if(now-adaptAt>4500&&frames>40){const average=frameTotal/frames;if(average>.024&&state.quality>.8){state.quality=Math.max(.8,state.quality-.15);resize();}adaptAt=now;frameTotal=0;frames=0;}
  }
  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('error').textContent='The graphics context was interrupted. Reload to relight the lamp.';});
  requestAnimationFrame(frame);
  // A read-only diagnostic surface for checking motion, containment and rendering.
  window.lampDiagnostics=()=>({ready:state.ready,power:state.power,warmth:state.warmth,bulb:state.bulb,time:state.time,preset:palettes[state.preset].name,quality:state.quality,camera:camera.position.toArray(),renderer:renderer.info.render,parcels:parcels.map(b=>({x:b.x,y:b.y,z:b.z,r:b.r,temp:b.temp,vy:b.vy})),errors:[]});
  </script>
  <script>window.addEventListener('error',function(e){if((e.message||e.target?.tagName==='SCRIPT')&&!window.lampDiagnostics){document.getElementById('loading').classList.add('ready');document.getElementById('error').textContent='Unable to light the scene. Check your internet connection and WebGL support, then reload.';}},true);</script>
</body>
</html>
