<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini 4 Argon</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050508;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8e6e3;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }

  /* Brand Header */
  .brand-header {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }

  .brand-header h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
  }

  /* Control Panel */
  .panel {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 276px;
    background: rgba(14, 14, 18, 0.72);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    padding: 18px;
    z-index: 20;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    display: flex;
    flex-direction: column;
    gap: 15px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .label {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.68);
  }

  .value-readout {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.45);
  }

  /* Power Button */
  .power-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 6px 13px 6px 9px;
    color: #fff;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .power-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.24);
  }

  .power-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff5533;
    box-shadow: 0 0 10px #ff5533, 0 0 4px #ffaa66;
    transition: all 0.3s ease;
  }

  .power-btn.off .power-dot {
    background: #555;
    box-shadow: none;
  }

  /* Presets */
  .presets-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 6px;
  }

  .preset-swatch {
    position: relative;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .preset-swatch:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 255, 255, 0.4);
  }

  .preset-swatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
  }

  .preset-name {
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.48);
    text-align: right;
  }

  /* Sliders */
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f0f0f0;
    border: 2px solid rgba(15, 15, 20, 0.8);
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease, background 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    background: #ffffff;
  }

  /* Bottom Toggles */
  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.07);
    margin: 2px 0;
  }

  .toggles-row {
    display: flex;
    gap: 8px;
  }

  .chip-btn {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 7px 8px;
    color: rgba(255, 255, 255, 0.65);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
  }

  .chip-btn:hover {
    background: rgba(255, 255, 255, 0.09);
    color: rgba(255, 255, 255, 0.9);
  }

  .chip-btn.active {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.35);
    color: #fff;
  }

  /* Hint */
  .hint-bar {
    position: fixed;
    bottom: 18px;
    left: 28px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.32);
    letter-spacing: 0.03em;
    pointer-events: none;
    z-index: 10;
  }

  @media (max-width: 600px) {
    .panel {
      top: auto;
      bottom: 16px;
      right: 16px;
      left: 16px;
      width: auto;
      padding: 14px;
      gap: 11px;
    }
    .hint-bar {
      display: none;
    }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="brand-header">
    <h1>Gemini 4 Argon</h1>
  </div>

  <aside class="panel" aria-label="Lamp Controls">
    <div class="row">
      <span class="label">Power</span>
      <button id="power-btn" class="power-btn" type="button">
        <span class="power-dot"></span>
        <span id="power-text">ON</span>
      </button>
    </div>

    <div class="control-group">
      <div class="row">
        <span class="label">Colorway</span>
        <span id="preset-label" class="preset-name">Classic Astro</span>
      </div>
      <div class="presets-grid" id="presets-grid"></div>
    </div>

    <div class="control-group">
      <div class="row">
        <span class="label">Heat / Flow</span>
        <span id="heat-val" class="value-readout">100%</span>
      </div>
      <input id="heat-slider" type="range" min="0.4" max="1.8" step="0.02" value="1.0" />
    </div>

    <div class="control-group">
      <div class="row">
        <span class="label">Wax Volume</span>
        <span id="wax-val" class="value-readout">100%</span>
      </div>
      <input id="wax-slider" type="range" min="0.55" max="1.40" step="0.02" value="1.0" />
    </div>

    <div class="control-group">
      <div class="row">
        <span class="label">Room Dimmer</span>
        <span id="room-val" class="value-readout">30%</span>
      </div>
      <input id="room-slider" type="range" min="0.0" max="1.0" step="0.02" value="0.30" />
    </div>

    <div class="divider"></div>

    <div class="toggles-row">
      <button id="orbit-btn" class="chip-btn" type="button">Auto-Orbit</button>
      <button id="slowmo-btn" class="chip-btn" type="button">Slow-Mo</button>
    </div>
  </aside>

  <div class="hint-bar">Drag to orbit · Scroll to zoom · Click cord switch to toggle power</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ============================================================================
    // 1. COLOR PRESETS
    // ============================================================================
    const PRESETS = [
      {
        name: 'Classic Astro',
        waxHot: '#ff3a08',
        waxCool: '#8c0612',
        waxGlow: '#ff7718',
        liquidTop: '#ffc414',
        liquidBot: '#ff6a00',
        bulbColor: '#ff7828',
        swatch: 'linear-gradient(135deg, #ff3a08 45%, #ffc414 100%)'
      },
      {
        name: 'Acid Cyber',
        waxHot: '#52ff18',
        waxCool: '#087d2e',
        waxGlow: '#a4ff33',
        liquidTop: '#063d96',
        liquidBot: '#068596',
        bulbColor: '#66ff44',
        swatch: 'linear-gradient(135deg, #52ff18 45%, #0648a8 100%)'
      },
      {
        name: 'Ultraviolet',
        waxHot: '#ff1e8e',
        waxCool: '#6c065c',
        waxGlow: '#ff5eb5',
        liquidTop: '#240b59',
        liquidBot: '#59127a',
        bulbColor: '#ff38a8',
        swatch: 'linear-gradient(135deg, #ff1e8e 45%, #2b0f66 100%)'
      },
      {
        name: 'Deep Lagoon',
        waxHot: '#00f6ff',
        waxCool: '#004885',
        waxGlow: '#6efffa',
        liquidTop: '#061436',
        liquidBot: '#093466',
        bulbColor: '#26e2ff',
        swatch: 'linear-gradient(135deg, #00f6ff 45%, #081b47 100%)'
      },
      {
        name: 'Molten Gold',
        waxHot: '#ffaa00',
        waxCool: '#7a2500',
        waxGlow: '#ffdd44',
        liquidTop: '#33061a',
        liquidBot: '#730f1c',
        bulbColor: '#ff9d1c',
        swatch: 'linear-gradient(135deg, #ffaa00 45%, #470824 100%)'
      }
    ];

    // ============================================================================
    // 2. LAMP GEOMETRY PROFILE CONSTANTS
    // ============================================================================
    // Coordinates in world units (1 unit ~ 5 cm; total lamp height ~ 8.85 units ~ 44cm)
    // Base cone: y = 0.0 to 2.55
    // Glass visible section: y = 2.50 to 7.55
    // Metal cap: y = 7.45 to 8.85
    const GLASS_Y_BOT = 2.48;
    const GLASS_Y_TOP = 7.56;
    const GLASS_Y_MID = 3.22; // widest point (hip of the Astro bottle)

    function getGlassOuterRadius(y) {
      if (y <= GLASS_Y_MID) {
        const t = THREE.MathUtils.clamp((y - GLASS_Y_BOT) / (GLASS_Y_MID - GLASS_Y_BOT), 0, 1);
        return THREE.MathUtils.lerp(0.84, 1.24, Math.sin(t * Math.PI * 0.5));
      } else {
        const t = THREE.MathUtils.clamp((y - GLASS_Y_MID) / (GLASS_Y_TOP - GLASS_Y_MID), 0, 1);
        // Classic straight conical taper with subtle curve near cap
        return THREE.MathUtils.lerp(1.24, 0.67, t);
      }
    }

    function getFluidRadius(y) {
      return getGlassOuterRadius(y) - 0.075;
    }

    // ============================================================================
    // 3. SCENE, CAMERA, RENDERER
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.022);

    // Generate studio/room environment map for realistic metal & glass reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    const envMap = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environment = envMap;
    roomEnv.dispose();

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      80
    );
    camera.position.set(0.0, 5.5, 13.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4.75, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 5.2;
    controls.maxDistance = 22.0;
    controls.minPolarAngle = 0.18;
    controls.maxPolarAngle = Math.PI * 0.492; // Stay above table plane
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.65;
    controls.update();

    // ============================================================================
    // 4. PROCEDURAL TEXTURES (WOOD, BRUSHED METAL, WALL PLASTER, BOOK COVER)
    // ============================================================================
    function createWoodTextures() {
      const size = 1024;
      const colorCanvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      const bumpCanvas = document.createElement('canvas');
      colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
      colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

      const cCtx = colorCanvas.getContext('2d');
      const rCtx = roughCanvas.getContext('2d');
      const bCtx = bumpCanvas.getContext('2d');

      const cImg = cCtx.createImageData(size, size);
      const rImg = rCtx.createImageData(size, size);
      const bImg = bCtx.createImageData(size, size);

      function hash(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      function valueNoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const a = hash(ix, iy);
        const b = hash(ix + 1, iy);
        const c = hash(ix, iy + 1);
        const d = hash(ix + 1, iy + 1);
        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      function fbm(x, y) {
        let v = 0;
        let amp = 0.5;
        for (let i = 0; i < 4; i++) {
          v += amp * valueNoise(x, y);
          x *= 2.02;
          y *= 2.02;
          amp *= 0.5;
        }
        return v;
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;

          const warp = fbm(u * 4.0, v * 4.0) * 1.6;
          const ring = Math.sin((v * 20.0 + warp) * Math.PI * 2.0) * 0.5 + 0.5;
          const fine = valueNoise(u * 180.0, v * 28.0);
          const pores = valueNoise(u * 320.0, v * 45.0);

          const grain = ring * 0.65 + fine * 0.25 + pores * 0.1;

          // Rich dark walnut color
          const r = Math.floor(THREE.MathUtils.lerp(28, 66, grain));
          const g = Math.floor(THREE.MathUtils.lerp(16, 40, grain));
          const b = Math.floor(THREE.MathUtils.lerp(11, 26, grain));

          const idx = (y * size + x) * 4;
          cImg.data[idx] = r;
          cImg.data[idx + 1] = g;
          cImg.data[idx + 2] = b;
          cImg.data[idx + 3] = 255;

          // Satin walnut roughness (105..165 out of 255 -> ~0.41..0.65)
          const roughVal = Math.floor(THREE.MathUtils.lerp(155, 102, grain * 0.8 + pores * 0.2));
          rImg.data[idx] = roughVal;
          rImg.data[idx + 1] = roughVal;
          rImg.data[idx + 2] = roughVal;
          rImg.data[idx + 3] = 255;

          const bumpVal = Math.floor(THREE.MathUtils.lerp(90, 175, fine * 0.6 + pores * 0.4));
          bImg.data[idx] = bumpVal;
          bImg.data[idx + 1] = bumpVal;
          bImg.data[idx + 2] = bumpVal;
          bImg.data[idx + 3] = 255;
        }
      }

      cCtx.putImageData(cImg, 0, 0);
      rCtx.putImageData(rImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(colorCanvas);
      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      const bumpMap = new THREE.CanvasTexture(bumpCanvas);

      map.colorSpace = THREE.SRGBColorSpace;
      [map, roughnessMap, bumpMap].forEach((t) => {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 3);
        t.anisotropy = 8;
      });

      return { map, roughnessMap, bumpMap };
    }

    function createBrushedMetalTexture() {
      const w = 512, h = 256;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(w, h);

      for (let y = 0; y < h; y++) {
        const streak = (Math.random() - 0.5) * 34;
        const fineWave = Math.sin(y * 0.45) * 8;
        for (let x = 0; x < w; x++) {
          const n = (Math.random() - 0.5) * 10;
          const v = THREE.MathUtils.clamp(Math.floor(135 + streak + fineWave + n), 85, 200);
          const idx = (y * w + x) * 4;
          img.data[idx] = v;
          img.data[idx + 1] = v;
          img.data[idx + 2] = v;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 1);
      return tex;
    }

    const woodTex = createWoodTextures();
    const brushedTex = createBrushedMetalTexture();

    // ============================================================================
    // 5. ROOM & PROPS (TABLE, BACKDROP WALL, BOOKS, CERAMIC COASTER/MUG)
    // ============================================================================
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    // Table surface
    const tableGeo = new THREE.CylinderGeometry(16, 16, 0.6, 64);
    const tableMat = new THREE.MeshStandardMaterial({
      map: woodTex.map,
      roughnessMap: woodTex.roughnessMap,
      bumpMap: woodTex.bumpMap,
      bumpScale: 0.015,
      roughness: 0.72,
      metalness: 0.05,
      envMapIntensity: 0.35
    });
    const tableMesh = new THREE.Mesh(tableGeo, tableMat);
    tableMesh.position.y = -0.3;
    tableMesh.receiveShadow = true;
    roomGroup.add(tableMesh);

    // Curved dark plaster wall behind the table
    const wallGeo = new THREE.CylinderGeometry(18, 18, 26, 64, 1, true, Math.PI * 0.6, Math.PI * 0.8);
    wallGeo.scale(-1, 1, -1);
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x12131a,
      roughness: 0.92,
      metalness: 0.02,
      bumpMap: woodTex.bumpMap,
      bumpScale: 0.008,
      envMapIntensity: 0.15
    });
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.set(0, 10, 0);
    wallMesh.receiveShadow = true;
    roomGroup.add(wallMesh);

    // Subtle acoustic wooden slats on the left background wall to catch warm rim light
    const slatMat = new THREE.MeshStandardMaterial({
      color: 0x241710,
      roughness: 0.65,
      metalness: 0.05,
      envMapIntensity: 0.25
    });
    const slatGroup = new THREE.Group();
    slatGroup.position.set(-6.8, 0, -6.2);
    slatGroup.rotation.y = 0.38;
    for (let i = 0; i < 11; i++) {
      const slat = new THREE.Mesh(new THREE.BoxGeometry(0.22, 16, 0.28), slatMat);
      slat.position.set(i * 0.42, 7.5, 0);
      slat.castShadow = true;
      slat.receiveShadow = true;
      slatGroup.add(slat);
    }
    roomGroup.add(slatGroup);

    // Stack of two hardcover design books on the left side of the table
    function createBook(w, h, d, coverColor, pageColor) {
      const g = new THREE.Group();
      const coverMat = new THREE.MeshStandardMaterial({
        color: coverColor,
        roughness: 0.78,
        metalness: 0.04,
        envMapIntensity: 0.25
      });
      const pagesMat = new THREE.MeshStandardMaterial({
        color: pageColor,
        roughness: 0.88,
        metalness: 0.0,
        envMapIntensity: 0.2
      });
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), coverMat);
      body.castShadow = true;
      body.receiveShadow = true;
      g.add(body);

      const pages = new THREE.Mesh(new THREE.BoxGeometry(w * 0.96, h * 0.82, d * 0.97), pagesMat);
      pages.position.x = 0.04;
      g.add(pages);
      return g;
    }

    const book1 = createBook(3.1, 0.42, 4.1, 0x1d2633, 0xd8d0c5);
    book1.position.set(-4.35, 0.21, -1.35);
    book1.rotation.y = 0.28;
    roomGroup.add(book1);

    const book2 = createBook(2.75, 0.36, 3.65, 0x3b1f1e, 0xdcd4c8);
    book2.position.set(-4.25, 0.60, -1.30);
    book2.rotation.y = 0.48;
    roomGroup.add(book2);

    // Small matte ceramic vessel / paperweight on the right to catch specular reflections
    const pebblePts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const angle = t * Math.PI;
      const r = Math.sin(angle) * 0.78 * (0.85 + 0.15 * Math.cos(t * Math.PI));
      const y = (1 - Math.cos(angle)) * 0.82;
      pebblePts.push(new THREE.Vector2(Math.max(0.001, r), y));
    }
    const ceramicGeo = new THREE.LatheGeometry(pebblePts, 48);
    const ceramicMat = new THREE.MeshStandardMaterial({
      color: 0x22252a,
      roughness: 0.28,
      metalness: 0.08,
      envMapIntensity: 0.6
    });
    const ceramicObj = new THREE.Mesh(ceramicGeo, ceramicMat);

    // ============================================================================
    // 7. RAYMARCHED FLUID & WAX VOLUME + PHYSICALLY BASED GLASS VESSEL
    // ============================================================================
    const MAX_BLOBS = 18;
    const blobUniformArray = Array.from({ length: MAX_BLOBS }, () => new THREE.Vector4(0, 3, 0, 0.0));
    const stretchUniformArray = new Float32Array(MAX_BLOBS);

    // Build custom raymarched volume mesh matching the inner contour of the glass bottle
    const fluidPts = [];
    const FLUID_SEGMENTS = 64;
    for (let i = 0; i <= FLUID_SEGMENTS; i++) {
      const t = i / FLUID_SEGMENTS;
      const y = THREE.MathUtils.lerp(GLASS_Y_BOT, GLASS_Y_TOP, t);
      fluidPts.push(new THREE.Vector2(getFluidRadius(y), y));
    }
    const fluidGeo = new THREE.LatheGeometry(fluidPts, 72);
    fluidGeo.computeVertexNormals();

    const fluidUniforms = {
      uBlobs: { value: blobUniformArray },
      uBlobStretch: { value: stretchUniformArray },
      uBlobCount: { value: MAX_BLOBS },
      uTime: { value: 0 },
      uPower: { value: 1.0 },
      uWarmth: { value: 1.0 },
      uWaxScale: { value: 1.0 },
      uWaxHot: { value: new THREE.Color(PRESETS[0].waxHot) },
      uWaxCool: { value: new THREE.Color(PRESETS[0].waxCool) },
      uWaxGlow: { value: new THREE.Color(PRESETS[0].waxGlow) },
      uLiquidTop: { value: new THREE.Color(PRESETS[0].liquidTop) },
      uLiquidBot: { value: new THREE.Color(PRESETS[0].liquidBot) },
      uRoomLight: { value: 0.30 }
    };

    const fluidVertexShader = /* glsl */ `
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const fluidFragmentShader = /* glsl */ `
      precision highp float;

      #define MAX_BLOBS 18

      uniform vec4 uBlobs[MAX_BLOBS];
      uniform float uBlobStretch[MAX_BLOBS];
      uniform int uBlobCount;
      uniform float uTime;
      uniform float uPower;
      uniform float uWarmth;
      uniform float uWaxScale;
      uniform vec3 uWaxHot;
      uniform vec3 uWaxCool;
      uniform vec3 uWaxGlow;
      uniform vec3 uLiquidTop;
      uniform vec3 uLiquidBot;
      uniform float uRoomLight;

      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      const float Y_BOT = 2.48;
      const float Y_MID = 3.22;
      const float Y_TOP = 7.56;

      // Exact vessel inner radius profile
      float vesselRadius(float y) {
        if (y <= Y_MID) {
          float t = clamp((y - Y_BOT) / (Y_MID - Y_BOT), 0.0, 1.0);
          return mix(0.84, 1.24, sin(t * 1.5707963)) - 0.075;
        } else {
          float t = clamp((y - Y_MID) / (Y_TOP - Y_MID), 0.0, 1.0);
          return mix(1.24, 0.67, t) - 0.075;
        }
      }

      // Distance to fluid container boundary
      float sdVessel(vec3 p) {
        float r = vesselRadius(p.y);
        float dSide = length(p.xz) - r;
        float dBot = Y_BOT - p.y;
        float dTop = p.y - Y_TOP;
        return max(dSide, max(dBot, dTop));
      }

      // Polynomial smooth min for organic liquid fusion and necking
      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      // Smooth maximum to keep wax strictly inside the tapered glass wall
      float smax(float a, float b, float k) {
        return -smin(-a, -b, k);
      }

      // Cheap 3D trigonometric turbulence for organic wax wobble
      float waxRipple(vec3 p) {
        float t = uTime * 1.35;
        return (
          sin(p.x * 3.8 + t) *
          cos(p.y * 3.1 - t * 1.15) *
          sin(p.z * 3.8 + t * 0.8)
        ) * 0.024 * uWarmth;
      }

      // Signed Distance Field for the continuous wax volume
      float mapWax(vec3 p) {
        // 1. Warm bottom wax pool sitting over the heater coil
        float poolHeight = 2.74 + 0.14 * (1.0 - uWarmth * 0.45) + 0.12 * (uWaxScale - 1.0);
        float poolWave = sin(p.x * 2.4 + uTime * 1.2) * cos(p.z * 2.4 - uTime * 0.95) * 0.035 * uWarmth;
        float dWax = p.y - (poolHeight + poolWave);

        // 2. Top meniscus / cooling wax cap at the very top of the liquid
        float topCapDist = (Y_TOP - 0.18 + sin(p.x * 3.0 + uTime) * 0.02) - p.y;
        float topRing = length(vec3(p.x, (p.y - (Y_TOP - 0.08)) * 1.8, p.z)) - 0.24 * uWarmth;
        dWax = smin(dWax, topRing, 0.22);

        // 3. Dynamic thermal blobs with vertical stretching & organic fusion
        for (int i = 0; i < MAX_BLOBS; i++) {
          if (i >= uBlobCount) break;
          vec4 b = uBlobs[i];
          if (b.w <= 0.001) continue;

          vec3 q = p - b.xyz;
          float stretch = uBlobStretch[i];
          q.y /= stretch;

          // Subtle teardrop asymmetry (slightly fuller at top when rising, bottom when sinking)
          float taper = 1.0 - clamp(q.y / (b.w * 1.8), -0.28, 0.28) * (stretch - 1.0) * 0.85;
          q.xz /= max(0.65, taper);

          float dBlob = (length(q) - b.w) * min(1.0, stretch * 0.92);
          dWax = smin(dWax, dBlob, 0.31);
        }

        dWax += waxRipple(p);

        // Strictly constrain wax inside the glass inner wall with a soft cushion
        float wallClearance = sdVessel(p) + 0.032;
        dWax = smax(dWax, wallClearance, 0.075);

        return dWax;
      }

      // Analytic + numerical gradient normal of the wax surface
      vec3 calcWaxNormal(vec3 p) {
        vec2 e = vec2(0.0045, -0.0045);
        return normalize(
          e.xyy * mapWax(p + e.xyy) +
          e.yyx * mapWax(p + e.yyx) +
          e.yxy * mapWax(p + e.yxy) +
          e.xxx * mapWax(p + e.xxx)
        );
      }

      // Intersect ray with the tapered vessel inner bounds to find exit distance
      float findRayExit(vec3 ro, vec3 rd) {
        float t = 0.04;
        for (int i = 0; i < 36; i++) {
          vec3 p = ro + rd * t;
          float d = -sdVessel(p);
          if (d < 0.005 || t > 3.2) break;
          t += max(d * 0.65, 0.03);
        }
        return t;
      }

      void main() {
        vec3 N_outer = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);

        // Refract the viewing ray slightly at the glass-liquid interface (IOR ~ 1.38)
        vec3 rd = normalize(refract(-V, N_outer, 1.0 / 1.14));
        if (length(rd) < 0.001) rd = -V;

        vec3 ro = vWorldPos + rd * 0.01;
        float tMax = findRayExit(ro, rd);

        // Raymarch the continuous SDF wax inside the liquid
        float t = 0.0;
        bool hitWax = false;
        float minDist = 10.0;

        for (int i = 0; i < 60; i++) {
          vec3 p = ro + rd * t;
          float d = mapWax(p);
          minDist = min(minDist, d);
          if (d < 0.0035) {
            hitWax = true;
            break;
          }
          if (t > tMax) break;
          t += clamp(d * 0.68, 0.014, 0.11);
        }

        // Height factor across the vessel (0 = bottom near bulb, 1 = top near cap)
        float entryH = clamp((vWorldPos.y - Y_BOT) / (Y_TOP - Y_BOT), 0.0, 1.0);
        vec3 bulbPos = vec3(0.0, 2.25, 0.0);

        // Base liquid column color & hazy scattering
        vec3 exitPos = ro + rd * tMax;
        float avgH = clamp(((vWorldPos.y + exitPos.y) * 0.5 - Y_BOT) / (Y_TOP - Y_BOT), 0.0, 1.0);
        vec3 liqColor = mix(uLiquidBot, uLiquidTop, pow(avgH, 0.78));

        // Bulb illumination through the liquid
        float bulbDistLiq = length((vWorldPos + exitPos) * 0.5 - bulbPos);
        float bulbTransmission = exp(-bulbDistLiq * 0.52) * uPower;

        // Warm hazy glow around near-miss wax blobs
        float halo = exp(-max(minDist, 0.0) * 6.5) * 0.42 * uPower;

        vec3 finalColor = liqColor * (0.14 + 0.95 * uPower * (1.0 - avgH * 0.45) + uRoomLight * 0.22);
        finalColor += uWaxGlow * (bulbTransmission * 0.85 + halo);

        // Subtle dark meniscus line near top cap
        float meniscus = smoothstep(0.95, 0.995, entryH);
        finalColor *= (1.0 - meniscus * 0.45);

        if (hitWax) {
          vec3 hitPos = ro + rd * t;
          vec3 N = calcWaxNormal(hitPos);
          float waxH = clamp((hitPos.y - Y_BOT) / (Y_TOP - Y_BOT), 0.0, 1.0);

          // Measure internal wax thickness along the ray & toward the bulb for subsurface scattering
          vec3 toBulb = normalize(bulbPos - hitPos);
          float distToBulb = length(bulbPos - hitPos);
          float bulbAtten = 1.0 / (1.0 + 0.24 * distToBulb + 0.14 * distToBulb * distToBulb);

          // Sample SDF deeper inside the blob along view ray and toward bulb
          float depthView = clamp(-mapWax(hitPos + rd * 0.24) * 3.6, 0.0, 1.0);
          float depthBulb = clamp(-mapWax(hitPos + toBulb * 0.28) * 3.2, 0.0, 1.0);
          float thinness = 1.0 - clamp((depthView * 0.55 + depthBulb * 0.45), 0.0, 1.0);

          // Core thermal color gradient: hotter & brighter near bottom, deeper saturated near top
          vec3 baseWax = mix(uWaxHot, uWaxCool, smoothstep(0.05, 0.88, waxH));
          // Core absorption in thick centers
          vec3 absorbedWax = mix(baseWax, uWaxCool * 0.42, pow(depthView, 1.25));

          // Direct diffuse from bottom bulb + wrap subsurface lighting
          float diffBulb = max(0.0, dot(N, toBulb) * 0.6 + 0.4);
          float backScatter = pow(clamp(dot(-rd, toBulb) * 0.5 + 0.5, 0.0, 1.0), 2.2);

          // Subsurface glow (bright incandescent core where thin or close to the bulb)
          float sss = (0.35 + 0.95 * thinness + 0.65 * backScatter) * bulbAtten * uPower;

          // Edge Fresnel inside the liquid for waxy transluscent rim
          float fresnelWax = pow(1.0 - max(0.0, dot(N, -rd)), 2.6);

          // Room light contribution when lamp is dimmed or off
          vec3 roomDir = normalize(vec3(0.5, 0.8, 0.6));
          float roomDiff = max(0.0, dot(N, roomDir) * 0.5 + 0.5) * (0.08 + uRoomLight * 0.35);

          // Soft specular sheen on the molten wax skin
          vec3 H_bulb = normalize(toBulb - rd);
          float specBulb = pow(max(0.0, dot(N, H_bulb)), 28.0) * 0.35 * uPower * bulbAtten;
          vec3 H_room = normalize(roomDir - rd);
          float specRoom = pow(max(0.0, dot(N, H_room)), 36.0) * (0.12 + uRoomLight * 0.25);

          vec3 waxLit = absorbedWax * (roomDiff + diffBulb * bulbAtten * uPower * 1.45);
          waxLit += uWaxGlow * sss * 1.38;
          waxLit += mix(uWaxHot, uWaxGlow, 0.6) * fresnelWax * (0.45 * uPower + 0.08);
          waxLit += vec3(1.0, 0.92, 0.82) * (specBulb + specRoom);

          // Beer-Lambert liquid absorption between the glass entry point and the wax surface
          float liquidPath = t;
          vec3 transmittance = exp(-(vec3(1.15) - liqColor * 0.82) * liquidPath * 1.45);
          vec3 inScatter = liqColor * (1.0 - exp(-liquidPath * 1.15)) * (0.28 + 0.72 * uPower * (1.0 - waxH * 0.4));

          finalColor = waxLit * transmittance + inScatter;
        }

        // Subtle internal reflection at grazing angles of the fluid column
        float edgeGlow = pow(1.0 - max(0.0, dot(N_outer, V)), 3.2);
        finalColor += liqColor * edgeGlow * 0.18 * uPower;

        gl_FragColor = vec4(max(finalColor, vec3(0.0)), 1.0);
      }
    `;

    const fluidMat = new THREE.ShaderMaterial({
      uniforms: fluidUniforms,
      vertexShader: fluidVertexShader,
      fragmentShader: fluidFragmentShader
    });

    const fluidMesh = new THREE.Mesh(fluidGeo, fluidMat);
    lampGroup.add(fluidMesh);

    // Outer Physically Based Glass Bottle (tapered vessel with specular reflections & thickness rim)
    const glassPts = [];
    for (let i = 0; i <= FLUID_SEGMENTS; i++) {
      const t = i / FLUID_SEGMENTS;
      const y = THREE.MathUtils.lerp(GLASS_Y_BOT - 0.02, GLASS_Y_TOP + 0.02, t);

    const glassGeo = new THREE.LatheGeometry(glassPts, 96);

    const glassMat = new THREE.MeshPhysicalMaterial({

    const glassBackMat = new THREE.MeshPhysicalMaterial({

      metalness: 0.0,
      ior: 1.52,

    });

    glassBackMesh.renderOrder = 1;

    // ============================================================================
    // 8. LIGHTING (DYNAMIC FLICKERING LAMP LIGHTS + DIMMABLE ROOM LIGHTS)
    // ============================================================================
    // Primary light emitted by the lava column & bulb onto the table and wall
    const lampMainLight = new THREE.PointLight(0xff6a1a, 14.0, 26.0, 1.65);
    lampMainLight.position.set(0, 3.8, 0);
    lampMainLight.castShadow = true;
    lampMainLight.shadow.mapSize.width = 1024;
    lampMainLight.shadow.mapSize.height = 1024;
    lampMainLight.shadow.bias = -0.0008;
    lampMainLight.shadow.radius = 5;
    scene.add(lampMainLight);

    // Lower warm spill light right above the metal base collar
    const lampBaseLight = new THREE.PointLight(0xff5510, 7.5, 14.0, 1.8);
    lampBaseLight.position.set(0, 2.75, 0);
    scene.add(lampBaseLight);

    // Ambient & subtle directional key light for the dim room
    const roomAmbient = new THREE.HemisphereLight(0x3a4866, 0x14100d, 0.42);
    scene.add(roomAmbient);

    const roomKeyLight = new THREE.DirectionalLight(0x9ab0d6, 0.55);
    roomKeyLight.position.set(6.5, 11.5, 7.5);
    roomKeyLight.castShadow = true;
    roomKeyLight.shadow.mapSize.width = 1024;
    roomKeyLight.shadow.mapSize.height = 1024;
    roomKeyLight.shadow.camera.near = 1;
    roomKeyLight.shadow.camera.far = 30;
    const d = 10;
    roomKeyLight.shadow.camera.left = -d;
    roomKeyLight.shadow.camera.right = d;
    roomKeyLight.shadow.camera.top = d;
    roomKeyLight.shadow.camera.bottom = -d;
    roomKeyLight.shadow.bias = -0.0005;
    scene.add(roomKeyLight);

    // ============================================================================
    // 9. POST-PROCESSING (BLOOM + SUBTLE CINEMATIC VIGNETTE & FILM GRAIN)
    // ============================================================================
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.42, // strength
      0.65, // radius
      0.72  // threshold
    );
    composer.addPass(bloomPass);

    const CinematicShader = {
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 }
      },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec2 vUv;

        float rand(vec2 co) {
          return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec4 tex = texture2D(tDiffuse, vUv);
          vec2 centered = vUv - 0.5;
          float vig = 1.0 - dot(centered, centered) * 0.42;
          float grain = (rand(vUv + fract(uTime * 0.37)) - 0.5) * 0.014;
          gl_FragColor = vec4(max(tex.rgb * vig + grain, vec3(0.0)), tex.a);
        }
      `
    };
    const cinematicPass = new ShaderPass(CinematicShader);
    composer.addPass(cinematicPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // ============================================================================
    // 10. THERMODYNAMIC WAX SIMULATION (FIXED TIMESTEP)
    // ============================================================================
    const state = {
      power: true,
      powerLevel: 1.0,     // Smooth bulb brightness transition
      warmthLevel: 1.0,    // Thermal inertia of the wax (warms up / cools down gradually)
      heatSetting: 1.0,    // User heat / flow speed multiplier
      waxVolume: 1.0,      // User wax amount multiplier
      roomDimmer: 0.30,    // Room ambient level
      slowMo: false,
      presetIndex: 0
    };

    // Create 18 blobs: 13 primary thermal blobs + 5 satellite pinch droplets
    const blobs = [];
    for (let i = 0; i < MAX_BLOBS; i++) {
      const isDroplet = i >= 13;
      // Distribute initial heights and temperatures so the lamp is in full lively motion immediately on load
      const tNorm = (i % 13) / 13;
      const startY = isDroplet
        ? 3.1 + (i - 13) * 0.85
        : 2.75 + tNorm * 4.25;
      const angle = i * 2.39996; // Golden angle distribution
      const rad = isDroplet ? 0.14 : (0.12 + (i % 3) * 0.11);

      // Blobs in the first half are warm and rising; second half are cooling and sinking
      const initialTemp = (i % 2 === 0)
        ? 0.62 + (i % 5) * 0.07
        : 0.25 + (i % 4) * 0.06;

      const initialVy = (initialTemp - 0.48) * 0.55;

      blobs.push({
        x: Math.cos(angle) * rad,
        y: startY,
        z: Math.sin(angle) * rad,
        vx: 0,
        vy: initialVy,
        vz: 0,
        baseRadius: isDroplet
          ? 0.14 + (i % 3) * 0.025
          : 0.23 + ((i * 7) % 5) * 0.028,
        radius: 0.25,
        temp: initialTemp,
        stretch: 1.0,
        phase: i * 1.71 + 0.5,
        freq: 0.55 + (i % 7) * 0.11,
        isDroplet,
        parentIdx: i % 13
      });
    }

    const FIXED_DT = 1 / 60;
    let simTime = 12.0; // Start offset so noise patterns are well-developed

    function stepSimulation(dt) {
      simTime += dt;

      // 1. Update power & thermal inertia
      const targetPower = state.power ? 1.0 : 0.0;
      state.powerLevel += (targetPower - state.powerLevel) * Math.min(1.0, dt * 3.8);

      // When turned off, wax cools down over ~6 seconds. When turned back on, wax warms up over ~4.5 seconds.
      const targetWarmth = state.power ? 1.0 : 0.0;
      const warmthRate = state.power ? 0.26 : 0.22;
      state.warmthLevel += (targetWarmth - state.warmthLevel) * Math.min(1.0, dt * warmthRate);

      const effectiveHeat = state.heatSetting * state.warmthLevel;
      const flowSpeed = 0.55 + 0.65 * effectiveHeat;

      // 2. Update each blob's thermodynamics, buoyancy, necking, and vessel confinement
      for (let i = 0; i < MAX_BLOBS; i++) {
        const b = blobs[i];
        const hNorm = THREE.MathUtils.clamp((b.y - GLASS_Y_BOT) / (GLASS_Y_TOP - GLASS_Y_BOT), 0.0, 1.0);

        if (!state.power && state.warmthLevel < 0.35) {
          // Lamp is cooling/off: all blobs lose heat and sink gently into the bottom pool
          b.temp += (0.12 - b.temp) * dt * 0.65;
        } else {
          // Heating zone at the bottom near the bulb (hNorm < 0.22)
          if (hNorm < 0.22) {
            const heatGain = (1.0 - hNorm / 0.22) * (0.42 + 0.35 * state.heatSetting) * state.warmthLevel;
            b.temp += (0.96 - b.temp) * heatGain * dt;
          }
          // Cooling zone near the metal cap at the top (hNorm > 0.72)
          else if (hNorm > 0.72) {
            const coolLoss = ((hNorm - 0.72) / 0.28) * 0.52;
            b.temp += (0.08 - b.temp) * coolLoss * dt;
          }
          // Ambient radiative cooling in the middle column
          else {
            const midTarget = 0.44 + 0.06 * Math.sin(simTime * b.freq + b.phase);
            b.temp += (midTarget - b.temp) * 0.07 * dt;
          }
        }

        b.temp = THREE.MathUtils.clamp(b.temp, 0.05, 0.98);

        // Thermal expansion: warmer wax expands slightly
        const thermalExpansion = 0.93 + 0.14 * b.temp;
        const volumeFactor = Math.pow(state.waxVolume, 0.45);
        b.radius = b.baseRadius * thermalExpansion * volumeFactor;

        // Buoyancy force: neutral buoyancy at temp = 0.48
        const neutralTemp = 0.48 - (state.heatSetting - 1.0) * 0.05;
        let buoyancy = (b.temp - neutralTemp) * 0.92 * flowSpeed;

        // Falling cold blobs are slightly denser and steadier; rising hot blobs accelerate smoothly
        if (buoyancy < 0) {
          buoyancy *= 0.78;
        }

        // When lamp is turned off, pull wax down into the bottom pool
        if (!state.power) {
          buoyancy -= (1.0 - state.warmthLevel) * 0.65;
        }

        // Surface-tension dwell at the bottom pool before necking off and rising
        if (hNorm < 0.12 && b.vy > 0 && b.temp < 0.66) {
          buoyancy *= 0.25;
        }

        // Gentle convective swirl inside the fluid column
        const swirlAngle = simTime * b.freq + b.phase + b.y * 0.65;
        const swirlStrength = (0.14 + 0.12 * effectiveHeat) * (0.3 + 0.7 * Math.sin(hNorm * Math.PI));
        const fx = Math.cos(swirlAngle) * swirlStrength - b.x * 0.35;
        const fz = Math.sin(swirlAngle * 1.13) * swirlStrength - b.z * 0.35;

        b.vx += fx * dt;
        b.vz += fz * dt;
        b.vy += buoyancy * dt;

        // Soft pairwise interaction: nearby blobs at similar temperatures gently attract to merge,
        // while satellite droplets pinch off behind fast-rising parent blobs
        if (b.isDroplet) {
          const parent = blobs[b.parentIdx];
          if (parent && parent.vy > 0.18 && hNorm > 0.25 && hNorm < 0.78 && state.warmthLevel > 0.5) {
            // Trail slightly below the rising parent blob so it necks and pinches off organically
            const targetY = parent.y - (parent.radius + b.radius) * 1.25;
            b.vx += (parent.x - b.x) * 1.8 * dt;
            b.vz += (parent.z - b.z) * 1.8 * dt;
            b.vy += (targetY - b.y) * 1.2 * dt;
          }
        } else {
          for (let j = i + 1; j < 13; j++) {
            const o = blobs[j];
            const dx = o.x - b.x;
            const dy = o.y - b.y;
            const dz = o.z - b.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            const minDist = (b.radius + o.radius) * 0.85;
            if (distSq < minDist * minDist && distSq > 0.0001) {
              const dist = Math.sqrt(distSq);
              // Prevent complete collapse to identical centers so blobs remain rich and varied
              const push = (minDist - dist) * 0.45 * dt;
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;
              b.vx -= nx * push;
              b.vy -= ny * push * 0.4;
              b.vz -= nz * push;
              o.vx += nx * push;
              o.vy += ny * push * 0.4;
              o.vz += nz * push;
            }
          }
        }

        // Viscous fluid damping
        const damping = Math.exp(-1.55 * dt);
        b.vx *= damping;
        b.vy *= damping;
        b.vz *= damping;

        // Clamp max vertical velocity
        b.vy = THREE.MathUtils.clamp(b.vy, -0.58, 0.68);

        // Advance position
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.z += b.vz * dt;

        // Vertical floor & ceiling bounds inside the vessel
        const minY = GLASS_Y_BOT + 0.14 + b.radius * 0.55;
        const maxY = GLASS_Y_TOP - 0.18 - b.radius * 0.65;
        if (b.y < minY) {
          b.y = minY;
          if (b.vy < 0) b.vy *= -0.2;
        } else if (b.y > maxY) {
          b.y = maxY;
          if (b.vy > 0) b.vy *= -0.25;
        }

        // Constrain radial position inside the tapered glass wall
        const allowedR = Math.max(0.06, getFluidRadius(b.y) - b.radius * 0.92 - 0.05);
        const currR = Math.hypot(b.x, b.z);
        if (currR > allowedR) {
          const scale = allowedR / currR;
          b.x *= scale;
          b.z *= scale;
          b.vx *= -0.35;
          b.vz *= -0.35;
        }

        // Compute vertical stretching: rising warm blobs elongate, pool/cap blobs flatten slightly
        const speedStretch = 1.0 + b.vy * 0.48 + Math.abs(b.vy) * 0.18;
        const boundarySquash = (hNorm < 0.08 || hNorm > 0.92) ? 0.86 : 1.0;
        const targetStretch = THREE.MathUtils.clamp(speedStretch * boundarySquash, 0.78, 1.48);
        b.stretch += (targetStretch - b.stretch) * Math.min(1.0, dt * 6.0);

        // Write to shader uniform arrays
        blobUniformArray[i].set(b.x, b.y, b.z, b.radius);
        stretchUniformArray[i] = b.stretch;
      }

      // 3. Calculate optical occlusion of the bottom bulb by nearby wax blobs
      // As large blobs gather or detach right above the bulb, the room light shifts & flickers naturally
      let occlusion = 0.0;
      let centerOfMassY = 0.0;
      let totalWeight = 0.0;

      for (let i = 0; i < MAX_BLOBS; i++) {
        const b = blobs[i];
        if (b.y < 4.2) {
          const hFactor = 1.0 - THREE.MathUtils.clamp((b.y - 2.5) / 1.7, 0.0, 1.0);
          const rDist = Math.hypot(b.x, b.z);
          const centerFactor = Math.exp(-rDist * rDist * 3.5);
          occlusion += hFactor * centerFactor * (b.radius * 1.4);
        }
        const w = b.radius * b.radius * b.radius;
        centerOfMassY += b.y * w;
        totalWeight += w;
      }
      centerOfMassY = totalWeight > 0 ? centerOfMassY / totalWeight : 3.8;

      const flicker = THREE.MathUtils.clamp(1.0 - occlusion * 0.22 + Math.sin(simTime * 2.3) * 0.03, 0.62, 1.12);
      const pwr = state.powerLevel;

      lampMainLight.intensity = 14.5 * pwr * flicker;
      lampMainLight.position.y = THREE.MathUtils.lerp(3.2, 4.4, (centerOfMassY - 2.6) / 4.2);
      lampBaseLight.intensity = 7.8 * pwr * (0.85 + 0.15 * flicker);

      bulbMat.emissiveIntensity = 3.8 * pwr;
      rockerMat.emissiveIntensity = 0.45 * pwr;

      // Update shader uniforms
      fluidUniforms.uTime.value = simTime;
      fluidUniforms.uPower.value = pwr;
      fluidUniforms.uWarmth.value = state.warmthLevel;
      fluidUniforms.uWaxScale.value = state.waxVolume;
      fluidUniforms.uRoomLight.value = state.roomDimmer;
    }

    // ============================================================================
    // 11. UI CONTROLS & INTERACTION WIRING
    // ============================================================================
    const powerBtn = document.getElementById('power-btn');
    const powerText = document.getElementById('power-text');
    const presetLabel = document.getElementById('preset-label');
    const presetsGrid = document.getElementById('presets-grid');
    const heatSlider = document.getElementById('heat-slider');
    const heatVal = document.getElementById('heat-val');
    const waxSlider = document.getElementById('wax-slider');
    const waxVal = document.getElementById('wax-val');
    const roomSlider = document.getElementById('room-slider');
    const roomVal = document.getElementById('room-val');
    const orbitBtn = document.getElementById('orbit-btn');
    const slowmoBtn = document.getElementById('slowmo-btn');

    function setPower(on) {
      state.power = on;
      powerBtn.classList.toggle('off', !on);
      powerText.textContent = on ? 'ON' : 'OFF';
      rockerMesh.rotation.x = on ? 0.18 : -0.18;
    }

    powerBtn.addEventListener('click', () => setPower(!state.power));

    // Build preset swatches
    PRESETS.forEach((p, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset-swatch' + (idx === 0 ? ' active' : '');
      btn.style.background = p.swatch;
      btn.title = p.name;
      btn.addEventListener('click', () => applyPreset(idx));
      presetsGrid.appendChild(btn);
    });

    const targetColors = {
      waxHot: new THREE.Color(PRESETS[0].waxHot),
      waxCool: new THREE.Color(PRESETS[0].waxCool),
      waxGlow: new THREE.Color(PRESETS[0].waxGlow),
      liquidTop: new THREE.Color(PRESETS[0].liquidTop),
      liquidBot: new THREE.Color(PRESETS[0].liquidBot),
      bulbColor: new THREE.Color(PRESETS[0].bulbColor)
    };

    function applyPreset(idx) {
      state.presetIndex = idx;
      const p = PRESETS[idx];
      presetLabel.textContent = p.name;
      document.querySelectorAll('.preset-swatch').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      targetColors.waxHot.set(p.waxHot);
      targetColors.waxCool.set(p.waxCool);
      targetColors.waxGlow.set(p.waxGlow);
      targetColors.liquidTop.set(p.liquidTop);
      targetColors.liquidBot.set(p.liquidBot);
      targetColors.bulbColor.set(p.bulbColor);
    }

    heatSlider.addEventListener('input', (e) => {
      state.heatSetting = parseFloat(e.target.value);
      heatVal.textContent = `${Math.round(state.heatSetting * 100)}%`;
    });

    waxSlider.addEventListener('input', (e) => {
      state.waxVolume = parseFloat(e.target.value);
      waxVal.textContent = `${Math.round(state.waxVolume * 100)}%`;
    });

    function updateRoomLighting(level) {
      state.roomDimmer = level;
      roomVal.textContent = `${Math.round(level * 100)}%`;
      roomAmbient.intensity = 0.08 + level * 1.15;
      roomKeyLight.intensity = 0.05 + level * 1.65;
    }

    roomSlider.addEventListener('input', (e) => {
      updateRoomLighting(parseFloat(e.target.value));
    });
    updateRoomLighting(state.roomDimmer);

    orbitBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      orbitBtn.classList.toggle('active', controls.autoRotate);
    });

    slowmoBtn.addEventListener('click', () => {
      state.slowMo = !state.slowMo;
      slowmoBtn.classList.toggle('active', state.slowMo);
    });

    // Raycast click on the physical 3D cord switch to toggle power
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (moveDist > 6) return;

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects([switchBody, rockerMesh], false);
      if (hits.length > 0) {
        setPower(!state.power);
      }
    });

    // Change cursor when hovering over the 3D cord switch
    renderer.domElement.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects([switchBody, rockerMesh], false);
      renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
    });

    // ============================================================================
    // 12. RESIZE & ANIMATION LOOP (WITH FIXED TIMESTEP ACCUMULATOR)
    // ============================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });

    // Pre-warm the physics simulation for 180 steps so blobs are naturally distributed on frame 1
    for (let i = 0; i < 180; i++) {
      stepSimulation(FIXED_DT);
    }

    let lastFrameTime = performance.now();
    let accumulator = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const rawDt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      const timeScale = state.slowMo ? 0.22 : 1.0;
      accumulator += rawDt * timeScale;

      // Advance physics with bounded fixed timestep so frame hitches never destabilize blobs
      let substeps = 0;
      while (accumulator >= FIXED_DT && substeps < 6) {
        stepSimulation(FIXED_DT);
        accumulator -= FIXED_DT;
        substeps++;
      }

      // Smoothly interpolate colorway transitions
      const colorLerp = Math.min(1.0, rawDt * 6.0);
      fluidUniforms.uWaxHot.value.lerp(targetColors.waxHot, colorLerp);
      fluidUniforms.uWaxCool.value.lerp(targetColors.waxCool, colorLerp);
      fluidUniforms.uWaxGlow.value.lerp(targetColors.waxGlow, colorLerp);
      fluidUniforms.uLiquidTop.value.lerp(targetColors.liquidTop, colorLerp);
      fluidUniforms.uLiquidBot.value.lerp(targetColors.liquidBot, colorLerp);

      lampMainLight.color.lerp(targetColors.bulbColor, colorLerp);
      lampBaseLight.color.lerp(targetColors.waxHot, colorLerp);
      bulbMat.emissive.lerp(targetColors.bulbColor, colorLerp);

      cinematicPass.uniforms.uTime.value = now * 0.001;

      controls.update();
      composer.render();
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
