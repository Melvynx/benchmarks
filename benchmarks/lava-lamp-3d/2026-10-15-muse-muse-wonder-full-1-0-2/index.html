<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muse-wonder-full-1.0</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#070605;color:#f3ead9;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .brand{position:fixed;top:18px;left:22px;z-index:10;font-size:13px;font-weight:600;
    letter-spacing:.22em;text-transform:lowercase;color:rgba(243,234,217,.92);
    text-shadow:0 1px 12px rgba(0,0,0,.8);pointer-events:none;user-select:none}
  .hint{position:fixed;left:22px;bottom:18px;z-index:10;font-size:11px;letter-spacing:.08em;
    color:rgba(243,234,217,.42);pointer-events:none;user-select:none}
  .panel{position:fixed;right:18px;bottom:18px;z-index:20;width:272px;padding:16px 16px 14px;
    background:rgba(14,11,9,.62);border:1px solid rgba(255,235,200,.14);border-radius:16px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
  .row:first-child{margin-top:0}.row:last-child{margin-bottom:0}
  .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(243,234,217,.72);white-space:nowrap}
  .val{font-size:11px;color:rgba(243,234,217,.5);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:99px;
    background:linear-gradient(90deg,rgba(255,150,60,.85),rgba(255,220,160,.25));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#ffe9c4;border:1px solid rgba(0,0,0,.35);box-shadow:0 0 10px rgba(255,170,70,.55);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#ffe9c4;border:1px solid rgba(0,0,0,.35)}
  .switch{position:relative;width:46px;height:25px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .track{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,235,200,.18);transition:.25s}
  .track:after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
    background:#cfc4b0;transition:.25s}
  .switch input:checked + .track{background:rgba(255,120,30,.75);box-shadow:0 0 14px rgba(255,130,40,.5)}
  .switch input:checked + .track:after{transform:translateX(21px);background:#fff3d8}
  .switch.sm{width:38px;height:21px}.switch.sm .track:after{width:15px;height:15px}
  .switch.sm input:checked + .track:after{transform:translateX(17px)}
  .presets{display:flex;gap:6px}
  .preset{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor:pointer;
    padding:0;transition:.2s;position:relative;flex:none}
  .preset:hover{transform:scale(1.1)}
  .preset.active{border-color:#fff3d8;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 0 16px rgba(255,200,110,.45)}
  .divider{height:1px;background:rgba(255,235,200,.1);margin:12px 0}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .tog{display:flex;align-items:center;justify-content:space-between;gap:8px}
  @media (max-width:560px){.panel{width:calc(100vw - 24px);right:12px;bottom:12px}.hint{display:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div class="brand">muse-wonder-full-1.0</div>
<div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click the base switch</div>

<div class="panel" id="panel">
  <div class="row"><span class="lbl">Power</span>
    <label class="switch"><input type="checkbox" id="power" checked><span class="track"></span></label></div>
  <div class="divider"></div>
  <div class="row"><span class="lbl">Colour</span><div class="presets" id="presets"></div></div>
  <div class="divider"></div>
  <div class="row"><span class="lbl">Heat</span><input type="range" id="heat" min="40" max="220" value="110"><span class="val" id="heatV"></span></div>
  <div class="row"><span class="lbl">Wax</span><input type="range" id="waxAmt" min="55" max="160" value="100"><span class="val" id="waxV"></span></div>
  <div class="row"><span class="lbl">Room</span><input type="range" id="room" min="0" max="160" value="55"><span class="val" id="roomV"></span></div>
  <div class="divider"></div>
  <div class="toggles">
    <div class="tog"><span class="lbl">Slow-mo</span>
      <label class="switch sm"><input type="checkbox" id="slowmo"><span class="track"></span></label></div>
    <div class="tog"><span class="lbl">Orbit</span>
      <label class="switch sm"><input type="checkbox" id="autorot"><span class="track"></span></label></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= core ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090706);
scene.fog = new THREE.FogExp2(0x090706, 0.028);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 60);
camera.position.set(3.4, 2.5, 4.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.78, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2.1; controls.maxDistance = 9.5;
controls.maxPolarAngle = Math.PI * 0.56; controls.minPolarAngle = Math.PI * 0.12;
controls.autoRotateSpeed = 0.7; controls.enablePan = false;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

/* lamp geometry constants — shared by JS sim, meshes and GLSL */
const IB = 1.04, IT = 3.14;                       // glass interior bottom / top (y)
function vesselR(y){
  const t = THREE.MathUtils.clamp((y-IB)/(IT-IB), 0, 1);
  let r = (0.60*(1-t) + 0.295*t) + 0.05*Math.sin(t*Math.PI)*(1-t*0.6);
  if (t > 0.93) r *= Math.sqrt(Math.max(0.05, 1 - Math.pow((t-0.93)/0.07, 2)*0.85));
  return r;
}

/* ================= procedural textures ================= */
function canvasTex(w, h, draw, rx=1, ry=1){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const woodTex = canvasTex(1024, 512, (g,w,h)=>{
  g.fillStyle='#4a3220'; g.fillRect(0,0,w,h);
  const rows=4, rh=h/rows;
  for(let r=0;r<rows;r++){
    const base=58+Math.random()*22;
    g.fillStyle=`rgb(${base+28},${base*0.72|0},${base*0.42|0})`; g.fillRect(0,r*rh,w,rh);
    for(let i=0;i<240;i++){ // grain
      const y=r*rh+Math.random()*rh, len=40+Math.random()*300, x=Math.random()*w;
      g.strokeStyle=`rgba(${20+Math.random()*40|0},${12+Math.random()*22|0},6,${0.08+Math.random()*0.22})`;
      g.lineWidth=0.6+Math.random()*1.6; g.beginPath(); g.moveTo(x,y);
      g.bezierCurveTo(x+len*0.3,y+ (Math.random()*4-2), x+len*0.7,y+(Math.random()*4-2), x+len,y); g.stroke();
    }
    for(let k=0;k<2;k++){ // knots
      const x=Math.random()*w, y=r*rh+rh*(0.25+Math.random()*0.5);
      const gr=g.createRadialGradient(x,y,1,x,y,14+Math.random()*10);
      gr.addColorStop(0,'rgba(25,12,4,.85)'); gr.addColorStop(1,'rgba(25,12,4,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(x,y,24,0,7); g.fill();
    }
    g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,r*rh,w,2);
  }
}, 2, 1);
const woodRough = canvasTex(512,256,(g,w,h)=>{
  g.fillStyle='#8a8a8a'; g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){ g.fillStyle=`rgba(${90+Math.random()*90|0},0,0,0)`;
    g.fillStyle=`rgba(${90+Math.random()*90|0},${90+Math.random()*90|0},${90+Math.random()*90|0},.25)`;
    g.fillRect(Math.random()*w,Math.random()*h,8+Math.random()*30,1); }
},2,1); woodRough.colorSpace = THREE.NoColorSpace;
const brushedTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#7d7d7d'; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){ const v=95+Math.random()*80|0;
    g.strokeStyle=`rgba(${v},${v},${v},.35)`; g.lineWidth=1;
    const y=Math.random()*h; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y+(Math.random()*2-1)); g.stroke(); }
},3,1); brushedTex.colorSpace = THREE.NoColorSpace;
const wallTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#2b2622'; g.fillRect(0,0,w,h);
  for(let i=0;i<14000;i++){ const v=28+Math.random()*26|0;
    g.fillStyle=`rgba(${v+12},${v+6},${v},.5)`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
},3,2);

/* ================= room ================= */
const hemi = new THREE.HemisphereLight(0x35405a, 0x1a120c, 0.35); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa8d8, 0.5);
moon.position.set(-5, 6, -3); moon.castShadow = true;
moon.shadow.mapSize.set(1024,1024); moon.shadow.bias = -0.0004;
moon.shadow.camera.left=-6; moon.shadow.camera.right=6; moon.shadow.camera.top=6; moon.shadow.camera.bottom=-6;
scene.add(moon);

const table = new THREE.Mesh(
  new THREE.BoxGeometry(14, 0.22, 9),
  new THREE.MeshStandardMaterial({ map:woodTex, roughnessMap:woodRough, roughness:0.75, metalness:0.02 }));
table.position.y = -0.11; table.receiveShadow = true; scene.add(table);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({ color:0x17120e, roughness:0.95 }));
floor.rotation.x = -Math.PI/2; floor.position.y = -2.4; floor.receiveShadow = true; scene.add(floor);
const legMat = new THREE.MeshStandardMaterial({ color:0x241a11, roughness:0.85 });
for (const [x,z] of [[-5.6,-3.4],[5.6,-3.4],[-5.6,3.4],[5.6,3.4]]){
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3,2.3,0.3), legMat);
  leg.position.set(x,-1.35,z); leg.castShadow=true; scene.add(leg);
}
const wallMat = new THREE.MeshStandardMaterial({ map:wallTex, roughness:0.96 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30,14), wallMat);
backWall.position.set(0,4.5,-4.6); backWall.receiveShadow=true; scene.add(backWall);
const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(30,14), wallMat.clone());
sideWall.rotation.y = Math.PI/2; sideWall.position.set(-6.4,4.5,0); sideWall.receiveShadow=true; scene.add(sideWall);

/* props for scale and to catch the glow */
function box(w,h,d,color,x,y,z,ry=0,rough=0.8){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color, roughness:rough }));
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=m.receiveShadow=true; scene.add(m); return m;
}
box(1.15,0.16,0.82, 0x5a2e2e, -1.85,0.08,-0.55, 0.22);
box(1.02,0.13,0.74, 0x24382e, -1.82,0.225,-0.53, 0.08);
box(0.88,0.12,0.66, 0x74603a, -1.86,0.35,-0.56, 0.38);
const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.14,0.3,32,1,true),
  new THREE.MeshStandardMaterial({ color:0x8a93a0, roughness:0.35, metalness:0.1, side:THREE.DoubleSide }));
mug.position.set(1.75,0.15,-0.7); mug.castShadow=mug.receiveShadow=true; scene.add(mug);
const mugBottom = new THREE.Mesh(new THREE.CircleGeometry(0.14,32), mug.material);
mugBottom.rotation.x=-Math.PI/2; mugBottom.position.set(1.75,0.005,-0.7); scene.add(mugBottom);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.11,0.022,10,24,Math.PI), mug.material);
handle.position.set(1.93,0.15,-0.7); handle.rotation.z=-Math.PI/2; handle.castShadow=true; scene.add(handle);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.2,0.4,24),
  new THREE.MeshStandardMaterial({ color:0x6e4433, roughness:0.9 }));
pot.position.set(2.15,0.2,-1.75); pot.castShadow=pot.receiveShadow=true; scene.add(pot);
const leafMat = new THREE.MeshStandardMaterial({ color:0x1e3d24, roughness:0.85 });
for(let i=0;i<7;i++){
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16+Math.random()*0.12, 10, 8), leafMat);
  leaf.scale.set(1, 0.55+Math.random()*0.4, 1);
  leaf.position.set(2.15+(Math.random()-0.5)*0.55, 0.55+Math.random()*0.45, -1.75+(Math.random()-0.5)*0.55);
  leaf.castShadow=true; scene.add(leaf);
}
box(0.05,1.5,1.1, 0x191410, -3.4,0.75,-2.2, 0.3, 0.7); // picture frame leaning hint

/* ================= lamp ================= */
const lamp = new THREE.Group(); scene.add(lamp);
const metalMat = new THREE.MeshStandardMaterial({
  color:0xd8d4cc, metalness:1.0, roughness:0.34, roughnessMap:brushedTex,
  envMapIntensity:1.15, side:THREE.DoubleSide });
const darkMetal = new THREE.MeshStandardMaterial({
  color:0x3a3632, metalness:0.85, roughness:0.45, roughnessMap:brushedTex, envMapIntensity:0.7 });

function lathe(pts, mat, seg=72){
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])), seg), mat);
  m.castShadow = true; m.receiveShadow = true; lamp.add(m); return m;
}
/* conical base hiding the bulb */
lathe([[0.001,0],[0.62,0],[0.79,0.015],[0.805,0.07],[0.74,0.2],[0.63,0.5],[0.55,0.82],
       [0.53,0.95],[0.575,1.0],[0.585,1.05],[0.56,1.08],[0.5,1.08],[0.49,1.01]], metalMat);
/* matching cap */
lathe([[0.395,2.98],[0.425,3.03],[0.415,3.09],[0.35,3.28],[0.25,3.44],[0.205,3.52],[0.21,3.56],[0.001,3.56]], metalMat);
/* felt pad */
const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.66,0.66,0.02,48),
  new THREE.MeshStandardMaterial({ color:0x100d0b, roughness:1 }));
pad.position.y = 0.01; lamp.add(pad);

/* glass vessel — real wall profile with rounded sealed top */
const glassPts = [];
glassPts.push([0.001, 0.905],[0.34,0.91],[0.55,0.94]);
for(let i=0;i<=28;i++){ const y = IB + (IT-IB)*i/28; glassPts.push([vesselR(y)+0.062, y]); }
glassPts.push([0.3,3.22],[0.22,3.3],[0.1,3.36],[0.001,3.38]);
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.035, transmission:1, thickness:0.09,
  ior:1.5, clearcoat:0.6, clearcoatRoughness:0.08, envMapIntensity:0.5,
  specularIntensity:1.1, side:THREE.DoubleSide });
const glass = lathe(glassPts, glassMat); glass.castShadow=false; glass.renderOrder=30;

/* tinted liquid volume just inside the glass */
const liqPts = [[0.001,IB+0.005]];
for(let i=0;i<=28;i++){ const y = IB + (IT-IB-0.06)*i/28; liqPts.push([Math.max(0.02,vesselR(y)-0.012), y]); }
liqPts.push([0.001, IT-0.02]);
const liquidMat = new THREE.MeshPhysicalMaterial({
  color:0xcc9420, metalness:0, roughness:0.05, transmission:0.92, thickness:0.7,
  ior:1.33, attenuationColor:new THREE.Color(0xffb520), attenuationDistance:0.45,
  envMapIntensity:0.15, side:THREE.DoubleSide, transparent:true, opacity:0.22, depthWrite:false });
const liquid = lathe(liqPts, liquidMat); liquid.castShadow=false; liquid.renderOrder=20;

/* bulb, filament glow and lights */
const bulbMat = new THREE.MeshStandardMaterial({
  color:0xfff2d0, emissive:0xffc266, emissiveIntensity:6, roughness:0.4 });
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 18), bulbMat);
bulb.scale.set(1, 1.45, 1); bulb.position.y = 1.1; lamp.add(bulb);
const bulbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.085,0.14,20), darkMetal);
bulbBase.position.y = 0.95; lamp.add(bulbBase);

const bulbLight = new THREE.PointLight(0xffa63d, 22, 14, 1.9);
bulbLight.position.set(0, 1.45, 0); bulbLight.castShadow = true;
bulbLight.shadow.mapSize.set(1024,1024); bulbLight.shadow.bias = -0.004;
bulbLight.shadow.camera.near = 0.15; bulbLight.shadow.camera.far = 13;
lamp.add(bulbLight);
const spill = new THREE.SpotLight(0xff9a35, 14, 8, Math.PI*0.55, 0.9, 1.6);
spill.position.set(0, 1.7, 0); spill.target.position.set(0, 0, 0);
lamp.add(spill, spill.target);

/* soft additive glow sprite at the glass bottom */
function glowSprite(color, scale, opacity){
  const t = canvasTex(128,128,(g,w,h)=>{
    const gr=g.createRadialGradient(64,64,2,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,.35)');
    gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, color,
    transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false }));
  s.scale.setScalar(scale); return s;
}
const coreGlow = glowSprite(0xffb154, 1.15, 0.2); coreGlow.position.y = 1.28; coreGlow.renderOrder=25; lamp.add(coreGlow);
const haloGlow = glowSprite(0xff8a30, 3.0, 0.05); haloGlow.position.y = 1.9; haloGlow.renderOrder=24; lamp.add(haloGlow);

/* power cord trailing off the table + inline switch */
const cordPts = [
  new THREE.Vector3(0, 0.28, -0.72), new THREE.Vector3(-0.15, 0.1, -1.25),
  new THREE.Vector3(-0.7, 0.045, -1.9), new THREE.Vector3(-1.55, 0.045, -2.25),
  new THREE.Vector3(-2.6, 0.045, -2.5), new THREE.Vector3(-3.6, 0.04, -3.1),
  new THREE.Vector3(-4.3, -0.5, -3.85), new THREE.Vector3(-4.45, -1.8, -4.05),
  new THREE.Vector3(-4.4, -2.38, -4.3)];
const cord = new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cordPts), 90, 0.032, 10),
  new THREE.MeshStandardMaterial({ color:0x17130f, roughness:0.65 }));
cord.castShadow = cord.receiveShadow = true; scene.add(cord);
const switchBox = new THREE.Group();
const swBody = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.09,0.16),
  new THREE.MeshStandardMaterial({ color:0x211c17, roughness:0.5 }));
swBody.castShadow = swBody.receiveShadow = true; switchBox.add(swBody);
const swToggle = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.055,0.07),
  new THREE.MeshStandardMaterial({ color:0xd8c9a8, roughness:0.4 }));
swToggle.position.set(0,0.065,0); swToggle.rotation.x = -0.4; switchBox.add(swToggle);
switchBox.position.set(-2.05, 0.045, -2.38); switchBox.rotation.y = 1.15; scene.add(switchBox);
/* small rocker on the base itself (clickable) */
const baseSwitch = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.095,0.06),
  new THREE.MeshStandardMaterial({ color:0xe8dcc2, roughness:0.35 }));
baseSwitch.position.set(0.34, 0.34, 0.58); baseSwitch.rotation.x = 0.5; baseSwitch.castShadow=true;
lamp.add(baseSwitch);
/* generous invisible hit target so the rocker is easy to click at any angle */
const switchHit = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.34,0.34),
  new THREE.MeshBasicMaterial({ visible:false }));
switchHit.position.copy(baseSwitch.position); lamp.add(switchHit);

/* ================= wax simulation (heat model, fixed step) ================= */
const POOL_N = 4, BLOB_N = 24, MAXB = POOL_N + BLOB_N;
const state = {
  powerOn:true, power:1, warmup:0.85, heat:1.1, waxAmt:1.0, room:0.55,
  slowmo:false, spawnT:0.4, time:0, flicker:1 };
const blobs = [];
for(let i=0;i<BLOB_N;i++) blobs.push({
  active:false, pos:new THREE.Vector3(0,-10,0), vel:new THREE.Vector3(),
  r:0.15, temp:0.2, stretch:1, phase:Math.random()*Math.PI*2,
  wob:0.6+Math.random()*1.1, merging:0, born:0 });
/* pre-warm a lively set so the lamp is already flowing on first load */
function seedInitial(){
  const seeds = [[-0.12,1.55,0.08,0.24,0.8],[0.14,2.05,-0.1,0.19,0.62],[0.0,2.5,0.12,0.16,0.4],
                 [-0.08,2.85,-0.05,0.14,0.25],[0.18,1.32,-0.14,0.2,0.9],[-0.2,2.25,0.16,0.12,0.5],
                 [0.06,1.85,0.2,0.13,0.7]];
  seeds.forEach((s,i)=>{ const b=blobs[i]; b.active=true; b.pos.set(s[0],s[1],s[2]);
    b.r=s[3]; b.temp=s[4]; b.vel.set(0,(s[4]-0.5)*0.12,0); b.born=-5; });
}
seedInitial();
const poolDefs = [[0,0,0.5],[-0.27,0.1,0.35],[0.28,-0.08,0.35],[0.02,0.26,0.3]];
function activeVolume(){ let v=0; for(const b of blobs) if(b.active) v+=b.r*b.r*b.r; return v; }

function spawnBlob(){
  const b = blobs.find(x=>!x.active); if(!b) return;
  const maxActive = Math.round(6 + state.waxAmt*9);
  if (blobs.filter(x=>x.active).length >= maxActive) return;
  const a = Math.random()*Math.PI*2, rad = Math.random()*0.22;
  b.active = true; b.merging = 0;
  b.r = (0.11 + Math.random()*0.13) * (0.75 + state.waxAmt*0.3);
  b.pos.set(Math.cos(a)*rad, IB + 0.1 + b.r*0.4, Math.sin(a)*rad);
  b.vel.set(0, 0.015, 0); b.temp = 0.82 + Math.random()*0.15;
  b.phase = Math.random()*Math.PI*2; b.born = state.time;
}
function stepWax(dt){
  state.time += dt;
  /* warm-up / cool-down of the whole vessel */
  const warmTarget = state.powerOn ? 1 : 0;
  state.warmup += (warmTarget - state.warmup) * dt * (state.powerOn ? 0.22 : 0.07);
  state.power  += ((state.powerOn?1:0) - state.power) * dt * 1.6;
  const heatOn = state.warmup * state.heat;

  /* feed new blobs from the pool once warm */
  state.spawnT -= dt;
  if (state.spawnT <= 0){
    state.spawnT = (1.4 + Math.random()*2.6) / Math.max(0.25, state.heat);
    if (state.warmup > 0.55) spawnBlob();
  }
  for (const b of blobs){
    if (!b.active) continue;
    if (b.merging > 0){ /* sinking blob dissolving back into the pool */
      b.merging += dt*2.2; b.r *= Math.max(0, 1 - dt*1.8);
      b.pos.y -= dt*0.08;
      if (b.merging >= 1 || b.r < 0.03){ b.active=false; b.pos.y=-10; }
      continue;
    }
    const tH = THREE.MathUtils.clamp((b.pos.y-IB)/(IT-IB), 0, 1);
    /* environment temperature: hot at the bulb, cold at the cap */
    const envT = (0.97*(1-tH) + 0.1*tH) * heatOn + 0.04;
    const rate = tH < 0.25 ? 0.55 : (tH > 0.8 ? 0.32 : 0.13);
    b.temp += (envT - b.temp) * Math.min(1, rate*dt*2.2);
    b.temp = THREE.MathUtils.clamp(b.temp, 0, 1);

    /* buoyancy: warm wax expands and rises, cool wax sinks */
    const buoy = (b.temp - 0.52) * 0.55 * (0.6 + state.heat*0.45);
    b.vel.y += buoy * dt;
    /* gentle convective wobble */
    b.vel.x += Math.sin(state.time*b.wob + b.phase) * 0.02 * dt * (0.4+b.temp);
    b.vel.z += Math.cos(state.time*b.wob*0.83 + b.phase*1.7) * 0.02 * dt * (0.4+b.temp);
    /* viscous drag — bigger blobs keep more momentum */
    const drag = Math.exp(-dt * (1.15 / Math.max(0.5, b.r*4)));
    b.vel.multiplyScalar(drag);
    b.vel.y = THREE.MathUtils.clamp(b.vel.y, -0.22, 0.3);
    b.pos.addScaledVector(b.vel, dt);

    /* stretch along travel; cool falling blobs look dense and round */
    const targetStretch = b.vel.y > 0.01
      ? 1 + Math.min(0.75, b.vel.y*2.4) + Math.sin(state.time*2.1+b.phase)*0.05
      : 0.88 + Math.min(0.25, -b.vel.y*0.8);
    b.stretch += (targetStretch - b.stretch) * Math.min(1, dt*3);

    /* confinement inside the tapered glass */
    const stretchR = b.r * Math.max(1, b.stretch);
    const yMin = IB + b.r*0.55, yMax = IT - stretchR - 0.03;
    if (b.pos.y > yMax){ b.pos.y = yMax; b.vel.y = Math.min(b.vel.y, 0); }
    if (b.pos.y < yMin){
      b.pos.y = yMin;
      if (b.vel.y < 0 && state.time - b.born > 2.5 && b.temp < 0.72) b.merging = 0.001;
      b.vel.y = Math.max(b.vel.y, 0);
    }
    const wallR = vesselR(b.pos.y) - b.r*0.92 - 0.015;
    const radial = Math.hypot(b.pos.x, b.pos.z);
    if (radial > wallR && radial > 1e-5){
      const s = Math.max(0, wallR)/radial; b.pos.x*=s; b.pos.z*=s;
      b.vel.x *= 0.4; b.vel.z *= 0.4;
    }
    /* pinch-off: a fast, large riser sheds a droplet */
    if (b.r > 0.21 && b.vel.y > 0.1 && Math.random() < dt*0.1){
      const c = blobs.find(x=>!x.active);
      if (c){ const cr = b.r*0.38;
        c.active=true; c.merging=0; c.r=cr; c.temp=b.temp; c.born=state.time;
        c.pos.copy(b.pos); c.pos.y -= b.r*b.stretch*0.9;
        c.vel.copy(b.vel).multiplyScalar(0.55);
        b.r = Math.cbrt(Math.max(0.001, b.r**3 - cr**3)); }
    }
  }
  /* physical merging of strongly overlapping blobs (volume conserved) */
  for(let i=0;i<blobs.length;i++){ const a=blobs[i]; if(!a.active||a.merging) continue;
    for(let j=i+1;j<blobs.length;j++){ const b=blobs[j]; if(!b.active||b.merging) continue;
      if (a.pos.distanceToSquared(b.pos) < Math.pow((a.r+b.r)*0.5, 2)){
        const big = a.r>=b.r ? a : b, small = big===a ? b : a;
        const v = big.r**3 + small.r**3;
        big.pos.lerp(small.pos, small.r**3/v); big.vel.lerp(small.vel, 0.4);
        big.temp = (big.temp*big.r**3 + small.temp*small.r**3)/v;
        big.r = Math.min(0.3, Math.cbrt(v));
        small.active=false; small.pos.y=-10;
      }
    }
  }
  /* bulb flicker from wax passing over it */
  let occ = 0;
  for(const b of blobs) if(b.active && b.pos.y < IB+0.55) occ += b.r*1.6;
  const targetFlick = THREE.MathUtils.clamp(1.06 - occ*0.35, 0.68, 1.08)
    + Math.sin(state.time*13.7)*0.012 + Math.sin(state.time*3.1)*0.02;
  state.flicker += (targetFlick - state.flicker) * Math.min(1, dt*5);
}

/* ================= wax raymarched SDF ================= */
const waxUniforms = {
  uBalls:{ value:Array.from({length:MAXB},()=>new THREE.Vector4(0,-10,0,0.001)) },
  uMeta:{ value:Array.from({length:MAXB},()=>new THREE.Vector4(1,0.5,0,0)) },
  uTime:{ value:0 }, uPower:{ value:1 }, uFlicker:{ value:1 }, uSteps:{ value:88 },
  uWaxDeep:{ value:new THREE.Color(0x8f0d04) }, uWaxMid:{ value:new THREE.Color(0xff2a12) },
  uWaxHot:{ value:new THREE.Color(0xffa03c) }, uLiquid:{ value:new THREE.Color(0xffcf3f) },
  uBulbPos:{ value:new THREE.Vector3(0,1.12,0) },
  uBoxMin:{ value:new THREE.Vector3(-0.72, IB-0.06, -0.72) },
  uBoxMax:{ value:new THREE.Vector3( 0.72, IT+0.08,  0.72) } };
const waxVert = /* glsl */`
  varying vec3 vWorld;
  void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp; }`;
const waxFrag = /* glsl */`
  precision highp float;
  varying vec3 vWorld;
  uniform vec4 uBalls[${MAXB}]; uniform vec4 uMeta[${MAXB}];
  uniform float uTime, uPower, uFlicker, uSteps;
  uniform vec3 uWaxDeep, uWaxMid, uWaxHot, uLiquid, uBulbPos, uBoxMin, uBoxMax;
  const float IB = ${IB.toFixed(3)}; const float IT = ${IT.toFixed(3)};
  float vesselR(float y){ float t = clamp((y-IB)/(IT-IB), 0.0, 1.0);
    float r = (0.60*(1.0-t) + 0.295*t) + 0.05*sin(t*3.14159)*(1.0-t*0.6);
    if (t > 0.93) r *= sqrt(max(0.05, 1.0 - pow((t-0.93)/0.07, 2.0)*0.85));
    return r; }
  float smin(float a, float b, float k){ float h = clamp(0.5+0.5*(b-a)/k, 0.0, 1.0);
    return mix(b, a, h) - k*h*(1.0-h); }
  float ballSDF(vec3 p, int i){
    vec3 c = uBalls[i].xyz; float r = uBalls[i].w;
    float st = uMeta[i].x; float ph = uMeta[i].z;
    vec3 q = (p - c) / vec3(1.0, st, 1.0);
    float d = (length(q) - r) * min(1.0, st);
    d += sin(p.y*16.0 - uTime*1.7 + ph) * cos(p.x*13.0 + ph) * 0.0035;
    return d; }
  float mapWax(vec3 p){
    float d = 1e5;
    for(int i=0;i<${MAXB};i++){ if(uBalls[i].w < 0.004) continue; d = smin(d, ballSDF(p,i), 0.16); }
    float wall = length(p.xz) - (vesselR(p.y) - 0.012);
    float capB = (IB + 0.008) - p.y; float capT = p.y - (IT - 0.015);
    return max(d, max(wall, max(capB, capT))); }
  float tempAt(vec3 p){ float sum=0.0, wsum=0.0;
    for(int i=0;i<${MAXB};i++){ if(uBalls[i].w < 0.004) continue;
      float dist = length(p - uBalls[i].xyz);
      float w = exp(-dist*7.0) * uBalls[i].w; sum += uMeta[i].y * w; wsum += w; }
    return wsum > 0.0 ? sum/wsum : 0.3; }
  vec3 calcNormal(vec3 p){ float e = 0.0038;
    vec2 k = vec2(1.0,-1.0);
    return normalize(k.xyy*mapWax(p+k.xyy*e) + k.yyx*mapWax(p+k.yyx*e)
                   + k.yxy*mapWax(p+k.yxy*e) + k.xxx*mapWax(p+k.xxx*e)); }
  vec2 boxHit(vec3 ro, vec3 rd){
    vec3 t0 = (uBoxMin-ro)/rd, t1 = (uBoxMax-ro)/rd;
    vec3 tsm = min(t0,t1), tbg = max(t0,t1);
    return vec2(max(max(tsm.x,tsm.y),tsm.z), min(min(tbg.x,tbg.y),tbg.z)); }
  float thicknessToLight(vec3 p, vec3 ld){ float th=0.0; float t=0.03;
    for(int i=0;i<6;i++){ float d = mapWax(p + ld*t); th += clamp(-d, 0.0, 0.12); t += 0.05; }
    return th; }
  void main(){
    vec3 ro = cameraPosition; vec3 rd = normalize(vWorld - ro);
    vec2 bt = boxHit(ro, rd); float t = max(bt.x, 0.0); float tEnd = bt.y;
    if (tEnd <= t) discard;
    float d = 1e5; vec3 p = ro + rd*t; bool hit = false;
    for(int i=0;i<140;i++){ if(float(i) >= uSteps) break;
      p = ro + rd*t; d = mapWax(p);
      if (d < 0.0016){ hit = true; break; }
      t += max(d*0.62, 0.0022); if (t > tEnd) break; }
    if (!hit) discard;
    vec3 N = calcNormal(p); vec3 V = -rd;
    vec3 toBulb = uBulbPos - p; float bulbDist = length(toBulb); vec3 L = toBulb/bulbDist;
    float temp = tempAt(p);
    float bulbGlow = exp(-bulbDist*1.15) * uPower * uFlicker;
    float thick = thicknessToLight(p, L);
    float thin = exp(-thick*7.0);
    vec3 base = mix(uWaxDeep, uWaxMid, clamp(temp*0.55 + bulbGlow*0.16, 0.0, 1.0));
    float wrap = clamp((dot(N,L)+0.65)/1.65, 0.0, 1.0);
    float att = 1.0/(1.0 + bulbDist*bulbDist*0.55);
    vec3 col = base * (0.05 + wrap*att*1.05*(0.25+uPower));
    /* subsurface: light shining through thin wax toward the camera */
    float sss = pow(clamp(dot(V, -L)*0.5+0.5, 0.0, 1.0), 3.0) * thin;
    col += uWaxHot * (sss*0.5 + bulbGlow*0.18) * (0.3 + temp*0.9) * uPower;
    col += uWaxMid * bulbGlow * 0.1;
    /* cool wax reads darker and more saturated */
    col *= mix(0.42, 1.0, temp*0.7 + uPower*0.3);
    float fres = pow(1.0 - max(dot(N,V),0.0), 3.0);
    col += uLiquid * fres * 0.16 + vec3(1.0,0.93,0.8)*fres*0.05;
    vec3 H = normalize(L+V);
    col += vec3(1.0,0.9,0.75) * pow(max(dot(N,H),0.0), 70.0) * 0.28 * (0.2+uPower*att);
    /* faint room key light so the form reads with the lamp off */
    vec3 L2 = normalize(vec3(-0.5,0.8,-0.3));
    col += base * max(dot(N,L2),0.0) * 0.05;
    /* haze of tinted liquid in front of the wax */
    float liqPath = clamp((t - bt.x)*0.22, 0.0, 0.35);
    col = mix(col, uLiquid*0.18*(0.3+uPower*0.7), liqPath*0.18);
    col = min(col, vec3(1.2));
    gl_FragColor = vec4(col, 1.0);
  }`;
const waxMat = new THREE.ShaderMaterial({
  uniforms:waxUniforms, vertexShader:waxVert, fragmentShader:waxFrag,
  side:THREE.FrontSide, depthWrite:false, depthTest:true });
const waxProxy = new THREE.Mesh(new THREE.BoxGeometry(1.44, (IT-IB)+0.14, 1.44), waxMat);
waxProxy.position.y = (IB+IT)/2 + 0.01; waxProxy.renderOrder = 10; waxProxy.frustumCulled = false;
lamp.add(waxProxy);

function pushWaxUniforms(){
  const balls = waxUniforms.uBalls.value, meta = waxUniforms.uMeta.value;
  const totalVol = 0.42 * state.waxAmt;
  const poolVol = Math.max(0.06, totalVol - activeVolume());
  const poolScale = THREE.MathUtils.clamp(Math.cbrt(poolVol/0.42), 0.5, 1.3);
  const poolTemp = 0.25 + state.warmup*0.65;
  poolDefs.forEach((pd,i)=>{
    const breathe = 1 + Math.sin(state.time*0.7 + i*1.7)*0.02*state.warmup;
    balls[i].set(pd[0], IB + 0.045 + Math.sin(state.time*0.45+i)*0.004, pd[1], pd[2]*poolScale*breathe);
    meta[i].set(0.48, poolTemp, i*1.7, 0);
  });
  blobs.forEach((b,j)=>{
    const i = POOL_N + j;
    if (b.active){ balls[i].set(b.pos.x, b.pos.y, b.pos.z, Math.max(0.001,b.r));
      meta[i].set(b.stretch, b.temp, b.phase, 0); }
    else { balls[i].set(0,-10,0,0.001); meta[i].set(1,0,0,0); }
  });
  waxUniforms.uTime.value = state.time;
  waxUniforms.uPower.value = state.power;
  waxUniforms.uFlicker.value = state.flicker;
}

/* ================= colour presets ================= */
const PRESETS = [
  { name:'Classic',  wax:0xff2a12, waxDeep:0x8f0d04, waxHot:0xffa03c, liquid:0xffcf3f, atten:0xffb520, light:0xffa63d },
  { name:'Violet',   wax:0xff3fd4, waxDeep:0x7a0f63, waxHot:0xff9de2, liquid:0x3b2bff, atten:0x2a1bd0, light:0xb06bff },
  { name:'Lagoon',   wax:0x00e0a8, waxDeep:0x046653, waxHot:0x8affdd, liquid:0x1b52e0, atten:0x123f9e, light:0x4fc8ff },
  { name:'Ember',    wax:0xff7a00, waxDeep:0x8a3800, waxHot:0xffd23c, liquid:0x0fa08c, atten:0x067a68, light:0xff9a3d },
  { name:'Acid',     wax:0xaee81f, waxDeep:0x4f6e05, waxHot:0xe8ffb0, liquid:0x7a1fd0, atten:0x55149a, light:0xc8ff6b },
];
const colourTargets = {
  waxDeep:new THREE.Color(), waxMid:new THREE.Color(), waxHot:new THREE.Color(),
  liquid:new THREE.Color(), liquidMesh:new THREE.Color(), atten:new THREE.Color(), light:new THREE.Color() };
function applyPreset(i, instant=false){
  const p = PRESETS[i];
  colourTargets.waxDeep.set(p.waxDeep); colourTargets.waxMid.set(p.wax);
  colourTargets.waxHot.set(p.waxHot); colourTargets.liquid.set(p.liquid);
  colourTargets.liquidMesh.set(p.liquid).multiplyScalar(0.55);
  colourTargets.atten.set(p.atten); colourTargets.light.set(p.light);
  if (instant) lerpColours(1);
  document.querySelectorAll('.preset').forEach((el,j)=>el.classList.toggle('active', j===i));
}
function lerpColours(k){
  waxUniforms.uWaxDeep.value.lerp(colourTargets.waxDeep, k);
  waxUniforms.uWaxMid.value.lerp(colourTargets.waxMid, k);
  waxUniforms.uWaxHot.value.lerp(colourTargets.waxHot, k);
  waxUniforms.uLiquid.value.lerp(colourTargets.liquid, k);
  liquidMat.color.lerp(colourTargets.liquidMesh, k);
  liquidMat.attenuationColor.lerp(colourTargets.atten, k);
  bulbLight.color.lerp(colourTargets.light, k);
  spill.color.copy(bulbLight.color);
  coreGlow.material.color.lerp(colourTargets.light, k);
  haloGlow.material.color.lerp(colourTargets.light, k);
  bulbMat.emissive.lerp(colourTargets.light, k);
}
const presetsEl = document.getElementById('presets');
PRESETS.forEach((p,i)=>{
  const b = document.createElement('button');
  b.className = 'preset'; b.setAttribute('aria-label', p.name);
  const wax = '#'+p.wax.toString(16).padStart(6,'0'), liq = '#'+p.liquid.toString(16).padStart(6,'0');
  b.style.background = `radial-gradient(circle at 38% 62%, ${wax} 0 34%, ${liq} 38% 100%)`;
  b.addEventListener('click', ()=>applyPreset(i));
  presetsEl.appendChild(b);
});
applyPreset(0, true);

/* ================= controls ================= */
const $ = id => document.getElementById(id);
function bindSlider(id, out, fn){
  const el = $(id), o = $(out);
  const upd = ()=>{ const v = +el.value; o.textContent = v+'%'; fn(v/100); };
  el.addEventListener('input', upd); upd();
}
bindSlider('heat','heatV', v=>state.heat = v);
bindSlider('waxAmt','waxV', v=>state.waxAmt = v);
bindSlider('room','roomV', v=>state.room = v);
function setPower(on){
  state.powerOn = on; $('power').checked = on;
  swToggle.rotation.x = on ? -0.4 : 0.4;
  baseSwitch.rotation.x = on ? 0.5 : 0.95;
  if (on) state.spawnT = Math.max(state.spawnT, 1.2); /* warm-up before first blob */
}
$('power').addEventListener('change', e=>setPower(e.target.checked));
$('slowmo').addEventListener('change', e=>state.slowmo = e.target.checked);
$('autorot').addEventListener('change', e=>controls.autoRotate = e.target.checked);

/* clicking the physical switch on the base toggles power */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObjects([baseSwitch, switchHit, swBody, swToggle], false).length) setPower(!state.powerOn);
});

/* ================= post-processing ================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
/* glow is carried by the additive bulb sprites and emissive bulb, which
   stay round at every angle and cost far less than a bloom chain */
composer.addPass(new OutputPass());
const gradePass = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float d = distance(vUv, vec2(0.5,0.46));
      c.rgb *= smoothstep(0.95, 0.42, d)*0.32 + 0.68;
      c.rgb += (hash(vUv*vec2(1920.0,1080.0) + fract(uTime)*7.0) - 0.5) * 0.022;
      gl_FragColor = c; }`
});
composer.addPass(gradePass);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ================= main loop (fixed-step wax, adaptive quality) ================= */
const clock = new THREE.Clock();
let acc = 0, frameEMA = 16, qualityT = 0;
const FIXED = 1/60;
function animate(){
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.1);
  frameEMA = frameEMA*0.95 + rawDt*1000*0.05;
  qualityT += rawDt;
  if (qualityT > 2.5){
    qualityT = 0;
    if (frameEMA > 24 && waxUniforms.uSteps.value > 56){
      waxUniforms.uSteps.value -= 12; renderer.setPixelRatio(Math.min(devicePixelRatio, 1.35));
      composer.setSize(innerWidth, innerHeight);
    } else if (frameEMA < 13 && waxUniforms.uSteps.value < 88){
      waxUniforms.uSteps.value += 8;
    }
  }
  const speed = state.slowmo ? 0.32 : 1.0;
  acc += rawDt * speed;
  let n = 0;
  while (acc >= FIXED && n < 5){ stepWax(FIXED); acc -= FIXED; n++; }
  if (n === 5) acc = 0;
  pushWaxUniforms();
  lerpColours(1 - Math.exp(-rawDt*3.5));

  /* lamp-driven lighting, flickering as wax crosses the bulb */
  const p = state.power, f = state.flicker;
  bulbLight.intensity = 17 * p * f;
  spill.intensity = 11 * p * f;
  bulbMat.emissiveIntensity = 3.5 * p * f + 0.02;
  coreGlow.material.opacity = 0.22 * p * f;
  haloGlow.material.opacity = 0.09 * p * (0.85 + 0.15*f);
  coreGlow.scale.setScalar(1.15 * (0.92 + 0.1*f));

  /* room light level */
  hemi.intensity = 0.06 + state.room*0.55;
  moon.intensity = 0.08 + state.room*0.85;
  scene.environmentIntensity = 0.04 + state.room*0.4;
  renderer.toneMappingExposure = 1.0 + state.room*0.22;

  gradePass.uniforms.uTime.value += rawDt;
  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
