<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EMBER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#eee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}canvas{display:block}#ui{position:fixed;z-index:3;left:28px;top:50%;transform:translateY(-50%);width:218px;padding:18px 16px 15px;border:1px solid #ffffff18;border-radius:14px;background:linear-gradient(145deg,#17191ccc,#101116b8);backdrop-filter:blur(18px);box-shadow:0 18px 55px #0007}h1{font-size:13px;letter-spacing:.3em;font-weight:600;margin:0 0 18px;color:#f3e6d3}label{font-size:10px;color:#9fa0a5;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin:15px 0 9px}.switchrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;color:#ddd}.toggle{width:36px;height:20px;border:0;border-radius:20px;background:#48484a;padding:3px;cursor:pointer;transition:.3s}.toggle:after{content:'';display:block;width:14px;height:14px;border-radius:50%;background:#eee;transition:.3s}.toggle.on{background:#da723f}.toggle.on:after{transform:translateX(16px)}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{height:27px;border-radius:7px;border:1px solid #ffffff25;cursor:pointer;position:relative}.swatch.active:after{content:'';position:absolute;inset:-3px;border:1px solid #ffffffaa;border-radius:9px}input[type=range]{width:100%;height:2px;accent-color:#e68d55;cursor:pointer}.hint{font-size:9px;color:#707178;letter-spacing:.08em;margin-top:17px}.badge{position:fixed;bottom:24px;right:28px;color:#a4a0a0a0;font-size:9px;letter-spacing:.22em}
</style>
</head>
<body>
<aside id="ui"><h1>EMBER</h1><div class="switchrow"><span>POWER</span><button id="power" class="toggle on" aria-label="Power"></button></div><label>WAX / LIQUID</label><div class="colors"><button class="swatch active" data-i="0" style="background:linear-gradient(135deg,#e43b22 48%,#d9a749 50%)" aria-label="Classic"></button><button class="swatch" data-i="1" style="background:linear-gradient(135deg,#37d5ca 48%,#183f74 50%)" aria-label="Lagoon"></button><button class="swatch" data-i="2" style="background:linear-gradient(135deg,#c377ff 48%,#342057 50%)" aria-label="Violet"></button><button class="swatch" data-i="3" style="background:linear-gradient(135deg,#ffd45a 48%,#456443 50%)" aria-label="Citrine"></button></div><label>HEAT <span id="heatval">62%</span></label><input id="heat" type="range" min="20" max="100" value="62"><label>WAX AMOUNT <span id="amtval">58%</span></label><input id="amount" type="range" min="20" max="100" value="58"><div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div></aside><div class="badge">A STUDY IN WARMTH</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/OutputPass.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b10);scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,50);camera.position.set(3.35,2.45,5.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.55,0);controls.enableDamping=true;controls.minDistance=3.7;controls.maxDistance=9;controls.maxPolarAngle=Math.PI*.82;
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.42,.65,.82));composer.addPass(new OutputPass());
const mat=(color,metalness=0,roughness=.4)=>new THREE.MeshStandardMaterial({color,metalness,roughness,envMapIntensity:1.3});
// Room and walnut tabletop
const wall=new THREE.Mesh(new THREE.PlaneGeometry(20,12),mat(0x17191f,0,.95));wall.position.set(0,4,-2.7);scene.add(wall);
const table=new THREE.Mesh(new THREE.BoxGeometry(12,.22,8),new THREE.MeshStandardMaterial({color:0x34251e,roughness:.32,metalness:.08}));table.position.y=-.12;scene.add(table);
const woodCanvas=document.createElement('canvas');woodCanvas.width=512;woodCanvas.height=512;const cx=woodCanvas.getContext('2d');cx.fillStyle='#493126';cx.fillRect(0,0,512,512);for(let i=0;i<95;i++){cx.strokeStyle=`rgba(${i%3?105:190},${i%3?65:127},${i%3?42:86},${Math.random()*.17})`;cx.lineWidth=Math.random()*4+1;cx.beginPath();let y=Math.random()*512;cx.moveTo(0,y);cx.bezierCurveTo(140,y-20,300,y+25,512,y+Math.random()*20-10);cx.stroke()}const tex=new THREE.CanvasTexture(woodCanvas);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(3,2);table.material.map=tex;
// Lamp profile, built around a 2.75 unit tall vessel
const chrome=new THREE.MeshStandardMaterial({color:0xb9bbc0,metalness:.94,roughness:.2,envMapIntensity:1.8});const darkChrome=new THREE.MeshStandardMaterial({color:0x55575d,metalness:.92,roughness:.27});
function lathe(profile,material,segments=96){const g=new THREE.LatheGeometry(profile.map(p=>new THREE.Vector2(p[0],p[1])),segments);const m=new THREE.Mesh(g,material);scene.add(m);return m}
lathe([[0,.04],[.34,.04],[.42,.07],[.42,.12],[.35,.17],[.27,.31],[.25,.42],[.25,.47],[0,.47]],chrome);
lathe([[0,2.76],[.29,2.76],[.31,2.8],[.31,2.9],[.28,2.94],[0,2.94]],chrome);
lathe([[.25,.43],[.29,.5],[.34,.68],[.39,1.02],[.43,1.46],[.445,1.88],[.43,2.26],[.39,2.56],[.34,2.77],[.30,2.79]],new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:.04,roughness:.055,transmission:.94,thickness:.12,ior:1.46,transparent:true,opacity:.18,side:THREE.DoubleSide,envMapIntensity:1.2}));
// Inner tinted liquid surface
const liquidMat=new THREE.MeshPhysicalMaterial({color:0xd5a548,roughness:.12,metalness:.02,transmission:.23,thickness:.8,transparent:true,opacity:.27,ior:1.34,side:THREE.DoubleSide});
lathe([[.24,.51],[.285,.56],[.33,.72],[.38,1.05],[.414,1.46],[.426,1.88],[.414,2.24],[.377,2.53],[.326,2.71],[.29,2.73]],liquidMat,64);
// Detailed bulb, reflector and switch
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,32,24),new THREE.MeshBasicMaterial({color:0xffb849}));bulb.position.set(0,.43,0);scene.add(bulb);
const reflect=lathe([[.05,.35],[.18,.36],[.22,.41],[.17,.48],[.05,.46],[0,.46]],darkChrome,64);
const switchMesh=new THREE.Mesh(new THREE.SphereGeometry(.055,20,16),mat(0x28292c,.55,.25));switchMesh.position.set(.38,.115,.18);scene.add(switchMesh);
// Cord, curved naturally across the table and off frame
const cordPts=[new THREE.Vector3(.1,.08,.35),new THREE.Vector3(.32,.055,.47),new THREE.Vector3(.62,.035,.53),new THREE.Vector3(.95,.028,.48),new THREE.Vector3(1.3,.025,.58),new THREE.Vector3(1.65,.02,.79),new THREE.Vector3(2.05,.02,1.08)];const cord=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cordPts),64,.023,10,false),new THREE.MeshStandardMaterial({color:0x171719,roughness:.5}));scene.add(cord);
// Volumetric implicit wax. Smooth-min metaballs produce a single continuous surface.
const N=14;const positions=new Float32Array(N*4);for(let i=0;i<N;i++){positions[i*4]=0;positions[i*4+1]=.62+i*.12;positions[i*4+2]=0;positions[i*4+3]=.12}
const waxMat=new THREE.ShaderMaterial({transparent:true,depthWrite:true,side:THREE.FrontSide,uniforms:{uBlobs:{value:positions},uWax:{value:new THREE.Color('#db351d')},uTime:{value:0},uAlpha:{value:1}},vertexShader:`varying vec3 vLocal;void main(){vLocal=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`precision highp float;varying vec3 vLocal;uniform vec4 uBlobs[14];uniform vec3 uWax;uniform float uTime;uniform float uAlpha;
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k*.25;}
float field(vec3 p){float d=10.;for(int i=0;i<14;i++){vec4 b=uBlobs[i];vec3 q=p-b.xyz;float r=b.w;float ell=length(vec3(q.x,q.y*.82,q.z))-r;d=smin(d,ell,.105);}return d;}
vec3 normalAt(vec3 p){vec2 e=vec2(.003,0.);return normalize(vec3(field(p+e.xyy)-field(p-e.xyy),field(p+e.yxy)-field(p-e.yxy),field(p+e.yyx)-field(p-e.yyx)));}
void main(){vec3 ro=vLocal;vec3 rd=normalize(vLocal-vec3(0.,1.62,4.2));float t=0.;bool hit=false;vec3 p;for(int i=0;i<72;i++){p=ro+rd*t;if(p.y<.52||p.y>2.73||length(p.xz)> .425)break;float d=field(p);if(d<.003){hit=true;break;}t+=max(d*.62,.006);if(t>8.)break;}if(!hit)discard;vec3 n=normalAt(p);vec3 L=normalize(vec3(-.3,.45,1.));float nd=max(dot(n,L),0.);float fres=pow(1.-max(dot(n,-rd),0.),3.);float thickness=clamp((.16-field(p+n*.08))/.16,.15,1.);vec3 c=mix(uWax*1.35,uWax*.47,thickness);c+=uWax*pow(max(dot(reflect(-L,n),-rd),0.),24.)*.5;c+=uWax*(.24+nd*.3);float a=.77+fres*.2;gl_FragColor=vec4(c,a*uAlpha);}`});
const waxBox=new THREE.Mesh(new THREE.BoxGeometry(.84,2.22,.84),waxMat);waxBox.position.set(0,1.62,0);scene.add(waxBox);
// Lighting: warm practical glow spills across the wood and room.
const ambient=new THREE.AmbientLight(0x64708d,.13);scene.add(ambient);const key=new THREE.PointLight(0xffa64c,30,5,2);key.position.set(0,.8,.15);scene.add(key);const fill=new THREE.PointLight(0x384b82,8,7,2);fill.position.set(-3,2.5,1.5);scene.add(fill);const rim=new THREE.PointLight(0xc67a45,12,6,2);rim.position.set(2.4,2,-1.7);scene.add(rim);
// A couple quiet room props for scale and reflected glints.
const book=new THREE.Mesh(new THREE.BoxGeometry(.82,.12,.58),mat(0x25262b,0,.8));book.position.set(-1.12,.04,-.08);scene.add(book);const book2=new THREE.Mesh(new THREE.BoxGeometry(.76,.1,.54),mat(0x49352d,0,.72));book2.position.set(-1.08,.15,-.08);book2.rotation.y=-.08;scene.add(book2);
const palettes=[{wax:'#e63d24',liquid:'#d9aa52',light:0xff9d43},{wax:'#37dfce',liquid:'#28558a',light:0x42d9cf},{wax:'#c27aff',liquid:'#503678',light:0xb47aff},{wax:'#ffd44e',liquid:'#66764c',light:0xffd15b}];let power=true,heat=.62,amount=.58,palette=0,time=0,acc=0;const fixed=1/60;let heatTemp=0;
const powerBtn=document.querySelector('#power');powerBtn.onclick=()=>{power=!power;powerBtn.classList.toggle('on',power)};document.querySelector('#heat').oninput=e=>{heat=+e.target.value/100;document.querySelector('#heatval').textContent=e.target.value+'%'};document.querySelector('#amount').oninput=e=>{amount=+e.target.value/100;document.querySelector('#amtval').textContent=e.target.value+'%'};document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelector('.swatch.active')?.classList.remove('active');b.classList.add('active');palette=+b.dataset.i;const p=palettes[palette];waxMat.uniforms.uWax.value.set(p.wax);liquidMat.color.set(p.liquid);key.color.set(p.light)});
function step(dt){time+=dt;heatTemp+=( (power?heat:0)-heatTemp)*dt*(power?.14:.22);const warm=power?Math.max(0,(heatTemp-.23)/.77):0;for(let i=0;i<N;i++){const phase=time*(.48+(.035*i))*Math.max(.08,warm)+i*1.83;let y=.61+((phase%(2.6+(.12*Math.sin(i*3)))));if(!power)y=.57+Math.min(1,(y-.57)*warm);const rise=y<2.15?1:-.44;const x=Math.sin(phase*1.31+i*4.7)*(.07+.07*Math.sin(i*8.3));const z=Math.cos(phase*.79+i*2.1)*(.07+.045*Math.cos(i*3.7));const r=(.085+.09*(.5+.5*Math.sin(i*7.91+time*.31)))*(.35+amount*1.1)*(i%5===0?1.4:1);positions[i*4]=x;positions[i*4+1]=Math.min(2.63,Math.max(.59,y));positions[i*4+2]=z;positions[i*4+3]=r*(y>2.22?.82:1)*(rise<0?.92:1)}waxMat.uniforms.uBlobs.value=positions;waxMat.uniforms.uTime.value=time;const glow=power?Math.pow(heatTemp,.8):0;key.intensity=30*glow;bulb.material.color.setRGB(1,.48+.25*glow,.12+.2*glow);bulb.scale.setScalar(.78+.22*glow);waxMat.uniforms.uAlpha.value=.25+.75*warm;}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const elapsed=Math.min(.08,(now-last)/1000);last=now;acc+=elapsed;let n=0;while(acc>=fixed&&n<5){step(fixed);acc-=fixed;n++}controls.update();composer.render()}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script></body></html>
