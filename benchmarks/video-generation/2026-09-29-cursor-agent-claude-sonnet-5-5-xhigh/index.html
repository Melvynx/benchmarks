<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-sonnet-5-5</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  video {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: contain;
  }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
    video { width: min(100vw, calc(100dvh * 16 / 9)); }
  }
</style>
</head>
<body>
<video src="video.mp4" controls playsinline preload="auto"></video>
</body>
</html>
