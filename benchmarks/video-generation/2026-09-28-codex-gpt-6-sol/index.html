<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT-6</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #08090a; }
    body { display: grid; place-items: center; min-height: 100dvh; overflow: hidden; }
    video {
      display: block;
      width: min(100vw, 177.7778dvh);
      height: min(100dvh, 56.25vw);
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video src="video.mp4" controls playsinline preload="metadata" aria-label="Lumail launch video"></video>
</body>
</html>
