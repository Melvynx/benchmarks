<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B0B0C}
:root{--y:#FFE01B;--ink:#F7F8F8;--mute:#8b949e;--bg:#0B0B0C;--card:#141416;--bd:#26262a}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.scene{position:absolute;inset:0;opacity:0}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.mute{color:var(--mute)}
.mask{overflow:hidden;padding:.06em 0 .12em}
.ln{display:block;white-space:nowrap;transform:translateY(110%)}
.mk{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em 0 .1em}
.mk>.in{display:inline-block;transform:translateY(110%)}
.tile{background:var(--y);border-radius:22%;display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:50%;height:auto;display:block}
.grid{position:absolute;left:-240px;top:-240px;width:2400px;height:1560px;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:120px 120px}
.glow{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(900px 600px at 70% 40%,rgba(255,224,27,.10),transparent 70%)}
.wipe{position:absolute;inset:0;background:var(--y);transform:translateX(-100%)}
.card{position:absolute;background:var(--card);border:1px solid var(--bd);border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.cap{font-size:26px;letter-spacing:.14em;color:var(--y);margin-bottom:34px}
.dot{width:14px;height:14px;border-radius:50%;background:#2a2a2e;display:block}
.bl{height:18px;border-radius:9px;background:#2a2a30;transform-origin:left;transform:scaleX(0)}
.btn{background:var(--y);color:#0B0B0C;font-weight:600;border-radius:14px;padding:18px 34px;font-size:30px;display:inline-block;white-space:nowrap}
.toast{color:var(--y)}
.chip{border:1px solid var(--bd);border-radius:999px;padding:14px 26px;font-size:24px;color:var(--ink);background:#141416;opacity:0;display:inline-block}
.nd{position:absolute;top:520px;width:300px;height:150px;border-radius:22px;padding:26px 28px;background:#1b1b1f;border:1px solid var(--bd);opacity:0}
.nd .k{font-size:22px;letter-spacing:.12em;color:var(--mute)}
.nd .t{font-size:34px;font-weight:600;letter-spacing:-1px;margin-top:14px;white-space:nowrap}
.nd.hi{background:var(--y);color:#0B0B0C;border-color:var(--y)}
.nd.hi .k{color:#0B0B0C;opacity:.7}
.pl{width:400px;height:640px;padding:40px 36px}
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="grid"></div>
  <div class="glow"></div>
  <div id="scenes"></div>

  <div id="corner" class="abs" style="left:90px;top:960px;display:flex;align-items:center;gap:16px;opacity:0">
    <div class="tile" style="width:44px;height:44px;border-radius:12px"><svg viewBox="26 18 39 56"><path d="M37 57C37 59.8284 37.0002 61.2424 37.8789 62.1211C38.7576 62.9998 40.1716 63 43 63H65V74H32C29.1716 74 27.7576 73.9998 26.8789 73.1211C26.0002 72.2424 26 70.8284 26 68V18H37V57Z" fill="#0B0B0C"/></svg></div>
    <span style="font-size:32px;font-weight:600;letter-spacing:-0.5px">Lumail</span>
  </div>

  <div class="wipe" id="w0"></div>
  <div class="wipe" id="w1"></div>
  <div class="wipe" id="w2"></div>
  <div class="wipe" id="w3"></div>
  <div class="wipe" id="w4"></div>
  <div class="wipe" id="w5"></div>
  <div class="wipe" id="w6"></div>
  <div class="wipe" id="w7"></div>
</div>

<script>
const LOGO='<svg viewBox="26 18 39 56"><path d="M37 57C37 59.8284 37.0002 61.2424 37.8789 62.1211C38.7576 62.9998 40.1716 63 43 63H65V74H32C29.1716 74 27.7576 73.9998 26.8789 73.1211C26.0002 72.2424 26 70.8284 26 68V18H37V57Z" fill="#0B0B0C"/></svg>';
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eback=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const typed=(s,p)=>s.slice(0,Math.round(s.length*p));
const up=(id,t,a,d=0.7,dist=110)=>{$(id).style.transform=`translateY(${(1-eo(P(t,a,a+d)))*dist}%)`;};

const SCENES=[[0,4.6],[4.6,9.6],[9.6,14.6],[14.6,19.6],[19.6,25.1],[25.1,31.1],[31.1,36.1],[36.1,41.1],[41.1,45.01]];
const WIPES=[4.6,9.6,14.6,19.6,25.1,31.1,36.1,41.1];

const CARDS3=[
  ['Campaigns','Visual editor, AI drafting and scheduled sends.'],
  ['Sequences','Drip journeys that run on autopilot.'],
  ['Transactional','API sends for receipts, resets and alerts.'],
  ['Workflows','Branching automations, unlimited on every plan.']
];
const PLANS=[
  ['FREE','$0','3,000 emails / month','Sending pauses at the limit',1],
  ['CREATOR','$20','40,000 emails included','then $0.70 / 1,000',3],
  ['PRO','$60','100,000 emails included','then $0.50 / 1,000',10],
  ['BUSINESS','$200','400,000 emails included','then $0.40 / 1,000',100]
];

const HTML=[];
// 0 — intro logo
HTML[0]=`
<div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="display:flex;align-items:center;gap:48px">
    <div id="m0" class="tile" style="width:240px;height:240px;border-radius:54px">${LOGO}</div>
    <div id="w0t" style="font-size:220px;font-weight:600;letter-spacing:-10px;line-height:1">${[...'Lumail'].map(c=>`<span class="mk"><span class="in">${c}</span></span>`).join('')}</div>
  </div>
  <div id="s0" class="serif mute" style="font-size:68px;margin-top:56px;opacity:0">AI-native email, on autopilot.</div>
</div>`;

// 1 — headline
HTML[1]=`
<div id="cap1" class="abs cap mono" style="left:150px;top:300px;opacity:0">NEWSLETTERS · AUTOMATIONS · TRANSACTIONAL</div>
<div class="abs" style="left:150px;top:360px">
  <div class="mask"><span class="ln" id="l1a" style="font-size:140px;font-weight:600;letter-spacing:-6px;line-height:1.02">Email for people</span></div>
  <div class="mask"><span class="ln" id="l1b" style="font-size:140px;font-weight:600;letter-spacing:-6px;line-height:1.02">who write, ship</span></div>
  <div class="mask"><span class="ln" id="l1c" style="font-size:140px;font-weight:600;letter-spacing:-6px;line-height:1.02">and <span class="serif" style="color:var(--y);font-size:200px;letter-spacing:-2px">sell.</span></span></div>
</div>
<div id="deco1" class="abs tile" style="left:1400px;top:300px;width:400px;height:400px;border-radius:96px;opacity:0">${LOGO}</div>`;

// 2 — composer
HTML[2]=`
<div class="abs" style="left:150px;top:300px">
  <div class="cap mono">WRITE → SHIP → SELL</div>
  <div class="mask"><span class="ln" id="l2a" style="font-size:118px;font-weight:600;letter-spacing:-5px;line-height:1.04">Write it once.</span></div>
  <div class="mask"><span class="ln" id="l2b" style="font-size:118px;font-weight:600;letter-spacing:-5px;line-height:1.04">Ship it <span class="serif" style="color:var(--y);font-size:150px">today.</span></span></div>
  <div id="l2c" class="mute" style="font-size:36px;margin-top:40px;max-width:640px;line-height:1.4;opacity:0">Visual editor with AI drafting, subscriber lists and scheduled sends.</div>
</div>
<div id="comp" class="card" style="left:1010px;top:250px;width:760px;height:600px;opacity:0;overflow:hidden">
  <div style="display:flex;gap:10px;align-items:center;padding:26px 30px;border-bottom:1px solid var(--bd)">
    <i class="dot"></i><i class="dot"></i><i class="dot"></i>
    <span class="mono mute" style="margin-left:18px;font-size:24px">Campaign / Launch week</span>
  </div>
  <div style="padding:30px 36px">
    <div class="mono mute" style="font-size:24px;margin-bottom:22px">TO &nbsp;&nbsp;&nbsp;12,480 subscribers</div>
    <div class="mono mute" style="font-size:24px;margin-bottom:10px">SUBJECT</div>
    <div id="subj" style="font-size:52px;font-weight:600;min-height:66px"></div>
    <div style="margin-top:34px;display:flex;flex-direction:column;gap:20px">
      <div class="bl" id="b1" style="width:92%"></div>
      <div class="bl" id="b2" style="width:78%"></div>
      <div class="bl" id="b3" style="width:85%"></div>
      <div class="bl" id="b4" style="width:40%"></div>
    </div>
  </div>
  <div style="position:absolute;left:36px;right:36px;bottom:34px;display:flex;justify-content:space-between;align-items:center">
    <span id="toast" class="toast mono" style="font-size:28px;opacity:0">✓ Sent · 12,480 delivered</span>
    <span id="btn" class="btn">Send campaign</span>
  </div>
</div>`;

// 3 — features
HTML[3]=`
<div class="abs" style="left:0;right:0;top:160px;text-align:center">
  <div class="cap mono">ONE DOMAIN · EVERY KIND OF EMAIL</div>
  <div class="mask"><span class="ln" id="l3a" style="display:block;font-size:104px;font-weight:600;letter-spacing:-4px">One domain. <span class="serif" style="color:var(--y);font-size:124px">Every</span> kind of email.</span></div>
</div>
<div class="abs" style="left:75px;top:470px;display:flex;gap:30px">
  ${CARDS3.map((c,i)=>`<div class="card fc" style="position:relative;width:420px;height:440px;padding:40px;opacity:0"><div class="mono mute" style="font-size:26px">0${i+1}</div><div style="font-size:64px;font-weight:600;letter-spacing:-2px;margin-top:150px">${c[0]}</div><div class="mute" style="font-size:30px;line-height:1.4;margin-top:18px">${c[1]}</div></div>`).join('')}
</div>`;

// 4 — workflow
HTML[4]=`
<div class="abs" style="left:120px;top:150px">
  <div class="cap mono">VISUAL WORKFLOWS</div>
  <div class="mask"><span class="ln" id="l4a" style="font-size:120px;font-weight:600;letter-spacing:-5px">Branching journeys.</span></div>
  <div id="l4b" class="serif mute" style="font-size:52px;margin-top:20px;opacity:0">Zero enterprise bloat.</div>
</div>
<svg class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
  <path id="flow" d="M420 595 H1440" fill="none" stroke="#FFE01B" stroke-width="6" stroke-linecap="round" stroke-dasharray="1020" stroke-dashoffset="1020"/>
</svg>
<div class="nd" style="left:120px"><div class="k mono">TRIGGER</div><div class="t">New subscriber</div></div>
<div class="nd" style="left:560px"><div class="k mono">ACTION</div><div class="t">Tag: creator</div></div>
<div class="nd" style="left:1000px"><div class="k mono">DELAY</div><div class="t">Wait 2 days</div></div>
<div class="nd hi" style="left:1440px"><div class="k mono">EMAIL</div><div class="t">Send welcome</div></div>
<svg class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
  <circle id="dot" r="14" fill="#FFE01B" cx="420" cy="595" opacity="0"/>
</svg>`;

// 5 — agents
HTML[5]=`
<div class="abs" style="left:150px;top:200px;width:800px">
  <div class="cap mono">AGENT-READY · MCP · REST · CLI · SDK</div>
  <div class="mask"><span class="ln" id="l5a" style="font-size:100px;font-weight:600;letter-spacing:-4px;line-height:1.05">Built for humans</span></div>
  <div class="mask"><span class="ln" id="l5b" style="font-size:100px;font-weight:600;letter-spacing:-4px;line-height:1.05">and <span class="serif" style="color:var(--y);font-size:120px">agents.</span></span></div>
  <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:60px;width:760px">
    ${['MCP server','REST API','TypeScript SDK','CLI','OAuth 2.1'].map(x=>`<span class="chip mono">${x}</span>`).join('')}
  </div>
</div>
<div id="term" class="card" style="left:1020px;top:240px;width:760px;height:600px;opacity:0;overflow:hidden">
  <div style="display:flex;gap:10px;align-items:center;padding:26px 30px;border-bottom:1px solid var(--bd)"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="mono mute" style="margin-left:16px;font-size:24px">lumail — zsh</span></div>
  <div class="mono" style="padding:36px;font-size:30px;line-height:1.9">
    <div id="t5a"></div><div id="t5b" style="color:var(--y)"></div><div id="t5c" style="margin-top:14px"></div><div id="t5d" style="color:var(--y)"></div>
  </div>
</div>`;

// 6 — pricing
HTML[6]=`
<div class="abs" style="left:0;right:0;top:170px;text-align:center">
  <div class="mask"><span class="ln" id="l6a" style="display:block;font-size:150px;font-weight:600;letter-spacing:-6px">Pay for emails sent.</span></div>
  <div class="mask"><span class="ln serif mute" id="l6b" style="display:block;font-size:96px;margin-top:10px">Never for subscribers stored.</span></div>
</div>
<div class="abs" style="left:0;right:0;top:600px;display:flex;justify-content:center;gap:220px;text-align:center">
  <div id="c6a" style="opacity:0"><div id="n6" style="font-size:200px;font-weight:600;letter-spacing:-8px;line-height:1">0</div><div class="mono mute" style="font-size:28px;margin-top:20px;letter-spacing:.08em">CONTACTS IMPORTED ON FREE</div></div>
  <div id="c6b" style="opacity:0"><div style="font-size:200px;font-weight:600;letter-spacing:-8px;line-height:1;color:var(--y)">$0</div><div class="mono mute" style="font-size:28px;margin-top:20px;letter-spacing:.08em">BILLED FOR SUBSCRIBERS</div></div>
</div>`;

// 7 — plans
HTML[7]=`
<div class="abs" style="left:0;right:0;top:130px;text-align:center">
  <div class="mask"><span class="ln" id="l7a" style="display:block;font-size:96px;font-weight:600;letter-spacing:-4px">Simple, volume-based pricing.</span></div>
</div>
<div class="abs" style="left:124px;top:290px;display:flex;gap:24px">
  ${PLANS.map((p,i)=>`
  <div class="card pl" style="position:relative;opacity:0;${i===1?'background:var(--y);color:#0B0B0C;border-color:var(--y)':''}">
    <div class="mono" style="font-size:26px;letter-spacing:.12em;opacity:.7">${p[0]}</div>
    <div style="font-size:104px;font-weight:600;letter-spacing:-5px;margin-top:20px;line-height:1;white-space:nowrap">${p[1]}<span style="font-size:30px;font-weight:400;opacity:.7;letter-spacing:0"> /mo</span></div>
    <div style="font-size:26px;font-weight:600;margin-top:36px;white-space:nowrap">${p[2]}</div>
    <div style="font-size:26px;margin-top:10px;opacity:.7">${p[3]}</div>
    <div style="margin-top:50px;font-size:28px;line-height:1.9;opacity:.85">${p[4]} sending domain${p[4]>1?'s':''}<br>Workflows unlimited</div>
  </div>`).join('')}
</div>`;

// 8 — outro
HTML[8]=`
<div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div id="lock8" style="display:flex;align-items:center;gap:56px;opacity:0">
    <div class="tile" style="width:280px;height:280px;border-radius:64px">${LOGO}</div>
    <div style="font-size:250px;font-weight:600;letter-spacing:-12px;line-height:1">Lumail</div>
  </div>
  <div id="tag8" class="serif" style="font-size:64px;margin-top:70px;opacity:0">Run your newsletter on autopilot with AI agents.</div>
  <div id="url8" class="mono" style="font-size:36px;margin-top:60px;color:var(--y);opacity:0;letter-spacing:.06em">lumail.io</div>
</div>`;

// build
const host=$('#scenes');
const SC=SCENES.map(([a,b],i)=>{
  const d=document.createElement('div');
  d.className='scene';
  d.innerHTML=HTML[i];
  host.appendChild(d);
  return [a,b,d];
});

function s0(t){
  const p=P(t,0,0.9);
  const m=$('#m0'); m.style.transform=`scale(${eback(p)}) rotate(${(1-eo(P(t,0,1.3)))*-20}deg)`;
  [...$$('#w0t .in')].forEach((el,i)=>{el.style.transform=`translateY(${(1-eo(P(t,0.9+i*0.08,1.6+i*0.08)))*110}%)`;});
  const s=$('#s0'); const q=eo(P(t,2.5,3.1)); s.style.opacity=q; s.style.transform=`translateY(${(1-q)*30}px)`;
}
function s1(t){
  $('#cap1').style.opacity=eo(P(t,4.9,5.4));
  up('#l1a',t,5.0); up('#l1b',t,5.18); up('#l1c',t,5.36);
  const p=eo(P(t,4.6,5.6)); const d=$('#deco1');
  d.style.opacity=p*0.95; d.style.transform=`rotate(${(t-4.6)*14}deg) scale(${0.8+0.2*p})`;
}
function s2(t){
  up('#l2a',t,9.8); up('#l2b',t,10.0);
  $('#l2c').style.opacity=eo(P(t,11.2,11.9));
  const c=$('#comp'); const p=eo(P(t,9.9,10.8)); c.style.opacity=p; c.style.transform=`translateY(${(1-p)*80}px)`;
  $('#subj').textContent=typed('Lumail 1.0 is live.',P(t,10.9,11.9));
  ['#b1','#b2','#b3','#b4'].forEach((id,i)=>{$(id).style.transform=`scaleX(${eo(P(t,12.0+i*0.15,12.6+i*0.15))})`;});
  const press=(t>=13&&t<13.25)?Math.sin((t-13)/0.25*Math.PI):0;
  $('#btn').style.transform=`scale(${1-0.06*press})`;
  $('#toast').style.opacity=eo(P(t,13.3,13.8));
}
function s3(t){
  up('#l3a',t,14.8);
  [...$$('.fc')].forEach((el,i)=>{const p=eo(P(t,15.0+i*0.14,15.8+i*0.14)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*120}px)`;});
}
function s4(t){
  up('#l4a',t,19.9);
  $('#l4b').style.opacity=eo(P(t,20.4,21.0));
  [...$$('.nd')].forEach((el,i)=>{const p=eo(P(t,20.2+i*0.5,20.9+i*0.5)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*40}px)`;});
  const f=$('#flow'); const L=1020;
  f.style.strokeDashoffset=L*(1-eo(P(t,20.6,22.6)));
  const dot=$('#dot'); const pp=P(t,22.2,24.6);
  const pt=f.getPointAtLength(L*pp);
  dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
  dot.setAttribute('opacity',(t>=22.2&&t<24.6)?1:0);
}
function s5(t){
  up('#l5a',t,25.3); up('#l5b',t,25.5);
  [...$$('.chip')].forEach((el,i)=>{const p=eo(P(t,26.4+i*0.1,27.0+i*0.1)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*20}px)`;});
  const term=$('#term'); const p=eo(P(t,25.2,25.9)); term.style.opacity=p; term.style.transform=`translateY(${(1-p)*60}px)`;
  $('#t5a').textContent='$ '+typed('lumail campaigns create --name "Launch week"',P(t,25.9,27.2));
  $('#t5b').textContent=t>=27.4?'✓ Draft ready from your brief':'';
  $('#t5c').textContent='$ '+typed('lumail campaigns schedule launch --at 09:00',P(t,28.0,29.4));
  $('#t5d').textContent=t>=29.6?'✓ Scheduled · 12,480 recipients':'';
}
function s6(t){
  up('#l6a',t,31.2); up('#l6b',t,31.5);
  [['#c6a',32.4],['#c6b',32.7]].forEach(([id,a])=>{const p=eo(P(t,a,a+0.6)); const el=$(id); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*40}px)`;});
  $('#n6').textContent=fmt(50000*eo(P(t,32.6,34.6)));
}
function s7(t){
  up('#l7a',t,36.2);
  [...$$('.pl')].forEach((el,i)=>{
    const p=eo(P(t,36.6+i*0.12,37.4+i*0.12));
    const hi=i===1?1+0.035*eo(P(t,38.2,38.8)):1;
    el.style.opacity=p; el.style.transform=`translateY(${(1-p)*120}px) scale(${hi})`;
  });
}
function s8(t){
  const p=eo(P(t,41.3,42.0)); const l=$('#lock8'); l.style.opacity=p; l.style.transform=`scale(${0.92+0.08*p})`;
  $('#tag8').style.opacity=eo(P(t,42.2,42.9));
  $('#url8').style.opacity=eo(P(t,43.0,43.6));
}

window.update=function(t){
  const o=(t*26)%120;
  $('#grid').style.transform=`translate(${o}px,${o}px)`;
  SC.forEach(([a,b,el])=>{el.style.opacity=(t>=a&&t<b)?1:0;});
  WIPES.forEach((T,i)=>{
    const x=t<T?-100+100*eio(P(t,T-0.35,T)):100*eio(P(t,T,T+0.35));
    $('#w'+i).style.transform=`translateX(${x}%)`;
  });
  $('#corner').style.opacity=P(t,4.6,4.9)*(1-P(t,40.8,41.1));
  s0(t);s1(t);s2(t);s3(t);s4(t);s5(t);s6(t);s7(t);s8(t);
};
window.update(0);
</script>
