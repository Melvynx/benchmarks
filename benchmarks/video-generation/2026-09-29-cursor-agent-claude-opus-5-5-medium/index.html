<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Opus 5.5</title>
  <style>
    html, body { margin: 0; height: 100%; background: #08090a; }
    body { display: grid; place-items: center; overflow: hidden; }
    video {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video src="video.mp4" controls playsinline preload="auto" aria-label="Lumail launch video"></video>
</body>
</html>
