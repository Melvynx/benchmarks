<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumail launch motion</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/geist/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/plus-jakarta-sans/index.css">
<link rel="stylesheet" href="/node_modules/@fontsource/instrument-serif/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/instrument-serif/400-italic.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08090a; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Geist Variable', Geist, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }
  .mono { font-family: 'Geist Mono Variable', 'Geist Mono', monospace; }
  .brand { font-family: 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', sans-serif; }
  .serif { font-family: 'Instrument Serif', serif; }
  .h { font-weight: 500; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .accent { color: var(--accent); }
  .mask { overflow: hidden; }
  .wd { display: inline-block; }
  .chip {
    display: inline-flex; align-items: center; gap: .16em; vertical-align: baseline;
    padding: .02em .24em .05em; border-radius: .26em; white-space: nowrap;
    background: var(--card); border: 1.5px solid var(--line); color: var(--accent);
    box-shadow: 0 1px 2px rgba(26,22,20,.05), 0 6px 18px -10px rgba(26,22,20,.22);
  }
  .chip svg { width: .72em; height: .72em; fill: currentColor; flex: none; }
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 28px;
    box-shadow: 0 1px 2px rgba(26,22,20,.05), 0 22px 44px -26px rgba(26,22,20,.35);
  }
  .tile {
    display: flex; align-items: center; justify-content: center; flex: none;
    background: linear-gradient(180deg, #ff3b1f 0%, #f23a1e 100%); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -12px rgba(255,51,0,.7);
  }
  .tile svg { fill: currentColor; }
  .ch-wrap { display: inline-block; overflow: hidden; vertical-align: top; padding: .1em 0; margin: -.1em 0; }
  .ch { display: block; line-height: 1.25; }
  #hatchL, #hatchR {
    position: absolute; top: 0; width: 96px; height: 1080px;
    background-image: repeating-linear-gradient(-45deg, var(--line) 0 1.5px, transparent 1.5px 16px);
  }
  #hatchL { left: 0; } #hatchR { right: 0; }
  #corner { position: absolute; left: 120px; top: 60px; display: flex; align-items: center; gap: 14px; opacity: 0; }
  #corner .wm { font-size: 38px; font-weight: 600; letter-spacing: -0.034em; line-height: 1; }
  #caption {
    position: absolute; left: 120px; top: 990px; font-size: 20px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  #progress { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--accent); }
  #wipe, #wipe2 {
    position: absolute; left: -400px; top: -200px; width: 2800px; height: 1480px;
    transform: translateX(-2800px) rotate(-7deg); transform-origin: 50% 50%;
  }
  #wipe { background: var(--accent); z-index: 30; }
  #wipe2 { background: #1a1614; z-index: 29; }
  #grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 40; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .scene { position: absolute; inset: 0; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="hatchL"></div>
  <div id="hatchR"></div>
  <div id="scenes"></div>
  <div id="corner">
    <div class="tile" style="width:52px;height:52px;border-radius:14px"><svg viewBox="0 0 512 512" style="width:34px;height:34px"><path d="M147 97H208V350H366V412H147Z" fill="#fff"/></svg></div>
    <div class="wm brand">Lumail</div>
  </div>
  <div id="caption"></div>
  <div id="progress"></div>
  <div id="wipe"></div>
  <div id="wipe2"></div>
  <div id="grain"></div>
</div>
<script src="/motion/composition.js"></script>
</body>
</html>
