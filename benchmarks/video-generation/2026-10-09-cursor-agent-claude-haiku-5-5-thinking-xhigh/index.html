<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Haiku 5.5</title>
  <style>
    html, body { margin: 0; height: 100%; background: #08090a; overflow: hidden; }
    body { display: grid; place-items: center; }
    video {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #08090a;
    }
  </style>
</head>
<body>
  <video src="video.mp4" controls playsinline preload="auto"></video>
</body>
</html>
