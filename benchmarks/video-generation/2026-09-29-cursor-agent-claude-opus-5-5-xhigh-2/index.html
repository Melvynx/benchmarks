<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  html, body { margin: 0; height: 100%; background: #08090a; }
  body { display: grid; place-items: center; overflow: hidden; }
  video {
    display: block;
    width: min(100vw, 100vh * 16 / 9);
    height: min(100vh, 100vw * 9 / 16);
    width: min(100vw, 100dvh * 16 / 9);
    height: min(100dvh, 100vw * 9 / 16);
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>
<video src="video.mp4" controls playsinline preload="metadata"></video>
</body>
</html>
