<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden; }
  video {
    display: block;
    width: min(100vw, calc(100dvh * 16 / 9));
    aspect-ratio: 16 / 9;
    height: auto;
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>
<video src="video.mp4" controls playsinline preload="auto"></video>
</body>
</html>
