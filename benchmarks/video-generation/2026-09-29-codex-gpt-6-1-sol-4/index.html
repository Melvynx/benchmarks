<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT-6</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #101c2a; }
    body { display: grid; place-items: center; overflow: hidden; }
    video { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); object-fit: contain; }
    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
      video { width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); }
    }
  </style>
</head>
<body>
  <video controls playsinline preload="metadata" aria-label="Lumail launch film">
    <source src="video.mp4" type="video/mp4">
  </video>
</body>
</html>
