<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Sonnet 5.5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='9' ry='12' fill='%233f8cff'/%3E%3Ccircle cx='12.5' cy='14' r='2' fill='white'/%3E%3Ccircle cx='19.5' cy='14' r='2' fill='white'/%3E%3C/svg%3E" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>Claude Sonnet 5.5</h1>
      <div class="transport" role="toolbar" aria-label="Simulation controls">
        <button id="btn-play" class="btn primary" aria-label="Play or pause">Pause</button>
        <button id="btn-step" class="btn" title="Advance one second">Step</button>
        <button id="btn-reset" class="btn" title="Restart with the same seed">Reset</button>
        <button id="btn-random" class="btn" title="New seed and starting mix">Randomize</button>
      </div>
      <div class="speed" role="group" aria-label="Simulation speed" id="speed"></div>
      <div class="clock" id="clock" aria-live="off"></div>
    </header>

    <main class="layout">
      <section class="left">
        <div class="stage" id="stage">
          <canvas id="world" aria-label="Garden world. Drag to rotate, click a blob to inspect it."></canvas>
          <div class="hud">
            <span class="chip fruit"><i></i><b id="n-fruit">0</b> fruit</span>
            <span class="chip blue"><i></i><b id="n-blue">0</b> blue</span>
            <span class="chip red"><i></i><b id="n-red">0</b> red</span>
          </div>
          <div class="cam-hint">drag to rotate &middot; scroll to zoom &middot; click a blob</div>
          <button class="btn small cam-reset" id="btn-view">Reset view</button>
          <div class="toast" id="toast" hidden></div>
          <aside class="inspector" id="inspector" hidden></aside>
        </div>

        <div class="charts">
          <article class="card wide">
            <div class="card-head">
              <h2>Timeline</h2>
              <div class="legend">
                <span class="lg fruit"><i></i>Fruit (right axis)</span>
                <span class="lg blue"><i></i>Blue blobs</span>
                <span class="lg red"><i></i>Red blobs</span>
              </div>
            </div>
            <canvas id="chart-main" class="chart tall"></canvas>
          </article>
          <article class="card">
            <div class="card-head"><h2>Blue vs red</h2><span class="sub">phase plot</span></div>
            <canvas id="chart-phase" class="chart"></canvas>
          </article>
          <article class="card">
            <div class="card-head"><h2>Inherited traits</h2><span class="sub">1.0 = starting value</span></div>
            <canvas id="chart-traits" class="chart"></canvas>
            <div class="legend small">
              <span class="lg blue"><i></i>speed</span>
              <span class="lg blue dash"><i></i>vision</span>
              <span class="lg red"><i></i>speed</span>
              <span class="lg red dash"><i></i>vision</span>
            </div>
          </article>
          <article class="card summary">
            <div class="card-head"><h2>Run summary</h2><span class="mood" id="mood"></span></div>
            <ul id="summary-lines"></ul>
            <dl id="summary-stats"></dl>
          </article>
        </div>
      </section>

      <aside class="panel" id="panel">
        <section class="pgroup">
          <h3>Presets</h3>
          <div class="presets" id="presets"></div>
        </section>
        <div id="sliders"></div>
        <section class="pgroup">
          <h3>Seed &amp; extras</h3>
          <div class="seedrow">
            <label for="seed">Random seed</label>
            <input id="seed" type="number" step="1" />
          </div>
          <label class="toggle">
            <input type="checkbox" id="visitors" />
            <span>Visitors: a lone wanderer or two arrive if a group has been gone for a while</span>
          </label>
        </section>
      </aside>
    </main>
  </body>
</html>
