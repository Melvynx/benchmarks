<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>claude-sonnet-5-5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='11' ry='13' fill='%234a9bff'/%3E%3Ccircle cx='12' cy='14' r='2' fill='%23123'/%3E%3Ccircle cx='20' cy='14' r='2' fill='%23123'/%3E%3C/svg%3E" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1>claude-sonnet-5-5</h1>
        <div class="transport" role="toolbar" aria-label="Simulation controls">
          <button id="btn-play" class="primary" title="Play / pause (space)">Play</button>
          <button id="btn-step" title="Advance one second">Step</button>
          <button id="btn-reset" title="Restart with the same settings">Reset</button>
          <button id="btn-random" title="New seed and shuffled starting numbers">Randomize</button>
          <label class="speed" title="How fast time runs">
            <span>Speed</span>
            <input id="sim-speed" type="range" min="0" max="5" step="1" value="1" />
            <output id="sim-speed-out">1×</output>
          </label>
          <div class="clock" title="Simulated time"><span id="clock">0:00</span></div>
        </div>
        <div class="presets" id="presets" role="group" aria-label="Presets"></div>
      </header>

      <aside class="panel controls" id="controls" aria-label="Tuning controls"></aside>

      <main class="stage">
        <div class="world-wrap">
          <canvas id="world" aria-label="Garden world. Drag to rotate, click a blob to inspect it."></canvas>
          <div class="world-hud">
            <div class="chip"><i class="dot fruit"></i><b id="hud-fruit">0</b> fruit</div>
            <div class="chip"><i class="dot blue"></i><b id="hud-blue">0</b> blue</div>
            <div class="chip"><i class="dot red"></i><b id="hud-red">0</b> red</div>
          </div>
          <div class="world-hint">drag to rotate · scroll to zoom · click a blob</div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <section class="panel chart-card">
          <div class="card-head">
            <h2>Timeline</h2>
            <div class="legend">
              <span class="lg blue"><i></i>Blue blobs <b id="lg-blue">0</b></span>
              <span class="lg red"><i></i>Red blobs <b id="lg-red">0</b></span>
              <span class="lg fruit"><i></i>Fruit (right axis) <b id="lg-fruit">0</b></span>
            </div>
          </div>
          <div class="chart-box"><canvas id="chart-main"></canvas></div>
        </section>
      </main>

      <aside class="side">
        <section class="panel inspector" id="inspector"></section>
        <section class="panel summary" id="summary"></section>
        <section class="panel mini">
          <div class="card-head"><h2>Blue vs red</h2><span class="sub">each trail is one run of time</span></div>
          <div class="chart-box square"><canvas id="chart-phase"></canvas></div>
        </section>
        <section class="panel mini">
          <div class="card-head"><h2>Inherited traits</h2><span class="sub">average vs. the starting value</span></div>
          <div class="chart-box short"><canvas id="chart-traits"></canvas></div>
          <div class="legend small">
            <span class="lg blue"><i></i>blue speed</span>
            <span class="lg blue dashed"><i></i>blue vision</span>
            <span class="lg red"><i></i>red speed</span>
            <span class="lg red dashed"><i></i>red vision</span>
          </div>
        </section>
      </aside>
    </div>
  </body>
</html>
