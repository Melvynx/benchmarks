<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Opus 5.5</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='55' rx='34' ry='40' fill='%233d9bf0'/><circle cx='38' cy='50' r='6' fill='%231b1b2b'/><circle cx='62' cy='50' r='6' fill='%231b1b2b'/></svg>" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 id="title">Claude Opus 5.5</h1>
        <div class="transport" role="toolbar" aria-label="Simulation controls">
          <button id="btn-play" class="btn primary" title="Play / pause (Space)"><span class="ico">▶</span><span class="lbl">Play</span></button>
          <button id="btn-step" class="btn" title="Advance one second (S)">⏭ Step</button>
          <button id="btn-reset" class="btn" title="Rebuild the world with current settings (R)">↺ Reset</button>
          <button id="btn-random" class="btn" title="New seed and gently shuffled settings">🎲 Randomize</button>
          <label class="speed" title="Simulation speed">
            <span>Speed</span>
            <input id="speed" type="range" min="0" max="7" step="1" value="2" />
            <output id="speed-out">1×</output>
          </label>
        </div>
        <div class="presets" id="presets" role="radiogroup" aria-label="Presets"></div>
      </header>

      <main class="layout">
        <section class="world-card card">
          <div class="hud">
            <div class="chip fruit"><i></i><b id="hud-fruit">0</b> ripe fruit</div>
            <div class="chip blue"><i></i><b id="hud-blue">0</b> blue</div>
            <div class="chip red"><i></i><b id="hud-red">0</b> red</div>
            <div class="chip time">⏱ <b id="hud-time">0s</b></div>
          </div>
          <canvas id="world" aria-label="Garden world. Drag to rotate, scroll to zoom, click a blob to inspect."></canvas>
          <div class="world-hint">Drag to spin · Shift-drag / scroll to tilt &amp; zoom · Click a blob</div>
          <div class="drop">
            <button class="mini blue" id="add-blue" title="Drop 5 blue blobs into the garden">+5 blue</button>
            <button class="mini red" id="add-red" title="Drop 3 red blobs into the garden">+3 red</button>
          </div>
          <aside class="inspector" id="inspector" hidden></aside>
        </section>

        <section class="charts">
          <div class="card chart-main">
            <div class="card-head">
              <h2>Garden timeline</h2>
              <div class="legend">
                <span class="lg fruit">ripe fruit <small>(right axis)</small></span>
                <span class="lg blue">blue blobs</span>
                <span class="lg red">red blobs</span>
              </div>
            </div>
            <canvas id="chart-timeline"></canvas>
          </div>
          <div class="chart-row">
            <div class="card">
              <div class="card-head">
                <h2>Blue vs red</h2>
                <span class="sub">loops = chase cycles</span>
              </div>
              <canvas id="chart-phase"></canvas>
            </div>
            <div class="card">
              <div class="card-head">
                <h2>Inherited traits</h2>
                <span class="sub"><span class="sw solid"></span>speed <span class="sw dash"></span>vision</span>
              </div>
              <canvas id="chart-traits"></canvas>
            </div>
            <div class="card summary-card">
              <div class="card-head"><h2>Run summary</h2></div>
              <ul id="summary" class="summary"></ul>
              <dl id="totals" class="totals"></dl>
            </div>
          </div>
        </section>

        <aside class="controls card" id="controls" aria-label="Rules"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
