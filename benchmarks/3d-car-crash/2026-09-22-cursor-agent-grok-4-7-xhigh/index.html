<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok 4.7</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #brand {
    position: fixed; top: 16px; left: 18px; z-index: 3;
    color: #f4f7fb; font: 600 15px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.11em; text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    pointer-events: none;
  }
  #panel {
    position: fixed; top: 12px; right: 12px; z-index: 3; width: 228px;
    max-height: calc(100vh - 24px); overflow: auto;
    padding: 10px 10px 12px; color: #e7edf4;
    background: rgba(8,10,14,0.78); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; backdrop-filter: blur(10px);
    font: 11px/1.25 "Segoe UI", system-ui, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  #runbar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  #runbar button {
    height: 30px; border: 0; border-radius: 7px; cursor: pointer;
    font: 600 12px/1 system-ui, sans-serif;
  }
  #replay { background: #d7e2ef; color: #12161c; }
  #replay:hover { background: #fff; }
  #apply { background: #243140; color: #f4f7fb; border: 1px solid rgba(255,255,255,0.16); }
  #apply:hover { background: #314156; }
  #panel .group {
    margin: 8px 0 3px; color: #93a4b8; font: 600 10px/1 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #panel label {
    display: grid; grid-template-columns: 1fr 78px; gap: 6px;
    align-items: center; margin: 3px 0;
  }
  #panel input {
    width: 100%; box-sizing: border-box; background: #12171e; color: #f2f6fb;
    border: 1px solid #313a46; border-radius: 5px; padding: 3px 5px; font: 11px/1.2 ui-monospace, monospace;
  }
  #transport {
    position: fixed; left: 14px; bottom: 14px; z-index: 3;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    max-width: min(720px, calc(100vw - 280px));
    padding: 6px; color: #d5dee8;
    background: rgba(8,10,14,0.82); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  #transport .cap {
    color: #93a4b8; font: 600 10px/1 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0 2px;
  }
  #speeds, #views { display: flex; gap: 4px; }
  #transport button {
    height: 28px; padding: 0 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; background: #1a212b; color: #d5dee8;
    font: 600 12px/1 system-ui, sans-serif;
  }
  #transport button.active { background: #d7e2ef; color: #12161c; }
  #transport button:hover { border-color: rgba(255,255,255,0.28); }
</style>
</head>
<body>
<div id="brand">Grok 4.7</div>
<div id="transport">
  <button id="pause" type="button">Pause</button>
  <button id="play" type="button" class="active">Play</button>
  <span class="cap">Speed</span>
  <div id="speeds">
    <button type="button" data-speed="0.25">0.25×</button>
    <button type="button" data-speed="0.5">0.5×</button>
    <button type="button" data-speed="1" class="active">1×</button>
    <button type="button" data-speed="2">2×</button>
  </div>
  <span class="cap">View</span>
  <div id="views">
    <button type="button" data-view="top" title="Top">Top</button>
    <button type="button" data-view="follow" title="Chase the car">Follow</button>
    <button type="button" data-view="orbit" title="Free look">Orbit</button>
    <button type="button" data-view="impact" class="active" title="Cinematic">Impact</button>
  </div>
</div>
<form id="panel" autocomplete="off" onsubmit="return false">
  <div id="runbar">
    <button id="replay" type="button">Replay</button>
    <button id="apply" type="button">Apply</button>
  </div>
  <div class="group">Car</div>
  <label>Impact speed m/s <input id="speed" type="number" step="0.1" value="22"></label>
  <label>Mass kg <input id="mass" type="number" step="1" value="1250"></label>
  <label>Length m <input id="carLength" type="number" step="0.01" value="4.2"></label>
  <label>Width m <input id="carWidth" type="number" step="0.01" value="1.8"></label>
  <label>Height m <input id="carHeight" type="number" step="0.01" value="1.45"></label>
  <div class="group">Wall</div>
  <label>Columns <input id="columns" type="number" step="1" value="12"></label>
  <label>Rows <input id="rows" type="number" step="1" value="8"></label>
  <label>Depth <input id="depth" type="number" step="1" value="2"></label>
  <label>Brick mass kg <input id="brickMass" type="number" step="0.1" value="2.5"></label>
  <label>Brick width m <input id="brickWidth" type="number" step="0.01" value="0.5"></label>
  <label>Brick height m <input id="brickHeight" type="number" step="0.01" value="0.24"></label>
  <label>Brick depth m <input id="brickDepth" type="number" step="0.01" value="0.2"></label>
  <div class="group">World</div>
  <label>Gravity <input id="gravity" type="number" step="0.01" value="9.81"></label>
  <label>Brick friction <input id="brickFriction" type="number" step="0.01" value="0.72"></label>
  <label>Brick restitution <input id="brickRestitution" type="number" step="0.01" value="0.18"></label>
  <label>Ground friction <input id="groundFriction" type="number" step="0.01" value="0.85"></label>
  <label>Track length m <input id="trackLength" type="number" step="0.1" value="40"></label>
</form>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import RAPIER from '@dimforge/rapier3d-compat';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const TRACK_LEN = 40;
const TRACK_W = 10;
const CAR_X = 4.8;
let carSX = 1, carSY = 1, carSZ = 1;
function wallX() {
  const len = params && Number.isFinite(params.trackLength) ? params.trackLength : 40;
  return len - 6.45;
}
const WHEEL_R = 0.34;
const DT = 1 / 120;
const IDQ = { x: 0, y: 0, z: 0, w: 1 };
const WHEEL_ROT = { x: Math.SQRT1_2, y: 0, z: 0, w: Math.SQRT1_2 };

const BASE_MASS = {
  cabinTub: 340, cabinRoof: 150, cabinRear: 220,
  frontBay: 130, frontClip: 70, nose: 42,
  bumperF: 12, bumperR: 11, hood: 16, trunk: 13,
  door: 28, wheel: 26,
  wind: 1.75, side: 0.7, rearGlass: 1.2
};

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9c8d6, 55, 150);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.18, 320);
const lookTarget = new THREE.Vector3(20, 1, 0);
camera.position.set(1.2, 4.6, 14.5);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.52;
pmrem.dispose();
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;

const hemi = new THREE.HemisphereLight(0xc9daf0, 0x6d5b44, 0.38);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e4, 4.15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 2;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 90;
scene.add(sun);
scene.add(sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ssaoPass = new SSAOPass(scene, camera, 512, 256, 8);
ssaoPass.kernelRadius = 0.6;
ssaoPass.minDistance = 0.012;
ssaoPass.maxDistance = 0.32;
composer.addPass(ssaoPass);
composer.addPass(new OutputPass());
function fitPost() {
  composer.setSize(window.innerWidth, window.innerHeight);
  ssaoPass.setSize(Math.max(1, window.innerWidth * 0.5), Math.max(1, window.innerHeight * 0.5));
}
fitPost();

const geoCache = new Map();
function geoBox(w, h, d) {
  const k = w.toFixed(4) + '|' + h.toFixed(4) + '|' + d.toFixed(4);
  let g = geoCache.get(k);
  if (!g) {
    g = new THREE.BoxGeometry(w, h, d);
    geoCache.set(k, g);
  }
  return g;
}
const meshBuckets = new Map();
function mesh(parent, w, h, d, x, y, z, mat, cast) {
  w *= carSX; h *= carSY; d *= carSZ;
  x *= carSX; y *= carSY; z *= carSZ;
  let map = meshBuckets.get(parent);
  if (!map) {
    map = new Map();
    meshBuckets.set(parent, map);
  }
  let list = map.get(mat);
  if (!list) {
    list = [];
    map.set(mat, list);
  }
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(x, y, z);
  list.push({ g, cast: !!cast });
}
function flushMeshes() {
  for (const [parent, map] of meshBuckets) {
    for (const [mat, list] of map) {
      const merged = mergeGeometries(list.map((item) => item.g));
      const m = new THREE.Mesh(merged, mat);
      m.castShadow = list.some((item) => item.cast);
      m.receiveShadow = true;
      parent.add(m);
      for (const item of list) item.g.dispose();
    }
  }
  meshBuckets.clear();
}

function matStd(opts) {
  const m = new THREE.MeshStandardMaterial(opts);
  m.toneMapped = false;
  return m;
}
function matPhys(opts) {
  const m = new THREE.MeshPhysicalMaterial(opts);
  m.toneMapped = false;
  return m;
}

const paint = matPhys({
  color: 0xc5ced6, metalness: 0.74, roughness: 0.26,
  clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.45
});
const paintDark = matStd({ color: 0x8e99a6, metalness: 0.72, roughness: 0.34, envMapIntensity: 1.05 });
const trim = matStd({ color: 0x14171c, roughness: 0.62, metalness: 0.18 });
const plastic = matStd({ color: 0x1c2128, roughness: 0.48, metalness: 0.08 });
const chrome = matStd({ color: 0xd5dbe3, metalness: 0.96, roughness: 0.16, envMapIntensity: 1.4 });
const rubber = matStd({ color: 0x121212, roughness: 0.94, metalness: 0.0 });
const glassMat = matStd({
  color: 0xd5e6f4, metalness: 0.08, roughness: 0.05,
  transparent: true, opacity: 0.42, envMapIntensity: 1.55, depthWrite: false
});
const lamp = matStd({ color: 0xfff6de, emissive: 0xfff1c8, emissiveIntensity: 7, roughness: 0.28, metalness: 0.05 });
const tail = matStd({ color: 0xff2a2a, emissive: 0xff1d1d, emissiveIntensity: 3.2, roughness: 0.35, metalness: 0.05 });
const amber = matStd({ color: 0xffb03a, emissive: 0xff9800, emissiveIntensity: 2.4, roughness: 0.4 });
const asphaltMat = matStd({ color: 0xffffff, roughness: 0.9, metalness: 0.08, envMapIntensity: 0.35 });
const grassMat = matStd({ color: 0xffffff, roughness: 1, metalness: 0 });
const curbMat = matStd({ color: 0xffffff, roughness: 0.72, metalness: 0.02 });
const gravelMat = matStd({ color: 0xffffff, roughness: 0.96, metalness: 0.02 });
const railMat = matStd({ color: 0xb7c0c8, metalness: 0.86, roughness: 0.32, envMapIntensity: 0.8 });
const hillMat = matStd({ color: 0x6e8b4e, roughness: 1, metalness: 0 });
const treeMat = matStd({ color: 0x2f4a2a, roughness: 1, metalness: 0 });
const brickMat = matStd({ color: 0xffffff, roughness: 0.92, metalness: 0.02 });
const skidMat = matStd({
  color: 0x0c0c0e, roughness: 1, metalness: 0, transparent: true, opacity: 0.42,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, depthWrite: false
});
const skidGeo = new THREE.PlaneGeometry(0.72, 0.18);
const SKID_MAX = 24;
const skidMesh = new THREE.InstancedMesh(skidGeo, skidMat, SKID_MAX);
skidMesh.count = 0;
skidMesh.frustumCulled = false;
skidMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

function hash01(n) {
  let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeAsphalt() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const g = c.getContext('2d');
  const img = g.createImageData(1024, 512);
  for (let y = 0; y < 512; y++) {
    for (let x = 0; x < 1024; x++) {
      const n = hash01(x * 374761 + y * 668265);
      const n2 = hash01(x * 127 + y * 8191);
      const v = 38 + n * 16 + n2 * 6;
      const i = (y * 1024 + x) * 4;
      img.data[i] = v + 2;
      img.data[i + 1] = v + 2;
      img.data[i + 2] = v + 1;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(230,230,220,0.9)';
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(0, 28);
  g.lineTo(1024, 28);
  g.moveTo(0, 484);
  g.lineTo(1024, 484);
  g.stroke();
  g.strokeStyle = 'rgba(236,196,64,0.92)';
  g.lineWidth = 4;
  g.setLineDash([28, 22]);
  g.beginPath();
  g.moveTo(0, 256);
  g.lineTo(1024, 256);
  g.stroke();
  g.setLineDash([]);
  g.fillStyle = 'rgba(245,245,240,0.92)';
  const startU = (2 / TRACK_LEN) * 1024;
  g.fillRect(startU - 3, 40, 6, 432);
  g.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i < 6; i++) g.fillRect(startU + 18 + i * 22, 150, 12, 212);
  g.fillStyle = 'rgba(0,0,0,0.18)';
  g.fillRect(0, 168, 1024, 28);
  g.fillRect(0, 316, 1024, 28);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function makeNoiseTex(w, h, painter) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) painter(img.data, (y * w + x) * 4, x, y, hash01(x * 928371 + y * 412669));
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
asphaltMat.map = makeAsphalt();
grassMat.map = makeNoiseTex(256, 256, (d, i, x, y, n) => {
  d[i] = 78 + n * 30;
  d[i + 1] = 112 + n * 28;
  d[i + 2] = 52 + n * 16;
  d[i + 3] = 255;
});
grassMat.map.repeat.set(18, 18);
gravelMat.map = makeNoiseTex(128, 128, (d, i, x, y, n) => {
  const v = 92 + n * 40;
  d[i] = v;
  d[i + 1] = v - 4;
  d[i + 2] = v - 10;
  d[i + 3] = 255;
});
gravelMat.map.repeat.set(8, 2);
const curbCanvas = document.createElement('canvas');
curbCanvas.width = 128;
curbCanvas.height = 32;
{
  const g = curbCanvas.getContext('2d');
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#d31218' : '#f2f2f0';
    g.fillRect(i * 16, 0, 16, 32);
  }
}
curbMat.map = new THREE.CanvasTexture(curbCanvas);
curbMat.map.colorSpace = THREE.SRGBColorSpace;
curbMat.map.wrapS = THREE.RepeatWrapping;
curbMat.map.repeat.set(28, 1);

function buildSky() {
  const geo = new THREE.SphereGeometry(220, 32, 20);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    toneMapped: false,
    uniforms: {
      top: { value: new THREE.Color(0x6eaae4) },
      mid: { value: new THREE.Color(0xd5e4f2) },
      hor: { value: new THREE.Color(0xf0d2b4) }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `
      varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 hor;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, h));
        c = mix(c, top, smoothstep(0.12, 0.7, h));
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.frustumCulled = false;
  sky.receiveShadow = false;
  sky.castShadow = false;
  return sky;
}

let staticRoot = null;
function clearStatic() {
  if (!staticRoot) return;
  const seen = new Set();
  staticRoot.traverse((obj) => {
    if (obj.geometry && !seen.has(obj.geometry)) {
      seen.add(obj.geometry);
      obj.geometry.dispose();
    }
    if (obj.material && obj.material.isShaderMaterial) obj.material.dispose();
  });
  scene.remove(staticRoot);
  staticRoot = null;
}

function buildStatic() {
  clearStatic();
  const len = params.trackLength;
  const root = new THREE.Group();
  staticRoot = root;
  scene.add(root);
  root.add(buildSky());
  curbMat.map.repeat.set(Math.max(8, (len / 40) * 28), 1);

  const grass = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.position.set(20, -0.03, 0);
  grass.receiveShadow = true;
  root.add(grass);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(len, TRACK_W), asphaltMat);
  road.rotation.x = -Math.PI / 2;
  road.position.set(len / 2, 0.004, 0);
  road.receiveShadow = true;
  root.add(road);

  const postXs = [];
  for (let x = 2; x < len; x += 8) postXs.push(x);
  const poleXs = [];
  for (let x = 8; x < len - 1; x += 12) poleXs.push(x);
  const postMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.78, 0.1), railMat, Math.max(1, postXs.length * 2));
  const poleMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.1, 4.2, 6), railMat, Math.max(1, poleXs.length * 2));
  const treeMesh = new THREE.InstancedMesh(new THREE.ConeGeometry(1.15, 3.4, 6), treeMat, 8);
  let postI = 0;
  let poleI = 0;
  const dummy = new THREE.Object3D();
  for (const side of [-1, 1]) {
    const gravel = new THREE.Mesh(new THREE.PlaneGeometry(len, 3.2), gravelMat);
    gravel.rotation.x = -Math.PI / 2;
    gravel.position.set(len / 2, -0.01, side * 6.5);
    gravel.receiveShadow = true;
    root.add(gravel);

    const curb = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.36), curbMat);
    curb.position.set(len / 2, 0.05, side * 5.15);
    curb.receiveShadow = true;
    root.add(curb);

    for (const y of [0.34, 0.62]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.16, 0.1), railMat);
      rail.position.set(len / 2, y, side * 7.15);
      rail.receiveShadow = true;
      root.add(rail);
    }
    for (const x of postXs) {
      dummy.position.set(x, 0.39, side * 7.15);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      postMesh.setMatrixAt(postI++, dummy.matrix);
    }
    for (const x of poleXs) {
      dummy.position.set(x, 2.1, side * 8.1);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      poleMesh.setMatrixAt(poleI++, dummy.matrix);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.1, 0.22), lamp);
      head.position.set(x, 4.15, side * 7.75);
      root.add(head);
    }
  }
  postMesh.count = postI;
  poleMesh.count = poleI;
  postMesh.receiveShadow = true;
  poleMesh.receiveShadow = true;
  root.add(postMesh, poleMesh);

  const gantryL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.4, 0.16), railMat);
  gantryL.position.set(1.15, 1.7, -4.2);
  root.add(gantryL);
  const gantryR = gantryL.clone();
  gantryR.position.z = 4.2;
  root.add(gantryR);
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 8.6), railMat);

function readParams() {
  const num = (id, fallback, min, max, round) => {
    const el = document.getElementById(id);
    const raw = Number(el.value);
    let v = Number.isFinite(raw) ? raw : fallback;
    v = Math.min(max, Math.max(min, v));
    if (round) v = Math.round(v);
    if (raw !== v) el.value = String(v);
    return v;
  };
  return {
    speed: num('speed', 22, 3, 70),
    mass: num('mass', 1250, 200, 5000),
    length: num('carLength', 4.2, 2.4, 8),
    width: num('carWidth', 1.8, 1.2, 3.2),
    height: num('carHeight', 1.45, 0.9, 2.4),
    columns: num('columns', 12, 2, 18, true),
    rows: num('rows', 8, 2, 14, true),
    depth: num('depth', 2, 1, 3, true),
    brickMass: num('brickMass', 2.5, 0.3, 50),
    brickWidth: num('brickWidth', 0.5, 0.2, 1.2),
    brickHeight: num('brickHeight', 0.24, 0.08, 0.6),
    brickDepth: num('brickDepth', 0.2, 0.08, 0.6),
    gravity: num('gravity', 9.81, 0.5, 30),
    brickFriction: num('brickFriction', 0.72, 0.02, 1.6),

  };
}

function tagCollider(col, role, body) {
  colliderInfo.set(col.handle, { role, body });
}
function registerJoint(rec) {
  jointList.push(rec);
  for (const b of rec.bodies) {
    let list = jointsByBody.get(b.handle);
    if (!list) {
      list = [];
      jointsByBody.set(b.handle, list);
    }
    list.push(rec);
  }
}
function weld(a, b, breakForce, glass) {
  const pa = a.pos;
  const pb = b.pos;
  const joint = world.createImpulseJoint(RAPIER.JointData.fixed(
    { x: pb.x - pa.x, y: pb.y - pa.y, z: pb.z - pa.z },
    IDQ,
    { x: 0, y: 0, z: 0 },
    IDQ
  ), a.body, b.body, true);
  joint.setContactsEnabled(false);
  registerJoint({ joint, breakForce, bodies: [a.body, b.body], glass: !!glass, dead: false });
}
function axle(chassisPart, wheelPart, breakForce) {
  const pa = chassisPart.pos;
  const pb = wheelPart.pos;
  const joint = world.createImpulseJoint(RAPIER.JointData.revolute(
    { x: pb.x - pa.x, y: pb.y - pa.y, z: pb.z - pa.z },
    { x: 0, y: 0, z: 0 },
    { x: 0, y: 0, z: 1 }
  ), chassisPart.body, wheelPart.body, true);
  joint.setContactsEnabled(false);
  registerJoint({ joint, breakForce, bodies: [chassisPart.body, wheelPart.body], glass: false, dead: false });
}

function makeBody(worldX, y, z, speed, angDamp, ccd) {
  return world.createRigidBody(
    RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(worldX, y, z)
      .setLinvel(speed, 0, 0)
      .setLinearDamping(0)
      .setAngularDamping(angDamp)
      .setCcdEnabled(ccd)
      .setCanSleep(false)
  );
}
function addBoxCollider(body, hx, hy, hz, mass, friction, threshold, rot) {
  let desc = RAPIER.ColliderDesc.cuboid(hx, hy, hz)
    .setMass(mass)
    .setFriction(friction)
    .setRestitution(0.06)
    .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS)
    .setContactForceEventThreshold(threshold);
  if (rot) desc = desc.setRotation(rot);
  const col = world.createCollider(desc, body);
  tagCollider(col, 'car', body);
  return col;
}
const CCD_PARTS = new Set(['frontBay', 'frontClip', 'nose', 'bumperF', 'bumperR', 'hood', 'trunk']);
function addPart(name, cx, cy, cz, hx, hy, hz, mass, friction) {
  const wx = CAR_X + cx * carSX;

  const wz = cz * carSZ;
  const body = makeBody(wx, wy, wz, params.speed, 0.06, CCD_PARTS.has(name) || name.startsWith('door'));

  dynamic.add(obj);
  const rec = { name, body, obj, pos: { x: wx, y: wy, z: wz } };

}

  function glassGrid(parent, rows, cols, x0, x1, y0, y1, zSpan, hx, hy, hz, mass) {
    const group = [];
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {
        const u = (i + 0.5) / rows;
        const x = x0 + (x1 - x0) * u;
        const y = y0 + (y1 - y0) * u;
        const z = -zSpan + (j + 0.5) * ((2 * zSpan) / cols);
        const rec = addPart('glass', x, y, z, hx, hy, hz, m(mass), 0.18);

    group.parent = parent;
    group.cols = cols;
    return group;

  function glassSide(parent, x0, x1, y0, y1, z, rows, cols, mass) {
    const group = [];
    const hx = Math.abs(x1 - x0) / cols * (cols === 1 ? 0.9 : 0.42);
    const hy = Math.abs(y1 - y0) / rows * (rows === 1 ? 0.9 : 0.42);
    for (let i = 0; i < rows; i++) {
      for (let j = 0; j < cols; j++) {

        const y = y0 + (y1 - y0) * ((i + 0.5) / rows);

    const cols = group.cols;
    const rows = group.length / cols;
    for (let i = 0; i < group.length; i++) {
      weld(group[i], group.parent, frameForce, true);
      const col = i % cols;
      const row = Math.floor(i / cols);
      if (col + 1 < cols) weld(group[i], group[i + 1], frameForce * 0.45, true);
      if (row + 1 < rows) weld(group[i], group[i + cols], frameForce * 0.45, true);
    }
  }
  linkWindow(wind, 6500);
  linkWindow(rearG, 6000);
  linkWindow(sideFL, 4200);
  linkWindow(sideFR, 4200);
  linkWindow(sideRL, 4200);
  linkWindow(sideRR, 4200);
  flushMeshes();
}

function buildWall() {

  const BD = params.brickDepth;
  const cols = params.columns;
  const rows = params.rows;
  const depth = params.depth;
  const bricks = [];
  for (let layer = 0; layer < depth; layer++) {
    const x = wallX() + BD * 0.5 + layer * BD;
    for (let row = 0; row < rows; row++) {
      const y = BH * 0.5 + row * BH;
      const z0 = -cols * BW * 0.5;
      if (row % 2 === 0) {
        for (let c = 0; c < cols; c++) {
          bricks.push({ x, y, z: z0 + BW * (c + 0.5), hx: BD * 0.5, hy: BH * 0.5, hz: BW * 0.5, mass: params.brickMass, half: false, id: bricks.length });
        }
      } else {
        bricks.push({ x, y, z: z0 + BW * 0.25, hx: BD * 0.5, hy: BH * 0.5, hz: BW * 0.25, mass: params.brickMass * 0.5, half: true, id: bricks.length });
        for (let c = 0; c < cols - 1; c++) {
          bricks.push({ x, y, z: z0 + BW * (1 + c), hx: BD * 0.5, hy: BH * 0.5, hz: BW * 0.5, mass: params.brickMass, half: false, id: bricks.length });
        }
        bricks.push({ x, y, z: z0 + BW * (cols - 0.25), hx: BD * 0.5, hy: BH * 0.5, hz: BW * 0.25, mass: params.brickMass * 0.5, half: true, id: bricks.length });
      }
    }
  }
  const geo = new THREE.BoxGeometry(BD * 0.9, BH * 0.9, BW * 0.96);
  brickMesh = new THREE.InstancedMesh(geo, brickMat, bricks.length);
  brickMesh.castShadow = true;
  brickMesh.receiveShadow = true;
  brickMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(bricks.length * 3), 3);
  brickMesh.frustumCulled = false;
  dynamic.add(brickMesh);
  const color = new THREE.Color();
  const dummy = new THREE.Object3D();
  brickBodies = [];
  brickHalf = bricks.map((b) => b.half);
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const body = world.createRigidBody(
      RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(b.x, b.y, b.z)
        .setLinearDamping(0.045)
        .setAngularDamping(0.12)
        .setCcdEnabled(false)
        .setCanSleep(true)
    );
    const col = world.createCollider(
      RAPIER.ColliderDesc.cuboid(b.hx, b.hy, b.hz)
        .setMass(b.mass)
        .setFriction(params.brickFriction)
        .setRestitution(params.brickRestitution),
      body
    );
    tagCollider(col, 'brick', body);
    brickBodies.push(body);
    const n = hash01(i * 97 + 13);
    color.setHSL(0.012 + n * 0.03, 0.38 + n * 0.28, 0.22 + n * 0.16);
    brickMesh.setColorAt(i, color);
    dummy.position.set(b.x, b.y, b.z);
    dummy.scale.set(1, 1, b.half ? 0.5 : 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    brickMesh.setMatrixAt(i, dummy.matrix);
  }
  brickMesh.instanceColor.needsUpdate = true;
  brickMesh.instanceMatrix.needsUpdate = true;
}

function buildStaticsPhysics() {
  const ground = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(20, -0.6, 0));
  const gcol = world.createCollider(
    RAPIER.ColliderDesc.cuboid(80, 0.6, 50)
      .setFriction(params.groundFriction)
      .setRestitution(0.03),
    ground
  );
  tagCollider(gcol, 'ground', ground);
  groundBodies.add(ground.handle);
}

function clearDynamic() {
  dynamic.traverse((obj) => {
    if (!obj.geometry) return;
    if (obj === brickMesh || obj.geometry === wheelTireGeo || obj.geometry === wheelRimGeo) return;
    obj.geometry.dispose();
  });
  while (dynamic.children.length) dynamic.remove(dynamic.children[0]);
  meshBuckets.clear();
  for (const g of geoCache.values()) g.dispose();
  geoCache.clear();
  if (brickMesh) {
    brickMesh.geometry.dispose();
    brickMesh = null;
  }
}

function resetVfx() {
  pLife.fill(0);
  pPos.fill(0);
  vfxRng = mulberry32(0xa11c0de);
  shakeRng = mulberry32(0x51a7e);
  skidAcc = 0;
  skidCount = 0;
  skidMesh.count = 0;
  lastSpark = -1;
  lifeAttr.needsUpdate = true;
  pAttr.needsUpdate = true;
}

function buildSim(next) {
  params = next;
  if (eventQueue) eventQueue.free();
  if (world) world.free();
  clearDynamic();
  resetVfx();
  buildStatic();
  world = new RAPIER.World({ x: 0, y: -params.gravity, z: 0 });
  world.timestep = DT;
  world.numSolverIterations = 8;
  world.numAdditionalFrictionIterations = 2;
  world.numInternalPgsIterations = 1;
  eventQueue = new RAPIER.EventQueue(false);
  carBodies = [];
  wheelBodies = [];
  partsByHandle = new Map();
  colliderInfo = new Map();
  jointsByBody = new Map();
  jointList = [];
  brickBodies = [];
  brickHalf = [];
  groundBodies.clear();
  cabin = null;
  nose = null;
  simTime = 0;
  accumulator = 0;
  impacted = false;
  impactTime = 0;
  settled = false;
  settledTime = 0;
  shake = 0;
  cruise = true;
  userYaw = 0;
  camReady = false;
  buildStaticsPhysics();
  buildWall();
  buildCar();
  placeCamera(0, true);
}

function bodyVec(body, out) {
  const t = body.translation();
  out.set(t.x, t.y, t.z);
  return out;
}
const _a = new THREE.Vector3();
const _b = new THREE.Vector3();
const _look = new THREE.Vector3();
const _dummy = new THREE.Object3D();

function syncGraphics() {
  for (const rec of partsByHandle.values()) {
    const t = rec.body.translation();
    const r = rec.body.rotation();
    rec.obj.position.set(t.x, t.y, t.z);
    rec.obj.quaternion.set(r.x, r.y, r.z, r.w);
  }
  if (!brickMesh) return;
  let brickMoved = false;
  for (let i = 0; i < brickBodies.length; i++) {
    const body = brickBodies[i];
    if (body.isSleeping()) continue;
    const t = body.translation();
    const r = body.rotation();
    _dummy.position.set(t.x, t.y, t.z);
    _dummy.quaternion.set(r.x, r.y, r.z, r.w);
    _dummy.scale.set(1, 1, brickHalf[i] ? 0.5 : 1);
    _dummy.updateMatrix();
    brickMesh.setMatrixAt(i, _dummy.matrix);
    brickMoved = true;
  }
  if (brickMoved) brickMesh.instanceMatrix.needsUpdate = true;
}

function spawnParticle(x, y, z, vx, vy, vz, life, kind) {
  let idx = -1;
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { idx = i; break; }
  }
  if (idx < 0) return;
  pPos[idx * 3] = x;
  pPos[idx * 3 + 1] = y;
  pPos[idx * 3 + 2] = z;
  pVel[idx * 3] = vx;
  pVel[idx * 3 + 1] = vy;
  pVel[idx * 3 + 2] = vz;
  pLife[idx] = life;
  pKind[idx] = kind;
}
function burst(x, y, z, n, speed, life, kind) {
  for (let i = 0; i < n; i++) {
    const rx = vfxRng() - 0.5;
    const ry = vfxRng();
    const rz = vfxRng() - 0.5;
    spawnParticle(
      x + rx * 0.3, y + ry * 0.2, z + rz * 0.3,
      rx * speed, ry * speed * 0.8 + (kind ? 0.6 : 1.2), rz * speed,
      life * (0.65 + vfxRng() * 0.5), kind
    );
  }
}
function tickParticles() {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) continue;
    pVel[i * 3 + 1] -= params.gravity * DT * (pKind[i] > 0.5 ? 0.35 : 1);
    pPos[i * 3] += pVel[i * 3] * DT;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * DT;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * DT;
    if (pKind[i] < 0.5 && pPos[i * 3 + 1] < 0.03) pLife[i] = 0;
    else pLife[i] -= DT;
    if (pLife[i] < 0) pLife[i] = 0;
  }
  pAttr.needsUpdate = true;
  lifeAttr.needsUpdate = true;
}

const _skid = new THREE.Object3D();
function dropSkid(body) {
  if (skidCount >= SKID_MAX) return;
  const t = body.translation();
  _skid.position.set(t.x, 0.012, t.z);
  _skid.rotation.set(-Math.PI / 2, 0, 0);
  _skid.scale.set(1, 1, 1);
  _skid.updateMatrix();
  skidMesh.setMatrixAt(skidCount, _skid.matrix);
  skidCount++;
  skidMesh.count = skidCount;
  skidMesh.instanceMatrix.needsUpdate = true;
}

const shockForce = new Map();
function noteShock(body, force) {
  const prev = shockForce.get(body.handle) || 0;
  if (force > prev) shockForce.set(body.handle, force);
}
function killGlassAround(body) {
  const list = jointsByBody.get(body.handle);
  if (!list) return;
  for (const rec of list) if (rec.glass) rec.dead = true;
}
function breakWeakest(body, force) {
  const list = jointsByBody.get(body.handle);
  if (!list) return;
  let best = null;
  for (const rec of list) {
    if (rec.dead || rec.removed) continue;
    if (force < rec.breakForce) continue;
    if (!best || rec.breakForce < best.breakForce) best = rec;
  }
  if (!best) return;
  best.dead = true;
  if (best.glass) {
    killGlassAround(best.bodies[0]);
    killGlassAround(best.bodies[1]);
  }
}

function stepPhysics() {
  simTime += DT;
  if (cruise && nose) {
    const nx = nose.body.translation().x;
    if (nx < wallX() - 8) {
      let corrected = false;
      for (const b of carBodies) {
        const v = b.linvel();
        if (v.x < params.speed - 0.12) {
          b.setLinvel({ x: params.speed, y: v.y, z: v.z }, true);
          corrected = true;
        }
      }
      if (corrected) {
        for (const w of wheelBodies) w.setAngvel({ x: 0, y: 0, z: -params.speed / (WHEEL_R * carSY) }, true);
      }
    } else {
      cruise = false;
    }
  }

  world.step(eventQueue);
  shockForce.clear();
  eventQueue.drainContactForceEvents((event) => {
    const a = colliderInfo.get(event.collider1());
    const b = colliderInfo.get(event.collider2());
    if (!a || !b) return;
    if (a.role === 'ground' || b.role === 'ground') return;
    const f = event.totalForceMagnitude();
    if (a.role === 'car') noteShock(a.body, f);
    if (b.role === 'car') noteShock(b.body, f);
  });

  if (simTime > 0.4) {
    for (const [handle, force] of shockForce) {
      const rec = partsByHandle.get(handle);
      if (rec) breakWeakest(rec.body, force);
    }
  }

  let broke = false;
  for (let i = jointList.length - 1; i >= 0; i--) {
    const rec = jointList[i];
    if (!rec.dead || rec.removed) continue;
    world.removeImpulseJoint(rec.joint, true);
    rec.removed = true;
    jointList.splice(i, 1);
    for (const b of rec.bodies) {
      const list = jointsByBody.get(b.handle);
      if (!list) continue;
      const k = list.indexOf(rec);
      if (k >= 0) list.splice(k, 1);
    }
    broke = true;
    if (!rec.glass && simTime - lastSpark > 0.035) {
      lastSpark = simTime;
      const t0 = rec.bodies[0].translation();
      const t1 = rec.bodies[1].translation();
      burst((t0.x + t1.x) * 0.5, (t0.y + t1.y) * 0.5, (t0.z + t1.z) * 0.5, 4, 6.5, 0.28, 0);
    }
  }
  if (broke && !impacted) {
    impacted = true;
    impactTime = simTime;
    shake = 1;
    const t = nose.body.translation();
    burst(t.x, 0.7, t.z, 12, 4.2, 0.9, 1);
    burst(wallX() + 0.2, 0.9, 0, 8, 3.2, 0.8, 1);
  }

  if (!impacted && wheelBodies.length) {
    skidAcc += params.speed * DT;
    if (skidAcc > 1.5) {
      skidAcc = 0;
      dropSkid(wheelBodies[2]);
      dropSkid(wheelBodies[3]);
    }
  }

  if (impacted && !settled) {
    const v = cabin.body.linvel();
    const sp = Math.hypot(v.x, v.y, v.z);
    if ((simTime - impactTime > 3.4 && sp < 0.45) || simTime - impactTime > 7.5) {
      settled = true;
      settledTime = simTime;
      world.forEachCollider((col) => col.setActiveEvents(0));
    }
  }
  tickParticles();
}

function placeCamera(dt, snap) {
  const cpos = cabin ? bodyVec(cabin.body, _a) : _a.set(CAR_X, 1, 0);
  const wall = wallX();
  const dist = wall - cpos.x;
  const desired = _b;
  const look = _look;
  if (viewMode === 'top') {
    const mid = (cpos.x + wall) * 0.5;
    camera.up.set(0, 0, -1);
    desired.set(mid, Math.max(32, Math.abs(dist) * 0.72 + 12), 0);
    look.set(mid, 0, 0);
  } else if (viewMode === 'follow') {
    camera.up.set(0, 1, 0);
    desired.set(cpos.x - 6.8, 2.7, 6.6);
    look.set(cpos.x + 3.2, 0.95, 0);
  } else if (viewMode === 'orbit') {
    camera.up.set(0, 1, 0);
    const ang = 0.55 + simTime * 0.12 + userYaw;
    const pitch = Math.max(0.18, Math.min(1.15, 0.45 + userPitch));
    const focusX = cpos.x * 0.4 + wall * 0.6;
    const rad = 13;
    const cp = Math.cos(pitch);
    desired.set(focusX + Math.cos(ang) * rad * cp, 1.2 + Math.sin(pitch) * rad, Math.sin(ang) * rad * cp);
    look.set(focusX, 0.85, 0);
  } else if (!impacted && simTime < 0.7) {
    camera.up.set(0, 1, 0);
    desired.set(cpos.x - 3.2, 4.5, 13.6);
    look.set(params.trackLength === 40 ? 18.5 : (cpos.x + wall) * 0.5, 1.15, 0);
  } else if (!impacted && dist > 13) {
    camera.up.set(0, 1, 0);
    desired.set(cpos.x - 6.8, 2.7, 6.6);
    look.set(cpos.x + 3.2, 0.95, 0);
  } else if (!settled) {
    camera.up.set(0, 1, 0);
    desired.set(wall - 7.6, 3.15, 11.2);
    look.set(wall - 0.6, 1.05, 0);
  } else {
    camera.up.set(0, 1, 0);
    const ang = 0.55 + (simTime - settledTime) * 0.18 + userYaw;
    const focusX = cpos.x * 0.45 + wall * 0.55;
    desired.set(focusX + Math.cos(ang) * 12.2, 3.35 + Math.sin(userPitch) * 0.2, Math.sin(ang) * 12.2);
    look.set(focusX, 0.85, 0);
  }
  if (snap || !camReady) {
    camera.position.copy(desired);
    lookTarget.copy(look);
    camReady = true;
  } else {
    const rate = viewMode === 'impact' ? (settled ? 1.6 : 3.4) : viewMode === 'follow' ? 5 : 8;
    const k = 1 - Math.exp(-dt * rate);
    camera.position.lerp(desired, k);
    lookTarget.lerp(look, k);
  }
  camera.lookAt(lookTarget);
  if (!paused && viewMode === 'impact' && shake > 0) {
    const s = shake * shake;
    camera.position.x += (shakeRng() - 0.5) * 0.22 * s;
    camera.position.y += (shakeRng() - 0.5) * 0.14 * s;
    camera.position.z += (shakeRng() - 0.5) * 0.16 * s;
    shake = Math.max(0, shake - dt * 1.7);
  }
}
let userPitch = 0;

function updateShadows() {
  if (settled) {
    sun.shadow.autoUpdate = false;
    return;
  }
  sun.shadow.autoUpdate = true;
  const cpos = cabin ? bodyVec(cabin.body, _a) : _a.set(12, 0, 0);
  const span = params.trackLength === 40 ? 18 : Math.min(36, Math.max(16, Math.abs(wallX() - cpos.x) * 0.5 + 6));
  const focusX = (cpos.x + wallX()) * 0.5;
  sun.position.set(focusX + 15, 27, 11);
  sun.target.position.set(focusX, 0.6, 0);
  sun.target.updateMatrixWorld();
  const sc = sun.shadow.camera;
  sc.left = -span;
  sc.right = span;
  sc.top = span;
  sc.bottom = -span;
  sc.updateProjectionMatrix();
}

function loop(now) {
  if (!lastNow) lastNow = now;
  let frameDt = (now - lastNow) / 1000;
  lastNow = now;
  if (frameDt > 0.05) frameDt = 0.05;
  if (!paused) {
    accumulator += frameDt * timeScale;
    const maxSteps = Math.ceil(4 * Math.max(1, timeScale));
    let steps = 0;
    while (accumulator >= DT && steps < maxSteps) {
      stepPhysics();
      accumulator -= DT;
      steps++;
    }
    const keep = DT * Math.max(1, timeScale);
    if (accumulator > keep) accumulator = keep;
  }
  syncGraphics();
  placeCamera(frameDt, false);
  updateShadows();
  composer.render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitPost();
});
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (viewMode !== 'orbit') return;
  dragging = true;
  dragX = e.clientX;
  dragY = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  userYaw += (e.clientX - dragX) * 0.005;
  userPitch = Math.max(-0.4, Math.min(0.6, userPitch + (e.clientY - dragY) * 0.002));
  dragX = e.clientX;
  dragY = e.clientY;
});

function syncTransport() {
  document.getElementById('pause').classList.toggle('active', paused);
  document.getElementById('play').classList.toggle('active', !paused);
  document.querySelectorAll('#speeds button').forEach((btn) => {
    btn.classList.toggle('active', Number(btn.dataset.speed) === timeScale);
  });
  document.querySelectorAll('#views button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.view === viewMode);
  });
}
function setPaused(next) {
  paused = !!next;
  syncTransport();
}
function restart() {
  paused = false;
  syncTransport();
  lastNow = 0;
  buildSim(readParams());
}
function setView(mode) {
  viewMode = mode;
  syncTransport();
  if (cabin) placeCamera(0, true);
}
document.getElementById('pause').addEventListener('click', () => setPaused(true));
document.getElementById('play').addEventListener('click', () => setPaused(false));
document.getElementById('replay').addEventListener('click', restart);
document.getElementById('apply').addEventListener('click', restart);
document.querySelectorAll('#speeds button').forEach((btn) => {
  btn.addEventListener('click', () => {
    timeScale = Number(btn.dataset.speed);
    syncTransport();
  });
});
document.querySelectorAll('#views button').forEach((btn) => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});
window.addEventListener('keydown', (e) => {
  const tag = e.target && e.target.tagName;
  if (e.code === 'Space') {
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
    e.preventDefault();
    setPaused(!paused);
    return;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    restart();
  }
});

await RAPIER.init();
buildSim(readParams());
syncTransport();
requestAnimationFrame(loop);
</script>
</body>
