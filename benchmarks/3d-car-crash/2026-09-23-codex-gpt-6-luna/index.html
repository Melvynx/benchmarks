function syncVelocity(){if(crashed||!carAnchor)return;const p=carAnchor.body.translation();const wallHalfDepth=(settings.wallDepth*settings.brickDepth+(settings.wallDepth-1)*.012)/2;const impactTravel=Math.max(2,wallZ-wallHalfDepth-carStartZ-settings.carLength*.5);const remain=Math.max(1,wallZ-wallHalfDepth-p.z-settings.carLength*.5);const target=settings.impactSpeed;const accel=target*target/(2*impactTravel);const speed=Math.min(target,Math.sqrt(Math.max(0,2*accel*(p.z-carStartZ))));const forward=Math.max(0,Math.min(target,speed));for(const entity of carEntities){if(!entity.alive)continue;const current=entity.body.linvel();entity.body.setLinvel({x:current.x,y:current.y,z:forward},true);if(entity.name.startsWith('wheel-'))entity.body.setAngvel({x:-forward/.34,y:0,z:0},true);}if(remain<.25){for(const entity of carEntities)if(entity.alive)entity.body.setLinvel({x:0,y:entity.body.linvel().y,z:target},true);}}
function stepPhysics(dt){if(!world)return;syncVelocity();preVelocity.clear();for(const e of allEntities){if(e.alive){const v=e.body.linvel();preVelocity.set(e.bodyHandle,{x:v.x,y:v.y,z:v.z,type:e.type,mass:e.mass,entity:e});}}
  world.timestep=dt;world.step(queue);let pendingCrashImpulse=0;queue.drainCollisionEvents((h1,h2,started)=>{if(!started||crashed||pendingCrashImpulse>0)return;const a=entityByCollider.get(h1),b=entityByCollider.get(h2);if(!a||!b)return;const carObj=a.type==='car'||a.type==='glass'?a:(b.type==='car'||b.type==='glass'?b:null);const other=a===carObj?b:a;if(carObj&&other.type==='brick')pendingCrashImpulse=makeImpactImpulse(carObj);});
  simTime+=dt;if(pendingCrashImpulse>0&&!crashed)triggerCrash(pendingCrashImpulse);animateDust(dt);if(crashed&&document.getElementById('stateWord').textContent.includes('DEBRIS')){let settled=true;for(const entity of allEntities){if(!entity.alive)continue;const v=entity.body.linvel(),w=entity.body.angvel();if(v.x*v.x+v.y*v.y+v.z*v.z>.04||w.x*w.x+w.y*w.y+w.z*w.z>.25){settled=false;break;}}settlingTime=settled?settlingTime+dt:0;if(settlingTime>=.8)document.getElementById('stateWord').textContent='WRECK · SETTLED';}
}
function removeRun(){if(queue){queue.free();queue=null;}if(world){world.free();world=null;}clearGroup(runRoot);clearGroup(fxRoot);particlePool=[];jointLinks=[];allEntities=[];carEntities=[];entityByCollider.clear();preVelocity.clear();for(const mark of skidMeshes){environmentRoot.remove(mark);mark.geometry.dispose();mark.material.dispose();}skidMeshes=[];crashed=false;crashTime=0;settlingTime=0;impactValue=0;simTime=0;accumulator=0;}
function startRun(newSettings){settings={...newSettings};runNumber++;removeRun();world=new RAPIER.World({x:0,y:-settings.gravity,z:0});queue=new RAPIER.EventQueue(true);buildEnvironment(settings);buildWall(settings);buildCar(settings);followSmoothed.set(0,3,carStartZ-10);if(activeView==='impact')setCameraView('impact');else if(activeView==='top')setCameraView('top');else if(activeView==='orbit'){viewOrbit.target.set(0,1,0);viewOrbit.radius=clamp(Math.max(viewOrbit.radius,settings.trackLength*.78),12,95);updateOrbitCamera();}document.getElementById('stateWord').textContent=playing?'LIVE SIMULATION':'PAUSED';document.getElementById('impulseRead').textContent='—';document.getElementById('speedRead').textContent='0.0';document.getElementById('timeRead').textContent='0.00';document.getElementById('toggle').textContent=playing?'Pause':'Play';}
function readSettings(){const out={};for(const key of Object.keys(defaults)){const input=document.querySelector(`[name="${key}"]`);let value=Number(input.value);if(!Number.isFinite(value))value=defaults[key];value=clamp(value,Number(input.min),Number(input.max));if(['wallColumns','wallRows','wallDepth'].includes(key))value=Math.round(value);input.value=String(value);out[key]=value;}return out;}
function setCameraView(view){activeView=view;document.querySelectorAll('.view-button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const hint=document.getElementById('viewHint');hint.textContent=view==='orbit'?'Drag to orbit · wheel to zoom':'';if(view==='impact'){const d=Math.max(42,settings.trackLength*1.08);camera.fov=49;camera.position.set(d*.45,d*.36,-d*.84);camera.up.set(0,1,0);camera.lookAt(0,1.2,1.2);camera.updateProjectionMatrix();}
  if(view==='follow'){camera.fov=67;camera.up.set(0,1,0);camera.updateProjectionMatrix();}
  if(view==='top'){camera.fov=45;camera.position.set(0,Math.max(50,settings.trackLength*1.25),0.05);camera.up.set(0,0,-1);camera.lookAt(0,0,0);camera.updateProjectionMatrix();}
  if(view==='orbit'){camera.fov=52;camera.up.set(0,1,0);camera.updateProjectionMatrix();updateOrbitCamera();}}
function updateOrbitCamera(){const t=viewOrbit.target,e=viewOrbit.elevation,r=viewOrbit.radius,a=viewOrbit.azimuth;camera.position.set(t.x+r*Math.cos(e)*Math.sin(a),t.y+r*Math.sin(e),t.z+r*Math.cos(e)*Math.cos(a));camera.lookAt(t);}
function updateFollowCamera(dt){if(activeView!=='follow'||!carAnchor)return;const p=carAnchor.body.translation();const desired=new THREE.Vector3(p.x+8,p.y+5.9,p.z-8.5);followSmoothed.lerp(desired,1-Math.exp(-dt*3.2));camera.position.copy(followSmoothed);const target=new THREE.Vector3(p.x,p.y+.9,Math.max(p.z+2.7,wallZ-.2));camera.lookAt(target);}
function render(now){requestAnimationFrame(render);camera.position.sub(lastShake);lastShake.set(0,0,0);const realDt=Math.min(.06,Math.max(0,(now-lastFrame)/1000));lastFrame=now;if(playing){accumulator+=realDt*simSpeed;let steps=0;while(accumulator>=FIXED_DT&&steps<MAX_STEPS){stepPhysics(FIXED_DT);accumulator-=FIXED_DT;steps++;}if(steps===MAX_STEPS&&accumulator>FIXED_DT*MAX_STEPS)accumulator=FIXED_DT*MAX_STEPS;}
  applyBodyTransforms();if(activeView==='follow')updateFollowCamera(Math.max(realDt,FIXED_DT));if(crashed){const age=simTime-crashTime;if(age>=0&&age<.52){const fade=1-age/.52,phase=age*76+runNumber*1.7;lastShake.set(Math.sin(phase*1.13)*.13*fade,Math.sin(phase*1.71)*.07*fade,Math.cos(phase*.91)*.11*fade);camera.position.add(lastShake);}}renderer.render(scene,camera);if(now-lastHud>90){lastHud=now;let v=0;if(carAnchor&&carAnchor.alive){const vel=carAnchor.body.linvel();v=Math.hypot(vel.x,vel.y,vel.z);}document.getElementById('speedRead').textContent=v.toFixed(1);document.getElementById('timeRead').textContent=simTime.toFixed(2);document.getElementById('impulseRead').textContent=crashed?Math.round(impactValue).toLocaleString('en-US'):'—';}}
function setPlaying(value){playing=value;document.getElementById('toggle').textContent=playing?'Pause':'Play';if(!crashed)document.getElementById('stateWord').textContent=playing?'LIVE SIMULATION':'PAUSED';}
function rebuildFromControls(){const next=readSettings();setPlaying(true);startRun(next);}
document.getElementById('toggle').addEventListener('click',()=>setPlaying(!playing));document.getElementById('replay').addEventListener('click',rebuildFromControls);document.getElementById('apply').addEventListener('click',rebuildFromControls);document.getElementById('simSpeed').addEventListener('change',event=>{simSpeed=Number(event.target.value)||1;});document.querySelectorAll('.view-button').forEach(button=>button.addEventListener('click',()=>setCameraView(button.dataset.view)));
window.addEventListener('keydown',event=>{if(event.code!=='Space'||event.repeat)return;const target=event.target;if(target instanceof HTMLInputElement&&target.type==='number')return;event.preventDefault();setPlaying(!playing);});
let dragging=false,lastPointer={x:0,y:0};renderer.domElement.addEventListener('pointerdown',event=>{if(activeView!=='orbit')return;dragging=true;lastPointer={x:event.clientX,y:event.clientY};renderer.domElement.setPointerCapture(event.pointerId);});renderer.domElement.addEventListener('pointermove',event=>{if(!dragging||activeView!=='orbit')return;const dx=event.clientX-lastPointer.x,dy=event.clientY-lastPointer.y;lastPointer={x:event.clientX,y:event.clientY};viewOrbit.azimuth-=dx*.005;viewOrbit.elevation=clamp(viewOrbit.elevation+dy*.004,-.05,1.35);updateOrbitCamera();});renderer.domElement.addEventListener('pointerup',()=>{dragging=false;});renderer.domElement.addEventListener('wheel',event=>{if(activeView!=='orbit')return;viewOrbit.radius=clamp(viewOrbit.radius*Math.exp(event.deltaY*.001),12,95);updateOrbitCamera();},{passive:true});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight);});
await RAPIER.init();startRun(defaults);setCameraView('impact');requestAnimationFrame(render);
</script>
