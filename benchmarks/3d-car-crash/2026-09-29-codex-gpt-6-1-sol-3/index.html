for(const side of [-1,1]){for(const name of [`${side} front door`,`${side} rear door`])meshBox(map.get(name).mesh,-.23*X,.12*Y,side*.033*Z,.14*X,.025*Y,.025*Z,rimMat,true);meshBox(map.get(`${side} front door`).mesh,.35*X,.28*Y,side*.10*Z,.18*X,.10*Y,.15*Z,paint,true);for(const x of [-.95,.40])meshBox(main.mesh,x*X,.55*Y,side*.68*Z,.045*X,.62*Y,.045*Z,paint,true)}

// Restrained cabin silhouette, dashboard and seats, visible through the glass.
meshBox(main.mesh,.62*X,.35*Y,0,.20*X,.16*Y,1.24*Z,darkMetal,true);for(const side of [-1,1]){meshBox(main.mesh,-.11*X,.36*Y,side*.33*Z,.30*X,.42*Y,.38*Z,darkMetal,true)}
}
function buildWall(s){const gap=.008;const geom=new THREE.BoxGeometry(s.brickDepth-gap,s.brickHeight-gap,s.brickWidth-gap);brickMesh=new THREE.InstancedMesh(geom,brickMat,s.columns*s.rows*s.layers);brickMesh.castShadow=brickMesh.receiveShadow=true;brickMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);runGroup.add(brickMesh);let index=0;const color=new THREE.Color();for(let layer=0;layer<s.layers;layer++)for(let row=0;row<s.rows;row++)for(let col=0;col<s.columns;col++){const x=wallX+(layer-(s.layers-1)/2)*s.brickDepth,y=s.brickHeight/2+row*s.brickHeight,z=(col-(s.columns-1)/2)*s.brickWidth+(row%2?.5*s.brickWidth:0)-.25*s.brickWidth;const body=new CANNON.Body({mass:s.brickMass,material:world.brickMat,position:new CANNON.Vec3(x,y,z),linearDamping:.025,angularDamping:.06,allowSleep:true,sleepSpeedLimit:.13,sleepTimeLimit:1,collisionFilterGroup:groupBrick,collisionFilterMask:-1});body.addShape(new CANNON.Box(new CANNON.Vec3((s.brickDepth-gap)/2,(s.brickHeight-gap)/2,(s.brickWidth-gap)/2)));body.isBrick=true;world.addBody(body);bricks.push(body);color.setHSL(.035+((index*17)%23)/900,.37,.38+((index*11)%19)/180);brickMesh.setColorAt(index++,color)}brickMesh.instanceColor.needsUpdate=true;document.getElementById('brickCount').textContent=bricks.length}
function createWorld(s){world=new CANNON.World({gravity:new CANNON.Vec3(0,-s.gravity,0),allowSleep:true});world.broadphase=new CANNON.SAPBroadphase(world);world.broadphase.axisIndex=0;world.solver.iterations=14;world.solver.tolerance=1e-7;world.defaultContactMaterial.contactEquationStiffness=5e7;world.defaultContactMaterial.contactEquationRelaxation=4;world.groundMat=new CANNON.Material('ground');world.carMat=new CANNON.Material('car');world.brickMat=new CANNON.Material('brick');world.glassMat=new CANNON.Material('glass');const contact=(a,b,f,r)=>world.addContactMaterial(new CANNON.ContactMaterial(a,b,{friction:f,restitution:r,contactEquationStiffness:5e7,contactEquationRelaxation:4,frictionEquationStiffness:1e7,frictionEquationRelaxation:4}));contact(world.groundMat,world.brickMat,Math.sqrt(s.groundFriction*s.brickFriction),s.brickRestitution);contact(world.brickMat,world.brickMat,s.brickFriction,s.brickRestitution);contact(world.carMat,world.brickMat,s.brickFriction,.10);contact(world.carMat,world.groundMat,s.groundFriction,.07);contact(world.carMat,world.carMat,.45,.08);contact(world.glassMat,world.groundMat,s.groundFriction*.65,.1);contact(world.glassMat,world.brickMat,s.brickFriction,.12);contact(world.glassMat,world.carMat,.35,.1);contact(world.glassMat,world.glassMat,.35,.08)}
function breakJoint(j){if(j.broken)return;j.broken=true;world.removeConstraint(j.constraint);broken++;for(const r of [j.a,j.b]){r.body.wakeUp();if(r!==main){r.body.collisionFilterGroup=groupDebris;r.body.collisionFilterMask=-1}}}
function shatter(rec){if(rec.removed)return;rec.removed=true;for(const j of joints)if(!j.broken&&(j.a===rec||j.b===rec))breakJoint(j);const pane=rec.body,dim=rec.dimensions;const thin=dim[0]<dim[2]?0:2;const axes=thin===0?[1,2]:[0,1];const nx=3,ny=3;const local=new CANNON.Vec3();for(let i=0;i<nx;i++)for(let k=0;k<ny;k++){const d=[...dim];d[axes[0]]=dim[axes[0]]/nx*.92;d[axes[1]]=dim[axes[1]]/ny*.92;local.set(0,0,0);local[['x','y','z'][axes[0]]]=((i+.5)/nx-.5)*dim[axes[0]];local[['x','y','z'][axes[1]]]=((k+.5)/ny-.5)*dim[axes[1]];const wp=new CANNON.Vec3();pane.pointToWorldFrame(local,wp);const offset=wp.vsub(pane.position),spin=new CANNON.Vec3();pane.angularVelocity.cross(offset,spin);const v=pane.velocity.vadd(spin);const shard=createBody('glass shard',pane.mass/(nx*ny),[wp.x,wp.y,wp.z],d,glassMat,pane.quaternion.clone());shard.body.material=world.glassMat;shard.body.collisionFilterGroup=groupDebris;shard.body.collisionFilterMask=-1;shard.body.velocity.copy(v);shard.body.angularVelocity.copy(pane.angularVelocity);shard.body.linearDamping=.04;shard.body.angularDamping=.12}world.removeBody(pane);runGroup.remove(rec.mesh)}
function checkBreaks(){if(!impacted)return;for(const r of bodies)r.stress=0;for(const c of world.contacts){const impulse=Math.abs(c.multiplier)*STEP;for(const b of [c.bi,c.bj])if(b.record)b.record.stress+=impulse}const toShatter=[];for(const j of joints){if(j.broken)continue;let load=0;for(const eq of j.constraint.equations)load=Math.max(load,Math.abs(eq.multiplier));const direct=Math.max(j.a.stress,j.b.stress);if(load>j.force||direct>j.force*STEP*1.8){breakJoint(j);for(const r of [j.a,j.b])if(r.isGlass&&!r.removed)toShatter.push(r)}}for(const g of glassParts)if(!g.removed&&(g.stress>3.5||g.body.velocity.vsub(main.body.velocity).length()>4))toShatter.push(g);for(const g of new Set(toShatter))shatter(g)}
// Dust and hot metal flecks are purely cosmetic; all solid debris remains in Cannon.
const dustN=100,dustPositions=new Float32Array(dustN*3),dustColors=new Float32Array(dustN*3);const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPositions,3));dustGeo.setAttribute('color',new THREE.BufferAttribute(dustColors,3));const dustCanvas=document.createElement('canvas');dustCanvas.width=dustCanvas.height=32;const dc=dustCanvas.getContext('2d'),dg=dc.createRadialGradient(16,16,0,16,16,16);dg.addColorStop(0,'rgba(255,255,255,.75)');dg.addColorStop(.45,'rgba(255,255,255,.35)');dg.addColorStop(1,'rgba(255,255,255,0)');dc.fillStyle=dg;dc.fillRect(0,0,32,32);const dustMat=new THREE.PointsMaterial({map:new THREE.CanvasTexture(dustCanvas),size:.65,vertexColors:true,transparent:true,depthWrite:false,opacity:.6});const dust=new THREE.Points(dustGeo,dustMat);dust.frustumCulled=false;dust.visible=false;scene.add(dust);let dustItems=[],dustAge=10;
function emitDust(pos){const r=rng(981);dustItems=[];dustAge=0;dust.visible=true;for(let i=0;i<dustN;i++){const spark=i<12;dustItems.push({x:pos.x,y:Math.max(.15,pos.y),z:pos.z,vx:(r()-.28)*(spark?8:4),vy:r()*(spark?5:3)+.3,vz:(r()-.5)*9,spark});const color=new THREE.Color(spark?'#ffd38b':'#bbae96');dustColors.set([color.r,color.g,color.b],i*3)}dustGeo.attributes.color.needsUpdate=true}
function stepDust(){if(dustAge>3.5)return;dustAge+=STEP;for(let i=0;i<dustItems.length;i++){const p=dustItems[i];p.vy-=(p.spark?9.81:.5)*STEP;p.vx*=.995;p.vz*=.995;p.x+=p.vx*STEP;p.y=Math.max(.025,p.y+p.vy*STEP);p.z+=p.vz*STEP;dustPositions.set([p.x,p.y,p.z],i*3)}dustGeo.attributes.position.needsUpdate=true;dustMat.opacity=.55*Math.max(0,1-dustAge/3.5);if(dustAge>=3.5)dust.visible=false}
const skidMat=new THREE.MeshStandardMaterial({color:'#111719',roughness:1,transparent:true,opacity:.48,depthWrite:false});let skids=[];
function freshRun(s){if(environment){scene.remove(environment);environment.traverse(o=>{if(o.isInstancedMesh)o.dispose()})}if(runGroup){scene.remove(runGroup);runGroup.traverse(o=>{if(o.isInstancedMesh){o.geometry.dispose();o.dispose()}})}settings={...s};wallX=s.trackLength*.34;startX=-s.trackLength*.38;runGroup=new THREE.Group();scene.add(runGroup);bodies=[];joints=[];glassParts=[];bricks=[];skids=[];elapsed=0;accumulator=0;paused=false;impacted=false;broken=0;settleTime=0;shake=0;dust.visible=false;dustAge=10;createWorld(s);buildEnvironment(s);buildWall(s);buildCar(s);for(const side of [-1,1]){const mark=meshBox(runGroup,wallX,.012,side*s.carWidth*.425,.001,.007,.13,skidMat);skids.push(mark)}status.textContent='ACCELERATING';updatePlay();syncGraphics();positionCamera(true);document.getElementById('loading').style.display='none';lastReal=performance.now()}
function physicsStep(){if(!impacted){const v=main.body.velocity.x;const acc=Math.max(0,Math.min(22,(settings.impactSpeed-v)*12));main.body.applyForce(new CANNON.Vec3(settings.carMass*acc,0,0));main.body.wakeUp()}world.step(STEP);elapsed+=STEP;checkBreaks();stepDust();if(impacted){shake=Math.max(0,shake-STEP*.8);for(const mark of skids){const rearX=main.body.position.x-settings.carLength*.32;const length=Math.max(.001,rearX-(wallX-settings.carLength*.32));mark.scale.x=length;mark.position.x=wallX-settings.carLength*.32+length/2}let energy=0;for(const r of bodies)if(!r.removed)energy+=r.body.mass*(r.body.velocity.lengthSquared()+.08*r.body.angularVelocity.lengthSquared());for(const b of bricks)energy+=b.mass*(b.velocity.lengthSquared()+.025*b.angularVelocity.lengthSquared());if(elapsed-impactAt>5&&energy<8)settleTime+=STEP;else settleTime=0;if(settleTime>1.5){paused=true;status.textContent='SETTLED';updatePlay() }else if(elapsed-impactAt>1)status.textContent='DEBRIS SETTLING'}}
function syncGraphics(){for(const r of bodies){if(r.removed)continue;const b=r.body;r.mesh.position.copy(b.position);r.mesh.quaternion.copy(b.quaternion)}for(let i=0;i<bricks.length;i++){const b=bricks[i];tmpPos.copy(b.position);tmpQuat.copy(b.quaternion);tmpMatrix.compose(tmpPos,tmpQuat,one);brickMesh.setMatrixAt(i,tmpMatrix)}brickMesh.instanceMatrix.needsUpdate=true;brickMesh.computeBoundingSphere()}
const desiredPos=new THREE.Vector3(),desiredTarget=new THREE.Vector3(),lookTarget=new THREE.Vector3();let cameraInitialized=false;
function positionCamera(immediate=false,realDt=1/60){orbit.enabled=view==='orbit';camera.up.set(0,1,0);camera.fov=47;if(view==='orbit'){if(immediate){orbit.target.set(wallX-3,.65,0);camera.position.set(wallX-16,9,20);camera.lookAt(orbit.target)}orbit.update();return}const p=main.body.position;if(view==='top'){camera.up.set(0,0,-1);desiredPos.set(0,settings.trackLength*.9,0);desiredTarget.set(0,0,0)}else if(view==='follow'){desiredPos.set(p.x-10.5,5.2,p.z+7.8);desiredTarget.set(impacted?Math.max(p.x+3,wallX+1):p.x+4, .85,p.z*.4)}else{const approach=Math.max(0,Math.min(1,(p.x-startX)/(wallX-settings.carLength*.5-startX)));const targetX=THREE.MathUtils.lerp((startX+wallX)*.5,wallX-1.8,approach);desiredTarget.set(targetX,.75,0);desiredPos.set(targetX-9,THREE.MathUtils.lerp(9,6.7,approach),THREE.MathUtils.lerp(24,17,approach))}const blend=immediate||!cameraInitialized?1:1-Math.exp(-realDt*4);camera.position.lerp(desiredPos,blend);lookTarget.lerp(desiredTarget,blend);cameraInitialized=true;camera.lookAt(lookTarget);if(shake>0&&view!=='top'&&!paused){const a=shake*.18;camera.position.y+=Math.sin(elapsed*91)*a;camera.position.z+=Math.sin(elapsed*67)*a}camera.updateProjectionMatrix()}
function updatePlay(){document.getElementById('play').textContent=paused?'▶ Play':'Ⅱ Pause';document.getElementById('play').setAttribute('aria-label',paused?'Play simulation':'Pause simulation')}
function togglePlay(){paused=!paused;accumulator=0;lastReal=performance.now();updatePlay();if(paused&&status.textContent!=='SETTLED')status.textContent='PAUSED';else if(!paused)status.textContent=impacted?'DEBRIS SETTLING':'ACCELERATING'}
document.getElementById('play').onclick=togglePlay;document.getElementById('replay').onclick=()=>freshRun(readSettings());document.getElementById('apply').onclick=()=>{freshRun(readSettings());setPanel(false)};document.getElementById('defaults').onclick=()=>{for(const [k,v] of Object.entries(defaults))document.getElementById(k).value=v};document.getElementById('speed').onchange=e=>{speed=Number(e.target.value)};
function setPanel(open){document.getElementById('settings').hidden=!open;document.getElementById('settingsToggle').setAttribute('aria-expanded',String(open))}document.getElementById('settingsToggle').onclick=()=>setPanel(document.getElementById('settings').hidden);document.getElementById('closeSettings').onclick=()=>setPanel(false);
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{view=button.dataset.view;for(const b of document.querySelectorAll('[data-view]'))b.classList.toggle('active',b===button);positionCamera(true);document.getElementById('hint').textContent=view==='orbit'?'Drag to orbit · Scroll to zoom · SPACE to pause':'SPACE to pause · Replay rebuilds the experiment · 1/120 s physics'};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();togglePlay()}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);positionCamera(true)});
function frame(now){requestAnimationFrame(frame);const dt=Math.max(0,Math.min((now-lastReal)/1000,.1));lastReal=now;if(!paused){accumulator=Math.min(accumulator+dt*speed,STEP*MAX_STEPS);let steps=0;while(accumulator>=STEP&&steps<MAX_STEPS&&!paused){physicsStep();accumulator-=STEP;steps++}syncGraphics()}positionCamera(false,dt);document.getElementById('velocity').textContent=main.body.velocity.length().toFixed(1);document.getElementById('clock').textContent=elapsed.toFixed(2);document.getElementById('broken').textContent=broken;renderer.render(scene,camera)}
try{freshRun({...defaults});requestAnimationFrame(frame)}catch(error){const el=document.getElementById('error');el.style.display='block';el.textContent='Unable to initialize the experiment. '+error.message;document.getElementById('loading').style.display='none';console.error(error)}
