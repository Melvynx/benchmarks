<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini 4 Argon</title>
  <style>
    :root {
      --bg-panel: rgba(13, 16, 23, 0.84);
      --bg-panel-solid: #11151f;
      --border-glass: rgba(255, 255, 255, 0.13);
      --text-main: #f3f6fc;
      --text-muted: #94a0b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090c12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top HUD Bar */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-group {
       pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 7px 13px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ffffff;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border-glass);
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .telemetry span strong {
      color: var(--text-main);
      font-weight: 600;
      margin-left: 3px;
    }

    /* Segmented buttons (Camera & Speed) */
    .segmented {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 8px;
    }

    .seg-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-right: 6px;
      margin-left: 4px;
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.14s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 13px;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 14px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Bottom Playback Bar */
    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 7px 12px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
    }

    /* Settings Drawer */
    .settings-panel {
      position: fixed;
      top: 62px;
      right: 16px;
      bottom: 72px;
      width: 310px;
      max-height: calc(100vh - 140px);
      z-index: 12;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    .settings-panel.collapsed {
      transform: translateX(340px);
      opacity: 0;
      pointer-events: none;
    }

    .settings-header {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .settings-body {
      padding: 10px 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-body::-webkit-scrollbar {
      width: 5px;
    }

    .settings-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .settings-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-hover);
      margin-bottom: 6px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field.full {
      grid-column: span 2;
    }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .field label span.unit {
      color: rgba(148, 160, 184, 0.65);
      font-size: 10px;
    }

    .field input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 5px 8px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .field input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .settings-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-glass);
      display: flex;
      gap: 8px;
    }

    .settings-footer .btn {
      flex: 1;
      padding: 7px 10px;
    }

    @media (max-width: 900px) {
      .telemetry {
        display: none;
      }
      .settings-panel {
        width: 280px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top HUD Bar -->
  <header class="top-bar">
    <div class="hud-group">
      <h1 class="brand-title">Gemini 4 Argon</h1>
      <div class="divider"></div>
      <div class="telemetry">
        <span>Speed <strong id="hud-speed">0.0 m/s</strong></span>
        <span>Time <strong id="hud-time">0.00 s</strong></span>
        <span>Debris <strong id="hud-debris">0</strong></span>
      </div>
    </div>

    <div class="hud-group">
      <span class="seg-label">Camera</span>
      <div class="segmented" id="camera-switcher">
        <button type="button" class="btn active" data-cam="impact">Impact</button>
        <button type="button" class="btn" data-cam="follow">Follow</button>
        <button type="button" class="btn" data-cam="top">Top</button>
        <button type="button" class="btn" data-cam="orbit">Orbit</button>
      </div>
      <div class="divider"></div>
      <button type="button" class="btn btn-action" id="btn-toggle-settings">Settings</button>
    </div>
  </header>

  <!-- Settings Panel -->
  <aside class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <span>Simulation Parameters</span>
      <button type="button" class="btn" id="btn-close-settings" style="padding:2px 6px;">✕</button>
    </div>
    <div class="settings-body">
      <div>
        <div class="settings-section-title">Vehicle Dynamics &amp; Dimensions</div>
        <div class="settings-grid">
          <div class="field">
            <label for="inp-impactSpeed">Impact Speed <span class="unit">m/s</span></label>
            <input type="number" id="inp-impactSpeed" min="3" max="60" step="0.5" value="22" />
          </div>
          <div class="field">
            <label for="inp-carMass">Car Mass <span class="unit">kg</span></label>
            <input type="number" id="inp-carMass" min="300" max="5000" step="25" value="1250" />
          </div>
          <div class="field">
            <label for="inp-carLength">Car Length <span class="unit">m</span></label>
            <input type="number" id="inp-carLength" min="2.8" max="6.5" step="0.1" value="4.2" />
          </div>
          <div class="field">
            <label for="inp-carWidth">Car Width <span class="unit">m</span></label>
            <input type="number" id="inp-carWidth" min="1.3" max="2.6" step="0.05" value="1.8" />
          </div>
          <div class="field full">
            <label for="inp-carHeight">Car Height <span class="unit">m</span></label>
            <input type="number" id="inp-carHeight" min="1.05" max="2.3" step="0.05" value="1.45" />
          </div>
        </div>
      </div>

      <div>
        <div class="settings-section-title">Masonry Wall Structure</div>
        <div class="settings-grid">
          <div class="field">
            <label for="inp-wallCols">Wall Columns <span class="unit">bricks</span></label>
            <input type="number" id="inp-wallCols" min="4" max="22" step="1" value="12" />
          </div>
          <div class="field">
            <label for="inp-wallRows">Wall Rows <span class="unit">bricks</span></label>
            <input type="number" id="inp-wallRows" min="3" max="16" step="1" value="8" />
          </div>
          <div class="field">
            <label for="inp-wallDepth">Wall Depth <span class="unit">layers</span></label>
            <input type="number" id="inp-wallDepth" min="1" max="5" step="1" value="2" />
          </div>
          <div class="field">
            <label for="inp-brickMass">Brick Mass <span class="unit">kg</span></label>
            <input type="number" id="inp-brickMass" min="0.4" max="35" step="0.1" value="2.5" />
          </div>
          <div class="field">
            <label for="inp-brickWidth">Brick Width <span class="unit">m</span></label>
            <input type="number" id="inp-brickWidth" min="0.2" max="1.0" step="0.02" value="0.50" />
          </div>
          <div class="field">
            <label for="inp-brickHeight">Brick Height <span class="unit">m</span></label>
            <input type="number" id="inp-brickHeight" min="0.1" max="0.6" step="0.02" value="0.24" />
          </div>
          <div class="field full">
            <label for="inp-brickDepth">Brick Depth <span class="unit">m</span></label>
            <input type="number" id="inp-brickDepth" min="0.1" max="0.6" step="0.02" value="0.20" />
          </div>
        </div>
      </div>

      <div>
        <div class="settings-section-title">Environment &amp; Contact Physics</div>
        <div class="settings-grid">
          <div class="field">
            <label for="inp-gravity">Gravity <span class="unit">m/s²</span></label>
            <input type="number" id="inp-gravity" min="1" max="30" step="0.01" value="9.81" />
          </div>
          <div class="field">
            <label for="inp-trackLength">Track Length <span class="unit">m</span></label>
            <input type="number" id="inp-trackLength" min="20" max="90" step="1" value="40" />
          </div>
          <div class="field">
            <label for="inp-brickFriction">Brick Friction</label>
            <input type="number" id="inp-brickFriction" min="0.05" max="1.5" step="0.01" value="0.72" />
          </div>
          <div class="field">
            <label for="inp-brickRestitution">Brick Restitution</label>
            <input type="number" id="inp-brickRestitution" min="0.0" max="0.95" step="0.01" value="0.18" />
          </div>
          <div class="field full">
            <label for="inp-groundFriction">Ground Friction</label>
            <input type="number" id="inp-groundFriction" min="0.05" max="1.5" step="0.01" value="0.85" />
          </div>
        </div>
      </div>
    </div>
    <div class="settings-footer">
      <button type="button" class="btn btn-action" id="btn-reset-defaults">Reset</button>
      <button type="button" class="btn btn-primary" id="btn-apply-settings">Apply</button>
    </div>
  </aside>

  <!-- Bottom Compact Playback Bar -->
  <nav class="bottom-bar">
    <button type="button" class="btn btn-primary" id="btn-play-pause" style="min-width: 82px;">Pause</button>
    <button type="button" class="btn btn-action" id="btn-replay">Replay</button>
    <div class="divider"></div>
    <span class="seg-label">Speed</span>
    <div class="segmented" id="speed-switcher">
      <button type="button" class="btn" data-speed="0.25">0.25×</button>
      <button type="button" class="btn" data-speed="0.5">0.5×</button>
      <button type="button" class="btn active" data-speed="1">1×</button>
      <button type="button" class="btn" data-speed="2">2×</button>
    </div>
  </nav>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as CANNON from 'cannon-es';

    // =========================================================================
    // 1. MANDATORY DEFAULT EXPERIMENT VALUES
    // =========================================================================
    const MANDATORY_DEFAULTS = Object.freeze({
      impactSpeed: 22,
      carMass: 1250,
      carLength: 4.2,
      carWidth: 1.8,
      carHeight: 1.45,
      wallCols: 12,
      wallRows: 8,
      wallDepth: 2,
      brickMass: 2.5,
      brickWidth: 0.50,
      brickHeight: 0.24,
      brickDepth: 0.20,
      gravity: 9.81,
      brickFriction: 0.72,
      brickRestitution: 0.18,
      groundFriction: 0.85,
      trackLength: 40
    });

    // Collision filter bitmasks (prevents attached car parts from self-colliding prior to detachment)
    const GROUP_GROUND = 1;
    const GROUP_BRICK = 2;
    const GROUP_CAR_ATTACHED = 4;
    const GROUP_CAR_DETACHED = 8;
    const GROUP_SHARD = 16;

    // Seeded PRNG for strictly visual textures & particles (never touches physics)
    function createSeededRandom(seed = 1337) {
      let s = seed >>> 0;
      return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // =========================================================================
    // 2. RENDERER, SCENE, CAMERAS & LIGHTING SETUP
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x8fa7c4, 0.0045);

    // Generate procedural IBL environment with RoomEnvironment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    const envTexture = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environment = envTexture;
    roomEnv.dispose();

    // Sky Dome
    function createSkyDome() {
      const skyGeo = new THREE.SphereGeometry(260, 32, 20);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x28568f) },
          horizonColor: { value: new THREE.Color(0xa6bfd8) },
          groundColor: { value: new THREE.Color(0x4b5563) },
          sunDir: { value: new THREE.Vector3(0.45, 0.65, 0.61).normalize() }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPos;
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 groundColor;
          uniform vec3 sunDir;
          void main() {
            vec3 d = normalize(vWorldPos);
            float h = d.y;
            vec3 col = mix(horizonColor, topColor, pow(clamp(h, 0.0, 1.0), 0.55));
            col = mix(col, groundColor, clamp(-h * 3.0, 0.0, 1.0));
            float sunAmt = max(dot(d, sunDir), 0.0);
            col += vec3(1.0, 0.9, 0.7) * pow(sunAmt, 36.0) * 0.45;
            col += vec3(1.0, 0.96, 0.85) * smoothstep(0.9985, 0.9998, sunAmt) * 2.5;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      return new THREE.Mesh(skyGeo, skyMat);
    }
    scene.add(createSkyDome());

    // Main Sun Directional Light with tight 2048 PCFSoftShadowMap
    const sunLight = new THREE.DirectionalLight(0xfff5e4, 3.2);
    sunLight.position.set(18, 28, 22);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 4;
    sunLight.shadow.camera.far = 90;
    sunLight.shadow.camera.left = -28;
    sunLight.shadow.camera.right = 24;
    sunLight.shadow.camera.top = 14;
    sunLight.shadow.camera.bottom = -14;
    sunLight.shadow.bias = -0.00035;
    sunLight.shadow.normalBias = 0.014;
    scene.add(sunLight);
    scene.add(sunLight.target);

    const hemiLight = new THREE.HemisphereLight(0xb8d4ff, 0x3b3834, 0.55);
    scene.add(hemiLight);

    // Camera and OrbitControls
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 450);
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.07;
    orbitControls.maxPolarAngle = Math.PI * 0.49;
    orbitControls.minDistance = 2.0;
    orbitControls.maxDistance = 90.0;
    orbitControls.enabled = false;

    // =========================================================================
    // 3. PROCEDURAL PBR TEXTURES & SHARED MATERIALS
    // =========================================================================
    function createAsphaltTextures() {
      const rng = createSeededRandom(404);
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const grain = (rng() - 0.5) * 34 + (rng() > 0.92 ? 22 : 0);
        const base = Math.max(20, Math.min(85, 42 + grain));
        data[i] = base;
        data[i + 1] = base + 1;
        data[i + 2] = base + 4;
        data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBrickBumpTexture() {
      const rng = createSeededRandom(909);
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.floor(105 + (rng() - 0.5) * 90);
        img.data[i] = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createContactBlobTexture() {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.72)');
      grad.addColorStop(0.55, 'rgba(0, 0, 0, 0.34)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    const asphaltTex = createAsphaltTextures();
    const brickBumpTex = createBrickBumpTexture();
    const contactBlobTex = createContactBlobTexture();

    const MATERIALS = {
      asphalt: new THREE.MeshStandardMaterial({
        map: asphaltTex,
