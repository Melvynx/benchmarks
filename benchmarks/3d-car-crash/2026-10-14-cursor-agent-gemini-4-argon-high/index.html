    // =========================================================================
    // 5. TRACK & ENVIRONMENT BUILDER (MERGED STATIC MESHES)
    // =========================================================================
    function buildTrackAndEnvironment(cfg) {
      const L = cfg.trackLength;
      wallX = L * 0.28;
      carStartX = -L * 0.42;

      const trackWidth = Math.max(9.0, cfg.wallCols * cfg.brickWidth + 3.2);
      const totalPavedLen = L + 34;
      const centerPavedX = (carStartX + wallX) * 0.5 + 4;

      // Update sun shadow camera frustum tightly around track, car, and wall
      sunLight.target.position.set(wallX - 2, 0, 0);
      sunLight.position.set(wallX + 14, 26, 20);
      sunLight.shadow.camera.left = -(L * 0.72 + 6);
      sunLight.shadow.camera.right = 22;
      sunLight.shadow.camera.top = Math.max(12, trackWidth * 1.1);
      sunLight.shadow.camera.bottom = -Math.max(12, trackWidth * 1.1);
      sunLight.shadow.camera.updateProjectionMatrix();

      // Ground grass plane
      const grassGeo = new THREE.PlaneGeometry(420, 420);
      grassGeo.rotateX(-Math.PI / 2);
      const grassMesh = new THREE.Mesh(grassGeo, MATERIALS.shoulderGrass);
      grassMesh.position.y = -0.02;
      grassMesh.receiveShadow = true;
      simGroup.add(grassMesh);

      // Gravel apron around track
      const gravelGeo = new THREE.PlaneGeometry(totalPavedLen + 16, trackWidth + 7);
      gravelGeo.rotateX(-Math.PI / 2);
      const gravelMesh = new THREE.Mesh(gravelGeo, MATERIALS.shoulderGravel);
      gravelMesh.position.set(centerPavedX, -0.01, 0);
      gravelMesh.receiveShadow = true;
      simGroup.add(gravelMesh);

      // Main Asphalt surface
      asphaltTex.repeat.set(totalPavedLen / 3.5, trackWidth / 3.5);
      const roadGeo = new THREE.PlaneGeometry(totalPavedLen, trackWidth);
      roadGeo.rotateX(-Math.PI / 2);
      const roadMesh = new THREE.Mesh(roadGeo, MATERIALS.asphalt);
      roadMesh.position.set(centerPavedX, 0, 0);
      roadMesh.receiveShadow = true;
      simGroup.add(roadMesh);

      // Lane markings & start box (instanced for single draw call)
      const dashCount = Math.floor(totalPavedLen / 3.2);
      const lineInstances = dashCount + 4;
      const unitPlane = new THREE.PlaneGeometry(1, 1);
      unitPlane.rotateX(-Math.PI / 2);
      const markingsInst = new THREE.InstancedMesh(unitPlane, MATERIALS.laneLine, lineInstances);
      markingsInst.receiveShadow = true;

      const dummy = new THREE.Object3D();
      let idx = 0;
      // Side continuous lines
      const startXEdge = centerPavedX - totalPavedLen / 2;
      dummy.position.set(centerPavedX, 0.003, -trackWidth * 0.45);
      dummy.scale.set(totalPavedLen - 2, 1, 0.14);
      dummy.updateMatrix();
      markingsInst.setMatrixAt(idx++, dummy.matrix);

      dummy.position.set(centerPavedX, 0.003, trackWidth * 0.45);
      dummy.scale.set(totalPavedLen - 2, 1, 0.14);
      dummy.updateMatrix();
      markingsInst.setMatrixAt(idx++, dummy.matrix);

      // Start gate line & target impact line
      dummy.position.set(carStartX + cfg.carLength * 0.55, 0.004, 0);
      dummy.scale.set(0.35, 1, trackWidth * 0.88);
      dummy.updateMatrix();
      markingsInst.setMatrixAt(idx++, dummy.matrix);

      dummy.position.set(wallX - (cfg.wallDepth * cfg.brickDepth) * 0.5 - 0.25, 0.004, 0);
      dummy.scale.set(0.22, 1, trackWidth * 0.88);
      dummy.updateMatrix();
      markingsInst.setMatrixAt(idx++, dummy.matrix);

      for (let i = 0; i < dashCount; i++) {
        dummy.position.set(startXEdge + 2 + i * 3.2, 0.003, 0);
        dummy.scale.set(1.45, 1, 0.12);
        dummy.updateMatrix();
        markingsInst.setMatrixAt(idx++, dummy.matrix);
      }
      markingsInst.instanceMatrix.needsUpdate = true;
      simGroup.add(markingsInst);

      // Red & White Racing Curbs along both track edges
      const curbSegLen = 1.25;
      const curbSegCount = Math.floor(totalPavedLen / curbSegLen);
      const curbGeo = new THREE.BoxGeometry(curbSegLen, 0.05, 0.42);
      const curbRedInst = new THREE.InstancedMesh(curbGeo, MATERIALS.curbRed, curbSegCount + 2);
      const curbWhiteInst = new THREE.InstancedMesh(curbGeo, MATERIALS.curbWhite, curbSegCount + 2);
      curbRedInst.receiveShadow = true;
      curbWhiteInst.receiveShadow = true;

      let rIdx = 0;
      let wIdx = 0;
      const curbZ = trackWidth * 0.5 + 0.18;
      for (let side of [-1, 1]) {
        for (let i = 0; i < curbSegCount; i++) {
          dummy.position.set(startXEdge + (i + 0.5) * curbSegLen, 0.025, side * curbZ);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          if (i % 2 === 0) {
            curbRedInst.setMatrixAt(rIdx++, dummy.matrix);
          } else {
            curbWhiteInst.setMatrixAt(wIdx++, dummy.matrix);
          }
        }
      }
      curbRedInst.count = rIdx;
      curbWhiteInst.count = wIdx;
      curbRedInst.instanceMatrix.needsUpdate = true;
      curbWhiteInst.instanceMatrix.needsUpdate = true;
      simGroup.add(curbRedInst, curbWhiteInst);

      // Background Trackside Guardrails & Light Poles (on far -Z side so camera view is unobstructed)
      const barrierZ = -trackWidth * 0.5 - 2.2;
      const railGeo = new THREE.BoxGeometry(totalPavedLen, 0.34, 0.12);
      const railMesh = new THREE.Mesh(railGeo, MATERIALS.barrierMetal);
      railMesh.position.set(centerPavedX, 0.62, barrierZ);
      railMesh.receiveShadow = true;
      simGroup.add(railMesh);

      const postCount = Math.floor(totalPavedLen / 4.0);
      const postGeo = new THREE.BoxGeometry(0.12, 0.85, 0.12);
      const postInst = new THREE.InstancedMesh(postGeo, MATERIALS.barrierMetal, postCount);
      for (let i = 0; i < postCount; i++) {
        dummy.position.set(startXEdge + i * 4.0 + 2.0, 0.42, barrierZ - 0.08);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        postInst.setMatrixAt(i, dummy.matrix);
      }
      postInst.instanceMatrix.needsUpdate = true;
      simGroup.add(postInst);

      // Distance marker boards along far -Z edge (10m intervals)
      const poleCount = 4;
      const poleGeo = new THREE.CylinderGeometry(0.09, 0.12, 7.5, 8);
      const poleInst = new THREE.InstancedMesh(poleGeo, MATERIALS.barrierMetal, poleCount);
      for (let i = 0; i < poleCount; i++) {
        const px = carStartX + (i / (poleCount - 1)) * (L + 10);
        dummy.position.set(px, 3.75, barrierZ - 1.5);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        poleInst.setMatrixAt(i, dummy.matrix);
      }
      poleInst.instanceMatrix.needsUpdate = true;
      simGroup.add(poleInst);
    }

    // =========================================================================
    // 6. FREESTANDING RUNNING-BOND BRICK WALL BUILDER
    // =========================================================================
    function buildBrickWall(cfg, brickPhysMat) {
      brickEntities = [];
      const cols = Math.max(2, Math.round(cfg.wallCols));
      const rows = Math.max(2, Math.round(cfg.wallRows));
      const depth = Math.max(1, Math.round(cfg.wallDepth));

      const bW = cfg.brickWidth;  // width across track (Z)
      const bH = cfg.brickHeight; // height (Y)
      const bD = cfg.brickDepth;  // depth along track (X)
      const bMass = cfg.brickMass;

      // Visible mortar gaps: slightly smaller visual brick shell around mortar core
      const mortarGap = Math.min(0.012, Math.min(bW, bH, bD) * 0.06);
      const outerGeo = new THREE.BoxGeometry(bD - mortarGap, bH - mortarGap, bW - mortarGap);
      const mortarGeo = new THREE.BoxGeometry(bD - mortarGap * 0.25, bH, bW - mortarGap * 0.25);

      // Physics half-extents: exact vertical stacking, tiny 3mm horizontal gap to prevent pre-impact side stress
      const physGapXZ = 0.003;
      const shape = new CANNON.Box(new CANNON.Vec3(bD * 0.5, bH * 0.5, bW * 0.5));

      const stepX = bD + physGapXZ;
      const stepZ = bW + physGapXZ;

      const grid = new Map();
      const key = (r, c, d) => `${r}:${c}:${d}`;

      for (let d = 0; d < depth; d++) {
        const x = wallX + (d - (depth - 1) * 0.5) * stepX;
        for (let r = 0; r < rows; r++) {
          const y = (r + 0.5) * bH;
          // Staggered running bond on odd rows, plus subtle layer offset
          const staggerZ = ((r % 2 === 1) ? 0.5 : 0.0) * stepZ - 0.25 * stepZ;

          for (let c = 0; c < cols; c++) {
            const z = (c - (cols - 1) * 0.5) * stepZ + staggerZ;

            const body = new CANNON.Body({
              mass: bMass,
              material: brickPhysMat,
              linearDamping: 0.04,
              angularDamping: 0.08,
              collisionFilterGroup: GROUP_BRICK,
              collisionFilterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_ATTACHED | GROUP_CAR_DETACHED | GROUP_SHARD
            });
            body.addShape(shape);
            body.position.set(x, y, z);
            body.prevPos = body.position.clone();
            body.prevQuat = body.quaternion.clone();
            world.addBody(body);

            const matIdx = (r * 17 + c * 31 + d * 13) % MATERIALS.brickVariants.length;
            const meshGroup = new THREE.Group();
            const brickMesh = new THREE.Mesh(outerGeo, MATERIALS.brickVariants[matIdx]);
            brickMesh.castShadow = true;
            brickMesh.receiveShadow = true;
            meshGroup.add(brickMesh);

            const mortarMesh = new THREE.Mesh(mortarGeo, MATERIALS.mortar);
            mortarMesh.receiveShadow = true;
            meshGroup.add(mortarMesh);

            meshGroup.position.copy(body.position);
            simGroup.add(meshGroup);

            // Structural mortar bond health scaled by brickMass and brickFriction
            const baseBond = bMass * (1.8 + cfg.brickFriction * 2.5) * (r === 0 ? 1.5 : 1.0);
            const entity = {
              body,
              mesh: meshGroup,
              row: r,
              col: c,
              layer: d,
              halfH: bH * 0.5,
              footprintX: bD * 1.35,
              footprintZ: bW * 1.35,
              restPos: new CANNON.Vec3(x, y, z),
              mortarIntact: true,
              mortarHealth: baseBond,
              neighbors: [],
              lowerSupports: []
            };

            brickEntities.push(entity);
            allPhysicsEntries.push(entity);
            grid.set(key(r, c, d), entity);
          }
        }
      }

      // Wire running-bond neighbor & lower-support references for masonry crack propagation
      for (const b of brickEntities) {
        const { row: r, col: c, layer: d } = b;
        const candidates = [
          grid.get(key(r, c - 1, d)),
          grid.get(key(r, c + 1, d)),
          grid.get(key(r - 1, c, d)),
          grid.get(key(r + 1, c, d)),
          grid.get(key(r, c, d - 1)),
          grid.get(key(r, c, d + 1)),
          grid.get(key(r - 1, c + (r % 2 === 1 ? 1 : -1), d)),
          grid.get(key(r + 1, c + (r % 2 === 1 ? 1 : -1), d))
        ];
        for (const nb of candidates) {
          if (nb) {
            b.neighbors.push(nb);
            if (nb.row === r - 1 && nb.layer === d) {
              b.lowerSupports.push(nb);
            }
          }
        }
      }
    }

    // =========================================================================
    // 7. DESTRUCTIBLE MULTI-BODY CAR BUILDER
    // =========================================================================
    function buildDestructibleCar(cfg, carPhysMat, wheelPhysMat) {
      const L = cfg.carLength;
      const W = cfg.carWidth;
      const H = cfg.carHeight;
      const M = cfg.carMass;

      const wheelR = H * 0.235;
      const wheelW = W * 0.145;
      const beltY = H * 0.56;
      const startX = carStartX;

      // Normalized mass shares summing exactly to 1.000 * M
      const massWeights = {
        chassis: 0.42,
        engineBay: 0.16,
        frontClip: 0.08,
        frontBumper: 0.025,
        rearBumper: 0.02,
        hood: 0.03,
        trunk: 0.025,
        fender: 0.015,  // x2 = 0.03
        door: 0.0225,   // x4 = 0.09
        shard: 0.0016667, // x12 = 0.02
        wheel: 0.025    // x4 = 0.10
      };

      const parts = {};
      const constraints = [];
      const glassShards = [];

      function addCarPart(name, massFraction, localPos, shape, mesh, isGlass = false) {
        const body = new CANNON.Body({
          mass: M * massFraction,
          material: name.startsWith('wheel') ? wheelPhysMat : carPhysMat,
          linearDamping: 0.02,
          angularDamping: 0.06,
          collisionFilterGroup: GROUP_CAR_ATTACHED,
          collisionFilterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_DETACHED | GROUP_SHARD
        });

        if (Array.isArray(shape)) {
          for (const s of shape) {
            body.addShape(s.shape, s.offset, s.orientation);
          }
        } else {
          body.addShape(shape);
        }

        body.position.set(startX + localPos.x, localPos.y, localPos.z);
        if (localPos.rotZ) {
          body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), localPos.rotZ);
        }
        body.prevPos = body.position.clone();
        body.prevQuat = body.quaternion.clone();
        world.addBody(body);

        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
        simGroup.add(mesh);

        const entry = {
          name,
          body,
          mesh,
          localPos: new THREE.Vector3(localPos.x, localPos.y, localPos.z),
          halfH: localPos.halfH || 0.2,
          footprintX: localPos.fpX || 0.6,
          footprintZ: localPos.fpZ || 0.6,
          detached: false,
          isGlass
        };
        parts[name] = entry;
        allPhysicsEntries.push(entry);
        return entry;
      }

      // 1. CABIN / REAR CHASSIS CORE
      const chassisMesh = new THREE.Group();
      // Lower body tub & rear quarters
      const tubGeo = new THREE.BoxGeometry(L * 0.60, H * 0.34, W * 0.88);
      const tubMesh = new THREE.Mesh(tubGeo, MATERIALS.carPaint);
      tubMesh.castShadow = true;
      tubMesh.receiveShadow = true;
      chassisMesh.add(tubMesh);

      // Rear Quarter panels
      for (const side of [-1, 1]) {
        const rqGeo = new THREE.BoxGeometry(L * 0.28, H * 0.35, W * 0.07);
        const rqMesh = new THREE.Mesh(rqGeo, MATERIALS.carPaint);
        rqMesh.position.set(-L * 0.18, H * 0.02, side * W * 0.455);
        rqMesh.castShadow = true;
        rqMesh.receiveShadow = true;
        chassisMesh.add(rqMesh);
      }

      // Roof & A/B/C Pillars
      const roofGeo = new THREE.BoxGeometry(L * 0.36, H * 0.045, W * 0.78);
      const roofMesh = new THREE.Mesh(roofGeo, MATERIALS.carPaint);
      roofMesh.position.set(-L * 0.02, H * 0.54, 0);
      roofMesh.castShadow = true;
      roofMesh.receiveShadow = true;
      chassisMesh.add(roofMesh);

      // Roof racing stripe
      const stripeGeo = new THREE.BoxGeometry(L * 0.35, H * 0.05, W * 0.16);
      const stripeMesh = new THREE.Mesh(stripeGeo, MATERIALS.carAccentPaint);
      stripeMesh.position.set(-L * 0.02, H * 0.542, 0);
      chassisMesh.add(stripeMesh);

      // Pillars (A, B, C)
      const pillarMat = MATERIALS.carTrimDark;
      for (const side of [-1, 1]) {
        const zP = side * W * 0.39;
        // A-pillar
        const aPillar = new THREE.Mesh(new THREE.BoxGeometry(0.06, H * 0.42, 0.06), MATERIALS.carPaint);
        aPillar.position.set(L * 0.21, H * 0.35, zP);
        aPillar.rotation.z = 0.58;
        aPillar.castShadow = true;
        chassisMesh.add(aPillar);

        // B-pillar
        const bPillar = new THREE.Mesh(new THREE.BoxGeometry(0.07, H * 0.36, 0.05), pillarMat);
        bPillar.position.set(-L * 0.01, H * 0.36, zP);
        bPillar.castShadow = true;
        chassisMesh.add(bPillar);

        // C-pillar
        const cPillar = new THREE.Mesh(new THREE.BoxGeometry(0.09, H * 0.42, 0.06), MATERIALS.carPaint);
        cPillar.position.set(-L * 0.23, H * 0.35, zP);
        cPillar.rotation.z = -0.58;
        cPillar.castShadow = true;
        chassisMesh.add(cPillar);
      }

      // Interior Seats, Dashboard & Steering Wheel (visible inside cabin)
      const dashMesh = new THREE.Mesh(new THREE.BoxGeometry(L * 0.12, H * 0.22, W * 0.78), MATERIALS.carInterior);
      dashMesh.position.set(L * 0.22, H * 0.16, 0);
      chassisMesh.add(dashMesh);

      for (const side of [-1, 1]) {
        const seatBase = new THREE.Mesh(new THREE.BoxGeometry(L * 0.14, H * 0.28, W * 0.26), MATERIALS.carInterior);
        seatBase.position.set(L * 0.04, H * 0.18, side * W * 0.21);
        seatBase.castShadow = true;
        chassisMesh.add(seatBase);
      }

      // Taillight bar on rear deck
      const tailGeo = new THREE.BoxGeometry(0.05, H * 0.08, W * 0.82);
      const tailMesh = new THREE.Mesh(tailGeo, MATERIALS.taillight);
      tailMesh.position.set(-L * 0.31, H * 0.12, 0);
      chassisMesh.add(tailMesh);

      const chassisShapes = [
        {
          shape: new CANNON.Box(new CANNON.Vec3(L * 0.30, H * 0.17, W * 0.44)),
          offset: new CANNON.Vec3(0, 0, 0)
        },
        {
          shape: new CANNON.Box(new CANNON.Vec3(L * 0.18, H * 0.19, W * 0.38)),
          offset: new CANNON.Vec3(-L * 0.02, H * 0.36, 0)
        },
        // Smooth low-profile runner skids so intact car glides smoothly atwheel height
        {
          shape: new CANNON.Box(new CANNON.Vec3(L * 0.28, 0.04, W * 0.36)),
          offset: new CANNON.Vec3(0, -(wheelR + H * 0.04 - 0.04), 0)
        }
      ];

      const chassisPart = addCarPart(
        'chassis',
        massWeights.chassis,
        { x: -L * 0.12, y: wheelR + H * 0.04, z: 0, halfH: H * 0.22, fpX: L * 0.65, fpZ: W * 0.95 },
        chassisShapes,
        chassisMesh
      );

      // 2. MID-FRONT ENGINE BAY SUBFRAME
      const engineMesh = new THREE.Group();
      const bayBox = new THREE.Mesh(new THREE.BoxGeometry(L * 0.20, H * 0.28, W * 0.72), MATERIALS.carTrimDark);
      bayBox.castShadow = true;
      bayBox.receiveShadow = true;
      engineMesh.add(bayBox);

      const blockMesh = new THREE.Mesh(new THREE.BoxGeometry(L * 0.14, H * 0.22, W * 0.42), MATERIALS.carEngineMetal);
      blockMesh.position.set(0, H * 0.08, 0);
      blockMesh.castShadow = true;
      engineMesh.add(blockMesh);

      const engineShapes = [
        {
          shape: new CANNON.Box(new CANNON.Vec3(L * 0.10, H * 0.14, W * 0.36)),
          offset: new CANNON.Vec3(0, 0, 0)
        },
        {
          shape: new CANNON.Box(new CANNON.Vec3(L * 0.09, 0.04, W * 0.34)),
          offset: new CANNON.Vec3(0, -(wheelR + H * 0.02 - 0.04), 0)
        }
      ];

      const engineBayPart = addCarPart(
        'engineBay',
        massWeights.engineBay,
        { x: L * 0.24, y: wheelR + H * 0.02, z: 0, halfH: H * 0.16, fpX: L * 0.26, fpZ: W * 0.8 },
        engineShapes,
        engineMesh
      );

      // 3. FRONT CRUMPLE CLIP (Radiator support, crash bar & headlights)
      const frontClipMesh = new THREE.Group();
      const noseCore = new THREE.Mesh(new THREE.BoxGeometry(L * 0.13, H * 0.26, W * 0.80), MATERIALS.carPaint);
      noseCore.castShadow = true;
      noseCore.receiveShadow = true;
      frontClipMesh.add(noseCore);

      const radiator = new THREE.Mesh(new THREE.BoxGeometry(L * 0.06, H * 0.22, W * 0.56), MATERIALS.carEngineMetal);
      radiator.position.set(L * 0.04, 0, 0);
      frontClipMesh.add(radiator);

      for (const side of [-1, 1]) {
        const hl = new THREE.Mesh(new THREE.BoxGeometry(0.05, H * 0.09, W * 0.20), MATERIALS.headlight);
        hl.position.set(L * 0.055, H * 0.05, side * W * 0.30);
        frontClipMesh.add(hl);
      }

      const frontClipPart = addCarPart(
        'frontClip',
        massWeights.frontClip,
        { x: L * 0.39, y: wheelR + H * 0.02, z: 0, halfH: H * 0.14, fpX: L * 0.18, fpZ: W * 0.85 },
        new CANNON.Box(new CANNON.Vec3(L * 0.065, H * 0.13, W * 0.40)),
        frontClipMesh
      );

      // 4. FRONT BUMPER
      const fBumperMesh = new THREE.Group();
      const fbMain = new THREE.Mesh(new THREE.BoxGeometry(L * 0.065, H * 0.21, W * 0.96), MATERIALS.carPaint);
      fbMain.castShadow = true;
      fbMain.receiveShadow = true;
      fBumperMesh.add(fbMain);

      const fbGrille = new THREE.Mesh(new THREE.BoxGeometry(L * 0.07, H * 0.11, W * 0.58), MATERIALS.carTrimDark);
      fbGrille.position.set(0.005, -H * 0.02, 0);
      fBumperMesh.add(fbGrille);

      const frontBumperPart = addCarPart(
        'frontBumper',
        massWeights.frontBumper,
        { x: L * 0.475, y: wheelR * 0.95, z: 0, halfH: H * 0.11, fpX: L * 0.12, fpZ: W * 0.98 },
        new CANNON.Box(new CANNON.Vec3(L * 0.033, H * 0.105, W * 0.48)),
        fBumperMesh
      );

      // 5. REAR BUMPER
      const rBumperMesh = new THREE.Group();
      const rbMain = new THREE.Mesh(new THREE.BoxGeometry(L * 0.06, H * 0.21, W * 0.94), MATERIALS.carPaint);
      rbMain.castShadow = true;
      rbMain.receiveShadow = true;
      rBumperMesh.add(rbMain);

      const rbDiffuser = new THREE.Mesh(new THREE.BoxGeometry(L * 0.065, H * 0.08, W * 0.72), MATERIALS.carTrimDark);
      rbDiffuser.position.set(-0.004, -H * 0.05, 0);
      rBumperMesh.add(rbDiffuser);

      const rearBumperPart = addCarPart(
        'rearBumper',
        massWeights.rearBumper,
        { x: -L * 0.46, y: wheelR * 1.0, z: 0, halfH: H * 0.11, fpX: L * 0.12, fpZ: W * 0.96 },
        new CANNON.Box(new CANNON.Vec3(L * 0.03, H * 0.105, W * 0.47)),
        rBumperMesh
      );

      // 6. HOOD (with segmented geometry so it visibly buckles on impact)
      const hoodMesh = new THREE.Group();
      const hoodPanelGeo = new THREE.BoxGeometry(L * 0.31, H * 0.04, W * 0.84, 6, 1, 4);
      const hoodPanel = new THREE.Mesh(hoodPanelGeo, MATERIALS.carPaint);
      hoodPanel.castShadow = true;
      hoodPanel.receiveShadow = true;
      hoodMesh.add(hoodPanel);

      const hoodStripe = new THREE.Mesh(new THREE.BoxGeometry(L * 0.305, H * 0.044, W * 0.16, 6, 1, 1), MATERIALS.carAccentPaint);
      hoodMesh.add(hoodStripe);

      const hoodPart = addCarPart(
        'hood',
        massWeights.hood,
        { x: L * 0.29, y: beltY + H * 0.01, z: 0, rotZ: -0.05, halfH: 0.04, fpX: L * 0.33, fpZ: W * 0.86 },
        new CANNON.Box(new CANNON.Vec3(L * 0.155, H * 0.025, W * 0.42)),
        hoodMesh
      );
      hoodPart.deformGeos = [hoodPanelGeo, hoodStripe.geometry];

      // 7. TRUNK LID
      const trunkMesh = new THREE.Group();
      const trunkPanel = new THREE.Mesh(new THREE.BoxGeometry(L * 0.19, H * 0.045, W * 0.82), MATERIALS.carPaint);
      trunkPanel.castShadow = true;
      trunkPanel.receiveShadow = true;
      trunkMesh.add(trunkPanel);

      const spoiler = new THREE.Mesh(new THREE.BoxGeometry(L * 0.04, H * 0.06, W * 0.80), MATERIALS.carTrimDark);
      spoiler.position.set(-L * 0.075, H * 0.04, 0);
      trunkMesh.add(spoiler);

      const trunkPart = addCarPart(
        'trunk',
        massWeights.trunk,
        { x: -L * 0.35, y: beltY + H * 0.03, z: 0, halfH: 0.04, fpX: L * 0.21, fpZ: W * 0.84 },
        new CANNON.Box(new CANNON.Vec3(L * 0.095, H * 0.025, W * 0.41)),
        trunkMesh
      );

      // 8. FRONT LEFT & FRONT RIGHT FENDERS
      for (const [side, keyName] of [[-1, 'fenderFL'], [1, 'fenderFR']]) {
        const fMesh = new THREE.Group();
        const fSkin = new THREE.Mesh(new THREE.BoxGeometry(L * 0.27, H * 0.24, W * 0.055), MATERIALS.carPaint);
        fSkin.castShadow = true;
        fSkin.receiveShadow = true;
        fMesh.add(fSkin);

        addCarPart(
          keyName,
          massWeights.fender,
          { x: L * 0.29, y: wheelR + H * 0.12, z: side * W * 0.46, halfH: H * 0.12, fpX: L * 0.28, fpZ: 0.22 },
          new CANNON.Box(new CANNON.Vec3(L * 0.135, H * 0.12, W * 0.03)),
          fMesh
        );
      }

      // 9. FOUR DOORS (FL, FR, RL, RR)
      const doorConfigs = [
        { name: 'doorFL', x: L * 0.04, side: -1, isFront: true },
        { name: 'doorFR', x: L * 0.04, side: 1, isFront: true },
        { name: 'doorRL', x: -L * 0.16, side: -1, isFront: false },
        { name: 'doorRR', x: -L * 0.16, side: 1, isFront: false }
      ];

      for (const dc of doorConfigs) {
        const dMesh = new THREE.Group();
        const dSkin = new THREE.Mesh(new THREE.BoxGeometry(L * 0.195, H * 0.33, W * 0.055), MATERIALS.carPaint);
        dSkin.castShadow = true;
        dSkin.receiveShadow = true;
        dMesh.add(dSkin);

        const dCard = new THREE.Mesh(new THREE.BoxGeometry(L * 0.18, H * 0.30, W * 0.02), MATERIALS.carInterior);
        dCard.position.z = -dc.side * W * 0.025;
        dMesh.add(dCard);

        const handle = new THREE.Mesh(new THREE.BoxGeometry(L * 0.035, 0.022, 0.025), MATERIALS.carAccentPaint);
        handle.position.set(-L * 0.05, H * 0.06, dc.side * W * 0.032);
        dMesh.add(handle);

        if (dc.isFront) {
          const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.065, 0.12), MATERIALS.carPaint);
          mirror.position.set(L * 0.065, H * 0.18, dc.side * 0.07);
          mirror.castShadow = true;
          dMesh.add(mirror);
        }

        addCarPart(
          dc.name,
          massWeights.door,
          { x: dc.x, y: wheelR + H * 0.12, z: dc.side * W * 0.46, halfH: H * 0.165, fpX: L * 0.21, fpZ: 0.22 },
          new CANNON.Box(new CANNON.Vec3(L * 0.097, H * 0.165, W * 0.03)),
          dMesh
        );
      }

      // 10. WINDSHIELD & SIDE GLASS SHARDS (12 separate rigid bodies!)
      // 6 Windshield shards (3 columns x 2 rows)
      const wsShardW = (W * 0.74) / 3;
      const wsShardL = (H * 0.42) / 2;
      const wsGeo = new THREE.BoxGeometry(wsShardL * 0.96, 0.024, wsShardW * 0.96);

      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 3; col++) {
          const idx = row * 3 + col;
          const localX = L * 0.125 - (row - 0.5) * wsShardL * 0.72;
          const localY = beltY + H * 0.18 + (row - 0.5) * wsShardL * 0.62;
          const localZ = (col - 1) * wsShardW;

          const sMesh = new THREE.Mesh(wsGeo, MATERIALS.carGlass);
          sMesh.castShadow = true;
          sMesh.receiveShadow = true;

          const shard = addCarPart(
            `wsShard_${idx}`,
            massWeights.shard,
            { x: localX, y: localY, z: localZ, rotZ: -0.72, halfH: 0.02, fpX: 0.25, fpZ: 0.25 },
            new CANNON.Box(new CANNON.Vec3(wsShardL * 0.46, 0.02, wsShardW * 0.46)),
            sMesh,
            true
          );
          shard.shardRole = 'windshield';
          shard.shardIndex = idx;
          glassShards.push(shard);
        }
      }

      // 6 Side & Rear Window Shards
      const sideShardSpecs = [
        { x: L * 0.06, y: beltY + H * 0.16, z: -W * 0.41, w: L * 0.09, h: H * 0.22, role: 'sideFront' },
        { x: -L * 0.01, y: beltY + H * 0.16, z: -W * 0.41, w: L * 0.09, h: H * 0.22, role: 'sideFront' },
        { x: L * 0.06, y: beltY + H * 0.16, z: W * 0.41, w: L * 0.09, h: H * 0.22, role: 'sideFront' },
        { x: -L * 0.01, y: beltY + H * 0.16, z: W * 0.41, w: L * 0.09, h: H * 0.22, role: 'sideFront' },
        { x: -L * 0.15, y: beltY + H * 0.16, z: -W * 0.41, w: L * 0.15, h: H * 0.21, role: 'sideRear' },
        { x: -L * 0.15, y: beltY + H * 0.16, z: W * 0.41, w: L * 0.15, h: H * 0.21, role: 'sideRear' }
      ];

      sideShardSpecs.forEach((sp, i) => {
        const sg = new THREE.BoxGeometry(sp.w * 0.95, sp.h * 0.95, 0.024);
        const sm = new THREE.Mesh(sg, MATERIALS.carGlass);
        sm.castShadow = true;
        sm.receiveShadow = true;

        const shard = addCarPart(
          `sideShard_${i}`,
          massWeights.shard,
          { x: sp.x, y: sp.y, z: sp.z, halfH: sp.h * 0.45, fpX: sp.w, fpZ: 0.16 },
          new CANNON.Box(new CANNON.Vec3(sp.w * 0.46, sp.h * 0.46, 0.02)),
          sm,
          true
        );
        shard.shardRole = sp.role;
        shard.shardIndex = 6 + i;
        glassShards.push(shard);
      });

      // 11. FOUR WHEELS WITH VISIBLE RIMS, SPOKES, ROTORS & TIRES
      const wheelSpecs = [
        { name: 'wheelFL', x: L * 0.30, z: -W * 0.45, side: -1, isFront: true },
        { name: 'wheelFR', x: L * 0.30, z: W * 0.45, side: 1, isFront: true },
        { name: 'wheelRL', x: -L * 0.29, z: -W * 0.45, side: -1, isFront: false },
        { name: 'wheelRR', x: -L * 0.29, z: W * 0.45, side: 1, isFront: false }
      ];

      const cylShape = new CANNON.Cylinder(wheelR, wheelR, wheelW, 16);
      const cylQuat = new CANNON.Quaternion();
      cylQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2);

      for (const ws of wheelSpecs) {
        const wGroup = new THREE.Group();

        const tireGeo = new THREE.CylinderGeometry(wheelR, wheelR, wheelW, 24);
        tireGeo.rotateX(Math.PI / 2);
        const tireMesh = new THREE.Mesh(tireGeo, MATERIALS.tireRubber);
        tireMesh.castShadow = true;
        tireMesh.receiveShadow = true;
        wGroup.add(tireMesh);

        const rimGeo = new THREE.CylinderGeometry(wheelR * 0.66, wheelR * 0.66, wheelW * 1.03, 16);
        rimGeo.rotateX(Math.PI / 2);
        const rimMesh = new THREE.Mesh(rimGeo, MATERIALS.wheelRim);
        wGroup.add(rimMesh);

        // 5 spokes so wheel rotation is clearly visible
        for (let sp = 0; sp < 5; sp++) {
          const angle = (sp / 5) * Math.PI * 2;
          const spokeGeo = new THREE.BoxGeometry(wheelR * 1.22, wheelR * 0.14, wheelW * 1.06);
          const spoke = new THREE.Mesh(spokeGeo, MATERIALS.carTrimDark);
          spoke.rotation.z = angle;
          wGroup.add(spoke);
        }

        const caliper = new THREE.Mesh(
          new THREE.BoxGeometry(wheelR * 0.38, wheelR * 0.38, wheelW * 0.9),
          MATERIALS.brakeCaliper
        );
        caliper.position.set(-wheelR * 0.32, wheelR * 0.15, 0);
        wGroup.add(caliper);

        const wPart = addCarPart(
          ws.name,
          massWeights.wheel,
          { x: ws.x, y: wheelR, z: ws.z, halfH: wheelR, fpX: wheelR * 2.1, fpZ: wheelW * 1.5 },
          [{ shape: cylShape, offset: new CANNON.Vec3(0, 0, 0), orientation: cylQuat }],
          wGroup
        );
        // Attached wheels don't fight the ground runner skids until detached
        wPart.body.collisionFilterMask = GROUP_BRICK | GROUP_CAR_DETACHED | GROUP_SHARD;
        wPart.wheelR = wheelR;
        wPart.isFront = ws.isFront;
        wPart.side = ws.side;
      }

      // =====================================================================
      // BREAKABLE CONSTRAINTS WIRING
      // =====================================================================
      function linkParts(partA, partB, worldAnchor, tag, thresholdRatio, breakAction) {
        const pivotA = worldAnchor.vsub(partA.body.position);
        const pivotB = worldAnchor.vsub(partB.body.position);
        partA.body.quaternion.conjugate().vmult(pivotA, pivotA);
        partB.body.quaternion.conjugate().vmult(pivotB, pivotB);

        const c = new CANNON.PointToPointConstraint(partA.body, pivotA, partB.body, pivotB, 1e6);
        world.addConstraint(c);
        const item = {
          constraint: c,
          partA,
          partB,
          pivotA,
          pivotB,
          tag,
          thresholdRatio,
          broken: false,
          breakAction
        };
        constraints.push(item);
        return item;
      }

      function linkDualLock(partA, partB, xOff, yOff, zSpread, tagPrefix, ratios, onAllBroken) {
        const anchors = [
          new CANNON.Vec3(startX + xOff, yOff, -zSpread),
          new CANNON.Vec3(startX + xOff, yOff + 0.14, zSpread),
          new CANNON.Vec3(startX + xOff + 0.12, yOff, 0)
        ];
        const group = [];
        anchors.forEach((anc, i) => {
          const item = linkParts(partA, partB, anc, `${tagPrefix}_${i}`, ratios[i], () => {
            if (group.every((g) => g.broken) && onAllBroken) {
              onAllBroken();
            }
          });
          group.push(item);
        });
        return group;
      }

      function markDetached(part, impulseVec, angVec) {
        if (part.detached) return;
        part.detached = true;
        part.body.collisionFilterGroup = part.isGlass ? GROUP_SHARD : GROUP_CAR_DETACHED;
        part.body.collisionFilterMask = GROUP_GROUND | GROUP_BRICK | GROUP_CAR_ATTACHED | GROUP_CAR_DETACHED | GROUP_SHARD;
        if (impulseVec) {
          part.body.velocity.x += impulseVec.x;
          part.body.velocity.y += impulseVec.y;
          part.body.velocity.z += impulseVec.z;
        }
        if (angVec) {
          part.body.angularVelocity.x += angVec.x;
          part.body.angularVelocity.y += angVec.y;
          part.body.angularVelocity.z += angVec.z;
        }
      }

      // 1. Chassis <-> EngineBay (3 structural firewall rail links that yield slightly)
      const firewallJoints = linkDualLock(
        chassisPart,
        engineBayPart,
        L * 0.14,
        wheelR + H * 0.04,
        W * 0.32,
        'firewall',
        [99, 99, 99]
      );

      // 2. EngineBay <-> FrontClip (Crumple zone rail joints: shorten & fold backward on impact!)
      const crumpleJoints = linkDualLock(
        engineBayPart,
        frontClipPart,
        L * 0.33,
        wheelR + H * 0.03,
        W * 0.34,
        'crumpleClip',
        [1.15, 1.35, 1.45],
        () => markDetached(frontClipPart, { x: -1.5, y: 1.5, z: 0.4 }, { x: 1.2, y: 2.0, z: 3.5 })
      );

      // 3. Front Bumper latches (Left breaks first -> hangs crooked -> Right breaks -> detaches)
      const fbGroup = linkDualLock(
        frontClipPart,
        frontBumperPart,
        L * 0.45,
        wheelR * 0.95,
        W * 0.36,
        'frontBumper',
        [0.10, 0.22, 0.24],
        () => markDetached(frontBumperPart, { x: -2.2, y: 1.6, z: -1.4 }, { x: 4.5, y: 2.5, z: -5.0 })
      );
      fbGroup[0].breakAction = () => {
        frontBumperPart.body.angularVelocity.set(1.8, -2.5, -2.0);
      };

      // 4. Rear Bumper latches
      linkDualLock(
        chassisPart,
        rearBumperPart,
        -L * 0.43,
        wheelR * 1.0,
        W * 0.36,
        'rearBumper',
        [0.52, 0.88, 0.92],
        () => markDetached(rearBumperPart, { x: -1.5, y: 1.4, z: 0.8 }, { x: 2.0, y: 1.5, z: 3.0 })
      );

      // 5. Hood: Front latch + 2 Rear hinges
      const hoodFrontLatch = linkParts(
        frontClipPart,
        hoodPart,
        new CANNON.Vec3(startX + L * 0.42, beltY, 0),
        'hoodLatch',
        0.16,
        () => {
          // Hood buckles upward and flips open on its rear cowl hinges!
          hoodPart.body.velocity.y += 4.2;
          hoodPart.body.angularVelocity.z += 6.8;
        }
      );
      const hoodHingeL = linkParts(
        engineBayPart,
        hoodPart,
        new CANNON.Vec3(startX + L * 0.15, beltY + 0.02, -W * 0.36),
        'hoodHingeL',
        0.64
      );
      const hoodHingeR = linkParts(
        engineBayPart,
        hoodPart,
        new CANNON.Vec3(startX + L * 0.15, beltY + 0.02, W * 0.36),
        'hoodHingeR',
        0.74
      );
      const checkHoodDetached = () => {
        if (hoodFrontLatch.broken && hoodHingeL.broken && hoodHingeR.broken) {
          markDetached(hoodPart, { x: -1.8, y: 4.8, z: 1.1 }, { x: 3.2, y: -2.4, z: 6.5 });
        }
      };
      hoodHingeL.breakAction = checkHoodDetached;
      hoodHingeR.breakAction = checkHoodDetached;

      // 6. Trunk Lid: Rear latch + 2 Front hinges
      const trunkLatch = linkParts(
        chassisPart,
        trunkPart,
        new CANNON.Vec3(startX - L * 0.43, beltY + 0.02, 0),
        'trunkLatch',
        0.44,
        () => {
          trunkPart.body.velocity.y += 2.6;
          trunkPart.body.angularVelocity.z -= 4.8;
        }
      );
      const trunkHingeL = linkParts(
        chassisPart,
        trunkPart,
        new CANNON.Vec3(startX - L * 0.26, beltY + 0.04, -W * 0.35),
        'trunkHingeL',
        0.95
      );
      const trunkHingeR = linkParts(
        chassisPart,
        trunkPart,
        new CANNON.Vec3(startX - L * 0.26, beltY + 0.04, W * 0.35),
        'trunkHingeR',
        1.05
      );
      const checkTrunkDetached = () => {
        if (trunkLatch.broken && trunkHingeL.broken && trunkHingeR.broken) {
          markDetached(trunkPart, { x: -1.2, y: 3.2, z: -0.9 }, { x: 2.0, y: 1.8, z: -4.5 });
        }
      };
      trunkHingeL.breakAction = checkTrunkDetached;
      trunkHingeR.breakAction = checkTrunkDetached;

      // 7. Front Fenders (FL & FR)
      for (const [side, keyName, tFront, tRear] of [
        [-1, 'fenderFL', 0.22, 0.50],
        [1, 'fenderFR', 0.25, 0.58]
      ]) {
        const fPart = parts[keyName];
        const fFront = linkParts(
          frontClipPart,
          fPart,
          new CANNON.Vec3(startX + L * 0.40, wheelR + H * 0.12, side * W * 0.45),
          `${keyName}_front`,
          tFront,
          () => {
            fPart.body.velocity.z += side * 2.4;
            fPart.body.angularVelocity.y += -side * 3.5;
          }
        );
        const fRear1 = linkParts(
          engineBayPart,
          fPart,
          new CANNON.Vec3(startX + L * 0.17, wheelR + H * 0.18, side * W * 0.45),
          `${keyName}_rear1`,
          tRear
        );
        const fRear2 = linkParts(
          engineBayPart,
          fPart,
          new CANNON.Vec3(startX + L * 0.17, wheelR + H * 0.04, side * W * 0.45),
          `${keyName}_rear2`,
          tRear + 0.03,
          () => {
            if (fFront.broken && fRear1.broken) {
              markDetached(fPart, { x: -1.4, y: 2.6, z: side * 4.2 }, { x: side * 5.0, y: -side * 3.5, z: 2.5 });
            }
          }
        );
      }

      // 8. Four Doors (Front hinges + Rear latch)
      const doorBreakSpecs = [
        { name: 'doorFL', xFront: L * 0.135, xRear: -L * 0.055, side: -1, latchT: 0.30, h1T: 0.58, h2T: 0.62 },
        { name: 'doorFR', xFront: L * 0.135, xRear: -L * 0.055, side: 1, latchT: 0.33, h1T: 0.68, h2T: 0.76 },
        { name: 'doorRL', xFront: -L * 0.065, xRear: -L * 0.255, side: -1, latchT: 0.42, h1T: 0.96, h2T: 1.10 },
        { name: 'doorRR', xFront: -L * 0.065, xRear: -L * 0.255, side: 1, latchT: 0.45, h1T: 1.02, h2T: 1.15 }
      ];

      for (const db of doorBreakSpecs) {
        const dPart = parts[db.name];
        const latch = linkParts(
          chassisPart,
          dPart,
          new CANNON.Vec3(startX + db.xRear, wheelR + H * 0.12, db.side * W * 0.45),
          `${db.name}_latch`,
          db.latchT,
          () => {
            // Door swings wide open around its front hinges!
            dPart.body.velocity.z += db.side * 2.8;
            dPart.body.angularVelocity.y += -db.side * 5.5;
          }
        );
        const hTop = linkParts(
          chassisPart,
          dPart,
          new CANNON.Vec3(startX + db.xFront, wheelR + H * 0.24, db.side * W * 0.45),
          `${db.name}_hTop`,
          db.h1T
        );
        const hBot = linkParts(
          chassisPart,
          dPart,
          new CANNON.Vec3(startX + db.xFront, wheelR + H * 0.02, db.side * W * 0.45),
          `${db.name}_hBot`,
          db.h2T,
          () => {
            if (latch.broken && hTop.broken) {
              markDetached(
                dPart,
                { x: -1.0, y: 2.1, z: db.side * 4.5 },
                { x: db.side * 3.8, y: -db.side * 4.2, z: 2.2 }
              );
            }
          }
        );
      }

      // 9. Windshield & Side Glass Shards
      glassShards.forEach((sh, i) => {
        const baseT = sh.shardRole === 'windshield'
          ? 0.24 + (i % 3) * 0.02
          : (sh.shardRole === 'sideFront' ? 0.35 + (i % 2) * 0.03 : 0.48);

        const anchor = sh.body.position.clone();
        const c1 = linkParts(chassisPart, sh, anchor, `glass_${i}_a`, baseT);
        const c2 = linkParts(
          chassisPart,
          sh,
          new CANNON.Vec3(anchor.x + 0.08, anchor.y + 0.06, anchor.z),
          `glass_${i}_b`,
          baseT + 0.01,
          () => {
            if (c1.broken) {
              const sideSign = sh.localPos.z >= 0 ? 1 : -1;
              const spreadZ = sh.shardRole === 'windshield'
                ? (sh.shardIndex % 3 - 1) * 3.4 + (sh.shardIndex % 2 === 0 ? 0.9 : -0.9)
                : sideSign * (3.8 + (i % 3) * 1.1);
              const upY = 3.2 + (i % 4) * 0.95;
              const fwdX = 1.5 + (i % 3) * 1.2;
              markDetached(
                sh,
                { x: fwdX, y: upY, z: spreadZ },
                { x: (i % 2 === 0 ? 1 : -1) * 9.0, y: sideSign * 7.5, z: 8.5 }
              );
            }
          }
        );
      });

      // 10. Four Wheels (Front wheels detach and roll away under impact force!)
      const wheelBreakThresholds = {
        wheelFL: 0.48,
        wheelFR: 0.60,
        wheelRL: 1.25,
        wheelRR: 1.35
      };

      for (const wName of ['wheelFL', 'wheelFR', 'wheelRL', 'wheelRR']) {
        const wPart = parts[wName];
        const hostPart = wPart.isFront ? engineBayPart : chassisPart;
        const tVal = wheelBreakThresholds[wName];
        const anchor1 = wPart.body.position.clone();
        const anchor2 = new CANNON.Vec3(anchor1.x, anchor1.y, anchor1.z - wPart.side * 0.18);

        const wc1 = linkParts(hostPart, wPart, anchor1, `${wName}_hub`, tVal);
        linkParts(hostPart, wPart, anchor2, `${wName}_axle`, tVal + 0.02, () => {
          if (wc1.broken) {
            const rollSpeed = Math.max(6.0, hostPart.body.velocity.x * 1.15);
            markDetached(
              wPart,
              { x: 2.2, y: 2.4, z: wPart.side * 3.6 },
              { x: wPart.side * 1.4, y: wPart.side * 0.8, z: -rollSpeed / wPart.wheelR }
            );
          }
        });
      }

      return {
        parts,
        constraints,
        glassShards,
        crumpleJoints,
        firewallJoints,
        crumpleAmount: 0,
        maxCrumple: L * 0.135,
        hoodBuckle: 0,
        accumulatedImpulse: 0,
        wheelAngle: 0,
        referenceImpulse: 1250 * 22 * 0.42
      };
    }

    // =========================================================================
    // 8. CONTACT SHADOWS & VISUAL FX (DUST, SPARKS, SKID MARKS)
    // =========================================================================
    function buildContactShadowsAndFX() {
      // Single InstancedMesh for all ground contact shadows (1 draw call!)
      contactShadowTargets = [...allPhysicsEntries];
      const count = contactShadowTargets.length;
      const quadGeo = new THREE.PlaneGeometry(1, 1);
      quadGeo.rotateX(-Math.PI / 2);
      contactShadowMesh = new THREE.InstancedMesh(quadGeo, MATERIALS.contactShadow, count);
      contactShadowMesh.renderOrder = 1;
      simGroup.add(contactShadowMesh);

      // Skid marks InstancedMesh
      const skidGeo = new THREE.PlaneGeometry(0.46, 0.24);
      skidGeo.rotateX(-Math.PI / 2);
      skidMesh = new THREE.InstancedMesh(skidGeo, MATERIALS.skidMark, MAX_SKIDS);
      skidMesh.count = 0;
      skidMesh.renderOrder = 2;
      simGroup.add(skidMesh);
      skidCount = 0;

      // Dust & Sparks pools
      dustParticles = [];
      sparkParticles = [];
      const dustGeo = new THREE.DodecahedronGeometry(0.24, 1);
      const dustMat = new THREE.MeshLambertMaterial({
        color: 0xcbbfb0,
        transparent: true,
        opacity: 0.42,
        depthWrite: false
      });

      for (let i = 0; i < 42; i++) {
        const m = new THREE.Mesh(dustGeo, dustMat.clone());
        m.visible = false;
        simGroup.add(m);
        dustParticles.push({ mesh: m, active: false, age: 0, life: 1, vel: new THREE.Vector3(), scale: 1 });
      }

      const sparkGeo = new THREE.BoxGeometry(0.26, 0.032, 0.032);
      const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });
      for (let i = 0; i < 56; i++) {
        const m = new THREE.Mesh(sparkGeo, sparkMat);
        m.visible = false;
        simGroup.add(m);
        sparkParticles.push({ mesh: m, active: false, age: 0, life: 0.4, vel: new THREE.Vector3() });
      }
    }

    function spawnDust(pos, speedScale = 1) {
      const slot = dustParticles.find((p) => !p.active);
      if (!slot) return;
      slot.active = true;
      slot.age = 0;
      slot.life = 0.65 + fxRng() * 0.75;
      slot.scale = 0.6 + fxRng() * 0.9;
      slot.mesh.position.set(
        pos.x + (fxRng() - 0.5) * 0.5,
        Math.max(0.15, pos.y + (fxRng() - 0.5) * 0.4),
        pos.z + (fxRng() - 0.5) * 0.5
      );
      slot.vel.set(
        (fxRng() - 0.3) * 3.5 * speedScale,
        1.2 + fxRng() * 2.4,
        (fxRng() - 0.5) * 3.5 * speedScale
      );
      slot.mesh.visible = true;
    }

    function spawnSpark(pos, baseVx) {
      const slot = sparkParticles.find((p) => !p.active);
      if (!slot) return;
      slot.active = true;
      slot.age = 0;
      slot.life = 0.25 + fxRng() * 0.35;
      slot.mesh.position.set(
        pos.x + (fxRng() - 0.5) * 0.4,
        Math.max(0.08, pos.y + (fxRng() - 0.5) * 0.3),
        pos.z + (fxRng() - 0.5) * 0.4
      );
      slot.vel.set(
        baseVx * 0.35 + (fxRng() - 0.4) * 9.0,
        2.0 + fxRng() * 6.5,
        (fxRng() - 0.5) * 10.0
      );
      slot.mesh.visible = true;
    }

    const skidDummy = new THREE.Object3D();
    function addSkidMark(x, z, yaw = 0) {
      if (skidCount >= MAX_SKIDS) return;
      skidDummy.position.set(x, 0.005, z);
      skidDummy.rotation.set(0, yaw, 0);
      skidDummy.updateMatrix();
      skidMesh.setMatrixAt(skidCount++, skidDummy.matrix);
      skidMesh.count = skidCount;
      skidMesh.instanceMatrix.needsUpdate = true;
    }

    // =========================================================================
    // 9. PHYSICS STEPPING, MASONRY FRACTURE & PROGRESSIVE CAR DESTRUCTION
    // =========================================================================
    function stepPhysics(dt) {
      if (!world || !carState) return;

      // Save previous transforms for smooth slow-motion interpolation
      for (let i = 0; i < allPhysicsEntries.length; i++) {
        const b = allPhysicsEntries[i].body;
        b.prevPos.copy(b.position);
        b.prevQuat.copy(b.quaternion);
      }

      const cfg = activeSettings;
      const chassis = carState.parts.chassis.body;
      const frontBumper = carState.parts.frontBumper.body;
      const frontClip = carState.parts.frontClip.body;
      const engineBay = carState.parts.engineBay.body;

      const wallFrontX = wallX - (cfg.wallDepth * cfg.brickDepth) * 0.5;
      const noseX = frontBumper.position.x + cfg.carLength * 0.035;

      // A. Pre-impact uniform vehicle acceleration to reach exact target impactSpeed at wall
      if (!hasImpacted) {
        if (noseX >= wallFrontX - 0.08) {
          hasImpacted = true;
          impactTime = simTime;
          cameraShakeTrauma = Math.min(1.0, cfg.impactSpeed / 25);
        } else {
          const distRemaining = Math.max(0.35, wallFrontX - noseX);
          const curVx = chassis.velocity.x;
          const targetV = cfg.impactSpeed;
          const reqAccel = (targetV * targetV - curVx * curVx) / (2 * distRemaining);

          for (const key in carState.parts) {
            const p = carState.parts[key];
            if (!p.detached) {
              p.body.force.x += p.body.mass * reqAccel;
              p.body.velocity.z *= 0.92;
              p.body.angularVelocity.x *= 0.9;
              p.body.angularVelocity.y *= 0.9;
            }
          }

          // Spin attached wheels visually
          carState.wheelAngle -= (curVx * dt) / (cfg.carHeight * 0.235);
          for (const wName of ['wheelFL', 'wheelFR', 'wheelRL', 'wheelRR']) {
            const wp = carState.parts[wName];
            if (!wp.detached) {
              wp.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), carState.wheelAngle);
            }
          }
        }
      }

      // Step rigid-body solver
      world.step(dt);
      simTime += dt;

      // B. Masonry Mortar Cohesion, Fracture Propagation & Momentum Transfer
      const carFrontX = Math.max(frontClip.position.x, engineBay.position.x + cfg.carLength * 0.12);
      const carZ = chassis.position.z;
      const carHalfW = cfg.carWidth * 0.52;
      const carTopY = cfg.carHeight * 1.05;

      let stepImpactImpulse = 0;

      for (let i = 0; i < brickEntities.length; i++) {
        const b = brickEntities[i];
        const body = b.body;

        if (b.mortarIntact) {
          const dx = body.position.x - b.restPos.x;
          const dy = body.position.y - b.restPos.y;
          const dz = body.position.z - b.restPos.z;
          const dispSq = dx * dx + dy * dy + dz * dz;
          const speedSq = body.velocity.lengthSquared();

          // Check if car front is striking this brick directly
          const inCarZone =
            hasImpacted &&
            Math.abs(body.position.x - carFrontX) < cfg.brickDepth * 1.35 + cfg.carLength * 0.16 &&
            Math.abs(body.position.z - carZ) < carHalfW + cfg.brickWidth * 0.35 &&
            body.position.y < carTopY;

          if (inCarZone && chassis.velocity.x > 1.2) {
            const relV = Math.max(0, chassis.velocity.x - body.velocity.x);
            const directImpulse = relV * b.body.mass * (1.85 + cfg.brickFriction * 1.15);
            b.mortarHealth -= directImpulse;
            stepImpactImpulse += directImpulse;

            if (b.mortarHealth <= 0) {
              b.mortarIntact = false;
              const zOff = body.position.z - carZ;
              const yRatio = Math.min(1, body.position.y / cfg.carHeight);
              body.velocity.x += relV * (0.72 + yRatio * 0.32);
              body.velocity.y += (1.6 + yRatio * 4.2) * (relV / 18);
              body.velocity.z += zOff * (2.4 + yRatio * 1.5) * (relV / 18);
              body.angularVelocity.set(
                (b.row % 2 === 0 ? 1 : -1) * 4.5,
                zOff * 3.8,
                -relV * 0.35
              );

              // Equal & opposite reaction impulse onto the car structure
              const reaction = directImpulse * 1.28;
              const fShare = reaction / cfg.carMass;
              chassis.velocity.x = Math.max(0, chassis.velocity.x - fShare * 0.72);
              engineBay.velocity.x = Math.max(0, engineBay.velocity.x - fShare * 0.85);
              frontClip.velocity.x = Math.max(0, frontClip.velocity.x - fShare * 1.05);

              // Propagate fracture stress to immediate masonry neighbors
              for (let n = 0; n < b.neighbors.length; n++) {
                b.neighbors[n].mortarHealth -= directImpulse * 0.42;
              }

              if ((i & 3) === 0) spawnDust(body.position, 1.1);
              if ((i & 1) === 0) spawnSpark(body.position, chassis.velocity.x);
            }
          } else if (dispSq > 0.00008 || speedSq > 0.04) {
            const kineticJ = body.mass * Math.sqrt(speedSq);
            if (kineticJ >= b.mortarHealth) {
              b.mortarIntact = false;
              for (let n = 0; n < b.neighbors.length; n++) {
                b.neighbors[n].mortarHealth *= 0.55;
              }
              if ((i & 3) === 0) spawnDust(body.position, 0.7);
            } else if (b.lowerSupports.length > 0 && b.lowerSupports.every((s) => !s.mortarIntact)) {
              // Upper arch bricks lose support and collapse under gravity
              b.mortarIntact = false;
            } else {
              // Intact masonry holds position cleanly prior to fracture
              body.position.copy(b.restPos);
              body.velocity.set(0, 0, 0);
              body.angularVelocity.set(0, 0, 0);
            }
          } else if (b.lowerSupports.length > 0 && b.lowerSupports.every((s) => !s.mortarIntact)) {
            b.mortarIntact = false;
          }
        }
      }

      // Also measure solver contact multipliers between car bodies and bricks
      for (let i = 0; i < world.contacts.length; i++) {
        const c = world.contacts[i];
        const gA = c.bi.collisionFilterGroup;
        const gB = c.bj.collisionFilterGroup;
        if (
          (gA === GROUP_BRICK && (gB === GROUP_CAR_ATTACHED || gB === GROUP_CAR_DETACHED)) ||
          (gB === GROUP_BRICK && (gA === GROUP_CAR_ATTACHED || gA === GROUP_CAR_DETACHED))
        ) {
          if (!hasImpacted) {
            hasImpacted = true;
            impactTime = simTime;
            cameraShakeTrauma = Math.min(1.0, cfg.impactSpeed / 25);
          }
          stepImpactImpulse += Math.min(450, Math.abs(c.multiplier || 0) * dt * 18 + 14);
        }
      }

      // C. Progressive Car Breakup, Front Clip Crumple & Undercarriage Braking
      if (hasImpacted) {
        carState.accumulatedImpulse += stepImpactImpulse;
        const normImpulse = carState.accumulatedImpulse / carState.referenceImpulse;

        // 1. Check breakable constraints against their physical impulse thresholds
        for (let i = 0; i < carState.constraints.length; i++) {
          const item = carState.constraints[i];
          if (!item.broken && normImpulse >= item.thresholdRatio) {
            item.broken = true;
            world.removeConstraint(item.constraint);
            if (item.breakAction) item.breakAction();
          }
        }

        // 2. Permanent Front Clip Plastic Crumple (shortens nose backward & tilts upward)
        const targetCrumple = Math.min(carState.maxCrumple, normImpulse * carState.maxCrumple * 1.35);
        if (targetCrumple > carState.crumpleAmount) {
          const deltaC = targetCrumple - carState.crumpleAmount;
          carState.crumpleAmount = targetCrumple;

          for (let j = 0; j < carState.crumpleJoints.length; j++) {
            const cj = carState.crumpleJoints[j];
            if (!cj.broken) {
              cj.pivotA.x -= deltaC;
              cj.pivotA.y += deltaC * (j === 1 ? 0.34 : 0.14);
            }
          }
          for (let j = 0; j < carState.firewallJoints.length; j++) {
            const fj = carState.firewallJoints[j];
            if (!fj.broken) {
              fj.pivotA.x -= deltaC * 0.25;
            }
          }
        }

        // 3. Deform Hood vertices into a visible V-buckle crease
        const targetBuckle = Math.min(0.28, normImpulse * 0.36);
        if (targetBuckle > carState.hoodBuckle + 0.005) {
          carState.hoodBuckle = targetBuckle;
          const hoodEntry = carState.parts.hood;
          for (const geo of hoodEntry.deformGeos) {
            const posAttr = geo.attributes.position;
            for (let v = 0; v < posAttr.count; v++) {
              const vx = posAttr.getX(v);
              const normalizedX = 1.0 - Math.min(1.0, Math.abs(vx) / (cfg.carLength * 0.155));
              const signY = posAttr.getY(v) >= 0 ? 1 : -1;
              posAttr.setY(v, signY * cfg.carHeight * 0.02 + Math.pow(normalizedX, 1.5) * carState.hoodBuckle);
            }
            posAttr.needsUpdate = true;
            geo.computeVertexNormals();
          }
        }

        // 4. Post-impact damaged undercarriage & locked-wheel asphalt friction
        const damageFactor = Math.min(1.0, normImpulse * 1.15);
        if (damageFactor > 0.12 && chassis.position.y < cfg.carHeight * 0.65) {
          const brakeDecel = cfg.groundFriction * cfg.gravity * (0.65 + damageFactor * 0.95);
          const dv = brakeDecel * dt;

          for (const key in carState.parts) {
            const p = carState.parts[key];
            if (!p.detached) {
              const vx = p.body.velocity.x;
              if (Math.abs(vx) > 0.05) {
                p.body.velocity.x -= Math.sign(vx) * Math.min(Math.abs(vx), dv);
              }
              p.body.velocity.z *= 0.985;
              p.body.angularVelocity.scale(0.96, p.body.angularVelocity);
            }
          }

          // Emit tire skid marks & scraping sparks while wreck skids to a stop
          if (chassis.velocity.lengthSquared() > 2.2) {
            const stepTick = Math.round(simTime / dt);
            if (stepTick % 4 === 0) {
              for (const wName of ['wheelFL', 'wheelFR', 'wheelRL', 'wheelRR']) {
                const wp = carState.parts[wName];
                if (!wp.detached && wp.body.position.y < wp.wheelR * 1.35) {
                  addSkidMark(wp.body.position.x, wp.body.position.z);
                }
              }
            }
            if (stepTick % 3 === 0 && damageFactor > 0.35) {
              spawnSpark(frontClip.position, chassis.velocity.x);
            }
          }
        }

        // Spin any remaining attached wheels at damped rate
        carState.wheelAngle -= (chassis.velocity.x * dt * (1 - damageFactor * 0.85)) / (cfg.carHeight * 0.235);
        for (const wName of ['wheelFL', 'wheelFR', 'wheelRL', 'wheelRR']) {
          const wp = carState.parts[wName];
          if (!wp.detached) {
            wp.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), carState.wheelAngle);
          }
        }
      }

      // D. Velocity sanity clamp & floor safety
      const maxVel = Math.max(65, cfg.impactSpeed * 2.1);
      const maxVelSq = maxVel * maxVel;
      for (let i = 0; i < allPhysicsEntries.length; i++) {
        const b = allPhysicsEntries[i].body;
        const vSq = b.velocity.lengthSquared();
        if (vSq > maxVelSq) {
          b.velocity.scale(maxVel / Math.sqrt(vSq), b.velocity);
        }
        if (b.position.y < b.shapes[0].boundingSphereRadius * 0.25) {
          b.position.y = b.shapes[0].boundingSphereRadius * 0.25;
          if (b.velocity.y < 0) b.velocity.y = 0;
        }
      }

      // E. Update visual particles
      for (let i = 0; i < dustParticles.length; i++) {
        const p = dustParticles[i];
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= p.life) {
          p.active = false;
          p.mesh.visible = false;
          continue;
        }
        const t = p.age / p.life;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.vel.multiplyScalar(0.96);
        const s = p.scale * (1 + t * 2.8);
        p.mesh.scale.set(s, s * 0.85, s);
        p.mesh.material.opacity = 0.42 * (1 - t);
      }

      for (let i = 0; i < sparkParticles.length; i++) {
        const p = sparkParticles[i];
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= p.life) {
          p.active = false;
          p.mesh.visible = false;
          continue;
        }
        p.vel.y -= cfg.gravity * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        if (p.mesh.position.y < 0.03) {
          p.mesh.position.y = 0.03;
          p.vel.y = Math.abs(p.vel.y) * 0.45;
        }
        p.mesh.lookAt(
          p.mesh.position.x + p.vel.x,
          p.mesh.position.y + p.vel.y,
          p.mesh.position.z + p.vel.z
        );
      }

      if (cameraShakeTrauma > 0) {
        cameraShakeTrauma = Math.max(0, cameraShakeTrauma - dt * 1.75);
      }
    }

    // =========================================================================
    // 10. VISUAL SYNCHRONIZATION & CAMERA CHOREOGRAPHY
    // =========================================================================
    const interpPos = new THREE.Vector3();
    const interpQuat = new THREE.Quaternion();
    const shadowDummy = new THREE.Object3D();
    const camTarget = new THREE.Vector3();
    const camDesiredPos = new THREE.Vector3();

    function syncVisualsAndCameras(alpha) {
      if (!carState) return;

      // 1. Interpolate rigid-body transforms & update single-draw-call Contact Shadows
      for (let i = 0; i < allPhysicsEntries.length; i++) {
        const entry = allPhysicsEntries[i];
        const b = entry.body;

        interpPos.lerpVectors(b.prevPos, b.position, alpha);
        interpQuat.slerpQuaternions(b.prevQuat, b.quaternion, alpha);

        entry.mesh.position.copy(interpPos);
        entry.mesh.quaternion.copy(interpQuat);

        // Contact shadow projection onto ground plane (y = 0.006)
        const clearance = Math.max(0, interpPos.y - entry.halfH);
        if (clearance < 1.35) {
          const fade = Math.max(0.15, 1.0 - clearance / 1.35);
          shadowDummy.position.set(interpPos.x, 0.006, interpPos.z);
          shadowDummy.rotation.set(-Math.PI / 2, 0, 0);
          shadowDummy.scale.set(entry.footprintX * fade, entry.footprintZ * fade, 1);
        } else {
          shadowDummy.position.set(0, -10, 0);
          shadowDummy.scale.set(0.001, 0.001, 0.001);
        }
        shadowDummy.updateMatrix();
        contactShadowMesh.setMatrixAt(i, shadowDummy.matrix);
      }
      contactShadowMesh.instanceMatrix.needsUpdate = true;

      // 2. Camera Choreography (Impact, Follow, Top, Orbit)
      const chassisPos = carState.parts.chassis.mesh.position;
      const shakeAmt = cameraShakeTrauma * cameraShakeTrauma * 0.22;
      const shakeX = Math.sin(simTime * 53.0) * shakeAmt;
      const shakeY = Math.cos(simTime * 67.0) * shakeAmt;

      if (cameraMode === 'impact') {
        orbitControls.enabled = false;
        // Three-quarter cinematic shot keeping car, track, and collapsing wall framed
        const focusX = hasImpacted
          ? THREE.MathUtils.clamp((wallX * 0.45 + chassisPos.x * 0.55), wallX - 2.0, wallX + 5.5)
          : (chassisPos.x * 0.35 + wallX * 0.65);

        const wallSpan = Math.max(6.0, activeSettings.wallCols * activeSettings.brickWidth);
        const distZ = Math.max(8.8, wallSpan * 1.15);

        camDesiredPos.set(wallX + 6.2 + shakeX, 2.55 + shakeY, distZ);
        camTarget.set(focusX, 1.05 + shakeY * 0.5, 0);

        camera.position.lerp(camDesiredPos, 0.12);
        camera.up.set(0, 1, 0);
        camera.lookAt(camTarget);
      } else if (cameraMode === 'follow') {
        orbitControls.enabled = false;
        const leadX = Math.min(chassisPos.x, wallX + 6.5);
        camDesiredPos.set(leadX - 7.8 + shakeX, 2.75 + shakeY, 2.6);
        camTarget.set( (leadX + wallX) * 0.5 + 1.5, 1.1 + shakeY * 0.5, 0 );

        camera.position.lerp(camDesiredPos, 0.16);
        camera.up.set(0, 1, 0);
        camera.lookAt(camTarget);
      } else if (cameraMode === 'top') {
        orbitControls.enabled = false;
        const centerFocusX = THREE.MathUtils.clamp((chassisPos.x * 0.4 + wallX * 0.6), wallX - 10, wallX + 4);
        camera.position.set(centerFocusX, 24.5, 0.01);
        camera.up.set(0, 0, -1);
        camera.lookAt(centerFocusX, 0, 0);
      } else if (cameraMode === 'orbit') {
        orbitControls.enabled = true;
        camera.up.set(0, 1, 0);
        if (!orbitUserInteracted) {
          orbitControls.target.set(wallX - 0.5, 1.1, 0);
        }
        orbitControls.update();
      }

      // 3. Update Live Telemetry HUD
      const speedMs = carState.parts.chassis.body.velocity.length();
      document.getElementById('hud-speed').textContent = `${speedMs.toFixed(1)} m/s`;
      document.getElementById('hud-time').textContent = `${simTime.toFixed(2)} s`;

      let brokenCount = 0;
      for (const k in carState.parts) {
        if (carState.parts[k].detached) brokenCount++;
      }
      for (let i = 0; i < brickEntities.length; i++) {
        if (!brickEntities[i].mortarIntact) brokenCount++;
      }
      document.getElementById('hud-debris').textContent = String(brokenCount);
    }

    // =========================================================================
    // 11. SIMULATION REBUILD & DETERMINISTIC INITIALIZATION
    // =========================================================================
    function clearSimGroup() {
      while (simGroup.children.length > 0) {
        const child = simGroup.children[0];
        simGroup.remove(child);
      }
    }

    function rebuildSimulation() {
      clearSimGroup();
      allPhysicsEntries = [];
      brickEntities = [];
      contactShadowTargets = [];

      simTime = 0;
      simAccumulator = 0;
      hasImpacted = false;
      impactTime = -1;
      cameraShakeTrauma = 0;
      fxRng = createSeededRandom(777);

      const cfg = activeSettings;

      // Initialize fresh deterministic Cannon-es world
      world = new CANNON.World();
      world.gravity.set(0, -cfg.gravity, 0);
      world.broadphase = new CANNON.SAPBroadphase(world);
      world.solver.iterations = 12;
      world.solver.tolerance = 0.0005;

      const groundMat = new CANNON.Material('ground');
      const brickMat = new CANNON.Material('brick');
      const carMat = new CANNON.Material('car');
      const wheelMat = new CANNON.Material('wheel');

      world.addContactMaterial(new CANNON.ContactMaterial(groundMat, brickMat, {
        friction: Math.sqrt(cfg.groundFriction * cfg.brickFriction),
        restitution: cfg.brickRestitution * 0.6
      }));
      world.addContactMaterial(new CANNON.ContactMaterial(brickMat, brickMat, {
        friction: cfg.brickFriction,
        restitution: cfg.brickRestitution
      }));
      world.addContactMaterial(new CANNON.ContactMaterial(carMat, brickMat, {
        friction: cfg.brickFriction * 0.65,
        restitution: cfg.brickRestitution
      }));
      world.addContactMaterial(new CANNON.ContactMaterial(groundMat, carMat, {
        friction: 0.0, // Attached runner skids are frictionless; post-impact braking is applied explicitly
        restitution: 0.08
      }));
      world.addContactMaterial(new CANNON.ContactMaterial(groundMat, wheelMat, {
        friction: cfg.groundFriction * 0.55,
        restitution: 0.28
      }));

      // Static ground plane collider
      const groundBody = new CANNON.Body({
        mass: 0,
        material: groundMat,
        collisionFilterGroup: GROUP_GROUND,
        collisionFilterMask: GROUP_BRICK | GROUP_CAR_ATTACHED | GROUP_CAR_DETACHED | GROUP_SHARD
      });
      groundBody.addShape(new CANNON.Plane());
      groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(groundBody);

      // Build Track, Brick Wall, Car, and Contact Shadows
      buildTrackAndEnvironment(cfg);
      buildBrickWall(cfg, brickMat);
      carState = buildDestructibleCar(cfg, carMat, wheelMat);
      buildContactShadowsAndFX();

      // Set initial launch velocity on all car parts so the car immediately accelerates down the track
      const launchSpeed = Math.min(cfg.impactSpeed * 0.42, 9.0);
      for (const k in carState.parts) {
        carState.parts[k].body.velocity.set(launchSpeed, 0, 0);
      }

      // Snap initial camera position for clean framing
      if (cameraMode === 'impact') {
        const wallSpan = Math.max(6.0, cfg.wallCols * cfg.brickWidth);
        camera.position.set(wallX + 6.5, 2.6, Math.max(8.8, wallSpan * 1.15));
        camera.lookAt(wallX - 3.5, 1.05, 0);
      } else if (cameraMode === 'follow') {
        camera.position.set(carStartX - 7.5, 2.75, 2.6);
        camera.lookAt(carStartX + 4.0, 1.1, 0);
      } else if (cameraMode === 'orbit' && !orbitUserInteracted) {
        camera.position.set(wallX - 4.5, 5.2, 13.5);
        orbitControls.target.set(wallX - 0.5, 1.1, 0);
        orbitControls.update();
      }

      syncVisualsAndCameras(1.0);
    }

    // =========================================================================
    // 12. UI WIRING (PLAYBACK, CAMERA SWITCHER & SETTINGS PANEL)
    // =========================================================================
    const SETTING_KEYS = Object.keys(MANDATORY_DEFAULTS);

    function writeSettingsToInputs(cfg) {
      for (const key of SETTING_KEYS) {
        const el = document.getElementById(`inp-${key}`);
        if (el) el.value = String(cfg[key]);
      }
    }

    function readSettingsFromInputs() {
      const next = {};
      for (const key of SETTING_KEYS) {
        const el = document.getElementById(`inp-${key}`);
        const raw = el ? parseFloat(el.value) : MANDATORY_DEFAULTS[key];
        const min = el && el.min !== '' ? parseFloat(el.min) : -Infinity;
        const max = el && el.max !== '' ? parseFloat(el.max) : Infinity;
        const val = Number.isFinite(raw) ? Math.min(max, Math.max(min, raw)) : MANDATORY_DEFAULTS[key];
        next[key] = val;
        if (el) el.value = String(val);
      }
      next.wallCols = Math.round(next.wallCols);
      next.wallRows = Math.round(next.wallRows);
      next.wallDepth = Math.round(next.wallDepth);
      return next;
    }

    // Play / Pause
    const playPauseBtn = document.getElementById('btn-play-pause');
    function setPlayingState(playing) {
      isPlaying = playing;
      playPauseBtn.textContent = isPlaying ? 'Pause' : 'Play';
      playPauseBtn.classList.toggle('btn-primary', isPlaying);
      playPauseBtn.classList.toggle('btn-action', !isPlaying);
    }

    playPauseBtn.addEventListener('click', () => {
      setPlayingState(!isPlaying);
    });

    // Spacebar toggles pause unless a number input is focused
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.tagName === 'INPUT') return;
        e.preventDefault();
        setPlayingState(!isPlaying);
      }
    });

    // Replay & Apply (both read the live controls and rebuild the next run)
    function applyAndReplay() {
      activeSettings = readSettingsFromInputs();
      rebuildSimulation();
      setPlayingState(true);
    }

    document.getElementById('btn-replay').addEventListener('click', applyAndReplay);
    document.getElementById('btn-apply-settings').addEventListener('click', applyAndReplay);

    document.getElementById('btn-reset-defaults').addEventListener('click', () => {
      activeSettings = { ...MANDATORY_DEFAULTS };
      writeSettingsToInputs(activeSettings);
      rebuildSimulation();
      setPlayingState(true);
    });

    // Simulation speed switcher (0.25x, 0.5x, 1x, 2x)
    const speedButtons = document.querySelectorAll('#speed-switcher .btn');
    speedButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        simSpeed = parseFloat(btn.dataset.speed);
        speedButtons.forEach((b) => b.classList.toggle('active', b === btn));
      });
    });

    // Camera view switcher (Impact, Follow, Top, Orbit)
    const camButtons = document.querySelectorAll('#camera-switcher .btn');
    camButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const nextCam = btn.dataset.cam;
        if (nextCam === 'orbit' && cameraMode !== 'orbit') {
          orbitUserInteracted = false;
          camera.position.set(wallX - 4.5, 5.2, 13.5);
          orbitControls.target.set(wallX - 0.5, 1.1, 0);
        }
        cameraMode = nextCam;
        camButtons.forEach((b) => b.classList.toggle('active', b === btn));
        syncVisualsAndCameras(1.0);
      });
    });

    // Settings drawer toggle
    const settingsPanel = document.getElementById('settings-panel');
    document.getElementById('btn-toggle-settings').addEventListener('click', () => {
      settingsPanel.classList.toggle('collapsed');
    });
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      settingsPanel.classList.add('collapsed');
    });

    // Window resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 13. MAIN ANIMATION LOOP (FIXED TIMESTEP + INTERPOLATED RENDER)
    // =========================================================================
    writeSettingsToInputs(MANDATORY_DEFAULTS);
    activeSettings = { ...MANDATORY_DEFAULTS };
    rebuildSimulation();

    let lastFrameTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const rawDt = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      if (isPlaying) {
        simAccumulator += rawDt * simSpeed;
        const maxSteps = 10;
        let steps = 0;
        while (simAccumulator >= FIXED_DT && steps < maxSteps) {
          stepPhysics(FIXED_DT);
          simAccumulator -= FIXED_DT;
          steps++;
        }
        if (steps === maxSteps) {
          simAccumulator = 0;
        }
      }

      const alpha = isPlaying ? Math.min(1.0, simAccumulator / FIXED_DT) : 1.0;
      syncVisualsAndCameras(alpha);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
