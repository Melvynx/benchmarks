<style>

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

/* ---------- deterministic visual RNG (never touches physics setup) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- settings ---------- */
const DEFAULTS={speed:22,carMass:1250,carL:4.2,carW:1.8,carH:1.45,cols:12,rows:8,depth:2,brickMass:2.5,bw:0.50,bh:0.24,bd:0.20,gravity:9.81,bFric:0.72,bRest:0.18,gFric:0.85,track:40};
const $=id=>document.getElementById(id);
function readSettings(){
  const n=(id,d,a,b)=>{const v=parseFloat($(id).value);return clamp(isFinite(v)?v:d,a,b);};
  const i=(id,d,a,b)=>Math.round(n(id,d,a,b));
  return {speed:n('s_speed',22,2,45),carMass:n('s_carMass',1250,300,4000),carL:n('s_carL',4.2,2.5,6.5),carW:n('s_carW',1.8,1.2,2.6),
    carH:n('s_carH',1.45,0.9,2.2),cols:i('s_cols',12,3,30),rows:i('s_rows',8,2,20),depth:i('s_depth',2,1,4),
    brickMass:n('s_brickMass',2.5,0.2,30),bw:n('s_bw',0.5,0.15,1.2),bh:n('s_bh',0.24,0.08,0.6),bd:n('s_bd',0.2,0.08,0.6),
    gravity:n('s_gravity',9.81,0.5,30),bFric:n('s_bFric',0.72,0,1.5),bRest:n('s_bRest',0.18,0,0.9),gFric:n('s_gFric',0.85,0,1.5),
    track:n('s_track',40,25,80)};
}
let S={...DEFAULTS};

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fb6d9);
scene.fog=new THREE.Fog(0xa8c4de,60,160);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);
camera.position.set(8,5,13);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.enabled=false; controls.maxPolarAngle=Math.PI*0.49;

const sun=new THREE.DirectionalLight(0xfff2dd,3.2);
sun.position.set(18,30,14); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun,sun.target);
scene.add(new THREE.HemisphereLight(0xbdd7f2,0x4a5548,0.55));

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- procedural textures ---------- */
function canvasTex(w,h,fn,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
const asphaltTex=canvasTex(512,512,(g,w,h)=>{const r=mulberry32(7);g.fillStyle='#33373c';g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=40+r()*50;g.fillStyle=`rgb(${v},${v+3},${v+7})`;g.fillRect(r()*w,r()*h,2,2);}
  for(let i=0;i<40;i++){g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(r()*w,r()*h,10+r()*40,5+r()*14,r()*3,0,7);g.fill();}},10,2);
const grassTex=canvasTex(256,256,(g,w,h)=>{const r=mulberry32(11);g.fillStyle='#4d7a3d';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){g.fillStyle=`rgb(${55+r()*40},${105+r()*55},${40+r()*30})`;g.fillRect(r()*w,r()*h,2,3);}},24,24);
function brickTex(seed,base){return canvasTex(128,64,(g,w,h)=>{const r=mulberry32(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<700;i++){g.fillStyle=r()>.5?'rgba(0,0,0,.13)':'rgba(255,220,190,.10)';g.fillRect(r()*w,r()*h,2,2);}
  g.strokeStyle='rgba(0,0,0,.25)';g.strokeRect(1,1,w-2,h-2);});}

/* ---------- shared materials ---------- */
const MAT={
  paint:new THREE.MeshPhysicalMaterial({color:0xb3202a,metalness:0.65,roughness:0.32,clearcoat:1,clearcoatRoughness:0.12,envMapIntensity:1.2}),
  paintDark:new THREE.MeshPhysicalMaterial({color:0x2a2e35,metalness:0.6,roughness:0.45,clearcoat:0.6,envMapIntensity:0.8}),
  glass:new THREE.MeshPhysicalMaterial({color:0x9fd4e8,metalness:0,roughness:0.06,transmission:0.75,transparent:true,opacity:0.55,envMapIntensity:1.6,side:THREE.DoubleSide}),
  shard:new THREE.MeshPhysicalMaterial({color:0xbfe8f5,metalness:0,roughness:0.05,transparent:true,opacity:0.65,envMapIntensity:1.8,side:THREE.DoubleSide}),
  tire:new THREE.MeshStandardMaterial({color:0x14161a,roughness:0.95,metalness:0.05}),
  rim:new THREE.MeshStandardMaterial({color:0xc9ced6,roughness:0.25,metalness:0.95,envMapIntensity:1.2}),
  light:new THREE.MeshStandardMaterial({color:0xfff6cf,emissive:0xffedb5,emissiveIntensity:2.2,roughness:0.3}),
  tail:new THREE.MeshStandardMaterial({color:0x7a0d12,emissive:0xb01018,emissiveIntensity:1.4,roughness:0.3}),
  chrome:new THREE.MeshStandardMaterial({color:0xd7dbe0,roughness:0.18,metalness:1,envMapIntensity:1.3}),
  interior:new THREE.MeshStandardMaterial({color:0x22242a,roughness:0.9}),
};
const brickMats=['#9c4a38','#a8553f','#8f4232','#b05a40'].map((c,i)=>new THREE.MeshStandardMaterial({map:brickTex(100+i*17,c),roughness:0.94,metalness:0.02}));

/* ---------- simulation state ---------- */
let world=null, dynGroup=null, pairs=[], joints=[], carParts=[], bricks=[];
let chassisBody=null, noseBody=null, wallX=12, carStartX=-15, impacted=false, brokenCount=0, totalJoints=0;
let dust=null, dustVel=null, dustLife=0, shake=0, skidL=null, skidR=null, blob=null;
let physMats=null;
const FIXED=1/120;
let accumulator=0;

function boxMesh(sx,sy,sz,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function makeBody(mass,sx,sy,sz,x,y,z,matBody,opts={}){
  const body=new CANNON.Body({mass,shape:new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2)),
    position:new CANNON.Vec3(x,y,z),material:matBody,linearDamping:opts.ld??0.01,angularDamping:opts.ad??0.05,
    allowSleep:opts.sleep??false,sleepSpeedLimit:0.35,sleepTimeLimit:0.6});
  if(opts.quat)body.quaternion.copy(opts.quat);
  world.addBody(body);return body;
}
function pair(body,object3d){dynGroup.add(object3d);pairs.push({body,obj:object3d});return object3d;}
function lockJoint(a,b,threshold,kind){
  const c=new CANNON.LockConstraint(a,b,{maxForce:1e7});
  world.addConstraint(c);
  const j={c,a,b,threshold,kind,broken:false,d0:a.position.distanceTo(b.position)};
  joints.push(j);totalJoints++;return j;
}
function breakJoint(j){
  if(j.broken)return;j.broken=true;brokenCount++;
  world.removeConstraint(j.c);
  j.a.wakeUp();j.b.wakeUp();
}

/* ---------- environment (static, merged-ish simple meshes) ---------- */
function buildEnvironment(){
  const TL=S.track, half=TL/2, TW=9; // track width (z)
  const g=new THREE.Group();dynGroup.add(g);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,140),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;g.add(ground);
  const road=new THREE.Mesh(new THREE.BoxGeometry(TL+16,0.06,TW),new THREE.MeshStandardMaterial({map:asphaltTex,roughness:0.94,metalness:0.02}));
  road.position.y=0.0;road.receiveShadow=true;g.add(road);
  const white=new THREE.MeshStandardMaterial({color:0xe8e8e2,roughness:0.7});
  const yellow=new THREE.MeshStandardMaterial({color:0xe8c832,roughness:0.7});
  // edge lines + centre dashes
  for(const zz of [-TW/2+0.35,TW/2-0.35]){
    const l=new THREE.Mesh(new THREE.BoxGeometry(TL+16,0.02,0.14),white);l.position.set(0,0.045,zz);l.receiveShadow=true;g.add(l);}
  for(let x=-half-6;x<half+6;x+=3){
    const d=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.02,0.14),yellow);d.position.set(x,0.045,0);d.receiveShadow=true;g.add(d);}
  // start line (checker-ish stripes)
  for(let i=0;i<9;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.02,TW/9),
    new THREE.MeshStandardMaterial({color:i%2?0x111111:0xf0f0f0,roughness:0.7}));
    s.position.set(carStartX-2.5,0.045,-TW/2+TW/18+i*TW/9);s.receiveShadow=true;g.add(s);}
  // curbs (red/white blocks) + barriers + light poles — visual only, off the driving line
  const red=new THREE.MeshStandardMaterial({color:0xb03030,roughness:0.8});
  for(let x=-half-6;x<half+6;x+=2){
    for(const zz of [-TW/2-0.35,TW/2+0.35]){
      const c=new THREE.Mesh(new THREE.BoxGeometry(2,0.14,0.6),((x/2)|0)%2?red:white);
      c.position.set(x+1,0.06,zz);c.castShadow=false;c.receiveShadow=true;g.add(c);}}
  const concrete=new THREE.MeshStandardMaterial({color:0x9aa0a6,roughness:0.9});
  for(const zz of [-TW/2-2.2,TW/2+2.2]){
    const b=new THREE.Mesh(new THREE.BoxGeometry(TL+16,0.9,0.35),concrete);
    b.position.set(0,0.45,zz);b.receiveShadow=true;g.add(b);}
  const poleMat=new THREE.MeshStandardMaterial({color:0x3a3f46,roughness:0.5,metalness:0.7});
  for(let x=-half;x<=half;x+=10){
    for(const zz of [-TW/2-3.2,TW/2+3.2]){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,5.5,8),poleMat);p.position.set(x,2.75,zz);g.add(p);
      const head=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.14,0.3),MAT.light);head.position.set(x,5.5,zz);g.add(head);}}
  // distant grandstand hint + horizon hills
  const stand=new THREE.Mesh(new THREE.BoxGeometry(16,5,3),new THREE.MeshStandardMaterial({color:0x6d7c8c,roughness:0.9}));
  stand.position.set(-6,2.5,-24);g.add(stand);
  const hillM=new THREE.MeshStandardMaterial({color:0x5c7a55,roughness:1});
  for(const [hx,hz,hs] of [[-40,-45,26],[25,-50,34],[5,52,30],[-45,40,22]]){
    const h=new THREE.Mesh(new THREE.SphereGeometry(hs,12,8),hillM);h.scale.y=0.28;h.position.set(hx,0,hz);g.add(h);}
  // skid marks (grow behind the car while driving)
  const skidMat=new THREE.MeshBasicMaterial({color:0x0a0a0c,transparent:true,opacity:0.55});
  skidL=new THREE.Mesh(new THREE.PlaneGeometry(1,0.22),skidMat);skidL.rotation.x=-Math.PI/2;g.add(skidL);
  skidR=skidL.clone();g.add(skidR);
  // cheap contact blob under the car
  blob=new THREE.Mesh(new THREE.CircleGeometry(1,24),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3,depthWrite:false}));
  blob.rotation.x=-Math.PI/2;blob.position.y=0.05;g.add(blob);
}

/* ---------- wall ---------- */
function buildWall(){
  const {cols,rows,depth,bw,bh,bd,brickMass}=S;
  const gap=0.012, geo=new THREE.BoxGeometry(bd,bh,bw); // x=depth, y=height, z=width (across track)
  let idx=0;
  for(let d=0;d<depth;d++)for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const stagger=(r%2)?bw*0.5:0;
    const z=(c-(cols-1)/2)*(bw+gap)+stagger-(r%2?bw*0.0:0);
    const x=wallX+(d-(depth-1)/2)*(bd+gap);
    const y=bh/2+0.03+r*(bh+gap);
    const body=makeBody(brickMass,bd,bh,bw,x,y,z,physMats.brick,{sleep:true,ld:0.02,ad:0.08});
    body.wakeUpAfterNarrowphase=true;
    const mesh=new THREE.Mesh(geo,brickMats[(idx*7+r*3+c)%brickMats.length]);
    mesh.castShadow=true;mesh.receiveShadow=true;
    pair(body,mesh);bricks.push(body);
    body.sleepState=0; // awake but settled by tiny y offset; solver settles it
    idx++;
  }
}

/* ---------- car: separate rigid bodies + breakable lock joints ---------- */
function buildCar(){
  const L=S.carL,W=S.carW,H=S.carH,M=S.carMass;
  const cm=physMats.car, gm=physMats.glass, wm=physMats.wheel;
  const r=Math.min(0.34,H*0.24);               // wheel radius
  const x0=carStartX;                           // car centre x
  const lowerH=H*0.40, lowerY=r*0.55+lowerH/2;  // lower body
  const cabH=H*0.36, cabY=lowerY+lowerH/2+cabH/2-0.03;
  const parts={}; const reg=(name,body,kind)=>{body._kind=kind;body._name=name;carParts.push(body);parts[name]=body;return body;};

  // main chassis / cabin lower (rear 62%)
  const mainL=L*0.62, mainX=x0-L/2+mainL/2;
  const main=reg('main',makeBody(M*0.42,mainL,lowerH,W*0.96,mainX,lowerY,0,cm),'chassis');
  {const g=new THREE.Group();g.add(boxMesh(mainL,lowerH,W*0.96,MAT.paint));
   const skirt=boxMesh(mainL*0.98,lowerH*0.35,W*0.9,MAT.paintDark);skirt.position.y=-lowerH*0.3;g.add(skirt);pair(main,g);}
  // cabin top (roof frame)
  const cabL=L*0.46,cabX=x0-L*0.06;
  const cab=reg('cabin',makeBody(M*0.16,cabL,cabH,W*0.8,cabX,cabY,0,cm),'chassis');
  {const g=new THREE.Group();g.add(boxMesh(cabL,cabH*0.42,W*0.8,MAT.paint));g.children[0].position.y=cabH*0.29;
   const inner=boxMesh(cabL*0.94,cabH*0.6,W*0.74,MAT.interior);inner.position.y=-cabH*0.12;g.add(inner);pair(cab,g);}
  lockJoint(main,cab,9,'structure');

  // front clip in 3 crumple segments (engine, mid, nose) chained to main
  const segL=[L*0.14,L*0.12,L*0.12]; let fx=x0-L/2+mainL; let prev=main; const segs=[];
  const segNames=['engineBay','frontMid','nose'];
  for(let i=0;i<3;i++){
    const h=lowerH*(1-i*0.14), y=r*0.55+h/2+0.02, cx=fx+segL[i]/2;
    const b=reg(segNames[i],makeBody(M*(0.09-i*0.015),segL[i],h,W*(0.94-i*0.03),cx,y,0,cm),'front');
    {const g=new THREE.Group();g.add(boxMesh(segL[i],h,W*(0.94-i*0.03),MAT.paint));
     if(i===2){ // grille + headlights on the nose
       const gr=boxMesh(0.05,h*0.4,W*0.5,MAT.chrome);gr.position.set(segL[i]/2,0,0);g.add(gr);
       for(const zz of [-W*0.32,W*0.32]){const hl=boxMesh(0.06,h*0.3,W*0.2,MAT.light);hl.position.set(segL[i]/2,h*0.12,zz);g.add(hl);}}
     pair(b,g);}
    lockJoint(prev,b,i===0?5.0:3.6,'front'); // front folds first
    segs.push(b);prev=b;fx+=segL[i];
  }
  noseBody=segs[2];

  // hood (on engine+mid) and trunk lid (rear of main)
  const hood=reg('hood',makeBody(M*0.025,L*0.24,0.05,W*0.78,x0-L/2+mainL+L*0.13,lowerY+lowerH/2+0.05,0,cm),'panel');
  pair(hood,boxMesh(L*0.24,0.05,W*0.78,MAT.paint)); lockJoint(segs[0],hood,3.2,'panel'); lockJoint(segs[1],hood,3.2,'panel');
  const trunk=reg('trunk',makeBody(M*0.02,L*0.2,0.05,W*0.78,x0-L/2+L*0.11,lowerY+lowerH/2+0.05,0,cm),'panel');
  pair(trunk,boxMesh(L*0.2,0.05,W*0.78,MAT.paint)); lockJoint(main,trunk,4.2,'panel');

  // bumpers
  const bf=reg('bumperF',makeBody(M*0.02,0.16,lowerH*0.55,W*0.98,x0+L/2+0.06,r*0.55+lowerH*0.3,0,cm),'panel');
  pair(bf,boxMesh(0.16,lowerH*0.55,W*0.98,MAT.paintDark)); lockJoint(segs[2],bf,2.6,'panel');
  const bb=reg('bumperR',makeBody(M*0.02,0.16,lowerH*0.55,W*0.98,x0-L/2-0.06,r*0.55+lowerH*0.3,0,cm),'panel');
  {const g=new THREE.Group();g.add(boxMesh(0.16,lowerH*0.55,W*0.98,MAT.paintDark));
   for(const zz of [-W*0.32,W*0.32]){const tl=boxMesh(0.05,lowerH*0.25,W*0.2,MAT.tail);tl.position.set(-0.09,lowerH*0.08,zz);g.add(tl);}pair(bb,g);}
  lockJoint(main,bb,4.5,'panel');

  // doors: front L/R, rear L/R
  const doorH=lowerH+cabH*0.35, doorY=lowerY+doorH/2-lowerH/2;
  const doorDefs=[['doorFL',x0+L*0.04,W/2+0.02],['doorFR',x0+L*0.04,-W/2-0.02],['doorRL',x0-L*0.17,W/2+0.02],['doorRR',x0-L*0.17,-W/2-0.02]];
  for(const [nm,dx,dz] of doorDefs){
    const b=reg(nm,makeBody(M*0.02,L*0.19,doorH,0.05,dx,doorY,dz,cm),'door');
    {const g=new THREE.Group();g.add(boxMesh(L*0.19,doorH,0.05,MAT.paint));
     const handle=boxMesh(0.14,0.03,0.03,MAT.chrome);handle.position.set(-L*0.05,doorH*0.08,dz>0?0.04:-0.04);g.add(handle);pair(b,g);}
    lockJoint(main,b,4.6,'door'); lockJoint(cab,b,5.2,'door');
  }

  // windshield: 6 shard bodies forming a slanted pane, held by weak joints
  const slant=0.62, q=new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(0,0,1),slant);
  const wsX=cabX+cabL/2-0.02, wsY=cabY+0.02;
  const shardW=W*0.8/3, shardH=cabH*0.95/2;
  const wsBodies=[];
  for(let row=0;row<2;row++)for(let col=0;col<3;col++){
    const off=new CANNON.Vec3(0,(row-0.5)*(shardH+0.005),0);
    const rot=q.vmult(off);
    const b=reg('ws'+row+col,makeBody(1.2,0.02,shardH,shardW-0.008,wsX+rot.x,wsY+rot.y,(col-1)*(shardW+0.004),gm,{quat:q}),'glass');
    pair(b,boxMesh(0.02,shardH,shardW-0.008,MAT.shard));
    lockJoint(cab,b,2.2,'glass'); wsBodies.push(b);
  }
  // rear glass: 4 shards
  const q2=new CANNON.Quaternion(); q2.setFromAxisAngle(new CANNON.Vec3(0,0,1),-slant);
  for(let row=0;row<2;row++)for(let col=0;col<2;col++){
    const off=new CANNON.Vec3(0,(row-0.5)*(shardH+0.005),0); const rot=q2.vmult(off);
    const b=reg('rg'+row+col,makeBody(1.0,0.02,shardH,W*0.36,cabX-cabL/2+0.02+rot.x,wsY+rot.y,(col-0.5)*(W*0.38),gm,{quat:q2}),'glass');
    pair(b,boxMesh(0.02,shardH,W*0.36,MAT.shard)); lockJoint(cab,b,2.6,'glass');
  }
  // side glass: 2 shards per side on the cabin
  for(const side of [1,-1])for(let i=0;i<2;i++){
    const b=reg('sg'+side+i,makeBody(0.9,cabL*0.42,cabH*0.55,0.02,cabX+(i-0.5)*cabL*0.44,cabY,side*(W*0.41),gm),'glass');
    pair(b,boxMesh(cabL*0.42,cabH*0.55,0.02,MAT.glass)); lockJoint(cab,b,2.8,'glass');
  }

  // wheels: cylinder bodies, locked until a hard hit tears them off, then they roll
  const wheelGeoT=new THREE.CylinderGeometry(r,r,0.22,22), wheelGeoR=new THREE.CylinderGeometry(r*0.55,r*0.55,0.24,16);
  const wheelPos=[[x0+L*0.31,W/2-0.08,segs[0]],[x0+L*0.31,-(W/2-0.08),segs[0]],[x0-L*0.32,W/2-0.08,main],[x0-L*0.32,-(W/2-0.08),main]];
  wheelPos.forEach(([wx,wz,anchor],i)=>{
    const shape=new CANNON.Cylinder(r,r,0.22,12);
    const b=new CANNON.Body({mass:M*0.022,material:wm,position:new CANNON.Vec3(wx,r,wz),linearDamping:0.02,angularDamping:0.08,allowSleep:false});
    b.addShape(shape); // cannon-es cylinders are Z-aligned: axle already across the car
    world.addBody(b); reg('wheel'+i,b,'wheel');
    const g=new THREE.Group();
    const tire=new THREE.Mesh(wheelGeoT,MAT.tire);tire.rotation.x=Math.PI/2;tire.castShadow=true;tire.receiveShadow=true;g.add(tire);
    const rim=new THREE.Mesh(wheelGeoR,MAT.rim);rim.rotation.x=Math.PI/2;rim.castShadow=true;g.add(rim);
    pair(b,g); lockJoint(anchor,b,5.5,'wheel');
  });

  chassisBody=main;
  // launch: every part shares the target velocity so the assembly drives as one
  for(const b of carParts){b.velocity.set(S.speed,0,0);b.angularVelocity.set(0,0,0);}

  // breakable joints: break on hard contact impulse (not on a timer)
  for(const b of carParts){
    b.addEventListener('collide',e=>{
      const iv=Math.abs(e.contact.getImpactVelocityAlongNormal());
      const other=e.body;
      const isBrick=other.material===physMats.brick, isGround=other.material===physMats.ground;
      if(isBrick)registerImpact(iv,e.target.position);
      if(isGround&&iv<3)return; // rolling / settling contact never tears parts off
      for(const j of joints){
        if(j.broken)continue;
        if((j.a===b||j.b===b)&&iv>j.threshold)breakJoint(j);
      }
    });
  }
}

/* ---------- impact FX (visual only, seeded) ---------- */
function buildDust(){
  const N=260, pos=new Float32Array(N*3); dustVel=new Float32Array(N*3);
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(geo,new THREE.PointsMaterial({color:0xcbb59a,size:0.16,transparent:true,opacity:0,depthWrite:false}));
  dust.frustumCulled=false; dynGroup.add(dust);
}
function registerImpact(iv,pos){
  if(impacted&&iv<6)return;
  if(!impacted){impacted=true;shake=Math.min(0.5,iv*0.02);
    const r=mulberry32(42); const p=dust.geometry.attributes.position.array;
    for(let i=0;i<p.length;i+=3){
      p[i]=pos.x+(r()-0.5)*1.2; p[i+1]=Math.max(0.1,pos.y+(r()-0.5)*1.4); p[i+2]=pos.z+(r()-0.5)*2.4;
      dustVel[i]=2+r()*7; dustVel[i+1]=r()*4.5; dustVel[i+2]=(r()-0.5)*7;}
    dust.geometry.attributes.position.needsUpdate=true; dustLife=1.6; dust.material.opacity=0.75;
  } else shake=Math.max(shake,Math.min(0.3,iv*0.012));
}
function updateDust(dt){
  if(!dust||dustLife<=0)return; dustLife-=dt;
  const p=dust.geometry.attributes.position.array;
  for(let i=0;i<p.length;i+=3){p[i]+=dustVel[i]*dt;p[i+1]+=dustVel[i+1]*dt;p[i+2]+=dustVel[i+2]*dt;dustVel[i+1]-=2.2*dt;if(p[i+1]<0.05)p[i+1]=0.05;}
  dust.geometry.attributes.position.needsUpdate=true;
  dust.material.opacity=Math.max(0,Math.min(0.75,dustLife*0.5));
}

/* ---------- rebuild the whole run from S ---------- */
const GRP={ground:1,brick:2,car:4,debris:8};
function rebuild(){
  if(dynGroup){scene.remove(dynGroup);dynGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  dynGroup=new THREE.Group(); scene.add(dynGroup);
  pairs=[];joints=[];carParts=[];bricks=[];impacted=false;brokenCount=0;totalJoints=0;accumulator=0;dustLife=0;shake=0;
  wallX=S.track/2-8; carStartX=-S.track/2+5;

  world=new CANNON.World({gravity:new CANNON.Vec3(0,-S.gravity,0)});
  world.broadphase=new CANNON.SAPBroadphase(world);
  world.allowSleep=true;
  world.solver.iterations=12;
  world.defaultContactMaterial.friction=0.5;

  physMats={ground:new CANNON.Material('ground'),brick:new CANNON.Material('brick'),
    car:new CANNON.Material('car'),glass:new CANNON.Material('glass'),wheel:new CANNON.Material('wheel')};
  const cm=(a,b,f,r)=>world.addContactMaterial(new CANNON.ContactMaterial(a,b,{friction:f,restitution:r,contactEquationStiffness:1e7,contactEquationRelaxation:3}));
  cm(physMats.brick,physMats.brick,S.bFric,S.bRest);
  cm(physMats.brick,physMats.ground,S.gFric,S.bRest);
  cm(physMats.brick,physMats.car,Math.min(1,(S.bFric+S.gFric)/2),S.bRest);
  cm(physMats.brick,physMats.glass,S.bFric*0.6,0.25);
  cm(physMats.brick,physMats.wheel,S.bFric,0.2);
  cm(physMats.car,physMats.ground,S.gFric,0.08);
  cm(physMats.glass,physMats.ground,S.gFric*0.6,0.3);
  cm(physMats.wheel,physMats.ground,S.gFric,0.25);
  cm(physMats.car,physMats.car,0.4,0.1);
  cm(physMats.car,physMats.glass,0.3,0.2);
  cm(physMats.car,physMats.wheel,0.4,0.15);
  cm(physMats.glass,physMats.glass,0.2,0.3);
  cm(physMats.wheel,physMats.wheel,0.5,0.3);
  cm(physMats.glass,physMats.wheel,0.3,0.25);

  const groundBody=new CANNON.Body({mass:0,material:physMats.ground,shape:new CANNON.Plane(),
    collisionFilterGroup:GRP.ground,collisionFilterMask:-1});
  groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
  groundBody.position.y=0.03; // top of the asphalt slab
  world.addBody(groundBody);

  buildEnvironment(); buildWall(); buildCar(); buildDust();

  for(const b of bricks){b.collisionFilterGroup=GRP.brick;b.collisionFilterMask=-1;}
  for(const b of carParts){b.collisionFilterGroup=GRP.car;b.collisionFilterMask=GRP.ground|GRP.brick|GRP.debris;b._debris=false;}

  // tight shadow frustum on track / car / wall
  const c=sun.shadow.camera; c.left=-30;c.right=30;c.top=22;c.bottom=-22;c.near=2;c.far=90;c.updateProjectionMatrix();
  sun.position.set(wallX-14,30,16); sun.target.position.set(wallX-10,0,0);
  if(camMode==='orbit'){controls.target.set(wallX-4,1,0);}
  $('hudState').textContent='driving';
}

/* ---------- per-step physics housekeeping ---------- */
function physicsStep(){
  // drive: hold target speed until the nose reaches the wall (engine, not a script)
  if(!impacted&&chassisBody){
    const noseX=noseBody?niseX(noseBody):chassisBody.position.x;
    if(noseX<wallX-1.2){
      for(const b of carParts){
        if(b._debris)continue;
        b.velocity.x=S.speed;
        if(b.velocity.y<-0.5)b.velocity.y=-0.5;
        b.angularVelocity.scale(0.6,b.angularVelocity);
      }
    }
  }
  world.step(FIXED);
  // joints also fail when stretched apart, or when the chassis sheds speed in the hit
  if(chassisBody){
    const drop=S.speed-chassisBody.velocity.x;
    for(const j of joints){
      if(j.broken)continue;
      const d=j.a.position.distanceTo(j.b.position);
      if(d>j.d0+0.38)breakJoint(j);
      else if(impacted&&drop>j.threshold*1.45)breakJoint(j);
    }
    // fully detached parts become debris and start colliding with the car/each other
    for(const b of carParts){
      if(b._debris||b===chassisBody)continue;
      const mine=joints.filter(j=>j.a===b||j.b===b);
      if(mine.length&&mine.every(j=>j.broken)){
        b._debris=true;b.collisionFilterGroup=GRP.debris;b.collisionFilterMask=-1;b.wakeUp();
      }
    }
  }
}
function niseX(b){return b.position.x;}

/* ---------- playback + camera state (survive Replay) ---------- */
let playing=true, simSpeed=1, camMode='impact';
const camTarget=new THREE.Vector3(), camPos=new THREE.Vector3(8,5,13);
function updateCamera(dt){
  if(!chassisBody)return;
  const cp=chassisBody.position;
  const k=1-Math.pow(0.0015,dt); // smooth, frame-rate independent
  if(camMode==='orbit'){controls.enabled=true;controls.update();return;}
  controls.enabled=false;
  if(camMode==='impact'){
    // three-quarter shot: frames approach, then holds the breakup at the wall
    const tx=impacted?wallX-2.5:Math.min(cp.x+3,wallX-3);
    camPos.set(tx-7.5,4.2,10.5); camTarget.set(tx+1.5,1.0,0);
  }else if(camMode==='follow'){
    camPos.set(cp.x-8.5,3.4,6.5); camTarget.set(cp.x+3.5,0.9,0);
  }else if(camMode==='top'){
    const tx=(cp.x+wallX)/2;
    camPos.set(tx,34,0.01); camTarget.set(tx,0,0);
  }
  camera.position.lerp(camPos,camMode==='top'?k:Math.min(1,k*1.4));
  if(shake>0.003){
    camera.position.x+=(Math.sin(performance.now()*0.09))*shake*0.35;
    camera.position.y+=(Math.cos(performance.now()*0.11))*shake*0.3;
    shake*=Math.pow(0.02,dt);
  }
  camera.lookAt(camTarget);
}

/* ---------- UI wiring ---------- */
function setPlaying(p){playing=p;$('btnPlay').textContent=p?'⏸ Pause':'▶ Play';}
$('btnPlay').onclick=()=>setPlaying(!playing);
$('btnReplay').onclick=()=>{S=readSettings();rebuild();setPlaying(true);};
$('btnApply').onclick=()=>{S=readSettings();rebuild();setPlaying(true);};
$('btnSettings').onclick=()=>$('settings').classList.toggle('open');
$('btnDefaults').onclick=()=>{
  const map={s_speed:'speed',s_carMass:'carMass',s_carL:'carL',s_carW:'carW',s_carH:'carH',s_cols:'cols',s_rows:'rows',
    s_depth:'depth',s_brickMass:'brickMass',s_bw:'bw',s_bh:'bh',s_bd:'bd',s_gravity:'gravity',s_bFric:'bFric',
    s_bRest:'bRest',s_gFric:'gFric',s_track:'track'};
  for(const id in map)$(id).value=DEFAULTS[map[id]];
  S=readSettings();rebuild();setPlaying(true);
};
document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{
  simSpeed=parseFloat(b.dataset.v);
  document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b));});
document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>{
  camMode=b.dataset.v;
  document.querySelectorAll('.cam').forEach(x=>x.classList.toggle('on',x===b));
  if(camMode==='orbit'){controls.target.set(wallX-4,1,0);camera.position.set(wallX-11,5,12);}
  if(camMode==='top')camera.position.set((chassisBody?chassisBody.position.x:0+wallX)/2,34,0.01);
});
addEventListener('keydown',e=>{
  if(e.code==='Space'&&document.activeElement&&document.activeElement.tagName!=='INPUT'){e.preventDefault();setPlaying(!playing);}});

/* ---------- main loop: fixed-step physics, capped steps ---------- */
const clock=new THREE.Clock();
function syncMeshes(){
  for(const p of pairs){p.obj.position.copy(p.body.position);p.obj.quaternion.copy(p.body.quaternion);}
  if(chassisBody&&blob){
    blob.position.x=chassisBody.position.x;blob.position.z=chassisBody.position.z;
    blob.scale.set(S.carL*0.62,S.carW*0.62,1);
    const len=Math.max(0.1,chassisBody.position.x-(carStartX-S.carL*0.32));
    for(const [sk,zz] of [[skidL,S.carW/2-0.08],[skidR,-(S.carW/2-0.08)]]){
      if(!sk)continue; sk.scale.x=len;
      sk.position.set(carStartX-S.carL*0.32+len/2,0.048,zz);}
    $('hudSpeed').textContent=Math.round(Math.abs(chassisBody.velocity.x)*3.6)+' km/h';
    $('hudState').textContent=!playing?'paused':impacted?(brokenCount?'wreck — debris settling':'impact'):'driving';
    $('hudParts').textContent=brokenCount?brokenCount+' / '+totalJoints+' joints broken':'parts intact';
  }
}
function animate(){
  requestAnimationFrame(animate);
  const frameDt=Math.min(clock.getDelta(),0.05);
  if(playing&&world){
    accumulator+=frameDt*simSpeed;
    let steps=0; const MAXSTEPS=16; // 16 x 1/120 s cap per frame
    while(accumulator>=FIXED&&steps<MAXSTEPS){physicsStep();accumulator-=FIXED;steps++;}
    if(steps===MAXSTEPS)accumulator=0; // drop backlog after a hitch
    updateDust(frameDt*simSpeed);
  }
  syncMeshes();
  updateCamera(frameDt);
  renderer.render(scene,camera);
}

/* ---------- first automatic run: mandatory defaults, 1x, playing, Impact ---------- */
S={...DEFAULTS};
rebuild();
setPlaying(true);
animate();
</script>
