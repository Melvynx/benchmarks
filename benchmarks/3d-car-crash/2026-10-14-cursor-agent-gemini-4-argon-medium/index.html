<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini 4 Argon</title>
  <style>
    :root {
      --bg-panel: rgba(14, 17, 23, 0.84);
      --bg-panel-solid: #11151d;
      --border: rgba(255, 255, 255, 0.13);
      --border-focus: rgba(96, 165, 250, 0.7);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-hover: #f87171;
      --blue: #3b82f6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Top Header & Telemetry */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }

    .brand-pill {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ffffff;
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .telemetry span b {
      color: var(--text);
      font-weight: 600;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      z-index: 20;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
    }

    .group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 0 6px 0 4px;
      font-weight: 600;
    }

    button {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, transform 0.06s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.22);
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: var(--blue);
      border-color: rgba(147, 197, 253, 0.6);
      color: #ffffff;
    }

    button.primary {
      background: var(--accent);
      border-color: rgba(252, 165, 165, 0.45);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    /* Settings Drawer */
    .settings-panel {
      position: fixed;
      top: 62px;
      right: 16px;
      bottom: 76px;
      width: 340px;
      max-width: calc(100vw - 32px);
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      z-index: 25;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .settings-panel.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
    }

    .settings-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .settings-body {
      padding: 12px 14px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-bottom: 4px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field-grid.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .field label .unit {
      font-size: 10px;
      opacity: 0.7;
      font-family: var(--mono);
    }

    .field input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      user-select: text;
    }

    .field input[type="number"]:focus {
      border-color: var(--border-focus);
      background: rgba(0, 0, 0, 0.65);
    }

    .settings-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .settings-footer button {
      flex: 1;
      justify-content: center;
      padding: 8px 10px;
    }

    .orbit-hint {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 17, 23, 0.78);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 15;
    }

    .orbit-hint.visible {
      opacity: 1;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div class="top-bar">
    <div class="brand-pill">
      <div class="brand-title">Gemini 4 Argon</div>
      <div class="telemetry">
        <span>T <b id="tel-time">0.00</b>s</span>
        <span>SPD <b id="tel-speed">0.0</b> m/s</span>
        <span>JOINTS <b id="tel-joints">0/0</b></span>
        <span>DEBRIS <b id="tel-debris">0</b></span>
      </div>
    </div>
    <div style="pointer-events: auto;">
      <button id="btn-toggle-settings" class="active" title="Toggle Settings Panel">Settings</button>
    </div>
  </div>

  <div id="orbit-hint" class="orbit-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <aside id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <span>Experiment Parameters</span>
      <button id="btn-close-settings" style="padding: 2px 7px; font-size: 11px;">Hide</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="section-heading">Vehicle Dynamics &amp; Dimensions</div>
        <div class="field-grid">
          <div class="field">
            <label for="inp-speed">Impact Speed <span class="unit">m/s</span></label>
            <input id="inp-speed" type="number" step="1" min="2" max="75" value="22" />
          </div>
          <div class="field">
            <label for="inp-car-mass">Car Mass <span class="unit">kg</span></label>
            <input id="inp-car-mass" type="number" step="50" min="300" max="6000" value="1250" />
          </div>
        </div>
        <div class="field-grid three">
          <div class="field">
            <label for="inp-car-length">Length <span class="unit">m</span></label>
            <input id="inp-car-length" type="number" step="0.1" min="2.4" max="7.0" value="4.2" />
          </div>
          <div class="field">
            <label for="inp-car-width">Width <span class="unit">m</span></label>
            <input id="inp-car-width" type="number" step="0.05" min="1.2" max="2.8" value="1.8" />
          </div>
          <div class="field">
            <label for="inp-car-height">Height <span class="unit">m</span></label>
            <input id="inp-car-height" type="number" step="0.05" min="1.0" max="2.4" value="1.45" />
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-heading">Brick Wall Structure</div>
        <div class="field-grid three">
          <div class="field">
            <label for="inp-wall-cols">Columns</label>
            <input id="inp-wall-cols" type="number" step="1" min="2" max="24" value="12" />
          </div>
          <div class="field">
            <label for="inp-wall-rows">Rows</label>
            <input id="inp-wall-rows" type="number" step="1" min="2" max="18" value="8" />
          </div>
          <div class="field">
            <label for="inp-wall-depth">Depth</label>
            <input id="inp-wall-depth" type="number" step="1" min="1" max="5" value="2" />
          </div>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="inp-brick-mass">Brick Mass <span class="unit">kg</span></label>
            <input id="inp-brick-mass" type="number" step="0.5" min="0.2" max="50" value="2.5" />
          </div>
          <div class="field">
            <label for="inp-brick-w">Brick Width <span class="unit">m</span></label>
            <input id="inp-brick-w" type="number" step="0.02" min="0.2" max="1.2" value="0.50" />
          </div>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="inp-brick-h">Brick Height <span class="unit">m</span></label>
            <input id="inp-brick-h" type="number" step="0.02" min="0.1" max="0.8" value="0.24" />
          </div>
          <div class="field">
            <label for="inp-brick-d">Brick Depth <span class="unit">m</span></label>
            <input id="inp-brick-d" type="number" step="0.02" min="0.1" max="0.8" value="0.20" />
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-heading">Environment &amp; Physics</div>
        <div class="field-grid">
          <div class="field">
            <label for="inp-gravity">Gravity <span class="unit">m/s²</span></label>
            <input id="inp-gravity" type="number" step="0.1" min="0.5" max="30" value="9.81" />
          </div>
          <div class="field">
            <label for="inp-track-len">Track Length <span class="unit">m</span></label>
            <input id="inp-track-len" type="number" step="2" min="20" max="100" value="40" />
          </div>
        </div>
        <div class="field-grid three">
          <div class="field">
            <label for="inp-brick-fric">Brick Fric</label>
            <input id="inp-brick-fric" type="number" step="0.02" min="0.05" max="1.5" value="0.72" />
          </div>
          <div class="field">
            <label for="inp-brick-rest">Brick Rest</label>
            <input id="inp-brick-rest" type="number" step="0.02" min="0.0" max="0.9" value="0.18" />
          </div>
          <div class="field">
            <label for="inp-ground-fric">Ground Fric</label>
            <input id="inp-ground-fric" type="number" step="0.05" min="0.05" max="1.5" value="0.85" />
          </div>
        </div>
      </div>
    </div>
    <div class="settings-footer">
      <button id="btn-reset-defaults" title="Restore Mandatory Defaults">Defaults</button>
      <button id="btn-apply" class="primary" title="Rebuild Simulation with Current Values">Apply &amp; Run</button>
    </div>
  </aside>

  <div class="bottom-bar">
    <div class="ctrl-group">
      <button id="btn-play-pause" title="Pause / Play (Space)">Pause</button>
      <button id="btn-replay" class="primary" title="Rebuild Run">Replay</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-group" id="speed-group">
      <span class="group-label">Speed</span>
      <button data-speed="0.25">0.25×</button>
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-group" id="camera-group">
      <span class="group-label">Camera</span>
      <button data-cam="impact" class="active">Impact</button>
      <button data-cam="follow">Follow</button>
      <button data-cam="top">Top</button>
      <button data-cam="orbit">Orbit</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as CANNON from 'cannon-es';

    // Mandatory default values
    const MANDATORY_DEFAULTS = Object.freeze({
      impactSpeed: 22,
      carMass: 1250,
      carLength: 4.2,
      carWidth: 1.8,
      carHeight: 1.45,
      wallCols: 12,
      wallRows: 8,
      wallDepth: 2,
      brickMass: 2.5,
      brickWidth: 0.50,
      brickHeight: 0.24,
      brickDepth: 0.20,
      gravity: 9.81,
      brickFriction: 0.72,
      brickRestitution: 0.18,
      groundFriction: 0.85,
      trackLength: 40
    });

    // Deterministic seeded PRNG (Mulberry32) - never used to alter physics setup, only textures/visual variation
    function createSeededRandom(seed = 1337420) {
      let a = seed >>> 0;
      return function () {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Collision filter groups
    const GROUP_GROUND = 1;
    const GROUP_BRICK = 2;
    const GROUP_CAR_CORE = 4;
    const GROUP_CAR_PANEL = 8;
    const GROUP_CAR_WHEEL = 16;
    const GROUP_CAR_GLASS = 32;

    // Renderer & Scene Setup
    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161d29);
    scene.fog = new THREE.FogExp2(0x161d29, 0.0085);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    pmremGenerator.dispose();

    // Camera & OrbitControls
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 220);
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.maxPolarAngle = Math.PI * 0.49;
    orbitControls.minDistance = 2.0;
    orbitControls.maxDistance = 85.0;
    orbitControls.enabled = false;

    // Lighting: Single crisp Directional Sun Light with tight shadow frustum + hemisphere fill
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.45);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7ed, 2.5);
    sunLight.position.set(14, 24, 16);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 75;
    sunLight.shadow.bias = -0.00035;
    sunLight.shadow.normalBias = 0.015;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // Procedural Textures (Asphalt, Grass/Gravel, Contact Shadow Blob)
    function makeAsphaltTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      const rng = createSeededRandom(9001);
      ctx.fillStyle = '#22262e';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 18000; i++) {
        const x = Math.floor(rng() * 512);
        const y = Math.floor(rng() * 512);
        const v = Math.floor(24 + rng() * 34);
        ctx.fillStyle = `rgb(${v},${v + 2},${v + 5})`;
        ctx.fillRect(x, y, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    function makeContactBlobTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 6, 64, 64, 62);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      grad.addColorStop(0.55, 'rgba(0, 0, 0, 0.25)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    const asphaltTex = makeAsphaltTexture();
    const contactBlobTex = makeContactBlobTexture();

    // Shared Materials
    const materials = {
      asphalt: new THREE.MeshStandardMaterial({
        map: asphaltTex,
        roughness: 0.88,
        metalness: 0.05
      }),
      shoulder: new THREE.MeshStandardMaterial({
        color: 0x263124,
        roughness: 0.96,
        metalness: 0.0
      }),
      curbRed: new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.7 }),
      curbWhite: new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.7 }),
      laneLine: new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 }),
      startLine: new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 }),
      guardrail: new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.45, metalness: 0.65 }),
      carPaint: new THREE.MeshPhysicalMaterial({
        color: 0xd92626,
        metalness: 0.55,
        roughness: 0.22,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        envMapIntensity: 1.25
      }),
      carSecondaryPaint: new THREE.MeshPhysicalMaterial({
        color: 0xb91c1c,
        metalness: 0.5,
        roughness: 0.28,
        clearcoat: 0.85,
        clearcoatRoughness: 0.12
      }),
      carChassisDark: new THREE.MeshStandardMaterial({
        color: 0x181b22,
        roughness: 0.65,
        metalness: 0.45
      }),
      carInterior: new THREE.MeshStandardMaterial({
        color: 0x1e222b,
        roughness: 0.85,
        metalness: 0.1
      }),
      carBumperTrim: new THREE.MeshStandardMaterial({
        color: 0x1f242d,
        roughness: 0.45,
        metalness: 0.25
      }),
      carChrome: new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        roughness: 0.15,
        metalness: 0.92
      }),
      carGlass: new THREE.MeshPhysicalMaterial({
        color: 0xa5f3fc,
        metalness: 0.05,
        roughness: 0.06,
        transmission: 0.78,
        transparent: true,
        opacity: 0.88,
        ior: 1.5,
        reflectivity: 0.9,
        side: THREE.DoubleSide
      }),
      tireRubber: new THREE.MeshStandardMaterial({
        color: 0x16181d,
        roughness: 0.88,
        metalness: 0.06
      }),
      headlightGlow: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xfef08a,
        emissiveIntensity: 2.2,
        roughness: 0.1
      }),
      taillightGlow: new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xdc2626,
        emissiveIntensity: 1.8,
        roughness: 0.2
      }),
      contactBlob: new THREE.MeshBasicMaterial({
        map: contactBlobTex,
        transparent: true,
        depthWrite: false,
        opacity: 0.72
      }),
      skidMark: new THREE.MeshBasicMaterial({
        color: 0x0b0d11,
        transparent: true,
        opacity: 0.48,
        depthWrite: false
      }),
      spark: new THREE.MeshBasicMaterial({
        color: 0xfbbf24
      }),
      dust: new THREE.MeshStandardMaterial({
        color: 0x9ca3af,
        transparent: true,
        opacity: 0.42,
        roughness: 0.95
      })
    };

    function writeSettingsToInputs(cfg) {
      inputs.impactSpeed.value = cfg.impactSpeed;
      inputs.carMass.value = cfg.carMass;
      inputs.carLength.value = cfg.carLength;
      inputs.carWidth.value = cfg.carWidth;
      inputs.carHeight.value = cfg.carHeight;

      inputs.brickRestitution.value = cfg.brickRestitution;
      inputs.groundFriction.value = cfg.groundFriction;
      inputs.trackLength.value = cfg.trackLength;
    }

    function clampNum(val, min, max, fallback) {
      const n = parseFloat(val);
      if (Number.isNaN(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function readSettingsFromInputs() {
      return {
        impactSpeed: clampNum(inputs.impactSpeed.value, 2, 80, MANDATORY_DEFAULTS.impactSpeed),
        carMass: clampNum(inputs.carMass.value, 250, 8000, MANDATORY_DEFAULTS.carMass),
        carLength: clampNum(inputs.carLength.value, 2.2, 8.0, MANDATORY_DEFAULTS.carLength),
        carWidth: clampNum(inputs.carWidth.value, 1.1, 3.2, MANDATORY_DEFAULTS.carWidth),
        carHeight: clampNum(inputs.carHeight.value, 0.9, 2.8, MANDATORY_DEFAULTS.carHeight),
        wallCols: Math.round(clampNum(inputs.wallCols.value, 2, 26, MANDATORY_DEFAULTS.wallCols)),
        wallRows: Math.round(clampNum(inputs.wallRows.value, 2, 20, MANDATORY_DEFAULTS.wallRows)),
        wallDepth: Math.round(clampNum(inputs.wallDepth.value, 1, 6, MANDATORY_DEFAULTS.wallDepth)),
        brickMass: clampNum(inputs.brickMass.value, 0.1, 80, MANDATORY_DEFAULTS.brickMass),
        brickWidth: clampNum(inputs.brickWidth.value, 0.18, 1.5, MANDATORY_DEFAULTS.brickWidth),
        brickHeight: clampNum(inputs.brickHeight.value, 0.08, 1.0, MANDATORY_DEFAULTS.brickHeight),
        brickDepth: clampNum(inputs.brickDepth.value, 0.08, 1.0, MANDATORY_DEFAULTS.brickDepth),
        gravity: clampNum(inputs.gravity.value, 0.2, 40, MANDATORY_DEFAULTS.gravity),
        brickFriction: clampNum(inputs.brickFriction.value, 0.02, 2.0, MANDATORY_DEFAULTS.brickFriction),
        brickRestitution: clampNum(inputs.brickRestitution.value, 0.0, 0.95, MANDATORY_DEFAULTS.brickRestitution),
        groundFriction: clampNum(inputs.groundFriction.value, 0.02, 2.0, MANDATORY_DEFAULTS.groundFriction),
        trackLength: clampNum(inputs.trackLength.value, 18, 120, MANDATORY_DEFAULTS.trackLength)
      };
    }

    // Helper to register rigid body + mesh + optional small ground contact blob
    function registerRigidEntity(body, mesh, opts = {}) {
      world.addBody(body);
      dynamicGroup.add(mesh);
      let blob = null;
      if (opts.hasContactBlob) {
        const blobGeo = new THREE.PlaneGeometry(opts.blobW || 0.8, opts.blobL || 0.8);
        blobGeo.rotateX(-Math.PI / 2);
        blob = new THREE.Mesh(blobGeo, materials.contactBlob);
        blob.position.y = 0.004;
        dynamicGroup.add(blob);
      }
      const entry = {
        body,
        mesh,
        blob,
        isCarPart: !!opts.isCarPart,
        isBrick: !!opts.isBrick,
        partName: opts.partName || '',
        detached: false
      };
      syncedPairs.push(entry);
      return entry;
    }

    // Build Environment & Race Track
    function buildTrackEnvironment(cfg) {
      const trackLen = cfg.trackLength;
      const wallSpan = cfg.wallCols * cfg.brickWidth;
      const roadWidth = Math.max(9.2, wallSpan + 3.6);
      const totalSurfaceLen = trackLen + 28;

      asphaltTex.repeat.set(totalSurfaceLen / 5, roadWidth / 5);

      // Asphalt surface
      const roadGeo = new THREE.PlaneGeometry(totalSurfaceLen, roadWidth);
      roadGeo.rotateX(-Math.PI / 2);
      const roadMesh = new THREE.Mesh(roadGeo, materials.asphalt);
      roadMesh.receiveShadow = true;
      dynamicGroup.add(roadMesh);

      // Grass / gravel outer ground plane
      const groundGeo = new THREE.PlaneGeometry(240, 240);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMesh = new THREE.Mesh(groundGeo, materials.shoulder);
      groundMesh.position.y = -0.015;
      groundMesh.receiveShadow = true;
      dynamicGroup.add(groundMesh);

      // Red & White racing curbs along both edges of the track
      const curbSegmentLen = 1.6;
      const curbCount = Math.floor(totalSurfaceLen / curbSegmentLen);
      const curbGeo = new THREE.BoxGeometry(curbSegmentLen, 0.045, 0.42);
      const halfRoad = roadWidth * 0.5;
      const startCurbX = -totalSurfaceLen * 0.5 + curbSegmentLen * 0.5;

      for (let i = 0; i < curbCount; i++) {
        const mat = i % 2 === 0 ? materials.curbRed : materials.curbWhite;
        const cx = startCurbX + i * curbSegmentLen;

        const leftCurb = new THREE.Mesh(curbGeo, mat);
        leftCurb.position.set(cx, 0.02, -halfRoad - 0.21);
        leftCurb.receiveShadow = true;
        dynamicGroup.add(leftCurb);

        const rightCurb = new THREE.Mesh(curbGeo, mat);
        rightCurb.position.set(cx, 0.02, halfRoad + 0.21);
        rightCurb.receiveShadow = true;
        dynamicGroup.add(rightCurb);
      }

      // Dashed yellow centerline & solid white edge markings
      const edgeLineGeo = new THREE.PlaneGeometry(totalSurfaceLen, 0.12);
      edgeLineGeo.rotateX(-Math.PI / 2);
      const leftEdgeLine = new THREE.Mesh(edgeLineGeo, materials.startLine);
      leftEdgeLine.position.set(0, 0.003, -halfRoad + 0.25);
      dynamicGroup.add(leftEdgeLine);

      const rightEdgeLine = new THREE.Mesh(edgeLineGeo, materials.startLine);
      rightEdgeLine.position.set(0, 0.003, halfRoad - 0.25);
      dynamicGroup.add(rightEdgeLine);

      const dashGeo = new THREE.PlaneGeometry(1.8, 0.12);
      dashGeo.rotateX(-Math.PI / 2);
      for (let x = -trackLen * 0.5; x < trackLen * 0.5; x += 3.6) {
        const dash = new THREE.Mesh(dashGeo, materials.laneLine);
        dash.position.set(x, 0.003, 0);
        dynamicGroup.add(dash);
      }

      // Start box / grid stripes near car start
      const startStripeGeo = new THREE.PlaneGeometry(0.45, roadWidth * 0.72);
      startStripeGeo.rotateX(-Math.PI / 2);
      const startStripe = new THREE.Mesh(startStripeGeo, materials.startLine);
      startStripe.position.set(startX + cfg.carLength * 0.65, 0.004, 0);
      dynamicGroup.add(startStripe);

      // Trackside low guardrails & light poles (behind the track so they never block camera)
      const railOffsetZ = -halfRoad - 2.4;
      const railBeamGeo = new THREE.BoxGeometry(totalSurfaceLen, 0.28, 0.08);
      const railBeam = new THREE.Mesh(railBeamGeo, materials.guardrail);
      railBeam.position.set(0, 0.55, railOffsetZ);
      dynamicGroup.add(railBeam);

      const postGeo = new THREE.BoxGeometry(0.12, 0.75, 0.12);
      for (let x = -trackLen * 0.5; x <= trackLen * 0.5; x += 4.0) {
        const post = new THREE.Mesh(postGeo, materials.guardrail);
        post.position.set(x, 0.375, railOffsetZ - 0.06);
        dynamicGroup.add(post);
      }

      // Light standards along back side
      const poleGeo = new THREE.CylinderGeometry(0.08, 0.11, 7.5, 8);
      const armGeo = new THREE.BoxGeometry(0.12, 0.12, 1.8);
      const lampGeo = new THREE.BoxGeometry(0.5, 0.1, 0.3);
      for (let x = -trackLen * 0.4; x <= trackLen * 0.45; x += 12) {
        const pole = new THREE.Mesh(poleGeo, materials.guardrail);
        pole.position.set(x, 3.75, railOffsetZ - 1.2);
        dynamicGroup.add(pole);

        const arm = new THREE.Mesh(armGeo, materials.guardrail);
        arm.position.set(x, 7.4, railOffsetZ - 0.4);
        dynamicGroup.add(arm);

        const lamp = new THREE.Mesh(lampGeo, materials.headlightGlow);
        lamp.position.set(x, 7.33, railOffsetZ + 0.35);
        dynamicGroup.add(lamp);
      }
    }

    // Build Freestanding Staggered Running-Bond Brick Wall
    function buildBrickWall(cfg, brickPhysMat) {
      const cols = cfg.wallCols;
      const rows = cfg.wallRows;
      const depthLayers = cfg.wallDepth;
      const bw = cfg.brickWidth;
      const bh = cfg.brickHeight;
      const bd = cfg.brickDepth;
      const bMass = cfg.brickMass;

      // Visual mortar gap so every brick and bond line reads clearly
      const visualGap = 0.008;
      const meshW = Math.max(0.04, bw - visualGap);
      const meshH = Math.max(0.04, bh - visualGap);
      const meshD = Math.max(0.04, bd - visualGap);
      const brickGeo = new THREE.BoxGeometry(meshD, meshH, meshW);

      // Physics half-extents: exact height so rows stack flush without vertical bounce, tiny horizontal clearance
      const physHalfX = (bd - 0.002) * 0.5;
      const physHalfY = bh * 0.5;
      const physHalfZ = (bw - 0.002) * 0.5;
      const brickShape = new CANNON.Box(new CANNON.Vec3(physHalfX, physHalfY, physHalfZ));

      const colorRng = createSeededRandom(77123);
      const totalDepthSpan = depthLayers * bd;
      const firstLayerX = wallX - totalDepthSpan * 0.5 + bd * 0.5;

      for (let d = 0; d < depthLayers; d++) {
        const bx = firstLayerX + d * bd;
        for (let r = 0; r < rows; r++) {
          const by = physHalfY + r * bh;
          // Staggered running bond: alternate rows offset by half a brick width
          const staggerOffset = (r + d) % 2 === 1 ? bw * 0.25 : -bw * 0.25;
          const rowStartZ = -((cols - 1) * bw) * 0.5 + staggerOffset;

          for (let c = 0; c < cols; c++) {
            const bz = rowStartZ + c * bw;
            const matIdx = Math.floor(colorRng() * brickMaterials.length);
            const mesh = new THREE.Mesh(brickGeo, brickMaterials[matIdx]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.set(bx, by, bz);

            const body = new CANNON.Body({
              mass: bMass,
              material: brickPhysMat,
              shape: brickShape,
              linearDamping: 0.03,
              angularDamping: 0.08,
              allowSleep: true,
              sleepSpeedLimit: 0.12,
              sleepTimeLimit: 0.15,
              collisionFilterGroup: GROUP_BRICK,
              collisionFilterMask:
                GROUP_GROUND |
                GROUP_BRICK |
                GROUP_CAR_CORE |
                GROUP_CAR_PANEL |
                GROUP_CAR_WHEEL |
                GROUP_CAR_GLASS
            });
            body.position.set(bx, by, bz);
            // Start bricks asleep so freestanding wall is rock-solid until hit
            body.sleep();

            registerRigidEntity(body, mesh, { isBrick: true, partName: 'brick' });
          }
        }
      }
    }

    // Build Multi-Body Destructible Car with Breakable Constraints
    function buildCar(cfg, carPhysMat, wheelPhysMat, glassPhysMat) {
      const L = cfg.carLength;
      const W = cfg.carWidth;
      const H = cfg.carHeight;
      const M = cfg.carMass;
      const V0 = cfg.impactSpeed;

      const wheelRadius = Math.min(0.42, Math.max(0.26, H * 0.24));
      const wheelWidth = Math.min(0.32, Math.max(0.18, W * 0.145));
      const groundClearance = wheelRadius * 0.58;
      const chassisBaseY = groundClearance + H * 0.22;

      // Helper to create a car part body + mesh
      function createCarPart({
        name,
        massFraction,
        pos,
        shapeSize,
        meshGroup,
        filterGroup = GROUP_CAR_PANEL,
        filterMask = GROUP_GROUND | GROUP_BRICK | GROUP_CAR_PANEL | GROUP_CAR_WHEEL,
        physMat = carPhysMat,
        hasBlob = false
      }) {
        const partMass = Math.max(1.5, M * massFraction);
        const halfExtents = new CANNON.Vec3(shapeSize[0] * 0.5, shapeSize[1] * 0.5, shapeSize[2] * 0.5);
        const body = new CANNON.Body({
          mass: partMass,
          material: physMat,
          shape: new CANNON.Box(halfExtents),
          linearDamping: 0.015,
          angularDamping: 0.05,
          allowSleep: false,
          collisionFilterGroup: filterGroup,
          collisionFilterMask: filterMask
        });
        body.position.set(pos[0], pos[1], pos[2]);
        body.velocity.set(V0, 0, 0);

        meshGroup.position.set(pos[0], pos[1], pos[2]);
        meshGroup.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        const entry = registerRigidEntity(body, meshGroup, {
          isCarPart: true,
          partName: name,
          hasContactBlob: hasBlob,
          blobW: shapeSize[2] * 0.9,
          blobL: shapeSize[0] * 0.9
        });
        return entry;
      }

      // 1. Rear / Main Cabin Core (Chassis + Roof + Rear Quarters + Interior)
      const cabinLen = L * 0.52;
      const cabinH = H * 0.36;
      const cabinX = startX - L * 0.10;
      const cabinY = chassisBaseY;

      const cabinVisual = new THREE.Group();
      // Lower tub + rear quarters
      const tubMesh = new THREE.Mesh(
        new THREE.BoxGeometry(cabinLen, cabinH, W * 0.94),
        materials.carPaint
      );
      cabinVisual.add(tubMesh);

      // Underbody dark sill
      const sillMesh = new THREE.Mesh(
        new THREE.BoxGeometry(cabinLen * 1.02, cabinH * 0.28, W * 0.96),
        materials.carChassisDark
      );
      sillMesh.position.y = -cabinH * 0.38;
      cabinVisual.add(sillMesh);

      // Interior cabin seats & dashboard block
      const interiorMesh = new THREE.Mesh(
        new THREE.BoxGeometry(cabinLen * 0.68, H * 0.28, W * 0.74),
        materials.carInterior
      );
      interiorMesh.position.set(0, cabinH * 0.52, 0);
      cabinVisual.add(interiorMesh);

      // Roof panel & A/B/C pillars
      const roofLen = cabinLen * 0.66;
      const roofY = cabinH * 0.5 + H * 0.36;
      const roofMesh = new THREE.Mesh(
        new THREE.BoxGeometry(roofLen, H * 0.055, W * 0.78),
        materials.carPaint
      );
      roofMesh.position.set(-cabinLen * 0.04, roofY, 0);
      cabinVisual.add(roofMesh);

      // Pillars (left & right A, B, C pillars)
      const pillarGeo = new THREE.BoxGeometry(0.08, H * 0.38, 0.07);
      const pillarPositions = [
        [roofLen * 0.46, cabinH * 0.5 + H * 0.18, -W * 0.41, -0.45],
        [roofLen * 0.46, cabinH * 0.5 + H * 0.18, W * 0.41, -0.45],
        [-0.05, cabinH * 0.5 + H * 0.18, -W * 0.41, 0],
        [-0.05, cabinH * 0.5 + H * 0.18, W * 0.41, 0],
        [-roofLen * 0.52, cabinH * 0.5 + H * 0.18, -W * 0.41, 0.5],
        [-roofLen * 0.52, cabinH * 0.5 + H * 0.18, W * 0.41, 0.5]
      ];
      for (const [px, py, pz, rz] of pillarPositions) {
        const p = new THREE.Mesh(pillarGeo, materials.carChassisDark);
        p.position.set(px, py, pz);
        p.rotation.z = rz;
        cabinVisual.add(p);
      }

      // Rear taillights on rear of cabin
      const tailGeo = new THREE.BoxGeometry(0.06, H * 0.10, W * 0.24);
      const tailL = new THREE.Mesh(tailGeo, materials.taillightGlow);
      tailL.position.set(-cabinLen * 0.5, cabinH * 0.16, -W * 0.32);
      cabinVisual.add(tailL);
      const tailR = new THREE.Mesh(tailGeo, materials.taillightGlow);
      tailR.position.set(-cabinLen * 0.5, cabinH * 0.16, W * 0.32);
      cabinVisual.add(tailR);

      const cabinEntry = createCarPart({
        name: 'cabin',
        massFraction: 0.44,
        pos: [cabinX, cabinY, 0],
        shapeSize: [cabinLen, cabinH, W * 0.90],
        meshGroup: cabinVisual,
        filterGroup: GROUP_CAR_CORE,
        filterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_CORE | GROUP_CAR_PANEL
      });
      cabinBody = cabinEntry.body;

      // Large contact shadow under main car footprint
      const mainShadowGeo = new THREE.PlaneGeometry(L * 1.18, W * 1.22);
      mainShadowGeo.rotateX(-Math.PI / 2);
      carMainShadowBlob = new THREE.Mesh(mainShadowGeo, materials.contactBlob);
      carMainShadowBlob.position.set(startX, 0.005, 0);
      dynamicGroup.add(carMainShadowBlob);

      // 2. Front Clip / Engine Subframe (Crumples and folds relative to Cabin on impact)
      const frontClipLen = L * 0.24;
      const frontClipH = H * 0.31;
      const frontClipX = cabinX + cabinLen * 0.5 + frontClipLen * 0.5 + 0.02;
      const frontClipY = chassisBaseY - H * 0.02;

      const frontClipVisual = new THREE.Group();
      const engineBlockMesh = new THREE.Mesh(
        new THREE.BoxGeometry(frontClipLen * 0.92, frontClipH * 0.92, W * 0.72),
        materials.carChassisDark
      );
      frontClipVisual.add(engineBlockMesh);

      const valveCoverMesh = new THREE.Mesh(
        new THREE.BoxGeometry(frontClipLen * 0.55, frontClipH * 0.25, W * 0.42),
        materials.carChrome
      );
      valveCoverMesh.position.y = frontClipH * 0.48;
      frontClipVisual.add(valveCoverMesh);

      const frontClipEntry = createCarPart({
        name: 'frontClip',
        massFraction: 0.18,
        pos: [frontClipX, frontClipY, 0],
        shapeSize: [frontClipLen, frontClipH, W * 0.78],
        meshGroup: frontClipVisual,
        filterGroup: GROUP_CAR_CORE,
        filterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_CORE | GROUP_CAR_PANEL,
        hasBlob: true
      });
      frontClipBody = frontClipEntry.body;

      // 3. Front Crumple Nose / Radiator Core (Forwardmost structural zone)
      const noseLen = L * 0.14;
      const noseH = H * 0.27;
      const noseX = frontClipX + frontClipLen * 0.5 + noseLen * 0.5 + 0.02;
      const noseY = frontClipY - 0.02;

      const noseVisual = new THREE.Group();
      const radiatorMesh = new THREE.Mesh(
        new THREE.BoxGeometry(noseLen * 0.94, noseH * 0.9, W * 0.80),
        materials.carChassisDark
      );
      noseVisual.add(radiatorMesh);

      // Headlights + Front Grille
      const grilleMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, noseH * 0.55, W * 0.46),
        materials.carChrome
      );
      grilleMesh.position.set(noseLen * 0.48, 0, 0);
      noseVisual.add(grilleMesh);

      const headGeo = new THREE.BoxGeometry(0.07, noseH * 0.36, W * 0.18);
      const headL = new THREE.Mesh(headGeo, materials.headlightGlow);
      headL.position.set(noseLen * 0.47, noseH * 0.15, -W * 0.34);
      noseVisual.add(headL);
      const headR = new THREE.Mesh(headGeo, materials.headlightGlow);
      headR.position.set(noseLen * 0.47, noseH * 0.15, W * 0.34);
      noseVisual.add(headR);

      const noseEntry = createCarPart({
        name: 'frontNose',
        massFraction: 0.07,
        pos: [noseX, noseY, 0],
        shapeSize: [noseLen, noseH, W * 0.82],
        meshGroup: noseVisual,
        filterGroup: GROUP_CAR_CORE,
        filterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_CORE | GROUP_CAR_PANEL
      });
      frontNoseBody = noseEntry.body;

      // 4. Hood (Buckles upward & tears off when front clip crumples)
      const hoodLen = frontClipLen + noseLen * 0.9;
      const hoodW = W * 0.86;
      const hoodThick = 0.065;
      const hoodX = frontClipX + noseLen * 0.38;
      const hoodY = frontClipY + frontClipH * 0.5 + hoodThick * 0.65;

      const hoodVisual = new THREE.Group();
      const hoodPanel = new THREE.Mesh(
        new THREE.BoxGeometry(hoodLen, hoodThick, hoodW),
        materials.carPaint
      );
      // Slight aerodynamic power dome in center of hood
      const hoodDome = new THREE.Mesh(
        new THREE.BoxGeometry(hoodLen * 0.72, hoodThick * 0.6, hoodW * 0.42),
        materials.carPaint
      );
      hoodDome.position.y = hoodThick * 0.4;
      hoodVisual.add(hoodPanel, hoodDome);

      const hoodEntry = createCarPart({
        name: 'hood',
        massFraction: 0.035,
        pos: [hoodX, hoodY, 0],
        shapeSize: [hoodLen * 0.92, hoodThick * 1.4, hoodW * 0.92],
        meshGroup: hoodVisual,
        hasBlob: true
      });
      hoodBody = hoodEntry.body;

      // 5. Front Fenders (Left & Right)
      const fenderLen = frontClipLen + noseLen * 0.82;
      const fenderH = frontClipH * 0.88;
      const fenderThick = 0.08;
      [-1, 1].forEach((side) => {
        const fz = side * (W * 0.46);
        const fVis = new THREE.Group();
        const fMesh = new THREE.Mesh(
          new THREE.BoxGeometry(fenderLen, fenderH, fenderThick),
          materials.carPaint
        );
        fVis.add(fMesh);

        const fEntry = createCarPart({
          name: side < 0 ? 'fenderFL' : 'fenderFR',
          massFraction: 0.02,
          pos: [frontClipX + noseLen * 0.3, frontClipY, fz],
          shapeSize: [fenderLen * 0.9, fenderH * 0.9, fenderThick * 1.4],
          meshGroup: fVis,
          hasBlob: true
        });

        addBreakableLock(frontClipBody, fEntry.body, fEntry, 130, {
          lateralImpulse: side * 3.5,
          upImpulse: 2.2
        });
      });

      // 6. Front Bumper
      const bumpW = W * 0.98;
      const bumpH = H * 0.19;
      const bumpLen = 0.18;
      const bumpFX = noseX + noseLen * 0.5 + bumpLen * 0.5 + 0.01;
      const bumpFY = noseY - 0.03;

      const bumpFVis = new THREE.Group();
      const bumpFMain = new THREE.Mesh(
        new THREE.BoxGeometry(bumpLen, bumpH, bumpW),
        materials.carPaint
      );
      const bumpFSplitter = new THREE.Mesh(
        new THREE.BoxGeometry(bumpLen * 1.15, bumpH * 0.28, bumpW * 1.01),
        materials.carBumperTrim
      );
      bumpFSplitter.position.y = -bumpH * 0.38;
      bumpFVis.add(bumpFMain, bumpFSplitter);

      const bumpFEntry = createCarPart({
        name: 'bumperF',
        massFraction: 0.025,
        pos: [bumpFX, bumpFY, 0],
        shapeSize: [bumpLen, bumpH, bumpW * 0.94],
        meshGroup: bumpFVis,
        hasBlob: true
      });

      // 7. Rear Bumper
      const bumpRX = cabinX - cabinLen * 0.5 - bumpLen * 0.5 - 0.02;
      const bumpRY = cabinY - H * 0.05;
      const bumpRVis = new THREE.Group();
      const bumpRMain = new THREE.Mesh(
        new THREE.BoxGeometry(bumpLen, bumpH, bumpW),
        materials.carPaint
      );
      const bumpRDiffuser = new THREE.Mesh(
        new THREE.BoxGeometry(bumpLen * 1.1, bumpH * 0.32, bumpW * 0.96),
        materials.carBumperTrim
      );
      bumpRDiffuser.position.y = -bumpH * 0.36;
      bumpRVis.add(bumpRMain, bumpRDiffuser);

      const bumpREntry = createCarPart({
        name: 'bumperR',
        massFraction: 0.022,
        pos: [bumpRX, bumpRY, 0],
        shapeSize: [bumpLen, bumpH, bumpW * 0.94],
        meshGroup: bumpRVis,
        hasBlob: true
      });

      // 8. Trunk Lid
      const trunkLen = cabinLen * 0.28;
      const trunkW = W * 0.84;
      const trunkThick = 0.065;
      const trunkX = cabinX - cabinLen * 0.35;
      const trunkY = cabinY + cabinH * 0.5 + trunkThick * 0.6;

      const trunkVis = new THREE.Group();
      const trunkMesh = new THREE.Mesh(
        new THREE.BoxGeometry(trunkLen, trunkThick, trunkW),
        materials.carPaint
      );
      const lipSpoiler = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.05, trunkW * 0.96),
        materials.carChassisDark
      );
      lipSpoiler.position.set(-trunkLen * 0.45, 0.04, 0);
      trunkVis.add(trunkMesh, lipSpoiler);

      const trunkEntry = createCarPart({
        name: 'trunk',
        massFraction: 0.025,
        pos: [trunkX, trunkY, 0],
        shapeSize: [trunkLen * 0.9, trunkThick * 1.4, trunkW * 0.9],
        meshGroup: trunkVis,
        hasBlob: true
      });

      // 9. Four Doors (Front Left, Front Right, Rear Left, Rear Right)
      const doorLen = cabinLen * 0.30;
      const doorH = cabinH * 0.92;
      const doorThick = 0.085;
      const doorConfigs = [
        { name: 'doorFL', xOff: cabinLen * 0.16, side: -1, thresh: 165 },
        { name: 'doorFR', xOff: cabinLen * 0.16, side: 1, thresh: 175 },
        { name: 'doorRL', xOff: -cabinLen * 0.17, side: -1, thresh: 210 },
        { name: 'doorRR', xOff: -cabinLen * 0.17, side: 1, thresh: 220 }
      ];

      doorConfigs.forEach((dc) => {
        const dz = dc.side * (W * 0.48);
        const dVis = new THREE.Group();
        const dPanel = new THREE.Mesh(
          new THREE.BoxGeometry(doorLen, doorH, doorThick),
          materials.carPaint
        );
        const handleMesh = new THREE.Mesh(
          new THREE.BoxGeometry(doorLen * 0.18, 0.03, 0.03),
          materials.carChrome
        );
        handleMesh.position.set(-doorLen * 0.2, doorH * 0.18, dc.side * (doorThick * 0.55));
        dVis.add(dPanel, handleMesh);

        const dEntry = createCarPart({
          name: dc.name,
          massFraction: 0.026,
          pos: [cabinX + dc.xOff, cabinY + 0.02, dz],
          shapeSize: [doorLen * 0.9, doorH * 0.9, doorThick * 1.3],
          meshGroup: dVis,
          hasBlob: true
        });

        // Two-stage door constraint: a front hinge (PointToPoint) + a LockConstraint latch
        // When the latch breaks first, the door swings outward on its front hinge; if force is higher, hinge tears off too!
        const hingePivotDoor = new CANNON.Vec3(doorLen * 0.45, 0, -dc.side * doorThick * 0.4);
        const hingePivotCabin = new CANNON.Vec3(dc.xOff + doorLen * 0.45, 0.02, dc.side * (W * 0.46));
        const hingeConstraint = new CANNON.PointToPointConstraint(
          dEntry.body,
          hingePivotDoor,
          cabinBody,
          hingePivotCabin
        );
        world.addConstraint(hingeConstraint);

        const latchLock = new CANNON.LockConstraint(cabinBody, dEntry.body);
        world.addConstraint(latchLock);

        breakableJoints.push({
          constraint: latchLock,
          secondaryConstraint: hingeConstraint,
          stage: 0,
          entry: dEntry,
          threshold: dc.thresh,
          secondaryThreshold: dc.thresh * 1.55,
          onBreakStage1: () => {
            // Swing door open outward when latch pops
            dEntry.body.velocity.z += dc.side * 3.2;
            dEntry.body.angularVelocity.y += -dc.side * 5.5;
          },
          onBreakStage2: () => {
            dEntry.body.velocity.z += dc.side * 2.5;
            dEntry.body.velocity.y += 1.8;
          }
        });
      });

      // 10. Shattering Windshield & Side Glass Shards (Independent Rigid Bodies)
      glassShardEntries = [];
      const wsBaseX = cabinX + cabinLen * 0.27;
      const wsBaseY = cabinY + cabinH * 0.5 + H * 0.17;
      const wsCols = 3;
      const wsRows = 2;
      const shardW = (W * 0.74) / wsCols;
      const shardH = (H * 0.34) / wsRows;

      for (let r = 0; r < wsRows; r++) {
        for (let c = 0; c < wsCols; c++) {
          const sy = wsBaseY + (r - 0.5) * shardH * 0.85;
          const sx = wsBaseX - (r - 0.5) * shardH * 0.52;
          const sz = (c - 1) * shardW;

          const sVis = new THREE.Group();
          const sMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.03, shardH * 0.92, shardW * 0.92),
            materials.carGlass
          );
          sMesh.rotation.z = -0.58;
          sVis.add(sMesh);

          const shardEntry = createCarPart({
            name: `windshield_${r}_${c}`,
            massFraction: 0.003,
            pos: [sx, sy, sz],
            shapeSize: [0.06, shardH * 0.8, shardW * 0.8],
            meshGroup: sVis,
            filterGroup: GROUP_CAR_GLASS,
            filterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_PANEL,
            physMat: glassPhysMat
          });
          glassShardEntries.push(shardEntry);

          addBreakableLock(cabinBody, shardEntry.body, shardEntry, 95 + (r * 3 + c) * 12, {
            upImpulse: 3.4 + r * 1.1,
            forwardImpulse: 2.2,
            lateralImpulse: (c - 1) * 2.8,
            spinImpulse: 9.0
          });
        }
      }

      // Side window glass shards (Left & Right front/rear windows)
      [-1, 1].forEach((side) => {
        [-0.14, 0.12].forEach((xFactor, idx) => {
          const gx = cabinX + cabinLen * xFactor;
          const gy = cabinY + cabinH * 0.5 + H * 0.16;
          const gz = side * (W * 0.42);

          const gVis = new THREE.Group();
          const gMesh = new THREE.Mesh(
            new THREE.BoxGeometry(cabinLen * 0.24, H * 0.25, 0.025),
            materials.carGlass
          );
          gVis.add(gMesh);

          const gEntry = createCarPart({
            name: `sideGlass_${side}_${idx}`,
            massFraction: 0.003,
            pos: [gx, gy, gz],
            shapeSize: [cabinLen * 0.22, H * 0.22, 0.06],
            meshGroup: gVis,
            filterGroup: GROUP_CAR_GLASS,
            filterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_PANEL,
            physMat: glassPhysMat
          });
          glassShardEntries.push(gEntry);

          addBreakableLock(cabinBody, gEntry.body, gEntry, 125 + idx * 20, {
            lateralImpulse: side * 4.2,
            upImpulse: 2.4,
            spinImpulse: 8.0
          });
        });
      });

      // 11. Four Wheels with Tires, Alloy Rims & Brake Discs
      wheelBodies = [];
      const wheelSpecs = [
        { name: 'wheelFL', x: frontClipX + frontClipLen * 0.22, z: -W * 0.47, parent: frontClipBody, thresh: 175, side: -1, isFront: true },
        { name: 'wheelFR', x: frontClipX + frontClipLen * 0.22, z: W * 0.47, parent: frontClipBody, thresh: 185, side: 1, isFront: true },
        { name: 'wheelRL', x: cabinX - cabinLen * 0.26, z: -W * 0.47, parent: cabinBody, thresh: 280, side: -1, isFront: false },
        { name: 'wheelRR', x: cabinX - cabinLen * 0.26, z: W * 0.47, parent: cabinBody, thresh: 290, side: 1, isFront: false }
      ];

      const tireGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 24);
      tireGeo.rotateX(Math.PI / 2);
      const rimGeo = new THREE.CylinderGeometry(wheelRadius * 0.64, wheelRadius * 0.64, wheelWidth * 1.03, 16);
      rimGeo.rotateX(Math.PI / 2);
      const hubGeo = new THREE.CylinderGeometry(wheelRadius * 0.2, wheelRadius * 0.2, wheelWidth * 1.08, 12);
      hubGeo.rotateX(Math.PI / 2);
      const spokeGeo = new THREE.BoxGeometry(wheelRadius * 1.18, wheelRadius * 0.13, wheelWidth * 1.05);

      wheelSpecs.forEach((ws) => {
        const wVis = new THREE.Group();
        const tireMesh = new THREE.Mesh(tireGeo, materials.tireRubber);
        const rimMesh = new THREE.Mesh(rimGeo, materials.carChassisDark);
        const hubMesh = new THREE.Mesh(hubGeo, materials.carChrome);
        wVis.add(tireMesh, rimMesh, hubMesh);

        for (let s = 0; s < 5; s++) {
          const spoke = new THREE.Mesh(spokeGeo, materials.carChrome);
          spoke.rotation.z = (s * Math.PI) / 5;
          wVis.add(spoke);
        }

        const wBody = new CANNON.Body({
          mass: Math.max(8, M * 0.022),
          material: wheelPhysMat,
          shape: new CANNON.Sphere(wheelRadius),
          linearDamping: 0.01,
          angularDamping: 0.02,
          allowSleep: false,
          collisionFilterGroup: GROUP_CAR_WHEEL,
          collisionFilterMask: GROUP_GROUND | GROUP_BRICK | GROUP_CAR_WHEEL | GROUP_CAR_PANEL
        });
        wBody.position.set(ws.x, wheelRadius, ws.z);
        wBody.velocity.set(V0, 0, 0);
        wBody.angularVelocity.set(0, 0, -V0 / wheelRadius);

        wVis.position.set(ws.x, wheelRadius, ws.z);
        wVis.traverse((c) => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
          }
        });

        const wEntry = registerRigidEntity(wBody, wVis, {
          isCarPart: true,
          partName: ws.name,
          hasContactBlob: true,
          blobW: wheelWidth * 1.5,
          blobL: wheelRadius * 2.2
        });

        wheelBodies.push({ body: wBody, radius: wheelRadius, entry: wEntry, side: ws.side, isFront: ws.isFront });

        // Attach wheel to parent chassis body via breakable LockConstraint (visual spin is applied on mesh until detached, or hinge)
        // Using HingeConstraint around Z axis so wheels physically roll & stay aligned with axle until impact breaks axle!
        const localPivotParent = new CANNON.Vec3(
          ws.x - ws.parent.position.x,
          wheelRadius - ws.parent.position.y,
          ws.z - ws.parent.position.z
        );
        const axleHinge = new CANNON.HingeConstraint(ws.parent, wBody, {
          pivotA: localPivotParent,
          axisA: new CANNON.Vec3(0, 0, 1),
          pivotB: new CANNON.Vec3(0, 0, 0),
          axisB: new CANNON.Vec3(0, 0, 1)
        });
        world.addConstraint(axleHinge);

        breakableJoints.push({
          constraint: axleHinge,
          entry: wEntry,
          threshold: ws.thresh,
          onBreakStage1: () => {
            wBody.velocity.z += ws.side * 4.2;
            wBody.velocity.y += 2.2;
            wBody.angularVelocity.x += ws.side * 6.0;
          }
        });
      });

      // Structural & Panel Breakable Constraints
      // A) Front Nose -> Front Clip (crumples first on wall contact)
      addBreakableLock(frontClipBody, frontNoseBody, noseEntry, 150, {
        upImpulse: 1.5,
        pitchImpulse: 5.5
      });

      // B) Front Clip -> Cabin (crumples & folds under heavy impact, plus distance tether so it folds instead of flying away)
      const clipDistanceTether = new CANNON.DistanceConstraint(
        cabinBody,
        frontClipBody,
        (cabinLen + frontClipLen) * 0.42,
        1e5
      );
      world.addConstraint(clipDistanceTether);

      addBreakableLock(cabinBody, frontClipBody, frontClipEntry, 210, {
        upImpulse: 2.0,
        pitchImpulse: 6.5
      });

      // C) Hood -> Front Clip & Windshield Hinge (buckles upward dramatically when front crumples)
      const hoodRearHinge = new CANNON.PointToPointConstraint(
        hoodBody,
        new CANNON.Vec3(-hoodLen * 0.44, 0, 0),
        cabinBody,
        new CANNON.Vec3(cabinLen * 0.48, cabinH * 0.5, 0)
      );
      world.addConstraint(hoodRearHinge);

      const hoodFrontLatch = new CANNON.LockConstraint(frontClipBody, hoodBody);
      world.addConstraint(hoodFrontLatch);

      breakableJoints.push({
        constraint: hoodFrontLatch,
        secondaryConstraint: hoodRearHinge,
        stage: 0,
        entry: hoodEntry,
        threshold: 105,
        secondaryThreshold: 195,
        onBreakStage1: () => {
          // Hood buckles upward and pitches back around rear hinge
          hoodBody.velocity.y += 4.5;
          hoodBody.angularVelocity.z += 9.5;
        },
        onBreakStage2: () => {
          hoodBody.velocity.y += 3.0;
          hoodBody.angularVelocity.x += 3.2;
        }
      });

      // D) Front Bumper -> Front Nose
      addBreakableLock(frontNoseBody, bumpFEntry.body, bumpFEntry, 85, {
        upImpulse: 2.6,
        pitchImpulse: -7.5
      });

      // E) Rear Bumper -> Cabin
      addBreakableLock(cabinBody, bumpREntry.body, bumpREntry, 210, {
        upImpulse: 1.8,
        forwardImpulse: -2.0
      });

      // F) Trunk Lid -> Cabin
      addBreakableLock(cabinBody, trunkEntry.body, trunkEntry, 185, {
        upImpulse: 3.4,
        pitchImpulse: -6.5
      });

      totalInitialJoints = breakableJoints.length;
    }

    function addBreakableLock(bodyA, bodyB, partEntry, threshold, impulseCfg = {}) {
      const lock = new CANNON.LockConstraint(bodyA, bodyB);
      world.addConstraint(lock);
      breakableJoints.push({
        constraint: lock,
        stage: 0,
        entry: partEntry,
        threshold,
        onBreakStage1: () => {
          if (impulseCfg.upImpulse) bodyB.velocity.y += impulseCfg.upImpulse;
          if (impulseCfg.forwardImpulse) bodyB.velocity.x += impulseCfg.forwardImpulse;
          if (impulseCfg.lateralImpulse) bodyB.velocity.z += impulseCfg.lateralImpulse;
          if (impulseCfg.pitchImpulse) bodyB.angularVelocity.z += impulseCfg.pitchImpulse;
          if (impulseCfg.spinImpulse) {
            bodyB.angularVelocity.x += impulseCfg.spinImpulse * 0.6;
            bodyB.angularVelocity.y += impulseCfg.spinImpulse * 0.8;
          }
        }
      });
    }

    // Spawn Visual Impact Particles (Sparks & Dust) using seeded fxRng so physics determinism is untouched
    function spawnImpactParticles(originX, originY, originZ, intensity = 1) {
      const sparkCount = Math.min(28, Math.floor(14 * intensity));
      const sparkGeo = new THREE.BoxGeometry(0.09, 0.03, 0.03);
      for (let i = 0; i < sparkCount; i++) {
        const mesh = new THREE.Mesh(sparkGeo, materials.spark);
        mesh.position.set(
          originX + (fxRng() - 0.5) * 0.8,
          Math.max(0.1, originY + (fxRng() - 0.3) * 0.7),
          originZ + (fxRng() - 0.5) * 1.4
        );
        dynamicGroup.add(mesh);
        particles.push({
          mesh,
          vx: (fxRng() - 0.55) * 12,
          vy: 2.5 + fxRng() * 8.5,
          vz: (fxRng() - 0.5) * 13,
          life: 0.35 + fxRng() * 0.45,
          maxLife: 0.8,
          isSpark: true
        });
      }

      const dustCount = Math.min(18, Math.floor(9 * intensity));
      const dustGeo = new THREE.DodecahedronGeometry(0.24, 0);
      for (let i = 0; i < dustCount; i++) {
        const mesh = new THREE.Mesh(dustGeo, materials.dust);
        mesh.position.set(
          originX + (fxRng() - 0.5) * 1.4,
          Math.max(0.2, originY + (fxRng() - 0.4) * 1.1),
          originZ + (fxRng() - 0.5) * 2.2
        );
        dynamicGroup.add(mesh);
        particles.push({
          mesh,
          vx: (fxRng() - 0.3) * 4.5,
          vy: 1.0 + fxRng() * 3.2,
          vz: (fxRng() - 0.5) * 5.0,
          life: 0.9 + fxRng() * 0.9,
          maxLife: 1.8,
          isSpark: false
        });
      }
    }

    // Rebuild / Reset Entire Simulation from Settings
    function rebuildSimulation() {
      if (dynamicGroup) {
        scene.remove(dynamicGroup);
        dynamicGroup.traverse((obj) => {
          if (obj.geometry && obj.geometry !== tireGeoShared) {
            // Dispose one-off geometries safely
          }
        });
      }

      dynamicGroup = new THREE.Group();
      scene.add(dynamicGroup);

      syncedPairs = [];
      breakableJoints = [];
      particles = [];
      skidSegments = [];
      lastWheelSkidPos = [null, null, null, null];
      detachedCount = 0;
      simClock = 0;
      accumulator = 0;
      firstImpactOccurred = false;
      impactTime = -1;
      cameraShakeIntensity = 0;
      fxRng = createSeededRandom(424242);

      const cfg = currentSettings;

      // Position car start and freestanding brick wall along the track
      wallX = cfg.trackLength * 0.24;
      startX = -cfg.trackLength * 0.36;

      // Update shadow camera frustum tightly around track, car, and wall
      const frustumSpan = Math.max(18, cfg.trackLength * 0.52);
      sunLight.position.set(wallX - 6, 22, 15);
      sunLight.target.position.set(wallX - 2, 0, 0);
      sunLight.shadow.camera.left = -frustumSpan;
      sunLight.shadow.camera.right = frustumSpan * 0.85;
      sunLight.shadow.camera.top = 16;
      sunLight.shadow.camera.bottom = -16;
      sunLight.shadow.camera.updateProjectionMatrix();

      // Initialize Cannon-es World
      world = new CANNON.World();
      world.gravity.set(0, -cfg.gravity, 0);
      world.broadphase = new CANNON.SAPBroadphase(world);
      world.allowSleep = true;
      world.solver.iterations = 14;
      world.solver.tolerance = 0.0005;

      const groundPhysMat = new CANNON.Material('ground');
      const brickPhysMat = new CANNON.Material('brick');
      const carPhysMat = new CANNON.Material('car');
      const wheelPhysMat = new CANNON.Material('wheel');
      const glassPhysMat = new CANNON.Material('glass');

      // Contact Materials wired to settings
      world.addContactMaterial(
        new CANNON.ContactMaterial(groundPhysMat, brickPhysMat, {
          friction: cfg.groundFriction,
          restitution: cfg.brickRestitution
        })
      );
      world.addContactMaterial(
        new CANNON.ContactMaterial(brickPhysMat, brickPhysMat, {
          friction: cfg.brickFriction,
          restitution: cfg.brickRestitution
        })
      );
      world.addContactMaterial(
        new CANNON.ContactMaterial(carPhysMat, brickPhysMat, {
          friction: cfg.brickFriction * 0.7,
          restitution: cfg.brickRestitution
        })
      );
      world.addContactMaterial(
        new CANNON.ContactMaterial(carPhysMat, groundPhysMat, {
          friction: cfg.groundFriction * 0.75,
          restitution: 0.1
        })
      );
      world.addContactMaterial(
        new CANNON.ContactMaterial(wheelPhysMat, groundPhysMat, {
          friction: cfg.groundFriction * 0.9,
          restitution: 0.05
        })
      );
      world.addContactMaterial(
        new CANNON.ContactMaterial(glassPhysMat, groundPhysMat, {
          friction: cfg.groundFriction * 0.5,
          restitution: 0.25
        })
      );

      // Ground Physics Plane
      const groundBody = new CANNON.Body({
        mass: 0,
        material: groundPhysMat,
        shape: new CANNON.Plane(),
        collisionFilterGroup: GROUP_GROUND,
        collisionFilterMask:
          GROUP_BRICK | GROUP_CAR_CORE | GROUP_CAR_PANEL | GROUP_CAR_WHEEL | GROUP_CAR_GLASS
      });
      groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      world.addBody(groundBody);

      buildTrackEnvironment(cfg);
      buildBrickWall(cfg, brickPhysMat);
      buildCar(cfg, carPhysMat, wheelPhysMat, glassPhysMat);

      // Detect first impact with wall to cut engine drive and trigger impact effects
      const onPreImpactCollide = (e) => {
        const other = e.body;
        if (!other) return;
        if (other.collisionFilterGroup === GROUP_BRICK) {
          if (!firstImpactOccurred) {
            firstImpactOccurred = true;
            impactTime = simClock;
            const relV = Math.hypot(
              cabinBody.velocity.x - other.velocity.x,
              cabinBody.velocity.y - other.velocity.y,
              cabinBody.velocity.z - other.velocity.z
            );
            cameraShakeIntensity = Math.min(0.45, (relV / 22) * 0.24);
            spawnImpactParticles(
              frontNoseBody.position.x + 0.3,
              frontNoseBody.position.y,
              frontNoseBody.position.z,
              Math.max(0.6, relV / 18)
            );
          }
        }
      };

      frontNoseBody.addEventListener('collide', onPreImpactCollide);
      frontClipBody.addEventListener('collide', onPreImpactCollide);
      cabinBody.addEventListener('collide', onPreImpactCollide);

      updateCameraView(true);
      updateTelemetryUI();
    }

    const tireGeoShared = null;

    // Step Fixed Physics & Evaluate Breakable Constraints
    function stepSimulation(dt) {
      const cfg = currentSettings;

      // Before impact: maintain target impact speed so the car reaches the wall at exact configured speed
      if (!firstImpactOccurred && cabinBody) {
        const currentVx = cabinBody.velocity.x;
        const speedError = cfg.impactSpeed - currentVx;
        const driveAccel = speedError * 14.0;
        cabinBody.applyForce(new CANNON.Vec3(cabinBody.mass * driveAccel, 0, 0), cabinBody.position);
        frontClipBody.applyForce(new CANNON.Vec3(frontClipBody.mass * driveAccel, 0, 0), frontClipBody.position);

        // Keep car tracking straight down centerline before impact
        cabinBody.velocity.z *= 0.85;
        cabinBody.angularVelocity.y *= 0.85;

        // Check proximity to wall face to wake bricks right before contact so no tunneling occurs
        const noseFrontX = frontNoseBody.position.x + cfg.carLength * 0.1;
        if (noseFrontX >= wallX - cfg.wallDepth * cfg.brickDepth - 0.9) {
          for (let i = 0; i < syncedPairs.length; i++) {
            const p = syncedPairs[i];
            if (p.isBrick && p.body.sleepState !== CANNON.Body.AWAKE) {
              p.body.wakeUp();
            }
          }
        }
      }

      world.step( dt );
      simClock += dt;

      // Evaluate breakable constraints based on solver equation multipliers & impact deceleration
      if (firstImpactOccurred || simClock > 0.08) {
        // Measure instantaneous deceleration/shock on front clip & cabin
        const impactShock = firstImpactOccurred
          ? Math.max(0, (cfg.impactSpeed - cabinBody.velocity.x) * (cfg.carMass / 1250) * 6.8)
          : 0;

        for (let i = breakableJoints.length - 1; i >= 0; i--) {
          const j = breakableJoints[i];
          const eqs = j.constraint.equations;
          let maxMult = 0;
          for (let k = 0; k < eqs.length; k++) {
            const m = Math.abs(eqs[k].multiplier);
            if (m > maxMult) maxMult = m;
          }

          const effectiveLoad = maxMult + impactShock;

          if (j.stage === 0 && effectiveLoad > j.threshold) {
            world.removeConstraint(j.constraint);
            if (j.onBreakStage1) j.onBreakStage1();

            if (j.secondaryConstraint) {
              j.stage = 1;
            } else {
              j.entry.detached = true;
              detachedCount++;
              breakableJoints.splice(i, 1);
            }

            if (firstImpactOccurred && particles.length < 70) {
              spawnImpactParticles(
                j.entry.body.position.x,
                j.entry.body.position.y,
                j.entry.body.position.z,
                0.35
              );
            }
          } else if (j.stage === 1 && j.secondaryConstraint) {
            const eqs2 = j.secondaryConstraint.equations;
            let maxMult2 = 0;
            for (let k = 0; k < eqs2.length; k++) {
              const m2 = Math.abs(eqs2[k].multiplier);
              if (m2 > maxMult2) maxMult2 = m2;
            }
            if (maxMult2 + impactShock * 0.85 > j.secondaryThreshold) {
              world.removeConstraint(j.secondaryConstraint);
              if (j.onBreakStage2) j.onBreakStage2();
              j.entry.detached = true;
              detachedCount++;
              breakableJoints.splice(i, 1);
            }
          }
        }
      }

      // Leave tire skid marks on asphalt after impact when wheels slide laterally or decelerate hard
      if (firstImpactOccurred && skidSegments.length < 140) {
        const skidGeo = new THREE.PlaneGeometry(0.32, 0.22);
        skidGeo.rotateX(-Math.PI / 2);
        for (let w = 0; w < wheelBodies.length; w++) {
          const wb = wheelBodies[w];
          if (wb.body.position.y < wb.radius * 1.35) {
            const pos = wb.body.position;
            const prev = lastWheelSkidPos[w];
            if (!prev || Math.hypot(pos.x - prev.x, pos.z - prev.z) > 0.26) {
              const mark = new THREE.Mesh(skidGeo, materials.skidMark);
              mark.position.set(pos.x, 0.0035, pos.z);
              dynamicGroup.add(mark);
              skidSegments.push(mark);
              lastWheelSkidPos[w] = { x: pos.x, z: pos.z };
            }
          }
        }
      }

      // Step visual particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life -= dt;
        if (pt.life <= 0) {
          dynamicGroup.remove(pt.mesh);
          particles.splice(i, 1);
          continue;
        }
        if (pt.isSpark) {
          pt.vy -= cfg.gravity * dt;
        } else {
          pt.vx *= 0.96;
          pt.vz *= 0.96;
          const s = 1 + (1 - pt.life / pt.maxLife) * 2.2;
          pt.mesh.scale.setScalar(s);
        }
        pt.mesh.position.x += pt.vx * dt;
        pt.mesh.position.y = Math.max(0.05, pt.mesh.position.y + pt.vy * dt);
        pt.mesh.position.z += pt.vz * dt;
      }

      // Decay brief camera shake
      if (cameraShakeIntensity > 0.001) {
        cameraShakeIntensity *= Math.pow(0.04, dt);
      } else {
        cameraShakeIntensity = 0;
      }
    }

    // Sync Three.js Meshes & Contact Shadow Blobs with Cannon Bodies
    function syncVisuals() {
      for (let i = 0; i < syncedPairs.length; i++) {
        const item = syncedPairs[i];
        const b = item.body;
        const m = item.mesh;
        m.position.copy(b.position);
        m.quaternion.copy(b.quaternion);

        if (item.blob) {
          const h = Math.max(0, b.position.y - 0.15);
          const fade = Math.max(0, 1 - h / 2.6);
          item.blob.position.x = b.position.x;
          item.blob.position.z = b.position.z;
          item.blob.visible = fade > 0.05;
        }
      }

      if (carMainShadowBlob && cabinBody) {
        carMainShadowBlob.position.x = cabinBody.position.x + currentSettings.carLength * 0.08;
        carMainShadowBlob.position.z = cabinBody.position.z;
        const euler = new THREE.Euler().setFromQuaternion(cabinBody.quaternion, 'YXZ');
        carMainShadowBlob.rotation.y = euler.y;
      }
    }

    // Update Camera Rig (Impact, Follow, Top, Orbit)
    const camTarget = new THREE.Vector3();
    const desiredCamPos = new THREE.Vector3();

    function updateCameraView(instant = false) {
      if (!cabinBody) return;
      const carPos = cabinBody.position;

      // Subtle deterministic camera shake offset on impact
      const shakeX = cameraShakeIntensity * Math.sin(simClock * 58);
      const shakeY = cameraShakeIntensity * Math.cos(simClock * 73);

      if (cameraMode === 'impact') {
        orbitControls.enabled = false;
        // Three-quarter cinematic shot showing car, track, and wall, holding a readable frame of the breakup
        const focusX = THREE.MathUtils.lerp(carPos.x + 2.5, wallX - 0.5, 0.68);
        camTarget.set(focusX + shakeX, 1.05 + shakeY, 0);
        desiredCamPos.set(wallX - 6.8, 3.1, 8.8);
        if (instant) {
          camera.position.copy(desiredCamPos);
        } else {
          camera.position.lerp(desiredCamPos, 0.08);
        }
        camera.lookAt(camTarget);
      } else if (cameraMode === 'follow') {
        orbitControls.enabled = false;
        // Chase the car through approach and hold both car and collapsing wall inside frame at impact
        const clampedCarX = Math.min(carPos.x, wallX + 2.5);
        desiredCamPos.set(clampedCarX - 6.8, 2.55 + shakeY, 2.6);
        camTarget.set(
          Math.max(carPos.x + 3.2, wallX - 0.6) + shakeX,
          1.1 + shakeY,
          carPos.z * 0.4
        );
        if (instant) {
          camera.position.copy(desiredCamPos);
        } else {
          camera.position.lerp(desiredCamPos, 0.12);
        }
        camera.lookAt(camTarget);
      } else if (cameraMode === 'top') {
        orbitControls.enabled = false;
        // Straight overhead view of the track and wall
        const centerFocusX = (startX + wallX) * 0.25 + 2.0;
        const height = Math.max(24, currentSettings.trackLength * 0.72);
        camera.position.set(centerFocusX, height, 0.01);
        camera.lookAt(centerFocusX, 0, 0);
      } else if (cameraMode === 'orbit') {
        orbitControls.enabled = true;
        if (instant) {
          camera.position.set(wallX - 7.5, 4.2, 9.5);
          orbitControls.target.set(wallX - 1.5, 1.1, 0);
        }
        orbitControls.update();
      }
    }

    function updateTelemetryUI() {
      elTime.textContent = simClock.toFixed(2);
      const spd = cabinBody ? cabinBody.velocity.length() : 0;
      elSpeed.textContent = spd.toFixed(1);
      elJoints.textContent = `${breakableJoints.length}/${totalInitialJoints}`;
      elDebris.textContent = `${detachedCount}`;
    }

    // UI Event Listeners
    function setPlayState(playing) {
      isPlaying = playing;
      btnPlayPause.textContent = isPlaying ? 'Pause' : 'Play';
      btnPlayPause.classList.toggle('active', !isPlaying);
    }

    btnPlayPause.addEventListener('click', () => {
      setPlayState(!isPlaying);
    });

    btnReplay.addEventListener('click', () => {
      currentSettings = readSettingsFromInputs();
      writeSettingsToInputs(currentSettings);
      rebuildSimulation();
      setPlayState(true);
    });

    btnApply.addEventListener('click', () => {
      currentSettings = readSettingsFromInputs();
      writeSettingsToInputs(currentSettings);
      rebuildSimulation();
      setPlayState(true);
    });

    btnResetDefaults.addEventListener('click', () => {
      currentSettings = { ...MANDATORY_DEFAULTS };
      writeSettingsToInputs(currentSettings);
      rebuildSimulation();
      setPlayState(true);
    });

    btnToggleSettings.addEventListener('click', () => {
      const collapsed = settingsPanel.classList.toggle('collapsed');
      btnToggleSettings.classList.toggle('active', !collapsed);
    });

    btnCloseSettings.addEventListener('click', () => {
      settingsPanel.classList.add('collapsed');
      btnToggleSettings.classList.remove('active');
    });

    document.getElementById('speed-group').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-speed]');
      if (!btn) return;
      simSpeed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('#speed-group button').forEach((b) => b.classList.toggle('active', b === btn));
    });

    document.getElementById('camera-group').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-cam]');
      if (!btn) return;
      cameraMode = btn.dataset.cam;
      document.querySelectorAll('#camera-group button').forEach((b) => b.classList.toggle('active', b === btn));
      orbitHint.classList.toggle('visible', cameraMode === 'orbit');
      updateCameraView(true);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const active = document.activeElement;
        if (active && active.tagName === 'INPUT') return;
        e.preventDefault();
        setPlayState(!isPlaying);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize First Run Automatically with Mandatory Defaults at 1x Playing
    writeSettingsToInputs(MANDATORY_DEFAULTS);
    rebuildSimulation();

    // Main Render & Fixed-Step Physics Loop
    let lastFrameTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const rawDt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      if (isPlaying) {
        accumulator += rawDt * simSpeed;
        // Cap steps per frame so a hitch cannot explode the solver
        const maxSteps = 10;
        let steps = 0;
        while (accumulator >= FIXED_DT && steps < maxSteps) {
          stepSimulation(FIXED_DT);
          accumulator -= FIXED_DT;
          steps++;
        }
        if (steps === maxSteps) {
          accumulator = 0;
        }
        syncVisuals();
        updateTelemetryUI();
      }

      updateCameraView(false);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
