      if(kind==='hinge'){
        const pa=V3(b.body.position.x-a.body.position.x,b.body.position.y-a.body.position.y,b.body.position.z-a.body.position.z);
        con=new CANNON.HingeConstraint(a.body,b.body,{pivotA:pa,pivotB:V3(),axisA:V3(0,0,1),axisB:V3(0,0,1),maxForce:1e7});
      }else con=new CANNON.LockConstraint(a.body,b.body,{maxForce:1e7});
      con.collideConnected=false;world.addConstraint(con);joints.push({a,b,con,threshold,exposure,broken:false});return con;
    }
    function addContactBlob(part,scale){
      const blob=new THREE.Mesh(new THREE.PlaneGeometry(scale[0],scale[1]),shadowBlobMaterial.clone());blob.rotation.x=-Math.PI/2;blob.renderOrder=2;blob.material.depthWrite=false;blob.material.userData.runOwned=true;dynamicRoot.add(blob);part.blob=blob;
    }
    const blobCanvas=document.createElement('canvas');blobCanvas.width=blobCanvas.height=64;{const x=blobCanvas.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,31);g.addColorStop(0,'#0009');g.addColorStop(.5,'#0005');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,64,64);}
    const blobTexture=new THREE.CanvasTexture(blobCanvas);
    const shadowBlobMaterial=new THREE.MeshBasicMaterial({map:blobTexture,transparent:true,opacity:.5,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1});

    function buildCar(){
      const sx=cfg.carLength/4.2,sz=cfg.carWidth/1.8,sy=cfg.carHeight/1.45;
      const X=v=>v*sx,Y=v=>v*sy,Z=v=>v*sz;
      const place=(x,y,z)=>[carStart+X(x),Y(y),Z(z)];
      const dims=(x,y,z)=>[X(x),Y(y),Z(z)];
      const M=f=>cfg.carMass*f;
      const cabinPart=bodyPart('cabin',M(.50),place(0,.70,0),dims(2.30,.60,1.48),paint);cabin=cabinPart;
      addVisual(cabinPart,new RoundedBoxGeometry(X(1.42),Y(.07),Z(1.28),3,.025),paint,[X(-.16),Y(.725),0]);
      for(const s of [-1,1]){
        addVisual(cabinPart,new THREE.BoxGeometry(X(.065),Y(.48),Z(.065)),paint,[X(.55),Y(.48),Z(s*.62)],[0,0,.67]);
        addVisual(cabinPart,new THREE.BoxGeometry(X(.075),Y(.47),Z(.07)),paint,[X(-.88),Y(.48),Z(s*.62)],[0,0,-.63]);
        addVisual(cabinPart,new THREE.BoxGeometry(X(.065),Y(.46),Z(.065)),paint,[X(-.17),Y(.48),Z(s*.65)]);
        addVisual(cabinPart,new THREE.BoxGeometry(X(.11),Y(.055),Z(.12)),trim,[X(.25),Y(.24),Z(s*.83)]);
      }
      const rear=bodyPart('rear clip',M(.10),place(-1.58,.67,0),dims(.86,.51,1.51),paint);
      joint(cabinPart,rear,'lock',500,.14);
      const frontA=bodyPart('front structure',M(.055),place(1.15,.67,0),dims(.39,.5,1.5),paintDark);
      const frontB=bodyPart('front structure mid',M(.05),place(1.53,.67,0),dims(.39,.5,1.5),paint);
      const frontC=bodyPart('front structure nose',M(.035),place(1.90,.67,0),dims(.39,.5,1.48),paint);
      joint(cabinPart,frontA,'lock',265,.75);joint(frontA,frontB,'lock',145,.88);joint(frontB,frontC,'lock',75,1.0);
      const hood=bodyPart('hood',M(.025),place(1.48,.965,0),dims(1.20,.055,1.50),paint);
      joint(frontA,hood,'lock',73,.68);
      const trunk=bodyPart('trunk lid',M(.02),place(-1.58,.945,0),dims(.80,.055,1.49),paint);
      joint(rear,trunk,'lock',255,.25);
      const fb=bodyPart('front bumper',M(.015),place(2.145,.52,0),dims(.19,.19,1.62),paintDark);
      joint(frontC,fb,'lock',38,1.1);
      const rb=bodyPart('rear bumper',M(.012),place(-2.04,.53,0),dims(.18,.18,1.60),paintDark);
      joint(rear,rb,'lock',270,.17);
      const grille=new THREE.BoxGeometry(X(.025),Y(.14),Z(.65));addVisual(frontC,grille,trim,[X(.195),Y(-.04),0]);
      for(const s of [-1,1]){
        addVisual(frontC,new RoundedBoxGeometry(X(.04),Y(.135),Z(.33),2,.012),lamp,[X(.205),Y(.115),Z(s*.53)]);
        addVisual(rear,new RoundedBoxGeometry(X(.04),Y(.16),Z(.30),2,.012),rearLamp,[X(-.44),Y(.12),Z(s*.53)]);
      }
      for(const s of [-1,1]) for(const [sideX,isFront] of [[.52,true],[-.55,false]]){
        const door=bodyPart(`${isFront?'front':'rear'} ${s<0?'left':'right'} door`,M(.025),place(sideX,.73,s*.785),dims(.91,.56,.09),paint);
        joint(cabinPart,door,'lock',isFront?96:170,isFront?.50:.26);
        addVisual(door,new THREE.BoxGeometry(X(.16),Y(.035),Z(.04)),rim,[X(.18),Y(.02),Z(s*.058)]);
        addContactBlob(door,[X(1.15),Z(.75)]);
      }
      const wheelRadius=Y(.35),wheelWidth=Z(.18);
      const wheelShape=new CANNON.Cylinder(wheelRadius,wheelRadius,wheelWidth,16);const wheelQ=new CANNON.Quaternion();wheelQ.setFromAxisAngle(V3(1,0,0),Math.PI/2);
      for(const s of [-1,1]) for(const isFront of [true,false]){
        const wx=isFront?1.39:-1.38;
        const wheel=bodyPart(`${isFront?'front':'rear'} ${s<0?'left':'right'} wheel`,M(.018),place(wx,.365,s*.88),dims(.7,.7,.18),rubber,new THREE.CylinderGeometry(wheelRadius,wheelRadius,wheelWidth,20,1),{shape:wheelShape,shapeOrientation:wheelQ});
        wheel.group.children[0].rotation.x=Math.PI/2;
        const rimGeo=new THREE.CylinderGeometry(wheelRadius*.61,wheelRadius*.61,wheelWidth*1.08,12);addVisual(wheel,rimGeo,rim,[0,0,0],[Math.PI/2,0,0]);
        const hubGeo=new THREE.CylinderGeometry(wheelRadius*.19,wheelRadius*.19,wheelWidth*1.11,12);addVisual(wheel,hubGeo,trim,[0,0,0],[Math.PI/2,0,0]);
        wheel.body.angularVelocity.z=-initialSpeed/wheelRadius;
        joint(isFront?frontA:rear,wheel,'hinge',isFront?100:180,isFront?.58:.24);
        addContactBlob(wheel,[X(.9),Z(.58)]);
      }
      // Each pane is already a set of constrained rigid shards; fracture removes their locks.
      const shardMass=M(.001),paneThick=X(.023);
      const windshieldAngle=.68;
      const windshieldQ=new CANNON.Quaternion();windshieldQ.setFromAxisAngle(V3(0,0,1),windshieldAngle);
      for(let row=0;row<2;row++)for(let col=0;col<4;col++){
        const yy=1.13+row*.19,xx=.78-row*.17,zz=(col-1.5)*.30;
        const shard=bodyPart('windshield shard',shardMass,place(xx,yy,zz),dims(.025,.22,.297),glassMat,null,{quat:windshieldQ});
        joint(cabinPart,shard,'lock',32,.55);
      }
      for(const s of [-1,1])for(let row=0;row<2;row++)for(let col=0;col<2;col++){
        const xx=col===0?.29:-.48,yy=1.14+row*.18;
        const shard=bodyPart('side glass shard',shardMass,place(xx,yy,s*.704),dims(.36,.175,.024),glassMat);
        joint(cabinPart,shard,'lock',48,.42);
      }
      addContactBlob(cabinPart,[X(3.4),Z(2.1)]);addContactBlob(frontA,[X(1.2),Z(1.8)]);addContactBlob(frontB,[X(1),Z(1.7)]);addContactBlob(frontC,[X(1),Z(1.7)]);addContactBlob(rear,[X(1.1),Z(1.8)]);
      for(const p of parts) syncPart(p);
    }

    function effectMaterial(color,opacity){const material=new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false});material.userData.runOwned=true;return material;}
    function makeImpactEffects(){
      const origin=new THREE.Vector3(wallX-.7,.8,0); const dustGeo=new THREE.IcosahedronGeometry(1,0);
      for(let i=0;i<29;i++){
        const a=hash(173+i*4)*Math.PI*2,r=.15+hash(174+i*4)*1.4;
        const mesh=new THREE.Mesh(dustGeo,effectMaterial(i%4?'#b7a799':'#c8b9a6',.22));mesh.scale.setScalar(.09+hash(175+i*4)*.18);mesh.position.copy(origin).add(new THREE.Vector3((hash(i+991)-.5)*.8,hash(i+399)*.5,(hash(i+124)-.5)*1.3));dynamicRoot.add(mesh);
        visualEffects.push({mesh,kind:'dust',age:0,life:.7+hash(i+187)*.8,velocity:new THREE.Vector3(Math.cos(a)*r, .4+hash(i+699)*1.7,Math.sin(a)*r)});
      }
      const sparkGeo=new THREE.BoxGeometry(.013,.013,.14);
      for(let i=0;i<12;i++){
        const a=hash(299+i)*Math.PI*2,mesh=new THREE.Mesh(sparkGeo,effectMaterial('#ffb957',.9));mesh.position.set(wallX-.5,.55+hash(42+i)*.7,(hash(84+i)-.5)*1.2);mesh.rotation.set(hash(i+92)*3,hash(i+93)*3,hash(i+94)*3);dynamicRoot.add(mesh);
        visualEffects.push({mesh,kind:'spark',age:0,life:.25+hash(312+i)*.45,velocity:new THREE.Vector3(-1.5-hash(i+551)*3,1+hash(i+781)*2,Math.sin(a)*3)});
      }
    }
    function updateEffects(dt){for(const e of visualEffects){e.age+=dt;if(e.age>=e.life){e.mesh.visible=false;continue;}e.mesh.position.addScaledVector(e.velocity,dt);e.velocity.y-=e.kind==='spark'?8*dt:1.2*dt;e.mesh.material.opacity=(e.kind==='spark'?.85:.22)*(1-e.age/e.life);if(e.kind==='dust')e.mesh.scale.multiplyScalar(1+dt*.8);}}

    function syncPart(p){p.group.position.set(p.body.position.x,p.body.position.y,p.body.position.z);p.group.quaternion.set(p.body.quaternion.x,p.body.quaternion.y,p.body.quaternion.z,p.body.quaternion.w);if(p.blob){p.blob.position.set(p.body.position.x,.008,p.body.position.z);p.blob.material.opacity=.48*clamp(1-p.body.position.y/3.2,.06,1);p.blob.visible=p.body.position.y<3.5;}}
    function syncVisuals(){for(const p of parts)syncPart(p);for(let i=0;i<brickBodies.length;i++){const b=brickBodies[i];tmpP.set(b.position.x,b.position.y,b.position.z);tmpQ.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);tmpM.compose(tmpP,tmpQ,one);brickMesh.setMatrixAt(i,tmpM);}brickMesh.instanceMatrix.needsUpdate=true;}
    function breakJoint(j){if(j.broken)return;world.removeConstraint(j.con);j.broken=true;j.b.attached=false;for(const p of parts)p.body.collisionFilterMask=7;j.b.body.wakeUp();j.a.body.wakeUp();}
    function physicsStep(){
      contactThisStep=0;
      if(cabin && cabin.body.velocity.x<cfg.impactSpeed && cabin.body.position.x<wallX-cfg.carLength*.61){
        const remaining=cfg.impactSpeed-cabin.body.velocity.x;
        const acceleration=Math.min(driveAcceleration,remaining/FIXED);
        cabin.body.applyForce(V3(cfg.carMass*acceleration,0,0),cabin.body.position);
      }
      world.step(FIXED);simTime+=FIXED;
      if(contactThisStep>12){
        if(impactAt<0){impactAt=simTime;impactPower=contactThisStep;makeImpactEffects();}
        impactPower=Math.max(impactPower,contactThisStep);
      }
      for(const j of joints){
        if(j.broken)continue;
        let solverImpulse=0;
        for(const eq of j.con.equations) solverImpulse=Math.max(solverImpulse,Math.abs(eq.multiplier||0)*FIXED);
        const collisionLoad=contactThisStep*j.exposure;
        if(Math.max(solverImpulse,collisionLoad)>j.threshold)breakJoint(j);
      }
      updateEffects(FIXED);
      if(simTime>5 && impactAt>=0){
        let moving=0;for(const b of brickBodies){if(b.velocity.lengthSquared()>.09 || b.angularVelocity.lengthSquared()>.5)moving++;}
        for(const p of parts){if(p.body.velocity.lengthSquared()>.16 || p.body.angularVelocity.lengthSquared()>.6)moving+=2;}
        quietFor=moving<5?quietFor+FIXED:0;
        if(quietFor>1.25||simTime>22){playing=false;runComplete=true;updatePlayButton();}
      }
    }

    function rebuild(){
      cfg=settingsValues();carStart=-cfg.trackLength/2+5.5;wallX=cfg.trackLength/2-10;
      initialSpeed=Math.min(6,cfg.impactSpeed*.28);
      const approachDistance=Math.max(2,wallX-carStart-cfg.carLength*.58);
      driveAcceleration=Math.min(50,Math.max(.7,(cfg.impactSpeed**2-initialSpeed**2)/(2*approachDistance)*1.12));
      clearRoot(dynamicRoot); parts=[];joints=[];brickBodies=[];visualEffects=[];brickMesh=null;cabin=null;
      simTime=0;accumulator=0;impactAt=-1;impactPower=0;quietFor=0;runComplete=false;playing=true;lastFrame=performance.now();
      buildTrack();makeWorld();buildWall();buildCar();syncVisuals();updatePlayButton();updateCamera(true);updateReadout();
    }
    function updatePlayButton(){playButton.textContent=playing?'Pause':'Play';playButton.setAttribute('aria-label',playing?'Pause simulation':'Play simulation');}
    function updateReadout(){const state=runComplete?'Wreck held':playing?'Running':'Paused';readout.textContent=`${state}  ·  ${simTime.toFixed(2)} s${impactAt>=0?'  ·  impact':''}`;}
    function cameraLook(position,target,instant){
      if(instant)camera.position.copy(position);else camera.position.lerp(position,Math.min(1,.13*60/Math.max(1,frameRateEstimate)));
      camera.lookAt(target);
    }
    let frameRateEstimate=60;
    function updateCamera(instant=false){
      if(!cabin)return;
      if(view==='orbit'){orbit.enabled=true;orbit.update();return;}orbit.enabled=false;
      const carX=cabin.body.position.x; let position,target;
      if(view==='impact'){
        const t=smooth(carStart,wallX-3,carX),cx=THREE.MathUtils.lerp(-2.2,wallX-2.3,t);
        const distance=THREE.MathUtils.lerp(22,16.5,t);
        position=new THREE.Vector3(cx-1.2,THREE.MathUtils.lerp(9.5,7.8,t),distance);
        target=new THREE.Vector3(cx,.8,0);
        if(impactAt>=0){const age=simTime-impactAt,shake=Math.max(0,1-age/.4)*Math.min(.15,impactPower/2000);position.x+=Math.sin(age*87)*shake;position.y+=Math.sin(age*119)*shake*.6;}
      } else if(view==='follow'){
        const x=Math.min(carX,wallX+1.5);position=new THREE.Vector3(x-7,3.8,8.4);target=new THREE.Vector3(x+4.2,.75,0);
      } else {
        const topHeight=Math.max(48,cfg.trackLength*1.25,cfg.trackLength/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*Math.max(camera.aspect,.4))*1.1);
        position=new THREE.Vector3(0,topHeight,.001);target=new THREE.Vector3(0,0,0);camera.up.set(0,0,-1);
      }
      if(view!=='top')camera.up.set(0,1,0);
      cameraLook(position,target,instant);
    }
    function setView(next){view=next;for(const b of viewButtons)b.setAttribute('aria-pressed',String(b.dataset.view===next));if(next==='orbit'){orbit.target.set(wallX-2,.8,0);camera.position.set(wallX-7,7.5,14);camera.up.set(0,1,0);orbit.enabled=true;orbit.update();}else updateCamera(true);}
    function togglePause(){playing=!playing;runComplete=false;lastFrame=performance.now();updatePlayButton();updateReadout();}
    playButton.addEventListener('click',togglePause);
    document.getElementById('replay').addEventListener('click',rebuild);
    document.getElementById('apply').addEventListener('click',()=>{rebuild();panel.hidden=true;settingsButton.setAttribute('aria-expanded','false');});
    speedSelect.addEventListener('change',()=>{accumulator=0;});
    viewButtons.forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    function setPanel(open){panel.hidden=!open;settingsButton.setAttribute('aria-expanded',String(open));}
    settingsButton.addEventListener('click',()=>setPanel(panel.hidden));document.getElementById('closeSettings').addEventListener('click',()=>setPanel(false));
    window.addEventListener('keydown',e=>{if(e.code==='Space' && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLSelectElement)){e.preventDefault();togglePause();}});
    window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    function frame(now){
      const elapsed=Math.min((now-lastFrame)/1000,.05);lastFrame=now;frameRateEstimate=elapsed>0?1/elapsed:60;
      if(playing){accumulator+=elapsed*Number(speedSelect.value);let steps=0;while(accumulator>=FIXED&&steps<MAX_STEPS){physicsStep();accumulator-=FIXED;steps++;}if(steps===MAX_STEPS&&accumulator>FIXED*MAX_STEPS)accumulator=FIXED*MAX_STEPS;}
      syncVisuals();updateCamera();updateReadout();renderer.render(scene,camera);requestAnimationFrame(frame);
    }
    try { rebuild(); requestAnimationFrame(frame); }
    catch(error){console.error(error); const box=document.createElement('div');box.className='error';box.textContent=`Unable to start the simulation: ${error.message}`;document.body.append(box);readout.textContent='Simulation unavailable';}
  </script>
</body>
