<body>
  <div id="stage" aria-label="Three dimensional rigid body crash simulation"></div>
  <div class="veil"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">C</span><span class="brand-name">Codex</span></div>

      <button class="camera-btn" data-view="follow">Follow</button>
      <button class="camera-btn" data-view="top">Top</button>
      <button class="camera-btn" data-view="orbit">Orbit</button>
    </nav>
  </header>
  <div class="readout"><strong id="speed-readout">0.0 m/s</strong><span class="readout-sep"></span><span id="clock-readout">0.00 s</span></div>
  <div class="hint">SPACE  PAUSE / PLAY</div>
  <div class="bottom">

        <button class="speed-btn" data-speed="0.5">0.5×</button>
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
      </div>
    </div>
    <button id="settings-toggle" class="settings-toggle" aria-expanded="false">Settings</button>
  </div>
  <section id="settings-panel" class="settings-panel" aria-label="Experiment settings">
    <div class="settings-head"><span>SETTINGS</span><button id="close-settings" class="camera-btn" aria-label="Close settings">Close</button></div>

        <div class="field"><label for="impactSpeed">Impact speed · m/s</label><input id="impactSpeed" name="impactSpeed" type="number" min="1" max="45" step="0.5" value="22"></div>
        <div class="field"><label for="carMass">Car mass · kg</label><input id="carMass" name="carMass" type="number" min="400" max="4000" step="10" value="1250"></div>
        <div class="field"><label for="carLength">Car length · m</label><input id="carLength" name="carLength" type="number" min="2.5" max="7" step="0.1" value="4.2"></div>
        <div class="field"><label for="carWidth">Car width · m</label><input id="carWidth" name="carWidth" type="number" min="1.2" max="2.6" step="0.1" value="1.8"></div>
        <div class="field"><label for="carHeight">Car height · m</label><input id="carHeight" name="carHeight" type="number" min="1" max="2.4" step="0.05" value="1.45"></div>
        <div class="field"><label for="trackLength">Track length · m</label><input id="trackLength" name="trackLength" type="number" min="24" max="100" step="1" value="40"></div>
        <div class="field"><label for="wallColumns">Wall columns</label><input id="wallColumns" name="wallColumns" type="number" min="4" max="24" step="1" value="12"></div>
        <div class="field"><label for="wallRows">Wall rows</label><input id="wallRows" name="wallRows" type="number" min="3" max="16" step="1" value="8"></div>
        <div class="field"><label for="wallDepth">Wall depth · bricks</label><input id="wallDepth" name="wallDepth" type="number" min="1" max="4" step="1" value="2"></div>
        <div class="field"><label for="brickMass">Brick mass · kg</label><input id="brickMass" name="brickMass" type="number" min="0.5" max="20" step="0.1" value="2.5"></div>
        <div class="field"><label for="brickWidth">Brick width · m</label><input id="brickWidth" name="brickWidth" type="number" min="0.25" max="0.9" step="0.01" value="0.50"></div>
        <div class="field"><label for="brickHeight">Brick height · m</label><input id="brickHeight" name="brickHeight" type="number" min="0.12" max="0.5" step="0.01" value="0.24"></div>
        <div class="field"><label for="brickDepth">Brick depth · m</label><input id="brickDepth" name="brickDepth" type="number" min="0.1" max="0.5" step="0.01" value="0.20"></div>
        <div class="field"><label for="gravity">Gravity · m/s²</label><input id="gravity" name="gravity" type="number" min="1" max="25" step="0.01" value="9.81"></div>
        <div class="field"><label for="brickFriction">Brick friction</label><input id="brickFriction" name="brickFriction" type="number" min="0.05" max="1.5" step="0.01" value="0.72"></div>

      </div></div>
      <div class="settings-foot"><span>Changes rebuild the next run.</span><button class="action-btn" type="submit">Apply</button></div>
    </form>
  </section>
  <div id="error" class="error"></div>

        for(let i=0;i<count;i++) {
          const gx=(i%3)-1, gz=Math.floor(i/3)*2-1;
          const local=new THREE.Vector3(gx*hx*.52,0,gz*hz*.48);
          const pos=center.clone().add(local.clone().applyQuaternion(rotation));
          const spin=(pIndex*7+i)*.137;
          const shardRot=rotation.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(.17*Math.sin(spin),.23*Math.cos(spin),.19*Math.sin(spin*.7))));
          const shardMass=Math.max(.08,pane.mass/count);
          const sx=Math.max(.045,hx*.31), sy=Math.max(.012,hy*1.25), sz=Math.max(.04,hz*.29);
          const tri=new THREE.BufferGeometry();
          tri.setAttribute('position',new THREE.Float32BufferAttribute([
            -sx,0,-sz, sx*.9,0,-sz*.45, -sx*.15,0,sz,
            sx*.9,0,-sz*.45, sx,0,sz*.8, -sx*.15,0,sz
          ],3)); tri.computeVertexNormals();
          const shard=makeDynamicPart({name:'glass shard',kind:'shard',mass:shardMass,position:pos,rotation:shardRot,colliderSpecs:[{half:[sx*.52,sy,sz*.52],friction:.32,restitution:.12,mass:shardMass}],build:(g)=>{ const m=new THREE.Mesh(tri,glassMat); m.castShadow=true; m.receiveShadow=true; g.add(m); },ccd:true});
          shard.body.setLinvel({x:vel.x+1.7*Math.cos(spin),y:vel.y+.65+Math.abs(Math.sin(spin)),z:vel.z+1.7*Math.sin(spin)},true);
          shard.body.setAngvel({x:.7*Math.sin(spin),y:1.2*Math.cos(spin*.8),z:.9*Math.sin(spin*.6)},true);
        }
      }
      if (load > 0) makeImpactEffects(load);
    }
    function breakFromImpact(source, load) {
      if (!source || !Number.isFinite(load)) return;
      const distance=new Map([[source,0]]); const queue=[source];
      while(queue.length) {
        const current=queue.shift(); const d=distance.get(current);
        for(const edge of jointRecords) {
          if(!edge.active) continue;
          const other=edge.parent===current?edge.child:edge.child===current?edge.parent:null;
          if(!other || distance.has(other)) continue;
          distance.set(other,d+1); queue.push(other);
        }
      }
      for(const edge of jointRecords) {
        if(!edge.active) continue;
        const da=distance.get(edge.parent), db=distance.get(edge.child);
        if(da===undefined&&db===undefined) continue;
        const depth=Math.min(da??Infinity,db??Infinity);
        const carried=load*Math.pow(.72,depth);
        if(carried >= edge.threshold) removeJoint(edge);
      }
    }
    function createImpactEffect(kind, count, color, size, life, seed) {
      const random=mulberry32(seed); const positions=new Float32Array(count*3); const velocities=[]; const ages=new Float32Array(count); const lives=new Float32Array(count);
      const origin=run.carRoot.body.translation();
      for(let i=0;i<count;i++) {
        const x=origin.x+1.65+(random()-.5)*1.2, y=.45+random()*1.5, z=(random()-.5)*2.5;
        positions.set([x,y,z],i*3);
        velocities.push(new THREE.Vector3((random()*.9+.25)*(kind==='spark'?5:1.8),random()*(kind==='spark'?5:2.7), (random()-.5)*(kind==='spark'?4:2.8)));
        lives[i]=life*(.65+random()*.7);
      }
      const geometry=new THREE.BufferGeometry(); geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
      const material=new THREE.PointsMaterial({color,size,transparent:true,opacity:kind==='spark'?.96:.45,depthWrite:false,blending:kind==='spark'?THREE.AdditiveBlending:THREE.NormalBlending,sizeAttenuation:true}); material.userData.runOwned=true;
      const points=new THREE.Points(geometry,material); points.frustumCulled=false; scene.add(points); sharedObjects.add(points);
      const effect={kind,points,geometry,material,positions,velocities,ages,lives,life};
      if(kind==='spark') sparksEffect=effect; else dustEffect=effect;
    }
    function makeImpactEffects(load) {
      if (!dustEffect) createImpactEffect('dust',54,0xb8a28c,.55,1.8,0x1a2b3c);
      if (!sparksEffect) createImpactEffect('spark',20,0xffb35c,.22,.65,0x64fa1);
      const root=run.carRoot.body.translation();
      const skidMat=new THREE.MeshBasicMaterial({color:0x111719,transparent:true,opacity:.52,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1,toneMapped:false}); skidMat.userData.runOwned=true;
      for(const side of [-1,1]) {
        const skid=new THREE.Mesh(new THREE.PlaneGeometry(5.8,.16),skidMat); skid.rotation.x=-Math.PI/2; skid.position.set(root.x-2.2,.008,side*.62); scene.add(skid); sharedObjects.add(skid); skidMeshes.push(skid);
      }
      run.cameraShake=Math.min(.7,load/600000);
    }
    function updateEffect(effect, dt) {
      if(!effect) return;
      const pos=effect.positions;
      for(let i=0;i<effect.ages.length;i++) {
        if(effect.ages[i]>=effect.lives[i]) { pos[i*3+1]=-100; continue; }
        effect.ages[i]+=dt;
        const v=effect.velocities[i]; v.y-= (effect.kind==='spark'?9.81:2.8)*dt;
        pos[i*3]+=v.x*dt; pos[i*3+1]+=v.y*dt; pos[i*3+2]+=v.z*dt;
        if(effect.kind==='dust') { v.x*=Math.pow(.97,dt*60); v.z*=Math.pow(.97,dt*60); }
      }
      effect.geometry.attributes.position.needsUpdate=true;
      const lifeFrac=Math.max(0,1-effect.ages.reduce((m,a,i)=>Math.max(m,a/effect.lives[i]),0));
      effect.material.opacity=(effect.kind==='spark'?.96:.42)*lifeFrac;
    }
    function startImpact(source, load) {
      if(run.phase!=='approach') {
        if(run.phase==='impact') { run.load=Math.max(run.load,load); breakFromImpact(source,load); }
        return;
      }
      if(load < 4200) return;
      run.phase='impact'; run.impactTime=run.simTime; run.firstImpactX=run.carRoot.body.translation().x; run.load=load;
      breakFromImpact(source,load);
      shatterGlass(load);
      setRunStatus('Impact',run.playing?'playing':'paused');
    }
    function getSpeed(body) {
      const v=body.linvel(); return Math.hypot(v.x,v.y,v.z);
    }
    function stepPhysics() {
      if(!world || !run.playing) return;
      const before=new Map();
      for(const p of dynamicParts) if(!p.removed&&p.kind!=='brick'&&p.kind!=='shard') before.set(p,{x:p.body.linvel().x,y:p.body.linvel().y,z:p.body.linvel().z});
      if(run.phase==='approach') {
        const rootV=run.carRoot.body.linvel();
        const speed=Math.max(0,rootV.x);
        if(speed < settings.impactSpeed) {
          const accel=run.accel;
          const connected=new Set([run.carRoot]); const q=[run.carRoot];
          while(q.length) { const p=q.shift(); for(const edge of jointRecords) if(edge.active) { const o=edge.parent===p?edge.child:edge.child===p?edge.parent:null; if(o&&!connected.has(o)) {connected.add(o);q.push(o);} } }
          for(const part of connected) if(!part.removed) part.body.addForce({x:part.mass*accel,y:0,z:0},true);
        }
      }
      world.step(eventQueue);
      run.simTime += FIXED_DT;
      const contacts=[];
      eventQueue.drainCollisionEvents((h1,h2,started)=>{
        if(!started) return;
        const a=colliderOwners.get(h1), b=colliderOwners.get(h2);
        if(!a||!b) return;
        const car=a.kind==='car'?a:b.kind==='car'?b:null;
        const wall=a.kind==='brick'?a:b.kind==='brick'?b:null;
        if(car&&wall&&car.part) contacts.push({part:car.part,load:0});
      });
      eventQueue.drainContactForceEvents((event)=>{
        const h1=event.collider1(),h2=event.collider2();
        const a=colliderOwners.get(h1),b=colliderOwners.get(h2);
        if(!a||!b) return;
        const car=a.kind==='car'?a:b.kind==='car'?b:null;
        const wall=a.kind==='brick'?a:b.kind==='brick'?b:null;
        if(!car||!wall||!car.part) return;
        let force=0;
        try { force=event.totalForceMagnitude(); } catch {}
        const old=before.get(car.part); const velocity=car.part.body.linvel();
        const drop=old?Math.max(0,Math.hypot(old.x,old.y,old.z)-Math.hypot(velocity.x,velocity.y,velocity.z)):0;
        const estimated=drop*car.part.mass/FIXED_DT;
        contacts.push({part:car.part,load:Math.max(force,estimated)});
      });
      for(const item of contacts) {
        if(item.load===0) {
          const old=before.get(item.part); const now=item.part.body.linvel();
          const drop=old?Math.max(0,Math.hypot(old.x,old.y,old.z)-Math.hypot(now.x,now.y,now.z)):0;
          item.load=drop*item.part.mass/FIXED_DT;
          if(item.load<4200) item.load=Math.max(4200,settings.carMass*settings.impactSpeed*.015/FIXED_DT);
        }
        startImpact(item.part,item.load);
      }
      if(run.phase==='impact') {
        let maxMotion=0;
        for(const p of dynamicParts) if(!p.removed && p.body.isDynamic()) {
          const lv=p.body.linvel(), av=p.body.angvel();
          maxMotion=Math.max(maxMotion,Math.hypot(lv.x,lv.y,lv.z),Math.hypot(av.x,av.y,av.z)*.35);
        }
        if(maxMotion<.13) run.stableTime+=FIXED_DT; else run.stableTime=0;
        if(run.simTime-run.impactTime>2 && run.stableTime>1.05) { run.phase='settled'; setRunStatus('Settled','settled'); }
      }
      updateEffect(dustEffect,FIXED_DT); updateEffect(sparksEffect,FIXED_DT);
    }
    function syncMeshes() {
      for(const p of dynamicParts) {
        if(p.removed) continue;
        const t=p.body.translation(), r=p.body.rotation();
        if(p.kind==='brick') { p.group.position.set(t.x,t.y,t.z); p.group.quaternion.set(r.x,r.y,r.z,r.w); }
        else { p.group.position.set(t.x,t.y,t.z); p.group.quaternion.set(r.x,r.y,r.z,r.w); }
      }
      if(contactBlobs) {
        const obj=new THREE.Object3D(); let index=0;
        for(const p of dynamicParts) {
          if(p.removed||index>=contactBlobs.instanceMatrix.count) continue;
          const t=p.body.translation();
          const base=p.kind==='brick'?Math.max(settings.brickWidth,settings.brickHeight)*.85:p.kind==='shard'?.18:p.name.includes('wheel')?.62:Math.max(.35,settings.carWidth*.46);
          const strength=THREE.MathUtils.clamp(1-Math.max(0,t.y-.1)*.28,.18,1);
          obj.position.set(t.x,.006+index*.000001,t.z); obj.rotation.set(-Math.PI/2,0,0); obj.scale.set(base*1.5*strength,base*1.15*strength,1); obj.updateMatrix(); contactBlobs.setMatrixAt(index,obj.matrix); index++;
        }
        contactBlobs.count=index; contactBlobs.instanceMatrix.needsUpdate=true;
      }
    }
    function smoothstep(a,b,x) { const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
    const cameraTarget = new THREE.Vector3();
    const cameraPos = new THREE.Vector3();
    function updateCamera(dt) {
      if(!run.carRoot || !world) return;
      const root=run.carRoot.body.translation();
      const carX=root.x, wallX=run.wallX, dist=wallX-carX;
      if(viewMode==='impact') {
        const u=1-smoothstep(10,24,dist);
        const widePos=new THREE.Vector3(wallX-16,22,52);
        const wideTarget=new THREE.Vector3(wallX-10,.4,0);
        const impactShift=run.phase==='impact'?THREE.MathUtils.clamp((carX-(wallX-2.1))*.22,-2,6):0;
        const tightPos=new THREE.Vector3(wallX-7.1+impactShift,6.1,12.2);
        const tightTarget=new THREE.Vector3(wallX-.2+impactShift,.75,0);
        cameraPos.lerpVectors(widePos,tightPos,u);
        cameraTarget.lerpVectors(wideTarget,tightTarget,u);
        if(run.phase==='impact'&&run.cameraShake>0) {
          const age=run.simTime-run.impactTime;
          const shake=run.cameraShake*Math.max(0,1-age/.55);
          cameraPos.x+=Math.sin(run.simTime*81)*shake*.16; cameraPos.y+=Math.cos(run.simTime*93)*shake*.12;
        }
      } else if(viewMode==='follow') {
        cameraPos.set(carX-9,4.25,8.8);
        cameraTarget.set(carX+5,1.0,0);
      } else if(viewMode==='top') {
        cameraPos.set(0,Math.max(30,run.trackLength*.72),0);
        cameraTarget.set(0,0,0);
      } else {
        const horizontal=Math.cos(orbitPitch)*orbitDistance;
        cameraPos.set(orbitTarget.x+Math.sin(orbitYaw)*horizontal,orbitTarget.y+Math.sin(orbitPitch)*orbitDistance,orbitTarget.z+Math.cos(orbitYaw)*horizontal);
        cameraTarget.copy(orbitTarget);
      }
      camera.position.copy(cameraPos); camera.up.set(0,1,0);
      if(viewMode==='top') camera.up.set(0,0,-1);
      camera.lookAt(cameraTarget);
    }
    function updateReadouts() {
      let speed=0;
      if(run.carRoot && !run.carRoot.removed) speed=getSpeed(run.carRoot.body);
      speedReadout.textContent=speed.toFixed(1)+' m/s';
      clockReadout.textContent=run.simTime.toFixed(2)+' s';
    }
    function animate(now) {
      requestAnimationFrame(animate);
      const realDt=Math.min(.05,Math.max(0,(now-frameLast)/1000)); frameLast=now;
      if(run.playing&&world) {
        accumulator+=realDt*run.speed;
        let steps=0;
        while(accumulator>=FIXED_DT&&steps<MAX_STEPS) { stepPhysics(); accumulator-=FIXED_DT; steps++; }
        if(steps===MAX_STEPS&&accumulator>FIXED_DT*MAX_STEPS) accumulator=FIXED_DT*MAX_STEPS;
      }
      syncMeshes(); updateCamera(realDt); updateReadouts();
      renderer.render(scene,camera);
    }
    function showError(error) {
      const box=document.querySelector('#error'); box.style.display='block';
      box.textContent='The physics engine could not start. Check the connection to the pinned CDN and reload. '+String(error?.message||error).slice(0,160);
      setRunStatus('Engine error','paused');
    }

    document.querySelectorAll('.camera-btn[data-view]').forEach(button=>button.addEventListener('click',()=>{
      viewMode=button.dataset.view;
      document.querySelectorAll('.camera-btn[data-view]').forEach(b=>b.classList.toggle('active',b===button));
      if(viewMode==='orbit') { orbitTarget.set(run.wallX-2,1.1,0); }
      updateCamera(0);
    }));
    document.querySelectorAll('.speed-btn').forEach(button=>button.addEventListener('click',()=>{
      run.speed=Number(button.dataset.speed);
      document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b===button));
    }));
    playButton.addEventListener('click',()=>setPlaying(!run.playing));
    document.querySelector('#replay-button').addEventListener('click',()=>rebuild(readSettings(),true));
    document.querySelector('#settings-toggle').addEventListener('click',()=>{
      const open=!settingsPanel.classList.contains('open'); settingsPanel.classList.toggle('open',open);
      document.querySelector('#settings-toggle').setAttribute('aria-expanded',String(open));
    });
    document.querySelector('#close-settings').addEventListener('click',()=>{
      settingsPanel.classList.remove('open'); document.querySelector('#settings-toggle').setAttribute('aria-expanded','false');
    });
    settingsForm.addEventListener('submit',(event)=>{
      event.preventDefault(); rebuild(readSettings(),true);
      settingsPanel.classList.remove('open'); document.querySelector('#settings-toggle').setAttribute('aria-expanded','false');
    });
    window.addEventListener('keydown',(event)=>{
      if(event.code!=='Space') return;
      const target=event.target;
      if(target instanceof HTMLInputElement && target.type==='number') return;
      event.preventDefault(); setPlaying(!run.playing);
    });
    renderer.domElement.addEventListener('pointerdown',(event)=>{
      if(viewMode!=='orbit') return;
      orbitDragging=true; lastPointer={x:event.clientX,y:event.clientY}; renderer.domElement.setPointerCapture(event.pointerId);
    });
    renderer.domElement.addEventListener('pointermove',(event)=>{
      if(!orbitDragging||viewMode!=='orbit') return;
      const dx=event.clientX-lastPointer.x, dy=event.clientY-lastPointer.y; lastPointer={x:event.clientX,y:event.clientY};
      orbitYaw-=dx*.006; orbitPitch=THREE.MathUtils.clamp(orbitPitch+dy*.005,-.08,1.25); updateCamera(0);
    });
    renderer.domElement.addEventListener('pointerup',()=>{orbitDragging=false;});
    renderer.domElement.addEventListener('pointercancel',()=>{orbitDragging=false;});
    renderer.domElement.addEventListener('wheel',(event)=>{
      if(viewMode!=='orbit') return; orbitDistance=THREE.MathUtils.clamp(orbitDistance+event.deltaY*.018,9,72); updateCamera(0);
    },{passive:true});
    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.65));
    });

    (async()=>{
      try {
        await RAPIER.init();
        initialized=true;
        setControlValues(defaultSettings);
        rebuild(defaultSettings,true);
        requestAnimationFrame(animate);
      } catch(error) { showError(error); }
    })();
  </script>
</body>
</html>
