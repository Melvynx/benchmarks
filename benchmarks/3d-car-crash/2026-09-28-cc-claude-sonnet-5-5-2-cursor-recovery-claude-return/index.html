<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#e8edf3;font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#brand{position:fixed;top:12px;left:16px;font-size:15px;font-weight:650;letter-spacing:.02em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:rgba(14,18,25,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:6;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.06)}
button{font:inherit;color:#dfe6ee;background:transparent;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:#e8edf3;color:#0d1117;font-weight:650}
button.act{background:#2f6fed;color:#fff;font-weight:650}
button.act:hover{background:#4a83f5}
#hud{min-width:150px;color:#9fb0c3;font-variant-numeric:tabular-nums;font-size:11px}
#panel{position:fixed;top:0;right:0;bottom:0;width:292px;padding:14px 14px 76px;overflow:auto;background:rgba(14,18,25,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-left:1px solid rgba(255,255,255,.12);transform:translateX(102%);transition:transform .22s ease;z-index:7}
#panel.open{transform:none}
#panel h3{margin:14px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7f93a9;font-weight:650}
#panel h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;margin:4px 0}
.row label{color:#c5d0dc}
.row .u{color:#7f93a9;font-size:10px;margin-left:4px}
input[type=number]{width:100%;font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:2px solid #2f6fed;outline-offset:0}
.pbtns{display:flex;gap:8px;margin-top:16px}
.pbtns button{flex:1;padding:8px 10px;border:1px solid rgba(255,255,255,.16)}
#panel .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 0}
#err{position:fixed;inset:auto 16px 70px 16px;color:#ffb4b4;z-index:9;display:none}
</style>
<script type="importmap">

"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DT = 1 / 120, MAX_STEPS = 8, G0 = 9.81, VIS_SEED = 90210;
const DEFAULTS = { speed: 22, carMass: 1250, carL: 4.2, carW: 1.8, carH: 1.45, cols: 12, rows: 8, depth: 2,
  brickMass: 2.5, bw: 0.5, bh: 0.24, bd: 0.2, gravity: 9.81, brickFriction: 0.72, brickRestitution: 0.18,
  groundFriction: 0.85, trackLen: 40 };
const SCHEMA = [
  [['speed', 'Impact speed', 'm/s', 3, 60, 0.5], ['carMass', 'Car mass', 'kg', 300, 6000, 10]],
  [['carL', 'Car length', 'm', 3.6, 6, 0.05], ['carW', 'Car width', 'm', 1.4, 2.4, 0.05], ['carH', 'Car height', 'm', 1.1, 2.2, 0.05]],
  [['cols', 'Wall columns', '', 3, 24, 1], ['rows', 'Wall rows', '', 1, 16, 1], ['depth', 'Wall depth (bricks)', '', 1, 4, 1]],
  [['brickMass', 'Brick mass', 'kg', 0.3, 80, 0.1], ['bw', 'Brick width', 'm', 0.2, 1, 0.01], ['bh', 'Brick height', 'm', 0.1, 0.5, 0.01], ['bd', 'Brick depth', 'm', 0.1, 0.5, 0.01]],
  [['gravity', 'Gravity', 'm/s²', 1, 25, 0.01], ['brickFriction', 'Brick friction', '', 0, 1.5, 0.01],
    ['brickRestitution', 'Brick restitution', '', 0, 0.95, 0.01], ['groundFriction', 'Ground friction', '', 0, 1.5, 0.01],

const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const $ = id => document.getElementById(id);

/* ---------- procedural textures (seeded, no external files) ---------- */
function canvasTex(w, h, draw, rep, srgb = true) {

function speckle(g, w, h, base, n, rng, size = 1.6, spread = 0.5) {

    g.fillStyle = d ? `rgba(0,0,0,${(rng() * spread).toFixed(3)})` : `rgba(255,255,255,${(rng() * spread * 0.7).toFixed(3)})`;
    const s = 0.6 + rng() * size; g.fillRect(rng() * w, rng() * h, s, s);

}
const TEX = {};
function makeTextures() {

    speckle(g, w, h, '#3a3c41', 60000, r, 2.2, 0.55);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 9; i++) { g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (r() - .5) * 60; y += (r() - .5) * 60; g.lineTo(x, y); } g.stroke(); }
  });
  TEX.grass = canvasTex(512, 512, (g, w, h) => {
    speckle(g, w, h, '#4c7a38', 70000, r, 2.6, 0.5);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `hsla(${85 + r() * 40},50%,${25 + r() * 25}%,.5)`; g.fillRect(r() * w, r() * h, 1.2, 3.2); }
  });
  TEX.gravel = canvasTex(512, 512, (g, w, h) => {
    speckle(g, w, h, '#8b877f', 20000, r, 1, 0.5);
    for (let i = 0; i < 16000; i++) { const v = 90 + r() * 110 | 0; g.fillStyle = `rgb(${v},${v - 4},${v - 10})`; g.beginPath(); g.arc(r() * w, r() * h, 0.7 + r() * 2.1, 0, 7); g.fill(); }
  });

    g.fillStyle = '#cfc7b8'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#b1503a'; g.fillRect(3, 3, w - 6, h - 6);
    for (let i = 0; i < 1400; i++) { g.fillStyle = r() < .5 ? `rgba(60,20,10,${(r() * .35).toFixed(2)})` : `rgba(255,190,150,${(r() * .22).toFixed(2)})`; g.fillRect(3 + r() * (w - 6), 3 + r() * (h - 6), 1 + r() * 2.5, 1 + r() * 1.6); }
  });

    const rows = 14, cw = w / 2, ch = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#f2f2f2'; g.fillRect(x * cw, y * ch, cw, ch + 1); }
  });

    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.45, '#9a9a9a'); gr.addColorStop(1, '#000');

}

/* ---------- renderer / scene / lighting ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc3d5e6, 90, 430);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2500);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const SUN_DIR = new THREE.Vector3(-0.5, 0.72, 0.42).normalize();
const sun = new THREE.DirectionalLight(0xfff0d8, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);
function fitSun(T) {
  const S = T / 2 + 7;
  sun.target.position.set(0, 0, 0);
  sun.position.copy(SUN_DIR).multiplyScalar(90);
  const c = sun.shadow.camera;
  c.left = -S; c.right = S; c.top = S * 0.62; c.bottom = -S * 0.62; c.near = 20; c.far = 170;
  c.updateProjectionMatrix();
}

const sky = new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sunDir: { value: SUN_DIR } },
  vertexShader: 'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `varying vec3 vP; uniform vec3 sunDir;
  void main(){ float h=clamp(vP.y,0.,1.); vec3 hor=vec3(.62,.74,.88), zen=vec3(.09,.25,.62);

    c+=vec3(1.,.82,.55)*(pow(s,900.)*4.+pow(s,10.)*.16); c=mix(c,hor*.85,smoothstep(.02,-.12,vP.y));
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`

sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* ---------- shared PBR materials ---------- */
const M = {};
function makeMaterials() {
  M.paint = new THREE.MeshPhysicalMaterial({ color: 0xb2101a, metalness: 0.6, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.15 });
  M.paintDark = new THREE.MeshPhysicalMaterial({ color: 0x5a0a10, metalness: 0.5, roughness: 0.5, clearcoat: 0.5, clearcoatRoughness: 0.2 });
  M.trim = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.5, metalness: 0.25 });
  M.dark = new THREE.MeshStandardMaterial({ color: 0x08090b, roughness: 0.92, metalness: 0.1 });
  M.chrome = new THREE.MeshStandardMaterial({ color: 0xe0e4ea, metalness: 1, roughness: 0.14 });
  M.tire = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.93, metalness: 0 });
  M.rim = new THREE.MeshStandardMaterial({ color: 0xc9ccd3, metalness: 1, roughness: 0.2 });
  M.glass = new THREE.MeshPhysicalMaterial({ color: 0x8fb4c6, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.34,
    clearcoat: 1, clearcoatRoughness: 0, ior: 1.52, envMapIntensity: 2.4, side: THREE.DoubleSide, depthWrite: false });
  M.head = new THREE.MeshStandardMaterial({ color: 0xfff4d0, emissive: 0xffe9b0, emissiveIntensity: 1.6, roughness: 0.15, metalness: 0.2 });
  M.tail = new THREE.MeshStandardMaterial({ color: 0x8a0508, emissive: 0xff1010, emissiveIntensity: 0.9, roughness: 0.25 });
  M.interior = new THREE.MeshStandardMaterial({ color: 0x24262b, roughness: 0.9 });
  M.seat = new THREE.MeshStandardMaterial({ color: 0x3a3d44, roughness: 0.85 });
  M.brick = new THREE.MeshStandardMaterial({ map: TEX.brick, bumpMap: TEX.brick, bumpScale: 1.6, roughness: 0.96, metalness: 0 });
  M.asphalt = new THREE.MeshStandardMaterial({ map: TEX.asphalt, bumpMap: TEX.asphalt, bumpScale: 1.4, roughness: 0.93, metalness: 0, color: 0xd8d8d8 });
  M.pad = new THREE.MeshStandardMaterial({ map: TEX.asphalt, color: 0x9a9da3, roughness: 0.9 });
  M.gravel = new THREE.MeshStandardMaterial({ map: TEX.gravel, bumpMap: TEX.gravel, bumpScale: 2, roughness: 1 });
  M.grass = new THREE.MeshStandardMaterial({ map: TEX.grass, bumpMap: TEX.grass, bumpScale: 1, roughness: 1 });
  M.line = new THREE.MeshStandardMaterial({ color: 0xf1f1ec, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  M.start = new THREE.MeshStandardMaterial({ map: TEX.start, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  M.vcol = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0.05 });
  M.concrete = new THREE.MeshStandardMaterial({ color: 0xa5a6a2, roughness: 0.95 });
  M.pole = new THREE.MeshStandardMaterial({ color: 0x3b4048, roughness: 0.5, metalness: 0.7 });
  M.lamp = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff1cf, emissiveIntensity: 2.4 });

/* ---------- static environment: track, curbs, shoulders, barriers, lights ---------- */
function planeGeo(w, d, tile) {
  const g = new THREE.PlaneGeometry(w, d); g.rotateX(-Math.PI / 2);
  const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / tile, uv.getY(i) * d / tile);
  return g;
}
function flat(cx, cz, sx, sz, y = 0.004) { return new THREE.PlaneGeometry(sx, sz).rotateX(-Math.PI / 2).translate(cx, y, cz); }

}
const noUV = g => g.index ? g.toNonIndexed() : g;
function buildEnvironment(T, startFrontX) {

  add(planeGeo(1400, 1400, 7), M.grass, -0.03);
  add(planeGeo(T + 16, 7.6, 4), M.asphalt, 0.0);
  add(planeGeo(T + 16, 3.6, 3), M.gravel, 0.004).position.z = 5.9;
  add(planeGeo(T + 16, 3.6, 3), M.gravel, 0.004).position.z = -5.9;
  add(planeGeo(7.2, 7.6, 4), M.pad, 0.002).position.x = startFrontX - 3.6;
  const lines = [];
  for (let x = -half + 1.5; x < half - 1; x += 6) lines.push(flat(x, 0, 3, 0.16));
  lines.push(flat(0, 3.3, T + 12, 0.16), flat(0, -3.3, T + 12, 0.16));
  lines.push(flat(startFrontX - 5.9, 0, 0.14, 4.6), flat(startFrontX - 3.7, 2.3, 4.4, 0.12), flat(startFrontX - 3.7, -2.3, 4.4, 0.12));
  add(mergeGeometries(lines), M.line, 0, true);
  const chk = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 6.6).rotateX(-Math.PI / 2).translate(startFrontX + 0.9, 0.006, 0), M.start);
  chk.receiveShadow = true; env.add(chk);
  const curbs = [], cr = new THREE.Color(0xc21f26), cw = new THREE.Color(0xf0f0ec), n = Math.floor((T + 14) / 0.9);
  for (let i = 0; i < n; i++) for (const s of [-1, 1]) {
    curbs.push(colored(noUV(new THREE.BoxGeometry(0.9, 0.08, 0.5).translate(-half - 7 + i * 0.9 + 0.45, 0.04, s * 3.95)), i % 2 ? cr : cw));
  }
  add(mergeGeometries(curbs), M.vcol, 0, true);
  const barr = [];
  for (let x = -half + 2; x < half; x += 4.2) { barr.push(new THREE.BoxGeometry(3.8, 0.55, 0.45).translate(x, 0.28, -8.4), new THREE.BoxGeometry(3.8, 0.28, 0.55).translate(x, 0.14, -8.4)); }
  for (let x = -half + 2; x < half - 14; x += 4.2) { barr.push(new THREE.BoxGeometry(3.8, 0.55, 0.45).translate(x, 0.28, 8.4), new THREE.BoxGeometry(3.8, 0.28, 0.55).translate(x, 0.14, 8.4)); }

  const poles = [], lamps = [];
  for (let x = -half + 5; x < half; x += 14) {
    poles.push(new THREE.CylinderGeometry(0.08, 0.11, 7.5, 8).translate(x, 3.75, -10), new THREE.BoxGeometry(0.15, 0.15, 1.6).translate(x, 7.4, -9.3));
    lamps.push(new THREE.BoxGeometry(0.55, 0.12, 0.35).translate(x, 7.3, -8.6));
  }

  const hills = [];
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2 + r() * 0.3, d = 340 + r() * 130, s = 60 + r() * 90;
    const g = new THREE.IcosahedronGeometry(1, 1).scale(s * 1.5, s * (0.28 + r() * 0.3), s * 1.1).translate(Math.cos(a) * d, -6, Math.sin(a) * d);
    hills.push(colored(noUV(g), new THREE.Color().setHSL(0.27 + r() * 0.08, 0.28, 0.24 + r() * 0.1)));
  }

  const nt = 70, foliage = new THREE.InstancedMesh(new THREE.ConeGeometry(1.5, 4.6, 7).translate(0, 4.2, 0), M.leaf, nt);
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.16, 0.24, 2, 6).translate(0, 1, 0), M.trunk, nt), mm = new THREE.Matrix4();
  for (let i = 0; i < nt; i++) {
    const x = (r() - 0.5) * (T + 160), z = (r() < 0.5 ? -1 : 1) * (18 + r() * 60), s = 0.8 + r() * 0.9;
    mm.makeScale(s, s, s).setPosition(x, 0, z); foliage.setMatrixAt(i, mm); trunks.setMatrixAt(i, mm);
  }

}

/* ---------- run construction: physics world, wall, ground ---------- */
const CG = (m, f) => (m << 16) | f;
const CG_GROUND = CG(1, 2 | 4 | 8), CG_BRICK = CG(2, 1 | 2 | 4 | 8), CG_CAR = CG(4, 1 | 2 | 8), CG_DEBRIS = CG(8, 1 | 2 | 4 | 8);
const vv = v => ({ x: v.x, y: v.y, z: v.z }), qq = q => ({ x: q.x, y: q.y, z: q.z, w: q.w });
const QX90 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
let RUN = null;

function readState(e) {
  const t = e.body.translation(), r = e.body.rotation(), a = e.p1;
  a[0] = t.x; a[1] = t.y; a[2] = t.z; a[3] = r.x; a[4] = r.y; a[5] = r.z; a[6] = r.w;
}
const mkSync = body => { const e = { body, p0: new Float64Array(7), p1: new Float64Array(7), asleep: false }; readState(e); e.p0.set(e.p1); return e; };
const _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _m = new THREE.Matrix4();
function interp(e, al) {

  $('bReplay').onclick = e => { newRun(); e.currentTarget.blur(); };
  $('gSpeed').addEventListener('click', ev => { const b = ev.target.closest('button[data-s]'); if (!b) return; state.speed = +b.dataset.s; markOn('gSpeed', b); b.blur(); });
  $('gView').addEventListener('click', ev => { const b = ev.target.closest('button[data-v]'); if (!b) return; state.view = b.dataset.v; CAM.snap = true; markOn('gView', b); b.blur(); });
  $('bSet').onclick = e => { $('panel').classList.toggle('open'); e.currentTarget.classList.toggle('on'); e.currentTarget.blur(); };
  $('bApply').onclick = e => { newRun(); e.currentTarget.blur(); };
  $('bReset').onclick = e => { Object.assign(SET, DEFAULTS); writeInputs(); newRun(); e.currentTarget.blur(); };
  $('panel').addEventListener('keydown', e => { if (e.key === 'Enter' && isNumField(e.target)) { newRun(); e.target.blur(); } });
  addEventListener('keydown', e => {
    if (e.code !== 'Space' || isNumField(document.activeElement)) return;
    e.preventDefault(); if (e.repeat) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    state.playing = !state.playing; syncPlay();
  });
  addEventListener('keyup', e => { if (e.code === 'Space' && !isNumField(document.activeElement)) e.preventDefault(); });
  addEventListener('resize', resize);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
let lastT = 0, failed = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (failed) return;
  try {
    const dtR = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
    const run = RUN;
    if (run) {
      if (state.playing) advance(run, dtR * state.speed);
      syncRender(run, run.acc / DT);
      updateCamera(dtR);
      hudT += dtR; if (hudT > 0.1) { hudT = 0; updateHud(run); }
    }
    if (FXM.a) FXM.a.uniforms.uScale.value = FXM.n.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
    renderer.render(scene, camera);
  } catch (err) { failed = true; showErr('Render loop error: ' + (err && err.message || err)); }
}
async function init() {
  try {
    await RAPIER.init();
    makeTextures(); makeMaterials(); buildPanel(); bindUI(); resize(); newRun();
    requestAnimationFrame(frame);
  } catch (err) { showErr('Failed to start: ' + (err && err.message || err)); }
}
init();
</script>
