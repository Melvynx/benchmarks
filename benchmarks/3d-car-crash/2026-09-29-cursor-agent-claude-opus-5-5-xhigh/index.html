<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  :root{--glass:rgba(14,16,20,.72);--line:rgba(255,255,255,.09);--fg:#e9ebee;--mute:#8d949e;--acc:#f3f4f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:var(--fg);font:500 12.5px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #brand{position:fixed;top:16px;left:18px;font-size:13px;font-weight:650;letter-spacing:.02em;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.35);pointer-events:none;display:flex;align-items:center;gap:8px}
  #brand::before{content:"";width:8px;height:8px;border-radius:50%;background:#e2452f;box-shadow:0 0 10px #e2452f}
  #bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
  .btn,.seg button{appearance:none;border:0;cursor:pointer;height:32px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--fg);font:inherit;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s}
  .btn:hover,.seg button:hover{background:rgba(255,255,255,.13)}
  .btn svg{width:14px;height:14px;fill:currentColor}
  .btn.icon{width:36px;padding:0;justify-content:center}
  .btn.primary{background:var(--acc);color:#0c0e11}
  .btn.primary:hover{background:#fff}
  .btn.on{background:rgba(255,255,255,.2)}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:11px;background:rgba(255,255,255,.035)}
  .seg button{height:28px;padding:0 10px;background:transparent;color:#c5cad1}
  .seg button.on{background:var(--acc);color:#0c0e11}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  #tele{display:flex;gap:12px;padding:0 8px 0 6px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  #tele b{color:var(--fg);font-weight:600}
  #panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 92px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 12px 12px}
  #panel[hidden]{display:none}
  #panel header{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:12.5px;padding:2px 2px 6px}
  #panel .x{appearance:none;border:0;background:transparent;color:var(--mute);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
  .grp{border-top:1px solid var(--line);padding:8px 0 4px}
  .gh{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 2px 6px}
  .row{display:grid;grid-template-columns:1fr 88px 38px;align-items:center;gap:8px;padding:2px}
  .row span{color:#cfd4da}
  .row em{font-style:normal;color:var(--mute);font-size:11px}
  .row input{width:100%;height:26px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 7px;outline:none}
  .row input:focus{border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.4)}
  #panel footer{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .hint{margin:8px 2px 0;color:var(--mute);font-size:11px;line-height:1.5}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity .4s}
  #loading.gone{opacity:0}
  @media (max-width:760px){#tele{display:none}#panel{width:calc(100vw - 28px)}}

<body>
<div id="stage"></div>
<div id="brand">Claude Opus 5.5</div>
<div id="loading">Loading physics…</div>
<div id="bar">
  <button id="bReplay" class="btn" title="Replay (R)"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>Replay</button>
  <button id="bPlay" class="btn icon" title="Pause / Play (Space)"></button>
  <div class="sep"></div>
  <div class="seg" id="segSpeed"><button data-s="0.25">0.25×</button><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div>
  <div class="sep"></div>
  <div class="seg" id="segView"><button data-v="impact" class="on">Impact</button><button data-v="follow">Follow</button><button data-v="top">Top</button><button data-v="orbit">Orbit</button></div>
  <div class="sep"></div>
  <button id="bSettings" class="btn" title="Settings">Settings</button>
  <div id="tele"><span>t <b id="tT">0.00</b> s</span><span><b id="tV">0.0</b> m/s</span><span id="tI"></span><span id="tS">Ready</span></div>
</div>
<aside id="panel" hidden>
  <header><span>Settings</span><button id="bClose" class="x" title="Close">×</button></header>
  <div id="fields"></div>
  <footer><button id="bDefaults" class="btn">Defaults</button><button id="bApply" class="btn primary">Apply</button></footer>
  <p class="hint">Apply and Replay rebuild the run from these values.<br>Space pause · R replay · 1–4 cameras · drag in Orbit</p>
</aside>

<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------- constants */
const DT = 1 / 120;
const MAX_STEPS = 6;
const START_FRONT_X = 5.6;
const RUNOFF = 30;
const DEFAULTS = Object.freeze({
  speed: 22, carMass: 1250, carLength: 4.2, carWidth: 1.8, carHeight: 1.45,
  cols: 12, rows: 8, depth: 2, brickMass: 2.5, brickW: 0.5, brickH: 0.24, brickD: 0.2,

const FIELDS = [
  ['Car', 'speed', 'Impact speed', 'm/s', 1, 45, 0.5],
  ['Car', 'carMass', 'Car mass', 'kg', 400, 4000, 10],
  ['Car', 'carLength', 'Length', 'm', 3, 6, 0.05],
  ['Car', 'carWidth', 'Width', 'm', 1.4, 2.4, 0.02],
  ['Car', 'carHeight', 'Height', 'm', 1.1, 2, 0.01],

const G_GROUND = 1, G_BRICK = 2, G_STRUCT = 4, G_PART = 8;

/* ---------------------------------------------------------------- utils */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function mulberry32(a) {

}
const fmt = v => String(+(+v).toFixed(4));
const V3 = (x, y, z) => ({ x, y, z });
const QI = { x: 0, y: 0, z: 0, w: 1 };
const QX90 = { x: Math.SQRT1_2, y: 0, z: 0, w: Math.SQRT1_2 };

function qRot(q, v) {
  const { x: qx, y: qy, z: qz, w: qw } = q;
  const ix = qw * v[0] + qy * v[2] - qz * v[1];
  const iy = qw * v[1] + qz * v[0] - qx * v[2];
  const iz = qw * v[2] + qx * v[1] - qy * v[0];
  const iw = -qx * v[0] - qy * v[1] - qz * v[2];
  return [ix * qw + iw * -qx + iy * -qz - iz * -qy, iy * qw + iw * -qy + iz * -qx - ix * -qz, iz * qw + iw * -qz + ix * -qy - iy * -qx];
}
const qInv = q => ({ x: -q.x, y: -q.y, z: -q.z, w: q.w });
function toWorld(body, local) {
  const t = body.translation(), r = qRot(body.rotation(), local);
  return [t.x + r[0], t.y + r[1], t.z + r[2]];
}
function toLocal(body, w) {
  const t = body.translation();
  return qRot(qInv(body.rotation()), [w[0] - t.x, w[1] - t.y, w[2] - t.z]);
}

/* ---------------------------------------------------------------- settings UI */
let settings = { ...DEFAULTS };
const state = { paused: false, speed: 1, view: 'impact' };
const inputs = {};
(function buildFields() {
  const host = document.getElementById('fields');
  let box = null, last = '';
  for (const [g, key, label, unit, min, max, step, int] of FIELDS) {
    if (g !== last) {
      box = document.createElement('div'); box.className = 'grp';
      box.innerHTML = `<div class="gh">${g}</div>`; host.appendChild(box); last = g;
    }
    const row = document.createElement('label'); row.className = 'row';
    row.innerHTML = `<span>${label}</span><input type="number" autocomplete="off" min="${min}" max="${max}" step="${step}"><em>${unit}</em>`;
    box.appendChild(row);
    const inp = row.querySelector('input');
    inp.value = fmt(DEFAULTS[key]);
    inputs[key] = { inp, min, max, int: !!int };
  }
})();
function readSettings() {
  const s = {};
  for (const k in inputs) {
    const { inp, min, max, int } = inputs[k];
    let v = parseFloat(inp.value);
    if (!isFinite(v)) v = settings[k];
    v = clamp(v, min, max);
    if (int) v = Math.round(v);
    s[k] = v; inp.value = fmt(v);
  }
  return s;
}
function writeSettings(s) { for (const k in inputs) inputs[k].inp.value = fmt(s[k]); }

/* ---------------------------------------------------------------- renderer / scene */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc6d3de, 150, 700);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.15, 2500);
camera.position.set(30, 8, 30);

const SUN_DIR = new THREE.Vector3(-0.5, 0.78, 0.52).normalize();
const sun = new THREE.DirectionalLight(0xfff0dc, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);

sun.shadow.camera.far = 170;

sun.shadow.normalBias = 0.022;
scene.add(sun, sun.target);

const SKY_GLSL = `
uniform vec3 sunDir;
vec3 skyCol(vec3 d, float disk){
  float h = d.y;
  vec3 zen = vec3(0.13,0.30,0.68), hor = vec3(0.72,0.80,0.88), gnd = vec3(0.20,0.22,0.19);
  vec3 c = h > 0.0 ? mix(hor, zen, pow(clamp(h,0.0,1.0), 0.5)) : mix(hor*0.85, gnd, pow(clamp(-h,0.0,1.0), 0.35));
  float s = max(dot(d, sunDir), 0.0);
  c += vec3(1.0,0.82,0.58) * (pow(s, 6.0) * 0.28 + pow(s, 90.0) * 0.9);
  c += vec3(1.0,0.9,0.75) * disk * smoothstep(0.99935, 0.99975, s);
  return c;
}`;
const SKY_VERT = `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;

function buildEnvMap() {
  const pm = new THREE.PMREMGenerator(renderer);

  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: { sunDir: { value: SUN_DIR } },
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: SKY_GLSL + `varying vec3 vD; void main(){ gl_FragColor = vec4(skyCol(normalize(vD), 40.0), 1.0); }`
  });
  es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), m));
  const box = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.6, 2.55, 2.45) });
  for (const [x, y, z, sx, sz] of [[0, 30, 0, 26, 8], [18, 12, -28, 14, 4], [-26, 10, 20, 10, 3]]) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), box);
    p.position.set(x, y, z); p.lookAt(0, 0, 0); es.add(p);
  }
  const tex = pm.fromScene(es, 0.02).texture;

}
scene.environment = buildEnvMap();
scene.environmentIntensity = 0.9;

  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sunDir: { value: SUN_DIR } },

/* ---------------------------------------------------------------- procedural textures */
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function noiseCanvas(size, seed, fn) {
  const rng = mulberry32(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const L = 16, low = new Float32Array(L * L);
  for (let i = 0; i < L * L; i++) low[i] = rng();
  const lowAt = (x, y) => {
    const fx = x / size * L, fy = y / size * L;
    const x0 = Math.floor(fx) % L, y0 = Math.floor(fy) % L, x1 = (x0 + 1) % L, y1 = (y0 + 1) % L;
    const tx = fx - Math.floor(fx), ty = fy - Math.floor(fy);
    const a = low[y0 * L + x0] * (1 - tx) + low[y0 * L + x1] * tx;
    const b = low[y1 * L + x0] * (1 - tx) + low[y1 * L + x1] * tx;
    return a * (1 - ty) + b * ty;
  };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = (y * size + x) * 4;
    const [r, gg, b] = fn(rng(), lowAt(x, y), x, y, rng);
    img.data[o] = r; img.data[o + 1] = gg; img.data[o + 2] = b; img.data[o + 3] = 255;

}

{
  const a = noiseCanvas(512, 11, (n, l) => { const v = 58 + (n - 0.5) * 34 + (l - 0.5) * 16 + (n > 0.985 ? 40 : 0); return [v, v, v * 1.03]; });

}

/* ---------------------------------------------------------------- geometry helpers */
class Bin {
  constructor() { this.map = new Map(); }
  add(mat, geo) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    if (geo.index) geo.dispose();

/* ---------------------------------------------------------------- static environment */
let envGroup = null, envKey = null, startLampMesh = null;

    for (let x = x0; x <= xEnd; x += 2) metal.add(MAT.armco, boxAt(0.08, 0.8, 0.1, x, 0.4, s * 9.08));
  }
  // tyre barrier at the end of the run-off

  for (let z = -14; z <= 14.01; z += 0.68) for (let d = 0; d < 2; d++) for (let h = 0; h < 4; h++) {
    const g = tg.clone().translate(xEnd + 0.36 + d * 0.66, 0.13 + h * 0.26, z);

  }
  tg.dispose();
  // light towers
  for (let x = -6; x < xEnd; x += 14) {
    poles.add(MAT.pole, new THREE.CylinderGeometry(0.1, 0.16, 9, 10).translate(x, 4.5, -11.5));
    poles.add(MAT.pole, boxAt(2.4, 0.9, 0.3, x, 9.1, -11.45));
    lamps.add(MAT.lamp, boxAt(2.1, 0.6, 0.04, x, 9.1, -11.28));
  }
  // start gantry
  for (const s of [-1, 1]) poles.add(MAT.pole, boxAt(0.3, 6, 0.3, sl, 3, s * 7.6));
  poles.add(MAT.pole, boxAt(0.5, 0.7, 15.5, sl, 6.1, 0));
  const lampBin = new Bin();
  for (let i = 0; i < 5; i++) lampBin.add(MAT.startLamp, new THREE.SphereGeometry(0.17, 14, 10).translate(sl - 0.28, 6.1, -1.6 + i * 0.8));
  // grandstand

  for (let r = 0; r < 9; r++) {
    conc.add(MAT.concrete, boxAt(gs1 - gs0, 0.5 * (r + 1), 0.9, (gs0 + gs1) / 2, 0.25 * (r + 1), -21 - r * 0.9));
    for (let x = gs0; x < gs1 - 0.2; x += 1.6) {
      const c = [0x2458a8, 0xd7d7d7, 0xb8262b, 0x2f7d4f][Math.floor(rng() * 4)];
      vc.add(MAT.vcol, paint(boxAt(1.5, 0.22, 0.45, x + 0.8, 0.5 * (r + 1) + 0.11, -20.8 - r * 0.9), c));
    }
  }
  conc.add(MAT.concrete, boxAt(gs1 - gs0 + 2, 0.25, 9.5, (gs0 + gs1) / 2, 8.6, -24.6));
  for (let x = gs0; x <= gs1; x += (gs1 - gs0) / 5) conc.add(MAT.concrete, boxAt(0.3, 8.6, 0.3, x, 4.3, -28.9));

  lines.build(G, false); vc.build(G, false); metal.build(G, false); conc.build(G, false); poles.build(G, false); lamps.build(G, false);
  const lg = new THREE.Group(); lampBin.build(lg, false); startLampMesh = lg.children[0]; G.add(lg);

  // trees + distant hills
  const treeN = 110, canopy = new THREE.InstancedMesh(new THREE.ConeGeometry(1.6, 5, 7), MAT.tree, treeN), trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18, 0.25, 1.6, 6), MAT.bark, treeN);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i = 0; i < treeN; i++) {

    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * 6);

}

/* ---------------------------------------------------------------- run state helpers */
let sim = null;

/* ---------------------------------------------------------------- physics world + ground */

/* ---------------------------------------------------------------- brick wall */
function buildWall(S) {
  const s = S.s, w = s.brickW, h = s.brickH, d = s.brickD, gap = 0.006, gd = 0.004;
  const pitch = w + gap, total = s.cols * pitch - gap, halfW = (w - gap) / 2;
  const items = [];
  for (let k = 0; k < s.depth; k++) for (let r = 0; r < s.rows; r++) {
    const x = S.lay.wallX + d / 2 + k * (d + gd), y = h / 2 + r * h;
    if (((r + k) & 1) === 0) {
      for (let i = 0; i < s.cols; i++) items.push([x, y, -total / 2 + w / 2 + i * pitch, 0]);
    } else {
      items.push([x, y, -total / 2 + halfW / 2, 1]);
      for (let j = 0; j < s.cols - 1; j++) items.push([x, y, -total / 2 + pitch / 2 + j * pitch + w / 2, 0]);
      items.push([x, y, total / 2 - halfW / 2, 1]);
    }
  }
  S.wallInfo = { total, height: s.rows * h, thick: s.depth * (d + gd) };
  const nHalf = items.reduce((a, it) => a + it[3], 0), nFull = items.length - nHalf;
  const inset = Math.min(0.009, h * 0.08, d * 0.08, halfW * 0.08);
  const rad = Math.min(0.012, h * 0.12, d * 0.12, halfW * 0.12);
  const imF = new THREE.InstancedMesh(new RoundedBoxGeometry(d - inset, h - inset, w - inset, 2, rad), MAT.brick, Math.max(1, nFull));
  const imH = new THREE.InstancedMesh(new RoundedBoxGeometry(d - inset, h - inset, halfW - inset, 2, rad), MAT.brick, Math.max(1, nHalf));
  imF.count = nFull; imH.count = nHalf;
  for (const im of [imF, imH]) { im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false; S.root.add(im); }
  const density = s.brickMass / (w * h * d);
  const thr = Math.max(250, s.brickMass * (s.gravity + 2) * s.rows * 2.5);
  const rng = mulberry32(4242), col = new THREE.Color(), m4 = new THREE.Matrix4();
  let iF = 0, iH = 0;
  for (const [x, y, z, half] of items) {
    const hz = half ? halfW / 2 : w / 2;
    const body = S.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setSleeping(true)
      .setCcdEnabled(true).setLinearDamping(0.04).setAngularDamping(0.1));
    const c = S.world.createCollider(RAPIER.ColliderDesc.cuboid(d / 2, h / 2, hz).setDensity(density)
      .setFriction(s.brickFriction).setRestitution(s.brickRestitution).setCollisionGroups(CG_BRICK)
      .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS).setContactForceEventThreshold(thr), body);
    const inst = half ? imH : imF, idx = half ? iH++ : iF++;
    const dark = rng() < 0.09 ? 0.07 : 0;
    inst.setColorAt(idx, col.setHSL(0.012 + rng() * 0.032, 0.48 + rng() * 0.2, 0.3 + rng() * 0.12 - dark, THREE.SRGBColorSpace));
    inst.setMatrixAt(idx, m4.makeTranslation(x, y, z));
    const rec = track(S, body, null, { kind: 'brick', inst, idx, foot: [d / 2, hz], hy: h / 2, op: 0.38 });
    S.cmap.set(c.handle, { brick: rec, body });
    S.bricks.push(rec);
  }
  if (imF.instanceColor) imF.instanceColor.needsUpdate = true;
  if (imH.instanceColor) imH.instanceColor.needsUpdate = true;
}

/* ---------------------------------------------------------------- car */
const WHEELS = ['wheelFR', 'wheelFL', 'wheelRR', 'wheelRL'];
function buildCar(S) {
  const s = S.s, world = S.world;
  const sL = s.carLength / 4.2, sH = s.carHeight / 1.45, sW = s.carWidth / 1.8;
  const r = 0.32 * Math.min(sH, sL), ww = 0.22 * sW, dy = 0.32 * sH - r;
  const X = v => v * sL, Y = v => v * sH - dy, Z = v => v * sW;
  const ox = START_FRONT_X - X(2.10);
  const k = Math.sqrt(s.carMass / 1250);
  const car = { parts: [], links: [], P: {}, r, ww };
  S.car = car;
  const P = car.P;
  const zz = (zs, a, b) => zs > 0 ? [a, b] : [-b, -a];
  const B = (x0, x1, y0, y1, z0, z1) => ({ c: [X((x0 + x1) / 2), Y((y0 + y1) / 2), Z((z0 + z1) / 2)], h: [(x1 - x0) * sL / 2, (y1 - y0) * sH / 2, (z1 - z0) * sW / 2] });
  const T = (xa, ya, xb, yb, t, hz, zc = 0) => {
    const ax = X(xa), ay = Y(ya), bx = X(xb), by = Y(yb);
    return { c: [(ax + bx) / 2, (ay + by) / 2, Z(zc)], h: [Math.hypot(bx - ax, by - ay) / 2, t / 2, Z(hz)], rz: Math.atan2(by - ay, bx - ax) };
  };
  const pt = (x, y, z) => [X(x), Y(y), Z(z)];

  class VB {
    constructor() { this.bin = new Bin(); }
    box(mat, x0, x1, y0, y1, z0, z1, rad = 0) {
      const sx = (x1 - x0) * sL, sy = (y1 - y0) * sH, sz = (z1 - z0) * sW, rr = Math.min(rad, Math.min(sx, sy, sz) * 0.45);
      const g = rr > 0.002 ? new RoundedBoxGeometry(sx, sy, sz, 2, rr) : new THREE.BoxGeometry(sx, sy, sz);
      this.bin.add(mat, g.translate(X((x0 + x1) / 2), Y((y0 + y1) / 2), Z((z0 + z1) / 2)));
      return this;
    }
    tilt(mat, xa, ya, xb, yb, t, z0, z1) {
      const ax = X(xa), ay = Y(ya), bx = X(xb), by = Y(yb);
      const g = new THREE.BoxGeometry(Math.hypot(bx - ax, by - ay), t, (z1 - z0) * sW);
      g.rotateZ(Math.atan2(by - ay, bx - ax)).translate((ax + bx) / 2, (ay + by) / 2, Z((z0 + z1) / 2));
      this.bin.add(mat, g); return this;
    }
    poly(mat, pts, z0, z1, bevel = 0.008) {
      const sh = new THREE.Shape();
      pts.forEach(([x, y], i) => i ? sh.lineTo(X(x), Y(y)) : sh.moveTo(X(x), Y(y)));
      const depth = (z1 - z0) * sW;
      const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(0.002, depth - 2 * bevel), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 8 });
      this.bin.add(mat, g.translate(0, 0, Z(z0) + bevel)); return this;
    }
    arch(mat, x0, x1, y0, y1, axle, z0, z1) {
      const ax = X(axle), ay = r, ar = r * 1.08 + 0.02 * sH;
      const X0 = Math.min(X(x0), ax - ar - 0.01), X1 = Math.max(X(x1), ax + ar + 0.01);
      const sh = new THREE.Shape();
      sh.moveTo(X0, Y(y0)); sh.lineTo(ax - ar, Y(y0)); sh.lineTo(ax - ar, ay);
      sh.absarc(ax, ay, ar, Math.PI, 0, true);
      sh.lineTo(ax + ar, Y(y0)); sh.lineTo(X1, Y(y0)); sh.lineTo(X1, Y(y1)); sh.lineTo(X0, Y(y1)); sh.lineTo(X0, Y(y0));
      const bevel = 0.01, depth = (z1 - z0) * sW;
      const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(0.002, depth - 2 * bevel), bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 20 });
      this.bin.add(mat, g.translate(0, 0, Z(z0) + bevel)); return this;
    }
    geo(mat, g) { this.bin.add(mat, g); return this; }
    build() { return this.bin.build(new THREE.Group(), true, true); }
  }

  function wheelVis(cx, cz, side) {
    const vb = new VB(), ri = r * 0.64, tw = ww / 2;
    const place = g => g.rotateX(Math.PI / 2).translate(cx, r, cz);
    const prof = [[ri * 1.02, -tw * 0.9], [r * 0.9, -tw], [r * 0.975, -tw * 0.84], [r, -tw * 0.42], [r, tw * 0.42], [r * 0.975, tw * 0.84], [r * 0.9, tw], [ri * 1.02, tw * 0.9]]
      .map(([a, b]) => new THREE.Vector2(a, b));
    vb.geo(MAT.tire, place(new THREE.LatheGeometry(prof, 32)));
    vb.geo(MAT.rim, place(new THREE.CylinderGeometry(ri, ri, ww * 0.82, 28, 1, true)));
    vb.geo(MAT.chrome, place(new THREE.TorusGeometry(ri, 0.012, 6, 28).rotateX(Math.PI / 2).translate(0, side * tw * 0.8, 0)));
    vb.geo(MAT.trim, place(new THREE.CylinderGeometry(ri * 0.97, ri * 0.97, 0.01, 24).translate(0, side * tw * 0.05, 0)));
    vb.geo(MAT.engine, place(new THREE.CylinderGeometry(ri * 0.72, ri * 0.72, 0.025, 24).translate(0, -side * tw * 0.12, 0)));
    for (let i = 0; i < 5; i++) vb.geo(MAT.rim, place(new THREE.BoxGeometry(0.05 * Math.max(0.8, sW), 0.03, ri * 0.92).translate(0, side * tw * 0.55, ri * 0.46).rotateY(i * Math.PI * 0.4)));
    vb.geo(MAT.chrome, place(new THREE.CylinderGeometry(ri * 0.2, ri * 0.22, 0.05, 16).translate(0, side * tw * 0.58, 0)));
    return vb.build();
  }

  function addPart(name, kind, frac, boxes, vis, o = {}) {
    const mass = s.carMass * frac;
    let vol = 0, cx = 0, cy = 0, cz = 0;
    for (const b of boxes) {
      const v = b.cyl ? Math.PI * b.rad * b.rad * 2 * b.h[2] : 8 * b.h[0] * b.h[1] * b.h[2];
      vol += v; cx += b.c[0] * v; cy += b.c[1] * v; cz += b.c[2] * v;
    }
    cx /= vol; cy /= vol; cz /= vol;
    const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(ox + cx, cy, cz)
      .setCcdEnabled(true).setLinearDamping(0.01).setAngularDamping(o.ad ?? 0.04));
    const cg = kind === 'struct' ? CG_STRUCT : CG_PART, dens = mass / vol, cols = [];
    for (const b of boxes) {
      const d = b.cyl ? RAPIER.ColliderDesc.cylinder(b.h[2], b.rad).setRotation(QX90) : RAPIER.ColliderDesc.cuboid(b.h[0], b.h[1], b.h[2]);
      if (b.rz) d.setRotation(quatZ(b.rz));
      d.setTranslation(b.c[0] - cx, b.c[1] - cy, b.c[2] - cz).setDensity(dens).setFriction(o.fr ?? 0.5).setRestitution(o.rest ?? 0.12)
        .setCollisionGroups(cg).setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS).setContactForceEventThreshold(o.thr ?? 600);
      cols.push(world.createCollider(d, body));
    }

    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, y0 = 1e9;
    for (const b of boxes) {
      x0 = Math.min(x0, b.c[0] - b.h[0]); x1 = Math.max(x1, b.c[0] + b.h[0]);
      z0 = Math.min(z0, b.c[2] - b.h[2]); z1 = Math.max(z1, b.c[2] + b.h[2]); y0 = Math.min(y0, b.c[1] - b.h[1]);
    }

      name, kind, body, obj, vis, mass, c: [cx, cy, cz], cols, links: [], alive: true, attached: true,
      pv: { x: 0, y: 0, z: 0 }, fc: 0, fcPrev: 0, fcAvg: 0, acc: 0, accPrev: 0, accAvg: 0, glass: o.glass || null, metal: o.metal ?? true
    };
    part.rec = track(S, body, obj, {
      kind: 'part', part, foot: o.foot || [(x1 - x0) / 2, (z1 - z0) / 2], hy: Math.max(0.02, cy - y0), op: o.blob ?? 0.45,
      boff: o.blobAt ? [o.blobAt[0] - cx, o.blobAt[1] - cy, o.blobAt[2] - cz] : null
    });

/* ---------------------------------------------------------------- glass shard shapes (shared, visual only) */
const SHARD_GEOS = (() => {
  const rng = mulberry32(99), out = [];
  for (let i = 0; i < 8; i++) {
    const sh = new THREE.Shape(), j = () => rng() * 0.35;
    const pts = i % 3 === 0
      ? [[-0.5, -0.5 + j()], [0.5, -0.5], [-0.2 + j(), 0.5]]
      : [[-0.5 + j(), -0.5], [0.5, -0.5 + j()], [0.5 - j(), 0.5], [-0.5, 0.5 - j()]];
    pts.forEach(([x, y], n) => n ? sh.lineTo(x, y) : sh.moveTo(x, y));
    const g = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: false });
    g.translate(0, 0, -0.5).rotateX(Math.PI / 2);
    g.userData.shared = true;
    out.push(g);
  }
  return out;
})();

/* ---------------------------------------------------------------- run lifecycle */
function disposeRun() {
  if (!sim) return;
  sim.world.free();
  sim.eq.free();
  sim.root.traverse(o => {
    if ((o.isMesh || o.isInstancedMesh) && !o.geometry.userData.shared) o.geometry.dispose();
    if (o.isInstancedMesh) o.dispose();
  });
  scene.remove(sim.root);
  sim = null;
}

function restart(s) {
  disposeRun();
  settings = { ...s };
  const lay = layout(settings);
  if (envKey !== lay.Lt) buildEnvironment(lay.Lt);
  const S = {
    s: settings, lay, t: 0, acc: 0, steps: 0, phase: 0, impactT: null, impactV: null, braked: false, shake: 0, calm: 0,
    root: new THREE.Group(), cmap: new Map(), tracked: [], bricks: [], fxq: [], shardSeed: 1, launchT: 0.35
  };
  sim = S;
  scene.add(S.root);
  buildWorld(S);
  buildWall(S);
  buildCar(S);
  const V = settings.speed, dist = Math.max(0.5, lay.wallX - START_FRONT_X - 1.5);
  let a = V * V / (2 * dist), v0 = 0;
  if (a > 12) { a = 12; v0 = Math.sqrt(Math.max(0, V * V - 2 * a * dist)); }
  S.accel = a;
  if (v0 > 0) {
    S.launchT = 0;
    for (const p of S.car.parts) {
      p.body.setLinvel(V3(v0, 0, 0), true);
      p.pv = { x: v0, y: 0, z: 0 };
      if (p.name.startsWith('wheel')) p.body.setAngvel(V3(0, 0, -v0 / S.car.r), true);
    }
  }
  S.brickDustF = settings.brickMass * Math.max(1, settings.gravity) * 25 + 400;
  makeBlobs(S);
  makeSkids(S);
  FX.dust.reset(); FX.spark.reset();
  camState.snap = true;
}

/* ---------------------------------------------------------------- simulation step */
function stepSim(S) {
  if (S.phase < 2) drive(S);
  if ((S.steps & 3) === 0) gravelCheck(S);
  S.world.step(S.eq);
  S.t += DT; S.steps++;
  S.eq.drainContactForceEvents(ev => onForce(S, ev));
  updateParts(S);
  updateLinks(S);
  postStep(S);
}

function drive(S) {
  if (S.t < S.launchT) return;
  if (S.phase === 0) S.phase = 1;
  const car = S.car, V = S.s.speed, v = car.P.cabin.body.linvel().x;
  const dv = v < V ? Math.min(S.accel * DT, V - v) : (V - v) * 0.5;
  if (dv !== 0) for (const p of car.parts) if (p.alive && p.attached) p.body.applyImpulse(V3(p.mass * dv, 0, 0), true);
  if (car.P.bumperF.body.translation().x + car.frontOff >= S.lay.wallX - 0.005) markImpact(S);
}

function markImpact(S) {
  if (S.phase >= 2) return;
  S.phase = 2; S.impactT = S.t;
  S.impactV = S.car.P.cabin.body.linvel().x;
  S.shake = 1;
  S.fxq.push({ k: 'impact', p: [S.lay.wallX, 0.7, 0] });
}

function gravelCheck(S) {
  const Lt = S.lay.Lt;
  for (const r of S.tracked) {
    if (!r.alive || r.gravel) continue;
    const t = r.body.translation();
    if (t.x > Lt && Math.abs(t.z) < 14 && t.y < 1.2) {
      r.gravel = true;
      r.body.setLinearDamping(1.6);
      const braking = r.part && r.part.attached && r.part.name.startsWith('wheel') && S.braked;
      r.body.setAngularDamping(braking ? 28 : 1.2);
    }
  }
}

function onForce(S, ev) {
  const A = S.cmap.get(ev.collider1()), B = S.cmap.get(ev.collider2());
  if (!A || !B) return;
  const f = ev.totalForceMagnitude();
  if (A.part) A.part.fc += f;
  if (B.part) B.part.fc += f;
  const carBrick = (A.part && B.brick) || (B.part && A.brick);
  if (carBrick && S.phase < 2) markImpact(S);
  if (S.fxq.length > 60 || (A.brick && B.brick)) return;
  if (carBrick) {
    if (f > 4000) {
      const p1 = A.body.translation(), p2 = B.body.translation();
      S.fxq.push({ k: 'hit', p: [(p1.x + p2.x) / 2, (p1.y + p2.y) / 2, (p1.z + p2.z) / 2], f });
    }
  } else if ((A.brick && B.ground) || (A.ground && B.brick)) {
    if (f > S.brickDustF) { const p = (A.brick ? A : B).body.translation(); S.fxq.push({ k: 'dust', p: [p.x, 0.06, p.z], f }); }
  } else if ((A.part && B.ground) || (A.ground && B.part)) {
    const e = A.part ? A : B;

    if (which) { r.p1.set(t.x, t.y, t.z); r.q1.set(q.x, q.y, q.z, q.w); }
    else { r.p0.set(t.x, t.y, t.z); r.q0.set(q.x, q.y, q.z, q.w); }
  }
}
function copyPrev(S) { for (const r of S.tracked) if (r.alive) { r.p0.copy(r.p1); r.q0.copy(r.q1); } }
function syncVisuals(S, alpha) {
  const B = S.blob;
  let bi = 0;
  for (const r of S.tracked) {
    if (!r.alive) continue;
    _v.lerpVectors(r.p0, r.p1, alpha);
    _q2.slerpQuaternions(r.q0, r.q1, alpha);
    if (r.inst) { r.inst.setMatrixAt(r.idx, _m4.compose(_v, _q2, ONE)); r.inst.instanceMatrix.needsUpdate = true; }
    else { r.obj.position.copy(_v); r.obj.quaternion.copy(_q2); }
    if (bi >= B.cap) continue;
    let bx = _v.x, by = _v.y, bz = _v.z;
    if (r.boff) { const o = qRot(_q2, r.boff); bx += o[0]; by += o[1]; bz += o[2]; }
    const op = r.op * clamp(1 - (by - r.hy) / 1.3, 0, 1);
    if (op < 0.01) continue;
    const xx = 1 - 2 * (_q2.y * _q2.y + _q2.z * _q2.z), xz = 2 * (_q2.x * _q2.z - _q2.w * _q2.y);
    _q3.setFromAxisAngle(UP, Math.atan2(-xz, xx));
    B.mesh.setMatrixAt(bi, _m4.compose(_v2.set(bx, 0.007, bz), _q3, _s2.set(r.foot[0] * 2.7 + 0.12, 1, r.foot[1] * 2.7 + 0.12)));
    B.op.array[bi] = op; bi++;
  }
  B.mesh.count = bi; B.mesh.instanceMatrix.needsUpdate = true; B.op.needsUpdate = true;
  const cp = S.car.P.clipA;
  cp.crushPivot.scale.x = clamp(1 - S.car.LB.crush / cp.crushLen, 0.3, 1);
}

/* ---------------------------------------------------------------- cameras */
const camState = { pos: new THREE.Vector3(), look: new THREE.Vector3(), snap: true, dragging: false, enterOrbit: false };
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enabled = false;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 2; controls.maxDistance = 150;
controls.addEventListener('start', () => { camState.dragging = true; });
controls.addEventListener('end', () => { camState.dragging = false; });
const _f = new THREE.Vector3(), _dp = new THREE.Vector3(), _dl = new THREE.Vector3(), _wc = new THREE.Vector3();
const D_IMPACT = new THREE.Vector3(-0.35, 0.34, 1).normalize();
function actionFocus(S, out) {
  const cab = S.car.P.cabin.rec.obj.position, wi = S.wallInfo;
  _wc.set(S.lay.wallX + wi.thick / 2, Math.min(1.1, wi.height * 0.45), 0);
  const w = S.phase < 2 ? 0.3 + 0.3 * clamp(1 - (_wc.x - cab.x) / 30, 0, 1) : 0.5;
  out.set(cab.x, 0.8, cab.z).lerp(_wc, w);
  out.y = 0.8;
  return Math.abs(_wc.x - cab.x);
}
function updateCamera(S, rdt) {
  const cab = S.car.P.cabin.rec.obj.position, span = actionFocus(S, _f);
  camera.up.set(0, 1, 0);
  if (state.view === 'orbit') {
    controls.enabled = true;
    if (camState.snap) { controls.target.copy(_f); camera.position.copy(_f).addScaledVector(D_IMPACT, 16); }
    else if (camState.enterOrbit) controls.target.copy(camState.look);
    camState.snap = camState.enterOrbit = false;
    if (!camState.dragging) {
      _dp.copy(_f).sub(controls.target).multiplyScalar(1 - Math.exp(-2 * rdt));
      controls.target.add(_dp); camera.position.add(_dp);
    }
    controls.update();
    camState.pos.copy(camera.position); camState.look.copy(controls.target);
    return;
  }
  controls.enabled = false;
  let rp = 4, rl = 6;
  if (state.view === 'impact') {
    const dist = clamp((S.phase < 2 ? span : span + 3) * 0.72 + 9, 10.5, 36);
    const ang = S.phase >= 2 ? Math.min(0.45, (S.t - S.impactT) * 0.04) : 0;
    _dp.copy(D_IMPACT).applyAxisAngle(UP, ang).multiplyScalar(dist).add(_f);
    _dl.copy(_f); rp = 3; rl = 5;
  } else if (state.view === 'follow') {
    _dp.set(cab.x - 7.2, 2.7, cab.z + 2.6); _dl.set(cab.x + 4.5, 0.6, cab.z * 0.5); rp = 5; rl = 9;
  } else {
    const fx = (cab.x + _wc.x) / 2, h = clamp(span * 0.8 + 16, 18, 46);
    _dp.set(fx, h, 0.001); _dl.set(fx, 0, 0); camera.up.set(0, 0, -1);
  }
  _dp.y = Math.max(0.6, _dp.y);
  if (camState.snap) { camState.pos.copy(_dp); camState.look.copy(_dl); camState.snap = false; }
  else { camState.pos.lerp(_dp, 1 - Math.exp(-rp * rdt)); camState.look.lerp(_dl, 1 - Math.exp(-rl * rdt)); }
  camera.position.copy(camState.pos);
  camera.lookAt(camState.look);
  if (S.shake > 0.01 && state.view !== 'top') {
    const a = S.shake * S.shake * 0.13, t = S.t;
    camera.position.x += a * Math.sin(t * 57.3); camera.position.y += a * Math.sin(t * 71.1 + 1.3); camera.position.z += a * Math.sin(t * 63.7 + 2.1);
  }
}
function updateShadow(S) {
  const cab = S.car.P.cabin.rec.obj.position;
  const ext = Math.ceil(clamp(Math.abs(cab.x - _wc.x) / 2 + 9, 11, 32)), texel = 2 * ext / 2048;
  const fx = Math.round((cab.x + _wc.x) / 2 / texel) * texel, fz = Math.round(cab.z * 0.5 / texel) * texel;
  sun.target.position.set(fx, 0, fz);
  sun.position.set(fx + SUN_DIR.x * 80, SUN_DIR.y * 80, fz + SUN_DIR.z * 80);
  const c = sun.shadow.camera;
  if (c.right !== ext) { c.left = -ext; c.right = ext; c.top = ext; c.bottom = -ext; c.updateProjectionMatrix(); }
}

/* ---------------------------------------------------------------- HUD + controls */
const el = id => document.getElementById(id);
const tT = el('tT'), tV = el('tV'), tI = el('tI'), tS = el('tS'), bPlay = el('bPlay'), panel = el('panel'), bSettings = el('bSettings');
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
function updateHud(S) {
  tT.textContent = S.t.toFixed(2);
  const v = S.car.P.cabin.body.linvel();
  tV.textContent = Math.hypot(v.x, v.y, v.z).toFixed(1);
  tI.innerHTML = S.impactV != null ? `impact <b>${S.impactV.toFixed(1)}</b> m/s` : '';
  tS.textContent = state.paused ? 'Paused' : ['Ready', 'Accelerating', 'Crash', 'Settled'][S.phase];
}
function refreshPlay() { bPlay.innerHTML = state.paused ? ICON_PLAY : ICON_PAUSE; bPlay.title = (state.paused ? 'Play' : 'Pause') + ' (Space)'; }
function togglePause() { state.paused = !state.paused; refreshPlay(); if (sim) updateHud(sim); }
function setView(v) {
  state.view = v;
  for (const b of el('segView').children) b.classList.toggle('on', b.dataset.v === v);
  if (v === 'orbit') camState.enterOrbit = true; else camState.snap = true;
}
function setSpeed(x) { state.speed = x; for (const b of el('segSpeed').children) b.classList.toggle('on', +b.dataset.s === x); }
function replay(s) { state.paused = false; refreshPlay(); restart(s); }
el('bReplay').addEventListener('click', () => replay(readSettings()));
bPlay.addEventListener('click', togglePause);
for (const b of el('segSpeed').children) b.addEventListener('click', () => setSpeed(+b.dataset.s));
for (const b of el('segView').children) b.addEventListener('click', () => setView(b.dataset.v));
bSettings.addEventListener('click', () => { panel.hidden = !panel.hidden; bSettings.classList.toggle('on', !panel.hidden); });
el('bClose').addEventListener('click', () => { panel.hidden = true; bSettings.classList.remove('on'); });
el('bApply').addEventListener('click', () => replay(readSettings()));
el('bDefaults').addEventListener('click', () => { writeSettings(DEFAULTS); replay({ ...DEFAULTS }); });
for (const k in inputs) inputs[k].inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); replay(readSettings()); } });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
addEventListener('keydown', e => {
  const a = document.activeElement, inNum = a && a.tagName === 'INPUT';
  if (e.code === 'Space') { if (inNum) return; e.preventDefault(); togglePause(); return; }
  if (inNum || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'r' || e.key === 'R') replay(readSettings());
  else if (e.key >= '1' && e.key <= '4') setView(['impact', 'follow', 'top', 'orbit'][+e.key - 1]);
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

/* ---------------------------------------------------------------- main loop */
let lastT = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = clamp((now - lastT) / 1000, 0, 0.1);
  lastT = now;
  const S = sim;
  if (!S) return;
  let simDt = 0;
  if (!state.paused && S.phase < 3) {
    S.acc += rdt * state.speed;
    let n = Math.floor(S.acc / DT);
    if (n > MAX_STEPS) { S.acc = MAX_STEPS * DT + (S.acc % DT); n = MAX_STEPS; }
    for (let i = 0; i < n; i++) {
      if (i === n - 1) { if (n === 1) copyPrev(S); else snap(S, 0); }
      stepSim(S); S.acc -= DT; simDt += DT;
      if (S.phase >= 3) { S.acc = 0; break; }
    }
    if (n > 0) snap(S, 1);
    if (S.phase >= 3) copyPrev(S);
  }
  syncVisuals(S, clamp(S.acc / DT, 0, 1));
  processFX(S);
  updateSkids(S, simDt);
  FX.dust.update(simDt); FX.spark.update(simDt);
  updateCamera(S, rdt);
  updateShadow(S);
  sky.position.copy(camera.position);
  MAT.startLamp.emissiveIntensity = S.t < S.launchT ? 3 : 0.03;
  const u = renderer.getDrawingBufferSize(_db).y * 0.5 * camera.projectionMatrix.elements[5];
  FX.dust.mat.uniforms.uScale.value = u; FX.spark.mat.uniforms.uScale.value = u;
  renderer.render(scene, camera);
  hudT -= rdt;
  if (hudT <= 0) { hudT = 0.1; updateHud(S); }
}

await RAPIER.init();
el('loading').classList.add('gone');
refreshPlay();
writeSettings(DEFAULTS);
restart({ ...DEFAULTS });
requestAnimationFrame(t => { lastT = t; frame(t); });

</script>
