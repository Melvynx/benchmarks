<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok 4.7</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #bar, #panel { font: 12px/1.25 ui-sans-serif, "Segoe UI", sans-serif; color: #e8e4dc; }
  #bar {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 3;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px 8px; border-radius: 10px;
    background: rgba(10, 12, 14, 0.86);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    user-select: none;
  }
  #brand { font-weight: 650; letter-spacing: 0.01em; padding: 0 6px 0 2px; color: #f3efe6; }
  button, .sep { border: 0; }
  button {
    background: #1c2126; color: #e8e4dc; border-radius: 7px;
    padding: 5px 8px; cursor: pointer; font: inherit;
  }
  button:hover { background: #2a3138; }
  button.on { background: #d5892a; color: #1a1206; font-weight: 650; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.12); margin: 0 2px; }
  #panel {
    position: fixed; right: 10px; bottom: 58px; z-index: 3;
    width: min(460px, calc(100vw - 20px));
    max-height: min(62vh, 520px); overflow: auto;
    padding: 10px; border-radius: 10px;
    background: rgba(10, 12, 14, 0.92);
    border: 1px solid rgba(255,255,255,0.08);
    display: none;
  }
  #panel.open { display: block; }
  #panel h2 { margin: 0 0 8px; font-size: 12px; font-weight: 650; color: #f3efe6; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  label { display: flex; flex-direction: column; gap: 3px; color: #b7b2a8; font-size: 10px; letter-spacing: 0.02em; }
  input[type="number"] {
    width: 100%; background: #14181c; color: #f3efe6; border: 1px solid #2c333a;
    border-radius: 6px; padding: 4px 6px; font: 12px/1.3 ui-sans-serif, "Segoe UI", sans-serif;
  }
  input:focus { outline: 1px solid #d5892a; border-color: #d5892a; }
  #apply { margin-top: 8px; width: 100%; padding: 7px; background: #d5892a; color: #1a1206; font-weight: 700; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="bar">
  <span id="brand">Grok 4.7</span>
  <button id="pauseBtn" type="button">Pause</button>
  <span class="sep"></span>
  <button type="button" data-speed="0.25">0.25×</button>
  <button type="button" data-speed="0.5">0.5×</button>
  <button type="button" data-speed="1" class="on">1×</button>
  <button type="button" data-speed="2">2×</button>
  <span class="sep"></span>
  <button id="replay" type="button">Replay</button>
  <span class="sep"></span>
  <button type="button" data-view="impact" class="on">Impact</button>
  <button type="button" data-view="follow">Follow</button>
  <button type="button" data-view="top">Top</button>
  <button type="button" data-view="orbit" title="Drag to orbit">Orbit</button>
  <span class="sep"></span>
  <button id="settingsBtn" type="button">Settings</button>
</div>
<div id="panel">
  <div class="grid">
    <label>Impact speed (m/s)<input id="impactSpeed" type="number" min="3" max="70" step="0.5" value="22"></label>
    <label>Car mass (kg)<input id="carMass" type="number" min="200" max="8000" step="10" value="1250"></label>
    <label>Car length (m)<input id="carLength" type="number" min="2.4" max="8" step="0.05" value="4.2"></label>
    <label>Car width (m)<input id="carWidth" type="number" min="1.2" max="3.2" step="0.05" value="1.8"></label>
    <label>Car height (m)<input id="carHeight" type="number" min="0.9" max="2.6" step="0.05" value="1.45"></label>
    <label>Wall columns<input id="wallCols" type="number" min="2" max="24" step="1" value="12"></label>
    <label>Wall rows<input id="wallRows" type="number" min="1" max="14" step="1" value="8"></label>
    <label>Wall depth<input id="wallDepth" type="number" min="1" max="4" step="1" value="2"></label>
    <label>Brick mass (kg)<input id="brickMass" type="number" min="0.2" max="40" step="0.1" value="2.5"></label>
    <label>Brick width (m)<input id="brickWidth" type="number" min="0.08" max="1.2" step="0.01" value="0.5"></label>
    <label>Brick height (m)<input id="brickHeight" type="number" min="0.06" max="0.8" step="0.01" value="0.24"></label>
    <label>Brick depth (m)<input id="brickDepth" type="number" min="0.06" max="0.8" step="0.01" value="0.2"></label>
    <label>Gravity (m/s²)<input id="gravity" type="number" min="0.5" max="30" step="0.01" value="9.81"></label>
    <label>Brick friction<input id="brickFriction" type="number" min="0" max="1.6" step="0.01" value="0.72"></label>
    <label>Brick restitution<input id="brickRestitution" type="number" min="0" max="0.95" step="0.01" value="0.18"></label>
    <label>Ground friction<input id="groundFriction" type="number" min="0" max="1.6" step="0.01" value="0.85"></label>
    <label>Track length (m)<input id="trackLength" type="number" min="16" max="80" step="0.5" value="40"></label>
  </div>
  <button id="apply" type="button">Apply</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

const DEFAULTS = {
  impactSpeed: 22,
  carMass: 1250,
  carLength: 4.2,
  carWidth: 1.8,
  carHeight: 1.45,
  wallCols: 12,
  wallRows: 8,
  wallDepth: 2,
  brickMass: 2.5,
  brickWidth: 0.5,
  brickHeight: 0.24,
  brickDepth: 0.2,
  gravity: 9.81,
  brickFriction: 0.72,
  brickRestitution: 0.18,
  groundFriction: 0.85,
  trackLength: 40
};

const FIXED = 1 / 120;
const MAX_STEPS = 5;
const MORTAR = 0.012;
const IDQ = { x: 0, y: 0, z: 0, w: 1 };
const G_GROUND = 0x0001;
const G_BRICK = 0x0002;
const G_CAR = 0x0004;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function groups(m, f) { return ((m & 0xffff) << 16) | (f & 0xffff); }
function hash01(n) {
  let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function boxInertia(mass, sx, sy, sz) {
  return {
    x: mass * (sy * sy + sz * sz) / 12,
    y: mass * (sx * sx + sz * sz) / 12,
    z: mass * (sx * sx + sy * sy) / 12
  };
}

const viewEl = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc5d0da, 78, 190);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.12, 420);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 2.5;
controls.maxDistance = 90;
controls.enabled = false;

const hemi = new THREE.HemisphereLight(0xc9d8ea, 0x3a342c, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 4.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00022;
sun.shadow.normalBias = 0.04;
scene.add(sun);
scene.add(sun.target);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;
pmrem.dispose();

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(320, 28, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x6ea0d2) },
      hor: { value: new THREE.Color(0xd5e2ee) },
      bot: { value: new THREE.Color(0x8d9074) }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; uniform vec3 top; uniform vec3 hor; uniform vec3 bot; void main(){ float h=normalize(vP).y; vec3 c=mix(hor,top,smoothstep(0.0,0.5,h)); c=mix(bot,c,smoothstep(-0.2,0.05,h)); gl_FragColor=vec4(c,1.0); }'
  })
);
scene.add(sky);

const paintMat = new THREE.MeshPhysicalMaterial({
  color: 0xb11f28, metalness: 0.62, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.25
});
const trimMat = new THREE.MeshStandardMaterial({ color: 0x1a1c20, metalness: 0.45, roughness: 0.55 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x171717, metalness: 0.05, roughness: 0.72 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0xc5c8ce, metalness: 0.92, roughness: 0.28 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xc5d5e2, metalness: 0, roughness: 0.04, transmission: 0.86, thickness: 0.06,
  ior: 1.5, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.4, side: THREE.DoubleSide
});
const lampMat = new THREE.MeshStandardMaterial({ color: 0xfff1d2, emissive: 0xffe2a8, emissiveIntensity: 2.2, roughness: 0.25, metalness: 0.1 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x6a1014, emissive: 0xff2a2a, emissiveIntensity: 0.55, roughness: 0.35, metalness: 0.2 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x121418, roughness: 0.7, metalness: 0.2 });
const curbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0 });
const railMat = new THREE.MeshStandardMaterial({ color: 0xb7bcc2, metalness: 0.75, roughness: 0.35 });
const poleMat = new THREE.MeshStandardMaterial({ color: 0x8d9298, metalness: 0.6, roughness: 0.4 });

function makeNormal(seed) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const img = g.createImageData(128, 128);
  for (let y = 0; y < 128; y++) {
    for (let x = 0; x < 128; x++) {
      const h = hash01(seed + x * 13 + y * 131);
      const i = (y * 128 + x) * 4;
      img.data[i] = 118 + h * 24;
      img.data[i + 1] = 118 + hash01(seed + 9 + x * 17 + y) * 24;
      img.data[i + 2] = 255;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  return t;
}
const brickNormal = makeNormal(11);
brickNormal.repeat.set(1, 1);
const brickMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.93, metalness: 0.02, normalMap: brickNormal, normalScale: new THREE.Vector2(0.35, 0.35)
});

const skidGeo = new THREE.PlaneGeometry(2.6, 0.22);
skidGeo.rotateX(-Math.PI / 2);
const skidMat = new THREE.MeshBasicMaterial({ color: 0x0c0c0e, transparent: true, opacity: 0.45, depthWrite: false });

const blobGeo = new THREE.CircleGeometry(1, 14);
blobGeo.rotateX(-Math.PI / 2);
const blobMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {},
  vertexShader: `
    attribute float aOpacity;
    varying float vOp;
    varying vec2 vUv;
    void main() {
      vOp = aOpacity;
      vUv = uv;
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vOp;
    varying vec2 vUv;
    void main() {
      float d = length(vUv - vec2(0.5)) * 2.0;
      float a = smoothstep(1.0, 0.25, d) * vOp;
      if (a < 0.02) discard;
      gl_FragColor = vec4(0.0, 0.0, 0.0, a * 0.5);
    }
  `
});

let sim = null;
let paused = false;
let simSpeed = 1;
let viewMode = 'impact';
const scratch = new THREE.Object3D();
const camTarget = new THREE.Vector3();

function readSettings() {
  const n = (id, fallback, min, max, round) => {
    const v = Number(document.getElementById(id).value);
    let x = Number.isFinite(v) ? v : fallback;
    x = clamp(x, min, max);
    return round ? Math.round(x) : x;
  };
  return {
    impactSpeed: n('impactSpeed', DEFAULTS.impactSpeed, 3, 70, false),
    carMass: n('carMass', DEFAULTS.carMass, 200, 8000, false),
    carLength: n('carLength', DEFAULTS.carLength, 2.4, 8, false),
    carWidth: n('carWidth', DEFAULTS.carWidth, 1.2, 3.2, false),
    carHeight: n('carHeight', DEFAULTS.carHeight, 0.9, 2.6, false),
    wallCols: n('wallCols', DEFAULTS.wallCols, 2, 24, true),
    wallRows: n('wallRows', DEFAULTS.wallRows, 1, 14, true),
    wallDepth: n('wallDepth', DEFAULTS.wallDepth, 1, 4, true),
    brickMass: n('brickMass', DEFAULTS.brickMass, 0.2, 40, false),
    brickWidth: n('brickWidth', DEFAULTS.brickWidth, 0.08, 1.2, false),
    brickHeight: n('brickHeight', DEFAULTS.brickHeight, 0.06, 0.8, false),
    brickDepth: n('brickDepth', DEFAULTS.brickDepth, 0.06, 0.8, false),
    gravity: n('gravity', DEFAULTS.gravity, 0.5, 30, false),
    brickFriction: n('brickFriction', DEFAULTS.brickFriction, 0, 1.6, false),
    brickRestitution: n('brickRestitution', DEFAULTS.brickRestitution, 0, 0.95, false),
    groundFriction: n('groundFriction', DEFAULTS.groundFriction, 0, 1.6, false),
    trackLength: n('trackLength', DEFAULTS.trackLength, 16, 80, false)
  };
}
function writeSettings(s) {
  for (const k of Object.keys(DEFAULTS)) {
    const el = document.getElementById(k === 'impactSpeed' ? 'impactSpeed' : k);
  }
  const map = {
    impactSpeed: 'impactSpeed', carMass: 'carMass', carLength: 'carLength', carWidth: 'carWidth',
    carHeight: 'carHeight', wallCols: 'wallCols', wallRows: 'wallRows', wallDepth: 'wallDepth',
    brickMass: 'brickMass', brickWidth: 'brickWidth', brickHeight: 'brickHeight', brickDepth: 'brickDepth',
    gravity: 'gravity', brickFriction: 'brickFriction', brickRestitution: 'brickRestitution',
    groundFriction: 'groundFriction', trackLength: 'trackLength'
  };
  for (const k of Object.keys(map)) document.getElementById(map[k]).value = String(s[k]);
}

function paintTrack(length, groundW, asphaltW) {
  const c = document.createElement('canvas');
  c.width = 2048;
  c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#4d6a3a';
  g.fillRect(0, 0, 2048, 1024);
  for (let i = 0; i < 4000; i++) {
    const x = (hash01(i * 3 + 1) * 2048) | 0;
    const y = (hash01(i * 5 + 7) * 1024) | 0;
    const a = 30 + hash01(i + 19) * 40;
    g.fillStyle = `rgba(30,40,24,${a / 255})`;
    g.fillRect(x, y, 2, 2);
  }
  const zy0 = (0.5 - asphaltW / groundW / 2) * 1024;
  const zh = (asphaltW / groundW) * 1024;
  g.fillStyle = '#2a2c30';
  g.fillRect(0, zy0, 2048, zh);
  for (let i = 0; i < 6000; i++) {
    const x = (hash01(20000 + i * 3) * 2048) | 0;
    const y = zy0 + hash01(30000 + i * 7) * zh;
    const shade = 36 + hash01(i + 4) * 18;
    g.fillStyle = `rgba(${shade},${shade},${shade + 2},0.35)`;
    g.fillRect(x, y, 2, 1);
  }
  const curb = Math.max(4, (0.16 / groundW) * 1024);
  g.fillStyle = '#d8d8d8';
  g.fillRect(0, zy0 - curb, 2048, curb);
  g.fillRect(0, zy0 + zh, 2048, curb);
  g.fillStyle = '#c0392b';
  const dash = 36;
  for (let x = 0; x < 2048; x += dash * 2) {
    g.fillRect(x, zy0 - curb, dash, curb);
    g.fillRect(x + dash, zy0 + zh, dash, curb);
  }
  g.strokeStyle = 'rgba(240,240,240,0.85)';
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(0, zy0 + 10); g.lineTo(2048, zy0 + 10);
  g.moveTo(0, zy0 + zh - 10); g.lineTo(2048, zy0 + zh - 10);
  g.stroke();
  g.setLineDash([28, 22]);
  g.beginPath();
  g.moveTo(0, 512); g.lineTo(2048, 512);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function disposeSim() {
  if (!sim) return;
  scene.remove(sim.group);
  sim.group.traverse((o) => {
    if (o.geometry && !o.userData.keepGeo) o.geometry.dispose();
    if (o.material && o.userData.disposeMat) {
      const mats = [].concat(o.material);
      mats.forEach((m) => {
        if (m.map && m.userData && m.userData.disposeMap) m.map.dispose();
        m.dispose();
      });
    }
  });
  if (sim.asphaltMap) sim.asphaltMap.dispose();
  sim.world.free();
  sim.eventQueue.free();
  sim = null;
}

function build(settings) {
  disposeSim();
  const s = settings;
  const L = s.carLength, W = s.carWidth, H = s.carHeight;
  const wheelR = clamp(H * (0.34 / 1.45), 0.16, H * 0.42);
  const wheelW = clamp(W * 0.145, 0.16, 0.3);
  const wheelZ = W * 0.5 - wheelW * 0.5 - 0.015;
  const wheelInner = wheelZ - wheelW * 0.5;
  const narrowW = Math.max(0.55, wheelInner * 2 - 0.08);
  const cabinW = Math.min(W * 0.95, W - 0.06);
  const frontAxle = L * 0.29;
  const rearAxle = -L * 0.29;
  const cabinX0 = rearAxle + wheelR + 0.05;
  const cabinX1 = frontAxle - wheelR - 0.05;
  const cabinLen = Math.max(0.7, cabinX1 - cabinX0);
  const cabinCx = (cabinX0 + cabinX1) * 0.5;

  const bw = s.brickWidth, bh = s.brickHeight, bd = s.brickDepth;
  const cols = s.wallCols, rows = s.wallRows, depth = s.wallDepth;
  const pitchZ = bw + MORTAR, pitchY = bh + MORTAR, pitchX = bd + MORTAR;
  const spanZ = cols * bw + (cols - 1) * MORTAR;
  const spanX = depth * bd + (depth - 1) * MORTAR;
  const bond = pitchZ * 0.5;
  const wallSpanZ = spanZ + bond;
  const endPad = clamp(s.trackLength * 0.14, 3.2, 7);
  let wallFront = s.trackLength - endPad - spanX;
  const startCenter = Math.max(L * 0.5 + 0.9, 1.6);
  if (wallFront < startCenter + L * 0.5 + 1.2) {
    wallFront = Math.min(s.trackLength - spanX - 0.5, startCenter + L * 0.5 + Math.max(1.2, s.trackLength * 0.35));
  }
  const noseTravel = Math.max(0.4, wallFront - (startCenter + L * 0.5));
  const accel = (s.impactSpeed * s.impactSpeed) / (2 * noseTravel);

  const groundW = Math.max(22, wallSpanZ + 16);
  const asphaltW = clamp(wallSpanZ + 1.15, 7.2, groundW - 3);

  const world = new RAPIER.World({ x: 0, y: -s.gravity, z: 0 });
  const ip = world.integrationParameters;
  ip.dt = FIXED;
  ip.numSolverIterations = 12;
  ip.numAdditionalFrictionIterations = 4;
  ip.maxCcdSubsteps = 3;
  world.timestep = FIXED;

  const eventQueue = new RAPIER.EventQueue(true);
  const group = new THREE.Group();
  scene.add(group);
  const meta = new Map();
  const parts = [];
  const joints = [];
  const brickBodies = [];

  const state = {
    world, eventQueue, group, meta, parts, joints, brickBodies,
    settings: s, wheelR, wheelW, startCenter, wallFront, accel,
    driveV: 0, driving: true, armed: false, impacted: false, selfOn: true,
    shock: 0, prevVx: 0, time: 0, shake: 0, acc: 0,
    sparks: [], dust: [], rng: mulberry32(0xC0FFEE), impactSteps: 0, skidLaid: false,
    asphaltMap: null, blobs: null, blobOp: null, blobCount: 0,
    sparkPts: null, dustPts: null, sparkPos: null, dustPos: null,
    bumperF: null, cabin: null, wheels: []
  };

  function addFixed(desc) {
    const body = world.createRigidBody(desc);
    return body;
  }

  const groundBody = addFixed(RAPIER.RigidBodyDesc.fixed());
  world.createCollider(
    RAPIER.ColliderDesc.cuboid(Math.max(80, s.trackLength), 0.6, Math.max(40, groundW))
      .setTranslation(s.trackLength * 0.5, -0.6, 0)
      .setFriction(s.groundFriction)
      .setRestitution(0.04)
      .setCollisionGroups(groups(G_GROUND, 0xffff)),
    groundBody
  );
  meta.set(groundBody.handle, { type: 'ground' });

  const curbT = 0.12, curbH = 0.1;
  for (const side of [-1, 1]) {
    const z = side * (asphaltW * 0.5 + curbT * 0.5);
    const cb = addFixed(RAPIER.RigidBodyDesc.fixed().setTranslation(s.trackLength * 0.5, curbH * 0.5, z));
    world.createCollider(
      RAPIER.ColliderDesc.cuboid(s.trackLength * 0.5, curbH * 0.5, curbT * 0.5)
        .setFriction(s.groundFriction)
        .setRestitution(0.05)
        .setCollisionGroups(groups(G_GROUND, 0xffff)),
      cb
    );
    meta.set(cb.handle, { type: 'ground' });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(s.trackLength, curbH, curbT), curbMat);
    mesh.position.set(s.trackLength * 0.5, curbH * 0.5, z);
    mesh.receiveShadow = true;
    mesh.castShadow = false;
    group.add(mesh);
  }

  const trackMap = paintTrack(s.trackLength, groundW, asphaltW);
  state.asphaltMap = trackMap;
  const groundMat = new THREE.MeshStandardMaterial({ map: trackMap, roughness: 0.94, metalness: 0.02 });
  groundMat.userData = { disposeMap: true };
  const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(s.trackLength, groundW), groundMat);
  groundMesh.geometry.rotateX(-Math.PI / 2);
  groundMesh.position.set(s.trackLength * 0.5, 0.004, 0);
  groundMesh.receiveShadow = true;
  groundMesh.userData.disposeMat = true;
  group.add(groundMesh);

  const railZ = asphaltW * 0.5 + 0.85;
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(s.trackLength, 0.16, 0.08), railMat);
    rail.position.set(s.trackLength * 0.5, 0.48, side * railZ);
    rail.castShadow = false;
    rail.receiveShadow = true;
    group.add(rail);
    const posts = Math.max(4, Math.round(s.trackLength / 6));
    for (let i = 0; i < posts; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.08), railMat);
      p.position.set((i + 0.5) * (s.trackLength / posts), 0.25, side * railZ);
      p.receiveShadow = true;
      group.add(p);
    }
  }
  const poles = Math.max(3, Math.round(s.trackLength / 12));
  for (let i = 0; i < poles; i++) {
    const x = (i + 0.5) * (s.trackLength / poles);
    for (const side of [-1, 1]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 3.1, 8), poleMat);
      pole.position.set(x, 1.55, side * (railZ + 0.55));
      group.add(pole);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.18), lampMat);
      head.position.set(x, 3.15, side * (railZ + 0.55));
      group.add(head);
    }
  }
  const gantry = new THREE.Group();
  const postG = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.1, 0.12), poleMat);
  const p1 = postG.clone(); p1.position.set(0.7, 1.55, -asphaltW * 0.42);
  const p2 = postG.clone(); p2.position.set(0.7, 1.55, asphaltW * 0.42);
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, asphaltW * 0.9), poleMat);
  beam.position.set(0.7, 3.05, 0);
  gantry.add(p1, p2, beam);
  for (const z of [-0.6, 0, 0.6]) {
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.18), lampMat);
    lamp.position.set(0.7, 2.9, z);
    gantry.add(lamp);
  }
  group.add(gantry);

  const brickCount = cols * rows * depth;
  const brickGeo = new THREE.BoxGeometry(bw * 0.98, bh * 0.96, bd * 0.98);
  const brickMesh = new THREE.InstancedMesh(brickGeo, brickMat, brickCount);
  brickMesh.castShadow = true;
  brickMesh.receiveShadow = true;
  brickMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  group.add(brickMesh);
  const color = new THREE.Color();
  let bi = 0;
  const brickVol = bw * bh * bd;
  for (let d = 0; d < depth; d++) {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const z = -spanZ / 2 - bond / 2 + bw / 2 + c * pitchZ + (r % 2) * bond;
        const y = bh / 2 + 0.004 + r * pitchY;
        const x = wallFront + bd / 2 + d * pitchX;
        const body = world.createRigidBody(
          RAPIER.RigidBodyDesc.dynamic()
            .setTranslation(x, y, z)
            .setCanSleep(true)
            .setSleeping(true)
            .setLinearDamping(0.08)
            .setAngularDamping(0.12)
        );
        world.createCollider(
          RAPIER.ColliderDesc.cuboid(bw * 0.5, bh * 0.5, bd * 0.5)
            .setFriction(s.brickFriction)
            .setRestitution(s.brickRestitution)
            .setDensity(s.brickMass / brickVol)
            .setCollisionGroups(groups(G_BRICK, G_GROUND | G_BRICK | G_CAR)),
          body
        );
        body.sleep();
        meta.set(body.handle, { type: 'brick' });
        brickBodies.push(body);
        color.setHex([0x8d4034, 0x7a382e, 0x954636, 0x6e332b, 0xa14d3a, 0x81392f][bi % 6]);
        color.offsetHSL((hash01(bi + 3) - 0.5) * 0.03, 0, (hash01(bi + 11) - 0.5) * 0.08);
        brickMesh.setColorAt(bi, color);
        scratch.position.set(x, y, z);
        scratch.quaternion.identity();
        scratch.scale.set(1, 1, 1);
        scratch.updateMatrix();
        brickMesh.setMatrixAt(bi, scratch.matrix);
        bi++;
      }
    }
  }
  brickMesh.instanceColor.needsUpdate = true;
  brickMesh.instanceMatrix.needsUpdate = true;
  state.brickMesh = brickMesh;

  const weights = [];
  function massFor(key, w) { weights.push([key, w]); }
  massFor('cabin', 45);
  massFor('rearBody', 4);
  massFor('clipI', 8);
  massFor('clipO', 6.5);
  massFor('nose', 4.5);
  massFor('bumperF', 2);
  massFor('bumperR', 1.7);
  massFor('hoodF', 1.3);
  massFor('hoodR', 1.5);
  massFor('trunkLid', 1.4);
  massFor('door', 2.45 * 4);
  massFor('wheel', 3.1 * 4);
  massFor('head', 0.32 * 2);
  const glassN = 6 + 4 + 8;
  massFor('glass', 0.16 * glassN);
  let wsum = 0;
  const wmap = {};
  for (const [k, w] of weights) { wmap[k] = w; wsum += w; }
  const massOf = (k, div = 1) => s.carMass * (wmap[k] / div) / wsum;

  const lowerH = Math.max(0.28, H * 0.46 - wheelR * 0.15);
  const lowerY = wheelR * 0.22 + lowerH * 0.5;
  const roofH = Math.max(0.22, H * 0.34);
  const roofY = H - roofH * 0.5 - 0.02;
  const beltY = lowerY + lowerH * 0.5;

  function makePart(opt) {
    const sx = opt.sx, sy = opt.sy, sz = opt.sz;
    const shrink = opt.shrink ?? 0.01;
    const csx = Math.max(0.04, sx - shrink);
    const csy = Math.max(0.04, sy - shrink);
    const csz = Math.max(0.04, sz - shrink);
    const desc = RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(opt.x, opt.y, opt.z)
      .setCanSleep(true)
      .setCcdEnabled(true)
      .setLinearDamping(opt.linDamp ?? 0.035)
      .setAngularDamping(opt.angDamp ?? 0.05);
    const body = world.createRigidBody(desc);
    const col = world.createCollider(
      RAPIER.ColliderDesc.cuboid(csx * 0.5, csy * 0.5, csz * 0.5)
        .setTranslation(opt.colOff?.x || 0, opt.colOff?.y || 0, opt.colOff?.z || 0)
        .setFriction(opt.friction ?? 0.45)
        .setRestitution(opt.restitution ?? 0.05)
        .setDensity(opt.mass / Math.max(1e-4, csx * csy * csz))
        .setCollisionGroups(groups(G_CAR, G_GROUND | G_BRICK | G_CAR))
        .setActiveEvents(RAPIER.ActiveEvents?.CONTACT_FORCE_EVENTS ?? 2)
        .setContactForceEventThreshold(250),
      body
    );
    const mesh = opt.mesh || new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), opt.mat || paintMat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    if (mesh.isMesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
    } else {
      mesh.traverse((o) => {
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      });
    }
    group.add(mesh);
    const part = {
      name: opt.name, type: 'car', body, mesh, collider: col,
      pos: { x: opt.x, y: opt.y, z: opt.z },
      hx: sx * 0.5, hy: sy * 0.5, hz: sz * 0.5,
      halfH: sy * 0.5, blobR: Math.max(sx, sz) * 0.42,
      contactLimit: opt.contactLimit ?? 8000,
      hit: 0, isWheel: !!opt.isWheel, shockLimit: opt.shockLimit ?? 1e9
    };
    meta.set(body.handle, part);
    parts.push(part);
    body.wakeUp();
    return part;
  }

  const rearZone0 = -L / 2;
  const rearZone1 = cabinX0 - 0.02;
  const rearZoneLen = Math.max(0.45, rearZone1 - rearZone0);
  const bumperRt = Math.min(0.18, rearZoneLen * 0.22);
  const rearBodyLen = Math.max(0.22, rearZoneLen - bumperRt - 0.02);
  const rearBodyCx = rearZone0 + bumperRt + 0.02 + rearBodyLen * 0.5;
  const bumperR = makePart({
    name: 'bumperR', x: startCenter + (-L / 2 + bumperRt * 0.5), y: lowerY * 0.92, z: 0,
    sx: bumperRt, sy: lowerH * 0.72, sz: narrowW * 0.96,
    mass: massOf('bumperR'), mat: trimMat, contactLimit: 9000, shockLimit: 160, linDamp: 0.04
  });
  const rearBody = makePart({
    name: 'rearBody', x: startCenter + rearBodyCx, y: lowerY, z: 0,
    sx: rearBodyLen, sy: lowerH, sz: narrowW,
    mass: massOf('rearBody'), contactLimit: 22000, shockLimit: 1e9
  });

  const cabinGroup = new THREE.Group();
  const cabLower = new THREE.Mesh(new THREE.BoxGeometry(cabinLen, lowerH, cabinW), paintMat);
  cabLower.position.set(0, 0, 0);
  const roofLen = cabinLen * 0.72;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(roofLen, roofH, cabinW * 0.82), trimMat);
  roof.position.set(-cabinLen * 0.04, (roofY - lowerY), 0);
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.06, roofH * 0.92, cabinW * 0.84), paintMat);
  pillar.position.set(cabinLen * 0.34, (roofY - lowerY) * 0.15, 0);
  const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.22), tailMat);
  tailL.position.set(-cabinLen * 0.5 - 0.01, 0.05, cabinW * 0.32);
  const tailR = tailL.clone();
  tailR.position.z *= -1;
  const interior = new THREE.Mesh(new THREE.BoxGeometry(cabinLen * 0.7, lowerH * 0.45, cabinW * 0.72), darkMat);
  interior.position.set(0, lowerH * 0.12, 0);
  cabinGroup.add(cabLower, roof, pillar, tailL, tailR, interior);
  const cabin = makePart({
    name: 'cabin', x: startCenter + cabinCx, y: lowerY, z: 0,
    sx: cabinLen, sy: lowerH, sz: cabinW * 0.78,
    mass: massOf('cabin'), mesh: cabinGroup, contactLimit: 1e12, shockLimit: 1e9
  });
  state.cabin = cabin;
  const roofCol = world.createCollider(
    RAPIER.ColliderDesc.cuboid(roofLen * 0.48, roofH * 0.48, cabinW * 0.38)
      .setTranslation(-cabinLen * 0.04, roofY - lowerY, 0)
      .setFriction(0.4)
      .setRestitution(0.04)
      .setDensity(0)
      .setCollisionGroups(groups(G_CAR, G_GROUND | G_BRICK | G_CAR))
      .setActiveEvents(RAPIER.ActiveEvents?.CONTACT_FORCE_EVENTS ?? 2)
      .setContactForceEventThreshold(250),
    cabin.body
  );
  cabin.roofCol = roofCol;

  const frontStart = cabinX1 + 0.02;
  const frontEnd = L / 2;
  const frontBudget = Math.max(0.8, frontEnd - frontStart);
  const fFracs = [0.30, 0.28, 0.26, 0.16];
  const fGap = 0.018;
  const fUsable = frontBudget - fGap * 3;
  const fLens = fFracs.map((f) => f * fUsable);
  let cursor = frontStart;
  const centers = [];
  for (const len of fLens) {
    centers.push(cursor + len * 0.5);
    cursor += len + fGap;
  }
  const clipI = makePart({
    name: 'clipI', x: startCenter + centers[0], y: lowerY * 0.98, z: 0,
    sx: fLens[0], sy: lowerH * 0.96, sz: narrowW,
    mass: massOf('clipI'), contactLimit: 16000, shockLimit: 1e9
  });
  const clipO = makePart({
    name: 'clipO', x: startCenter + centers[1], y: lowerY * 0.94, z: 0,
    sx: fLens[1], sy: lowerH * 0.9, sz: narrowW * 0.96,
    mass: massOf('clipO'), contactLimit: 11000, shockLimit: 1e9
  });
  const nose = makePart({
    name: 'nose', x: startCenter + centers[2], y: lowerY * 0.86, z: 0,
    sx: fLens[2], sy: lowerH * 0.78, sz: narrowW * 0.9,
    mass: massOf('nose'), contactLimit: 6500, shockLimit: 1e9
  });
  const bumperF = makePart({
    name: 'bumperF', x: startCenter + centers[3], y: wheelR * 0.78, z: 0,
    sx: fLens[3], sy: lowerH * 0.42, sz: narrowW * 0.98,
    mass: massOf('bumperF'), mat: trimMat, contactLimit: 3200, shockLimit: 1e9
  });
  state.bumperF = bumperF;
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.03, bumperF.hy * 1.1, bumperF.hz * 1.2), darkMat);
  grille.position.set(bumperF.hx + 0.01, 0.02, 0);
  bumperF.mesh.add(grille);

  const hoodY = lowerY + lowerH * 0.5 + 0.045;
  const hoodF = makePart({
    name: 'hoodF', x: (nose.pos.x + clipO.pos.x) * 0.5, y: hoodY, z: 0,
    sx: (nose.hx + clipO.hx) * 0.95, sy: 0.05, sz: narrowW * 0.88,
    mass: massOf('hoodF'), contactLimit: 2600, shockLimit: 48, angDamp: 0.02
  });
  const hoodR = makePart({
    name: 'hoodR', x: (clipI.pos.x + cabin.pos.x + cabinLen * 0.2) * 0.5, y: hoodY + 0.01, z: 0,
    sx: clipI.hx * 1.3, sy: 0.05, sz: narrowW * 0.9,
    mass: massOf('hoodR'), contactLimit: 3400, shockLimit: 55, angDamp: 0.02
  });
  const trunkLid = makePart({
    name: 'trunkLid', x: rearBody.pos.x, y: lowerY + lowerH * 0.5 + 0.04, z: 0,
    sx: rearBodyLen * 0.78, sy: 0.05, sz: narrowW * 0.86,
    mass: massOf('trunkLid'), contactLimit: 7000, shockLimit: 130
  });

  function addWheel(name, axleLocal, z, shockLimit) {
    const x = startCenter + axleLocal;
    const y = wheelR;
    const desc = RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(x, y, z)
      .setCanSleep(true)
      .setCcdEnabled(true)
      .setLinearDamping(0.02)
      .setAngularDamping(0.02);
    const body = world.createRigidBody(desc);
    const mass = massOf('wheel', 4);
    const col = world.createCollider(
      RAPIER.ColliderDesc.cylinder(wheelW * 0.5, wheelR)
        .setRotation({ x: Math.SQRT1_2, y: 0, z: 0, w: Math.SQRT1_2 })
        .setFriction(Math.min(1.35, s.groundFriction + 0.15))
        .setRestitution(0.03)
        .setDensity(mass / Math.max(1e-4, Math.PI * wheelR * wheelR * wheelW))
        .setCollisionGroups(groups(G_CAR, G_GROUND | G_BRICK | G_CAR))
        .setActiveEvents(RAPIER.ActiveEvents?.CONTACT_FORCE_EVENTS ?? 2)
        .setContactForceEventThreshold(250),
      body
    );
    const vis = new THREE.Group();
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(wheelR, wheelR, wheelW, 18), tireMat);
    tire.geometry.rotateX(Math.PI / 2);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(wheelR * 0.58, wheelR * 0.58, wheelW * 0.72, 14), rimMat);
    rim.geometry.rotateX(Math.PI / 2);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(wheelR * 0.18, wheelR * 0.18, wheelW * 0.8, 10), trimMat);
    hub.geometry.rotateX(Math.PI / 2);
    vis.add(tire, rim, hub);
    vis.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    group.add(vis);
    const part = {
      name, type: 'car', body, mesh: vis, collider: col,
      pos: { x, y, z }, hx: wheelR, hy: wheelR, hz: wheelW * 0.5,
      halfH: wheelR, blobR: wheelR * 0.95,
      contactLimit: 5200, hit: 0, isWheel: true, shockLimit
    };
    meta.set(body.handle, part);
    parts.push(part);
    state.wheels.push(part);
    body.wakeUp();
    return part;
  }
  const wheelFL = addWheel('wFL', frontAxle, wheelZ, 1e9);
  const wheelFR = addWheel('wFR', frontAxle, -wheelZ, 1e9);
  const wheelRL = addWheel('wRL', rearAxle, wheelZ, 115);
  const wheelRR = addWheel('wRR', rearAxle, -wheelZ, 115);

  const doorT = 0.04;
  const doorH = Math.max(0.28, beltY - wheelR * 0.55);
  const doorY = wheelR * 0.55 + doorH * 0.5;
  const doorLen = Math.min(0.62, cabinLen * 0.42);
  const doorZ = cabinW * 0.5 + doorT * 0.35;
  function addDoor(name, xLocal, z, shock) {
    return makePart({
      name, x: startCenter + xLocal, y: doorY, z,
      sx: doorLen, sy: doorH, sz: doorT,
      mass: massOf('door', 4), contactLimit: 8500, shockLimit: shock
    });
  }
  const dOff = cabinLen * 0.2;
  const doorFL = addDoor('dFL', cabinCx + dOff, doorZ, 80);
  const doorFR = addDoor('dFR', cabinCx + dOff, -doorZ, 80);
  const doorRL = addDoor('dRL', cabinCx - dOff, doorZ, 95);
  const doorRR = addDoor('dRR', cabinCx - dOff, -doorZ, 95);

  function addGlass(name, x, y, z, sx, sy, sz, parentShock) {
    return makePart({
      name, x, y, z, sx, sy, sz,
      mass: massOf('glass', glassN), mat: glassMat,
      contactLimit: 1400, shockLimit: parentShock, shrink: 0.004,
      friction: 0.2, restitution: 0.02, linDamp: 0.02, angDamp: 0.03
    });
  }
  const glassParts = [];
  const wsW = cabinW * 0.72;
  const wsH = Math.max(0.22, roofY - beltY - 0.08);
  for (let gy = 0; gy < 2; gy++) {
    for (let gx = 0; gx < 3; gx++) {
      const sx = wsW / 3 - 0.02;
      const sy = wsH / 2 - 0.015;
      const z = -wsW / 2 + sx / 2 + 0.02 + gx * (sx + 0.02);
      const y = beltY + 0.06 + sy / 2 + gy * (sy + 0.015);
      const x = cabin.pos.x + cabinLen * 0.5 + 0.028;
      glassParts.push(addGlass('ws' + gy + gx, x, y, z, 0.02, sy, sx, 42));
    }
  }
  for (let gy = 0; gy < 2; gy++) {
    for (let gx = 0; gx < 2; gx++) {
      const sz = cabinW * 0.34;
      const sy = Math.max(0.08, (roofY - beltY) * 0.28);
      const x = cabin.pos.x - cabinLen * 0.5 - 0.02;
      const y = beltY + sy * 0.5 + 0.04 + gy * (sy + 0.012);
      const z = (gx - 0.5) * (sz + 0.012);
      glassParts.push(addGlass('rw' + gy + gx, x, y, z, 0.016, sy, sz, 60));
    }
  }
  const sideDoors = [doorFL, doorFR, doorRL, doorRR];
  for (let i = 0; i < sideDoors.length; i++) {
    const d = sideDoors[i];
    for (let k = 0; k < 2; k++) {
      const sign = d.pos.z > 0 ? 1 : -1;
      glassParts.push(addGlass(
        'sg' + i + k,
        d.pos.x + (k === 0 ? -doorLen * 0.22 : doorLen * 0.22),
        d.pos.y + d.hy * 0.12,
        d.pos.z + sign * (doorT * 0.5 + 0.016),
        doorLen * 0.34, doorH * 0.38, 0.012,
        70
      ));
    }
  }

  function addHead(z) {
    return makePart({
      name: z > 0 ? 'hL' : 'hR',
      x: bumperF.pos.x + bumperF.hx + 0.045,
      y: bumperF.pos.y + bumperF.hy * 0.15,
      z,
      sx: 0.08, sy: 0.1, sz: 0.16,
      mass: massOf('head', 2), mat: lampMat,
      contactLimit: 1500, shockLimit: 36
    });
  }
  const headL = addHead(narrowW * 0.28);
  const headR = addHead(-narrowW * 0.28);

  function fix(a, b, impulseLimit) {
    const pa = a.pos, pb = b.pos;
    const mid = { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2, z: (pa.z + pb.z) / 2 };
    const raw = world.createImpulseJoint(RAPIER.JointData.fixed(
      { x: mid.x - pa.x, y: mid.y - pa.y, z: mid.z - pa.z }, IDQ,
      { x: mid.x - pb.x, y: mid.y - pb.y, z: mid.z - pb.z }, IDQ
    ), a.body, b.body, true);
    joints.push({ raw, a, b, alive: true, impulseLimit, shockA: a.shockLimit, shockB: b.shockLimit });
  }
  function hingeWheel(host, wheel) {
    const pa = host.pos, pb = wheel.pos;
    const raw = world.createImpulseJoint(RAPIER.JointData.revolute(
      { x: pb.x - pa.x, y: pb.y - pa.y, z: pb.z - pa.z }, { x: 0, y: 0, z: 1 },
      { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }
    ), host.body, wheel.body, true);
    joints.push({ raw, a: host, b: wheel, alive: true, impulseLimit: 420, shockA: 1e9, shockB: wheel.shockLimit });
  }

  fix(bumperR, rearBody, 1e9);
  fix(rearBody, cabin, 1e9);
  fix(cabin, clipI, 1e9);
  fix(clipI, clipO, 1e9);
  fix(clipO, nose, 1e9);
  fix(nose, bumperF, 1e9);
  fix(hoodF, nose, 1e9);
  fix(hoodF, hoodR, 1e9);
  fix(hoodR, clipI, 1e9);
  fix(trunkLid, rearBody, 1e9);
  fix(doorFL, cabin, 1e9);
  fix(doorFR, cabin, 1e9);
  fix(doorRL, cabin, 1e9);
  fix(doorRR, cabin, 1e9);
  fix(headL, bumperF, 1e9);
  fix(headR, bumperF, 1e9);
  for (const g of glassParts) {
    const host = g.name.startsWith('sg') ? sideDoors[Number(g.name[2])] || cabin : cabin;
    fix(g, host, 1e9);
  }
  hingeWheel(clipO, wheelFL);
  hingeWheel(clipO, wheelFR);
  hingeWheel(rearBody, wheelRL);
  hingeWheel(rearBody, wheelRR);

  const fenderGeo = new THREE.BoxGeometry(wheelR * 1.3, 0.08, wheelW * 0.9);
  function fender(host, axle, z) {
    const m = new THREE.Mesh(fenderGeo, paintMat);
    m.position.set((startCenter + axle) - host.pos.x, wheelR * 0.92 - host.pos.y, z - host.pos.z);
    m.castShadow = true;
    host.mesh.add(m);
  }
  fender(clipO, frontAxle, wheelZ);
  fender(clipO, frontAxle, -wheelZ);
  fender(rearBody, rearAxle, wheelZ);
  fender(rearBody, rearAxle, -wheelZ);

  const maxBlob = parts.length + brickBodies.length;
  const blobOp = new Float32Array(maxBlob);
  blobGeo.setAttribute('aOpacity', new THREE.InstancedBufferAttribute(blobOp, 1).setUsage(THREE.DynamicDrawUsage));
  const blobs = new THREE.InstancedMesh(blobGeo, blobMat, maxBlob);
  blobs.userData.keepGeo = true;
  blobs.frustumCulled = false;
  blobs.renderOrder = 2;
  blobs.count = maxBlob;
  group.add(blobs);
  state.blobs = blobs;
  state.blobOp = blobOp;
  state.blobCount = maxBlob;

  const sparkPos = new Float32Array(48 * 3);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  const sparkPts = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    color: 0xffc27a, size: 0.07, transparent: true, opacity: 0.95, depthWrite: false, sizeAttenuation: true
  }));
  group.add(sparkPts);
  const dustPos = new Float32Array(40 * 3);
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dustPts = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: 0xb7aea2, size: 0.28, transparent: true, opacity: 0.35, depthWrite: false, sizeAttenuation: true
  }));
  group.add(dustPts);
  state.sparkPts = sparkPts;
  state.dustPts = dustPts;
  state.sparkPos = sparkPos;
  state.dustPos = dustPos;

  const halfShadow = Math.max(26, s.trackLength * 0.62);
  const sc = sun.shadow.camera;
  sc.left = -halfShadow;
  sc.right = halfShadow;
  sc.top = halfShadow * 0.48;
  sc.bottom = -halfShadow * 0.48;
  sc.near = 0.5;
  sc.far = 130;
  sc.updateProjectionMatrix();
  sun.position.set(s.trackLength * 0.28, 38, 20);
  sun.target.position.set(s.trackLength * 0.62, 0.4, 0);
  sun.target.updateMatrixWorld();

  state.lookWall = wallFront + spanX * 0.35;
  sim = state;
  if (viewMode === 'orbit') snapOrbit();
}

function jointImpulse(raw) {
  try {
    if (raw && typeof raw.impulses === 'function') {
      const v = raw.impulses();
      if (typeof v === 'number') return Math.abs(v);
      if (v && typeof v.length === 'number') {
        let s = 0;
        for (let i = 0; i < v.length; i++) s += v[i] * v[i];
        return Math.sqrt(s);
      }
    }
  } catch (e) { /* API optional */ }
  return 0;
}

function killJoint(j) {
  if (!j.alive) return;
  j.alive = false;
  sim.world.removeImpulseJoint(j.raw, true);
}

function spawnBurst(x, y, z) {
  const rng = sim.rng;
  for (let i = 0; i < 14; i++) {
    const a = rng() * Math.PI * 2;
    const sp = 1.5 + rng() * 5;
    sim.sparks.push({
      x, y: y + 0.2, z,
      vx: Math.cos(a) * sp * 0.55,
      vy: 1.2 + rng() * 4.5,
      vz: Math.sin(a) * sp,
      life: 0.18 + rng() * 0.28
    });
  }
  for (let i = 0; i < 18; i++) {
    sim.dust.push({
      x: x + (rng() - 0.5) * 1.4,
      y: 0.15 + rng() * 0.35,
      z: z + (rng() - 0.5) * 1.6,
      vx: (rng() - 0.5) * 2.2,
      vy: 0.35 + rng() * 1.4,
      vz: (rng() - 0.5) * 2.2,
      life: 0.7 + rng() * 0.9
    });
  }
}

function laySkid() {
  if (sim.skidLaid) return;
  sim.skidLaid = true;
  for (const w of sim.wheels) {
    const p = w.body.translation();
    const m = new THREE.Mesh(skidGeo, skidMat);
    m.userData.keepGeo = true;
    m.position.set(p.x - 1.15, 0.025, p.z);
    m.receiveShadow = false;
    sim.group.add(m);
  }
}

function physicsStep() {
  const s = sim.settings;
  const cabin = sim.cabin.body;
  if (sim.driving) {
    const b = sim.bumperF;
    const bx = b.body.translation().x + b.hx;
    const nextV = Math.min(s.impactSpeed, sim.driveV + sim.accel * FIXED);
    const reach = bx + nextV * FIXED;
    if (reach >= sim.wallFront - 0.02) {
      sim.driveV = nextV;
      sim.driving = false;
    } else {
      sim.driveV = nextV;
    }
    for (const p of sim.parts) {
      const vy = p.body.linvel().y;
      p.body.setLinvel({ x: sim.driveV, y: vy, z: 0 }, true);
      p.body.setAngvel({ x: 0, y: 0, z: p.isWheel ? -sim.driveV / sim.wheelR : 0 }, true);
    }
  }

  sim.prevVx = cabin.linvel().x;
  sim.world.step(sim.eventQueue);

  const vx = cabin.linvel().x;
  sim.shock = (sim.prevVx - vx) / FIXED;
  sim.time += FIXED;
  if (sim.shake > 0) sim.shake = Math.max(0, sim.shake - FIXED);

  sim.eventQueue.drainContactForceEvents((ev) => {
    const c1 = sim.world.getCollider(ev.collider1());
    const c2 = sim.world.getCollider(ev.collider2());
    if (!c1 || !c2) return;
    const b1 = c1.parent();
    const b2 = c2.parent();
    const A = sim.meta.get(b1.handle);
    const B = sim.meta.get(b2.handle);
    if (!A || !B) return;
    const f = typeof ev.totalForceMagnitude === 'function' ? ev.totalForceMagnitude() : 0;
    const carBrick = (A.type === 'car' && B.type === 'brick') || (B.type === 'car' && A.type === 'brick');
    if (carBrick) {
      sim.armed = true;
      sim.driving = false;
      const car = A.type === 'car' ? A : B;
      car.hit = Math.max(car.hit, f);
      if (!sim.impacted) {
        sim.impacted = true;
        sim.shake = 0.42;
        const p = sim.bumperF.body.translation();
        spawnBurst(p.x, p.y, p.z);
        laySkid();
      }
    } else if (sim.armed && A.type === 'car' && B.type === 'car') {
      A.hit = Math.max(A.hit, f * 0.65);
      B.hit = Math.max(B.hit, f * 0.65);
    }
  });

  if (sim.armed) {
    for (const j of sim.joints) {
      if (!j.alive) continue;
      const imp = jointImpulse(j.raw);
      const hit = j.a.hit > j.a.contactLimit || j.b.hit > j.b.contactLimit;
      const byImp = imp > j.impulseLimit;
      const byShock = sim.shock > Math.min(j.shockA, j.shockB);
      if (hit || byImp || byShock) killJoint(j);
    }
  }
  for (const p of sim.parts) p.hit = 0;

  if (sim.impacted) {
    sim.impactSteps++;
    tailMat.emissiveIntensity = 3.4;
    if (sim.impactSteps < 8 && sim.impactSteps % 2 === 0) {
      const p = sim.bumperF.body.translation();
      const rng = sim.rng;
      for (let i = 0; i < 4; i++) {
        sim.dust.push({
          x: p.x + (rng() - 0.5),
          y: 0.2,
          z: p.z + (rng() - 0.5) * 1.2,
          vx: (rng() - 0.5) * 1.4,
          vy: 0.4 + rng(),
          vz: (rng() - 0.5) * 1.4,
          life: 0.6 + rng() * 0.4
        });
      }
    }
  }

  const g = s.gravity;
  for (let i = sim.sparks.length - 1; i >= 0; i--) {
    const p = sim.sparks[i];
    p.life -= FIXED;
    p.vy -= g * FIXED;
    p.x += p.vx * FIXED;
    p.y += p.vy * FIXED;
    p.z += p.vz * FIXED;
    if (p.life <= 0 || p.y < 0) sim.sparks.splice(i, 1);
  }
  for (let i = sim.dust.length - 1; i >= 0; i--) {
    const p = sim.dust[i];
    p.life -= FIXED;
    p.vy -= g * 0.25 * FIXED;
    p.x += p.vx * FIXED;
    p.y += p.vy * FIXED;
    p.z += p.vz * FIXED;
    if (p.life <= 0 || p.y < 0) sim.dust.splice(i, 1);
  }
}

function syncGraphics() {
  for (const p of sim.parts) {
    const t = p.body.translation();
    const r = p.body.rotation();
    p.mesh.position.set(t.x, t.y, t.z);
    p.mesh.quaternion.set(r.x, r.y, r.z, r.w);
  }
  const dummy = scratch;
  const brickMesh = sim.brickMesh;
  if (brickMesh) {
    for (let i = 0; i < sim.brickBodies.length; i++) {
      const b = sim.brickBodies[i];
      const t = b.translation();
      const r = b.rotation();
      dummy.position.set(t.x, t.y, t.z);
      dummy.quaternion.set(r.x, r.y, r.z, r.w);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      brickMesh.setMatrixAt(i, dummy.matrix);
    }
    brickMesh.instanceMatrix.needsUpdate = true;
  }

  const op = sim.blobOp;
  const attr = sim.blobs.geometry.getAttribute('aOpacity');
  let n = 0;
  function blob(x, y, z, halfH, radius) {
    const gap = y - halfH;
    const fade = clamp(1 - gap / 0.9, 0, 1);
    op[n] = 0.42 * fade;
    const sc = radius * (0.85 + 0.15 * fade);
    dummy.position.set(x, 0.03, z);
    dummy.quaternion.identity();
    dummy.scale.set(fade > 0.02 ? sc : 0.0001, 1, fade > 0.02 ? sc : 0.0001);
    dummy.updateMatrix();
    sim.blobs.setMatrixAt(n, dummy.matrix);
    n++;
  }
  for (const p of sim.parts) {
    const t = p.body.translation();
    blob(t.x, t.y, t.z, p.halfH, p.blobR);
  }
  const bh = sim.settings.brickHeight * 0.5;
  const br = Math.max(sim.settings.brickWidth, sim.settings.brickDepth) * 0.45;
  for (const b of sim.brickBodies) {
    const t = b.translation();
    blob(t.x, t.y, t.z, bh, br);
  }
  for (; n < sim.blobCount; n++) op[n] = 0;
  attr.needsUpdate = true;
  sim.blobs.instanceMatrix.needsUpdate = true;

  const sp = sim.sparkPos;
  for (let i = 0; i < 48; i++) {
    const p = sim.sparks[i];
    const o = i * 3;
    if (p) { sp[o] = p.x; sp[o + 1] = p.y; sp[o + 2] = p.z; }
    else { sp[o] = 0; sp[o + 1] = -10; sp[o + 2] = 0; }
  }
  sim.sparkPts.geometry.attributes.position.needsUpdate = true;
  const dp = sim.dustPos;
  for (let i = 0; i < 40; i++) {
    const p = sim.dust[i];
    const o = i * 3;
    if (p) { dp[o] = p.x; dp[o + 1] = p.y; dp[o + 2] = p.z; }
    else { dp[o] = 0; dp[o + 1] = -10; dp[o + 2] = 0; }
  }
  sim.dustPts.geometry.attributes.position.needsUpdate = true;
  sim.dustPts.material.opacity = 0.28;
}

function snapOrbit() {
  const focusX = sim.lookWall - 1.2;
  controls.target.set(focusX, 1.05, 0);
  camera.up.set(0, 1, 0);
  camera.fov = 45;
  camera.position.set(focusX - 11, 4.6, 8.6);
  camera.updateProjectionMatrix();
  controls.update();
}

function updateCamera() {
  if (!sim) return;
  const t = sim.cabin.body.translation();
  if (viewMode === 'orbit') {
    controls.update();
    return;
  }
  camera.up.set(0, 1, 0);
  if (viewMode === 'impact') {
    const span = Math.max(0.001, sim.wallFront - sim.startCenter);
    const p = clamp((t.x - sim.startCenter) / span, 0, 1);
    const u = p * p * (3 - 2 * p);
    const lookX = lerp(sim.startCenter + 3, sim.lookWall - 0.4, 0.25 + 0.75 * u);
    camTarget.set(lookX, 1.05, 0);
    camera.fov = 42;
    camera.position.set(
      lerp(sim.wallFront - 18, sim.wallFront - 8.2, u),
      lerp(5.6, 3.15, u),
      lerp(10.5, 6.6, u)
    );
    camera.lookAt(camTarget);
  } else if (viewMode === 'follow') {
    camera.fov = 50;
    camera.position.set(t.x - 7.5, t.y + 2.55, t.z + 3.7);
    camera.lookAt(Math.min(sim.wallFront + 1.2, t.x + 4.8), t.y + 0.65, t.z * 0.4);
  } else if (viewMode === 'top') {
    camera.fov = 48;
    camera.up.set(0, 0, -1);
    const mid = sim.settings.trackLength * 0.5;
    camera.position.set(mid, Math.max(42, sim.settings.trackLength * 1.05), 0.02);
    camera.lookAt(mid, 0, 0);
  }
  if (sim.shake > 0 && (viewMode === 'impact' || viewMode === 'follow')) {
    const k = sim.shake / 0.42;
    const mag = k * k * 0.1;
    camera.position.x += Math.sin(sim.time * 86) * mag;
    camera.position.y += Math.sin(sim.time * 121) * mag * 0.45;
    camera.position.z += Math.cos(sim.time * 97) * mag;
  }
  camera.updateProjectionMatrix();
}

function setPaused(v) {
  paused = v;
  document.getElementById('pauseBtn').textContent = paused ? 'Play' : 'Pause';
}
function highlight(attr, value) {
  document.querySelectorAll('#bar button[' + attr + ']').forEach((b) => {
    b.classList.toggle('on', b.getAttribute(attr) === String(value));
  });
}

document.getElementById('pauseBtn').onclick = () => setPaused(!paused);
document.getElementById('replay').onclick = () => {
  setPaused(false);
  tailMat.emissiveIntensity = 0.55;
  build(readSettings());
};
document.getElementById('apply').onclick = () => {
  setPaused(false);
  tailMat.emissiveIntensity = 0.55;
  const s = readSettings();
  writeSettings(s);
  build(s);
};
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('panel').classList.toggle('open');
};
document.querySelectorAll('#bar button[data-speed]').forEach((b) => {
  b.onclick = () => {
    simSpeed = Number(b.dataset.speed);
    highlight('data-speed', simSpeed);
  };
});
document.querySelectorAll('#bar button[data-view]').forEach((b) => {
  b.onclick = () => {
    viewMode = b.dataset.view;
    highlight('data-view', viewMode);
    controls.enabled = viewMode === 'orbit';
    if (viewMode === 'orbit' && sim) snapOrbit();
    if (viewMode !== 'top') camera.up.set(0, 1, 0);
  };
});
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  setPaused(!paused);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (sim && !paused) {
    sim.acc += realDt * simSpeed;
    let steps = 0;
    while (sim.acc >= FIXED && steps < MAX_STEPS) {
      physicsStep();
      sim.acc -= FIXED;
      steps++;
    }
    if (steps === MAX_STEPS) sim.acc = 0;
  }
  if (sim) {
    syncGraphics();
    updateCamera();
  }
  renderer.render(scene, camera);
}

await RAPIER.init();
writeSettings(DEFAULTS);
build(DEFAULTS);
requestAnimationFrame(frame);
</script>
</body>
</html>
