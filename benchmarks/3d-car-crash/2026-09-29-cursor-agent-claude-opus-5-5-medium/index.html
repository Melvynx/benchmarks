<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
:root{--glass:rgba(16,18,22,.74);--line:rgba(255,255,255,.09);--txt:#eceef1;--mut:#98a0aa;--acc:#ff4b2b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0e11;color:var(--txt);font:12.5px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#brand{position:fixed;top:14px;left:14px;padding:8px 13px;border-radius:11px;font-weight:650;font-size:14px;letter-spacing:.01em}
#hud{position:fixed;top:14px;right:14px;padding:9px 12px;border-radius:11px;display:grid;grid-template-columns:auto auto;gap:3px 16px;min-width:215px}
#hud span{color:var(--mut)}
#hud b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
#bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
button{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:9px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
button:hover{background:rgba(255,255,255,.12)}
button svg{width:15px;height:15px}
button.primary{background:var(--acc);color:#fff}
button.primary:hover{background:#ff6a4f}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:rgba(255,255,255,.04)}
.seg button{background:transparent;padding:5px 9px;border-radius:8px;color:var(--mut)}
.seg button.on{background:#f3f4f6;color:#111}
.lbl{color:var(--mut);font-size:11px;margin:0 2px 0 4px;text-transform:uppercase;letter-spacing:.06em}
#panel{position:fixed;right:14px;bottom:70px;width:310px;max-height:calc(100vh - 150px);overflow:auto;border-radius:14px;padding:10px 12px 12px;display:none}
#panel.open{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:4px}
.ph button{padding:2px 8px}
.grp h4{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.grp label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.grp label em{color:var(--mut);font-style:normal;font-size:11px}
.grp input{width:92px;font:inherit;color:var(--txt);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
.grp input:focus{outline:none;border-color:var(--acc)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media (max-width:760px){#hud{top:auto;bottom:122px;right:10px;min-width:0}.lbl{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="brand" class="glass">Claude Opus 5.5</div>

  <span>Time</span><b id="hT">0.00 s</b>
  <span>Car speed</span><b id="hV">0.0 m/s</b>
  <span>Impact speed</span><b id="hI">&ndash;</b>
  <span>Joints broken</span><b id="hJ">0</b>
  <span>Bricks moved</span><b id="hB">0</b>
  <span>State</span><b id="hS">Approach</b>
</div>
<div id="panel" class="glass">
  <div class="ph"><span>Experiment settings</span><button id="closePanel" aria-label="Close">&times;</button></div>
  <div id="panelBody"></div>
</div>
<div id="bar" class="glass">
  <button id="replay" title="Replay (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Replay</button>
  <button id="play" title="Pause / Play (Space)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg><span id="playLbl">Pause</span></button>
  <div class="sep"></div>
  <span class="lbl">Speed</span>
  <div class="seg" id="speedSeg"><button data-v="0.25">0.25&times;</button><button data-v="0.5">0.5&times;</button><button data-v="1" class="on">1&times;</button><button data-v="2">2&times;</button></div>
  <div class="sep"></div>
  <span class="lbl">View</span>
  <div class="seg" id="camSeg"><button data-v="impact" class="on">Impact</button><button data-v="follow">Follow</button><button data-v="top">Top</button><button data-v="orbit">Orbit</button></div>
  <div class="sep"></div>
  <button id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 4v6M10 14v6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Settings</button>
</div>
<script type="module">

const DEFAULTS = Object.freeze({ speed: 22, carMass: 1250, carLength: 4.2, carWidth: 1.8, carHeight: 1.45, wallCols: 12, wallRows: 8, wallDepth: 2, brickMass: 2.5, brickW: 0.5, brickH: 0.24, brickD: 0.2, gravity: 9.81, brickFriction: 0.72, brickRestitution: 0.18, groundFriction: 0.85, trackLength: 40 });

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

// procedural outdoor environment for reflections (no external HDR)
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();

  const gDisk = new THREE.Mesh(new THREE.CircleGeometry(48, 32), new THREE.MeshBasicMaterial({ color: 0x3b3f38, side: THREE.DoubleSide }));

  const panelMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.2, 2.3), side: THREE.DoubleSide });

}

const sun = new THREE.DirectionalLight(0xfff0dc, 3.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.near = 1; sc.far = 160; sc.left = -16; sc.right = 16; sc.top = 16; sc.bottom = -16;

// ---------- procedural textures ----------
function makeTex(size, seed, fn, srgb = true) {

  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);

const px = (d, i, r, g, b) => { d[i] = clamp(r, 0, 255); d[i + 1] = clamp(g, 0, 255); d[i + 2] = clamp(b, 0, 255); d[i + 3] = 255; };

// ---------- shared materials ----------
const M = {
  paint: new THREE.MeshPhysicalMaterial({ color: 0xa3101a, metalness: 0.55, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.25 }),
  trim: new THREE.MeshStandardMaterial({ color: 0x141518, metalness: 0.2, roughness: 0.55 }),
  trimDS: new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.8, side: THREE.DoubleSide }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.92 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xe2e5e9, metalness: 1, roughness: 0.14 }),

// ---------- static environment ----------
let envGroup = null, envKey = '';

function planeXZ(x0, x1, z0, z1, y, tile) {

  if (envGroup) { scene.remove(envGroup); envGroup.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); }

    for (let x = ax0; x <= ax1; x += 2) add(M.steel, boxAt(0.08, 0.72, 0.1, x, 0.36, s * 8.58));
  }

  for (let z = -7.2; z <= 7.2; z += 0.62) for (let l = 0; l < 3; l++) for (let d = 0; d < 2; d++) { const g = tg.clone(); g.translate(runEnd + 0.45 + d * 0.62, 0.1 + l * 0.2, z); add(M.rubber, g); }
