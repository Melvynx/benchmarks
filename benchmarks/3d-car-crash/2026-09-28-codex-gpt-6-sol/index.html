        register(body,mesh);const wheel={name:n,body,mesh,link:null,detached:false};parts[n]=wheel;lock(wheel,cabin,xSide===1?285:480)
      }
      const b1=contactBlob(visuals,length*1.2,width*1.45,.42),b2=contactBlob(visuals,length*.75,width*1.2,.33);carBlobs=[b1,b2];
      return {origin,cabin,front,nose};
    }
    function buildWall(p,phys){const gap=.014,span=p.wallColumns*(p.brickWidth+gap),wallX=p.trackLength/2-8.3;wallBlob=contactBlob(visuals,p.wallLayers*(p.brickDepth+gap)+1,span+1,.26);wallBlob.position.x=wallX;
      const brickGeom=new THREE.BoxGeometry(p.brickDepth,p.brickHeight,p.brickWidth);
      for(let layer=0;layer<p.wallLayers;layer++)for(let row=0;row<p.wallRows;row++)for(let col=0;col<p.wallColumns;col++){
        const shifted=(row+layer)%2===1;const z=(col-(p.wallColumns-1)/2)*(p.brickWidth+gap)+(shifted?(p.brickWidth+gap)*.5:0);
        const x=wallX+(layer-(p.wallLayers-1)/2)*(p.brickDepth+gap);const y=p.brickHeight/2+row*(p.brickHeight+.009);
        const body=new CANNON.Body({mass:p.brickMass,material:phys.brick,position:new CANNON.Vec3(x,y,z),linearDamping:.012,angularDamping:.035,sleepSpeedLimit:.16,sleepTimeLimit:1.3});body.addShape(new CANNON.Box(new CANNON.Vec3(p.brickDepth/2,p.brickHeight/2,p.brickWidth/2)));body.collisionFilterGroup=4;body.collisionFilterMask=7;body.userData={name:'brick'};
        const mesh=new THREE.Mesh(brickGeom,mat.brick[(row*3+col*5+layer*2)%mat.brick.length]);register(body,mesh);bricks.push(body)
      }
      return wallX;
    }
    function shatter(part,impulse){if(part.detached)return;const body=part.body,oldMesh=part.mesh;const p=body.position,q=body.quaternion,v=body.velocity;release(part);
      world.removeBody(body);visuals.remove(oldMesh);bindings=bindings.filter(b=>b.body!==body);
      const dims=part.size||[.5,.3,.05];const nx=part.name==='windshield'?4:3,ny=2;const shardMass=body.mass/(nx*ny);
      for(let iy=0;iy<ny;iy++)for(let ix=0;ix<nx;ix++){
        const sx=dims[0]/nx*.88,sy=dims[1]/ny*.88,sz=Math.max(.025,dims[2]/(part.name==='windshield'?1:1));
        const ox=(ix-(nx-1)/2)*dims[0]/nx,oy=(iy-(ny-1)/2)*dims[1]/ny;
        const offset=q.vmult(new CANNON.Vec3(ox,oy,0));
        const b=new CANNON.Body({mass:shardMass,material:body.material,position:new CANNON.Vec3(p.x+offset.x,p.y+offset.y,p.z+offset.z),linearDamping:.035,angularDamping:.08});b.addShape(new CANNON.Box(new CANNON.Vec3(sx/2,sy/2,sz/2)));b.quaternion.copy(q);b.velocity.set(v.x+impulse*.002+(ix-1.5)*.38,v.y+.45+iy*.28,v.z+(ix-1.5)*.35);b.angularVelocity.set((iy?1:-1)*3,(ix-1.5)*2,2);b.collisionFilterGroup=2;b.collisionFilterMask=7;
        const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat.glassShard);register(b,m)
      }
    }
    function impactBreak(energy){const p=settings;const score=energy*(p.carMass/1250)**.22;
      for(const name of ['frontBumper','nose','hood','frontClip','leftFrontDoor','rightFrontDoor','leftRearDoor','frontLeftWheel','frontRightWheel','rearLeftWheel','rearRightWheel','trunk','rearBumper']){
        const obj=parts[name];if(obj&&obj.link&&score>obj.link.threshold)release(obj)
      }
      for(const obj of glass){if(obj.link&&score>obj.link.threshold)shatter(obj,score)}
      if(score>55){impactFlash=1;impactShake=Math.min(1,score/520);spawnDust(score)}
    }
    function spawnDust(energy){let seed=1717;const rnd=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);for(let i=0;i<19;i++){const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.13+rnd()*.16,0),mat.dust.clone());mesh.position.set(wallPosition-.4+rnd()*1.2,.2+rnd()*1.1,(rnd()-.5)*3);visuals.add(mesh);particles.push({mesh,age:0,lifetime:.7+rnd()*.6,vx:(rnd()-.5)*2.5,vy:.5+rnd()*1.8,vz:(rnd()-.5)*3})}}
    function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.mesh.scale.setScalar(1+p.age*2.2);p.mesh.material.opacity=.28*(1-p.age/p.lifetime);if(p.age>=p.lifetime){visuals.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1)}}}
    let wallPosition=0,carRoot=null;
    function rebuild(){settings=readSettings();if(visuals){scene.remove(visuals);const geometries=new Set();visuals.traverse(o=>{if(o.geometry)geometries.add(o.geometry)});geometries.forEach(g=>g.dispose())}visuals=new THREE.Group();scene.add(visuals);bindings=[];parts={};bricks=[];constraints=[];glass=[];carBlobs=[];particles=[];simTime=0;accum=0;playing=true;settled=false;impactSeen=false;impactFlash=0;impactShake=0;
      makeEnvironment(settings);const phys=createWorld(settings);world=phys.w;carRoot=buildCar(settings,phys);wallPosition=buildWall(settings,phys);
      for(const {body} of bindings){if(body.userData?.name==='brick')continue;body.addEventListener('collide',e=>{if(e.body?.userData?.name!=='brick')return;const relative=Math.abs(e.contact.getImpactVelocityAlongNormal());if(relative<2)return;const reduced=(settings.carMass*.18*(settings.brickMass*9))/(settings.carMass*.18+settings.brickMass*9);const impulse=relative*reduced;pendingImpact=Math.max(pendingImpact,impulse)})}
      pendingImpact=0;sync();updateReadout();document.getElementById('pause').textContent='Pause';lastFrame=performance.now();
    }
    let pendingImpact=0;
    function physicsStep(dt){const root=carRoot.cabin.body;const vx=root.velocity.x;if(!impactSeen&&vx<settings.speed){const distance=wallPosition-(root.position.x+settings.carLength*.49);const acceleration=Math.max(1,settings.speed*settings.speed/(2*Math.max(8,distance+1.5)));const desired=Math.min(settings.speed,vx+acceleration*dt);const force=(desired-vx)*settings.carMass/dt;root.applyForce(new CANNON.Vec3(Math.max(0,force),0,0),root.position)}
      pendingImpact=0;world.step(dt);simTime+=dt;if(pendingImpact>0){impactSeen=true;impactBreak(pendingImpact)}
      if(impactSeen){let active=0;for(const {body} of bindings){if(body.mass>0&&body.velocity.lengthSquared()>.20)active++}if((simTime>4&&active<5)||simTime>18){settled=true;playing=false;document.getElementById('pause').textContent='Play'}}
    }
    function updateReadout(){const root=carRoot?.cabin.body;document.getElementById('time').textContent=`${simTime.toFixed(2)} s`;document.getElementById('speedReadout').textContent=`${root?Math.max(0,root.velocity.x).toFixed(1):'0.0'} m/s`;document.getElementById('state').textContent=settled?'WRECK':!playing?'PAUSED':impactSeen?'IMPACT':'APPROACH'}
    function updateCamera(dt){if(currentView==='orbit'){orbit.update();return}const x=carRoot.cabin.body.position.x;let target,position;
      if(currentView==='impact'){const t=THREE.MathUtils.clamp((x-(wallPosition-15))/12,0,1);target=new THREE.Vector3(THREE.MathUtils.lerp(1,wallPosition-1,t),.95,0);position=new THREE.Vector3(THREE.MathUtils.lerp(-3,wallPosition-6,t),THREE.MathUtils.lerp(9,7.5,t),THREE.MathUtils.lerp(23,17,t))}
      else if(currentView==='follow'){target=new THREE.Vector3(Math.min(x+5,wallPosition+5),1.0,0);position=new THREE.Vector3(x-9,4.2,7.4)}
      else{target=new THREE.Vector3(0,0,0);position=new THREE.Vector3(0,34,0.001)}
      const lerp=currentView==='top'?1:1-Math.exp(-dt*3.7);camera.position.lerp(position,lerp);if(currentView==='top')camera.up.set(1,0,0);else camera.up.set(0,1,0);camera.lookAt(target);
      if(impactShake>0){const a=simTime*51;camera.position.x+=Math.sin(a*1.7)*impactShake*.07;camera.position.y+=Math.sin(a*2.3)*impactShake*.045;impactShake*=Math.exp(-dt*8)}
    }
    function frame(now){requestAnimationFrame(frame);let real=Math.min((now-lastFrame)/1000,.06);lastFrame=now;if(playing&&!settled){accum=Math.min(accum+real*simRate,1/60*8);let steps=0;while(accum>=1/120&&steps<8){physicsStep(1/120);accum-=1/120;steps++}}sync();if(carRoot){for(const [i,blob] of carBlobs.entries()){blob.position.x=carRoot.cabin.body.position.x+(i?-.6:.5);blob.position.z=carRoot.cabin.body.position.z;blob.material.opacity=Math.max(.12,(i?.33:.42)-Math.max(0,carRoot.cabin.body.position.y-.7)*.17)}}updateParticles(real);impactFlash=Math.max(0,impactFlash-real*2.5);updateReadout();updateCamera(real);renderer.render(scene,camera)}
    function setView(view){currentView=view;for(const b of document.querySelectorAll('[data-view]'))b.classList.toggle('active',b.dataset.view===view);orbit.enabled=view==='orbit';if(view==='orbit'){orbit.target.set(wallPosition-2,1,0);camera.position.set(wallPosition-7,8,15);camera.up.set(0,1,0);orbit.update()}else updateCamera(1)}
    document.getElementById('pause').addEventListener('click',()=>{if(settled)return;playing=!playing;document.getElementById('pause').textContent=playing?'Pause':'Play';lastFrame=performance.now();updateReadout()});
    document.getElementById('replay').addEventListener('click',rebuild);
    document.getElementById('apply').addEventListener('click',()=>{rebuild();document.getElementById('settings').classList.remove('open');document.getElementById('settingsToggle').setAttribute('aria-expanded','false')});
    document.getElementById('defaults').addEventListener('click',()=>{for(const [key] of specs)document.getElementById(key).value=DEFAULTS[key];rebuild()});
    document.getElementById('simSpeed').addEventListener('change',e=>{simRate=Number(e.target.value)});
    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    document.getElementById('settingsToggle').addEventListener('click',()=>{const panel=document.getElementById('settings');const open=panel.classList.toggle('open');document.getElementById('settingsToggle').setAttribute('aria-expanded',String(open))});
    addEventListener('keydown',e=>{if(e.code==='Space'&&!(document.activeElement instanceof HTMLInputElement)){e.preventDefault();document.getElementById('pause').click()}});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    rebuild();setView('impact');requestAnimationFrame(frame);
  </script>
</body>
</html>
