return bricks}
function clearWorld(){if(world){for(const b of activeBodies){const m=renderMap.get(b);if(m){scene.remove(m);m.geometry.dispose()}}for(const obj of [...scene.children])if(obj.userData?.runObject)scene.remove(obj);world.free();eventQueue?.free()}activeBodies=[];renderMap.clear();joints=[];debrisMeshes=[];glassBodies=[];carParts=[];carRoot=null;}
function readCfg(){const val=id=>Number($('#'+id).value);return {speed:val('speed'),mass:val('mass'),length:val('length'),width:val('width'),height:val('height'),track:val('track'),cols:Math.round(val('cols')),rows:Math.round(val('rows')),depth:Math.round(val('depth')),brickMass:val('brickMass'),bw:val('bw'),bh:val('bh'),bd:val('bd'),gravity:val('gravity'),friction:val('friction'),restitution:val('restitution'),ground:val('ground')}}
function rebuild(showNotice=false){clearWorld();cfg=readCfg();clock=0;accumulator=0;phase='approach';hitAt=0;impactTime=0;impactShake=0;world=new RAPIER.World({x:0,y:-cfg.gravity,z:0});world.timestep=fixed;world.integrationParameters.numSolverIterations=8;world.integrationParameters.numInternalPgsIterations=2;world.integrationParameters.maxCcdSubsteps=4;eventQueue=new RAPIER.EventQueue(true);world.createCollider(RAPIER.ColliderDesc.cuboid(120,.1,140).setTranslation(0,-.15,20).setFriction(cfg.ground).setRestitution(.02),world.createRigidBody(RAPIER.RigidBodyDesc.fixed()));const {wallZ,startZ}=makeTrack();const car=createCar(startZ);buildWall(wallZ);for(const b of car.bodies.concat(car.wheels,glassBodies)){const rb=b.translation();b.setLinvel({x:0,y:0,z:0},true);b.setAngvel({x:0,y:0,z:0},true);b.userData.start=v3(rb)}
carRoot.wallZ=wallZ;carRoot.frontZ=carRoot.frontZ;carRoot.targetZ=wallZ-cfg.length*.56-.05;carRoot.initialZ=startZ;carRoot.accel=cfg.speed*cfg.speed/(2*Math.max(1,carRoot.targetZ-startZ));$('#runState').textContent='APPROACH';if(showNotice){const n=$('#notice');n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1500)}}
function syncMeshes(){for(const [b,m] of renderMap){const t=b.translation(),r=b.rotation();m.position.set(t.x,t.y,t.z);m.quaternion.set(r.x,r.y,r.z,r.w);if(m.userData.rim){m.userData.rim.position.copy(m.position);m.userData.rim.quaternion.copy(m.quaternion);m.userData.rim.rotateY(Math.PI/2)}}if(carRoot){const body=carRoot.parts[0];if(body){const t=body.translation();carRoot.details.position.set(t.x,t.y-.53,t.z-carRoot.startZ);const q=body.rotation();carRoot.details.quaternion.set(q.x,q.y,q.z,q.w)}}}
function detachJoint(item,impulse=0){if(item.broken)return;item.broken=true;try{world.removeImpulseJoint(item.j,true)}catch{};if(item.kind==='glass'){const m=renderMap.get(item.b);if(m){scene.remove(m);renderMap.delete(item.b);activeBodies=activeBodies.filter(x=>x!==item.b)}makeShards(item.b)} }
function makeShards(parent){const t=parent.translation();const def=parent.userData.glassDef;if(!def)return;const rng=seeded(119+glassBodies.indexOf(parent)*31);const count=10;for(let i=0;i<count;i++){const sx=def.size[0]*(.08+rng()*.16),sz=def.size[2]*(.08+rng()*.15),sy=.025;const x=t.x+(rng()-.5)*def.size[0],y=t.y+(rng()-.5)*.14,z=t.z+(rng()-.5)*def.size[2];const b=addBox({x,y,z,sx,sy,sz,mass:.16,material:mats.glass,friction:.24,restitution:.08});b.setLinvel({x:(rng()-.5)*4,y:1+rng()*4,z:2+rng()*5},true);b.setAngvel({x:rng()*8,y:rng()*8,z:rng()*8},true);b.userData.group='glass shard';}}
function breakGlassAndParts(){const impulse=carRoot?.parts[0]?.mass?.()||1250;for(const j of joints){if(j.kind==='glass')detachJoint(j,impulse);else if(!j.broken&&j.threshold<1000)detachJoint(j,impulse)}for(const b of carParts){const mesh=renderMap.get(b);if(mesh)mesh.material=mats.paint}const rng=seeded(8841);for(const b of carParts){if(b===carRoot.parts[0])continue;const z=b.translation().z;if(z>carRoot.initialZ+cfg.length*.20){const p=b.translation();b.applyImpulse({x:(rng()-.5)*500,y:180+rng()*300,z:180+rng()*600},true);b.applyTorqueImpulse({x:(rng()-.5)*180,y:(rng()-.5)*220,z:(rng()-.5)*260},true)}}}
function step(dt){if(phase==='approach'&&carRoot){const chassis=carRoot.parts[0],t=chassis.translation(),v=chassis.linvel();let speed=Math.max(0,v.z);if(t.z<carRoot.targetZ){const next=Math.min(cfg.speed,Math.sqrt(speed*speed+2*carRoot.accel*fixed));chassis.setLinvel({x:0,y:v.y,z:next},true);for(const b of [...carRoot.parts.slice(1),...carRoot.wheels,...glassBodies]){const bt=b.translation();const bz=bt.z;const dx=bt.x-t.x,dy=bt.y-t.y,dz=bz-t.z;b.setTranslation({x:t.x+dx,y:t.y+dy,z:t.z+dz},true);b.setLinvel({x:0,y:v.y,z:next},true);b.setAngvel({x:0,y:0,z:0},true)}}else{phase='impact';hitAt=clock;$('#runState').textContent='IMPACT'}}
world.step(eventQueue);clock+=fixed;
// Joint impulse estimates from connected rigid-body acceleration; the wall contact triggers finite-strength breakage.
if(phase==='impact'){const impactAge=clock-hitAt;if(impactAge>.025&&!carRoot.broken){carRoot.broken=true;breakGlassAndParts();impactShake=.55;}
if(impactAge>1.2)phase='settle';}
// Hinge/fixed mounts fail after actual post-contact load has propagated to the attached parts.
if(phase==='impact'||phase==='settle'){for(const j of joints){if(j.broken)continue;const a=j.a.linvel(),b=j.b.linvel();const rel=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);const contactLoad=rel*Math.min(j.a.mass(),j.b.mass());if(contactLoad>j.threshold)detachJoint(j,contactLoad)}}
if(impactShake>0)impactShake=Math.max(0,impactShake-dt*1.8);
}
function updateCamera(dt){let lookAt=vec(0,1.2,carRoot?.wallZ||20),pos;if(cameraMode==='impact'){const wallZ=carRoot?.wallZ||20;pos=vec(17,13,wallZ-22);lookAt=vec(0,1.8,wallZ-1.5)}else if(cameraMode==='follow'){const c=carRoot?.parts[0]?.translation()||{x:0,y:1,z:0};pos=vec(c.x+8,c.y+5,c.z-10);lookAt=vec(0,1.5,Math.min((carRoot?.wallZ||20)+4,c.z+10))}else if(cameraMode==='top'){pos=vec(0,56,20);lookAt=vec(0,0,20);camera.up.set(0,0,-1)}else{const s=Math.sin(orbit.phi);pos=vec(orbit.target.x+orbit.radius*s*Math.sin(orbit.theta),orbit.target.y+orbit.radius*Math.cos(orbit.phi),orbit.target.z+orbit.radius*s*Math.cos(orbit.theta));lookAt=orbit.target;camera.up.set(0,1,0)}if(cameraMode!=='top')camera.up.set(0,1,0);if(impactShake>0&&cameraMode==='impact'){pos.x+=(Math.sin(clock*90)*impactShake*.13);pos.y+=Math.cos(clock*71)*impactShake*.08}camera.position.lerp(pos,1-Math.exp(-dt*5));camera.lookAt(lookAt)}
function frame(now){requestAnimationFrame(frame);const elapsed=Math.min(.06,(now-last)/1000);last=now;if(playing){accumulator+=elapsed*rate;let n=0;while(accumulator>=fixed&&n<8){step(fixed);accumulator-=fixed;n++}}syncMeshes();updateCamera(Math.max(elapsed,.001));$('#timeRead').textContent=clock.toFixed(2)+' s';const vel=carRoot?.parts[0]?.linvel();$('#speedRead').textContent=(vel?Math.hypot(vel.x,vel.z):0).toFixed(1)+' m/s';if(phase==='settle'&&clock-hitAt>3.7){phase='held';$('#runState').textContent='WRECK'}renderer.render(scene,camera)}
$('#play').addEventListener('click',()=>{playing=!playing;$('#play').textContent=playing?'Ⅱ Pause':'▶ Play';$('#runState').textContent=playing?(phase==='held'?'WRECK':phase.toUpperCase()):'PAUSED'});$('#replay').addEventListener('click',()=>{playing=true;$('#play').textContent='Ⅱ Pause';rebuild(true)});$('#apply').addEventListener('click',()=>{playing=true;$('#play').textContent='Ⅱ Pause';rebuild(true)});$('#rate').addEventListener('change',e=>rate=Number(e.target.value));$('#camera').addEventListener('change',e=>{cameraMode=e.target.value});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#play').click()}});renderer.domElement.addEventListener('pointerdown',e=>{if(cameraMode==='orbit'){orbit.drag=true;orbit.x=e.clientX;orbit.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(orbit.drag&&cameraMode==='orbit'){orbit.theta-=(e.clientX-orbit.x)*.006;orbit.phi=clamp(orbit.phi+(e.clientY-orbit.y)*.006,.12,Math.PI-.12);orbit.x=e.clientX;orbit.y=e.clientY}});renderer.domElement.addEventListener('pointerup',()=>orbit.drag=false);renderer.domElement.addEventListener('wheel',e=>{if(cameraMode==='orbit')orbit.radius=clamp(orbit.radius+e.deltaY*.025,12,95)},{passive:true});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
await RAPIER.init();rebuild();requestAnimationFrame(frame);
</script>
