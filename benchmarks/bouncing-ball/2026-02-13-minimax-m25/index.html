<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax M2.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Parameters
        const BALL_RADIUS = 15;
        const POLYGON_RADIUS = 250;
        const POLYGON_SIDES = 7;
        const ROTATION_SPEED = 0.5;
        const GRAVITY = 500;
        const RESTITUTION = 0.8;
        const FRICTION = 0.98;

        // Ball state - will be initialized at center
        let ball = null;

        // Polygon rotation angle
        let rotation = 0;

        // Initialize ball at center
        function initBall() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            ball = {
                x: cx,
                y: cy,
                vx: 0,
                vy: 0
            };
        }

        // Set canvas to fullscreen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (ball !== null) {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
            }
        }
        resize();
        window.addEventListener('resize', resize);

        // Get heptagon vertices at current rotation
        function getVertices(cx, cy, radius, sides, angle) {
            const vertices = [];
            for (let i = 0; i < sides; i++) {
                const a = angle + (i * 2 * Math.PI / sides);
                vertices.push({
                    x: cx + radius * Math.cos(a),
                    y: cy + radius * Math.sin(a)
                });
            }
            return vertices;
        }

        // Get vertex count (sides) - 1 for line segments
        function getLineCount(sides) {
            return sides;
        }

        // Distance from point to line segment
        function pointToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len2 = dx * dx + dy * dy;

            if (len2 === 0) {
                return { dist: Math.hypot(px - x1, py - y1), closestX: x1, closestY: y1 };
            }

            let t = ((px - x1) * dx + (py - y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));

            const closestX = x1 + t * dx;
            const closestY = y1 + t * dy;

            return {
                dist: Math.hypot(px - closestX, py - closestY),
                closestX,
                closestY
            };
        }

        // Get wall normal (outward from center)
        function getWallNormal(x1, y1, x2, y2, cx, cy) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.hypot(dx, dy);

            // Perpendicular vectors
            const nx = -dy / len;
            const ny = dx / len;

            // Choose the one pointing outward (away from center)
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;
            const toMidX = midX - cx;
            const toMidY = midY - cy;

            if (nx * toMidX + ny * toMidY > 0) {
                return { x: nx, y: ny };
            } else {
                return { x: -nx, y: -ny };
            }
        }

        // Handle collision with a wall
        function handleCollision(cx, cy, x1, y1, x2, y2) {
            const result = pointToSegment(ball.x, ball.y, x1, y1, x2, y2);

            if (result.dist < BALL_RADIUS) {
                // Get normal pointing toward center (invert outward normal)
                const outward = getWallNormal(x1, y1, x2, y2, cx, cy);
                const normal = { x: -outward.x, y: -outward.y };

                // Only process if ball is moving toward the wall (into the polygon)
                const velDotNormal = ball.vx * normal.x + ball.vy * normal.y;
                if (velDotNormal > 0) {
                    return false;
                }

                // Push ball out of wall (toward center)
                const overlap = BALL_RADIUS - result.dist;
                ball.x += normal.x * overlap;
                ball.y += normal.y * overlap;

                // Reflect velocity: v' = v - 2(v·n)n
                const dot = ball.vx * normal.x + ball.vy * normal.y;
                ball.vx = (ball.vx - 2 * dot * normal.x) * RESTITUTION;
                ball.vy = (ball.vy - 2 * dot * normal.y) * RESTITUTION;

                // Apply friction
                ball.vx *= FRICTION;
                ball.vy *= FRICTION;

                return true;
            }
            return false;
        }

        // Physics substep
        function physicsSubstep(dt) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Apply gravity
            ball.vy += GRAVITY * dt;

            // Update position
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Get current vertices
            const vertices = getVertices(cx, cy, POLYGON_RADIUS, POLYGON_SIDES, rotation);

            // Check collision with all walls
            for (let i = 0; i < POLYGON_SIDES; i++) {
                const next = (i + 1) % POLYGON_SIDES;
                handleCollision(cx, cy, vertices[i].x, vertices[i].y, vertices[next].x, vertices[next].y);
            }

            // Update rotation
            rotation += ROTATION_SPEED * dt;
        }

        // Main game loop
        let lastTime = 0;
        let initialized = false;

        function gameLoop(timestamp) {
            if (!initialized) {
                initBall();
                initialized = true;
            }

            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            // Multiple substeps for stability
            const substeps = 4;
            const subDt = dt / substeps;

            for (let i = 0; i < substeps; i++) {
                physicsSubstep(subDt);
            }

            // Render
            render();

            requestAnimationFrame(gameLoop);
        }

        function render() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw heptagon
            const vertices = getVertices(cx, cy, POLYGON_RADIUS, POLYGON_SIDES, rotation);

            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let i = 1; i < POLYGON_SIDES; i++) {
                ctx.lineTo(vertices[i].x, vertices[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            // Draw ball
            ctx.fillStyle = '#F00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
        }

        // Start the simulation
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
