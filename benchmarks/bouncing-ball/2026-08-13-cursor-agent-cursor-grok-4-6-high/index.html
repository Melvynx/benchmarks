<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Grok 4.6</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    h1 {
      position: fixed;
      top: 16px;
      left: 50%;
      margin: 0;
      transform: translateX(-50%);
      color: #ffffff;
      font: 500 16px/1 sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Cursor Grok 4.6</h1>
  <canvas id="c"></canvas>
  <script>
    (() => {
      const SIDES = 7;
      const POLY_R = 250;
      const BALL_R = 15;
      const GRAVITY = 500;
      const RESTITUTION = 0.8;
      const FRICTION = 0.98;
      const OMEGA = 0.5;
      const MAX_DT = 1 / 30;
      const SUBSTEP_LIMIT = 96;
      const SLOP = 1e-4;

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      // Regular heptagon in the polygon's rest frame, CCW, vertex at the top.
      const local = Array.from({ length: SIDES }, (_, i) => {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / SIDES;
        return { x: POLY_R * Math.cos(a), y: POLY_R * Math.sin(a) };
      });

      const walls = local.map((start, i) => {
        const end = local[(i + 1) % SIDES];
        const ex = end.x - start.x;
        const ey = end.y - start.y;
        const len = Math.hypot(ex, ey);
        return {
          start,
          ex,
          ey,
          invLenSq: 1 / (len * len),
          // CCW edge → clockwise perpendicular is the outward normal.
          nx: ey / len,
          ny: -ex / len
        };
      });

      let w = 0;
      let h = 0;
      let cx = 0;
      let cy = 0;
      let angle = 0;
      let prev = performance.now();

      const ball = { x: 0, y: 0, vx: 0, vy: 0 };

      function resize() {
        const prevCx = cx;
        const prevCy = cy;
        w = window.innerWidth;
        h = window.innerHeight;
        cx = w * 0.5;
        cy = h * 0.5;
        if (prevCx || prevCy) {
          ball.x += cx - prevCx;
          ball.y += cy - prevCy;
        } else {
          ball.x = cx;
          ball.y = cy;
        }
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function collide() {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const rx = ball.x - cx;
        const ry = ball.y - cy;

        // World → polygon frame (inverse rotation about the current angle).
        let lx = cos * rx + sin * ry;
        let ly = -sin * rx + cos * ry;
        let lvx = cos * ball.vx + sin * ball.vy;
        let lvy = -sin * ball.vx + cos * ball.vy;

        // Multiple passes so corner contacts against two walls both resolve.
        for (let pass = 0; pass < SIDES; pass++) {
          let hit = false;
          for (let i = 0; i < SIDES; i++) {
            const wall = walls[i];
            const dx = lx - wall.start.x;
            const dy = ly - wall.start.y;
            const signed = dx * wall.nx + dy * wall.ny;
            const pen = signed + BALL_R;
            if (pen <= 0) continue;

            hit = true;
            lx -= wall.nx * (pen + SLOP);
            ly -= wall.ny * (pen + SLOP);

            // Contact on the finite segment, used for the rotating wall velocity.
            const t = Math.max(0, Math.min(1, (dx * wall.ex + dy * wall.ey) * wall.invLenSq));
            const px = wall.start.x + wall.ex * t;
            const py = wall.start.y + wall.ey * t;

            // ω × r in 2D, expressed in the polygon frame.
            const wvx = -OMEGA * py;
            const wvy = OMEGA * px;
            let relx = lvx - wvx;
            let rely = lvy - wvy;
            const vn = relx * wall.nx + rely * wall.ny;
            if (vn <= 0) continue;

            // Reflect the relative velocity across the outward normal, then
            // apply restitution on the normal and friction on the tangent.
            relx -= (1 + RESTITUTION) * vn * wall.nx;
            rely -= (1 + RESTITUTION) * vn * wall.ny;
            const nAfter = relx * wall.nx + rely * wall.ny;
            let tx = relx - nAfter * wall.nx;
            let ty = rely - nAfter * wall.ny;
            tx *= FRICTION;
            ty *= FRICTION;
            lvx = tx + nAfter * wall.nx + wvx;
            lvy = ty + nAfter * wall.ny + wvy;
          }
          if (!hit) break;
        }

        // Polygon frame → world.
        ball.x = cx + cos * lx - sin * ly;
        ball.y = cy + sin * lx + cos * ly;
        ball.vx = cos * lvx - sin * lvy;
        ball.vy = sin * lvx + cos * lvy;
      }

      function step(dt) {
        const travel =
          (Math.hypot(ball.vx, ball.vy) + Math.abs(OMEGA) * POLY_R) * dt +
          0.5 * GRAVITY * dt * dt;
        const n = Math.max(1, Math.min(SUBSTEP_LIMIT, Math.ceil(travel / (BALL_R * 0.2))));
        const hdt = dt / n;
        for (let i = 0; i < n; i++) {
          angle += OMEGA * hdt;
          ball.vy += GRAVITY * hdt;
          ball.x += ball.vx * hdt;
          ball.y += ball.vy * hdt;
          collide();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        ctx.beginPath();
        for (let i = 0; i < SIDES; i++) {
          const v = local[i];
          const x = cx + cos * v.x - sin * v.y;
          const y = cy + sin * v.x + cos * v.y;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = "#FF0000";
        ctx.fill();
      }

      function frame(now) {
        const dt = Math.min((now - prev) / 1000, MAX_DT);
        prev = now;
        if (dt > 0) step(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
