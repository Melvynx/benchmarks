.composefields input{width:100%;height:42px;border:0;border-bottom:1px solid var(--line);outline:0}.composebody{resize:none;border:0;outline:0;padding:15px 18px;flex:1;line-height:1.6}.composebottom{padding:12px 18px 18px;display:flex;align-items:center;gap:13px}.send{background:#0b57d0;color:white;border-radius:20px;padding:10px 24px;font-weight:700}.send:hover{background:#0842a0}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:#303134;color:white;padding:12px 20px;border-radius:6px;transition:.25s;z-index:30}.toast.on{transform:translate(-50%,0)}.mobileback{display:none}

<body><header class="top"><div class="brand"><div class="brandmark"></div><span class="brandname">GPT-6</span></div><label class="searchbox"><span>⌕</span><input id="search" placeholder="Search mail" autocomplete="off"><button class="iconbtn" id="clearSearch" title="Clear search" style="display:none">×</button><button class="iconbtn" title="Search options">☷</button></label><div class="headright"><button class="iconbtn help" title="Help">?</button><button class="iconbtn settings" title="Quick settings" id="settings">⚙</button><div class="avatar" title="Melvyn X">M</div></div></header>
