<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Claude Opus 5 — a fast, dense, keyboard-driven mail client." />
    <title>Claude Opus 5</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong palette.
      try {
        const raw = localStorage.getItem('opus5mail.settings.v1')
        const theme = raw ? JSON.parse(raw).theme : 'system'
        const dark =
          theme === 'dark' ||
          ((!theme || theme === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
