<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Opus 5</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:rgba(16,20,28,.86);
    --panel-solid:#101420;
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.18);
    --txt:#e8edf6;
    --dim:#8b96ab;
    --accent:#ff6b3d;
    --accent2:#4ea8ff;
    --ok:#49d08b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- brand ---------- */
  .brand{
    position:fixed;top:16px;left:20px;z-index:6;
    font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.75);
    display:flex;align-items:center;gap:10px;pointer-events:none;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}

  /* ---------- telemetry ---------- */
  .hud{
    position:fixed;top:14px;right:16px;z-index:6;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    min-width:232px;box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .hud h4{
    margin:0 0 9px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;
    display:flex;justify-content:space-between;align-items:center;
  }
  .badge{
    font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.1em;
    border:1px solid var(--line-strong);color:var(--dim);
  }
  .badge.armed{color:var(--accent2);border-color:rgba(78,168,255,.45);background:rgba(78,168,255,.10)}
  .badge.run{color:var(--accent);border-color:rgba(255,107,61,.5);background:rgba(255,107,61,.12)}
  .badge.done{color:var(--ok);border-color:rgba(73,208,139,.45);background:rgba(73,208,139,.10)}
  .rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:11.5px}
  .rows .k{color:var(--dim)}
  .rows .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .hud hr{border:0;border-top:1px solid var(--line);margin:9px 0}

  /* ---------- dock ---------- */
  .dock{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:7;
    display:flex;gap:9px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 16px 44px rgba(0,0,0,.5);
  }
  button{font-family:inherit;color:var(--txt);cursor:pointer;border:none;background:none}
  .btn{
    border:1px solid var(--line-strong);background:rgba(255,255,255,.05);
    border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;letter-spacing:.03em;
    transition:background .14s,border-color .14s,transform .08s;
  }
  .btn:hover{background:rgba(255,255,255,.11)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(180deg,#ff824f,#f2521f);border-color:#ff9166;color:#fff;
    box-shadow:0 5px 18px rgba(242,82,31,.4);padding:9px 26px;
  }
  .btn.primary:hover{background:linear-gradient(180deg,#ff916a,#ff5f26)}
  .btn.primary:disabled{opacity:.42;cursor:default;box-shadow:none}
  .btn.tog[aria-pressed="true"]{background:rgba(78,168,255,.20);border-color:rgba(78,168,255,.55);color:#bfe0ff}
  .sep{width:1px;height:26px;background:var(--line)}

  /* ---------- settings ---------- */
  .panel{
    position:fixed;top:0;left:0;bottom:0;width:318px;z-index:8;
    background:var(--panel-solid);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:14px 0 44px rgba(0,0,0,.5);
  }
  .panel.open{transform:none}
  .panel-head{
    padding:16px 18px 13px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
  }
  .panel-head b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
  .x{color:var(--dim);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
  .x:hover{color:#fff;background:rgba(255,255,255,.08)}
  .panel-body{overflow-y:auto;padding:14px 18px 22px;flex:1 1 auto}
  .panel-body::-webkit-scrollbar{width:8px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .grp{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
       font-weight:600;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .grp:first-child{margin-top:2px}
  .fld{margin-bottom:13px}
  .fld .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-size:11.5px}
  .fld .lab span:first-child{color:#c6cfdd}
  .fld .lab .val{font-family:var(--mono);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
  .fld .lab .val i{color:var(--dim);font-style:normal;font-size:9.5px;margin-left:2px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.13)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;
    box-shadow:0 1px 5px rgba(0,0,0,.6);border:2px solid var(--accent);
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.13)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
  .chk{display:flex;align-items:center;gap:9px;font-size:11.5px;color:#c6cfdd;margin:9px 0;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .foot{padding:12px 18px;border-top:1px solid var(--line);flex:0 0 auto;display:flex;gap:8px}
  .foot .btn{flex:1;padding:8px 10px;font-size:11.5px;text-align:center}
  .note{font-size:10.5px;color:var(--dim);line-height:1.5;margin:4px 0 0}

  .hint{
    position:fixed;bottom:20px;left:20px;z-index:6;font-size:10.5px;color:var(--dim);
    font-family:var(--mono);letter-spacing:.05em;pointer-events:none;text-shadow:0 1px 8px #000;
  }
  @media (max-width:760px){
    .hud{min-width:0;font-size:10px;padding:9px 11px;top:52px}
    .rows{font-size:10.5px}
    .panel{width:min(318px,88vw)}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="brand"><span class="dot"></span>Claude Opus 5</div>

<div class="hud">
  <h4><span>Telemetry</span><span class="badge armed" id="state">ARMED</span></h4>
  <div class="rows">
    <div class="k">Car speed</div><div class="v" id="tSpeed">0.00 m/s</div>
    <div class="k">Elapsed</div><div class="v" id="tTime">0.000 s</div>
    <div class="k">Moving bricks</div><div class="v" id="tMoving">0</div>
    <div class="k">Displaced</div><div class="v" id="tDisp">0 / 0</div>
  </div>
  <hr>
  <div class="rows">
    <div class="k">Impact energy</div><div class="v" id="tKE">0 kJ</div>
    <div class="k">Peak decel</div><div class="v" id="tG">0.0 g</div>
    <div class="k">Wall standing</div><div class="v" id="tStand">100%</div>
    <div class="k">Wall mass</div><div class="v" id="tMass">0 kg</div>
    <div class="k">Solver</div><div class="v" id="tSolver">180 Hz</div>
  </div>
</div>

<div class="dock">
  <button class="btn primary" id="btnTest">▶ Test</button>
  <button class="btn" id="btnReset">Reset</button>
  <div class="sep"></div>
  <button class="btn tog" id="btnSlow" aria-pressed="false">Slow-mo</button>
  <button class="btn" id="btnSettings">⚙ Settings</button>
</div>

<div class="hint">SPACE run &nbsp;·&nbsp; R reset &nbsp;·&nbsp; S settings</div>

<aside class="panel" id="panel">
  <div class="panel-head"><b>Experiment Setup</b><button class="x" id="btnClose">×</button></div>
  <div class="panel-body" id="fields"></div>
  <div class="foot">
    <button class="btn" id="btnDefaults">Restore defaults</button>
  </div>
</aside>

<script>
"use strict";
/* =====================================================================================
   Claude Opus 5 — Rigid-body crash test bench
   Engine: oriented-box SAT + reference/incident-face clipping manifolds,
           warm-started sequential impulses, split-impulse position correction,
           Coulomb friction, restitution with velocity threshold, island-free sleeping.
   Physics is fully deterministic: fixed timestep, no RNG anywhere in the solver.
   ===================================================================================== */

/* ------------------------------------------------------------------ 1. utilities */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

/** Deterministic PRNG — used exclusively for cosmetic effects (dust, chips, tints).
 *  It is never read by the solver, so visuals cannot perturb the physical result. */
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
/** Stable integer hash → used for per-brick colour variety (no RNG state). */
function hash01(i) {
  let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ------------------------------------------------------------------ 2. body */
const KIND_GROUND = 0, KIND_BRICK = 1, KIND_CAR = 2;
let BODY_SEQ = 0;

class Body {
  constructor(o) {
    this.id = ++BODY_SEQ;
    this.idx = 0;
    this.w = o.w; this.h = o.h;
    this.hw = o.w * 0.5; this.hh = o.h * 0.5;
    this.px = o.x; this.py = o.y;
    this.angle = o.angle || 0;
    this.vx = 0; this.vy = 0; this.av = 0;
    this.qx = 0; this.qy = 0; this.qa = 0;          // pseudo-velocities (split impulse)
    this.fx = 0; this.fy = 0; this.tq = 0;
    this.friction    = o.friction    !== undefined ? o.friction    : 0.7;
    this.restitution = o.restitution !== undefined ? o.restitution : 0.1;
    this.group = o.group !== undefined ? o.group : 0;  // layer id; -1 collides with all
    this.kind  = o.kind  !== undefined ? o.kind  : KIND_BRICK;
    this.isStatic = !!o.isStatic;
    if (this.isStatic) {
      this.mass = Infinity;
      this.invMass = this.invMass0 = 0;
      this.invI = this.invI0 = 0;
    } else {
      this.mass = o.mass;
      this.invMass = this.invMass0 = 1 / o.mass;
      const I = o.mass * (o.w * o.w + o.h * o.h) / 12 * (o.inertiaScale || 1);
      this.invI = this.invI0 = 1 / I;
    }
    this.awake = true;
    this.sleepT = 0;
    this.c = Math.cos(this.angle);
    this.s = Math.sin(this.angle);
    // bookkeeping for telemetry / rendering
    this.spawnX = this.px; this.spawnY = this.py; this.spawnA = this.angle;
    this.tint = 0; this.layer = 0; this.row = 0; this.col = 0; this.half = false;
    this.stress = 0;
  }
  syncRot() { this.c = Math.cos(this.angle); this.s = Math.sin(this.angle); }
  /** A sleeping body is treated exactly like a static one by the solver, so it
   *  cannot accumulate phantom velocity while it is out of the simulation. */
  wake() {
    if (!this.awake) { this.invMass = this.invMass0; this.invI = this.invI0; }
    this.awake = true; this.sleepT = 0;
  }
  sleep() {
    this.awake = false; this.sleepT = 0;
    this.vx = this.vy = this.av = 0;
    this.qx = this.qy = this.qa = 0;
    this.invMass = 0; this.invI = 0;
  }
  speed2() { return this.vx * this.vx + this.vy * this.vy; }
}

/* ------------------------------------------------------------------ 3. narrowphase
   Box-vs-box SAT with reference/incident face clipping (Catto's box2d-lite scheme).
   Produces up to 2 contact points with persistent feature ids for warm starting.   */
const NO_EDGE = 0, EDGE1 = 1, EDGE2 = 2, EDGE3 = 3, EDGE4 = 4;
const pack = (i1, o1, i2, o2) => (i1 | (o1 << 8) | (i2 << 16) | (o2 << 24)) >>> 0;
function flipFeature(fp) {
  return (((fp >>> 16) & 255) | (((fp >>> 24) & 255) << 8) |
          ((fp & 255) << 16) | ((((fp >>> 8) & 255)) << 24)) >>> 0;
}

const mkCV = () => ({ x: 0, y: 0, fp: 0 });
const _inc = [mkCV(), mkCV()], _cp1 = [mkCV(), mkCV()], _cp2 = [mkCV(), mkCV()];
const _out = [
  { px: 0, py: 0, nx: 0, ny: 0, sep: 0, fp: 0 },
  { px: 0, py: 0, nx: 0, ny: 0, sep: 0, fp: 0 }
];

function computeIncidentEdge(out, hx, hy, px, py, c, s, nx, ny) {
  // normal expressed in the incident box frame, negated
  const lx = -(c * nx + s * ny);
  const ly = -(-s * nx + c * ny);
  let x0, y0, f0, x1, y1, f1;
  if (Math.abs(lx) > Math.abs(ly)) {
    if (lx > 0) { x0 =  hx; y0 = -hy; f0 = pack(0, 0, EDGE3, EDGE4); x1 =  hx; y1 =  hy; f1 = pack(0, 0, EDGE4, EDGE1); }
    else        { x0 = -hx; y0 =  hy; f0 = pack(0, 0, EDGE1, EDGE2); x1 = -hx; y1 = -hy; f1 = pack(0, 0, EDGE2, EDGE3); }
  } else {
    if (ly > 0) { x0 =  hx; y0 =  hy; f0 = pack(0, 0, EDGE4, EDGE1); x1 = -hx; y1 =  hy; f1 = pack(0, 0, EDGE1, EDGE2); }
    else        { x0 = -hx; y0 = -hy; f0 = pack(0, 0, EDGE2, EDGE3); x1 =  hx; y1 = -hy; f1 = pack(0, 0, EDGE3, EDGE4); }
  }
  out[0].x = px + c * x0 - s * y0; out[0].y = py + s * x0 + c * y0; out[0].fp = f0;
  out[1].x = px + c * x1 - s * y1; out[1].y = py + s * x1 + c * y1; out[1].fp = f1;
}

function clipSegmentToLine(vOut, vIn, nx, ny, offset, clipEdge) {
  let n = 0;
  const d0 = nx * vIn[0].x + ny * vIn[0].y - offset;
  const d1 = nx * vIn[1].x + ny * vIn[1].y - offset;
  if (d0 <= 0) { vOut[n].x = vIn[0].x; vOut[n].y = vIn[0].y; vOut[n].fp = vIn[0].fp; n++; }
  if (d1 <= 0) { vOut[n].x = vIn[1].x; vOut[n].y = vIn[1].y; vOut[n].fp = vIn[1].fp; n++; }
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1);
    vOut[n].x = vIn[0].x + t * (vIn[1].x - vIn[0].x);
    vOut[n].y = vIn[0].y + t * (vIn[1].y - vIn[0].y);
    let fp;
    if (d0 > 0) { fp = (vIn[0].fp & 0xffffff00) | clipEdge; fp = (fp & 0xff00ffff) | (NO_EDGE << 16); }
    else        { fp = (vIn[1].fp & 0xffff00ff) | (clipEdge << 8); fp = (fp & 0x00ffffff) | (NO_EDGE << 24); }
    vOut[n].fp = fp >>> 0;
    n++;
  }
  return n;
}

/** Returns contact count (0..2) in _out. Normal points from A to B. */
function collide(A, B) {
  const hAx = A.hw, hAy = A.hh, hBx = B.hw, hBy = B.hh;
  const cA = A.c, sA = A.s, cB = B.c, sB = B.s;
  const dpx = B.px - A.px, dpy = B.py - A.py;

  const dAx =  cA * dpx + sA * dpy, dAy = -sA * dpx + cA * dpy;
  const dBx =  cB * dpx + sB * dpy, dBy = -sB * dpx + cB * dpy;

  // C = Rot(A)^T * Rot(B), stored column-wise
  const C11 =  cA * cB + sA * sB, C21 = -sA * cB + cA * sB;
  const C12 = -cA * sB + sA * cB, C22 =  sA * sB + cA * cB;
  const a11 = Math.abs(C11), a21 = Math.abs(C21), a12 = Math.abs(C12), a22 = Math.abs(C22);

  const faceAx = Math.abs(dAx) - hAx - (a11 * hBx + a12 * hBy);
  const faceAy = Math.abs(dAy) - hAy - (a21 * hBx + a22 * hBy);
  if (faceAx > 0 || faceAy > 0) return 0;

  const faceBx = Math.abs(dBx) - (a11 * hAx + a21 * hAy) - hBx;
  const faceBy = Math.abs(dBy) - (a12 * hAx + a22 * hAy) - hBy;
  if (faceBx > 0 || faceBy > 0) return 0;

  let axis = 0, sep = faceAx;
  let nx = dAx > 0 ?  cA : -cA;
  let ny = dAx > 0 ?  sA : -sA;
  const REL = 0.95, ABS = 0.01;
  if (faceAy > REL * sep + ABS * hAy) { axis = 1; sep = faceAy; nx = dAy > 0 ? -sA :  sA; ny = dAy > 0 ?  cA : -cA; }
  if (faceBx > REL * sep + ABS * hBx) { axis = 2; sep = faceBx; nx = dBx > 0 ?  cB : -cB; ny = dBx > 0 ?  sB : -sB; }
  if (faceBy > REL * sep + ABS * hBy) { axis = 3; sep = faceBy; nx = dBy > 0 ? -sB :  sB; ny = dBy > 0 ?  cB : -cB; }

  let fnx, fny, snx, sny, front, negSide, posSide, negEdge, posEdge, side;
  if (axis === 0) {
    fnx = nx; fny = ny; front = A.px * fnx + A.py * fny + hAx;
    snx = -sA; sny = cA; side = A.px * snx + A.py * sny;
    negSide = -side + hAy; posSide = side + hAy; negEdge = EDGE3; posEdge = EDGE1;
    computeIncidentEdge(_inc, hBx, hBy, B.px, B.py, cB, sB, fnx, fny);
  } else if (axis === 1) {
    fnx = nx; fny = ny; front = A.px * fnx + A.py * fny + hAy;
    snx = cA; sny = sA; side = A.px * snx + A.py * sny;
    negSide = -side + hAx; posSide = side + hAx; negEdge = EDGE2; posEdge = EDGE4;
    computeIncidentEdge(_inc, hBx, hBy, B.px, B.py, cB, sB, fnx, fny);
  } else if (axis === 2) {
    fnx = -nx; fny = -ny; front = B.px * fnx + B.py * fny + hBx;
    snx = -sB; sny = cB; side = B.px * snx + B.py * sny;
    negSide = -side + hBy; posSide = side + hBy; negEdge = EDGE3; posEdge = EDGE1;
    computeIncidentEdge(_inc, hAx, hAy, A.px, A.py, cA, sA, fnx, fny);
  } else {
    fnx = -nx; fny = -ny; front = B.px * fnx + B.py * fny + hBy;
    snx = cB; sny = sB; side = B.px * snx + B.py * sny;
    negSide = -side + hBx; posSide = side + hBx; negEdge = EDGE2; posEdge = EDGE4;
    computeIncidentEdge(_inc, hAx, hAy, A.px, A.py, cA, sA, fnx, fny);
  }

  if (clipSegmentToLine(_cp1, _inc, -snx, -sny, negSide, negEdge) < 2) return 0;
  if (clipSegmentToLine(_cp2, _cp1,  snx,  sny, posSide, posEdge) < 2) return 0;

  let n = 0;
  for (let i = 0; i < 2; i++) {
    const s2 = fnx * _cp2[i].x + fny * _cp2[i].y - front;
    if (s2 <= 0) {
      const c = _out[n];
      c.sep = s2; c.nx = nx; c.ny = ny;
      c.px = _cp2[i].x - s2 * fnx;
      c.py = _cp2[i].y - s2 * fny;
      c.fp = axis >= 2 ? flipFeature(_cp2[i].fp) : _cp2[i].fp;
      n++;
    }
  }
  return n;
}

/* ------------------------------------------------------------------ 4. arbiter */
const SLOP = 0.0025;         // allowed penetration (m)
const BIAS = 0.30;           // position correction factor
const REST_THRESHOLD = 1.0;  // m/s — below this restitution is suppressed

function newContactSlot() {
  return {
    px: 0, py: 0, nx: 0, ny: 0, sep: 0, fp: 0,
    r1x: 0, r1y: 0, r2x: 0, r2y: 0,
    massN: 0, massT: 0, bias: 0, restBias: 0,
    Pn: 0, Pt: 0, Pnb: 0
  };
}

const _oFp = new Int32Array(2), _oPn = new Float64Array(2), _oPt = new Float64Array(2);

class Arbiter {
  constructor(a, b) {
    this.a = a; this.b = b;
    this.c = [newContactSlot(), newContactSlot()];
    this.num = 0;
    this.friction = Math.sqrt(a.friction * b.friction);
    this.restitution = Math.min(a.restitution, b.restitution);
    this.alive = true;
    this.key = 0;
  }

  /** Refresh the manifold in place (no allocation) and carry the accumulated
   *  impulses across from the matching contact features — this is what makes
   *  a deep brick stack hold together instead of sinking every frame. */
  update(count) {
    const c = this.c, oldN = this.num;
    for (let j = 0; j < oldN; j++) { _oFp[j] = c[j].fp; _oPn[j] = c[j].Pn; _oPt[j] = c[j].Pt; }
    for (let i = 0; i < count; i++) {
      const nc = c[i], src = _out[i];
      nc.px = src.px; nc.py = src.py; nc.nx = src.nx; nc.ny = src.ny;
      nc.sep = src.sep; nc.fp = src.fp;
      let pn = 0, pt = 0;
      for (let j = 0; j < oldN; j++) {
        if (_oFp[j] === src.fp) { pn = _oPn[j]; pt = _oPt[j]; break; }
      }
      nc.Pn = pn; nc.Pt = pt;
    }
    this.num = count;
  }

  preStep(invDt) {
    const a = this.a, b = this.b;
    for (let i = 0; i < this.num; i++) {
      const c = this.c[i];
      c.r1x = c.px - a.px; c.r1y = c.py - a.py;
      c.r2x = c.px - b.px; c.r2y = c.py - b.py;

      const rn1 = c.r1x * c.nx + c.r1y * c.ny;
      const rn2 = c.r2x * c.nx + c.r2y * c.ny;
      let kN = a.invMass + b.invMass;
      kN += a.invI * (c.r1x * c.r1x + c.r1y * c.r1y - rn1 * rn1)
          + b.invI * (c.r2x * c.r2x + c.r2y * c.r2y - rn2 * rn2);
      c.massN = 1 / kN;

      const tx = c.ny, ty = -c.nx;
      const rt1 = c.r1x * tx + c.r1y * ty;
      const rt2 = c.r2x * tx + c.r2y * ty;
      let kT = a.invMass + b.invMass;
      kT += a.invI * (c.r1x * c.r1x + c.r1y * c.r1y - rt1 * rt1)
          + b.invI * (c.r2x * c.r2x + c.r2y * c.r2y - rt2 * rt2);
      c.massT = 1 / kT;

      c.bias = -BIAS * invDt * Math.min(0, c.sep + SLOP);

      // restitution target from the approach velocity captured before solving
      const dvx = b.vx - b.av * c.r2y - (a.vx - a.av * c.r1y);
      const dvy = b.vy + b.av * c.r2x - (a.vy + a.av * c.r1x);
      const vn = dvx * c.nx + dvy * c.ny;
      c.restBias = vn < -REST_THRESHOLD ? this.restitution * vn : 0;

      c.Pnb = 0;
      // warm start
      const Px = c.Pn * c.nx + c.Pt * tx;
      const Py = c.Pn * c.ny + c.Pt * ty;
      a.vx -= a.invMass * Px; a.vy -= a.invMass * Py;
      a.av -= a.invI * (c.r1x * Py - c.r1y * Px);
      b.vx += b.invMass * Px; b.vy += b.invMass * Py;
      b.av += b.invI * (c.r2x * Py - c.r2y * Px);
    }
  }

  solveVelocity() {
    const a = this.a, b = this.b;
    for (let i = 0; i < this.num; i++) {
      const c = this.c[i];
      // --- normal
      let dvx = b.vx - b.av * c.r2y - (a.vx - a.av * c.r1y);
      let dvy = b.vy + b.av * c.r2x - (a.vy + a.av * c.r1x);
      let vn = dvx * c.nx + dvy * c.ny;
      let dPn = c.massN * (-vn + c.restBias);
      const Pn0 = c.Pn;
      c.Pn = Math.max(Pn0 + dPn, 0);
      dPn = c.Pn - Pn0;
      let Px = dPn * c.nx, Py = dPn * c.ny;
      a.vx -= a.invMass * Px; a.vy -= a.invMass * Py;
      a.av -= a.invI * (c.r1x * Py - c.r1y * Px);
      b.vx += b.invMass * Px; b.vy += b.invMass * Py;
      b.av += b.invI * (c.r2x * Py - c.r2y * Px);

      // --- friction (Coulomb cone against the accumulated normal impulse)
      dvx = b.vx - b.av * c.r2y - (a.vx - a.av * c.r1y);
      dvy = b.vy + b.av * c.r2x - (a.vy + a.av * c.r1x);
      const tx = c.ny, ty = -c.nx;
      const vt = dvx * tx + dvy * ty;
      let dPt = c.massT * (-vt);
      const maxPt = this.friction * c.Pn;
      const Pt0 = c.Pt;
      c.Pt = clamp(Pt0 + dPt, -maxPt, maxPt);
      dPt = c.Pt - Pt0;
      Px = dPt * tx; Py = dPt * ty;
      a.vx -= a.invMass * Px; a.vy -= a.invMass * Py;
      a.av -= a.invI * (c.r1x * Py - c.r1y * Px);
      b.vx += b.invMass * Px; b.vy += b.invMass * Py;
      b.av += b.invI * (c.r2x * Py - c.r2y * Px);
    }
  }

  solvePosition() {
    const a = this.a, b = this.b;
    for (let i = 0; i < this.num; i++) {
      const c = this.c[i];
      if (c.bias === 0) continue;
      const dvx = b.qx - b.qa * c.r2y - (a.qx - a.qa * c.r1y);
      const dvy = b.qy + b.qa * c.r2x - (a.qy + a.qa * c.r1x);
      const vn = dvx * c.nx + dvy * c.ny;
      let dP = c.massN * (c.bias - vn);
      const P0 = c.Pnb;
      c.Pnb = Math.max(P0 + dP, 0);
      dP = c.Pnb - P0;
      const Px = dP * c.nx, Py = dP * c.ny;
      a.qx -= a.invMass * Px; a.qy -= a.invMass * Py;
      a.qa -= a.invI * (c.r1x * Py - c.r1y * Px);
      b.qx += b.invMass * Px; b.qy += b.invMass * Py;
      b.qa += b.invI * (c.r2x * Py - c.r2y * Px);
    }
  }

  maxImpulse() {
    let m = 0;
    for (let i = 0; i < this.num; i++) if (this.c[i].Pn > m) m = this.c[i].Pn;
    return m;
  }
}

/* ------------------------------------------------------------------ 5. world */
const VEL_ITERS = 12;
const POS_ITERS = 5;
const SLEEP_LIN = 0.055;     // m/s
const SLEEP_ANG = 0.10;      // rad/s
const SLEEP_TIME = 0.55;     // s
const MAX_SPEED = 140;       // hard clamp for numerical safety
const CELL = 0.85;           // broadphase cell size (m)

const cmpArb = (p, q) => p.key - q.key;

class World {
  constructor(gravity) {
    this.gravity = gravity;
    this.vIters = VEL_ITERS;
    this.pIters = POS_ITERS;
    this.bodies = [];
    this.statics = [];
    this.dynamics = [];
    this.arbiters = new Map();
    this.grid = new Map();
    this.impacts = [];        // consumed by the renderer each frame
    this.time = 0;
  }

  add(b) {
    b.idx = this.bodies.length;
    this.bodies.push(b);
    (b.isStatic ? this.statics : this.dynamics).push(b);
    return b;
  }

  static canCollide(a, b) {
    if (a.isStatic && b.isStatic) return false;
    if (a.group >= 0 && b.group >= 0 && a.group !== b.group) return false; // separate wall layers
    return true;
  }

  aabb(b, out) {
    const ex = Math.abs(b.c) * b.hw + Math.abs(b.s) * b.hh;
    const ey = Math.abs(b.s) * b.hw + Math.abs(b.c) * b.hh;
    out[0] = b.px - ex; out[1] = b.py - ey; out[2] = b.px + ex; out[3] = b.py + ey;
  }

  broadphase(pairs) {
    const grid = this.grid;
    grid.clear();
    const dyn = this.dynamics;
    const box = [0, 0, 0, 0];

    for (let i = 0; i < dyn.length; i++) {
      const b = dyn[i];
      this.aabb(b, box);
      b._x0 = box[0]; b._y0 = box[1]; b._x1 = box[2]; b._y1 = box[3];
      const cx0 = Math.floor(box[0] / CELL), cx1 = Math.floor(box[2] / CELL);
      const cy0 = Math.floor(box[1] / CELL), cy1 = Math.floor(box[3] / CELL);
      for (let cx = cx0; cx <= cx1; cx++) {
        for (let cy = cy0; cy <= cy1; cy++) {
          const key = cx * 73856093 ^ cy * 19349663;
          let bucket = grid.get(key);
          if (!bucket) { bucket = []; grid.set(key, bucket); }
          bucket.push(b);
        }
      }
    }

    const seen = new Set();
    grid.forEach(bucket => {
      const n = bucket.length;
      for (let i = 0; i < n; i++) {
        const a = bucket[i];
        for (let j = i + 1; j < n; j++) {
          const b = bucket[j];
          if (!a.awake && !b.awake) continue;
          if (a._x1 < b._x0 || b._x1 < a._x0 || a._y1 < b._y0 || b._y1 < a._y0) continue;
          if (!World.canCollide(a, b)) continue;
          const lo = a.idx < b.idx ? a : b, hi = a.idx < b.idx ? b : a;
          const key = lo.idx * 65536 + hi.idx;
          if (seen.has(key)) continue;
          seen.add(key);
          pairs.push(lo, hi);
        }
      }
    });

    // dynamic ↔ static (few statics, brute force is cheapest and order-stable)
    for (let i = 0; i < dyn.length; i++) {
      const b = dyn[i];
      if (!b.awake) continue;
      for (let k = 0; k < this.statics.length; k++) {
        const s = this.statics[k];
        this.aabb(s, box);
        if (b._x1 < box[0] || box[2] < b._x0 || b._y1 < box[1] || box[3] < b._y0) continue;
        if (!World.canCollide(b, s)) continue;
        pairs.push(s.idx < b.idx ? s : b, s.idx < b.idx ? b : s);
      }
    }
  }

  step(dt) {
    const invDt = 1 / dt;
    const pairs = [];
    this.broadphase(pairs);

    // ---- narrowphase + persistent arbiters
    const arbs = this.arbiters;
    arbs.forEach(a => { a.alive = false; });

    for (let i = 0; i < pairs.length; i += 2) {
      const A = pairs[i], B = pairs[i + 1];
      const n = collide(A, B);
      const key = A.idx * 65536 + B.idx;
      let arb = arbs.get(key);
      if (n === 0) { if (arb) arbs.delete(key); continue; }

      // contact between a mover and a sleeper wakes the sleeper
      const aFast = !A.isStatic && A.awake && A.speed2() > SLEEP_LIN * SLEEP_LIN;
      const bFast = !B.isStatic && B.awake && B.speed2() > SLEEP_LIN * SLEEP_LIN;
      if (aFast && !B.isStatic && !B.awake) B.wake();
      if (bFast && !A.isStatic && !A.awake) A.wake();

      if (!arb) { arb = new Arbiter(A, B); arbs.set(key, arb); }
      const prev = arb.num;
      arb.update(n);
      arb.alive = true;
      if (prev === 0) {
        // fresh contact: record the approach speed for impact FX
        const c = arb.c[0];
        const r1x = c.px - A.px, r1y = c.py - A.py, r2x = c.px - B.px, r2y = c.py - B.py;
        const dvx = B.vx - B.av * r2y - (A.vx - A.av * r1y);
        const dvy = B.vy + B.av * r2x - (A.vy + A.av * r1x);
        const vn = -(dvx * c.nx + dvy * c.ny);
        if (vn > 1.6) {
          const mr = 1 / (A.invMass + B.invMass + 1e-9);
          this.impacts.push({ x: c.px, y: c.py, v: vn, p: vn * Math.min(mr, 900),
                              car: A.kind === KIND_CAR || B.kind === KIND_CAR });
        }
      }
    }
    arbs.forEach((a, k) => { if (!a.alive) arbs.delete(k); });

    // ---- wake propagation: a moving body drags its touching neighbours back in.
    // Several passes so a shock front travels through a resting stack in one step.
    const WAKE2 = SLEEP_LIN * SLEEP_LIN * 4;
    for (let pass = 0; pass < 3; pass++) {
      let changed = false;
      arbs.forEach(arb => {
        const A = arb.a, B = arb.b;
        if (!A.isStatic && A.awake && A.speed2() > WAKE2 && !B.isStatic && !B.awake) { B.wake(); changed = true; }
        if (!B.isStatic && B.awake && B.speed2() > WAKE2 && !A.isStatic && !A.awake) { A.wake(); changed = true; }
      });
      if (!changed) break;
    }

    // ---- integrate forces
    const g = this.gravity;
    const dyn = this.dynamics;
    for (let i = 0; i < dyn.length; i++) {
      const b = dyn[i];
      if (!b.awake) { b.fx = b.fy = b.tq = 0; continue; }
      b.vx += dt * (b.fx * b.invMass);
      b.vy += dt * (g + b.fy * b.invMass);
      b.av += dt * (b.tq * b.invI);
      b.qx = 0; b.qy = 0; b.qa = 0;
    }

    // ---- solve
    const list = [];
    arbs.forEach(a => { if (!(a.a.isStatic || !a.a.awake) || !(a.b.isStatic || !a.b.awake)) list.push(a); });

    // Order contacts bottom-up: Gauss-Seidel converges far faster when impulses
    // travel along the support chain, which is what keeps tall stacks from sinking.
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      a.key = (a.a.py < a.b.py ? a.a.py : a.b.py);
    }
    list.sort(cmpArb);

    const n = list.length;
    for (let i = 0; i < n; i++) list[i].preStep(invDt);
    // Alternating sweep direction removes the left-to-right drift a fixed
    // ordering otherwise injects into a resting wall.
    for (let it = 0; it < this.vIters; it++) {
      if (it & 1) for (let i = n - 1; i >= 0; i--) list[i].solveVelocity();
      else        for (let i = 0; i < n; i++)      list[i].solveVelocity();
    }
    for (let it = 0; it < this.pIters; it++) {
      if (it & 1) for (let i = n - 1; i >= 0; i--) list[i].solvePosition();
      else        for (let i = 0; i < n; i++)      list[i].solvePosition();
    }

    // ---- integrate positions (velocity + pseudo velocity)
    for (let i = 0; i < dyn.length; i++) {
      const b = dyn[i];
      b.fx = b.fy = b.tq = 0;
      if (!b.awake) continue;

      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPEED) { const k = MAX_SPEED / sp; b.vx *= k; b.vy *= k; }
      if (b.av > 40) b.av = 40; else if (b.av < -40) b.av = -40;

      b.px += (b.vx + b.qx) * dt;
      b.py += (b.vy + b.qy) * dt;
      b.angle += (b.av + b.qa) * dt;
      b.syncRot();
      b.qx = b.qy = b.qa = 0;

      // sleeping
      if (b.speed2() < SLEEP_LIN * SLEEP_LIN && Math.abs(b.av) < SLEEP_ANG) {
        b.sleepT += dt;
        if (b.sleepT > SLEEP_TIME) b.sleep();
      } else {
        b.sleepT = 0;
      }
    }
    this.time += dt;
  }
}

const LAUNCH_DIST = 5.0;    // sled acceleration run (m)
const COAST = 0.55;         // free-rolling gap before contact (m)

const sim = {

  car: null,
  bricks: [],

};

const fx = { particles: [], skids: [], shake: 0, flash: 0, rng: makeRng(1337), ring: [] };

/** Soft dust puff, rasterised once. A per-particle radial gradient is the obvious way
 *  to get a soft edge, but building hundreds of gradients per frame is far too slow —
 *  and a flat filled circle reads as a bubble, not as dust. */
const PUFF = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0.00, 'rgba(186,176,158,0.90)');
  rg.addColorStop(0.45, 'rgba(178,168,150,0.42)');
  rg.addColorStop(1.00, 'rgba(172,162,146,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 64, 64);
  return cv;
})();

function buildScene() {
  BODY_SEQ = 0;
  const w = new World(-S.gravity);
  // A taller stack has a longer force chain, so it needs more relaxation sweeps
  // to stay rigid; a short wall does not pay for iterations it cannot use.
  w.vIters = clamp(Math.round(8 + S.rows * 0.35), 10, 16);
  w.pIters = clamp(Math.round(3 + S.rows * 0.15), 4, 6);
  sim.world = w;
  sim.bricks = [];

  // ---- ground
  const ground = new Body({
    x: 0, y: -3, w: 4000, h: 6, isStatic: true,
    friction: S.groundFriction, restitution: 0.10, group: -1, kind: KIND_GROUND
  });
  w.add(ground);

  // ---- wall geometry
  const bw = S.brickW, bh = S.brickH;
  const wallW = S.cols * bw;
  const wallLeft = 4.0;
  sim.wallLeft = wallLeft;
  sim.wallRight = wallLeft + wallW;
  sim.wallTop = S.rows * bh;

  // Mortar joints: bodies are slightly smaller than the lattice pitch, so the wall
  // starts with clean 3 mm gaps and contacts only form once the stack compresses.
  // Horizontal joints are real gaps (bricks must be pushed together to interact),
  // but courses are laid in exact contact: any drop height would inject kinetic
  // energy into the stack at t=0 and a dry-stacked wall amplifies that.
  const jx = Math.min(0.006, bw * 0.02);
  const jy = 0;
  sim.joint = { jx, jy };

  for (let layer = 0; layer < S.layers; layer++) {
    for (let r = 0; r < S.rows; r++) {
      const y = r * bh + bh / 2;
      if (r % 2 === 0) {
        for (let ccol = 0; ccol < S.cols; ccol++) {
          addBrick(w, wallLeft + ccol * bw + bw / 2, y, bw - jx, bh - jy, S.brickMass, layer, r, ccol, false);
        }
      } else {
        // running bond: half brick, N-1 full bricks, half brick
        addBrick(w, wallLeft + bw / 4, y, bw / 2 - jx, bh - jy, S.brickMass / 2, layer, r, 0, true);
        for (let ccol = 0; ccol < S.cols - 1; ccol++) {
          addBrick(w, wallLeft + bw * (ccol + 1), y, bw - jx, bh - jy, S.brickMass, layer, r, ccol + 1, false);
        }
        addBrick(w, wallLeft + wallW - bw / 4, y, bw / 2 - jx, bh - jy, S.brickMass / 2, layer, r, S.cols, true);
      }
    }
  }
  sim.totalBrickMass = sim.bricks.reduce((s, b) => s + b.mass, 0);

  // ---- car (single rigid chassis; wheels are rendered, the collider is the hull)
  const carFrontStart = wallLeft - LAUNCH_DIST - COAST;
  const car = new Body({
    x: carFrontStart - S.carW / 2,
    y: S.carH / 2 + 0.004,
    w: S.carW, h: S.carH,
    mass: S.carMass,
    friction: S.groundFriction,
    restitution: 0.05,
    group: -1,
    kind: KIND_CAR,
    inertiaScale: 0.62      // mass concentrated low & central, as in a real vehicle
  });
  w.add(car);
  sim.car = car;

  sim.sceneLeft = car.px - S.carW / 2 - 1.2;
  sim.sceneRight = sim.wallRight + Math.max(3.5, wallW * 0.25);

  // ---- Step rate: fine enough that a fast car cannot skip past a brick, coarsened
  // for very large walls so an extreme setup still moves at a watchable rate.
  const nBodies = w.dynamics.length;
  if (nBodies > 900) {
    sim.dt = 1 / 120;
    w.vIters = Math.min(w.vIters, 10);
    w.pIters = Math.min(w.pIters, 4);
  } else if (nBodies > 400) {
    sim.dt = 1 / 150;
  } else {
    sim.dt = PHYS_DT;
  }

  // ---- Let the courses seat against each other, then park the whole structure.
  // The wall is laid at its equilibrium, so this only absorbs the few millimetres
  // of elastic compression; freezing afterwards guarantees the baseline scene is
  // perfectly static and costs nothing to simulate until the car arrives.
  for (let i = 0; i < 30; i++) w.step(sim.dt);
  for (const b of w.dynamics) b.sleep();
  for (const b of sim.bricks) { b.spawnX = b.px; b.spawnY = b.py; b.spawnA = b.angle; }
  w.impacts.length = 0;
  w.time = 0;

  // ---- reset run state
  sim.state = 'armed';
  sim.t = 0;
  sim.driving = false;
  sim.targetSpeed = S.carSpeed;
  sim.accel = (S.carSpeed * S.carSpeed) / (2 * LAUNCH_DIST);
  sim.peakG = 0;
  sim.impactKE = 0.5 * S.carMass * S.carSpeed * S.carSpeed / 1000;
  sim.crush = 0;
  sim.contactMade = false;
  sim.settleT = 0;
  sim.acc = 0;
  sim.rt = 1;

  fx.particles.length = 0;
  fx.skids.length = 0;
  fx.ring.length = 0;
  fx.shake = 0;
  fx.flash = 0;
  fx.rng = makeRng(1337);
}

function addBrick(w, x, y, bwid, bhei, mass, layer, row, col, half) {
  const b = new Body({
    x, y, w: bwid, h: bhei, mass,
    friction: S.brickFriction, restitution: S.brickRestitution,
    group: layer, kind: KIND_BRICK
  });
  b.layer = layer; b.row = row; b.col = col; b.half = half;
  b.tint = hash01(layer * 9173 + row * 131 + col * 17);
  w.add(b);
  sim.bricks.push(b);
  return b;
}

/* ------------------------------------------------------------------ 8. run loop control */
const PHYS_DT = 1 / 180;
const MAX_STEPS = 6;

function startTest() {
  if (sim.state !== 'armed') buildScene();
  sim.state = 'running';
  sim.driving = true;
  sim.t = 0;
  sim.car.wake();
}

function advance(frameDt) {
  const dt = sim.dt;
  sim.acc += frameDt;
  let steps = 0;
  while (sim.acc >= dt && steps < MAX_STEPS) {
    physicsStep(dt);
    sim.acc -= dt;
    steps++;
  }
  if (steps === MAX_STEPS) sim.acc = 0;   // shed the backlog rather than spiral
  // How much simulated time we actually delivered per second of wall clock.
  const rt = frameDt > 1e-6 ? (steps * dt) / frameDt : 1;
  sim.rt = sim.rt === undefined ? rt : lerp(sim.rt, rt, 0.1);
  return steps;
}

function physicsStep(dt) {
  const car = sim.car;
  const prevVx = car.vx;

  if (sim.state === 'running') {
    const front = car.px + S.carW / 2;
    if (sim.driving) {
      if (front >= sim.wallLeft - 0.005) {
        sim.driving = false;                       // sled released at the barrier
      } else if (car.vx < sim.targetSpeed) {
        // Launcher thrust plus the tyre drag it works against, capped so a single
        // step can never carry the sled past the requested impact velocity.
        const want = S.carMass * (sim.accel + S.groundFriction * S.gravity);
        const cap  = S.carMass * (sim.targetSpeed - car.vx) / dt;
        car.fx += Math.min(want, cap);
      } else {
        car.vx = sim.targetSpeed;                  // rail speed: exact impact velocity
      }
      car.wake();
    }
    sim.t += dt;
  }

  sim.world.step(dt);

  // telemetry: longitudinal deceleration in g
  if (sim.state === 'running' && !sim.driving) {
    const a = Math.abs((car.vx - prevVx) / dt) / 9.81;
    if (a > sim.peakG && a < 500) sim.peakG = a;
  }

  // impact events → cosmetic effects + crush accumulation
  const imps = sim.world.impacts;
  for (let i = 0; i < imps.length; i++) {
    const im = imps[i];
    if (im.car) {
      sim.contactMade = true;
      sim.crush = Math.min(S.carW * 0.22, sim.crush + im.p / (S.carMass * 26));
      fx.shake = Math.min(26, fx.shake + im.v * 0.9);
      fx.flash = Math.min(1, fx.flash + im.v * 0.03);
      // one ring per burst, not one per contact point — otherwise they stack into a bullseye
      if (fx.ring.length < 3 && (fx.ring.length === 0 || fx.ring[fx.ring.length - 1].r > 0.9)) {
        fx.ring.push({ x: im.x, y: im.y, r: 0.1, life: 1 });
      }
    }
    spawnDust(im.x, im.y, im.v, im.car);
  }
  imps.length = 0;

  // settle detection
  if (sim.state === 'running' && sim.contactMade) {
    if (movingBrickCount() === 0 && Math.abs(car.vx) < 0.12) {
      sim.settleT += dt;
      if (sim.settleT > 0.9) sim.state = 'settled';
    } else sim.settleT = 0;
  }

  // skid marks under the wheels once the car is sliding
  if (sim.contactMade && Math.abs(car.vx) > 0.35 && sim.state !== 'settled') {
    const wr = S.carH * WHEEL_R_FRAC;
    for (const f of WHEEL_F) {
      const lx = -S.carW / 2 + f * S.carW;
      const ly = -S.carH / 2 + wr;
      const x = car.px + car.c * lx - car.s * ly;
      if (fx.skids.length === 0 || Math.abs(fx.skids[fx.skids.length - 1].x - x) > 0.05) {
        fx.skids.push({ x, a: Math.min(0.55, Math.abs(car.vx) * 0.06) });
        if (fx.skids.length > 900) fx.skids.shift();
      }
    }
  }
}

function movingBrickCount() {
  let n = 0;
  const bricks = sim.bricks;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (b.awake && (b.speed2() > 0.04 || Math.abs(b.av) > 0.3)) n++;
  }
  return n;
}
/** "Standing" means the brick is still in its original course and roughly level —
 *  a wall shoved bodily backwards is displaced but has not actually come down. */
function standingCount() {
  let n = 0;
  const bricks = sim.bricks;
  const tolY = S.brickH * 0.6;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (Math.abs(b.py - b.spawnY) < tolY && Math.abs(b.angle - b.spawnA) < 0.26) n++;
  }
  return n;
}
function displacedCount() {
  let n = 0;
  const bricks = sim.bricks;
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const dx = b.px - b.spawnX, dy = b.py - b.spawnY;
    if (dx * dx + dy * dy > 0.0225 || Math.abs(b.angle - b.spawnA) > 0.14) n++;
  }
  return n;
}

/* ------------------------------------------------------------------ 9. cosmetic FX */
const MAX_PARTICLES = 520;

function spawnDust(x, y, v, isCar) {
  const rng = fx.rng;
  if (fx.particles.length >= MAX_PARTICLES) return;   // shed load, never re-pack
  if (!isCar && v < 2.6) return;                      // only real brick-on-brick hits raise dust
  const n = Math.min(isCar ? 8 : 3, Math.max(1, Math.round(v * (isCar ? 0.5 : 0.22))));
  for (let i = 0; i < n; i++) {
    const ang = rng() * Math.PI * 2;
    const sp = (0.5 + rng() * 1.6) * Math.min(6, v * 0.35);
    fx.particles.push({
      x, y,
      vx: Math.cos(ang) * sp * (isCar ? 1.3 : 0.8) - (isCar ? 0.6 : 0),
      vy: Math.abs(Math.sin(ang)) * sp * 0.85 + 0.4,
      life: 0, max: 0.50 + rng() * (isCar ? 1.0 : 0.7),
      r: (0.035 + rng() * 0.075) * (isCar ? 1.35 : 1),
      chip: rng() < (isCar ? 0.35 : 0.22),
      rot: rng() * 6.28, vr: (rng() - 0.5) * 9,
      tone: rng()
    });
  }
}

function updateFx(dt) {
  // compact in place: repeated splice() on a thousand-particle array is quadratic
  const P = fx.particles;
  let keep = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    p.life += dt;
    if (p.life >= p.max) continue;
    P[keep++] = p;
    p.vy -= (p.chip ? 9.0 : 1.4) * dt;
    p.vx *= p.chip ? 0.995 : 0.965;
    p.vy *= p.chip ? 0.999 : 0.972;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.chip && p.y < 0.02) { p.y = 0.02; p.vy = -p.vy * 0.28; p.vx *= 0.6; p.vr *= 0.5; }
    if (!p.chip) p.r += dt * 0.26;   // sole growth term; the draw call must not scale again
  }
  P.length = keep;
  for (let i = fx.ring.length - 1; i >= 0; i--) {
    const r = fx.ring[i];
    r.r += dt * 5.5; r.life -= dt * 3.0;
    if (r.life <= 0) fx.ring.splice(i, 1);
  }
  fx.shake *= Math.pow(0.0016, dt);
  fx.flash *= Math.pow(0.0005, dt);
}

/* ------------------------------------------------------------------ 10. renderer */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d', { alpha: false });
let VW = 0, VH = 0, DPR = 1;
const cam = { x: 0, y: 0, scale: 80, init: false };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
}
window.addEventListener('resize', resize);

/** Horizontal extent worth showing right now. The car can punch clean through the wall
 *  and coast for tens of metres, so a fixed scene box would leave it off-screen. */
const camXs = [];   // reused so the camera allocates nothing per frame

function actionBounds() {
  const car = sim.car;
  // Before contact the run-up is the story, so keep the whole approach in shot.
  if (sim.state === 'armed' || !sim.contactMade) {
    const lo = Math.min(sim.sceneLeft, car.px - S.carW);
    const hi = Math.max(sim.sceneRight, car.px + S.carW);
    return [lo - 1.0, hi + 1.0];
  }
  // Afterwards the launch runway is dead screen space. Frame the debris instead,
  // over a trimmed range: a couple of bricks flung far downrange must not drag the
  // whole experiment down to a smear, and a hard distance gate would clip the pile.
  const xs = camXs; xs.length = 0;
  const bricks = sim.bricks;
  for (let i = 0; i < bricks.length; i++) xs.push(bricks[i].px);
  xs.sort((p, q) => p - q);
  const trim = Math.floor(xs.length * 0.02);
  let lo = xs.length ? xs[trim] : sim.wallLeft;
  let hi = xs.length ? xs[xs.length - 1 - trim] : sim.wallRight;
  lo = Math.min(lo, car.px - S.carW, sim.wallLeft - 2.0);
  hi = Math.max(hi, car.px + S.carW, sim.wallRight + 1.0);
  return [lo - 1.5, hi + 1.5];
}

function updateCamera(dt) {
  const [lo, hi] = actionBounds();
  const spanW = hi - lo;
  const fitScale = VW / spanW;
  // Floor the zoom-out: past roughly a third of native scale the bricks stop being
  // legible, so pan across the debris field rather than shrink it into a smear.
  const scale = S.fitView ? clamp(fitScale, S.scale * 0.34, S.scale) : S.scale;
  const halfW = VW / scale / 2;

  // At native scale the action may be wider than the viewport; bias toward the car,
  // which is where the interesting part of the run always is.
  const centre = (lo + hi) / 2;
  const tx = spanW <= halfW * 2 ? centre
                                : clamp(sim.car.px * 0.55 + centre * 0.45, lo + halfW, hi - halfW);

  const groundLine = 0.80;                      // ground sits at 80% screen height
  const ty = (groundLine - 0.5) * VH / scale;

  if (!cam.init) { cam.x = tx; cam.y = ty; cam.scale = scale; cam.init = true; }
  const k = 1 - Math.pow(0.0025, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
  cam.scale = lerp(cam.scale, scale, k);
}

function render() {
  const sc = cam.scale;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawSky();

  const shakeX = fx.shake > 0.05 ? (fx.rng() - 0.5) * fx.shake : 0;
  const shakeY = fx.shake > 0.05 ? (fx.rng() - 0.5) * fx.shake * 0.6 : 0;

  ctx.save();
  ctx.translate(VW / 2 + shakeX, VH / 2 + shakeY);
  ctx.scale(sc, -sc);
  ctx.translate(-cam.x, -cam.y);

  const viewL = cam.x - VW / sc / 2 - 2, viewR = cam.x + VW / sc / 2 + 2;

  drawBackdrop(viewL, viewR, sc);
  drawGround(viewL, viewR, sc);
  drawSkids(sc);

  // wall layers painted back-to-front for a 2.5D read
  for (let layer = S.layers - 1; layer >= 0; layer--) drawLayer(layer, sc);

  drawParticles(sc, true);
  drawCar(sc);
  drawParticles(sc, false);
  drawRings(sc);

  ctx.restore();

  drawOverlay(sc);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0a0d15');
  g.addColorStop(0.55, '#131a27');
  g.addColorStop(1, '#1b2331');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  if (fx.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,196,140,' + (fx.flash * 0.08).toFixed(3) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* layer visual offset (recedes up-right) */
const LOX = 0.17, LOY = 0.095;

function drawBackdrop(viewL, viewR, sc) {
  const lw = 1 / sc;
  // horizon haze band
  ctx.fillStyle = 'rgba(90,120,160,0.05)';
  ctx.fillRect(viewL, 0, viewR - viewL, 9);

  // distant hangar structure
  ctx.fillStyle = 'rgba(255,255,255,0.028)';
  const bx = Math.floor(viewL / 6) * 6;
  for (let x = bx; x < viewR; x += 6) {
    ctx.fillRect(x, 0, 0.22, 6.6);
  }
  ctx.fillRect(viewL, 6.4, viewR - viewL, 0.16);
  ctx.fillRect(viewL, 3.2, viewR - viewL, 0.06);

  // measurement posts every 5 m
  ctx.lineWidth = lw;
  ctx.strokeStyle = 'rgba(120,150,190,0.13)';
  const p0 = Math.ceil(viewL / 5) * 5;
  for (let x = p0; x < viewR; x += 5) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 2.4); ctx.stroke();
    ctx.fillStyle = 'rgba(120,150,190,0.18)';
    ctx.fillRect(x - 0.16, 2.4, 0.32, 0.09);
  }
}

function drawGround(viewL, viewR, sc) {
  const lw = 1 / sc;

  // receding pads for the back layers
  for (let l = S.layers - 1; l >= 1; l--) {
    const shade = 0.055 + 0.03 * (1 - l / S.layers);
    ctx.fillStyle = 'rgba(150,170,200,' + shade.toFixed(3) + ')';
    ctx.fillRect(viewL, l * LOY, viewR - viewL, 0.08);
  }

  const g = ctx.createLinearGradient(0, 0, 0, -3);
  g.addColorStop(0, '#2b3240');
  g.addColorStop(1, '#171c25');
  ctx.fillStyle = g;
  ctx.fillRect(viewL, -6, viewR - viewL, 6);

  // surface line
  ctx.fillStyle = '#3c4657';
  ctx.fillRect(viewL, -0.035, viewR - viewL, 0.035);

  // metre ticks
  ctx.lineWidth = lw;
  const m0 = Math.ceil(viewL);
  for (let x = m0; x < viewR; x++) {
    const major = x % 5 === 0;
    ctx.strokeStyle = major ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.moveTo(x, -0.05);
    ctx.lineTo(x, -(major ? 0.34 : 0.17));
    ctx.stroke();
  }

  // launch lane dashes
  ctx.strokeStyle = 'rgba(255,180,60,0.16)';
  ctx.lineWidth = 0.045;
  ctx.setLineDash([0.5, 0.42]);
  ctx.beginPath();
  ctx.moveTo(sim.sceneLeft, -0.55);
  ctx.lineTo(sim.wallLeft - 0.1, -0.55);
  ctx.stroke();
  ctx.setLineDash([]);

  // barrier reference line at the wall face
  ctx.strokeStyle = 'rgba(255,107,61,0.30)';
  ctx.lineWidth = 0.025;
  ctx.setLineDash([0.16, 0.16]);
  ctx.beginPath();
  ctx.moveTo(sim.wallLeft, 0);
  ctx.lineTo(sim.wallLeft, sim.wallTop + 1.1);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawSkids(sc) {
  ctx.fillStyle = '#000';
  for (let i = 0; i < fx.skids.length; i++) {
    const s = fx.skids[i];
    ctx.globalAlpha = s.a * 0.55;
    ctx.fillRect(s.x - 0.06, 0.001, 0.12, 0.045);
  }
  ctx.globalAlpha = 1;
}

const BRICK_BASE = [
  [172, 78, 58], [186, 90, 66], [156, 66, 48], [198, 104, 74], [164, 84, 62]
];

function drawLayer(layer, sc) {
  const ox = layer * LOX, oy = layer * LOY;
  const depth = layer / Math.max(1, S.layers);
  const dim = 1 - depth * 0.55;
  const lw = 1 / sc;
  const bricks = sim.bricks;
  const viewL = cam.x - VW / sc / 2 - 2, viewR = cam.x + VW / sc / 2 + 2;

  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (b.layer !== layer) continue;
    const x = b.px + ox, y = b.py + oy;
    if (x < viewL - 1 || x > viewR + 1 || y < -1.5) continue;

    const t = b.tint;
    const base = BRICK_BASE[(i + layer) % BRICK_BASE.length];
    const j = (t - 0.5) * 22;
    const r = clamp((base[0] + j) * dim, 0, 255) | 0;
    const gg = clamp((base[1] + j * 0.8) * dim, 0, 255) | 0;
    const bl = clamp((base[2] + j * 0.7) * dim, 0, 255) | 0;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.angle);

    const hw = b.hw, hh = b.hh;
    // mortar / joint outline
    ctx.fillStyle = 'rgba(214,208,196,' + (0.55 * dim).toFixed(3) + ')';
    ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
    // face
    ctx.fillStyle = 'rgb(' + r + ',' + gg + ',' + bl + ')';
    const inset = Math.min(0.012, hh * 0.12);
    ctx.fillRect(-hw + inset, -hh + inset, (hw - inset) * 2, (hh - inset) * 2);
    // top highlight + bottom shade
    ctx.fillStyle = 'rgba(255,255,255,' + (0.11 * dim).toFixed(3) + ')';
    ctx.fillRect(-hw + inset, hh - inset - hh * 0.30, (hw - inset) * 2, hh * 0.30);
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(-hw + inset, -hh + inset, (hw - inset) * 2, hh * 0.26);
    // subtle texture speckle (static per brick, no per-frame randomness)
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(-hw + inset + (hw * 2 - inset * 2) * (0.25 + t * 0.4), -hh * 0.2, hw * 0.22, hh * 0.22);

    if (!b.awake) {
      // settled bricks read slightly cooler
      ctx.fillStyle = 'rgba(10,16,28,0.10)';
      ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
    }
    ctx.restore();
  }

  // depth shading between layers
  if (layer > 0) {
    ctx.fillStyle = 'rgba(6,10,18,' + (0.10 * depth).toFixed(3) + ')';
    ctx.fillRect(cam.x - VW / sc, -0.2, VW / sc * 2, sim.wallTop + 2);
  }
}

/* ---- car ---- */
// Wheel geometry lives here because three places need it: the renderer, the skid
// marks and the rolling animation. As fractions of overall car height / length.
const WHEEL_R_FRAC = 0.21;          // 0.61 m diameter on the 1.45 m default car
const WHEEL_F = [0.215, 0.795];     // axle positions along the body


// f = fraction from tail (0) to nose (1); g = fraction from floor (0) to roof (1).
// Beltline sits at ~0.56 so the greenhouse stays car-shaped rather than van-shaped.
const CAR_OUTLINE = [
  [0.015, 0.140], [0.985, 0.145], [1.000, 0.330], [0.975, 0.470],
  [0.880, 0.545], [0.700, 0.580], [0.520, 0.975], [0.320, 1.000],
  [0.175, 0.640], [0.015, 0.560]
];

function carPoint(f, g, hw, hh, crushAmt) {
  let x = -hw + f * (hw * 2);
  const y = -hh + g * (hh * 2);
  if (f > 0.55) {
    const k = (f - 0.55) / 0.45;
    // crush concentrates at the bumper/hood level
    const heightW = g < 0.55 ? 1 : Math.max(0, 1 - (g - 0.55) * 2.2);
    x -= crushAmt * k * k * heightW;
  }
  return [x, y];
}

function drawCar(sc) {
  const car = sim.car;
  const hw = car.hw, hh = car.hh;
  const lw = 1 / sc;
  const crushAmt = sim.crush;

  ctx.save();
  ctx.translate(car.px, car.py);
  ctx.rotate(car.angle);

  const wr = S.carH * WHEEL_R_FRAC;
  const wheelF = WHEEL_F;

  // ground contact shadow
  ctx.save();
  ctx.rotate(-car.angle);
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  const sy = -car.py + 0.01;
  ctx.beginPath();
  ctx.ellipse(0, sy, hw * 1.02, hh * 0.10, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();

  // --- underbody rail (fills the gap between the sill and the ground).
  // Kept darker than the tyres so the running gear stays readable against it.
  ctx.fillStyle = '#0d1016';
  ctx.fillRect(-hw + 0.10, -hh, hw * 2 - 0.20, hh * 0.20);

  // --- body shell
  ctx.beginPath();
  for (let i = 0; i < CAR_OUTLINE.length; i++) {
    const p = carPoint(CAR_OUTLINE[i][0], CAR_OUTLINE[i][1], hw, hh, crushAmt);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();

  const bg = ctx.createLinearGradient(0, -hh, 0, hh);
  bg.addColorStop(0, '#c9ced6');
  bg.addColorStop(0.42, '#eef1f5');
  bg.addColorStop(1, '#9aa2ae');
  ctx.fillStyle = bg;
  ctx.fill();

  ctx.save();
  ctx.clip();

  // crash-test livery: two coarse 2x2 targets on the flank, not a fine repeating strip
  const cell = hh * 0.33;
  const bandY0 = -hh + hh * 2 * 0.21;
  // starts chosen so both targets clear the wheel arches; a half-covered target
  // reads as damage rather than as a marker
  for (const start of [0.300, 0.585]) {
    const x0 = -hw + start * hw * 2;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#141821' : '#f4f6f9';
      ctx.fillRect(x0 + c * cell, bandY0 + r * cell, cell, cell);
    }
    // outline, or the white cells vanish into the white flank and the target
    // reads as two unrelated dark squares
    ctx.strokeStyle = 'rgba(20,24,33,0.55)';
    ctx.lineWidth = lw;
    ctx.strokeRect(x0, bandY0, cell * 2, cell * 2);
  }
  // shoulder crease along the beltline
  ctx.strokeStyle = 'rgba(30,36,48,0.28)';
  ctx.lineWidth = lw * 1.6;
  const cr0 = carPoint(0.03, 0.545, hw, hh, crushAmt);
  const cr1 = carPoint(0.90, 0.520, hw, hh, crushAmt);
  ctx.beginPath(); ctx.moveTo(cr0[0], cr0[1]); ctx.lineTo(cr1[0], cr1[1]); ctx.stroke();
  // door seams
  ctx.strokeStyle = 'rgba(30,36,48,0.35)';
  ctx.lineWidth = lw * 1.4;
  for (const f of [0.205, 0.505]) {
    const x = -hw + f * hw * 2;
    ctx.beginPath(); ctx.moveTo(x, -hh + hh * 0.25); ctx.lineTo(x, hh * 0.30); ctx.stroke();
  }
  // crumple creases proportional to accumulated damage
  if (crushAmt > 0.01) {
    ctx.strokeStyle = 'rgba(40,46,58,0.5)';
    ctx.lineWidth = lw * 1.6;
    for (let i = 0; i < 5; i++) {
      const g0 = 0.18 + i * 0.07;
      const a = carPoint(1.0, g0, hw, hh, crushAmt);
      const bpt = carPoint(0.70 + i * 0.02, g0 + 0.04, hw, hh, crushAmt);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(bpt[0], bpt[1]); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(30,36,48,' + Math.min(0.30, crushAmt * 0.9).toFixed(3) + ')';
    const q = carPoint(0.72, 0.15, hw, hh, crushAmt);
    ctx.fillRect(q[0], -hh, hw - q[0] + crushAmt, hh * 2 * 0.5);
  }
  ctx.restore();

  // cabin glass
  ctx.beginPath();
  const glass = [[0.678, 0.618], [0.528, 0.938], [0.338, 0.960], [0.212, 0.648]];
  for (let i = 0; i < glass.length; i++) {
    const p = carPoint(glass[i][0], glass[i][1], hw, hh, crushAmt);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  const gg2 = ctx.createLinearGradient(0, hh * 0.1, 0, hh);
  gg2.addColorStop(0, '#3d4d63');
  gg2.addColorStop(1, '#6d8199');
  ctx.fillStyle = gg2;
  ctx.fill();

  // B-pillar
  ctx.fillStyle = '#cdd3db';
  const bp0 = carPoint(0.462, 0.630, hw, hh, crushAmt);
  const bp1 = carPoint(0.438, 0.950, hw, hh, crushAmt);
  ctx.beginPath();
  ctx.moveTo(bp0[0] - hw * 0.02, bp0[1]);
  ctx.lineTo(bp0[0] + hw * 0.02, bp0[1]);
  ctx.lineTo(bp1[0] + hw * 0.02, bp1[1]);
  ctx.lineTo(bp1[0] - hw * 0.02, bp1[1]);
  ctx.closePath();
  ctx.fill();

  // --- running gear: arches then wheels, painted over the flank so they stay visible.
  // The arch discs are clipped to the hull so nothing spills below the tyre contact patch.
  ctx.save();
  ctx.beginPath(); ctx.rect(-hw, -hh, hw * 2, hh * 2); ctx.clip();
  ctx.fillStyle = '#171b23';
  for (const f of wheelF) {
    const cxw = -hw + f * hw * 2;
    ctx.beginPath(); ctx.arc(cxw, -hh + wr, wr * 1.26, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  for (const f of wheelF) {
    drawWheel(-hw + f * hw * 2, -hh + wr, wr, car, sc);
  }

  // outline
  ctx.beginPath();
  for (let i = 0; i < CAR_OUTLINE.length; i++) {
    const p = carPoint(CAR_OUTLINE[i][0], CAR_OUTLINE[i][1], hw, hh, crushAmt);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(20,26,36,0.75)';
  ctx.lineWidth = lw * 1.6;
  ctx.stroke();

  // headlight + bumper
  const hl = carPoint(0.938, 0.438, hw, hh, crushAmt);
  ctx.fillStyle = sim.contactMade ? '#5d6472' : '#ffe9b0';
  ctx.beginPath();
  ctx.ellipse(hl[0], hl[1], hw * 0.048, hh * 0.075, 0, 0, 6.2832);
  ctx.fill();
  if (!sim.contactMade) {
    // soft halo only — a projected cone reads as a flat grey wedge against the
    // dark hall and adds nothing to a daylit side view
    const halo = ctx.createRadialGradient(hl[0], hl[1], 0, hl[0], hl[1], hh * 0.42);
    halo.addColorStop(0, 'rgba(255,226,152,0.34)');
    halo.addColorStop(1, 'rgba(255,226,152,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(hl[0], hl[1], hh * 0.42, 0, 6.2832);
    ctx.fill();
  }
  const bm0 = carPoint(1.0, 0.17, hw, hh, crushAmt);
  const bm1 = carPoint(1.0, 0.32, hw, hh, crushAmt);
  ctx.strokeStyle = '#2a3040';
  ctx.lineWidth = hh * 0.09;
  ctx.beginPath(); ctx.moveTo(bm0[0], bm0[1]); ctx.lineTo(bm1[0], bm1[1]); ctx.stroke();

  ctx.restore();
}

function drawWheel(cx, cy, r, car, sc) {
  const lw = 1 / sc;
  ctx.save();
  ctx.translate(cx, cy);
  // wheels spin with forward travel
  ctx.rotate(-car.wheelSpin || 0);
  ctx.fillStyle = '#3a4049';           // tread band
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#252a33';           // sidewall
  ctx.beginPath(); ctx.arc(0, 0, r * 0.90, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#aeb6c2';           // rim face
  ctx.beginPath(); ctx.arc(0, 0, r * 0.56, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = '#6c7583';
  ctx.lineWidth = r * 0.10;
  for (let i = 0; i < 5; i++) {
    const a = i * 1.2566;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.14, Math.sin(a) * r * 0.14);
    ctx.lineTo(Math.cos(a) * r * 0.48, Math.sin(a) * r * 0.48);
    ctx.stroke();
  }
  ctx.fillStyle = '#c8ced8';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawParticles(sc, behind) {
  const P = fx.particles;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    if (p.chip === behind) continue;   // chips in front, dust behind
    const t = p.life / p.max;
    // dust ramps in then fades; a flat (1-t) at high alpha stacks into an opaque wall
    const a = p.chip ? 0.95 * Math.min(1, (1 - t) * 3)
                     : 0.30 * (1 - t) * Math.min(1, t * 6);
    if (p.chip) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const c = 120 + p.tone * 70 | 0;
      ctx.fillStyle = 'rgba(' + c + ',' + (c * 0.5 | 0) + ',' + (c * 0.38 | 0) + ',' + a.toFixed(3) + ')';
      ctx.fillRect(-p.r * 0.7, -p.r * 0.45, p.r * 1.4, p.r * 0.9);
      ctx.restore();
    } else {
      ctx.globalAlpha = a * (0.75 + p.tone * 0.5);
      ctx.drawImage(PUFF, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      ctx.globalAlpha = 1;
    }
  }
}

function drawRings(sc) {
  for (let i = 0; i < fx.ring.length; i++) {
    const r = fx.ring[i];
    ctx.strokeStyle = 'rgba(255,190,130,' + (r.life * 0.20).toFixed(3) + ')';
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, 6.2832);
    ctx.stroke();
  }
}

function drawOverlay(sc) {
  // vignette
  const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.36,
                                     VW / 2, VH / 2, Math.max(VW, VH) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // scale bar
  const px = cam.scale;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = '#cdd6e4';
  ctx.lineWidth = 1;
  const x0 = 22, y0 = VH - 58, len = px;
  ctx.beginPath();
  ctx.moveTo(x0, y0 - 4); ctx.lineTo(x0, y0 + 4);
  ctx.moveTo(x0, y0); ctx.lineTo(x0 + len, y0);
  ctx.moveTo(x0 + len, y0 - 4); ctx.lineTo(x0 + len, y0 + 4);
  ctx.stroke();
  ctx.fillStyle = '#cdd6e4';
  ctx.font = '10px ui-monospace,Menlo,monospace';
  ctx.fillText('1 m  ·  ' + Math.round(cam.scale) + ' px/m', x0, y0 - 9);
  ctx.restore();
}

/* ------------------------------------------------------------------ 11. UI */
const el = id => document.getElementById(id);
const fieldRefs = {};

/** Rebuilding a 2000-brick wall is not free, so a slider drag coalesces into one
 *  rebuild per frame instead of one per input event. */
let rebuildQueued = false;
function requestRebuild() {
  if (rebuildQueued) return;
  rebuildQueued = true;
  requestAnimationFrame(() => { rebuildQueued = false; buildScene(); updateHud(); });
}

function buildFields() {
  const host = el('fields');
  host.innerHTML = '';
  for (const sp of SPECS) {
    if (sp.g) {
      const h = document.createElement('div');
      h.className = 'grp';
      h.textContent = sp.g;
      host.appendChild(h);
      continue;
    }
    const wrap = document.createElement('div');
    wrap.className = 'fld';
    const lab = document.createElement('div');
    lab.className = 'lab';
    const nm = document.createElement('span'); nm.textContent = sp.label;
    const val = document.createElement('span'); val.className = 'val';
    lab.appendChild(nm); lab.appendChild(val);
    const rng = document.createElement('input');
    rng.type = 'range';
    rng.min = sp.min; rng.max = sp.max; rng.step = sp.step;
    rng.value = S[sp.k];
    rng.addEventListener('input', () => {
      S[sp.k] = parseFloat(rng.value);
      syncField(sp);
      cam.init = false;
      if (sp.k !== 'scale') requestRebuild();
      updateHud(true);
    });
    wrap.appendChild(lab); wrap.appendChild(rng);
    host.appendChild(wrap);
    fieldRefs[sp.k] = { rng, val, sp };
    syncField(sp);
  }

  // fit-view toggle
  const c = document.createElement('label');
  c.className = 'chk';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = S.fitView;
  cb.addEventListener('change', () => { S.fitView = cb.checked; cam.init = false; });
  const sp2 = document.createElement('span');
  sp2.textContent = 'Fit whole scene in view';
  c.appendChild(cb); c.appendChild(sp2);
  el('fields').appendChild(c);
  fieldRefs.fitView = { cb };

  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'Every change rebuilds the wall and re-arms the sled. Identical settings always reproduce the identical crash — the solver contains no randomness.';
  el('fields').appendChild(note);
}

function syncField(sp) {
  const r = fieldRefs[sp.k];
  if (!r) return;
  r.rng.value = S[sp.k];
  r.val.innerHTML = Number(S[sp.k]).toFixed(sp.dec) + (sp.unit ? ' <i>' + sp.unit + '</i>' : '');
}
function syncAllFields() {
  for (const sp of SPECS) if (sp.k) syncField(sp);
  if (fieldRefs.fitView) fieldRefs.fitView.cb.checked = S.fitView;
}

function updateHud(force) {
  const car = sim.car;
  const spd = Math.hypot(car.vx, car.vy);
  el('tSpeed').textContent = spd.toFixed(2) + ' m/s';
  el('tTime').textContent = sim.t.toFixed(3) + ' s';
  el('tMoving').textContent = String(movingBrickCount());
  const d = displacedCount();
  el('tDisp').textContent = d + ' / ' + sim.bricks.length;
  el('tKE').textContent = sim.impactKE.toFixed(0) + ' kJ';
  el('tG').textContent = sim.peakG.toFixed(1) + ' g';
  el('tStand').textContent = Math.round(100 * standingCount() / Math.max(1, sim.bricks.length)) + '%';
  el('tMass').textContent = sim.totalBrickMass.toFixed(1) + ' kg';
  const hz = Math.round(1 / sim.dt);
  const rt = sim.rt === undefined ? 1 : sim.rt;
  el('tSolver').textContent = hz + ' Hz' + (rt < 0.9 ? '  ×' + rt.toFixed(2) : '');

  const b = el('state');
  if (sim.state === 'armed') { b.textContent = 'ARMED'; b.className = 'badge armed'; }
  else if (sim.state === 'running') { b.textContent = 'RUNNING'; b.className = 'badge run'; }
  else { b.textContent = 'SETTLED'; b.className = 'badge done'; }
  el('btnTest').disabled = sim.state === 'running' && !sim.contactMade;
}

el('btnTest').addEventListener('click', () => { startTest(); });
el('btnReset').addEventListener('click', () => { buildScene(); cam.init = false; updateHud(); });
el('btnSettings').addEventListener('click', () => el('panel').classList.toggle('open'));
el('btnClose').addEventListener('click', () => el('panel').classList.remove('open'));
el('btnSlow').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
  e.currentTarget.setAttribute('aria-pressed', String(!on));
});
el('btnDefaults').addEventListener('click', () => {
  Object.assign(S, DEFAULTS);
  syncAllFields();
  buildScene();
  cam.init = false;
  updateHud();
});
window.addEventListener('keydown', e => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); startTest(); }
  else if (e.key === 'r' || e.key === 'R') { buildScene(); cam.init = false; }
  else if (e.key === 's' || e.key === 'S') el('panel').classList.toggle('open');
});

/* ------------------------------------------------------------------ 12. main loop */
let last = 0, hudAcc = 0;

function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);

  const slow = el('btnSlow').getAttribute('aria-pressed') === 'true';
  const simDt = slow ? dt * 0.22 : dt;

  advance(simDt);
  updateFx(simDt);

  // wheel rotation for rendering only
  const car = sim.car;
  car.wheelSpin = (car.wheelSpin || 0) + car.vx / (S.carH * WHEEL_R_FRAC) * simDt;

  updateCamera(dt);
  render();

  hudAcc += dt;
  if (hudAcc > 0.07) { hudAcc = 0; updateHud(); }

  requestAnimationFrame(frame);
}

resize();
buildFields();
buildScene();
updateHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
