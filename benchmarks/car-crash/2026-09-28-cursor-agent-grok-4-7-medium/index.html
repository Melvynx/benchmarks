<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok 4.7</title>
<style>
  :root {
    --bg: #12161c;
    --panel: rgba(16, 20, 26, 0.9);
    --line: rgba(255, 214, 150, 0.22);
    --ink: #edf1f4;
    --muted: #9aa6b2;
    --amber: #f0a202;
    --amber-2: #ffc857;
    --danger: #e85d4c;
    --ok: #7dcea0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  h1 {
    position: fixed;
    top: 16px;
    left: 20px;
    margin: 0;
    z-index: 3;
    font-size: 28px;
    letter-spacing: 0.01em;
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
  }
  .panel {
    position: fixed;
    top: 14px;
    right: 14px;
    width: min(340px, calc(100vw - 28px));
    z-index: 4;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.28);
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-2);
    font-weight: 700;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    margin: 6px 0;
    font-size: 13px;
  }
  .row span { color: var(--muted); }
  .row b {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 650;
    color: var(--ink);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--amber);
    margin: 0;
  }
  .constants {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: var(--muted);
  }
  .constants b {
    color: #d5dde4;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .hud {
    position: fixed;
    left: 18px;
    bottom: 18px;
    z-index: 4;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px 9px;
    min-width: 112px;
    backdrop-filter: blur(8px);
  }
  .stat em {
    display: block;
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat strong {
    display: block;
    margin-top: 2px;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 680;
  }
  .controls {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 4;
    display: flex;
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 12px 22px;
    font: inherit;
    font-weight: 750;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  #testBtn {
    background: var(--amber);
    color: #1a1203;
    min-width: 132px;
    font-size: 18px;
    box-shadow: 0 8px 24px rgba(240, 162, 2, 0.28);
  }
  #testBtn.dirty { outline: 2px solid white; }
  #resetBtn {
    background: rgba(255,255,255,0.08);
    color: var(--ink);
    border: 1px solid rgba(255,255,255,0.14);
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  .status {
    position: fixed;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    z-index: 4;
    background: rgba(10, 12, 16, 0.78);
    border: 1px solid var(--line);
    color: var(--amber-2);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 750;
  }
  .scalebar {
    position: fixed;
    left: 18px;
    bottom: 92px;
    z-index: 3;
    color: #d7dee6;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .scalebar i {
    display: block;
    width: 80px;
    height: 8px;
    border: 1.5px solid #f4f7fa;
    border-top: 0;
    margin-bottom: 3px;
  }
</style>
</head>
<body>
<h1>Grok 4.7</h1>
<div class="status" id="status">Armed</div>
<canvas id="view"></canvas>
<aside class="panel">
  <h2>Experiment settings</h2>
  <label class="row"><span>Car speed</span><b id="labSpeed">22 m/s</b></label>
  <input id="inSpeed" type="range" min="5" max="45" step="1" value="22">
  <label class="row"><span>Wall columns</span><b id="labCols">12</b></label>
  <input id="inCols" type="range" min="4" max="24" step="1" value="12">
  <label class="row"><span>Wall rows</span><b id="labRows">8</b></label>
  <input id="inRows" type="range" min="3" max="16" step="1" value="8">
  <label class="row"><span>Wall depth layers</span><b id="labLayers">2</b></label>
  <input id="inLayers" type="range" min="1" max="5" step="1" value="2">
  <label class="row"><span>Brick mass</span><b id="labMass">2.5 kg</b></label>
  <input id="inMass" type="range" min="0.5" max="12" step="0.1" value="2.5">
  <div class="constants">
    <div>Gravity <b>9.81</b></div>
    <div>Brick μ <b>0.72</b></div>
    <div>Brick e <b>0.18</b></div>
    <div>Ground μ <b>0.85</b></div>
    <div>Car mass <b>1250 kg</b></div>
    <div>Car size <b>4.2×1.45 m</b></div>
    <div>Brick size <b>0.50×0.24 m</b></div>
    <div>Scale <b>80 px/m</b></div>
  </div>
</aside>
<div class="hud">
  <div class="stat"><em>Car speed</em><strong id="telSpeed">0.00</strong></div>
  <div class="stat"><em>Elapsed</em><strong id="telTime">0.00 s</strong></div>
  <div class="stat"><em>Moving bricks</em><strong id="telMove">0</strong></div>
  <div class="stat"><em>Impact speed</em><strong id="telImpact">—</strong></div>
</div>
<div class="scalebar"><i></i>1 m · 80 px</div>
<div class="controls">
  <button id="resetBtn" type="button">Reset</button>
  <button id="testBtn" type="button">Test</button>
</div>
<script>
"use strict";

const SCALE = 80;
const GRAVITY = 9.81;
const BRICK_FRICTION = 0.72;
const BRICK_RESTITUTION = 0.18;
const GROUND_FRICTION = 0.85;
const CAR_MASS = 1250;
const CAR_L = 4.2;
const CAR_H = 1.45;
const CAR_W = 1.9;
const BRICK_L = 0.5;
const BRICK_H = 0.24;
const Z_SHEAR = 58;
const RUNWAY = 7.2;
const SLOP = 0.0035;
const REST_THRESH = 0.45;

const PALETTE = ["#a34432", "#b5523c", "#8d3a2e", "#c46245", "#7a332b", "#9a4636", "#b86a48", "#6e2e28"];

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

const ui = {
  speed: document.getElementById("inSpeed"),
  cols: document.getElementById("inCols"),
  rows: document.getElementById("inRows"),
  layers: document.getElementById("inLayers"),
  mass: document.getElementById("inMass"),
  labSpeed: document.getElementById("labSpeed"),
  labCols: document.getElementById("labCols"),
  labRows: document.getElementById("labRows"),
  labLayers: document.getElementById("labLayers"),
  labMass: document.getElementById("labMass"),
  telSpeed: document.getElementById("telSpeed"),
  telTime: document.getElementById("telTime"),
  telMove: document.getElementById("telMove"),
  telImpact: document.getElementById("telImpact"),
  status: document.getElementById("status"),
  test: document.getElementById("testBtn"),
  reset: document.getElementById("resetBtn"),
};

let viewW = 1280, viewH = 720, groundScreen = 560, dpr = 1;
let camX = 0, camShake = 0, shakeT = 0;
let bodies = [];
let car = null;
let wallFaceX = 0;
let brickCount = 0;
let particles = [];
let skids = [];
let impulseCache = new Map();
let applied = readSettings();
let phase = "armed";
let simTime = 0;
let impactSpeed = null;
let driving = false;
let crumple = 0;
let lastImpact = 0;
let acc = 0;
let lastNow = 0;
let supportTick = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function readSettings() {
  return {
    speed: clamp(+ui.speed.value, 5, 45),
    columns: clamp(ui.cols.value | 0, 4, 24),
    rows: clamp(ui.rows.value | 0, 3, 16),
    layers: clamp(ui.layers.value | 0, 1, 5),
    mass: clamp(+ui.mass.value, 0.5, 12),
  };
}
function syncLabels() {
  const s = readSettings();
  ui.labSpeed.textContent = s.speed.toFixed(0) + " m/s";
  ui.labCols.textContent = String(s.columns);
  ui.labRows.textContent = String(s.rows);
  ui.labLayers.textContent = String(s.layers);
  ui.labMass.textContent = s.mass.toFixed(1) + " kg";
  const dirty = s.speed !== applied.speed || s.columns !== applied.columns || s.rows !== applied.rows || s.layers !== applied.layers || Math.abs(s.mass - applied.mass) > 1e-9;
  ui.test.classList.toggle("dirty", dirty && phase !== "armed");
}

function makeBody(opts) {
  const w = opts.w, h = opts.h, d = opts.d;
  const mass = opts.mass;
  const invMass = opts.fixed ? 0 : 1 / mass;
  const inertia = opts.fixed ? 0 : mass * (w * w + h * h) / 12;
  return {
    id: opts.id,
    type: opts.type,
    x: opts.x, y: opts.y, z: opts.z,
    a: 0,
    vx: 0, vy: 0, vz: 0, w: 0,
    hx: w / 2, hy: h / 2, hz: d / 2,
    mass, invMass,
    invI: inertia > 0 ? 1 / inertia : 0,
    sleeping: true,
    sleepT: 0,
    color: opts.color || "#888",
    rad: Math.hypot(w / 2, h / 2) + 0.02,
    onGround: false,
  };
}

function buildWorld(launch) {
  applied = readSettings();
  ui.speed.value = String(applied.speed);
  ui.cols.value = String(applied.columns);
  ui.rows.value = String(applied.rows);
  ui.layers.value = String(applied.layers);
  ui.mass.value = String(applied.mass);
  syncLabels();

  bodies = [];
  particles = [];
  skids = [];
  impulseCache = new Map();
  simTime = 0;
  impactSpeed = null;
  crumple = 0;
  camShake = 0;
  acc = 0;
  driving = !!launch;
  phase = launch ? "run" : "armed";

  const carX = 1.15 + CAR_L / 2;
  wallFaceX = carX + CAR_L / 2 + RUNWAY;

  car = makeBody({
    id: 1,
    type: "car",
    x: carX,
    y: CAR_H / 2,
    z: 0,
    w: CAR_L,
    h: CAR_H,
    d: CAR_W,
    mass: CAR_MASS,
    fixed: false,
    color: "#d8dee6",
  });
  car.sleeping = !launch;
  bodies.push(car);

  const cols = applied.columns;
  const rows = applied.rows;
  const layers = applied.layers;
  const extra = BRICK_L * 0.5;
  const totalZ = cols * BRICK_L + extra;
  const z0 = -totalZ / 2;
  let id = 2;
  for (let layer = 0; layer < layers; layer++) {
    for (let row = 0; row < rows; row++) {
      const rowOff = (row % 2) * extra;
      const layerOff = (layer % 2) * extra;
      for (let col = 0; col < cols; col++) {
        const z = z0 + rowOff + layerOff + (col + 0.5) * BRICK_L;
        const y = (row + 0.5) * BRICK_H;
        const x = wallFaceX + (layer + 0.5) * BRICK_L;
        const color = PALETTE[(layer * 5 + row * 3 + col) % PALETTE.length];
        bodies.push(makeBody({
          id: id++,
          type: "brick",
          x, y, z,
          w: BRICK_L,
          h: BRICK_H,
          d: BRICK_L,
          mass: applied.mass,
          color,
        }));
      }
    }
  }
  brickCount = bodies.length - 1;
  frameCamera(1);
}

function carNoseX() {
  const c = Math.cos(car.a), s = Math.sin(car.a);
  return car.x + car.hx * c;
}

function applyDrive(dt) {
  const dist = Math.max(0.04, wallFaceX - carNoseX());
  const tgt = applied.speed;
  const v = car.vx;
  if (v >= tgt - 1e-4) {
    car.vx = tgt;
    return;
  }
  const accel = clamp((tgt * tgt - v * v) / (2 * dist), 0, 220);
  car.vx = Math.min(tgt, v + accel * dt);
}

function corners2d(b) {
  const c = Math.cos(b.a), s = Math.sin(b.a);
  const hx = b.hx, hy = b.hy;
  const locs = [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]];
  const out = new Array(4);
  for (let i = 0; i < 4; i++) {
    const lx = locs[i][0], ly = locs[i][1];
    out[i] = [b.x + lx * c - ly * s, b.y + lx * s + ly * c];
  }
  return out;
}

function sat2d(a, b, pa, pb) {
  let best = Infinity, nx = 0, ny = 1;
  for (let pass = 0; pass < 2; pass++) {
    const pts = pass === 0 ? pa : pb;
    for (let i = 0; i < 4; i++) {
      const p1 = pts[i], p2 = pts[(i + 1) % 4];
      let ax = -(p2[1] - p1[1]);
      let ay = p2[0] - p1[0];
      const len = Math.hypot(ax, ay) || 1;
      ax /= len; ay /= len;
      let amin = Infinity, amax = -Infinity, bmin = Infinity, bmax = -Infinity;
      for (let k = 0; k < 4; k++) {
        const da = pa[k][0] * ax + pa[k][1] * ay;
        const db = pb[k][0] * ax + pb[k][1] * ay;
        if (da < amin) amin = da;
        if (da > amax) amax = da;
        if (db < bmin) bmin = db;
        if (db > bmax) bmax = db;
      }
      const overlap = Math.min(amax, bmax) - Math.max(amin, bmin);
      if (overlap <= 0) return null;
      if (overlap < best) {
        best = overlap;
        if ((b.x - a.x) * ax + (b.y - a.y) * ay < 0) { ax = -ax; ay = -ay; }
        nx = ax; ny = ay;
      }
    }
  }
  return { pen: best, nx, ny };
}

function pointInOBB(b, x, y, margin) {
  const dx = x - b.x, dy = y - b.y;
  const c = Math.cos(b.a), s = Math.sin(b.a);
  const lx = dx * c + dy * s;
  const ly = -dx * s + dy * c;
  return Math.abs(lx) <= b.hx + margin && Math.abs(ly) <= b.hy + margin;
}

function incidentPoints(host, other, nx, ny, pa, pb) {
  const pts = other === bRef(other, pb) ? pb : pb;
  const scored = pts.map((p) => ({ p, d: p[0] * nx + p[1] * ny }));
  scored.sort((u, v) => u.d - v.d);
  const picked = [];
  for (let i = 0; i < 2; i++) {
    const p = scored[i].p;
    if (pointInOBB(host, p[0], p[1], 0.03)) picked.push(p);
  }
  if (!picked.length) {
    const p = scored[0].p;
    picked.push(p);
  }
  return picked;
}

function bRef() { return null; }

function collidePair(a, b) {
  const zPen = a.hz + b.hz - Math.abs(b.z - a.z);
  if (zPen < -0.0008) return null;
  const pa = corners2d(a);
  const pb = corners2d(b);
  const sat = sat2d(a, b, pa, pb);
  if (!sat) return null;

  if (zPen < sat.pen) {
    const nz = b.z >= a.z ? 1 : -1;
    return {
      a, b,
      nx: 0, ny: 0, nz,
      pen: Math.max(0, zPen),
      points: [{
        x: (a.x + b.x) * 0.5,
        y: (a.y + b.y) * 0.5,
        z: nz > 0 ? a.z + a.hz : a.z - a.hz,
        jn: 0, j1: 0, j2: 0,
      }],
    };
  }

  const hostIsA = Math.abs((b.x - a.x) * sat.nx + (b.y - a.y) * sat.ny) >= 0;
  const incident = incidentPoints(a, b, sat.nx, sat.ny, pa, pb);
  const zMid = clamp((a.z + b.z) * 0.5, Math.max(a.z - a.hz, b.z - b.hz), Math.min(a.z + a.hz, b.z + b.hz));
  const points = [];
  for (let i = 0; i < incident.length; i++) {
    points.push({ x: incident[i][0], y: incident[i][1], z: zMid, jn: 0, j1: 0, j2: 0 });
  }
  if (!hostIsA) { /* normal already A to B */ }
  return { a, b, nx: sat.nx, ny: sat.ny, nz: 0, pen: sat.pen, points };
}

function materials(a, b) {
  const types = a.type + b.type;
  const ground = a.type === "ground" || b.type === "ground";
  const carHit = a.type === "car" || b.type === "car";
  if (ground && carHit) return { mu: driving ? 0.02 : GROUND_FRICTION, e: 0.05 };
  if (ground) return { mu: GROUND_FRICTION, e: BRICK_RESTITUTION };
  return { mu: BRICK_FRICTION, e: BRICK_RESTITUTION };
}

function cellKey(ix, iy) { return ix + "," + iy; }

function buildHash() {
  const map = new Map();
  const inv = 1 / 0.55;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    const r = b.rad;
    const x0 = Math.floor((b.x - r) * inv);
    const x1 = Math.floor((b.x + r) * inv);
    const y0 = Math.floor((b.y - r) * inv);
    const y1 = Math.floor((b.y + r) * inv);
    for (let ix = x0; ix <= x1; ix++) {
      for (let iy = y0; iy <= y1; iy++) {
        const k = cellKey(ix, iy);
        let bucket = map.get(k);
        if (!bucket) { bucket = []; map.set(k, bucket); }
        bucket.push(b);
      }
    }
  }
  return map;
}

function findContacts() {
  const hash = buildHash();
  const seen = new Set();
  const contacts = [];
  const inv = 1 / 0.55;

  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    if (a.sleeping && a !== car) continue;
    const r = a.rad;
    const x0 = Math.floor((a.x - r) * inv) - 1;
    const x1 = Math.floor((a.x + r) * inv) + 1;
    const y0 = Math.floor((a.y - r) * inv) - 1;
    const y1 = Math.floor((a.y + r) * inv) + 1;
    const mine = new Set();
    for (let ix = x0; ix <= x1; ix++) {
      for (let iy = y0; iy <= y1; iy++) {
        const bucket = hash.get(cellKey(ix, iy));
        if (!bucket) continue;
        for (let k = 0; k < bucket.length; k++) mine.add(bucket[k]);
      }
    }
    mine.forEach((b) => {
      if (b === a || (a.sleeping && b.sleeping)) return;
      const id1 = a.id < b.id ? a.id : b.id;
      const id2 = a.id < b.id ? b.id : a.id;
      const key = id1 + ":" + id2;
      if (seen.has(key)) return;
      if (Math.abs(a.x - b.x) > a.rad + b.rad) return;
      if (Math.abs(a.y - b.y) > a.rad + b.rad) return;
      seen.add(key);
      const m = a.id < b.id ? collidePair(a, b) : collidePair(b, a);
      if (!m || m.pen < -0.0008) return;
      const mat = materials(m.a, m.b);
      m.mu = mat.mu;
      m.e = mat.e;
      m.biasN = 0;
      m.warmed = false;
      contacts.push(m);
    });

    const pts = corners2d(a);
    let lowest = Infinity;
    for (let p = 0; p < 4; p++) if (pts[p][1] < lowest) lowest = pts[p][1];
    if (lowest <= 0.02) {
      const touch = [];
      for (let p = 0; p < 4; p++) {
        if (pts[p][1] <= lowest + 0.012 && pts[p][1] < 0.03) touch.push(pts[p]);
      }
      touch.sort((u, v) => u[1] - v[1]);
      const use = [];
      for (let p = 0; p < touch.length && use.length < 2; p++) {
        if (!use.some((q) => Math.hypot(q[0] - touch[p][0], q[1] - touch[p][1]) < 0.04)) use.push(touch[p]);
      }
      if (!use.length) use.push(pts[0]);
      const pen = Math.max(0, -lowest);
      const mat = materials(a, { type: "ground" });
      contacts.push({
        a: a,
        b: null,
        nx: 0, ny: -1, nz: 0,
        pen,
        mu: mat.mu,
        e: mat.e,
        ground: true,
        points: use.map((p) => ({ x: p[0], y: Math.min(0, p[1]), z: a.z, jn: 0, j1: 0, j2: 0 })),
      });
      a.onGround = true;
    } else {
      a.onGround = false;
    }
  }

  for (let i = 0; i < contacts.length; i++) {
    const m = contacts[i];
    const base = (m.b ? Math.min(m.a.id, m.b.id) + ":" + Math.max(m.a.id, m.b.id) : "g" + m.a.id);
    for (let p = 0; p < m.points.length; p++) {
      const prev = impulseCache.get(base + ":" + p);
      if (prev) {
        m.points[p].jn = prev.jn;
        m.points[p].j1 = prev.j1;
        m.points[p].j2 = prev.j2;
      }
    }
  }
  contacts.sort((u, v) => v.pen - u.pen);
  return contacts;
}

function tangents(nx, ny, nz) {
  let t1x, t1y, t1z;
  if (Math.abs(ny) < 0.85) {
    t1x = -nz; t1y = 0; t1z = nx;
  } else {
    t1x = 0; t1y = nz; t1z = -ny;
  }
  let len = Math.hypot(t1x, t1y, t1z) || 1;
  t1x /= len; t1y /= len; t1z /= len;
  const t2x = ny * t1z - nz * t1y;
  const t2y = nz * t1x - nx * t1z;
  const t2z = nx * t1y - ny * t1x;
  return [t1x, t1y, t1z, t2x, t2y, t2z];
}

function velAt(b, px, py) {
  const rx = px - b.x, ry = py - b.y;
  return [b.vx - b.w * ry, b.vy + b.w * rx, b.vz, rx, ry];
}

function applyJ(b, jx, jy, jz, rx, ry) {
  if (!b || b.invMass === 0) return;
  b.vx += jx * b.invMass;
  b.vy += jy * b.invMass;
  b.vz += jz * b.invMass;
  b.w += (rx * jy - ry * jx) * b.invI;
}

function wake(b, mag) {
  if (!b || b.type === "ground") return;
  if (b.sleeping && mag > 0.02) {
    b.sleeping = false;
    b.sleepT = 0;
  }
}

function solveContact(m, dt, captureBias) {
  const a = m.a, b = m.b;
  const nx = m.nx, ny = m.ny, nz = m.nz;
  const tn = tangents(nx, ny, nz);
  let maxJ = 0;
  for (let i = 0; i < m.points.length; i++) {
    const p = m.points[i];
    const va = velAt(a, p.x, p.y);
    let rvx, rvy, rvz, rax, ray, rbx = 0, rby = 0;
    rax = va[3]; ray = va[4];
    rvx = va[0]; rvy = va[1]; rvz = va[2];
    if (b) {
      const vb = velAt(b, p.x, p.y);
      rbx = vb[3]; rby = vb[4];
      rvx = vb[0] - rvx;
      rvy = vb[1] - rvy;
      rvz = vb[2] - rvz;
    } else {
      rvx = -rvx; rvy = -rvy; rvz = -rvz;
    }
    const rvn = rvx * nx + rvy * ny + rvz * nz;
    if (captureBias && !p._biasSet) {
      p.restBias = rvn < -REST_THRESH ? m.e * rvn : 0;
      p._biasSet = true;
    }
    const rAn = rax * ny - ray * nx;
    const rBn = b ? rbx * ny - rby * nx : 0;
    const kn = a.invMass + (b ? b.invMass : 0) + rAn * rAn * a.invI + (b ? rBn * rBn * b.invI : 0);
    if (kn <= 1e-8) continue;
    const posBias = m.pen > SLOP ? (0.28 / dt) * (m.pen - SLOP) / m.points.length : 0;
    let jn = p.jn - (rvn + (p.restBias || 0) - posBias) / kn;
    if (jn < 0) jn = 0;
    const djn = jn - p.jn;
    p.jn = jn;
    applyJ(a, -djn * nx, -djn * ny, -djn * nz, rax, ray);
    if (b) applyJ(b, djn * nx, djn * ny, djn * nz, rbx, rby);
    maxJ = Math.max(maxJ, jn);

    const lim = m.mu * p.jn;
    for (let t = 0; t < 2; t++) {
      const tx = tn[t * 3], ty = tn[t * 3 + 1], tz = tn[t * 3 + 2];
      const va2 = velAt(a, p.x, p.y);
      let tvx = va2[0], tvy = va2[1], tvz = va2[2];
      let rAx = va2[3], rAy = va2[4], rBx = 0, rBy = 0;
      if (b) {
        const vb2 = velAt(b, p.x, p.y);
        rBx = vb2[3]; rBy = vb2[4];
        tvx = vb2[0] - tvx;
        tvy = vb2[1] - tvy;
        tvz = vb2[2] - tvz;
      } else {
        tvx = -tvx; tvy = -tvy; tvz = -tvz;
      }
      const rAt = rAx * ty - rAy * tx;
      const rBt = b ? rBx * ty - rBy * tx : 0;
      const kt = a.invMass + (b ? b.invMass : 0) + rAt * rAt * a.invI + (b ? rBt * rBt * b.invI : 0);
      if (kt <= 1e-8) continue;
      const rvt = tvx * tx + tvy * ty + tvz * tz;
      const store = t === 0 ? "j1" : "j2";
      let jt = p[store] - rvt / kt;
      jt = clamp(jt, -lim, lim);
      const djt = jt - p[store];
      p[store] = jt;
      applyJ(a, -djt * tx, -djt * ty, -djt * tz, rAx, rAy);
      if (b) applyJ(b, djt * tx, djt * ty, djt * tz, rBx, rBy);
    }
  }
  const mag = maxJ;
  if (mag > 0.04) {
    wake(a, mag);
    wake(b, mag);
    const brick = a.type === "brick" ? a : (b && b.type === "brick" ? b : null);
    const hitCar = a.type === "car" || (b && b.type === "car");
    if (hitCar && brick) {
      if (mag > lastImpact) lastImpact = mag;
      if (driving) {
        driving = false;
        if (impactSpeed == null) impactSpeed = Math.hypot(car.vx, car.vy, car.vz);
      }
      if (mag > 8 && !m._dusted) {
        m._dusted = true;
        camShake = Math.min(16, camShake + mag * 0.00045);
        crumple = Math.min(0.42, crumple + mag * 0.0000025);
        spawnDust(m, mag);
      }
    }
  }
  return mag;
}

function correctPositions(contacts) {
  for (let i = 0; i < contacts.length; i++) {
    const m = contacts[i];
    const pen = m.pen - SLOP;
    if (pen <= 0) continue;
    const a = m.a, b = m.b;
    const inv = a.invMass + (b ? b.invMass : 0);
    if (inv <= 0) continue;
    const percent = pen > 0.06 ? 0.95 : 0.7;
    const c = pen * percent / inv;
    a.x -= m.nx * c * a.invMass;
    a.y -= m.ny * c * a.invMass;
    a.z -= m.nz * c * a.invMass;
    if (b) {
      b.x += m.nx * c * b.invMass;
      b.y += m.ny * c * b.invMass;
      b.z += m.nz * c * b.invMass;
    } else if (m.ground) {
      if (a.y - a.hy < 0 && Math.abs(a.a) < 0.04) a.y -= (a.y - a.hy);
      const pts = corners2d(a);
      let lowest = Infinity;
      for (let p = 0; p < 4; p++) if (pts[p][1] < lowest) lowest = pts[p][1];
      if (lowest < 0) a.y -= lowest;
    }
  }
}

function storeCache(contacts) {
  impulseCache = new Map();
  for (let i = 0; i < contacts.length; i++) {
    const m = contacts[i];
    const base = (m.b ? Math.min(m.a.id, m.b.id) + ":" + Math.max(m.a.id, m.b.id) : "g" + m.a.id);
    for (let p = 0; p < m.points.length; p++) {
      const pt = m.points[p];
      impulseCache.set(base + ":" + p, { jn: pt.jn * 0.85, j1: pt.j1 * 0.7, j2: pt.j2 * 0.7 });
    }
  }
}

function bodySupported(b) {
  const pts = corners2d(b);
  let minY = Infinity;
  for (let i = 0; i < 4; i++) if (pts[i][1] < minY) minY = pts[i][1];
  if (minY <= 0.03) return true;
  for (let i = 0; i < bodies.length; i++) {
    const o = bodies[i];
    if (o === b) continue;
    if (Math.abs(o.z - b.z) > b.hz + o.hz - 0.008) continue;
    if (Math.abs(o.x - b.x) > b.hx + o.hx - 0.008) continue;
    if (o.y >= b.y) continue;
    const op = corners2d(o);
    let maxY = -Infinity;
    for (let k = 0; k < 4; k++) if (op[k][1] > maxY) maxY = op[k][1];
    if (maxY >= minY - 0.025 && maxY <= minY + 0.05) return true;
  }
  return false;
}

function clampMotion(b) {
  const sp = Math.hypot(b.vx, b.vy, b.vz);
  const cap = b.type === "car" ? 70 : 55;
  if (sp > cap) {
    const s = cap / sp;
    b.vx *= s; b.vy *= s; b.vz *= s;
  }
  if (b.w > 28) b.w = 28;
  if (b.w < -28) b.w = -28;
}

function substep(dt) {
  if (driving) {
    if (carNoseX() >= wallFaceX - 0.01) {
      driving = false;
      if (impactSpeed == null) impactSpeed = Math.hypot(car.vx, car.vy, car.vz);
    } else {
      applyDrive(dt);
    }
  }

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.sleeping) continue;
    b.vy -= GRAVITY * dt;
    b.w *= 1 - 0.06 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.z += b.vz * dt;
    b.a += b.w * dt;
    clampMotion(b);
  }

  const contacts = findContacts();
  const iters = bodies.length > 900 ? 8 : 12;
  for (let iter = 0; iter < iters; iter++) {
    for (let i = 0; i < contacts.length; i++) solveContact(contacts[i], dt, iter === 0);
  }
  correctPositions(contacts);
  storeCache(contacts);

  supportTick++;
  const doSupport = supportTick % (bodies.length > 900 ? 3 : 1) === 0;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.type === "car") {
      const sp = Math.hypot(b.vx, b.vy, b.vz);
      if (!driving && sp < 0.12 && Math.abs(b.w) < 0.15 && b.onGround) {
        b.sleepT += dt;
        if (b.sleepT > 0.45) {
          b.sleeping = true;
          b.vx = b.vy = b.vz = b.w = 0;
        }
      } else b.sleepT = 0;
      continue;
    }
    if (b.sleeping) {
      if (doSupport && !bodySupported(b)) {
        b.sleeping = false;
        b.sleepT = 0;
      }
      continue;
    }
    const sp = Math.hypot(b.vx, b.vy, b.vz);
    if (sp < 0.07 && Math.abs(b.w) < 0.12) {
      b.sleepT += dt;
      if (b.sleepT > 0.32 && bodySupported(b)) {
        b.sleeping = true;
        b.vx = b.vy = b.vz = b.w = 0;
      }
    } else b.sleepT = 0;
  }

  if (driving && car.onGround && Math.abs(car.vx) > 1) dropSkid();
  if (!driving && car.onGround && Math.abs(car.vx) > 1.2) dropSkid();
}

function dropSkid() {
  const c = Math.cos(car.a), s = Math.sin(car.a);
  const axles = [-1.35, 1.28];
  for (let i = 0; i < axles.length; i++) {
    const lx = axles[i];
    const ly = -CAR_H / 2 + 0.34;
    skids.push({
      x: car.x + lx * c - ly * s,
      y: 0.01,
      z: car.z,
      life: 1,
    });
  }
  if (skids.length > 500) skids.splice(0, skids.length - 500);
}

function spawnDust(m, mag) {
  const p = m.points[0];
  const n = mag > 40 ? 7 : 4;
  for (let i = 0; i < n; i++) {
    if (particles.length > 420) particles.shift();
    const spread = (i - (n - 1) / 2) * 0.55;
    particles.push({
      x: p.x,
      y: Math.max(0.05, p.y),
      z: p.z + spread * 0.08,
      vx: m.nx * (1.2 + i * 0.15) + spread * 0.8 + (m.a.vx || 0) * 0.15,
      vy: Math.abs(m.ny) * 1.4 + 0.8 + i * 0.18,
      vz: m.nz * 1.1 + spread,
      life: 0.55 + (i % 3) * 0.12,
      age: 0,
      r: 0.035 + (i % 4) * 0.012,
    });
  }
}

function updateVisuals(dt) {
  camShake *= Math.exp(-dt * 5.5);
  shakeT += dt;
  crumple *= Math.exp(-dt * 0.35);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age > p.life) { particles.splice(i, 1); continue; }
    p.vy -= GRAVITY * 0.35 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.2; p.vx *= 0.8; }
  }
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = Math.floor(viewW * dpr);
  canvas.height = Math.floor(viewH * dpr);
  canvas.style.width = viewW + "px";
  canvas.style.height = viewH + "px";
  groundScreen = viewH * 0.78;
}

function project(x, y, z) {
  const sx = (x - camX) * SCALE + z * Z_SHEAR + viewW * 0.2;
  const sy = groundScreen - y * SCALE;
  return [sx, sy];
}

function frameCamera(alpha) {
  const focus = phase === "run" && !driving ? car.x + 2.4 : car.x * 0.4 + wallFaceX * 0.6;
  const target = focus - viewW * 0.34 / SCALE;
  camX += (target - camX) * (alpha >= 1 ? 1 : alpha);
}

function worldToScreen(x, y, z) {
  const sh = camShake;
  const ox = sh ? Math.sin(shakeT * 47) * sh : 0;
  const oy = sh ? Math.cos(shakeT * 39) * sh * 0.65 : 0;
  const p = project(x, y, z);
  return [p[0] + ox, p[1] + oy];
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = ((n >> 16) & 255) * f;
  let g = ((n >> 8) & 255) * f;
  let b = (n & 255) * f;
  r = r > 255 ? 255 : r; g = g > 255 ? 255 : g; b = b > 255 ? 255 : b;
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}

function localPoint(b, lx, ly, lz) {
  const c = Math.cos(b.a), s = Math.sin(b.a);
  return [b.x + lx * c - ly * s, b.y + lx * s + ly * c, b.z + lz];
}

function drawGround() {
  const y0 = worldToScreen(0, 0, 0)[1];
  const grd = ctx.createLinearGradient(0, y0, 0, viewH);
  grd.addColorStop(0, "#5c656f");
  grd.addColorStop(0.045, "#3e4650");
  grd.addColorStop(1, "#23282f");
  ctx.fillStyle = grd;
  ctx.fillRect(0, y0, viewW, viewH - y0);

  ctx.fillStyle = "#6a532f";
  ctx.fillRect(0, y0, viewW, 7);
  ctx.fillStyle = "#3a414a";
  ctx.fillRect(0, y0 + 7, viewW, 26);

  ctx.strokeStyle = "rgba(240,162,2,0.9)";
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 14]);
  ctx.beginPath();
  ctx.moveTo(0, y0 + 1.5);
  ctx.lineTo(viewW, y0 + 1.5);
  ctx.stroke();
  ctx.setLineDash([]);

  const x0 = camX - 2;
  const x1 = camX + viewW / SCALE + 4;
  ctx.fillStyle = "rgba(255,255,255,0.72)";
  ctx.font = "11px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  const start = Math.max(0, Math.floor(x0));
  for (let x = start; x < x1; x += 1) {
    const p = worldToScreen(x, 0, 0);
    if (p[0] < -20 || p[0] > viewW + 20) continue;
    ctx.fillRect(p[0], y0, 2, x % 5 === 0 ? 14 : 8);
    if (x % 5 === 0) ctx.fillText(x + " m", p[0], y0 + 28);
  }

  for (let i = 0; i < skids.length; i++) {
    const s = skids[i];
    const p = worldToScreen(s.x, 0.012, s.z);
    ctx.fillStyle = "rgba(12,12,14,0.55)";
    ctx.fillRect(p[0] - 8, y0 - 2, 16, 4);
  }
}

function drawBrick(b) {
  const inset = 0.008;
  const hx = b.hx - inset, hy = b.hy - inset, hz = b.hz - inset * 0.5;
  const corners = [
    localPoint(b, -hx, -hy, -hz),
    localPoint(b, hx, -hy, -hz),
    localPoint(b, hx, hy, -hz),
    localPoint(b, -hx, hy, -hz),
    localPoint(b, -hx, -hy, hz),
    localPoint(b, hx, -hy, hz),
    localPoint(b, hx, hy, hz),
    localPoint(b, -hx, hy, hz),
  ];
  const faces = [
    { idx: [0, 3, 2, 1], n: localNormal(b, -1, 0, 0) },
    { idx: [4, 5, 6, 7], n: localNormal(b, 1, 0, 0) },
    { idx: [0, 1, 5, 4], n: localNormal(b, 0, -1, 0) },
    { idx: [3, 7, 6, 2], n: localNormal(b, 0, 1, 0) },
    { idx: [0, 4, 7, 3], n: localNormal(b, 0, 0, -1) },
    { idx: [1, 2, 6, 5], n: localNormal(b, 0, 0, 1) },
  ];
  const toward = [-0.72, 0.42, -0.55];
  const light = [-0.25, 0.86, 0.28];
  const drawFaces = [];
  for (let i = 0; i < faces.length; i++) {
    const f = faces[i];
    const nd = f.n[0] * toward[0] + f.n[1] * toward[1] + f.n[2] * toward[2];
    if (nd <= 0.02) continue;
    const ld = f.n[0] * light[0] + f.n[1] * light[1] + f.n[2] * light[2];
    let depth = 0;
    for (let k = 0; k < 4; k++) {
      const c = corners[f.idx[k]];
      depth += c[0] * 0.15 + c[2];
    }
    drawFaces.push({ f, shade: 0.48 + 0.62 * Math.max(0, ld), depth, nd });
  }
  drawFaces.sort((u, v) => v.depth - u.depth);
  for (let i = 0; i < drawFaces.length; i++) {
    const f = drawFaces[i].f;
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const c = corners[f.idx[k]];
      const s = worldToScreen(c[0], c[1], c[2]);
      if (k === 0) ctx.moveTo(s[0], s[1]);
      else ctx.lineTo(s[0], s[1]);
    }
    ctx.closePath();
    ctx.fillStyle = shade(b.color, drawFaces[i].shade);
    ctx.fill();
    ctx.strokeStyle = "rgba(40,16,12,0.45)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function localNormal(b, lx, ly, lz) {
  const c = Math.cos(b.a), s = Math.sin(b.a);
  return [lx * c - ly * s, lx * s + ly * c, lz];
}

function drawWheel(x, y, z, radius, spin) {
  const c = worldToScreen(x, y, z);
  const rx = radius * SCALE;
  const ry = radius * SCALE;
  ctx.save();
  ctx.translate(c[0], c[1]);
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.max(6, rx), Math.max(6, ry), 0, 0, Math.PI * 2);
  ctx.fillStyle = "#1b1e24";
  ctx.fill();
  ctx.strokeStyle = "#4d5560";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.max(3, rx * 0.45), Math.max(3, ry * 0.45), 0, 0, Math.PI * 2);
  ctx.fillStyle = "#c5ccd4";
  ctx.fill();
  ctx.beginPath();
  const ang = spin;
  ctx.strokeStyle = "#2a3038";
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    const t = ang + i * Math.PI / 3;
    ctx.moveTo(Math.cos(t) * 2, Math.sin(t) * 2);
    ctx.lineTo(Math.cos(t) * rx * 0.42, Math.sin(t) * ry * 0.42);
  }
  ctx.stroke();
  ctx.restore();
}

function drawCar() {
  const nose = crumple;
  const c = Math.cos(car.a), s = Math.sin(car.a);
  function L(lx, ly, lz) {
    const wx = car.x + lx * c - ly * s;
    const wy = car.y + lx * s + ly * c;
    return worldToScreen(wx, wy, car.z + lz);
  }
  const hz = 0.46;
  const silhouette = [
    [-2.05, -0.58],
    [-2.05, -0.16],
    [-1.7, -0.08],
    [-1.15, 0.16],
    [-0.62, 0.5],
    [0.22, 0.62],
    [0.78, 0.5],
    [1.22, 0.16],
    [1.72, 0.04],
    [2.06 - nose, -0.08],
    [2.08 - nose, -0.5],
    [1.42, -0.58],
    [1.08, -0.46],
    [0.42, -0.46],
    [-0.22, -0.46],
    [-0.72, -0.58],
    [-1.48, -0.58],
  ];

  function pathSide(z, shift) {
    ctx.beginPath();
    for (let i = 0; i < silhouette.length; i++) {
      const p = L(silhouette[i][0] + shift, silhouette[i][1], z);
      if (i === 0) ctx.moveTo(p[0], p[1]);
      else ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
  }

  pathSide(hz, 0);
  ctx.fillStyle = "#9aa3ad";
  ctx.fill();

  const roofA = L(-0.62, 0.5, -hz);
  const roofB = L(0.78, 0.5, -hz);
  const roofC = L(0.78, 0.5, hz);
  const roofD = L(-0.62, 0.5, hz);
  ctx.beginPath();
  ctx.moveTo(roofA[0], roofA[1]);
  ctx.lineTo(roofB[0], roofB[1]);
  ctx.lineTo(roofC[0], roofC[1]);
  ctx.lineTo(roofD[0], roofD[1]);
  ctx.closePath();
  ctx.fillStyle = "#c5ced6";
  ctx.fill();

  const hoodA = L(1.22, 0.16, -hz);
  const hoodB = L(2.06 - nose, -0.08, -hz);
  const hoodC = L(2.06 - nose, -0.08, hz);
  const hoodD = L(1.22, 0.16, hz);
  ctx.beginPath();
  ctx.moveTo(hoodA[0], hoodA[1]);
  ctx.lineTo(hoodB[0], hoodB[1]);
  ctx.lineTo(hoodC[0], hoodC[1]);
  ctx.lineTo(hoodD[0], hoodD[1]);
  ctx.closePath();
  ctx.fillStyle = "#d5dde4";
  ctx.fill();

  pathSide(-hz, 0);
  ctx.fillStyle = "#d7dee6";
  ctx.fill();
  ctx.strokeStyle = "#2c3440";
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath();
  const win = [[-0.42, 0.22], [0.12, 0.52], [0.7, 0.44], [1.05, 0.16]];
  for (let i = 0; i < win.length; i++) {
    const p = L(win[i][0], win[i][1], -hz - 0.01);
    if (i === 0) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(70, 110, 130, 0.88)";
  ctx.fill();

  ctx.beginPath();
  const doorA = L(-0.2, -0.02, -hz - 0.012);
  const doorB = L(0.7, 0.02, -hz - 0.012);
  ctx.moveTo(doorA[0], doorA[1]);
  ctx.lineTo(doorB[0], doorB[1]);
  ctx.strokeStyle = "rgba(40,48,58,0.55)";
  ctx.stroke();

  const lamp = L(2.0 - nose, -0.18, -hz);
  ctx.fillStyle = driving ? "#fff4cc" : "#f2e2b0";
  ctx.beginPath();
  ctx.arc(lamp[0], lamp[1], 4.5, 0, Math.PI * 2);
  ctx.fill();
  const tail = L(-2.02, -0.22, -hz);
  ctx.fillStyle = !driving && Math.abs(car.vx) > 0.4 ? "#ff5a4a" : "#8e2f32";
  ctx.fillRect(tail[0] - 3, tail[1] - 3, 6, 7);

  ctx.fillStyle = "#e07a2f";
  ctx.font = "bold 11px sans-serif";
  const badge = L(0.05, -0.22, -hz - 0.02);
  ctx.fillText("TEST", badge[0] - 14, badge[1]);

  const spin = car._spin || 0;
  const wy = -CAR_H / 2 + 0.34;
  drawWheel(car.x + -1.32 * c - wy * s, car.y + -1.32 * s + wy * c, car.z - hz * 0.15, 0.34, spin);
  drawWheel(car.x + 1.25 * c - wy * s, car.y + 1.25 * s + wy * c, car.z - hz * 0.15, 0.34, spin);
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const s = worldToScreen(p.x, p.y, p.z);
    const t = 1 - p.age / p.life;
    ctx.fillStyle = "rgba(92,78,70," + (0.35 * t) + ")";
    const r = p.r * SCALE * (0.7 + p.age * 2);
    ctx.beginPath();
    ctx.arc(s[0], s[1], Math.max(1, r), 0, Math.PI * 2);
    ctx.fill();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, groundScreen);
  sky.addColorStop(0, "#9eb4c6");
  sky.addColorStop(0.55, "#d5e1ea");
  sky.addColorStop(1, "#efe6d6");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, viewW, viewH);

  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.beginPath();
  ctx.ellipse(viewW * 0.18, 90, 70, 22, 0, 0, Math.PI * 2);
  ctx.ellipse(viewW * 0.22, 98, 46, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(viewW * 0.72, 70, 90, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  drawGround();

  const order = bodies.filter((b) => b.type === "brick");
  order.sort((a, b) => (b.x - a.x) || (b.z - a.z));
  for (let i = 0; i < order.length; i++) drawBrick(order[i]);
  drawCar();
  drawParticles();

  const impact = worldToScreen(wallFaceX, 0.02, 0);
  ctx.strokeStyle = "rgba(224, 90, 70, 0.8)";
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(impact[0], impact[1]);
  ctx.lineTo(impact[0], impact[1] - applied.rows * BRICK_H * SCALE - 10);
  ctx.stroke();
  ctx.setLineDash([]);
}

function movingBricks() {
  let n = 0;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.type !== "brick" || b.sleeping) continue;
    if (Math.hypot(b.vx, b.vy, b.vz) > 0.12 || Math.abs(b.w) > 0.2) n++;
  }
  return n;
}

function updateHud() {
  const speed = Math.hypot(car.vx, car.vy, car.vz);
  ui.telSpeed.textContent = speed.toFixed(2);
  ui.telTime.textContent = simTime.toFixed(2) + " s";
  const moving = phase === "armed" ? 0 : movingBricks();
  ui.telMove.textContent = String(moving);
  ui.telImpact.textContent = impactSpeed == null ? "—" : impactSpeed.toFixed(2);
  let label = "Armed";
  if (phase === "run") {
    if (simTime > 0.4 && speed < 0.15 && moving === 0 && !driving) label = "Settled";
    else if (!driving) label = "Impact";
    else label = "Launch";
  }
  ui.status.textContent = label;
}

function frame(now) {
  if (!lastNow) lastNow = now;
  let dt = (now - lastNow) / 1000;
  lastNow = now;
  if (dt > 0.05) dt = 0.05;
  if (phase === "run") {
    acc += dt;
    const step = 1 / 240;
    const maxSteps = bodies.length > 900 ? 8 : 14;
    let n = 0;
    while (acc >= step && n < maxSteps) {
      substep(step);
      simTime += step;
      acc -= step;
      n++;
    }
    if (n === maxSteps) acc = 0;
    car._spin = (car._spin || 0) + car.vx / 0.34 * dt;
  }
  updateVisuals(dt);
  frameCamera(phase === "run" ? 0.08 : 1);
  render();
  updateHud();
  requestAnimationFrame(frame);
}

["input", "change"].forEach((ev) => {
  ui.speed.addEventListener(ev, syncLabels);
  ui.cols.addEventListener(ev, syncLabels);
  ui.rows.addEventListener(ev, syncLabels);
  ui.layers.addEventListener(ev, syncLabels);
  ui.mass.addEventListener(ev, syncLabels);
});

ui.test.addEventListener("click", () => buildWorld(true));
ui.reset.addEventListener("click", () => buildWorld(false));
window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.code === "Space") { e.preventDefault(); buildWorld(true); }
  if (e.key === "r" || e.key === "R") buildWorld(false);
});
window.addEventListener("resize", resize);

resize();
buildWorld(false);
requestAnimationFrame(frame);
</script>
</body>
</html>
