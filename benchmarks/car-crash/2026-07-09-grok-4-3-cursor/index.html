<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grok 4.5</title>
<style>
  :root {
    --bg0: #0e141b;
    --bg1: #162029;
    --panel: rgba(18, 28, 38, 0.92);
    --line: rgba(180, 210, 230, 0.16);
    --text: #e8f0f6;
    --muted: #8aa0b2;
    --accent: #d9772c;
    --accent2: #3db8a0;
    --danger: #c44b4b;
    --ok: #6fbf7a;
    --font: "IBM Plex Sans", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg0);
    color: var(--text);
    font-family: var(--font);
  }
  #app {
    position: relative;
    width: 100%; height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(14,20,27,0.96), rgba(14,20,27,0.78));
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 140px;
  }
  .brand h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .brand span {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  button {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 16px;
    font: 600 0.92rem/1 var(--font);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  #btnTest {
    background: var(--accent);
    color: #1a1008;
    min-width: 96px;
  }
  #btnTest:hover { background: #e8893a; }
  #btnReset {
    background: transparent;
    color: var(--text);
    border-color: var(--line);
  }
  #btnReset:hover { border-color: var(--muted); }
  #btnSettings {
    background: rgba(61, 184, 160, 0.12);
    color: var(--accent2);
    border-color: rgba(61, 184, 160, 0.35);
  }
  #btnSettings:hover { background: rgba(61, 184, 160, 0.2); }
  .telemetry {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .telemetry b {
    color: var(--text);
    font-weight: 600;
  }
  #stageWrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(1200px 500px at 20% 10%, rgba(61,184,160,0.08), transparent 60%),
      radial-gradient(900px 420px at 80% 0%, rgba(217,119,44,0.07), transparent 55%),
      linear-gradient(180deg, #101820 0%, #152433 48%, #1a2a22 100%);
  }
  canvas#view {
    display: block;
    width: 100%;
    height: 100%;
  }
  #settings {
    position: absolute;
    top: 12px;
    right: 12px;
    width: min(340px, calc(100% - 24px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 12px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    z-index: 6;
    display: none;
  }
  #settings.open { display: block; }
  #settings h2 {
    font-size: 0.95rem;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #settings h2 button {
    padding: 4px 8px;
    font-size: 0.75rem;
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
  }
  .field {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .field label {
    font-size: 0.8rem;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .field input[type="range"] {
    width: 100%;
    accent-color: var(--accent2);
  }
  .field .val {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text);
    min-width: 64px;
    text-align: right;
  }
  .hint {
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.35;
  }
  .activeParams {
    display: none;
  }
  @media (max-width: 820px) {
    header { flex-direction: column; align-items: stretch; }
    .controls { justify-content: flex-start; }
    .telemetry { font-size: 0.7rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Grok 4.5</h1>
      <span>2D Crash Experiment</span>
    </div>
    <div class="controls">
      <div class="telemetry">
        <div>v = <b id="tSpeed">0.00</b> m/s</div>
        <div>t = <b id="tTime">0.00</b> s</div>
        <div>moving = <b id="tMoving">0</b></div>
        <div>bricks = <b id="tBricks">0</b></div>
      </div>
      <button id="btnTest" type="button">Test</button>
      <button id="btnReset" type="button">Reset</button>
      <button id="btnSettings" type="button">Settings</button>
    </div>
  </header>
  <div id="stageWrap">
    <canvas id="view"></canvas>
    <aside id="settings" aria-label="Experiment settings">
      <h2>
        Experiment Settings
        <button id="btnCloseSettings" type="button">Close</button>
      </h2>
      <div class="field">
        <label for="carSpeed">Car speed (m/s)</label>
        <input id="carSpeed" type="range" min="5" max="45" step="0.5" value="22" />
        <div class="val" id="carSpeedVal">22.0</div>
      </div>
      <div class="field">
        <label for="wallCols">Wall columns</label>
        <input id="wallCols" type="range" min="4" max="24" step="1" value="12" />
        <div class="val" id="wallColsVal">12</div>
      </div>
      <div class="field">
        <label for="wallRows">Wall rows</label>
        <input id="wallRows" type="range" min="3" max="16" step="1" value="8" />
        <div class="val" id="wallRowsVal">8</div>
      </div>
      <div class="field">
        <label for="wallLayers">Wall depth layers</label>
        <input id="wallLayers" type="range" min="1" max="5" step="1" value="2" />
        <div class="val" id="wallLayersVal">2</div>
      </div>
      <div class="field">
        <label for="brickMass">Brick mass (kg)</label>
        <input id="brickMass" type="range" min="0.5" max="12" step="0.1" value="2.5" />
        <div class="val" id="brickMassVal">2.5</div>
      </div>
      <p class="hint">Defaults: 22 m/s · 12×8×2 · 2.5 kg · g=9.81 · μ=0.72 · e=0.18 · car 1250 kg. Physics is deterministic — same settings, same outcome.</p>
    </aside>
  </div>
</div>
<script>
(() => {
  "use strict";

  // ── Mandatory defaults ──────────────────────────────────────────
  const DEFAULTS = Object.freeze({
    carSpeed: 22,
    wallCols: 12,
    wallRows: 8,
    wallLayers: 2,
    brickMass: 2.5,
    brickW: 0.50,
    brickH: 0.24,
    gravity: 9.81,
    brickFriction: 0.72,
    brickRestitution: 0.18,
    carMass: 1250,
    carW: 4.2,
    carH: 1.45,
    groundFriction: 0.85,
    scale: 80,
  });

  const settings = {
    carSpeed: DEFAULTS.carSpeed,
    wallCols: DEFAULTS.wallCols,
    wallRows: DEFAULTS.wallRows,
    wallLayers: DEFAULTS.wallLayers,
    brickMass: DEFAULTS.brickMass,
  };

  // ── Canvas / camera ─────────────────────────────────────────────
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const stageWrap = document.getElementById("stageWrap");

  let dpr = 1;
  let viewW = 0;
  let viewH = 0;
  let camX = 0;
  let camY = 0;
  let shake = 0;
  let shakeSeed = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = stageWrap.clientWidth;
    viewH = stageWrap.clientHeight;
    canvas.width = Math.max(1, Math.floor(viewW * dpr));
    canvas.height = Math.max(1, Math.floor(viewH * dpr));
    canvas.style.width = viewW + "px";
    canvas.style.height = viewH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ── Deterministic visual noise (does not affect physics) ────────
  function hash2(i, j) {
    let n = (i * 374761393 + j * 668265263) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  // ── Math helpers ────────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hypot = Math.hypot;

  // ── Rigid body ──────────────────────────────────────────────────
  let nextId = 1;
  class Body {
    constructor(opts) {
      this.id = nextId++;
      this.type = opts.type || "brick";
      this.x = opts.x;
      this.y = opts.y;
      this.w = opts.w;
      this.h = opts.h;
      this.angle = opts.angle || 0;
      this.vx = opts.vx || 0;
      this.vy = opts.vy || 0;
      this.omega = opts.omega || 0;
      this.mass = opts.mass;
      this.invMass = opts.static ? 0 : 1 / opts.mass;
      this.inertia = opts.static ? Infinity : (opts.mass * (opts.w * opts.w + opts.h * opts.h)) / 12;
      this.invInertia = opts.static ? 0 : 1 / this.inertia;
      this.friction = opts.friction ?? DEFAULTS.brickFriction;
      this.restitution = opts.restitution ?? DEFAULTS.brickRestitution;
      this.static = !!opts.static;
      this.sleeping = !!opts.static;
      this.sleepTimer = 0;
      this.layer = opts.layer || 0;
      this.row = opts.row || 0;
      this.col = opts.col || 0;
      this.color = opts.color || null;
      this.crumple = 0;
      this.alive = true;
    }

    get cos() { return Math.cos(this.angle); }
    get sin() { return Math.sin(this.angle); }

    localToWorld(lx, ly) {
      const c = this.cos, s = this.sin;
      return {
        x: this.x + lx * c - ly * s,
        y: this.y + lx * s + ly * c,
      };
    }

    worldToLocal(wx, wy) {
      const dx = wx - this.x, dy = wy - this.y;
      const c = this.cos, s = this.sin;
      return { x: dx * c + dy * s, y: -dx * s + dy * c };
    }

    corners() {
      const hw = this.w * 0.5, hh = this.h * 0.5;
      return [
        this.localToWorld(-hw, -hh),
        this.localToWorld( hw, -hh),
        this.localToWorld( hw,  hh),
        this.localToWorld(-hw,  hh),
      ];
    }

    aabb() {
      const c = this.corners();
      let minX = c[0].x, maxX = c[0].x, minY = c[0].y, maxY = c[0].y;
      for (let i = 1; i < 4; i++) {
        const p = c[i];
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, maxX, minY, maxY };
    }

    applyImpulse(jx, jy, px, py) {
      if (this.static) return;
      this.vx += jx * this.invMass;
      this.vy += jy * this.invMass;
      const rx = px - this.x, ry = py - this.y;
      this.omega += (rx * jy - ry * jx) * this.invInertia;
      this.sleeping = false;
      this.sleepTimer = 0;
    }

    integrate(dt, g) {
      if (this.static || this.sleeping) return;
      this.vy += g * dt;
      this.vx *= 1 - 0.0008;
      this.vy *= 1 - 0.0008;
      this.omega *= 1 - 0.0015;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.angle += this.omega * dt;
      if (this.angle > Math.PI) this.angle -= Math.PI * 2;
      if (this.angle < -Math.PI) this.angle += Math.PI * 2;
    }
  }

  // ── World state ─────────────────────────────────────────────────
  const world = {
    groundY: 0,
    groundLeft: -20,
    groundRight: 80,
    bricks: [],
    car: null,
    running: false,
    elapsed: 0,
    skids: [],
    dust: [],
    impactFlash: 0,
  };

  // Spatial hash for brick-brick
  const CELL = 0.55;
  function cellKey(cx, cy) { return cx + "," + cy; }

  function buildGrid(bodies) {
    const grid = new Map();
    for (const b of bodies) {
      if (!b.alive) continue;
      const a = b.aabb();
      const x0 = Math.floor(a.minX / CELL);
      const x1 = Math.floor(a.maxX / CELL);
      const y0 = Math.floor(a.minY / CELL);
      const y1 = Math.floor(a.maxY / CELL);
      for (let cx = x0; cx <= x1; cx++) {
        for (let cy = y0; cy <= y1; cy++) {
          const k = cellKey(cx, cy);
          let arr = grid.get(k);
          if (!arr) { arr = []; grid.set(k, arr); }
          arr.push(b);
        }
      }
    }
    return grid;
  }

  // ── SAT collision (OBB vs OBB) ──────────────────────────────────
  function projectAxis(corners, ax, ay) {
    let min = corners[0].x * ax + corners[0].y * ay;
    let max = min;
    for (let i = 1; i < 4; i++) {
      const p = corners[i].x * ax + corners[i].y * ay;
      if (p < min) min = p;
      if (p > max) max = p;
    }
    return { min, max };
  }

  function overlapInterval(a, b) {
    return Math.min(a.max, b.max) - Math.max(a.min, b.min);
  }

  function collideOBB(A, B) {
    const cA = A.corners();
    const cB = B.corners();
    const axes = [
      { x: A.cos, y: A.sin },
      { x: -A.sin, y: A.cos },
      { x: B.cos, y: B.sin },
      { x: -B.sin, y: B.cos },
    ];

    let minPen = Infinity;
    let nX = 0, nY = 0;

    for (let i = 0; i < 4; i++) {
      const ax = axes[i].x, ay = axes[i].y;
      const pA = projectAxis(cA, ax, ay);
      const pB = projectAxis(cB, ax, ay);
      const o = overlapInterval(pA, pB);
      if (o <= 0) return null;
      if (o < minPen) {
        minPen = o;
        nX = ax; nY = ay;
      }
    }

    // Ensure normal points from A to B
    const dx = B.x - A.x, dy = B.y - A.y;
    if (dx * nX + dy * nY < 0) { nX = -nX; nY = -nY; }

    // Contact point: midpoint of overlapping region approximation
    // Use deepest point of A into B along normal
    let best = null, bestD = -Infinity;
    for (const p of cA) {
      const d = (p.x - B.x) * nX + (p.y - B.y) * nY;
      // project A corners into B local and find penetration
    }
    // Average of A corners that are inside B AABB-ish + B corners inside A
    let sx = 0, sy = 0, count = 0;
    for (const p of cA) {
      const l = B.worldToLocal(p.x, p.y);
      if (Math.abs(l.x) <= B.w * 0.5 + 0.02 && Math.abs(l.y) <= B.h * 0.5 + 0.02) {
        sx += p.x; sy += p.y; count++;
      }
    }
    for (const p of cB) {
      const l = A.worldToLocal(p.x, p.y);
      if (Math.abs(l.x) <= A.w * 0.5 + 0.02 && Math.abs(l.y) <= A.h * 0.5 + 0.02) {
        sx += p.x; sy += p.y; count++;
      }
    }
    if (count === 0) {
      sx = (A.x + B.x) * 0.5;
      sy = (A.y + B.y) * 0.5;
    } else {
      sx /= count; sy /= count;
    }

    return { nx: nX, ny: nY, pen: minPen, px: sx, py: sy };
  }

  function resolveCollision(A, B, man, dt) {
    if (A.static && B.static) return;
    const { nx, ny, pen, px, py } = man;
    if (pen <= 0) return;

    // Positional correction (Baumgarte-ish)
    const slop = 0.0015;
    const percent = 0.78;
    const corr = Math.max(pen - slop, 0) * percent;
    const invSum = A.invMass + B.invMass;
    if (invSum > 0) {
      const cx = nx * corr / invSum;
      const cy = ny * corr / invSum;
      if (!A.static) { A.x -= cx * A.invMass; A.y -= cy * A.invMass; A.sleeping = false; }
      if (!B.static) { B.x += cx * B.invMass; B.y += cy * B.invMass; B.sleeping = false; }
    }

    const rax = px - A.x, ray = py - A.y;
    const rbx = px - B.x, rby = py - B.y;
    const vax = A.vx - A.omega * ray;
    const vay = A.vy + A.omega * rax;
    const vbx = B.vx - B.omega * rby;
    const vby = B.vy + B.omega * rbx;
    const rvx = vbx - vax;
    const rvy = vby - vay;
    const velN = rvx * nx + rvy * ny;
    if (velN > 0) return;

    const e = Math.min(A.restitution, B.restitution);
    const ran = rax * ny - ray * nx;
    const rbn = rbx * ny - rby * nx;
    const denom = invSum + ran * ran * A.invInertia + rbn * rbn * B.invInertia;
    if (denom <= 0) return;

    let j = -(1 + e) * velN / denom;
    // Cap impulse for stability with heavy car vs light bricks
    const maxJ = 8000;
    j = clamp(j, -maxJ, maxJ);

    const jx = nx * j, jy = ny * j;
    A.applyImpulse(-jx, -jy, px, py);
    B.applyImpulse(jx, jy, px, py);

    // Friction
    let tx = rvx - velN * nx;
    let ty = rvy - velN * ny;
    const tLen = hypot(tx, ty);
    if (tLen > 1e-6) {
      tx /= tLen; ty /= tLen;
      const rat = rax * ty - ray * tx;
      const rbt = rbx * ty - rby * tx;
      const denomT = invSum + rat * rat * A.invInertia + rbt * rbt * B.invInertia;
      let jt = 0;
      if (denomT > 0) {
        const velT = rvx * tx + rvy * ty;
        jt = -velT / denomT;
      }
      const mu = Math.sqrt(Math.max(0, A.friction * B.friction));
      const maxF = Math.abs(j) * mu;
      jt = clamp(jt, -maxF, maxF);
      A.applyImpulse(-tx * jt, -ty * jt, px, py);
      B.applyImpulse(tx * jt, ty * jt, px, py);
    }
  }

  function collideGround(body) {
    if (body.static || !body.alive) return;
    const corners = body.corners();
    let deepest = 0;
    let cx = 0, cy = 0, count = 0;
    for (const p of corners) {
      const pen = p.y - world.groundY;
      if (pen > 0) {
        deepest = Math.max(deepest, pen);
        cx += p.x; cy += world.groundY; count++;
      }
    }
    // Also check bottom center
    const bottom = body.localToWorld(0, body.h * 0.5);
    if (bottom.y > world.groundY) {
      deepest = Math.max(deepest, bottom.y - world.groundY);
      if (count === 0) { cx = bottom.x; cy = world.groundY; count = 1; }
    }
    if (count === 0) return;

    cx /= count;
    // Positional correction
    body.y -= deepest * 0.9;
    const px = cx, py = world.groundY;
    const nx = 0, ny = -1;

    const rx = px - body.x, ry = py - body.y;
    const vx = body.vx - body.omega * ry;
    const vy = body.vy + body.omega * rx;
    const velN = vx * nx + vy * ny; // = -vy since nx=0,ny=-1 → velN = -vy
    // vel along normal (into ground is positive penetration direction from body to ground normal upward)
    // Normal from ground to body is (0,-1) in our y-down? Wait — we use y-down screen coords.
    // Ground normal pointing "up" (out of ground into free space) is (0, -1) if y increases downward.
    // Relative velocity of body vs ground along normal: bodyVel · n
    // If body is moving into ground (vy > 0), bodyVel·n = vy*(-1) = -vy < 0 → separating? 
    // Convention: n points from A(ground) to B(body) = (0, -1). velN = vB·n - 0 = -vy.
    // If falling (vy>0), velN < 0 → approaching. Good, we resolve when velN < 0.

    if (velN < 0) {
      const e = body.restitution * 0.35;
      const rn = rx * ny - ry * nx;
      const denom = body.invMass + rn * rn * body.invInertia;
      let j = 0;
      if (denom > 0) j = -(1 + e) * velN / denom;
      body.applyImpulse(nx * j, ny * j, px, py);

      // Friction along ground
      let tx = 1, ty = 0;
      const velT = body.vx - body.omega * ry; // approx
      const denomT = body.invMass + (ry * ry) * body.invInertia;
      let jt = 0;
      if (denomT > 0) jt = -velT / denomT;
      const mu = Math.sqrt(body.friction * DEFAULTS.groundFriction);
      const maxF = Math.abs(j) * mu + body.mass * DEFAULTS.gravity * 0.016 * mu * 0.25;
      jt = clamp(jt, -maxF, maxF);
      body.applyImpulse(tx * jt, 0, px, py);
    }

    // Kill tiny bounce / settle
    if (Math.abs(body.vy) < 0.08 && deepest < 0.01) {
      body.vy = 0;
    }
    if (Math.abs(body.vx) < 0.05 && Math.abs(body.omega) < 0.08 && Math.abs(body.vy) < 0.08) {
      body.vx *= 0.5;
      body.omega *= 0.5;
    }
  }

  // ── Scene setup ─────────────────────────────────────────────────
  function wallBaseX() {
    // Short runway so car + wall fit a typical laptop viewport at 80 px/m
    return 9.5;
  }

  function carStartX() {
    return 1.8;
  }

  function wallCenterX() {
    return wallBaseX() + settings.wallCols * DEFAULTS.brickW * 0.5;
  }

  function snapCamera() {
    const wallX = wallCenterX();
    camX = (carStartX() + wallX) * 0.5;
    camY = world.groundY - 1.2;
  }

  function buildScene(launch) {
    nextId = 1;
    world.bricks = [];
    world.skids = [];
    world.dust = [];
    world.impactFlash = 0;
    world.elapsed = 0;
    world.running = !!launch;
    shake = 0;

    const groundY = 0;
    world.groundY = groundY;

    const bw = DEFAULTS.brickW;
    const bh = DEFAULTS.brickH;
    const cols = settings.wallCols;
    const rows = settings.wallRows;
    const layers = settings.wallLayers;
    const mass = settings.brickMass;
    const baseX = wallBaseX();
    const mortar = 0.008;

    // Staggered brick wall; depth layers offset slightly in X for thickness
    const wallSpan = cols * bw + (cols - 1) * mortar;
    const addBrick = (x, y, w, h, layer, row, col, massScale) => {
      const shade = 0.86 + hash2(col + 11, row + 19 + layer * 31) * 0.14;
      const r = Math.floor((142 + layer * 8) * shade);
      const g = Math.floor(68 * shade + 10);
      const b = Math.floor(44 * shade + 4);
      const brick = new Body({
        type: "brick",
        x, y, w, h,
        mass: mass * massScale,
        friction: DEFAULTS.brickFriction,
        restitution: DEFAULTS.brickRestitution,
        layer, row, col,
        color: `rgb(${r},${g},${b})`,
      });
      brick.sleeping = true;
      brick.vx = 0; brick.vy = 0; brick.omega = 0;
      world.bricks.push(brick);
    };

    for (let layer = 0; layer < layers; layer++) {
      const layerOffsetX = layer * (bw * 0.18);
      for (let row = 0; row < rows; row++) {
        const y = groundY - bh * 0.5 - row * (bh + mortar);
        const staggered = row % 2 === 1;
        if (!staggered) {
          for (let col = 0; col < cols; col++) {
            const x = baseX + layerOffsetX + col * (bw + mortar) + bw * 0.5;
            addBrick(x, y, bw, bh, layer, row, col, 1);
          }
        } else {
          // Half brick left, full bricks, half brick right → flush edges
          const half = (bw - mortar) * 0.5;
          addBrick(baseX + layerOffsetX + half * 0.5, y, half, bh, layer, row, -1, half / bw);
          for (let col = 0; col < cols - 1; col++) {
            const x = baseX + layerOffsetX + half + mortar + col * (bw + mortar) + bw * 0.5;
            addBrick(x, y, bw, bh, layer, row, col, 1);
          }
          const rightX = baseX + layerOffsetX + wallSpan - half * 0.5;
          addBrick(rightX, y, half, bh, layer, row, cols, half / bw);
        }
      }
    }

    // Compress stack slightly so bricks rest on each other without gaps
    settleStack(6);

    const carY = groundY - DEFAULTS.carH * 0.5;
    world.car = new Body({
      type: "car",
      x: carStartX(),
      y: carY,
      w: DEFAULTS.carW,
      h: DEFAULTS.carH,
      mass: DEFAULTS.carMass,
      friction: DEFAULTS.groundFriction,
      restitution: 0.05,
      vx: launch ? settings.carSpeed : 0,
      vy: 0,
    });
    world.car.sleeping = !launch;
    world.car.crumple = 0;

    snapCamera();
    updateTelemetry();
  }

  function settleStack(iters) {
    // Small positional settle so staggered wall has contact without launching
    for (let n = 0; n < iters; n++) {
      for (const b of world.bricks) {
        const bottom = b.y + b.h * 0.5;
        if (bottom > world.groundY) b.y -= (bottom - world.groundY);
      }
      // Simple vertical stack correction between overlapping bricks
      for (let i = 0; i < world.bricks.length; i++) {
        const A = world.bricks[i];
        for (let j = i + 1; j < world.bricks.length; j++) {
          const B = world.bricks[j];
          if (A.layer !== B.layer) continue;
          const man = collideOBB(A, B);
          if (!man || man.pen <= 0) continue;
          // Prefer vertical separation for stacking
          if (Math.abs(man.ny) > 0.5) {
            const half = man.pen * 0.5;
            if (A.y < B.y) { A.y -= half; B.y += half; }
            else { A.y += half; B.y -= half; }
          } else {
            const half = man.pen * 0.5;
            if (A.x < B.x) { A.x -= half; B.x += half; }
            else { A.x += half; B.x -= half; }
          }
        }
      }
    }
    for (const b of world.bricks) {
      b.vx = 0; b.vy = 0; b.omega = 0; b.angle = 0; b.sleeping = true;
    }
  }

  // ── Particles (visual only) ─────────────────────────────────────
  function spawnDust(x, y, strength) {
    const n = Math.min(28, Math.floor(6 + strength * 2));
    for (let i = 0; i < n; i++) {
      const a = hash2(i + 1, (world.elapsed * 1000) | 0) * Math.PI * 2;
      const sp = 0.5 + hash2(i + 3, 11) * strength * 0.35;
      world.dust.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.8,
        life: 0.35 + hash2(i, 5) * 0.45,
        age: 0,
        r: 0.04 + hash2(i, 9) * 0.08,
      });
    }
  }

  // ── Simulation step ─────────────────────────────────────────────
  const FIXED_DT = 1 / 120;
  const SUBSTEPS = 3;
  let acc = 0;
  let lastImpactSpeed = 0;

  function wakeNearby(x, y, radius) {
    const r2 = radius * radius;
    for (const b of world.bricks) {
      if (!b.alive || !b.sleeping) continue;
      const dx = b.x - x, dy = b.y - y;
      if (dx * dx + dy * dy < r2) {
        b.sleeping = false;
        b.sleepTimer = 0;
      }
    }
  }

  function stepPhysics(dt) {
    const g = DEFAULTS.gravity;
    const car = world.car;
    if (!car) return;

    const hdt = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) {
      // Integrate
      if (world.running) {
        car.integrate(hdt, 0); // car stays on ground; no free fall
        // Ground constraint for car
        const targetY = world.groundY - car.h * 0.5;
        car.y = targetY;
        car.vy = 0;
        // Ground friction / rolling resistance when not heavily colliding
        if (Math.abs(car.vx) > 0.01) {
          const sign = car.vx > 0 ? 1 : -1;
          const drag = DEFAULTS.groundFriction * 1.8 * hdt;
          car.vx -= sign * drag;
          if (car.vx * sign < 0) car.vx = 0;
        }
        // Soft angular recovery / impact tilt
        car.omega *= 0.9;
        car.angle *= 0.92;
        car.angle = clamp(car.angle, -0.18, 0.12);

        for (const b of world.bricks) {
          if (!b.alive) continue;
          if (!b.sleeping) b.integrate(hdt, g);
        }
      }

      // Car vs bricks
      if (world.running) {
        const carAABB = car.aabb();
        let impact = 0;
        for (const b of world.bricks) {
          if (!b.alive) continue;
          const ba = b.aabb();
          if (ba.maxX < carAABB.minX - 0.05 || ba.minX > carAABB.maxX + 0.05) continue;
          if (ba.maxY < carAABB.minY - 0.05 || ba.minY > carAABB.maxY + 0.05) continue;
          const man = collideOBB(car, b);
          if (!man) continue;
          b.sleeping = false;
          const rel = Math.abs(car.vx - b.vx);
          impact = Math.max(impact, rel);
          resolveCollision(car, b, man, hdt);
          // Crumple / visual compression on car front
          if (man.nx > 0.3) {
            car.crumple = Math.min(0.35, car.crumple + man.pen * 0.15);
            car.angle -= man.pen * 0.02;
          }
          wakeNearby(b.x, b.y, 1.2);
        }
        if (impact > 3 && impact > lastImpactSpeed * 0.85) {
          shake = Math.min(1.2, impact * 0.04);
          world.impactFlash = Math.min(1, impact * 0.05);
          spawnDust(car.x + car.w * 0.45, car.y, impact);
          lastImpactSpeed = impact;
        }
      }

      // Brick vs brick via spatial hash
      const grid = buildGrid(world.bricks);
      const checked = new Set();
      for (const b of world.bricks) {
        if (!b.alive || b.sleeping) continue;
        const a = b.aabb();
        const x0 = Math.floor(a.minX / CELL) - 1;
        const x1 = Math.floor(a.maxX / CELL) + 1;
        const y0 = Math.floor(a.minY / CELL) - 1;
        const y1 = Math.floor(a.maxY / CELL) + 1;
        for (let cx = x0; cx <= x1; cx++) {
          for (let cy = y0; cy <= y1; cy++) {
            const cell = grid.get(cellKey(cx, cy));
            if (!cell) continue;
            for (const o of cell) {
              if (o.id <= b.id || !o.alive) continue;
              const key = b.id + ":" + o.id;
              if (checked.has(key)) continue;
              checked.add(key);
              const aa = o.aabb();
              if (aa.maxX < a.minX || aa.minX > a.maxX || aa.maxY < a.minY || aa.minY > a.maxY) continue;
              const man = collideOBB(b, o);
              if (!man) continue;
              o.sleeping = false;
              resolveCollision(b, o, man, hdt);
            }
          }
        }
      }

      // Ground
      for (const b of world.bricks) {
        if (!b.alive || b.sleeping) continue;
        collideGround(b);
      }

      // Sleep management
      for (const b of world.bricks) {
        if (!b.alive || b.static) continue;
        const speed = hypot(b.vx, b.vy) + Math.abs(b.omega) * 0.2;
        if (speed < 0.06) {
          b.sleepTimer += hdt;
          if (b.sleepTimer > 0.45) {
            b.sleeping = true;
            b.vx = 0; b.vy = 0; b.omega = 0;
          }
        } else {
          b.sleepTimer = 0;
          b.sleeping = false;
        }
        // Cull far debris
        if (b.y > world.groundY + 8 || b.x < -30 || b.x > 120) b.alive = false;
      }

      // Skid marks
      if (world.running && Math.abs(car.vx) > 1) {
        const rear = car.x - car.w * 0.35;
        if (world.skids.length === 0 || Math.abs(world.skids[world.skids.length - 1].x - rear) > 0.08) {
          world.skids.push({ x: rear, a: clamp(Math.abs(car.vx) / 40, 0.15, 0.7) });
          if (world.skids.length > 220) world.skids.shift();
        }
      }
    }

    // Dust update (visual)
    for (let i = world.dust.length - 1; i >= 0; i--) {
      const p = world.dust[i];
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += g * 0.15 * dt;
      if (p.age >= p.life) world.dust.splice(i, 1);
    }

    if (world.running) world.elapsed += dt;
    shake *= 0.88;
    world.impactFlash *= 0.9;
    if (shake < 0.01) shake = 0;
  }

  // ── Rendering ───────────────────────────────────────────────────
  function worldToScreen(x, y) {
    return {
      x: (x - camX) * DEFAULTS.scale + viewW * 0.5,
      y: (y - camY) * DEFAULTS.scale + viewH * 0.62,
    };
  }

  function drawBackground() {
    // Sky already from CSS; draw distant hills / grid
    const gY = worldToScreen(0, world.groundY).y;

    // Horizon haze
    const grad = ctx.createLinearGradient(0, 0, 0, gY);
    grad.addColorStop(0, "rgba(90,140,170,0.12)");
    grad.addColorStop(1, "rgba(40,70,60,0.05)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, Math.max(0, gY));

    // Distant ridge
    ctx.beginPath();
    ctx.moveTo(0, gY - 90);
    for (let x = 0; x <= viewW; x += 40) {
      const h = 40 + hash2(x | 0, 3) * 50;
      ctx.lineTo(x, gY - 70 - h * 0.35);
    }
    ctx.lineTo(viewW, gY);
    ctx.lineTo(0, gY);
    ctx.closePath();
    ctx.fillStyle = "rgba(28, 48, 52, 0.55)";
    ctx.fill();

    // Track surface
    ctx.fillStyle = "#2a3330";
    ctx.fillRect(0, gY, viewW, viewH - gY + 4);
    ctx.fillStyle = "#3a4540";
    ctx.fillRect(0, gY, viewW, 4);

    // Meter marks
    ctx.strokeStyle = "rgba(200,220,210,0.12)";
    ctx.lineWidth = 1;
    ctx.fillStyle = "rgba(180,200,190,0.35)";
    ctx.font = "11px IBM Plex Mono, monospace";
    const startM = Math.floor(camX - viewW / DEFAULTS.scale);
    const endM = Math.ceil(camX + viewW / DEFAULTS.scale);
    for (let m = startM; m <= endM; m++) {
      const p = worldToScreen(m, world.groundY);
      ctx.beginPath();
      ctx.moveTo(p.x, gY);
      ctx.lineTo(p.x, gY + (m % 5 === 0 ? 14 : 8));
      ctx.stroke();
      if (m % 5 === 0) ctx.fillText(m + " m", p.x + 3, gY + 26);
    }

    // Skid marks
    for (const s of world.skids) {
      const p = worldToScreen(s.x, world.groundY);
      ctx.fillStyle = `rgba(20,20,18,${s.a * 0.45})`;
      ctx.fillRect(p.x - 2, gY - 1, 5, 3);
      ctx.fillRect(p.x - 2, gY + 10, 5, 3);
    }
  }

  function drawBrick(b) {
    if (!b.alive) return;
    const hw = b.w * 0.5 * DEFAULTS.scale;
    const hh = b.h * 0.5 * DEFAULTS.scale;
    const p = worldToScreen(b.x, b.y);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(b.angle);
    ctx.fillStyle = b.color || "#a05030";
    ctx.strokeStyle = "rgba(40,18,10,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-hw, -hh, hw * 2, hh * 2, 2);
    ctx.fill();
    ctx.stroke();
    // Mortar highlight edge
    ctx.strokeStyle = "rgba(255,220,180,0.12)";
    ctx.beginPath();
    ctx.moveTo(-hw + 2, -hh + 2);
    ctx.lineTo(hw - 3, -hh + 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawCar(car) {
    const p = worldToScreen(car.x, car.y);
    const S = DEFAULTS.scale;
    const w = car.w * S;
    const h = car.h * S;
    const crumple = car.crumple * S;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(car.angle);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath();
    ctx.ellipse(0, h * 0.52, w * 0.48, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyGrad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    bodyGrad.addColorStop(0, "#c9d4dc");
    bodyGrad.addColorStop(0.45, "#8fa0ad");
    bodyGrad.addColorStop(1, "#5d6d78");
    ctx.fillStyle = bodyGrad;
    ctx.strokeStyle = "rgba(20,28,34,0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-w * 0.48, h * 0.18);
    ctx.lineTo(-w * 0.46, -h * 0.05);
    ctx.lineTo(-w * 0.18, -h * 0.38);
    ctx.lineTo(w * 0.12, -h * 0.40);
    ctx.lineTo(w * 0.38 - crumple, -h * 0.12);
    ctx.lineTo(w * 0.48 - crumple, h * 0.10);
    ctx.lineTo(w * 0.46 - crumple, h * 0.32);
    ctx.lineTo(-w * 0.45, h * 0.34);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cabin glass
    ctx.fillStyle = "rgba(120,190,210,0.55)";
    ctx.beginPath();
    ctx.moveTo(-w * 0.14, -h * 0.10);
    ctx.lineTo(-w * 0.10, -h * 0.34);
    ctx.lineTo(w * 0.08, -h * 0.35);
    ctx.lineTo(w * 0.18, -h * 0.10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(30,40,50,0.4)";
    ctx.stroke();

    // Headlight
    ctx.fillStyle = "#f0e6a8";
    ctx.fillRect(w * 0.40 - crumple, -h * 0.02, 8, 8);

    // Wheels
    const wheelY = h * 0.34;
    const wheelR = h * 0.22;
    const spin = world.running ? -car.x / (wheelR / S) : 0;
    for (const wx of [-w * 0.30, w * 0.28 - crumple * 0.3]) {
      ctx.save();
      ctx.translate(wx, wheelY);
      ctx.rotate(spin);
      ctx.fillStyle = "#1a1e22";
      ctx.beginPath();
      ctx.arc(0, 0, wheelR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-wheelR * 0.6, 0);
      ctx.lineTo(wheelR * 0.6, 0);
      ctx.moveTo(0, -wheelR * 0.6);
      ctx.lineTo(0, wheelR * 0.6);
      ctx.stroke();
      ctx.fillStyle = "#6a7278";
      ctx.beginPath();
      ctx.arc(0, 0, wheelR * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Motion streak when fast
    if (world.running && car.vx > 8) {
      ctx.strokeStyle = `rgba(200,220,230,${clamp((car.vx - 8) / 40, 0, 0.35)})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const yy = -h * 0.1 + i * 8;
        ctx.beginPath();
        ctx.moveTo(-w * 0.55 - i * 6, yy);
        ctx.lineTo(-w * 0.48, yy);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawDust() {
    for (const p of world.dust) {
      const s = worldToScreen(p.x, p.y);
      const a = 1 - p.age / p.life;
      ctx.fillStyle = `rgba(180,170,150,${a * 0.45})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, p.r * DEFAULTS.scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOverlay() {
    if (world.impactFlash > 0.02) {
      ctx.fillStyle = `rgba(255,230,200,${world.impactFlash * 0.12})`;
      ctx.fillRect(0, 0, viewW, viewH);
    }

    // Active params strip
    ctx.font = "12px IBM Plex Mono, monospace";
    ctx.fillStyle = "rgba(10,14,18,0.45)";
    ctx.fillRect(12, 12, 320, 54);
    ctx.strokeStyle = "rgba(180,210,230,0.15)";
    ctx.strokeRect(12.5, 12.5, 319, 53);
    ctx.fillStyle = "rgba(232,240,246,0.9)";
    ctx.fillText(`speed ${settings.carSpeed.toFixed(1)} m/s   mass ${settings.brickMass.toFixed(1)} kg`, 22, 32);
    ctx.fillText(`wall ${settings.wallCols}×${settings.wallRows}×${settings.wallLayers}   scale ${DEFAULTS.scale} px/m`, 22, 50);
  }

  function updateCamera() {
    const car = world.car;
    if (!car) return;
    const wallX = wallCenterX();
    let targetX;
    if (!world.running) {
      targetX = (carStartX() + wallX) * 0.5;
    } else if (car.x < wallBaseX() - 1.5) {
      // Approach: keep car and wall together
      targetX = car.x * 0.45 + wallX * 0.55;
    } else {
      // Impact / aftermath: follow car, keep debris nearby
      targetX = car.x + 1.2;
    }
    camX += (targetX - camX) * (world.running ? 0.16 : 0.3);
    camY += ((world.groundY - 1.35) - camY) * 0.12;

    if (shake > 0) {
      shakeSeed += 1;
      camX += (hash2(shakeSeed, 1) - 0.5) * shake * 0.15;
      camY += (hash2(shakeSeed, 2) - 0.5) * shake * 0.1;
    }
  }

  function render() {
    ctx.clearRect(0, 0, viewW, viewH);
    updateCamera();
    drawBackground();

    // Draw deeper layers first so front face reads clearly
    const sorted = world.bricks.slice().sort((a, b) => b.layer - a.layer);
    for (const b of sorted) drawBrick(b);

    if (world.car) drawCar(world.car);
    drawDust();
    drawOverlay();
  }

  // ── Telemetry / UI ──────────────────────────────────────────────
  const elSpeed = document.getElementById("tSpeed");
  const elTime = document.getElementById("tTime");
  const elMoving = document.getElementById("tMoving");
  const elBricks = document.getElementById("tBricks");

  function updateTelemetry() {
    const car = world.car;
    elSpeed.textContent = car ? Math.abs(car.vx).toFixed(2) : "0.00";
    elTime.textContent = world.elapsed.toFixed(2);
    let moving = 0;
    let alive = 0;
    for (const b of world.bricks) {
      if (!b.alive) continue;
      alive++;
      if (!b.sleeping && hypot(b.vx, b.vy) + Math.abs(b.omega) > 0.08) moving++;
    }
    elMoving.textContent = String(moving);
    elBricks.textContent = String(alive);
  }

  // Settings bindings
  const settingsPanel = document.getElementById("settings");
  const bindRange = (id, key, fmt) => {
    const input = document.getElementById(id);
    const label = document.getElementById(id + "Val");
    const sync = () => {
      const v = parseFloat(input.value);
      settings[key] = v;
      label.textContent = fmt(v);
    };
    input.addEventListener("input", sync);
    sync();
  };
  bindRange("carSpeed", "carSpeed", (v) => v.toFixed(1));
  bindRange("wallCols", "wallCols", (v) => String(v | 0));
  bindRange("wallRows", "wallRows", (v) => String(v | 0));
  bindRange("wallLayers", "wallLayers", (v) => String(v | 0));
  bindRange("brickMass", "brickMass", (v) => v.toFixed(1));

  // Coerce integer settings
  document.getElementById("wallCols").addEventListener("input", () => {
    settings.wallCols = parseInt(document.getElementById("wallCols").value, 10);
  });
  document.getElementById("wallRows").addEventListener("input", () => {
    settings.wallRows = parseInt(document.getElementById("wallRows").value, 10);
  });
  document.getElementById("wallLayers").addEventListener("input", () => {
    settings.wallLayers = parseInt(document.getElementById("wallLayers").value, 10);
  });

  document.getElementById("btnSettings").addEventListener("click", () => {
    settingsPanel.classList.toggle("open");
  });
  document.getElementById("btnCloseSettings").addEventListener("click", () => {
    settingsPanel.classList.remove("open");
  });

  document.getElementById("btnTest").addEventListener("click", () => {
    lastImpactSpeed = 0;
    acc = 0;
    buildScene(true);
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    lastImpactSpeed = 0;
    acc = 0;
    buildScene(false);
  });

  // ── Main loop ───────────────────────────────────────────────────
  let last = performance.now();
  let telemTimer = 0;

  function frame(now) {
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += raw;
    let steps = 0;
    while (acc >= FIXED_DT && steps < 8) {
      stepPhysics(FIXED_DT);
      acc -= FIXED_DT;
      steps++;
    }
    render();
    telemTimer += raw;
    if (telemTimer > 0.1) {
      telemTimer = 0;
      updateTelemetry();
    }
    requestAnimationFrame(frame);
  }

  // Initial scene with defaults (car waiting, wall standing)
  buildScene(false);
  requestAnimationFrame(frame);
})();
</script>
