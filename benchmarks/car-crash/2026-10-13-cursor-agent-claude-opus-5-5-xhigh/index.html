      groups.push(Array.from({ length: NB }, () => []));
      all.push([]);
      const row = [];
      for (let k = 0; k < NB; k++) {
        const u = (k + 0.5) / NB;
        const h = 9 + u * 13, s = 52 + (1 - u) * 12, l = 45 - u * 9 - L * 4.5;
        row.push(`hsl(${h.toFixed(1)} ${s.toFixed(0)}% ${l.toFixed(1)}%)`);
      }
      colors.push(row);
    }
    exp.bricks.forEach((b, i) => {
      b.ri = i;
      groups[b.layer][Math.min(NB - 1, Math.floor(b.tint * NB))].push(b);
      all[b.layer].push(b);
    });
    return { groups, all, colors, corners: new Float32Array(exp.bricks.length * 8) };
  }

  function computeCorners(exp, look) {
    const S = cam.s, C = look.corners;
    for (const b of exp.bricks) {
      const s = b.shapes[0];
      const px = X(b.x) + b.layer * LAYER_DX * S, py = Y(b.y) - b.layer * LAYER_DY * S;
      const ax = b.cs * s.hx * S, ay = -b.sn * s.hx * S, bx = -b.sn * s.hy * S, by = -b.cs * s.hy * S;
      const o = b.ri * 8;
      C[o] = px + ax + bx; C[o + 1] = py + ay + by;
      C[o + 2] = px - ax + bx; C[o + 3] = py - ay + by;
      C[o + 4] = px - ax - bx; C[o + 5] = py - ay - by;
      C[o + 6] = px + ax - bx; C[o + 7] = py + ay - by;
    }
  }

  function quad(C, o) {
    ctx.moveTo(C[o], C[o + 1]); ctx.lineTo(C[o + 2], C[o + 3]);
    ctx.lineTo(C[o + 4], C[o + 5]); ctx.lineTo(C[o + 6], C[o + 7]); ctx.closePath();
  }

  // Edge whose outward normal points most upward (top) or downward (bottom), as corner index pairs.
  function edgeFor(b, top) {
    const c = b.cs, n = b.sn;
    let e;
    if (Math.abs(c) >= Math.abs(n)) e = c > 0 ? 0 : 2; else e = n > 0 ? 3 : 1;
    return top ? e : (e + 2) % 4;
  }

  function drawBricks(exp, look) {
    const S = cam.s, C = look.corners;
    const lw = Math.max(0.7, S * 0.013);
    for (let L = exp.P.layers - 1; L >= 0; L--) {
      const list = look.all[L];
      for (let k = 0; k < NB; k++) {
        const g = look.groups[L][k];
        if (!g.length) continue;
        ctx.beginPath();
        for (const b of g) quad(C, b.ri * 8);
        ctx.fillStyle = look.colors[L][k];
        ctx.fill();
      }
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (const b of list) quad(C, b.ri * 8);
      ctx.strokeStyle = L === 0 ? 'rgba(34,18,13,0.92)' : 'rgba(24,13,10,0.9)';
      ctx.lineWidth = lw;
      ctx.stroke();
      if (S > 18) {
        const inset = lw * 0.9;
        ctx.beginPath();
        for (const b of list) {
          const e = edgeFor(b, true), o = b.ri * 8, i0 = o + e * 2, i1 = o + ((e + 1) % 4) * 2;
          ctx.moveTo(C[i0], C[i0 + 1] + inset); ctx.lineTo(C[i1], C[i1 + 1] + inset);
        }
        ctx.strokeStyle = L === 0 ? 'rgba(255,214,180,0.28)' : 'rgba(255,214,180,0.14)';
        ctx.lineWidth = Math.max(0.6, S * 0.012);
        ctx.stroke();
        ctx.beginPath();
        for (const b of list) {
          const e = edgeFor(b, false), o = b.ri * 8, i0 = o + e * 2, i1 = o + ((e + 1) % 4) * 2;
          ctx.moveTo(C[i0], C[i0 + 1] - inset); ctx.lineTo(C[i1], C[i1 + 1] - inset);
        }
        ctx.strokeStyle = 'rgba(40,12,5,0.35)';
        ctx.lineWidth = Math.max(0.8, S * 0.02);
        ctx.stroke();
        ctx.beginPath();
        let any = false;
        for (const b of list) {
          if (b.damage < 150) continue;
          any = true;
          const o = b.ri * 8;
          const cracks = b.damage > 700 ? 2 : 1;
          for (let q = 0; q < cracks; q++) {
            const u1 = 0.2 + 0.6 * hashUnit(b.id, q, 11), u2 = 0.2 + 0.6 * hashUnit(b.id, q, 23), j = hashUnit(b.id, q, 37) - 0.5;
            const x1 = C[o] + (C[o + 2] - C[o]) * u1, y1 = C[o + 1] + (C[o + 3] - C[o + 1]) * u1;
            const x3 = C[o + 6] + (C[o + 4] - C[o + 6]) * u2, y3 = C[o + 7] + (C[o + 5] - C[o + 7]) * u2;
            const mx = (x1 + x3) / 2 + (C[o] - C[o + 2]) * j * 0.18, my = (y1 + y3) / 2 + (C[o + 1] - C[o + 3]) * j * 0.18;
            ctx.moveTo(x1, y1); ctx.lineTo(mx, my); ctx.lineTo(x3, y3);
          }
        }
        if (any) { ctx.strokeStyle = 'rgba(30,12,8,0.75)'; ctx.lineWidth = Math.max(0.6, S * 0.008); ctx.stroke(); }
      }
    }
  }

  function drawBackground(exp, t) {
    const S = cam.s;
    const band = clamp(0.5 * S, 14, 46);
    floorTop = groundY - band;
    let g = ctx.createLinearGradient(0, 0, 0, floorTop);
    g.addColorStop(0, '#0b0f14'); g.addColorStop(0.55, '#121921'); g.addColorStop(1, '#1b232d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, floorTop);

    // Far hall wall (parallax depth 0.45)
    const p = 0.45, Sp = S * p;
    const bx = (wx) => (wx - cam.x) * Sp + view.cx + cam.shakeX * 0.4;
    const by = (wy) => floorTop - wy * Sp + cam.shakeY * 0.4;
    const xL = cam.x - view.cx / Sp, xR = cam.x + (W - view.cx) / Sp;
    for (let x = Math.floor(xL / 8) * 8; x <= xR + 8; x += 8) {
      const lx = bx(x);
      const rg = ctx.createRadialGradient(lx, 40, 0, lx, 40, 7 * Sp);
      rg.addColorStop(0, 'rgba(190,210,235,0.10)'); rg.addColorStop(1, 'rgba(190,210,235,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(lx - 7 * Sp, 0, 14 * Sp, floorTop);
      ctx.fillStyle = 'rgba(220,235,255,0.55)';
      ctx.fillRect(lx - 1.2 * Sp, 58, 2.4 * Sp, Math.max(2, 0.06 * Sp));
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.floor(xL / 4) * 4; x <= xR; x += 4) { const lx = Math.round(bx(x)) + 0.5; ctx.moveTo(lx, 56); ctx.lineTo(lx, floorTop); }
    ctx.stroke();
    // Structural columns and a ceiling truss give the hall scale
    const colW = Math.max(6, 0.45 * Sp);
    for (let x = Math.floor(xL / 12) * 12 + 6; x <= xR + 12; x += 12) {
      const lx = bx(x) - colW / 2;
      const cg = ctx.createLinearGradient(lx, 0, lx + colW, 0);
      cg.addColorStop(0, '#0d1218'); cg.addColorStop(0.35, '#1c252f'); cg.addColorStop(1, '#0a0e13');
      ctx.fillStyle = cg;
      ctx.fillRect(lx, 56, colW, floorTop - 56);
      ctx.fillStyle = 'rgba(255,197,49,0.35)';
      ctx.fillRect(lx, by(0.6), colW, Math.max(2, 0.05 * Sp));
    }
    ctx.strokeStyle = 'rgba(160,175,195,0.07)';
    ctx.lineWidth = Math.max(1, 0.03 * Sp);
    ctx.beginPath();
    const tTop = 70, tBot = 70 + Math.max(10, 0.6 * Sp);
    ctx.moveTo(0, tTop); ctx.lineTo(W, tTop); ctx.moveTo(0, tBot); ctx.lineTo(W, tBot);
    for (let x = Math.floor(xL / 1.5) * 1.5; x <= xR; x += 1.5) {
      const a = bx(x), b = bx(x + 0.75);
      ctx.moveTo(a, tBot); ctx.lineTo(b, tTop); ctx.lineTo(bx(x + 1.5), tBot);
    }
    ctx.stroke();
    if (hazardPattern) {
      const y0 = by(1.25), h = Math.max(4, 0.22 * Sp);
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.translate(bx(0) % 16, 0);
      ctx.fillStyle = hazardPattern;
      ctx.fillRect(-16, y0 - h, W + 32, h);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.font = `700 ${Math.round(clamp(0.9 * Sp, 12, 64))}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (let x = Math.floor(xL / 40) * 40 + 20; x <= xR + 40; x += 40) ctx.fillText('IMPACT HALL  \u00b7  TRACK 2', bx(x), by(2.7));

    // Floor surface (oblique depth band)
    g = ctx.createLinearGradient(0, floorTop, 0, groundY);
    g.addColorStop(0, '#262d36'); g.addColorStop(1, '#3a434e');
    ctx.fillStyle = g;
    ctx.fillRect(0, floorTop, W, band);
    const slant = band * (LAYER_DX / LAYER_DY);
    const x0 = cam.x - (view.cx + slant) / S - 1, x1 = cam.x + (W - view.cx) / S + 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath();
    for (let x = Math.ceil(x0); x <= x1; x++) { const sx = X(x); ctx.moveTo(sx, groundY); ctx.lineTo(sx + slant, floorTop); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,197,49,0.55)';
    ctx.fillRect(0, floorTop + band * 0.22, W, Math.max(1, band * 0.06));
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let x = Math.ceil(x0 / 2) * 2; x <= x1; x += 2) ctx.fillRect(X(x) + slant * 0.55, groundY - band * 0.55, Math.max(2, 0.9 * S), Math.max(1, band * 0.05));

    // Floor front face + ruler
    g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, '#1b2028'); g.addColorStop(1, '#0b0e12');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(0, groundY, W, 1);
    const labelStep = S * 5 >= 46 ? 5 : S * 10 >= 46 ? 10 : 20;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    for (let x = Math.ceil(x0); x <= x1; x++) {
      const sx = Math.round(X(x)) + 0.5, big = x % labelStep === 0, mid = x % 5 === 0;
      if (S < 7 && !mid) continue;
      ctx.moveTo(sx, groundY + 1); ctx.lineTo(sx, groundY + (big ? 13 : mid ? 9 : 5));
    }
    ctx.stroke();
    ctx.font = '600 10.5px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let x = Math.ceil(x0 / labelStep) * labelStep; x <= x1; x += labelStep) {
      ctx.fillStyle = x === 0 ? 'rgba(255,197,49,0.85)' : 'rgba(255,255,255,0.42)';
      ctx.fillText(x === 0 ? '0 m \u00b7 WALL FACE' : `${x > 0 ? '+' : ''}${x} m`, X(x), groundY + 16);
    }
    ctx.fillStyle = 'rgba(255,197,49,0.7)';
    ctx.font = '600 9.5px ui-monospace, Menlo, monospace';
    ctx.fillText('TOW RELEASE', X(RELEASE_X), groundY + 31);
    ctx.fillText('START', X(-RUNUP), groundY + 31);
    ctx.fillRect(X(RELEASE_X) - 0.5, groundY + 1, 1, 28);
    ctx.fillRect(X(-RUNUP) - 0.5, groundY + 1, 1, 28);

    // Scale bar
    const barM = S >= 50 ? 1 : S >= 12 ? 5 : 10;
    const bxp = 18, byp = H - 34;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(bxp, byp, barM * S, 2);
    ctx.fillRect(bxp, byp - 4, 1.5, 10); ctx.fillRect(bxp + barM * S - 1.5, byp - 4, 1.5, 10);
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`${barM} m  \u00b7  ${S.toFixed(1)} px/m`, bxp, byp - 6);
  }

  function drawWallFootprint(exp) {
    if (exp.state === 'ready') return;
    const S = cam.s;
    ctx.save();
    ctx.setLineDash([Math.max(3, S * 0.08), Math.max(3, S * 0.06)]);
    ctx.strokeStyle = 'rgba(255,197,49,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(X(exp.wallX0), Y(exp.wallH), (exp.wallX1 - exp.wallX0) * S, exp.wallH * S);
    ctx.restore();
  }

  /* ---------------- Car ---------------- */
  const BODY_TOP = [[-2.06, 0.24], [-2.12, 0.40], [-2.12, 0.62], [-2.06, 0.80], [-1.98, 0.88], [-1.55, 0.92], [-1.28, 0.94],
    [-0.92, 1.30], [-0.62, 1.43], [0.20, 1.45], [0.48, 1.40], [1.02, 0.99]];
  const NOSE = [[2.10, 0.74], [2.13, 0.50], [2.09, 0.30], [1.96, 0.20]];
  const ARCH_R = 0.42, ARCH_CY = 0.33, AXLE_F = 1.22, AXLE_R = -1.38, ARCH_A0 = Math.asin((ARCH_CY - 0.22) / ARCH_R);
  const GLASS = [[-1.17, 0.98], [-0.87, 1.29], [-0.60, 1.385], [0.17, 1.40], [0.43, 1.355], [0.90, 1.0]];

  const deformX = (x, cd) => (x <= 0.95 ? x : 0.95 + (x - 0.95) * (1 - cd / 1.18));

  function carOutline(cd) {
    const pts = BODY_TOP.map(p => [deformX(p[0], cd), p[1]]);
    const N = 8;
    for (let i = 1; i <= N; i++) {
      const x = 1.02 + (0.93 * i) / N;
      const y = x < 1.55 ? 0.99 + (0.92 - 0.99) * (x - 1.02) / 0.53 : 0.92 + (0.84 - 0.92) * (x - 1.55) / 0.40;
      const t = (x - 1.02) / 0.93;
      const zig = i < N ? (i % 2 ? 1 : -1) * cd * 0.08 : 0;
      pts.push([deformX(x, cd), y + cd * 0.32 * Math.sin(Math.PI * t) + zig]);
    }
    const acx = deformX(AXLE_F, cd);
    for (const [x, y] of NOSE) {
      let nx = deformX(x, cd);
      if (y < ARCH_CY + ARCH_R + 0.03) {
        const dy = y - ARCH_CY, rr = ARCH_R + 0.04;
        nx = Math.max(nx, acx + Math.sqrt(Math.max(0, rr * rr - dy * dy)));
      }
      pts.push([nx, y + (y < 0.6 ? cd * 0.05 : 0)]);
    }
    return { pts, acx };
  }

  function drawCar(exp) {
    const car = exp.car, S = cam.s, sx = exp.sx, sy = exp.sy;
    const cd = Math.min(exp.crush / sx, 0.62);
    const L = (x) => x * sx - car.comX, Ly = (y) => y * sy - car.comY;
    const { pts, acx } = carOutline(cd);

    // contact shadow
    const shw = 2.3 * sx * S, shy = groundY - 1 + cam.shakeY;
    const lift = clamp(car.y - car.comY, 0, 3);
    const sg = ctx.createRadialGradient(X(car.x), shy, 0, X(car.x), shy, shw);
    sg.addColorStop(0, `rgba(0,0,0,${0.5 / (1 + lift)})`); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(X(car.x), shy); ctx.scale(1, 0.09); ctx.translate(-X(car.x), -shy);
    ctx.fillStyle = sg; ctx.fillRect(X(car.x) - shw, shy - shw, shw * 2, shw * 2);
    ctx.restore();

    ctx.save();
    ctx.translate(X(car.x), Y(car.y));
    ctx.scale(S, -S);
    ctx.rotate(car.a);
    ctx.lineJoin = 'round';

    const body = new Path2D();
    body.moveTo(L(pts[0][0]), Ly(pts[0][1]));
    for (let i = 1; i < pts.length; i++) body.lineTo(L(pts[i][0]), Ly(pts[i][1]));
    body.lineTo(L(acx + ARCH_R * Math.cos(ARCH_A0)), Ly(0.22));
    body.ellipse(L(acx), Ly(ARCH_CY), ARCH_R * sx, ARCH_R * sy, 0, -ARCH_A0, Math.PI + ARCH_A0, false);
    body.lineTo(L(AXLE_R + ARCH_R * Math.cos(ARCH_A0)), Ly(0.22));
    body.ellipse(L(AXLE_R), Ly(ARCH_CY), ARCH_R * sx, ARCH_R * sy, 0, -ARCH_A0, Math.PI + ARCH_A0, false);
    body.closePath();

    const bg = ctx.createLinearGradient(0, Ly(1.45), 0, Ly(0.2));
    bg.addColorStop(0, '#8fb4ff'); bg.addColorStop(0.18, '#4d86ff'); bg.addColorStop(0.55, '#2f66e8'); bg.addColorStop(0.8, '#1d48b5'); bg.addColorStop(1, '#14327e');
    ctx.fillStyle = bg;
    ctx.fill(body);

    // lower cladding
    ctx.save();
    ctx.clip(body);
    ctx.fillStyle = 'rgba(12,16,26,0.78)';
    ctx.fillRect(L(-2.3), Ly(0.0), 4.8 * sx, 0.31 * sy);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(L(-2.3), Ly(0.72), 4.8 * sx, 0.018 * sy);
    // glass
    const glass = new Path2D();
    glass.moveTo(L(GLASS[0][0]), Ly(GLASS[0][1]));
    for (let i = 1; i < GLASS.length; i++) glass.lineTo(L(GLASS[i][0]), Ly(GLASS[i][1]));
    glass.closePath();
    const gg = ctx.createLinearGradient(L(-1.2), Ly(1.4), L(0.9), Ly(0.98));
    gg.addColorStop(0, '#1c2a3f'); gg.addColorStop(0.45, '#0c1422'); gg.addColorStop(0.5, '#3a4f6c'); gg.addColorStop(0.56, '#0e1726'); gg.addColorStop(1, '#16243a');
    ctx.fillStyle = gg;
    ctx.fill(glass);
    ctx.fillStyle = '#2a5bd6';
    ctx.fillRect(L(-0.30), Ly(0.96), 0.1 * sx, 0.46 * sy);
    if (exp.glassDamage > 0.05) {
      ctx.save();
      ctx.clip(glass);
      ctx.strokeStyle = `rgba(235,245,255,${0.35 + 0.5 * exp.glassDamage})`;
      ctx.lineWidth = 0.012;
      const ox = L(0.62), oy = Ly(1.16);
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a = i * 0.7 + 0.3, len = (0.25 + 0.35 * hashUnit(i, 5, 9)) * (0.5 + exp.glassDamage);
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox + Math.cos(a) * len * 0.5 + 0.03, oy + Math.sin(a) * len * 0.5);
        ctx.lineTo(ox + Math.cos(a + 0.12) * len, oy + Math.sin(a + 0.12) * len);
      }
      ctx.stroke();
      ctx.restore();
    }
    // door seams and handles
    ctx.strokeStyle = 'rgba(8,18,45,0.55)';
    ctx.lineWidth = 0.014;
    ctx.beginPath();
    ctx.moveTo(L(-0.25), Ly(0.97)); ctx.lineTo(L(-0.25), Ly(0.27));
    ctx.moveTo(L(0.92), Ly(1.0)); ctx.lineTo(L(0.96), Ly(0.30));
    ctx.moveTo(L(-1.22), Ly(0.95)); ctx.quadraticCurveTo(L(-1.32), Ly(0.6), L(-1.0), Ly(0.27));
    ctx.stroke();
    ctx.fillStyle = 'rgba(10,18,40,0.7)';
    ctx.fillRect(L(-0.62), Ly(0.83), 0.16 * sx, 0.03 * sy);
    ctx.fillRect(L(0.48), Ly(0.83), 0.16 * sx, 0.03 * sy);
    // crash-test targets
    for (const [tx, ty, tr] of [[0.30, 0.56, 0.085], [-0.78, 0.56, 0.085], [-0.25, 1.30, 0.06]]) {
      const cx = L(tx), cy = Ly(ty), rx = tr * sx, ry = tr * sy;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI / 2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 1.5); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // lights and mirror
    const hx = deformX(2.02, cd);
    ctx.fillStyle = cd > 0.08 ? 'rgba(255,240,200,0.45)' : '#fff3c4';
    ctx.beginPath(); ctx.ellipse(L(hx), Ly(0.69), 0.07 * sx, 0.045 * sy, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff3b30';
    ctx.fillRect(L(-2.115), Ly(0.66), 0.07 * sx, 0.13 * sy);
    ctx.fillStyle = '#16244a';
    ctx.beginPath(); ctx.ellipse(L(0.86), Ly(1.04), 0.08 * sx, 0.05 * sy, 0.3, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(6,12,30,0.85)';
    ctx.lineWidth = 0.02;
    ctx.stroke(body);
    ctx.restore();

    // wheels
    const cs = car.cs, sn = car.sn;
    for (const wh of car.wheels) {
      const shift = wh.front ? (acx - AXLE_F) * sx : 0;
      const hx0 = car.x + cs * (wh.lx + shift) - sn * wh.ly, hy0 = car.y + sn * (wh.lx + shift) + cs * wh.ly;
      const wx = hx0 + sn * wh.len, wy = hy0 - cs * wh.len;
      drawWheel(X(wx), Y(wy), wh.r * S, wh.angle);
    }
  }

  function drawWheel(px, py, R, ang) {
    ctx.fillStyle = '#121418';
    ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2b2f36'; ctx.lineWidth = Math.max(1, R * 0.1);
    ctx.beginPath(); ctx.arc(px, py, R * 0.84, 0, Math.PI * 2); ctx.stroke();
    const rg = ctx.createRadialGradient(px - R * 0.15, py - R * 0.15, R * 0.05, px, py, R * 0.62);
    rg.addColorStop(0, '#e9eef3'); rg.addColorStop(1, '#8a949f');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(px, py, R * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3b424b'; ctx.lineWidth = Math.max(1, R * 0.13); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = -ang + (k * Math.PI * 2) / 5;
      ctx.moveTo(px + Math.cos(a) * R * 0.16, py + Math.sin(a) * R * 0.16);
      ctx.lineTo(px + Math.cos(a) * R * 0.52, py + Math.sin(a) * R * 0.52);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#4a525c';
    ctx.beginPath(); ctx.arc(px, py, R * 0.13, 0, Math.PI * 2); ctx.fill();
  }

  function drawTow(exp) {
    const car = exp.car, S = cam.s;
    const hookLx = exp.chassisFront0 - exp.crush - 0.05, hookLy = car.shapes[0].oy - car.shapes[0].hy + 0.05;
    const hx = car.x + car.cs * hookLx - car.sn * hookLy, hy = car.y + car.sn * hookLx + car.cs * hookLy;
    ctx.strokeStyle = 'rgba(200,205,212,0.75)';
    ctx.lineWidth = Math.max(1, S * 0.012);
    ctx.beginPath();
    if (!exp.released) {
      ctx.moveTo(X(hx), Y(hy)); ctx.lineTo(X(hx + 0.25), Y(0.02)); ctx.lineTo(X(RELEASE_X + 0.4), Y(0.02));
    } else {
      ctx.moveTo(X(RELEASE_X - 1.4), Y(0.015)); ctx.lineTo(X(RELEASE_X + 0.4), Y(0.015));
    }
    ctx.stroke();
    ctx.fillStyle = '#d9a520';
    ctx.fillRect(X(RELEASE_X + 0.4) - S * 0.06, Y(0.08), S * 0.16, S * 0.08);
  }

  function drawSkids(exp) {
    if (!exp.skidMarks.length) return;
    const S = cam.s;
    ctx.lineCap = 'round';
    const lw = Math.max(2.5, 0.1 * S), y = groundY - Math.max(3, 0.07 * S) + cam.shakeY;
    ctx.strokeStyle = 'rgba(4,4,6,0.62)';
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (const m of exp.skidMarks) {
      const yy = m.front ? y : y - lw * 0.6;
      ctx.moveTo(X(m.x0), yy); ctx.lineTo(X(m.x1), yy);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  /* ---------------- Effects (visual only) ---------------- */
  class Effects {
    constructor() { this.reset(1); }
    reset(seed) {
      this.rand = mulberry32(seed);
      this.parts = [];
      this.shake = 0; this.flash = 0; this.flashX = 0; this.flashY = 0;
      this.glassDone = false;
    }
    add(p) { if (this.parts.length < 1400) this.parts.push(p); }
    dust(x, y, n, a, spread) {
      const R = this.rand;
      for (let i = 0; i < n; i++) {
        this.add({ k: 0, x: x + (R() - 0.5) * 0.2, y: Math.max(0.05, y + (R() - 0.5) * 0.15), vx: (R() - 0.35) * spread, vy: R() * 1.1 + 0.15,
          r: 0.07 + R() * 0.12, gr: 0.3 + R() * 0.6, life: 0, max: 0.9 + R() * 1.3, a });
      }
    }
    chips(x, y, color, n, vx0) {
      const R = this.rand;
      for (let i = 0; i < n; i++) {
        this.add({ k: 1, x, y, vx: vx0 * (0.3 + R() * 0.6) + (R() - 0.5) * 4, vy: 1 + R() * 5, size: 0.025 + R() * 0.05,
          rot: R() * 6.28, vr: (R() - 0.5) * 30, life: 0, max: 1.6 + R() * 1.2, color });
      }
    }
    consume(exp, look) {
      const R = this.rand, car = exp.car;
      for (const ev of exp.fx) {
        const A = ev.a, B = ev.b, e = ev.e;
        const carHit = (A && A.isCar) || B.isCar;
        const brick = B.kind === 'brick' ? B : (A && A.kind === 'brick' ? A : null);
        const color = brick ? look.colors[brick.layer][Math.min(NB - 1, Math.floor(brick.tint * NB))] : '#999';
        if (carHit && brick) {
          this.shake = Math.min(1, this.shake + e / 5000);
          if (e > 300 && e / 2500 > this.flash) { this.flash = Math.min(1, e / 2500); this.flashX = ev.x; this.flashY = ev.y; }
          if (R() < 0.45) this.dust(ev.x, ev.y, Math.min(2, 1 + Math.floor(e / 1500)), 0.26, 3);
          if (e > 120) this.chips(ev.x, ev.y, color, Math.min(3, Math.floor(e / 400) + 1), car.vx);
        } else if (ev.ground) {
          if (B.isCar) {
            for (let i = 0; i < 3; i++) this.add({ k: 2, x: ev.x, y: 0.03, vx: B.vx * 0.6 + (R() - 0.5) * 5, vy: R() * 2.5, life: 0, max: 0.2 + R() * 0.25 });
          } else if (e > 30 && R() < 0.55) this.dust(ev.x, 0.04, 1, 0.2, 2);
        } else if (brick) {
          if (e > 80) this.chips(ev.x, ev.y, color, e > 300 ? 2 : 1, (A ? A.vx + B.vx : B.vx) * 0.5);
          if (e > 60 && R() < 0.3) this.dust(ev.x, ev.y, 1, 0.18, 1.5);
        }
      }
      exp.fx.length = 0;
      if (!this.glassDone && exp.glassDamage > 0.5) {
        this.glassDone = true;
        const gx = car.x + car.cs * (0.62 * exp.sx - car.comX) - car.sn * (1.16 * exp.sy - car.comY);
        const gy = car.y + car.sn * (0.62 * exp.sx - car.comX) + car.cs * (1.16 * exp.sy - car.comY);
        for (let i = 0; i < 26; i++) this.add({ k: 4, x: gx, y: gy, vx: car.vx * 0.7 + (R() - 0.5) * 4, vy: R() * 3, size: 0.015 + R() * 0.025, rot: R() * 6, vr: (R() - 0.5) * 40, life: 0, max: 1.5 + R() });
      }
      if (exp.state === 'running') {
        for (const wh of car.wheels) {
          if (wh.skid && !wh.onBrick && R() < 0.3) {
            this.add({ k: 3, x: wh.hitX + (R() - 0.5) * 0.3, y: 0.1, vx: car.vx * 0.15 + (R() - 0.5) * 0.6, vy: 0.25 + R() * 0.45,
              r: 0.12 + R() * 0.14, gr: 0.45 + R() * 0.4, life: 0, max: 1.1 + R() * 0.9, a: 0.12 });
          }
        }
      }
    }
    update(dt) {
      if (dt <= 0) return;
      const P = this.parts;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.life += dt;
        if (p.life >= p.max) { P[i] = P[P.length - 1]; P.pop(); continue; }
        if (p.k === 0 || p.k === 3) {
          const d = Math.exp(-dt * 1.6);
          p.vx *= d; p.vy *= d;
          p.r += p.gr * dt * (1 - p.life / p.max);
        } else {
          p.vy -= 9.81 * dt;
          p.rot += (p.vr || 0) * dt;
        }
        p.x += p.vx * dt; p.y += p.vy * dt;
        if ((p.k === 1 || p.k === 4) && p.y < 0.012) { p.y = 0.012; p.vy *= -0.3; p.vx *= 0.55; p.vr *= 0.5; }
      }
      this.shake *= Math.exp(-dt * 5);
      this.flash *= Math.exp(-dt * 10);
    }
    draw() {
      const S = cam.s;
      for (const p of this.parts) {
        const f = 1 - p.life / p.max;
        if (p.k === 0 || p.k === 3) {
          ctx.globalAlpha = p.a * f * f;
          ctx.fillStyle = p.k === 0 ? '#a58f7c' : '#c9ccd1';
          ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), Math.max(1, p.r * S), 0, Math.PI * 2); ctx.fill();
        } else if (p.k === 1 || p.k === 4) {
          ctx.globalAlpha = Math.min(1, f * 3) * (p.k === 4 ? 0.8 : 1);
          ctx.fillStyle = p.k === 4 ? '#dff1ff' : p.color;
          const s = Math.max(1.2, p.size * S), px = X(p.x), py = Y(p.y);
          ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot); ctx.fillRect(-s / 2, -s / 3, s, s * 0.66); ctx.restore();
        } else {
          ctx.globalAlpha = f;
          ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(X(p.x), Y(p.y)); ctx.lineTo(X(p.x - p.vx * 0.03), Y(p.y - p.vy * 0.03)); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
      if (this.flash > 0.02) {
        const px = X(this.flashX), py = Y(this.flashY), r = 2.2 * S;
        const g = ctx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, `rgba(255,240,215,${0.4 * this.flash})`); g.addColorStop(1, 'rgba(255,240,215,0)');
        ctx.fillStyle = g; ctx.fillRect(px - r, py - r, r * 2, r * 2);
      }
    }
  }

  /* ---------------- Camera ---------------- */
  let debrisX = 0, debrisFrame = 0, debrisBuf = new Float64Array(0);
  function updateCamera(exp, dt, snap) {
    const car = exp.car;
    const rear = car.x + car.cs * car.rearLocal, front = exp.frontX();
    let minX, maxX;
    if (exp.state === 'ready') { minX = Math.min(rear, exp.wallX0) - 1.2; maxX = exp.wallX1 + 1.6; }
    else {
      if (snap || ++debrisFrame % 10 === 0) {
        const n = exp.bricks.length;
        if (debrisBuf.length < n) debrisBuf = new Float64Array(n);
        for (let i = 0; i < n; i++) debrisBuf[i] = exp.bricks[i].x;
        const arr = debrisBuf.subarray(0, n).sort();
        debrisX = arr[Math.floor((n - 1) * 0.85)];
      }
      minX = Math.min(rear, exp.wallX0) - 1.5;
      maxX = Math.max(exp.wallX1, front, debrisX) + 2;
    }
    const availW = Math.max(200, W - view.right - 60);
    const availH = Math.max(120, groundY - view.top - 40);
    const hNeed = Math.max(exp.wallH, exp.P.carHeight, 2.2) + 0.9;
    let s = Math.min(settings.scale, availW / (maxX - minX), availH / hNeed);
    if (s < 14) {
      s = 14;
      const span = availW / s;
      minX = Math.max(minX, front + 2.5 - span);
      maxX = minX + span;
    }
    const cx = (minX + maxX) / 2;
    if (snap) { cam.s = s; cam.x = cx; }
    else {
      const k = 1 - Math.exp(-dt * 3.5);
      cam.s += (s - cam.s) * k;
      cam.x += (cx - cam.x) * k;
    }
  }

  /* ---------------- Overlays ---------------- */
  function pill(text, x, y, bg, fg, minLeft = -Infinity) {
    ctx.font = '600 12px ui-sans-serif, system-ui, sans-serif';
    const w = ctx.measureText(text).width + 18;
    if (x - w / 2 < minLeft) x = minLeft + w / 2;
    x = clamp(x, w / 2 + 8, Math.max(w / 2 + 8, W - view.right - w / 2 - 8));
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w / 2, y - 12, w, 24, 12); else ctx.rect(x - w / 2, y - 12, w, 24);
    ctx.fill();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 0.5);
  }

  function drawOverlay(exp) {
    const car = exp.car, S = cam.s;
    const tagX = X(car.x), tagY = Y(car.y + 1.25 * exp.sy) - 18;
    if (exp.state === 'ready') {
      pill('Ready \u00b7 press Test (Space)', tagX, tagY, 'rgba(255,197,49,0.92)', '#1b1400');
    } else {
      const v = Math.hypot(car.vx, car.vy);
      if (v > 0.3 || exp.state === 'running') pill(`${v.toFixed(1)} m/s`, tagX, tagY, 'rgba(10,14,20,0.78)', '#e9ecf1');
    }
    if (exp.state === 'complete') {
      const st = exp.stats;
      pill(`Complete \u00b7 settled at t = ${exp.completeTime.toFixed(2)} s \u00b7 ${st.displaced}/${st.total} bricks displaced \u00b7 press Test to rerun`,
        (W - view.right) / 2, view.top + 22, 'rgba(18,48,34,0.85)', '#9ff0c3', W > 760 ? 372 : 12);
    }
    if (exp.impactTime < 0 && exp.state === 'running' && S > 20) {
      const d = Math.max(0, -exp.frontX());
      ctx.font = '600 11px ui-monospace, Menlo, monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(`${d.toFixed(1)} m to wall`, (X(exp.frontX()) + X(0)) / 2, Y(0) - 6);
    }
  }

  /* ---------------- Telemetry chart ---------------- */
  const chart = document.getElementById('chart');
  const cctx = chart.getContext('2d');
  function sizeChart() {
    const r = chart.getBoundingClientRect();
    chart.width = Math.max(1, Math.round(r.width * DPR)); chart.height = Math.max(1, Math.round(r.height * DPR));
  }
  function drawChart(exp) {
    const w = chart.width / DPR, h = chart.height / DPR;
    cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cctx.clearRect(0, 0, w, h);
    const hist = exp.history, n = hist.length / 3;
    const tEnd = n ? hist[hist.length - 3] : 0;
    const tMax = Math.max(6, Math.ceil(tEnd + 0.5));
    const vMax = Math.max(exp.P.speed * 1.12, 5), mMax = Math.max(1, exp.stats.total);
    cctx.strokeStyle = 'rgba(255,255,255,0.06)'; cctx.lineWidth = 1;
    cctx.beginPath();
    for (let t = 1; t < tMax; t++) { const x = Math.round((t / tMax) * w) + 0.5; cctx.moveTo(x, 0); cctx.lineTo(x, h); }
    cctx.stroke();
    const line = (col, idx, max) => {
      cctx.strokeStyle = col; cctx.lineWidth = 1.5; cctx.beginPath();
      const stride = Math.max(1, Math.floor(n / (w * 1.5)));
      for (let i = 0; i < n; i += stride) {
        const x = (hist[i * 3] / tMax) * w, y = h - 3 - (hist[i * 3 + idx] / max) * (h - 8);
        if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
      }
      cctx.stroke();
    };
    if (n > 1) { line('#ff8a5c', 2, mMax); line('#6ea0ff', 1, vMax); }
    if (exp.impactTime >= 0) {
      const x = Math.round((exp.impactTime / tMax) * w) + 0.5;
      cctx.strokeStyle = 'rgba(255,197,49,0.8)'; cctx.beginPath(); cctx.moveTo(x, 0); cctx.lineTo(x, h); cctx.stroke();
    }
    cctx.fillStyle = 'rgba(255,255,255,0.35)'; cctx.font = '9.5px ui-monospace, Menlo, monospace';
    cctx.textAlign = 'right'; cctx.textBaseline = 'top';
    cctx.fillText(`${tMax} s`, w - 4, 3);
    cctx.textAlign = 'left';
    cctx.fillText(`${vMax.toFixed(0)} m/s`, 4, 3);
  }

  /* =====================================================================
   * UI
   * ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const settings = Object.assign({}, DEFAULTS);
  const PHYS_KEYS = PARAMS.filter(p => p.key !== 'scale').map(p => p.key).concat(['autoBrake']);
  const panel = $('panel'), panelBody = $('panelBody');
  const inputs = {};
  const fmt = (p, v) => Number(v).toFixed(p.dec);

  function buildPanel() {
    const section = (title, parent) => {
      const t = document.createElement('div');
      t.className = 'group-title'; t.textContent = title;
      parent.appendChild(t);
    };
    const field = (p, parent) => {
      const f = document.createElement('div');
      f.className = 'field';
      f.innerHTML =
        `<div class="row"><label for="rng_${p.key}">${p.label}</label>` +
        `<div class="val"><input type="number" id="num_${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${p.label}">` +
        `<span class="unit">${p.unit}</span></div></div>` +
        `<input type="range" id="rng_${p.key}" min="${p.min}" max="${p.max}" step="${p.step}">` +
        `<div class="meta"><span>${fmt(p, p.min)}</span><span>default ${fmt(p, p.def)}</span><span>${fmt(p, p.max)}</span></div>`;
      parent.appendChild(f);
      const rng = f.querySelector('input[type=range]'), num = f.querySelector('input[type=number]');
      inputs[p.key] = { p, f, rng, num };
      rng.addEventListener('input', () => setParam(p.key, parseFloat(rng.value)));
      num.addEventListener('change', () => setParam(p.key, parseFloat(num.value)));
      num.addEventListener('keydown', (e) => { if (e.key === 'Enter') num.blur(); });
    };
    section('Experiment', panelBody);
    for (const p of PARAMS) if (p.group === 'main') field(p, panelBody);

    const det = document.createElement('details');
    det.className = 'adv';
    det.innerHTML = '<summary class="group-title"><span>Advanced physics</span><span class="caret">\u203a</span></summary>';
    panelBody.appendChild(det);
    for (const p of PARAMS) if (p.group === 'adv') field(p, det);
    const tg = document.createElement('div');
    tg.className = 'toggle-row';
    tg.innerHTML = '<div>Auto-brake after impact<small>Wheels lock 0.25 s after first contact</small></div>' +
      '<label class="switch"><input type="checkbox" id="chkBrake"><span></span></label>';
    det.appendChild(tg);
    const chk = tg.querySelector('input');
    chk.addEventListener('change', () => setParam('autoBrake', chk.checked));

    section('View', panelBody);
    for (const p of PARAMS) if (p.group === 'view') field(p, panelBody);
    const note = document.createElement('p');
    note.className = 'note';
    note.innerHTML = 'Rigid-body solver: 480 Hz fixed step, sequential impulses with warm starting, speculative contacts and split-impulse ' +
      'position correction. Every brick is an independent body; depth layers are parallel wythes offset by half a brick. ' +
      'Identical settings replay identically.';
    panelBody.appendChild(note);
    syncInputs();
  }

  function syncInputs() {
    for (const k in inputs) {
      const { p, f, rng, num } = inputs[k];
      rng.value = settings[k];
      num.value = fmt(p, settings[k]);
      f.classList.toggle('changed', Math.abs(settings[k] - p.def) > 1e-9);
    }
    $('chkBrake').checked = !!settings.autoBrake;
  }

  function setParam(key, v) {
    if (key === 'autoBrake') settings.autoBrake = !!v;
    else {
      const p = inputs[key].p;
      if (!Number.isFinite(v)) v = settings[key];
      v = clamp(Math.round(v / p.step) * p.step, p.min, p.max);
      settings[key] = parseFloat(v.toFixed(p.dec));
    }
    syncInputs();
    if (key !== 'scale' && exp.state === 'ready') newExperiment(false);
    refreshChips();
  }

  function pendingKeys() {
    return PHYS_KEYS.filter(k => settings[k] !== exp.P[k]);
  }

  function refreshChips() {
    const P = exp.P, pend = new Set(pendingKeys());
    const chip = (keys, label, value) => {
      const isP = keys.some(k => pend.has(k));
      return `<span class="chip${isP ? ' pending' : ''}"${isP ? ' title="Changed in settings, applies on next Test"' : ''}>${label} <b>${value}</b></span>`;
    };
    $('chips').innerHTML = [
      chip(['speed'], 'Speed', `${P.speed.toFixed(1)} m/s`),
      chip(['cols', 'rows', 'layers'], 'Wall', `${P.cols} \u00d7 ${P.rows} \u00d7 ${P.layers}`),
      chip(['brickMass'], 'Brick', `${P.brickMass.toFixed(1)} kg`),
      chip(['brickW', 'brickH'], 'Size', `${P.brickW.toFixed(2)} \u00d7 ${P.brickH.toFixed(2)} m`),
      chip(['brickFriction'], '\u03bc brick', P.brickFriction.toFixed(2)),
      chip(['brickRestitution'], 'e', P.brickRestitution.toFixed(2)),
      chip(['carMass'], 'Car', `${P.carMass.toFixed(0)} kg`),
      chip(['carWidth', 'carHeight'], 'Car', `${P.carWidth.toFixed(2)} \u00d7 ${P.carHeight.toFixed(2)} m`),
      chip(['groundFriction'], '\u03bc ground', P.groundFriction.toFixed(2)),
      chip(['gravity'], 'g', `${P.gravity.toFixed(2)} m/s\u00b2`),
      chip([], 'Scale', `${settings.scale.toFixed(0)} px/m`),
    ].join('');
    const n = pend.size, note = $('pendingNote');
    note.classList.toggle('on', n > 0);
    note.textContent = n > 0
      ? `${n} change${n > 1 ? 's' : ''} pending. Press Test or Reset to apply.`
      : exp.state === 'ready' ? 'Preview matches these settings.' : 'Active test uses these settings.';
  }

  /* ---------------- Telemetry ---------------- */
  const tmCache = {};
  function setText(id, s) { if (tmCache[id] !== s) { tmCache[id] = s; $(id).textContent = s; } }
  function updateTelemetry() {
    const car = exp.car, st = exp.stats, hit = exp.impactTime >= 0;
    const v = Math.hypot(car.vx, car.vy);
    const ph = $('tmPhase');
    if (ph.dataset.phase !== exp.phase) { ph.dataset.phase = exp.phase; ph.textContent = exp.phase; }
    setText('tmTime', hit ? `t = ${exp.time.toFixed(3)} s \u00b7 T+${(exp.time - exp.impactTime).toFixed(3)}` : `t = ${exp.time.toFixed(3)} s`);
    setText('tmSpeed', v.toFixed(1));
    setText('tmKmh', `${(v * 3.6).toFixed(0)} km/h`);
    setText('tmMoving', `${st.moving} / ${st.total}`);
    setText('tmImpact', hit ? `${exp.impactSpeed.toFixed(2)} m/s` : '\u2014');
    setText('tmDecel', hit ? `${exp.peakDecel.toFixed(1)} g` : '\u2014');
    setText('tmCrush', hit ? `${(exp.crush * 100).toFixed(1)} cm` : '\u2014');
    setText('tmDisplaced', `${st.displaced} (${Math.round((100 * st.displaced) / st.total)}%)`);
    setText('tmReach', st.throw > 0.05 ? `${st.throw.toFixed(2)} m` : '\u2014');
    setText('tmMomentum', st.peakBrickPx > 1 ? `${(st.peakBrickPx / 1000).toFixed(2)} kN\u00b7s` : '\u2014');
    setText('tmDv', hit ? `${Math.round((100 * st.peakBrickPx) / (exp.P.carMass * exp.impactSpeed))} %` : '\u2014');
    drawChart(exp);
  }

  /* ---------------- Experiment lifecycle ---------------- */
  let exp = null, look = null, snapCam = true;
  const fx = new Effects();
  function newExperiment(start) {
    exp = new Experiment(Object.assign({}, settings));
    look = buildBrickLook(exp);
    fx.reset(0x5eed);
    acc = 0;
    snapCam = true;
    if (start) exp.start();
    refreshChips();
  }

  let timeScale = 1, acc = 0, lastNow = performance.now(), simRate = 1, fpsS = 60, stepMs = 0, perfTick = 0;

  function setPanel(open) {
    panel.classList.toggle('hidden', !open);
    document.body.classList.toggle('panel-closed', !open);
    $('btnSettings').setAttribute('aria-pressed', String(open));
    updateView();
  }
  function updateView() {
    view.right = !panel.classList.contains('hidden') && W > 760 ? 348 : 0;
    view.cx = (W - view.right) / 2;
  }
  function toggleSlow() {
    timeScale = timeScale === 1 ? 0.2 : 1;
    const b = $('btnSlow');
    b.setAttribute('aria-pressed', String(timeScale !== 1));
    b.textContent = timeScale === 1 ? 'Slow-mo' : 'Slow-mo 0.2\u00d7';
  }

  $('btnTest').addEventListener('click', () => newExperiment(true));
  $('btnReset').addEventListener('click', () => newExperiment(false));
  $('btnSlow').addEventListener('click', toggleSlow);
  $('btnSettings').addEventListener('click', () => setPanel(panel.classList.contains('hidden')));
  $('btnClosePanel').addEventListener('click', () => setPanel(false));
  $('btnDefaults').addEventListener('click', () => {
    Object.assign(settings, DEFAULTS);
    syncInputs();
    if (exp.state === 'ready') newExperiment(false);
    refreshChips();
  });
  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); newExperiment(true); }
    else if (e.key === 'r' || e.key === 'R') newExperiment(false);
    else if (e.key === 's' || e.key === 'S') toggleSlow();
    else if (e.key === 'p' || e.key === 'P') setPanel(panel.classList.contains('hidden'));
  });

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    groundY = Math.round(H - clamp(H * 0.17, 96, 150));
    if (W <= 1100 && (resize.lastW === undefined || resize.lastW > 1100) && !panel.classList.contains('hidden')) setPanel(false);
    resize.lastW = W;
    updateView();
    sizeChart();
    snapCam = true;
  }
  window.addEventListener('resize', resize);

  /* ---------------- Main loop ---------------- */
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground(exp);
    drawSkids(exp);
    drawWallFootprint(exp);
    drawTow(exp);
    computeCorners(exp, look);
    drawBricks(exp, look);
    drawCar(exp);
    fx.draw();
    drawOverlay(exp);
  }

  function frame(now) {
    const rdt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
    lastNow = now;
    if (rdt > 0) fpsS += (1 / rdt - fpsS) * 0.05;
    let dtVis = rdt * timeScale;
    if (exp.state === 'running') {
      acc += rdt * timeScale;
      const t0 = performance.now();
      let n = 0;
      while (acc >= DT && exp.state === 'running') {
        exp.step();
        acc -= DT;
        n++;
        if ((n & 3) === 0 && performance.now() - t0 > 13) { acc = Math.min(acc, DT); break; }
      }
      if (n) stepMs += ((performance.now() - t0) / n - stepMs) * 0.1;
      dtVis = n * DT;
      if (rdt > 0) simRate += ((n * DT) / (rdt * timeScale) - simRate) * 0.08;
    } else { acc = 0; simRate += (1 - simRate) * 0.2; }

    fx.consume(exp, look);
    fx.update(dtVis);
    updateCamera(exp, rdt, snapCam);
    snapCam = false;
    const sh = fx.shake * Math.min(12, 3 + cam.s * 0.07);
    cam.shakeX = (Math.sin(now * 0.091) * 0.7 + Math.sin(now * 0.047) * 0.3) * sh;
    cam.shakeY = Math.cos(now * 0.083) * sh * 0.6;
    render();
    updateTelemetry();
    if (++perfTick % 15 === 0) {
      const rate = exp.state === 'running' ? ` \u00b7 sim ${Math.min(1, simRate).toFixed(2)}\u00d7 real-time` : '';
      $('perf').textContent = `${fpsS.toFixed(0)} fps \u00b7 physics ${Math.round(1 / DT)} Hz \u00b7 ${stepMs.toFixed(2)} ms/step${rate}`;
    }
    requestAnimationFrame(frame);
  }

  makeHazardPattern();
  buildPanel();
  newExperiment(false);
  resize();
  requestAnimationFrame((t) => { lastNow = t; frame(t); });
})();
</script>
</body>
</html>
