<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Opus 5.5</title>
<style>
  :root {
    --bg: #0b0e12;
    --panel: rgba(16, 20, 26, 0.88);
    --panel-solid: #12161c;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e9ecf1;
    --muted: #8a94a4;
    --accent: #ffc531;
    --accent-ink: #1b1400;
    --car: #3d7bff;
    --brick: #c9623f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 10;
    display: flex; align-items: center; gap: 16px; padding: 0 14px 0 16px;
    background: linear-gradient(to bottom, rgba(9, 11, 15, 0.94), rgba(9, 11, 15, 0.74));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 5px; flex: none;
    background: repeating-linear-gradient(45deg, var(--accent) 0 5px, #121212 5px 10px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset;
  }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.2px; white-space: nowrap; }
  .chips {
    flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
    mask-image: linear-gradient(to right, #000 88%, transparent);
  }
  .chip {
    white-space: nowrap; padding: 4px 9px; border-radius: 999px; font-size: 12px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.pending { border-color: rgba(255, 197, 49, 0.55); color: #d9b04a; }
  .actions { display: flex; gap: 8px; flex: none; }

  .btn {
    appearance: none; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06); color: var(--text);
    padding: 8px 13px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.12); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary {
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
    padding: 8px 24px; font-size: 14px; letter-spacing: 0.3px; box-shadow: 0 4px 18px rgba(255, 197, 49, 0.28);
  }
  .btn.primary:hover { background: #ffd35a; }
  .btn[aria-pressed="true"] { background: rgba(255, 197, 49, 0.16); border-color: rgba(255, 197, 49, 0.55); color: #ffe08a; }
  .btn.small { padding: 5px 10px; font-size: 12px; }

  .panel {
    position: fixed; top: 68px; right: 12px; bottom: 12px; width: 324px; z-index: 9;
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .panel.hidden { transform: translateX(350px); opacity: 0; pointer-events: none; }
  .panel > header {
    padding: 13px 14px 11px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel > header h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .panel .body { overflow: auto; padding: 4px 16px 14px; flex: 1; scrollbar-width: thin; }
  .group-title {
    margin: 14px 0 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  details.adv > summary { list-style: none; cursor: pointer; user-select: none; }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary .caret { transition: transform 0.2s; display: inline-block; }
  details.adv[open] > summary .caret { transform: rotate(90deg); }
  .field { padding: 9px 0 7px; border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
  .field .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .field label { color: var(--text); }
  .field.changed label::after { content: " \2022"; color: var(--accent); }
  .field .val { display: flex; align-items: center; gap: 5px; }
  .field input[type=number] {
    width: 70px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 3px 6px; font: inherit; text-align: right; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .field input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
  .field input[type=number]:focus { outline: none; border-color: rgba(255, 197, 49, 0.6); }
  .field .unit { color: var(--muted); font-size: 11px; min-width: 38px; }
  .field input[type=range] { width: 100%; margin: 7px 0 1px; accent-color: var(--accent); }
  .field .meta { display: flex; justify-content: space-between; color: #5f6877; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
  .toggle-row small { display: block; color: var(--muted); font-size: 11px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; border-radius: 22px; background: rgba(255, 255, 255, 0.14); cursor: pointer; transition: background 0.2s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform 0.2s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); background: #1b1400; }
  .panel > footer { padding: 11px 14px 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .pending-note { flex: 1; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  .pending-note.on { color: var(--accent); }
  .note { color: var(--muted); font-size: 11.5px; margin: 12px 0 0; line-height: 1.45; }

  .telemetry {
    position: fixed; left: 12px; top: 68px; width: 344px; z-index: 8; padding: 12px 14px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  .tm-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .phase {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.08); color: var(--muted);
  }
  .phase[data-phase="TOWING"], .phase[data-phase="COASTING"] { background: rgba(61, 123, 255, 0.2); color: #9dbbff; }
  .phase[data-phase="IMPACT"] { background: rgba(255, 90, 60, 0.25); color: #ffb09e; }
  .phase[data-phase="SETTLING"] { background: rgba(255, 197, 49, 0.18); color: #ffd978; }
  .phase[data-phase="COMPLETE"] { background: rgba(79, 209, 139, 0.18); color: #8be3b2; }
  .tm-time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tm-speed { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 8px; }
  .tm-speed #tmSpeed { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .tm-speed small { color: var(--muted); font-size: 13px; }
  .tm-speed .kmh { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .tm-grid div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dashed rgba(255, 255, 255, 0.06); padding-bottom: 3px; }
  .tm-grid label { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .tm-grid b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  #chart { display: block; width: 100%; height: 64px; margin-top: 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.25); }
  .legend { display: flex; gap: 14px; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 2px; margin-right: 5px; vertical-align: middle; }
  .legend .l1::before { background: #6ea0ff; }
  .legend .l2::before { background: #ff8a5c; }
  .legend .l3::before { background: rgba(255, 197, 49, 0.8); width: 2px; height: 9px; }

  .hints {
    position: fixed; bottom: 14px; z-index: 7; right: 350px; color: rgba(255, 255, 255, 0.38); font-size: 11.5px;
    transition: right 0.25s ease; pointer-events: none;
  }
  .hints kbd {
    font: 600 10.5px ui-monospace, Menlo, monospace; padding: 1px 5px; border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.6); margin: 0 2px 0 8px;
  }
  body.panel-closed .hints { right: 16px; }
  .perf { position: fixed; bottom: 8px; left: 16px; z-index: 7; color: rgba(255, 255, 255, 0.32); font: 11px ui-monospace, Menlo, monospace; pointer-events: none; }

  @media (max-width: 1100px) { .chips { display: none; } }
  @media (max-width: 760px) {
    .telemetry { width: calc(100vw - 24px); }
    .tm-grid { grid-template-columns: 1fr; }
    .hints { display: none; }
    .panel { width: calc(100vw - 24px); }
    .panel.hidden { transform: translateX(110%); }
    .btn { padding: 7px 10px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Claude Opus 5.5</h1></div>
  <div class="chips" id="chips" aria-label="Active experiment parameters"></div>
  <div class="actions">
    <button class="btn primary" id="btnTest" title="Run the crash test (Space)">Test</button>
    <button class="btn" id="btnReset" title="Reset the scene (R)">Reset</button>
    <button class="btn" id="btnSlow" aria-pressed="false" title="Toggle slow motion (S)">Slow-mo</button>
    <button class="btn" id="btnSettings" aria-pressed="true" title="Toggle settings (P)">Settings</button>
  </div>
</header>

<aside class="panel" id="panel" aria-label="Experiment settings">
  <header>
    <h2>Experiment settings</h2>
    <button class="btn small" id="btnClosePanel" aria-label="Close settings">Close</button>
  </header>
  <div class="body" id="panelBody"></div>
  <footer>
    <div class="pending-note" id="pendingNote">Settings apply to the next test.</div>
    <button class="btn small" id="btnDefaults">Defaults</button>
  </footer>
</aside>

<section class="telemetry" id="telemetry" aria-label="Telemetry">
  <div class="tm-head">
    <span class="phase" id="tmPhase" data-phase="READY">READY</span>
    <span class="tm-time" id="tmTime">t = 0.000 s</span>
  </div>
  <div class="tm-speed"><span id="tmSpeed">0.0</span><small>m/s car speed</small><span class="kmh" id="tmKmh">0 km/h</span></div>
  <div class="tm-grid">
    <div><label>Moving bricks</label><b id="tmMoving">0 / 0</b></div>
    <div><label>Impact speed</label><b id="tmImpact">&mdash;</b></div>
    <div><label>Peak decel.</label><b id="tmDecel">&mdash;</b></div>
    <div><label>Crush depth</label><b id="tmCrush">&mdash;</b></div>
    <div><label>Displaced</label><b id="tmDisplaced">0</b></div>
    <div><label>Max throw</label><b id="tmReach">&mdash;</b></div>
    <div><label>Brick momentum</label><b id="tmMomentum">&mdash;</b></div>
    <div><label>Mom. transfer</label><b id="tmDv">&mdash;</b></div>
  </div>
  <canvas id="chart"></canvas>
  <div class="legend"><span class="l1">car speed</span><span class="l2">moving bricks</span><span class="l3">impact</span></div>
</section>

<div class="hints"><kbd>Space</kbd>Test<kbd>R</kbd>Reset<kbd>S</kbd>Slow-mo<kbd>P</kbd>Settings</div>
<div class="perf" id="perf"></div>

<script id="sim-core">
'use strict';
/* =====================================================================
 * Simulation core (no DOM access). Units: metres, kilograms, seconds.
 * World is y-up, ground plane at y = 0, wall face at x = 0.
 * ===================================================================== */
const Sim = (() => {
  const DT = 1 / 480;
  const INV_DT = 1 / DT;
  const VEL_ITERS = 8;
  const SLOP = 0.003;
  const BETA = 0.3;
  const MAX_PUSH = 8.0;
  const RESTITUTION_THRESHOLD = 0.9;
  const SLEEP_LIN = 0.05;
  const SLEEP_ANG = 0.09;
  const SLEEP_TIME = 0.6;
  const MAX_SPEED = 140;
  const SUPPORT_SCALE = 0.05;
  const CAT_CAR = 1 << 8;
  const BRICK_ALL = 0xff;

  let nextId = 1;
  const resetIds = () => { nextId = 1; };

  // Math.sin/cos/hypot are implementation-approximated in ECMAScript; the physics only uses correctly rounded
  // basic operations so the same settings replay bit-identically in every engine.
  const PIO2_HI = 1.57079632673412561417e+00, PIO2_LO = 6.07710050650619224932e-11, INV_PIO2 = 6.36619772367581382433e-01;
  const SC = { s: 0, c: 1 };
  function sinCos(a) {
    const k = Math.round(a * INV_PIO2);
    const r = (a - k * PIO2_HI) - k * PIO2_LO, z = r * r;
    const s = r + r * z * (-1.66666666666666324348e-01 + z * (8.33333333332248946124e-03 + z * (-1.98412698298579493134e-04 +
      z * (2.75573137070700676789e-06 + z * (-2.50507602534068634195e-08 + z * 1.58969099521155010221e-10)))));
    const c = 1 - 0.5 * z + z * z * (4.16666666666666019037e-02 + z * (-1.38888888888741095749e-03 + z * (2.48015872894767294178e-05 +
      z * (-2.75573143513906633035e-07 + z * (2.08757232129817482790e-09 + z * -1.13596475577881948265e-11)))));
    const q = ((k % 4) + 4) % 4;
    if (q === 0) { SC.s = s; SC.c = c; } else if (q === 1) { SC.s = c; SC.c = -s; }
    else if (q === 2) { SC.s = -s; SC.c = -c; } else { SC.s = -c; SC.c = s; }
    return SC;
  }
  const len2 = (x, y) => Math.sqrt(x * x + y * y);

  function createBody(o) {
    const shapes = o.shapes.map(s => ({ hx: s.hx, hy: s.hy, ox: s.ox || 0, oy: s.oy || 0, wx: 0, wy: 0 }));
    let rad = 0;
    for (const s of shapes) rad = Math.max(rad, len2(s.ox, s.oy) + len2(s.hx, s.hy));
    const a = o.a || 0, sc = sinCos(a);
    return {
      id: nextId++, idx: 0, kind: o.kind, isCar: o.kind === 'car',
      x: o.x, y: o.y, a, cs: sc.c, sn: sc.s,
      vx: 0, vy: 0, w: 0, bvx: 0, bvy: 0, bw: 0,
      m: o.m, im: 1 / o.m, I: o.I, iI: 1 / o.I,
      fr: o.fr, re: o.re, cat: o.cat, mask: o.mask,
      linDamp: o.linDamp ?? 0.02, angDamp: o.angDamp ?? 0.08,
      shapes, rad,
      awake: true, sleepT: 0, sleepIsland: null, noSleep: false,
      minX: 0, minY: 0, maxX: 0, maxY: 0, cx0: 0, cx1: 0, cy0: 0, cy1: 0, qStamp: 0,
    };
  }

  function wakeBody(b) {
    if (b.awake) return;
    const isl = b.sleepIsland;
    if (isl) {
      for (const m of isl) { m.awake = true; m.sleepT = 0; m.sleepIsland = null; }
    } else { b.awake = true; b.sleepT = 0; }
  }

  function applyImpulse(b, jx, jy, px, py) {
    b.vx += jx * b.im;
    b.vy += jy * b.im;
    b.w += ((px - b.x) * jy - (py - b.y) * jx) * b.iI;
  }

  /* ---------------- Box vs box (SAT + clipping, Box2D-Lite style) ---------------- */
  const makeCV = () => ({ x: 0, y: 0, i1: 0, o1: 0, i2: 0, o2: 0 });
  const INC = [makeCV(), makeCV()], CP1 = [makeCV(), makeCV()], CP2 = [makeCV(), makeCV()];
  const OUT = [{ px: 0, py: 0, sep: 0, fid: 0 }, { px: 0, py: 0, sep: 0, fid: 0 }];
  const CN = { nx: 0, ny: 0 };

  function copyCV(d, s) { d.x = s.x; d.y = s.y; d.i1 = s.i1; d.o1 = s.o1; d.i2 = s.i2; d.o2 = s.o2; }

  function clipSegment(out, inp, nx, ny, offset, clipEdge) {
    let n = 0;
    const d0 = nx * inp[0].x + ny * inp[0].y - offset;
    const d1 = nx * inp[1].x + ny * inp[1].y - offset;
    if (d0 <= 0) copyCV(out[n++], inp[0]);
    if (d1 <= 0) copyCV(out[n++], inp[1]);
    if (d0 * d1 < 0) {
      const t = d0 / (d0 - d1);
      const o = out[n++];
      if (d0 > 0) { copyCV(o, inp[0]); o.i1 = clipEdge; o.i2 = 0; }
      else { copyCV(o, inp[1]); o.o1 = clipEdge; o.o2 = 0; }
      o.x = inp[0].x + t * (inp[1].x - inp[0].x);
      o.y = inp[0].y + t * (inp[1].y - inp[0].y);
    }
    return n;
  }

  function setCV(v, x, y, i2, o2) { v.x = x; v.y = y; v.i1 = 0; v.o1 = 0; v.i2 = i2; v.o2 = o2; }

  function incidentEdge(c, hx, hy, px, py, cs, sn, nx, ny) {
    const lx = -(cs * nx + sn * ny), ly = -(-sn * nx + cs * ny);
    if (Math.abs(lx) > Math.abs(ly)) {
      if (lx >= 0) { setCV(c[0], hx, -hy, 3, 4); setCV(c[1], hx, hy, 4, 1); }
      else { setCV(c[0], -hx, hy, 1, 2); setCV(c[1], -hx, -hy, 2, 3); }
    } else if (ly >= 0) { setCV(c[0], hx, hy, 4, 1); setCV(c[1], -hx, hy, 1, 2); }
    else { setCV(c[0], -hx, -hy, 2, 3); setCV(c[1], hx, -hy, 3, 4); }
    for (let i = 0; i < 2; i++) {
      const v = c[i], x = v.x, y = v.y;
      v.x = px + cs * x - sn * y;
      v.y = py + sn * x + cs * y;
    }
  }

  // Returns number of contact points in OUT; normal (A -> B) in CN. Points with separation up to `margin` are kept (speculative).
  function collideBoxes(ax, ay, ac, as, ahx, ahy, bx, by, bc, bs, bhx, bhy, margin) {
    const dpx = bx - ax, dpy = by - ay;
    const dAx = ac * dpx + as * dpy, dAy = -as * dpx + ac * dpy;
    const dBx = bc * dpx + bs * dpy, dBy = -bs * dpx + bc * dpy;
    const a11 = Math.abs(ac * bc + as * bs), a12 = Math.abs(-ac * bs + as * bc);
    const a21 = Math.abs(-as * bc + ac * bs), a22 = Math.abs(as * bs + ac * bc);
    const faceAx = Math.abs(dAx) - ahx - (a11 * bhx + a12 * bhy);
    const faceAy = Math.abs(dAy) - ahy - (a21 * bhx + a22 * bhy);
    if (faceAx > margin || faceAy > margin) return 0;
    const faceBx = Math.abs(dBx) - (a11 * ahx + a21 * ahy) - bhx;
    const faceBy = Math.abs(dBy) - (a12 * ahx + a22 * ahy) - bhy;
    if (faceBx > margin || faceBy > margin) return 0;

    let axis = 0, sep = faceAx;
    let nx = dAx > 0 ? ac : -ac, ny = dAx > 0 ? as : -as;
    if (faceAy > sep + 0.05 * Math.abs(sep) + 0.01 * ahy) { axis = 1; sep = faceAy; nx = dAy > 0 ? -as : as; ny = dAy > 0 ? ac : -ac; }
    if (faceBx > sep + 0.05 * Math.abs(sep) + 0.01 * bhx) { axis = 2; sep = faceBx; nx = dBx > 0 ? bc : -bc; ny = dBx > 0 ? bs : -bs; }
    if (faceBy > sep + 0.05 * Math.abs(sep) + 0.01 * bhy) { axis = 3; sep = faceBy; nx = dBy > 0 ? -bs : bs; ny = dBy > 0 ? bc : -bc; }

    let fnx, fny, front, snx, sny, side, negSide, posSide, negEdge, posEdge;
    if (axis === 0) {
      fnx = nx; fny = ny; front = ax * fnx + ay * fny + ahx;
      snx = -as; sny = ac; side = ax * snx + ay * sny;
      negSide = -side + ahy; posSide = side + ahy; negEdge = 3; posEdge = 1;
      incidentEdge(INC, bhx, bhy, bx, by, bc, bs, fnx, fny);
    } else if (axis === 1) {
      fnx = nx; fny = ny; front = ax * fnx + ay * fny + ahy;
      snx = ac; sny = as; side = ax * snx + ay * sny;
      negSide = -side + ahx; posSide = side + ahx; negEdge = 2; posEdge = 4;
      incidentEdge(INC, bhx, bhy, bx, by, bc, bs, fnx, fny);
    } else if (axis === 2) {

      snx = -bs; sny = bc; side = bx * snx + by * sny;
      negSide = -side + bhy; posSide = side + bhy; negEdge = 3; posEdge = 1;
      incidentEdge(INC, ahx, ahy, ax, ay, ac, as, fnx, fny);
    } else {
      fnx = -nx; fny = -ny; front = bx * fnx + by * fny + bhy;
      snx = bc; sny = bs; side = bx * snx + by * sny;
      negSide = -side + bhx; posSide = side + bhx; negEdge = 2; posEdge = 4;
      incidentEdge(INC, ahx, ahy, ax, ay, ac, as, fnx, fny);
    }
    if (clipSegment(CP1, INC, -snx, -sny, negSide, negEdge) < 2) return 0;
    if (clipSegment(CP2, CP1, snx, sny, posSide, posEdge) < 2) return 0;

    CN.nx = nx; CN.ny = ny;
    let count = 0;
    for (let i = 0; i < 2; i++) {
      const v = CP2[i];
      const s = fnx * v.x + fny * v.y - front;
      if (s <= margin) {
        const o = OUT[count++];
        o.sep = s;
        o.px = v.x - 0.5 * s * fnx;
        o.py = v.y - 0.5 * s * fny;

  }

  /* ---------------- World ---------------- */
  const newContact = () => ({
    a: null, b: null, px: 0, py: 0, nx: 0, ny: 0, sep: 0, key: 0,
    rax: 0, ray: 0, rbx: 0, rby: 0, imA: 0, iIA: 0, imB: 0, iIB: 0, sA: 1, sB: 1,
    mn: 0, mt: 0, pn: 0, pt: 0, pb: 0, bias: 0, pbias: 0, vn0: 0, fr: 0, re: 0,

  });
  const RAY = { t: 0, body: null, nx: 0, ny: 0 };

  // Open-addressing table: contact feature key -> index of that contact in the previous step (warm starting).
  class WarmTable {
    constructor(bits) { this._alloc(bits); }
    _alloc(bits) {
      this.size = 1 << bits; this.mask = this.size - 1; this.count = 0;
      this.keys = new Float64Array(this.size).fill(-1);
      this.hashes = new Int32Array(this.size);
      this.vals = new Int32Array(this.size);
    }
    clear() { if (this.count) { this.keys.fill(-1); this.count = 0; } }
    set(key, h, v) {
      if (this.count * 2 > this.size) this._grow();
      const keys = this.keys, mask = this.mask;
      let i = h & mask;
      while (keys[i] !== -1) i = (i + 1) & mask;
      keys[i] = key; this.hashes[i] = h; this.vals[i] = v; this.count++;
    }
    get(key, h) {
      const keys = this.keys, mask = this.mask;
      let i = h & mask;
      while (keys[i] !== -1) { if (keys[i] === key) return this.vals[i]; i = (i + 1) & mask; }
      return -1;
    }
    _grow() {
      const { keys, hashes, vals, size } = this;
      this._alloc(Math.log2(size) + 1);
      for (let i = 0; i < size; i++) if (keys[i] !== -1) this.set(keys[i], hashes[i], vals[i]);
    }
  }

  class World {
    constructor(opts) {
      this.gravity = opts.gravity;
      this.groundFriction = opts.groundFriction;
      this.groundRestitution = 0.12;
      this.bodies = [];
      this.time = 0;
      this.steps = 0;
      this.contacts = []; this.nc = 0;
      this.prevContacts = []; this.prevNc = 0;
      this.warm = new WarmTable(14); this.warmPrev = new WarmTable(14);
      this.cell = 0.5; this.invCell = 2;
      this.hashMask = 8191;
      this.head = new Int32Array(this.hashMask + 1);
      this.eCap = 8192;
      this.eBody = new Int32Array(this.eCap); this.eNext = new Int32Array(this.eCap);
      this.eCX = new Int32Array(this.eCap); this.eCY = new Int32Array(this.eCap);
      this.ne = 0;
      this.links = [];
      this.events = [];
      this.preSolve = null;
      this.postSolve = null;
      this.awakeCount = 0;
      this.sleepingCount = 0;
      this.queryStamp = 0;
      this.parent = new Int32Array(0);
      this.minT = new Float64Array(0);
    }

    add(b) { b.idx = this.bodies.length; this.bodies.push(b); return b; }

    _alloc() {
      let c = this.contacts[this.nc];
      if (!c) { c = newContact(); this.contacts.push(c); }
      this.nc++;
      return c;
    }

    _addContact(a, b, si, sj, px, py, nx, ny, sep, fid) {

      c.a = a; c.b = b; c.px = px; c.py = py; c.nx = nx; c.ny = ny; c.sep = sep;
      const ida = a ? a.id : 0, sub = si * 4 + sj;

      let h = Math.imul(ida + 1, 0x9e3779b1) ^ Math.imul(b.id, 0x85ebca77) ^ Math.imul(sub * 1024 + fid + 1, 0xc2b2ae3d);
      h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 13;

      if (pi >= 0) { const p = this.prevContacts[pi]; c.pn = p.pn; c.pt = p.pt; }
      else { c.pn = 0; c.pt = 0; }

          c.carContact = true;
          c.carShape = a.isCar ? si : sj;
          // Heavy car resting on a light brick: scale the brick's inverse mass so the stack converges.
          if (a.isCar && ny < -0.5) c.sB = SUPPORT_SCALE;
          else if (b.isCar && ny > 0.5) c.sA = SUPPORT_SCALE;

        c.re = Math.max(this.groundRestitution, b.re);
      }
    }

    _updateAabbs() {
      for (const b of this.bodies) {
        const acs = Math.abs(b.cs), asn = Math.abs(b.sn);
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const s of b.shapes) {
          s.wx = b.x + b.cs * s.ox - b.sn * s.oy;
          s.wy = b.y + b.sn * s.ox + b.cs * s.oy;
          const ex = acs * s.hx + asn * s.hy, ey = asn * s.hx + acs * s.hy;
          if (s.wx - ex < minX) minX = s.wx - ex;
          if (s.wx + ex > maxX) maxX = s.wx + ex;
          if (s.wy - ey < minY) minY = s.wy - ey;
          if (s.wy + ey > maxY) maxY = s.wy + ey;
        }
        let f = 0.015;
        if (b.awake) {
          f += Math.abs(b.w) * b.rad * DT;
          const mx = b.vx * DT, my = b.vy * DT;
          if (mx < 0) minX += mx; else maxX += mx;
          if (my < 0) minY += my; else maxY += my;
        }
        b.minX = minX - f; b.maxX = maxX + f; b.minY = minY - f; b.maxY = maxY + f;
      }
    }

    _hash(cx, cy) { return (Math.imul(cx, 73856093) ^ Math.imul(cy, 19349663)) & this.hashMask; }

    _buildGrid() {
      this.head.fill(-1);
      let ne = 0;
      const inv = this.invCell;
      const bodies = this.bodies;
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        const x0 = Math.floor(b.minX * inv), x1 = Math.floor(b.maxX * inv);
        const y0 = Math.floor(b.minY * inv), y1 = Math.floor(b.maxY * inv);
        b.cx0 = x0; b.cx1 = x1; b.cy0 = y0; b.cy1 = y1;
        const need = ne + (x1 - x0 + 1) * (y1 - y0 + 1);
        if (need > this.eCap) this._growEntries(need * 2);
        for (let cx = x0; cx <= x1; cx++) {
          for (let cy = y0; cy <= y1; cy++) {
            const h = this._hash(cx, cy);
            this.eBody[ne] = i; this.eCX[ne] = cx; this.eCY[ne] = cy;
            this.eNext[ne] = this.head[h]; this.head[h] = ne;
            ne++;
          }
        }
      }
      this.ne = ne;
    }

    _growEntries(cap) {
      const grow = (arr) => { const n = new Int32Array(cap); n.set(arr); return n; };
      this.eBody = grow(this.eBody); this.eNext = grow(this.eNext);
      this.eCX = grow(this.eCX); this.eCY = grow(this.eCY);

    }

    // Visits every overlapping, collidable pair exactly once in deterministic order.
    _forPairs(fn) {
      const bodies = this.bodies, head = this.head, eNext = this.eNext, eBody = this.eBody, eCX = this.eCX, eCY = this.eCY;
      const hm = this.hashMask;

          const hx = Math.imul(cx, 73856093);
          for (let cy = A.cy0; cy <= A.cy1; cy++) {
            for (let e = head[(hx ^ Math.imul(cy, 19349663)) & hm]; e !== -1; e = eNext[e]) {
              if (eCX[e] !== cx || eCY[e] !== cy) continue;
              const j = eBody[e];
              if (j <= i) continue;
              const B = bodies[j];
              if (!A.awake && !B.awake) continue;
              if (A.maxX < B.minX || B.maxX < A.minX || A.maxY < B.minY || B.maxY < A.minY) continue;
              if ((A.cx0 > B.cx0 ? A.cx0 : B.cx0) !== cx || (A.cy0 > B.cy0 ? A.cy0 : B.cy0) !== cy) continue;

            }
          }
        }
      }
    }

    _wakePass() {
      let changed = true, guard = 0;
      const wake = (A, B) => {
        if (A.awake !== B.awake) { wakeBody(A.awake ? B : A); changed = true; }
      };
      while (changed && guard++ < 6) { changed = false; this._forPairs(wake); }

    _narrowphase() {

        const rvx = B.vx - A.vx, rvy = B.vy - A.vy;
        const margin = Math.min(0.015 + (Math.sqrt(rvx * rvx + rvy * rvy) + Math.abs(A.w) * A.rad + Math.abs(B.w) * B.rad) * DT, 0.6);

        for (let si = 0; si < sa.length; si++) {
          const s1 = sa[si];
          for (let sj = 0; sj < sb.length; sj++) {
            const s2 = sb[sj];
            const n = collideBoxes(s1.wx, s1.wy, A.cs, A.sn, s1.hx, s1.hy, s2.wx, s2.wy, B.cs, B.sn, s2.hx, s2.hy, margin);
            for (let k = 0; k < n; k++) {

          }

      for (const b of this.bodies) {
        if (!b.awake) continue;
        const margin = 0.015 + (Math.max(0, -b.vy) + Math.abs(b.w) * b.rad) * DT;
        if (b.minY > margin) continue;
        for (let si = 0; si < b.shapes.length; si++) {
          const s = b.shapes[si];

            const lx = (k & 1) ? s.hx : -s.hx, ly = (k & 2) ? s.hy : -s.hy;

    }

    _applyForces() {
      const g = this.gravity;
      for (const b of this.bodies) {
        if (!b.awake) continue;

    }

    _solve() {
      const C = this.contacts, nc = this.nc;
      for (let k = 0; k < nc; k++) {
        const c = C[k], A = c.a, B = c.b;
        const nx = c.nx, ny = c.ny, tx = ny, ty = -nx;
        let rax = 0, ray = 0, imA = 0, iIA = 0;
        if (A) { rax = c.px - A.x; ray = c.py - A.y; imA = A.im * c.sA; iIA = A.iI * c.sA; }
        const rbx = c.px - B.x, rby = c.py - B.y, imB = B.im * c.sB, iIB = B.iI * c.sB;
        c.rax = rax; c.ray = ray; c.rbx = rbx; c.rby = rby;
        c.imA = imA; c.iIA = iIA; c.imB = imB; c.iIB = iIB;
        const rnA = rax * ny - ray * nx, rnB = rbx * ny - rby * nx;
        c.mn = 1 / (imA + imB + iIA * rnA * rnA + iIB * rnB * rnB);
        const rtA = rax * ty - ray * tx, rtB = rbx * ty - rby * tx;

        let dvx = B.vx - B.w * rby, dvy = B.vy + B.w * rbx;
        if (A) { dvx -= A.vx - A.w * ray; dvy -= A.vy + A.w * rax; }

        c.bias = c.sep > 0 ? -c.sep * INV_DT : 0;
        c.pbias = c.sep < -SLOP ? Math.min(BETA * INV_DT * (-c.sep - SLOP), MAX_PUSH) : 0;

          B.vx += imB * Px; B.vy += imB * Py; B.w += iIB * (rbx * Py - rby * Px);
        }
      }

      for (let it = 0; it < VEL_ITERS; it++) {
        for (let k = 0; k < nc; k++) {
          const c = C[k], A = c.a, B = c.b;
          const nx = c.nx, ny = c.ny, tx = ny, ty = -nx;
          const rax = c.rax, ray = c.ray, rbx = c.rbx, rby = c.rby;
          const imA = c.imA, iIA = c.iIA, imB = c.imB, iIB = c.iIB;

          // Friction (uses the normal impulse accumulated so far)
          let dvx = B.vx - B.w * rby, dvy = B.vy + B.w * rbx;
          if (A) { dvx -= A.vx - A.w * ray; dvy -= A.vy + A.w * rax; }
          const maxF = c.fr * c.pn;
          let p0 = c.pt, p1 = p0 - c.mt * (dvx * tx + dvy * ty);
          if (p1 > maxF) p1 = maxF; else if (p1 < -maxF) p1 = -maxF;
          let dp = p1 - p0; c.pt = p1;
          if (dp !== 0) {
            const Px = dp * tx, Py = dp * ty;
            if (A) { A.vx -= imA * Px; A.vy -= imA * Py; A.w -= iIA * (rax * Py - ray * Px); }
            B.vx += imB * Px; B.vy += imB * Py; B.w += iIB * (rbx * Py - rby * Px);
          }

          // Normal (non-penetration, speculative when sep > 0)
          dvx = B.vx - B.w * rby; dvy = B.vy + B.w * rbx;
          if (A) { dvx -= A.vx - A.w * ray; dvy -= A.vy + A.w * rax; }
          p0 = c.pn; p1 = p0 + c.mn * (c.bias - (dvx * nx + dvy * ny));
          if (p1 < 0) p1 = 0;
          dp = p1 - p0; c.pn = p1;
          if (dp !== 0) {
            const Px = dp * nx, Py = dp * ny;
            if (A) { A.vx -= imA * Px; A.vy -= imA * Py; A.w -= iIA * (rax * Py - ray * Px); }
            B.vx += imB * Px; B.vy += imB * Py; B.w += iIB * (rbx * Py - rby * Px);
          }

          // Split impulse: positional correction on pseudo-velocities (adds no kinetic energy)
          if (c.pbias > 0) {
            let bvx = B.bvx - B.bw * rby, bvy = B.bvy + B.bw * rbx;
            if (A) { bvx -= A.bvx - A.bw * ray; bvy -= A.bvy + A.bw * rax; }
            p0 = c.pb; p1 = p0 + c.mn * (c.pbias - (bvx * nx + bvy * ny));
            if (p1 < 0) p1 = 0;
            dp = p1 - p0; c.pb = p1;
            if (dp !== 0) {
              const Px = dp * nx, Py = dp * ny;
              if (A) { A.bvx -= imA * Px; A.bvy -= imA * Py; A.bw -= iIA * (rax * Py - ray * Px); }
              B.bvx += imB * Px; B.bvy += imB * Py; B.bw += iIB * (rbx * Py - rby * Px);
            }
          }
        }
      }

      // Restitution pass, based on the approach velocity before the solve
      for (let k = 0; k < nc; k++) {
        const c = C[k];
        if (c.re <= 0 || c.vn0 > -RESTITUTION_THRESHOLD || c.pn <= 0) continue;
        const A = c.a, B = c.b, nx = c.nx, ny = c.ny;
        let dvx = B.vx - B.w * c.rby, dvy = B.vy + B.w * c.rbx;
        if (A) { dvx -= A.vx - A.w * c.ray; dvy -= A.vy + A.w * c.rax; }
        const p0 = c.pn;
        let p1 = p0 + c.mn * (-c.re * c.vn0 - (dvx * nx + dvy * ny));
        if (p1 < 0) p1 = 0;
        const dp = p1 - p0; c.pn = p1;
        if (dp !== 0) {
          const Px = dp * nx, Py = dp * ny;
          if (A) { A.vx -= c.imA * Px; A.vy -= c.imA * Py; A.w -= c.iIA * (c.rax * Py - c.ray * Px); }
          B.vx += c.imB * Px; B.vy += c.imB * Py; B.w += c.iIB * (c.rbx * Py - c.rby * Px);
        }
      }

      // Impact events (consumed by visual effects only)
      for (let k = 0; k < nc; k++) {
        const c = C[k];
        if (c.vn0 > -1.5 || c.pn <= 0) continue;
        const e = 0.5 * c.pn * -c.vn0;
        if (e > 6 && this.events.length < 160) {
          this.events.push({ x: c.px, y: c.py, e, nx: c.nx, ny: c.ny, a: c.a, b: c.b, ground: !c.a });
        }
      }
    }

    _integrate() {
      for (const b of this.bodies) {
        if (!b.awake) continue;
        let vx = b.vx, vy = b.vy;
        const sp2 = vx * vx + vy * vy;
        if (sp2 > MAX_SPEED * MAX_SPEED) { const k = MAX_SPEED / Math.sqrt(sp2); vx *= k; vy *= k; b.vx = vx; b.vy = vy; }
        if (b.w > 60) b.w = 60; else if (b.w < -60) b.w = -60;
        b.x += (vx + b.bvx) * DT;
        b.y += (vy + b.bvy) * DT;
        b.a += (b.w + b.bw) * DT;
        const sc = sinCos(b.a);
        b.cs = sc.c; b.sn = sc.s;
        b.bvx = 0; b.bvy = 0; b.bw = 0;
        if (sp2 < SLEEP_LIN * SLEEP_LIN && b.w * b.w < SLEEP_ANG * SLEEP_ANG) b.sleepT += DT;
        else b.sleepT = 0;
      }
    }

    _find(i) {
      const p = this.parent;
      while (p[i] !== i) { p[i] = p[p[i]]; i = p[i]; }
      return i;
    }

    _union(i, j) {
      const a = this._find(i), b = this._find(j);
      if (a !== b) { if (a < b) this.parent[b] = a; else this.parent[a] = b; }
    }

    _islands() {
      const bodies = this.bodies, n = bodies.length;
      if (this.parent.length < n) { this.parent = new Int32Array(n); this.minT = new Float64Array(n); }
      const parent = this.parent, minT = this.minT;
      for (let i = 0; i < n; i++) { parent[i] = i; minT[i] = Infinity; }
      const C = this.contacts;
      for (let k = 0; k < this.nc; k++) {
        const c = C[k];
        if (c.a && c.a.awake && c.b.awake) this._union(c.a.idx, c.b.idx);
      }
      for (let k = 0; k < this.links.length; k += 2) {
        const a = this.links[k], b = this.links[k + 1];
        if (a.awake && b.awake) this._union(a.idx, b.idx);
      }
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        if (!b.awake) continue;
        const r = this._find(i), t = b.noSleep ? 0 : b.sleepT;
        if (t < minT[r]) minT[r] = t;
      }
      let groups = null;
      let awake = 0;
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        if (!b.awake) continue;
        const r = this._find(i);
        if (minT[r] >= SLEEP_TIME) {
          if (!groups) groups = new Map();
          let g = groups.get(r);
          if (!g) { g = []; groups.set(r, g); }
          g.push(b);
        } else awake++;
      }
      if (groups) {
        for (const g of groups.values()) {
          for (const b of g) { b.awake = false; b.vx = 0; b.vy = 0; b.w = 0; b.sleepIsland = g; }
        }
      }
      this.awakeCount = awake;
      this.sleepingCount = n - awake;
    }

    raycast(ox, oy, dx, dy, maxT, mask, ignore) {
      let best = maxT, hit = false, hb = null, hnx = 0, hny = 1;
      if (dy < -1e-9 && oy >= 0) {
        const t = -oy / dy;
        if (t <= best) { best = t; hit = true; }
      }
      const ex = ox + dx * maxT, ey = oy + dy * maxT, inv = this.invCell;
      const x0 = Math.floor(Math.min(ox, ex) * inv), x1 = Math.floor(Math.max(ox, ex) * inv);

    }

    step() {
      this.events.length = 0;
      this.links.length = 0;
      const pc = this.prevContacts; this.prevContacts = this.contacts; this.contacts = pc;

  }

  /* ---------------- Experiment parameters ---------------- */
  const PARAMS = [
    { key: 'speed', label: 'Car speed', unit: 'm/s', min: 5, max: 45, step: 0.5, def: 22, dec: 1, group: 'main' },
    { key: 'cols', label: 'Wall columns', unit: 'bricks', min: 4, max: 24, step: 1, def: 12, dec: 0, group: 'main' },
    { key: 'rows', label: 'Wall rows', unit: 'bricks', min: 3, max: 16, step: 1, def: 8, dec: 0, group: 'main' },
    { key: 'layers', label: 'Wall depth layers', unit: 'layers', min: 1, max: 5, step: 1, def: 2, dec: 0, group: 'main' },
    { key: 'brickMass', label: 'Brick mass', unit: 'kg', min: 0.5, max: 12, step: 0.1, def: 2.5, dec: 1, group: 'main' },
    { key: 'brickW', label: 'Brick width', unit: 'm', min: 0.2, max: 1.0, step: 0.01, def: 0.5, dec: 2, group: 'adv' },
    { key: 'brickH', label: 'Brick height', unit: 'm', min: 0.1, max: 0.5, step: 0.01, def: 0.24, dec: 2, group: 'adv' },
    { key: 'brickFriction', label: 'Brick friction \u03bc', unit: '', min: 0.1, max: 1.2, step: 0.01, def: 0.72, dec: 2, group: 'adv' },
    { key: 'brickRestitution', label: 'Brick restitution', unit: '', min: 0, max: 0.6, step: 0.01, def: 0.18, dec: 2, group: 'adv' },
    { key: 'carMass', label: 'Car mass', unit: 'kg', min: 600, max: 3000, step: 10, def: 1250, dec: 0, group: 'adv' },
    { key: 'carWidth', label: 'Car width (length)', unit: 'm', min: 3.0, max: 5.5, step: 0.05, def: 4.2, dec: 2, group: 'adv' },
    { key: 'carHeight', label: 'Car height', unit: 'm', min: 1.2, max: 1.9, step: 0.01, def: 1.45, dec: 2, group: 'adv' },
    { key: 'groundFriction', label: 'Ground friction \u03bc', unit: '', min: 0.2, max: 1.2, step: 0.01, def: 0.85, dec: 2, group: 'adv' },
    { key: 'gravity', label: 'Gravity', unit: 'm/s\u00b2', min: 1, max: 25, step: 0.01, def: 9.81, dec: 2, group: 'adv' },
    { key: 'scale', label: 'Simulation scale', unit: 'px/m', min: 30, max: 160, step: 1, def: 80, dec: 0, group: 'view' },

  const DEFAULTS = { autoBrake: true };
  for (const p of PARAMS) DEFAULTS[p.key] = p.def;

  const RUNUP = 20;          // m between car front and wall face at rest
  const RELEASE_X = -1.0;    // tow cable releases when the car front reaches this x
  const BRAKE_DELAY = 0.25;  // s after first contact before the wheels lock
  const ROLL_RES = 0.012;    // rolling resistance coefficient
  const GAP = 0.002;         // horizontal joint between dry-stacked bricks
  const G0 = 9.81;           // design gravity for suspension sizing and g readouts
  const ACC_FILTER = 0.16;   // ~12 ms low-pass on the car deceleration trace at 480 Hz

  function hashUnit(a, b, c) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x27d4eb2f, 0x165667b1);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;

  }

  class Experiment {
    constructor(params) {
      const P = this.P = Object.assign({}, DEFAULTS, params);
      resetIds();
      this.world = new World({ gravity: P.gravity, groundFriction: P.groundFriction });
      this._buildCar();
      this._buildWall();
      this.world.sleepingCount = this.bricks.length;
      this.world.preSolve = (dt) => this._carForces(dt);
      this.world.postSolve = (C, nc) => this._afterSolve(C, nc);

      this.state = 'ready';
      this.phase = 'READY';
      this.released = false; this.releaseTime = -1;
      this.impactTime = -1; this.impactSpeed = 0;
      this.braking = false;
      this.crushEnergy = 0; this.crush = 0;
      this.glassEnergy = 0; this.glassDamage = 0;
      this.preVx = 0; this.prevVx = 0; this.accFilt = 0; this.peakDecel = 0;
      this.quietTime = 0; this.completeTime = -1;
      this.minSpeedAfterImpact = Infinity;
      this.stats = { moving: 0, displaced: 0, throw: 0, brickPx: 0, peakBrickPx: 0, total: this.bricks.length };
      this.history = [];
      this.fx = [];
      this.skidMarks = [];
      const accelDist = 0.8 * (RUNUP + RELEASE_X);

    }

    get time() { return this.world.time; }

    start() { if (this.state === 'ready') { this.state = 'running'; this.phase = 'TOWING'; } }

    _buildCar() {
      const P = this.P;

      const shapes = [
        { hx: 2.1 * sx, hy: 0.345 * sy, ox: -comX, oy: 0.515 * sy - comY },              // chassis, bumper to bumper
        { hx: 1.025 * sx, hy: 0.295 * sy, ox: -0.275 * sx - comX, oy: 1.155 * sy - comY }, // cabin / greenhouse
      ];

        kind: 'car', x: -RUNUP - (2.1 * sx - comX), y: comY, m, I: m * (len * len + hgt * hgt) / 12 * 0.72,
        fr: 0.45, re: 0.1, cat: CAT_CAR, mask: BRICK_ALL, shapes, linDamp: 0, angDamp: 0.4,
      });

      car.comX = comX; car.comY = comY;
      car.frontLocal = 2.1 * sx - comX;
      car.rearLocal = -2.1 * sx - comX;
      this.chassisFront0 = car.frontLocal;
      this.chassisRear0 = car.rearLocal;
      this.maxCrush = 0.75 * sx;
      this.crushForce = 165 * m;

      const r = 0.33 * sy, hpY = 0.62 * sy - comY;
      const xr = -1.38 * sx, xf = 1.22 * sx;
      const fracF = (comX - xr) / (xf - xr);
      const Ls = 0.29 * sy, comp = 0.12 * sy;

    }

    _buildWall() {
      const P = this.P, bw = P.brickW, bh = P.brickH, cols = P.cols;

            for (let i = 0; i < cols; i++) pieces.push(bw * (i + 0.5), bw);
          } else {
            pieces.push(bw * 0.25, bw * 0.5);

    }

    frontX() {
      const c = this.car;
      return c.x + c.cs * (this.chassisFront0 - this.crush) - c.sn * c.shapes[0].oy;
    }

    _carForces(dt) {
      const car = this.car, P = this.P, w = this.world;
      if (!car.awake) return;
      const cs = car.cs, sn = car.sn;

      if (!this.released) {
        if (this.frontX() >= RELEASE_X || this.impactTime >= 0) { this.released = true; this.releaseTime = w.time; }

        const hpx = car.x + cs * wh.lx - sn * wh.ly, hpy = car.y + sn * wh.lx + cs * wh.ly;
        const r = wh.r, rayLen = wh.Lmax + r;
        let bestL = Infinity, bx = 0, by = 0, bnx = 0, bny = 1, hitBody = null;
        for (let k = -1; k <= 1; k++) {
          const off = k * 0.55 * r;
          const ox = hpx + fx * off, oy = hpy + fy * off;
          const hit = w.raycast(ox, oy, dx, dy, rayLen, BRICK_ALL, car);
          if (!hit) continue;
          const L = hit.t - Math.sqrt(r * r - off * off);
          if (L < bestL) { bestL = L; bx = ox + dx * hit.t; by = oy + dy * hit.t; bnx = hit.nx; bny = hit.ny; hitBody = hit.body; }
        }

          wh.mark = null;
          continue;

        let other = null;
        if (hitBody) {
          if (hitBody.awake) { other = hitBody; w.links.push(car, other); }
          else wakeBody(hitBody);
        }
        const L = bestL;
        const rx = bx - car.x, ry = by - car.y;
        let vrx = car.vx - car.w * ry, vry = car.vy + car.w * rx;
        if (other) { vrx -= other.vx - other.w * (by - other.y); vry -= other.vy + other.w * (bx - other.x); }
        const compRate = vrx * dx + vry * dy;
        let F = wh.k * (wh.L0 - L) + wh.c * compRate;
        if (L < wh.Lmin) F += wh.kb * (wh.Lmin - L) + 3 * wh.c * compRate;
        if (F < 0) F = 0;
        const Fmax = 30 * car.m * G0;
        if (F > Fmax) F = Fmax;
        const J = F * dt;
        applyImpulse(car, -dx * J, -dy * J, bx, by);
        if (other) applyImpulse(other, dx * J, dy * J, bx, by);

        // Tyre force along the contact surface: rolling resistance, or locked-wheel sliding friction when braking.
        const fn = fx * bnx + fy * bny;
        let tx = fx - fn * bnx, ty = fy - fn * bny;
        const tl = len2(tx, ty);
        let vt = 0;
        if (tl > 1e-6) {
          tx /= tl; ty /= tl;
          vrx = car.vx - car.w * ry; vry = car.vy + car.w * rx;
          const rtc = rx * ty - ry * tx;
          let kt = car.im + car.iI * rtc * rtc;
          if (other) {
            const ox = bx - other.x, oy = by - other.y, rto = ox * ty - oy * tx;
            vrx -= other.vx - other.w * oy; vry -= other.vy + other.w * ox;
            kt += other.im + other.iI * rto * rto;
          }
          vt = vrx * tx + vry * ty;
          const mu = braking ? (hitBody ? Math.sqrt(P.groundFriction * P.brickFriction) : P.groundFriction) : ROLL_RES;
          const lim = mu * J;
          let jt = -vt / kt;
          if (jt > lim) jt = lim; else if (jt < -lim) jt = -lim;
          applyImpulse(car, tx * jt, ty * jt, bx, by);
          if (other) applyImpulse(other, -tx * jt, -ty * jt, bx, by);
        }

        wh.contact = true; wh.Fn = F; wh.hitX = bx; wh.hitY = by; wh.onBrick = !!hitBody;
        wh.len = Math.max(L, wh.Lmin * 0.5);
        wh.omega = braking ? 0 : (vrx * fx + vry * fy) / r;
        wh.angle -= wh.omega * dt;
        wh.skid = braking && Math.abs(vt) > 0.35;

        } else wh.mark = null;
      }
    }

    _afterSolve(C, nc) {
      const car = this.car, w = this.world;

        const c = C[k];
        if (!c.carContact || c.pn <= 0) continue;
        if (this.impactTime < 0) { this.impactTime = w.time; this.impactSpeed = Math.abs(this.preVx); }
        const e = 0.5 * c.pn * Math.max(0, -c.vn0);
        if (e <= 0) continue;
        if (c.carShape === 0) {
          const lx = car.cs * (c.px - car.x) + car.sn * (c.py - car.y);

      const target = Math.min(this.maxCrush, this.crushEnergy / this.crushForce);
      if (target > this.crush + 0.001) {
        this.crush = target;
        const s = car.shapes[0], front = this.chassisFront0 - target, rear = this.chassisRear0;
        s.hx = (front - rear) / 2; s.ox = (front + rear) / 2;
      }
      this.glassDamage = Math.min(1, this.glassEnergy / 900);
      for (const ev of w.events) {
        if (ev.e > 60) {
          if (ev.a && ev.a.kind === 'brick') ev.a.damage += ev.e;
          if (ev.b.kind === 'brick') ev.b.damage += ev.e;
        }
        if (this.fx.length < 600) this.fx.push(ev);
      }
    }

    _complete() {
      if (this.state === 'complete') return;
      this.state = 'complete';
      this.phase = 'COMPLETE';
      this.completeTime = this.world.time;
    }

    _telemetryStep() {
      const w = this.world, car = this.car, t = w.time;
      const a = (this.prevVx - car.vx) * INV_DT;
      this.prevVx = car.vx;
      this.accFilt += (a - this.accFilt) * ACC_FILTER;
      if (this.impactTime >= 0) {
        if (t - this.impactTime < 2) this.peakDecel = Math.max(this.peakDecel, this.accFilt / G0);
        this.minSpeedAfterImpact = Math.min(this.minSpeedAfterImpact, car.vx);
      }

      let moving = 0, displaced = 0, thr = 0, px = 0;
      let maxSp = car.awake ? len2(car.vx, car.vy) : 0;
      for (const b of this.bricks) {
        if (b.awake) {
          const sp = len2(b.vx, b.vy);
          if (sp > 0.1 || Math.abs(b.w) > 0.25) moving++;
          if (sp > maxSp) maxSp = sp;
          px += b.m * b.vx;
        }
        const ddx = b.x - b.x0, ddy = b.y - b.y0;
        if (ddx * ddx + ddy * ddy > 0.0225 || b.cs < 0.985) displaced++;
        if (ddx > thr) thr = ddx;
      }
      const st = this.stats;
      st.moving = moving; st.displaced = displaced; st.throw = thr; st.brickPx = px;
      if (px > st.peakBrickPx) st.peakBrickPx = px;

      if (this.impactTime < 0) this.phase = this.released ? 'COASTING' : 'TOWING';
      else this.phase = t - this.impactTime < 0.5 ? 'IMPACT' : 'SETTLING';
      if (this.impactTime >= 0 && t > this.impactTime + 1.0) car.noSleep = false;

      if (maxSp < 0.12) this.quietTime += DT; else this.quietTime = 0;
      if (this.impactTime >= 0 && t > this.impactTime + 1.5 && (w.awakeCount === 0 || this.quietTime > 1.5)) this._complete();
      if (t > 60) this._complete();

      if (w.steps % 8 === 0) this.history.push(t, len2(car.vx, car.vy), moving);
    }

    step() {
      if (this.state !== 'running') return false;
      this.preVx = this.car.vx;
      this.world.step();
      this._telemetryStep();
      return true;
    }
  }

  return { DT, PARAMS, DEFAULTS, RUNUP, RELEASE_X, G0, Experiment, World, createBody, hashUnit };
})();
