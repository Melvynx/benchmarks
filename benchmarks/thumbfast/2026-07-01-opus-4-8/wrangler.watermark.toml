name = "thumbfast-watermark"
main = "cloudflare/watermark-worker.mjs"
compatibility_date = "2026-05-23"

[images]
binding = "IMAGES"

[assets]
directory = "cloudflare/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "THUMBFAST_R2"
bucket_name = "thumbnail-ia"

[vars]
R2_PUBLIC_URL = "https://thumbnail-ia.mlvcdn.com"
