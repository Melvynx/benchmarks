<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikini Bottom 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a1628;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
        }
        #loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">🌊 Loading Bikini Bottom...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x006994);
        scene.fog = new THREE.FogExp2(0x006994, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.8;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 80;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // ===== COMPREHENSIVE LIGHTING SETUP =====

        // Hemisphere light - sky blue to sand gradient
        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0xD2B48C, 0.8);
        scene.add(hemiLight);

        // Main sun light - warm tropical sunlight
        const sunLight = new THREE.DirectionalLight(0xFFFACD, 2.5);
        sunLight.position.set(30, 80, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        // Fill light - cyan underwater bounce
        const fillLight = new THREE.DirectionalLight(0x40E0D0, 0.8);
        fillLight.position.set(-20, 30, -10);
        scene.add(fillLight);

        // Back rim light - creates depth
        const rimLight = new THREE.DirectionalLight(0x00CED1, 0.6);
        rimLight.position.set(0, 20, -40);
        scene.add(rimLight);

        // Ambient point lights for underwater glow
        const ambientPoints = [
            { pos: [0, 15, 0], color: 0x00BFFF, intensity: 1.5 },
            { pos: [-20, 10, 20], color: 0x40E0D0, intensity: 0.8 },
            { pos: [20, 10, -20], color: 0x48D1CC, intensity: 0.8 },
            { pos: [-30, 8, -10], color: 0x20B2AA, intensity: 0.6 },
            { pos: [30, 8, 10], color: 0x5F9EA0, intensity: 0.6 },
        ];

        ambientPoints.forEach(({ pos, color, intensity }) => {
            const light = new THREE.PointLight(color, intensity, 50);
            light.position.set(...pos);
            scene.add(light);
        });

        // Animated caustic spot lights
        const causticLights = [];
        for (let i = 0; i < 5; i++) {
            const light = new THREE.SpotLight(0x87CEFA, 3, 80, Math.PI / 6, 0.8);
            light.position.set(
                (Math.random() - 0.5) * 40,
                40 + Math.random() * 20,
                (Math.random() - 0.5) * 40
            );
            light.userData = {
                baseX: light.position.x,
                baseZ: light.position.z,
                speed: 0.5 + Math.random() * 0.5,
                offset: Math.random() * Math.PI * 2
            };
            scene.add(light);
            causticLights.push(light);
        }

        // Warm accent lights for buildings
        const warmLight1 = new THREE.PointLight(0xFFD700, 2, 30);
        warmLight1.position.set(-12, 8, 0);
        scene.add(warmLight1);

        const warmLight2 = new THREE.PointLight(0xFFA500, 1.5, 25);
        warmLight2.position.set(0, 8, 0);
        scene.add(warmLight2);

        const warmLight3 = new THREE.PointLight(0xFF8C00, 1, 20);
        warmLight3.position.set(12, 5, 0);
        scene.add(warmLight3);

        // Ocean floor with caustics shader
        const floorGeometry = new THREE.PlaneGeometry(200, 200, 128, 128);
        const floorMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor1: { value: new THREE.Color(0xF4D03F) },
                uColor2: { value: new THREE.Color(0xE8B923) },
                uColor3: { value: new THREE.Color(0xD4AC0D) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vPosition;
                uniform float uTime;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }

                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float n = noise(pos.xy * 0.1) * 2.0;
                    n += noise(pos.xy * 0.2) * 1.0;
                    pos.z += n * 0.5;
                    vPosition = pos;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                uniform vec3 uColor3;
                varying vec2 vUv;
                varying vec3 vPosition;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }

                float caustic(vec2 uv, float time) {
                    float c = 0.0;
                    for(float i = 1.0; i < 6.0; i++) {
                        float scale = pow(2.0, i);
                        vec2 offset = vec2(time * 0.1 * i, time * 0.08 * i);
                        c += noise(uv * scale + offset) / scale;
                    }
                    return c;
                }

                void main() {
                    float n1 = noise(vUv * 15.0);
                    float n2 = noise(vUv * 30.0 + 10.0);
                    vec3 baseColor = mix(uColor1, uColor2, n1);
                    baseColor = mix(baseColor, uColor3, n2 * 0.3);

                    float c = caustic(vUv * 8.0, uTime);
                    c = pow(c, 1.8) * 0.8;

                    vec3 causticColor = vec3(0.4, 0.8, 1.0);
                    vec3 color = baseColor + causticColor * c;
                    color = pow(color, vec3(0.95));

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // God rays shader plane
        const godRayGeometry = new THREE.PlaneGeometry(200, 100);
        const godRayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                }

                void main() {
                    float ray = 0.0;
                    for(float i = 0.0; i < 8.0; i++) {
                        float x = vUv.x + sin(vUv.y * 3.0 + uTime * 0.2 + i) * 0.1;
                        x += hash(vec2(i, floor(vUv.y * 10.0))) * 0.05;
                        ray += smoothstep(0.4, 0.5, 1.0 - abs(x - 0.5 - (i - 4.0) * 0.05)) * (1.0 - vUv.y);
                    }
                    ray *= 0.15;
                    vec3 color = vec3(0.8, 0.9, 1.0) * ray;
                    gl_FragColor = vec4(color, ray * 0.3);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const godRays = new THREE.Mesh(godRayGeometry, godRayMaterial);
        godRays.position.set(0, 50, -50);
        godRays.rotation.x = -Math.PI / 3;
        scene.add(godRays);

        // Bubble particle system
        const bubbleCount = 500;
        const bubbleGeometry = new THREE.BufferGeometry();
        const bubblePositions = new Float32Array(bubbleCount * 3);
        const bubbleSizes = new Float32Array(bubbleCount);
        const bubbleSpeeds = new Float32Array(bubbleCount);

        for (let i = 0; i < bubbleCount; i++) {
            bubblePositions[i * 3] = (Math.random() - 0.5) * 100;
            bubblePositions[i * 3 + 1] = Math.random() * 50;
            bubblePositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
            bubbleSizes[i] = Math.random() * 0.5 + 0.1;
            bubbleSpeeds[i] = Math.random() * 0.02 + 0.01;
        }

        bubbleGeometry.setAttribute('position', new THREE.BufferAttribute(bubblePositions, 3));
        bubbleGeometry.setAttribute('size', new THREE.BufferAttribute(bubbleSizes, 1));

        const bubbleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uSpeeds: { value: bubbleSpeeds }
            },
            vertexShader: `
                attribute float size;
                varying float vAlpha;
                uniform float uTime;

                void main() {
                    vAlpha = 0.3 + size * 0.4;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = (1.0 - dist * 2.0) * vAlpha;
                    float rim = smoothstep(0.3, 0.5, dist);
                    vec3 color = vec3(0.8, 0.9, 1.0);
                    color += rim * 0.3;
                    gl_FragColor = vec4(color, alpha * 0.5);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const bubbles = new THREE.Points(bubbleGeometry, bubbleMaterial);
        scene.add(bubbles);

        // Helper function for materials
        function createMaterial(color, roughness = 0.7, metalness = 0.1) {
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: roughness,
                metalness: metalness
            });
        }

        // Group for all buildings
        const buildings = new THREE.Group();
        scene.add(buildings);

        // ===== SPONGEBOB'S PINEAPPLE HOUSE =====
        function createPineappleHouse() {
            const pineapple = new THREE.Group();

            // Main pineapple body
            const bodyGeometry = new THREE.SphereGeometry(4, 32, 32);
            bodyGeometry.scale(1, 1.5, 1);
            const bodyMaterial = createMaterial(0xFFA500, 0.6);
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 5;
            body.castShadow = true;
            pineapple.add(body);

            // Pineapple texture pattern (diamond shapes) - vibrant orange
            const patternGeometry = new THREE.SphereGeometry(4.05, 32, 32);
            patternGeometry.scale(1, 1.5, 1);
            const patternMaterial = new THREE.ShaderMaterial({
                uniforms: {},
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        vUv = uv;
                        vNormal = normal;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    void main() {
                        vec2 grid = fract(vUv * vec2(10.0, 14.0));
                        float d = min(min(grid.x, 1.0 - grid.x), min(grid.y, 1.0 - grid.y));
                        float line = smoothstep(0.0, 0.15, d);

                        // Base orange with darker diamond pattern
                        vec3 baseColor = vec3(1.0, 0.55, 0.0);
                        vec3 darkColor = vec3(0.85, 0.4, 0.0);
                        vec3 color = mix(darkColor, baseColor, line);

                        // Add some variation
                        color *= 0.9 + 0.1 * sin(vUv.y * 50.0);

                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
            const pattern = new THREE.Mesh(patternGeometry, patternMaterial);
            pattern.position.y = 5;
            pineapple.add(pattern);

            // Leaves on top - vibrant green
            for (let i = 0; i < 12; i++) {
                const leafGeometry = new THREE.ConeGeometry(0.4, 3 + Math.random(), 8);
                const leafMaterial = createMaterial(i % 2 === 0 ? 0x32CD32 : 0x228B22, 0.5);
                const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
                const angle = (i / 12) * Math.PI * 2;
                const radius = i < 4 ? 0 : 1.5;
                leaf.position.set(
                    Math.cos(angle) * radius,
                    10.5 + (i < 4 ? 1 : -0.5),
                    Math.sin(angle) * radius
                );
                leaf.rotation.x = i < 4 ? 0 : 0.6;
                leaf.rotation.z = i < 4 ? 0 : Math.cos(angle);
                leaf.castShadow = true;
                pineapple.add(leaf);
            }

            // Door - warm brown
            const doorGeometry = new THREE.CylinderGeometry(0.8, 1.2, 2.5, 16);
            const doorMaterial = createMaterial(0x8B4513);
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(0, 1.5, 3.5);
            door.rotation.x = Math.PI / 2;
            door.castShadow = true;
            pineapple.add(door);

            // Door frame
            const frameGeometry = new THREE.TorusGeometry(1, 0.15, 8, 16, Math.PI);
            const frameMaterial = createMaterial(0x654321);
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.set(0, 2.7, 3.6);
            frame.rotation.z = Math.PI;
            pineapple.add(frame);

            // Windows
            const createWindow = (x, y, z, rotY = 0) => {
                const windowGroup = new THREE.Group();

                const frameGeom = new THREE.BoxGeometry(1.5, 1.5, 0.2);
                const frameMat = createMaterial(0x8b4513);
                const windowFrame = new THREE.Mesh(frameGeom, frameMat);
                windowGroup.add(windowFrame);

                const glassGeom = new THREE.CircleGeometry(0.5, 16);
                const glassMat = new THREE.MeshStandardMaterial({
                    color: 0xffffaa,
                    emissive: 0xffdd88,
                    emissiveIntensity: 0.5
                });
                const glass = new THREE.Mesh(glassGeom, glassMat);
                glass.position.z = 0.15;
                windowGroup.add(glass);

                // Cross bars
                const barGeom = new THREE.BoxGeometry(1.4, 0.1, 0.25);
                const bar1 = new THREE.Mesh(barGeom, frameMat);
                const bar2 = new THREE.Mesh(barGeom, frameMat);
                bar2.rotation.z = Math.PI / 2;
                windowGroup.add(bar1, bar2);

                windowGroup.position.set(x, y, z);
                windowGroup.rotation.y = rotY;

                // Point light inside
                const light = new THREE.PointLight(0xffdd88, 0.5, 8);
                light.position.z = 0.5;
                windowGroup.add(light);

                return windowGroup;
            };

            pineapple.add(createWindow(2.5, 6, 3, 0.3));
            pineapple.add(createWindow(-2.5, 6, 3, -0.3));

            // Chimney
            const chimneyGeometry = new THREE.CylinderGeometry(0.4, 0.5, 2, 16);
            const chimneyMaterial = createMaterial(0x654321);
            const chimney = new THREE.Mesh(chimneyGeometry, chimneyMaterial);
            chimney.position.set(2, 10, 0);
            chimney.castShadow = true;
            pineapple.add(chimney);

            pineapple.position.set(-12, 0, 0);
            return pineapple;
        }

        // ===== SQUIDWARD'S EASTER ISLAND HOUSE =====
        function createSquidwardHouse() {
            const house = new THREE.Group();

            // Main head shape - bluish gray
            const headGeometry = new THREE.CylinderGeometry(2.5, 3.5, 8, 8);
            const headMaterial = createMaterial(0x5F9EA0, 0.8);
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 5;
            head.castShadow = true;
            house.add(head);

            // Top of head (more rounded)
            const topGeometry = new THREE.SphereGeometry(2.5, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const top = new THREE.Mesh(topGeometry, headMaterial);
            top.position.y = 9;
            top.castShadow = true;
            house.add(top);

            // Nose
            const noseGeometry = new THREE.CylinderGeometry(0.3, 0.6, 2.5, 8);
            const nose = new THREE.Mesh(noseGeometry, headMaterial);
            nose.position.set(0, 5.5, 3.2);
            nose.rotation.x = Math.PI / 2;
            nose.castShadow = true;
            house.add(nose);

            // Eyes (windows) - bright glow
            const eyeGeometry = new THREE.SphereGeometry(0.8, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({
                color: 0xFFFFE0,
                emissive: 0xFFD700,
                emissiveIntensity: 0.8
            });

            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-1.2, 6.5, 2.8);
            house.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(1.2, 6.5, 2.8);
            house.add(rightEye);

            // Eye lights - stronger
            const leftLight = new THREE.PointLight(0xFFD700, 1, 8);
            leftLight.position.set(-1.2, 6.5, 3.5);
            house.add(leftLight);

            const rightLight = new THREE.PointLight(0xFFD700, 1, 8);
            rightLight.position.set(1.2, 6.5, 3.5);
            house.add(rightLight);

            // Mouth (door)
            const doorGeometry = new THREE.BoxGeometry(1.2, 2.5, 0.3);
            const doorMaterial = createMaterial(0x4a5568);
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(0, 2, 3);
            door.castShadow = true;
            house.add(door);

            // Ears
            const earGeometry = new THREE.ConeGeometry(0.8, 2, 8);
            const leftEar = new THREE.Mesh(earGeometry, headMaterial);
            leftEar.position.set(-3.3, 5, 0);
            leftEar.rotation.z = -Math.PI / 2;
            leftEar.castShadow = true;
            house.add(leftEar);

            const rightEar = new THREE.Mesh(earGeometry, headMaterial);
            rightEar.position.set(3.3, 5, 0);
            rightEar.rotation.z = Math.PI / 2;
            rightEar.castShadow = true;
            house.add(rightEar);

            house.position.set(0, 0, 0);
            return house;
        }

        // ===== PATRICK'S ROCK =====
        function createPatrickRock() {
            const rock = new THREE.Group();

            // Main rock dome - brown/tan color
            const domeGeometry = new THREE.SphereGeometry(3.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const rockMaterial = createMaterial(0xA0522D, 0.9);
            const dome = new THREE.Mesh(domeGeometry, rockMaterial);
            dome.position.y = 0.5;
            dome.scale.y = 0.6;
            dome.castShadow = true;
            rock.add(dome);

            // Rock texture bumps
            for (let i = 0; i < 12; i++) {
                const bumpGeometry = new THREE.SphereGeometry(0.3 + Math.random() * 0.4, 8, 8);
                const bump = new THREE.Mesh(bumpGeometry, rockMaterial);
                const angle = (i / 12) * Math.PI * 2;
                const radius = 2 + Math.random();
                bump.position.set(
                    Math.cos(angle) * radius,
                    0.5 + Math.random() * 1.5,
                    Math.sin(angle) * radius
                );
                bump.scale.y = 0.5;
                bump.castShadow = true;
                rock.add(bump);
            }

            // Door crack
            const crackGeometry = new THREE.BoxGeometry(0.1, 1.5, 0.1);
            const crackMaterial = createMaterial(0x4a3728);
            const crack = new THREE.Mesh(crackGeometry, crackMaterial);
            crack.position.set(0, 0.75, 3.3);
            rock.add(crack);

            rock.position.set(12, 0, 0);
            return rock;
        }

        // ===== KRUSTY KRAB =====
        function createKrustyKrab() {
            const krusty = new THREE.Group();

            // Main building (barrel shape)
            const barrelGeometry = new THREE.CylinderGeometry(4, 4, 6, 16);
            const barrelMaterial = createMaterial(0x8b4513, 0.7);
            const barrel = new THREE.Mesh(barrelGeometry, barrelMaterial);
            barrel.position.y = 3.5;
            barrel.rotation.z = Math.PI / 2;
            barrel.castShadow = true;
            krusty.add(barrel);

            // Front wall
            const wallGeometry = new THREE.BoxGeometry(0.5, 6, 8);
            const wallMaterial = createMaterial(0xa0522d, 0.8);
            const frontWall = new THREE.Mesh(wallGeometry, wallMaterial);
            frontWall.position.set(4, 3.5, 0);
            frontWall.castShadow = true;
            krusty.add(frontWall);

            // Roof
            const roofGeometry = new THREE.ConeGeometry(5, 3, 16);
            const roofMaterial = createMaterial(0x654321);
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.set(0, 6.5, 0);
            roof.rotation.z = Math.PI / 2;
            roof.castShadow = true;
            krusty.add(roof);

            // Door
            const doorGeometry = new THREE.BoxGeometry(0.3, 3.5, 1.5);
            const doorMaterial = createMaterial(0x4a3520);
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(4.3, 2, 0);
            krusty.add(door);

            // Sign
            const signPost = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 4, 8),
                createMaterial(0x654321)
            );
            signPost.position.set(6, 3, 0);
            krusty.add(signPost);

            const signBoard = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, 1.5, 0.2),
                createMaterial(0xff6347)
            );
            signBoard.position.set(6, 5.5, 0);
            krusty.add(signBoard);

            // Anchor
            const anchorGroup = new THREE.Group();
            const anchorShaft = new THREE.Mesh(

        // ===== JELLYFISH =====
        function createJellyfish(x, z) {
            const jelly = new THREE.Group();

            // Bell
            const bellGeom = new THREE.SphereGeometry(0.8, 16, 16);
            bellGeom.scale(1, 0.6, 1);
            const bellMat = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                transparent: true,
                opacity: 0.7,
                roughness: 0.3
            });
            const bell = new THREE.Mesh(bellGeom, bellMat);
            jelly.add(bell);

            // Spots
            const spotMat = new THREE.MeshStandardMaterial({
                color: 0xff1493,
                transparent: true,
                opacity: 0.8
            });
            for (let i = 0; i < 6; i++) {
                const spot = new THREE.Mesh(
                    new THREE.CircleGeometry(0.1 + Math.random() * 0.1, 8),
                    spotMat
                );
                const angle = (i / 6) * Math.PI * 2;
                spot.position.set(
                    Math.cos(angle) * 0.5,
                    0.1 + Math.random() * 0.1,
                    Math.sin(angle) * 0.5
                );
                spot.rotation.x = -Math.PI / 3;
                jelly.add(spot);
            }

            // Tentacles
            const tentacleMat = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                transparent: true,
                opacity: 0.6
            });

            for (let i = 0; i < 4; i++) {
                const tentacle = new THREE.Group();
                const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;

                for (let j = 0; j < 5; j++) {
                    const segment = new THREE.Mesh(
                        new THREE.SphereGeometry(0.05, 8, 8),
                        tentacleMat
                    );
                    segment.position.y = -j * 0.15;
                    tentacle.add(segment);
                }

                tentacle.position.set(
                    Math.cos(angle) * 0.4,
                    -0.3,
                    Math.sin(angle) * 0.4
                );
                jelly.add(tentacle);
                jelly.userData.tentacles = jelly.userData.tentacles || [];
                jelly.userData.tentacles.push(tentacle);
            }

            jelly.position.set(x, 10 + Math.random() * 5, z);
            jelly.userData.startY = jelly.position.y;
            jelly.userData.offset = Math.random() * Math.PI * 2;

            return jelly;
        }

            },
            vertexShader: `
                uniform float uTime;
                varying vec2 vUv;
                varying float vHeight;

                void main() {
                    vUv = uv;
                    vHeight = position.y;

                    vec3 pos = position;
                    float wave = sin(uTime * 2.0 + position.y * 3.0) * 0.1 * position.y;
                    pos.x += wave;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying vec2 vUv;
                varying float vHeight;

                void main() {
                    vec3 color = uColor * (0.7 + vHeight * 0.3);
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        for (let i = 0; i < 15; i++) {
            const seaweed = new THREE.Mesh(
                new THREE.PlaneGeometry(0.5, 3 + Math.random() * 2, 1, 20),
                seaweedMaterial.clone()
            );
            seaweed.position.set(
                (Math.random() - 0.5) * 50,
                1.5,
                (Math.random() - 0.5) * 50
            );
            seaweed.rotation.y = Math.random() * Math.PI;
            scene.add(seaweed);
        }

        // Rocks
        for (let i = 0; i < 15; i++) {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.5 + Math.random() * 1, 0),
                createMaterial(0x5d6d7e, 0.9)
            );
            rock.position.set(
                (Math.random() - 0.5) * 50,
                0.3,
                (Math.random() - 0.5) * 50
            );
            rock.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            rock.scale.y = 0.6;
            rock.castShadow = true;
            scene.add(rock);
        }

        // ===== POST PROCESSING =====
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3,
            0.4,
            0.85
        );
        composer.addPass(bloomPass);

        // Underwater color grading
        const underwaterShader = {
            uniforms: {
                tDiffuse: { value: null },
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv;

                    // Subtle wave distortion
                    float wave = sin(uv.y * 15.0 + uTime * 2.0) * 0.002;
                    wave += cos(uv.x * 12.0 + uTime * 1.5) * 0.002;
                    uv += wave;

                    vec4 color = texture2D(tDiffuse, uv);

                    // Vibrant underwater color grading
                    float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));

                    // Boost saturation
                    vec3 gray = vec3(lum);
                    color.rgb = mix(gray, color.rgb, 1.3);

                    // Underwater color shift
                    color.r *= 0.95;
                    color.g *= 1.05;
                    color.b *= 1.15;

                    // Contrast boost
                    color.rgb = (color.rgb - 0.5) * 1.1 + 0.5;

                    // Subtle vignette
                    float vignette = 1.0 - length((vUv - 0.5) * 1.3) * 0.25;
                    vignette = smoothstep(0.0, 1.0, vignette);
                    color.rgb *= vignette;

                    // Color fade at edges
                    color.rgb = mix(color.rgb, vec3(0.0, 0.4, 0.6), (1.0 - vignette) * 0.3);

                    gl_FragColor = color;
                }
            `
        };

        const underwaterPass = new ShaderPass(underwaterShader);
        composer.addPass(underwaterPass);

        // ===== ANIMATION =====
        const clock = new THREE.Clock();
        let lastInteraction = 0;

        controls.addEventListener('start', () => {
            controls.autoRotate = false;
            lastInteraction = clock.getElapsedTime();
        });

        controls.addEventListener('end', () => {
            lastInteraction = clock.getElapsedTime();
        });

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Update shader uniforms
            floorMaterial.uniforms.uTime.value = time;
            godRayMaterial.uniforms.uTime.value = time;
            bubbleMaterial.uniforms.uTime.value = time;
            underwaterPass.uniforms.uTime.value = time;

            // Animate caustic lights
            causticLights.forEach((light) => {
                light.position.x = light.userData.baseX + Math.sin(time * light.userData.speed + light.userData.offset) * 5;
                light.position.z = light.userData.baseZ + Math.cos(time * light.userData.speed * 0.7 + light.userData.offset) * 5;
            });

            // Update seaweed
            scene.traverse((obj) => {
                if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
                    obj.material.uniforms.uTime.value = time;
                }
            });

            // Animate bubbles
            const positions = bubbleGeometry.attributes.position.array;
            for (let i = 0; i < bubbleCount; i++) {
                positions[i * 3 + 1] += bubbleSpeeds[i];
                if (positions[i * 3 + 1] > 50) {
                    positions[i * 3 + 1] = 0;
                    positions[i * 3] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
                }
            }
            bubbleGeometry.attributes.position.needsUpdate = true;

            // Animate SpongeBob (breathing)
            spongebob.scale.y = 1 + Math.sin(time * 2) * 0.02;
            spongebob.position.y = Math.sin(time * 2) * 0.05;

            // Animate Patrick (swaying)
            patrick.rotation.z = Math.sin(time * 0.5) * 0.05;

            // Animate Squidward (annoyed head shake)
            squidward.rotation.y = -0.5 + Math.sin(time * 0.3) * 0.1;

            // Animate Gary (crawl)
            gary.position.x = -8 + Math.sin(time * 0.2) * 0.5;
            gary.position.z = 5 + Math.cos(time * 0.2) * 0.3;

            // Animate jellyfish
            jellyfish.forEach((jelly, i) => {
                jelly.position.y = jelly.userData.startY + Math.sin(time + jelly.userData.offset) * 1;
                jelly.position.x += Math.sin(time * 0.3 + jelly.userData.offset) * 0.01;
                jelly.rotation.y += 0.005;

                // Animate tentacles
                if (jelly.userData.tentacles) {
                    jelly.userData.tentacles.forEach((tent, j) => {
                        tent.rotation.x = Math.sin(time * 2 + j) * 0.2;
                    });
                }
            });

            // Auto-rotate after inactivity
            if (clock.getElapsedTime() - lastInteraction > 5) {
                controls.autoRotate = true;
            }

            controls.update();
            composer.render();
        }

        // Hide loading screen
        document.getElementById('loading').classList.add('hidden');

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
