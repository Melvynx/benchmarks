<html lang="en">

<body>
<div class="model-label">Codex 5.3</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const fract = (x) => x - Math.floor(x);
const IS_LOW_END = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 4);

function makeSandTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");

  g.fillStyle = "#c6b06f";
  g.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 46000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const s = Math.random() * 2.1;
    const v = 175 + Math.floor(Math.random() * 70);
    g.fillStyle = `rgba(${v},${v - 8},${v - 38},${0.04 + Math.random() * 0.09})`;
    g.fillRect(x, y, s, s);
  }

  g.strokeStyle = "rgba(255,255,255,0.04)";
  g.lineWidth = 1;
  for (let i = 0; i < 60; i++) {
    const y = i * 8 + Math.random() * 6;
    g.beginPath();
    for (let x = 0; x <= 512; x += 16) {
      g.lineTo(x, y + Math.sin(x * 0.03 + i) * 2.2);
    }
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeLeafTexture() {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 256;
  const g = c.getContext("2d");

  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#8ee35e");
  grad.addColorStop(0.5, "#4faa33");
  grad.addColorStop(1, "#2e6d20");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 256);

  g.strokeStyle = "rgba(255,255,255,0.18)";
  g.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    g.beginPath();
    g.moveTo(0, i * 18 + 4);
    g.quadraticCurveTo(64, i * 18 + rand(-6, 6), 128, i * 18 + 10);
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeWoodTexture() {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 256;
  const g = c.getContext("2d");

  const grad = g.createLinearGradient(0, 0, 256, 0);
  grad.addColorStop(0, "#9a6333");
  grad.addColorStop(0.5, "#7f4f27");
  grad.addColorStop(1, "#6a3f1f");
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 120; i++) {
    g.strokeStyle = `rgba(40,20,8,${0.05 + Math.random() * 0.14})`;
    g.lineWidth = 1 + Math.random() * 3;
    const y = Math.random() * 256;
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(80, y + rand(-10, 10), 160, y + rand(-10, 10), 256, y + rand(-6, 6));
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBubbleTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");

  const grad = g.createRadialGradient(64, 64, 14, 64, 64, 56);
  grad.addColorStop(0, "rgba(220,245,255,0.78)");
  grad.addColorStop(0.55, "rgba(160,220,255,0.22)");
  grad.addColorStop(1, "rgba(120,190,255,0.0)");
  g.fillStyle = grad;
  g.beginPath();
  g.arc(64, 64, 56, 0, TAU);
  g.fill();

  g.fillStyle = "rgba(255,255,255,0.5)";
  g.beginPath();
  g.arc(46, 44, 14, 0, TAU);
  g.fill();

  return new THREE.CanvasTexture(c);
}

function makeKrustySignTexture() {
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 256;
  const g = c.getContext("2d");

  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#8a562d");
  grad.addColorStop(1, "#6b3f22");
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 256);

  g.strokeStyle = "rgba(35,18,8,0.7)";
  g.lineWidth = 12;
  g.strokeRect(8, 8, 496, 240);

  g.fillStyle = "#f8db9f";
  g.font = "bold 72px Georgia, serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("THE KRUSTY KRAB", 256, 128);

  g.strokeStyle = "rgba(255,255,255,0.14)";
  g.lineWidth = 4;
  g.beginPath();
  g.moveTo(38, 36);
  g.lineTo(474, 36);
  g.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function hash2(x, z) {
  return fract(Math.sin(x * 127.1 + z * 311.7) * 43758.5453123);
}

function smooth01(t) {
  return t * t * (3 - 2 * t);
}

function valueNoise(x, z) {
  const xi = Math.floor(x);
  const zi = Math.floor(z);
  const xf = x - xi;
  const zf = z - zi;

  const h00 = hash2(xi, zi);
  const h10 = hash2(xi + 1, zi);
  const h01 = hash2(xi, zi + 1);
  const h11 = hash2(xi + 1, zi + 1);

  const u = smooth01(xf);
  const v = smooth01(zf);

  const nx0 = THREE.MathUtils.lerp(h00, h10, u);
  const nx1 = THREE.MathUtils.lerp(h01, h11, u);
  return THREE.MathUtils.lerp(nx0, nx1, v);
}

function fbm(x, z) {
  let value = 0;
  let amp = 0.5;
  let freq = 1;
  for (let i = 0; i < 5; i++) {
    value += amp * valueNoise(x * freq, z * freq);
    freq *= 2;
    amp *= 0.5;
  }
  return value;
}

function terrainHeight(x, z) {
  const broad = (fbm(x * 0.035, z * 0.035) - 0.5) * 5.0;
  const detail = (fbm(x * 0.11 + 48, z * 0.11 - 36) - 0.5) * 1.0;
  const bowl = -Math.hypot(x, z) * 0.0085;
  return broad + detail + bowl;
}

const sandTex = makeSandTexture();
const leafTex = makeLeafTexture();
const woodTex = makeWoodTexture();
const bubbleTex = makeBubbleTexture();
const krustySignTex = makeKrustySignTexture();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06294a);
scene.fog = new THREE.FogExp2(0x0a3c63, 0.02);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 350);
camera.position.set(23, 14, 25);

const renderer = new THREE.WebGLRenderer({ antialias: !IS_LOW_END, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_LOW_END ? 1 : 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 10;
controls.maxDistance = 72;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(2, 3, 0.5);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

let autoRotateTimer;
function onUserInput() {
  controls.autoRotate = false;
  clearTimeout(autoRotateTimer);
  autoRotateTimer = setTimeout(() => {
    controls.autoRotate = true;
  }, 4000);
}
controls.addEventListener("start", onUserInput);
window.addEventListener("pointerdown", onUserInput, { passive: true });
window.addEventListener("wheel", onUserInput, { passive: true });

const hemi = new THREE.HemisphereLight(0x63bfd8, 0x1f4856, 0.43);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x2f7f8f, 0.58);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffefc2, 1.35);
sun.position.set(22, 32, 14);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x79b8da, 0.35);
fill.position.set(-18, 12, -12);
scene.add(fill);

const floorGeo = new THREE.PlaneGeometry(220, 220, 140, 140);
const floorPos = floorGeo.attributes.position;
for (let i = 0; i < floorPos.count; i++) {
  const x = floorPos.getX(i);
  const z = floorPos.getY(i);
  floorPos.setZ(i, terrainHeight(x, z));
}
floorGeo.computeVertexNormals();
floorGeo.rotateX(-Math.PI / 2);

const floorCausticUniform = { value: 0 };
const floorMat = new THREE.MeshStandardMaterial({
  color: 0xd0ba75,
  map: sandTex,
  roughness: 0.96,
  metalness: 0
});

floorMat.onBeforeCompile = (shader) => {
  shader.uniforms.uCausticTime = floorCausticUniform;

  shader.vertexShader = shader.vertexShader
    .replace(
      "#include <common>",
      `#include <common>
       varying vec3 vWorldPos;`
    )
    .replace(
      "#include <worldpos_vertex>",
      `#include <worldpos_vertex>
       vWorldPos = worldPosition.xyz;`
    );

  shader.fragmentShader = shader.fragmentShader
    .replace(
      "#include <common>",
      `#include <common>
       uniform float uCausticTime;
       varying vec3 vWorldPos;`
    )
    .replace(
      "#include <dithering_fragment>",
      `
      float c1 = sin(vWorldPos.x * 2.25 + uCausticTime * 1.65) * sin(vWorldPos.z * 2.05 - uCausticTime * 1.2);
      float c2 = sin((vWorldPos.x + vWorldPos.z) * 3.85 - uCausticTime * 2.15);
      float caustic = smoothstep(0.25, 0.97, 0.5 + 0.5 * (c1 * 0.75 + c2 * 0.25));
      outgoingLight += vec3(0.09, 0.20, 0.25) * caustic * 0.55;
      #include <dithering_fragment>`
    );

  floorMat.userData.shader = shader;
};

const floor = new THREE.Mesh(floorGeo, floorMat);
floor.receiveShadow = true;
scene.add(floor);

const streetTex = sandTex.clone();
streetTex.wrapS = streetTex.wrapT = THREE.RepeatWrapping;
streetTex.repeat.set(4, 0.8);
streetTex.needsUpdate = true;

const streetCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-14, terrainHeight(-14, -4) + 0.06, -4),
  new THREE.Vector3(-7, terrainHeight(-7, 3) + 0.06, 3),
  new THREE.Vector3(3, terrainHeight(3, -3) + 0.06, -3),
  new THREE.Vector3(10, terrainHeight(10, 2) + 0.06, 2),
  new THREE.Vector3(17, terrainHeight(17, 6) + 0.06, 6)
]);

const street = new THREE.Mesh(
  new THREE.TubeGeometry(streetCurve, 180, 0.8, 16, false),
  new THREE.MeshStandardMaterial({
    color: 0xe1cd92,
    map: streetTex,
    roughness: 1.0,
    metalness: 0
  })
);
street.receiveShadow = true;
scene.add(street);

const domeUniforms = { uTime: { value: 0 } };
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(180, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: domeUniforms,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vWorld;
      void main() {
        float h = clamp(normalize(vWorld).y * 0.5 + 0.5, 0.0, 1.0);
        float wave = sin((vWorld.x + vWorld.z) * 0.035 + uTime * 0.22) * 0.03;
        vec3 top = vec3(0.09, 0.40, 0.60);
        vec3 mid = vec3(0.04, 0.19, 0.34);
        vec3 deep = vec3(0.008, 0.05, 0.12);
        vec3 col = mix(deep, mid, pow(h, 1.3));
        col = mix(col, top, smoothstep(0.52, 1.0, h));
        col += wave;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
);
scene.add(dome);

const surfaceUniforms = { uTime: { value: 0 } };
const surface = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240, 1, 1),
  new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: surfaceUniforms,
    vertexShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 p = position;
        p.z += sin((p.x + uTime * 6.0) * 0.05) * 0.24 + cos((p.y - uTime * 4.0) * 0.06) * 0.2;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      void main() {
        float rip = sin(vUv.x * 150.0) * sin(vUv.y * 120.0);
        float shimmer = smoothstep(0.25, 1.0, 0.5 + 0.5 * rip);
        vec3 col = vec3(0.45, 0.85, 1.0);
        float a = 0.055 + shimmer * 0.03;
        gl_FragColor = vec4(col, a);
      }
    `
  })
);
surface.rotation.x = -Math.PI / 2;
surface.position.y = 28;
scene.add(surface);

const godRayMaterials = [];
for (let i = 0; i < 7; i++) {
  const phase = rand(0, TAU);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uPhase: { value: phase }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uPhase;
      varying vec2 vUv;
      void main() {
        float radial = 1.0 - abs(vUv.x - 0.5) * 2.0;
        radial = pow(max(radial, 0.0), 1.9);
        float fade = smoothstep(1.0, 0.1, vUv.y);
        float shimmer = 0.65 + 0.35 * sin(uTime * 0.85 + uPhase + vUv.y * 20.0);
        float alpha = radial * fade * shimmer * 0.11;
        gl_FragColor = vec4(0.60, 0.88, 1.0, alpha);
      }
    `
  });

  const ray = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2 * rand(0.8, 1.2), 2.5 * rand(0.8, 1.3), 28, 16, 1, true),
    mat
  );
  ray.position.set(rand(-26, 26), rand(12, 16), rand(-26, 26));
  ray.rotation.z = rand(-0.25, 0.25);
  ray.rotation.x = rand(-0.18, 0.18);
  scene.add(ray);
  godRayMaterials.push(mat);
}

function placeOnTerrain(obj, x, z, offset = 0) {
  const y = terrainHeight(x, z) + offset;
  obj.position.set(x, y, z);
  return y;
}

function enableShadows(root, cast = true, receive = true) {
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = cast;
      o.receiveShadow = receive;
    }
  });
}

const seaweedAnim = [];

function createSeaweedCluster(x, z, scale = 1) {
  const group = new THREE.Group();
  const y = terrainHeight(x, z);
  group.position.set(x, y, z);

  const stalkCount = Math.floor(rand(3, 7));
  for (let i = 0; i < stalkCount; i++) {
    const h = rand(2.2, 4.8) * scale;
    const stalkRoot = new THREE.Group();
    stalkRoot.position.set(rand(-0.9, 0.9), 0, rand(-0.9, 0.9));

    const geo = new THREE.CylinderGeometry(0.05 * scale, 0.13 * scale, h, 8, 18);
    const p = geo.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const vy = p.getY(k) + h * 0.5;
      const bend = Math.pow(vy / h, 2.1) * rand(0.22, 0.5);
      p.setX(k, p.getX(k) + bend);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(rand(0.28, 0.36), 0.52, rand(0.24, 0.38)),
      roughness: 0.72,
      metalness: 0.02
    });

    const stalk = new THREE.Mesh(geo, mat);
    stalk.position.y = h * 0.5;
    stalkRoot.add(stalk);
    group.add(stalkRoot);

    seaweedAnim.push({
      obj: stalkRoot,
      amp: rand(0.09, 0.24),
      phase: rand(0, TAU),
      speed: rand(0.8, 1.5)
    });
  }

  enableShadows(group, true, false);
  scene.add(group);
}

const coralPalette = [0xf06b9d, 0xff9c74, 0xff6f61, 0xd95bff, 0xffc06e];

function createCoralCluster(x, z, scale = 1) {
  const group = new THREE.Group();
  const y = terrainHeight(x, z);
  group.position.set(x, y, z);

  const branches = Math.floor(rand(4, 8));
  for (let i = 0; i < branches; i++) {
    const color = coralPalette[Math.floor(Math.random() * coralPalette.length)];
    const mat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.6,
      metalness: 0.03
    });

    const h = rand(0.6, 1.6) * scale;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.07 * scale, 0.11 * scale, h, 8), mat);
    stem.position.set(rand(-0.7, 0.7), h * 0.5, rand(-0.7, 0.7));
    stem.rotation.x = rand(-0.35, 0.35);
    stem.rotation.z = rand(-0.35, 0.35);
    group.add(stem);

    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.14 * scale, 12, 10), mat);
    tip.position.copy(stem.position).add(new THREE.Vector3(0, h * 0.48, 0));
    group.add(tip);
  }

  enableShadows(group, true, false);
  scene.add(group);
}

function createRock(scale = 1, color = 0x72695c) {
  const geo = new THREE.DodecahedronGeometry(1 * scale, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const n = rand(-0.14, 0.14) * scale;
    p.setXYZ(i, p.getX(i) + n, p.getY(i) + n * 0.6, p.getZ(i) + n);
  }
  geo.computeVertexNormals();

  return new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      color,
      roughness: 0.96,
      metalness: 0.02
    })
  );
}

const landmarks = [
  new THREE.Vector2(-10, -2),
  new THREE.Vector2(-2, 4),
  new THREE.Vector2(6, -3),
  new THREE.Vector2(14, 5)
];

for (let i = 0; i < 90; i++) {
  const x = rand(-95, 95);
  const z = rand(-95, 95);
  if (Math.hypot(x, z) < 9) continue;

  let near = false;
  for (const p of landmarks) {
    if (Math.hypot(x - p.x, z - p.y) < 6) {
      near = true;
      break;
    }
  }
  if (near) continue;

  const r = Math.random();
  if (r < 0.3) createSeaweedCluster(x, z, rand(0.75, 1.2));
  else if (r < 0.66) createCoralCluster(x, z, rand(0.8, 1.3));
  else {
    const rock = createRock(rand(0.2, 1.0), 0x6f675d);
    placeOnTerrain(rock, x, z, rand(0.01, 0.06));
    rock.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    rock.castShadow = true;
    rock.receiveShadow = false;
    scene.add(rock);
  }
}

for (let i = 0; i < 18; i++) {
  const a = (i / 34) * TAU;
  const r = rand(70, 95);
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;
  const rock = createRock(rand(1.8, 3.5), 0x264154);
  placeOnTerrain(rock, x, z, 0.6);
  rock.scale.y *= rand(1.4, 2.3);
  scene.add(rock);
}

function createPineappleHouse() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xe08c33,
    roughness: 0.78,
    metalness: 0.03
  });

  const body = new THREE.Mesh(new THREE.SphereGeometry(3.1, 40, 30), bodyMat);
  body.scale.y = 1.28;
  body.position.y = 3.95;
  g.add(body);

  const grooveMat = new THREE.MeshStandardMaterial({ color: 0xae6426, roughness: 0.95 });
  for (let i = 0; i < 12; i++) {
    const rod1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 8.2, 6), grooveMat);
    rod1.position.y = 3.95;
    rod1.rotation.z = 0.63;
    rod1.rotation.y = (i / 12) * TAU;
    g.add(rod1);

    const rod2 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 8.2, 6), grooveMat);
    rod2.position.y = 3.95;
    rod2.rotation.z = -0.63;

  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(0.9 * scale, 24, 16, 0, TAU, 0, Math.PI * 0.58),
    new THREE.MeshPhysicalMaterial({
      color: 0xff8fc3,
      roughness: 0.18,
      metalness: 0,
      transparent: true,
      opacity: 0.62,
      transmission: 0.12,
      thickness: 0.5
    })
  );
  cap.position.y = 0.4 * scale;
  group.add(cap);

  const skirt = new THREE.Mesh(
    new THREE.TorusGeometry(0.58 * scale, 0.08 * scale, 8, 22),
    new THREE.MeshStandardMaterial({
      color: 0xff9fcc,
      emissive: 0xff6cae,
      emissiveIntensity: 0.25,
      transparent: true,
      opacity: 0.65
    })
  );
  skirt.rotation.x = Math.PI * 0.5;
  skirt.position.y = 0.15 * scale;
  group.add(skirt);

  const tentMat = new THREE.MeshStandardMaterial({
    color: 0xffb5d8,
    transparent: true,
    opacity: 0.52,
    roughness: 0.25
  });

  const count = 8;
  for (let i = 0; i < count; i++) {
    const h = rand(0.9, 1.5) * scale;
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.03 * scale, 0.01 * scale, h, 7), tentMat);
    const a = (i / count) * TAU;
    t.position.set(Math.cos(a) * 0.35 * scale, -h * 0.5, Math.sin(a) * 0.35 * scale);
    group.add(t);
    tentacles.push({ mesh: t, phase: rand(0, TAU), baseX: t.position.x, baseZ: t.position.z });
  }

  enableShadows(group, false, false);
  return { group, tentacles };
}

const pineapple = createPineappleHouse();
placeOnTerrain(pineapple, -10, -2, 0.05);
pineapple.rotation.y = -0.3;

const jellyfish = [];
for (let i = 0; i < 3; i++) {
  const j = createJellyfish(rand(0.85, 1.25));
  j.baseX = rand(-4, 14);
  j.baseY = rand(7.5, 11.8);
  j.baseZ = rand(-8, 8);

function createBubbleSystem(count = 160) {
  const positions = new Float32Array(count * 3);
  const speeds = new Float32Array(count);
  const phases = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const x = rand(-45, 45);
    const z = rand(-45, 45);
    positions[i * 3 + 0] = x;
    positions[i * 3 + 1] = terrainHeight(x, z) + rand(0.4, 8.0);
    positions[i * 3 + 2] = z;
    speeds[i] = rand(0.45, 1.4);
    phases[i] = rand(0, TAU);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    map: bubbleTex,
    size: 0.34,
    transparent: true,
    opacity: 0.62,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);

  return { pts, positions, speeds, phases };
}

function createPlanktonSystem(count = 800) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const phase = new Float32Array(count);
  const scale = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    pos[i * 3 + 0] = rand(-90, 90);
    pos[i * 3 + 1] = rand(-1.0, 26);
    pos[i * 3 + 2] = rand(-90, 90);
    phase[i] = Math.random();
    scale[i] = rand(1.2, 3.4);
  }

  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
  geo.setAttribute("aScale", new THREE.BufferAttribute(scale, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }
    },
    vertexShader: `
      uniform float uTime;
      attribute float aPhase;
      attribute float aScale;
      varying float vAlpha;
      void main() {
        vec3 p = position;
        p.x += sin(uTime * 0.15 + aPhase * 13.0) * 0.85;
        p.y += sin(uTime * 0.2 + aPhase * 9.0) * 0.42;
        p.z += cos(uTime * 0.18 + aPhase * 11.0) * 0.85;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aScale * (120.0 / max(12.0, -mv.z));
        vAlpha = 0.45 + 0.55 * sin(aPhase * 50.0 + uTime * 0.3);
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float a = smoothstep(0.5, 0.06, d) * vAlpha;
        gl_FragColor = vec4(0.76, 0.93, 0.84, a * 0.5);
      }
    `
  });

  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);

  return { pts, mat, pos };
}

const bubbles = createBubbleSystem(170);
const plankton = createPlanktonSystem(900);

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  const pr = Math.min(window.devicePixelRatio, IS_LOW_END ? 1 : 1.5);
  renderer.setPixelRatio(pr);
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", onResize);

let elapsed = 0;
const clock = new THREE.Clock();

function animate() {
  const dt = clock.getDelta();
  elapsed += dt;

  controls.update();

  floorCausticUniform.value = elapsed;
  domeUniforms.uTime.value = elapsed;
  surfaceUniforms.uTime.value = elapsed;
  plankton.mat.uniforms.uTime.value = elapsed;

  for (let i = 0; i < godRayMaterials.length; i++) {
    godRayMaterials[i].uniforms.uTime.value = elapsed;
  }

  for (let i = 0; i < seaweedAnim.length; i++) {
    const s = seaweedAnim[i];
    s.obj.rotation.z = Math.sin(elapsed * s.speed + s.phase) * s.amp;
    s.obj.rotation.x = Math.cos(elapsed * s.speed * 0.7 + s.phase) * s.amp * 0.32;
  }

  spongebob.group.position.y = spongeBaseY + Math.sin(elapsed * 2.25) * 0.08;
  spongebob.body.scale.y = 1.0 + Math.sin(elapsed * 2.25) * 0.03;
  spongebob.group.rotation.y = 0.4 + Math.sin(elapsed * 0.8) * 0.08;

  patrick.group.position.y = patrickBaseY + Math.sin(elapsed * 1.35 + 0.4) * 0.06;
  patrick.group.rotation.z = Math.sin(elapsed * 1.2) * 0.05;
  patrick.group.rotation.y = -0.7 + Math.sin(elapsed * 0.75) * 0.12;

  squidward.group.position.y = squidBaseY + Math.sin(elapsed * 1.8 + 2.3) * 0.04;
  squidward.headPivot.rotation.y = Math.sin(elapsed * 2.7) * 0.2;

  gary.group.position.x = garyBaseX + Math.sin(elapsed * 0.5) * 0.8;
  gary.group.position.z = garyBaseZ + Math.cos(elapsed * 0.5) * 0.35;
  gary.group.position.y = terrainHeight(gary.group.position.x, gary.group.position.z) + 0.03;
  gary.group.rotation.y = 1.15 + Math.sin(elapsed * 0.5 + Math.PI * 0.5) * 0.45;

  for (let i = 0; i < jellyfish.length; i++) {
    const j = jellyfish[i];
    j.group.position.x = j.baseX + Math.sin(elapsed * 0.35 + j.phase) * j.radius;
    j.group.position.z = j.baseZ + Math.cos(elapsed * 0.28 + j.phase * 1.2) * j.radius;
    j.group.position.y = j.baseY + Math.sin(elapsed * 1.05 + j.phase) * 0.8;
    j.group.rotation.y = elapsed * 0.2 + j.phase;
    for (let k = 0; k < j.tentacles.length; k++) {
      const t = j.tentacles[k];
      t.mesh.position.x = t.baseX + Math.sin(elapsed * 1.8 + t.phase) * 0.05;
      t.mesh.position.z = t.baseZ + Math.cos(elapsed * 1.6 + t.phase) * 0.05;
      t.mesh.rotation.z = Math.sin(elapsed * 1.3 + t.phase) * 0.15;
    }
  }

  const bPos = bubbles.positions;
  for (let i = 0; i < bubbles.speeds.length; i++) {
    const idx = i * 3;
    bPos[idx + 1] += bubbles.speeds[i] * dt;
    bPos[idx + 0] += Math.sin(elapsed * 0.85 + bubbles.phases[i]) * 0.0024;
    bPos[idx + 2] += Math.cos(elapsed * 0.78 + bubbles.phases[i]) * 0.0024;

    if (bPos[idx + 1] > 27.5) {
      const x = rand(-46, 46);
      const z = rand(-46, 46);
      bPos[idx + 0] = x;
      bPos[idx + 1] = terrainHeight(x, z) + rand(0.25, 2.0);
      bPos[idx + 2] = z;
      bubbles.speeds[i] = rand(0.45, 1.4);
      bubbles.phases[i] = rand(0, TAU);
    }
  }
  bubbles.pts.geometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
onResize();
